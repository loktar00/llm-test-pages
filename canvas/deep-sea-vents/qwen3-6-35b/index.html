<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Sea Vents</title>
<style>
* { margin: 0; padding: 0; overflow: hidden; }
html, body { width: 100%; height: 100%; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Utility ---
function rand(a, b) { return Math.random() * (b - a) + a; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

// --- Marine Snow ---
class MarineSnow {
  constructor() { this.reset(); }
  reset() {
    this.x = rand(0, W);
    this.y = rand(-H, H);
    this.size = rand(0.5, 3);
    this.speedY = rand(0.1, 0.6);
    this.speedX = rand(-0.3, 0.3);
    this.opacity = rand(0.1, 0.5);
    this.wobbleSpeed = rand(0.005, 0.02);
    this.wobbleAmp = rand(0.3, 1.2);
    this.phase = rand(0, Math.PI * 2);
  }
  update(t) {
    this.y += this.speedY;
    this.x += this.speedX + Math.sin(this.phase + t * this.wobbleSpeed) * this.wobbleAmp * 0.3;
    if (this.y > H + 10) { this.y = -10; this.x = rand(0, W); }
    if (this.x < -10) this.x = W + 10;
    if (this.x > W + 10) this.x = -10;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,210,220,${this.opacity})`;
    ctx.fill();
  }
}

const marineSnow = [];
for (let i = 0; i < 200; i++) marineSnow.push(new MarineSnow());

// --- Vent Chimney ---
class VentChimney {
  constructor(x, baseY, height, width) {
    this.x = x; this.baseY = baseY; this.height = height; this.width = width;
    this.topY = baseY - height;
    this.particles = [];
    this.emissionRate = rand(2, 5);
  }
  emit() {
    for (let i = 0; i < this.emissionRate; i++) {
      this.particles.push({
        x: this.x + rand(-this.width * 0.4, this.width * 0.4),
        y: this.topY + rand(-5, 5),
        vx: rand(-0.8, 0.8),
        vy: rand(-2.5, -0.8),
        life: 1,
        decay: rand(0.003, 0.012),
        size: rand(3, 15),
        temp: rand(0.5, 1)
      });
    }
  }
  update() {
    this.emit();
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx + Math.sin(Date.now() * 0.001 + i) * 0.3;
      p.y += p.vy;
      p.vy *= 0.998;
      p.vx *= 0.999;
      p.life -= p.decay;
      p.size *= 1.005;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }
  draw() {
    // Draw chimney body
    ctx.beginPath();
    ctx.moveTo(this.x - this.width, this.baseY);
    ctx.lineTo(this.x - this.width * 0.6, this.topY);
    ctx.lineTo(this.x + this.width * 0.6, this.topY);
    ctx.lineTo(this.x + this.width, this.baseY);
    ctx.closePath();
    const grad = ctx.createLinearGradient(this.x, this.baseY, this.x, this.topY);
    grad.addColorStop(0, '#1a1510');
    grad.addColorStop(0.5, '#2a2018');
    grad.addColorStop(1, '#151210');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#0d0b08';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Draw particles
    for (const p of this.particles) {
      const r = lerp(40, 180, p.temp);
      const g = lerp(20, 100, p.temp);
      const b = lerp(10, 50, p.temp);
      const alpha = p.life * 0.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha})`;
      ctx.fill();
    }
  }
}

const vents = [];
function createVents() {
  vents.length = 0;
  const groundY = H * 0.88;
  vents.push(new VentChimney(W * 0.3, groundY, rand(80, 140), rand(20, 35)));
  vents.push(new VentChimney(W * 0.5, groundY, rand(100, 160), rand(25, 40)));
  vents.push(new VentChimney(W * 0.7, groundY, rand(70, 120), rand(18, 30)));
  vents.push(new VentChimney(W * 0.15, groundY, rand(50, 90), rand(15, 25)));
  vents.push(new VentChimney(W * 0.85, groundY, rand(60, 100), rand(16, 28)));
}
createVents();
window.addEventListener('resize', () => { resize(); createVents(); });

// --- Tube Worms ---
class TubeWorm {
  constructor(x, baseY) {
    this.x = x; this.baseY = baseY;
    this.height = rand(40, 100);
    this.segments = 12;
    this.phase = rand(0, Math.PI * 2);
    this.swaySpeed = rand(0.01, 0.03);
    this.swayAmp = rand(8, 20);
    this.tubeWidth = rand(3, 6);
    this.hasPlume = Math.random() > 0.4;
    this.plumeParticles = [];
  }
  update(t) {
    if (this.hasPlume) {
      if (Math.random() < 0.3) {
        const tipY = this.baseY - this.height;
        this.plumeParticles.push({
          x: this.x + rand(-3, 3), y: tipY,
          vx: rand(-0.3, 0.3), vy: rand(-1.5, -0.5),
          life: 1, decay: rand(0.01, 0.025), size: rand(2, 6)
        });
      }
      for (let i = this.plumeParticles.length - 1; i >= 0; i--) {
        const p = this.plumeParticles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.size *= 1.01;
        if (p.life <= 0) this.plumeParticles.splice(i, 1);
      }
    }
  }
  draw() {
    const sway = Math.sin(Date.now() * this.swaySpeed + this.phase) * this.swayAmp;
    // Tube body
    ctx.beginPath();
    ctx.moveTo(this.x - this.tubeWidth, this.baseY);
    const steps = this.segments;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const segSway = Math.sin(Date.now() * this.swaySpeed + this.phase + t * 2) * this.swayAmp * t;
      const px = this.x + segSway;
      const py = this.baseY - this.height * t;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(this.x + sway + this.tubeWidth * 0.5, this.baseY - this.height);
    ctx.lineTo(this.x + sway, this.baseY - this.height - 15);
    ctx.lineTo(this.x + sway - this.tubeWidth * 0.5, this.baseY - this.height);
    // Close back down
    for (let i = steps; i >= 0; i--) {
      const t = i / steps;
      const segSway = Math.sin(Date.now() * this.swaySpeed + this.phase + t * 2) * this.swayAmp * t;
      const px = this.x + segSway;
      const py = this.baseY - this.height * t;
      ctx.lineTo(px - this.tubeWidth * (1 - t * 0.3), py);
    }
    ctx.closePath();
    const grad = ctx.createLinearGradient(this.x, this.baseY, this.x, this.baseY - this.height);
    grad.addColorStop(0, '#8b2020');
    grad.addColorStop(0.6, '#c43030');
    grad.addColorStop(1, '#e85050');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#5a1515';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Red plume at tip
    for (const p of this.plumeParticles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,60,60,${p.life * 0.5})`;
      ctx.fill();
    }
  }
}

const tubeWorms = [];
function createTubeWorms() {
  tubeWorms.length = 0;
  const groundY = H * 0.88;
  for (let i = 0; i < 15; i++) {
    tubeWorms.push(new TubeWorm(rand(W * 0.05, W * 0.95), groundY + rand(-5, 10)));
  }
}
createTubeWorms();
window.addEventListener('resize', () => { resize(); createTubeWorms(); });

// --- Shrimp ---
class Shrimp {
  constructor() { this.reset(); }
  reset() {
    this.x = rand(W * 0.1, W * 0.9);
    this.y = rand(H * 0.5, H * 0.85);
    this.size = rand(4, 10);
    this.speedX = rand(-1.5, 1.5);
    this.speedY = rand(-0.5, 0.5);
    this.wanderAngle = rand(0, Math.PI * 2);
    this.wanderTimer = rand(0, 100);
    this.opacity = rand(0.4, 0.8);
    this.blinkTimer = rand(0, 200);
    this.hasEyes = Math.random() > 0.3;
  }
  update() {
    this.wanderTimer--;
    if (this.wanderTimer <= 0) {
      this.wanderAngle += rand(-1, 1);
      this.wanderTimer = rand(30, 120);
    }
    this.speedX += Math.cos(this.wanderAngle) * 0.05;
    this.speedY += Math.sin(this.wanderAngle) * 0.05;
    this.speedX *= 0.98;
    this.speedY *= 0.98;
    this.x += this.speedX;
    this.y += this.speedY;
    this.blinkTimer--;
    if (this.x < 0 || this.x > W || this.y < H * 0.3 || this.y > H * 0.95) this.reset();
  }
  draw() {
    const blink = this.blinkTimer < 5 && this.blinkTimer > 0;
    ctx.save();
    ctx.translate(this.x, this.y);
    const angle = Math.atan2(this.speedY, this.speedX);
    ctx.rotate(angle);
    // Body
    ctx.beginPath();
    ctx.ellipse(0, 0, this.size, this.size * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,200,190,${blink ? 0.1 : this.opacity})`;
    ctx.fill();
    // Tail
    ctx.beginPath();
    ctx.moveTo(-this.size, 0);
    ctx.lineTo(-this.size * 1.5, -this.size * 0.3);
    ctx.lineTo(-this.size * 1.5, this.size * 0.3);
    ctx.closePath();
    ctx.fillStyle = `rgba(200,180,170,${blink ? 0.05 : this.opacity * 0.8})`;
    ctx.fill();
    // Eyes
    if (this.hasEyes && !blink) {
      ctx.beginPath();
      ctx.arc(this.size * 0.6, -this.size * 0.15, this.size * 0.15, 0, Math.PI * 2);
      ctx.arc(this.size * 0.6, this.size * 0.15, this.size * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,200,0.8)';
      ctx.fill();
    }
    ctx.restore();
  }
}

const shrimp = [];
for (let i = 0; i < 60; i++) shrimp.push(new Shrimp());

// --- Siphonophore ---
class Siphonophore {
  constructor() { this.reset(); }
  reset() {
    this.x = -300;
    this.y = rand(H * 0.15, H * 0.5);
    this.speed = rand(0.3, 0.8);
    this.segments = [];
    const numSeg = rand(12, 25);
    for (let i = 0; i < numSeg; i++) {
      this.segments.push({
        size: lerp(4, 12, Math.sin(i / numSeg * Math.PI)),
        phase: i * 0.3,
        glow: Math.random() > 0.5
      });
    }
    this.driftY = rand(-0.2, 0.2);
    this.phase = rand(0, Math.PI * 2);
  }
  update() {
    this.x += this.speed;
    this.y += this.driftY + Math.sin(Date.now() * 0.001 + this.phase) * 0.3;
    if (this.x > W + 400) this.reset();
  }
  draw() {
    const time = Date.now() * 0.002;
    for (let i = 0; i < this.segments.length; i++) {
      const s = this.segments[i];
      const segX = this.x + i * 18;
      const segY = this.y + Math.sin(time + s.phase) * 8;
      const glowIntensity = 0.3 + Math.sin(time * 2 + i * 0.5) * 0.2;
      // Glow
      const glow = ctx.createRadialGradient(segX, segY, 0, segX, segY, s.size * 4);
      glow.addColorStop(0, `rgba(100,200,255,${glowIntensity * 0.4})`);
      glow.addColorStop(0.5, `rgba(50,150,220,${glowIntensity * 0.15})`);
      glow.addColorStop(1, 'rgba(20,80,150,0)');
      ctx.beginPath();
      ctx.arc(segX, segY, s.size * 4, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();
      // Core
      ctx.beginPath();
      ctx.arc(segX, segY, s.size, 0, Math.PI * 2);
      const alpha = 0.5 + Math.sin(time + i) * 0.2;
      ctx.fillStyle = `rgba(150,220,255,${alpha})`;
      ctx.fill();
      // Connecting strand
      if (i > 0) {
        const prev = this.segments[i - 1];
        const prevX = this.x + (i - 1) * 18;
        const prevY = this.y + Math.sin(time + prev.phase) * 8;
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(segX, segY);
        ctx.strokeStyle = `rgba(120,180,220,0.2)`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }
}

const siphonophores = [];
for (let i = 0; i < 3; i++) {
  const s = new Siphonophore();
  s.x = rand(-200, W + 200);
  siphonophores.push(s);
}

// --- ROV ---
const rov = {
  x: W * 0.5,
  y: H * 0.45,
  speed: 0.4,
  phase: 0,
  heading: 1,
  targetX: W * 0.5,
  headlightAngle: 0,
  update() {
    this.phase += 0.003;
    this.x = lerp(W * 0.2, W * 0.8, 0.5 + 0.5 * Math.sin(this.phase));
    this.y = H * 0.42 + Math.sin(this.phase * 0.7) * H * 0.06;
    this.heading = Math.cos(this.phase) > 0 ? 1 : -1;
    this.headlightAngle = lerp(-0.15, 0.15, 0.5 + 0.5 * Math.sin(this.phase * 0.5));
  },
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    // Body
    ctx.fillStyle = '#2a2a2a';
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    // Main body
    ctx.beginPath();
    ctx.roundRect(-30, -18, 60, 36, 5);
    ctx.fill();
    ctx.stroke();
    // Camera dome
    ctx.beginPath();
    ctx.arc(this.heading * 32, -5, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a2a';
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.stroke();
    // Lens glow
    ctx.beginPath();
    ctx.arc(this.heading * 32, -5, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#334';
    ctx.fill();
    // Arms
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-20, 15);
    ctx.lineTo(-25, 30);
    ctx.lineTo(-15, 35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(20, 15);
    ctx.lineTo(25, 30);
    ctx.lineTo(15, 35);
    ctx.stroke();
    // Propellers
    const propTime = Date.now() * 0.01;
    for (const px of [-25, 25]) {
      ctx.save();
      ctx.translate(px, 35);
      ctx.rotate(propTime);
      ctx.fillStyle = '#555';
      ctx.fillRect(-8, -1.5, 16, 3);
      ctx.restore();
      ctx.save();
      ctx.translate(px, 35);
      ctx.rotate(propTime + Math.PI / 2);
      ctx.fillStyle = '#555';
      ctx.fillRect(-8, -1.5, 16, 3);
      ctx.restore();
    }
    // Antenna
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(0, -28);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -28, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#f44';
    ctx.fill();
    ctx.restore();

    // Headlight cones
    this.drawHeadlightCones();
  },
  drawHeadlightCones() {
    const time = Date.now() * 0.001;
    const baseAngle = this.heading * (0.05 + this.headlightAngle);
    for (const offset of [-8, 8]) {
      const startX = this.x + offset * this.heading;
      const startY = this.y - 5;
      const spread = 0.35;
      const length = 350;
      const angle = baseAngle + offset * 0.02;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(startX + Math.cos(angle - spread) * length, startY + Math.sin(angle - spread) * length);
      ctx.lineTo(startX + Math.cos(angle + spread) * length, startY + Math.sin(angle + spread) * length);
      ctx.closePath();

      const grad = ctx.createRadialGradient(startX, startY, 10, startX + Math.cos(angle) * length * 0.5, startY + Math.sin(angle) * length * 0.5, length);
      grad.addColorStop(0, 'rgba(255,240,200,0.12)');
      grad.addColorStop(0.3, 'rgba(255,230,180,0.06)');
      grad.addColorStop(0.7, 'rgba(255,220,160,0.02)');
      grad.addColorStop(1, 'rgba(255,210,150,0)');
      ctx.fillStyle = grad;
      ctx.fill();

      // Bright core
      const coreGrad = ctx.createRadialGradient(startX, startY, 0, startX + Math.cos(angle) * 100, startY + Math.sin(angle) * 100, 150);
      coreGrad.addColorStop(0, 'rgba(255,250,230,0.15)');
      coreGrad.addColorStop(0.5, 'rgba(255,240,200,0.05)');
      coreGrad.addColorStop(1, 'rgba(255,230,180,0)');
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(startX + Math.cos(angle - spread * 0.5) * 150, startY + Math.sin(angle - spread * 0.5) * 150);
      ctx.lineTo(startX + Math.cos(angle + spread * 0.5) * 150, startY + Math.sin(angle + spread * 0.5) * 150);
      ctx.closePath();
      ctx.fillStyle = coreGrad;
      ctx.fill();
      ctx.restore();
    }
  }
};

// --- Seafloor ---
function drawSeafloor() {
  const groundY = H * 0.85;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, groundY);
  // Rocky terrain
  for (let x = 0; x <= W; x += 3) {
    const y = groundY + Math.sin(x * 0.01) * 10 + Math.sin(x * 0.03) * 5 + Math.sin(x * 0.07) * 3;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, groundY, 0, H);
  grad.addColorStop(0, '#1a1815');
  grad.addColorStop(0.3, '#121010');
  grad.addColorStop(1, '#080706');
  ctx.fillStyle = grad;
  ctx.fill();

  // Small rocks
  for (let i = 0; i < 30; i++) {
    const rx = rand(0, W);
    const ry = groundY + rand(0, 20);
    const rs = rand(3, 12);
    ctx.beginPath();
    ctx.ellipse(rx, ry, rs, rs * 0.5, rand(-0.3, 0.3), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${20 + rand(0,15)|0},${18 + rand(0,10)|0},${15 + rand(0,8)|0},0.8)`;
    ctx.fill();
  }
}

// --- Vent wall formations ---
function drawVentWalls() {
  const groundY = H * 0.85;
  // Left wall
  ctx.beginPath();
  ctx.moveTo(0, groundY - 20);
  ctx.lineTo(0, H);
  ctx.lineTo(W * 0.08, H);
  ctx.lineTo(W * 0.06, groundY);
  ctx.closePath();
  const wl = ctx.createLinearGradient(0, groundY, W * 0.08, groundY);
  wl.addColorStop(0, '#151310');
  wl.addColorStop(1, '#1a1815');
  ctx.fillStyle = wl;
  ctx.fill();

  // Right wall
  ctx.beginPath();
  ctx.moveTo(W, groundY - 20);
  ctx.lineTo(W, H);
  ctx.lineTo(W * 0.92, H);
  ctx.lineTo(W * 0.94, groundY);
  ctx.closePath();
  const wr = ctx.createLinearGradient(W, groundY, W * 0.92, groundY);
  wr.addColorStop(0, '#151310');
  wr.addColorStop(1, '#1a1815');
  ctx.fillStyle = wr;
  ctx.fill();
}

// --- Minibubbles from vents ---
class Bubble {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = rand(-0.3, 0.3);
    this.vy = rand(-1.5, -0.3);
    this.size = rand(1, 4);
    this.life = 1;
    this.decay = rand(0.005, 0.02);
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    this.size *= 1.003;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(150,180,200,${this.life * 0.4})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

const bubbles = [];

// --- Main Loop ---
let lastTime = 0;

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#020510');
  grad.addColorStop(0.3, '#030818');
  grad.addColorStop(0.7, '#050a15');
  grad.addColorStop(1, '#0a0f12');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawLightingOverlay() {
  // Darken everything, then brighten near ROV lights
  // We'll use a different approach: draw dark overlay, then cut out light cones
  ctx.save();
  // Global darkness
  ctx.fillStyle = 'rgba(2,3,10,0.75)';
  ctx.fillRect(0, 0, W, H);

  // Cut out light from ROV headlights using composite operations
  ctx.globalCompositeOperation = 'lighter';

  const time = Date.now() * 0.001;
  const baseAngle = rov.heading * (0.05 + rov.headlightAngle);

  for (const offset of [-8, 8]) {
    const startX = rov.x + offset * rov.heading;
    const startY = rov.y - 5;
    const spread = 0.35;
    const length = 400;
    const angle = baseAngle + offset * 0.02;

    // Main light cone
    const grad = ctx.createRadialGradient(startX, startY, 5, startX + Math.cos(angle) * 200, startY + Math.sin(angle) * 200, 350);
    grad.addColorStop(0, 'rgba(255,240,210,0.18)');
    grad.addColorStop(0.3, 'rgba(255,230,190,0.08)');
    grad.addColorStop(0.7, 'rgba(255,220,170,0.02)');
    grad.addColorStop(1, 'rgba(255,210,160,0)');

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(startX + Math.cos(angle - spread) * length, startY + Math.sin(angle - spread) * length);
    ctx.lineTo(startX + Math.cos(angle + spread) * length, startY + Math.sin(angle + spread) * length);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Warm glow near source
    const warmGrad = ctx.createRadialGradient(startX, startY, 0, startX, startY, 60);
    warmGrad.addColorStop(0, 'rgba(255,245,220,0.12)');
    warmGrad.addColorStop(1, 'rgba(255,230,200,0)');
    ctx.beginPath();
    ctx.arc(startX, startY, 60, 0, Math.PI * 2);
    ctx.fillStyle = warmGrad;
    ctx.fill();
  }

  // Subtle ambient glow around vents
  for (const vent of vents) {
    const ventGlow = ctx.createRadialGradient(vent.x, vent.topY, 5, vent.x, vent.topY, 80);
    ventGlow.addColorStop(0, 'rgba(255,100,30,0.04)');
    ventGlow.addColorStop(0.5, 'rgba(200,60,20,0.015)');
    ventGlow.addColorStop(1, 'rgba(100,30,10,0)');
    ctx.beginPath();
    ctx.arc(vent.x, vent.topY, 80, 0, Math.PI * 2);
    ctx.fillStyle = ventGlow;
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}

function animate(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  drawBackground();
  drawVentWalls();
  drawSeafloor();

  // Draw vents
  for (const vent of vents) {
    vent.update();
    vent.draw();
  }

  // Draw tube worms
  for (const worm of tubeWorms) {
    worm.update(Date.now());
    worm.draw();
  }

  // Draw shrimp
  for (const shrimpItem of shrimp) {
    shrimpItem.update();
    shrimpItem.draw();
  }

  // Draw siphonophores
  for (const siph of siphonophores) {
    siph.update();
    siph.draw();
  }

  // Draw ROV
  rov.update();
  rov.draw();

  // Draw marine snow (behind lighting overlay)
  for (const snow of marineSnow) {
    snow.update(Date.now());
    snow.draw();
  }

  // Bubbles from vents
  for (const vent of vents) {
    if (Math.random() < 0.15) {
      bubbles.push(new Bubble(vent.x + rand(-5, 5), vent.topY + rand(-3, 3)));
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    bubbles[i].update();
    bubbles[i].draw();
    if (bubbles[i].life <= 0) bubbles.splice(i, 1);
  }
  if (bubbles.length > 300) bubbles.splice(0, 50);

  // Lighting overlay (darkens scene, reveals color near lights)
  drawLightingOverlay();

  // Subtle vignette
  const vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.8);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
