<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090f">
<title>The Night Shift — a cozy desk in pure CSS</title>
<style>
/* ============ base ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.4vh;padding:3.5vh 4vw;
  background:#07090f;
  background-image:
    radial-gradient(60vw 40vh at 50% 108%, rgba(255,158,80,.07), transparent 60%),
    radial-gradient(50vw 34vh at 82% -8%, rgba(96,138,196,.09), transparent 60%),
    radial-gradient(1.5px 1.5px at 12% 24%, rgba(255,255,255,.14), transparent 100%),
    radial-gradient(1.5px 1.5px at 78% 14%, rgba(255,255,255,.10), transparent 100%),
    radial-gradient(1px 1px at 44% 82%, rgba(255,255,255,.08), transparent 100%),
    radial-gradient(1px 1px at 92% 66%, rgba(255,255,255,.09), transparent 100%);
  color:#e9e2d2;
  font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  overflow-x:hidden;
  /* lighting state: 1 = lamp on (warm) · 0 = lamp off (dark) */
  --warm:1; --coneO:.8; --veilO:0; --bulbO:1; --spillO:.22; --haloO:.6;
  --eyeG:rgba(255,190,110,.45); --moonF:.92; --starA:.55; --twO:.3; --artF:.85;
}
body:not(.lamp-on){
  --warm:0; --coneO:0; --veilO:.5; --bulbO:.3; --spillO:.6; --haloO:1;
  --eyeG:rgba(255,214,130,.95); --moonF:1.14; --starA:1; --twO:.9; --artF:.55;
}
::selection{background:#e8a25c;color:#1a120c}

/* ============ masthead ============ */
.masthead{width:min(1020px,94vw)}
.kicker{
  font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#8b93a8;
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.kicker::before{content:"";width:26px;height:1px;background:#3a4152}
h1{
  font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  font-style:italic;font-weight:600;letter-spacing:-.01em;
  font-size:clamp(30px,4.6vw,52px);line-height:1.02;color:#ece4d3;
}
h1 em{font-style:italic;color:#e8a25c}

/* ============ stage ============ */
.stage{
  position:relative;width:min(1020px,94vw);aspect-ratio:16/10;
  container-type:size;overflow:hidden;border-radius:16px;
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.85),0 0 0 8px rgba(255,255,255,.02);
  background:#0d1017;
  --px:0; --py:0;
}
.layer{position:absolute;inset:0;pointer-events:none}
.layer-wall{transform:translate(calc(var(--px)*-.5),calc(var(--py)*-.35));transition:transform .6s cubic-bezier(.2,.7,.3,1);z-index:2}
.layer-desk{transform:translate(calc(var(--px)*.55),calc(var(--py)*.4));transition:transform .6s cubic-bezier(.2,.7,.3,1);z-index:4}

/* ============ wall & floor ============ */
.wall-dark,.wall-warm,.floor-dark,.floor-warm{position:absolute;inset:0;transition:opacity .9s ease}
.wall-dark{background:linear-gradient(180deg,#161b28,#0d1017)}
.wall-warm{background:linear-gradient(180deg,#3b2e30 0%,#2b2125 58%,#231b20 100%);opacity:var(--warm)}
.floor-dark{top:46.5cqi;background:linear-gradient(180deg,#221c27,#120e17)}
.floor-warm{top:46.5cqi;background:linear-gradient(180deg,#4d372b,#2c1f18);opacity:var(--warm)}
.floor-dark,.floor-warm{border-top:.5cqi solid rgba(0,0,0,.4)}
.wall-tex{position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 .3cqi,transparent .3cqi 1.1cqi)}
.baseboard{position:absolute;left:0;right:0;top:45.4cqi;height:1.2cqi;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.35));opacity:.7}

/* ============ window ============ */
.window{position:absolute;left:7cqi;top:6cqi;width:26cqi;height:28cqi;
  background:linear-gradient(160deg,#6b4c39,#4a3327);
  border-radius:1.2cqi;padding:1.5cqi;
  box-shadow:0 1.6cqi 3cqi rgba(0,0,0,.5),inset 0 0 0 .25cqi rgba(0,0,0,.35),inset 0 .3cqi 0 rgba(255,255,255,.08)}
.pane{position:absolute;inset:1.5cqi;border-radius:.5cqi;overflow:hidden;
  background:linear-gradient(180deg,#0a1730 0%,#12294a 62%,#1a3a5c 100%);
  box-shadow:inset 0 0 3cqi rgba(0,0,0,.6)}
.pane-glass{position:absolute;inset:0;
  background:linear-gradient(115deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.02) 28%,transparent 45%)}
.star{position:absolute;width:.55cqi;height:.55cqi;border-radius:50%;background:#dfe9ff;
  opacity:var(--starA);animation:twinkle 3.4s ease-in-out infinite}
.star:nth-child(1){left:12%;top:16%}
.star:nth-child(2){left:30%;top:34%;animation-delay:.7s;width:.4cqi;height:.4cqi}
.star:nth-child(3){left:52%;top:12%;animation-delay:1.4s}
.star:nth-child(4){left:70%;top:44%;animation-delay:2.1s;width:.4cqi;height:.4cqi}
.star:nth-child(5){left:86%;top:22%;animation-delay:.4s}
.star:nth-child(6){left:22%;top:58%;animation-delay:1.8s;width:.4cqi;height:.4cqi}
.star:nth-child(7){left:64%;top:60%;animation-delay:2.6s;width:.35cqi;height:.35cqi}
.moon{position:absolute;left:60%;top:13%;width:24%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fff8e2,#f2e2b4 55%,#d9c491);
  filter:brightness(var(--moonF));transition:filter .9s ease;
  box-shadow:0 0 2.4cqi .7cqi rgba(246,232,190,.28);
  animation:moonPulse 9s ease-in-out infinite}
.crater{position:absolute;border-radius:50%;background:rgba(148,126,90,.35);
  box-shadow:inset .1cqi .1cqi .2cqi rgba(0,0,0,.25)}
.crater.a{width:20%;height:20%;left:26%;top:22%}
.crater.b{width:13%;height:13%;left:58%;top:52%}
.crater.c{width:9%;height:9%;left:38%;top:62%}
.cloud{position:absolute;left:-34%;top:24%;width:46%;height:16%;border-radius:4cqi;
  background:rgba(212,226,246,.16);filter:blur(.35cqi);animation:drift 44s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:44%;aspect-ratio:1;left:14%;top:-46%}
.cloud::after{width:30%;aspect-ratio:1;right:16%;top:-26%}
.hill{position:absolute;border-radius:50% 50% 0 0;background:#0a1526}
.hill.back{left:-12%;bottom:-7%;width:82%;height:36%;background:#0d1c33}
.hill.front{right:-16%;bottom:-9%;width:88%;height:32%}
.town{position:absolute;width:.6cqi;height:.6cqi;border-radius:50%;background:#ffcf8e;
  animation:twinkle 4.6s ease-in-out infinite}
.town:nth-child(11){left:20%;bottom:16%}
.town:nth-child(12){left:33%;bottom:22%;animation-delay:1.2s;background:#ffd9a0;width:.45cqi;height:.45cqi}
.town:nth-child(13){left:58%;bottom:13%;animation-delay:2.2s}
.town:nth-child(14){left:74%;bottom:19%;animation-delay:3s;background:#cfe0ff;width:.45cqi;height:.45cqi}
.muntin-v{position:absolute;left:calc(50% - .45cqi);top:1.5cqi;bottom:1.5cqi;width:.9cqi;
  background:linear-gradient(90deg,#3f2c21,#6b4c39,#3f2c21)}
.muntin-h{position:absolute;top:calc(50% - .45cqi);left:1.5cqi;right:1.5cqi;height:.9cqi;
  background:linear-gradient(180deg,#3f2c21,#6b4c39,#3f2c21)}
.sill{position:absolute;left:-1.7cqi;right:-1.7cqi;bottom:-2.5cqi;height:1.5cqi;border-radius:.4cqi;
  background:linear-gradient(180deg,#7c5a43,#4a3327);
  box-shadow:0 .8cqi 1.4cqi rgba(0,0,0,.5),inset 0 .25cqi 0 rgba(255,255,255,.14)}

/* windowsill plant */
.spot{position:absolute;left:11cqi;top:31.2cqi;width:7cqi;height:6.4cqi}
.spot .leaf{position:absolute;bottom:2.1cqi;left:50%;width:1.7cqi;height:3.4cqi;border-radius:60% 60% 30% 30%;
  transform-origin:bottom center;
  background:linear-gradient(180deg,#6fae7c,#3f7a52);
  box-shadow:inset -.3cqi 0 .4cqi rgba(0,0,0,.25)}
.spot .leaf.l1{transform:translateX(-50%) rotate(-26deg)}
.spot .leaf.l2{transform:translateX(-50%) rotate(2deg);height:4cqi}
.spot .leaf.l3{transform:translateX(-50%) rotate(27deg)}
.spot .spotpot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:3.6cqi;height:2.3cqi;border-radius:.3cqi .3cqi .9cqi .9cqi;
  background:linear-gradient(180deg,#a56a44,#6f4229);
  box-shadow:inset 0 .35cqi 0 rgba(255,255,255,.15),0 .5cqi .8cqi rgba(0,0,0,.4)}

/* curtains + rod */
.rod{position:absolute;left:2.6cqi;top:3.6cqi;width:35cqi;height:.7cqi;border-radius:1cqi;
  background:linear-gradient(180deg,#8a6a4f,#4a3527);box-shadow:0 .4cqi .8cqi rgba(0,0,0,.5)}
.rod::before,.rod::after{content:"";position:absolute;top:-.35cqi;width:1.4cqi;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c9a37a,#6b4c39)}
.rod::before{left:-.5cqi}.rod::after{right:-.5cqi}
.curtain{position:absolute;top:4.4cqi;width:6.4cqi;height:32cqi;
  background:repeating-linear-gradient(90deg,#2e4a42 0 1.1cqi,#223a34 1.1cqi 2.2cqi);
  box-shadow:inset 0 -2cqi 3cqi rgba(0,0,0,.45),0 1cqi 2cqi rgba(0,0,0,.4)}
.curtain.cl{left:2.8cqi;border-radius:.6cqi .2cqi 46% 20%}
.curtain.cr{left:31cqi;border-radius:.2cqi .6cqi 20% 46%}

/* picture frame */
.frame{position:absolute;left:55cqi;top:9cqi;width:11cqi;height:8.6cqi;
  background:linear-gradient(160deg,#7a5a40,#4c3627);border-radius:.5cqi;padding:.9cqi;
  box-shadow:0 1cqi 2cqi rgba(0,0,0,.5),inset 0 0 0 .2cqi rgba(0,0,0,.4);
  filter:brightness(var(--artF));transition:filter .9s ease}
.art{position:relative;width:100%;height:100%;border-radius:.2cqi;overflow:hidden;
  background:linear-gradient(180deg,#17324e 0%,#3f6285 58%,#e8a25c 76%,#f4c98d 100%)}
.mtn{position:absolute;bottom:0;width:0;height:0;border-style:solid}
.mtn.m1{left:4%;border-width:0 2.2cqi 3.2cqi 2.2cqi;border-color:transparent transparent #10233c transparent}
.mtn.m2{left:38%;border-width:0 2.8cqi 4.2cqi 2.8cqi;border-color:transparent transparent #0b1a2e transparent}
.art-sun{position:absolute;left:64%;top:26%;width:1.5cqi;aspect-ratio:1;border-radius:50%;
  background:#ffd9a0;box-shadow:0 0 1cqi rgba(255,217,160,.8)}

/* string lights */
.wire{position:absolute;left:37cqi;top:4.6cqi;width:58cqi;height:6.4cqi;
  border:0 solid #10151f;border-bottom-width:.32cqi;border-radius:0 0 100% 100%/0 0 100% 100%}
.bulb{position:absolute;width:.95cqi;height:1.25cqi;border-radius:50% 50% 55% 55%;
  background:linear-gradient(180deg,#ffe3b0,#f3a95c);transform:translateX(-50%);
  animation:shimmer 3.2s ease-in-out infinite}
.bulb::before{content:"";position:absolute;left:50%;top:-.45cqi;width:.4cqi;height:.5cqi;
  transform:translateX(-50%);background:#23303f;border-radius:.15cqi}
.bulb::after{content:"";position:absolute;inset:-.7cqi;border-radius:50%;
  background:radial-gradient(circle,rgba(255,190,110,.55),transparent 70%);
  opacity:var(--bulbO);transition:opacity .9s ease}
.bulb:nth-of-type(1){left:41.5cqi;top:6.5cqi}
.bulb:nth-of-type(2){left:49.5cqi;top:8.2cqi;animation-delay:.5s}
.bulb:nth-of-type(3){left:57.5cqi;top:9.4cqi;animation-delay:1s}
.bulb:nth-of-type(4){left:65.5cqi;top:10.1cqi;animation-delay:1.5s}
.bulb:nth-of-type(5){left:73.5cqi;top:10.2cqi;animation-delay:2s}
.bulb:nth-of-type(6){left:81.5cqi;top:9.8cqi;animation-delay:2.5s}
.bulb:nth-of-type(7){left:89.5cqi;top:8.9cqi;animation-delay:3s}

/* ============ rug ============ */
.rug{position:absolute;left:30cqi;top:49.5cqi;width:58cqi;height:9.5cqi;border-radius:50%;
  background:radial-gradient(ellipse at center,#43334a 0 30%,#37293f 30% 55%,#2c2134 55% 100%);
  box-shadow:inset 0 0 2cqi rgba(0,0,0,.5),0 .5cqi 1cqi rgba(0,0,0,.3)}

/* ============ desk ============ */
.desk-shadow{position:absolute;left:27cqi;top:54.2cqi;width:66cqi;height:2.6cqi;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
.desk-leg{position:absolute;left:26.8cqi;top:42.2cqi;width:2.4cqi;height:12.6cqi;
  background:linear-gradient(90deg,#5d4030,#3a281e);border-radius:0 0 .3cqi .3cqi;
  box-shadow:inset -.3cqi 0 .4cqi rgba(0,0,0,.4)}
.drawer-unit{position:absolute;left:79cqi;top:42.2cqi;width:14cqi;height:11.6cqi;
  background:linear-gradient(180deg,#5d4030,#412c20);border-radius:0 0 .5cqi .5cqi;
  box-shadow:inset 0 .3cqi 0 rgba(255,255,255,.08),inset -.4cqi 0 .6cqi rgba(0,0,0,.35)}
.drawer{position:absolute;left:1.1cqi;right:1.1cqi;height:4.4cqi;border-radius:.4cqi;
  background:linear-gradient(180deg,#6b4a36,#4a3223);
  box-shadow:inset 0 .25cqi 0 rgba(255,255,255,.1),inset 0 -.3cqi .5cqi rgba(0,0,0,.35)}
.drawer.d1{top:1cqi}.drawer.d2{top:6.2cqi}
.knob{position:absolute;left:50%;top:50%;width:1.1cqi;height:.55cqi;border-radius:.3cqi;
  transform:translate(-50%,-50%);background:linear-gradient(180deg,#e0b077,#8a5f39);
  box-shadow:0 .2cqi .3cqi rgba(0,0,0,.5)}
.desk-top{position:absolute;left:24cqi;top:40cqi;width:73cqi;height:2.3cqi;border-radius:.5cqi;
  background:linear-gradient(180deg,#8a6142 0%,#6f4c33 45%,#59402c 100%);
  box-shadow:inset 0 .35cqi 0 rgba(255,255,255,.16),inset 0 -.4cqi .6cqi rgba(0,0,0,.4),0 1.2cqi 2cqi rgba(0,0,0,.45)}

/* ============ books ============ */
.book{position:absolute;border-radius:.3cqi .6cqi .6cqi .3cqi;
  box-shadow:inset 0 .3cqi 0 rgba(255,255,255,.14),inset .5cqi 0 .8cqi rgba(0,0,0,.3),0 .5cqi .8cqi rgba(0,0,0,.35)}
.book::after{content:"";position:absolute;left:.55cqi;top:.5cqi;bottom:.5cqi;width:.18cqi;
  background:rgba(0,0,0,.3);border-radius:.2cqi}
.book.b1{left:26.2cqi;top:38.1cqi;width:6.4cqi;height:1.9cqi;background:linear-gradient(180deg,#7c4039,#5c2c27)}
.book.b2{left:26.7cqi;top:36.4cqi;width:5.6cqi;height:1.7cqi;background:linear-gradient(180deg,#3f6b66,#2c4d4a)}
.book.b3{left:27.3cqi;top:34.9cqi;width:4.6cqi;height:1.5cqi;background:linear-gradient(180deg,#c19a58,#96713a)}

/* ============ laptop ============ */
.laptop{position:absolute;left:33cqi;top:23.6cqi;width:18cqi;height:16.4cqi}
.screen{position:absolute;left:.6cqi;top:0;width:16.8cqi;height:13.4cqi;border-radius:.9cqi;
  background:linear-gradient(160deg,#262c36,#12161d);padding:.75cqi .75cqi 1cqi;
  box-shadow:inset 0 0 0 .18cqi #05070b,inset 0 .25cqi 0 rgba(255,255,255,.07),0 1cqi 2cqi rgba(0,0,0,.5)}
.cam{position:absolute;left:50%;top:.28cqi;width:.4cqi;height:.4cqi;border-radius:50%;
  transform:translateX(-50%);background:#0a0d12;box-shadow:0 0 .3cqi rgba(120,160,220,.5)}
.display{position:relative;width:100%;height:100%;border-radius:.4cqi;overflow:hidden;
  background:linear-gradient(180deg,#0e1522,#0a0f19);
  box-shadow:inset 0 0 1.6cqi rgba(90,140,220,.12)}
.menubar{height:1.15cqi;background:rgba(255,255,255,.05);display:flex;align-items:center;
  justify-content:space-between;padding:0 .6cqi;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.62cqi;color:#8fa3c0}
.dots{display:flex;gap:.3cqi}
.dots i{width:.34cqi;height:.34cqi;border-radius:50%}
.dots i:nth-child(1){background:#e0655a}.dots i:nth-child(2){background:#e0a53e}.dots i:nth-child(3){background:#67b26f}
.code{padding:.8cqi .7cqi;display:flex;flex-direction:column;gap:.62cqi}
.ln{height:.5cqi;border-radius:.3cqi;opacity:.92}
.ln.c1{width:34%;background:#e8a25c}
.ln.c2{width:60%;background:#6fb7a0;margin-left:1cqi}
.ln.c3{width:46%;background:#8fa3c0;margin-left:1cqi}
.ln.c4{width:68%;background:#d97f6f;margin-left:2cqi}
.ln.c5{width:38%;background:#8fa3c0;margin-left:1cqi}
.ln.c6{width:52%;background:#6fb7a0}
.ln.c7{width:26%;background:#e8a25c}
.ln.c8{display:flex;align-items:center;gap:.3cqi;width:40%}
.ln.c8 b{width:.45cqi;height:.5cqi;background:#c9d4e6;border-radius:.1cqi;animation:caret 1.1s steps(1) infinite}
.ln.c8 i{flex:1;height:.5cqi;background:#33415e;border-radius:.3cqi}
.screen-halo{position:absolute;left:-1.6cqi;top:-1.6cqi;right:-1.6cqi;bottom:-1cqi;z-index:-1;
  opacity:var(--haloO);transition:opacity .9s ease}
.screen-halo i{position:absolute;inset:0;border-radius:2cqi;
  background:radial-gradient(ellipse at 50% 42%,rgba(140,190,255,.5),rgba(140,190,255,0) 68%);
  filter:blur(1.1cqi);animation:haloPulse 4.4s ease-in-out infinite}
.base{position:absolute;left:0;bottom:0;width:18cqi;height:2.1cqi;border-radius:.4cqi .4cqi .8cqi .8cqi;
  background:linear-gradient(180deg,#3a414d,#1d222b);
  box-shadow:inset 0 .3cqi 0 rgba(255,255,255,.14),inset 0 -.4cqi .5cqi rgba(0,0,0,.5),0 .8cqi 1.2cqi rgba(0,0,0,.45)}
.keys{position:absolute;left:1.3cqi;top:.35cqi;width:11.6cqi;height:1cqi;border-radius:.25cqi;opacity:.85;
  background:repeating-linear-gradient(90deg,#12161d 0 .95cqi,#2b323d .95cqi 1.15cqi)}
.pad{position:absolute;left:13.6cqi;top:.45cqi;width:3cqi;height:.85cqi;border-radius:.25cqi;
  background:#20252e;box-shadow:inset 0 0 0 .12cqi rgba(255,255,255,.05)}
.spill{position:absolute;left:34cqi;top:39.5cqi;width:16.5cqi;height:1.7cqi;border-radius:50%;
  background:radial-gradient(ellipse,rgba(150,200,255,.4),transparent 70%);
  filter:blur(.4cqi);opacity:var(--spillO);transition:opacity .9s ease}

/* ============ mug + steam ============ */
.mug{position:absolute;left:54cqi;top:34.4cqi;width:5.2cqi;height:5.6cqi;border-radius:.5cqi .5cqi 1.3cqi 1.3cqi;
  background:linear-gradient(160deg,#f0e4d0 0%,#d9c5a8 55%,#b39a7c 100%);
  box-shadow:inset 0 .4cqi .5cqi rgba(0,0,0,.28),inset 0 -.4cqi .6cqi rgba(0,0,0,.18),0 .7cqi 1cqi rgba(0,0,0,.4);
  transition:transform .35s ease;pointer-events:auto;cursor:default}
.mug:hover{transform:translateY(-.3cqi)}
.mug::before{content:"";position:absolute;left:.7cqi;top:1.1cqi;width:.7cqi;height:3.2cqi;border-radius:.5cqi;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05))}
.mug-band{position:absolute;left:0;right:0;top:1.7cqi;height:.85cqi;background:#b3593f;opacity:.85}
.mug-band::after{content:"";position:absolute;left:50%;top:50%;width:.5cqi;height:.5cqi;border-radius:50%;
  transform:translate(-50%,-50%) rotate(45deg);background:#e8d9c2}
.handle{position:absolute;right:-1.8cqi;top:1.1cqi;width:2.3cqi;height:3cqi;
  border:.62cqi solid #d9c5a8;border-radius:50%;
  box-shadow:inset .2cqi .2cqi .3cqi rgba(0,0,0,.2),.3cqi .4cqi .6cqi rgba(0,0,0,.3)}
.steam{position:absolute;left:55.4cqi;top:26.6cqi;width:.95cqi;height:5.6cqi;border-radius:1cqi;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55));
  filter:blur(.32cqi);opacity:0;transform-origin:bottom center;
  animation:steamRise 3.6s ease-in-out infinite}
.steam.s2{left:56.6cqi;height:6.6cqi;animation-delay:1.2s;animation-duration:4s}
.steam.s3{left:57.7cqi;height:5cqi;animation-delay:2.2s;animation-duration:3.8s}
.mug:hover ~ .steam{animation-duration:1.7s}

/* ============ notebook + pen ============ */
.notebook{position:absolute;left:60cqi;top:37.3cqi;width:4.4cqi;height:2.7cqi;border-radius:.35cqi;
  background:linear-gradient(160deg,#41636e,#2b4750);
  box-shadow:inset 0 .3cqi 0 rgba(255,255,255,.12),0 .6cqi .9cqi rgba(0,0,0,.4)}
.nb-band{position:absolute;left:2.9cqi;top:0;bottom:0;width:.55cqi;background:#d9b26a;
  box-shadow:inset 0 0 .3cqi rgba(0,0,0,.3)}
.pen{position:absolute;left:60.7cqi;top:36.55cqi;width:3.4cqi;height:.5cqi;border-radius:.3cqi;
  background:linear-gradient(90deg,#c05a4e 0 78%,#e8d9c2 78% 90%,#3a2b22 90%);
  transform:rotate(-9deg);box-shadow:0 .3cqi .5cqi rgba(0,0,0,.4)}

/* ============ cat ============ */
.cat{position:absolute;left:65cqi;top:21cqi;width:12cqi;height:19cqi;pointer-events:auto}
.cat-shadow{position:absolute;left:.6cqi;bottom:-.2cqi;width:10cqi;height:1.3cqi;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%)}
.tail{position:absolute;left:9.4cqi;top:9.8cqi;width:1.5cqi;height:9.8cqi;z-index:0;
  border-radius:.8cqi .8cqi 1cqi 1cqi;
  background:linear-gradient(180deg,#333d4d,#1d242f);
  box-shadow:inset -.3cqi 0 .4cqi rgba(0,0,0,.4);
  transform-origin:50% 6%;animation:tailSway 3.8s ease-in-out infinite}
.cat:hover .tail{animation-duration:1.5s}
.tail::after{content:"";position:absolute;left:.15cqi;bottom:.15cqi;width:1.2cqi;height:1.5cqi;border-radius:50%;
  background:#e9e2d2;opacity:.9}
.bodyc{position:absolute;left:1.2cqi;top:6.6cqi;width:9cqi;height:12.4cqi;z-index:1;
  border-radius:48% 52% 44% 44%/62% 62% 36% 36%;
  background:radial-gradient(circle at 38% 28%,#3d4859,#232a36 68%);
  box-shadow:inset -.6cqi -.8cqi 1.2cqi rgba(0,0,0,.35);
  transform-origin:50% 100%;animation:breathe 4.6s ease-in-out infinite}
.chest{position:absolute;left:50%;bottom:.6cqi;width:4.4cqi;height:5.4cqi;transform:translateX(-50%);
  border-radius:50% 50% 46% 46%;background:linear-gradient(180deg,#4d5a6e,#39445a);opacity:.85}
.paw{position:absolute;bottom:.15cqi;width:1.7cqi;height:1.05cqi;border-radius:.6cqi;
  background:#2b3341;box-shadow:inset 0 .2cqi 0 rgba(255,255,255,.08),0 .3cqi .4cqi rgba(0,0,0,.4)}
.paw.pl{left:2.6cqi}.paw.pr{left:5.9cqi}
.head{position:absolute;left:2.5cqi;top:1.5cqi;width:6.8cqi;height:5.9cqi;z-index:2;
  border-radius:48% 48% 46% 46%;
  background:radial-gradient(circle at 36% 30%,#414d60,#262e3a 72%);
  box-shadow:inset -.5cqi -.6cqi 1cqi rgba(0,0,0,.3)}
.ear{position:absolute;top:-1.5cqi;width:0;height:0;border-style:solid}
.ear.el{left:.5cqi;border-width:0 1.1cqi 2.1cqi 1.5cqi;border-color:transparent transparent #2b3341 transparent;
  transform:rotate(-14deg)}
.ear.er{right:.5cqi;border-width:0 1.5cqi 2.1cqi 1.1cqi;border-color:transparent transparent #2b3341 transparent;
  transform:rotate(14deg);transform-origin:bottom center;animation:earTwitch 7s ease-in-out infinite}
.earin{position:absolute;top:-1.05cqi;width:0;height:0;border-style:solid}
.earin.el{left:.95cqi;border-width:0 .55cqi 1.15cqi .8cqi;border-color:transparent transparent #7a5a58 transparent;
  transform:rotate(-14deg)}
.earin.er{right:.95cqi;border-width:0 .8cqi 1.15cqi .55cqi;border-color:transparent transparent #7a5a58 transparent;
  transform:rotate(14deg)}
.eye{position:absolute;top:2.3cqi;width:.9cqi;height:.9cqi;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#ffe9b8,#f2b04e 70%);
  box-shadow:0 0 .8cqi .15cqi var(--eyeG);transition:box-shadow .9s ease;
  animation:blink 6.4s ease-in-out infinite}
.eye.eyl{left:1.5cqi}.eye.eyr{right:1.5cqi}
.eye::after{content:"";position:absolute;left:50%;top:15%;width:.22cqi;height:.55cqi;
  transform:translateX(-50%);border-radius:.2cqi;background:#141821}
.nose{position:absolute;left:50%;top:3.5cqi;width:.62cqi;height:.44cqi;transform:translateX(-50%);
  border-radius:40% 40% 60% 60%;background:#c98a80}
.whiskers{position:absolute;left:50%;top:3.9cqi;width:.1cqi;height:.1cqi}
.whiskers::before,.whiskers::after{content:"";position:absolute;top:0;width:2.1cqi;height:.13cqi;border-radius:.1cqi;
  background:rgba(235,235,245,.3)}
.whiskers::before{right:.5cqi;transform:rotate(7deg);box-shadow:0 .55cqi 0 rgba(235,235,245,.22)}
.whiskers::after{left:.5cqi;transform:rotate(-7deg);box-shadow:0 .55cqi 0 rgba(235,235,245,.22)}

/* ============ lamp (the switch) ============ */
.lamp{position:absolute;left:79cqi;top:20cqi;width:15cqi;height:20.2cqi;z-index:6;
  background:none;border:0;padding:0;cursor:pointer;pointer-events:auto;
  -webkit-tap-highlight-color:transparent}
.lamp:focus-visible{outline:.3cqi dashed #e8a25c;outline-offset:.5cqi;border-radius:1cqi}
.lamp:active .lamp-inner{transform:scale(.985)}
.lamp-inner{position:absolute;inset:0;transform-origin:50% 95%;transition:transform .15s ease}
.cone{position:absolute;left:1cqi;top:6.4cqi;width:12.5cqi;height:13.8cqi;
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,rgba(255,196,120,.5),rgba(255,176,96,.05));
  filter:blur(.5cqi);opacity:var(--coneO);transition:opacity .9s ease;
  animation:coneFlicker 7s ease-in-out infinite}
.arm-b{position:absolute;left:8.2cqi;top:13.6cqi;width:.6cqi;height:6.2cqi;border-radius:.4cqi;
  background:linear-gradient(90deg,#8a6a4a,#4c3826);transform:rotate(-16deg);transform-origin:bottom center}
.arm-t{position:absolute;left:7.55cqi;top:8.2cqi;width:.55cqi;height:6cqi;border-radius:.4cqi;
  background:linear-gradient(90deg,#8a6a4a,#4c3826);transform:rotate(24deg);transform-origin:bottom center}
.joint{position:absolute;left:7.95cqi;top:13.35cqi;width:.95cqi;height:.95cqi;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#caa27a,#5c4530);box-shadow:0 .2cqi .3cqi rgba(0,0,0,.5)}
.lamp-base{position:absolute;left:4.6cqi;top:18.7cqi;width:6.6cqi;height:1.35cqi;border-radius:.7cqi .7cqi .3cqi .3cqi;
  background:linear-gradient(180deg,#8a6a4a,#453222);
  box-shadow:inset 0 .3cqi 0 rgba(255,255,255,.18),0 .7cqi 1cqi rgba(0,0,0,.5)}
.lamp-shade{position:absolute;left:2.6cqi;top:4.2cqi;width:7.6cqi;height:4.6cqi;
  border-radius:4cqi 4cqi .8cqi .8cqi;transform:rotate(-14deg);
  background:linear-gradient(160deg,#3f7a68,#27544a);
  box-shadow:inset 0 .4cqi 0 rgba(255,255,255,.2),inset 0 -1.6cqi 1.2cqi rgba(0,0,0,.3),0 1cqi 1.6cqi rgba(0,0,0,.45);
  transition:filter .3s ease,transform .3s ease}
.lamp:hover .lamp-shade{filter:brightness(1.15);transform:rotate(-14deg) translateY(-.2cqi)}
.lamp-shade::after{content:"";position:absolute;left:8%;right:8%;bottom:.35cqi;height:.5cqi;border-radius:50%;
  background:rgba(255,214,150,.9);filter:blur(.2cqi);opacity:var(--bulbO);transition:opacity .9s ease}
.bulb-g{position:absolute;left:5.2cqi;top:7.6cqi;width:2.2cqi;height:2.2cqi;border-radius:50%;
  background:radial-gradient(circle,#fff3d8,rgba(255,214,140,.85) 40%,transparent 72%);
  filter:blur(.3cqi);opacity:var(--bulbO);transition:opacity .9s ease}

/* ============ pen cup ============ */
.cup{position:absolute;left:93.4cqi;top:35.4cqi;width:3.4cqi;height:4.6cqi;border-radius:.4cqi .4cqi .8cqi .8cqi;
  background:linear-gradient(180deg,#3f6b66,#274744);
  box-shadow:inset 0 .35cqi 0 rgba(255,255,255,.14),inset 0 -.5cqi .7cqi rgba(0,0,0,.35),0 .6cqi .9cqi rgba(0,0,0,.4)}
.cup::after{content:"";position:absolute;left:0;right:0;top:.9cqi;height:.5cqi;background:rgba(255,255,255,.08)}
.pencil{position:absolute;bottom:3.2cqi;width:.5cqi;height:3.6cqi;border-radius:.2cqi .2cqi 0 0;
  box-shadow:inset -.12cqi 0 .2cqi rgba(0,0,0,.3)}
.pencil.p1{left:94cqi;top:32.1cqi;background:#c05a4e;transform:rotate(-9deg)}
.pencil.p2{left:94.9cqi;top:31.7cqi;background:#d9b26a;transform:rotate(2deg);height:4cqi}
.pencil.p3{left:95.8cqi;top:32.3cqi;background:#8fa3c0;transform:rotate(10deg)}

/* ============ lighting overlays ============ */
.warm-glow{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:var(--warm);transition:opacity .9s ease;
  background:radial-gradient(46cqi 34cqi at 84cqi 27cqi,rgba(255,178,102,.34),rgba(255,158,80,.1) 46%,transparent 72%);
  mix-blend-mode:screen}
.cool-veil{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:var(--veilO);transition:opacity .9s ease;
  background:linear-gradient(180deg,rgba(8,12,26,.62),rgba(6,9,20,.7))}
.vignette{position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 42%,transparent 55%,rgba(4,6,12,.55) 100%)}

/* ============ colophon ============ */
.colophon{width:min(1020px,94vw);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hint{font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a9b1c2;
  display:flex;align-items:center;gap:10px}
.hint .sw{width:9px;height:9px;border-radius:50%;transition:background .5s ease,box-shadow .5s ease}
body.lamp-on .hint .sw{background:#ffb45e;box-shadow:0 0 10px rgba(255,180,94,.8)}
body:not(.lamp-on) .hint .sw{background:#39415a;box-shadow:0 0 6px rgba(120,150,220,.35)}
.meta{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:#5b6274}

/* ============ keyframes ============ */
@keyframes steamRise{
  0%{transform:translate(0,0) scaleX(.7);opacity:0}
  20%{opacity:.7}
  55%{transform:translate(-.7cqi,-4.6cqi) scaleX(1);opacity:.45}
  100%{transform:translate(.8cqi,-9cqi) scaleX(1.35);opacity:0}
}
@keyframes tailSway{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-11deg)}}
@keyframes haloPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shimmer{0%,100%{filter:brightness(.85)}50%{filter:brightness(1.3)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(38cqi)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes earTwitch{0%,88%,100%{transform:rotate(14deg)}92%{transform:rotate(2deg)}96%{transform:rotate(20deg)}}
@keyframes moonPulse{0%,100%{box-shadow:0 0 2.4cqi .7cqi rgba(246,232,190,.26)}50%{box-shadow:0 0 3.2cqi 1cqi rgba(246,232,190,.42)}}
@keyframes caret{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes coneFlicker{0%,100%{opacity:var(--coneO)}48%{opacity:calc(var(--coneO)*.9)}52%{opacity:var(--coneO)}86%{opacity:calc(var(--coneO)*.94)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:560px){
  .colophon{justify-content:center;text-align:center}
}
</style>
</head>
<body class="lamp-on">

<header class="masthead">
  <p class="kicker">pure css &middot; zero images &middot; zero svg</p>
  <h1>The <em>Night</em> Shift</h1>
</header>

<figure class="stage" id="stage" role="img"
  aria-label="Illustrated cozy desk at night: a glowing laptop, steaming coffee, a tail-swaying cat, a moonlit window, and a clickable desk lamp.">

  <!-- wall layer -->

    <i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i>
    <i class="bulb"></i><i class="bulb"></i><i class="bulb"></i>
  </div>

  <!-- floor -->
  <div class="floor-dark" aria-hidden="true"></div>
  <div class="floor-warm" aria-hidden="true"></div>

  <!-- desk layer -->
  <div class="layer layer-desk" aria-hidden="true">
    <div class="rug"></div>

<footer class="colophon">

  <p class="meta">html &middot; css &middot; three lines of js</p>
</footer>

<script>
  // lamp toggle
  const lamp = document.getElementById('lamp');
  lamp.addEventListener('click', () => {
    const on = document.body.classList.toggle('lamp-on');
    lamp.setAttribute('aria-pressed', String(on));
  });

  // live clock on the laptop menubar
  const clock = document.getElementById('clock');
  const tick = () => clock.textContent =
    new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  tick(); setInterval(tick, 10000);

  // whisper of parallax
  const stage = document.getElementById('stage');
  if (matchMedia('(pointer:fine)').matches &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    stage.addEventListener('pointermove', e => {
      const r = stage.getBoundingClientRect();
      stage.style.setProperty('--px', ((e.clientX - r.left) / r.width - .5) * .9 + 'cqi');
      stage.style.setProperty('--py', ((e.clientY - r.top) / r.height - .5) * .7 + 'cqi');
    });
    stage.addEventListener('pointerleave', () => {
      stage.style.setProperty('--px', '0cqi');
      stage.style.setProperty('--py', '0cqi');
    });
  }
</script>
