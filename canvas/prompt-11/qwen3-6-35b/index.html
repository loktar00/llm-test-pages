<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Isometric Terrain</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="terrainCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('terrainCanvas');
            const ctx = canvas.getContext('2d');
            const size = 256;
            
            // Configuration
            const VERTICAL_EXAGGERATION = 18;
            const HORIZONTAL_SCALE = 3.0; // Width of the diamond in pixels
            const ROW_STEP = 2; // Vertical step between rows in pixels
            const START_Y_OFFSET = 150; // Offset from top of screen
            const START_X_OFFSET = 0; // Centering handled in draw loop

            let heightmap = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                generateAndRender();
            }

            function generateHeightmap() {
                // Initialize square array
                const n = size;
                const grid = new Array(n);
                for (let i = 0; i < n; i++) {
                    grid[i] = new Array(n);
                }

                // Fill corners
                grid[0][0] = Math.random();
                grid[0][n-1] = Math.random();
                grid[n-1][0] = Math.random();
                grid[n-1][n-1] = Math.random();

                let roughness = 1.0;
                let range = 1.0;

                let step = n - 1;
                while (step > 1) {
                    let half = Math.floor(step / 2);

                    // Diamond Step
                    for (let y = 0; y < n - 1; y += step) {
                        for (let x = 0; x < n - 1; x += step) {
                            let avg = (grid[y][x] + grid[y][x + step] + grid[y + step][x] + grid[y + step][x + step]) / 4;
                            grid[y + half][x + half] = avg + (Math.random() * 2 - 1) * range;
                        }
                    }

                    // Square Step
                    for (let y = 0; y < n - 1; y += half) {
                        for (let x = (y + half) % step; x < n - 1; x += step) {
                            let count = 0;
                            let val = 0;
                            if (y >= half) { val += grid[y - half][x]; count++; }
                            if (y + half < n) { val += grid[y + half][x]; count++; }
                            if (x >= half) { val += grid[y][x - half]; count++; }
                            if (x + half < n) { val += grid[y][x + half]; count++; }
                            grid[y][x] = val / count + (Math.random() * 2 - 1) * range;
                        }
                    }

                    step = half;
                    range *= 0.5; // Decay factor
                }

                // Normalize to 0-1
                let min = 1.0;
                let max = 0.0;
                for (let y = 0; y < n; y++) {
                    for (let x = 0; x < n; x++) {
                        if (grid[y][x] < min) min = grid[y][x];
                        if (grid[y][x] > max) max = grid[y][x];
                    }
                }
                
                const rangeTotal = max - min;
                heightmap = new Array(n);
                for (let y = 0; y < n; y++) {
                    heightmap[y] = new Float32Array(n);
                    for (let x = 0; x < n; x++) {
                        heightmap[y][x] = (grid[y][x] - min) / rangeTotal;
                    }
                }
            }

            function getTerrainColor(h, y, x) {
                // Calculate basic slope/lighting based on neighbor height difference
                // Simple Sobel approximation for lighting
                let dh = 0;
                if (y > 0 && y < size - 1 && x > 0 && x < size - 1) {
                    dh = heightmap[y+1][x] - heightmap[y-1][x] + heightmap[y][x+1] - heightmap[y][x-1];
                    // Normalize lighting slightly
                    dh = dh * 0.2; 
                }

                let baseColor;
                if (h < 0.30) {
                    // Deep Water
                    baseColor = [0, 20, 60];
                } else if (h < 0.38) {
                    // Shallow Water
                    baseColor = [0, 80, 150];
                } else if (h < 0.43) {
                    // Beach/Sand
                    baseColor = [210, 190, 140];
                } else if (h < 0.60) {
                    // Grass
                    baseColor = [34, 139, 34];
                } else if (h < 0.78) {
                    // Hills
                    baseColor = [101, 67, 33];
                } else if (h < 0.90) {
                    // Rocky
                    baseColor = [105, 105, 105];
                } else {
                    // Snow
                    baseColor = [255, 255, 255];
                }

                // Apply lighting
                let r = Math.min(255, Math.max(0, baseColor[0] * (1 + dh)));
                let g = Math.min(255, Math.max(0, baseColor[1] * (1 + dh)));
                let b = Math.min(255, Math.max(0, baseColor[2] * (1 + dh)));

                return `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
            }

            function generateAndRender() {
                generateHeightmap();
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Sky
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, "#87CEEB"); // Sky Blue
                gradient.addColorStop(1, "#E0F6FF"); // Lighter Blue
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Center the terrain
                const totalWidthPixels = size * HORIZONTAL_SCALE;
                const startX = (canvas.width - totalWidthPixels) / 2;
                const currentBaselineY = START_Y_OFFSET;

                // Draw row by row (back to front)
                // We use a simple painter's algorithm where rows are stacked vertically
                // to simulate depth.
                
                for (let y = 0; y < size; y++) {
                    // Calculate screen Y for this row baseline
                    // The offset increases as y increases (moving "down" the map)
                    const rowY = currentBaselineY + (y * ROW_STEP);

                    for (let x = 0; x < size; x++) {
                        const h = heightmap[y][x];
                        
                        // Calculate height in pixels based on vertical exaggeration
                        const hPx = h * VERTICAL_EXAGGERATION;
                        
                        // Calculate screen X
                        // Isometric logic: X moves left to right on screen
                        const screenX = startX + (x * HORIZONTAL_SCALE);
                        const screenY = rowY - hPx;

                        // Draw the column/line
                        ctx.fillStyle = getTerrainColor(h, y, x);
                        
                        // Optimization: Draw small rectangles instead of lines for better fill
                        // Width is 1 (or HORIZONTAL_SCALE) to avoid gaps
                        ctx.fillRect(screenX, screenY, HORIZONTAL_SCALE, (rowY - screenY) + 1);
                    }
                }
            }

            window.addEventListener('resize', resize);
            resize();
        })();
    </script>
</body>
</html>
