<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-mid: #1e293b;
            --text-main: #f8fafc;
            --moon-color: #fef08a;
            --moon-shadow: #fde047;
            --accent: #38bdf8;
            --glow-color: rgba(56, 189, 248, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- Starfield Background --- */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- Main Content --- */
        .content {
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* --- The 404 Typography --- */
        .headline {
            font-size: clamp(8rem, 25vw, 18rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-shadow: 0 0 20px var(--glow-color);
            animation: breathe 4s ease-in-out infinite;
            position: relative;
        }

        @keyframes breathe {
            0%, 100% { text-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
            50% { text-shadow: 0 0 40px rgba(56, 189, 248, 0.6), 0 0 80px rgba(56, 189, 248, 0.2); }
        }

        /* --- The Moon (Zero) --- */
        .moon-container {
            position: relative;
            width: 0.85em;
            height: 0.85em;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0.05em;
        }

        .moon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--moon-color), var(--moon-shadow));
            box-shadow: 
                inset -15px -15px 20px rgba(0,0,0,0.1),
                0 0 30px rgba(254, 240, 138, 0.3);
            position: relative;
            z-index: 2;
        }

        /* Craters */
        .moon::after, .moon::before {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(0,0,0,0.05);
        }
        .moon::before { width: 20%; height: 20%; top: 20%; left: 25%; }
        .moon::after { width: 10%; height: 10%; top: 60%; left: 60%; }

        /* --- The Satellite Orbit --- */
        .orbit-system {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140%;
            height: 140%;
            transform: translate(-50%, -50%) rotateX(70deg); /* Tilt the orbit */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: spin-orbit 10s linear infinite;
            z-index: 1;
        }

        .satellite {
            position: absolute;
            top: 0;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            transform: translate(-50%, -50%);
            /* Counter-rotate so the satellite stays "upright" relative to screen if desired, 
               or let it spin with the orbit for a flat look. Let's keep it flat in the orbit plane. */
        }

        /* Solar panels for the satellite */
        .satellite::before, .satellite::after {
            content: '';
            position: absolute;
            top: 50%;
            height: 4px;
            width: 6px;
            background: #4a5568;
            transform: translateY(-50%);
        }
        .satellite::before { left: -8px; }
        .satellite::after { right: -8px; }

        @keyframes spin-orbit {
            0% { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg); }
            100% { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); }
        }

        /* --- Text & Button --- */
        .message {
            font-size: 1.25rem;
            font-weight: 300;
            opacity: 0.9;
            max-width: 400px;
            line-height: 1.5;
            color: #94a3b8;
        }

        .btn-home {
            position: relative;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--bg-deep);
            background: var(--text-main);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-home:active {
            transform: translateY(0);
        }

        /* The Glint Effect */
        .btn-home::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: skewX(-25deg);
            transition: none;
        }

        .btn-home:hover::after {
            animation: glint 0.7s ease-in-out;
        }

        @keyframes glint {
            0% { left: -100%; }
            100% { left: 200%; }
        }

    </style>
</head>
<body>

    <div id="starfield"></div>

    <div class="content">
        <div class="headline">
            4
            <div class="moon-container">
                <div class="moon"></div>
                <div class="orbit-system">
                    <div class="satellite"></div>
                </div>
            </div>
            4
        </div>
        
        <p class="message">
            Looks like you've drifted a bit too far off course. 
            There's nothing here but void and vacuum.
        </p>

        <a href="/" class="btn-home">Take Me Home</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const starfield = document.getElementById('starfield');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random positioning
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // Random size (mostly small)
                const size = Math.random() < 0.9 ? Math.random() * 2 + 1 : Math.random() * 3 + 2;
                
                // Random animation properties
                const duration = Math.random() * 3 + 2; // 2s to 5s
                const delay = Math.random() * 5;

                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--delay', `${delay}s`);

                starfield.appendChild(star);
            }
        });
    </script>
</body>
</html>
