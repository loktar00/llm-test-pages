<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Physarum // Slime Mold — Live Culture</title>
<style>
  :root{
    --amber:#ffb84d;
    --amber2:#ffd97a;
    --hot:#fff3d6;
    --ink:#e8e0d0;
    --dim:#8a7f6a;
    --bg:#060402;
    --mono:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;
    --disp:'Avenir Next Condensed','Helvetica Neue Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  canvas#view{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none;z-index:0}
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%, transparent 52%, rgba(0,0,0,.38) 82%, rgba(0,0,0,.62) 100%);}
  #frame{position:fixed;inset:10px;z-index:3;pointer-events:none;border:1px solid rgba(255,184,77,.10);transition:opacity .4s}
  #frame::before,#frame::after{content:'';position:absolute;width:15px;height:15px;border:1px solid rgba(255,184,77,.55)}
  #frame::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  #frame::after{bottom:-1px;right:-1px;border-left:none;border-top:none}

  /* ---------- HUD ---------- */
  #hud-top{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 26px;pointer-events:none;transition:opacity .4s}
  .eyebrow{font:600 9px/1 var(--mono);letter-spacing:.24em;color:var(--dim);display:flex;align-items:center}
  .eyebrow i{font:italic 10px Georgia,'Times New Roman',serif;color:#cbb98f;letter-spacing:.03em;text-transform:none}
  .dot{width:6px;height:6px;background:var(--amber);border-radius:50%;display:inline-block;margin-right:8px;animation:beat 2.1s infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,184,77,.55)}70%{box-shadow:0 0 0 9px rgba(255,184,77,0)}100%{box-shadow:0 0 0 0 rgba(255,184,77,0)}}
  h1{font-family:var(--disp);font-weight:900;font-size:clamp(26px,3.6vw,44px);line-height:1;letter-spacing:.045em;margin-top:9px;color:var(--hot);text-shadow:0 0 22px rgba(255,150,40,.18)}
  h1 .slash{color:var(--amber);font-weight:400;margin:0 .14em;animation:slashPulse 3.4s ease-in-out infinite}
  @keyframes slashPulse{0%,100%{opacity:.5;text-shadow:0 0 5px rgba(255,184,77,.35)}50%{opacity:1;text-shadow:0 0 15px rgba(255,184,77,.95)}}
  h1 .l2{color:rgba(255,200,110,.35)}
  @supports (-webkit-text-stroke:1px #fff){
    h1 .l2{color:transparent;-webkit-text-stroke:1px rgba(255,196,100,.85)}
  }
  .sub{font:500 9.5px/1.5 var(--mono);letter-spacing:.10em;color:var(--dim);margin-top:8px}
  #status{font:700 10.5px/1 var(--mono);letter-spacing:.07em;color:var(--amber2);margin-top:11px;min-height:12px}
  #status.flash{animation:statusIn .55s cubic-bezier(.2,.8,.2,1)}
  @keyframes statusIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

  .stats{display:flex}
  .stat{display:flex;flex-direction:column;align-items:flex-end;padding:2px 0 2px 16px;border-left:1px solid rgba(255,184,77,.18)}
  .stat span{font:700 21px/1 var(--mono);color:var(--amber2);text-shadow:0 0 12px rgba(255,184,77,.25);transition:color .3s}
  .stat span.warn{color:#ff6a4d;text-shadow:0 0 12px rgba(255,90,60,.35)}
  .stat label{font:600 8px/1 var(--mono);letter-spacing:.22em;color:var(--dim);margin-top:6px}

  /* ---------- panel ---------- */
  #panel{position:fixed;left:18px;bottom:18px;width:254px;z-index:5;background:rgba(12,9,6,.85);border:1px solid rgba(255,184,77,.22);box-shadow:0 10px 34px rgba(0,0,0,.65);opacity:0;animation:riseUp .7s .65s cubic-bezier(.2,.7,.2,1) forwards;transition:opacity .4s}
  #panelToggle{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;font:700 9.5px var(--mono);letter-spacing:.2em;color:var(--amber2);padding:11px 14px;transition:background .18s}
  #panelToggle:hover{background:rgba(255,184,77,.08)}
  #panelToggle .chev{display:inline-block;margin-right:7px;transition:transform .3s}
  #panel.closed .chev{transform:rotate(-90deg)}
  #panelBody{padding:2px 14px 14px;max-height:440px;overflow:hidden;transition:max-height .35s ease,padding .35s ease,opacity .28s}
  #panel.closed #panelBody{max-height:0;padding-top:0;padding-bottom:0;opacity:0}
  .ctl{margin:10px 0 2px}
  .ctl label{display:flex;justify-content:space-between;align-items:baseline;font:600 9px/1 var(--mono);letter-spacing:.16em;color:var(--dim);margin-bottom:4px}
  .ctl output{font:700 10px var(--mono);letter-spacing:.05em;color:var(--amber2)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(255,184,77,.28)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;background:#0c0906;border:1.5px solid var(--amber);transition:background .18s,box-shadow .18s}
  input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus::-webkit-slider-thumb{background:var(--amber);box-shadow:0 0 10px rgba(255,184,77,.85)}
  input[type=range]::-moz-range-track{height:2px;background:rgba(255,184,77,.28)}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:0;background:#0c0906;border:1.5px solid var(--amber)}
  input[type=range]:hover::-moz-range-thumb{background:var(--amber);box-shadow:0 0 10px rgba(255,184,77,.85)}
  .btnrow{display:flex;gap:7px;margin-top:14px}
  .act{flex:1;font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--amber2);background:rgba(255,184,77,.06);border:1px solid rgba(255,184,77,.35);padding:9px 0;cursor:pointer;transition:all .18s}
  .act:hover{background:var(--amber);color:#140b02;box-shadow:0 0 16px rgba(255,184,77,.45)}
  .act:active{transform:translateY(1px)}

  #hints{position:fixed;right:20px;bottom:18px;z-index:4;text-align:right;font:500 9.5px/1.9 var(--mono);letter-spacing:.08em;color:var(--dim);pointer-events:none;opacity:0;animation:rise .8s .95s forwards;transition:opacity .4s}
  #hints b{color:var(--amber2);font-weight:700}

  .zen #hud-top,.zen #panel,.zen #hints,.zen #frame{opacity:0!important;pointer-events:none!important}

  .brand>*{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  .brand>*:nth-child(1){animation-delay:.15s}
  .brand>*:nth-child(2){animation-delay:.28s}
  .brand>*:nth-child(3){animation-delay:.42s}
  .brand>*:nth-child(4){animation-delay:.56s}
  .stats{opacity:0;animation:rise .7s .5s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes riseUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  @media (max-width:760px){
    .sub,#hints{display:none}
    #hud-top{padding:16px}
    #panel{width:212px;left:12px;bottom:12px}
    .stat:nth-child(n+4){display:none}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>
<div id="frame"></div>

<header id="hud-top">
  <div class="brand">
    <div class="eyebrow"><span class="dot"></span>LIVE CULTURE — <i>&nbsp;Physarum polycephalum</i>&nbsp; · VEIN MORPHOGENESIS ASSAY</div>
    <h1><span class="l1">SLIME</span><span class="slash">//</span><span class="l2">MOLD</span></h1>
    <div class="sub">tens of thousands of agents · deposit → sense → steer · reaction–diffusion trail map</div>
    <div id="status">» initializing incubator</div>
  </div>
  <div class="stats">
    <div class="stat"><span id="stFps">—</span><label>FPS</label></div>
    <div class="stat"><span id="stMs">—</span><label>MS</label></div>
    <div class="stat"><span id="stAgents">—</span><label>AGENTS</label></div>
    <div class="stat"><span id="stGrid">—</span><label>GRID</label></div>
    <div class="stat"><span id="stFoods">—</span><label>SOURCES</label></div>
  </div>
</header>

<section id="panel">
  <button id="panelToggle" title="collapse / expand"><span class="chev">▾</span>MORPHOGENESIS CONTROLS</button>
  <div id="panelBody">
    <div class="ctl"><label><span>AGENTS</span><output id="oAgents">24k</output></label><input id="sAgents" type="range" min="4000" max="60000" step="2000" value="24000"></div>
    <div class="ctl"><label><span>SENSOR ∠</span><output id="oSA">24°</output></label><input id="sSA" type="range" min="6" max="70" step="1" value="24"></div>
    <div class="ctl"><label><span>SENSOR DIST</span><output id="oSD">12px</output></label><input id="sSD" type="range" min="4" max="28" step="1" value="12"></div>
    <div class="ctl"><label><span>TURN RATE</span><output id="oTurn">40°</output></label><input id="sTurn" type="range" min="10" max="90" step="1" value="40"></div>
    <div class="ctl"><label><span>STEP SIZE</span><output id="oStep">1.6</output></label><input id="sStep" type="range" min="0.4" max="3" step="0.1" value="1.6"></div>
    <div class="ctl"><label><span>DEPOSIT</span><output id="oDep">0.32</output></label><input id="sDep" type="range" min="0.05" max="1" step="0.01" value="0.32"></div>
    <div class="ctl"><label><span>EVAPORATION</span><output id="oDec">0.955</output></label><input id="sDec" type="range" min="0.900" max="0.990" step="0.001" value="0.955"></div>
    <div class="ctl"><label><span>DIFFUSION</span><output id="oDif">0.90</output></label><input id="sDif" type="range" min="0" max="1" step="0.05" value="0.9"></div>
    <div class="btnrow">
      <button class="act" id="btnPause" title="space">PAUSE</button>
      <button class="act" id="btnSeed" title="r">RESEED</button>
      <button class="act" id="btnScatter" title="s">SCATTER</button>
    </div>
  </div>
</section>

<div id="hints"><b>click</b> drop nutrient · <b>shift+click</b> shock · <b>space</b> pause<br><b>s</b> scatter · <b>r</b> reseed · <b>h</b> interface</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('view');
const ctx = canvas.getContext('2d', { alpha:false });

/* ================= state ================= */
const MAX_AGENTS = 60000;
const AX = new Float32Array(MAX_AGENTS);
const AY = new Float32Array(MAX_AGENTS);
const AA = new Float32Array(MAX_AGENTS);

const P = { agents:24000, sensorAngle:24, sensorDist:12, turn:40, step:1.6, deposit:0.32, decay:0.955, diffuse:0.9 };
let count = 0;

let cssW=0, cssH=0, dpr=1;
let simW=0, simH=0, gw=0, gh=0;
let m0, m1, mtmp;                 // trail buffers (padded Float32 grids)
let simCv, simCx, simImg, sim32;  // sim-resolution render target
let b1, b1x, b2, b2x;             // bloom mip chain
let foodR = 10;
const EXPOSURE = 80;

const foods = [], pulses = [], shocks = [];
const pointer = { x:0, y:0, lastT:-99, inside:false };
let paused = false;

/* ============ two-tone glow LUT (amber → yellow → white-hot) ============ */
const LUT = new Uint32Array(256);
{
  const stops = [
    [0.00,   0,  0,  0],
    [0.12,  24,  8,  2],
    [0.36, 104, 40,  4],
    [0.60, 214,112, 10],
    [0.80, 255,190, 56],
    [1.00, 255,247,214]
  ];
  for (let i=0;i<256;i++){
    const t = i/255;
    let a = stops[0], b = stops[stops.length-1];
    for (let s=0; s<stops.length-1; s++){
      if (t >= stops[s][0] && t <= stops[s+1][0]) { a = stops[s]; b = stops[s+1]; break; }
    }
    const f = (b[0]===a[0]) ? 0 : (t-a[0])/(b[0]-a[0]);
    const r = (a[1]+(b[1]-a[1])*f)|0;
    const g = (a[2]+(b[2]-a[2])*f)|0;
    const bl= (a[3]+(b[3]-a[3])*f)|0;
    LUT[i] = (255<<24) | (bl<<16) | (g<<8) | r;
  }
}

/* ================= canvas / grid setup ================= */
function setupCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = window.innerWidth; cssH = window.innerHeight;
  canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';

  const budget = 460000;                       // sim cells budget → keeps 60fps
  let s = Math.sqrt(budget/(cssW*cssH));
  s = Math.max(0.25, Math.min(0.6, s));
  simW = Math.max(180, Math.round(cssW*s));
  simH = Math.max(120, Math.round(cssH*s));
  gw = simW+2; gh = simH+2;                    // 1-cell padding = branchless blur
  const n = gw*gh;
  m0 = new Float32Array(n); m1 = new Float32Array(n); mtmp = new Float32Array(n);

  simCv = document.createElement('canvas'); simCv.width = simW; simCv.height = simH;
  simCx = simCv.getContext('2d');
  simImg = simCx.createImageData(simW, simH);
  sim32 = new Uint32Array(simImg.data.buffer);

  const bw = Math.max(2,(simW/3)|0), bh = Math.max(2,(simH/3)|0);
  b1 = document.createElement('canvas'); b1.width=bw; b1.height=bh; b1x=b1.getContext('2d');
  b2 = document.createElement('canvas'); b2.width=Math.max(2,(bw/3)|0); b2.height=Math.max(2,(bh/3)|0); b2x=b2.getContext('2d');

  foodR = Math.max(6, Math.round(simW*0.013));
}

/* ================= seeding ================= */
const clampX = v => v<1 ? 1 : (v>simW ? simW : v);
const clampY = v => v<1 ? 1 : (v>simH ? simH : v);

function seedAgents(){
  const cx = simW*0.5, cy = simH*0.5, R = Math.min(simW,simH)*0.35;
  for (let i=0;i<count;i++){
    const t = Math.random()*6.28318;
    const r = R*(0.85+Math.random()*0.3);
    AX[i] = clampX(cx+Math.cos(t)*r);
    AY[i] = clampY(cy+Math.sin(t)*r);
    AA[i] = t+Math.PI+(Math.random()-0.5)*0.5;   // facing inward → dramatic collapse
  }
}
function setCount(n){
  n |= 0;
  if (n > count){
    for (let i=count;i<n;i++){
      const f = foods.length ? foods[(Math.random()*foods.length)|0] : null;
      const bx = f ? f.dx : simW*0.5, by = f ? f.dy : simH*0.5;
      const a = Math.random()*6.28318, r = Math.random()*simW*0.05;
      AX[i] = clampX(bx+Math.cos(a)*r);
      AY[i] = clampY(by+Math.sin(a)*r);
      AA[i] = Math.random()*6.28318;
    }
  }
  count = n;
}
function seedFoods(n){
  foods.length = 0;
  const m = 0.12;
  for (let i=0;i<n;i++){
    const x = simW*(m+Math.random()*(1-2*m));
    const y = simH*(m+Math.random()*(1-2*m));
    foods.push({
      x, y, dx:x, dy:y,
      tx: simW*(m+Math.random()*(1-2*m)),
      ty: simH*(m+Math.random()*(1-2*m)),
      timer: 5+Math.random()*9,
      phase: Math.random()*6.28318
    });
  }
}

/* ================= simulation ================= */
function stamp(cx, cy, r, inten){
  const x0 = Math.max(1,(cx-r)|0), x1 = Math.min(simW, Math.ceil(cx+r));
  const y0 = Math.max(1,(cy-r)|0), y1 = Math.min(simH, Math.ceil(cy+r));
  const r2 = r*r, map = m0;
  for (let y=y0;y<=y1;y++){
    const dy = y-cy;
    let i = y*gw+x0;
    for (let x=x0;x<=x1;x++,i++){
      const dx = x-cx, d2 = dx*dx+dy*dy;
      if (d2 < r2){ const q = 1-d2/r2; map[i] += inten*q*q; }
    }
  }
}

function stepAgents(dt60){
  const map = m0, W = simW, H = simH, G = gw;
  const SA = P.sensorAngle*0.0174533;
  const SD = P.sensorDist;
  const RA = P.turn*0.0174533*dt60;
  const SS = P.step*dt60;
  const dep = P.deposit;
  const cA = Math.cos(SA), sA = Math.sin(SA);
  for (let i=0;i<count;i++){
    const x = AX[i], y = AY[i];
    let a = AA[i];
    const ca = Math.cos(a), sa = Math.sin(a);
    // three chemo-sensors (left/right via rotation identities — 2 trig calls total)
    let fx = x+ca*SD;       if (fx<1) fx=1; else if (fx>W) fx=W;
    let fy = y+sa*SD;       if (fy<1) fy=1; else if (fy>H) fy=H;
    const cl = ca*cA-sa*sA, sl = sa*cA+ca*sA;
    const cr = ca*cA+sa*sA, sr = sa*cA-ca*sA;
    let lx = x+cl*SD;       if (lx<1) lx=1; else if (lx>W) lx=W;
    let ly = y+sl*SD;       if (ly<1) ly=1; else if (ly>H) ly=H;
    let rx = x+cr*SD;       if (rx<1) rx=1; else if (rx>W) rx=W;
    let ry = y+sr*SD;       if (ry<1) ry=1; else if (ry>H) ry=H;
    const F = map[(fy|0)*G+(fx|0)];
    const L = map[(ly|0)*G+(lx|0)];
    const R = map[(ry|0)*G+(rx|0)];
    // steer toward strongest deposit
    if (F > L && F > R)      { /* hold heading */ }
    else if (F < L && F < R) { a += (Math.random()*2-1)*RA; }
    else if (L > R)          { a += RA; }
    else if (R > L)          { a -= RA; }
    else                     { a += (Math.random()*2-1)*RA; }
    a += (Math.random()-0.5)*0.1;
    const nca = Math.cos(a), nsa = Math.sin(a);
    let nx = x+nca*SS, ny = y+nsa*SS;
    if (nx<1){ nx=1; a=Math.PI-a+(Math.random()-0.5)*0.3; } else if (nx>W){ nx=W; a=Math.PI-a+(Math.random()-0.5)*0.3; }
    if (ny<1){ ny=1; a=-a+(Math.random()-0.5)*0.3; }       else if (ny>H){ ny=H; a=-a+(Math.random()-0.5)*0.3; }
    AX[i]=nx; AY[i]=ny; AA[i]=a;
    map[(ny|0)*G+(nx|0)] += dep;               // deposit pheromone
  }
}

/* separable 3×3 box blur + evaporative decay, branchless via padding */
function diffuse(src, tmp, dst, decay, damp){
  const W = simW, H = simH, G = gw;
  for (let y=1;y<=H;y++){
    let i = y*G+1;
    for (let x=1;x<=W;x++,i++){
      tmp[i] = (src[i-1]+src[i]+src[i+1])*0.333333;
    }
  }
  for (let y=1;y<=H;y++){
    let i = y*G+1;
    for (let x=1;x<=W;x++,i++){
      const blur = (tmp[i-G]+tmp[i]+tmp[i+G])*0.333333;
      const c = src[i];
      dst[i] = (c+(blur-c)*damp)*decay;
    }
  }
}

function updateFoods(dt60){
  const m = 0.1, k = 0.012*dt60;
  for (const f of foods){
    f.timer -= dt60/60;
    if (f.timer <= 0){
      f.timer = 7+Math.random()*9;
      f.tx = simW*(m+Math.random()*(1-2*m));
      f.ty = simH*(m+Math.random()*(1-2*m));
      setStatus('nutrient drift detected — network remodeling');
    }
    f.x += (f.tx-f.x)*k;
    f.y += (f.ty-f.y)*k;
    f.phase += 0.015*dt60;
    f.dx = f.x + Math.sin(f.phase)*2.5;
    f.dy = f.y + Math.cos(f.phase*0.9)*2.5;
  }
}

/* ================= render ================= */
function render(map, t){
  let p = 0;
  for (let y=1;y<=simH;y++){
    let i = y*gw+1;
    for (let x=1;x<=simW;x++,i++,p++){
      let v = map[i]*EXPOSURE; if (v>255) v=255;
      sim32[p] = LUT[v|0];
    }
  }
  simCx.putImageData(simImg,0,0);
  b1x.drawImage(simCv,0,0,b1.width,b1.height);
  b2x.drawImage(b1,0,0,b2.width,b2.height);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(simCv,0,0,cssW,cssH);
  ctx.globalCompositeOperation='lighter';               // additive bloom
  ctx.globalAlpha=0.55; ctx.drawImage(b1,0,0,cssW,cssH);
  ctx.globalAlpha=0.40; ctx.drawImage(b2,0,0,cssW,cssH);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  drawMarkers(t);
}

function drawMarkers(t){
  const kx = cssW/simW, ky = cssH/simH;
  ctx.lineWidth = 1;
  ctx.setLineDash([2,5]);
  ctx.strokeStyle = 'rgba(255,190,90,0.14)';
  for (const f of foods){
    ctx.beginPath(); ctx.moveTo(f.dx*kx,f.dy*ky); ctx.lineTo(f.tx*kx,f.ty*ky); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const f of foods){
    const sx=f.dx*kx, sy=f.dy*ky;
    const pr = 6+Math.sin(t*2.2+f.phase)*1.8;
    ctx.strokeStyle='rgba(255,205,110,0.8)';
    ctx.beginPath(); ctx.arc(sx,sy,pr,0,6.28318); ctx.stroke();
    ctx.fillStyle='rgba(255,236,190,0.95)';
    ctx.beginPath(); ctx.arc(sx,sy,1.6,0,6.28318); ctx.fill();
  }
  if (pointer.inside){
    const fade = Math.max(0, 1-(t-pointer.lastT)/1.5);
    if (fade>0){
      ctx.strokeStyle=`rgba(255,220,150,${0.35*fade})`;
      ctx.beginPath(); ctx.arc(pointer.x*kx,pointer.y*ky,14+Math.sin(t*4)*2,0,6.28318); ctx.stroke();
    }
  }
  for (let i=pulses.length-1;i>=0;i--){
    const p=pulses[i]; p.age+=0.022;
    if (p.age>=1){ pulses.splice(i,1); continue; }
    ctx.strokeStyle=`rgba(255,210,120,${0.5*(1-p.age)})`;
    ctx.beginPath(); ctx.arc(p.x*kx,p.y*ky,8+p.age*46,0,6.28318); ctx.stroke();
  }
  for (let i=shocks.length-1;i>=0;i--){
    const s=shocks[i]; s.age+=0.028;
    if (s.age>=1){ shocks.splice(i,1); continue; }
    const r=s.age*Math.max(60,simW*0.1), al=1-s.age;
    ctx.lineWidth=1.5;
    ctx.strokeStyle=`rgba(255,120,70,${0.55*al})`;
    ctx.beginPath(); ctx.arc(s.x*kx,s.y*ky,r,0,6.28318); ctx.stroke();
    ctx.strokeStyle=`rgba(255,220,150,${0.3*al})`;
    ctx.beginPath(); ctx.arc(s.x*kx,s.y*ky,r*0.7,0,6.28318); ctx.stroke();
    ctx.lineWidth=1;
  }
}

/* ================= interactions ================= */
function shockAt(sx,sy){
  const R = Math.max(24, simW*0.075), R2=R*R;
  const x0=Math.max(1,(sx-R)|0), x1=Math.min(simW,Math.ceil(sx+R));
  const y0=Math.max(1,(sy-R)|0), y1=Math.min(simH,Math.ceil(sy+R));
  for (let y=y0;y<=y1;y++){
    let i=y*gw+x0;
    for (let x=x0;x<=x1;x++,i++){
      const dx=x-sx, dy=y-sy;
      if (dx*dx+dy*dy<R2) m0[i]=0;
    }
  }
  for (let i=0;i<count;i++){
    const dx=AX[i]-sx, dy=AY[i]-sy;
    if (dx*dx+dy*dy<R2*1.44) AA[i]=Math.random()*6.28318;
  }
  shocks.push({x:sx,y:sy,age:0});
  setStatus('cytoplasmic shock — agents dispersed');
}
function relocateFood(sx,sy){
  let f = foods[0];
  for (const g of foods) if (g.timer < f.timer) f = g;
  f.x = f.tx = sx; f.y = f.ty = sy;
  f.timer = 8+Math.random()*8;
  pulses.push({x:sx,y:sy,age:0});
  setStatus('nutrient placed — foragers rerouting');
}
function scatterFoods(){
  const m=0.1;
  for (const f of foods){
    f.x=f.tx=simW*(m+Math.random()*(1-2*m));
    f.y=f.ty=simH*(m+Math.random()*(1-2*m));
    f.timer=7+Math.random()*9;
    pulses.push({x:f.x,y:f.y,age:0});
  }
  setStatus('nutrients scattered — network reforming');
}
function reseed(){
  m0.fill(0); m1.fill(0); mtmp.fill(0);
  seedFoods(foods.length||6);
  seedAgents();
  pulses.length=0; shocks.length=0;
  setStatus('culture re-inoculated — morphogenesis restarting');
}
function setPaused(v){
  paused=v;
  $('btnPause').textContent = paused?'RESUME':'PAUSE';
  setStatus(paused?'simulation paused':'simulation resumed');
}

const statusEl = $('status');
function setStatus(msg){
  statusEl.textContent = '» '+msg;
  statusEl.classList.remove('flash');
  void statusEl.offsetWidth;
  statusEl.classList.add('flash');
}

/* pointer */
function setPointerFrom(e){
  pointer.x = e.clientX*simW/cssW;
  pointer.y = e.clientY*simH/cssH;
  pointer.lastT = performance.now()/1000;
  pointer.inside = true;
}
window.addEventListener('pointermove', setPointerFrom);
document.addEventListener('pointerleave', ()=>{ pointer.inside=false; });
canvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  setPointerFrom(e);
  const sx = pointer.x, sy = pointer.y;
  if (e.shiftKey || e.button===2) shockAt(sx,sy);
  else relocateFood(sx,sy);
});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* keys */
window.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.code==='Space'){ e.preventDefault(); setPaused(!paused); }
  else if (e.code==='KeyR') reseed();
  else if (e.code==='KeyS') scatterFoods();
  else if (e.code==='KeyH') document.body.classList.toggle('zen');
});

/* ================= UI wiring ================= */
function bind(sid,oid,key,fmt,apply){
  const el=$(sid), out=$(oid);
  const upd=()=>{ const v=+el.value; P[key]=v; out.textContent=fmt(v); if (apply) apply(v); };
  el.addEventListener('input',upd); upd();
}
$('btnPause').addEventListener('click', e=>{ setPaused(!paused); e.target.blur(); });
$('btnSeed').addEventListener('click', e=>{ reseed(); e.target.blur(); });
$('btnScatter').addEventListener('click', e=>{ scatterFoods(); e.target.blur(); });
$('panelToggle').addEventListener('click', e=>{ $('panel').classList.toggle('closed'); e.currentTarget.blur(); });

/* resize (debounced) — rescales culture into new grid */
let rzT;
window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{
  const ox=simW, oy=simH;
  setupCanvas();
  const rx=simW/ox, ry=simH/oy;
  for (let i=0;i<count;i++){ AX[i]*=rx; AY[i]*=ry; }
  for (const f of foods){ f.x*=rx; f.y*=ry; f.tx*=rx; f.ty*=ry; f.dx*=rx; f.dy*=ry; }
  pulses.length=0; shocks.length=0;
  setStatus('viewport remapped — culture recalibrating');
},180); });

/* ================= boot ================= */
setupCanvas();
bind('sAgents','oAgents','agents', v=>(v/1000)+'k', v=>setCount(v));
bind('sSA','oSA','sensorAngle', v=>v+'°');
bind('sSD','oSD','sensorDist', v=>v+'px');
bind('sTurn','oTurn','turn', v=>v+'°');
bind('sStep','oStep','step', v=>v.toFixed(1));
bind('sDep','oDep','deposit', v=>v.toFixed(2));
bind('sDec','oDec','decay', v=>v.toFixed(3));
bind('sDif','oDif','diffuse', v=>v.toFixed(2));

seedFoods(6);
seedAgents();

/* pre-warm so veins are already alive at first paint */
for (let k=0;k<18;k++){
  for (const f of foods) stamp(f.x,f.y,foodR,0.5);
  stepAgents(1);
  diffuse(m0,mtmp,m1,P.decay,P.diffuse);
  const t=m0; m0=m1; m1=t;
}
setStatus('culture inoculated — network forming');

/* ================= main loop ================= */
let last = performance.now(), fpsE = 60, msE = 16.6;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now-last)/1000; last = now;
  if (dt>0.1) dt=0.1;
  const dt60 = Math.min(2, Math.max(0.5, dt*60));
  fpsE += (1/Math.max(dt,1e-4) - fpsE)*0.06;
  msE += (dt*1000 - msE)*0.06;
  const t = now/1000;

  if (!paused){
    updateFoods(dt60);
    for (const f of foods) stamp(f.dx,f.dy,foodR,0.5*dt60);
    if (pointer.inside && (t-pointer.lastT)<1.5) stamp(pointer.x,pointer.y,13,0.22*dt60);
    stepAgents(dt60);
    diffuse(m0,mtmp,m1,P.decay,P.diffuse);
    const sw=m0; m0=m1; m1=sw;
  }
  render(m0,t);
}
requestAnimationFrame(frame);

/* stats readout */
setInterval(()=>{
  $('stFps').textContent = Math.round(fpsE);
  $('stMs').textContent = msE.toFixed(1);
  $('stAgents').textContent = (count/1000)+'k';
  $('stGrid').textContent = simW+'×'+simH;
  $('stFoods').textContent = foods.length;
  $('stFps').classList.toggle('warn', fpsE<45);
},300);
})();
</script>
</body>
