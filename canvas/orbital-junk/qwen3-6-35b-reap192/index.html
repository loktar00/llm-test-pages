<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Debris Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="screen"></canvas>
    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const EARTH_RADIUS = 80;
        const ORBITAL_RADIUS_MIN = 100;
        const ORBITAL_RADIUS_MAX = 600;
        const INITIAL_SATELLITES = 150;
        const MAX_OBJECTS = 600;
        const DRONE_SPEED = 1.5;
        const DRONE_COUNT = 5;

        let objects = [];
        let stars = [];
        let drones = [];

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width * 0.15;
            centerY = height * 0.85;
            generateStars();
        }
        window.addEventListener('resize', resize);

        // Utility
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function dist(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        // Background Stars
        function generateStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: random(0, width),
                    y: random(0, height),
                    size: random(0.5, 2),
                    alpha: random(0.2, 0.8)
                });
            }
        }

        // Classes
        class Body {
            constructor(orbitRadius, speed, size, color, isFragment = false, parentAngle = null) {
                this.orbitRadius = orbitRadius;
                // Kepler-ish: closer = faster. Base speed 0.02
                this.speed = (isFragment ? random(0.3, 0.8) : 0.02) * (200 / orbitRadius); 
                this.angle = parentAngle !== null ? parentAngle : random(0, Math.PI * 2);
                
                // Perturb orbit slightly for fragments to create "clouds"
                if (isFragment) {
                    this.orbitRadius += random(-20, 20);
                    this.speed += random(-0.005, 0.005);
                    // Ensure negative orbit doesn't crash into earth immediately but wraps or dies
                }
                
                this.size = size;
                this.color = color;
                this.isFragment = isFragment;
                
                // Visuals
                this.glow = 0;
                this.glowDir = 1;
            }

            update() {
                this.angle += this.speed;
                
                // Calculate position
                // Map orbit radius to screen coordinates relative to Earth center
                // We offset slightly so it doesn't always start exactly at axis
                const x = centerX + Math.cos(this.angle) * this.orbitRadius;
                const y = centerY + Math.sin(this.angle) * this.orbitRadius;

                this.x = x;
                this.y = y;

                // Collision with Earth
                if (dist(x, y, centerX, centerY) < EARTH_RADIUS) {
                    this.markedForDeletion = true;
                }

                // Glint effect
                this.glow += 0.05 * this.glowDir;
                if (this.glow > 1 || this.glow < 0) this.glowDir *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // Opacity based on glow
                const alpha = 0.4 + (0.6 * this.glow);
                ctx.globalAlpha = alpha;
                ctx.fill();
                ctx.globalAlpha = 1;

                // Draw Orbit Line (faint)
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255, 255, 255, 0.03)`;
                ctx.lineWidth = 1;
                ctx.arc(centerX, centerY, this.orbitRadius, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        class Drone {
            constructor() {
                this.x = random(0, width);
                this.y = random(0, height);
                this.target = null;
                this.size = 3;
                this.color = "#00ffcc";
                this.trail = [];
            }

            update() {
                // Find closest junk object
                let closestDist = Infinity;
                this.target = null;

                // Look for debris, prioritize fragments
                for (let obj of objects) {
                    if (obj.markedForDeletion) continue;
                    const d = dist(this.x, this.y, obj.x, obj.y);
                    if (d < closestDist) {
                        closestDist = d;
                        this.target = obj;
                    }
                }

                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const angle = Math.atan2(dy, dx);
                    
                    this.x += Math.cos(angle) * DRONE_SPEED;
                    this.y += Math.sin(angle) * DRONE_SPEED;

                    // Cleanup
                    if (closestDist < 5) {
                        this.target.markedForDeletion = true;
                        createExplosion(this.target.x, this.target.y, this.target.color, 3);
                        // Reset drone position occasionally to keep it moving around
                        if (Math.random() > 0.7) {
                             this.x = random(0, width);
                             this.y = random(0, height);
                        }
                    }
                } else {
                    // Wander if no targets
                    this.x += random(-0.5, 0.5);
                    this.y += random(-0.5, 0.5);
                }

                // Draw Drone Trail
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 10) this.trail.shift();
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                for(let i=this.trail.length-1; i>=0; i--) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
                ctx.strokeStyle = "rgba(0, 255, 204, 0.3)";
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Explosion Logic
        let particles = [];
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: random(-2, 2),
                    vy: random(-2, 2),
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }

        // Initialization
        function init() {
            resize();
            for (let i = 0; i < DRONE_COUNT; i++) {
                drones.push(new Drone());
            }
            spawnSatellites(INITIAL_SATELLITES);
            loop();
        }

        function spawnSatellites(count) {
            for (let i = 0; i < count; i++) {
                const r = random(ORBITAL_RADIUS_MIN, ORBITAL_RADIUS_MAX);
                // Speed decreases with distance
                const speed = 0.02 * (200 / r);
                const size = random(1, 3);
                const color = `hsl(${random(180, 300)}, 100%, 70%)`;
                objects.push(new Body(r, speed, size, color));
            }
        }

        function spawnFragments(x, y, color) {
            // Determine approximate orbit of the parent based on position
            const distFromEarth = dist(x, y, centerX, centerY);
            const angle = Math.atan2(y - centerY, x - centerX);
            
            // Create fragments
            const count = Math.floor(random(5, 12));
            for(let i=0; i<count; i++) {
                const r = random(distFromEarth - 10, distFromEarth + 10);
                const frag = new Body(r, 0, 1, color, true, angle);
                // Add initial velocity to spread them out visually
                frag.x = x + random(-5, 5);
                frag.y = y + random(-5, 5);
                
                objects.push(frag);
            }
        }

        function drawEarth() {
            // Atmosphere Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, EARTH_RADIUS, centerX, centerY, EARTH_RADIUS * 1.5);
            gradient.addColorStop(0, "rgba(50, 150, 255, 0.4)");
            gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, EARTH_RADIUS * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Earth Surface
            ctx.beginPath();
            ctx.arc(centerX, centerY, EARTH_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = "#1a4d80";
            ctx.fill();

            // Simple Continents
            ctx.fillStyle = "#2e8040";
            ctx.beginPath();
            ctx.arc(centerX - 20, centerY - 10, 25, 0, Math.PI * 2);
            ctx.arc(centerX + 30, centerY + 20, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBackground() {
            ctx.fillStyle = "#050508";
            ctx.fillRect(0, 0, width, height);

            for (let star of stars) {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            drawBackground();
            drawEarth();

            // Update and Draw Drones
            drones.forEach(d => {
                d.update();
                d.draw();
            });

            // Update Objects
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.update();
                obj.draw();

                if (obj.markedForDeletion) {
                    // Explosion logic
                    createExplosion(obj.x, obj.y, obj.color, 10);
                    spawnFragments(obj.x, obj.y, obj.color);
                    
                    objects.splice(i, 1);
                }
            }

            // Maintain Population
            if (objects.length < INITIAL_SATELLITES) {
                spawnSatellites(1);
            }

            updateParticles();

            requestAnimationFrame(loop);
        }

        init();

    </script>
</body>
</html>
