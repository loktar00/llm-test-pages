<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scribble Ball</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100;overflow:hidden;background:#fff;cursor:none}
*{cursor:none!important}
#ink{display:block;width:100vw;height:100vh}
#hint{position:fixed;left:0;right:0;top:18px;font:11px/1 monospace;color:rgba(0,0,0,0.8);text-align:center;pointer-events:none;text-transform:uppercase;letter-spacing:4px}
</style>
</head>
<body>
<canvas id="ink"></canvas>
<script>
var canvas = document.getElementById('ink'),
    ctx = canvas.getContext('2d');
var f, w, h, focal, vpx, vpy;
var ink = '#0e0e0e';
var lines = [];
var NUM_TENDACLES = 8;
var PER_BELL = 6;
var RAY_RADIUS = 4;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  focal = Math.min(w, h) * 0.3;
  vpx = w / 2;
  vpy = h / 2;
  f = 1;
}

function Line(points) {
  this.points = points || [];
  this.dist = 0;
}

Line.prototype.update = function () {
  for (var p = 0; p < this.points.length; p++) {
    this.points[p].rotateX(angleX);
    this.points[p].rotateY(angleY);
    this.points[p].rotateZ(angleZ);
    this.points[p].map2D();
  }
  this.dist = this.points[0].z;
};

Line.prototype.render = function () {
  if (this.points.length === 0) return;

  ctx.beginPath();
  ctx.moveTo(this.points[0].xPos, this.points[0].yPos);
  for (var p = 1; p < this.points.length; p++) {
    var cp = this.points[p - 1].xPos, this.points[p - 1].yPos,
        pt = this.points[p].xPos, this.points[p].yPos;
    var mid = 0.5;
    ctx.quadraticCurveTo(
        cp + (this.points[p - 1].nx * mid),
        pt + (this.points[p].ny * mid),
        this.points[p].xPos, this.points[p].yPos
    );
  }

  this.dist = this.points[this.points.length - 1].z;

  ctx.fill();
  ctx.stroke();
};

function Point(pos) {
  this.x = pos.x || 0;
  this.y = pos.y || 0;
  this.z = pos.z || 0;

  this.cX = 0;
  this.cY = 0;
  this.cZ = 0;

  this.xPos = 0;
  this.yPos = 0;
  this.nx = 0;
  this.ny = 0;

  this.map2D();
}

Point.prototype.rotateX = function (angleX) {
  var cosX = Math.cos(angleX),
      sinX = Math.sin(angleX),
      y1 = this.y * cosX - this.z * sinX,
      z1 = this.z * cosX + this.y * sinX;
  this.y = y1;
  this.z = z1;
  this.ny = this.ny * cosX - this.ny * sinX * 0;
};

Point.prototype.rotateY = function (angleY) {
  var cosY = Math.cos(angleY),
      sinY = Math.sin(angleY),
      x1 = this.x * cosY - this.z * sinY,
      z1 = this.z * cosY + this.x * sinY;
  this.x = x1;
  this.z = z1;
  this.nx = this.nx * cosY - this.nx * sinY * 0;
};

Point.prototype.rotateZ = function (angleZ) {
  var cosZ = Math.cos(angleZ),
      sinZ = Math.sin(angleZ),
      x1 = this.x * cosZ - this.y * sinZ,
      y1 = this.y * cosZ + this.x * sinZ;
  this.x = x1;
  this.y = y1;
  var nx1 = this.nx * cosZ - this.ny * sinZ;
  var ny1 = this.ny * cosZ + this.nx * sinZ;
  this.nx = nx1;
  this.ny = ny1;
};

Point.prototype.map2D = function () {
  var focalZ = focal + this.z + this.cZ;
  var s = focal / focalZ;

  this.xPos = vpx + (this.cX + this.x) * s;
  this.yPos = vpy + (this.cY + this.y) * s;

  this.scale = s;
};

function randomSpherePoint(x0, y0, z0, radius) {
  var u = Math.random(),
      v = Math.random(),
      theta = 2 * Math.PI * u,
      phi = Math.acos(2 * v - 1),
      x = x0 + (radius * Math.sin(phi) * Math.cos(theta)),
      y = y0 + (radius * Math.sin(phi) * Math.sin(theta)),
      z = z0 + (radius * Math.cos(phi));
  return {x: x, y: y, z: z};
}

function Tendacle(offset) {
  this.points = [];
  this.line = new Line(this.points);
  this.head = new Point({x: 0, y: 0, z: 0});
  this.points.push(this.head);
  this.count = 60 + ((offset * 13) % 80);
  this.step = 6 + ((offset * 7) % 6);
  this.offset = offset;
  this.head.x = (Math.cos(offset * 1.7) * 5);
  this.head.y = (Math.sin(offset * 0.5) * 3);
  this.head.z = (Math.cos(offset * 1.2) * 5);

  var dirX = (Math.random() - 0.5) * 2;
  var dirY = (Math.random() - 0.5) * 2;
  var dirZ = (Math.random() - 0.5) * 2;
  this.head.vx = dirX * 0.06;
  this.head.vy = dirY * 0.06;
  this.head.vz = dirZ * 0.06;

  this.bud(0);
  this.bud(1);
  this.bud(1);
  this.bud(1);
  this.bud(1);
  this.bud(1);
  this.bud(1);
  this.bud(1);
}

Tendacle.prototype.bud = function (k) {
  var last = this.points[this.points.length - 1];
  var r = 5 + Math.random() * 2;
  var n = randomSpherePoint(last.x, last.y, last.z, r);
  var p = new Point(n);
  p.nx = (Math.random() - 0.5) * 10;
  p.ny = (Math.random() - 0.5) * 10;
  this.points.push(p);
};

Tendacle.prototype.update = function () {
  var r = 5 + Math.random() * 2;

  var head = this.head;
  head.vx += (Math.random() - 0.5) * 0.2;
  head.vy += (Math.random() - 0.5) * 0.2;
  head.vz += (Math.random() - 0.5) * 0.2;

  var dist = Math.sqrt(head.x * head.x + head.y * head.y + head.z * head.z);
  if (dist > 80 && dist > 0) {
    head.vx -= (head.x / dist) * 0.1;
    head.vy -= (head.y / dist) * 0.1;
    head.vz -= (head.z / dist) * 0.1;
  }

  var sp = Math.sqrt(head.vx * head.vx + head.vy * head.vy + head.vz * head.vz);
  if (sp > 5) {
    head.vx *= 5 / sp;
    head.vy *= 5 / sp;
    head.vz *= 5 / sp;
  }

  head.x += head.vx;
  head.y += head.vy;
  head.z += head.vz;

  this.count -= 0.3;
  if (this.count < 0 && this.points.length < 120) {
    this.bud(0);
    this.count = 60 + (Math.random() * 60);
  }

  this.line.update();
  this.line.render();
};

var angleX, angleY, angleZ;
angleX = 0; angleY = 0; angleZ = 0;

var tendrils = [];
for (var i = 0; i < NUM_TENDACLES; i++) {
  tendrils.push(new Tendacle(i));
  lines.push(tendrils[i].line);
}

function sortLines() {
  lines.sort(function (a, b) {
    return b.dist - a.dist;
  });
}

function inkTrail() {
  ctx.fillStyle = 'rgba(254,253,245,0.7)';
  ctx.fillRect(0, 0, w, h);

  angleX = (0 - vpy) * 0.0001 * f;
  angleY = (0 - vpx) * 0.0001 * f;
  angleZ = 0 * f * 0.0001;

  for (var i = 0; i < 6; i++) {
    var dx = Math.random() - 0.5;
    var dy = Math.random() - 0.5;
    angleX += dx * 0.0005 * f;
    angleY += dy * 0.0005 * f;
  angleZ += (Math.random() - 0.5) * 0.0003 * f;
  }

  ctx.lineWidth = 0;
  ctx.fillStyle = 'rgba(15,14,14,0.06)';
  ctx.beginPath();
  ctx.arc(vpx, vpy, 80, 0, 6.6);
  ctx.fill();

  sortLines();

  for (var i = 0, len = lines.length; i < len; i++) {
    var t = tendrils[i];
    if (!t) continue;
    var l = t.line;
    ctx.strokeStyle = 'rgba(15,14,14,0.10)';
    ctx.fillStyle = 'rgba(15,14,14,0.06)';
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.mop = 'multiply';

    var p0 = l.points[0];
    ctx.beginPath();
    ctx.arc(p0.xPos, p0.yPos, 6, 0, 6);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(p0.xPos, p0.yPos);
    ctx.lineTo(p0.xPos, p0.yPos);
    ctx.stroke();

    l.render();
  }

  requestAnimationFrame(inkTrail);
}

window.addEventListener('resize', resize);
resize();
inkTrail();
</script>
</body>
</html>
