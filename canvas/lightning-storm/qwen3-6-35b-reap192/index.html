<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let groundY;

        // Configuration
        const config = {
            cloudCount: 40,
            rainCount: 600,
            lightningSpeed: 0.08,
            wind: 4,
            flashDuration: 15,
            boltRecursionDepth: 6
        };

        // State
        let frame = 0;
        let flashTimer = 0;
        let lightningIntensity = 0;
        let rainDrops = [];
        let clouds = [];
        let lightningBolts = [];
        let nextLightningTime = 0;
        let waveMultiplier = 1;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            groundY = height * 0.75;
            initRain();
            initClouds();
        }

        // --- CLASSES ---

        class Cloud {
            constructor() {
                this.reset(true);
            }

            reset(randomX = false) {
                this.y = Math.random() * (height * 0.4);
                this.speed = 0.2 + Math.random() * 0.5;
                this.width = 300 + Math.random() * 600;
                this.height = 80 + Math.random() * 60;
                this.x = randomX ? Math.random() * width : -this.width - 100;
                this.darkness = 0.1 + Math.random() * 0.3;
                this.segments = [];
                
                // Generate cloud shape segments
                const segCount = 10;
                const segW = this.width / segCount;
                for(let i=0; i<segCount; i++) {
                    this.segments.push({
                        x: i * segW,
                        y: Math.random() * 40 - 20,
                        r: this.height/2 + Math.random() * 30
                    });
                }
            }

            update() {
                this.x += this.speed + (config.wind * 0.1);
                if (this.x > width + 100) {
                    this.reset();
                }
            }

            draw(ctx, flash) {
                ctx.fillStyle = `rgba(20, 20, 30, ${1 - this.darkness})`;
                ctx.globalCompositeOperation = 'screen';
                
                // Simple blob drawing
                this.segments.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(this.x + s.x, this.y + s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        class Rain {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random(); // depth factor
                this.len = 10 + this.z * 20;
                this.speed = 10 + this.z * 15;
            }

            update() {
                this.x += config.wind + (this.z * 2);
                this.y += this.speed;

                if (this.y > height || this.x > width) {
                    this.reset();
                    this.y = -50; // spawn above
                }
            }

            draw() {
                const alpha = 0.1 + this.z * 0.3;
                ctx.strokeStyle = `rgba(170, 180, 200, ${alpha})`;
                ctx.lineWidth = 1 + this.z;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + 2, this.y + this.len); // Slight angle for wind
                ctx.stroke();
            }
        }

        class Lightning {
            constructor() {
                this.life = 0;
                this.maxLife = config.flashDuration;
                this.points = [];
                this.branches = [];
                this.generate(this.width/2 + (Math.random()-0.5)*width/2);
            }

            generate(startX) {
                this.points = [];
                this.branches = [];
                this.recursiveBolt(startX, 0, startX, height * 0.2, config.boltRecursionDepth);
            }

            recursiveBolt(x1, y1, x2, y2, depth) {
                if (depth <= 0) {
                    this.points.push({x: x2, y: y2});
                    return;
                }

                const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * 100;
                const midY = (y1 + y2) / 2;

                this.points.push({x: midX, y: midY});

                // Chance to branch
                if (Math.random() > 0.6) {
                    const angle = (Math.random() - 0.5) * 2; // +/- angle
                    const len = (y2 - y1) * (0.3 + Math.random() * 0.3);
                    const bEndX = x2 + Math.sin(angle) * len;
                    const bEndY = y2 + Math.cos(angle) * len;
                    
                    this.branches.push({
                        x1: x2, y1: y2, 
                        x2: bEndX, y2: bEndY,
                        depth: depth - 1
                    });
                }

                this.recursiveBolt(midX, midY, x2, y2, depth - 1);
            }

            update() {
                this.life++;
                if (this.life > this.maxLife) return false; // Dead
                return true;
            }

            draw(ctx) {
                const alpha = 1 - (this.life / this.maxLife);
                
                // Draw Main Bolt
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = 2 + Math.random(); // Jitter
                ctx.shadowBlur = 20;
                ctx.shadowColor = "white";
                
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let p of this.points) ctx.lineTo(p.x, p.y);
                ctx.stroke();

                // Draw Branches
                this.branches.forEach(b => {
                    // Recursively draw branches
                    this.drawSingleBolt(ctx, b.x1, b.y1, b.x2, b.y2, b.depth, alpha);
                });

                ctx.shadowBlur = 0;
            }

            drawSingleBolt(ctx, x1, y1, x2, y2, depth, alpha) {
                if (depth <= 0) return;
                
                const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * 50;
                const midY = (y1 + y2) / 2;

                ctx.strokeStyle = `rgba(200, 200, 255, ${alpha * 0.8})`;
                ctx.lineWidth = depth;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(midX, midY);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (Math.random() > 0.7) {
                   this.drawSingleBolt(ctx, midX, midY, x2, y2, depth-1, alpha);
                }
            }
        }

        // --- INITIALIZATION ---

        function initRain() {
            rainDrops = [];
            for(let i=0; i<config.rainCount; i++) {
                rainDrops.push(new Rain());
            }
        }

        function initClouds() {
            clouds = [];
            for(let i=0; i<config.cloudCount; i++) {
                clouds.push(new Cloud());
            }
        }

        // --- RENDER FUNCTIONS ---

        function drawBackground() {
            // Base Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#020205');
            grad.addColorStop(0.5, '#0a0a15');
            grad.addColorStop(1, '#151520');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawGround() {
            // Far Hills
            ctx.fillStyle = '#08080c';
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            for(let x=0; x<=width; x+=50) {
                ctx.lineTo(x, groundY - 20 - Math.sin(x*0.005)*50 - Math.sin(x*0.02)*10);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            // Near Plains
            ctx.fillStyle = '#050508';
            ctx.beginPath();
            ctx.moveTo(0, groundY + 50);
            for(let x=0; x<=width; x+=50) {
                ctx.lineTo(x, groundY + 50 - Math.sin(x*0.01)*10);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
        }

        function drawFarmhouse() {
            // Position: bottom right corner
            const hx = width - 150;
            const hy = groundY + 40; // slightly down slope
            const scale = 0.8;

            ctx.save();
            ctx.translate(hx, hy);
            ctx.scale(scale, scale);

            // House Body
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, -40, 60, 40);
            
            // Roof
            ctx.beginPath();
            ctx.moveTo(-5, -40);
            ctx.lineTo(30, -75);
            ctx.lineTo(65, -40);
            ctx.fill();

            // Window
            // The window glows yellow/orange. 
            // If lightning flashes, it briefly turns white/bright.
            const isFlash = lightningIntensity > 0.2;
            const r = isFlash ? 255 : 200;
            const g = isFlash ? 200 : 160;
            const b = isFlash ? 150 : 50;
            const alpha = isFlash ? 1 : 0.8;

            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
            ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 1)`;
            ctx.shadowBlur = 15;
            ctx.fillRect(10, -30, 10, 10);
            
            // Window Frame
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, -30);
            ctx.lineTo(15, -20);
            ctx.moveTo(10, -25);
            ctx.lineTo(20, -25);
            ctx.stroke();

            ctx.restore();
        }

        // --- MAIN LOOP ---

        function animate() {
            requestAnimationFrame(animate);
            frame++;

            // 1. Logic: Wave Frequency & Flash
            // Frequency waves: every 1000 frames, frequency ramps up then down
            const cycle = frame % 2000;
            if (cycle < 500) waveMultiplier = cycle / 500; // Build up
            else if (cycle < 1500) waveMultiplier = 1.0; // Peak storm
            else waveMultiplier = (2000 - cycle) / 500; // Die down

            // Flash Decay
            if (flashTimer > 0) {
                flashTimer--;
                lightningIntensity = flashTimer / config.flashDuration;
            } else {
                lightningIntensity = 0;
            }

            // Lightning Spawning
            if (frame > nextLightningTime) {
                // Chance to spawn depends on wave multiplier
                const spawnChance = 0.02 + (waveMultiplier * 0.1);
                if (Math.random() < spawnChance) {
                    lightningBolts.push(new Lightning());
                    flashTimer = config.flashDuration;
                    nextLightningTime = frame + 20 + Math.random() * 60;
                } else {
                    nextLightningTime = frame + 10;
                }
            }

            // Update Bolts
            lightningBolts = lightningBolts.filter(b => b.update());

            // 2. Draw Background
            drawBackground();

            // 3. Draw Ground
            drawGround();

            // 4. Draw Clouds (Back layer)
            clouds.forEach(c => {
                c.update();
                c.draw(ctx, 0);
            });

            // 5. Draw Lightning (Inside clouds / Sheet lightning)
            // We simulate sheet lightning by drawing a big bright rectangle behind the bolts
            if (flashTimer > 0) {
                ctx.fillStyle = `rgba(200, 200, 255, ${lightningIntensity * 0.15})`;
                ctx.fillRect(0, 0, width, height);
            }

            // Draw Bolts
            lightningBolts.forEach(b => b.draw(ctx));

            // 6. Draw Farmhouse (Foreground element)
            drawFarmhouse();

            // 7. Draw Rain (Foreground)
            rainDrops.forEach(r => {
                r.update();
                r.draw();
            });

            // 8. Global Flash Overlay
            if (flashTimer > 0) {
                ctx.fillStyle = `rgba(240, 240, 255, ${lightningIntensity * 0.4})`;
                ctx.fillRect(0, 0, width, height);
            }
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

    </script>
</body>
</html>
