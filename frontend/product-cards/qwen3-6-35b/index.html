<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopwave — Curated Essentials</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --bg: #f4f2ef;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --accent: #e85d4a;
    --accent-hover: #d14a38;
    --gold: #f5a623;
    --gold-dim: #d4d0c8;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    --shadow-hover: 0 16px 40px rgba(0,0,0,.12);
    --transition: .35s cubic-bezier(.4,0,.2,1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 60px 24px 20px;
  }
  header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--text-muted);
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: .2px;
  }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 28px 80px;
  }

  /* ── Card ── */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
    transition: transform var(--transition), box-shadow var(--transition);
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-hover);
  }

  /* ── Product illustration ── */
  .illustration {
    width: 100%;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .illustration::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.04) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Card-specific bg tones */
  .card:nth-child(1) .illustration { background: linear-gradient(160deg, #fdf6f0 0%, #f9ede4 100%); }
  .card:nth-child(2) .illustration { background: linear-gradient(160deg, #f0f4fd 0%, #e4ecf9 100%); }
  .card:nth-child(3) .illustration { background: linear-gradient(160deg, #f0fdf4 0%, #e4f9ec 100%); }
  .card:nth-child(4) .illustration { background: linear-gradient(160deg, #fef9f0 0%, #fdf2e4 100%); }
  .card:nth-child(5) .illustration { background: linear-gradient(160deg, #f5f0fd 0%, #ece4f9 100%); }
  .card:nth-child(6) .illustration { background: linear-gradient(160deg, #fdf0f4 0%, #f9e4ec 100%); }

  /* ── CSS Bottle ── */
  .bottle {
    position: relative;
    width: 60px;
    height: 130px;
  }
  .bottle-cap {
    width: 22px;
    height: 18px;
    background: #2d2d2d;
    border-radius: 4px 4px 2px 2px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }
  .bottle-neck {
    width: 18px;
    height: 20px;
    background: linear-gradient(135deg, #c9a96e 0%, #b8944f 100%);
    margin: 0 auto;
    border-radius: 2px 2px 0 0;
  }
  .bottle-body {
    width: 60px;
    height: 90px;
    background: linear-gradient(135deg, #d4b87a 0%, #c4a055 40%, #b8903e 100%);
    border-radius: 8px 8px 14px 14px;
    position: relative;
    margin: 0 auto;
    box-shadow: inset -6px 0 12px rgba(0,0,0,.08), inset 6px 0 12px rgba(255,255,255,.15);
  }
  .bottle-body::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 40px;
    border: 2px solid rgba(255,255,255,.25);
    border-radius: 4px;
  }
  .bottle-body::after {
    content: '';
    position: absolute;
    top: 20px;
    left: 10px;
    width: 6px;
    height: 30px;
    background: rgba(255,255,255,.18);
    border-radius: 3px;
  }

  /* ── CSS Headphones ── */
  .headphones {
    width: 100px;
    height: 100px;
    position: relative;
  }
  .hp-band {
    width: 70px;
    height: 40px;
    border: 6px solid #2d2d2d;
    border-bottom: none;
    border-radius: 40px 40px 0 0;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
  }
  .hp-band::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 8px;
    background: #3d3d3d;
    border-radius: 4px;
  }
  .hp-cup {
    width: 30px;
    height: 44px;
    background: linear-gradient(180deg, #3d3d3d 0%, #2d2d2d 100%);
    border-radius: 8px;
    position: absolute;
    bottom: 0;
  }
  .hp-cup::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 16px;
    height: 16px;
    background: #1a1a1a;
    border-radius: 50%;
    box-shadow: inset 0 0 0 3px #4a4a4a;
  }
  .hp-cup.left { left: 0; }
  .hp-cup.right { right: 0; }

  /* ── CSS Watch ── */
  .watch {
    width: 80px;
    height: 110px;
    position: relative;
  }
  .watch-band-top, .watch-band-bottom {
    width: 30px;
    height: 30px;
    background: linear-gradient(180deg, #8b6f47 0%, #7a5e3a 100%);
    margin: 0 auto;
    border-radius: 4px;
    position: relative;
  }
  .watch-band-top { margin-bottom: 4px; }
  .watch-band-bottom { margin-top: 4px; }
  .watch-band-top::before, .watch-band-bottom::before {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 1px;
    background: rgba(0,0,0,.15);
    box-shadow: 0 4px 0 rgba(0,0,0,.1), 0 8px 0 rgba(0,0,0,.1);
  }
  .watch-case {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #d4c5a0 0%, #c4b48a 50%, #b8a67a 100%);
    border-radius: 50%;
    margin: 0 auto;
    position: relative;
    box-shadow: inset 2px 2px 4px rgba(255,255,255,.3), inset -2px -2px 4px rgba(0,0,0,.1), 0 2px 8px rgba(0,0,0,.15);
  }
  .watch-face {
    position: absolute;
    inset: 8px;
    background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
    border-radius: 50%;
  }
  .watch-hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    background: #e8e0d0;
    border-radius: 1px;
  }
  .watch-hand.hour { width: 3px; height: 16px; transform: translateX(-50%) rotate(30deg); }
  .watch-hand.minute { width: 2px; height: 22px; transform: translateX(-50%) rotate(180deg); }
  .watch-hand.second { width: 1px; height: 24px; transform: translateX(-50%) rotate(90deg); background: var(--accent); }
  .watch-crown {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 12px;
    background: #c4b48a;
    border-radius: 2px;
  }

  /* ── CSS Sneaker ── */
  .sneaker {
    width: 120px;
    height: 70px;
    position: relative;
  }
  .sneaker-sole {
    position: absolute;
    bottom: 0;
    left: 5px;
    width: 110px;
    height: 14px;
    background: #f0f0f0;
    border-radius: 6px 20px 8px 6px;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
  }
  .sneaker-sole::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 10px;
    width: 90px;
    height: 4px;
    background: repeating-linear-gradient(90deg, #ddd 0px, #ddd 6px, #eee 6px, #eee 12px);
    border-radius: 2px;
  }
  .sneaker-upper {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 100px;
    height: 46px;
    background: linear-gradient(135deg, #e85d4a 0%, #d14a38 100%);
    border-radius: 10px 30px 4px 10px;
    overflow: hidden;
  }
  .sneaker-upper::before {
    content: '';
    position: absolute;
    top: 8px;
    left: -5px;
    width: 50px;
    height: 20px;
    background: #fff;
    border-radius: 0 0 20px 0;
    transform: rotate(-5deg);
  }
  .sneaker-upper::after {
    content: '';
    position: absolute;
    top: 14px;
    left: 5px;
    width: 30px;
    height: 3px;
    background: rgba(255,255,255,.4);
    border-radius: 2px;
    box-shadow: 0 6px 0 rgba(255,255,255,.4);
  }

  /* ── CSS Speaker ── */
  .speaker {
    width: 70px;
    height: 110px;
    position: relative;
  }
  .speaker-body {
    width: 70px;
    height: 110px;
    background: linear-gradient(180deg, #3d3d3d 0%, #2d2d2d 100%);
    border-radius: 14px;
    position: relative;
    box-shadow: inset 2px 2px 4px rgba(255,255,255,.05), 0 4px 12px rgba(0,0,0,.2);
  }
  .speaker-grille {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 46px;
    height: 46px;
    background: radial-gradient(circle, #4a4a4a 1px, transparent 1px);
    background-size: 8px 8px;
    border-radius: 50%;
  }
  .speaker-logo {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    border: 2px solid #666;
    border-radius: 50%;
  }
  .speaker-logo::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }
  .speaker-base {
    width: 50px;
    height: 8px;
    background: #333;
    border-radius: 0 0 8px 8px;
    margin: 0 auto;
  }

  /* ── CSS Sunglasses ── */
  .sunglasses {
    width: 110px;
    height: 50px;
    position: relative;
  }
  .ss-lens {
    width: 42px;
    height: 36px;
    background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
    border-radius: 6px 6px 20px 20px;
    position: absolute;
    top: 10px;
    box-shadow: inset 0 0 12px rgba(255,255,255,.05);
  }
  .ss-lens::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 6px;
    width: 12px;
    height: 8px;
    background: rgba(255,255,255,.1);
    border-radius: 50%;
    transform: rotate(-20deg);
  }
  .ss-lens.left { left: 0; }
  .ss-lens.right { right: 0; }
  .ss-bridge {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 4px;
    background: #2d2d2d;
    border-radius: 2px;
  }
  .ss-arm-l, .ss-arm-r {
    position: absolute;
    top: 18px;
    width: 30px;
    height: 4px;
    background: #2d2d2d;
    border-radius: 2px;
  }
  .ss-arm-l { left: -26px; }
  .ss-arm-r { right: -26px; }
  .ss-frame {
    position: absolute;
    inset: -2px;
    border: 3px solid #3d3d3d;
    border-radius: 8px 8px 22px 22px;
    pointer-events: none;
  }

  /* ── Card Info ── */
  .card-info {
    padding: 20px 22px 22px;
  }
  .card-name {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -.3px;
    margin-bottom: 4px;
  }
  .card-category {
    font-size: .8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .8px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  /* ── Stars ── */
  .stars {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-bottom: 12px;
  }
  .star {
    font-size: .95rem;
    color: var(--gold-dim);
    line-height: 1;
  }
  .star.filled { color: var(--gold); }
  .star.half {
    position: relative;
    color: var(--gold-dim);
  }
  .star.half::before {
    content: '★';
    position: absolute;
    top: 0;
    left: 0;
    color: var(--gold);
    overflow: hidden;
    width: var(--fill);
  }

  /* ── Price row ── */
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .price {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -.5px;
  }
  .price-original {
    font-size: .9rem;
    color: var(--text-muted);
    text-decoration: line-through;
    font-weight: 500;
  }

  /* ── Quick Add Bar ── */
  .quick-add {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px 22px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.97) 30%);
    transform: translateY(100%);
    transition: transform var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card:hover .quick-add {
    transform: translateY(0);
  }
  .quick-add-btn {
    width: 100%;
    padding: 12px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .3px;
    transition: background .2s, transform .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .quick-add-btn:hover {
    background: var(--accent);
    transform: scale(1.02);
  }
  .quick-add-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* ── Sale Badge ── */
  .sale-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--accent);
    color: #fff;
    font-size: .75rem;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    letter-spacing: .5px;
    z-index: 5;
    animation: wiggle 2s ease-in-out infinite;
    box-shadow: 0 2px 8px rgba(232,93,74,.35);
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(-4deg) scale(1.05); }
    40% { transform: rotate(4deg) scale(1.05); }
    60% { transform: rotate(-3deg) scale(1.02); }
    80% { transform: rotate(3deg) scale(1.02); }
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    header { padding: 40px 20px 16px; }
    header h1 { font-size: 1.8rem; }
    .grid { gap: 20px; padding: 20px 16px 60px; }
    .illustration { height: 180px; }
  }
  @media (min-width: 960px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

<script>
  document.querySelectorAll('.stars').forEach(container => {
    const rating = parseFloat(container.dataset.rating);
    const full = Math.floor(rating);
    const hasHalf = rating % 1 !== 0;

    for (let i = 0; i < 5; i++) {
      const star = document.createElement('span');
      star.classList.add('star');

      if (i < full) {
        star.classList.add('filled');
        star.textContent = '★';
      } else if (i === full && hasHalf) {
        star.classList.add('half');
        star.textContent = '★';
        star.style.setProperty('--fill', '50%');
      } else {
        star.textContent = '★';
      }

      container.appendChild(star);
    }
  });
</script>
