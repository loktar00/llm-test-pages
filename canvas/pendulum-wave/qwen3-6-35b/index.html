<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendulum Wave</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();
addEventListener('resize',resize);

const NUM=24;
const CYCLE=60;
const g=9.81;
const MAX_AMP=Math.PI/3.5;
const TRAIL=80;
const CHART_FRAMES=3600;

const pendulums=[];
for(let i=0;i<NUM;i++){
  const n=24+i;
  const omega=2*Math.PI*n/CYCLE;
  const L=g/(omega*omega);
  pendulums.push({n,omega,L,phase:0});
}

const trails=pendulums.map(()=>[]);
const chartHist=pendulums.map(()=>[]);
let flashAlpha=0;

function getPos(p,t){
  const a=MAX_AMP*Math.sin(p.omega*t+p.phase);
  return{x:Math.sin(a),y:Math.cos(a)};
}

function draw(time){
  const dt=1/60;
  const t=time/1000;
  const cyclePhase=t%CYCLE;
  if(cyclePhase<dt*2&&t>0.5){flashAlpha=1}

  const W=canvas.width,H=canvas.height;

  ctx.fillStyle='rgba(2,2,6,0.22)';
  ctx.fillRect(0,0,W,H);

  const pivotY=H*0.1;
  const spacing=W/(NUM+1);
  const maxVis=Math.min(H*0.34,380);
  const minVis=Math.min(H*0.07,70);

  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,pivotY);ctx.lineTo(W,pivotY);ctx.stroke();

  for(let i=0;i<NUM;i++){
    const p=pendulums[i];
    const pos=getPos(p,t);
    const vL=minVis+(maxVis-minVis)*(1-i/(NUM-1));
    const px=spacing*(i+1);
    const bx=px+pos.x*vL;
    const by=pivotY+pos.y*vL;

    trails[i].push({x:bx,y:by});
    if(trails[i].length>TRAIL)trails[i].shift();

    const cx=(bx-px)/vL;
    chartHist[i].push(cx);
    if(chartHist[i].length>CHART_FRAMES)chartHist[i].shift();

    // trail
    if(trails[i].length>1){
      for(let j=1;j<trails[i].length;j++){
        const a=(j/trails[i].length)*0.45;
        const hue=(i/NUM)*360+180;
        ctx.strokeStyle=`hsla(${hue%360},85%,68%,${a})`;
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(trails[i][j-1].x,trails[i][j-1].y);
        ctx.lineTo(trails[i][j].x,trails[i][j].y);
        ctx.stroke();
      }
    }

    // rod
    ctx.strokeStyle='rgba(255,255,255,0.18)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(px,pivotY);ctx.lineTo(bx,by);ctx.stroke();

    // bob glow
    const hue=(i/NUM)*360+180;
    const grad=ctx.createRadialGradient(bx,by,0,bx,by,12);
    grad.addColorStop(0,`hsla(${hue%360},90%,78%,0.9)`);
    grad.addColorStop(0.4,`hsla(${hue%360},80%,60%,0.3)`);
    grad.addColorStop(1,`hsla(${hue%360},80%,60%,0)`);
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(bx,by,12,0,Math.PI*2);ctx.fill();

    // bob core
    ctx.fillStyle=`hsl(${hue%360},85%,82%)`;
    ctx.beginPath();ctx.arc(bx,by,3.5,0,Math.PI*2);ctx.fill();
  }

  // persistence chart
  const chartTop=H*0.64;
  const chartBot=H*0.93;
  const chartH=chartBot-chartTop;
  const rowH=chartH/NUM;

  ctx.fillStyle='rgba(0,0,4,0.4)';
  ctx.fillRect(0,chartTop-8,W,chartH+16);

  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,chartTop+chartH/2);ctx.lineTo(W,chartTop+chartH/2);ctx.stroke();

  for(let i=0;i<NUM;i++){
    const h=chartHist[i];
    if(h.length<2)continue;
    const hue=(i/NUM)*360+180;
    const y=chartTop+i*rowH+rowH/2;

    ctx.strokeStyle=`hsla(${hue%360},65%,52%,0.65)`;
    ctx.lineWidth=1.2;
    ctx.beginPath();
    for(let j=0;j<h.length;j++){
      const x=(j/CHART_FRAMES)*W;
      const cy=y-h[j]*(rowH*0.42);
      j===0?ctx.moveTo(x,cy):ctx.lineTo(x,cy);
    }
    ctx.stroke();

    // dot at right edge
    const dotX=W;
    const dotY=y-h[h.length-1]*(rowH*0.42);
    ctx.fillStyle=`hsla(${hue%360},85%,72%,0.9)`;
    ctx.beginPath();ctx.arc(dotX,dotY,2.2,0,Math.PI*2);ctx.fill();
  }

  // flash
  if(flashAlpha>0){
    ctx.fillStyle=`rgba(180,200,255,${flashAlpha*0.12})`;
    ctx.fillRect(0,0,W,H);
    // pivot flash
    ctx.strokeStyle=`rgba(255,255,255,${flashAlpha*0.3})`;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,pivotY);ctx.lineTo(W,pivotY);ctx.stroke();
    flashAlpha-=0.025;
    if(flashAlpha<0)flashAlpha=0;
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
