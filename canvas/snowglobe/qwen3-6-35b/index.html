<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Globe</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, globeX, globeY, globeR;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  globeX = W / 2;
  globeY = H / 2 - 40;
  globeR = Math.min(W, H) * 0.32;
}
resize();
window.addEventListener('resize', resize);

// --- Scene objects ---
const cabins = [];
const trees = [];
const snowLayers = [];

function initScene() {
  cabins.length = 0;
  trees.length = 0;
  snowLayers.length = 0;

  const groundY = globeY + globeR * 0.55;

  // Cabins
  const cabinDefs = [
    { x: -0.15, w: 0.12, h: 0.10, roofH: 0.07, color: '#5a3020', windows: 2 },
    { x: 0.05, w: 0.15, h: 0.12, roofH: 0.08, color: '#4a2818', windows: 3 },
    { x: 0.28, w: 0.10, h: 0.09, roofH: 0.06, color: '#6a3828', windows: 2 },
    { x: -0.38, w: 0.09, h: 0.08, roofH: 0.055, color: '#502818', windows: 1 },
  ];

  for (const def of cabinDefs) {
    const cx = globeX + def.x * globeR * 2;
    const cy = groundY;
    const cw = def.w * globeR;
    const ch = def.h * globeR;
    const crh = def.roofH * globeR;
    const roofPeakY = cy - ch - crh;

    cabins.push({
      x: cx, y: cy, w: cw, h: ch, roofH: crh,
      peakY: roofPeakY, color: def.color,
      windows: def.windows,
      windowFlicker: Array.from({ length: def.windows }, () => Math.random() * Math.PI * 2),
      snowDepth: 0
    });

    // Snow layer for this cabin
    snowLayers.push({ x: cx - cw / 2, w: cw, baseY: cy - ch, depth: 0 });

    // Chimney
    cabins[cabins.length - 1].chimney = {
      x: cx + cw * 0.3, y: roofPeakY + crh * 0.2,
      w: cw * 0.12, h: crh * 0.6
    };
  }

  // Trees
  const treeDefs = [
    { x: -0.48, scale: 1.0 }, { x: -0.30, scale: 0.8 },
    { x: -0.05, scale: 0.9 }, { x: 0.20, scale: 0.75 },
    { x: 0.42, scale: 1.1 }, { x: 0.55, scale: 0.85 },
    { x: -0.55, scale: 0.7 }, { x: 0.62, scale: 0.65 },
  ];

  for (const def of treeDefs) {
    const tx = globeX + def.x * globeR * 2;
    trees.push({
      x: tx, y: groundY,
      scale: def.scale,
      snowDepth: 0
    });
  }
}

// --- Snow particles ---
const MAX_SNOW = 600;
const particles = [];

function spawnParticle() {
  if (particles.length >= MAX_SNOW) return;
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.random() * globeR * 0.85;
  particles.push({
    x: globeX + Math.cos(angle) * dist,
    y: globeY - globeR * 0.7 + Math.random() * globeR * 0.4,
    vx: (Math.random() - 0.5) * 0.5,
    vy: Math.random() * 0.3 + 0.1,
    size: Math.random() * 2.5 + 1,
    opacity: Math.random() * 0.5 + 0.5,
    settled: false,
    settleTimer: 0
  });
}

function updateParticles(dt, shaking) {
  const groundY = globeY + globeR * 0.55;
  const shakeIntensity = shaking ? 8 : 0;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (p.settled) {
      p.settleTimer += dt;
      if (p.settleTimer > 3) {
        particles.splice(i, 1);
      }
      continue;
    }

    // Gravity
    p.vy += 0.08 * dt * 60;

    // Shaking turbulence
    if (shaking) {
      p.vx += (Math.random() - 0.5) * shakeIntensity * dt * 60;
      p.vy += (Math.random() - 0.5) * shakeIntensity * dt * 60;
      p.vx += Math.sin(Date.now() * 0.01 + i) * 2 * dt * 60;
      p.vy += Math.cos(Date.now() * 0.013 + i * 0.7) * 1.5 * dt * 60;
    }

    // Air resistance
    p.vx *= (1 - 0.02 * dt * 60);
    p.vy *= (1 - 0.015 * dt * 60);

    // Move
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;

    // Refraction at glass edge
    const dx = p.x - globeX;
    const dy = p.y - globeY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = globeR * 0.88;

    if (dist > maxDist) {
      const nx = dx / dist;
      const ny = dy / dist;
      const dot = p.vx * nx + p.vy * ny;

      // Refract: push back inside with slight deflection
      p.x = globeX + nx * maxDist;
      p.y = globeY + ny * maxDist;

      // Reflect velocity with energy loss and deflection
      p.vx -= 1.5 * dot * nx;
      p.vy -= 1.5 * dot * ny;
      p.vx *= 0.6;
      p.vy *= 0.6;

      // Add slight tangential swirl
      p.vx += -ny * 1.5;
      p.vy += nx * 1.5;
    }

    // Collision with cabin roofs
    for (const cab of cabins) {
      const roofLeft = cab.x - cab.w / 2;
      const roofRight = cab.x + cab.w / 2;
      const roofTop = cab.peakY;
      const roofBase = cab.y - cab.h;

      // Check if particle is near roof
      if (p.x > roofLeft - 5 && p.x < roofRight + 5 &&
          p.y > roofTop - 10 && p.y < roofBase + 5) {
        // Roof line at this x
        const t = (p.x - roofLeft) / cab.w;
        const roofY = roofTop + Math.abs(t - 0.5) * 2 * cab.roofH;

        if (p.y >= roofY) {
          p.settled = true;
          p.x = p.x;
          p.y = roofY - 1;
          p.vx = 0;
          p.vy = 0;
          cab.snowDepth = Math.max(cab.snowDepth, cab.snowDepth + 0.3);
          // Also add to snow layer
          const layer = snowLayers.find(l =>
            Math.abs(l.x - (cab.x - cab.w / 2)) < 1 && Math.abs(l.baseY - cab.y) < 1);
          if (layer) layer.depth = Math.max(layer.depth, layer.depth + 0.3);
        }
      }
    }

    // Collision with tree branches
    for (const tree of trees) {
      const treeH = 40 * tree.scale;
      const treeW = 25 * tree.scale;
      const trunkH = 8 * tree.scale;

      for (let tier = 0; tier < 3; tier++) {
        const tierY = tree.y - trunkH - tier * treeH * 0.3;
        const tierW = treeW * (1 - tier * 0.25);
        const tierBottom = tierY;
        const tierTop = tierY - treeH * 0.35;

        if (p.x > tree.x - tierW && p.x < tree.x + tierW &&
            p.y > tierTop - 5 && p.y < tierBottom + 5) {
          if (p.y >= tierTop) {
            p.settled = true;
            p.y = tierTop - 1;
            p.vx = 0;
            p.vy = 0;
            tree.snowDepth = Math.max(tree.snowDepth, tree.snowDepth + 0.2);
          }
        }
      }
    }

    // Ground collision
    if (p.y >= groundY) {
      p.settled = true;
      p.y = groundY - 1;
      p.vx = 0;
      p.vy = 0;
      // Add to ground snow
      for (const layer of snowLayers) {
        if (p.x > layer.x && p.x < layer.x + layer.w) {
          layer.depth = Math.max(layer.depth, layer.depth + 0.5);
          break;
        }
      }
      // If not near a cabin, add to nearest
      let found = false;
      for (const layer of snowLayers) {
        if (Math.abs(p.x - layer.x) < layer.w) {
          layer.depth = Math.max(layer.depth, layer.depth + 0.5);
          found = true;
          break;
        }
      }
    }

    // Remove if way outside
    if (dist > globeR * 1.2) {
      particles.splice(i, 1);
    }
  }

  // Ambient spawn
  if (Math.random() < 0.3 * dt * 60) {
    spawnParticle();
  }
}

// --- Shaking ---
let shakeTime = 0;
let isShaking = false;
let lastShake = 0;
const SHAKE_INTERVAL = 20000;
const SHAKE_DURATION = 2500;

// --- Drawing ---
function drawBackground() {
  const grad = ctx.createRadialGradient(globeX, globeY, 0, globeX, globeY, globeR * 2.5);
  grad.addColorStop(0, '#1a1a3a');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawGlobeBase() {
  const baseY = globeY + globeR * 0.65;
  const baseH = globeR * 0.12;
  const baseW = globeR * 0.7;

  // Shadow
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(globeX, baseY + baseH + 10, baseW * 0.9, 15, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  ctx.restore();

  // Base
  const baseGrad = ctx.createLinearGradient(globeX - baseW, baseY, globeX + baseW, baseY + baseH);
  baseGrad.addColorStop(0, '#4a3020');
  baseGrad.addColorStop(0.3, '#6a4830');
  baseGrad.addColorStop(0.5, '#7a5840');
  baseGrad.addColorStop(0.7, '#6a4830');
  baseGrad.addColorStop(1, '#4a3020');

  ctx.beginPath();
  ctx.moveTo(globeX - baseW, baseY);
  ctx.quadraticCurveTo(globeX - baseW * 1.1, baseY + baseH * 0.5, globeX - baseW * 0.9, baseY + baseH);
  ctx.lineTo(globeX + baseW * 0.9, baseY + baseH);
  ctx.quadraticCurveTo(globeX + baseW * 1.1, baseY + baseH * 0.5, globeX + baseW, baseY);
  ctx.closePath();
  ctx.fillStyle = baseGrad;
  ctx.fill();
  ctx.strokeStyle = '#3a2010';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Gold trim
  ctx.beginPath();
  ctx.moveTo(globeX - baseW, baseY);
  ctx.quadraticCurveTo(globeX - baseW * 1.1, baseY + baseH * 0.5, globeX - baseW * 0.9, baseY + baseH);
  ctx.lineTo(globeX + baseW * 0.9, baseY + baseH);
  ctx.quadraticCurveTo(globeX + baseW * 1.1, baseY + baseH * 0.5, globeX + baseW, baseY);
  ctx.closePath();
  ctx.strokeStyle = '#c8a050';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawGround() {
  const groundY = globeY + globeR * 0.55;

  // Snow ground
  ctx.beginPath();
  ctx.moveTo(globeX - globeR * 0.9, groundY + 10);
  ctx.quadraticCurveTo(globeX, groundY - 5, globeX + globeR * 0.9, groundY + 10);
  ctx.lineTo(globeX + globeR * 0.9, globeY + globeR * 0.7);
  ctx.lineTo(globeX - globeR * 0.9, globeY + globeR * 0.7);
  ctx.closePath();

  const groundGrad = ctx.createLinearGradient(globeX, groundY - 5, globeX, globeY + globeR * 0.7);
  groundGrad.addColorStop(0, '#e8eef5');
  groundGrad.addColorStop(0.5, '#d0d8e5');
  groundGrad.addColorStop(1, '#b8c0d0');
  ctx.fillStyle = groundGrad;
  ctx.fill();
}

function drawCabin(cab) {
  const { x, y, w, h, roofH, peakY, color, windows, windowFlicker, snowDepth } = cab;
  const roofBase = y - h;

  // Snow on roof
  if (snowDepth > 0.5) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2 - 3, roofBase);
    ctx.lineTo(x, peakY - snowDepth);
    ctx.lineTo(x + w / 2 + 3, roofBase);
    ctx.closePath();
    ctx.fillStyle = '#e0e8f0';
    ctx.fill();
  }

  // Chimney
  const ch = cab.chimney;
  ctx.fillStyle = '#5a3020';
  ctx.fillRect(ch.x - ch.w / 2, ch.y, ch.w, ch.h);
  ctx.fillStyle = '#4a2818';
  ctx.fillRect(ch.x - ch.w / 2 + 1, ch.y + 1, ch.w - 2, ch.h - 2);

  // Chimney snow
  ctx.fillStyle = '#d8e0e8';
  ctx.beginPath();
  ctx.ellipse(ch.x, ch.y, ch.w * 0.7, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Smoke from chimney
  const smokeOffset = Date.now() * 0.001;
  for (let s = 0; s < 3; s++) {
    const sy = ch.y - 5 - s * 12 - Math.sin(smokeOffset + s) * 3;
    const sx = ch.x + Math.sin(smokeOffset * 0.7 + s * 1.5) * 5;
    const sr = 3 + s * 2;
    const so = 0.15 - s * 0.04;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,190,200,${so})`;
    ctx.fill();
  }

  // Cabin body
  const bodyGrad = ctx.createLinearGradient(x - w / 2, roofBase, x + w / 2, y);
  bodyGrad.addColorStop(0, color);
  bodyGrad.addColorStop(1, '#3a1a0a');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(x - w / 2, roofBase, w, h);

  // Wood grain lines
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  for (let ly = roofBase + 8; ly < y; ly += 6) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2, ly);
    ctx.lineTo(x + w / 2, ly);
    ctx.stroke();
  }

  // Roof
  ctx.beginPath();
  ctx.moveTo(x - w / 2 - 5, roofBase);
  ctx.lineTo(x, peakY);
  ctx.lineTo(x + w / 2 + 5, roofBase);
  ctx.closePath();
  const roofGrad = ctx.createLinearGradient(x, peakY, x, roofBase);
  roofGrad.addColorStop(0, '#3a1810');
  roofGrad.addColorStop(1, '#5a2818');
  ctx.fillStyle = roofGrad;
  ctx.fill();
  ctx.strokeStyle = '#2a1008';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Windows
  const winW = w * 0.15;
  const winH = h * 0.35;
  const winSpacing = w / (windows + 1);
  const winY = roofBase + h * 0.25;

  for (let wi = 0; wi < windows; wi++) {
    const wx = x - winSpacing + winSpacing * (wi + 1) - winW / 2;
    const flicker = Math.sin(Date.now() * 0.003 + windowFlicker[wi]) * 0.2 + 0.8;
    const flicker2 = Math.sin(Date.now() * 0.007 + windowFlicker[wi] * 2.3) * 0.1 + 0.9;
    const brightness = flicker * flicker2;

    // Window glow
    ctx.save();
    ctx.shadowColor = `rgba(255, 180, 60, ${brightness * 0.6})`;
    ctx.shadowBlur = 15 * brightness;

    // Window pane
    ctx.fillStyle = `rgba(255, 200, 80, ${brightness})`;
    ctx.fillRect(wx, winY, winW, winH);

    // Window frame
    ctx.restore();
    ctx.strokeStyle = '#2a1008';
    ctx.lineWidth = 2;
    ctx.strokeRect(wx, winY, winW, winH);

    // Cross frame
    ctx.beginPath();
    ctx.moveTo(wx + winW / 2, winY);
    ctx.lineTo(wx + winW / 2, winY + winH);
    ctx.moveTo(wx, winY + winH / 2);
    ctx.lineTo(wx + winW, winY + winH / 2);
    ctx.strokeStyle = '#2a1008';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Warm glow on ground
    ctx.save();
    ctx.globalAlpha = brightness * 0.15;
    const glowGrad = ctx.createRadialGradient(wx + winW / 2, y, 0, wx + winW / 2, y, w * 0.6);
    glowGrad.addColorStop(0, '#ffcc44');
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(wx - w * 0.3, y, winW + w * 0.6, h * 0.5);
    ctx.restore();
  }

  // Door
  const doorW = w * 0.18;
  const doorH = h * 0.55;
  const doorX = x - doorW / 2;
  const doorY = y - doorH;
  ctx.fillStyle = '#2a1008';
  ctx.fillRect(doorX, doorY, doorW, doorH);
  ctx.strokeStyle = '#1a0800';
  ctx.lineWidth = 1;
  ctx.strokeRect(doorX, doorY, doorW, doorH);
  // Door knob
  ctx.beginPath();
  ctx.arc(doorX + doorW * 0.75, doorY + doorH * 0.5, 2, 0, Math.PI * 2);
  ctx.fillStyle = '#8a7040';
  ctx.fill();
}

function drawTree(tree) {
  const { x, y, scale, snowDepth } = tree;
  const trunkH = 8 * scale;
  const trunkW = 4 * scale;
  const treeH = 40 * scale;
  const treeW = 25 * scale;

  // Trunk
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(x - trunkW / 2, y - trunkH, trunkW, trunkH);

  // Tree tiers
  for (let tier = 0; tier < 3; tier++) {
    const tierY = y - trunkH - tier * treeH * 0.3;
    const tierW = treeW * (1 - tier * 0.25);
    const tierBottom = tierY;
    const tierTop = tierY - treeH * 0.35;

    const tierGrad = ctx.createLinearGradient(x, tierTop, x, tierBottom);
    tierGrad.addColorStop(0, tier === 0 ? '#1a4a2a' : '#1a3a20');
    tierGrad.addColorStop(1, tier === 0 ? '#0a2a10' : '#0a1a08');

    ctx.beginPath();
    ctx.moveTo(x, tierTop);
    ctx.lineTo(x - tierW, tierBottom);
    ctx.lineTo(x + tierW, tierBottom);
    ctx.closePath();
    ctx.fillStyle = tierGrad;
    ctx.fill();

    // Snow on branches
    if (snowDepth > 0.3) {
      ctx.beginPath();
      ctx.moveTo(x - tierW * 0.8, tierTop + (tierBottom - tierTop) * 0.3);
      ctx.quadraticCurveTo(x, tierTop - snowDepth * 0.5, x + tierW * 0.8, tierTop + (tierBottom - tierTop) * 0.3);
      ctx.lineTo(x + tierW * 0.6, tierTop + (tierBottom - tierTop) * 0.4);
      ctx.quadraticCurveTo(x, tierTop + (tierBottom - tierTop) * 0.15, x - tierW * 0.6, tierTop + (tierBottom - tierTop) * 0.4);
      ctx.closePath();
      ctx.fillStyle = `rgba(220, 230, 240, ${Math.min(snowDepth * 0.3, 0.7)})`;
      ctx.fill();
    }
  }

  // Snow on top
  if (snowDepth > 0.2) {
    ctx.beginPath();
    ctx.ellipse(x, y - trunkH - treeH * 0.35, treeW * 0.3, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 230, 240, ${Math.min(snowDepth * 0.4, 0.8)})`;
    ctx.fill();
  }
}

function drawSnowLayers() {
  for (const layer of snowLayers) {
    if (layer.depth < 0.5) continue;
    const depth = layer.depth;
    ctx.beginPath();
    ctx.moveTo(layer.x, layer.baseY);
    for (let sx = layer.x; sx <= layer.x + layer.w; sx += 2) {
      const t = (sx - layer.x) / layer.w;
      const bump = Math.sin(t * Math.PI) * depth * 0.5;
      ctx.lineTo(sx, layer.baseY - depth + bump);
    }
    ctx.lineTo(layer.x + layer.w, layer.baseY);
    ctx.closePath();
    ctx.fillStyle = '#dce4ee';
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(240, 245, 255, ${p.opacity})`;
    ctx.fill();
  }
}

function drawGlassReflection() {
  ctx.save();

  // Clip to globe
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeR, 0, Math.PI * 2);
  ctx.clip();

  // Inner glow
  const innerGlow = ctx.createRadialGradient(globeX, globeY, globeR * 0.3, globeX, globeY, globeR);
  innerGlow.addColorStop(0, 'rgba(100, 140, 200, 0.03)');
  innerGlow.addColorStop(1, 'rgba(50, 80, 140, 0.08)');
  ctx.fillStyle = innerGlow;
  ctx.fillRect(globeX - globeR, globeY - globeR, globeR * 2, globeR * 2);

  ctx.restore();

  // Glass outline
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(180, 200, 230, 0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Main highlight (top-left)
  ctx.save();
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeR, 0, Math.PI * 2);
  ctx.clip();

  const hlGrad = ctx.createRadialGradient(
    globeX - globeR * 0.35, globeY - globeR * 0.35, 0,
    globeX - globeR * 0.35, globeY - globeR * 0.35, globeR * 0.6
  );
  hlGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
  hlGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
  hlGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = hlGrad;
  ctx.fillRect(globeX - globeR, globeY - globeR, globeR * 2, globeR * 2);

  // Secondary highlight (bottom-right)
  const hl2Grad = ctx.createRadialGradient(
    globeX + globeR * 0.3, globeY + globeR * 0.3, 0,
    globeX + globeR * 0.3, globeY + globeR * 0.3, globeR * 0.3
  );
  hl2Grad.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
  hl2Grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = hl2Grad;
  ctx.fillRect(globeX - globeR, globeY - globeR, globeR * 2, globeR * 2);

  ctx.restore();

  // Glass edge ring
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeR, 0, Math.PI * 2);
  const edgeGrad = ctx.createRadialGradient(globeX, globeY, globeR - 8, globeX, globeY, globeR);
  edgeGrad.addColorStop(0, 'rgba(200, 220, 240, 0)');
  edgeGrad.addColorStop(1, 'rgba(200, 220, 240, 0.15)');
  ctx.strokeStyle = edgeGrad;
  ctx.lineWidth = 8;
  ctx.stroke();
}

function drawAmbientParticles() {
  // Dust/snow outside globe
  const time = Date.now() * 0.0003;
  for (let i = 0; i < 30; i++) {
    const ax = (Math.sin(time + i * 7.3) * 0.5 + 0.5) * W;
    const ay = (Math.cos(time * 0.7 + i * 3.1) * 0.5 + 0.5) * H;
    const ao = 0.05 + Math.sin(time + i) * 0.03;
    ctx.beginPath();
    ctx.arc(ax, ay, 1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 200, 230, ${ao})`;
    ctx.fill();
  }
}

// --- Main loop ---
let lastTime = performance.now();

function update(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // Shake logic
  const elapsed = now - lastShake;
  if (!isShaking && elapsed > SHAKE_INTERVAL) {
    isShaking = true;
    shakeTime = 0;
  }

  if (isShaking) {
    shakeTime += dt * 1000;
    if (shakeTime > SHAKE_DURATION) {
      isShaking = false;
      lastShake = now;
    }
  }

  updateParticles(dt, isShaking);

  // Slowly accumulate snow between shakes
  for (const cab of cabins) {
    cab.snowDepth = Math.min(cab.snowDepth + dt * 0.02, 8);
  }
  for (const tree of trees) {
    tree.snowDepth = Math.min(tree.snowDepth + dt * 0.015, 6);
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawAmbientParticles();

  // Globe content (clipped)
  ctx.save();
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeR - 1, 0, Math.PI * 2);
  ctx.clip();

  // Dark interior background
  const intGrad = ctx.createRadialGradient(globeX, globeY, 0, globeX, globeY, globeR);
  intGrad.addColorStop(0, '#1a2040');
  intGrad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = intGrad;
  ctx.fillRect(globeX - globeR, globeY - globeR, globeR * 2, globeR * 2);

  drawGround();
  drawSnowLayers();

  // Draw trees behind cabins
  for (const tree of trees) {
    if (tree.x < globeX - globeR * 0.1) drawTree(tree);
  }

  // Draw cabins
  for (const cab of cabins) {
    drawCabin(cab);
  }

  // Draw trees in front
  for (const tree of trees) {
    if (tree.x >= globeX - globeR * 0.1) drawTree(tree);
  }

  drawParticles();

  ctx.restore();

  drawGlassReflection();
  drawGlobeBase();
}

// --- Init ---
initScene();
requestAnimationFrame(update);
</script>
