<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Data Table</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#0f172a;
    --text-secondary:#64748b;--primary:#6366f1;--primary-light:#e0e7ff;
    --radius:8px;--radius-lg:12px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
    --transition:200ms cubic-bezier(.4,0,.2,1);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    padding:2rem 1rem;min-height:100vh;
  }
  .container{max-width:1100px;margin:0 auto}

  .page-header{margin-bottom:1.5rem}
  .page-header h1{font-size:1.75rem;font-weight:700;letter-spacing:-.025em;color:var(--text)}
  .page-header p{color:var(--text-secondary);font-size:.925rem;margin-top:.25rem}

  .toolbar{
    display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap;
  }
  .search-box{
    position:relative;flex:1;min-width:200px;max-width:320px;
  }
  .search-box input{
    width:100%;padding:.55rem .85rem .55rem 2.25rem;border:1.5px solid var(--border);
    border-radius:var(--radius);font-size:.875rem;background:var(--surface);
    transition:border var(--transition),box-shadow var(--transition);outline:none;
  }
  .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
  .search-box svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-secondary);pointer-events:none}
  .btn{
    display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;
    border:1.5px solid var(--border);border-radius:var(--radius);font-size:.825rem;
    font-weight:500;background:var(--surface);color:var(--text);cursor:pointer;
    transition:all var(--transition);white-space:nowrap;
  }
  .btn:hover{border-color:#cbd5e1;background:#f8fafc}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:#4f46e5}

  .table-wrapper{
    background:var(--surface);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--border);
  }
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  table{width:100%;border-collapse:collapse;min-width:700px}
  thead{position:sticky;top:0;z-index:10}
  thead th{
    background:#f8fafc;padding:.75rem 1rem;font-size:.75rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);
    border-bottom:2px solid var(--border);text-align:left;user-select:none;
    white-space:nowrap;position:relative;
  }
  thead th.sortable{cursor:pointer;transition:color var(--transition)}
  thead th.sortable:hover{color:var(--text)}
  thead th .sort-arrow{
    display:inline-flex;flex-direction:column;gap:1px;margin-left:.4rem;vertical-align:middle;
    opacity:.3;transition:opacity var(--transition),transform var(--transition);
  }
  thead th.sort-asc .sort-arrow,thead th.sort-desc .sort-arrow{opacity:1}
  thead th .sort-arrow svg{width:10px;height:10px;display:block}
  thead th.sort-asc .sort-arrow .arrow-down{opacity:.25}
  thead th.sort-desc .sort-arrow .arrow-up{opacity:.25}
  thead th.sort-asc .sort-arrow{transform:translateY(1px)}
  thead th.sort-desc .sort-arrow{transform:translateY(-1px)}

  tbody tr{
    border-bottom:1px solid var(--border);transition:background var(--transition);
  }
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:#f8fafc}
  tbody td{padding:.7rem 1rem;font-size:.875rem;vertical-align:middle}

  .checkbox-cell{width:40px;text-align:center}
  .checkbox-cell input[type="checkbox"]{
    width:16px;height:16px;accent-color:var(--primary);cursor:pointer;
  }

  .user-cell{display:flex;align-items:center;gap:.75rem}
  .avatar{
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:.75rem;font-weight:700;color:#fff;
    flex-shrink:0;letter-spacing:.02em;
  }
  .user-info{display:flex;flex-direction:column}
  .user-name{font-weight:600;font-size:.875rem;color:var(--text)}
  .user-email{font-size:.8rem;color:var(--text-secondary)}

  .status-chip{
    display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .65rem;
    border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap;
  }
  .status-chip::before{
    content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;
  }
  .status-active{background:#dcfce7;color:#166534}
  .status-active::before{background:#22c55e}
  .status-inactive{background:#f1f5f9;color:#64748b}
  .status-inactive::before{background:#94a3b8}
  .status-pending{background:#fef3c7;color:#92400e}
  .status-pending::before{background:#f59e0b}
  .status-banned{background:#fee2e2;color:#991b1b}
  .status-banned::before{background:#ef4444}

  .role-badge{
    display:inline-block;padding:.15rem .5rem;border-radius:4px;
    font-size:.75rem;font-weight:500;background:#f1f5f9;color:#475569;
  }

  .date-cell{color:var(--text-secondary);font-size:.825rem;white-space:nowrap}

  .actions-cell{display:flex;gap:.25rem}
  .action-btn{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border:none;background:transparent;border-radius:6px;cursor:pointer;
    color:var(--text-secondary);transition:all var(--transition);
  }
  .action-btn:hover{background:#f1f5f9;color:var(--text)}

  .table-footer{
    display:flex;align-items:center;justify-content:space-between;
    padding:.75rem 1rem;border-top:1px solid var(--border);flex-wrap:wrap;gap:.75rem;
  }
  .footer-info{font-size:.825rem;color:var(--text-secondary)}
  .pagination{display:flex;align-items:center;gap:.25rem}
  .page-pill{
    min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    padding:0 .5rem;border:1.5px solid var(--border);border-radius:var(--radius);
    font-size:.825rem;font-weight:500;background:var(--surface);color:var(--text);
    cursor:pointer;transition:all var(--transition);
  }
  .page-pill:hover{border-color:#cbd5e1;background:#f8fafc}
  .page-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .page-pill:disabled{opacity:.4;cursor:default;pointer-events:none}

  .row-enter{animation:rowSlideIn .35s ease both}
  @keyframes rowSlideIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }

  @media(max-width:768px){
    body{padding:1rem .5rem}
    .page-header h1{font-size:1.35rem}
    .search-box{max-width:100%;min-width:0}
    .hide-mobile{display:none!important}
    thead th,tbody td{padding:.6rem .65rem;font-size:.8rem}
    .avatar{width:30px;height:30px;font-size:.65rem}
    .user-email{display:none}
    .table-footer{flex-direction:column;align-items:center}
  }
  @media(max-width:480px){
    .hide-narrow{display:none!important}
    .toolbar{flex-direction:column;align-items:stretch}
    .search-box{max-width:none}
  }
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>Users</h1>
    <p>Manage your team members and their account permissions.</p>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M16 16l-3.5-3.5"/></svg>
      <input type="text" placeholder="Search users…" id="searchInput">
    </div>
    <button class="btn btn-primary" onclick="alert('Add user clicked')">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg>
      Add User
    </button>
    <button class="btn hide-narrow">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1h12M4 5h6M6 9h2"/></svg>
      Filter
    </button>
  </div>

  <div class="table-wrapper">
    <div class="table-scroll">
      <table id="userTable">
        <thead>
          <tr>
            <th class="checkbox-cell"><input type="checkbox" id="selectAll" aria-label="Select all"></th>
            <th class="sortable" data-key="name">Name<span class="sort-arrow"><svg class="arrow-up" viewBox="0 0 10 6"><path d="M5 0l5 6H0z" fill="currentColor"/></svg><svg class="arrow-down" viewBox="0 0 10 6"><path d="M5 6L0 0h10z" fill="currentColor"/></svg></span></th>
            <th class="sortable hide-narrow" data-key="role">Role<span class="sort-arrow"><svg class="arrow-up" viewBox="0 0 10 6"><path d="M5 0l5 6H0z" fill="currentColor"/></svg><svg class="arrow-down" viewBox="0 0 10 6"><path d="M5 6L0 0h10z" fill="currentColor"/></svg></span></th>
            <th class="sortable" data-key="status">Status<span class="sort-arrow"><svg class="arrow-up" viewBox="0 0 10 6"><path d="M5 0l5 6H0z" fill="currentColor"/></svg><svg class="arrow-down" viewBox="0 0 10 6"><path d="M5 6L0 0h10z" fill="currentColor"/></svg></span></th>
            <th class="sortable hide-mobile" data-key="date">Joined<span class="sort-arrow"><svg class="arrow-up" viewBox="0 0 10 6"><path d="M5 0l5 6H0z" fill="currentColor"/></svg><svg class="arrow-down" viewBox="0 0 10 6"><path d="M5 6L0 0h10z" fill="currentColor"/></svg></span></th>
            <th class="hide-mobile">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="table-footer">
      <div class="footer-info" id="footerInfo">Showing 1-15 of 15 users</div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<script>
const users = [
  { id:1, name:"Olivia Martin", email:"olivia@example.com", role:"Admin", status:"active", date:"2024-01-15", color:"#6366f1" },
  { id:2, name:"Jackson Lee", email:"jackson@example.com", role:"Editor", status:"active", date:"2024-02-20", color:"#8b5cf6" },
  { id:3, name:"Isabella Nguyen", email:"isabella@example.com", role:"Viewer", status:"pending", date:"2024-03-10", color:"#ec4899" },
  { id:4, name:"William Kim", email:"william@example.com", role:"Editor", status:"active", date:"2024-01-28", color:"#f59e0b" },
  { id:5, name:"Sofia Davis", email:"sofia@example.com", role:"Admin", status:"active", date:"2023-11-05", color:"#10b981" },
  { id:6, name:"Liam Johnson", email:"liam@example.com", role:"Viewer", status:"inactive", date:"2023-09-14", color:"#3b82f6" },
  { id:7, name:"Ava Williams", email:"ava@example.com", role:"Editor", status:"active", date:"2024-04-02", color:"#ef4444" },
  { id:8, name:"Noah Brown", email:"noah@example.com", role:"Viewer", status:"banned", date:"2023-07-22", color:"#f97316" },
  { id:9, name:"Mia Garcia", email:"mia@example.com", role:"Admin", status:"active", date:"2024-05-18", color:"#14b8a6" },
  { id:10, name:"Ethan Jones", email:"ethan@example.com", role:"Editor", status:"pending", date:"2024-06-01", color:"#a855f7" },
  { id:11, name:"Charlotte Wilson", email:"charlotte@example.com", role:"Viewer", status:"active", date:"2024-03-25", color:"#06b6d4" },
  { id:12, name:"Lucas Moore", email:"lucas@example.com", role:"Editor", status:"inactive", date:"2023-12-10", color:"#84cc16" },
  { id:13, name:"Amelia Taylor", email:"amelia@example.com", role:"Admin", status:"active", date:"2024-07-08", color:"#e11d48" },
  { id:14, name:"Mason Anderson", email:"mason@example.com", role:"Viewer", status:"pending", date:"2024-08-14", color:"#7c3aed" },
  { id:15, name:"Harper Thomas", email:"harper@example.com", role:"Editor", status:"active", date:"2024-09-03", color:"#0ea5e9" },
];

let currentSort = { key: null, dir: 'asc' };
let filteredUsers = [...users];
const ROWS_PER_PAGE = 8;
let currentPage = 1;

const avatarColors = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#f97316','#14b8a6','#a855f7','#06b6d4','#84cc16','#e11d48','#7c3aed','#0ea5e9'];

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase();
}

function formatDate(d) {
  const date = new Date(d + 'T00:00:00');
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function getStatusClass(status) {
  return 'status-' + status;
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const start = (currentPage - 1) * ROWS_PER_PAGE;
  const end = start + ROWS_PER_PAGE;
  const pageUsers = filteredUsers.slice(start, end);

  // Store old positions for FLIP
  const oldPositions = new Map();
  tbody.querySelectorAll('tr').forEach((tr, i) => {
    const id = parseInt(tr.dataset.id);
    const rect = tr.getBoundingClientRect();
    oldPositions.set(id, { top: rect.top, index: i });
  });

  let html = '';
  pageUsers.forEach((user, i) => {
    const initials = getInitials(user.name);
    const color = avatarColors[user.id - 1];
    html += `
      <tr data-id="${user.id}" class="row-enter" style="animation-delay:${i * 25}ms">
        <td class="checkbox-cell"><input type="checkbox" class="row-check" data-id="${user.id}"></td>
        <td>
          <div class="user-cell">
            <div class="avatar" style="background:${color}">${initials}</div>
            <div class="user-info">
              <span class="user-name">${user.name}</span>
              <span class="user-email">${user.email}</span>
            </div>
          </div>
        </td>
        <td class="hide-narrow"><span class="role-badge">${user.role}</span></td>
        <td><span class="status-chip ${getStatusClass(user.status)}">${user.status.charAt(0).toUpperCase() + user.status.slice(1)}</span></td>
        <td class="date-cell hide-mobile">${formatDate(user.date)}</td>
        <td class="hide-mobile">
          <div class="actions-cell">
            <button class="action-btn" title="Edit"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 1.5l2 2M1.5 13.5l.8-2.5 7.5-7.5 2.5 2.5-7.5 7.5-3.3-.5z"/></svg></button>
            <button class="action-btn" title="Delete"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5h10M5.5 3.5V2.5a1 1 0 011-1h2a1 1 0 011 1v1M4.5 3.5l.5 9.5a1 1 0 001 1h3a1 1 0 001-1l.5-9.5"/></svg></button>
          </div>
        </td>
      </tr>`;
  });
  tbody.innerHTML = html;

  // FLIP: animate rows to new positions
  pageUsers.forEach((user) => {
    const tr = tbody.querySelector(`tr[data-id="${user.id}"]`);
    const old = oldPositions.get(user.id);
    const newRect = tr.getBoundingClientRect();
    if (old && Math.abs(old.top - newRect.top) > 1) {
      const delta = old.top - newRect.top;
      tr.style.transform = `translateY(${delta}px)`;
      tr.style.transition = 'none';
      tr.offsetHeight; // force reflow
      requestAnimationFrame(() => {
        tr.style.transition = 'transform 350ms cubic-bezier(.4,0,.2,1), opacity 350ms ease';
        tr.style.transform = 'translateY(0)';
        setTimeout(() => { tr.style.transition = ''; tr.style.transform = ''; }, 360);
      });
    }
  });

  updateFooter();
  updateSelectAll();
}

function updateFooter() {
  const total = filteredUsers.length;
  const start = (currentPage - 1) * ROWS_PER_PAGE + 1;
  const end = Math.min(currentPage * ROWS_PER_PAGE, total);
  document.getElementById('footerInfo').textContent = total === 0 ? 'No users found' : `Showing ${start}-${end} of ${total} users`;

  const totalPages = Math.ceil(total / ROWS_PER_PAGE);
  const pag = document.getElementById('pagination');
  let html = `<button class="page-pill" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="page-pill ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-pill" ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">›</button>`;
  pag.innerHTML = html;
}

function goPage(p) {
  const totalPages = Math.ceil(filteredUsers.length / ROWS_PER_PAGE);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderTable();
}

function updateSelectAll() {
  const checks = document.querySelectorAll('.row-check');
  const selectAll = document.getElementById('selectAll');
  if (checks.length === 0) { selectAll.checked = false; selectAll.indeterminate = false; return; }
  const allChecked = [...checks].every(c => c.checked);
  const someChecked = [...checks].some(c => c.checked);
  selectAll.checked = allChecked;
  selectAll.indeterminate = someChecked && !allChecked;
}

document.getElementById('selectAll').addEventListener('change', function() {
  document.querySelectorAll('.row-check').forEach(c => c.checked = this.checked);
});

document.querySelectorAll('.sortable').forEach(th => {
  th.addEventListener('click', function() {
    const key = this.dataset.key;
    if (currentSort.key === key) {
      currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSort.key = key;
      currentSort.dir = 'asc';
    }
    document.querySelectorAll('.sortable').forEach(t => t.classList.remove('sort-asc', 'sort-desc'));
    this.classList.add(currentSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');
    sortUsers();
    currentPage = 1;
    renderTable();
  });
});

function sortUsers() {
  const { key, dir } = currentSort;
  if (!key) return;
  filteredUsers.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (key === 'date') { va = new Date(va); vb = new Date(vb); }
    else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  filteredUsers = users.filter(u =>
    u.name.toLowerCase().includes(q) ||
    u.email.toLowerCase().includes(q) ||
    u.role.toLowerCase().includes(q) ||
    u.status.toLowerCase().includes(q)
  );
  if (currentSort.key) sortUsers();
  currentPage = 1;
  renderTable();
});

// Delegate row checkbox changes
document.getElementById('tableBody').addEventListener('change', function(e) {
  if (e.target.classList.contains('row-check')) updateSelectAll();
});

// Initial render
renderTable();
</script>
</body>
</html>
