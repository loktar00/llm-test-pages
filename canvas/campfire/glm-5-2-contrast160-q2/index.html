<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire Night</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100; height: 100; overflow: hidden; background: #02040a; }
canvas { display: block; width: 100vmax; height: 100vmax; position: absolute; top: 50; left: 50; transform: translate(-50, -50); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1, time=0;
const groundY = () => H * 0.62;
const campX = () => W / 2;
const campY = () => groundY() + 6;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = Math.floor(window.innerWidth * DPR);
  H = canvas.height = Math.floor(window.innerHeight * DPR);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  initBackground();
  initStars();
  initStones();
  initTrees();
  initLogs();
  initGrass();
}
function rand(a,b){ return a + Math.random()*(b-a); }
function lerp(a,b,t){ return a + (b-a)*t; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

let stars=[], metors=[], embers=[], flame=[];
let stones=[], logs=[], trees=[], grass=[];
let bgCanvas, fireGlowCanvas;
let metorTimer=0, logTimer=0, emberTimer=0;

class FlameParticle {
  constructor(){
    this.reset();
  }
  reset(x,y){
    const fx = campX() + (Math.random()-0.5)*18;
    const fy = campY() - Math.random()*40 - 20;
    this.x = (x!==undefined ? x : fx);
    this.y = (y!==undefined ? y : fy);
    this.vx = (Math.random()-0.5)*0.8;
    this.vy = -rand(2.4, 4.6);
    this.life = 1;
    this.maxLife = rand(140, 280);
    this.size = rand(6, 12);
    this.h = rand(0, 60);
    this.seed = Math.random()*9999;
  }
  update(){
    const cx = campX();
    const base = campY();
    const k = 1 - this.life;
    const drift = Math.sin(time*0.002 + this.seed) * 1.6;
    const side = (this.x < cx ? -1 : 1) * 0.04;
    this.vx += (side - this.vx*0.012) * 0.025 + drift * 0.006;
    this.vy -= 0.05; // gravity-ish (buoyancy)
    this.x += this.vx;
    this.y += this.vy - k * 1.0;
    const dx = this.x - cx;
    if (Math.abs(dx) > 100) this.vx -= dx*0.006;
    this.life += 1 / this.maxLife;
    if (this.y < 0 || this.life > 1) this.reset();
  }
  draw(c){
    const r = this.size * (1 + (1 - this.life) * 0.7);
    const h = clamp(this.h * 0.8 + this.life * 30, 0, 60);
    const a = (1 - this.life) * 0.95 * Math.min(1, this.life * 3.3);
    if (a < 0.01) return;
    c.globalAlpha = a;
    c.fillStyle = `hsl(${h}, 100, 65)`;
    c.beginPath();
    c.arc(this.x, this.y, r, 0, Math.PI*2);
    c.fill();
    c.globalAlpha = 1;
  }
}

function initFlame() {
  flame = [];
  for (let i=0; i<40; i++) {
    const p = new FlameParticle();
    p.life = Math.random() * 0.6;
    flame.push(p);
  }
}

class Ember {
  constructor(){
    const a = rand(-Math.PI*0.15, Math.PI*0.15) - Math.PI/2;
    const sp = rand(0.6, 2.2);
    this.x = campX() + (Math.random()-0.5)*40;
    this.y = campY() - Math.random()*30 - 8;
    this.vx = Math.cos(a)*sp*0.6 + (Math.random()-0.5)*0.2;
    this.vy = Math.sin(a)*sp;
    this.r = rand(0.6, 1.2);
    this.life = 0;
    this.maxLife = rand(50, 130);
    this.spiral = rand(0.1, 0.3);
    this.phase = Math.random()*Math.PI*2;
    this.color = Math.random();
  }
  update(){
    this.life++;
    this.phase += 0.05;
    const k = this.life/this.maxLife;
    this.vx += Math.sin(this.phase) * this.spiral * 0.005;
    this.vy -= 0.03;
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < 0 || k > 1) return true;
    return false;
  }
  draw(c){
    const k = this.life/this.maxLife;
    const a = (1 - k) * 0.8;
    if (a < 0.01) return;
    c.globalAlpha = a;
    const col = this.color < 0.7 ? '#ff6a20' : '#ffae5c';
    c.fillStyle = col;
    c.beginPath();
    c.arc(this.x, this.y, this.r*(1-k*0.6), 0, Math.PI*2);
    c.fill();
    c.fillStyle = `rgba(255, 240, 200, ${(1-k)*0.7})`;
    c.beginPath();
    c.arc(this.x, this.y, this.r*0.6, 0, Math.PI*2);
    c.fill();
    c.globalAlpha = 1;
  }
}

function initStars() {
  stars = [];
  const N = Math.floor(W*H/7000) * DPR * DPR;
  for (let i=0; i<N; i++) {
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.5,
      r: rand(0.3, 1.0),
      tw: Math.random()*Math.PI*2,
      sp: rand(0.002, 0.04),
      br: rand(0.5, 1.0),
      warm: Math.random() < 0.15,
    });
  }
  meorCanvas = null;
}

class Metor {
  constructor(){
    const side = Math.random()<0.5 ? 0 : 1;
    const sx = side==0 ? -20 : W+20;
    const sy = rand(0, H*0.4);
    const ex = rand(0, W);
    const ey = rand(0, H*0.6);
    const dx = ex - sx;
    const dy = ey - sy;
    const len = Math.sqrt(dx*dx + dy*dy);
    const sp = rand(7, 9);
    this.x = sx;
    this.y = sy;
    this.vx = (dx/len) * sp;
    this.vy = (dy/len) * sp;
    this.trail = [];
    this.life = 0;
    this.maxLife = 50 + Math.random()*20;
  }
  update(){
    this.trail.push({x:this.x, y:this.y});
    if (this.trail.length > 30) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
    return this.life >= this.maxLife;
  }
  draw(c){
    const a0 = 0.6;
    const a1 = 0.2;
    const k = this.life / this.maxLife;
    const fade = 1 - k;
    c.save();
    c.strokeStyle = `rgba(255, 240, 200, ${a0*fade})`;
    c.lineWidth = 1.2;
    c.beginPath();
    for (let i=0; i<this.trail.length; i++) {
      const p = this.trail[i];
      const t = i / this.trail.length;
      const alpha = Math.pow(t, 0.4);
      if (i==0) {
        c.globalAlpha = alpha * fade * a0;
        c.moveTo(p.x, p.y);
      } else {
        c.globalAlpha = alpha * fade * a0;
        c.lineTo(p.x, p.y);
      }
    }
    c.stroke();
    c.globalAlpha = fade;
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(this.x, this.y, 1.5, 0, Math.PI*2);
    c.fill();
    c.restore();
  }
}

let meorCanvas = null;
let meorCanvasCtx = null;
function initMeorCache() {
  if (meorCanvas) return;
  meorCanvas = document.createElement('canvas');
  meorCanvas.width = 128;
  meorCanvas.height = 128;
  const c = meorCanvas.getContext('2d');
  const grad = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255, 240, 200, 1)');
  grad.addColorStop(0.2, 'rgba(255, 200, 120, 1)');
  grad.addColorStop(0.3, 'rgba(255, 200, 120, 0.6)');
  grad.addColorStop(1, 'rgba(255, 200, 120, 0)');
  c.fillStyle = grad;
  c.fillRect(0,0,128,128);
}

class Stone {
  constructor(angle, radius){
    this.angle = angle;
    this.r = radius * (rand(0.6, 1.05));
    this.ox = Math.random()*5-2.5;
    this.oy = Math.random()*5-2.5;
    this.size = rand(16, 30);
    this.shade = rand(0.2, 1.0);
    this.tone = rand(0.0, 0.5);
    this.squash = Math.random()*Math.PI*2;
    this.shine = rand(0.6, 1.0);
  }
  draw(c, light){
    const cx = campX();
    const cy = campY();
    const px = cx + Math.cos(this.angle)*this.r + this.ox;
    const py = cy + Math.sin(this.angle)*this.r*0.3 + this.oy;
    const s = this.size * DPR / DPR;
    const rx = s * 0.7;
    const ry = s * 0.6;
    // shadow
    c.fillStyle = 'rgba(0,0,0,0.7)';
    c.beginPath();
    c.ellipse(px + 4, py + 6, rx*0.7, ry*0.5, 0, 0, Math.PI*2);
    c.fill();
    // body
    const b = 0.12 + light*0.7;
    c.fillStyle = `rgb(${Math.floor(120*b), ${Math.floor(120*b), ${Math.floor(125*b))}`;
    c.beginPath();
    c.ellipse(px, py, rx, ry, 0, 0, Math.PI*2);
    c.fill();
    // highlights
    c.fillStyle = `rgba(${Math.floor(125*light*0.8+25), ${Math.floor(125*light*0.8+25), 255, 0.4)`;
    c.beginPath();
    c.ellipse(px - rx*0.2, py - ry*0.3, rx*0.3, ry*0.3, 0, 0, Math.PI*2);
    c.fill();
    // dark side
    c.fillStyle = 'rgba(0, 0, 0, 0.6)';
    c.beginPath();
    c.ellipse(px + rx*0.3, py + ry*0.4, rx*0.35, ry*0.35, 0, 0, Math.PI*2);
    c.fill();
    c.fillStyle = 'rgba(0, 0, 0, 0.4)';
    c.beginPath();
    c.ellipse(px + 1, py + ry*0.5, rx*0.95, ry*0.2, 0, 0, Math.PI*2);
    c.fill();
  }
}

function initStones() {
  stones = [];
  const N = 7;
  for (let i=0; i<N; i++) {
    const a = (i/N)*Math.PI*2 + rand(-0.1, 0.1);
    const r = rand(50, 70);
    stones.push(new Stone(a, r));
  }
}

function initTrees() {
  trees = [];
  trees.push(new Tree(W*0.25, groundY() - Math.random()*5, 60, 200));
  trees.push(new Tree(W*0.75, groundY() + Math.random()*5, 60, 200));
}

class Tree {
  constructor(x, y, w, h) {
    this.baseX = x;
    this.baseY = y;
    this.trunkH = h;
    this.trunkW = w;
    this.jitter = new Array(6).fill(0).map(_=>new _JP());
    this._pts = new Array(5).fill(0).map(_=>0);
  }
  update() {
    this.jitter.forEach(j => j.update());
    this._pts.forEach((p, i, arr) => {
      if (i === 0) arr[i] = (Math.random()-0.5)*0.4;
      else arr[i] = arr[i-1] + (Math.random()-0.5)*0.3;
    });
  }
  draw(c, light) {
    const jx = this.jitter[0].x * 2;
    const jy = this.jitter[0].y * 2;
    const baseX = this.baseX + jx;
    const baseY = this.baseY + jy;
    const w = this.trunkW;
    const h = this.trunkH;
    const c1 = 5 + light*30;
    const c2 = 20 + light*25;
    // shadow
    c.fillStyle = `rgba(0,0,0,0.${Math.floor(70 + light*30)))`;
    c.beginPath();
    c.moveTo(baseX - w*0.2 + 5, baseY + 5);
    c.lineTo(baseX + w*0.6 + 5, baseY + 5);
    c.lineTo(baseX - w*0.2 - 5, baseY + 5);
    c.lineTo(baseX - w*1.4 - 5, baseY + h + 5);
    c.lineTo(baseX - w*1.4 - 5, baseY + 5);
    c.fill();
    // trunk
    const grad = c.createLinearGradient(baseX - w*0.6, baseY, baseX - w*0.6, baseY - h);
    grad.addColorStop(0, `rgb(${c2, $c2, $c2)`);
    grad.addColorStop(1, `rgb($Math.floor(c1), $Math.floor(c1), $Math.floor(c1)`);
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(baseX - w*0.5, baseY);
    c.lineTo(baseX + w*0.5, baseY);
    c.lineTo(baseX + w*0.5 + 5, baseY - h);
    c.lineTo(baseX - w*0.5 - 5, baseY - h);
    c.closePath();
    c.fill();
    // bark stripes
    c.strokeStyle = `rgba(0,0,0,0.4)`;
    c.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const sx = baseX + (i - 2) * w * 0.25;
      const jx2 = this.jitter[1].x * 2;
      c.beginPath();
      c.moveTo(sx + jx2*0.5, baseY);
      const c1x = sx + jx2*0.5 + (i - 2) * 5;
      const c1y = baseY - h * 0.4;
      c.lineTo(c1x, c1y);
      const c2x = sx + (i - 2) * 5;
      const c2y = baseY - h * 0.6;
      c.lineTo(c2x, c2y);
      const c3x = sx + jx2*0.5 + (i - 2) * 5;
      const c3y = baseY - h;
      c.lineTo(c3x, c3y);
      c.stroke();
    }
    // branches
    for (let i = 0; i < 3; i++) {
      const jx3 = this.jitter[i+2].x;
      const jy3 = this.jitter[i+2].y;
      const by = baseY - h + i * 5;
      const bw = w * 0.2;
      const bh = h * 0.05;
      c.strokeStyle = `rgb($Math.floor(c1*0.5), $Math.floor(c1*0.5), $Math.floor(c1*0.5)`;
      c.lineWidth = 2;
      const bx1 = baseX + (i - 1) * 5 + jx3*2;
      const by1 = by + jy3*2;
      c.beginPath();
      c.moveTo(bx1, by1);
      c.lineTo(bx1 + bw, by1 + bh);
      c.stroke();
    }
  }
}

class _JP {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.targetX = 0;
    this.targetY = 0;
    this.timer = 0;
  }
  update() {
    this.timer--;
    if (this.timer <= 0) {
      this.targetX = (Math.random() - 0.5) * 6;
      this.targetY = (Math.random() - 0.5) * 4;
      this.timer = rand(40, 80);
    }
    this.x = lerp(this.x, this.targetX, 0.05);
    this.y = lerp(this.y, this.targetY, 0.05);
  }
}

class Log {
  constructor(x, y, angle){
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.length = 60;
    this.radius = 10;
    this.blife = 1;
    this.freshness = 0;
    this.respawn = 0;
    this.id = Math.random();
  }
  update() {
    this.freshness = Math.max(0, this.freshness - 0.0005);
    if (this.blife > 0) {
      this.blife -= 0.001;
      if (this.blife <= 0) {
        this.blife = 0;
        this.respawn = 180 + Math.random()*60;
      }
    }
    if (this.respawn > 0) {
      this.respawn--;
      if (this.respawn <= 0) {
        this.blife = 1;
        this.freshness = 1;
        this.length = 60 + Math.random()*20;
        this.radius = 10 + Math.random()*3;
      }
    }
  }
  draw(c, light) {
    const k = this.blife;
    const fresh = this.freshness;
    const b = 1 - k;
    const s = clamp(this.length * (1 - b*0.5), 50, 100) * (1 + fresh*0.6);
    const r = this.radius * (1 - b*0.6) * (1 + fresh*0.4);
    const c1 = Math.floor(40 + light*40);
    const c2 = Math.floor(c1 * (1 + fresh*0.5));
    const c3 = Math.floor(c2 * 0.8 + fresh * 80);
    const a = k * 0.6 + 0.4 + fresh * 0.6;
    const jx = 0;
    const jy = 0;
    // shadow
    c.fillStyle = `rgba(0,0,0,0.${Math.floor(50 + light*30)))`;
    c.beginPath();
    c.ellipse(this.x + 5 + jx, this.y + 5 + jy, s*0.6, r*0.6, this.angle, 0, Math.PI*2);
    c.fill();
    // body
    const grad = c.createLinearGradient(this.x, this.y - r, this.x, this.y + r);
    grad.addColorStop(0, `rgba($c2, $c2, $c2, $a)`);
    grad.addColorStop(1, `rgba($c3, $c3, $c3, $a)`);
    c.fillStyle = grad;
    c.beginPath();
    c.ellipse(this.x, this.y, s, r, this.angle, 0, Math.PI*2);
    c.fill();
    // bark
    c.fillStyle = `rgba(0,0,0,0.${Math.floor(50 + light*30)))`;
    c.beginPath();
    c.ellipse(this.x, this.y, s, r*0.85, this.angle, 0, Math.PI*2);
    c.fill();
    c.fillStyle = `rgba($c2, $c2, $c2, $a)`;
    c.beginPath();
    c.ellipse(this.x, this.y, s*0.95, r*0.5, this.angle, 0, Math.PI*2);
    c.fill();
    // rings
    c.fillStyle = `rgba(0,0,0,0.${Math.floor(50 + light*30)))`;
    for (let i = -s; i < s; i += 10) {
      const px = this.x + Math.cos(this.angle) * i;
      const py = this.y + Math.sin(this.angle) * i;
      c.beginPath();
      c.ellipse(px, py, 2, r*0.95, this.angle, 0, Math.PI*2);
      c.fill();
    }
    // fresh glow
    if (fresh > 0) {
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, s);
      g.addColorStop(0, `rgba(255, 200, 100, $fresh*0.4)`);
      g.addColorStop(1, `rgba(0,0,0,0)`);
      c.fillStyle = g;
      c.beginPath();
      c.ellipse(this.x, this.y, s, r, this.angle, 0, Math.PI*2);
      c.fill();
    }
  }
}

function initLogs() {
  logs = [];
  logs.push(new Log(campX() - 5, campY() + 5, -Math.PI/8));
  logs.push(new Log(campX() - 5, campY() - 5, Math.PI/8));
  logs.push(new Log(campX() + 5, campY() - 5, -Math.PI + Math.PI/8));
  logs.push(new Log(campX() + 5, campY() + 5, -Math.PI - Math.PI/8));
  logs.push(new Log(campX() + 5, campY() - 5, Math.PI/2));
  logs.push(new Log(campX() - 5, campY() - 5, Math.PI/2));
}

class GrassBlade {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.sw = 0;
    this.h = 0;
    this.phase = 0;
    this.speed = 0;
    this.brightness = 0;
    this.kind = 0;
  }
  setup(x, y, sw, h, brightness, kind) {
    this.x = x;
    this.y = y;
    this.sw = sw;
    this.h = h;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = rand(0.01, 0.04);
    this.brightness = brightness;
    this.kind = kind;
  }
  update() {
    this.phase += this.speed;
  }
  draw(c, light) {
    const flicker = Math.sin(time*0.001 + this.phase) * 0.4;
    const jitter = Math.sin(time*0.02 + this.phase * 0.6) * 0.4;
    const sway = flicker + jitter;
    const r = 0.6 + light * 0.4 + this.brightness * 0.5;
    const r1 = Math.floor(r * 120);
    const r2 = Math.floor(r * 130);
    const r3 = Math.floor(r * 80);
    c.strokeStyle = `rgb($r1, $r2, $r3)`;
    c.lineWidth = 0.5 + this.sw * 0.5;
    c.beginPath();
    c.moveTo(this.x, this.y);
    const c1x = this.x + sway * 2;
    const c1y = this.y - this.h * 0.5;
    const c2x = this.x + sway * 5;
    const c2y = this.y - this.h;
    c.quadraticCurveTo(c1x, c1y, c2x, c2y);
    c.stroke();
  }
}

function initGrass() {
  grass = [];
  const gy = groundY();
  for (let i = 0; i < 50; i++) {
    const b = new GrassBlade();
    const x = W * (0.05 + 0.9 * Math.random());
    const y = gy + Math.random() * 5;
    const dist = Math.abs(x - campX());
    const lightness = 1 - clamp(dist / W, 0, 1) * 0.6;
    b.setup(x, y, rand(0.5, 2), rand(5, 15), lightness, Math.random());
    grass.push(b);
  }
  for (let i = 0; i < 50; i++) {
    const b = new GrassBlade();
    const x = W * (0.05 + 0.9 * Math.random());
    const y = gy + Math.random() * 5;
    const dist = Math.abs(x - campX());
    const lightness = 1 - clamp(dist / W, 0, 1) * 0.6;
    b.setup(x, y, rand(0.5, 2), rand(5, 15), lightness, Math.random());
    grass.push(b);
  }
}

function initBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W;
  bgCanvas.height = H;
  const c = bgCanvas.getContext('2d');
  // sky
  const skyGrad = c.createLinearGradient(0, 0, 0, H*0.6);
  skyGrad.addColorStop(0, '#0a1e3a');
  skyGrad.addColorStop(0.5, '#04101a');
  skyGrad.addColorStop(1, '#080a14');
  c.fillStyle = skyGrad;
  c.fillRect(0, 0, W, H*0.6);
  // distant glow
  const glowGrad = c.createRadialGradient(campX(), groundY(), 0, campX(), groundY(), W*0.6);
  glowGrad.addColorStop(0, 'rgba(0,0,0,0)');
  glowGrad.addColorStop(0.7, 'rgba(0,0,0,0)');
  glowGrad.addColorStop(1, 'rgba(20,40,60,0.6)');
  c.fillStyle = glowGrad;
  c.fillRect(0, 0, W, H*0.6);
  // horizon
  const horGrad = c.createLinearGradient(0, H*0.5, 0, H*0.65);
  horGrad.addColorStop(0, 'rgba(5,20,40,0.5)');
  horGrad.addColorStop(1, 'rgba(15,20,30,0.9)');
  c.fillStyle = horGrad;
  c.fillRect(0, H*0.5, W, H*0.15);
  // distant trees silhouette
  c.fillStyle = 'rgba(15,20,30,1)';
  for (let i = 0; i < 8; i++) {
    const x = W * (0.05 + 0.9 * (i / 8));
    const h = rand(40, 80);
    c.fillStyle = 'rgba(20,30,40,0.8)';
    c.fillRect(x, groundY() - 50, 5, h);
  }
  // ground
  const groundGrad = c.createLinearGradient(0, H*0.6, 0, H);
  groundGrad.addColorStop(0, '#1a1401');
  groundGrad.addColorStop(1, '#040a02');
  c.fillStyle = groundGrad;
  c.fillRect(0, H*0.6, W, H*0.4);
  // noise
  c.globalAlpha = 0.05;
  c.fillStyle = 'rgba(0,0,0,1)';
  for (let i = 0; i < 500; i++) {
    c.fillRect(rand(0,W), rand(0,H), 1, 1);
  }
  c.globalAlpha = 1;
  fireGlowCanvas = document.createElement('canvas');
  fireGlowCanvas.width = 128;
  fireGlowCanvas.height = 128;
  const fc = fireGlowCanvas.getContext('2d');
  const fgrad = fc.createRadialGradient(64, 64, 0, 64, 64, 64);
  fgrad.addColorStop(0, 'rgba(255, 200, 80, 1)');
  fgrad.addColorStop(0.2, 'rgba(255, 150, 0, 1)');
  fgrad.addColorStop(0.5, 'rgba(150, 40, 0, 1)');
  fgrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  fc.fillStyle = fgrad;
  fc.fillRect(0, 0, 128, 128);
}

function initFlame() {
  flame = [];
  for (let i=0; i<40; i++) {
    const p = new FlameParticle();
    p.life = Math.random() * 0.6;
    flame.push(p);
  }
}

function initStars() {
  stars = [];
  const N = Math.floor(W*H/7000);
  for (let i=0; i<N; i++) {
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.5,
      r: rand(0.3, 1.0),
      tw: Math.random()*Math.PI*2,
      sp: rand(0.002, 0.04),
      br: rand(0.5, 1.0),
      warm: Math.random() < 0.15,
    });
  }
  meorCanvas = null;
}

function initTrees() {
  trees = [];
  trees.push(new Tree(W*0.25, groundY() - Math.random()*5, 60, 200));
  trees.push(new Tree(W*0.75, groundY() + Math.random()*5, 60, 200));
}

function initStones() {
  stones = [];
  const N = 7;
  for (let i=0; i<N; i++) {
    const a = (i/N)*Math.PI*2 + rand(-0.1, 0.1);
    const r = rand(50, 70);
    stones.push(new Stone(a, r));
  }
}

function initLogs() {
  logs = [];
  logs.push(new Log(campX() - 5, campY() + 5, -Math.PI/8));
  logs.push(new Log(campX() - 5, campY() - 5, Math.PI/8));
  logs.push(new Log(campX() + 5, campY() - 5, -Math.PI + Math.PI/8));
  logs.push(new Log(campX() + 5, campY() + 5, -Math.PI - Math.PI/8));
}

function initGrass() {
  grass = [];
  const gy = groundY();
  for (let i = 0; i < 50; i++) {
    const b = new GrassBlade();
    const x = W * (0.05 + 0.9 * Math.random());
    const y = gy + Math.random() * 5;
    const dist = Math.abs(x - campX());
    const lightness = 1 - clamp(dist / W, 0, 1) * 0.6;
    b.setup(x, y, rand(0.5, 2), rand(5, 15), lightness, Math.random());
    grass.push(b);
  }
  for (let i = 0; i < 50; i++) {
    const b = new GrassBlade();
    const x = W * (0.05 + 0.9 * Math.random());
    const y = gy + Math.random() * 5;
    const dist = Math.abs(x - campX());
    const lightness = 1 - clamp(dist / W, 0, 1) * 0.6;
    b.setup(x, y, rand(0.5, 2), rand(5, 15), lightness, Math.random());
    grass.push(b);
  }
}

function init() {
  resize();
  initFlame();
  initStars();
  initTrees();
  initStones();
  initLogs();
  initGrass();
  initBackground();
}

init();
window.addEventListener('resize', () => init());

let lastTime = 0;
function loop(now) {
  const dt = now - lastTime;
  lastTime = now;
  time += 16;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bgCanvas, 0, 0);
  // stars
  ctx.save();
  for (const s of stars) {
    s.tw += s.sp;
    const a = s.br * (0.5 + Math.sin(s.tw) * 0.5);
    ctx.globalAlpha = a;
    ctx.fillStyle = s.warm ? '#ffcc88' : '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    if (s.r > 0.7) {
      ctx.globalAlpha = a * 0.3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r*2, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // metors
  metorTimer++;
  if (metorTimer > 200 + Math.random()*300) {
    metorTimer = 0;
    if (Math.random() < 0.7) metors.push(new Metor());
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = metors.length - 1; i >= 0; i--) {
    const m = metors[i];
    if (m.update()) metors.splice(i, 1);
    else m.draw(ctx);
  }
  ctx.restore();
  // firelight on grass and trees
  const flickerLight = 0.5 + Math.sin(time * 0.003) * 0.3 + Math.sin(time * 0.012) * 0.1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const grad = ctx.createRadialGradient(campX(), campY(), 0, campX(), campY(), W * 0.6);
  grad.addColorStop(0, `rgba(255, 140, 40, $flickerLight * 0.4)`);
  grad.addColorStop(0.5, `rgba(255, 140, 40, $flickerLight * 0.15)`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // trees
  trees.forEach(t => {
    t.update();
    t.draw(ctx, flickerLight);
  });
  // grass
  grass.forEach(g => {
    g.update();
    g.draw(ctx, flickerLight);
  });
  // logs
  logTimer++;
  if (logTimer > 1200) {
    logTimer = 0;
    const l = logs[Math.floor(Math.random() * logs.length)];
    if (l && l.blife < 0.5) {
      l.blife = 1;
      l.freshness = 1;
      l.length = 60 + Math.random() * 20;
      l.radius = 10 + Math.random() * 3;
    }
  }
  logs.forEach(l => {
    l.update();
    l.draw(ctx, flickerLight);
  });
  // stones
  stones.forEach(s => s.draw(ctx, flickerLight));
  // embers
  emberTimer++;
  if (emberTimer > 10 + Math.random() * 5) {
    emberTimer = 0;
    embers.push(new Ember());
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    if (e.update()) embers.splice(i, 1);
    else e.draw(ctx);
  }
  ctx.restore();
  // flame
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(campX(), campY());
  // heat distortion
  const skew = Math.sin(time * 0.002) * 2;
  ctx.transform(1, 0, skew * 0.02, 1, 0, 0);
  flame.forEach(p => {
    p.update();
    p.draw(ctx);
  });
  ctx.restore();
  // fire light glow
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const flickerR = 0.8 + Math.sin(time * 0.001) * 0.2;
  ctx.globalAlpha = 0.8 * flickerR;
  const size = 200 * flickerR;
  ctx.drawImage(fireGlowCanvas, campX() - size/2, campY() - size/2 - 50, size, size);
  ctx.globalAlpha = 0.4 * flickerR;
  const size2 = 100 * flickerR;
  ctx.drawImage(fireGlowCanvas, campX() - size2/2, campY() - size2/2 - 100, size2, size2);
  ctx.restore();
  // vignette
  const vign = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  vign.addColorStop(0, 'rgba(0,0,0,0)');
  vign.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = vign;
  ctx.fillRect(0, 0, W, H);
  // overlay noise
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = 'rgba(0,0,0,1)';
  for (let i = 0; i < 100; i++) {
    ctx.fillRect(rand(0,W), rand(0,H), 1, 1);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
