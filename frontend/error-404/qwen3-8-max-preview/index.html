<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04081a">
<title>404 · lost in orbit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f1e7cd'/%3E%3Ccircle cx='11' cy='13' r='3' fill='%23c9bfa2'/%3E%3Ccircle cx='20' cy='20' r='2.2' fill='%23c9bfa2'/%3E%3Ccircle cx='21' cy='10' r='1.5' fill='%23d4c9a8'/%3E%3C/svg%3E">
<style>
  :root{
    --navy-deep:#04081a;
    --ink:#e9edfb;
    --gold:#f2e3b8;
    --gold-strong:#f6d98a;
    --mono:'SF Mono', ui-monospace, 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
    --display:'Futura', 'Futura PT', 'Century Gothic', 'Avenir Next', 'Trebuchet MS', ui-sans-serif, sans-serif;
    --orbit-period:16s;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    overflow:hidden;
    background:var(--navy-deep);
    color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:#141a38; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- sky ---------- */
  .sky{
    position:fixed; inset:0; overflow:hidden; z-index:0;
    background:
      radial-gradient(130% 100% at 68% 10%, #0d1836 0%, #081027 44%, #04081a 100%);
  }
  .plx{ position:absolute; inset:0; will-change:transform; }
  .band{
    position:absolute; inset:-22%;
    background:linear-gradient(112deg, transparent 41%, rgba(150,175,235,.045) 49%, rgba(168,190,245,.09) 52%, rgba(150,175,235,.03) 56%, transparent 64%);
  }
  .nebula{ position:absolute; border-radius:50%; filter:blur(64px); mix-blend-mode:screen; }
  .n1{ width:56vmax; height:38vmax; left:-12%; top:-14%; opacity:.17;
       background:radial-gradient(circle at 42% 42%, #1d3f66, transparent 70%);
       animation:drift1 46s ease-in-out infinite alternate; }
  .n2{ width:50vmax; height:34vmax; right:-16%; bottom:-20%; opacity:.15;
       background:radial-gradient(circle at 58% 50%, #0f3a46, transparent 70%);
       animation:drift2 58s ease-in-out infinite alternate; }
  .n3{ width:44vmax; height:30vmax; left:50%; top:44%; transform:translate(-50%,-50%); opacity:.20;
       background:radial-gradient(circle, #26345e, transparent 68%);
       animation:drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1{ to{ transform:translate3d(6vmax,4vmax,0) scale(1.1);} }
  @keyframes drift2{ to{ transform:translate3d(-5vmax,-3vmax,0) scale(1.08);} }
  @keyframes drift3{ to{ transform:translate(-50%,-50%) scale(1.14);} }

  .stars{ position:absolute; inset:-70px; }
  .star{
    position:absolute; border-radius:50%;
    background:#dfe8ff; opacity:var(--o,.8);
    box-shadow:0 0 4px rgba(214,228,255,.7);
    animation:twinkle 3s ease-in-out infinite;
  }
  .star.lg{ box-shadow:0 0 9px 2px rgba(222,233,255,.85); }
  .star.gold{ background:#f6e3b4; box-shadow:0 0 7px rgba(246,227,180,.85); }
  @keyframes twinkle{
    0%,100%{ opacity:var(--o,.8); transform:scale(1); }
    50%{ opacity:.1; transform:scale(.5); }
  }

  .meteor{
    position:absolute; width:130px; height:2px; border-radius:999px; opacity:0;
    background:linear-gradient(90deg, rgba(214,228,255,.95), rgba(214,228,255,0) 72%);
    animation:meteor var(--md,12s) linear infinite; animation-delay:var(--mdel,2s);
  }
  .meteor::before{
    content:''; position:absolute; left:-2px; top:50%; width:4px; height:4px;
    transform:translateY(-50%); border-radius:50%;
    background:#eef4ff; box-shadow:0 0 9px 2px rgba(200,220,255,.9);
  }
  .m1{ top:15%; left:74%; --ang:-33deg; --dist:-48vw; --md:12s; --mdel:2.5s; }
  .m2{ top:6%;  left:40%; --ang:-42deg; --dist:-58vw; --md:19s; --mdel:9.5s; }
  @keyframes meteor{
    0%  { opacity:0; transform:rotate(var(--ang)) translateX(0); }
    3%  { opacity:1; }
    9%  { opacity:0; transform:rotate(var(--ang)) translateX(var(--dist)); }
    100%{ opacity:0; transform:rotate(var(--ang)) translateX(var(--dist)); }
  }
  .vignette{
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 92% at 50% 42%, transparent 55%, rgba(2,5,14,.6) 100%);
  }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; z-index:5; font-size:.66rem; letter-spacing:.24em;
    color:#66759f; text-transform:uppercase; user-select:none;
  }
  .hud-tl{ top:1.25rem; left:1.5rem; }
  .hud-tr{ top:1.25rem; right:1.5rem; display:flex; align-items:center; }
  .hud-bl{ bottom:1.25rem; left:1.5rem; }
  .hud-br{ bottom:1.25rem; right:1.5rem; }
  .hud .dim{ color:#414e78; }
  .bars{ display:inline-flex; gap:3px; align-items:flex-end; margin-left:.7em; }
  .bars i{ display:block; width:3px; background:#8fa3d9; }
  .bars i:nth-child(1){ height:4px; animation:blink 2.1s steps(1) infinite; }
  .bars i:nth-child(2){ height:6px; }
  .bars i.off{ background:#28355c; }
  .bars i:nth-child(3){ height:8px; } .bars i:nth-child(4){ height:10px; } .bars i:nth-child(5){ height:12px; }

  /* ---------- scene ---------- */
  .scene{
    position:relative; z-index:2; min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(1rem, 3vh, 1.7rem); padding:2rem 1.25rem; text-align:center;
  }
  .eyebrow{
    margin:0; font-size:.72rem; letter-spacing:.46em; padding-left:.46em;
    color:var(--gold); opacity:.9; text-transform:uppercase;
  }

  /* ---------- the 404 ---------- */
  .digits{
    margin:0; display:flex; align-items:center; gap:.05em;
    font-family:var(--display); font-weight:700;
    font-size:clamp(7rem, 26vw, 21rem); line-height:.9;
    color:var(--ink); letter-spacing:-.01em;
    animation:breatheText 6s ease-in-out infinite;
  }
  @keyframes breatheText{
    0%,100%{ text-shadow:0 0 .10em rgba(170,195,255,.32), 0 0 .42em rgba(120,155,255,.15); }
    50%    { text-shadow:0 0 .18em rgba(190,208,255,.6),  0 0 .72em rgba(130,165,255,.3); }
  }
  .num{ display:block; }

  .moon-wrap{ display:inline-block; will-change:transform; }
  .moon-system{ position:relative; display:block; width:1.06em; height:.76em; }

  .halo{
    position:absolute; left:50%; top:50%; width:1.2em; height:1.2em; z-index:0;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(250,238,205,.34) 0%, rgba(250,238,205,.12) 42%, transparent 70%);
    animation:breatheHalo 6s ease-in-out infinite;
  }
  @keyframes breatheHalo{
    0%,100%{ opacity:.55; transform:translate(-50%,-50%) scale(1); }
    50%    { opacity:1;   transform:translate(-50%,-50%) scale(1.08); }
  }

  .orbit-plane{
    position:absolute; left:50%; top:50%; width:1.5em; height:1.5em;
    margin:-0.75em 0 0 -0.75em;
    transform:rotate(-16deg) scaleY(.42);
  }
  .ring-plane{ z-index:1; }
  .ring{
    position:absolute; inset:0; border-radius:50%;
    border:1px dashed rgba(186,203,244,.30);
    box-shadow:inset 0 0 .06em rgba(186,203,244,.12);
  }
  .sat-plane{ z-index:3; animation:satz var(--orbit-period) linear infinite; }
  @keyframes satz{
    0%,49.9%  { z-index:1; }
    50%,99.9% { z-index:3; }
    100%      { z-index:1; }
  }
  .arm{ position:absolute; inset:0; animation:spin var(--orbit-period) linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .anchor{ position:absolute; left:50%; top:0; width:0; height:0; }
  .keep{
    position:absolute; left:0; top:0; width:0; height:0;
    animation:keep var(--orbit-period) linear infinite;
  }
  @keyframes keep{
    from{ transform:rotate(0deg)     scaleY(2.381) rotate(16deg); }
    to  { transform:rotate(-360deg)  scaleY(2.381) rotate(16deg); }
  }
  .depth{ position:absolute; left:0; top:0; width:0; height:0;
          animation:depth var(--orbit-period) ease-in-out infinite; }
  @keyframes depth{
    0%  { transform:scale(.66); opacity:.5;  filter:brightness(.55); }
    25% { transform:scale(.84); opacity:.8;  filter:brightness(.8); }
    50% { transform:scale(1);   opacity:1;   filter:brightness(1); }
    75% { transform:scale(.84); opacity:.8;  filter:brightness(.8); }
    100%{ transform:scale(.66); opacity:.5;  filter:brightness(.55); }
  }

  .sat{ position:absolute; left:0; top:0; width:.30em; height:.12em; transform:translate(-50%,-50%); }
  .strut{ position:absolute; left:.07em; right:.07em; top:50%; height:1px;
          transform:translateY(-50%); background:rgba(200,215,245,.55); }
  .panel{
    position:absolute; top:50%; width:.095em; height:.052em; transform:translateY(-50%);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.28) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, #27436e, #3f6fae 48%, #27436e);
    box-shadow:0 0 0 1px rgba(190,215,255,.45), 0 0 .02em rgba(150,190,255,.6);
  }
  .pl{ left:0; } .pr{ right:0; }
  .hull{
    position:absolute; left:50%; top:50%; width:.075em; height:.088em;
    transform:translate(-50%,-50%); border-radius:24%;
    background:linear-gradient(145deg, #f4f6fb, #b9c2d6 55%, #77839f);
    box-shadow:0 0 .02em rgba(220,230,255,.8);
  }
  .antenna{
    position:absolute; left:50%; bottom:50%; width:1px; height:.055em;
    transform:translateX(-50%);
    background:linear-gradient(to top, rgba(223,230,250,.25), rgba(223,230,250,.95));
  }
  .beacon{
    position:absolute; left:50%; bottom:calc(50% + .05em); width:.02em; height:.02em;
    transform:translateX(-50%); border-radius:50%;
    background:#ff7a6b; box-shadow:0 0 .035em .008em rgba(255,110,90,.85);
    animation:blink 1.3s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:.12; } }

  .moon{
    position:absolute; left:50%; top:50%; width:.72em; height:.72em; z-index:2;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 33% 30%, #fdf8ea 0%, #f1e7cd 38%, #d4c9a8 62%, #a89e82 82%, #7f7660 100%);
    box-shadow:
      inset -.03em -.05em .09em rgba(30,26,50,.45),
      inset .02em .03em .06em rgba(255,255,255,.5),
      0 0 .22em rgba(246,233,198,.35);
  }
  .moon-system:hover .moon{ animation:wobble 1s ease; }
  @keyframes wobble{
    0%  { transform:translate(-50%,-50%) rotate(0); }
    25% { transform:translate(-50%,-50%) rotate(4deg) scale(1.025); }
    55% { transform:translate(-50%,-50%) rotate(-3deg); }
    100%{ transform:translate(-50%,-50%) rotate(0); }
  }
  .crater{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 38% 35%, rgba(94,86,66,.14), rgba(94,86,66,.34) 72%);
    box-shadow:inset .008em .012em .02em rgba(40,34,60,.5), 0 .004em .008em rgba(255,255,255,.35);
  }
  .c1{ width:.13em; height:.13em; left:16%; top:46%; }
  .c2{ width:.09em; height:.09em; left:58%; top:20%; }
  .c3{ width:.07em; height:.07em; left:62%; top:60%; }
  .c4{ width:.05em; height:.05em; left:34%; top:18%; }
  .terminator{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, transparent 46%, rgba(16,20,44,.28) 78%, rgba(12,16,36,.5) 100%);
  }

  /* ---------- copy ---------- */
  .line{ margin:0; font-size:clamp(.85rem, .8rem + .5vw, 1.1rem); color:#b9c6ea; min-height:1.7em; }
  .prompt{ color:var(--gold-strong); }
  .cursor{ display:inline-block; color:var(--gold-strong); animation:caret 1.1s steps(1) infinite; }
  @keyframes caret{ 50%{ opacity:0; } }

  .btn{
    position:relative; overflow:hidden; isolation:isolate;
    display:inline-flex; align-items:center; margin-top:.35rem;
    padding:.95em 2.5em; border-radius:999px;
    border:1px solid rgba(178,196,240,.4);
    background:linear-gradient(180deg, rgba(20,32,68,.72), rgba(10,18,44,.72));
    color:#e6ecff; text-decoration:none;
    font-family:var(--mono); font-size:.92rem; letter-spacing:.2em; text-transform:lowercase;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease,
               color .25s ease, background .25s ease;
  }
  .btn:hover, .btn:focus-visible{
    transform:translateY(-2px);
    border-color:rgba(246,222,150,.9);
    background:linear-gradient(180deg, #f7ead0, #e7cf9b);
    color:#241c3f;
    box-shadow:0 8px 28px rgba(246,217,138,.28), 0 0 0 1px rgba(246,222,150,.35);
  }
  .btn:active{ transform:translateY(0) scale(.98); }
  .btn:focus-visible{ outline:2px dashed var(--gold-strong); outline-offset:4px; }
  .glint{
    position:absolute; top:-30%; bottom:-30%; left:-45%; width:38%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.9), transparent);
    transform:skewX(-18deg) translateX(0); pointer-events:none;
  }
  .btn:hover .glint{ animation:glint .75s ease .05s both; }
  @keyframes glint{ to{ transform:skewX(-18deg) translateX(430%); } }

  .foot{ margin:0; font-size:.7rem; letter-spacing:.1em; color:#5f6d96; }

  @media (max-width:560px){
    .hud{ font-size:.56rem; letter-spacing:.16em; }
    .hud-bl,.hud-br{ display:none; }
  }
  @media (max-height:480px){
    .digits{ font-size:clamp(4.5rem, 20vh, 9rem); }
    .scene{ gap:.8rem; }
    .foot{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .star,.halo,.digits,.cursor,.beacon,.nebula,.bars i,.moon-system:hover .moon{ animation:none !important; }
    .arm  { animation:none !important; transform:rotate(125deg); }
    .keep { animation:none !important; transform:rotate(-125deg) scaleY(2.381) rotate(16deg); }
    .depth{ animation:none !important; }
    .sat-plane{ animation:none !important; z-index:3; }
    .meteor,.glint{ display:none; }
  }
</style>
</head>
<body>

  <div class="sky" aria-hidden="true">
    <div class="plx" data-depth="10">
      <div class="nebula n1"></div>
      <div class="nebula n2"></div>
      <div class="nebula n3"></div>
    </div>
    <div class="band"></div>
    <div class="plx" data-depth="20"><div class="stars" id="stars"></div></div>
    <div class="meteor m1"></div>
    <div class="meteor m2"></div>
    <div class="vignette"></div>
  </div>

  <div class="hud hud-tl" aria-hidden="true">◑ orbital navigator <span class="dim">v2.4</span></div>
  <div class="hud hud-tr" aria-hidden="true">signal
    <span class="bars"><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i></span>
  </div>
  <div class="hud hud-bl" aria-hidden="true">drift <span id="drift">0.00042</span> au</div>
  <div class="hud hud-br" aria-hidden="true">sector 7-g · uncharted</div>

  <main class="scene">
    <p class="eyebrow">transmission lost</p>

    <h1 class="digits" aria-label="404 — page not found">
      <span class="num" aria-hidden="true">4</span>
      <span class="moon-wrap" data-depth="34" aria-hidden="true">
        <span class="moon-system" title="the moon is fine. the page is not.">
          <span class="halo"></span>
          <span class="orbit-plane ring-plane"><span class="ring"></span></span>
          <span class="moon">
            <span class="crater c1"></span><span class="crater c2"></span>
            <span class="crater c3"></span><span class="crater c4"></span>
            <span class="terminator"></span>
          </span>
          <span class="orbit-plane sat-plane">
            <span class="arm">
              <span class="anchor">
                <span class="keep">
                  <span class="depth">
                    <span class="sat">
                      <span class="strut"></span>
                      <span class="panel pl"></span><span class="panel pr"></span>
                      <span class="hull"></span>
                      <span class="antenna"></span>
                      <span class="beacon"></span>
                    </span>
                  </span>
                </span>
              </span>
            </span>
          </span>
        </span>
      </span>
      <span class="num" aria-hidden="true">4</span>
    </h1>

    <p class="line">
      <span class="sr">houston, we have a missing page.</span>
      <span aria-hidden="true"><span class="prompt">&gt;&nbsp;</span><span id="type"></span><span class="cursor">▌</span></span>
    </p>

    <a class="btn" href="/">
      <span>take me home</span>
      <span class="glint" aria-hidden="true"></span>
    </a>

    <p class="foot">no pages were harmed in the making of this void.</p>
  </main>

<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* starfield */
  var field = document.getElementById('stars');
  var frag = document.createDocumentFragment();
  for (var i = 0; i < 150; i++){
    var s = document.createElement('i');
    s.className = 'star' + (Math.random() < .08 ? ' lg' : '') + (Math.random() < .12 ? ' gold' : '');
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top  = (Math.random() * 100).toFixed(2) + '%';
    var sz = (Math.random() * 1.7 + 0.8).toFixed(1);
    s.style.width = s.style.height = sz + 'px';
    s.style.setProperty('--o', (Math.random() * .55 + .35).toFixed(2));
    s.style.animationDuration = (Math.random() * 4 + 2.2).toFixed(2) + 's';
    s.style.animationDelay = (-Math.random() * 6).toFixed(2) + 's';
    frag.appendChild(s);
  }
  field.appendChild(frag);

  /* typed one-liner */
  var msg = 'houston, we have a missing page.';
  var out = document.getElementById('type');
  if (reduced){ out.textContent = msg; }
  else {
    var i = 0;
    setTimeout(function tick(){
      out.textContent = msg.slice(0, ++i);
      if (i < msg.length) setTimeout(tick, 28 + Math.random() * 46);
    }, 650);
  }

  /* drifting telemetry */
  var drift = 0.00042, dEl = document.getElementById('drift');
  setInterval(function(){
    drift += 0.00001 + Math.random() * 0.00008;
    dEl.textContent = drift.toFixed(5);
  }, 500);

  /* gentle pointer parallax */
  if (!reduced){
    var layers = Array.prototype.slice.call(document.querySelectorAll('[data-depth]'));
    var tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener('pointermove', function(e){
      tx = e.clientX / window.innerWidth  - .5;
      ty = e.clientY / window.innerHeight - .5;
    }, { passive:true });
    (function loop(){
      cx += (tx - cx) * .05;
      cy += (ty - cy) * .05;
      for (var j = 0; j < layers.length; j++){
        var d = +layers[j].getAttribute('data-depth');
        layers[j].style.transform = 'translate3d(' + (-cx * d).toFixed(2) + 'px,' + (-cy * d).toFixed(2) + 'px,0)';
      }
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
