<!DOCTYPE html>
<html>
<head>
<style>
body{margin:0;overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let w=canvas.width=innerWidth;
let h=canvas.height=innerHeight;
addEventListener('resize',()=>{w=canvas.width=innerWidth;h=canvas.height=innerHeight});

// Simulation grid
const CW=200,CH=120;
const cells=new Float32Array(CW*CH); // air pressure
const winds=new Float32Array(CW*CH*2); // wind vectors

// Particles
const NP=8000;
const parts=new Float32Array(NP*2);
for(let i=0;i<NP;i++){parts[i*2]=Math.random()*w;parts[i*1]=Math.random()*h;}

// Pressure systems (highs/lows)
const systems=[];
for(let i=0;i<7;i++){
  systems.push({
    x:Math.random()*CW,
    y:Math.random()*CH,
    r:0.3+Math.random()*0.7,
    p:Math.random()*2-1, // pressure sign: +high -low
    vx:(Math.random()-0.5)*0.3,
    vy:(Math.random()-0.5)*0.3,
    age:0
  });
}

// Coastline shape
const coast=new Path2D();
coast.moveTo(0,60);
for(let x=0;x<=CW;x++){
  const y=Math.sin(x*0.05)*20+50+Math.sin(x*0.1)*8+Math.cos(x*0.02)*5;
  if(x===0)coast.moveTo(x/CW*w,y/CH*h);
  else coast.lineTo(x/CW*w,y/CH*h);
}
coast.lineTo(w,h);
coast.lineTo(0,h);
coast.closePath();

// Simplex-like noise
function noise(x,y){
  const X=Math.floor(x),Y=Math.floor(y);
  const fx=x-X,fy=y-Y;
  const a=(X*37+Y*73)%256,b=((X+1)*37+Y*73)%256,c=(X*37+(Y+1)*73)%256,d=((X+1)*37+(Y+1)*73)%256;
  const i=128+Math.sin(a*0.1)*128,j=128+Math.sin(b*0.1)*128,k=128+Math.sin(c*0.1)*128,l=128+Math.sin(d*0.1)*128;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return ((1-u)*(1-v)*i+u*(1-v)*j+(1-u)*v*k+u*v*l)/256/256*2-1;
}

let t=0;
function anim(){
  t+=0.016;
  ctx.clearRect(0,0,w,h);

  // Update pressure grid from systems
  for(let i=0;i<cells.length;i++)cells[i]=0;
  for(const s of systems){
    s.x+=s.vx;s.y+=s.vy;s.age+=0.01;
    if(s.x<0||s.x>CW)s.vx*=-1,s.vx+=((Math.random()-0.5)*0.2);
    if(s.y<0||s.y>CH)s.vy*=-1,s.vy+=((Math.random()-0.5)*0.2);
    for(let y=0;y<CH;y++){
      for(let x=0;x<CW;x++){
        const dx=x-s.x,dy=y-s.y;
        const d2=dx*dx+dy*dy;
        const idx=y*CW+x;
        if(d2<s.r*s.r*100){
          const d=Math.sqrt(d2)+0.01;
          const press=s.p/d;
          cells[idx]+=press;
        }
      }
    }
  }

  // Derive winds from pressure gradient (perpendicular = rotation)
  for(let y=0;y<CH;y++){
    for(let x=0;x<CW;x++){
      const pL=cells[y*CW+Math.max(0,x-1)];
      const pR=cells[y*CW+Math.min(CW-1,x+1)];
      const pU=cells[Math.max(0,y-1)*CW+x];
      const pD=cells[Math.min(CH-1,y+1)*CW+x];
      const dx=(pL-pR)*0.4;
      const dy=(pD-pU)*0.4;
      // Rotate 90deg to get flow around highs/lows
      const wx=dy, wy=-dx;
      // Add noise + global flow
      const n= noise(x*0.1+t*0.5,y*0.1+t*0.3)*0.3;
      winds[(y*CW+x)*2]=wx+n;
      winds[(y*CW+x)*2+1]=wy+n;
    }
  }

  // Temperature ramp
  const img=ctx.createImageData(w,h);
  for(let y=0;y<h;y+=4){
    for(let x=0;x<w;x+=4){
      const tx=x/CW,ty=y/CH;
      const temp=(Math.sin(tx*0.2+t*0.3)+Math.cos(ty*0.15+t*0.2)+2)/4;
      let r,g,b;
      if(temp<0.5){r=30;g=60+temp*120;b=180+temp*75;}
      else{r=255-(temp-0.5)*2*80;g=180+(temp-0.5)*2*60;b=40+(temp-0.5)*2*30;}
      const idx=((y|0)*w+(x|0))*4;
      img.data[idx]=r;img.data[idx+1]=g;img.data[idx+2]=b;img.data[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);

  // Rain bands
  ctx.save();
  ctx.fillStyle='rgba(200,220,255,0.15)';
  for(let i=0;i<200;i++){
    const x=(noise(i*1.3,t*0.2)*0.5+0.5)*w;
    const y=(noise(i*1.3+100,t*0.2)*0.5+1)*h/2;
    const len=50+noise(i*1.3+50,t*0.2)*30;
    ctx.fillRect(x,y,len,2);
  }
  ctx.restore();

  // Draw coastline
  ctx.strokeStyle='#222';
  ctx.lineWidth=2;
  ctx.stroke(coast);
  ctx.fillStyle='#1a0c00';
  ctx.fill(coast);

  // Fronts
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.7)';
  ctx.lineWidth=1.5;
  ctx.setLineDash([8,6]);
  for(let i=0;i<3;i++){
    const a=noise(i*5,t*0.1),b=noise(i*5+3,i+t*0.1);
    const x1=(a*0.3+0.3)*w,y1=(b*0.3+0.3)*h;
    const x2=(noise(i*5+2,t)*0.5+0.5)*w,y2=(noise(i*5+7,t*0.3)*0.5+0.5)*h;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    // Triangles
    ctx.setLineDash([]);
    for(let j=0;j<10;j++){
      const pct=j/10;
      const px=x1+(x2-x1)*pct,py=y1+(y2-y1)*pct;
      ctx.save();
      ctx.translate(px,py);
      ctx.rotate(Math.atan2(y2-y1,x2-x1)+Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(-4,-6);ctx.lineTo(4,-6);ctx.lineTo(0,0);ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.setLineDash([8,6]);
  }
  ctx.restore();

  // Wind particles
  ctx.fillStyle='#fff';
  for(let i=0;i<NP;i++){
    const px=parts[i*2],py=parts[i*1];
    const gx=Math.min(CW-1,Math.max(0,(px/w)*CW))|0;
    const gy=Math.min(CH-1,Math.max(0,(py/h)*CH))|0;
    const wi=winds[(gy*CW+gx)*2],wj=winds[(gy*CW+gx)*2+1];
    const nx=px+wi*2;
    const ny=py+wj*2;
    parts[i*2]=nx;parts[i*1]=ny;
    // Sample color from canvas for particle
    const idx=((ny|0)*w+(nx|0))*4;
    const r=img.data[idx],g=img.data[idx+1],b=img.data[idx+2];
    const lum=(r+g+b)/3;
    ctx.fillStyle=`rgb(${Math.min(255,lum+80)},${Math.min(255,lum+80)},${Math.min(255,lum+120)})`;
    ctx.fillRect(nx,ny,2,2);
    // Reset if out of bounds
    if(nx<0||nx>w||ny<0||ny>h){
      parts[i*2]=Math.random()*w;parts[i*1]=Math.random()*h;
    }
  }

  requestAnimationFrame(anim);
}
anim();
</script>
</body>
</html>
