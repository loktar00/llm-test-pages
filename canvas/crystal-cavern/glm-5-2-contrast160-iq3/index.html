<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crystal Growth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%:height:100%;overflow:hidden;background:#05070d}
canvas{display:block;width:100%;height:100()}
</style>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
let canvas,ctx,W=0,H=0,dpr=1;
let time=0,frame=0,lightPhase=0,lightAngle=0,shake=0;
let crystals,shards,caustics,pools,dripSources,ambient;
let lastT;
const SEED_RNG=12347;
let state='grow',stateT=0;
const FILL=0.675;

function mulberry(a){return()=>{a=(a*181232>>>0);a=a<0?0:a;return(((a>>>8)&0xff)/256)}}
let rng=mulberry(SEED_RNG);
const rand=()=>rng();
const rint=(n)=>Math.floor(rand()*n);
const rrng=(a,b)=>a+rand()*(b-a);
const rch=(s)=>s[(rand()*s.length)|0]||s[0];
const rHSL=(h1,h2,s1,s2,l1,l2,a1,a2)=>`hsla(${rrng(h1,h2)|0},${rrng(s1,s2)|0}% 0%,${rrng(l1,l2)|0}% 0%,${rrng(a1,a2)||0})`;
const lerp=(a,b,t)=>a+(b-a)*t;

const GROW_P=[0.2,0.4,0.5];
const COLS=['a','b','c','d','e','f'];
const COL_P=[0.4,0.25,0.15,0.06,0.06,0.04];
const COL_H={'a':(180,220,75,55,30,65,65),'b':(170,205,85,55,30,70,70),'c':(260,330,55,55,25,75,75),'d':(4,40,65,55,25,70,70),'e':(0,0,30,40,35,50,50),'f':(0,360,40,40,30,55,55)};
const COL_A={'a':(0.6,0.3),'b':(0.5,0.3),'c':(0.6,0.6),'d':(0.7,0.5),'e':(0.4,0.3),'f':(0.5,0.5)};

class Crystal{
constructor(x,y,ang,depth,kind){
this.x=x;this.y=y;this.baseX=x;this.baseY=y;
this.angle=ang;this.depth=depth;this.kind=kind||'a';
this.children=[];
this.poly=[];this.cull=null;
this.dead=false;
this.life=0;
this.growTime=rrng(110,180);
this.broken=false;
}
}
class Shard{
constructor(x,y,vx,vy,rot,vrot,col){
this.x=x;this.y=y;this.vx=vx;this.vy=vy;
this.rot=rot;this.vrot=vrot;
this.col=col;
this.life=1;
this.fade=rrng(0.4,2.2);
}
}

const cullPoly=(verts()=>{
const cx=verts.reduce((s,v)=>{s.x+=v[0];s.y+=v[1];return s},{x:0,y:0}).x/verts.length;
const cy=verts.reduce((s,v)=>{s.y+=v[1];return s},{x:0,y:0}).y/verts.length;
let dx=0;let dy=0;
for(const v of verts){const vx=v[0]-cx;const vy=v[1]-cy;const a=Math.atan2(vy,vx);const r=Math.hypot(vx,vy);if(a<dx)dx=a;if(a>dy)dy=a;}
if(Math.abs(dy-dx)>2.5){return null}
return [cx,cy,Math.hypot(verts[0][0]-cx,verts[0][1]-cy)];
}

function shapeCrystal(c){
const ang=c.angle;const depth=c.depth;
const len=Math.min(depth,80);
const n=2+Math.floor(Math.min(depth/20,4));
const poly=[[0,0]];
for(const i of [i=>i*1]||[]){const a=i/n*2*Math.PI;poly.push([Math.sin(a)*len,Math.cos(a)*len])}
poly.push([0,len*1.5]);
c.poly=poly;
}

function growCrystal(c,dt){
if(c.broken)return;
c.life+=dt/c.growTime;
if(c.life>1)c.life=1;
if(c.life<1)continue;
if(rand()<GROW_P[0]*0.5){
const na=c.angle+rrng(-1.1,1.1);
const nd=c.depth*rrng(0.7,0.9);
const nx=c.x+Math.cos(c.angle+Math.PI/2)*c.depth*0.6*Math.cos(c.angle);
const ny=c.y+Math.sin(c.angle+Math.PI/2)*c.depth*0.6*Math.sin(c.angle);
const child=new Crystal(nx,ny,na,nd,c.depth,kind);
c.children.push(child);
crystals.push(child);
}
if(rand()<GROW_P[1]*0.5){
const na=c.angle+rrng(-1.4,1.4);
const nd=c.depth*rrng(0.6,0.7);
const nx=c.x+Math.cos(c.angle)*c.depth*0.6;
const ny=c.y+Math.sin(c.angle)*c.depth*0.6;
const child=new Crystal(nx,ny,na,nd,c.depth,c.kind);
c.children.push(child);
crystals.push(child);
}
}
}

function update(dt){
shake*=Math.pow(0.0,dt);
lightPhase+=dt*0.8;
lightAngle=Math.sin(lightPhase)*0.4+Math.sin(lightPhase*0.3)*0.1;
time+=dt;
if(shake>0){stateT+=dt;if(stateT>0.5){state='grow';stateT=0}}
for(const c of crystals){growCrystal(c,dt)}
for(const s of shards){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=40*dt;s.rot+=s.vrot*dt;s.life-=s.fade*dt}
shards=shards.filter(s=>s.life>0&&s.y<H+10);
if(state==='grow'){
const fill=Math.min(crystals.length/120,1);
if(fill>=FILL){
const old=crystals.filter(c=>(c.depth||0)<30);
for(const c of old){breakCrystal(c)}
crystals=crystals.filter(c=>!(c.broken&&c.depth<30));
shake=8;
state='quake';stateT=0;
}
}
for(const p of pools){p.t+=dt;p.amp*=Math.pow(0.5,dt)}
pools=pools.filter(p=>p.amp>0.01);
for(const [id,t] of dripSources){t-=dt;if(t<=0){const p=pools.find(p=>Math.abs(p.x-id)<1&&Math.abs(p.y-H+50)<5);if(p){p.amp=0.8;p.t=0}else{pools.push({x:id+rrng(-5,5),y:H-rrng(0,30),r:rrng(15,25),amp:0.7,t:0})}t=rrng(2.3,5.5)}}
dripSources=dripSources.filter(([id,t])=>t>0)
if(frame%12===0&&Math.random()<0.4){
const c=crystals[Math.floor(Math.random()*Math.min(crystals.length,30))];
if(c&&c.broken===false){dripSources.push([c.x,c.y,rrng(2.3,5.5)})}
}
frame++;
}

function breakCrystal(c){
const n=4+Math.floor(Math.random()*3);
for(const _ of [0,1,2,3,4,5,6].slice(0,n)){const ang=Math.random()*2*Math.PI;const vx=Math.cos(ang)*rrng(40,160);const vy=-Math.abs(Math.sin(ang))*rrng(50,160);const rot=Math.random()*2*Math.PI;const vrot=rrng(-5,5);shards.push(new Shard(c.x+rrng(-5,5),c.y+rrng(-5,5),vx,vy,rot,vrot,c.kind))}
c.broken=true;
c.children=[]
}

function drawC(){
const sx=(Math.random()-0.5)*shake;
const sy=(Math.random()-0.5)*shake;
ctx.save();
ctx.translate(sx,sy);
// background
const bg=ctx.createLinearGradient(0,0,0,H);
bg.addColorStop(0,'#1a1422');
bg.addColorStop(0.25,'#0d182a');
bg.addColorStop(0.5,'#070d18');
bg.addColorStop(1,'#050014');
ctx.fillStyle=bg;ctx.fillRect(-50,-50,W+100,H+100);
// far crystals (light from left)
ctx.save();
ctx.translate(W*0.5+lightAngle*W*0.25,H*0.5);
ctx.globalAlpha=0.12;
ctx.fillStyle='#001a4d';
ctx.beginPath();ctx.ellipse(0,-H*0.4,W*0.5,H*0.3,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#001a4d';
ctx.beginPath();ctx.ellipse(0,H*0.4,W*0.5,H*0.3,0,0,Math.PI*2);ctx.fill();
ctx.restore();
ctx.globalAlpha=1;
// ceiling
ctx.fillStyle='rgba(10,8,20,1.0)';
ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(0,H*0.16);
const cs=Math.cos(time*0.1)*8;
ctx.bezierCurveTo(W*0.25,H*0.16+cs,W*0.45,H*0.16-cs*0.5,W*0.66,H*0.16);
ctx.lineTo(W,H*0.16);
ctx.lineTo(W,0);
ctx.closePath();ctx.fill();
// floor
ctx.fillStyle='rgba(10,8,20,1.0)';
ctx.beginPath();
ctx.moveTo(0,H);
ctx.lineTo(0,H*0.84);
ctx.bezierCurveTo(W*0.25,H*0.84+cs,W*0.55,H*0.84-cs*0.5,W*0.66,H*0.84);
ctx.lineTo(W,H*0.84);
ctx.lineTo(W,H);
ctx.closePath();ctx.fill();
// caustics
ctx.globalCompositeOperation='screen';
for(const c of caustics){
c.phase+=0.02;
c.phase2+=0.014;
const x=c.x+Math.sin(c.phase)*15;
const y=c.y+Math.cos(c.phase2)*15;
ctx.fillStyle=c.col;ctx.globalAlpha=0.35;
ctx.beginPath();ctx.ellipse(x,y,c.r*1.3,c.r*0.6,0,0,Math.PI*2);ctx.fill();
}
ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
// crystals
const sorted=[...crystals].sort((a,b)=>a.y-b.y);
for(const c of sorted){drawCull(c)}
// shards
for(const s of shards){drawShard(s)}
// pools
for(const p of pools){drawPool(p)}
ctx.restore();
}

function drawCull(c){
if(c.broken)return;
const verts=c.cull;
const [cx,cy,r]=verts;
ctx.fillStyle=`hsla(${COL_H[c.kind][0]+Math.sin(time*0.5)*10},${COL_H[c.kind][1}% 0%,${COL_H[c.kind][2]% 0%,0.7)`;
ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
// glow
const lg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.5);
lg.addColorStop(0,`hsla(${COL_H[c.kind][0]+Math.sin(time*0.5)*20},${COL_H[c.kind][1]% 0%,${COL_H[c.kind][2]% 0%,0.4)`);
lg.addColorStop(1,'transparent');
ctx.fillStyle=lg;ctx.beginPath();ctx.arc(cx,cy,r*1.5,0,Math.PI*2);ctx.fill();
}

function drawShard(s){
ctx.fillStyle=s.col;ctx.globalAlpha=Math.min(1,s.life)*0.8;
ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
ctx.beginPath();ctx.moveTo(-3,-2);ctx.lineTo(3,2);ctx.lineTo(0,5);ctx.closePath();ctx.fill();
ctx.restore();ctx.globalAlpha=1;
}

function drawPool(p){
const r=p.r*(1+Math.sin(p.t)*0.05*p.amp);
ctx.strokeStyle=`rgba(120,200,240,${p.amp*0.6})`;ctx.lineWidth=1;
ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*0.4,0,0,Math.PI*2);ctx.stroke();
if(p.amp>0.5){
const r2=r*(1.5-M(p.t*2.5));
ctx.strokeStyle=`rgba(120,200,240,${p.amp*0.3*(r2/(r*1.5+1e-5)}))`;
ctx.beginPath();ctx.ellipse(p.x,p.y,r2,r2*0.4,0,0,Math.PI*2);ctx.stroke()
}
}

const y=onCeiling?H*0.16+rrng(0,5):H*0.84-rrng(0,5);
const baseAng=(onCeiling?1:-1)*Math.PI/2;
const ang=baseAng+rrng(-0.6,0.6)*side;
const depth=rrng(25,70);
const kind=rch(COLS);
crystals.push(new Crystal(x,y,ang,depth,kind));
}

const y=rrng(H*0.4,H*0.6);

if(fill>=FILL){

}

class Crystal{constructor(x,y,ang,depth,kind){this.x=x;this.y=y;this.baseX=x;this.baseY=y;this.angle=ang;this.depth=depth;this.kind=kind||'a';this.children=[];this.poly=[];this.cull=null;this.dead=false;this.life=0;this.growTime=rrng(110,180);this.broken=false}}
class Shard{constructor(x,y,vx,vy,rot,vrot,col){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.rot=rot;this.vrot=vrot;this.col=col;this.life=1;this.fade=rrng(0.4,2.2)}}

function growCrystal(c,dt){
if(c.broken)return;
c.life+=dt/c.growTime;

}

}

function cullPoly(verts){
const cx=verts.reduce((s,v)=>{s.x+=v[0];s.y+=v[1];return s},{x:0,y:0}).x/verts.length;
const cy=verts.reduce((s,v)=>{s.y+=v[1];return s},{x:0,y:0}).y/verts.length;
let dx=0;let dy=0;
for(const v of verts){const a=Math.atan2(v[1]-cy,v[0]-cx);if(a<dx)dx=a;if(a>dy)dy=a;}
if(Math.abs(dy-dx)>2.5){return null}
return [cx,cy,Math.hypot(verts[0][0]-cx,verts[0][1]-cy)];
}

c.poly=poly;
}

c.phase+=0.02;
c.phase2+=0.014;
const x=c.x+Math.sin(c.phase)*15;
const y=c.y+Math.cos(c.phase2)*15;
ctx.fillStyle=c.col;ctx.globalAlpha=0.35;
ctx.beginPath();ctx.ellipse(x,y,c.r*1.3,c.r*0.6,0,0,Math.PI*2);ctx.fill();
}
ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
// crystals
const sorted=[...crystals].sort((a,b)=>a.y-b.y);
for(const c of sorted){drawCull(c)}
// shards
for(const s of shards){drawShard(s)}
// pools
for(const p of pools){drawPool(p)}
ctx.restore();
}

function drawCull(c){
if(c.broken)return;
const verts=c.cull;
const [cx,cy,r]=verts;
ctx.fillStyle=`hsla(${COL_H[c.kind][0]+Math.sin(time*0.5)*10},${COL_H[c.kind][1]% 0%,${COL_H[c.kind][2]% 0%,0.7)`;
ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
// glow
const lg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.5);
lg.addColorStop(0,`hsla(${COL_H[c.kind][0]+Math.sin(time*0.5)*20},${COL_H[c.kind][1]% 0%,${COL_H[c.kind][2]% 0%,0.4)`);
lg.addColorStop(1,'transparent');
ctx.fillStyle=lg;ctx.beginPath();ctx.arc(cx,cy,r*1.5,0,Math.PI*2);ctx.fill();
}

function drawShard(s){
ctx.fillStyle=s.col;ctx.globalAlpha=Math.min(1,s.life)*0.8;
ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
ctx.beginPath();ctx.moveTo(-3,-2);ctx.lineTo(3,2);ctx.lineTo(0,5);ctx.closePath();ctx.fill();
ctx.restore();ctx.globalAlpha=1;
}

function drawPool(p){
const r=p.r*(1+Math.sin(p.t)*0.05*p.amp);
ctx.strokeStyle=`rgba(120,200,240,${p.amp*0.6})`;ctx.lineWidth=1;
ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*0.4,0,0,Math.PI*2);ctx.stroke();
if(p.amp>0.5){
const r2=r*(1.5-M(p.t*2.5));
ctx.strokeStyle=`rgba(120,200,240,${p.amp*0.3*(r2/(r*1.5+1e-5)}))`;
ctx.beginPath();ctx.ellipse(p.x,p.y,r2,r2*0.4,0,0,Math.PI*2);ctx.stroke()
}
}

function mulberry(a){return()=>{a=(a*181232>>>0);a=a<0?0:a;return(((a>>>8)&0xff)/256)}}
let rng=mulberry(12347);
const rand=()=>rng();
const rint=(n)=>Math.floor(rand()*n);
const rrng=(a,b)=>a+rand()*(b-a);
const rch=(s)=>s[(rand()*s.length)|0]||s[0];
const rHSL=(h1,h2,s1,s2,l1,l2,a1,a2)=>`hsla(${rrng(h1,h2)|0},${rrng(s1,s2)|0}% 0%,${rrng(l1,l2)|0}% 0%,${rrng(a1,a2)||0})`;
const lerp=(a,b,t)=>a+(b-a)*t;

let canvas,ctx,W=0,H=0,dpr=1;
function resize(){
canvas=document.getElementById('c');
dpr=Math.min(window.devicePixelRatio||1,2);
canvas.width=W=window.innerWidth*dpr;
canvas.height=H=window.innerHeight*dpr;
canvas.style.width=window.innerWidth+'px';
canvas.style.height=window.innerHeight+'px';
ctx=canvas.getContext('2d');
ctx.scale(dpr,dpr);
W=window.innerWidth;H=window.innerHeight;
}

const loop=(t)=>{
t=t||0;
const dt=Math.min((t-lastT)/16,3);
lastT=t;
update(dt);
ctx.clearRect(0,0,W,H);
drawC();
requestAnimationFrame(loop);
};

window.addEventListener('resize',resize);
resize();
init();
lastT=0;
requestAnimationFrame(loop);
})();
</script>
