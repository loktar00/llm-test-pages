<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rain on Window</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100; width: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkitSystemFont, sans-serif;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const cv = document.getElementById('c');
const ctx = ctx.getContext ? ctx : document.createElement('canvas').getContext ? null : null;
const ctxObj = cv.getContext('2d');

// Backbuffers
const cityCanvas = document.createElement('canvas');
const dropCanvas = document.createElement('canvas');
const cityCtx = cityCanvas.getContext('2d');
const dropCtx = dropCanvas.getContext('2d');

let W = 0, H = 0, dpr = 1;
let drops = [];
let streaks = [];
let cityLights = [];
let bgNeedsRebuild = false;
let lightningTimer = 0;
let lightningFlash = 0;

const cfg = {
  maxDrops: 120,
  maxStreaks: 50,
  streakMinSize: 7.2,
  streakMinVolume: 0.9,
  streakSpeed: 5.1,
  streakTrailMax: 22,
  streakFadeRate: 1.1,
  dropMinR: 0.5,
  dropMaxR: 17.5,
  spawnR: 0.7,
  spawnGrowRate: 0.7,
  mergeRadius: 8,
  lightningMin: 480, lightningMax: 1700
};

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  [cv, cityCanvas, dropCanvas].forEach(c => {
    c.width = Math.floor(W * dpr);
    c.height = Math.floor(H * dpr);
    c.style.width = W + 'px';
    c.style.height = H + 'px';
  });
  ctxObj.setTransform(dpr, 0, 0, dpr, 0, 0);
  bgNeedsRebuild = true;
}

function rebuildBg() {
  cityCtx.clearRect(0, 0, W, H);
  
  // night gradient
  const g = cityCtx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c0a14');
  g.addColorStop(0.2, '#0d0a14');
  g.addColorStop(0.5, '#120c1c');
  g.addColorStop(1, '#14101c');
  cityCtx.fillStyle = g;
  cityCtx.fillRect(0, 0, W, H);
  
  // vertical building gradient
  const cg = cityCtx.createLinearGradient(0, H * 0.1, 0, H);
  cg.addColorStop(0, 'rgba(20,16,30,0.9');
  cg.addColorStop(1, 'rgba(35,28,45,0.7');
  cityCtx.fillStyle = cg;
  cityCtx.fillRect(0, 0, W, H);
  
  cityLights.length = 0;
  const cols = ['#ffd0a8', '#fff5c0', '#ffd090', '#ffb6a0', '#fff0b0', '#ff80a0', '#ff60b0', '#ffd050', '#ffb0a0', '#ff9050', '#ff80a0', '#ffa0a0'];
  
  // buildings
  const bhs = [0.45, 0.55, 0.65, 0.75, 0.85];
  let x = -50;
  while (x < W + 100) {
    const bw = 60 + Math.random() * 200;
    const bh = H * bhs[Math.floor(Math.random() * bhs.length)] + Math.random() * 60;
    const c = Math.random() > 0.3 ? Math.floor(18 + Math.random() * 18) : Math.floor(12 + Math.random() * 6);
    cityCtx.fillStyle = `rgb(${c},${Math.floor(c*0.85),${Math.floor(c*0.85+5)})`;
    cityCtx.fillRect(x, H - bh, bw, bh);
    // edge highlight
    cityCtx.fillStyle = 'rgba(45,40,55,0.4';
    cityCtx.fillRect(x, H - bh, bw, 2);
    // window lights in building
    for (let i = 0; i < 20; i++) {
      if (Math.random() < 0.55) continue;
      const lx = x + 6 + Math.random() * (bw - 12);
      const ly = H - bh + 4 + Math.random() * (bh - 8);
      const col = cols[Math.floor(Math.random() * cols.length)];
      cityCtx.fillStyle = col;
      cityCtx.fillRect(lx, ly, 1, 1);
      cityLights.push({ x: lx + 0.5, y: ly + 0.5, r: 4 + Math.random() * 3.5, color: col, drift: Math.random() * Math.PI * 2, driftSp: 0.4 + Math.random() * 1.1, base: { x: lx + 0.5, y: ly + 0.5 }, amp: 0.8 + Math.random() * 3, phase: Math.random() * Math.PI * 2, phaseSp: 0.1 + Math.random() * 0.2 });
    }
    x += bw + Math.random() * 10;
  }
  
  // big bokeh
  const bigCol = ['#ff6a50', '#ff80a0', '#ff60b0', '#ff50b0', '#ffd0a8', '#fff0a0', '#ffd055'];
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * W;
    const y = H * 0.3 + Math.random() * H * 0.8;
    const color = bigCol[Math.floor(Math.random() * bigCol.length)];
    const r = 2 + Math.random() * 6;
    cityLights.push({ x, y, r, color, drift: Math.random() * Math.PI * 2, driftSp: 0.2 + Math.random() * 0.4, base: { x, y }, amp: 0.4 + Math.random() * 3, phase: Math.random() * Math.PI * 2, phaseSp: 0.04 + Math.random() * 0.08 });
  }
}

function init() {
  drops.length = 0;
  streaks.length = 0;
  // seed some drops
  for (let i = 0; i < 80; i++) {
    const r = 1 + Math.random() * 5;
    drops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: r,
      maxR: 4 + Math.random() * 5,
      age: 0
    });
  }
  lightningTimer = 200;
  lightningFlash = 0;
}

// Drop drawing
function drawDrops(dc, list) {
  const len = list.length;
  for (let i = 0; i < len; i++) {
    const d = list[i];
    const r = d.r;
    
    if (r < 0.4) continue;
    
    dc.beginPath();
    dc.arc(d.x, d.y, r * 1.5, 0, Math.PI * 2);
    dc.fill();
    
    if (r > 1.3) {
      dc.beginPath();
      dc.arc(d.x, d.y, r * 0.9, 0, Math.PI * 2);
      dc.fill();
    }
    
    if (r > 2.5) {
      dc.beginPath();
      dc.arc(d.x - r * 0.25, d.y - r * 0.25, r * 0.6, 0, Math.PI * 2);
      dc.fill();
    }
    
    if (r > 2.0) {
      dc.beginPath();
      dc.arc(d.x - r * 0.35, d.y - r * 0.35, r * 0.15, 0, Math.PI * 2);
      dc.fill();
    }
    
    if (r > 3.5) {
      dc.beginPath();
      dc.arc(d.x + r * 0.2, d.y + r * 0.2, r * 0.05, 0, Math.PI * 2);
      dc.fill();
    }
  }
}

function drawStreaks(dc) {
  for (let i = 0; i < streaks.length; i++) {
    const s = streaks[i];
    const head = s.points[0];
    const tail = s.points[s.points.length - 1];
    
    dc.beginPath();
    dc.moveTo(head.x, head.y);
    dc.lineTo(s.lastX, s.lastY);
    dc.lineWidth = s.size * 2;
    dc.stroke();
    
    if (s.points.length >= 2) {
      dc.beginPath();
      dc.moveTo(head.x, head.y);
      dc.lineTo(tail.x, tail.y);
      dc.lineWidth = s.size * 1.4;
      dc.stroke();
    }
    
    dc.beginPath();
    dc.arc(head.x, head.y, s.size * 1.2, 0, Math.PI * 2);
    dc.fill();
    
    if (s.size > 2) {
      dc.beginPath();
      dc.arc(head.x - s.size * 0.25, head.y - s.size * 0.25, s.size * 0.7, 0, Math.PI * 2);
      dc.fill();
    }
  }
}

function updateCityLights(time) {
  for (let i = 0; i < cityLights.length; i++) {
    const l = cityLights[i];
    l.drift += l.driftSp * 0.016;
    l.phase += l.phaseSp * 0.016;
    l.x = l.base.x + Math.cos(l.phase) * l.amp;
    l.y = l.base.y + Math.sin(l.phase * 1.5) * l.amp * 0.5 + Math.sin(l.drift) * 0.5;
  }
}

function drawCity(lights) {
  cityCtx.save();
  cityCtx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < lights.length; i++) {
    const l = lights[i];
    const r = l.r;
    cityCtx.globalAlpha = 0.8;
    const g1 = cityCtx.createRadialGradient(l.x, l.y, 0, l.x, l.y, r * 2);
    g1.addColorStop(0, l.color);
    g1.addColorStop(1, 'transparent');
    cityCtx.fillStyle = g1;
    cityCtx.fillRect(l.x - r * 2, l.y - r * 2, r * 4, r * 4);
    cityCtx.globalAlpha = 0.4;
    const g2 = cityCtx.createRadialGradient(l.x, l.y, 0, l.x, l.y, r * 4);
    g2.addColorStop(0, l.color);
    g2.addColorStop(1, 'transparent');
    cityCtx.fillStyle = g2;
    cityCtx.fillRect(l.x - r * 4, l.y - r * 4, r * 8, r * 8);
    cityCtx.globalAlpha = 1.0;
    cityCtx.fillStyle = l.color;
    cityCtx.beginPath();
    cityCtx.arc(l.x, l.y, r * 0.3, 0, Math.PI * 2);
    cityCtx.fill();
  }
  cityCtx.restore();
  cityCtx.globalCompositeOperation = 'source-over';
  cityCtx.globalAlpha = 1;
  // fog
  const fg = cityCtx.createLinearGradient(0, 0, 0, H);
  fg.addColorStop(0, 'rgba(20,16,30,0.5');
  fg.addColorStop(0.5, 'rgba(20,16,30,0.05');
  fg.addColorStop(1, 'rgba(20,16,30,0.5');
  cityCtx.fillStyle = fg;
  cityCtx.fillRect(0, 0, W, H);
}

function drawLightning() {
  ctxObj.save();
  ctxObj.globalCompositeOperation = 'screen';
  ctxObj.globalAlpha = lightningFlash * 0.6;
  ctxObj.fillStyle = '#cfd';
  ctxObj.fillRect(0, 0, W, H);
  
  // subtle lightning bolts (only during flash peak)
  if (lightningFlash > 0.5 && Math.random() < 0.6) {
    ctxObj.strokeStyle = 'rgba(200, 220, 200,' + (lightningFlash * 0.5) + ')';
    ctxObj.lineWidth = 1.5;
    ctxObj.beginPath();
    let px = Math.random() * W;
    let py = 0;
    ctxObj.moveTo(px, py);
    while (py < H) {
      py += 5 + Math.random() * 12;
      px += (Math.random() - 0.5) * 30;
      ctxObj.lineTo(px, py);
      if (Math.random() < 0.3) {
        ctxObj.moveTo(px, py);
        ctxObj.lineTo(px + (Math.random() - 0.5) * 30, py + 10 + Math.random() * 10);
        ctxObj.stroke();
        ctxObj.beginPath();
        ctxObj.moveTo(px, py);
      }
    }
    ctxObj.stroke();
  }
  ctxObj.restore();
}

let lastT = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 16, 2);
  lastT = t;
  
  if (bgNeedsRebuild) {
    rebuildBg();
    bgNeedsRebuild = false;
  }
  
  // update lights
  updateCityLights(0);
  drawCity(cityLights);
  
  // update streaks
  for (let i = streaks.length - 1; i >= 0; i--) {
    const s = streaks[i];
    s.life -= 0.0016 * cfg.streakFadeRate;
    if (s.life <= 0) {
      streaks.splice(i, 1);
      continue;
    }
    // movement
    s.points[0].y += cfg.streakSpeed * (dt > 0 ? dt : 1) * (s.speedFactor || 1);
    // trail recording
    if (Math.random() < 0.3) {
      s.points.push({ x: s.points[0].x, y: s.points[0].y });
      if (s.points.length > cfg.streakTrailMax) s.points.shift();
    }
    s.lastX = s.points[0].x;
    s.lastY = s.points[0].y;
    // wiper smaller drops
    for (let j = drops.length - 1; j >= 0; j--) {
      const d = drops[j];
      const dx = d.x - s.points[0].x;
      const dy = d.y - s.points[0].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < s.wipeR) {
        if (d.r < 2.5) {
          drops.splice(j, 1);
        }
        // streak absorbs small drop
        if (d.r > 1 && d.r < s.size * 0.6 && Math.random() < 0.5) {
          s.size = Math.min(s.size + 0.05, s.maxSize);
        drops.splice(j, 1);
        if (Math.random() < 0.2) {
          s.points[0].x = d.x;
        }
        s.trailClear.push({ x: d.x, y: d.y });
        if (s.trailClear.length > 30) s.trailClear.shift();
        }
      }
    }
    // streak merges with nearby streak
    for (let k = streaks.length - 1; k >= 0; k--) {
      if (k === i) continue;
      const other = streaks[k];
      const dxx = other.points[0].x - s.points[0].x;
      const dyy = other.points[0].y - s.points[0].y;
      const dd = Math.sqrt(dxx * dxx + dyy * dyy);
      if (dd < 15) {
        s.points[0].x = (s.points[0].x + other.points[0].x) * 0.5;
        s.points[0].y = Math.min(s.points[0].y, other.points[0].y);
        s.size = Math.max(s.size, other.size);
        streaks.splice(k, 1);
        if (k < i) i--;
      }
    }
  // streak off screen
    if (s.points[0].y > H + 10) {
      streaks.splice(i, 1);
      continue;
    }
  }
  
  // update drops
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.age += 0.01;
    if (d.r < d.maxR) {
      d.r = Math.min(d.maxR, d.r + cfg.spawnGrowRate * 0.016 * (1 + d.r * 0.15));
    }
    
    // merge with neighbors
    for (let j = drops.length - 1; j >= 0; j--) {
      if (j === i) continue;
      const other = drops[j];
      if (Math.abs(other.r) < 0.5) continue;
      const dx = other.x - d.x;
      const dy = other.y - d.y;
      const dist2 = dx * dx + dy * dy;
      const mergeR = (d.r + other.r) * 0.6 + 3;
      if (dist2 < mergeR * mergeR) {
        const bigger = other.r > d.r ? other : d;
        const smaller = other.r > d.r ? d : other;
        const biggerVol = Math.pow(bigger.r, 1.5);
        const smallerVol = Math.pow(smaller.r, 1.5);
        const total = biggerVol + smallerVol;
        if (total > bigger.r * 1.1 || other.r < 1.5) {
          // weighted position
          d.x = (d.x * d.r + other.x * other.r) / (d.r + other.r);
          d.y = (d.y * d.r + other.y * other.r) / (d.r + other.r);
          d.r = Math.min(cfg.dropMaxR, Math.pow(total, 1 / 1.5));
          d.maxR = Math.max(d.maxR, other.maxR);
          drops.splice(j, 1);
          if (j < i) i--;
        }
        }
      }
    }
    
    // streakify
    if (d.r >= cfg.streakMinSize && Math.random() < 0.001 * d.r) {
      streaks.push({
        points: [{ x: d.x, y: d.y }],
        lastX: d.x, lastY: d.y,
        size: d.r * 0.5,
        maxSize: d.r * 0.8,
        life: 0.4 + Math.random() * 0.4,
        speedFactor: 0.7 + Math.random() * 0.6,
        wipeR: d.r * 2.5,
        trailClear: []
      });
      drops.splice(i, 1);
      continue;
    }
    
    // off screen ( shouldn't happen for static drops
    if (d.r > cfg.dropMaxR) drops.splice(i, 1);
  }
  
  // spawn new drops
  if (drops.length < cfg.maxDrops) {
    if (Math.random() < 0.3) {
      const r = 0.8 + Math.random() * 1.5;
      drops.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: r,
        maxR: 3 + Math.random() * 7,
        age: 0
      });
    }
  }
  
  // streaks cap
  if (streaks.length > cfg.maxStreaks) streaks.length = cfg.maxStreaks;
  
  // lightning
  lightningTimer -= 16;
  if (lightningTimer <= 0) {
    lightningFlash = 1;
    lightningTimer = Math.floor(cfg.lightningMin + Math.random() * (cfg.lightningMax - cfg.lightningMin));
  }
  if (lightningFlash > 0) {
    lightningFlash -= 0.03 * (dt > 0 ? dt : 1);
    if (lightningFlash < 0) lightningFlash = 0;
  }
  
  // draw drop layer
  dropCanvas.width = dropCanvas.width;
  dropCtx.globalCompositeOperation = 'source-over';
  dropCtx.fillStyle = 'rgba(255,255,255,1)';
  dropCtx.beginPath();
  dropCtx.rect(0, 0, W, H);
  dropCtx.fill();
  
  dropCtx.fillStyle = 'rgba(255,255,255,1)';
  drawDrops(dropCtx, drops);
  drawStreaks(dropCtx);
  
  // composite
  ctxObj.globalCompositeOperation = 'source-over';
  ctxObj.globalAlpha = 1;
  ctxObj.drawImage(cityCanvas, 0, 0, W, H);
  
  // composite drops
  ctxObj.globalCompositeOperation = 'multiply';
  ctxObj.globalAlpha = 1;
  ctxObj.drawImage(dropCanvas, 0, 0, W, H);
  
  // add highlight
  ctxObj.globalCompositeOperation = 'screen';
  ctxObj.globalAlpha = 0.3;
  ctxObj.drawImage(dropCanvas, 0, 0, W, H);
  ctxObj.globalAlpha = 1;
  
  // glass overlay
  const gg = ctxObj.createLinearGradient(0, 0, 0, H);
  gg.addColorStop(0, 'rgba(150,160,80,0.05');
  gg.addColorStop(0.5, 'rgba(150,160,80,0');
  gg.addColorStop(1, 'rgba(150,160,80,0.05');
  ctxObj.globalCompositeOperation = 'overlay';
  ctxObj.fillStyle = gg;
  ctxObj.fillRect(0, 0, W, H);
  ctxObj.globalCompositeOperation = 'source-over';
  
  // vignette
  ctxObj.globalCompositeOperation = 'multiply';
  const vg = ctxObj.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(255,255,255,1');
  vg.addColorStop(1, 'rgba(120,120,120,0.7');
  ctxObj.fillStyle = vg;
  ctxObj.fillRect(0, 0, W, H);
  ctxObj.globalCompositeOperation = 'source-over';
  
  // lightning
  if (lightningFlash > 0) drawLightning();
  
  rAF(loop);
}

const rAF = window.requestAnimationFrame;
function rAF(cb) { window.requestAnimationFrame(cb); }

window.addEventListener('resize', () => { resize(); bgNeedsRebuild = true; });
window.addEventListener('keydown', (e) => {
  if (e.key === 'r') { init(); }
  if (e.key === 'l') { lightningFlash = 1; lightningTimer = cfg.lightningMin; }
});

resize();
init();
rAF(loop);
</script>
</body>
</html>
