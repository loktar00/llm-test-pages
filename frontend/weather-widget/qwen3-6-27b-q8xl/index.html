<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --card-radius:28px;
    --transition-speed:0.4s;
  }

  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 2s ease;
    padding:20px;
  }

  body.day{
    background:linear-gradient(160deg,#1a1a2e 0%,#16213e 30%,#0f3460 60%,#533483 100%);
  }

  body.night{
    background:linear-gradient(160deg,#0a0a1a 0%,#0d1117 30%,#161b22 60%,#1a1a2e 100%);
  }

  .widget{
    width:380px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(40px);
    -webkit-backdrop-filter:blur(40px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:var(--card-radius);
    padding:28px 24px 24px;
    color:#fff;
    box-shadow:0 25px 60px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1);
    position:relative;
    overflow:hidden;
  }

  .widget::before{
    content:'';
    position:absolute;
    top:-50%;
    right:-50%;
    width:200%;
    height:200%;
    background:radial-gradient(circle at 70% 20%,rgba(255,200,100,0.06) 0%,transparent 50%);
    pointer-events:none;
  }

  /* ── Header ── */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }

  .location{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
    opacity:0.7;
  }

  .unit-toggle{
    display:flex;
    background:rgba(255,255,255,0.1);
    border-radius:20px;
    padding:3px;
    cursor:pointer;
    position:relative;
    user-select:none;
  }

  .unit-btn{
    padding:4px 12px;
    font-size:12px;
    font-weight:700;
    border-radius:18px;
    transition:all 0.3s;
    color:rgba(255,255,255,0.5);
    letter-spacing:0.5px;
  }

  .unit-btn.active{
    color:#fff;
    background:rgba(255,255,255,0.2);
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }

  /* ── Main Temp Scene ── */
  .scene{
    display:flex;
    align-items:center;
    gap:20px;
    margin:16px 0 20px;
    position:relative;
    min-height:140px;
  }

  .temp-display{
    flex-shrink:0;
  }

  .temp-value{
    font-size:72px;
    font-weight:200;
    line-height:1;
    letter-spacing:-3px;
    position:relative;
    display:inline-block;
  }

  .temp-value .degree{
    font-size:28px;
    font-weight:300;
    vertical-align:super;
    margin-left:2px;
    opacity:0.6;
  }

  .temp-value .unit-label{
    font-size:14px;
    font-weight:600;
    position:absolute;
    top:8px;
    right:-24px;
    opacity:0.5;
  }

  .condition{
    font-size:15px;
    font-weight:500;
    opacity:0.7;
    margin-top:6px;
  }

  .high-low{
    font-size:12px;
    opacity:0.4;
    margin-top:4px;
    font-weight:500;
  }

  /* ── Sun ── */
  .sun-scene{
    position:relative;
    width:120px;
    height:120px;
    flex-shrink:0;
  }

  .sun{
    width:56px;
    height:56px;
    background:radial-gradient(circle,#ffe066,#ffb300);
    border-radius:50%;
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 40px rgba(255,180,0,0.5),0 0 80px rgba(255,150,0,0.2);
    z-index:1;
  }

  .sun-rays{
    position:absolute;
    top:50%;
    left:50%;
    width:80px;
    height:80px;
    transform:translate(-50%,-50%);
    animation:rotateSun 20s linear infinite;
    z-index:0;
  }

  .sun-ray{
    position:absolute;
    width:3px;
    height:16px;
    background:linear-gradient(to top,rgba(255,200,50,0.6),transparent);
    border-radius:2px;
    top:0;
    left:50%;
    transform-origin:50% 40px;
  }

  .sun-ray:nth-child(1){transform:rotate(0deg)}
  .sun-ray:nth-child(2){transform:rotate(45deg)}
  .sun-ray:nth-child(3){transform:rotate(90deg)}
  .sun-ray:nth-child(4){transform:rotate(135deg)}
  .sun-ray:nth-child(5){transform:rotate(180deg)}
  .sun-ray:nth-child(6){transform:rotate(225deg)}
  .sun-ray:nth-child(7){transform:rotate(270deg)}
  .sun-ray:nth-child(8){transform:rotate(315deg)}

  @keyframes rotateSun{
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }

  /* ── Cloud ── */
  .cloud{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    animation:floatCloud 4s ease-in-out infinite;
  }

  .cloud-body{
    width:80px;
    height:30px;
    background:rgba(255,255,255,0.9);
    border-radius:20px;
    position:relative;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
  }

  .cloud-body::before{
    content:'';
    position:absolute;
    width:36px;
    height:36px;
    background:rgba(255,255,255,0.9);
    border-radius:50%;
    top:-22px;
    left:12px;
  }

  .cloud-body::after{
    content:'';
    position:absolute;
    width:26px;
    height:26px;
    background:rgba(255,255,255,0.9);
    border-radius:50%;
    top:-14px;
    right:10px;
  }

  @keyframes floatCloud{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-6px)}
  }

  /* ── Hourly Strip ── */
  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    opacity:0.4;
    font-weight:600;
    margin-bottom:12px;
  }

  .hourly-strip{
    display:flex;
    gap:0;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -ms-overflow-style:none;
    margin:0 -24px;
    padding:0 24px 16px;
  }

  .hourly-strip::-webkit-scrollbar{display:none}

  .hour-item{
    flex:0 0 auto;
    width:60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:10px 4px;
    border-radius:16px;
    scroll-snap-align:start;
    transition:background 0.3s;
    cursor:default;
  }

  .hour-item:hover{
    background:rgba(255,255,255,0.06);
  }

  .hour-item.now{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.08);
  }

  .hour-time{
    font-size:11px;
    font-weight:600;
    opacity:0.5;
  }

  .hour-item.now .hour-time{
    opacity:0.9;
    color:#ffd166;
  }

  .hour-temp{
    font-size:14px;
    font-weight:600;
    opacity:0.9;
  }

  /* ── Tiny Icons ── */
  .tiny-icon{
    width:28px;
    height:28px;
    position:relative;
  }

  /* Tiny Sun */
  .tiny-sun{
    width:16px;
    height:16px;
    background:radial-gradient(circle,#ffe066,#ffb300);
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 8px rgba(255,180,0,0.4);
  }

  .tiny-sun-rays{
    position:absolute;
    top:50%;
    left:50%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%);
    animation:rotateSun 15s linear infinite;
  }

  .tiny-sun-ray{
    position:absolute;
    width:1.5px;
    height:5px;
    background:rgba(255,200,50,0.5);
    border-radius:1px;
    top:0;
    left:50%;
    transform-origin:50% 11px;
  }

  .tiny-sun-ray:nth-child(1){transform:rotate(0deg)}
  .tiny-sun-ray:nth-child(2){transform:rotate(60deg)}
  .tiny-sun-ray:nth-child(3){transform:rotate(120deg)}
  .tiny-sun-ray:nth-child(4){transform:rotate(180deg)}
  .tiny-sun-ray:nth-child(5){transform:rotate(240deg)}
  .tiny-sun-ray:nth-child(6){transform:rotate(300deg)}

  /* Tiny Cloud */
  .tiny-cloud{
    width:20px;
    height:10px;
    background:rgba(255,255,255,0.85);
    border-radius:10px;
    position:absolute;
    bottom:4px;
    left:50%;
    transform:translateX(-50%);
  }

  .tiny-cloud::before{
    content:'';
    position:absolute;
    width:10px;
    height:10px;
    background:rgba(255,255,255,0.85);
    border-radius:50%;
    top:-6px;
    left:3px;
  }

  .tiny-cloud::after{
    content:'';
    position:absolute;
    width:8px;
    height:8px;
    background:rgba(255,255,255,0.85);
    border-radius:50%;
    top:-3px;
    right:2px;
  }

  /* Rain drops */
  .rain-drop{
    position:absolute;
    width:2px;
    height:6px;
    background:linear-gradient(to bottom,rgba(100,180,255,0.8),rgba(100,180,255,0.2));
    border-radius:1px;
    animation:rainFall 1s linear infinite;
  }

  .rain-drop:nth-child(1){left:6px;bottom:-2px;animation-delay:0s}
  .rain-drop:nth-child(2){left:12px;bottom:-2px;animation-delay:0.3s}
  .rain-drop:nth-child(3){left:18px;bottom:-2px;animation-delay:0.6s}

  @keyframes rainFall{
    0%{transform:translateY(0);opacity:1}
    80%{opacity:1}
    100%{transform:translateY(12px);opacity:0}
  }

  /* Tiny Moon */
  .tiny-moon{
    width:14px;
    height:14px;
    background:radial-gradient(circle at 35% 35%,#f5f5dc,#e8d5a3);
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 6px rgba(245,245,220,0.3);
  }

  .tiny-moon::after{
    content:'';
    position:absolute;
    width:12px;
    height:12px;
    background:rgba(20,20,40,0.95);
    border-radius:50%;
    top:-2px;
    left:4px;
  }

  /* ── 5-Day Forecast ── */
  .forecast{
    margin-top:8px;
  }

  .forecast-item{
    display:flex;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
    gap:12px;
    transition:background 0.2s;
    border-radius:8px;
    padding-left:4px;
    padding-right:4px;
  }

  .forecast-item:last-child{
    border-bottom:none;
  }

  .forecast-item:hover{
    background:rgba(255,255,255,0.04);
  }

  .day-name{
    width:60px;
    font-size:13px;
    font-weight:600;
    opacity:0.8;
  }

  .forecast-icon{
    width:32px;
    height:32px;
    flex-shrink:0;
  }

  .forecast-bar-container{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .forecast-low{
    font-size:12px;
    opacity:0.35;
    width:28px;
    text-align:right;
    font-weight:500;
  }

  .forecast-high{
    font-size:12px;
    opacity:0.8;
    width:28px;
    font-weight:600;
  }

  .forecast-bar{
    flex:1;
    height:4px;
    background:rgba(255,255,255,0.08);
    border-radius:2px;
    position:relative;
    overflow:hidden;
  }

  .forecast-bar-fill{
    position:absolute;
    height:100%;
    border-radius:2px;
    background:linear-gradient(90deg,#667eea,#764ba2);
    transition:all 0.6s ease;
  }

  /* ── Rolling number ── */
  .rolling-digit{
    display:inline-block;
    overflow:hidden;
    height:1em;
    line-height:1;
    vertical-align:bottom;
  }

  .rolling-digit-inner{
    display:flex;
    flex-direction:column;
    transition:transform 0.5s cubic-bezier(0.23,1,0.32,1);
  }

  .rolling-digit-inner span{
    height:1em;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ── Sparkle decoration ── */
  .sparkle{
    position:absolute;
    width:4px;
    height:4px;
    background:rgba(255,255,255,0.6);
    border-radius:50%;
    animation:sparkle 3s ease-in-out infinite;
  }

  .sparkle:nth-child(1){top:15%;right:10%;animation-delay:0s}
  .sparkle:nth-child(2){top:30%;right:25%;animation-delay:1s;width:3px;height:3px}
  .sparkle:nth-child(3){top:60%;right:8%;animation-delay:2s;width:2px;height:2px}

  @keyframes sparkle{
    0%,100%{opacity:0;transform:scale(0)}
    50%{opacity:1;transform:scale(1)}
  }

  /* ── Divider ── */
  .divider{
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
    margin:16px 0;
  }

  /* ── Wind indicator ── */
  .meta-row{
    display:flex;
    gap:16px;
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.06);
  }

  .meta-item{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .meta-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    opacity:0.35;
    font-weight:600;
  }

  .meta-value{
    font-size:13px;
    font-weight:600;
    opacity:0.8;
  }

  /* ── Wind spinner ── */
  .wind-spinner{
    display:inline-block;
    width:14px;
    height:14px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:rgba(255,255,255,0.8);
    border-radius:50%;
    animation:spin 2s linear infinite;
    vertical-align:middle;
    margin-right:4px;
  }

  @keyframes spin{
    to{transform:rotate(360deg)}
  }

  /* ── Humidity drops ── */
  .humidity-drop{
    display:inline-block;
    width:8px;
    height:10px;
    background:linear-gradient(to bottom,#66b3ff,#3388dd);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    vertical-align:middle;
    margin-right:4px;
    animation:drip 2s ease-in-out infinite;
  }

  @keyframes drip{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-2px) scale(0.95)}
  }

  /* ── UV indicator ── */
  .uv-bar{
    display:inline-block;
    width:20px;
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg,#4ade80,#facc15,#f97316,#ef4444);
    vertical-align:middle;
    margin-right:4px;
    position:relative;
  }

  .uv-marker{
    position:absolute;
    width:3px;
    height:10px;
    background:#fff;
    border-radius:1px;
    top:-2px;
    box-shadow:0 0 4px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="widget">
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>

  <!-- Header -->
  <div class="header">
    <div class="location">San Francisco, CA</div>
    <div class="unit-toggle" id="unitToggle">
      <div class="unit-btn active" data-unit="F">°F</div>
      <div class="unit-btn" data-unit="C">°C</div>
    </div>
  </div>

  <!-- Main Scene -->
  <div class="scene">
    <div class="temp-display">
      <div class="temp-value">
        <span id="tempRolling">72</span><span class="degree">°</span>
      </div>
      <div class="condition">Partly Cloudy</div>
      <div class="high-low">H:78°  L:62°</div>
    </div>
    <div class="sun-scene">
      <div class="sun">
        <div class="sun-rays">
          <div class="sun-ray"></div>
          <div class="sun-ray"></div>
          <div class="sun-ray"></div>
          <div class="sun-ray"></div>
          <div class="sun-ray"></div>
          <div class="sun-ray"></div>
          <div class="sun-ray"></div>
          <div class="sun-ray"></div>
        </div>
      </div>
      <div class="cloud">
        <div class="cloud-body"></div>
      </div>
    </div>
  </div>

  <!-- Hourly Strip -->
  <div class="section-label">Hourly Forecast</div>
  <div class="hourly-strip" id="hourlyStrip"></div>

  <div class="divider"></div>

  <!-- 5-Day Forecast -->
  <div class="section-label">5-Day Forecast</div>
  <div class="forecast" id="forecastList"></div>

  <!-- Meta -->
  <div class="meta-row">
    <div class="meta-item">
      <span class="meta-label">Wind</span>
      <span class="meta-value"><span class="wind-spinner"></span>12 mph</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Humidity</span>
      <span class="meta-value"><span class="humidity-drop"></span>64%</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">UV Index</span>
      <span class="meta-value"><span class="uv-bar"><span class="uv-marker" style="left:55%"></span></span>6</span>
    </div>
  </div>
</div>

<script>
(function(){
  // ── State ──
  let unit = 'F';

  // ── Data ──
  const hourlyData = [
    {time:'Now',temp:72,icon:'sun-cloud'},
    {time:'1PM',temp:74,icon:'sun'},
    {time:'2PM',temp:76,icon:'sun'},
    {time:'3PM',temp:77,icon:'sun-cloud'},
    {time:'4PM',temp:75,icon:'cloud'},
    {time:'5PM',temp:73,icon:'cloud-rain'},
    {time:'6PM',temp:70,icon:'cloud-rain'},
    {time:'7PM',temp:68,icon:'cloud'},
    {time:'8PM',temp:66,icon:'moon'},
    {time:'9PM',temp:64,icon:'moon'},
    {time:'10PM',temp:63,icon:'moon-cloud'},
    {time:'11PM',temp:62,icon:'cloud'},
  ];

  const forecastData = [
    {day:'Today',low:62,high:78,icon:'sun-cloud'},
    {day:'Wed',low:60,high:74,icon:'cloud-rain'},
    {day:'Thu',low:58,high:70,icon:'cloud-rain'},
    {day:'Fri',low:55,high:68,icon:'cloud'},
    {day:'Sat',low:57,high:72,icon:'sun-cloud'},
  ];

  // ── Day/Night ──
  function setDayNight(){
    const h = new Date().getHours();
    const isNight = h < 6 || h >= 20;
    document.body.className = isNight ? 'night' : 'day';
  }
  setDayNight();
  setInterval(setDayNight, 60000);

  // ── Tiny Icon Builder ──
  function buildTinyIcon(type){
    const container = document.createElement('div');
    container.className = 'tiny-icon';

    if(type === 'sun' || type === 'sun-cloud'){
      const rays = document.createElement('div');
      rays.className = 'tiny-sun-rays';
      for(let i=0;i<6;i++){
        const r = document.createElement('div');
        r.className = 'tiny-sun-ray';
        rays.appendChild(r);
      }
      container.appendChild(rays);
      const sun = document.createElement('div');
      sun.className = 'tiny-sun';
      container.appendChild(sun);
    }

    if(type === 'cloud' || type === 'cloud-rain' || type === 'sun-cloud' || type === 'moon-cloud'){
      const cloud = document.createElement('div');
      cloud.className = 'tiny-cloud';
      if(type === 'sun-cloud') cloud.style.bottom = '8px';
      if(type === 'moon-cloud') cloud.style.bottom = '8px';
      container.appendChild(cloud);
    }

    if(type === 'cloud-rain'){
      for(let i=0;i<3;i++){
        const drop = document.createElement('div');
        drop.className = 'rain-drop';
        container.appendChild(drop);
      }
    }

    if(type === 'moon' || type === 'moon-cloud'){
      const moon = document.createElement('div');
      moon.className = 'tiny-moon';
      if(type === 'moon-cloud') moon.style.top = '6px';
      container.appendChild(moon);
    }

    return container;
  }

  // ── Render Hourly ──
  function renderHourly(){
    const strip = document.getElementById('hourlyStrip');
    strip.innerHTML = '';
    hourlyData.forEach((h,i) => {
      const item = document.createElement('div');
      item.className = 'hour-item' + (i===0?' now':'');
      item.innerHTML = `<div class="hour-time">${h.time}</div>`;
      item.appendChild(buildTinyIcon(h.icon));
      const tempEl = document.createElement('div');
      tempEl.className = 'hour-temp';
      tempEl.textContent = (unit==='F' ? h.temp : Math.round((h.temp-32)*5/9)) + '°';
      item.appendChild(tempEl);
      strip.appendChild(item);
    });
  }

  // ── Render Forecast ──
  function renderForecast(){
    const list = document.getElementById('forecastList');
    list.innerHTML = '';
    const allLows = forecastData.map(d=>d.low);
    const allHighs = forecastData.map(d=>d.high);
    const minT = Math.min(...allLows);
    const maxT = Math.max(...allHighs);
    const range = maxT - minT || 1;

    forecastData.forEach(d => {
      const item = document.createElement('div');
      item.className = 'forecast-item';

      const dayEl = document.createElement('div');
      dayEl.className = 'day-name';
      dayEl.textContent = d.day;

      const iconEl = document.createElement('div');
      iconEl.className = 'forecast-icon';
      iconEl.appendChild(buildTinyIcon(d.icon));

      const barContainer = document.createElement('div');
      barContainer.className = 'forecast-bar-container';

      const lowEl = document.createElement('div');
      lowEl.className = 'forecast-low';
      lowEl.textContent = (unit==='F'?d.low:Math.round((d.low-32)*5/9)) + '°';

      const bar = document.createElement('div');
      bar.className = 'forecast-bar';
      const fill = document.createElement('div');
      fill.className = 'forecast-bar-fill';
      const leftPct = ((d.low - minT) / range) * 100;
      const widthPct = ((d.high - d.low) / range) * 100;
      fill.style.left = leftPct + '%';
      fill.style.width = widthPct + '%';
      bar.appendChild(fill);

      const highEl = document.createElement('div');
      highEl.className = 'forecast-high';
      highEl.textContent = (unit==='F'?d.high:Math.round((d.high-32)*5/9)) + '°';

      barContainer.appendChild(lowEl);
      barContainer.appendChild(bar);
      barContainer.appendChild(highEl);

      item.appendChild(dayEl);
      item.appendChild(iconEl);
      item.appendChild(barContainer);
      list.appendChild(item);
    });
  }

  // ── Rolling Number ──
  function setRollingTemp(value){
    const el = document.getElementById('tempRolling');
    const current = parseInt(el.textContent) || 0;
    if(current === value) return;

    // Build rolling animation
    const diff = value - current;
    const steps = Math.abs(diff);
    if(steps === 0) return;

    el.textContent = value;
    el.style.transition = 'transform 0.3s ease, opacity 0.15s ease';
    el.style.opacity = '0';
    el.style.transform = diff > 0 ? 'translateY(-10px)' : 'translateY(10px)';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
        setTimeout(() => {
          el.style.transition = '';
          el.style.opacity = '';
          el.style.transform = '';
        }, 300);
      });
    });
  }

  // ── Update High/Low in main display ──
  function updateMainHL(){
    const hl = document.querySelector('.high-low');
    if(unit === 'F'){
      hl.textContent = 'H:78°  L:62°';
    } else {
      hl.textContent = 'H:26°  L:17°';
    }
  }

  // ── Unit Toggle ──
  document.getElementById('unitToggle').addEventListener('click', function(e){
    const btn = e.target.closest('.unit-btn');
    if(!btn) return;
    const newUnit = btn.dataset.unit;
    if(newUnit === unit) return;

    unit = newUnit;
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    setRollingTemp(unit === 'F' ? 72 : 22);
    renderHourly();
    renderForecast();
    updateMainHL();
  });

  // ── Init ──
  renderHourly();
  renderForecast();

  // Scroll hourly to show "Now"
  setTimeout(() => {
    const strip = document.getElementById('hourlyStrip');
    strip.scrollLeft = 0;
  }, 100);
})();
</script>
</body>
</html>
