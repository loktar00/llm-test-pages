<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rain On Window</title>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;}
canvas{display:block;width:100vw;height:100vh;}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;filter:blur(8px) brightness(0.6);z-index:-1}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="bg"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const bg = document.getElementById('bg');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', ()=>{
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initBokeh();
});

// --- Bokeh background ---
let bokeh = [];
let lightningTimeout;
function initBokeh(){
    bokeh = [];
    const count = 150;
    for(let i=0;i<count;i++){
        bokeh.push({
            x: Math.random()*W,
            y: Math.random()*H,
            r: Math.random()*2 + 0.5,
            c: `hsl(${Math.random()*60+180}, 80%, ${Math.random()*40+60}%)`
        });
    }
}

function drawBokeh(brightness){
    bg.style.background = `
       radial-gradient(circle at 50% 50%, #000 0%, #000 100%),
        repeating-radial-gradient(circle, #112244 0%, #0a142a 100%)
    `;
    bg.style.boxShadow = `inset 0 0 100px #000`;
    
    let html = '';
    for(const p of bokeh){
        p.y += 0.05 + Math.sin(p.x*0.01)*0.02;
        if(p.y > H + 10) p.y = -10;
        const size = p.r * (1 + Math.sin(Date.now()*0.001 + p.x)*0.1);
        html += `<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${size*2}px;height:${size*2}px;border-radius:50%;background:${p.c};opacity:${0.6+brightness};box-shadow:0 0 ${size*4}px ${p.c};"></div>`;
    }
    bg.innerHTML = html;
}

initBokeh();

// --- Rain drops simulation ---
let drops = [];
const maxDrops = 400;

function addDrop(){
    if(drops.length < maxDrops){
        drops.push({
            x: Math.random()*W,
            y: 0,
            r: 0.1 + Math.random()*0.3,
            vr: 0,
            active: false
        });
    }
}

// Track where streaks have passed for clearing
let trails = [];

function updateDrops(){
    const now = Date.now();
    
    // Add new droplets occasionally
    if(Math.random() < 0.3) addDrop();
    
    // Update existing
    for(let d of drops){
        if(!d.active){
            // Growing phase
            d.r += 0.005 + Math.random()*0.01;
            if(d.r > 1.5){
                d.active = true;
                d.vr = 0.1 + Math.random()*0.3;
            }
        } else {
            // Falling
            d.y += d.vr;
            d.vr += 0.02 + Math.random()*0.01;
            
            // Merge with nearby
            for(let d2 of drops){
                if(d2 === d) continue;
                const dx = d.x - d2.x;
                const dy = d.y - d2.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < (d.r + d2.r) && dist > 0){
                    // Merge
                    const ratio = d2.r / (d.r + d2.r);
                    d.x = d.x * ratio + d2.x * (1-ratio);
                    d.y = d.y * ratio + d2.y * (1-ratio);
                    d.r = d.r + d2.r/4;
                    d2.r *= 0.8;
                    if(d.r > 3){
                        // Create trail effect
                        trails.push({
                            x: d.x,
                            y: d.y,
                            t: now,
                            len: Math.random()*30+10
                        });
                        // Reset large drop
                        d.x = Math.random()*W;
                        d.y = -10;
                        d.r = 0.5;
                        d.active = false;
                        d.vr = 0;
                    }
                }
            }
            
            // Off screen
            if(d.y > H + 10){
                d.x = Math.random()*W;
                d.y = -10;
                d.r = 0.3;
                d.active = false;
                d.vr = 0;
            }
        }
    }
}

let lightning = false;
let lightningEnd = 0;
let lightningIntensity = 0;

function checkLightning(){
    if(Math.random() < 0.0005){
        lightning = true;
        lightningEnd = Date.now() + 200 + Math.random()*300;
        lightningIntensity = 0.8;
    }
    
    if(lightning && Date.now() > lightningEnd){
        lightning = false;
    }
}

function animate(){
    requestAnimationFrame(animate);
    
    checkLightning();
    if(lightning){
        lightningIntensity *= 0.96;
    }
    
    updateDrops();
    
    // Clear canvas
    ctx.clearRect(0, 0, W, H);
    
    // Draw background (simulated)
    ctx.fillStyle = '#050a14';
    ctx.fillRect(0, 0, W, H);
    
    // Draw bokeh (behind glass)
    for(const p of bokeh){
        const size = p.r * (1 + Math.sin(Date.now()*0.001 + p.x)*0.1);
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI*2);
        ctx.fillStyle = p.c;
        ctx.globalAlpha = 0.4 + lightningIntensity*0.6;
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    if(lightningIntensity > 0.01){
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = lightningIntensity * 0.7;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }
    
    // Draw trails (clear paths)
    const now = Date.now();
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    for(let i = trails.length-1; i >= 0; i--){
        const t = trails[i];
        const age = now - t.t;
        const alpha = 1 - age/800;
        if(age > 800){
            trails.splice(i,1);
            continue;
        }
        ctx.globalAlpha = 0.3 + alpha*0.4;
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        ctx.lineTo(t.x + (Math.random()-0.5)*t.len, t.y + t.len + Math.random()*20);
        ctx.lineWidth = 2 + Math.random()*2;
        ctx.stroke();
    }
    ctx.restore();
    
    // Draw raindrops with refraction
    for(const d of drops){
        const grad = ctx.createRadialGradient(
            d.x - d.r/3, 
            d.y - d.r/3, 
            d.r/4,
            d.x, 
            d.y, 
            d.r
        );
        grad.addColorStop(0, 'rgba(255,255,255,0.8)');
        grad.addColorStop(1, 'rgba(173,216,230,0.2)');
        
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
        ctx.fillStyle = grad;
        ctx.globalAlpha = Math.min(1, d.r/3);
        ctx.fill();
        
        // Highlight
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(d.x - d.r/4, d.y - d.r/4, d.r/3, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fill();
    }
    
    drawBokeh(lightningIntensity);
}

animate();
</script>
</body>
</html>
