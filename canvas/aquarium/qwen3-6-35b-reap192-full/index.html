<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="aquarium"></canvas>
    <script>
        const canvas = document.getElementById('aquarium');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouseX = -1000, mouseY = -1000; // Start off-screen

        const resize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

        // --- Math Helpers ---
        const rand = (min, max) => Math.random() * (max - min) + min;
        const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
        const lerp = (start, end, t) => start * (1 - t) + end * t;

        // --- Config ---
        const GRAVEL_HEIGHT = 60;
        const FISH_COUNT = 15;
        const BUBBLE_MAX = 30;

        // --- Classes ---

        class Bubble {
            constructor() { this.reset(); }
            reset() {
                this.x = rand(0, width);
                this.y = height + rand(0, 50);
                this.r = rand(2, 6);
                this.speed = rand(0.5, 2);
                this.wobblePhase = rand(0, Math.PI * 2);
                this.active = false;
            }
            update() {
                if (!this.active) {
                    if (Math.random() < 0.05) this.active = true;
                    return;
                }
                this.y -= this.speed;
                this.x += Math.sin(this.wobblePhase) * 0.5;
                this.wobblePhase += 0.1;
                if (this.y < -20) this.reset();
            }
            draw() {
                if (!this.active) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.fill();
                ctx.stroke();
            }
        }

        class Plant {
            constructor(x) {
                this.x = x;
                this.height = rand(100, 250);
                this.segments = Math.floor(rand(5, 10));
                this.color = `hsl(${rand(80, 140)}, 60%, ${rand(20, 40)}%)`;
                this.phase = rand(0, 10);
            }
            draw(time) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x, height - GRAVEL_HEIGHT);
                
                let currX = this.x;
                let currY = height - GRAVEL_HEIGHT;
                const segH = this.height / this.segments;

                for (let i = 0; i < this.segments; i++) {
                    const sway = Math.sin((time * 0.002) + this.phase + i * 0.5) * (10 + i * 2);
                    currY -= segH;
                    currX += sway * 0.3;
                    // Draw leaf shape
                    ctx.lineTo(currX - 5 + sway, currY + segH);
                    ctx.lineTo(currX + sway, currY);
                    ctx.lineTo(currX + 5 + sway, currY + segH);
                }
                ctx.lineTo(this.x + 10, height - GRAVEL_HEIGHT);
                ctx.fill();
            }
        }

        class Crab {
            constructor() {
                this.x = rand(width * 0.2, width * 0.8);
                this.y = height - GRAVEL_HEIGHT + 15;
                this.dir = 1;
                this.speed = 0.5;
                this.angle = 0;
            }
            update() {
                this.x += this.speed * this.dir;
                this.angle = Math.sin(this.x * 0.05) * 0.2;
                if (this.x > width - 50) this.dir = -1;
                if (this.x < 50) this.dir = 1;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Body
                ctx.fillStyle = '#d35400'; // Pumpkin orange
                ctx.beginPath();
                ctx.ellipse(0, 0, 15, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Shell (Hermit)
                ctx.fillStyle = '#8e44ad'; // Purple shell
                ctx.beginPath();
                ctx.arc(-5, -5, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // Legs
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, 5); ctx.lineTo(-15, 10);
                ctx.moveTo(10, 5); ctx.lineTo(15, 10);
                ctx.stroke();
                
                // Eyes
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(-4, -12, 2, 0, Math.PI * 2);
                ctx.arc(4, -12, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Fish {
            constructor() {
                this.species = Math.floor(rand(0, 4));
                this.reset();
            }

            reset() {
                this.x = rand(100, width - 100);
                this.y = rand(100, height - 200);
                this.vx = rand(-1, 1);
                this.vy = rand(-0.5, 0.5);
                this.targetVx = this.vx;
                this.targetVy = this.vy;
                this.maxSpeed = this.species === 0 ? 4 : 2; // Dart species vs Float species
                this.color = this.getColor();
                this.size = this.getSize();
                this.tailPhase = 0;
                this.fleeing = false;
            }

            getColor() {
                const colors = [
                    ['#e74c3c', '#c0392b'], // Red/Orange
                    ['#f1c40f', '#f39c12'], // Yellow
                    ['#3498db', '#2980b9'], // Blue
                    ['#9b59b6', '#8e44ad']  // Purple
                ];
                return colors[this.species];
            }

            getSize() {
                return rand(15, 35);
            }

            update(fishes, time) {
                // Steering Logic
                let ax = 0;
                let ay = 0;

                // 1. Wander
                ax += rand(-0.1, 0.1);
                ay += rand(-0.1, 0.1);

                // 2. Avoid Walls
                const margin = 50;
                if (this.x < margin) ax += 1;
                if (this.x > width - margin) ax -= 1;
                if (this.y < margin) ay += 1;
                if (this.y > height - GRAVEL_HEIGHT - margin) ay -= 1;

                // 3. Mouse Flee
                const dMouse = dist(this.x, this.y, mouseX, mouseY);
                if (dMouse < 200) {
                    const force = (200 - dMouse) / 200;
                    ax += (this.x - mouseX) / dMouse * force * 0.5;
                    ay += (this.y - mouseY) / dMouse * force * 0.5;
                    this.fleeing = true;
                } else {
                    this.fleeing = false;
                }

                // 4. School / Separation
                fishes.forEach(other => {
                    if (other === this) return;
                    const d = dist(this.x, this.y, other.x, other.y);
                    if (d < 50) {
                        ax += (this.x - other.x) / d * 0.2;
                        ay += (this.y - other.y) / d * 0.2;
                    }
                });

                // Apply Forces
                this.vx += ax;
                this.vy += ay;

                // Limit Speed
                const speed = Math.hypot(this.vx, this.vy);
                const currentMax = this.fleeing ? this.maxSpeed * 3 : this.maxSpeed;
                if (speed > currentMax) {
                    this.vx = (this.vx / speed) * currentMax;
                    this.vy = (this.vy / speed) * currentMax;
                }

                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Tail Animation
                const speedRatio = speed / this.maxSpeed;
                this.tailPhase += 0.2 + speedRatio * 0.5;
            }

            draw(time) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Flip based on direction
                if (this.vx < 0) ctx.scale(-1, 1);

                const tilt = this.vy * 0.1; // Tilt up/down slightly
                ctx.rotate(tilt);

                const s = this.size;
                const tailSwing = Math.sin(this.tailPhase) * 0.2;

                ctx.fillStyle = this.color[0];
                ctx.strokeStyle = this.color[1];
                ctx.lineWidth = 1;

                // Draw Shape based on species
                if (this.species === 0) {
                    // Roundfish (Goldfish style)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s, s * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.8, 0);
                    ctx.lineTo(-s * 1.5, -s * 0.4 + tailSwing * s);
                    ctx.lineTo(-s * 1.5, s * 0.4 + tailSwing * s);
                    ctx.fill();
                    // Eye
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(s * 0.5, -s * 0.1, s * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(s * 0.55, -s * 0.1, s * 0.05, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.species === 1) {
                    // Angelfish (Tall)
                    ctx.beginPath();
                    ctx.moveTo(s, 0);
                    ctx.quadraticCurveTo(0, -s, -s * 0.5, -s);
                    ctx.quadraticCurveTo(-s, 0, -s * 0.5, s);
                    ctx.quadraticCurveTo(0, s, s, 0);
                    ctx.fill();
                    // Stripes
                    ctx.save();
                    ctx.clip();
                    ctx.fillStyle = this.color[1];
                    for(let i=-s; i<s; i+=10) {
                        ctx.fillRect(i, -s, 3, s*2);
                    }
                    ctx.restore();
                } else if (this.species === 2) {
                    // Neon/Barbel (Long)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, s * 1.2, s * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-s, 0);
                    ctx.lineTo(-s * 1.8, -s * 0.4 + tailSwing);
                    ctx.lineTo(-s * 1.8, s * 0.4 + tailSwing);
                    ctx.fill();
                    // Neon stripe
                    ctx.fillStyle = '#0ff';
                    ctx.fillRect(-s * 0.5, -s * 0.1, s, s * 0.2);
                } else {
                    // Puffer (Round)
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                    // Spines
                    ctx.fillStyle = this.color[1];
                    for(let i=0; i<8; i++) {
                        const a = (i/8) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(a)*s*0.7, Math.sin(a)*s*0.7);
                        ctx.lineTo(Math.cos(a)*s*1.1, Math.sin(a)*s*1.1);
                        ctx.stroke();
                    }
                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-s*0.5, 0);
                    ctx.lineTo(-s*1.2, -s*0.3 + tailSwing);
                    ctx.lineTo(-s*1.2, s*0.3 + tailSwing);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // --- Scene Setup ---
        const bubbles = Array(BUBBLE_MAX).fill().map(() => new Bubble());
        const plants = Array(12).fill().map(() => new Plant(rand(0, width)));
        const fish = Array(FISH_COUNT).fill().map(() => new Fish());
        const crab = new Crab();

        // --- Animation Loop ---
        let time = 0;
        let lastTime = 0;

        function animate(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            time = timestamp;

            // 1. Background Gradient (Water depth)
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#006994');
            grad.addColorStop(1, '#001e2b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. Caustics (Back Glass Ripples)
            ctx.save();
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = '#88dfff';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                const waveX = Math.sin(time * 0.001 + i) * 200;
                ctx.ellipse(width/2 + waveX, height/2 + i * 100, 400, 100 + Math.sin(time*0.002)*50, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // 3. Gravel
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(0, height - GRAVEL_HEIGHT, width, GRAVEL_HEIGHT);
            // Gravel texture (dots)
            ctx.fillStyle = '#3e2723';
            for(let i=0; i<width; i+=20) {
                ctx.beginPath();
                ctx.arc(i + Math.sin(i)*10, height - GRAVEL_HEIGHT + rand(5, 20), rand(2, 6), 0, Math.PI*2);
                ctx.fill();
            }

            // 4. Plants (Draw behind fish)
            plants.forEach(p => p.draw(time));

            // 5. Fish Update & Draw
            fish.forEach(f => {
                f.update(fish, time);
                f.draw(time);
            });

            // 6. Crab
            crab.update();
            crab.draw();

            // 7. Bubbles (Draw in front)
            bubbles.forEach(b => {
                b.update();
                b.draw();
            });

            // 8. Vignette
            const vGrad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
            vGrad.addColorStop(0, 'rgba(0,0,0,0)');
            vGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = vGrad;
            ctx.fillRect(0, 0, width, height);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

    </script>
</body>
</html>
