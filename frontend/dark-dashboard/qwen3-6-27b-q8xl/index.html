<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Dashboard</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b1120;--surface:#111827;--card:#1e293b;--card-hover:#253349;
    --border:#2d3a4f;--text:#e2e8f0;--text-dim:#64748b;--text-muted:#475569;
    --accent:#6366f1;--accent-glow:rgba(99,102,241,.25);--accent-light:#818cf8;
    --green:#22c55e;--green-bg:rgba(34,197,94,.12);--red:#ef4444;--red-bg:rgba(239,68,68,.12);
    --sidebar-w:240px;--header-h:64px;--radius:12px;--radius-sm:8px;
  }
  html{font-size:14px}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow-x:hidden}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;padding:20px 0}
  .sidebar-logo{padding:0 24px;margin-bottom:32px;display:flex;align-items:center;gap:10px}
  .sidebar-logo svg{width:32px;height:32px}
  .sidebar-logo span{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent),var(--accent-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .nav-section{margin-bottom:24px}
  .nav-label{padding:0 24px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 24px;color:var(--text-dim);cursor:pointer;transition:all .2s;border-left:3px solid transparent;text-decoration:none}
  .nav-item:hover{background:rgba(99,102,241,.06);color:var(--text)}
  .nav-item.active{color:var(--accent);background:rgba(99,102,241,.08);border-left-color:var(--accent)}
  .nav-item svg{width:20px;height:20px;flex-shrink:0}
  .nav-item span{font-size:.9rem;font-weight:500}
  .sidebar-footer{margin-top:auto;padding:16px 24px;border-top:1px solid var(--border)}
  .sidebar-footer .user-row{display:flex;align-items:center;gap:10px}
  .sidebar-footer .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff}
  .sidebar-footer .user-info{display:flex;flex-direction:column}
  .sidebar-footer .user-name{font-size:.8rem;font-weight:600;color:var(--text)}
  .sidebar-footer .user-role{font-size:.65rem;color:var(--text-muted)}

  /* MAIN */
  .main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}

  /* HEADER */
  .header{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:var(--surface);position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
  .header-left{display:flex;align-items:center;gap:16px}
  .header-left h1{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
  .header-left .breadcrumb{font-size:.8rem;color:var(--text-muted)}
  .search-box{position:relative;width:320px}
  .search-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 16px 8px 40px;color:var(--text);font-size:.85rem;outline:none;transition:border-color .2s}
  .search-box input::placeholder{color:var(--text-muted)}
  .search-box input:focus{border-color:var(--accent)}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
  .header-right{display:flex;align-items:center;gap:16px}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative}
  .icon-btn:hover{background:var(--card);color:var(--text)}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn .badge{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;cursor:pointer}

  /* CONTENT */
  .content{padding:28px 32px;flex:1}

  /* KPI CARDS */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;transition:all .25s;position:relative;overflow:hidden}
  .kpi-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-light));opacity:0;transition:opacity .25s}
  .kpi-card:hover::before{opacity:1}
  .kpi-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .kpi-icon svg{width:20px;height:20px}
  .kpi-icon.purple{background:rgba(99,102,241,.15);color:var(--accent-light)}
  .kpi-icon.green{background:rgba(34,197,94,.15);color:var(--green)}
  .kpi-icon.blue{background:rgba(59,130,246,.15);color:#60a5fa}
  .kpi-icon.orange{background:rgba(249,115,22,.15);color:#f97316}
  .kpi-label{font-size:.78rem;color:var(--text-dim);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .kpi-value{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin-bottom:10px;font-variant-numeric:tabular-nums}
  .kpi-footer{display:flex;align-items:center;gap:8px}
  .delta-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
  .delta-chip.up{background:var(--green-bg);color:var(--green)}
  .delta-chip.down{background:var(--red-bg);color:var(--red)}
  .delta-chip svg{width:12px;height:12px}
  .kpi-period{font-size:.75rem;color:var(--text-muted)}

  /* CHARTS ROW */
  .charts-row{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:28px}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:relative}
  .chart-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .chart-card-header h3{font-size:1rem;font-weight:600}
  .chart-tabs{display:flex;gap:4px;background:var(--bg);border-radius:6px;padding:3px}
  .chart-tab{padding:5px 14px;border-radius:4px;font-size:.75rem;font-weight:500;color:var(--text-dim);cursor:pointer;transition:all .2s;border:none;background:transparent}
  .chart-tab.active{background:var(--accent);color:#fff}
  .chart-tab:hover:not(.active){color:var(--text)}
  .chart-container{position:relative;width:100%}
  .chart-container canvas{width:100%;display:block}

  /* TOOLTIP */
  .chart-tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,.4);min-width:140px}
  .chart-tooltip.visible{opacity:1}
  .tooltip-label{font-size:.7rem;color:var(--text-muted);margin-bottom:4px}
  .tooltip-value{font-size:.95rem;font-weight:700;color:var(--text)}
  .tooltip-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

  /* DONUT LEGEND */
  .donut-legend{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .legend-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:6px;transition:background .2s}
  .legend-item:hover{background:rgba(255,255,255,.03)}
  .legend-left{display:flex;align-items:center;gap:8px}
  .legend-dot{width:10px;height:10px;border-radius:3px}
  .legend-label{font-size:.82rem;color:var(--text-dim)}
  .legend-value{font-size:.85rem;font-weight:600}

  /* RESPONSIVE */
  @media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts-row{grid-template-columns:1fr}}
  @media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.kpi-grid{grid-template-columns:1fr}.search-box{width:200px}}

  /* ANIMATIONS */
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .animate-in{animation:fadeUp .5s ease both}
  .delay-1{animation-delay:.1s}.delay-2{animation-delay:.2s}.delay-3{animation-delay:.3s}.delay-4{animation-delay:.4s}
</style>

<script>
(function(){
  // ── COUNT UP ANIMATION ──
  function animateCountUp(){
    document.querySelectorAll('.kpi-value').forEach(el=>{
      const target=parseFloat(el.dataset.target);
      const prefix=el.dataset.prefix||'';
      const suffix=el.dataset.suffix||'';
      const isFloat=target%1!==0;
      const duration=1800;
      const start=performance.now();
      function tick(now){
        const elapsed=now-start;
        const progress=Math.min(elapsed/duration,1);
        const eased=1-Math.pow(1-progress,3);
        const current=eased*target;
        if(isFloat){
          el.textContent=prefix+current.toFixed(1)+suffix;
        } else {
          el.textContent=prefix+Math.floor(current).toLocaleString()+suffix;
        }
        if(progress<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }
  animateCountUp();

  // ── AREA CHART ──
  const areaCanvas=document.getElementById('areaChart');
  const areaCtx=areaCanvas.getContext('2d');
  const tooltipEl=document.getElementById('tooltip');
  const tooltipLabel=document.getElementById('tooltipLabel');
  const tooltipValue=document.getElementById('tooltipValue');

  const areaData=[
    {label:'Jan',value:4200},{label:'Feb',value:5800},{label:'Mar',value:4900},
    {label:'Apr',value:7200},{label:'May',value:6100},{label:'Jun',value:8400},
    {label:'Jul',value:7800},{label:'Aug',value:9200},{label:'Sep',value:8100},
    {label:'Oct',value:10500},{label:'Nov',value:9800},{label:'Dec',value:12400}
  ];

  let areaAnimProgress=0;
  const areaAnimDuration=2000;
  const areaAnimStart=performance.now();

  function resizeAreaCanvas(){
    const rect=areaCanvas.parentElement.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    areaCanvas.width=rect.width*dpr;
    areaCanvas.height=280*dpr;
    areaCanvas.style.height='280px';
    areaCtx.scale(dpr,dpr);
  }
  resizeAreaCanvas();
  window.addEventListener('resize',()=>{resizeAreaCanvas();drawAreaChart(areaAnimProgress)});

  function drawAreaChart(progress){
    const w=areaCanvas.width/(window.devicePixelRatio||1);
    const h=280;
    areaCtx.clearRect(0,0,w,h);

    const pad={top:20,right:20,bottom:40,left:50};
    const cw=w-pad.left-pad.right;
    const ch=h-pad.top-pad.bottom;

    const maxVal=Math.max(...areaData.map(d=>d.value))*1.15;
    const minVal=0;

    // Grid lines
    areaCtx.strokeStyle='rgba(255,255,255,.04)';
    areaCtx.lineWidth=1;
    const gridLines=5;
    for(let i=0;i<=gridLines;i++){
      const y=pad.top+(ch/gridLines)*i;
      areaCtx.beginPath();
      areaCtx.moveTo(pad.left,y);
      areaCtx.lineTo(w-pad.right,y);
      areaCtx.stroke();

      const val=maxVal-(maxVal/gridLines)*i;
      areaCtx.fillStyle='#475569';
      areaCtx.font='11px -apple-system,sans-serif';
      areaCtx.textAlign='right';
      areaCtx.fillText('$'+Math.round(val).toLocaleString(),pad.left-10,y+4);
    }

    // X labels
    areaCtx.fillStyle='#475569';
    areaCtx.font='11px -apple-system,sans-serif';
    areaCtx.textAlign='center';
    areaData.forEach((d,i)=>{
      const x=pad.left+(cw/(areaData.length-1))*i;
      areaCtx.fillText(d.label,x,h-10);
    });

    // Points
    const points=areaData.map((d,i)=>({
      x:pad.left+(cw/(areaData.length-1))*i,
      y:pad.top+ch-(d.value/maxVal)*ch
    }));

    // Clip to animation progress
    const drawCount=Math.floor(progress*(points.length-1));
    const partialProgress=(progress*(points.length-1))-drawCount;

    if(drawCount===0 && partialProgress===0) return;

    // Build visible points
    const visiblePoints=[points[0]];
    for(let i=1;i<=drawCount&&i<points.length;i++){
      visiblePoints.push(points[i]);
    }
    if(drawCount<points.length-1 && partialProgress>0){
      const next=points[drawCount+1];
      const curr=points[drawCount];
      visiblePoints.push({
        x:curr.x+(next.x-curr.x)*partialProgress,
        y:curr.y+(next.y-curr.y)*partialProgress
      });
    }

    // Gradient fill
    const grad=areaCtx.createLinearGradient(0,pad.top,0,pad.top+ch);
    grad.addColorStop(0,'rgba(99,102,241,.25)');
    grad.addColorStop(1,'rgba(99,102,241,.01)');

    // Area
    areaCtx.beginPath();
    areaCtx.moveTo(visiblePoints[0].x,pad.top+ch);
    areaCtx.lineTo(visiblePoints[0].x,visiblePoints[0].y);

    for(let i=1;i<visiblePoints.length;i++){
      const prev=visiblePoints[i-1];
      const curr=visiblePoints[i];
      const cpx=(prev.x+curr.x)/2;
      areaCtx.bezierCurveTo(cpx,prev.y,cpx,curr.y,curr.x,curr.y);
    }

    areaCtx.lineTo(visiblePoints[visiblePoints.length-1].x,pad.top+ch);
    areaCtx.closePath();
    areaCtx.fillStyle=grad;
    areaCtx.fill();

    // Line
    areaCtx.beginPath();
    areaCtx.moveTo(visiblePoints[0].x,visiblePoints[0].y);
    for(let i=1;i<visiblePoints.length;i++){
      const prev=visiblePoints[i-1];
      const curr=visiblePoints[i];
      const cpx=(prev.x+curr.x)/2;
      areaCtx.bezierCurveTo(cpx,prev.y,cpx,curr.y,curr.x,curr.y);
    }
    areaCtx.strokeStyle='#6366f1';
    areaCtx.lineWidth=2.5;
    areaCtx.stroke();

    // Dot at end
    if(visiblePoints.length>0){
      const last=visiblePoints[visiblePoints.length-1];
      areaCtx.beginPath();
      areaCtx.arc(last.x,last.y,4,0,Math.PI*2);
      areaCtx.fillStyle='#6366f1';
      areaCtx.fill();
      areaCtx.beginPath();
      areaCtx.arc(last.x,last.y,7,0,Math.PI*2);
      areaCtx.strokeStyle='rgba(99,102,241,.3)';
      areaCtx.lineWidth=2;
      areaCtx.stroke();
    }

    // Store for tooltip
    areaCanvas._chartPoints=points;
    areaCanvas._chartData=areaData;
    areaCanvas._pad=pad;
    areaCanvas._w=w;
    areaCanvas._h=h;
  }

  function animateAreaChart(){
    const now=performance.now();
    areaAnimProgress=Math.min((now-areaAnimStart)/areaAnimDuration,1);
    const eased=1-Math.pow(1-areaAnimProgress,3);
    drawAreaChart(eased);
    if(areaAnimProgress<1) requestAnimationFrame(animateAreaChart);
  }
  requestAnimationFrame(animateAreaChart);

  // Area chart tooltip
  areaCanvas.addEventListener('mousemove',function(e){
    const rect=areaCanvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;
    const pts=areaCanvas._chartPoints;
    if(!pts) return;

    let closest=null,minDist=Infinity;
    pts.forEach((p,i)=>{
      const d=Math.abs(p.x-mx);
      if(d<minDist){minDist=d;closest={point:p,index:i}}
    });

    if(closest && minDist<40){
      const d=areaCanvas._chartData[closest.index];
      tooltipLabel.textContent=d.label;
      tooltipValue.innerHTML='<span class="tooltip-dot" style="background:#6366f1"></span>$'+d.value.toLocaleString();
      tooltipEl.classList.add('visible');
      let tx=e.clientX+16,ty=e.clientY-40;
      if(tx+160>window.innerWidth) tx=e.clientX-170;
      if(ty<0) ty=e.clientY+16;
      tooltipEl.style.left=tx+'px';
      tooltipEl.style.top=ty+'px';
    } else {
      tooltipEl.classList.remove('visible');
    }
  });
  areaCanvas.addEventListener('mouseleave',()=>tooltipEl.classList.remove('visible'));

  // ── DONUT CHART ──
  const donutCanvas=document.getElementById('donutChart');
  const donutCtx=donutCanvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  donutCanvas.width=220*dpr;
  donutCanvas.height=220*dpr;
  donutCtx.scale(dpr,dpr);

  const donutData=[
    {label:'Direct',value:35,color:'#6366f1'},
    {label:'Organic',value:28,color:'#818cf8'},
    {label:'Referral',value:18,color:'#a5b4fc'},
    {label:'Social',value:12,color:'#c7d2fe'},
    {label:'Email',value:7,color:'#475569'}
  ];

  const donutTotal=donutData.reduce((s,d)=>s+d.value,0);
  let donutAnimProgress=0;
  const donutAnimDuration=1800;
  const donutAnimStart=performance.now()+400;

  function drawDonut(progress){
    const cx=110,cy=110,r=85,lw=28;
    donutCtx.clearRect(0,0,220,220);

    const totalAngle=Math.PI*2*progress;
    let startAngle=-Math.PI/2;

    donutData.forEach(d=>{
      const sliceAngle=(d.value/donutTotal)*Math.PI*2;
      const drawAngle=Math.min(sliceAngle,totalAngle-(startAngle+Math.PI/2));

      if(drawAngle>0){
        donutCtx.beginPath();
        donutCtx.arc(cx,cy,r,startAngle,startAngle+drawAngle);
        donutCtx.strokeStyle=d.color;
        donutCtx.lineWidth=lw;
        donutCtx.lineCap='butt';
        donutCtx.stroke();
      }
      startAngle+=sliceAngle;
    });

    // Center text
    if(progress>0.5){
      const alpha=Math.min((progress-0.5)*2,1);
      donutCtx.globalAlpha=alpha;
      donutCtx.fillStyle='#e2e8f0';
      donutCtx.font='bold 22px -apple-system,sans-serif';
      donutCtx.textAlign='center';
      donutCtx.textBaseline='middle';
      donutCtx.fillText(donutTotal+'%',cx,cy-6);
      donutCtx.fillStyle='#64748b';
      donutCtx.font='11px -apple-system,sans-serif';
      donutCtx.fillText('Total Traffic',cx,cy+14);
      donutCtx.globalAlpha=1;
    }
  }

  function animateDonut(){
    const now=performance.now();
    donutAnimProgress=Math.min((now-donutAnimStart)/donutAnimDuration,1);
    const eased=1-Math.pow(1-donutAnimProgress,3);
    drawDonut(eased);
    if(donutAnimProgress<1) requestAnimationFrame(animateDonut);
  }
  requestAnimationFrame(animateDonut);

  // Build legend
  const legendEl=document.getElementById('donutLegend');
  donutData.forEach(d=>{
    const item=document.createElement('div');
    item.className='legend-item';
    item.innerHTML=`
      <div class="legend-left">
        <div class="legend-dot" style="background:${d.color}"></div>
        <span class="legend-label">${d.label}</span>
      </div>
      <span class="legend-value">${d.value}%</span>
    `;
    legendEl.appendChild(item);
  });

  // Donut tooltip
  donutCanvas.addEventListener('mousemove',function(e){
    const rect=donutCanvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const my=e.clientY-rect.top;
    const cx=110,cy=110;
    const dist=Math.sqrt((mx-cx)**2+(my-cy)**2);

    if(dist>=55 && dist<=110){
      let angle=Math.atan2(my-cy,mx-cx)+Math.PI/2;
      if(angle<0) angle+=Math.PI*2;
      let cumAngle=0;
      for(const d of donutData){
        const sliceAngle=(d.value/donutTotal)*Math.PI*2;
        if(angle>=cumAngle && angle<cumAngle+sliceAngle){
          tooltipLabel.textContent=d.label;
          tooltipValue.innerHTML=`<span class="tooltip-dot" style="background:${d.color}"></span>${d.value}% of traffic`;
          tooltipEl.classList.add('visible');
          let tx=e.clientX+16,ty=e.clientY-40;
          if(tx+160>window.innerWidth) tx=e.clientX-170;
          if(ty<0) ty=e.clientY+16;
          tooltipEl.style.left=tx+'px';
          tooltipEl.style.top=ty+'px';
          return;
        }
        cumAngle+=sliceAngle;
      }
    }
    tooltipEl.classList.remove('visible');
  });
  donutCanvas.addEventListener('mouseleave',()=>tooltipEl.classList.remove('visible'));

  // Chart tab switching
  document.querySelectorAll('.chart-tab').forEach(tab=>{
    tab.addEventListener('click',function(){
      document.querySelectorAll('.chart-tab').forEach(t=>t.classList.remove('active'));
      this.classList.add('active');
    });
  });
})();
</script>
</body>
</html>
