<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendulum Wave</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-out;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 70%);
        }
    </style>
</head>
<body>

    <div id="ui-layer"></div>
    <canvas id="canvas"></canvas>

<script>
/**
 * Pendulum Wave Simulation
 * 
 * Physics:
 * To create a wave that repeats every 60 seconds (T_cycle),
 * we use the harmonic series.
 * The frequency of the nth pendulum f_n = f_base + n * f_drift.
 * 
 * Let's set the total cycle time to 60 seconds.
 * Let the slowest pendulum (n=0) have a frequency of 2 Hz (just for visual speed).
 * To return to phase at 60s, the frequency difference between adjacent pendulums
 * must be 1/60 Hz.
 * 
 * Length L = g / (2 * PI * f)^2
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const uiLayer = document.getElementById('ui-layer');

// Configuration
const CONFIG = {
    numPendulums: 24,
    cycleTime: 60, // seconds for full reset
    baseFreq: 1.8, // Hz of the slowest pendulum
    gravity: 9.81,
    trailStrength: 0.15, // 0 to 1 (lower is longer trail)
    chartOpacity: 0.02,
    bobRadius: 4,
    colors: {
        bg: '#050505',
        pivot: '#333',
        rod: '#555',
        bob: '#fff',
        chart: 'rgba(0, 255, 200, 0.1)'
    }
};

// State
let width, height;
let pendulums = [];
let time = 0;
let lastTime = 0;
let chartYStart;

class Pendulum {
    constructor(index, total) {
        this.index = index;
        
        // Physics setup
        // Frequency of this pendulum
        // We want them to drift by 1 cycle over the total cycle time
        const freqDiff = 1 / CONFIG.cycleTime; 
        this.frequency = CONFIG.baseFreq + (index * freqDiff);
        
        // Calculate length based on frequency: f = (1/2pi) * sqrt(g/L) => L = g / (4 * pi^2 * f^2)
        this.length = CONFIG.gravity / (4 * Math.PI * Math.PI * this.frequency * this.frequency);
        
        // Scale length to fit screen nicely later
        this.scaledLength = 0; 
        
        this.angle = 0;
        this.angleVelocity = 0;
        this.maxAmplitude = Math.PI / 4; // 45 degrees
        this.phaseOffset = 0; // All start together
        
        // Chart data
        this.xHistory = [];
        this.maxHistory = 200; // How many points to keep
    }

    update(dt) {
        // Simple Harmonic Motion approximation for small angles
        // theta(t) = A * cos(2 * PI * f * t)
        // We use the exact formula for visual smoothness rather than integration
        // to ensure perfect synchronization.
        
        const omega = 2 * Math.PI * this.frequency;
        this.angle = this.maxAmplitude * Math.cos(omega * time + this.phaseOffset);
        
        // Calculate position
        // We need to map the physical length to screen pixels
        // The length calculated is in meters (approx 0.2m to 0.3m)
        // We want the pendulums to take up about 40% of the screen height
        
        const scale = (height * 0.45) / CONFIG.gravity; // Rough scaling factor
        this.scaledLength = this.length * scale * 10; // Multiply by 10 to make it visible
        
        this.x = width / 2 + (this.index - (CONFIG.numPendulums - 1) / 2) * (width / CONFIG.numPendulums);
        
        // Pivot point is at top 15% of screen
        const pivotY = height * 0.15;
        this.y = pivotY + this.scaledLength * Math.cos(this.angle);
        this.x += this.scaledLength * Math.sin(this.angle);
        
        // Update history for chart
        // We sample every few frames to save memory/perf
        if (Math.floor(time * 60) % 2 === 0) {
            this.xHistory.push(this.x);
            if (this.xHistory.length > this.maxHistory) {
                this.xHistory.shift();
            }
        }
    }

    draw(ctx) {
        const pivotY = height * 0.15;
        
        // Draw Rod
        ctx.beginPath();
        ctx.strokeStyle = CONFIG.colors.rod;
        ctx.lineWidth = 1;
        ctx.moveTo(this.x - this.scaledLength * Math.sin(this.angle), pivotY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();

        // Draw Bob
        ctx.beginPath();
        ctx.fillStyle = CONFIG.colors.bob;
        ctx.arc(this.x, this.y, CONFIG.bobRadius, 0, Math.PI * 2);
        ctx.fill();
    }
    
    drawChart(ctx) {
        if (this.xHistory.length < 2) return;

        ctx.beginPath();
        ctx.strokeStyle = CONFIG.colors.chart;
        ctx.lineWidth = 1;
        
        // Draw the trace
        for (let i = 0; i < this.xHistory.length - 1; i++) {
            const x1 = this.xHistory[i];
            const x2 = this.xHistory[i+1];
            // Y position moves down over time
            const y1 = chartYStart + (this.maxHistory - 1 - i) * (height * 0.3 / this.maxHistory);
            const y2 = chartYStart + (this.maxHistory - 1 - (i+1)) * (height * 0.3 / this.maxHistory);
            
            if (i === 0) ctx.moveTo(x1, y1);
            else ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
        }
        ctx.stroke();
    }
}

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Create pendulums
    for (let i = 0; i < CONFIG.numPendulums; i++) {
        pendulums.push(new Pendulum(i, CONFIG.numPendulums));
    }
    
    lastTime = performance.now();
    requestAnimationFrame(loop);
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    
    // Chart starts at 70% down the screen
    chartYStart = height * 0.7;
}

function flashMarker() {
    uiLayer.style.opacity = '1';
    setTimeout(() => {
        uiLayer.style.opacity = '0';
    }, 300);
}

function loop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    
    // Update time
    time += dt;
    
    // Check for reset (modulo cycle time)
    // We use a small threshold to catch the moment it aligns
    const progress = time % CONFIG.cycleTime;
    if (progress < dt) {
        flashMarker();
        // Clear history to avoid visual clutter buildup over infinite time
        pendulums.forEach(p => p.xHistory = []);
    }

    // 1. Draw Background (with trails)
    // Instead of clearing, we draw a semi-transparent rect to create trails
    ctx.fillStyle = `rgba(5, 5, 5, ${CONFIG.trailStrength})`;
    ctx.fillRect(0, 0, width, height);

    // 2. Draw Chart Area Background (subtle grid or background)
    ctx.fillStyle = '#020202';
    ctx.fillRect(0, chartYStart, width, height * 0.35);

    // 3. Update and Draw Pendulums
    pendulums.forEach(p => {
        p.update(dt);
        p.draw(ctx);
        p.drawChart(ctx);
    });
    
    // 4. Draw Pivot Line
    ctx.beginPath();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    const pivotY = height * 0.15;
    ctx.moveTo(0, pivotY);
    ctx.lineTo(width, pivotY);
    ctx.stroke();

    requestAnimationFrame(loop);
}

// Start
init();

</script>
</body>
</html>
