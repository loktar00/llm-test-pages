<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Interference</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cols, rows;
let current, previous, next_buf;
let imageData, pixels;
let barriers;
let time = 0;

const C = 0.28;
const C2 = C * C;
const DAMPING = 0.997;
const SCALE = 2;

function init() {
  W = Math.ceil(window.innerWidth / SCALE);
  H = Math.ceil(window.innerHeight / SCALE);
  cols = W;
  rows = H;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';

  const n = cols * rows;
  current = new Float32Array(n);
  previous = new Float32Array(n);
  next_buf = new Float32Array(n);
  imageData = ctx.createImageData(W, H);
  pixels = imageData.data;

  buildBarriers();
}

function buildBarriers() {
  barriers = new Uint8Array(cols * rows);
  const bx1 = Math.floor(cols * 0.30);
  const bx2 = Math.floor(cols * 0.60);
  const slitH = Math.floor(rows * 0.12);
  const slit1Top = Math.floor(rows * 0.42);
  const slit2Top = Math.floor(rows * 0.48);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let isBarrier = false;
      if (x === bx1) {
        const inSlit = y >= slit1Top && y < slit1Top + slitH;
        if (!inSlit) isBarrier = true;
      }
      if (x === bx2) {
        const inSlit = y >= slit2Top && y < slit2Top + slitH;
        if (!inSlit) isBarrier = true;
      }
      barriers[y * cols + x] = isBarrier ? 1 : 0;
    }
  }
}

const sources = [
  { ox: 0.12, oy: 0.35, ax: 0.04, ay: 0.06, fx: 0.15, fy: 0.2, freq: 0.08, amp: 1.0, phase: 0 },
  { ox: 0.15, oy: 0.65, ax: 0.05, ay: 0.03, fx: 0.18, fy: 0.15, freq: 0.10, amp: 0.8, phase: 1.5 },
  { ox: 0.08, oy: 0.50, ax: 0.03, ay: 0.05, fx: 0.12, fy: 0.22, freq: 0.06, amp: 0.7, phase: 3.0 },
  { ox: 0.45, oy: 0.20, ax: 0.06, ay: 0.04, fx: 0.20, fy: 0.10, freq: 0.07, amp: 0.6, phase: 0.5 },
  { ox: 0.48, oy: 0.80, ax: 0.04, ay: 0.06, fx: 0.14, fy: 0.18, freq: 0.09, amp: 0.9, phase: 2.0 },
];

function injectSources(t) {
  for (let s = 0; s < sources.length; s++) {
    const src = sources[s];
    const sx = (src.ox + src.ax * Math.sin(t * src.fx)) * cols;
    const sy = (src.oy + src.ay * Math.sin(t * src.fy)) * rows;
    const freq = src.freq + 0.015 * Math.sin(t * 0.05 + s);
    const amp = src.amp * (0.8 + 0.2 * Math.sin(t * 0.03 + s * 2));
    const val = amp * Math.sin(t * freq * 60);

    const r = 3;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const dist2 = dx * dx + dy * dy;
        if (dist2 > r * r) continue;
        const px = Math.floor(sx + dx);
        const py = Math.floor(sy + dy);
        if (px < 1 || px >= cols - 1 || py < 1 || py >= rows - 1) continue;
        const falloff = 1.0 - Math.sqrt(dist2) / (r + 1);
        current[py * cols + px] += val * falloff * falloff;
      }
    }
  }
}

function simulate() {
  time += 1;
  injectSources(time);

  const b = barriers;
  const c = current;
  const p = previous;
  const n = next_buf;

  for (let y = 1; y < rows - 1; y++) {
    const rowOff = y * cols;
    const rowUp = (y - 1) * cols;
    const rowDn = (y + 1) * cols;
    for (let x = 1; x < cols - 1; x++) {
      const idx = rowOff + x;
      if (b[idx]) {
        n[idx] = 0;
        continue;
      }
      const lap = c[idx - 1] + c[idx + 1] + c[rowUp + x] + c[rowDn + x] - 4.0 * c[idx];
      n[idx] = (2.0 * c[idx] - p[idx] + C2 * lap) * DAMPING;
    }
  }

  const tmp = previous;
  previous = current;
  current = n;
  next_buf = tmp;
}

function render() {
  const c = current;
  const d = pixels;
  let maxVal = 0;
  for (let i = 0; i < c.length; i++) {
    if (c[i] > maxVal) maxVal = c[i];
  }
  const invMax = maxVal > 0.001 ? 1.0 / maxVal : 1.0;

  for (let y = 0; y < rows; y++) {
    const rowOff = y * cols;
    const rowUp = y > 0 ? (y - 1) * cols : rowOff;
    const rowDn = y < rows - 1 ? (y + 1) * cols : rowOff;
    for (let x = 0; x < cols; x++) {
      const idx = rowOff + x;
      const pi = idx * 4;

      if (barriers[idx]) {
        d[pi] = 10;
        d[pi + 1] = 15;
        d[pi + 2] = 30;
        d[pi + 3] = 255;
        continue;
      }

      let v = c[idx] * invMax;
      v = v * 0.5 + 0.5;

      const gx = c[idx + 1] - c[idx - 1];
      const gy = c[rowDn + x] - c[rowUp + x];
      const gradMag = Math.abs(gx) + Math.abs(gy);
      const sparkle = Math.pow(Math.max(0, gradMag * invMax * 3), 2) * 0.6;

      let r, g, b;
      if (v < 0.5) {
        const t = v * 2.0;
        r = t * 8;
        g = t * 20 + t * t * 15;
        b = 30 + t * 120 + t * t * 60;
      } else {
        const t = (v - 0.5) * 2.0;
        r = t * t * 60 + sparkle * 200;
        g = 20 + t * 100 + t * t * 80 + sparkle * 150;
        b = 150 + t * 80 + sparkle * 100;
      }

      if (sparkle > 0.3) {
        const sp = (sparkle - 0.3) * 3;
        r = r + (255 - r) * sp;
        g = g + (255 - g) * sp;
        b = b + (255 - b) * sp;
      }

      d[pi] = Math.max(0, Math.min(255, r | 0));
      d[pi + 1] = Math.max(0, Math.min(255, g | 0));
      d[pi + 2] = Math.max(0, Math.min(255, b | 0));
      d[pi + 3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

function loop() {
  simulate();
  render();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  init();
});

init();
loop();
</script>
</body>
</html>
