<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verlet Battle Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: sans-serif;
            color: #eee;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h3>VERLET BATTLE SIM</h3>
        <p>Bridge Integrity: <span id="integrity">100%</span></p>
    </div>
    <canvas id="simCanvas"></canvas>
    <script>
        /**
         * VERLET BATTLE SIMULATION
         * 
         * Core concepts:
         * 1. Verlet Integration: Position is stored (x, y) and previous position (px, py). Velocity is implicit.
         * 2. Constraints: Distance rules between points (e.g., rope segments, rigid bodies).
         * 3. Forces: Applied by manipulating position/previous position (e.g., gravity, wind, impulses).
         */

        // --- CONFIGURATION ---
        const CFG = {
            gravity: 0.5,
            friction: 0.99,
            bounce: 0.3,
            iterations: 10, // Physics solver iterations
            bridgePoints: 20,
            soldierSize: 10,
            maxSoldiers: 60,
            maxArrows: 100,
            colors: {
                p1: '#3494d6', // Blue
                p2: '#d63434', // Red
                bridge: '#8b5a2b',
                rope: '#555',
                arrow: '#eee',
                skin: '#e0ac80'
            }
        };

        // --- UTILS ---
        const rand = (min, max) => Math.random() * (max - min) + min;
        const dist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        const angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

        // --- ENGINE: VERLET & CONSTRAINTS ---

        class Point {
            constructor(x, y, mass = 1) {
                this.x = x;
                this.y = y;
                this.oldx = x;
                this.oldy = y;
                this.mass = mass;
                this.pinned = false;
                this.radius = 1;
            }

            update() {
                if (this.pinned) return;
                
                const vx = (this.x - this.oldx) * CFG.friction;
                const vy = (this.y - this.oldy) * CFG.friction;

                this.oldx = this.x;
                this.oldy = this.y;

                this.x += vx;
                this.y += vy;
                this.y += CFG.gravity * this.mass;
            }

            // Apply impulse by adjusting current position
            applyForce(fx, fy) {
                if (this.pinned) return;
                this.x += fx / this.mass;
                this.y += fy / this.mass;
            }

            // For collisions, we temporarily move the point
            collide(walls) {
                if (this.pinned) return;
                for (let wall of walls) {
                    if (this.x < wall.x) { this.x = wall.x; this.oldx = this.x + (this.x - this.oldx) * CFG.bounce; }
                    if (this.x > wall.x + wall.w) { this.x = wall.x + wall.w; this.oldx = this.x + (this.x - this.oldx) * CFG.bounce; }
                    if (this.y < wall.y) { this.y = wall.y; this.oldy = this.y + (this.y - this.oldy) * CFG.bounce; }
                    if (this.y > wall.y + wall.h) { this.y = wall.y + wall.h; this.oldy = this.y + (this.y - this.oldy) * CFG.bounce; }
                }
            }
        }

        class Stick {
            constructor(p1, p2, length = null, stiffness = 1.0, breakable = false) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = length || dist(p1.x, p1.y, p2.x, p2.y);
                this.stiffness = stiffness;
                this.visible = true;
                this.color = '#fff';
                this.thickness = 1;
                this.life = 1.0; // For breaking
                this.breakable = breakable;
            }

            update() {
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance === 0) return;

                const difference = (this.length - distance) / distance;
                const offsetX = dx * difference * 0.5 * this.stiffness;
                const offsetY = dy * difference * 0.5 * this.stiffness;

                if (!this.p1.pinned) {
                    this.p1.x -= offsetX;
                    this.p1.y -= offsetY;
                }
                if (!this.p2.pinned) {
                    this.p2.x += offsetX;
                    this.p2.y += offsetY;
                }

                // Visual break logic
                if (this.breakable && distance > this.length * 1.1) {
                    this.life -= 0.1;
                    this.stiffness -= 0.1;
                }
            }

            draw(ctx) {
                if (this.life <= 0 || !this.visible) return;
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.thickness;
                ctx.beginPath();
                ctx.moveTo(this.p1.x, this.p1.y);
                ctx.lineTo(this.p2.x, this.p2.y);
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- SCENE: GROUND & BRIDGE ---

        class Bridge {
            constructor(x1, y1, x2, y2) {
                this.points = [];
                this.sticks = [];
                this.totalHealth = 100;
                
                const dx = (x2 - x1) / CFG.bridgePoints;
                const dy = (y2 - y1) / CFG.bridgePoints;

                for (let i = 0; i <= CFG.bridgePoints; i++) {
                    const p = new Point(x1 + dx * i, y1 + dy * i);
                    p.mass = 1; // Bridge points are heavy-ish
                    this.points.push(p);
                }

                // Horizontal planks
                for (let i = 0; i < this.points.length - 1; i++) {
                    this.addStick(i, i + 1, 1.0, true);
                }
                
                // Vertical supports (optional visual)
                // for (let i = 0; i < this.points.length; i++) {
                //     if (i % 3 === 0) this.addStick(i, i + 2, 0.8);
                // }

                // Anchor points
                this.points[0].pinned = true;
                this.points[this.points.length - 1].pinned = true;
            }

            addStick(i, j, stiffness = 1.0, breakable = false) {
                this.sticks.push(new Stick(this.points[i], this.points[j], null, stiffness, breakable));
            }

            damage(amount) {
                // Damage random sticks
                const count = Math.floor(amount / 5);
                for (let i = 0; i < count; i++) {
                    const s = this.sticks[Math.floor(Math.random() * this.sticks.length)];
                    if (s && !s.p1.pinned && !s.p2.pinned) {
                        s.p1.applyForce(rand(-2, 2), -2); // Shake
                        s.p2.applyForce(rand(-2, 2), -2);
                    }
                }
                this.totalHealth -= amount;
                if (this.totalHealth < 0) this.totalHealth = 0;
                document.getElementById('integrity').innerText = Math.floor(this.totalHealth) + '%';
            }

            update() {
                this.points.forEach(p => p.update());
                // Solve constraints multiple times for stability
                for (let i = 0; i < 4; i++) {
                    this.sticks.forEach(s => s.update());
                }
                this.checkCollisions();
            }

            checkCollisions() {
                // Simple collision with environment
                // Floor is generally below y=400
                const floorY = 450;
                this.points.forEach(p => {
                    if (p.y > floorY) {
                        p.y = floorY;
                        p.oldy = p.y; // Stop bouncing
                    }
                });
            }

            draw(ctx, camX, camY) {
                // Draw Planks
                ctx.fillStyle = CFG.colors.bridge;
                for (let i = 0; i < this.points.length - 1; i++) {
                    const p1 = this.points[i];
                    const p2 = this.points[i+1];
                    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                    
                    ctx.save();
                    ctx.translate(p1.x - camX, p1.y - camY);
                    ctx.rotate(angle);
                    const len = dist(p1.x, p1.y, p2.x, p2.y);
                    ctx.fillRect(0, -5, len, 10);
                    ctx.restore();
                }
                
                // Draw Ropes/Constraints (visual only)
                ctx.strokeStyle = '#553311';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < this.points.length; i++) {
                    const p = this.points[i];
                    if (i===0) ctx.moveTo(p.x - camX, p.y - camY);
                    else ctx.lineTo(p.x - camX, p.y - camY);
                }
                ctx.stroke();
            }
        }

        // --- ENTITY: SOLDIER ---

        class Soldier {
            constructor(x, y, team) {
                this.team = team; // 1 or 2
                this.state = 'walk'; // walk, fight, dead
                this.health = 100;
                this.maxHealth = 100;
                this.dead = false;
                this.respawnTimer = 0;
                
                // Verlet Body
                this.head = new Point(x, y - 20);
                this.body = new Point(x, y - 10);
                this.footL = new Point(x - 5, y);
                this.footR = new Point(x + 5, y);
                
                // Constraints
                const bodyPts = [this.head, this.body, this.footL, this.footR];
                
                // Head to Body
                this.sticks = [];
                this.sticks.push(new Stick(this.head, this.body, 10, 1.0));
                
                // Body to Feet
                this.sticks.push(new Stick(this.body, this.footL, 10, 1.0));
                this.sticks.push(new Stick(this.body, this.footR, 10, 1.0));
                
                // Feet width constraint
                this.sticks.push(new Stick(this.footL, this.footR, 10, 1.0));

                // Combat
                this.attackCooldown = 0;
                this.attackType = 'sword';
                this.facing = team === 1 ? 1 : -1;
            }

            update(walls, bridge, enemies) {
                if (this.dead) {
                    this.respawnTimer++;
                    return;
                }

                // Apply Physics to Body
                const pts = [this.head, this.body, this.footL, this.footR];
                pts.forEach(p => p.update());
                pts.forEach(p => p.collide(walls));

                // Solve Body Constraints
                for (let i = 0; i < 2; i++) {
                    this.sticks.forEach(s => s.update());
                }

                // AI Logic
                this.ai(bridge, enemies);

                // Cooldowns
                if (this.attackCooldown > 0) this.attackCooldown--;

                // Death check
                if (this.health <= 0) {
                    this.die();
                }
            }

            ai(bridge, enemies) {
                // 1. Collision with Bridge
                // Find nearest bridge point to feet
                let nearestBridge = null;
                let minDist = 9999;
                bridge.points.forEach(p => {
                    const d = dist(this.footL.x, this.footL.y, p.x, p.y);
                    if (d < minDist) { minDist = d; nearestBridge = p; }
                });

                if (nearestBridge) {
                    // Push feet towards bridge point if falling through or far
                    if (Math.abs(this.footL.x - nearestBridge.x) < 10 && this.footL.y < nearestBridge.y) {
                        this.footL.x += (nearestBridge.x - this.footL.x) * 0.1;
                        this.footL.y = nearestBridge.y;
                        this.footL.oldy = this.footL.y;
                    }
                    if (Math.abs(this.footR.x - nearestBridge.x) < 10 && this.footR.y < nearestBridge.y) {
                        this.footR.x += (nearestBridge.x - this.footR.x) * 0.1;
                        this.footR.y = nearestBridge.y;
                        this.footR.oldy = this.footR.y;
                    }
                }

                // 2. Interaction with Enemies
                let target = null;
                let minE = 9999;
                
                enemies.forEach(e => {
                    if (e.dead) return;
                    const d = dist(this.body.x, this.body.y, e.body.x, e.body.y);
                    if (d < minE) { minE = d; target = e; }
                });

                // Scrum / Push Logic
                if (target) {
                    // Push away from target to prevent overlapping
                    const angle = Math.atan2(target.body.y - this.body.y, target.body.x - this.body.x);
                    const pushForce = 0.5;
                    this.body.x -= Math.cos(angle) * pushForce;
                    this.body.y -= Math.sin(angle) * pushForce;
                    
                    // Attack
                    if (minE < 40 && this.attackCooldown <= 0) {
                        this.attack(target);
                    }
                } else {
                    // Move forward
                    const speed = 1.5;
                    this.body.x += this.facing * speed;
                    this.footL.x += this.facing * speed;
                    this.footR.x += this.facing * speed;
                    this.head.x += this.facing * speed;
                }
            }

            attack(target) {
                this.attackCooldown = 40;
                
                // Animation snap
                this.head.x += this.facing * 10;
                setTimeout(() => { this.head.x -= this.facing * 10; }, 100);

                if (this.attackType === 'sword') {
                    // Small knockback, damage
                    target.takeDamage(15, this.facing * 2, -2);
                    // Visual shake
                    shake(2);
                } else {
                    // Shield bash: Less damage, more knockback
                    target.takeDamage(5, this.facing * 8, -5);
                    shake(5);
                }
            }

            takeDamage(amount, fx, fy) {
                this.health -= amount;
                // Verlet Impulse
                this.body.applyForce(fx, fy);
                this.head.applyForce(fx, fy);
                
                // Blood effect
                createParticles(this.body.x, this.body.y, 5, '#d63434');
            }

            die() {
                this.dead = true;
                this.state = 'dead';
                // Collapse body
                this.body.y += 10;
                this.head.y += 20;
                createParticles(this.body.x, this.body.y, 10, '#555');
            }

            draw(ctx) {
                if (this.dead && this.respawnTimer > 100) return; // Don't draw if respawned

                ctx.fillStyle = this.team === 1 ? CFG.colors.p1 : CFG.colors.p2;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;

                // Head
                ctx.beginPath();
                ctx.arc(this.head.x, this.head.y, 6, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();

                // Body line
                ctx.beginPath();
                ctx.moveTo(this.body.x, this.body.y);
                ctx.lineTo(this.footL.x, this.footL.y);
                ctx.moveTo(this.body.x, this.body.y);
                ctx.lineTo(this.footR.x, this.footR.y);
                ctx.stroke();

                // Shield / Weapon
                ctx.save();
                ctx.translate(this.body.x, this.body.y);
                // Rotate based on facing
                const rot = this.facing * 0.5; 
                ctx.rotate(rot);
                
                // Weapon
                ctx.fillStyle = '#888';
                ctx.fillRect(5, -5, 15, 2); // Sword blade
                
                // Shield
                ctx.fillStyle = this.team === 1 ? '#225' : '#522';
                ctx.beginPath();
                ctx.arc(-5, 0, 8, 0, Math.PI*2);
                ctx.fill();
                ctx.stroke();
                
                ctx.restore();
            }
        }

        // --- ENTITY: ARROW ---

        class Arrow {
            constructor(x, y, tx, ty) {
                this.x = x;
                this.y = y;
                this.oldx = x;
                this.oldy = y;
                this.active = true;
                this.length = 15;
                this.life = 200;
                this.hit = false;

                // Calculate initial velocity
                const angle = Math.atan2(ty - y, tx - x);
                const speed = 15;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                
                this.oldx -= vx;
                this.oldy -= vy;
            }

            update() {
                if (!this.active) return;

                const vx = (this.x - this.oldx);
                const vy = (this.y - this.oldy);

                this.oldx = this.x;
                this.oldy = this.y;

                // Gravity
                this.y += 0.25; // Arrow gravity
                this.x += vx;
                this.y += vy;

                this.life--;
                if (this.life <= 0) this.active = false;

                // Rotation for drawing
                this.angle = Math.atan2(vy, vx);
            }

            draw(ctx) {
                if (!this.active) return;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-this.length, 0);
                ctx.lineTo(this.length, 0);
                ctx.stroke();
                // Tip
                ctx.fillStyle = '#aaa';
                ctx.beginPath();
                ctx.moveTo(this.length, 0);
                ctx.lineTo(this.length - 5, -3);
                ctx.lineTo(this.length - 5, 3);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- MAIN SIMULATION ---

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let camX = 0, camY = 0;
        let shakeTimer = 0;

        // World Objects
        let bridge;
        let soldiers = [];
        let arrows = [];
        let particles = [];
        
        // Teams
        const team1 = { soldiers: [], archers: [], count: 0 };
        const team2 = { soldiers: [], archers: [], count: 0 };

        // Walls for collision
        const walls = [
            { x: -100, y: 0, w: 300, h: 1000 }, // Left cliff
            { x: 1100, y: 0, w: 300, h: 1000 }  // Right cliff
        ];

        function init() {
            resize();
            window.addEventListener('resize', resize);

            // Create Bridge
            bridge
