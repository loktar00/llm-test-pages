<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        :root {
            --bg: #0b0e14;
            --accent: #64ffda;
            --text: #ccd2e2;
            --glow: rgba(100, 255, 218, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at 50% 40%, #18203a 0%, var(--bg) 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
        }

        /* --- Star Field --- */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 4px rgba(255,255,255,0.8); }
        }

        /* --- Main Container --- */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* --- Typography & The Moon --- */
        .headline {
            font-size: 15rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
            color: #e6f1ff;
            text-shadow: 0 0 20px var(--glow), 0 0 40px rgba(100, 255, 218, 0.3);
            animation: breathe 4s ease-in-out infinite;
            position: relative;
            display: inline-block;
            user-select: none;
        }

        /* The Zero (Moon) */
        .moon-zero {
            display: inline-block;
            width: 1.1em;
            height: 1.1em;
            background: #e6f1ff;
            border-radius: 50%;
            position: relative;
            margin: 0 0.05em;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1), 0 0 30px var(--glow);
            vertical-align: middle;
            overflow: visible;
        }

        /* Moon Craters (Pure CSS) */
        .moon-zero::before {
            content: '';
            position: absolute;
            top: 25%;
            left: 20%;
            width: 15%;
            height: 15%;
            background: rgba(0,0,0,0.08);
            border-radius: 50%;
            box-shadow: 12px 15px 0 3px rgba(0,0,0,0.05), 
                        -5px 20px 0 2px rgba(0,0,0,0.06);
        }

        /* The One */
        .digit-one {
            display: inline-block;
            margin: 0 0.05em;
            font-family: monospace; /* Mono to make it look like a '1' */
            font-weight: 700;
        }

        /* The Satellite Orbit System */
        .orbit-system {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160%; /* Size of the orbit */
            height: 160%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .satellite {
            position: absolute;
            top: 0;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #ffbd2e;
            border-radius: 50%;
            transform: translate(-50%, 0);
            box-shadow: 0 0 10px #ffbd2e;
            animation: orbit 3s linear infinite;
        }

        /* Satellite Trail (Pure CSS) */
        .satellite::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 100%;
            width: 20px;
            height: 2px;
            background: linear-gradient(to left, #ffbd2e, transparent);
            transform: translateY(-50%);
        }

        @keyframes orbit {
            from { transform: translate(-50%, 0) rotate(0deg) translateX(var(--orbit-r, 80%)) rotate(0deg); }
            to { transform: translate(-50%, 0) rotate(360deg) translateX(var(--orbit-r, 80%)) rotate(-360deg); }
        }

        /* --- Text & Button --- */
        .message {
            font-size: 1.25rem;
            font-weight: 300;
            color: #8892b0;
            margin-top: 1rem;
            letter-spacing: 0.02em;
            opacity: 0.9;
        }

        .home-btn {
            margin-top: 2rem;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            outline: none;
        }

        .home-btn:hover {
            background: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 20px var(--glow);
            transform: translateY(-2px);
        }

        .home-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .home-btn:hover::before {
            left: 100%;
        }

        /* --- Animations --- */
        @keyframes breathe {
            0%, 100% { text-shadow: 0 0 20px var(--glow), 0 0 40px rgba(100, 255, 218, 0.2); transform: scale(1); }
            50% { text-shadow: 0 0 35px var(--glow), 0 0 60px rgba(100, 255, 218, 0.5); transform: scale(1.02); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .headline { font-size: 10rem; }
            .moon-zero { width: 1.2em; height: 1.2em; }
            .message { font-size: 1rem; padding: 0 1rem; }
        }
    </style>
</head>
<body>

    <div class="stars" id="starField"></div>

    <div class="container">
        <h1 class="headline">
            4
            <span class="moon-zero">
                <div class="orbit-system">
                    <div class="satellite"></div>
                </div>
            </span>
            <span class="digit-one">4</span>
        </h1>
        
        <p class="message">We seem to have be strayed into a deep space.</p>
        
        <button class="home-btn" onclick="window.location.href='/'">Take Me Home</button>
    </div>

    <script>
        // Generate stars for the deep space look
        const starContainer = document.getElementById('starField');
        const starCount = 150;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Random position
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            
            // Random size
            const size = Math.random() * 2 + 1;
            
            // Random animation duration and delay
            const duration = Math.random() * 3 + 2; // 2s to 5s
            const delay = Math.random() * 5;

            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--duration', `${duration}s`);
            star.style.setProperty('--delay', `${delay}s`);

            starContainer.appendChild(star);
        }
    </script>
</body>
</html>
