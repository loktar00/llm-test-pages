<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weather Widget</title>
<style>
  :root {
    --bg-day: linear-gradient(160deg, #a3e0f1 0%, #f0f8ff 100%);
    --bg-night: linear-gradient(160deg, #0f0c29 0%, #1a1a2e 100%);
    --text-light: #ffffffdd;
    --text-dark: #222222ee;
    --card-bg: rgba(255, 255, 255, 0.12);
    --accent: #f7b731;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    background: var(--bg-day);
    transition: background 2s ease;
    overflow-x: hidden;
    padding-top: 40px;
  }

  body.night {
    background: var(--bg-night);
  }

  .weather-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    width: 92%;
    max-width: 420px;
    padding: 28px 24px 32px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    color: var(--text-light);
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .location {
    font-size: 1.3rem;
    font-weight: 600;
  }

  .toggle-temp {
    background: #3335;
    border: none;
    outline: none;
    color: var(--text-light);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s ease;
  }

  .toggle-temp:hover {
    background: #4447;
  }

  .main-temp {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .temp-value {
    font-size: 4rem;
    font-weight: 700;
    line-height: 1;
  }

  .condition {
    font-size: 1.2rem;
    font-weight: 400;
    opacity: 0.9;
  }

  .scene {
    position: relative;
    height: 130px;
    margin: 10px 0 20px;
  }

  .sun {
    position: absolute;
    top: 10px;
    left: 20px;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, #ffdd44, #ffa726);
    border-radius: 50%;
    z-index: 1;
    animation: pulse 4s infinite ease-in-out;
    box-shadow: 0 0 20px #ffcc33aa;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .rays {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .ray {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 26px;
    background: #ffd444dd;
    border-radius: 3px;
    transform-origin: center bottom;
  }

  .cloud {
    position: absolute;
    top: 40px;
    left: 35%;
    width: 100px;
    height: 40px;
    background: white;
    border-radius: 50%;
    box-shadow: 15px 0 0 0 white, -15px 0 0 0 white;
    z-index: 2;
    animation: drift 10s infinite linear;
  }

  .cloud::before {
    content: "";
    position: absolute;
    top: -15px;
    left: 8px;
    width: 24px;
    height: 24px;
    background: inherit;
    border-radius: 50%;
    box-shadow: 12px 0 0 0 white;
  }

  .cloud.alt {
    top: 70px;
    left: 20%;
    width: 60px;
    height: 24px;
    animation-duration: 14s;
  }

  @keyframes drift {
    0% { transform: translateX(-20px) scale(1); }
    50% { transform: translateX(calc(100vw + 20px)) scale(1); }
    100% { transform: translateX(-20px) scale(1); }
  }

  .hourly-strip {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 12px;
    padding-bottom: 8px;
    margin-bottom: 20px;
  }

  .hourly-strip::-webkit-scrollbar {
    height: 4px;
  }

  .hourly-strip::-webkit-scrollbar-thumb {
    background: #4445;
    border-radius: 2px;
  }

  .hour-item {
    flex: 0 0 auto;
    width: 64px;
    scroll-snap-align: start;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px 6px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hour-time {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-bottom: 6px;
  }

  .hour-icon {
    width: 28px;
    height: 28px;
    margin-bottom: 8px;
  }

  .hour-temp {
    font-size: 1.1rem;
    font-weight: 600;
  }

  .day-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .day-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 1rem;
  }

  .day-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .mini-icon {
    width: 24px;
    height: 24px;
  }

  .day-name {
    text-transform: capitalize;
    font-weight: 500;
    min-width: 70px;
  }

  .day-cond {
    font-size: 0.85rem;
    opacity: 0.7;
  }

  .day-temp {
    font-weight: 600;
  }

  /* Icons */
  .icon-rain {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .icon-rain::before,
  .icon-rain::after {
    content: "";
    position: absolute;
    left: 4px;
    top: -2px;
    width: 2px;
    height: 10px;
    background: #90caff;
    animation: fall 1.4s linear infinite;
  }

  .icon-rain::after {
    left: 10px;
    animation-delay: 0.2s;
  }

  @keyframes fall {
    0% { transform: translateY(0); opacity: 1; }
    90% { opacity: 0.3; }
    100% { transform: translateY(14px); opacity: 0; }
  }

  .icon-sunny {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .icon-sunny::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 10px;
    width: 6px;
    height: 6px;
    background: #ffd54f;
    border-radius: 50%;
    box-shadow: 6px 0 0 #ffd54f, -6px 0 0 #ffd54f, 0 6px 0 #ffd54f, 0 -6px 0 #ffd54f,
                4px 4px 0 #ffd54f, -4px -4px 0 #ffd54f, -4px 4px 0 #ffd54f, 4px -4px 0 #ffd54f;
  }

  .rays-ray {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 1px;
    height: 6px;
    background: #ffd54f;
    transform-origin: bottom center;
  }

  .icon-sunny-ray {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 1px;
    height: 6px;
    background: #ffd54f;
    transform-origin: bottom center;
  }

  /* Toggle animation */
  .rolling {
    display: inline-block;
    transition: transform 0.5s ease;
  }

  .rolling.up {
    transform: translateY(-1.4em);
  }

  .rolling.down {
    transform: translateY(0);
  }
</style>
</head>
<body>
  <div class="weather-card">
    <div class="top-row">
      <div class="location">📍 San Francisco</div>
      <button class="toggle-temp" id="toggleCtoF">°C / °F</button>
    </div>

    <div class="main-temp">
      <div class="temp-value" id="currentTemp">18°</div>
      <div class="condition" id="condition">Partly Cloudy</div>
    </div>

    <div class="scene">
      <div class="sun"></div>
      <div class="rays" id="raysContainer"></div>
      <div class="cloud"></div>
      <div class="cloud alt"></div>
    </div>

    <div class="hourly-strip" id="hourlyStrip">
      <!-- JS generated -->
    </div>

    <div class="day-list" id="dayList">
      <!-- JS generated -->
    </div>
  </div>

<script>
  // --- Fake clock ---
  function updateDayNight() {
    const h = new Date().getHours();
    document.body.classList.toggle("night", h >= 19 || h < 6);
  }
  setInterval(updateDayNight, 60000);
  updateDayNight();

  // --- Sun rays ---
  const raysContainer = document.getElementById("raysContainer");
  for (let i = 0; i < 12; i++) {
    const ray = document.createElement("div");
    ray.className = "ray";
    ray.style.transform = `rotate(${i * 30}deg)`;
    raysContainer.appendChild(ray);
  }

  // --- Weather data ---
  const hourlyData = [
    { time: "9 AM", tempC: 17, cond: "partly-cloudy" },
    { time: "10 AM", tempC: 19, cond: "sunny" },
    { time: "11 AM", tempC: 21, cond: "sunny" },
    { time: "12 PM", tempC: 23, cond: "sunny" },
    { time: "1 PM", tempC: 25, cond: "partly-cloudy" },
    { time: "2 PM", tempC: 26, cond: "sunny" },
    { time: "3 PM", tempC: 27, cond: "rain" },
    { time: "4 PM", tempC: 26, cond: "rain" },
  ];

  const dailyData = [
    { day: "Mon", cond: "rain", hi: 28, lo: 18 },
    { day: "Tue", cond: "sunny", hi: 30, lo: 20 },
    { day: "Wed", cond: "partly-cloudy", hi: 27, lo: 19 },
    { day: "Thu", cond: "rain", hi: 25, lo: 17 },
    { day: "Fri", cond: "sunny", hi: 31, lo: 21 },
  ];

  // --- Render hourly ---
  const hourlyStrip = document.getElementById("hourlyStrip");
  function renderHourly(unit = "C") {
    hourlyStrip.innerHTML = "";
    hourlyData.forEach(h => {
      const item = document.createElement("div");
      item.className = "hour-item";

      const time = document.createElement("div");
      time.className = "hour-time";
      time.textContent = h.time;

      const icon = document.createElement("div");
      icon.className = "hour-icon";
      icon.innerHTML = getMiniIcon(h.cond);

      const temp = document.createElement("div");
      temp.className = "hour-temp";
      temp.textContent = unit === "C" ? `${h.tempC}°` : `${Math.round(h.tempC * 9/5 + 32)}°`;

      item.append(time, icon, temp);
      hourlyStrip.appendChild(item);
    });
  }

  // --- Render daily ---
  const dayList = document.getElementById("dayList");
  function renderDaily(unit = "C") {
    dayList.innerHTML = "";
    dailyData.forEach(d => {
      const item = document.createElement("div");
      item.className = "day-item";

      const left = document.createElement("div");
      left.className = "day-left";

      const icon = document.createElement("div");
      icon.className = "mini-icon";
      icon.innerHTML = getMiniIcon(d.cond);

      const name = document.createElement("div");
      name.className = "day-name";
      name.textContent = d.day;

      const condText = document.createElement("div");
      condText.className = "day-cond";
      condText.textContent = condLabel[d.cond] || "";

      left.append(icon, name);
      const tempEl = document.createElement("div");
      tempEl.className = "day-temp";
      if (unit === "C") {
        tempEl.textContent = `${d.hi}° / ${d.lo}°`;
      } else {
        tempEl.textContent = `${Math.round(d.hi * 9/5 + 32)}° / ${Math.round(d.lo * 9/5 + 32)}°`;
      }

      item.append(left, condText, tempEl);
      dayList.appendChild(item);
    });
  }

  // --- Mini icon templates ---
  const condLabel = {
    "sunny": "Sunny",
    "rain": "Rain",
    "partly-cloudy": "Partly Cloudy"
  };

  function getMiniIcon(cond) {
    if (cond === "sunny") {
      return `<div style="position:relative;width:100%;height:100%"><div style="position:absolute;top:50%;left:50%;width:6px;height:6px;background:#ffd54f;border-radius:50%;transform:translate(-50%,-50%);box-shadow:6px 0 0 #ffd54f,-6px 0 0 #ffd54f,0 6px 0 #ffd54f,0 -6px 0 #ffd54f"></div></div>`;
    }
    if (cond === "rain") {
      return `<div class="icon-rain" style="width:100%;height:100%"></div>`;
    }
    return `<div style="position:absolute;top:50%;left:50%;width:14px;height:6px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:8px 0 0 #fff,-8px 0 0 #fff"></div>`;
  }

  // --- Toggle logic ---
  let isCelsius = true;
  const toggleBtn = document.getElementById("toggleCtoF");
  const currentTempEl = document.getElementById("currentTemp");
  const conditionEl = document.getElementById("condition");

  function rollTemp(from, to, unit) {
    const container = document.createElement("span");
    container.style.display = "inline-block";
    container.style.overflow = "hidden";
    container.style.height = "1em";

    const up = document.createElement("span");
    up.className = "rolling up";
    up.textContent = `${to}°${unit}`;

    const down = document.createElement("span");
    down.className = "rolling down";
    down.textContent = `${from}°${unit}`;

    container.append(up, down);
    return container;
  }

  toggleBtn.addEventListener("click", () => {
    const oldUnit = isCelsius ? "°C" : "°F";
    isCelsius = !isCelsius;
    const newUnit = isCelsius ? "°C" : "°F";

    const fromTemp = parseInt(currentTempEl.textContent);
    const toTemp = isCelsius
      ? Math.round((fromTemp - 32) * 5 / 9)
      : Math.round(fromTemp * 9 / 5 + 32);

    currentTempEl.innerHTML = "";
    const rolled = rollTemp(fromTemp + "°" + oldUnit, toTemp + "°" + newUnit, "");
    currentTempEl.appendChild(rolled);

    setTimeout(() => {
      currentTempEl.textContent = `${toTemp}°${newUnit}`;
    }, 600);

    renderHourly(isCelsius ? "C" : "F");
    renderDaily(isCelsius ? "C" : "F");
  });

  // Initial render
  renderHourly("C");
  renderDaily("C");
</script>
</body>
</html>
