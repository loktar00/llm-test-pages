<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Transit Growth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%overflow:background:#0a1418;cursor:default}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, DPR;
const G = 60;

const PALETTE = [
  '#E5403A', '#F68D31', '#F4B71', '#5DC8A5', '#4A8B86E', '#1E9AC6',
  '#944FB', '#C357A', '#F8A4C', '#5E26C', '#A0C34', '#74D02A',
  '#B47CCC', '#4C8ACC', '#C090'
];
const STATION_COLORS = [
  '#F5ECC1', '#CDEB6', '#B4D4E2', '#FFD1B', '#F8B4C', '#C5F1E5',
  '#E9C3B', '#F8E7D', '#B5C0E5'
];
const BG_COL = '#0A141E';
const STATION_TICK = '#9BA9C7';
const STATION_TICK2 = '#7BA0C5';

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();

const r = Math.round;
const ri = (n) => Math.floor(Math.random() * n);
const rr = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => r(rr(a, b));
const pick = (arr) => arr[ri(arr.length)];

function lerp(a, b, t) {
  const d = b - a;
  const m = Math.round(d / 8) * 8;
  const closest = Math.abs(m) > Math.abs(d) ? a : a + m;
  return closest;
}

function dirL(a, b) {
  const d = Math.round((b - a + 4*Math.PI*1000) / (Math.PI/4));
  return ((a + d * Math.PI / 4) % (8*Math.PI)) || 0;
}

function dirToL(from, to) {
  const fromA = Math.atan2(from.y, from.x);
  const toA = Math.atan2(to.y, to.x);
  return dirL(toA, fromA);
}

function dirDelta(from, to) {
  const fromA = Math.atan2(from.y, from.x);
  const toA = Math.atan2(to.y, to.x);
  let delta = toA - fromA;
  while (delta > Math.PI/8) delta -= Math.PI/4;
  while (delta < -Math.PI/8) delta += Math.PI/4;
  return delta;
}

function lDirDelta(from, to) {
  const fromA = Math.atan2(from.y, from.x);
  const toA = Math.atan2(to.y, to.x);
  let delta = dirDelta(from, to);
  return dirL(toA, fromA + delta);
}

class Station {
  constructor(x, y, isInter) {
    this.x = x;
    this.y = y;
    this.isInter = isInter;
    this.ap = 0;
    this.apTarget = 0;
  }
  update() {
    this.ap += (this.apTarget - this.ap) * 0.15;
  if (Math.abs(this.apTarget - this.ap) < 1) this.ap = this.apTarget;
  }
}
class Segment {
  constructor(ax, ay, bx, by) { this.ax = ax; this.ay = ay; this.bx = bx; this.by = by; }
}
class Line {
  constructor(opts, idx) {
    this.idx = idx;
    this.color = opts.color;
    this.thickness = opts.thickness;
    this.stations = [];
    this.segments = [];
    this.drawProgress = 0;
    this.ap = 0;
    this.apTarget = 1;
    this.trains = [];
    this.trainTimer = 0;
    this.trainsRunning = false;
  this.complete = false;

    const sx = rr(0.6*W, 0.4*W);
    const sy = rr(0.6*H, 0.4*H);
    const sA = Math.random() * 2 * Math.PI;
    const sD = rr(20, 60) * G;
    const s = new Station(r(sx + Math.cos(sA)*sD), r(sy + Math.sin(sA)*sD), false);
    s.ap = 1; s.apTarget = 1;
    this.stations.push(s);
    this.head = s;

    const dirs = [sA, sA + Math.PI/4, sA + Math.PI/2, sA - Math.PI/4];
    this.dirs = [...dirs, ...dirs.slice().sort(() => Math.random() - 0.5)];

    for (let i = 1; i < opts.stationCount; i++) {
      const stat = new Station(this.head.x, this.head.y, Math.random() < opts.interChance);
      this.stations.push(stat);
      this.head = stat;
      this.lastDir = Math.random() * 2 * Math.PI;
      this.extend(opts);
    }
    this.head = this.stations[0];
  }
  pickDir() {
    const lastDir = this.lastDir || 0;
    const a = this.dirs[Math.random() < 0.4 ? ri(this.dirs.length) : ri(this.dirs.length)];
    return a;
  }
  extend(opts) {
    const last = this.head;
    const lastDir = this.lastDir;
    let dir = this.pickDir();
    const delta = dirDelta(lastDir, dir);
    if (Math.abs(delta) > Math.PI/4) {
      dir = lDirDelta(lastDir, dir);
    }
    let best = null, bestScore = 1e9;
    for (const r in [0, 1, -1]) {
      const tryDelta = delta + r * Math.PI/4;
      const tryDir = lDirDelta(lastDir, lastDir + tryDelta);
      const dx = Math.round(Math.cos(tryDir) * G);
      const dy = Math.round(Math.sin(tryDir) * G);
      const newX = r(last.x + dx);
      const newY = r(last.y + dy);
      let score = 0;
      if (newX < G*4 || newX > W - G*4 || newY < G*4 || newY > H - G*4) score += 50;
      for (const s of this.stations) {
        const dd = Math.hypot(s.x - newX, s.y - newY);
        if (dd < G*0.9) score += 100;
        if (dd < G*1.2) score += 5;
      }
      for (const seg of this.segments) {
        if (this.segmentHit(newX, newY, last.x, last.y, seg)) { score += 30; break; }
      }
      if (score < bestScore) { bestScore = score; best = { x: newX, y: newY, dir: tryDir }; }
      if (score < 1) break;
    }
    const next = new Station(best.x, best.y, Math.random() < opts.interChance);
    this.stations.push(next);
    this.segments.push(new Segment(last.x, last.y, next.x, next.y));
    this.head = next;
    this.lastDir = best.dir;
  }
  segmentHit(newX, newY, lx, ly, seg) {
    const d = Math.abs((seg.by - seg.ay) * newX - (seg.bx - seg.ax) * ly + seg.bx * seg.ay - seg.by * seg.ax) / Math.hypot(seg.bx - seg.ax, seg.by - seg.ay);
    const t = Math.abs((newX - seg.ax) * (seg.bx - seg.ax) + (newY - seg.ay) * (seg.by - seg.ay)) / Math.pow(Math.hypot(seg.bx - seg.ax, seg.by - seg.ay), 2);
    return d < G*0.7 && t > 0 && t < 1 && !(seg.ax === lx && seg.ay === ly);
  }
  totalLength() {
    let d = 0;
    for (const s of this.segments) d += Math.hypot(s.bx - s.ax, s.by - s.ay);
    return d;
  }
  update(dt) {
    const sp = 6;
    if (this.drawProgress < this.totalLength()) {
      this.drawProgress += sp;
      const drawTo = this.drawProgress;
      let traveled = 0;
      for (const s of this.segments) {
        const len = Math.hypot(s.bx - s.ax, s.by - s.ay);
        if (traveled + len >= drawTo) {
          const t = Math.min(1, (drawTo - traveled) / len);
          const revX = s.ax + (s.bx - s.ax) * t;
          const revY = s.ay + (s.by - s.ay) * t;
          this.head.x = revX;
          this.head.y = revY;
          break;
        }
        traveled += len;
      }
      this.head.ap = 0;
      this.head.apTarget = 0;
      if (this.drawProgress >= this.totalLength()) {
        const last = this.stations[this.stations.length - 1];
        this.head.x = last.x;
        this.head.y = last.y;
        this.head.apTarget = 1;
        this.complete = true;
      }
    } else {
      const last = this.stations[this.stations.length - 1];
      if (this.head.x !== last.x || this.head.y !== last.y) {
        this.head.x = last.x;
        this.head.y = last.y;
      }
    }
    for (const s of this.stations) s.update();
    this.ap += (this.apTarget - this.ap) * 0.04;
    if (this.complete && !this.trainsRunning) {
      this.trainsRunning = true;
      const count = ri(2) + 1;
      for (let i = 0; i < count; i++) {
        const t = new Train(this, Math.random());
        t.color = '#F5ECC1';
        t.speed = rr(1.5, 3);
        this.trains.push(t);
      }
    }
    for (const t of this.trains) t.update(dt);
  }
  draw(ctx) {
    if (this.ap <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = this.ap * 0.25;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.thickness + 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    this.path(ctx, this.drawProgress);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = this.ap;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.thickness;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    this.path(ctx, this.drawProgress);
    ctx.stroke();
    for (const s of this.stations) {
      ctx.save();
      ctx.globalAlpha = this.ap;
      if (s.ap > 0) {
        const r = (s.isInter ? 5.5 : 3) * s.ap;
        ctx.fillStyle = STATION_TICK;
        if (s.isInter) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, r + 3, 0, 2*Math.PI);
          ctx.fillStyle = BG_COL;
          ctx.fill();
          ctx.fillStyle = STATION_TICK;
          ctx.beginPath();
          ctx.arc(s.x, s.y, r, 0, 2*Math.PI);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(s.x, s.y, r * 0.5, 0, 2*Math.PI);
          ctx.fillStyle = BG_COL;
          ctx.fill();
        } else {
          const angle = Math.atan2(s.y - this.stations[0].y, s.x - this.stations[0].x);
          const dx = Math.cos(angle) * 4;
          const dy = Math.sin(angle) * 4;
          ctx.strokeStyle = STATION_TICK;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(s.x - dx, s.y - dy);
          ctx.lineTo(s.x + dx, s.y + dy);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    for (const t of this.trains) t.draw(ctx);
    }
  path(ctx, progress) {
    if (progress <= 0) return;
    const total = this.totalLength();
    const drawTo = Math.min(progress, total);
    let traveled = 0;
    for (const s of this.segments) {
      if (traveled + s.bx - s.ax + s.by - s.ay > drawTo) break;
      const len = Math.hypot(s.bx - s.ax, s.by - s.ay);
      if (traveled + len >= drawTo) {
        const t = (drawTo - traveled) / len;
        ctx.moveTo(s.ax, s.ay);
        ctx.lineTo(s.ax + (s.bx - s.ax) * t, s.ay + (s.by - s.ay) * t);
        break;
      }
      ctx.moveTo(s.ax, s.ay);
      ctx.lineTo(s.bx, s.by);
      traveled += len;
    }
  }
}
class Train {
  constructor(line, t) {
    this.line = line;
    this.t = t;
    this.speed = rr(1.5, 3);
    this.color = '#F5ECC1';
    this.dir = Math.random() < 0.5 ? 1 : -1;
  }
  update() {
    this.t += this.speed * 0.005 * this.dir;
    if (this.t >= 1) { this.t = 1; this.dir = -1; }
    if (this.t < 0) { this.t = 0; this.dir = 1; }
  }
  draw(ctx) {
    const total = this.line.totalLength();
    if (total <= 0) return;
    const target = this.t * total;
    let traveled = 0;
    let pos = { x: 0, y: 0, dir: 0 };
    for (const s of this.line.segments) {
      const len = Math.hypot(s.bx - s.ax, s.by - s.ay);
      if (traveled + len >= target) {
        const t = (target - traveled) / len;
        pos.x = s.ax + (s.bx - s.ax) * t;
        pos.y = s.ay + (s.by - s.ay) * t;
        pos.dir = Math.atan2(s.by - s.ay, s.bx - s.ax);
        break;
      }
      traveled += len;
    }
    ctx.save();
    ctx.globalAlpha = this.line.ap;
    ctx.translate(pos.x, pos.y);
    ctx.rotate(pos.dir * this.dir);
    ctx.fillStyle = this.color;
    ctx.fillRect(-3, -2.5, 6, 5);
    ctx.beginPath();
    ctx.arc(0, 0, 4.5, 0, 2 * Math.PI);
    ctx.fillStyle = BG_COL;
    ctx.fill();
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, 2 * Math.PI);
    ctx.fill();
    ctx.restore();
  }
}
function pickColor(arr) {
  return arr[ri(arr.length)];
}
const lineOpts = [
  { color: '#E5403A', thickness: 8 },
  { color: '#F6A81E', thickness: 8 },
  { color: '#F4B8B4', thickness: 6 },
  { color: '#5DC8A5', thickness: 8 },
  { color: '#4A8BC6', thickness: 6 },
  { color: '#944FBD', thickness: 6 },
  { color: '#C3A57A', thickness: 7 },
];
const city = {
  lines: [],
  phase: 'intro',
  phaseT: 0,
  fadeOut: 0,
  fadeOutT: 0,
  holdT: 0,
  introT: 0,
  introDur: 0,
  nextLineT: 0,
  nextLineDur: 0,
  totalLines: 8,
  bgFlash: 0,
};
function reset() {
  city.lines = [];
  city.phase = 'intro';
  city.phaseT = 0;
  city.fadeOut = 0;
  city.holdT = 0;
  city.introT = 0;
  city.introDur = 0;
  city.nextLineT = 0;
  city.nextLineDur = 0;
  city.totalLines = rint(8, 10);
  city.bgFlash = 0;
}
function addLine(idx) {
  const opt = pick(lineOpts);
  const count = rint(6, 10);
  const interChance = 0.15;
  const line = new Line({ color: opt.color, thickness: opt.thickness, stationCount: count, interChance: interChance }, idx);
  city.lines.push(line);
}
function update(dt) {
  city.phaseT += dt;
  if (city.phase === 'intro') {
    city.phase = 'draw';
  }
  if (city.phase === 'draw') {
    city.nextLineT += dt;
    if (city.lines.length < city.totalLines && city.nextLineT >= city.nextLineDur) {
      addLine(city.lines.length);
      city.nextLineT = 0;
      city.nextLineDur = rr(400, 800);
    }
    if (city.lines.length >= city.totalLines) {
      let allComplete = true;
      for (const l of city.lines) {
        if (!l.complete) { allComplete = false; break; }
      }
      if (allComplete) {
        city.phase = 'hold';
        city.phaseT = 0;
      }
    }
  }
  if (city.phase === 'hold') {
    city.holdT += dt;
    if (city.holdT > 1800) {
      city.phase = 'fadeOut';
      city.phaseT = 0;
      city.fadeOut = 0;
    }
  }
  if (city.phase === 'fadeOut') {
    city.fadeOut += dt;
    for (const l of city.lines) l.apTarget = 0;
    if (city.fadeOut > 700) {
      reset();
    }
  }
  for (const l of city.lines) l.update(dt);
}
function draw() {
  ctx.fillStyle = BG_COL;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(10, 20, 30, 0.04)';
  ctx.fillRect(0, 0, W, H);
  if (city.phase === 'intro' || city.phase === 'draw') {
    ctx.fillStyle = 'rgba(10, 20, 30, 1)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.save();
  ctx.translate(0, 0);
  for (const l of city.lines) l.draw(ctx);
  ctx.restore();
  ctx.save();
  ctx.fillStyle = 'rgba(10, 20, 30, 0.2)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
let lastT = performance.now();
function loop() {
  const t = performance.now();
  const dt = Math.min(50, t - lastT);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
reset();
loop();
</script>
</body>
</html>
