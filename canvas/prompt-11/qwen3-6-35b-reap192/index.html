<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Isometric Terrain</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="terrainCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('terrainCanvas');
            const ctx = canvas.getContext('2d');

            const SIZE = 256;
            let heightmap = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            // Diamond Square Algorithm
            function generateHeightmap(size) {
                const n = size - 1;
                let grid = new Array(size);
                for (let i = 0; i < size; i++) {
                    grid[i] = new Array(size);
                }

                // Initialize corners
                grid[0][0] = Math.random();
                grid[0][n] = Math.random();
                grid[n][0] = Math.random();
                grid[n][n] = Math.random();

                let roughness = 0.5;
                let range = 1.0;

                let step = n;
                while (step > 1) {
                    let half = step / 2;

                    // Diamond Step
                    for (let y = 0; y < n; y += step) {
                        for (let x = 0; x < n; x += step) {
                            let avg = (grid[y][x] + grid[y][x + step] + grid[y + step][x] + grid[y + step][x + step]) / 4;
                            grid[y + half][x + half] = avg + (Math.random() * 2 - 1) * range;
                        }
                    }

                    // Square Step
                    for (let y = 0; y < n; y += step) {
                        for (let x = (y + half) % step; x < n; x += step) {
                            let count = 0;
                            let sum = 0;
                            if (y - half >= 0) { sum += grid[y - half][x]; count++; }
                            if (y + half < n) { sum += grid[y + half][x]; count++; }
                            if (x - half >= 0) { sum += grid[y][x - half]; count++; }
                            if (x + half < n) { sum += grid[y][x + half]; count++; }
                            grid[y][x] = (sum / count) + (Math.random() * 2 - 1) * range;
                        }
                    }

                    range *= roughness;
                    step = half;
                }

                // Normalize
                let min = Infinity;
                let max = -Infinity;
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        if (grid[y][x] < min) min = grid[y][x];
                        if (grid[y][x] > max) max = grid[y][x];
                    }
                }
                let rangeNorm = max - min;

                heightmap = new Array(size);
                for (let y = 0; y < size; y++) {
                    heightmap[y] = new Array(size);
                    for (let x = 0; x < size; x++) {
                        heightmap[y][x] = (grid[y][x] - min) / rangeNorm;
                    }
                }
            }

            function getColor(h) {
                // Base colors
                let r, g, b;
                if (h < 0.30) { // Deep water
                    r = 20; g = 40; b = 120;
                } else if (h < 0.38) { // Shallow water
                    r = 40; g = 100; b = 180;
                } else if (h < 0.43) { // Beach
                    r = 230; g = 220; b = 160;
                } else if (h < 0.60) { // Grass
                    r = 60; g = 160; b = 60;
                } else if (h < 0.78) { // Hills
                    r = 140; g = 110; b = 60;
                } else if (h < 0.90) { // Rocky
                    r = 100; g = 100; b = 110;
                } else { // Snow
                    r = 240; g = 250; b = 255;
                }

                // Simple slope lighting
                // We estimate slope by comparing to neighbor (simplified for 1 frame render)
                // Since we don't have a neighbor array precomputed, we'll simulate lighting 
                // based on height gradient logic or just simple height lighting.
                // Let's use a static light direction logic for color variation.
                // A slight brightness boost based on height and a shadow factor.
                
                const light = 0.8 + (h * 0.2); // Taller things slightly lighter
                
                return `rgb(${Math.floor(r * light)}, ${Math.floor(g * light)}, ${Math.floor(b * light)})`;
            }

            function render() {
                resize();
                const width = canvas.width;
                const height = canvas.height;

                ctx.fillStyle = "#111"; // Sky/Background
                ctx.fillRect(0, 0, width, height);

                const centerX = width / 2;
                const centerY = height / 2;
                
                // Isometric-ish scaling factors
                // We want to fit 256 rows vertically.
                // Let's say each row advances Y by 1.5 pixels and X by 1.5 pixels.
                // Vertical Exaggeration factor
                const vExag = 800; 
                
                // Calculate the bounding box of the base grid to center it
                // Grid size 256x256
                // Projected width: 256 * 1.5 = 384
                // Projected height: 256 * 1.5 = 384
                
                const gridScale = 1.5;
                const gridWidthPx = SIZE * gridScale;
                const gridHeightPx = SIZE * gridScale;
                
                // Top of the isometric diamond in screen space (y=0, x=0 in grid)
                const startScreenX = centerX - gridWidthPx / 2;
                const startScreenY = centerY - gridHeightPx / 2;

                ctx.lineWidth = 1;

                // Render Row by Row
                for (let y = 0; y < SIZE; y++) {
                    // Calculate the baseline Y for this row.
                    // In a standard isometric view, y increases -> down and right.
                    // We draw from back (y=0) to front (y=SIZE).
                    
                    // Row baseline Y position
                    let rowBaseScreenY = startScreenY + y * gridScale;
                    
                    // We need to determine the X offset for the start of this row's columns
                    // In iso, x=0, y=y is at: X = x*1.5 - y*1.5, Y = x*0.75 + y*0.75
                    // But here we are iterating Y (rows).
                    // Let's define the left-most point of row y.
                    // Row 0: x=0.
                    // Row 1: x=0 is at y=1*0.75, x=-1*1.5.
                    
                    // To simplify the "Column" drawing:
                    // We iterate x from 0 to 255.
                    // For each x, we calculate the screen X.
                    
                    for (let x = 0; x < SIZE; x++) {
                        let h = heightmap[y][x];
                        
                        // Screen coordinates for the base of this column (height 0)
                        // Isometric projection:
                        // screenX = (x - y) * gridScale
                        // screenY = (x + y) * (gridScale / 2) 
                        // Note: gridScale/2 creates the 2:1 ratio usually used in iso.
                        
                        let baseX = (x - y) * gridScale;
                        let baseY = (x + y) * (gridScale / 2);

                        // Add the global center offset
                        let drawX = centerX + baseX;
                        let drawY = centerY + baseY;

                        // Height offset
                        let colHeight = h * vExag;
                        
                        // Draw the column
                        // We draw a vertical line from the calculated baseY up to baseY - colHeight
                        // We use a very thin rectangle or line to simulate the column face
                        
                        let color = getColor(h);
                        
                        // To give a 3D look without extra geometry, we draw a small rectangle
                        // representing the front face of the column.
                        // Width is small, say 1px.
                        
                        ctx.fillStyle = color;
                        
                        // Optimization: If the column is very small, just draw a point or short line.
                        // If it's tall, draw the rect.
                        
                        // We also want to draw a "top" or shadow if it's hidden?
                        // Since we draw back-to-front, we can't see the top of hidden columns easily 
                        // without more complex logic. We will stick to the vertical extrusion.
                        
                        // To make it look like a terrain slice, we draw a tiny vertical bar.
                        // To simulate depth, we can vary the width slightly based on Y, but 1px is safest.
                        
                        ctx.fillRect(drawX, drawY - colHeight, 1.5, colHeight);
                        
                        // Optional: Draw a small highlight on the top edge if it's high?
                        // Since we iterate back-to-front, we might overwrite the top of previous columns.
                        // To fix this, we could draw the top face first, but the prompt asks for 
                        // "vertical line or narrow column".
                    }
                }
            }

            // Initialize
            window.addEventListener('resize', () => {
                resize();
                render();
            });

            generateHeightmap(SIZE);
            render();

        })();
    </script>
</body>
</html>
