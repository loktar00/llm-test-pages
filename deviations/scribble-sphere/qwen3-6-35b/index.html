<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scribble Ball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            color: #888;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="status">Generating...</div>
        <div id="progress">0%</div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        /**
         * 3D Scribble Ball
         * A continuous fractal-like line wrapping a sphere.
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const progressEl = document.getElementById('progress');

        // Configuration
        const config = {
            rotationSpeed: 0.005,
            lineGrowthRate: 15, // Segments per frame
            maxSegments: 120000,
            baseRadius: 200,
            baseColor: { r: 0, g: 200, b: 255 }, // Cyan-ish
            maxDepth: 1000,
            minDepth: -1000,
            fov: 800,
            lineWeight: 3,
            phases: {
                grow: 2000,
                hold: 1000,
                shrink: 2000
            }
        };

        let width, height;
        let cx, cy;

        // State
        let segments = [];
        let currentSegmentCount = 0;
        let phase = 'grow'; // grow, hold, shrink
        let phaseTime = 0;
        let isFull = false;
        
        // 3D Math State
        let angleX = 0;
        let angleY = 0;
        let angleZ = 0;

        // Resize Handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Initialize with a small seed to prevent divide by zero or visual popping
        function initSphere() {
            const startPt = { x: 0, y: 0, z: 0 }; // Center
            for(let i=0; i<50; i++) {
                addRandomPoint(startPt);
            }
            // Connect to center to establish the "core"
            for(let i=0; i<50; i++) {
                const last = segments[segments.length-1];
                const p = project(0, 0, 0);
                drawLine(last.x, last.y, p.x, p.y, last.a, p.a);
                segments.push({ x: 0, y: 0, z: 0 });
            }
        }

        function addRandomPoint(fromPoint) {
            // Random direction
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            // Calculate displacement
            const r = config.baseRadius;
            const dx = r * Math.sin(phi) * Math.cos(theta);
            const dy = r * Math.sin(phi) * Math.sin(theta);
            const dz = r * Math.cos(phi);

            // Add a bit of noise to make it look like "scribbles" (not perfect geodesics)
            const noise = 20;
            
            const toPoint = {
                x: fromPoint.x + dx + (Math.random() * noise - noise/2),
                y: fromPoint.y + dy + (Math.random() * noise - noise/2),
                z: fromPoint.z + dz + (Math.random() * noise - noise/2)
            };

            // Project and Draw immediately
            const p1 = project(fromPoint.x, fromPoint.y, fromPoint.z);
            const p2 = project(toPoint.x, toPoint.y, toPoint.z);

            drawLine(p1.x, p1.y, p2.x, p2.y, p1.a, p2.a);

            // Store 3D point for next iteration
            segments.push(toPoint);
            currentSegmentCount++;
        }

        function project(x, y, z) {
            // 1. Rotate
            // Y Rotation
            let x1 = x * Math.cos(angleY) - z * Math.sin(angleY);
            let z1 = z * Math.cos(angleY) + x * Math.sin(angleY);
            
            // X Rotation
            let y2 = y * Math.cos(angleX) - z1 * Math.sin(angleX);
            let z2 = z1 * Math.cos(angleX) + y * Math.sin(angleX);

            // Z Rotation (Tumbling)
            let x3 = x1 * Math.cos(angleZ) - y2 * Math.sin(angleZ);
            let y3 = y2 * Math.cos(angleZ) + x1 * Math.sin(angleZ);
            z3 = z2; // z is now z3

            // 2. Perspective
            // z3 is depth. Center of screen is roughly z=0.
            // We want the sphere to be at z=0 roughly, but radius is 200.
            
            const scale = config.fov / (config.fov + z3);
            
            return {
                x: cx + x3 * scale,
                y: cy + y3 * scale,
                z: z3,
                scale: scale
            };
        }

        function drawLine(x1, y1, x2, y2, alpha1, alpha2) {
            // Calculate average alpha for the stroke
            // We want line to fade out if it goes too far back, or darken
            let avgAlpha = (alpha1 + alpha2) / 2;
            // Clamp alpha to reasonable drawing range (0 to 1)
            avgAlpha = Math.max(0, Math.min(1, avgAlpha));

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            
            // Dynamic Line Weight based on depth
            // Closer (lower z, higher scale) = thicker
            const avgScale = (alpha1 + alpha2) / 2 * config.lineWeight;
            
            ctx.lineWidth = Math.max(0.5, avgScale);
            ctx.strokeStyle = `rgba(${config.baseColor.r}, ${config.baseColor.g}, ${config.baseColor.b}, ${avgAlpha})`;
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Optimization: Use globalCompositeOperation for glow effect
            // Only apply to thicker lines to save performance
            if (avgScale > 2) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${config.baseColor.r}, ${config.baseColor.g}, ${config.baseColor.b}, ${avgAlpha})`;
            } else {
                ctx.shadowBlur = 0;
            }

            ctx.stroke();
        }

        function update() {
            // Rotate the entire system
            angleX += config.rotationSpeed * 0.5;
            angleY += config.rotationSpeed;
            angleZ += config.rotationSpeed * 0.2;

            // Phase Logic
            if (phase === 'grow') {
                for (let i = 0; i < config.lineGrowthRate; i++) {
                    if (currentSegmentCount >= config.maxSegments) {
                        phase = 'hold';
                        phaseTime = 0;
                        isFull = true;
                        break;
                    }
                    const lastPt = segments[segments.length - 1];
                    addRandomPoint(lastPt);
                    
                    // Update UI
                    const pct = Math.floor((currentSegmentCount / config.maxSegments) * 100);
                    progressEl.innerText = `${pct}%`;
                    statusEl.innerText = `Density: ${pct}%`;
                }
            } else if (phase === 'hold') {
                phaseTime++;
                if (phaseTime > config.phases.hold) {
                    phase = 'shrink';
                    phaseTime = 0;
                }
            } else if (phase === 'shrink') {
                // We need to redraw the screen with fewer segments.
                // Since we can't easily "erase" a canvas, we clear and redraw visible history.
                
                // Remove the last few segments from memory
                segments.splice(-config.lineGrowthRate, config.lineGrowthRate);
                currentSegmentCount -= config.lineGrowthRate;

                // Clear Canvas
                ctx.clearRect(0, 0, width, height);

                // We need to restore the 3D points to their original positions 
                // before they were rotated, OR we rotate the current points back.
                // Since we only stored the *rotated* coordinates in the drawing logic? 
                // No, we stored 'toPoint' in 3D space. 
                // But wait, in addRandomPoint, the displacement is applied to local coordinates.
                // However, we rotate the whole system `angleX/Y/Z`.
                
                // To support the "unravel" effect, we simply remove points from the end of the array
                // and redraw.
                
                drawVisibleSegments();

                if (segments.length <= 50) {
                    phase = 'grow';
                    phaseTime = 0;
                    isFull = false;
                    statusEl.innerText = "Rebuilding...";
                    progressEl.innerText = "0%";
                }
            }
        }

        function drawVisibleSegments() {
            // To avoid O(N^2) performance issues, we only iterate through the active segments
            // and skip the drawing if we are just growing (drawing is incremental).
            // But when shrinking, we must redraw everything.
            
            // Optimization: Iterate backwards or forwards?
            // The line is continuous.
            
            // Note: In 'grow' mode, we draw incrementally in update(). 
            // In 'shrink' mode, we clear and redraw.
            
            if (phase === 'grow') return; 

            const len = segments.length;
            ctx.lineWidth = 1; // Default, will be overridden per line
            
            for (let i = 0; i < len - 1; i++) {
                const p1 = segments[i];
                const p2 = segments[i+1];
                
                const v1 = project(p1.x, p1.y, p1.z);
                const v2 = project(p2.x, p2.y, p2.z);
                
                drawLine(v1.x, v1.y, v2.x, v2.y, v1.scale, v2.scale);
            }
        }

        // Main Loop
        function loop() {
            if (phase === 'grow') {
                update();
            } else if (phase === 'hold') {
                // Just rotate and redraw to keep it smooth
                ctx.clearRect(0, 0, width, height);
                drawVisibleSegments();
                update();
            } else if (phase === 'shrink') {
                update();
            }
            
            requestAnimationFrame(loop);
        }

        // Start
        initSphere();
        drawVisibleSegments();
        loop();

    </script>
</body>
</html>
