<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Payment Form</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-gradient-1: #4b6cb7;
            --card-gradient-2: #182848;
            --text-color: #333;
            --input-bg: #fff;
            --input-border: #ddd;
            --input-focus: #4b6cb7;
            --card-width: 380px;
            --card-height: 240px;
            --card-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            perspective: 1000px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            position: relative;
        }

        /* --- 3D Card Styles --- */
        .card-container {
            width: var(--card-width);
            height: var(--card-height);
            margin: 0 auto 40px auto;
            perspective: 1000px;
            z-index: 10;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: var(--card-radius);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            /* Gentle Hover Animation */
            animation: float 6s ease-in-out infinite;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--card-radius);
            background: linear-gradient(135deg, var(--card-gradient-1), var(--card-gradient-2));
            color: white;
            padding: 25px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }

        /* Sheen Effect */
        .card-face::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.1) 40%,
                rgba(255,255,255,0.3) 50%,
                rgba(255,255,255,0.1) 60%,
                rgba(255,255,255,0) 100%
            );
            transform: skewX(-20deg) translateX(-100%);
            transition: transform 0.5s;
            pointer-events: none;
        }

        .card:hover .card-face::before {
            transform: skewX(-20deg) translateX(100%);
            transition: transform 1s;
        }

        /* Decorative patterns */
        .card-face::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            pointer-events: none;
        }

        /* Card Front Content */
        .chip {
            width: 50px;
            height: 35px;
            background: linear-gradient(135deg, #d4af37, #f9e394);
            border-radius: 6px;
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .chip::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 6px;
        }
        
        .chip-lines {
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 1px;
            background: rgba(0,0,0,0.2);
            box-shadow: 0 -8px 0 rgba(0,0,0,0.2), 0 8px 0 rgba(0,0,0,0.2);
        }

        .contactless {
            width: 25px;
            height: 25px;
            margin-left: 15px;
            opacity: 0.7;
        }

        .card-number-display {
            font-size: 26px;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 2px 2px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            word-spacing: 10px;
        }

        .card-details-display {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .info-block {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .value {
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
        }

        /* CSS Brand Logo (Generic) */
        .brand-logo {
            width: 60px;
            height: 35px;
            position: relative;
            display: flex;
        }
        .brand-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            position: absolute;
            top: 2px;
        }
        .brand-red { background: #ff5f5f; left: 0; opacity: 0.9; }
        .brand-orange { background: #ffbd2e; left: 15px; opacity: 0.9; }

        /* Card Back Content */
        .card-back {
            transform: rotateY(180deg);
            padding: 0;
        }

        .magnetic-strip {
            width: 100%;
            height: 40px;
            background: #222;
            margin-top: 25px;
        }

        .cvc-area {
            padding: 25px;
            margin-top: 15px;
            height: calc(100% - 80px);
            display: flex;
            flex-direction: column;
        }

        .cvc-strip {
            width: 100%;
            height: 40px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 4px;
        }

        .cvc-label {
            text-align: right;
            font-size: 10px;
            margin-bottom: 5px;
            color: #ddd;
        }

        /* --- Form Styles --- */
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            margin: 0 auto;
            transform: translateY(-20px);
            z-index: 5;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--text-color);
            font-weight: 600;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            background: var(--input-bg);
        }

        .input-group input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.1);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--card-gradient-1);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--card-gradient-2);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Responsive */
        @media (max-width: 420px) {
            :root {
                --card-width: 320px;
                --card-height: 200px;
            }
            .card-number-display { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 3D Card -->
        <div class="card-container">
            <div class="card" id="card">
                <!-- Front -->
                <div class="card-face card-front">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="chip">
                            <div class="chip-lines"></div>
                        </div>
                        <svg class="contactless" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-2.5-4-2.5-4" />
                            <path d="M15.5 14.5A2.5 2.5 0 0 1 13 12c0-1.38.5-2 1-3 1.07-2.14 2.5-4 2.5-4" />
                            <path d="M12 22a10 10 0 0 1-10-10" />
                            <path d="M12 10a8 8 0 0 1 8-8" />
                            <path d="M12 10a10 10 0 0 1 10 10" />
                        </svg>
                    </div>

                    <div class="card-number-display" id="display-number">0000 0000 0000 0000</div>

                    <div class="card-details-display">
                        <div class="info-block">
                            <span class="label">Card Holder</span>
                            <span class="value" id="display-name">FULL NAME</span>
                        </div>
                        <div class="info-block" style="align-items: flex-end;">
                            <span class="label">Expires</span>
                            <span class="value" id="display-date">MM/YY</span>
                        </div>
                    </div>
                    <div class="brand-logo">
                        <div class="brand-circle brand-red"></div>
                        <div class="brand-circle brand-orange"></div>
                    </div>
                </div>

                <!-- Back -->
                <div class="card-face card-back">
                    <div class="magnetic-strip"></div>
                    <div class="cvc-area">
                        <div class="cvc-label">CVC / CVV</div>
                        <div class="cvc-strip" id="display-cvc">***</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form -->
        <div class="form-container">
            <h2>Payment Details</h2>
            <form id="payment-form" autocomplete="off">
                <div class="input-group">
                    <label for="card-number">Card Number</label>
                    <input type="text" id="card-number" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                
                <div class="input-group">
                    <label for="card-name">Card Holder Name</label>
                    <input type="text" id="card-name" placeholder="John Doe" maxlength="25">
                </div>

                <div class="row">
                    <div class="col">
                        <div class="input-group">
                            <label for="card-expiry">Expiry Date</label>
                            <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <label for="card-cvc">CVC</label>
                            <input type="text" id="card-cvc" placeholder="123" maxlength="4">
                        </div>
                    </div>
                </div>

                <button type="button" onclick="alert('Payment processed successfully!')">Pay Now</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('card');
            const numberInput = document.getElementById('card-number');
            const nameInput = document.getElementById('card-name');
            const expiryInput = document.getElementById('card-expiry');
            const cvcInput = document.getElementById('card-cvc');

            const displayNumber = document.getElementById('display-number');
            const displayName = document.getElementById('display-name');
            const displayDate = document.getElementById('display-date');
            const displayCvc = document.getElementById('display-cvc');

            // --- Card Number Logic ---
            numberInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
                
                // Auto-grouping in fours
                let formattedValue = '';
                for (let i = 0; i < value.length; i++) {
                    if (i > 0 && i % 4 === 0) formattedValue += ' ';
                    formattedValue += value[i];
                }
                
                e.target.value = formattedValue;

                // Update card display
                if (formattedValue === '') {
                    displayNumber.textContent = '0000 0000 0000 0000';
                } else {
                    displayNumber.textContent = formattedValue;
                }
            });

            // --- Name Logic ---
            nameInput.addEventListener('input', (e) => {
                let value = e.target.value;
                if (value === '') {
                    displayName.textContent = 'FULL NAME';
                } else {
                    displayName.textContent = value;
                }
            });

            // --- Expiry Logic ---
            expiryInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                
                if (value.length >= 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2, 4);
                }
                
                e.target.value = value;

                if (value === '') {
                    displayDate.textContent = 'MM/YY';
                } else {
                    displayDate.textContent = value;
                }
            });

            // --- CVC Logic & Flip Animation ---
            cvcInput.addEventListener('focus', () => {
                card.classList.add('is-flipped');
            });

            cvcInput.addEventListener('blur', () => {
                card.classList.remove('is-flipped');
            });

            cvcInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                e.target.value = value; // Only allow numbers

                if (value === '') {
                    displayCvc.textContent = '***';
                } else {
                    displayCvc.textContent = value;
                }
            });

            // Prevent focus on CVC while card is flipping back (UX polish)
            card.addEventListener('transitionend', () => {
                if (!card.classList.contains('is-flipped')) {
                    // Optional: could remove focus from CVC here if desired
                }
            });
        });
    </script>
</body>
</html>
