<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Replication Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>
    <script>
        /**
         * DNA Replication Simulation
         * Single file implementation using HTML5 Canvas
         */

        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let animationId;
        let globalTime = 0;

        // Configuration
        const CONFIG = {
            basePairs: 120,           // Total number of rungs
            radius: 120,              // Helix radius
            verticalSpacing: 18,      // Distance between rungs
            rotationSpeed: 0.005,     // Radians per frame
            basePairWidth: 14,        // Thickness of the DNA strand
            glowSize: 15,             // Glow spread
            replicationSpeed: 0.8,    // Speed of the unzip wave
            replicationSize: 12,      // Length of the unzipped section
            colors: {
                A: { r: 255, g: 255, b: 255, hex: '#ffffff' }, // Adenine (White)
                T: { r: 255, g: 100, b: 100, hex: '#ff6464' }, // Thymine (Red)
                G: { r: 100, g: 255, b: 100, hex: '#64ff64' }, // Guanine (Green)
                C: { r: 100, g: 150, b: 255, hex: '#6496ff' }, // Cytosine (Blue)
                backbone: { r: 200, g: 200, b: 220, hex: '#c8c8dc' }
            }
        };

        // State
        let segments = [];
        let replicationState = {
            active: false,
            center: 0,
            progress: 0, // 0 to 1
            direction: 1 // 1 = replicating (unzipping), -1 = rebuilding
        };

        // Resize Handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Logic & Math ---

        // Initialize DNA segments
        function initDNA() {
            segments = [];
            for (let i = 0; i < CONFIG.basePairs; i++) {
                segments.push({
                    index: i,
                    angleOffset: (i * 0.4), // Twist factor
                    // Base pair types
                    type1: Math.random() > 0.5 ? 'A' : 'G',
                    type2: Math.random() > 0.5 ? 'T' : 'C',
                    // Replication state (0 = connected, 1 = separated)
                    separation: 0 
                });
            }
        }

        // Update Replication Logic
        function updateReplication() {
            if (!replicationState.active) {
                // Randomly start replication
                if (Math.random() < 0.002) {
                    replicationState.active = true;
                    replicationState.center = Math.floor(Math.random() * CONFIG.basePairs);
                    replicationState.progress = 0;
                    replicationState.direction = 1;
                }
            } else {
                replicationState.progress += CONFIG.replicationSpeed;
                
                // Calculate the wave center based on progress
                // It expands outwards from the initial center point
                const halfSize = Math.floor(CONFIG.replicationSize / 2);
                const currentWaveCenter = replicationState.center + (replicationState.progress * 2);
                
                // Determine if we are done
                if (replicationState.progress > CONFIG.basePairs + CONFIG.replicationSize) {
                    // Reset DNA
                    segments.forEach(seg => seg.separation = 0);
                    replicationState.active = false;
                } else {
                    // Update separation based on wave position
                    segments.forEach(seg => {
                        const dist = Math.abs(seg.index - currentWaveCenter);
                        if (dist < halfSize) {
                            seg.separation = 1;
                        }
                    });
                }
            }
        }

        // --- Rendering ---

        function drawGlow(x, y, color, size, alpha) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.3})`;
            ctx.shadowBlur = 20;
            ctx.shadowColor = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
            ctx.fill();
            ctx.restore();
        }

        function drawLine(x1, y1, x2, y2, color, width, alpha) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 5;
            ctx.shadowColor = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.5})`;
            ctx.stroke();
            ctx.restore();
        }

        function render() {
            // Clear screen with dark fade for trails (optional, but clean clear is better for geometry)
            ctx.clearRect(0, 0, width, height);
            
            // Background gradient
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            gradient.addColorStop(0, '#0a0a12');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            globalTime += CONFIG.rotationSpeed;

            updateReplication();

            // 1. Calculate 3D positions for all segments
            const projectionScale = 600; // Focal length
            const centerX = width / 2;
            const centerY = height / 2;

            const renderList = [];

            segments.forEach((seg, i) => {
                const angle = globalTime + (i * 0.4);
                
                // 3D Coordinates
                const x3d = Math.cos(angle) * CONFIG.radius;
                const z3d = Math.sin(angle) * CONFIG.radius;
                
                // Separation logic: If unzipped, push strands apart on X axis
                const separationOffset = seg.separation * 40;
                
                // Strand 1 (Left/Right depending on rotation)
                const s1_x = -x3d - separationOffset;
                const s1_y = i * CONFIG.verticalSpacing;
                const s1_z = z3d;

                // Strand 2
                const s2_x = x3d + separationOffset;
                const s2_y = i * CONFIG.verticalSpacing;
                const s2_z = z3d;

                // Calculate depth factor (0 = back, 1 = front)
                // Z goes from -radius to +radius. 
                // We map -radius -> 0, +radius -> 1
                const depth = (s1_z + CONFIG.radius) / (CONFIG.radius * 2);
                
                // Add brightness based on depth
                const brightness = 0.3 + (depth * 0.7);

                // Project to 2D
                const scale = projectionScale / (projectionScale + s1_z); // Simple perspective
                const sx1 = centerX + s1_x * scale;
                const sy1 = centerY + s1_y * scale;
                
                const sx2 = centerX + s2_x * scale;
                const sy2 = centerY + s2_y * scale;

                renderList.push({
                    index: i,
                    depth: depth,
                    brightness: brightness,
                    scale: scale,
                    s1: { x: sx1, y: sy1, z: s1_z },
                    s2: { x: sx2, y: sy2, z: s2_z },
                    type1: seg.type1,
                    type2: seg.type2,
                    separation: seg.separation
                });
            });

            // 2. Sort by Depth (Painter's Algorithm: Draw back to front)
            // Note: In this specific helix geometry, sorting by index usually works 
            // because it's a single continuous curve, but for strict correctness:
            renderList.sort((a, b) => a.depth - b.depth);

            // 3. Draw
            renderList.forEach(item => {
                const { s1, s2, brightness, scale, type1, type2, separation } = item;

                // Draw Backbone (Strands)
                // Strand 1
                const cBackbone = CONFIG.colors.backbone;
                drawLine(s1.x, s1.y, s1.x, s1.y, cBackbone, CONFIG.basePairWidth * scale, brightness);
                
                // Strand 2
                drawLine(s2.x, s2.y, s2.x, s2.y, cBackbone, CONFIG.basePairWidth * scale, brightness);

                // Draw Base Pair (Rung)
                if (separation > 0) {
                    // If separated, draw two half-rungs going to the center or just dots?
                    // Let's draw lines from base to the center point where they were connected
                    const midX = (s1.x + s2.x) / 2;
                    const midY = (s1.y + s2.y) / 2;
                    
                    drawLine(s1.x, s1.y, midX, midY, CONFIG.colors[type1], CONFIG.basePairWidth * 0.8 * scale, brightness);
                    drawLine(s2.x, s2.y, midX, midY, CONFIG.colors[type2], CONFIG.basePairWidth * 0.8 * scale, brightness);
                } else {
                    // Connected
                    drawLine(s1.x, s1.y, s2.x, s2.y, CONFIG.colors[type1], CONFIG.basePairWidth * 0.6 * scale, brightness);
                }

                // Draw Glowing Nodes (The "Beads")
                const glowAlpha = brightness * 0.8;
                
                // Node 1
                drawGlow(s1.x, s1.y, CONFIG.colors[type1], (CONFIG.basePairWidth + CONFIG.glowSize) * scale, glowAlpha);
                
                // Node 2
                drawGlow(s2.x, s2.y, CONFIG.colors[type2], (CONFIG.basePairWidth + CONFIG.glowSize) * scale, glowAlpha);

                // If separated, draw a small node in the middle to represent the split base
                if (separation > 0) {
                    const midX = (s1.x + s2.x) / 2;
                    const midY = (s1.y + s2.y) / 2;
                    drawGlow(midX, midY, CONFIG.colors[type2], (CONFIG.basePairWidth * 0.5) * scale, glowAlpha);
                }
            });

            animationId = requestAnimationFrame(render);
        }

        // Start
        initDNA();
        render();

    </script>
</body>
</html>
