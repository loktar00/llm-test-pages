<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messaging Panel</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f0f2f5;--sidebar:#fff;--chat-bg:#efeae2;--outgoing:#5b5efb;
    --incoming:#fff;--text-primary:#1a1a2e;--text-secondary:#6b7280;
    --text-light:#9ca3af;--border:#e5e7eb;--accent:#5b5efb;
    --online:#22c55e;--offline:#d1d5db;--typing:#5b5efb;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:0 10px 25px rgba(0,0,0,.1);
    --radius:16px;--radius-sm:10px;
  }
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text-primary);overflow:hidden}

  .app{display:flex;height:100vh;width:100vw}

  /* ── SIDEBAR ── */
  .sidebar{width:360px;min-width:360px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:2}
  .sidebar-header{padding:20px 20px 0}
  .sidebar-header h1{font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--text-primary)}
  .sidebar-header p{font-size:13px;color:var(--text-secondary);margin-top:2px}
  .search-box{margin:16px 20px 8px;position:relative}
  .search-box input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text-primary);outline:none;transition:border .2s,box-shadow .2s}
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,94,251,.12)}
  .search-box input::placeholder{color:var(--text-light)}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-light);pointer-events:none}
  .contacts{flex:1;overflow-y:auto;padding:8px 10px}
  .contacts::-webkit-scrollbar{width:4px}
  .contacts::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}

  .contact{display:flex;align-items:center;padding:12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;position:relative}
  .contact:hover{background:var(--bg)}
  .contact.active{background:rgba(91,94,251,.07)}
  .contact-avatar{position:relative;flex-shrink:0}
  .contact-avatar img{width:48px;height:48px;border-radius:50%;object-fit:cover;display:block}
  .contact-avatar .dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--sidebar)}
  .contact-avatar .dot.online{background:var(--online)}
  .contact-avatar .dot.offline{background:var(--offline)}
  .contact-info{flex:1;margin-left:12px;min-width:0}
  .contact-name{font-size:14.5px;font-weight:600;color:var(--text-primary);display:flex;justify-content:space-between;align-items:center}
  .contact-name .time{font-size:11.5px;color:var(--text-light);font-weight:400}
  .contact-preview{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .contact-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:8px;flex-shrink:0}
  .unread-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .unread-badge.muted{background:#d1d5db}

  /* ── CHAT PANEL ── */
  .chat-panel{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);position:relative}
  .chat-panel::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:0}

  .chat-header{padding:14px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;z-index:1;position:relative}
  .chat-header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  .chat-header-info h3{font-size:15px;font-weight:600}
  .chat-header-info span{font-size:12px;color:var(--online);font-weight:500}
  .chat-header-info span.offline-text{color:var(--text-light)}
  .chat-header-actions{margin-left:auto;display:flex;gap:6px}
  .chat-header-actions button{width:36px;height:36px;border:none;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:background .15s,color .15s}
  .chat-header-actions button:hover{background:var(--bg);color:var(--text-primary)}

  .messages{flex:1;overflow-y:auto;padding:20px 24px 12px;display:flex;flex-direction:column;gap:4px;z-index:1;position:relative;scroll-behavior:smooth}
  .messages::-webkit-scrollbar{width:5px}
  .messages::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:5px}

  /* Day divider */
  .day-divider{display:flex;align-items:center;gap:12px;margin:16px 0 12px;user-select:none}
  .day-divider::before,.day-divider::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.08)}
  .day-divider span{font-size:11.5px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}

  /* Message row */
  .msg-row{display:flex;gap:6px;max-width:65%;animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both}
  .msg-row.outgoing{align-self:flex-end;flex-direction:row-reverse}
  .msg-row.incoming{align-self:flex-start}
  .msg-row .avatar-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:auto}
  .msg-row.outgoing .avatar-sm{display:none}

  .bubble{padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.45;position:relative;word-wrap:break-word}
  .msg-row.incoming .bubble{background:var(--incoming);color:var(--text-primary);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
  .msg-row.outgoing .bubble{background:var(--outgoing);color:#fff;border-bottom-right-radius:4px;box-shadow:0 1px 4px rgba(91,94,251,.25)}

  .bubble .ts{font-size:10.5px;opacity:.6;margin-top:4px;display:block;text-align:right}
  .msg-row.incoming .bubble .ts{text-align:left}

  .bubble.tail-incoming::before{content:'';position:absolute;bottom:-6px;left:0;width:12px;height:12px;background:var(--incoming);clip-path:polygon(0 0,100% 0,0 100%)}
  .bubble.tail-outgoing::after{content:'';position:absolute;bottom:-6px;right:0;width:12px;height:12px;background:var(--outgoing);clip-path:polygon(100% 0,0 0,100% 100%)}

  /* Typing indicator */
  .typing-indicator{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--incoming);border-radius:var(--radius);border-bottom-left-radius:4px;box-shadow:var(--shadow);align-self:flex-start;max-width:80px;animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both}
  .typing-indicator .avatar-sm{width:28px;height:28px;border-radius:50%;object-fit:cover}
  .typing-dots{display:flex;gap:4px;padding:8px 0}
  .typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--typing);display:block;animation:bounce 1.4s infinite ease-in-out}
  .typing-dots span:nth-child(2){animation-delay:.16s}
  .typing-dots span:nth-child(3){animation-delay:.32s}

  /* ── COMPOSER ── */
  .composer{padding:14px 20px 18px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:10px;z-index:1;position:relative}
  .composer-actions{display:flex;gap:2px;padding-bottom:4px}
  .composer-actions button{width:36px;height:36px;border:none;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all .2s}
  .composer-actions button:hover{background:var(--bg);color:var(--accent)}
  .composer-input-wrap{flex:1;position:relative}
  .composer-input-wrap textarea{width:100%;padding:10px 16px;border:1.5px solid var(--border);border-radius:24px;font-size:14px;font-family:inherit;resize:none;background:var(--bg);color:var(--text-primary);outline:none;max-height:100px;line-height:1.4;transition:border .2s,box-shadow .2s;overflow-y:auto}
  .composer-input-wrap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,94,251,.1)}
  .composer-input-wrap textarea::placeholder{color:var(--text-light)}
  .send-btn{width:42px;height:42px;border:none;background:var(--accent);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .25s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;box-shadow:0 2px 8px rgba(91,94,251,.3)}
  .send-btn:hover{transform:scale(1.12) rotate(-8deg);box-shadow:0 4px 16px rgba(91,94,251,.4)}
  .send-btn:active{transform:scale(.95) rotate(0deg)}
  .send-btn svg{transition:transform .25s}
  .send-btn:hover svg{transform:translateX(1px) translateY(-1px)}

  /* ── ANIMATIONS ── */
  @keyframes popIn{
    0%{opacity:0;transform:scale(.7) translateY(8px)}
    100%{opacity:1;transform:scale(1) translateY(0)}
  }
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-6px);opacity:1}
  }

  /* ── RESPONSIVE ── */
  @media(max-width:768px){
    .sidebar{width:100%;min-width:100%;position:absolute;inset:0;z-index:10;transform:translateX(0);transition:transform .3s}
    .sidebar.hidden{transform:translateX(-100%)}
    .chat-panel{width:100%}
    .back-btn{display:flex !important}
  }
  .back-btn{display:none;width:36px;height:36px;border:none;background:transparent;border-radius:50%;cursor:pointer;align-items:center;justify-content:center;color:var(--text-secondary)}
  .back-btn:hover{background:var(--bg)}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Messages</h1>
      <p>Connect with your team</p>
    </div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search conversations…" id="searchInput">
    </div>
    <div class="contacts" id="contactsList"></div>
  </aside>

  <!-- CHAT -->
  <main class="chat-panel" id="chatPanel">
    <div class="chat-header" id="chatHeader">
      <button class="back-btn" onclick="document.getElementById('sidebar').classList.remove('hidden')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img id="headerAvatar" src="" alt="">
      <div class="chat-header-info">
        <h3 id="headerName"></h3>
        <span id="headerStatus"></span>
      </div>
      <div class="chat-header-actions">
        <button title="Voice call"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></button>
        <button title="Video call"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></button>
        <button title="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      </div>
    </div>
    <div class="messages" id="messagesContainer"></div>
    <div class="composer">
      <div class="composer-actions">
        <button title="Attach file"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button>
      </div>
      <div class="composer-input-wrap">
        <textarea id="msgInput" rows="1" placeholder="Type a message…"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </main>
</div>

let activeContactId = 1;

function renderContacts(filter = '') {
  const list = document.getElementById('contactsList');
  const filtered = contacts.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
  list.innerHTML = filtered.map(c => {
    const lastMsg = c.messages[c.messages.length - 1];
    const isActive = c.id === activeContactId;
    return `
      <div class="contact ${isActive ? 'active' : ''}" onclick="selectContact(${c.id})">
        <div class="contact-avatar">
          <img src="${c.avatar}" alt="${c.name}">
          <span class="dot ${c.status}"></span>
        </div>
        <div class="contact-info">
          <div class="contact-name">
            <span>${c.name}</span>
            <span class="time">${lastMsg ? lastMsg.time : ''}</span>
          </div>
          <div class="contact-preview">${lastMsg ? (lastMsg.from === 'me' ? 'You: ' : '') + lastMsg.text : ''}</div>
        </div>
        <div class="contact-meta">
          ${c.unread > 0 ? `<span class="unread-badge ${c.muted ? 'muted' : ''}">${c.unread}</span>` : ''}
        </div>
      </div>`;
  }).join('');
}

function renderMessages(contactId) {
  const contact = contacts.find(c => c.id === contactId);
  if (!contact) return;
  const container = document.getElementById('messagesContainer');
  let html = '';
  let lastDay = '';

  contact.messages.forEach((msg, i) => {
    if (msg.day !== lastDay) {
      lastDay = msg.day;
      html += `<div class="day-divider"><span>${msg.day}</span></div>`;
    }
    const isOut = msg.from === 'me';
    const showTail = i === 0 || contact.messages[i - 1].from !== msg.from;
    const tailClass = showTail ? (isOut ? 'tail-outgoing' : 'tail-incoming') : '';
    html += `
      <div class="msg-row ${isOut ? 'outgoing' : 'incoming'}" style="animation-delay:${i * 0.04}s">
        ${!isOut ? `<img class="avatar-sm" src="${contact.avatar}" alt="">` : ''}
        <div class="bubble ${tailClass}">
          ${msg.text}
          <span class="ts">${msg.time}</span>
        </div>
      </div>`;
  });

  // Typing indicator for active online contacts
  if (contact.status === 'online' && contactId === activeContactId) {
    html += `
      <div class="typing-indicator" style="animation-delay:${contact.messages.length * 0.04}s">
        <img class="avatar-sm" src="${contact.avatar}" alt="">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
      </div>`;
  }

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function selectContact(id) {
  activeContactId = id;
  const contact = contacts.find(c => c.id === id);
  contact.unread = 0;
  document.getElementById('headerAvatar').src = contact.avatar;
  document.getElementById('headerName').textContent = contact.name;
  const statusEl = document.getElementById('headerStatus');
  statusEl.textContent = contact.status === 'online' ? 'Online' : 'Last seen recently';
  statusEl.className = contact.status === 'online' ? '' : 'offline-text';
  renderContacts(document.getElementById('searchInput').value);
  renderMessages(id);
  document.getElementById('sidebar').classList.add('hidden');
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  const contact = contacts.find(c => c.id === activeContactId);
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes().toString().padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const timeStr = `${h % 12 || 12}:${m} ${ampm}`;
  contact.messages.push({ text, from: 'me', time: timeStr, day: 'Today' });
  input.value = '';
  input.style.height = 'auto';
  renderMessages(activeContactId);
  renderContacts(document.getElementById('searchInput').value);

  // Simulate reply
  setTimeout(() => {
    const replies = [
      "That sounds great! 👍",
      "I'll look into it right away",
      "Interesting, tell me more!",
      "Got it, thanks for letting me know",
      "Perfect, let's do it!",
      "Haha, love it 😄",
      "On it! Will update you soon",
      "Makes sense to me",
    ];
    const reply = replies[Math.floor(Math.random() * replies.length)];
    const replyTime = new Date();
    const rh = replyTime.getHours(), rm = replyTime.getMinutes().toString().padStart(2, '0');
    const rapm = rh >= 12 ? 'PM' : 'AM';
    contact.messages.push({ text: reply, from: 'them', time: `${rh % 12 || 12}:${rm} ${rapm}`, day: 'Today' });
    if (activeContactId === contact.id) {
      renderMessages(activeContactId);
    } else {
      contact.unread = (contact.unread || 0) + 1;
    }
    renderContacts(document.getElementById('searchInput').value);
  }, 1200 + Math.random() * 1500);
}

// Init
document.getElementById('headerAvatar').src = contacts.find(c => c.id === activeContactId).avatar;
document.getElementById('headerName').textContent = contacts.find(c => c.id === activeContactId).name;
const firstContact = contacts.find(c => c.id === activeContactId);
document.getElementById('headerStatus').textContent = firstContact.status === 'online' ? 'Online' : 'Last seen recently';
document.getElementById('headerStatus').className = firstContact.status === 'online' ? '' : 'offline-text';

renderContacts();
renderMessages(activeContactId);

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Auto-resize textarea
const textarea = document.getElementById('msgInput');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  renderContacts(e.target.value);
});

// Show sidebar on mobile initially, hide chat
if (window.innerWidth <= 768) {
  document.getElementById('chatPanel').style.display = 'none';
  document.getElementById('sidebar').classList.remove('hidden');
}

const origSelectContact = selectContact;
selectContact = function(id) {
  origSelectContact(id);
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('chatPanel').style.display = 'flex';
  }
};
</script>
</body>
</html>
