<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Snow Globe Screensaver</title>
    <style>
        body, html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="globe"></canvas>
    <script>
        const canvas = document.getElementById('globe');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY, radius;
        let particles = [];
        const PARTICLE_COUNT = 600;
        let shakeIntensity = 0;
        let shakeDirection = 1;
        let lastShakeTime = 0;
        const SHAKE_INTERVAL = 20000; 
        const SHAKE_DURATION = 3000;
        
        // Scene Objects
        const cabins = [];
        const trees = [];
        const snowAccumulation = {
            ground: 0,
            roofs: [],
            branches: []
        };

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            radius = Math.min(width, height) * 0.35;
            
            // Reset scene on resize
            initScene();
        }

        // Initialize Scene Geometry
        function initScene() {
            cabins.length = 0;
            trees.length = 0;
            snowAccumulation.roofs.length = 0;
            snowAccumulation.branches.length = 0;

            // Generate Cabins
            const cabinCount = 3;
            const baseY = centerY + radius * 0.45;
            const spacing = radius * 0.3;
            const startX = centerX - (spacing * (cabinCount - 1)) / 2;

            for (let i = 0; i < cabinCount; i++) {
                const x = startX + i * spacing;
                const w = radius * 0.18;
                const h = radius * 0.15;
                const roofH = radius * 0.12;
                
                // Random flicker phase
                const flickerOffset = Math.random() * Math.PI * 2;
                
                cabins.push({
                    x, y: baseY, w, h, roofH,
                    lightPhase: flickerOffset,
                    lightIntensity: 0.5 + Math.random() * 0.5
                });
                snowAccumulation.roofs.push(0); // Initial snow on roofs
            }

            // Generate Trees
            const treeCount = 8;
            for (let i = 0; i < treeCount; i++) {
                // Random position within sphere bounds
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (radius * 0.8);
                const tx = centerX + Math.cos(angle) * dist;
                const ty = baseY + Math.random() * (radius * 0.1) + 20; // Keep near ground
                
                if (Math.hypot(tx - centerX, ty - centerY) < radius - 20) {
                    trees.push({
                        x: tx,
                        y: ty,
                        height: radius * (0.15 + Math.random() * 0.15),
                        width: radius * (0.1 + Math.random() * 0.05),
                        snowLevel: 0
                    });
                    snowAccumulation.branches.push(0);
                }
            }
        }

        // Particle Class
        class SnowParticle {
            constructor() {
                this.reset();
            }

            reset() {
                // Spawn inside sphere
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * (radius - 10);
                this.x = centerX + Math.cos(angle) * r;
                this.y = centerY - radius * 0.5 + Math.random() * radius; // Start higher
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 2 + 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.settled = false;
                this.settleTimer = 0;
            }

            update(dt, shake) {
                if (this.settled) {
                    this.settleTimer += dt;
                    // Chance to become unsettled during shake
                    if (shake > 0.1 && Math.random() < 0.01) {
                        this.settled = false;
                        this.vy = -Math.random() * 50;
                        this.vx = (Math.random() - 0.5) * 50;
                    }
                    return;
                }

                // Physics
                const gravity = 30;
                const drag = 0.98;
                
                this.vy += gravity * dt;
                
                // Turbulence during shake
                if (shake > 0) {
                    const turb = shake * 200;
                    this.vx += (Math.random() - 0.5) * turb * dt;
                    this.vy += (Math.random() - 0.5) * turb * dt;
                    // Swirl effect
                    const dx = this.x - centerX;
                    const dy = this.y - centerY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 0) {
                        this.vx += (-dy / dist) * shake * 100 * dt;
                        this.vy += (dx / dist) * shake * 100 * dt;
                    }
                }

                this.vx *= drag;
                this.vy *= drag;

                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Collision with Ground/Scene
                this.checkCollisions();

                // Containment Sphere
                const dx = this.x - centerX;
                const dy = this.y - centerY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > radius - this.size) {
                    // Refract at edge
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const dot = this.vx * nx + this.vy * ny;
                    
                    // Reflect
                    this.vx -= 2 * dot * nx;
                    this.vy -= 2 * dot * ny;
                    
                    // Dampen
                    this.vx *= 0.8;
                    this.vy *= 0.8;
                    
                    // Push back in
                    this.x = centerX + nx * (radius - this.size - 1);
                    this.y = centerY + ny * (radius - this.size - 1);
                }
            }

            checkCollisions() {
                // Ground
                const groundY = centerY + radius * 0.45 + snowAccumulation.ground;
                if (this.y > groundY) {
                    this.y = groundY;
                    this.vy = -this.vy * 0.5;
                    this.vx *= 0.8;
                    if (Math.abs(this.vy) < 5 && Math.abs(this.vx) < 5) {
                        this.settled = true;
                        snowAccumulation.ground += 0.05; // Accumulate
                        if (snowAccumulation.ground > 20) snowAccumulation.ground = 20; // Cap
                    }
                }

                // Cabins
                cabins.forEach((c, i) => {
                    // Roof Triangle Collision (approximate)
                    const roofTop = c.y - c.h;
                    const roofLeft = c.x - c.w / 2;
                    const roofRight = c.x + c.w / 2;
                    
                    // Simple box check first
                    if (this.x > roofLeft - 5 && this.x < roofRight + 5 && 
                        this.y > roofTop - c.roofH - 5 && this.y < roofTop + 5) {
                        
                        // Check if above roof slope
                        // Linear interpolation for roof height at x
                        const t = (this.x - (c.x - c.w/2)) / c.w; // 0 to 1
                        const roofHAtX = c.roofH * (1 - Math.abs(t - 0.5) * 2);
                        const roofYAtX = c.y - c.h - roofHAtX;

                        if (this.y > roofYAtX && this.y < roofYAtX + 10) {
                            this.y = roofYAtX;
                            this.vy = 0;
                            this.vx = 0;
                            this.settled = true;
                            snowAccumulation.roofs[i] += 0.1;
                            if (snowAccumulation.roofs[i] > 15) snowAccumulation.roofs[i] = 15;
                        }
                    }
                });

                // Trees
                trees.forEach((t, i) => {
                    // Triangle collision for tree
                    const treeTop = t.y - t.height;
                    const treeBot = t.y;
                    
                    if (this.y > treeTop && this.y < treeBot) {
                        const progress = (this.y - treeTop) / t.height;
                        const widthAtY = t.width * progress;
                        
                        if (this.x > t.x - widthAtY/2 && this.x < t.x + widthAtY/2) {
                            // Hit branch
                            this.y = treeTop + (this.y - treeTop) * 0.95; // Bounce slightly
                            this.vy = -this.vy * 0.3;
                            this.vx *= 0.5;
                            
                            // Settle logic
                            if (Math.abs(this.vy) < 10) {
                                this.settled = true;
                                snowAccumulation.branches[i] += 0.05;
                                if (snowAccumulation.branches[i] > 8) snowAccumulation.branches[i] = 8;
                            }
                        }
                    }
                });
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        // Drawing Helpers
        function drawBackground() {
            // Night sky gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#020205');
            grad.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawGlobeBase() {
            // Base of the globe
            ctx.save();
            ctx.translate(centerX, centerY + radius + 15);
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 0.8, 20, 0, 0, Math.PI * 2);
            const baseGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 0.8);
            baseGrad.addColorStop(0, '#3a2a1a');
            baseGrad.addColorStop(1, '#1a0f05');
            ctx.fillStyle = baseGrad;
            ctx.fill();
            
            // Gold trim
            ctx.beginPath();
            ctx.ellipse(0, -5, radius * 0.8, 15, 0, 0, Math.PI * 2);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.restore();
        }

        function drawCabins() {
            cabins.forEach((c, i) => {
                const roofSnow = snowAccumulation.roofs[i] || 0;
                
                // Cabin Body
                ctx.fillStyle = '#2a1a10';
                ctx.fillRect(c.x - c.w/2, c.y - c.h, c.w, c.h);
                
                // Roof
                ctx.beginPath();
                ctx.moveTo(c.x - c.w/2 - 5, c.y - c.h);
                ctx.lineTo(c.x, c.y - c.h - c.roofH);
                ctx.lineTo(c.x + c.w/2 + 5, c.y - c.h);
                ctx.closePath();
                ctx.fillStyle = '#1a0a05';
                ctx.fill();

                // Snow on Roof
                if (roofSnow > 0) {
                    ctx.beginPath();
                    // Draw a thick line along the roof shape
                    ctx.moveTo(c.x - c.w/2 - 5, c.y - c.h);
                    ctx.lineTo(c.x, c.y - c.h - c.roofH - roofSnow);
                    ctx.lineTo(c.x + c.w/2 + 5, c.y - c.h);
                    ctx.closePath();
                    ctx.fillStyle = '#eef';
                    ctx.fill();
                }

                // Window (Flickering Light)
                const time = Date.now() / 1000;
                const flicker = Math.sin(time * 2 + c.lightPhase) * 0.2 + 0.8;
                
                // Window Glow
                ctx.shadowBlur = 15 * flicker * c.lightIntensity;
                ctx.shadowColor = '#ffaa00';
                
                ctx.fillStyle = `rgba(255, 200, 50, ${flicker * c.lightIntensity})`;
                ctx.fillRect(c.x - 5, c.y - c.h + 5, 10, 10);
                
                ctx.shadowBlur = 0; // Reset
            });
        }

        function drawTrees() {
            trees.forEach((t, i) => {
                const branchSnow = snowAccumulation.branches[i] || 0;
                
                // Tree Trunk
                ctx.fillStyle = '#1a0f05';
                ctx.fillRect(t.x - 2, t.y - 5, 4, 10);

                // Tree Foliage (Triangles)
                ctx.beginPath();
                ctx.moveTo(t.x, t.y - t.height);
                ctx.lineTo(t.x - t.width/2, t.y);
                ctx.lineTo(t.x + t.width/2, t.y);
                ctx.closePath();
                ctx.fillStyle = '#0f2a1a';
                ctx.fill();

                // Snow on Branches
                if (branchSnow > 0) {
                    ctx.beginPath();
                    ctx.moveTo(t.x, t.y - t.height - branchSnow);
                    ctx.lineTo(t.x - t.width/2 * 0.8, t.y - t.height * 0.5);
                    ctx.lineTo(t.x + t.width/2 * 0.8, t.y - t.height * 0.5);
                    ctx.closePath();
                    ctx.fillStyle = '#eef';
                    ctx.fill();
                    
                    // Lower branch snow
                    ctx.beginPath();
                    ctx.moveTo(t.x - t.width/2 * 0.5, t.y - t.height * 0.6);
                    ctx.lineTo(t.x - t.width/2, t.y - t.height * 0.2);
                    ctx.lineTo(t.x, t.y - t.height * 0.3);
                    ctx.closePath();
                    ctx.fillStyle = '#eef';
                    ctx.fill();
                }
            });
        }

        function drawGround() {
            const groundY = centerY + radius * 0.45 + snowAccumulation.ground;
            
            // Snowy Ground
            ctx.beginPath();
            ctx.moveTo(centerX - radius, height);
            ctx.quadraticCurveTo(centerX, groundY - 10, centerX + radius, height);
            ctx.fillStyle = '#d0e0ff';
            ctx.fill();
            
            // Shadow under snow
            ctx.beginPath();
            ctx.moveTo(centerX - radius, height);
            ctx.quadraticCurveTo(centerX, groundY - 5, centerX + radius, height);
            ctx.fillStyle = '#a0c0e0';
            ctx.fill();
        }

        function drawGlassOverlay() {
            // Glass Reflection Gradient
            const grad = ctx.createRadialGradient(centerX - radius*0.3, centerY - radius*0.3, radius*0.1, centerX, centerY, radius);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.02)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.15)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // Glass Edge
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(200, 220, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Specular Highlight
            ctx.beginPath();
            ctx.ellipse(centerX - radius*0.4, centerY - radius*0.4, radius*0.15, radius*0.08, Math.PI/4, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fill();
        }

        // Main Loop
        let lastTime = 0;

        function loop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Shake Logic
            let currentShake = 0;
            if (timestamp - lastShakeTime > SHAKE_INTERVAL) {
                if (timestamp - lastShakeTime < SHAKE_INTERVAL + SHAKE_DURATION) {
                    // Ramp up and down
                    const progress = (timestamp - lastShakeTime - SHAKE_INTERVAL) / SHAKE_DURATION;
                    currentShake = Math.sin(progress * Math.PI) * 1.0; // 0 to 1
                } else {
                    lastShakeTime = timestamp;
                }
            }
            shakeIntensity = currentShake;

            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw Scene
            drawBackground();
            drawGround();
            drawCabins();
            drawTrees();

            // Update and Draw Particles
            particles.forEach(p => {
                p.update(dt, shakeIntensity);
                p.draw(ctx);
            });

            // Glass Overlay (drawn over particles to give depth)
            drawGlassOverlay();
            drawGlobeBase();

            requestAnimationFrame(loop);
        }

        // Init
        window.addEventListener('resize', resize);
        resize();
        
        // Init Particles
        for(let i=0; i<PARTICLE_COUNT; i++) {
            particles.push(new SnowParticle());
        }

        requestAnimationFrame(loop);

    </script>
</body>
</html>
