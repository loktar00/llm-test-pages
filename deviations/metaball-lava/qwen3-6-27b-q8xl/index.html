<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lava Lamp</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const offscreen=document.createElement('canvas');
const ictx=offscreen.getContext('2d');
const SCALE=4;
const NUM_BLOBS=10;
const THRESHOLD=1.0;

let W,H,iW,iH;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  iW=Math.ceil(W/SCALE);
  iH=Math.ceil(H/SCALE);
  offscreen.width=iW;
  offscreen.height=iH;
}
window.addEventListener('resize',resize);
resize();

class Blob{
  constructor(){
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.vx=(Math.random()-0.5)*0.5;
    this.vy=(Math.random()-0.5)*0.5;
    this.r=35+Math.random()*35;
    this.temp=0.3+Math.random()*0.4;
    this.phase=Math.random()*Math.PI*2;
    this.freq=0.3+Math.random()*0.5;
  }
  update(dt){
    const ny=this.y/H;
    if(ny>0.85){
      this.temp=Math.min(1,this.temp+dt*0.15);
    }else if(ny<0.15){
      this.temp=Math.max(0,this.temp-dt*0.12);
    }else{
      this.temp+=(0.5-this.temp)*dt*0.05;
    }
    const buoyancy=-this.temp*180+90;
    this.vy+=buoyancy*dt;
    this.vx+=Math.sin(this.phase+performance.now()*0.001*this.freq)*8*dt;
    const drag=0.97;
    this.vx*=drag;
    this.vy*=drag;
    this.x+=this.vx*dt;
    this.y+=this.vy*dt;
    if(this.x<this.r){this.x=this.r;this.vx*=-0.5;}
    if(this.x>W-this.r){this.x=W-this.r;this.vx*=-0.5;}
    if(this.y<this.r){this.y=this.r;this.vy*=-0.3;}
    if(this.y>H-this.r){this.y=H-this.r;this.vy*=-0.3;}
  }
}

const blobs=[];
for(let i=0;i<NUM_BLOBS;i++) blobs.push(new Blob());

const imgData=ictx.createImageData(iW,iH);
const data=imgData.data;
const r2=new Float32Array(NUM_BLOBS);
const bx=new Float32Array(NUM_BLOBS);
const by=new Float32Array(NUM_BLOBS);

function renderField(){
  for(let i=0;i<NUM_BLOBS;i++){
    bx[i]=blobs[i].x/SCALE;
    by[i]=blobs[i].y/SCALE;
    r2[i]=blobs[i].r/SCALE;
    r2[i]=r2[i]*r2[i];
  }
  const iw=1/iW, ih=1/iH;
  const invScale=1/SCALE;
  for(let y=0;y<iH;y++){
    const py=y*SCALE;
    for(let x=0;x<iW;x++){
      const px=x*SCALE;
      let field=0;
      for(let i=0;i<NUM_BLOBS;i++){
        const dx=px-bx[i];
        const dy=py-by[i];
        const dist2=dx*dx+dy*dy;
        if(dist2<r2[i]*16){
          field+=r2[i]/(dist2+1);
        }
      }
      const idx=(y*iW+x)*4;
      if(field>THRESHOLD){
        const t=Math.min(1,(field-THRESHOLD)/2.5);
        const t2=t*t;
        const t3=t2*t;
        const edge=1-t;
        const r=Math.floor(15+140*t+80*t2+60*t3);
        const g=Math.floor(5+20*t+80*t2+100*t3);
        const b=Math.floor(5+10*t+30*t2+40*t3);
        const glow=Math.pow(edge,0.5)*0.3;
        data[idx]=Math.min(255,r+Math.floor(glow*40));
        data[idx+1]=Math.min(255,g+Math.floor(glow*15));
        data[idx+2]=Math.min(255,b+Math.floor(glow*5));
        data[idx+3]=255;
      }else{
        const bg=0.02*field;
        data[idx]=Math.floor(8+bg*30);
        data[idx+1]=Math.floor(3+bg*10);
        data[idx+2]=Math.floor(5+bg*15);
        data[idx+3]=255;
      }
    }
  }
  ictx.putImageData(imgData,0,0);
}

function drawLampGlass(){
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'rgba(15,5,20,0.15)');
  grad.addColorStop(0.5,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(15,5,20,0.15)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  const edgeGrad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.min(W,H)*0.7);
  edgeGrad.addColorStop(0,'rgba(0,0,0,0)');
  edgeGrad.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=edgeGrad;
  ctx.fillRect(0,0,W,H);
}

let lastTime=performance.now();

function frame(now){
  const dt=Math.min(0.05,(now-lastTime)/1000);
  lastTime=now;
  for(const b of blobs) b.update(dt);
  renderField();
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(offscreen,0,0,W,H);
  drawLampGlass();
  const highlightGrad=ctx.createLinearGradient(W*0.3,0,W*0.5,0);
  highlightGrad.addColorStop(0,'rgba(255,200,150,0)');
  highlightGrad.addColorStop(0.5,'rgba(255,200,150,0.03)');
  highlightGrad.addColorStop(1,'rgba(255,200,150,0)');
  ctx.fillStyle=highlightGrad;
  ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
