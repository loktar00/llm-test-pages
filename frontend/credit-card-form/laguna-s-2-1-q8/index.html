<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Credit Card Form</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --light: #f8fafc;
    --dark: #0f172a;
    --gray: #94a3b8;
    --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
                     0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    display: flex;
    gap: 40px;
    width: 100%;
    max-width: 900px;
  }

  .card-preview {
    perspective: 1200px;
    flex: 1;
    display: flex;
    justify-content: center;
  }

  .card-inner {
    position: relative;
    width: 100%;
    max-width: 340px;
    height: 200px;
    transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    transform-style: preserve-3d;
    transform: rotateY(0deg);
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    backface-visibility: hidden;
    box-shadow: var(--card-shadow);
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--light);
  }

  .card-front {
    background: linear-gradient(145deg, #1e3a8a 0%, #1e40af 40%, #2563eb 100%);
  }

  .card-back {
    background: linear-gradient(145deg, #1e40af 0%, #1e3a8a 100%);
    transform: rotateY(180deg);
    padding-top: 24px;
    padding-bottom: 24px;
  }

  .card-front::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 20px;
    background: linear-gradient(
      120deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.1) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    z-index: 1;
    pointer-events: none;
    animation: sheen 4s infinite;
  }

  .card-back::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 20px;
    background: linear-gradient(
      120deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.08) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    z-index: 1;
    pointer-events: none;
    animation: sheen 4s infinite;
  }

  @keyframes sheen {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }

  .brand-mark {
    width: 60px;
    height: 40px;
    position: relative;
    margin-bottom: 20px;
  }

  .brand-mark::before,
  .brand-mark::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    border: 3px solid var(--light);
    border-radius: 50%;
    top: 0;
  }

  .brand-mark::before {
    left: 0;
  }

  .brand-mark::after {
    left: 24px;
    box-shadow: 0 0 0 4px var(--light);
  }

  .card-number {
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 2px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    z-index: 2;
  }

  .card-details {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 2;
  }

  .card-name {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.9;
  }

  .card-expiry {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    opacity: 0.95;
  }

  .cvc-back {
    position: absolute;
    top: 40px;
    right: 24px;
    background: #1e293b;
    border-radius: 6px;
    padding: 8px 12px;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--dark);
    min-width: 70px;
    text-align: right;
    z-index: 2;
  }

  .form-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--dark);
    letter-spacing: 0.5px;
  }

  .form-group input {
    padding: 14px 16px;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background: white;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
  }

  .form-group input:focus + .field-name {
    color: var(--primary);
  }

  .card-form {
    background: white;
    padding: 32px;
    border-radius: 20px;
    box-shadow: var(--card-shadow);
  }

  .form-row {
    display: flex;
    gap: 16px;
  }

  .form-row .form-group {
    flex: 1;
  }

  .submit-btn {
    margin-top: 8px;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .field-name {
    position: absolute;
    left: 16px;
    top: 36px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray);
    transition: color 0.2s ease, top 0.2s ease, font-size 0.2s ease;
    pointer-events: none;
  }

  .form-group input:focus + .field-name,
  .form-group input:not(:placeholder-shown) + .field-name {
    top: 8px;
    font-size: 11px;
    color: var(--primary);
  }

  .form-group input {
    padding-top: 22px;
  }

  .input-wrapper {
    position: relative;
  }

  .input-wrapper .field-name {
    left: 16px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card-preview">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="brand-mark"></div>
          <div class="card-number" id="cardNumber">#### #### #### ####</div>
          <div class="card-details">
            <div class="card-name" id="cardName">NAME</div>
            <div class="card-expiry" id="cardExpiry">##/##</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="cvc-back" id="cardCvc">CVC</div>
        </div>
      </div>
    </div>

    <form class="card-form" id="paymentForm">
      <div class="form-group">
        <div class="input-wrapper">
          <input type="text" id="numberInput" placeholder=" " maxlength="19" />
          <label class="field-name">Card Number</label>
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <input type="text" id="nameInput" placeholder=" " />
          <label class="field-name">Cardholder Name</label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <div class="input-wrapper">
            <input type="text" id="expiryInput" placeholder=" " maxlength="5" />
            <label class="field-name">Expiry Date</label>
          </div>
        </div>
        <div class="form-group">
          <div class="input-wrapper">
            <input type="text" id="cvcInput" placeholder=" " maxlength="4" />
            <label class="field-name">CVC</label>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Pay Now</button>
    </form>
  </div>

<script>
  const numberInput = document.getElementById('numberInput');
  const nameInput = document.getElementById('nameInput');
  const expiryInput = document.getElementById('expiryInput');
  const cvcInput = document.getElementById('cvcInput');
  const cardInner = document.getElementById('cardInner');
  const cardNumber = document.getElementById('cardNumber');
  const cardName = document.getElementById('cardName');
  const cardExpiry = document.getElementById('cardExpiry');
  const cardCvc = document.getElementById('cardCvc');

  function formatCardNumber(value) {
    const digits = value.replace(/\D/g, '');
    const groups = [];
    for (let i = 0; i < digits.length; i += 4) {
      groups.push(digits.slice(i, i + 4));
    }
    return groups.join(' ');
  }

  function updateCardNumber(e) {
    const input = e.target;
    const cursorPos = input.selectionStart;
    const rawValue = input.value.replace(/\s/g, '');
    const rawCursorPos = cursorPos - (input.value.substring(0, cursorPos).match(/ /g) || []).length;

    const formatted = formatCardNumber(rawValue);
    input.value = formatted;

    const spacesBefore = (formatted.substring(0, rawCursorPos).match(/ /g) || []).length;
    input.setSelectionRange(rawCursorPos + spacesBefore, rawCursorPos + spacesBefore);

    let displayNumber = formatted || '#### #### #### ####';
    cardNumber.textContent = displayNumber;
  }

  function updateCardName(e) {
    let value = e.target.value.toUpperCase();
    cardName.textContent = value || 'NAME';
  }

  function updateCardExpiry(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length >= 2) {
      value = value.substring(0, 2) + '/' + value.substring(2, 4);
    }
    e.target.value = value;
    cardExpiry.textContent = value || '##/##';
  }

  function updateCardCvc(e) {
    let value = e.target.value.replace(/\D/g, '');
    cardCvc.textContent = value || 'CVC';
  }

  function flipCard(showBack) {
    if (showBack) {
      cardInner.classList.add('flipped');
    } else {
      cardInner.classList.remove('flipped');
    }
  }

  numberInput.addEventListener('input', updateCardNumber);
  nameInput.addEventListener('input', updateCardName);
  expiryInput.addEventListener('input', updateCardExpiry);
  cvcInput.addEventListener('input', function(e) {
    updateCardCvc(e);
    flipCard(true);
  });

  cvcInput.addEventListener('blur', function() {
    flipCard(false);
  });

  cvcInput.addEventListener('focus', function() {
    flipCard(true);
  });

  numberInput.addEventListener('blur', function() {
    flipCard(false);
  });

  nameInput.addEventListener('blur', function() {
    flipCard(false);
  });

  expiryInput.addEventListener('blur', function() {
    flipCard(false);
  });

  nameInput.addEventListener('focus', function() {
    if (!cvcInput.matches(':focus')) flipCard(false);
  });

  expiryInput.addEventListener('focus', function() {
    if (!cvcInput.matches(':focus')) flipCard(false);
  });
</script>
</body>
</html>
