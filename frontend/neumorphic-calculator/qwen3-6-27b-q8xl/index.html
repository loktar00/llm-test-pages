<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Calculator</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-main: #4d5b7c;
            --text-sec: #9baacf;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #6d5dfc;
            --accent-glow: rgba(109, 93, 252, 0.4);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevent text selection on rapid clicks */
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-family);
        }

        .calculator {
            width: 340px;
            padding: 25px;
            border-radius: 30px;
            background-color: var(--bg-color);
            box-shadow: 
                9px 9px 16px var(--shadow-dark), 
                -9px -9px 16px var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Display Screen */
        .display-container {
            height: 80px;
            margin-bottom: 10px;
        }

        .display {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            border-radius: 15px;
            /* Inner shadow for the "extruded" recess look */
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark), 
                inset -6px -6px 12px var(--shadow-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 0 25px;
            overflow: hidden;
            color: var(--text-main);
        }

        .previous-operand {
            font-size: 0.9rem;
            color: var(--text-sec);
            min-height: 1.2rem;
            margin-bottom: 5px;
        }

        .current-operand {
            font-size: 2rem;
            font-weight: 600;
            word-wrap: break-word;
            word-break: break-all;
            text-align: right;
            transition: font-size 0.2s ease;
        }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            height: 60px;
            border-radius: 12px;
            border: none;
            outline: none;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            /* Raised state */
            box-shadow: 
                6px 6px 10px var(--shadow-dark), 
                -6px -6px 10px var(--shadow-light);
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pressed State (Active) */
        button:active, button.active {
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.95);
        }

        /* Specific Button Styles */
        .span-two {
            grid-column: span 2;
        }

        .btn-op {
            color: var(--accent);
            font-size: 1.4rem;
        }

        .btn-eq {
            color: var(--accent);
            background-color: var(--bg-color); /* Keep bg consistent for neumorphism */
            border: 1px solid rgba(109, 93, 252, 0.1);
        }
        
        .btn-eq:hover {
            color: #fff;
            background-color: var(--accent);
            box-shadow: 
                0px 0px 15px var(--accent-glow),
                6px 6px 10px var(--shadow-dark);
        }
        
        .btn-eq:active, .btn-eq.active {
             background-color: var(--accent);
             color: #fff;
             box-shadow: 
                inset 4px 4px 8px rgba(0,0,0,0.2), 
                inset -4px -4px 8px rgba(255,255,255,0.1);
        }

        .btn-ac {
            color: #ff5e57;
        }

        /* Animation for keyboard feedback */
        @keyframes pressAnim {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        
        .key-pressed {
            animation: pressAnim 0.2s ease;
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
        }

    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container">
            <div class="display">
                <div class="previous-operand" data-previous></div>
                <div class="current-operand" data-current>0</div>
            </div>
        </div>
        <div class="keypad">
            <button class="btn-ac" data-action="clear">AC</button>
            <button class="btn-op" data-action="delete">DEL</button>
            <button class="btn-op" data-operation="%">%</button>
            <button class="btn-op" data-operation="÷">÷</button>
            
            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="btn-op" data-operation="*">×</button>
            
            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="btn-op" data-operation="-">−</button>
            
            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="btn-op" data-operation="+">+</button>
            
            <button class="span-two" data-number="0">0</button>
            <button data-number=".">.</button>
            <button class="btn-eq" data-action="equals">=</button>
        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandTextElement, currentOperandTextElement) {
                this.previousOperandTextElement = previousOperandTextElement;
                this.currentOperandTextElement = currentOperandTextElement;
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.resetScreen = false;
            }

            delete() {
                if (this.resetScreen) return;
                if (this.currentOperand === '0') return;
                this.currentOperand = this.currentOperand.toString().slice(0, -1);
                if (this.currentOperand === '') this.currentOperand = '0';
            }

            appendNumber(number) {
                if (this.resetScreen) {
                    this.currentOperand = '';
                    this.resetScreen = false;
                }
                if (number === '.' && this.currentOperand.includes('.')) return;
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
            }

            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '*':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            alert("Cannot divide by zero");
                            this.clear();
                            return;
                        }
                        computation = prev / current;
                        break;
                    case '%':
                        computation = prev % current;
                        break;
                    default:
                        return;
                }
                this.currentOperand = computation;
                this.operation = undefined;
                this.previousOperand = '';
                this.resetScreen = true;
            }

            getDisplayNumber(number) {
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                let integerDisplay;
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
                }
                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            updateDisplay() {
                this.currentOperandTextElement.innerText = this.getDisplayNumber(this.currentOperand);
                
                // Auto-shrink font size for long numbers
                const length = this.currentOperand.toString().length;
                if (length > 10) {
                    this.currentOperandTextElement.style.fontSize = '1.2rem';
                } else if (length > 7) {
                    this.currentOperandTextElement.style.fontSize = '1.6rem';
                } else {
                    this.currentOperandTextElement.style.fontSize = '2rem';
                }

                if (this.operation != null) {
                    this.previousOperandTextElement.innerText = 
                        `${this.getDisplayNumber(this.previousOperand)} ${this.operation}`;
                } else {
                    this.previousOperandTextElement.innerText = '';
                }
            }
        }

        const numberButtons = document.querySelectorAll('[data-number]');
        const operationButtons = document.querySelectorAll('[data-operation]');
        const equalsButton = document.querySelector('[data-action="equals"]');
        const deleteButton = document.querySelector('[data-action="delete"]');
        const allClearButton = document.querySelector('[data-action="clear"]');
        const previousOperandTextElement = document.querySelector('[data-previous]');
        const currentOperandTextElement = document.querySelector('[data-current]');

        const calculator = new Calculator(previousOperandTextElement, currentOperandTextElement);

        // Helper to trigger visual press effect
        function triggerVisualPress(selector) {
            const btn = document.querySelector(selector);
            if(btn) {
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 100);
            }
        }

        numberButtons.forEach(button => {
            button.addEventListener('click', () => {
                calculator.appendNumber(button.dataset.number);
                calculator.updateDisplay();
            });
        });

        operationButtons.forEach(button => {
            button.addEventListener('click', () => {
                calculator.chooseOperation(button.dataset.operation);
                calculator.updateDisplay();
            });
        });

        equalsButton.addEventListener('click', () => {
            calculator.compute();
            calculator.updateDisplay();
        });

        allClearButton.addEventListener('click', () => {
            calculator.clear();
            calculator.updateDisplay();
        });

        deleteButton.addEventListener('click', () => {
            calculator.delete();
            calculator.updateDisplay();
        });

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            let key = e.key;
            
            // Map keys to buttons for visual effect and logic
            if (key >= '0' && key <= '9') {
                calculator.appendNumber(key);
                triggerVisualPress(`[data-number="${key}"]`);
            }
            if (key === '.') {
                calculator.appendNumber('.');
                triggerVisualPress(`[data-number="."]`);
            }
            if (key === '=' || key === 'Enter') {
                e.preventDefault(); // Prevent default form submission if any
                calculator.compute();
                triggerVisualPress(`[data-action="equals"]`);
            }
            if (key === 'Backspace') {
                calculator.delete();
                triggerVisualPress(`[data-action="delete"]`);
            }
            if (key === 'Escape') {
                calculator.clear();
                triggerVisualPress(`[data-action="clear"]`);
            }
            if (key === '+' || key === '-' || key === '*' || key === '/' || key === '%') {
                let op = key;
                if (op === '/') op = '÷';
                calculator.chooseOperation(op);
                // Find button based on operation symbol
                const btn = document.querySelector(`[data-operation="${op}"]`);
                if(btn) triggerVisualPress(`[data-operation="${op}"]`);
            }

            calculator.updateDisplay();
        });

    </script>
</body>
</html>
