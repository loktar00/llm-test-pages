<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Heightmap</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        function diamondSquare(size) {
            const map = new Array(size);
            for (let i = 0; i < size; i++) {
                map[i] = new Array(size);
            }

            const roughness = 0.5;

            // Initialize corners
            map[0][0] = Math.random();
            map[0][size - 1] = Math.random();
            map[size - 1][0] = Math.random();
            map[size - 1][size - 1] = Math.random();

            function squareStep(x1, y1, x2, y2, size) {
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                const average = (map[x1][y1] + map[x1][y2] + map[x2][y1] + map[x2][y2]) / 4;
                const randomOffset = (Math.random() * 2 - 1) * Math.pow(roughness, size);
                map[midX][midY] = average + randomOffset;
            }

            function diamondStep(x1, y1, x2, y2, size) {
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                const average = (map[x1][y1] + map[x1][y2] + map[x2][y1] + map[x2][y2]) / 4;
                const randomOffset = (Math.random() * 2 - 1) * Math.pow(roughness, size);
                map[midX][midY] = average + randomOffset;
            }

            function step(x1, y1, x2, y2, size) {
                diamondStep(x1, y1, x2, y2, size);
                squareStep(x1, y1, x2, y2, size);
            }

            let currentSize = size - 1;
            while (currentSize > 1) {
                const nextSize = Math.floor(currentSize / 2);
                for (let x = 0; x < size - 1; x += currentSize) {
                    for (let y = 0; y < size - 1; y += currentSize) {
                        step(x, y, x + currentSize, y + currentSize, nextSize);
                    }
                }
                currentSize = nextSize;
            }

            // Normalize height data to 0-1 range
            let min = Infinity, max = -Infinity;
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    if (map[x][y] < min) min = map[x][y];
                    if (map[x][y] > max) max = map[x][y];
                }
            }
            const range = max - min;
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    map[x][y] = (map[x][y] - min) / range;
                }
            }

            return map;
        }

        function applyColors(map, size) {
            const canvas = document.getElementById('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(size, size);
            const data = imageData.data;

            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    const height = map[x][y];
                    let r, g, b;

                    if (height < 0.3) {
                        // Deep water
                        r = 0;
                        g = 0;
                        b = 200;
                    } else if (height < 0.35) {
                        // Shallow water
                        r = 0;
                        g = 100;
                        b = 200;
                    } else if (height < 0.4) {
                        // Beach
                        r = 244;
                        g = 242;
                        b = 199;
                    } else if (height < 0.7) {
                        // Grass
                        r = 0;
                        g = 200;
                        b = 0;
                    } else if (height < 0.85) {
                        // Rock
                        r = 100;
                        g = 100;
                        b = 100;
                    } else {
                        // Snow
                        r = 255;
                        g = 255;
                        b = 255;
                    }

                    const index = (y * size + x) * 4;
                    data[index] = r;     // Red
                    data[index + 1] = g; // Green
                    data[index + 2] = b; // Blue
                    data[index + 3] = 255; // Alpha
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }

        const map = diamondSquare(512);
        applyColors(map, 512);
    </script>
</body>
</html>
