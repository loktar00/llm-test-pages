<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<style>
    :root {
        --bg-day-top: #4facfe;
        --bg-day-bot: #00f2fe;
        --bg-night-top: #0f2027;
        --bg-night-bot: #203a43;
        --glass: rgba(255, 255, 255, 0.2);
        --glass-border: rgba(255, 255, 255, 0.4);
        --text: #ffffff;
        --text-dim: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        transition: background 1s ease;
        background: linear-gradient(to bottom, var(--bg-day-top), var(--bg-day-bot));
    }

    /* Day/Night Logic handled by JS adding class, but CSS handles the gradient */
    body.night {
        background: linear-gradient(to bottom, var(--bg-night-top), var(--bg-night-bot));
    }

    .card {
        width: 380px;
        height: 700px;
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 30px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        padding: 25px;
        display: flex;
        flex-direction: column;
        color: var(--text);
        position: relative;
        overflow: hidden;
    }

    /* --- Header & Toggle --- */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .location { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }
    .date { font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; }

    .toggle-btn {
        background: rgba(255,255,255,0.15);
        border: none;
        color: white;
        padding: 8px 12px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.3); }

    /* --- Main Scene (Sun behind Cloud) --- */
    .scene {
        height: 180px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        margin: 10px 0 20px 0;
    }

    .sun {
        width: 80px;
        height: 80px;
        background: radial-gradient(circle, #ffd700, #ff8c00);
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
        position: absolute;
        top: 20px;
        z-index: 1;
        animation: sunPulse 4s infinite alternate ease-in-out;
    }

    @keyframes sunPulse {
        0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        100% { transform: scale(1.1); box-shadow: 0 0 60px rgba(255, 215, 0, 0.8); }
    }

    .cloud {
        width: 140px;
        height: 50px;
        background: #fff;
        border-radius: 50px;
        position: absolute;
        z-index: 2;
        bottom: 30px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        animation: cloudFloat 6s infinite ease-in-out;
    }

    .cloud::after, .cloud::before {
        content: '';
        position: absolute;
        background: #fff;
        border-radius: 50%;
    }
    .cloud::after { width: 60px; height: 60px; top: -30px; left: 20px; }
    .cloud::before { width: 40px; height: 40px; top: -20px; left: 70px; }

    @keyframes cloudFloat {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(10px); }
    }

    /* --- Current Weather --- */
    .current-weather {
        text-align: center;
        margin-bottom: 30px;
        position: relative;
    }

    .temp-container {
        position: relative;
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .temp {
        font-size: 5rem;
        font-weight: 200;
        line-height: 1;
        position: absolute;
        transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.4s;
    }

    .temp.up { transform: translateY(-100%); opacity: 0; }
    .temp.down { transform: translateY(100%); opacity: 0; }

    .condition {
        font-size: 1.2rem;
        color: var(--text-dim);
        margin-top: -10px;
        text-transform: capitalize;
    }

    /* --- Hourly Strip --- */
    .hourly {
        display: flex;
        overflow-x: auto;
        scroll-behavior: smooth;
        gap: 20px;
        padding: 10px 5px;
        margin-bottom: 20px;
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE */
    }
    .hourly::-webkit-scrollbar { display: none; }

    .hour-item {
        min-width: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-radius: 15px;
        background: rgba(255,255,255,0.1);
        transition: background 0.3s;
    }
    .hour-item:hover { background: rgba(255,255,255,0.2); }
    .hour-time { font-size: 0.8rem; font-weight: 600; }
    
    /* Hourly Icon: Rain */
    .mini-rain {
        width: 20px;
        height: 20px;
        position: relative;
    }
    .cloud-small {
        width: 20px; height: 8px; background: white; border-radius: 10px;
    }
    .rain-drop {
        width: 2px; height: 6px; background: #aaddff;
        position: absolute; bottom: -6px; left: 4px;
        animation: rainFall 0.8s infinite linear;
    }
    .rain-drop:nth-child(2) { left: 10px; animation-delay: 0.2s; }
    .rain-drop:nth-child(3) { left: 16px; animation-delay: 0.4s; }

    @keyframes rainFall {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(10px); opacity: 0; }
    }

    /* --- 5-Day Forecast --- */
    .forecast {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
    }

    .forecast-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .f-day { width: 80px; font-weight: 600; }
    .f-icon { flex: 1; display: flex; justify-content: center; }
    .f-temp { width: 60px; text-align: right; font-weight: 600; }
    .f-temp span { font-size: 0.8em; color: var(--text-dim); margin-left: 5px; }

    /* Forecast Icon: Sun Rays */
    .mini-sun {
        width: 24px; height: 24px;
        background: #ffd700;
        border-radius: 50%;
        position: relative;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    .mini-sun::after {
        content: '';
        position: absolute;
        top: -6px; left: -6px; right: -6px; bottom: -6px;
        border: 2px dashed rgba(255, 215, 0, 0.6);
        border-radius: 50%;
        animation: rotateRays 10s linear infinite;
    }

    @keyframes rotateRays {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* Forecast Icon: Cloud */
    .mini-cloud {
        width: 24px; height: 10px; background: white; border-radius: 10px;
        position: relative;
    }
    .mini-cloud::after {
        content:''; width: 12px; height: 12px; background: white;
        position: absolute; top: -6px; left: 3px; border-radius: 50%;
    }

</style>
</head>
<body>

<div class="card">
    <div class="header">
        <div>
            <div class="location">San Francisco, CA</div>
            <div class="date" id="currentDate">Mon, 12 Oct</div>
        </div>
        <button class="toggle-btn" onclick="toggleUnit()">
            <span id="unitLabel">°C</span>
        </button>
    </div>

    <div class="scene" id="scene">
        <div class="sun"></div>
        <div class="cloud"></div>
    </div>

    <div class="current-weather">
        <div class="temp-container">
            <div class="temp" id="mainTemp">22°</div>
        </div>
        <div class="condition">Partly Cloudy</div>
    </div>

    <div class="hourly" id="hourlyStrip">
        <!-- JS will populate this -->
    </div>

    <div class="forecast" id="forecastList">
        <!-- JS will populate this -->
    </div>
</div>

<script>
    // --- Data ---
    const weatherData = {
        current: { c: 22, f: 72 },
        hourly: [
            { time: 'Now', c: 22, type: 'cloud' },
            { time: '13:00', c: 23, type: 'sun' },
            { time: '14:00', c: 24, type: 'sun' },
            { time: '15:00', c: 22, type: 'rain' },
            { time: '16:00', c: 21, type: 'rain' },
            { time: '17:00', c: 20, type: 'cloud' },
            { time: '18:00', c: 19, type: 'cloud' },
        ],
        forecast: [
            { day: 'Tue', highC: 24, lowC: 18, type: 'sun' },
            { day: 'Wed', highC: 21, lowC: 17, type: 'rain' },
            { day: 'Thu', highC: 22, lowC: 16, type: 'cloud' },
            { day: 'Fri', highC: 25, lowC: 19, type: 'sun' },
            { day: 'Sat', highC: 23, lowC: 18, type: 'rain' },
        ]
    };

    let isCelsius = true;

    // --- Init ---
    function init() {
        updateDate();
        renderHourly();
        renderForecast();
        checkTimeOfDay();
        setInterval(checkTimeOfDay, 60000); // Check every minute
    }

    // --- Time & Background ---
    function updateDate() {
        const now = new Date();
        const options = { weekday: 'short', day: 'numeric', month: 'short' };
        document.getElementById('currentDate').innerText = now.toLocaleDateString('en-US', options);
    }

    function checkTimeOfDay() {
        const hour = new Date().getHours();
        const body = document.body;
        const sun = document.querySelector('.sun');
        
        // Simple logic: 6am to 6pm is day, else night
        if (hour >= 6 && hour < 18) {
            body.classList.remove('night');
            sun.style.opacity = '1';
        } else {
            body.classList.add('night');
            sun.style.opacity = '0.2'; // Dim sun at night
        }
    }

    // --- Rendering ---
    function renderHourly() {
        const container = document.getElementById('hourlyStrip');
        container.innerHTML = '';
        
        weatherData.hourly.forEach(h => {
            const temp = isCelsius ? h.c : Math.round(h.c * 9/5 + 32);
            const unit = isCelsius ? '°C' : '°F';
            
            let iconHtml = '';
            if (h.type === 'rain') {
                iconHtml = `<div class="mini-rain"><div class="cloud-small"></div><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div></div>`;
            } else if (h.type === 'sun') {
                iconHtml = `<div class="mini-sun"></div>`;
            } else {
                iconHtml = `<div class="mini-cloud"></div>`;
            }

            const html = `
                <div class="hour-item">
                    <span class="hour-time">${h.time}</span>
                    ${iconHtml}
                    <span class="hour-time">${temp}${unit}</span>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function renderForecast() {
        const container = document.getElementById('forecastList');
        container.innerHTML = '';

        weatherData.forecast.forEach(d => {
            const high = isCelsius ? d.highC : Math.round(d.highC * 9/5 + 32);
            const low = isCelsius ? d.lowC : Math.round(d.lowC * 9/5 + 32);
            const unit = isCelsius ? '°' : '°';

            let iconHtml = '';
            if (d.type === 'rain') {
                iconHtml = `<div class="mini-rain"><div class="cloud-small"></div><div class="rain-drop"></div><div class="rain-drop"></div></div>`;
            } else if (d.type === 'sun') {
                iconHtml = `<div class="mini-sun"></div>`;
            } else {
                iconHtml = `<div class="mini-cloud"></div>`;
            }

            const html = `
                <div class="forecast-row">
                    <div class="f-day">${d.day}</div>
                    <div class="f-icon">${iconHtml}</div>
                    <div class="f-temp">${high}${unit} <span>${low}${unit}</span></div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    // --- Toggle Logic ---
    function toggleUnit() {
        const mainTempEl = document.getElementById('mainTemp');
        const unitLabel = document.getElementById('unitLabel');
        
        // Animation class
        mainTempEl.classList.add(isCelsius ? 'up' : 'down');

        setTimeout(() => {
            isCelsius = !isCelsius;
            
            // Update Main Temp
            const val = isCelsius ? weatherData.current.c : Math.round(weatherData.current.c * 9/5 + 32);
            mainTempEl.innerText = val + '°';
            unitLabel.innerText = isCelsius ? '°C' : '°F';

            // Update Rest
            renderHourly();
            renderForecast();

            // Remove Animation class
            mainTempEl.classList.remove('up', 'down');
        }, 400); // Wait for CSS transition
    }

    // Run
    init();

</script>
</body>
</html>
