<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina — Day & Night</title>
<style>
  :root {
    /* Light palette — warm, airy */
    --bg-primary: #faf8f5;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #fefefe;
    --text-primary: #1a1a2e;
    --text-secondary: #4a4a6a;
    --text-muted: #8888a0;
    --accent: #e8913a;
    --accent-glow: rgba(232, 145, 58, 0.15);
    --border: rgba(0, 0, 0, 0.06);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
    --gradient-hero: linear-gradient(160deg, #faf8f5 0%, #f0ece4 50%, #e8e0d4 100%);
    --toggle-bg: #f5f0e8;
    --toggle-knob: #e8913a;
    --star-opacity: 0;
    --ray-opacity: 1;
    --crater-opacity: 0;
    --center-glow: rgba(232, 145, 58, 0.12);
    --card-border: rgba(0, 0, 0, 0.05);
  }

  [data-theme="dark"] {
    /* Dark palette — deep, rich, warm-dark */
    --bg-primary: #0f0f1a;
    --bg-secondary: #161625;
    --bg-card: #1a1a2e;
    --bg-card-hover: #1f1f35;
    --text-primary: #e8e6f0;
    --text-secondary: #a8a6b8;
    --text-muted: #6a6880;
    --accent: #f0a050;
    --accent-glow: rgba(240, 160, 80, 0.1);
    --border: rgba(255, 255, 255, 0.06);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.45), 0 4px 12px rgba(0, 0, 0, 0.3);
    --gradient-hero: linear-gradient(160deg, #0f0f1a 0%, #141428 50%, #1a1a35 100%);
    --toggle-bg: #1e1e38;
    --toggle-knob: #f0a050;
    --star-opacity: 1;
    --ray-opacity: 0;
    --crater-opacity: 1;
    --center-glow: rgba(240, 160, 80, 0.08);
    --card-border: rgba(255, 255, 255, 0.05);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Stars background for dark mode */
  .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: var(--star-opacity);
    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.8; }
  }

  /* Navigation */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 1.25rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: transparent;
    transition: background-color 0.6s ease, box-shadow 0.6s ease;
  }

  nav.scrolled {
    background: var(--bg-secondary);
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  [data-theme="dark"] nav.scrolled {
    background: rgba(22, 22, 37, 0.85);
  }

  [data-theme="light"] nav.scrolled {
    background: rgba(255, 255, 255, 0.85);
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    transition: color 0.6s ease;
  }

  .logo span {
    color: var(--accent);
    transition: color 0.6s ease;
  }

  /* Theme Toggle */
  .theme-toggle {
    position: relative;
    width: 64px;
    height: 34px;
    border-radius: 17px;
    background: var(--toggle-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background-color 0.6s ease, border-color 0.6s ease;
    display: flex;
    align-items: center;
    padding: 3px;
    outline: none;
  }

  .theme-toggle:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .toggle-knob {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.6s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }

  [data-theme="light"] .toggle-knob {
    transform: translateX(0);
  }

  [data-theme="dark"] .toggle-knob {
    transform: translateX(30px);
  }

  .toggle-knob svg {
    width: 16px;
    height: 16px;
  }

  /* Icon morph */
  .icon-sun, .icon-moon {
    position: absolute;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .icon-sun {
    opacity: 1;
    transform: scale(1);
  }

  .icon-moon {
    opacity: 0;
    transform: scale(0.5);
  }

  [data-theme="dark"] .icon-sun {
    opacity: 0;
    transform: scale(0.5);
  }

  [data-theme="dark"] .icon-moon {
    opacity: 1;
    transform: scale(1);
  }

  /* Sun rays animation */
  .sun-ray {
    transform-origin: center;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.5s ease;
  }

  [data-theme="dark"] .sun-ray {
    transform: scale(0) rotate(45deg);
    opacity: 0;
  }

  /* Moon craters */
  .crater {
    transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
  }

  [data-theme="light"] .crater {
    opacity: 0;
    transform: scale(0);
  }

  [data-theme="dark"] .crater {
    opacity: 1;
    transform: scale(1);
  }

  /* Hero Section */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6rem 2rem 4rem;
    background: var(--gradient-hero);
    position: relative;
    transition: background 0.8s ease;
  }

  .hero-bg-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
    opacity: var(--center-glow);
    transition: opacity 0.8s ease;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 700px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 1rem;
    border-radius: 100px;
    background: var(--accent-glow);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 2rem;
    transition: background-color 0.6s ease, color 0.6s ease;
  }

  .hero-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .hero h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 1.5rem;
    color: var(--text-primary);
    transition: color 0.6s ease;
  }

  .hero h1 .accent-word {
    background: linear-gradient(135deg, var(--accent), #d4702a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  [data-theme="dark"] .hero h1 .accent-word {
    background: linear-gradient(135deg, #f0a050, #ffcc80);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    font-size: 1.2rem;
    color: var(--text-secondary);
    max-width: 520px;
    margin: 0 auto 2.5rem;
    line-height: 1.7;
    transition: color 0.6s ease;
  }

  .hero-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 2rem;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
  }

  .btn:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(232, 145, 58, 0.3);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(232, 145, 58, 0.4);
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-sm);
  }

  .btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    background: var(--bg-card-hover);
  }

  /* Features Section */
  .features {
    padding: 6rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-header {
    text-align: center;
    margin-bottom: 4rem;
  }

  .section-header h2 {
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    color: var(--text-primary);
    transition: color 0.6s ease;
  }

  .section-header p {
    color: var(--text-secondary);
    font-size: 1.1rem;
    max-width: 500px;
    margin: 0 auto;
    transition: color 0.6s ease;
  }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
  }

  .feature-card {
    background: var(--bg-card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: var(--shadow-sm);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .feature-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .feature-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    background: var(--bg-card-hover);
    border-color: var(--accent-glow);
  }

  .feature-card:hover::before {
    opacity: 1;
  }

  .feature-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--accent-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.25rem;
    transition: background-color 0.6s ease, transform 0.3s ease;
  }

  .feature-card:hover .feature-icon {
    transform: scale(1.05);
  }

  .feature-icon svg {
    width: 24px;
    height: 24px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .feature-card h3 {
    font-size: 1.15rem;
    font-weight: 650;
    margin-bottom: 0.6rem;
    color: var(--text-primary);
    letter-spacing: -0.01em;
    transition: color 0.6s ease;
  }

  .feature-card p {
    color: var(--text-secondary);
    font-size: 0.95rem;
    line-height: 1.65;
    transition: color 0.6s ease;
  }

  /* Stats Section */
  .stats {
    padding: 4rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap:
