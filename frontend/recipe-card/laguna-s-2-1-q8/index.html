<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Card</title>
  <style>
    :root {
      --bg: #fffaf5;
      --card: #ffffff;
      --accent: #e63946;
      --accent-light: #fce8e8;
      --text: #333;
      --muted: #888;
      --shadow: rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .recipe-card {
      max-width: 720px;
      width: 100%;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 32px var(--shadow);
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 220px;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .dish {
      position: absolute;
      bottom: 10px;
      width: 160px;
      height: 90px;
      background: #d4a574;
      border-radius: 50% 50% 0 0;
      box-shadow: inset 0 -10px #b8860b;
    }

    .dish::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 40px;
      background: #fff8e1;
      border: 4px solid #d4a574;
      border-bottom: none;
      border-radius: 50%;
    }

    .dish::after {
      content: '';
      position: absolute;
      top: 10px;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      left: 40px;
    }

    .content { padding: 1.5rem 2rem 2.5rem; }

    h1 {
      margin: 0 0 .4rem;
      font-size: 2rem;
      color: var(--accent);
    }

    .subtitle {
      margin: 0 0 1.4rem;
      color: var(--muted);
      font-size: .95rem;
    }

    .meta {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
    }

    .chip {
      background: var(--accent-light);
      color: var(--accent);
      padding: .35rem .8rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 1.2rem;
      margin: 1.8rem 0 .8rem;
      border-bottom: 2px solid var(--accent-light);
      display: inline-block;
      padding-bottom: .2rem;
    }

    .servings-stepper {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1rem;
      background: #f7f7f7;
      padding: .4rem .8rem;
      border-radius: 8px;
    }

    .servings-stepper button {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .15s;
    }

    .servings-stepper button:hover { transform: scale(1.1); }

    .servings-stepper span {
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }

    ul.ingredients {
      list-style: none;
      padding: 0;
      margin: 0 0 2rem;
    }

    ul.ingredients li {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-bottom: .6rem;
      transition: opacity .3s;
    }

    ul.ingredients input[type="checkbox"] {
      transform: scale(1.3);
      cursor: pointer;
      accent-color: var(--accent);
    }

    ul.ingredients label {
      flex: 1;
      cursor: pointer;
      font-size: .95rem;
    }

    ul.ingredients label.checked {
      text-decoration: line-through;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      animation: strike .4s ease-out;
    }

    @keyframes strike {
      from { text-decoration-thickness: 0; opacity: .7; }
      to { text-decoration-thickness: 2px; opacity: 1; }
    }

    ol.steps {
      counter-reset: step-counter;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ol.steps li {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    ol.steps li::before {
      counter-increment: step-counter;
      content: counter(step-counter);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eee;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: .9rem;
      transition: all .3s ease;
      flex-shrink: 0;
    }

    ol.steps input[type="checkbox"] {
      display: none;
    }

    ol.steps input:checked + ::before,
    ol.steps input:checked + label::before {
      background: var(--accent);
      color: #fff;
    }

    ol.steps label {
      cursor: pointer;
      font-size: .95rem;
      line-height: 1.5;
    }

    ol.steps input:checked + label {
      opacity: .8;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .recipe-card {
        box-shadow: none;
        border-radius: 0;
        max-width: 100%;
      }
      .hero {
        background: #fff;
        border-bottom: 1px solid #ccc;
      }
      .dish { display: none; }
      .servings-stepper { display: none; }
      .ingredients label.checked,
      ol.steps label {
        text-decoration: none !important;
      }
      ol.steps li::before {
        background: var(--accent) !important;
        color: #fff !important;
      }
    }
  </style>
</head>
<body>
  <div class="recipe-card">
    <div class="hero">
      <div class="dish"></div>
    </div>
    <div class="content">
      <h1>Creamy Mushroom Pasta</h1>
      <p class="subtitle">A rich and comforting vegetarian dish ready in under 30 minutes.</p>

      <div class="meta">
        <span class="chip">⏱ 25 min</span>
        <span class="chip">👥 4 servings</span>
        <span class="chip">🔥 Easy</span>
      </div>

      <div class="servings-stepper">
        <button aria-label="decrease" onclick="changeServings(-1)">−</button>
        <span id="servings">4</span>
        <button aria-label="increase" onclick="changeServings(1)">+</button>
      </div>

      <h2 class="section-title">Ingredients</h2>
      <ul class="ingredients" id="ingredients">
        <li><input type="checkbox" onchange="toggleCheck(this)" /><label>200g pasta</label></li>
        <li><input type="checkbox" onchange="toggleCheck(this)" /><label>1 cup mushrooms</label></li>
        <li><input type="checkbox" onchange="toggleCheck(this)" /><label>2 cloves garlic</label></li>
        <li><input type="checkbox" onchange="toggleCheck(this)" /><label>½ cup cream</label></li>
        <li><input type="checkbox" onchange="toggleCheck(this)" /><label>¼ cup parmesan</label></li>
        <li><input type="checkbox" onchange="toggleCheck(this)" /><label>Fresh thyme to taste</label></li>
      </ul>

      <h2 class="section-title">Instructions</h2>
      <ol class="steps" id="steps">
        <li><input type="checkbox" onchange="toggleStep(this)" /><label>Boil pasta until al dente.</label></li>
        <li><input type="checkbox" onchange="toggleStep(this)" /><label>Sauté garlic and mushrooms in olive oil.</label></li>
        <li><input type="checkbox" onchange="toggleStep(this)" /><label>Add cream and thyme; simmer 5 mins.</label></li>
        <li><input type="checkbox" onchange="toggleStep(this)" /><label>Mix in pasta and parmesan. Serve hot.</label></li>
      </ol>
    </div>
  </div>

  <script>
    let baseServings = 4;

    function toggleCheck(cb) {
      const label = cb.nextElementSibling;
      label.classList.toggle("checked", cb.checked);
    }

    function toggleStep(cb) {
      cb.closest("li").classList.toggle("done", cb.checked);
    }

    function changeServings(delta) {
      baseServings = Math.max(1, baseServings + delta);
      document.getElementById("servings").textContent = baseServings;
      scaleQuantities();
    }

    function scaleQuantities() {
      const ratio = baseServings / 4;
      const items = document.querySelectorAll("#ingredients label");
      items.forEach(label => {
        const original = label.getAttribute("data-original") || label.textContent;
        if (!label.hasAttribute("data-original")) {
          label.setAttribute("data-original", original);
        }
        label.textContent = original.replace(/([\d¼⅓½¾⅕⅖⅗⅘⅙⅚⅐⅛⅜⅛\d.]+(?:\s?[a-zA-Z%]+)?)/g, match => {
          const numberPart = parseFloat(match);
          if (isNaN(numberPart)) return match;
          const scaled = numberPart * ratio;
          const rounded = Math.round(scaled * 100) / 100;
          return rounded.toString().replace(/\.?0+$/, "") + match.replace(/^[\d.]+/, "");
        });
      });
    }
  </script>
</body>
</html>
