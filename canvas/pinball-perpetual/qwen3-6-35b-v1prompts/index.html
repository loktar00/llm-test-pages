<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Pinball</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ��── Responsive sizing ��──
let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initTable();
}
window.addEventListener('resize', resize);

// ��── Constants ��──
const G = 980;
const REST = 0.35;
const FRICTION = 0.999;
const SUB = 5;
const MAX_V = 1400;
const FLIPPER_LEN = 72;
const FLIPPER_W = 13;
const FLIPPER_SPD = 9.5;

// ��── Table geometry (in table coords) ��──
let T = { x:0, y:0, w:0, h:0, scale:1 };
const TW = 420, TH = 760;

function initTable() {
    const pad = 10;
    const aw = W - pad * 2;
    const ah = H - pad * 2;
    const sx = aw / TW, sy = ah / TH;
    T.scale = Math.min(sx, sy);
    T.w = TW * T.scale;
