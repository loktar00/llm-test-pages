<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Jellyfish</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        button {
            padding: 10px 20px;
            font-family: sans-serif;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <button onclick="drawScene()">Regenerate</button>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let width, height;

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            drawScene();
        }
        window.addEventListener('resize', resize);

        /**
         * 1. midpointDisplacement(power, displacement)
         * Returns an array of numeric points using the midpoint displacement algorithm.
         * The array size is based on 2^power + 1.
         */
        function midpointDisplacement(power, displacement) {
            const size = Math.pow(2, power) + 1;
            const points = new Array(size);
            
            // Initialize endpoints
            points[0] = Math.random() * displacement - (displacement / 2);
            points[size - 1] = Math.random() * displacement - (displacement / 2);

            let step = size - 1;
            let halfStep;
            let currentDisplacement = displacement;

            while (step > 1) {
                halfStep = step / 2;
                for (let i = 0; i < size - 1; i += step) {
                    const p1 = points[i];
                    const p2 = points[i + step];
                    // Midpoint with random displacement
                    const mid = (p1 + p2) / 2 + (Math.random() * currentDisplacement - (currentDisplacement / 2));
                    points[i + halfStep] = mid;
                }
                step /= 2;
                currentDisplacement *= 0.5; // Damping factor
            }
            return points;
        }

        /**
         * 2. smoothPoints(points, passes)
         * Smooths the point array by averaging neighboring values.
         */
        function smoothPoints(points, passes) {
            let p = [...points];
            for (let k = 0; k < passes; k++) {
                for (let i = 1; i < p.length - 1; i++) {
                    p[i] = (p[i - 1] + p[i] + p[i + 1]) / 3;
                }
            }
            return p;
        }

        /**
         * 3. drawBackground(ctx, w, h)
         * Draws a soft deep-sea gradient background.
         */
        function drawBackground(ctx, w, h) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#001e2d"); // Deep Cyan
            grad.addColorStop(0.5, "#00121e"); // Darker Blue
            grad.addColorStop(1, "#000508"); // Almost Black
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
        }

        /**
         * 4. drawJellyfishBell(ctx, cx, cy, width, height)
         * Draws the main translucent dome using noisy points.
         */
        function drawJellyfishBell(ctx, cx, cy, width, height) {
            // Noise generation parameters
            const noiseLevel = 0.15; 
            const power = 7; // 128 segments
            const rawNoise = midpointDisplacement(power, noiseLevel * height);
            const smoothNoise = smoothPoints(rawNoise, 3);

            const steps = smoothNoise.length;
            const xRadius = width / 2;
            const yRadius = height / 2;
            
            ctx.beginPath();
            
            // Draw Upper Dome (using noise for organic bumps)
            for (let i = 0; i < steps; i++) {
                const t = i / (steps - 1); // 0 to 1
                const angle = Math.PI * t; // PI to 0 for top half
                
                // Base circle/ellipse position
                const bx = cx + Math.cos(angle) * xRadius;
                const by = cy + Math.sin(angle) * yRadius;
                
                // Apply noise (offset from the perfect curve)
                // We map noise to X slightly to make it look bumpy
                const xOff = smoothNoise[i] * (width * 0.1); 
                
                if (i === 0) {
                    ctx.moveTo(bx + xOff, by);
                } else {
                    ctx.lineTo(bx + xOff, by);
                }
            }

            // Draw Lower Underside (The opening of the bell)
            // We create a "skirt" effect.
            // We go from right to left along the bottom.
            
            // Calculate skirt width (opening)
            const openingWidth = xRadius * 1.8; 
            const skirtDepth = height * 0.2;

            // Start from right edge
            const startX = cx + openingWidth;
            const startY = cy + (yRadius * 0.5); // Lower part of ellipse

            ctx.lineTo(startX, startY);

            // Create a curved bottom using Bezier curves for smoothness
            // Control points to create a scalloped/soft bottom
            const cp1x = cx + (xRadius * 0.8);
            const cp1y = cy + (yRadius * 0.8);
            const cp2x = cx;
            const cp2y = cy + skirtDepth;
            const cp3x = cx - (xRadius * 0.8);
            const cp3y = cy + (yRadius * 0.8);

            ctx.quadraticCurveTo(cp1x, cp1y, startX, startY); // Just ensuring path logic
            
            // Actually, let's construct the bottom path manually to connect the ends
            // The loop above went from Left (PI) to Right (0).
            // Now we draw a curve back to the Left.
            
            // Define control points for the bottom lobe
            // We want a slight dip in the center
            const midBottom = cy + (yRadius * 0.6);
            
            // Right side curve
            ctx.quadraticCurveTo(cx + xRadius * 0.5, cy + yRadius * 0.8, cx - xRadius, cy + yRadius * 0.5);

            ctx.closePath();

            // Fill with Glassy Gradient
            const grad = ctx.createRadialGradient(cx, cy - height * 0.2, height * 0.1, cx, cy, height);
            grad.addColorStop(0, "rgba(255, 255, 255, 0.4)"); // Highlight top
            grad.addColorStop(0.4, "rgba(100, 200, 255, 0.1)"); // Translucent Cyan
            grad.addColorStop(1, "rgba(0, 50, 100, 0.05)"); // Transparent edge
            
            ctx.fillStyle = grad;
            ctx.fill();

            // Stroke the edge
            ctx.strokeStyle = "rgba(150, 220, 255, 0.5)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        /**
         * 5. drawUnderside(ctx, cx, cy, width, height)
         * Draws the softer underside hanging slightly below the bell.
         */
        function drawUnderside(ctx, cx, cy, width, height) {
            const yRadius = height / 2;
            const xRadius = width / 2;
            const skirtY = cy + (yRadius * 0.5);
            const skirtW = xRadius * 1.8;

            ctx.beginPath();
            ctx.moveTo(cx - skirtW, skirtY);
            ctx.quadraticCurveTo(cx, skirtY + height * 0.15, cx + skirtW, skirtY);
            
            ctx.strokeStyle = "rgba(100, 200, 255, 0.3)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        /**
         * 6. drawInnerRibs(ctx, cx, cy, width, height)
         * Draws subtle curved rib or fold lines inside the bell.
         */
        function drawInnerRibs(ctx, cx, cy, width, height) {
            const yRadius = height / 2;
            const xRadius = width / 2;
            const ribCount = 7;

            ctx.lineWidth = 1.5;
            
            for (let i = 1; i < ribCount; i++) {
                const t = i / ribCount;
                const xOffset = (t - 0.5) * (xRadius * 1.6);
                
                // Curve from top of bell down to the center opening
                ctx.beginPath();
                ctx.moveTo(cx + xOffset, cy - (yRadius * 0.2) + (Math.random() * 5));
                ctx.quadraticCurveTo(
                    cx + xOffset * 1.5, 
                    cy + yRadius * 0.2, 
                    cx, 
                    cy + yRadius * 0.5
                );
                
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + (Math.random() * 0.1)})`;
                ctx.stroke();
            }
        }

        /**
         * 7. drawTentacle(ctx, startX, startY, length, sway, thickness)
         * Draws one flowing tentacle using a wavy curve.
         */
        function drawTentacle(ctx, startX, startY, length, sway, thickness) {
            ctx.beginPath();
            ctx.moveTo(startX, startY);

            const segments = 20;
            const stepY = length / segments;

            // Generate a deterministic noise path
            const noise1 = Math.random() * 100;
            const noise2 = Math.random() * 100;

            for (let i = 1; i <= segments; i++) {
                const y = startY + (stepY * i);
                // Sine wave + random drift
                const x = startX + Math.sin((i * sway) + noise1) * (sway * 5) + (Math.sin(i * 0.5 + noise2) * 10);
                ctx.lineTo(x, y);
            }

            ctx.strokeStyle = `rgba(180, 220, 255, ${0.2 + (thickness * 0.1)})`;
            ctx.lineWidth = thickness;
            ctx.lineCap = "round";
            ctx.stroke();
        }

        /**
         * 8. drawTentacles(ctx, cx, cy, width, height)
         * Draws multiple tentacles starting under the bell.
         */
        function drawTentacles(ctx, cx, cy, width, height) {
            const yRadius = height / 2;
            const xRadius = width / 2;
            const startY = cy + (yRadius * 0.5); // Where the bell bottom is
            const skirtW = xRadius * 1.8;
            
            const count = 12;
            
            for (let i = 0; i < count; i++) {
                // Distribute across the width of the opening
                const t = (i + 0.5) / count; // 0.08 to 0.92
                const startX = (cx - skirtW) + (t * skirtW * 2);
                
                // Variation in length and thickness
                const length = (height * 0.6) + (Math.random() * height * 0.4);
                const thickness = 0.5 + Math.random() * 1.5;
                const sway = 0.5 + Math.random() * 1.5; // Frequency of wave

                drawTentacle(ctx, startX, startY, length, sway, thickness);
            }
        }

        /**
         * 9. drawGlow(ctx, cx, cy, width, height)
         * Draws a soft glow behind the jellyfish.
         */
        function drawGlow(ctx, cx, cy, width, height) {
            const yRadius = height / 2;
            
            // Central glow
            const grad = ctx.createRadialGradient(cx, cy - height * 0.1, height * 0.1, cx, cy, height);
            grad.addColorStop(0, "rgba(20, 60, 80, 0.6)");
            grad.addColorStop(0.5, "rgba(10, 30, 50, 0.2)");
            grad.addColorStop(1, "rgba(0, 0, 0, 0)");

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy - height * 0.1, height, 0, Math.PI * 2);
            ctx.fill();
        }

        /**
         * 10. drawScene()
         * Clears canvas, draws components.
         */
        function drawScene() {
            // Setup dimensions
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Background
            drawBackground(ctx, width, height);

            const cx = width / 2;
            const cy = height / 2 - height * 0.05; // Slightly higher than center
            const jw = width * 0.6; // Jellyfish width
            const jh = height * 0.5; // Jellyfish height

            // 2. Glow (Behind)
            drawGlow(ctx, cx, cy, jw, jh);

            // 3. Tentacles (Behind Bell, but maybe slightly visible or just part of the structure)
            // Drawing tentacles first puts them visually 'behind' the main bell body if we draw bell on top
            drawTentacles(ctx, cx, cy, jw, jh);

            // 4. Inner Ribs (Inside Bell)
            drawInnerRibs(ctx, cx, cy, jw, jh);

            // 5. Underside detail
            drawUnderside(ctx, cx, cy, jw, jh);

            // 6. Main Bell
            drawJellyfishBell(ctx, cx, cy, jw, jh);
        }

        // Initialize
        resize();

    </script>
</body>
</html>
