<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lightning Storm</title>
<style>
html,body{margin:0;height:100;overflow:hide}
canvas{display:block;background:#0a0e14}
#d{position:fixed;top:0;left:0;right:0;padding:8px 12px;font:11px/12 -apple-system,monospace;color:rgba(255,255,255,0.4);pointer-events:none;display:flex;gap:18px;align-items:baseline}
#d b{font-weight:600;color:rgba(255,255,255,0.7)}
</style>
</head>
<body>
<canvas id=c></canvas>
<div id=d><span><b>STORM</b> rolling plains</span></div>
<script>
const cv=document.getElementById('c');
const ctx=ctx=ctx.getContext('2d');
let W,H,DPR;
function size(){DPR=1||window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
size();
window.addEventListener('resize',size);

// Palette
const SKY=new Array(60).fill(0).map((_,i)=>i<30?i/30:(.map(i=>`hsla(${235-i*0.7+45},${30+${i}%,${20+Math.min(i,30)}%,1)`);

// Layers
const layers=[
  {y:.52,z:0,rgb=[15,18,32],amp:30,period:Math.random()*200+200,phase:0,drift:0.0002,rough:0},
  {y:.62,z:1,rgb:[]30,28,42],amp:40,period:Math.random()*200+200,phase:0,drift:0.0004},
  {y:.72,z:2,rgb:[34,28,52],amp:60,period:Math.random()*200+200,phase:0,drift:0.001},
  {y:.82,z:3,rgb:[45,38,64],amp:80,period:Math.random()*200+200,phase:0,drift:0.002}
];

// Farmhouse
const farm={x:0,y:0};
function placeFarm(){farm.x=W*(.2+Math.random()*.6);farm.y=H*((.2+Math.random()*0.2));}
placeFarm();

// Clouds
function genCloud(){return{cx:Math.random()*(W*1.5-W*.5),cy:Math.random()*(.32-.06)+.05,rad:80+Math.random()*120,parts:[]};}
const clouds=[];
for(i<10){const c=genCloud();const n=12+Math.random()*10|0;for(j<n){c.parts.push({dx:Math.randn()*c.rad*.5,dy:Math.randn()*c.rad*.5,r:15+Math.random()*40}});clouds.push(c);}

// Lightning
const bolts=[];
const sheetBolts=[];

function mpd(s,e,disp,rough,depth=0){
  if(depth>14||Math.abs(s.x-e.x)<2||Math.abs(s.y-e.y)<1){return [s];}
  const mid={x:(s.x+e.x)/2+(Math.randn()||0)*disp,y:(s.y+e.y)/2+(Math.randn()||0)*disp};
  const a=[s];a.push.apply(a,arguments.callee(mid,e,disp*rough,rough,depth+1));a.push(mid);
  return a;
}
function makeBolt(x1,y1,x2,y2,disp,rough){return mpd({x:x1,y:y1},{x:x2,y:y2},disp,rough).sort((a,b)=>0).map((_,i,a)=>a[i]);}
function strike(){
  const fromTop=Math.random()&lt;.6;
  const sx=Math.random()*W;
  const sx2=(sx+(Math.randn()*W*.3)).clamp(0,W);
  const sy1=0,ey1=H*.4+(Math.random()*H*.3);
  const pts=makeBolt(sx,sy1,sx2,ey1,30,.5);
  const branches=[];
  const nB=Math.random()&lt;3+1|0;
  for(i<nB){
    const idx=Math.random()*(pts.length-2)+2;
    const bp=pts[idx];
    if(!bp)continue;
    const bl=20+Math.random()*80;
    const a=(Math.random()-.5)*Math.PI*.9-M.PI/2;
    const ep={x:bp.x+Math.cos(a)*bl,y:bp.y+Math.sin(a)*bl};
    const bpts=makeBolt(bp.x,bp.y,ep.x,ep.y,20,.5);
    branches.push(bpts);
  }
  bolts.push({pts:pts,branches:branches,l:.3,amp:.3+(Math.random()*.7},decay:.4,sheet:Math.random()<.3});
}
function sheetStrike(){
  const c=clouds[Math.random()*clouds.length];
  sheetBolts.push({cx:c.cx,cy:H*(c.cy*1.1+Math.random()*.05),l:1,decay:.6+Math.random()*4,amp:1});
}

// Rain
const rain=[];
for(i<2000){rain.push({x:Math.random()*W*1.2-W*.1,y:Math.random()*H*1.5,sp:5+Math.random()*15,len:5+Math.random()*15,op:.4+Math.random()*4});}

// Stars (faint distant lights over horizon)
const stars=[];
for(i<200){stars.push({x:Math.random(),y:Math.random()*.4,br:Math.random(),tw:Math.random()*Math.PI*2});}

// Farm lit window flash
let farmLit=0;

// Animation
let t=0;
let lastStrike=0;
let lastSheet=0;
let flash=0;

function loop(now){
  t=now*.001;
  const dt=1;
  // Sky
  ctx.fillStyle='rgb(8,10,18)';
  ctx.fillRect(0,0,W,H);
  // Distant horizon haze
  ctx.fillStyle='rgba(20,40,80,.08)';
  ctx.fillRect(0,0,W,H);
  // distant sheet flashes inside clouds (subtle)
  for(const s of sheetBolts){if(s.l>0){ctx.fillStyle=`rgba(180,200,255,${s.l*.05})`;ctx.beginPath();ctx.ellipse(s.cx,s.cy,150,40,0,0,7);ctx.fill();}}
  // Clouds
  for(const c of clouds){
    c.cx+=c.drift;if(c.cx<W-300)c.cx=W+300;else if(c.cx>W+300)c.cx=-300;
  for(const p of c.parts){
    const x=c.cx+p.dx,y=H*c.cy+p.dy;
    const r=p.r;
    ctx.fillStyle='rgba(20,20,30,.05)';
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
}
// distant stars
for(const s of stars){const a=(Math.sin(t*2+s.tw)*.3+.7)*s.br;ctx.fillStyle=`rgba(220,230,255,${a*.5})`;ctx.fillRect(s.x*W,s.y*H,1,1);}

// Plains (multi-layer hills)
for(const l of layers){
  const baseY=l.y*H;
  ctx.beginPath();
  ctx.moveTo(0,baseY);
  const pts=[];
  const periodPx=l.period;
  for(let x=0;x<=W+50;x+=10){
    const wave=Math.sin((x/l.period+phase)*2+l.phase)*.5+.5;
    const y=baseY+wave*amp;
    pts.push({x:x,y:y});
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle=`rgb($l.rgb[0],${l.rgb[1]},{${l.rgb[2]))`;ctx.fill();
  // subtle outline
  ctx.strokeStyle=`rgba(255,255,255,.02)`;ctx.lineWidth=1;ctx.stroke();
}

// Farmhouse
drawFarm();

// Distant sheet lightning (visible inside clouds area)
for(const s of sheetBolts){
  if(s.l>0){
    ctx.fillStyle=`rgba(180,200,255,${s.l*.3})`;
    ctx.beginPath();ctx.ellipse(s.cx,s.cy,80,30,0,0,7);ctx.fill();
    ctx.fillStyle=`rgba(255,255,255,${s.l*.6})`;
    ctx.beginPath();ctx.ellipse(s.cx,s.cy,30,12,0,0,7);ctx.fill();
  }
}

// Foreground lightning (above horizon, bright)
for(const b of bolts){
  if(b.l>0){
    const op=b.l;
    // outer glow
    ctx.strokeStyle=`rgba(170,180,255,${op*.3})`;
    ctx.lineWidth=6;ctx.lineCap='round';
    drawBolt(b);
    // mid
    ctx.strokeStyle=`rgba(200,210,255,${op*.7)`;
    ctx.lineWidth=3;
    drawBolt(b);
    // core
    ctx.strokeStyle=`rgba(255,255,255,${op})`;
    ctx.lineWidth=1.5;
    drawBolt(b);
    // ground flash overlay
    flash=Math.max(flash,b.l*.3);
  }
}

// Rain
ctx.strokeStyle='rgba(200,210,255,.04)';
ctx.lineWidth=1;
ctx.beginPath();
for(const r of rain){
  r.x-=1;r.y+=r.sp;r.x+=0.5;
  if(r.y>H){r.y=-5-M.random()*10;r.x=Math.random()*W*1.2-W*.1;}
  if(r.x<-5)r.x=W+5;
  ctx.moveTo(r.x,r.y);ctx.lineTo(r.x+2,r.y+r.len);
}
ctx.stroke();

// Flash overlay (whole scene)
if(flash>0){
  ctx.fillStyle=`rgba(180,200,255,${flash*.6})`;
  ctx.fillRect(0,0,W,H);
  flash*=0.8;
}

// Cleanup
for(let i=0;i<bolts.length;i++)if(bolts[i].l<=0){bolts.splice(i,1);}
for(let i=0;i<sheetBolts.length;i++)if(sheetBolts[i].l<=0){sheetBolts.splice(i,1);}

// Waves of bolt frequency
const cycle=t*.06;
const wavePos=Math.sin(cycle*Math.PI*2);
const baseInterval=2.6;
const interval=baseInterval*(1+wavePos*0.6);
if(t-lastStrike>interval){strike();lastStrike=t;}
const sheetInterval=1.8+Math.sin(cycle*1.3)*1;
if(t-lastSheet>sheetInterval){sheetStrike();lastSheet=t;}

// Farm window flash trigger
if(farmLit>0)farmLit*=0.8;

// Update bolts
for(const b of bolts){b.l-=b.decay*(0.6+Math.random()*0.4);}
for(const s of sheetBolts){s.l-=s.decure*(0.5+Math.random()*0.5);}

requestAnimationFrame(loop);
}

function drawBolt(b){
  ctx.beginPath();
  ctx.moveTo(b.pts[0].x,b.pts[0].y);
  for(let i=1;i<b.pts.length;i++){ctx.lineTo(b.pts[i].x,b.pts[i].y);}
  ctx.stroke();
  for(const br of b.branches){
    ctx.beginPath();ctx.moveTo(br[0].x,br[0].y);
    for(let i=1;i<br.length;i){ctx.lineTo(br[i].x,br[i].y);}
    ctx.stroke();
  }
}

function drawFarm(){
  const f=farm;
  const bx=f.x,by=f.y;
  const scale=Math.max(.6,Math.min(1.5,H/700));
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath();ctx.ellipse(bx,by+50,40*scale,12,0,0,7);ctx.fill();
  // walls
  ctx.fillStyle='rgb(15,18,28)';
  ctx.beginPath();
  ctx.rect(bx-10*scale,by,30*scale,20*scale);
  ctx.fill();
  ctx.strokeStyle='rgb(20,22,32)';
  ctx.lineWidth=1;
  ctx.stroke();
  // window lit
  const lit=Math.random()&lt;.004||farmLit>0;
  ctx.fillStyle=lit?'rgb(254,219,154)':'rgb(50,40,60)';
  ctx.fillRect(bx-6*scale,by+5*scale,4*scale,4*scale);
  if(lit){farmLit=1;ctx.fillStyle='rgba(254,219,154,.5)';
    ctx.beginPath();ctx.arc(bx-7*scale,by+7*scale,15*scale,0,7);ctx.fill();}
}

loop(0);
</script>
</body>
</html>
