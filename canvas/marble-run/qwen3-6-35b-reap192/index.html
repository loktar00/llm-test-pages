<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Marble Run</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>ENERGY: <span id="energy">100%</span></div>
        <div>MARBLE COUNT: <span id="count">0</span></div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let camera = { x: 0, y: 0 };
        let lastTime = 0;
        let worldGenTimer = 0;
        const WORLD_WIDTH = 2000;
        const WORLD_HEIGHT = 4000;
        const MARBLE_RADIUS = 1
