<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falling Sand Toy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #100b08; }
  canvas { display: block; image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, COLS = 0, ROWS = 0;
const CELL = 4; // chunky pixel size

// Cell types
const EMPTY  = 0;
const SAND   = 1;
const WATER  = 2;
const FIRE   = 3;
const WOOD   = 4;
const STONE  = 5;
const ASH    = 6;
const STEAM  = 7;

// Grids (typed arrays)
let grid = null;
let life = null; // for fire burn duration / wood health
let age = null;  // for stone regeneration timing

// Emitter state
const emitters = [];
let emitterTimer = 0;

// Palette
const PALETTE = {
  bg: '#100b08',
  sand:    ['#caa24a', '#b89238', '#d6b25a', '#a8812c'],
  water:   ['#2a6ea8', '#3a7eb8', '#1f5a8a', '#4b8fce'],
  fire:    ['#ff5a14', '#ff8a24', '#ffce4a', '#e83018'],
  wood:    ['#5e3818', '#6e4218', '#4a2a10', '#7a4a1c'],
  stone:   ['#5a5852', '#524f48', '#6a675f', '#484338'],
  ash:     ['#4a4238', '#544a40', '#3a342c'],
  steam:   ['#c8c8d0', '#a8a8b0', '#d8d8e0']
};

// Random helpers
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndInt(a, b) { return Math.floor(rnd(a, b)); }
function pick(arr) { return arr[rndInt(0, arr.length)]; }

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  COLS = Math.floor(W / CELL);
  ROWS = Math.floor(H / CELL);
  canvas.width = COLS;
  canvas.height = ROWS;
  canvas.style.width = (COLS * CELL) + 'px';
  canvas.style.height = (ROWS * CELL) + 'px';
  grid = new Uint8Array(COLS * ROWS);
  life = new Uint8Array(COLS * ROWS);
  age  = new Uint16Array(COLS * ROWS);
  initScene();
}

function idx(x, y) { return y * COLS + x; }

function inBounds(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS; }

function get(x, y) {
  if (!inBounds(x, y)) return STONE; // treat OOB as solid
  return grid[idx(x, y)];
}

function set(x, y, v) {
  if (!inBounds(x, y)) return;
  grid[idx(x, y)] = v;
}

function setLife(x, y, l) {
  if (!inBounds(x, y)) return;
  life[idx(x, y)] = l;
}

function getLife(x, y) {
  if (!inBounds(x, y)) return 0;
  return life[idx(x, y)];
}

function addAge(x, y, a) {
  if (!inBounds(x, y)) return;
  age[idx(x, y)] += a;
}

function getAge(x, y) {
  if (!inBounds(x, y)) return 0;
  return age[idx(x, y)];
}

function setAge(x, y, v) {
  if (!inBounds(x, y)) return;
  age[idx(x, y)] = v;
}

// Scene initialization: stone ledges, floating wood platforms
function initScene() {
  // Ground stone floor
  const floorTop = ROWS - 4;
  for (let y = floorTop; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      set(x, y, STONE);
      setAge(x, y, rndInt(0, 4000));
    }
  }

  // Several stone ledges at varying heights
  const ledgeCount = 4;
  let prevY = floorTop;
  for (let i = 0; i < ledgeCount; i++) {
    const ledgeY = Math.max(Math.floor(ROWS * 0.15 + i * (ROWS * 0.18)), 3);
    const thickness = rndInt(3, 6);
    const startX = rndInt(2, COLS * 0.2);
    const endX = rndInt(COLS * 0.6, COLS - 3);
