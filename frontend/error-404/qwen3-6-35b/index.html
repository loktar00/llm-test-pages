<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost in Space</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --navy:#0a0e2a;
    --deep:#060918;
    --moon:#f0e6c0;
    --moon-shadow:#c4b48a;
    --glow:#a8c0ff;
    --text:#e8eaf6;
    --accent:#7b8cff;
    --satellite:#ff6b8a;
  }

  html,body{
    height:100%;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--deep);
    color:var(--text);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ── Sky gradient ── */
  body::before{
    content:'';
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%,rgba(20,25,70,.9),transparent),
      radial-gradient(ellipse 120% 80% at 80% 20%,rgba(40,30,80,.5),transparent),
      linear-gradient(180deg,#060918 0%,#0a0e2a 40%,#111640 100%);
    z-index:-2;
  }

  /* ── Stars ── */
  .stars{
    position:fixed;inset:0;z-index:-1;
    overflow:hidden;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:#fff;
    border-radius:50%;
    animation:twinkle var(--dur) ease-in-out infinite alternate;
    opacity:0;
  }
  @keyframes twinkle{
    0%{opacity:.1;transform:scale(.8)}
    100%{opacity:var(--max-o,1);transform:scale(1.2)}
  }

  /* ── Main container ── */
  .container{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.5rem;
    position:relative;
  }

  /* ── 404 headline ── */
  .headline{
    font-size:clamp(8rem,20vw,16rem);
    font-weight:900;
    letter-spacing:-.04em;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
    user-select:none;
    animation:breathe 4s ease-in-out infinite;
    position:relative;
  }
  @keyframes breathe{
    0%,100%{
      text-shadow:
        0 0 20px rgba(168,192,255,.3),
        0 0 60px rgba(168,192,255,.15),
        0 0 120px rgba(168,192,255,.08);
    }
    50%{
      text-shadow:
        0 0 30px rgba(168,192,255,.5),
        0 0 80px rgba(168,192,255,.25),
        0 0 160px rgba(168,192,255,.12),
        0 0 240px rgba(168,192,255,.06);
    }
  }

  .headline .digit{
    display:inline-block;
    background:linear-gradient(180deg,#fff 0%,#c8d0ff 50%,#a8b4ff 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    filter:drop-shadow(0 0 30px rgba(168,192,255,.3));
  }

  /* ── Moon (the zero) ── */
  .moon{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:clamp(6rem,15vw,12rem);
    height:clamp(6rem,15vw,12rem);
    background:radial-gradient(circle at 35% 35%,#f5edd0,#d4c89a 60%,#b8a878 100%);
    border-radius:50%;
    box-shadow:
      inset -12px -8px 20px rgba(0,0,0,.25),
      inset 4px 4px 12px rgba(255,255,255,.15),
      0 0 40px rgba(240,230,192,.25),
      0 0 100px rgba(240,230,192,.1);
    animation:breathe 4s ease-in-out infinite;
  }

  /* Moon craters */
  .moon::before{
    content:'';
    position:absolute;
    width:18%;height:18%;
    background:radial-gradient(circle,rgba(160,140,100,.5),rgba(140,120,80,.3) 60%,transparent);
    border-radius:50%;
    top:22%;left:28%;
    box-shadow:
      28px 22px 0 6px rgba(160,140,100,.35),
      -10px 30px 0 3px rgba(160,140,100,.25),
      18px -18px 0 4px rgba(160,140,100,.3),
      -22px -8px 0 2px rgba(160,140,100,.2);
  }

  /* ── Satellite orbit ── */
  .orbit{
    position:absolute;
    width:clamp(9rem,22vw,18rem);
    height:clamp(9rem,22vw,18rem);
    border-radius:50%;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    animation:orbit-spin 6s linear infinite;
    pointer-events:none;
  }
  @keyframes orbit-spin{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }

  .satellite{
    position:absolute;
    top:-6px;left:50%;
    transform:translateX(-50%);
    width:14px;height:14px;
  }
  .satellite-body{
    width:8px;height:8px;
    background:var(--satellite);
    border-radius:2px;
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 8px rgba(255,107,138,.6);
  }
  .satellite-panel{
    position:absolute;
    width:14px;height:4px;
    background:linear-gradient(90deg,#4a6cf7,#6a8cff);
    top:50%;
    transform:translateY(-50%);
    border-radius:1px;
  }
  .satellite-panel.left{right:calc(50% + 4px)}
  .satellite-panel.right{left:calc(50% + 4px)}

  /* Orbit path */
  .orbit::before{
    content:'';
    position:absolute;inset:0;
    border:1px solid rgba(255,255,255,.06);
    border-radius:50%;
  }

  /* ── Subtitle ── */
  .subtitle{
    font-size:clamp(1rem,2.5vw,1.35rem);
    font-weight:300;
    color:rgba(200,210,245,.65);
    letter-spacing:.04em;
    max-width:420px;
    line-height:1.6;
    margin-top:.5rem;
  }
  .subtitle em{
    color:rgba(168,192,255,.8);
    font-style:normal;
    font-weight:500;
  }

  /* ── Home button ── */
  .home-btn{
    margin-top:1.5rem;
    padding:.9rem 2.6rem;
    font-size:1rem;
    font-weight:600;
    letter-spacing:.06em;
    color:#fff;
    background:linear-gradient(135deg,#4a5cf7 0%,#7b8cff 100%);
    border:none;
    border-radius:60px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .3s ease,box-shadow .3s ease;
    box-shadow:
      0 4px 20px rgba(74,92,247,.35),
      0 0 0 0 rgba(123,140,255,0);
    text-decoration:none;
    display:inline-block;
  }
  .home-btn:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:
      0 8px 30px rgba(74,92,247,.45),
      0 0 0 4px rgba(123,140,255,.15);
  }
  .home-btn:active{
    transform:translateY(0) scale(.98);
  }

  /* Button glint */
  .home-btn::after{
    content:'';
    position:absolute;
    top:0;left:-120%;
    width:80%;height:100%;
    background:linear-gradient(
      105deg,
      transparent 30%,
      rgba(255,255,255,.35) 50%,
      transparent 70%
    );
    transition:none;
    pointer-events:none;
  }
  .home-btn:hover::after{
    animation:glint 1s ease-in-out;
  }
  @keyframes glint{
    0%{left:-120%}
    100%{left:200%}
  }

  /* ── Shooting star ── */
  .shooting-star{
    position:fixed;
    width:80px;height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,.7),transparent);
    top:15%;left:-80px;
    opacity:0;
    animation:shoot 8s ease-in infinite;
    animation-delay:3s;
    transform:rotate(-25deg);
  }
  .shooting-star:nth-child(2){
    top:35%;
    width:60px;
    animation-delay:7s;
    animation-duration:9s;
  }
  @keyframes shoot{
    0%{left:-80px;opacity:0}
    2%{opacity:1}
    8%{left:110vw;opacity:0}
    100%{left:110vw;opacity:0}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="shooting-star"></div>
<div class="shooting-star"></div>

<div class="container">
  <div class="headline">
    <span class="digit">4</span>
    <span class="digit">0</span>
    <span class="digit">4</span>
  </div>

  <p class="subtitle">
    This page has drifted into <em>deep space</em> —<br>
    even the astronauts can't find it.
  </p>

  <a href="/" class="home-btn">Take Me Home</a>
</div>

<!-- Moon + satellite overlay on the zero -->
<div class="moon" aria-hidden="true">
  <div class="orbit">
    <div class="satellite">
      <div class="satellite-panel left"></div>
      <div class="satellite-body"></div>
      <div class="satellite-panel right"></div>
    </div>
  </div>
</div>

<script>
  // Generate twinkling stars
  const starsContainer = document.getElementById('stars');
  const count = 200;

  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const dur = 2 + Math.random() * 4;
    const maxO = 0.3 + Math.random() * 0.7;
    const size = Math.random() < 0.15 ? 3 : (Math.random() < 0.3 ? 2 : 1);
    const delay = Math.random() * 5;

    star.style.cssText = `
      left:${x}%;
      top:${y}%;
      width:${size}px;
      height:${size}px;
      --dur:${dur}s;
      --max-o:${maxO};
      animation-delay:${delay}s;
    `;
    starsContainer.appendChild(star);
  }
</script>
</body>
</html>
