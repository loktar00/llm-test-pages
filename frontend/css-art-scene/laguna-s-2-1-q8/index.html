<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cozy Desk at Night</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f1420;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 768px;
      height: 480px;
      margin: 0 auto;
    }

    /* Background Window & Moon */
    .window {
      position: absolute;
      top: 40px;
      right: 60px;
      width: 140px;
      height: 180px;
      background: linear-gradient(135deg, #1a2a4a 0%, #0f1b33 100%);
      border: 2px solid #3a5a8c;
      border-radius: 12px;
      box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.1);
      z-index: 1;
    }

    .moon {
      position: absolute;
      top: 40px;
      right: 90px;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #fdf6e3, #f0e6d2);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(253, 246, 227, 0.6);
      z-index: 0;
    }

    /* Desk */
    .desk {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 240px;
      background: linear-gradient(145deg, #6b4423, #4e301a);
      border-radius: 10px 10px 0 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }

    /* Laptop Base */
    .laptop-base {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 220px;
      background: linear-gradient(to bottom, #2c2c2c, #1a1a1a);
      border-radius: 20px 20px 0 0;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.7);
      z-index: 5;
    }

    .laptop-screen {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 180px;
      background: linear-gradient(135deg, #00f2fe, #008eff);
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0, 200, 255, 0.6);
      z-index: 6;
      animation: screenGlow 2s ease-in-out infinite alternate;
    }

    @keyframes screenGlow {
      0% {
        box-shadow: 0 0 25px rgba(0, 200, 255, 0.5);
      }
      100% {
        box-shadow: 0 0 45px rgba(0, 240, 255, 0.9);
      }
    }

    /* Lid */
    .laptop-lid {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 12px;
      background: linear-gradient(to bottom, #3a3a3a, #222);
      border-radius: 6px;
      z-index: 4;
    }

    /* Keyboard */
    .keyboard {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 70px;
      background: linear-gradient(to bottom, #3a3a3a, #2a2a2a);
      border-radius: 6px;
      z-index: 4;
    }

    .key {
      position: absolute;
      width: 18px;
      height: 10px;
      background: linear-gradient(to bottom, #444, #2a2a2a);
      border-radius: 3px;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
    }

    /* Coffee Mug */
    .mug {
      position: absolute;
      top: 130px;
      left: 90px;
      width: 50px;
      height: 60px;
      background: linear-gradient(145deg, #8d5524, #5d3514);
      border-radius: 0 10px 10px 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      z-index: 4;
    }

    .mug-handle {
      position: absolute;
      top: 10px;
      right: -12px;
      width: 16px;
      height: 40px;
      border: 5px solid #8d5524;
      border-left-color: transparent;
      border-radius: 0 10px 10px 0;
      z-index: 5;
    }

    .steam {
      position: absolute;
      top: -30px;
      left: 10px;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
      border-radius: 50%;
      animation: steamRise 4s infinite ease-in-out;
      opacity: 0.7;
    }

    .steam:nth-child(1) {
      left: 5px;
      animation-delay: 0s;
      transform: scale(0.8);
    }

    .steam:nth-child(2) {
      left: 20px;
      animation-delay: -1s;
      transform: scale(1);
    }

    .steam:nth-child(3) {
      left: 35px;
      animation-delay: -2s;
      transform: scale(0.9);
    }

    @keyframes steamRise {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-50px) scale(1.2);
        opacity: 0;
      }
    }

    /* Lamp */
    .lamp {
      position: absolute;
      top: 30px;
      left: 60px;
      z-index: 3;
      cursor: pointer;
    }

    .lamp-arm {
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 90px;
      background: linear-gradient(to bottom, #555, #333);
      border-radius: 4px;
      transform: rotate(-20deg);
      transform-origin: top left;
    }

    .lamp-shade {
      position: absolute;
      top: 85px;
      left: -15px;
      width: 40px;
      height: 30px;
      background: linear-gradient(to bottom, #7b3e1d, #4a2510);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 180, 80, 0.4);
      transition: box-shadow 0.5s;
    }

    .lamp-bulb {
      position: absolute;
      top: 105px;
      left: -5px;
      width: 12px;
      height: 12px;
      background: radial-gradient(circle, #fff9c4, #ffea00);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 230, 0, 0.7);
      transition: box-shadow 0.5s;
    }

    body.warm .lamp-shade {
      box-shadow: 0 0 25px rgba(255, 200, 100, 0.7);
    }

    body.warm .lamp-bulb {
      box-shadow: 0 0 20px rgba(255, 220, 80, 0.9);
    }

    body.warm .desk {
      box-shadow: 0 10px 50px rgba(255, 200, 120, 0.3);
    }

    body.warm .laptop-screen {
      animation: screenGlowWarm 2.5s ease-in-out infinite alternate;
    }

    @keyframes screenGlowWarm {
      0% {
        box-shadow: 0 0 30px rgba(255, 180, 100, 0.6);
      }
      100% {
        box-shadow: 0 0 50px rgba(255, 210, 130, 1);
      }
    }

    /* Cat */
    .cat {
      position: absolute;
      bottom: 90px;
      right: 100px;
      width: 60px;
      height: 40px;
      z-index: 7;
    }

    .cat-body {
      position: absolute;
      top: 10px;
      left: 0;
      width: 60px;
      height: 30px;
      background: linear-gradient(145deg, #a9a9a9, #7a7a7a);
      border-radius: 50% 50% 0 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .cat-head {
      position: absolute;
      top: -15px;
      left: 15px;
      width: 30px;
      height: 30px;
      background: linear-gradient(145deg, #a9a9a9, #7a7a7a);
      border-radius: 50%;
      z-index: 8;
    }

    .cat-ear {
      position: absolute;
      top: -8px;
      width: 12px;
      height: 14px;
      background: linear-gradient(145deg, #a9a9a9, #7a7a7a);
      border-radius: 50% 50% 0 0;
    }

    .cat-ear.left {
      left: 2px;
      transform: rotate(-15deg);
    }

    .cat-ear.right {
      right: 2px;
      transform: rotate(15deg);
    }

    .cat-eye {
      position: absolute;
      top: 12px;
      width: 5px;
      height: 8px;
      background: radial-gradient(circle, #000, #000);
      border-radius: 50%;
    }

    .cat-eye.left {
      left: 6px;
    }

    .cat-eye.right {
      right: 6px;
    }

    .cat-paw {
      position: absolute;
      bottom: -5px;
      width: 8px;
      height: 10px;
      background: linear-gradient(145deg, #a9a9a9, #7a7a7a);
      border-radius: 50%;
    }

    .cat-paw.left {
      left: 8px;
    }

    .cat-paw.right {
      right: 8px;
    }

    .tail {
      position: absolute;
      top: 15px;
      right: -18px;
      width: 22px;
      height: 8px;
      background: linear-gradient(145deg, #a9a9a9, #7a7a7a);
      border-radius: 50%;
      animation: tailSwing 3s ease-in-out infinite;
      transform-origin: left center;
    }

    @keyframes tailSwing {
      0%, 100% {
        transform: rotate(10deg);
      }
      50% {
        transform: rotate(-15deg);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- Background Elements -->
    <div class="moon"></div>
    <div class="window"></div>

    <!-- Desk -->
    <div class="desk">
      <!-- Keyboard -->
      <div class="keyboard"></div>
      <div class="key" style="top: 15px; left: 30px;"></div>
      <div class="key" style="top: 15px; left: 55px;"></div>
      <div class="key" style="top: 15px; left: 80px;"></div>
      <div class="key" style="top: 30px; left: 30px;"></div>
      <div class="key" style="top: 30px; left: 55px;"></div>
      <div class="key" style="top: 30px; left: 80px;"></div>

      <!-- Laptop -->
      <div class="laptop-base">
        <div class="laptop-lid"></div>
        <div class="laptop-screen"></div>
      </div>

      <!-- Coffee Mug -->
      <div class="mug">
        <div class="steam"></div>
        <div class="steam"></div>
        <div class="steam"></div>
        <div class="mug-handle"></div>
      </div>

      <!-- Lamp -->
      <div class="lamp" id="lampToggle">
        <div class="lamp-arm"></div>
        <div class="lamp-shade"></div>
        <div class="lamp-bulb"></div>
      </div>
    </div>

    <!-- Cat -->
    <div class="cat">
      <div class="cat-ear left"></div>
      <div class="cat-ear right"></div>
      <div class="cat-head">
        <div class="cat-eye left"></div>
        <div class="cat-eye right"></div>
      </div>
      <div class="cat-body">
        <div class="cat-paw left"></div>
        <div class="cat-paw right"></div>
      </div>
      <div class="tail"></div>
    </div>
  </div>

  <script>
    const lamp = document.getElementById('lampToggle');
    lamp.addEventListener('click', () => {
      document.body.classList.toggle('warm');
    });
  </script>
</body>
</html>
