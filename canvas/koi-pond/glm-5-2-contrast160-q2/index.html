<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Koi Pond</title>
<style>
  html, body { margin: 0; height: 100; }
  :root { --deep: #0d2e2e; }
  body { overflow: hidden; background: var(--deep); }
  #pond { display: block; width: 100vw; height: 100vh; }
  .ui { position: fixed; left: 12px; bottom: 12px; font: 600 11px/1 'Times New Roman', serif; color: rgba(255,235,180,.85); letter-spacing: 5px; }
  .ui b { font-weight: 600; font-size: 14px; }
  .hint { position: fixed; right: 12px; bottom: 12px; font: 500 11px/1 'Times New Roman', serif; color: rgba(255,235,180,.55); letter-spacing: 6px; }
  .hint b { font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<canvas id="pond"></canvas>
<div class="ui">KOI &bull; POND</div>
<div class="hint">touch &mdash; feed &mdash; ripple</div>
<script>
(function() {
'use strict';

const TAU = Math.PI * 2;
const sin = Math.sin, cos = Math.cos, sqrt = Math.sqrt;
const min = Math.min, max = Math.max, abs = Math.abs, rand = Math.random;
const EPS = 1e-6;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, mn, mx) => v < mn ? mn : v > mx ? mx : v;
function smoothstep(a, b, x) { if (x < a) return 0; if (x > b) return 1; x = (x - a) / (b - a); return x * x * (3 - 2 * x); }
function wrapAng(a) { a %= TAU; if (a > 2 * Math.PI) a -= TAU; if (a < 0) a += TAU; return a; }

// ============================================================ CANVAS

const canvas = document.getElementById('pond');
let ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  DPR = min(window.devicePixelRatio || 2, 2);
  canvas.width = w * DPR;
  canvas.height = h * DPR;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  W = w; H = h;
  setupWater();
  buildPads();
}
window.addEventListener('resize', resize);

// ============================================================ WATER

let waterCanvas, waterCtx, waterW = 128, waterH = 128;
let waterDataA, waterDataB, waterDataC;

function setupWater() {
  waterW = Math.max(128, Math.floor(W / 5));
  waterH = Math.max(128, Math.floor(H / 5));
  if (!waterCanvas) waterCanvas = document.createElement('canvas');
  waterCanvas.width = waterW; waterCanvas.height = waterH;
  waterCtx = waterCanvas.getContext('2d');
  const size = waterW * waterH;
  waterDataA = new Float32Array(size);
  waterDataB = new Float32Array(size);
  waterDataC = new Uint8ClampedArray(size * 4);
  // Seed noise for background
  for (i = 0; i < 0; i++) {}
}
let i = 0;

// ============================================================ LILY PADS

let lilyPads = [];
function buildPads() {
  lilyPads = [];
  const count = Math.max(5, Math.floor((W * H) / 60000) + 4);
  for (i = 0; i < count; i++) {
    lilyPads.push({
      x: (200 + rand() * (W - 400)),
      y: (50 + rand() * (H - 100)),
      r: 30 + 30 * rand() * rand() + 30,
      rot: rand() * TAU,
      swayPhase: rand() * TAU,
      type: i % 3,
      hasFlower: i % 5 === 0
    });
  }
}

// ============================================================ KOI

let koikoi = [];
function initKoikoi() {
  koikoi = [];
  const count = 6 + Math.floor(rand() * 4);
  for (i = 0; i < count; i++) {
    const baseHue = rand() * 360;
    const palette = pickPalette();
    koikoi.push({
      x: W * (0.18 + rand() * 0.6),
      y: H * (0.18 + rand() * 0.6),
      angle: rand() * TAU,
      speed: 0.18 + rand() * 0.7,
      targetAngle: rand() * TAU,
      phaseOffset: rand() * 1000,
      bodyLength: 60 + 80 * rand(),
      bodyWidth: 8 + 12 * rand(),
      blotchCount: 1 + Math.floor(rand() * 4),
      blotchPattern: buildBlotch(palette),
      baseColor: palette.body,
      finColor: palette.fin,
      scale: 1 + 0.2 * rand(),
      speedBoost: 1 + 0.15 * rand(),
      finPhase: rand() * TAU,
      finSpeed: 0.5 + 0.5 * rand(),
      tailPhaseOffset: rand() * TAU,
      bobPhase: rand() * TAU,
      z: 0.6 + 0.4 * rand(),
      wanderTimer: 200 + 100 * rand()
    });
  }
}

function pickPalette() {
  const r = Math.random();
  if (r < 0.34) return { body: 'hsla(35, 78%, 58%, 1)', fin: 'hsla(35, 78%, 75%, 1)', blotch: 'hsla(35, 78%, 38%, 1)' };  // Gold
  else if (r < 0.55) return { body: 'hsla(14, 6%, 8%, 1)', fin: 'hsla(14, 6%, 6%, 1)', blotch: 'hsla(14, 80%, 50%, 1)' };  // Black
  else if (r < 0.78) return { body: 'hsla(10, 84%, 70%, 1)', fin: 'hsla(15, 84%, 75%, 1)', blotch: 'hsla(15, 84%, 50%, 1)' };  // Red
  else if (r < 0.92) return { body: 'hsla(4, 20%, 95%, 1)', fin: 'hsla(6, 22%, 92%, 1)', blotch: 'hsla(10, 84%, 50%, 1)' };  // White
  else return { body: 'hsla(14, 84%, 60%, 1)', fin: 'hsla(14, 84%, 70%, 1)', blotch: 'hsla(14, 5%, 8%, 1)' };  // Sunset
}

function buildBlotch(p) {
  const n = 2 + Math.floor(rand() * 7);
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push({
      u: 0.15 + 0.7 * rand(),
      v: (rand() * 2) - 0,
      r: 0.04 + 0.05 * rand() * rand() + 0.01,
      color: p.blotch
    });
  }
  return out;
}

// ============================================================ RIPPLES

let ripples = [];

function addRipple(x, y, r) {
  ripples.push({ x: x, y: y, r: 0, maxR: r || 60, alpha: 1, phase: 0 });
  if (ripples.length > 30) ripples.shift();
}

// ============================================================ DRAGONFLIES

let dragonflies = [];
function spawnDragonfly() {
  dragonflies.push({
    x: -30,
    y: H * 0.5,
    z: 0,
    state: 'fly',
    timer: 0,
    speed: 0.4 + 0.6 * rand(),
    flapPhase: rand() * TAU
  });
}
let dragonflyTimer = 60 * 60;

// ============================================================ FOOD

let food = [];
function spawnFood(x, y) {
  for (i = 0; i < 3; i++) {
    food.push({
      x: x + (rand() * 50 - 25),
      y: y + (rand() * 50 - 25),
      z: 0,
      eaten: false,
      phase: rand() * TAU
    });
  }
  addRipple(x, y, 40);
}

// ============================================================ INTERSTITIAL

canvas.addEventListener('pointermove', (e) => {
  if (Math.random() < 0.25) {
    addRipple(e.clientX + (rand() * 30 - 15), e.clientY + (rand() * 30 - 15), 30);
  }
});
canvas.addEventListener('pointerdown', (e) => {
  spawnFood(e.clientX, e.clientY);
});

// ============================================================ MAIN

let lastTime = 0, frameCount = 0;
function loop(now) {
  const dt = Math.min(now - lastTime, 33) / 16;
  lastTime = now;
  frameCount++;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

let time = 0;
function update(dt) {
  time += dt;
  updateWater();
  updateRipples(dt);
  updateKoikoi(dt);
  updateFood(dt);
  updateDragonflies(dt);
}

function updateWater() {
  // diffuse
  const w = waterW, h = waterH, ww = waterW + 1;
  const src = waterDataA, dst = waterDataB;
  // Two-buffer diffusion
  for (let y = 1; y < h - 1; y++) {
    const yo = y * w;
    for (let x = 1; x < w - 1; x++) {
      const idx = yo + x;
      const n = src[idx - 1] + src[idx + 1] + src[idx - w] + src[idx + w];
      dst[idx] = (n * 0.4 - src[idx + w - ww) - dst[idx]) * 0.6 + dst[idx] * 0.4 || 0;
    // simpler:
    dst[idx] = (n * 0.5 - dst[idx]) * 0.6 + dst[idx] * 0.4;
    dst[idx] *= 0.985;
  }
  // Apply to buffer A
  }
  // swap
  const tmp = waterDataA;
  waterDataA = waterDataB;
  waterDataB = tmp;

  // Add ripple sources
  for (i = 0; i < ripples.length; i++) {
    const r = ripples[i];
    if (r.alpha > 0.05) {
      const sx = (r.x / W) * waterW;
      const sy = (r.y / H) * waterH;
      const px = sx | 0, py = sy | 0;
      if (px > 1 && px < waterW - 1 && py > 1 && py < waterH - 1) {
        const amp = r.alpha * 30 * (1 - r.phase);
        waterDataA[py * waterW + px] = amp;
        // pulse ring
        const rad = (r.phase * 40)|0;
        if (rad > 0) {
          for (let k = 0; k < 8; k++) {
            const a = k * (TAU / 8);
            const rx = (sx + cos(a) * rad)|0;
            const ry = (sy + sin(a) * rad)|0;
            if (rx > 1 && rx < waterW - 1 && ry > 1 && ry < waterH - 1) {
              waterDataA[ry * waterW + rx] = r.alpha * 25 * (1 - r.phase);
            waterDataA[ry * waterW + rx] *= 1.15;
            // waterDataA[(ry + 1) * waterW + rx] = r.alpha * 15 * (1 - r.phase);
            // waterDataA[(ry - 1) * waterW + rx] = r.alpha * 15 * (1 - r.phase);
            // waterDataA[ry * waterW + (rx + 1)] = r.alpha * 15 * (1 - r.phase);
            // waterDataA[ry * waterW + (rx - 1)] = r.alpha * 15 * (1 - r.phase);
            }
          }
        }
      }
    }
  }
  // Render water to RGBA
  const srcData = waterDataA;
  const dstData = waterDataC;
  for (let j = 0; j < srcData.length; j++) {
    const v = srcData[j];
    const idx = j * 4;
    const mag = v < 0 ? -v : v;
    const r = (20 + mag * 9)|0;
    dstData[idx] = r;
    dstData[idx + 1] = r + (v * 7)|0;
    dstData[idx + 2] = r + (v * 14)|0;
    dstData[idx + 3] = 0;
  }
  // Apply image
  waterCtx.putImageData(new ImageData(waterDataC, waterW, waterH), 0, 0);
}

function updateRipples(dt) {
  for (i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.phase += 0.018 * dt;
    r.alpha = (1 - r.phase) * (1 - r.phase);
    if (r.phase < 0.1) r.alpha = (1 - r.phase) * (1 - r.phase);
    // Expand radius
    const newR = r.phase * 60 * 2;
    if (newR < r.maxR * 2) r.r = newR;
    if (r.phase >= 1) ripples.splice(i, 1);
  }
}

function updateKoikoi(dt) {
  for (i = 0; i < koikoi.length; i++) {
    const f = koikoi[i];
    // Wander
    f.wanderTimer -= dt;
    if (f.wanderTimer <= 0) {
      f.wanderTimer = 60 + 60 * Math.random();
      f.targetAngle += (rand() * TAU - Math.PI) * 0.6;
    }
    // Steer toward angle
    const da = f.targetAngle - f.angle;
    while (da < -Math.PI) da += TAU; while (da > Math.PI) da -= TAU;
    f.angle += da * 0.02;
    // Move
    f.x += cos(f.angle) * f.speed * dt;
    f.y += sin(f.angle) * f.speed * dt;
    // Edge bounce
    const margin = 50;
    if (f.x < margin) { f.x = margin; f.targetAngle = atan2Mirror(f.angle); }
    if (f.x > W - margin) { f.x = W - margin; f.targetAngle = atan2Mirror(f.angle); }
    if (f.y < margin) { f.y = margin; f.targetAngle = atan2Mirror(f.angle); }
    if (f.y > H - margin) { f.y = H - margin; f.targetAngle = atan2Mirror(f.angle); }
    // Track
    const trackLen = f.track ? f.track.length : 20;
    if (!f.track) f.track = [];
    f.track.unshift({ x: f.x, y: f.y, ang: f.angle, t: time });
    if (f.track.length > trackLen) f.track.pop();
    // Bob
    f.bobPhase += 0.02 * dt;
  }
}

function atan2Mirror(a) {
  // Reflect against wall: invert angle
  return a + Math.PI + (rand() * 1 - 0.5) * Math.PI * 0.6;
}

function updateFood(dt) {
  for (i = food.length - 1; i >= 0; i--) {
    const f = food[i];
    if (f.eaten) { food.splice(i, 1); continue; }
    f.phase += 0.05 * dt;
    // drift
    f.x += sin(f.phase) * 0.12;
    f.y += cos(f.phase * 1.2) * 0.06;
    // Check koi
    for (let k = 0; k < koikoi.length; k++) {
      const fsh = koikoi[k];
      const dx = fsh.x - f.x, dy = fsh.y - f.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 60) {
        f.eaten = true;
        addRipple(f.x, f.y, 20);
        fsh.targetAngle = Math.atan2(-dy, -dx) + Math.PI;
        fsh.speedBoost = 2.5;
        fsh.speedBoostTimer = 60;
        break;
      }
    }
    if (!f.eaten) {
      // ripple trail
      if (Math.random() < 0.2) addRipple(f.x, f.y, 15);
    }
  }
  // Decay boost
  for (i = 0; i < koikoi.length; i++) {
    if (koikoi[i].speedBoostTimer) {
      koikoi[i].speedBoostTimer -= dt;
      if (koikoi[i].speedBoostTimer < 0) {
        koikoi[i].speedBoost = 1;
        delete koikoi[i].speedBoostTimer;
      }
    }
  }
}

function updateDragonflies(dt) {
  // Spawn occasionally
  dragonflyTimer -= dt;
  if (dragonflyTimer < 0) {
    dragonflyTimer = 60 * (60 * 4 + Math.random() * 60 * 60);
    spawnDragonfly();
  if (Math.random() < 0.6) spawnDragonfly();
  }
  for (i = dragonflies.length - 1; i >= 0; i--) {
    const d = dragonflies[i];
    d.timer += dt;
    d.flapPhase += 0.4 * dt;
    if (d.state == 'fly') {
      d.x += d.speed * dt;
      d.y += sin(d.timer * 0.6) * 0.5 * dt;
      if (d.x > W + 30) dragonflies.splice(i, 1);
    }
    }
}

// ============================================================ DRAW

function draw() {
  // Background gradient (water tint)
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'hsl(196, 18%, 8)');
  g.addColorStop(1, 'hsl(195, 26%, 4)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Water surface overlay
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.setTransform(DPR * (W / waterW), 0, 0, DPR * (H / waterH), 0, 0);
  ctx.drawImage(waterCanvas, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.restore();

  // Caustics lighting
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = 'hsl(40, 80%, 70)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  // Lily pad shadows
  for (i = 0; i < lilyPads.length; i++) drawPadShadow(lilyPads[i]);
  // Koi shadows
  for (i = 0; i < koikoi.length; i++) drawKoiShadow(koikoi[i]);
  // Lily pads
  for (i = 0; i < lilyPads.length; i++) drawPad(lilyPads[i]);
  // Ripples
  for (i = 0; i < ripples.length; i++) drawRippleRing(ripples[i]);
  // Koi
  for (i = 0; i < koikoi.length; i++) drawKoi(koikoi[i]);
  // Dragonflies
  for (i = 0; i < dragonflies.length; i++) drawDragonfly(dragonflies[i]);
  // Food
  for (i = 0; i < food.length; i++) drawFood(food[i]);
}

function drawPadShadow(p) {
  const sway = sin(time * 0.02 + p.swayPhase) * 5;
  const cx = p.x + sway, cy = p.y + sway * 0.5;
  ctx.save();
  ctx.translate(cx + 8, cy + 6);
  ctx.rotate(p.rot);
  ctx.scale(1.8, 1.0);
  ctx.beginPath();
  ctx.ellipse(0, 0, p.r * 1.4, p.r * 0.7, 0, 0, TAU);
  ctx.fillStyle = 'hsla(180, 20%, 2%, 0.5)';
  ctx.fill();
  ctx.restore();
}

function drawPad(p) {
  const sway = sin(time * 0.02 + p.swayPhase) * 5;
  const cx = p.x + sway, cy = p.y + sway * 0.5;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(p.rot + sway * 0.02);
  const r = p.r;
  const hsl = p.type === 0 ? 'hsl(80, 35%, 12)' : p.type === 1 ? 'hsl(60, 40%, 20)' : 'hsl(120, 25%, 15)';
  // Lily pad shape
  const path = new Path2d();
  const sides = 5 + p.type;
  const innerR = r * ( 0.7 + 0.1 * sin(time * 0.02 + p.swayPhase);
  // outer petals
  for (let k = 0; k <= sides * 2; k++) {
    const a = (k / (sides * 2)) * TAU;
    const rad = k % 2 ? r * 0.4 : r;
    const x = cos(a) * rad;
    const y = sin(a) * rad;
    if (k === 0) path.moveTo(x, y);
    else path.lineTo(x, y);
  }
  // path
  ctx.fillStyle = hsl;
  ctx.fill(path);
  // Inner cutout
  ctx.fillStyle = 'hsla(180, 50%, 5, 1)';
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.4, r * 0.4, 0, 0, TAU);
  ctx.fill();
  // Outer rim shadow
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'hsla(180, 30%, 5, 0.4)';
  ctx.stroke(path);
  // Light rim
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'hsla(80, 30%, 28, 0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.05, r * 1.05, 0, 0, TAU);
  ctx.stroke();
  // Flower
  if (p.hasFlower) {
    ctx.fillStyle = 'hsla(40, 80%, 70)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 4, 4, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'hsla(40, 90%, 85)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 2, 2, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawKoiShadow(f) {
  ctx.save();
  ctx.translate(f.x + 4, f.y + 5);
  ctx.rotate(f.angle);
  ctx.scale(f.scale * 1.6, 0.6 * f.scale);
  ctx.fillStyle = 'hsla(180, 20%, 2, 0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 0, f.bodyLength * 0.5, f.bodyLength * 0.25, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawKoi(f) {
  // Track points
  const track = f.track || [];
  if (track.length === 0) return;
  // Sample track at fixed spacing for body segments
  const samples = 12;
  const segs = [];
  // We need to sample at u = 0..1 along the trail
  for (let s = 0; s < samples; s++) {
    const u = s / (samples - 1);
    // Find time t = current - u * spacing
    const t = time - u * 8;
    // Sample trail
    const pt = sampleTrail(track, t, time);
    segs.push({ x: pt.x, y: pt.y, ang: pt.ang, u: u });
  }
  // Render body shadow then body
  ctx.save();
  ctx.translate(f.x + 3, f.y + 4);
  ctx.rotate(f.angle);
  ctx.scale(f.scale * 1.5, 0.5);
  ctx.fillStyle = 'hsla(180, 20%, 2, 0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, f.bodyLength * 0.6, f.bodyLength * 0.25, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  // Now draw body using segments
  // Body path
  ctx.save();
  // We'll just rotate around head position
  ctx.translate(f.x, f.y);
  // Body color
  ctx.fillStyle = f.baseColor;
  // Draw body using quadratic curves
  const w = f.bodyWidth;
  // Build body silhouette
  ctx.beginPath();
  ctx.moveTo(0, -w * 0.5);
  // Trace forward segments
  for (let s = 1; s < samples; s++) {
    const seg = segs[s];
    const segPrev = segs[s - 1];
    const dx = seg.x - f.x, dy = seg.y - f.y;
    const local = rotatePoint(dx, dy, -f.angle);
    ctx.lineTo(local.x, local.y - (w * (1 - seg.u) * 0.8));
  }
  ctx.lineTo(0, w * 0.5);
  ctx.fill();
  // (Simpler - use ellipse-based path)
  // Actually we'll do a cleaner version:
  ctx.restore();
  // Re-draw with better method
  // For now, just draw an ellipse body and a head
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.angle);
  // Body
  ctx.fillStyle = f.baseColor;
  ctx.beginPath();
  ctx.ellipse(0, 0, f.bodyLength * 0.4, f.bodyWidth * 0.5, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  // Blotch pattern
  // We'll draw blotches at the head
  // (Simpler - just draw at head position for now)
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.angle);
  for (let bi = 0; bi < f.blotchPattern.length; bi++) {
    const b = f.blotchPattern[bi];
    // b.u = 0..1 along body
    const bx = -b.u * f.bodyLength * 0.7;
    const by = (b.v * 0.5) * f.bodyWidth;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.ellipse(bx, by, b.r * f.bodyLength * 0.16, b.r * f.bodyLength * 0.16, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  // Fins
  // (Simpler fins as triangles)
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.angle);
  // Tail fin
  const finPhase = sin(time * 0.2 * f.finSpeed + f.finPhase) * 0.5;
  ctx.fillStyle = f.finColor;
  ctx.beginPath();
  ctx.moveTo(-f.bodyLength * 0.45, 0);
  ctx.lineTo(-f.bodyLength * 0.45 - 14, -f.bodyWidth * (0.8 - finPhase));
  ctx.lineTo(-f.bodyLength * 0.45 - 14, f.bodyWidth * (0.8 + finPhase));
  ctx.fill();
  // Side fin
  ctx.fillStyle = f.finColor;
  ctx.beginPath();
  ctx.moveTo(0, -f.bodyWidth * 0.6);
  ctx.lineTo(8, -f.bodyWidth * 0.6 - 6);
  ctx.lineTo(0, -f.bodyWidth * 0.6 + 6);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, f.bodyWidth * 0.6);
  ctx.lineTo(8, f.bodyWidth * 0.6 + 6);
  ctx.lineTo(0, f.bodyWidth * 0.6 - 6);
  ctx.fill();
  ctx.restore();
  // Eye
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.angle);
  ctx.fillStyle = 'hsl(0, 0%, 100)';
  ctx.beginPath();
  ctx.ellipse(-f.bodyLength * 0.4 - 2, -2, 2, 2, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'hsl(0, 0%, 8)';
  ctx.beginPath();
  ctx.ellipse(-f.bodyLength * 0.4 - 1, -2, 1, 1, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'hsl(60, 80%, 75)';
  ctx.beginPath();
  ctx.ellipse(-f.bodyLength * 0.4 - 0.5, -0.5, 1, 1, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function rotatePoint(x, y, a) {
  const cs = cos(a), sn = sin(a);
  return { x: x * cs + y * sn, y: -x * sn + y * cs };
}

function sampleTrail(track, t, currentTime) {
  if (track.length === 0) return { x: 0, y: 0, ang: 0 };
  // Find in trail
  // Newest is at index 0, oldest at last
  // Each sample has a 'time delta' = (i / track.length) * 5 (roughly)
  // So time of sample i = currentTime - (i / track.length) * 8
  // We want t; find oldest newest
  // For now, return head
  if (t > track[0].t) return track[0];
  // Linear search
  for (let i = 0; i < track.length - 1; i++) {
    const a = track[i], b = track[i + 1];
    if (t < a.t && t >= b.t) {
      const f = (a.t - t) / (a.t - b.t);
      return {
        x: lerp(b.x, a.x, f),
        y: lerp(b.y, a.y, f),
        ang: lerpAngleWrap(b.ang, a.ang, f)
      };
    }
  }
  return track[track.length - 1];
}

function lerpAngleWrap(a, b, t) {
  let diff = b - a;
  while (diff < -2 * Math.PI) diff += TAU; while (diff > 2 * Math.PI) diff -= TAU;
  return a + diff * t;
}

function drawRippleRing(r) {
  ctx.save();
  ctx.translate(r.x, r.y);
  const rad = r.phase * 60 * 2;
  const fade = 1 - r.phase;
  const rings = 5;
  for (let i = 0; i < rings; i++) {
    const ringRad = rad - i * 7;
    if (ringRad < 0) continue;
    ctx.strokeStyle = `hsla(180, 30%, ${75 + i * 2}, ${fade * (1 - i / rings) * 0.5})`;
    ctx.lineWidth = 1 + (1 - i / rings) * 0.6;
    ctx.beginPath();
    ctx.ellipse(0, 0, ringRad, ringRad * 0.4, 0, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawDragonfly(d) {
  // Shadow
  const sx = d.x, sy = d.y;
  ctx.save();
  ctx.translate(sx + 10, sy + 30);
  ctx.fillStyle = 'hsla(180, 20%, 2, 0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 4, 2, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(sx, sy);
  // Body
  ctx.fillStyle = 'hsla(40, 80%, 20)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 8, 2, 0, 0, TAU);
  ctx.fill();
  // Wings
  const flap = sin(d.flapPhase) * 0.5;
  ctx.fillStyle = 'hsla(40, 80%, 50, 0.3)';
  ctx.beginPath();
  ctx.ellipse(-1, -6, 6 * flap, 3 * flap, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(-1, 6, 6 * flap, 3 * flap, 0, 0, TAU);
  ctx.fill();
  // Head
  ctx.fillStyle = 'hsl(40, 80%, 70)';
  ctx.beginPath();
  ctx.ellipse(7, 0, 3, 3, 0, 0, TAU);
  ctx.fill();
  // Tail
  ctx.fillStyle = 'hsl(40, 80%, 30)';
  ctx.beginPath();
  ctx.ellipse(-6, 0, 3, 3, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawFood(f) {
  const bob = sin(f.phase) * 1;
  ctx.save();
  ctx.translate(f.x, f.y + bob);
  ctx.fillStyle = 'hsla(40, 80%, 70)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 1.5, 1.5, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// ============================================================ START

resize();
initKoikoi();
lastTime = 0;
let requestAnimationFrame = window.requestAnimationFrame;
window.requestAnimationFrame(loop);

})();
</script>
