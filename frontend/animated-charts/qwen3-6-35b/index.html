<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Showcase</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6c757d;
            --grid-line: #e9ecef;
            --accent-1: #4f46e5; /* Indigo */
            --accent-2: #06b6d4; /* Cyan */
            --accent-3: #8b5cf6; /* Violet */
            --accent-4: #10b981; /* Emerald */
            --accent-5: #f59e0b; /* Amber */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 4rem 1rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1rem 4rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        /* Card Styles */
        .chart-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .chart-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        /* Shared Tooltip Styles */
        .tooltip {
            position: absolute;
            background: rgba(26, 26, 26, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            pointer-events: none;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            font-weight: 500;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(26, 26, 26, 0.95) transparent transparent transparent;
        }

        .tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Bar Chart Styles --- */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 300px;
            width: 100%;
            padding-top: 20px;
            border-bottom: 1px solid var(--grid-line);
            position: relative;
        }

        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
            position: relative;
            cursor: pointer;
        }

        .bar {
            width: 60%;
            background: var(--accent-1);
            border-radius: 4px 4px 0 0;
            height: 0; /* Animated */
            transition: height 1.5s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s;
            position: relative;
            min-height: 4px;
        }

        .bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px 4px 0 0;
        }

        .bar-group:hover .bar {
            background: var(--accent-3);
        }

        .bar-label {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* --- Line Chart Styles --- */
        .line-chart-container {
            position: relative;
            width: 100%;
            height: 300px;
        }

        svg.line-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .grid-line {
            stroke: var(--grid-line);
            stroke-width: 1;
            stroke-dasharray: 4 4;
        }

        .axis-label {
            font-size: 10px;
            fill: var(--text-secondary);
            text-anchor: middle;
        }

        .line-path {
            fill: none;
            stroke: var(--accent-2);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .line-area {
            fill: url(#gradientArea);
            opacity: 0.2;
        }

        .dot {
            fill: var(--surface);
            stroke: var(--accent-2);
            stroke-width: 3;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .bar-group:hover .dot {
            opacity: 1;
            r: 6;
        }

        /* --- Donut Chart Styles --- */
        .donut-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }

        .donut-chart {
            width: 280px;
            height: 280px;
            transform: rotate(-90deg);
        }

        .donut-segment {
            fill: none;
            stroke-width: 30;
            stroke-linecap: butt;
            transition: stroke-width 0.2s;
            cursor: pointer;
        }

        .donut-segment:hover {
            stroke-width: 36;
        }

        .donut-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .donut-total {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        .donut-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: center;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }

        /* Animation Utility */
        .chart-card {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .chart-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <header>
        <h1>Analytics Dashboard</h1>
        <p class="subtitle">Interactive Data Visualization Showcase</p>
    </header>

    <div class="container">
        
        <!-- Bar Chart Section -->
        <div class="chart-card" id="bar-chart-card">
            <div class="chart-header">
                <h2 class="chart-title">Monthly Revenue</h2>
                <p class="chart-subtitle">Performance over the last 6 months</p>
            </div>
            <div class="chart-container">
                <div class="bar-chart" id="barChart"></div>
                <div class="tooltip" id="bar-tooltip"></div>
            </div>
        </div>

        <!-- Line Chart Section -->
        <div class="chart-card" id="line-chart-card">
            <div class="chart-header">
                <h2 class="chart-title">User Growth</h2>
                <p class="chart-subtitle">Active users trend over time</p>
            </div>
            <div class="chart-container">
                <div class="line-chart-container">
                    <svg class="line-svg" id="lineSvg">
                        <defs>
                            <linearGradient id="gradientArea" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="var(--accent-2)" stop-opacity="0.4"/>
                                <stop offset="100%" stop-color="var(--accent-2)" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                        <!-- Grid lines and labels injected via JS -->
                        <path class="line-area" id="lineArea" d="" />
                        <path class="line-path" id="linePath" d="" />
                        <g id="lineDots"></g>
                    </svg>
                </div>
                <div class="tooltip" id="line-tooltip"></div>
            </div>
        </div>

        <!-- Donut Chart Section -->
        <div class="chart-card" id="donut-chart-card">
            <div class="chart-header">
                <h2 class="chart-title">Market Share</h2>
                <p class="chart-subtitle">Distribution by platform</p>
            </div>
            <div class="chart-container">
                <div class="donut-wrapper">
                    <svg class="donut-chart" id="donutSvg"></svg>
                    <div class="donut-center-text">
                        <div class="donut-total" id="donutTotal">0</div>
                        <div class="donut-label">Total Users</div>
                    </div>
                </div>
                <div class="legend" id="donutLegend"></div>
                <div class="tooltip" id="donut-tooltip" style="position: fixed;"></div>
            </div>
        </div>

    </div>

    <script>
        // --- Configuration & Data ---
        const colors = ['var(--accent-1)', 'var(--accent-2)', 'var(--accent-3)', 'var(--accent-4)', 'var(--accent-5)'];
        
        const barData = [
            { label: 'Jan', value: 45000 },
            { label: 'Feb', value: 32000 },
            { label: 'Mar', value: 58000 },
            { label: 'Apr', value: 48000 },
            { label: 'May', value: 72000 },
            { label: 'Jun', value: 65000 }
        ];

        const lineData = [
            { label: 'W1', value: 120 },
            { label: 'W2', value: 132 },
            { label: 'W3', value: 101 },
            { label: 'W4', value: 134 },
            { label: 'W5', value: 190 },
            { label: 'W6', value: 230 },
            { label: 'W7', value: 210 },
            { label: 'W8', value: 250 }
        ];

        const donutData = [
            { label: 'Desktop', value: 45, color: 'var(--accent-1)' },
            { label: 'Mobile', value: 30, color: 'var(--accent-2)' },
            { label: 'Tablet', value: 15, color: 'var(--accent-3)' },
            { label: 'Other', value: 10, color: 'var(--accent-4)' }
        ];

        // --- Utility Functions ---
        const easeOutQuart = t => 1 - (--t) * t * t * t;
        const easeOutBack = t => {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        };

        function formatCurrency(val) {
            return '$' + val.toLocaleString();
        }

        // --- Intersection Observer Setup ---
        const observerOptions = {
            threshold: 0.2,
            rootMargin: "0px"
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    if (entry.target.id === 'bar-chart-card') initBarChart();
                    if (entry.target.id === 'line-chart-card') initLineChart();
                    if (entry.target.id === 'donut-chart-card') initDonutChart();
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.chart-card').forEach(card => {
            observer.observe(card);
        });

        // --- Bar Chart Logic ---
        function initBarChart() {
            const container = document.getElementById('barChart');
            const tooltip = document.getElementById('bar-tooltip');
            const maxVal = Math.max(...barData.map(d => d.value));

            barData.forEach((d, i) => {
                const group = document.createElement('div');
                group.className = 'bar-group';
                
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.dataset.value = d.value;
                
                // Calculate height percentage
                const heightPct = (d.value / maxVal) * 100;
                
                // Animation delay based on index
                bar.style.transitionDelay = `${i * 0.1}s`;
                
                // Trigger animation
                requestAnimationFrame(() => {
                    bar.style.height = `${heightPct}%`;
                });

                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = d.label;

                group.appendChild(bar);
                group.appendChild(label);
                container.appendChild(group);

                // Hover Events
                group.addEventListener('mousemove', (e) => {
                    tooltip.innerHTML = `<strong>${d.label}</strong><br>${formatCurrency(d.value)}`;
                    tooltip.classList.add('visible');
                    // Position relative to viewport
                    const rect = group.getBoundingClientRect();
                    const tooltipRect = tooltip.getBoundingClientRect();
                    
                    let left = rect.left + rect.width / 2 - tooltipRect.width / 2;
                    let top = rect.top - tooltipRect.height - 10;

                    // Simple boundary checks
                    if (left < 10) left = 10;
                    if (left + tooltipRect.width > window.innerWidth - 10) left = window.innerWidth - tooltipRect.width - 10;

                    tooltip.style.left = `${left}px`;
                    tooltip.style.top = `${top}px`;
                });

                group.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('visible');
                });
            });
        }

        // --- Line Chart Logic ---
        function initLineChart() {
            const svg = document.getElementById('lineSvg');
            const linePath = document.getElementById('linePath');
            const lineArea = document.getElementById('lineArea');
            const dotsGroup = document.getElementById('lineDots');
            const tooltip = document.getElementById('line-tooltip');
            
            const width = svg.clientWidth;
            const height = svg.clientHeight;
            const padding = 30;
            
            const maxVal = Math.max(...lineData.map(d => d.value));
            const minVal = Math.min(...lineData.map(d => d.value)) * 0.8; // Lower baseline slightly
            const range = maxVal - minVal;

            // Helper to map values to coordinates
            const getX = (i) => padding + (i / (lineData.length - 1)) * (width - 2 * padding);
            const getY = (val) => height - padding - ((val - minVal) / range) * (height - 2 * padding);

            // Draw Grid Lines
            const gridGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            for(let i=0; i<=4; i++) {
                const y = padding + (i/4) * (height - 2*padding);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", padding);
                line.setAttribute("x2", width - padding);
                line.setAttribute("y1", y);
                line.setAttribute("y2", y);
                line.setAttribute("class", "grid-line");
                gridGroup.appendChild(line);
            }
            svg.insertBefore(gridGroup, linePath);

            // Calculate Path
            let pathD = `M ${getX(0)} ${getY(lineData[0].value)}`;
            let areaD = pathD; // Start same
            let points = [];

            lineData.forEach((d, i) => {
                if (i === 0) return;
                const x = getX(i);
                const y = getY(d.value);
                points.push({x, y, data: d});
                
                // Using simple lines for robustness, or cubic beziers for smoothness
                // Let's use simple lines for crisp data visualization
                pathD += ` L ${x} ${y}`;
                areaD += ` L ${x} ${y}`;
            });
            areaD += ` L ${width-padding} ${height-padding} L ${padding} ${height-padding} Z`;

            linePath.setAttribute("d", pathD);
            lineArea.setAttribute("d", areaD);

            // Draw Dots
            points.forEach((p, i) => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", p.x);
                circle.setAttribute("cy", p.y);
                circle.setAttribute("r", 5);
                circle.setAttribute("class", "dot");
                circle.dataset.index = i;
                dotsGroup.appendChild(circle);
            });

            // Animation Logic
            const len = linePath.getTotalLength();
            linePath.style.strokeDasharray = len;
            linePath.style.strokeDashoffset = len;
            lineArea.style.opacity = 0;

            let startTime = null;
            const duration = 2000;

            function animateLine(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const easedProgress = easeOutQuart(progress);

                linePath.style.strokeDashoffset = len * (1 - easedProgress);
                
                // Show area after line is mostly done
                if (progress > 0.8) {
                    lineArea.style.opacity = (progress - 0.8) * 5; // fade in
                }

                if (progress < 1) {
                    requestAnimationFrame(animateLine);
                } else {
                    // Show dots one by one at the end
                    const dots = document.querySelectorAll('.dot');
                    dots.forEach((dot, i) => {
                        setTimeout(() => {
                            dot.style.opacity = 1;
                        }, i * 100);
                    });
                }
            }

            requestAnimationFrame(animateLine);

            // Interactivity
            const dotElements = document.querySelectorAll('.dot');
            
            // Create invisible hit areas for easier hover
            points.forEach((p, i) => {
                const hitArea = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                hitArea.setAttribute("cx", p.x);
                hitArea.setAttribute("cy", p.y);
                hitArea.setAttribute("r", 15); // Larger hit area
                hitArea.setAttribute("fill", "transparent");
                hitArea.style.cursor = 'pointer';
                svg.appendChild(hitArea);

                hitArea.addEventListener('mouseenter', () => {
                    tooltip.innerHTML = `<strong>${p.data.label}</strong><br>${p.data.value} Users`;
                    tooltip.classList.add('visible');
                    
                    // Position tooltip
                    const svgRect = svg.getBoundingClientRect();
                    const containerRect = svg.parentElement.getBoundingClientRect();
                    
                    // Calculate position relative to container
                    let left = p.x + 10; 
                    let top = p.y - 30;

                    // Boundary checks relative to container
                    if (left > (svgRect.width - 100)) left = p.x - 100;
                    
                    tooltip.style.left = `${left}px`;
                    tooltip.style.top = `${top}px`;
                });

                hitArea.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('visible');
                });
            });
        }

        // --- Donut Chart Logic ---
        function initDonutChart() {
            const svg = document.getElementById('donutSvg');
            const legend = document.getElementById('donutLegend');
            const totalEl = document.getElementById('donutTotal');
            const tooltip = document.getElementById('donut-tooltip');
            
            const totalValue = donutData.reduce((acc, curr) => acc + curr.value, 0);
            const radius = 120;
            const circumference = 2 * Math.PI * radius;
            const gap = 5; // px gap between segments
            
            let currentOffset = 0;

            donutData.forEach((d, i) => {
                // Calculate segment length
                const segmentLength = (d.value / totalValue) * circumference;
                
                // Create Circle
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", "140"); // Center of 280x280
                circle.setAttribute("cy", "140");
                circle.setAttribute("r", radius);
                circle.setAttribute("stroke", d.color);
                circle.setAttribute("stroke-dasharray", `${segmentLength - gap} ${circumference}`);
                circle.setAttribute("stroke-dashoffset", -currentOffset);
                circle.setAttribute("class", "donut-segment");
                
                // Rotation transform is handled by parent, but dashoffset works on path
                // We need to animate the stroke-dashoffset from -circumference to -currentOffset
                
                circle.style.transition = `stroke-dashoffset 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) ${i * 0.2}s`;
                
                // Trigger animation
                requestAnimationFrame(() => {
                    circle.setAttribute("stroke-dasharray", `${segmentLength - gap} ${circumference}`);
                    circle.setAttribute("stroke-dashoffset", -currentOffset);
                });

                svg.appendChild(circle);
                currentOffset += segmentLength;

                // Hover
                circle.addEventListener('mousemove', (e) => {
                    tooltip.innerHTML = `<strong>${d.label}</strong><br>${d.value}%`;
                    tooltip.classList.add('visible');
                    
                    // Fixed positioning for donut since it's centered
                    let left = e.clientX + 10;
                    let top = e.clientY - 30;
                    
                    if (left + 100 > window.innerWidth) left = e.clientX - 110;
                    
                    tooltip.style.left = `${left}px`;
                    tooltip.style.top = `${top}px`;
                });
                
                circle.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('visible');
                });

                // Legend
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `<div class="legend-dot" style="background:${d.color}"></div>${d.label}`;
                legend.appendChild(item);
            });

            // Counter Animation
            let start = 0;
            const duration = 2000;
            let startTime = null;

            function animateCount(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                const current = Math.floor(easeOutQuart(progress) * totalValue);
                totalEl.textContent = current.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(animateCount);
                }
            }
            
            // Start counter after a slight delay to match visual
            setTimeout(() => {
                requestAnimationFrame(animateCount);
            }, 400);
        }

    </script>
</body>
</html>
