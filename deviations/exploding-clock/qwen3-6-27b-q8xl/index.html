<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploding Clock</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const offscreen = document.createElement('canvas');
const offCtx = offscreen.getContext('2d');

let W, H, fontSize, particles = [], timeStr = '', lastExplosionTime = 0;
const CYCLE = 10000;
const EXPLODE_DURATION = 1200;
const REFORM_DURATION = 2500;
const GRAVITY = 300;
const DAMPING = 0.98;
const SPRING = 0.03;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  offscreen.width = W;
  offscreen.height = H;
  fontSize = Math.min(W / 8, H / 3);
}

function getTimeStr() {
  const d = new Date();
  return d.getHours().toString().padStart(2, '0') + ':' +
         d.getMinutes().toString().padStart(2, '0') + ':' +
         d.getSeconds().toString().padStart(2, '0');
}

function getTextCenters(text) {
  offCtx.clearRect(0, 0, W, H);
  offCtx.font = `bold ${fontSize}px "Courier New", monospace`;
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';
  const metrics = offCtx.measureText(text);
  const totalW = metrics.width;
  const startX = (W - totalW) / 2;
  const cy = H / 2;
  const centers = [];
  let cx = startX;
  for (const ch of text) {
    const mw = offCtx.measureText(ch).width;
    centers.push({ x: cx + mw / 2, y: cy });
    cx += mw;
  }
  return centers;
}

function sampleParticles(text) {
  offCtx.clearRect(0, 0, W, H);
  offCtx.font = `bold ${fontSize}px "Courier New", monospace`;
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';

  const grad = offCtx.createLinearGradient(0, H * 0.3, 0, H * 0.7);
  grad.addColorStop(0, '#00ffff');
  grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(1, '#ff66aa');
  offCtx.fillStyle = grad;
  offCtx.shadowColor = '#00aaff';
  offCtx.shadowBlur = 30;
  offCtx.fillText(text, W / 2, H / 2);
  offCtx.shadowBlur = 0;

  const imageData = offCtx.getImageData(0, 0, W, H);
  const data = imageData.data;
  const step = Math.max(3, Math.floor(fontSize / 25));
  const targets = [];

  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      const i = (y * W + x) * 4;
      if (data[i + 3] > 100) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        targets.push({ x, y, r, g, b });
      }
    }
  }
  return targets;
}

function initParticles() {
  timeStr = getTimeStr();
  const targets = sampleParticles(timeStr);
  const centers = getTextCenters(timeStr);

  particles = targets.map((t, i) => {
    const closestCenter = centers.reduce((best, c) => {
      const d = (t.x - c.x) ** 2 + (t.y - c.y) ** 2;
      return d < best.d ? { c, d } : best;
    }, { c: centers[0], d: Infinity });

    const angle = Math.atan2(t.y - closestCenter.c.y, t.x - closestCenter.c.x);
    const dist = Math.sqrt((t.x - closestCenter.c.x) ** 2 + (t.y - closestCenter.c.y) ** 2);
    const speed = 200 + Math.random() * 600;

    return {
      x: t.x, y: t.y,
      tx: t.x, ty: t.y,
      r: t.r, g: t.g, b: t.b,
      vx: 0, vy: 0,
      angle, dist, speed,
      size: 1.5 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      opacity: 1
    };
  });

  lastExplosionTime = performance.now();
}

function explode() {
  const centers = getTextCenters(timeStr);
  particles.forEach(p => {
    const closestCenter = centers.reduce((best, c) => {
      const d = (p.tx - c.x) ** 2 + (p.ty - c.y) ** 2;
      return d < best.d ? { c, d } : best;
    }, { c: centers[0], d: Infinity });

    const dx = p.tx - closestCenter.c.x;
    const dy = p.ty - closestCenter.c.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / dist;
    const ny = dy / dist;
    const speed = p.speed * (0.5 + Math.random() * 1.5);
    const spread = (Math.random() - 0.5) * 0.8;

    p.vx = (nx + spread * ny) * speed;
    p.vy = (ny - spread * nx) * speed;
  });
}

function updateTargets() {
  timeStr = getTimeStr();
  const newTargets = sampleParticles(timeStr);

  if (newTargets.length !== particles.length) {
    const diff = newTargets.length - particles.length;
    if (diff > 0) {
      for (let i = 0; i < diff; i++) {
        const t = newTargets[particles.length + i] || newTargets[Math.floor(Math.random() * newTargets.length)];
        const centers = getTextCenters(timeStr);
        const c = centers[Math.floor(Math.random() * centers.length)];
        particles.push({
          x: c.x + (Math.random() - 0.5) * 200,
          y: c.y + (Math.random() - 0.5) * 200,
          tx: t.x, ty: t.y,
          r: t.r, g: t.g, b: t.b,
          vx: 0, vy: 0,
          angle: 0, dist: 0, speed: 400,
          size: 1.5 + Math.random() * 1.5,
          phase: Math.random() * Math.PI * 2,
          opacity: 0
        });
      }
    } else {
      particles.splice(newTargets.length);
    }
  }

  particles.forEach((p, i) => {
    if (newTargets[i]) {
      p.tx = newTargets[i].x;
      p.ty = newTargets[i].y;
      p.r = newTargets[i].r;
      p.g = newTargets[i].g;
      p.b = newTargets[i].b;
    }
  });
}

function update(dt) {
  const now = performance.now();
  const elapsed = now - lastExplosionTime;
  const breathe = Math.sin(now * 0.002) * 0.003;
  const breatheY = Math.sin(now * 0.0015 + 1) * 0.002;

  if (elapsed < EXPLODE_DURATION) {
    const t = elapsed / EXPLODE_DURATION;
    const ease = t * t;

    particles.forEach(p => {
      p.vy += GRAVITY * dt;
      p.vx *= DAMPING;
      p.vy *= DAMPING;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.opacity = 1 - ease * 0.3;
    });
  } else if (elapsed < EXPLODE_DURATION + REFORM_DURATION) {
    const t = Math.min(1, (elapsed - EXPLODE_DURATION) / REFORM_DURATION);
    const springStrength = SPRING + (1 - t) * 0.08;

    updateTargets();

    particles.forEach(p => {
      const dx = p.tx - p.x;
      const dy = p.ty - p.y;
      p.vx += dx * springStrength;
      p.vy += dy * springStrength;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.opacity = Math.min(1, p.opacity + dt * 2);
    });
  } else {
    updateTargets();

    particles.forEach(p => {
      const bx = p.tx * (1 + breathe);
      const by = p.ty * (1 + breatheY);
      const ox = Math.sin(now * 0.003 + p.phase) * 1.5;
      const oy = Math.cos(now * 0.0025 + p.phase * 1.3) * 1.5;
      const dx = bx + ox - p.x;
      const dy = by + oy - p.y;
      p.vx += dx * 0.05;
      p.vy += dy * 0.05;
      p.vx *= 0.9;
      p.vy *= 0.9;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.opacity = 1;
    });

    if (now - lastExplosionTime >= CYCLE) {
      explode();
      lastExplosionTime = now;
    }
  }
}

function draw() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  particles.forEach(p => {
    if (p.opacity < 0.01) return;
    const alpha = p.opacity;
    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4);
    glow.addColorStop(0, `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha * 0.9})`);
    glow.addColorStop(0.3, `rgba(${p.r}, ${p.g}, ${p.b}, ${alpha * 0.4})`);
    glow.addColorStop(1, `rgba(${p.r}, ${p.g}, ${p.b}, 0)`);

    ctx.fillStyle = glow;
    ctx.fillRect(p.x - p.size * 4, p.y - p.size * 4, p.size * 8, p.size * 8);

    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalCompositeOperation = 'source-over';
}

let lastTime = performance.now();

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  resize();
  initParticles();
});

resize();
initParticles();
requestAnimationFrame(loop);
</script>
</body>
</html>
