<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard Table</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-light: #e0e7ff;
    --border: #e5e7eb;
    --success: #10b981;
    --warn: #f59e0b;
    --error: #ef4444;
    --info: #3b82f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    line-height: 1.5;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: #111827;
  }

  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #f9fafb;
    text-align: left;
    padding: 0.9rem 1rem;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: background .15s ease;
  }

  thead th:hover { background: #f1f5f9; }

  th.sortable .arrow {
    display: inline-block;
    margin-left: 6px;
    font-size: 0.8rem;
    opacity: 0.3;
    transform: scale(0.9);
    transition: all .25s ease;
  }

  th.sortable.sort-asc .arrow.asc { opacity: 1; transform: scale(1) translateY(-2px); }
  th.sortable.sort-desc .arrow.desc { opacity: 1; transform: scale(1) translateY(2px); }

  tbody td {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr {
    transition: background .18s ease, transform .2s ease;
  }

  tbody tr:hover {
    background: var(--accent-light);
    transform: translate3d(0, -1px, 0);
  }

  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    font-weight: 600;
    color: #fff;
    font-size: 0.8rem;
  }

  .chip {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .chip.active   { background: #d1fae5; color: #065f46; }
  .chip.inactive { background: #fee2e2; color: #991b2b; }
  .chip.pending  { background: #fef3c7; color: #92400e; }
  .chip.suspended{ background: #e0e7ff; color: #3730a3; }

  .checkbox-cell {
    display: flex;
    align-items: center;
  }

  .checkbox {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .18s ease;
  }

  .checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .checkbox.indeterminate::after {
    content: '';
    width: 10px;
    height: 2px;
    background: var(--accent);
    border-radius: 1px;
  }

  .footer {
    margin-top: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .pill-group {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .pill {
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card);
    transition: all .2s ease;
  }

  .pill:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  .pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  @media (max-width: 640px) {
    th, td { padding: 0.7rem; font-size: 0.85rem; }
    .avatar { width: 28px; height: 28px; font-size: 0.7rem; }
  }
</style>
</head>
<body>
  <h1>User Management</h1>
  <div class="card">
    <table id="userTable">
      <thead>
        <tr>
          <th style="width:40px;"></th>
          <th class="sortable" data-key="name">Name <span class="arrow">▲▼</span></th>
          <th class="sortable" data-key="email">Email <span class="arrow">▲▼</span></th>
          <th class="sortable" data-key="status">Status <span class="arrow">▲▼</span></th>
          <th class="sortable" data-key="role">Role <span class="arrow">▲▼</span></th>
          <th class="sortable" data-key="joined">Joined <span class="arrow">▲▼</span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="footer" id="footer"></div>

<script>
const users = [
  { id:1, name:"Alice Johnson",   email:"alice@acme.com",     status:"active",   role:"Admin",    joined:"2022-03-15" },
  { id:2, name:"Bob Smith",       email:"bob@acme.com",       status:"inactive",  role:"Editor",   joined:"2021-11-02" },
  { id:3, name:"Charlie Brown",   email:"charlie@acme.com",   status:"pending",   role:"Viewer",   joined:"2023-06-19" },
  { id:4, name:"Diana Prince",    email:"diana@acme.com",     status:"active",    role:"Admin",    joined:"2020-09-10" },
  { id:5, name:"Ethan Hunt",      email:"ethan@acme.com",     status:"suspended",  role:"Editor",   joined:"2023-01-22" },
  { id:6, name:"Fiona Green",     email:"fiona@acme.com",     status:"active",    role:"Viewer",   joined:"2022-07-30" },
  { id:7, name:"George King",     email:"george@acme.com",    status:"active",    role:"Admin",    joined:"2021-04-14" },
  { id:8, name:"Hannah Abbott",   email:"hannah@acme.com",    status:"pending",   role:"Editor",   joined:"2023-05-05" },
  { id:9, name:"Ian Sommer",      email:"ian@acme.com",       status:"inactive",   role:"Viewer",   joined:"2022-12-18" },
  { id:10,name:"Julia Roberts",   email:"julia@acme.com",     status:"active",    role:"Admin",    joined:"2020-01-08" },
  { id:11,name:"Kevin Hart",      email:"kevin@acme.com",     status:"active",    role:"Editor",   joined:"2023-02-27" },
  { id:12,name:"Laura Croft",     email:"laura@acme.com",     status:"suspended",  role:"Viewer",   joined:"2021-08-11" },
  { id:13,name:"Mason Mount",     email:"mason@acme.com",     status:"active",    role:"Admin",    joined:"2022-10-03" },
  { id:14,name:"Nina Simone",     email:"nina@acme.com",      status:"pending",   role:"Editor",   joined:"2023-03-16" }
];

const avatarColors = ["#6366f1","#8b5cf6","#ec4899","#f59e0b","#10b981","#3b82f6","#06b6d4","#84cc16","#f97316","#d946ef"];

function initials(name) {
  const parts = name.split(" ");
  return (parts[0][0] + (parts[1]?.[0] || "")).toUpperCase();
}

function avatar(name, idx) {
  const c = avatarColors[idx % avatarColors.length];
  return `<span class="avatar" style="background:${c}">${initials(name)}</span>`;
}

function statusChip(s) {
  const map = {
    active: ["Active", "active"],
    inactive: ["Inactive", "inactive"],
    pending: ["Pending", "pending"],
    suspended: ["Suspended", "suspended"]
  };
  const [txt,cls] = map[s] || ["Unknown","inactive"];
  return `<span class="chip ${cls}">${txt}</span>`;
}

function renderRows(data, selected) {
  const tbody = document.querySelector("#userTable tbody");
  tbody.innerHTML = data.map(u => `
    <tr data-id="${u.id}">
      <td class="checkbox-cell"><div class="checkbox ${selected.includes(u.id) ? 'checked' : ''}" data-id="${u.id}"></div></td>
      <td>${avatar(u.name, u.id)} <strong>${u.name}</strong></td>
      <td>${u.email}</td>
      <td>${statusChip(u.status)}</td>
      <td>${u.role}</td>
      <td>${u.joined}</td>
    </tr>
  `).join("");
}

function updateSelectAll(checkedCount, totalCount) {
  const cb = document.querySelector(".checkbox-cell .checkbox") || document.createElement("div");
  cb.className = "checkbox";
  if (checkedCount === 0) cb.classList.remove("checked","indeterminate");
  else if (checkedCount === totalCount) cb.classList.replace("indeterminate","checked");
  else cb.classList.add("indeterminate");
  cb.dataset.id = "all";
  document.querySelector("thead tr").innerHTML = `
    <th style="width:40px;"><div class="checkbox ${cb.classList.contains('indeterminate')?'indeterminate':cb.classList.contains('checked')?'checked':''}" data-id="all"></div></th>
    <th class="sortable" data-key="name">Name <span class="arrow">▲▼</span></th>
    <th class="sortable" data-key="email">Email <span class="arrow">▲▼</span></th>
    <th class="sortable" data-key="status">Status <span class="arrow">▲▼</span></th>
    <th class="sortable" data-key="role">Role <span class="arrow">▲▼</span></th>
    <th class="sortable" data-key="joined">Joined <span class="arrow">▲▼</span></th>
  `;
}

function attachSort() {
  document.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      const dir = th.classList.contains("asc") ? "desc" : "asc";
      document.querySelectorAll("th.sortable").forEach(t => t.classList.remove("asc","desc"));
      th.classList.add(dir === "asc" ? "asc" : "desc");

      // FLIP animation
      const rowsBefore = Array.from(document.querySelectorAll("tbody tr")).map(tr => tr.getBoundingClientRect().top);
      const sorted = [...users].sort((a,b) => {
        let av = a[key], bv = b[key];
        if (key === "joined") return dir === "asc" ? new Date(av)-new Date(bv) : new Date(bv)-new Date(av);
        if (typeof av === "string") return dir === "asc"
          ? av.localeCompare(bv)
          : bv.localeCompare(av);
        return dir === "asc" ? av - bv : bv - av;
      });
      renderRows(sorted, selectedIds);
      const rowsAfter = Array.from(document.querySelectorAll("tbody tr")).map(tr => tr.getBoundingClientRect().top);
      rowsAfter.forEach((top, i) => {
        const tr = document.querySelectorAll("tbody tr")[i];
        tr.style.transition = "none";
        tr.style.transform = `translateY(${top - rowsBefore[i]}px)`;
      });
      requestAnimationFrame(() => {
        const trs = document.querySelectorAll("tbody tr");
        trs.forEach(tr => {
          tr.style.transition = "transform .4s cubic-bezier(.25,.8,.25,1)";
          tr.style.transform = "translateY(0)";
        });
        setTimeout(() => trs.forEach(tr => tr.style.transition = ""), 500);
      });
    });
  });
}

let selectedIds = [];
function attachCheckbox() {
  document.querySelectorAll(".checkbox").forEach(cb => {
    cb.onclick = () => {
      const id = cb.dataset.id;
      if (id === "all") {
        const allIds = users.map(u => u.id);
        const isAll = allIds.every(i => selectedIds.includes(i));
        selectedIds = isAll ? [] : [...allIds];
      } else {
        const uid = parseInt(id);
        if (selectedIds.includes(uid)) selectedIds = selectedIds.filter(i => i !== uid);
        else selectedIds.push(uid);
      }
      renderRows(users, selectedIds);
      updateSelectAll(selectedIds.length, users.length);
      attachCheckbox();
    };
  });
}

function renderFooter(currentPage) {
  const total = users.length;
  const pages = Math.ceil(total / 5);
  let pills = "";
  for (let i = 1; i <= pages; i++) {
    pills += `<div class="pill ${i === currentPage ? 'active' : ''}">${i}</div>`;
  }
  document.getElementById("footer").innerHTML = `<span>Showing <strong>${total}</strong> users</span><div class="pill-group">${pills}</div>`;
  document.querySelectorAll(".pill").forEach(p => p.onclick = () => renderFooter(parseInt(p.textContent)));
}

// Init
renderRows(users, selectedIds);
updateSelectAll(0, users.length);
attachSort();
attachCheckbox();
renderFooter(1);
</script>
</body>
</html>
