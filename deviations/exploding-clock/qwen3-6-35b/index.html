<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploding Clock</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        /**
         * CONFIGURATION
         */
        const CONFIG = {
            fontSize: 200,
            font: 'bold 150px "Courier New", monospace',
            resolution: 4, // Lower resolution for performance (1 is full pixel data)
            particleSize: 2.5,
            gravity: 0.25,
            friction: 0.92,
            explosionForce: 15,
            returnSpeed: 0.08, // Lerp factor for returning to target
            colorBase: '#00ffff',
            colorExplosion: '#ffaa00'
        };

        /**
         * SETUP
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let timeString = "";
        let lastExplosionTime = 0;
        
        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Reset particles on resize to avoid coordinate issues
            initParticles();
        }
        window.addEventListener('resize', resize);

        /**
         * PARTICLE CLASS
         */
        class Particle {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.originX = x; // Where it was when spawned
                this.targetX = targetX; // Where it wants to go
                this.targetY = targetY;
                
                // Physics state
                this.vx = 0;
                this.vy = 0;
                this.isExploding = false;
                this.size = Math.random() * 2 + 1;
                
                // Appearance
                this.color = CONFIG.colorBase;
                this.life = 1; // For fading
            }

            explode() {
                this.isExploding = true;
                
                // Calculate center of explosion (approx center of particle's current position)
                const cx = this.originX;
                const cy = this.originY;

                // Vector from center to particle
                let angle = Math.atan2(this.y - cy, this.x - cx);
                // Add some randomness to angles
                angle += (Math.random() - 0.5);
                
                // Random force
                const force = Math.random() * CONFIG.explosionForce + 5;
                
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
                
                this.color = CONFIG.colorExplosion;
                this.size = Math.random() * 3 + 2;
            }

            update() {
                if (this.isExploding) {
                    // Physics: Velocity + Gravity
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += CONFIG.gravity;
                    
                    // Friction
                    this.vx *= CONFIG.friction;
                    this.vy *= CONFIG.friction;

                    // Check if landed or slowed down enough to reform
                    if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) {
                        this.isExploding = false;
                        this.color = CONFIG.colorBase;
                        this.size = CONFIG.particleSize;
                    }
                } else {
                    // Reassembly: Lerp towards target
                    this.x += (this.targetX - this.x) * CONFIG.returnSpeed;
                    this.y += (this.targetY - this.y) * CONFIG.returnSpeed;
                    
                    // Add a tiny bit of noise to simulate "breathing"
                    this.x += (Math.random() - 0.5) * 0.2;
                    this.y += (Math.random() - 0.5) * 0.2;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        /**
         * LOGIC
         */

        // 1. Get text pixel data
        function getTextPixels(text) {
            // Offscreen canvas to read pixels
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            
            // Estimate size
            offCanvas.width = width;
            offCanvas.height = height;
            
            offCtx.font = CONFIG.font;
            offCtx.fillStyle = '#fff';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, width / 2, height / 2);
            
            const imageData = offCtx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            const points = [];
            
            // Scan pixels (with stride/resolution for performance)
            for (let y = 0; y < height; y += CONFIG.resolution) {
                for (let x = 0; x < width; x += CONFIG.resolution) {
                    const index = (y * width + x) * 4;
                    const alpha = data[index + 3];
                    
                    if (alpha > 128) {
                        points.push({x, y});
                    }
                }
            }
            
            return points;
        }

        function initParticles() {
            particles = [];
            const currentText = getTimeString();
            const pixels = getTextPixels(currentText);
            
            pixels.forEach(p => {
                // Add some jitter to origin so they don't stack perfectly
                const jitterX = (Math.random() - 0.5) * 5;
                const jitterY = (Math.random() - 0.5) * 5;
                particles.push(new Particle(p.x, p.y, p.x, p.y));
            });
        }

        function getTimeString() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function triggerExplosion() {
            particles.forEach(p => {
                // Store origin before explosion so we know where it came from
                // but target stays the same (the new time)
                p.explode();
            });
        }

        /**
         * MAIN LOOP
         */
        resize();

        function animate() {
            requestAnimationFrame(animate);

            // 1. Update State
            const now = Date.now();
            const currentTimeStr = getTimeString();
            
            // Check for Time Change (or every 10 seconds logic)
            // Requirement: "Every ten seconds... shatter" AND "resemble correct new digits"
            // We handle both: if the displayed string changes, or every 10s interval.
            const timeInSec = Math.floor(now / 1000);
            const triggerReset = (timeInSec % 10 === 0 && now - lastExplosionTime > 1000);
            
            if (currentTimeStr !== timeString || triggerReset) {
                timeString = currentTimeStr;
                lastExplosionTime = now;
                
                // Update Targets
                const newPixels = getTextPixels(timeString);
                
                // Re-map particles to new pixels
                // Optimization: If we have too many or too few particles, we might want to spawn/destroy,
                // but for visual effect, just mapping existing ones to nearest new targets works well enough.
                // A better way for "swarm" effect is to distribute the NEW points among the EXISTING particles.
                
                let newPoints = [];
                for(let i=0; i<newPixels.length; i++) {
                    newPoints.push(newPixels[i]);
                }

                // Shuffle new points to avoid sorting artifacts
                newPoints.sort(() => Math.random() - 0.5);

                for (let i = 0; i < particles.length; i++) {
                    if (i < newPoints.length) {
                        const target = newPoints[i];
                        particles[i].targetX = target.x;
                        particles[i].targetY = target.y;
                    } else {
                        // If we have more particles than needed, hide them or scatter them
                        particles[i].targetX = width + 1000; // Move off screen
                        particles[i].targetY = height + 1000;
                    }
                }
                
                // If we have fewer particles than needed (rare with fixed canvas), we could spawn more,
                // but for this demo, we stick to the current particle count.
                
                triggerExplosion();
            }

            // 2. Clear Canvas with trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // Trail
            ctx.fillRect(0, 0, width, height);

            // 3. Update & Draw Particles
            // Glow effect setup
            ctx.globalCompositeOperation = 'lighter';
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            ctx.globalCompositeOperation = 'source-over';
        }

        // Start
        animate();

    </script>
</body>
</html>
