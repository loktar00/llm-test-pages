<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #eef2f3;
            --card-width: 400px;
            --card-height: 250px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 500px;
        }

        /* --- 3D Card Scene --- */
        .scene {
            width: var(--card-width);
            height: var(--card-height);
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1.5);
            transform-style: preserve-3d;
            cursor: pointer;
            animation: hover 6s ease-in-out infinite;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        @keyframes hover {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        /* Prevent hover animation while flipping to avoid jitter */
        .card.flipped {
            animation: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            backface-visibility: hidden;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
        }

        /* Front Face Styling */
        .card-front {
            background: linear-gradient(135deg, #6c5ce7, #4834d4, #220ebd);
            z-index: 2;
        }

        /* Back Face Styyling */
        .card-back {
            background: linear-gradient(135deg, #4834d4, #220ebd);
            transform: rotateY(180deg);
        }

        /* Sheen Effect */
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-25deg);
            animation: sheen 6s infinite;
            pointer-events: none;
        }

        .card.flipped::after {
            animation: none;
        }

        @keyframes sheen {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Typography & Elements */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .card-number {
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 2px 2px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-detail-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Magnetic Strip & CVC Area */
        .magnetic-strip {
            width: 100%;
            height: 40px;
            background: rgba(0,0,0,0.3);
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .cvc-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 10px;
        }

        .cvc-box {
            background: white;
            color: #333;
            width: 60px;
            height: 35px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: 'Courier New', Courier, monologue;
            letter-spacing: 2px;
        }

        /* --- Form Styling --- */
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            background: #fafafa;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        /* Hide actual input when CVC focused for UX logic if needed, 
           but here we use visual cues mostly */
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #5744d1;
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Placeholder styling */
        ::placeholder-shown {
            color: #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 3D Card Preview -->
    <div class="scene">
        <div class="card" id="card">
            <!-- Front -->
            <div class="card-face card-front">
                <div class="card-header">
                    <!-- CSS drawn logo: Stripe style -->
                    <svg class="brand-logo" viewBox="0 0 24 24">
                        <path d="M13.9 3.5c-2 0-3.5 1.5-3.5 3.5 0 1.5.8 2.8 2 3.5-1.5.5-3 1.5-3 3.5 0 2 1.5 3.5 3.5 3.5 2 0 3.5-1.5 3.5-3.5 0-1-.5-2-1.5-2.5.5-.5 1-1.5 1-2.5 0-2-1.5-3.5-3.5-3.5zM2 12c0 1.5 1 2.5 2.5 2.5S7 13.5 7 12 6 9.5 4.5 9.5 2 10.5 2 12zm18 0c0 1.5 1 2.5 2.5 2.5s2.5-1 2.5-2.5-1-2.5-2.5-2.5S20 10.5 20 12z"/>
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                    </svg>
                    <svg class="brand-logo" viewBox="0 0 24 24" style="margin-top:5px;">
                        <path fill="#fff" d="M2,12 C2,17.5 6.5,22 12,22 C17.5,22 22,17.5 22,12 C22,6.5 17.5,2 12,2 C6.5,2 2,6.5 2,12 Z M12,18 C9.24,18 7,15.76 7,13 C7,10.24 9.24,8 12,8 C14.76,8 17,10.24 17,13 C17,15.76 14.76,18 12,18 Z"/>
                    </svg>
                </div>
                
                <div class="card-number" id="disp-number">#### #### #### ####</div>
                
                <div class="card-details">
                    <div class="card-detail-group">
                        <span class="card-label">Account</span>
                        <span class="card-value" id="disp-name">NAME</span>
                    </div>
                    <div class="card-detail-group">
                        <span class="card-label">Expires</span>
                        <span class="card-value" id="disp-expiry">MM/YY</span>
                    </div>
                </div>
            </div>

            <!-- Back -->
            <div class="card-face card-back">
                <div class="magnetic-strip"></div>
                <div style="margin-top: 20px;"></div>
                <div class="cvc-container">
                    <span style="color:white; font-size:0.9rem; font-weight:600;">Full CVC</span>
                    <div class="cvc-box">
                        <span id="disp-cvc">***</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Form -->
    <div class="form-container">
        <form id="paymentForm" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">Card Number</label>
                <input type="text" class="form-input" id="input-number" placeholder="1234 5678 9012 3456" maxlength="19">
            </div>

            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" class="form-input" id="input-name" placeholder="Alex" maxlength="26">
            </div>

            <div class="row">
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="text" class="form-input" id="input-expiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="form-group" style="flex: 0.6;">
                    <label class="form-label">CVC</label>
                    <input type="text" class="form-input" id="input-cvc" placeholder="123" maxlength="3">
                </div>
            </div>

            <button class="submit-btn">Pay</button>
        </form>
    </div>
</div>

<script>
    // Elements
    const card = document.getElementById('card');
    const inputNumber = document.getElementById('input-number');
    const inputName = document.getElementById('input-name');
    const inputExpiry = document.getElementById('input-expiry');
    const inputCVC = document.getElementById('input-cvc');

    const dispNumber = document.getElementById('disp-number');
    const dispName = document.getElementById('disp-name');
    const dispExpiry = document.getElementById('disp-expiry');
    const dispCVC = document.getElementById('disp-cvc');

    // Card Number Logic
    inputNumber.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
        let formattedValue = '';
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) formattedValue += ' ';
            formattedValue += value[i];
        }
        e.target.value = formattedValue;

        // Update Display
        if (formattedValue.length === 0) {
            dispNumber.innerText = '#### #### #### ####';
        } else {
            // Pad with # for visual polish
            let display = formattedValue;
            while(display.replace(/ /g, '').length < 16) {
                display += '#';
            }
            // Adjust spacing visually if partial
            let clean = display.replace(/ /g, '');
            let finalStr = '';
            for(let i=0; i<clean.length; i++) {
                if(i > 0 && i % 4 === 0) finalStr += ' ';
                finalStr += clean[i];
            }
            // Fill remaining with #
            while(finalStr.length < 19) finalStr += '#';
            dispNumber.innerText = finalStr;
        }
    });

    // Name Logic
    inputName.addEventListener('input', (e) => {
        let val = e.target.value;
        dispName.innerText = val.length === 0 ? 'NAME' : val.toUpperCase();
    });

    // Expiry Logic
    inputExpiry.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length >= 2) {
            value = value.substring(0, 2) + '/' + value.substring(2, 4);
        }
        e.target.value = value;

        if (value.length === 0) {
            dispExpiry.innerText = 'MM/YY';
        } else {
            dispExpiry.innerText = value.length < 3 ? value + '/YY' : value;
        }
    });

    // CVC Logic (Flip Interaction)
    inputCVC.addEventListener('focus', () => {
        card.classList.add('flipped');
    });

    inputCVC.addEventListener('blur', () => {
        card.classList.remove('flipped');
    });

    inputCVC.addEventListener('input', (e) => {
        let val = e.target.value.replace(/\D/g, '');
        e.target.value = val;
        dispCVC.innerText = val.length === 0 ? '***' : val;
    });

</script>

</body>
</html>
