<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Dogfight Screensaver</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
canvas.width = 512;
canvas.height = 512;
const ctx = canvas.getContext('2d');

const focalLength = 250;
const cx = canvas.width / 2;
const cy = canvas.height / 2;

function rotateX(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x, y: p.y * c - p.z * s, z: p.z * c + p.y * s };
}
function rotateY(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x * c - p.z * s, y: p.y, z: p.z * c + p.x * s };
}
function rotateZ(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x * c - p.y * s, y: p.y * c + p.x * s, z: p.z };
}

function project(p) {
    if (p.z <= -focalLength) return null;
    const scale = focalLength / (focalLength + p.z);
    return { sx: cx + p.x * scale, sy: cy + p.y * scale, scale, depth: p.z };
}

function dist(a, b) {
    return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2);
}

let time = 0;
let cameraTarget = null;
let cameraTargetTime = 0;
let explosionCam = null;
let respawnTimer = 0;
let msgText = '';
let msgTime = 0;
let totalKills = 0;
let totalDeaths = 0;

class Vec3 {
    constructor(x, y, z) { this.x = x || 0; this.y = y || 0; this.z = z || 0; }
    clone() { return new Vec3(this.x, this.y, this.z); }
    add(v) { return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z); }
    sub(v) { return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z); }
    scale(s) { return new Vec3(this.x * s, this.y * s, this.z * s); }
    len() { return Math.sqrt(this.x ** 2 + this.y ** 2 + this.z ** 2); }
    normalize() { const l = this.len(); return l > 0 ? this.scale(1 / l) : new Vec3(); }
    dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
    cross(v) { return new Vec3(this.y * v.z - this.z * v.y, this.z * v.x - this.x * v.z, this.x * v.y - this.y * v.x); }
}

class Star {
    constructor() {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 2000 + Math.random() * 3000;
        this.x = r * Math.sin(phi) * Math.cos(theta);
        this.y = r * Math.sin(phi) * Math.sin(theta);
        this.z = r * Math.cos(phi);
        this.brightness = 0.3 + Math.random() * 0.7;
        this.twinkleSpeed = 1 + Math.random() * 3;
        this.color = ['#ffffff', '#aaccff', '#ffddaa', '#ffaaaa', '#aaffaa'][Math.floor(Math.random() * 5)];
    }
    draw(cam) {
        let p = { x: this.x - cam.x, y: this.y - cam.y, z: this.z - cam.z };
        p = rotateZ(p, cam.rotZ);
        p = rotateY(p, cam.rotY);
        p = rotateX(p, cam.rotX);
        const proj = project(p);
        if (!proj || proj.sx < -10 || proj.sx > canvas.width + 10 || proj.sy < -10 || proj.sy > canvas.height + 10) return;
        const twinkle = 0.7 + 0.3 * Math.sin(time * this.twinkleSpeed);
        const size = Math.max(0.5, 2 * proj.scale * this.brightness * twinkle);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.brightness * twinkle;
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, size, 0, Math.PI * 2);
        ctx.fill();
        if (size > 1.5) {
            ctx.globalAlpha = this.brightness * twinkle * 0.3;
            ctx.beginPath();
            ctx.arc(proj.sx, proj.sy, size * 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

class Nebula {
    constructor() {
        this.x = (Math.random() - 0.5) * 3000;
        this.y = (Math.random() - 0.5) * 2000;
        this.z = Math.random() * 2500 + 200;
        this.radius = 100 + Math.random() * 250;
        this.hue = Math.random() * 360;
        this.alpha = 0.02 + Math.random() * 0.04;
    }
    draw(cam) {
        let p = { x: this.x - cam.x, y: this.y - cam.y, z: this.z - cam.z };
        p = rotateZ(p, cam.rotZ);
        p = rotateY(p, cam.rotY);
        p = rotateX(p, cam.rotX);
        const proj = project(p);
        if (!proj || proj.depth < -50) return;
        const sr = this.radius * proj.scale;
        const grad = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, sr);
        grad.addColorStop(0, `hsla(${this.hue}, 80%, 50%, ${this.alpha})`);
        grad.addColorStop(0.5, `hsla(${this.hue + 20}, 60%, 30%, ${this.alpha * 0.5})`);
        grad.addColorStop(1, `hsla(${this.hue}, 40%, 10%, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, sr, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, z, vx, vy, vz, color, life, size) {
        this.x = x; this.y = y; this.z = z;
        this.vx = vx; this.vy = vy; this.vz = vz;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = size || 2;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.z += this.vz * dt;
        this.life -= dt;
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.vz *= 0.98;
    }
    draw(cam) {
        if (this.life <= 0) return;
        let p = { x: this.x - cam.x, y: this.y - cam.y, z: this.z - cam.z };
        p = rotateZ(p, cam.rotZ);
        p = rotateY(p, cam.rotY);
        p = rotateX(p, cam.rotX);
        const proj = project(p);
        if (!proj) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        const s = this.size * proj.scale * (0.5 + 0.5 * alpha);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, Math.max(0.5, s), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Explosion {
    constructor(x, y, z, size) {
        this.x = x; this.y = y; this.z = z;
        this.size = size || 1;
        this.particles = [];
        this.birth = time;
        const count = Math.floor(60 * size);
        for (let i = 0; i < count; i++) {
            const dir = new Vec3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
            const speed = (50 + Math.random() * 200) * size;
            const colors = ['#ff4400', '#ff8800', '#ffcc00', '#ffee88', '#ffffff', '#ff2200'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            this.particles.push(new Particle(
                x + dir.x * 2, y + dir.y * 2, z + dir.z * 2,
                dir.x * speed, dir.y * speed, dir.z * speed,
                color, 0.5 + Math.random() * 2, 1.5 + Math.random() * 3
            ));
        }
    }
    update(dt) {
        this.particles.forEach(p => p.update(dt));
        this.particles = this.particles.filter(p => p.life > 0);
    }
    draw(cam) {
        this.particles.forEach(p => p.draw(cam));
    }
    isDead() { return this.particles.length === 0; }
}

class Bullet {
    constructor(x, y, z, dx, dy, dz, owner, color, damage) {
        this.x = x; this.y = y; this.z = z;
        this.vx = dx; this.vy = dy; this.vz = dz;
        this.owner = owner;
        this.color = color || '#00ff88';
        this.damage = damage || 10;
        this.life = 3;
        this.size = 3;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.z += this.vz * dt;
        this.life -= dt;
    }
    draw(cam) {
        let p = { x: this.x - cam.x, y: this.y - cam.y, z: this.z - cam.z };
        p = rotateZ(p, cam.rotZ);
        p = rotateY(p, cam.rotY);
        p = rotateX(p, cam.rotX);
        const proj = project(p);
        if (!proj) return;
        const s = this.size * proj.scale;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, Math.max(1, s), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, s * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Ship {
    constructor(isPlayer, team) {
        this.isPlayer = isPlayer;
        this.team = team || (isPlayer ? 0 : 1);
        this.x = (Math.random() - 0.5) * 1500;
        this.y = (Math.random() - 0.5) * 800;
        this.z = (Math.random() - 0.5) * 1500;
        this.vx = (Math.random() - 0.5) * 100;
        this.vy = (Math.random() - 0.5) * 60;
        this.vz = (Math.random() - 0.5) * 100;
        this.rotX = 0; this.rotY = 0; this.rotZ = 0;
        this.targetRotX = 0; this.targetRotY = 0; this.targetRotZ = 0;
        this.health = 100;
        this.maxHealth = 100;
        this.alive = true;
        this.deathTime = 0;
        this.fireCooldown = 0;
        this.fireRate = 0.15;
        this.speed = isPlayer ? 180 : 80 + Math.random() * 60;
        this.turnSpeed = 2.5;
        this.size = isPlayer ? 1 : 0.6 + Math.random() * 0.5;
        this.shootTimer = Math.random() * 2;
        this.target = null;
        this.wanderAngle = Math.random() * Math.PI * 2;
        this.wanderTimer = Math.random() * 3;
        this.color = isPlayer ? '#4488ff' : ['#ff4444', '#ff8844', '#44ff88', '#ff44aa'][this.team % 4];
        this.hitFlash = 0;
        this.thrustParticles = [];
        this.bodyColor = isPlayer ? '#2244aa' : '#882222';
        this.engineColor = '#4488ff';
    }

    getForward() {
        let f = new Vec3(0, 0, 1);
        f = rotateZ(f, this.rotZ);
        f = rotateY(f, this.rotY);
        f = rotateX(f, this.rotX);
        return f;
    }

    getRight() {
        let r = new Vec3(1, 0, 0);
        r = rotateZ(r, this.rotZ);
        r = rotateY(r, this.rotY);
        r = rotateX(r, this.rotX);
        return r;
    }

    getUp() {
        let u = new Vec3(0, 1, 0);
        u = rotateZ(u, this.rotZ);
        u = rotateY(u, this.rotY);
        u = rotateX(u, this.rotX);
        return u;
    }

    findTarget(ships) {
        let closest = null;
        let closestDist = 1500;
        for (const s of ships) {
            if (s === this || !s.alive) continue;
            const d = dist(this, s);
            if (d < closestDist) {
                closestDist = d;
                closest = s;
            }
        }
        return closest;
    }

    lookAt(target, dt) {
        const dir = target.sub(this).normalize();
        const forward = this.getForward();
        const right = this.getRight();
        const up = this.getUp();

        const forwardDot = dir.dot(forward);
        if (forwardDot > 0.95) return;

        const perp = dir.sub(forward.scale(forwardDot)).normalize();
        const pitch = Math.asin(dir.dot(up));
        const yaw = Math.atan2(dir.dot(right), dir.dot(forward));

        this.targetRotX = pitch * 0.5;
        this.targetRotY = yaw * 0.5;
        this.targetRotZ = 0;
    }

    updateAI(dt, ships, cam) {
        if (!this.alive) return;
        this.fireCooldown -= dt;
        this.hitFlash -= dt;

        const target = this.findTarget(ships);
        if (target) {
            this.lookAt(target, dt);
            const d = dist(this, target);

            if (d < 800 && this.fireCooldown <= 0) {
                this.fireAt(target, ships);
                this.fireCooldown = this.fireRate;
            }

            if (d > 600) {
                const speed = this.speed * 1.2;
                this.vx += (target.x - this.x) / d * speed * dt;
                this.vy += (target.y - this.y) / d * speed * dt;
                this.vz += (target.z - this.z) / d * speed * dt;
            } else if (d < 200) {
                this.vx -= (target.x - this.x) / d * speed * dt;
                this.vy -= (target.y - this.y) / d * speed * dt;
                this.vz -= (target.z - this.z) / d * speed * dt;
            }

            this.vx *= 0.95;
            this.vy *= 0.95;
            this.vz *= 0.95;

            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.z += this.vz * dt;
        } else {
            this.wanderTimer -= dt;
            if (this.wanderTimer <= 0) {
                this.wanderAngle += (Math.random() - 0.5) * 2;
                this.wanderTimer = 2 + Math.random() * 3;
            }
            const spd = this.speed * 0.5;
            this.vx += Math.cos(this.wanderAngle) * spd * dt;
            this.vy += (Math.random() - 0.5) * spd * 0.5 * dt;
            this.vz += Math.sin(this.wanderAngle) * spd * dt;
            this.vx *= 0.98;
            this.vy *= 0.98;
            this.vz *= 0.98;
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.z += this.vz * dt;
        }

        const rSpeed = this.turnSpeed * dt;
        this.rotX += (this.targetRotX - this.rotX) * rSpeed;
        this.rotY += (this.targetRotY - this.rotY) * rSpeed;
        this.rotZ += (this.targetRotZ - this.rotZ) * rSpeed;

        this.x = Math.max(-1500, Math.min(1500, this.x));
        this.y = Math.max(-1000, Math.min(1000, this.y));
        this.z = Math.max(-1000, Math.min(3000, this.z));

        if (this.hitFlash > 0) {
            this.thrustParticles.push(new Particle(

                (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, 50 + Math.random() * 30,
                this.engineColor, 0.3 + Math.random() * 0.3, 1 + Math.random()
            ));
