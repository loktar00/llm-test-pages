<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lightning Storm Screensaver</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        body { background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="storm"></canvas>
<script>
const canvas = document.getElementById('storm');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Colors
const SKY_TOP = '#0a0a2a';
const SKY_BOTTOM = '#1a1a3a';
const CLOUD_COLOR = '#2c2c44';
const LIGHTNING_COLOR = '#ffffff';
const GROUND_COLOR = '#1a2a1a';
const RAIN_COLOR = '#aaccff';
const WINDOW_COLOR = '#ffff99';

// Scene objects
let clouds = [];
let rain = [];
let bolts = [];
let sheetLightnings = [];
let farmhouses = [];

// Simulation state
let flashIntensity = 0;
let boltWaveTimer = 0;
let boltWaveActive = false;

// Initialize clouds
for (let i = 0; i < 12; i++) {
    clouds.push({
        x: Math.random() * canvas.width,
        y: 50 + Math.random() * 150,
        width: 150 + Math.random() * 200,
        height: 60 + Math.random() * 80,
        speed: 0.2 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2
    });
}

// Initialize rain
for (let i = 0; i < 400; i++) {
    rain.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: 10 + Math.random() * 20,
        speed: 5 + Math.random() * 10
    });
}

// Initialize farmhouse
farmhouses.push({
    x: canvas.width * 0.7,
    y: canvas.height * 0.75,
    width: 80,
    height: 60
});

// Draw a cloud
function drawCloud(x, y, w, h, alpha) {
    ctx.fillStyle = `rgba(44, 44, 68, ${alpha})`;
    ctx.beginPath();
    ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x - w / 5, y + h / 4, w / 3, h / 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w / 5, y + h / 4, w / 3, h / 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
}

// Draw the ground
function drawGround(alpha) {
    const grad = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height);
    grad.addColorStop(0, GROUND_COLOR);
    grad.addColorStop(1, '#0f1f0f');
    ctx.fillStyle = grad;
    ctx.globalAlpha = alpha;
    ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
    ctx.globalAlpha = 1;
}

// Draw the farmhouse
function drawFarmhouse(alpha) {
    const f = farmhouses[0];
    ctx.fillStyle = '#332211';
    ctx.globalAlpha = alpha;
    ctx.fillRect(f.x, f.y, f.width, f.height);
    
    // Roof
    ctx.beginPath();
    ctx.moveTo(f.x - 10, f.y);
    ctx.lineTo(f.x + f.width / 2, f.y - 30);
    ctx.lineTo(f.x + f.width + 10, f.y);
    ctx.closePath();
    ctx.fill();
    
    // Lit window
    ctx.fillStyle = WINDOW_COLOR;
    ctx.fillRect(f.x + f.width / 2 - 8, f.y + 15, 16, 16);
    ctx.globalAlpha = 1;
}

// Generate lightning bolt using recursive midpoint displacement
function generateBolt(x1, y1, x2, y2, depth, maxDepth, bolt) {
    if (depth > maxDepth) return;
    
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    
    // Displace midpoint
    const spread = 20 * (maxDepth - depth);
    const displacement = (Math.random() - 0.5) * spread;
    
    // Branching
    bolt.points.push({x: midX, y: midY + displacement});
    
    // Create branch at certain depth
    if (depth < maxDepth - 1 && Math.random() < 0.3) {
        const branchX = midX + (Math.random() - 0.5) * 50;
        const branchY = midY + displacement + 30;
        generateBolt(midX, midY + displacement, branchX, branchY, depth + 1, maxDepth, bolt.segments);
        bolt.segments.push({points: [], x1: midX, y1: midY + displacement, x2: branchX, y2: branchY});
    }
    
    generateBolt(x1, y1, midX, midY + displacement, depth + 1, maxDepth, bolt);
    generateBolt(midX, y1 + displacement, x2, y2, depth + 1, maxDepth, bolt);
}

function createLightningBolt() {
    const startX = canvas.width * 0.3 + (Math.random() - 0.5) * 100;
    const startY = 100;
    const endX = canvas.width * 0.4 + (Math.random() - 0.5) * 200;
    const endY = canvas.height * 0.7;
    
    const bolt = {
        segments: [],
        points: [],
        life: 1.0,
        x1: startX,
        y1: startY,
        x2: endX,
        y2: endY
    };
    
    generateBolt(startX, startY, endX, endY, 0, 5, bolt);
    bolts.push(bolt);
}

function createSheetLightning() {
    sheetLightnings.push({
        x: Math.random() * canvas.width,
        y: 100 + Math.random() * 150,
        size: 100 + Math.random() * 200,
        life: 0.5 + Math.random() * 0.5
    });
}

// Draw lightning bolt
function drawLightning(bolt, alpha) {
    ctx.strokeStyle = LIGHTNING_COLOR;
    ctx.shadowBlur = 20;
    ctx.shadowColor = LIGHTNING_COLOR;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 2;
    
    // Draw main path
    ctx.beginPath();
    ctx.moveTo(bolt.x1, bolt.y1);
    for (const point of bolt.points) {
        ctx.lineTo(point.x, point.y);
    }
    ctx.lineTo(bolt.x2, bolt.y2);
    ctx.stroke();
    
    // Draw segments (branches)
    for (const seg of bolt.segments) {
        ctx.beginPath();
        ctx.moveTo(seg.x1, seg.y1);
        for (const point of seg.points) {
            ctx.lineTo(point.x, point.y);
        }
        ctx.lineTo(seg.x2, seg.y2);
        ctx.stroke();
    }
    
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
}

// Draw sheet lightning
function drawSheetLightning(sl, alpha) {
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
    ctx.fillRect(sl.x - sl.size / 2, sl.y - sl.size / 2, sl.size, sl.size);
}

// Draw rain
function drawRain(alpha) {
    ctx.strokeStyle = RAIN_COLOR;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1;
    
    for (const drop of rain) {
        const wind = Math.sin(Date.now() * 0.001) * 3;
        ctx.beginPath();
        ctx.moveTo(drop.x + wind, drop.y);
        ctx.lineTo(drop.x + wind, drop.y + drop.length);
        ctx.stroke();
        
        // Update rain position
        drop.x += wind * 0.1;
        drop.y += drop.speed;
        
        // Reset if off screen
        if (drop.y > canvas.height + 50) {
            drop.x = Math.random() * canvas.width;
            drop.y = -50;
        }
    }
    
    ctx.globalAlpha = 1;
}

// Main animation loop
function animate() {
    // Update flash intensity
    if (flashIntensity > 0) {
        flashIntensity -= 0.02;
    }
    
    // Update bolt wave timer
    boltWaveTimer += 1;
    if (boltWaveTimer > 300 && !boltWaveActive && Math.random() < 0.02) {
        boltWaveActive = true;
        boltWaveTimer = 0;
    }
    
    if (boltWaveActive) {
        boltWaveTimer += 1;
        if (boltwaveTimer > 100) {
            boltWaveActive = false;
            boltWaveTimer = 0;
        }
    }
    
    // Create lightning bolts in waves
    if (boltWaveActive && Math.random() < 0.15) {
        createLightningBolt();
        flashIntensity = Math.max(flashIntensity, 0.6);
    }
    
    // Occasional sheet lightning
    if (Math.random() < 0.005) {
        createSheetLightning();
        flashIntensity = Math.max(flashIntensity, 0.4);
    }
    
    // Update lightning bolts
    for (let i = bolts.length - 1; i >= 0; i--) {
        const bolt = bolts[i];
        bolt.life -= 0.03;
        if (bolt.life <= 0) {
            bolts.splice(i, 1);
        }
    }
    
    // Update sheet lightnings
    for (let i = sheetLightnings.length - 1; i >= 0; i--) {
        const sl = sheetLightnings[i];
        sl.life -= 0.02;
        if (sl.life <= 0) {
            sheetLightnings.splice(i, 1);
        }
    }
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.7);
    skyGrad.addColorStop(0, SKY_TOP);
    skyGrad.addColorStop(1, SKY_BOTTOM);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height * 0.7);
    
    // Draw clouds with flash effect
    const cloudAlpha = 0.6 + flashIntensity * 0.4;
    for (const cloud of clouds) {
        cloud.x += Math.sin(cloud.phase + Date.now() * 0.0005) * 0.02;
        drawCloud(cloud.x, cloud.y, cloud.width, cloud.height, cloudAlpha);
    }
    
    // Draw sheet lightning inside clouds
    for (const sl of sheetLightnings) {
        drawSheetLightning(sl, sl.life);
    }
    
    // Draw lightning bolts
    for (const bolt of bolts) {
        drawLightning(bolt, bolt.life);
    }
    
    // Apply flash to entire scene
    if (flashIntensity > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity * 0.3})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    
    // Draw ground
    drawGround(0.8 + flashIntensity * 0.2);
    drawFarmhouse(0.7 + flashIntensity * 0.3);
    
    // Draw rain (more intense during flash)
    drawRain(0.5 + flashIntensity * 0.5);
    
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
