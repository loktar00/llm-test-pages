<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Derby: Isometric Combat</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f0e68c;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            user-select: none;
        }
        #health-bar-container {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            margin-top: 5px;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #d32f2f;
            transition: width 0.2s;
        }
        #weapon-info {
            margin-top: 10px;
            font-size: 18px;
            color: #4fc3f7;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
            color: #ffb74d;
        }
        #death-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            display: none;
            z-index: 10;
        }
        h1 { font-size: 48px; margin: 0; color: #d32f2f; text-transform: uppercase; }
        p { font-size: 24px; }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background: #ffb74d;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover { background: #ff9800; }
        .controls { font-size: 14px; color: #aaa; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div id="ui">
    <div id="score">SCORE: 0</div>
    <div id="health-bar-container"><div id="health-bar"></div></div>
    <div id="weapon-info">WEAPON: MACHINE GUN</div>
</div>

<div id="death-screen">
    <h1>DEAD</h1>
    <p>Scraping back to life...</p>
    <div class="controls">WASD to Drive | SPACE to Shoot</div>
</div>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/**
 * SECTION 1: CONFIGURATION & CONSTANTS
 */
const CONFIG = {
    mapSize: 400,
    carCount: 10,
    colors: {
        groundBase: '#8c7b63',
        groundDark: '#6b5d4a',
        road: '#3a3a3a',
        player: '#219684', // Teal
        enemyBase: '#a83232',
        obstacle: '#5d4037'
    },
    physics: {
        friction: 0.92,
        accel: 0.4,
        turnSpeed: 0.06,
        maxSpeed: 2.5,
        boost: 1.6,
        bounce: 0.5
    }
};

// Weapon Definitions
const WEAPONS = {
    machine_gun: { name: 'MG', damage: 8, rate: 10, speed: 3, color: 0xffff00, count: 1, spread: 0 },
    shotgun: { name: 'SHTG', damage: 6, rate: 40, speed: 3, color: 0x00ff00, count: 5, spread: 0.3 },
    cannon: { name: 'CANNON', damage: 40, rate: 90, speed: 2.5, color: 0xff00ff, count: 1, spread: 0 },
    rocket: { name: 'RCKT', damage: 60, rate: 120, speed: 1.5, color: 0xff5500, count: 1, spread: 0.05 }
};

/**
 * SECTION 2: THREE.JS SETUP
 */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Sky blue
scene.fog = new THREE.Fog(0x87CEEB, 100, 500);

// Camera (Orthographic for Isometric)
const aspect = window.innerWidth / window.innerHeight;
const d = 120;
const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
camera.position.set(100, 100, 100);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeebb, 0.8);
dirLight.position.set(100, 200, 50);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -200;
dirLight.shadow.camera.right = 200;
dirLight.shadow.camera.top = 200;
dirLight.shadow.camera.bottom = -200;
scene.add(dirLight);

/**
 * SECTION 3: DYNAMIC GROUND TEXTURE (Persistent Destruction)
 */
const groundSize = 2048;
const groundCanvas = document.createElement('canvas');
groundCanvas.width = groundSize;
groundCanvas.height = groundSize;
const ctx = groundCanvas.getContext('2d');

// Initialize texture
function initGround() {
    ctx.fillStyle = CONFIG.colors.groundBase;
    ctx.fillRect(0, 0, groundSize, groundSize);
    
    // Add noise/texture
    for(let i=0; i<50000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? CONFIG.colors.groundDark : '#7d6e56';
        const x = Math.random() * groundSize;
        const y = Math.random() * groundSize;
        const s = Math.random() * 3;
        ctx.fillRect(x, y, s, s);
    }
    
    // Draw a simple track
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 80;
    ctx.beginPath();
    ctx.moveTo(200, 200);
    ctx.bezierCurveTo(1000, 200, 1000, 1000, 200, 1000);
    ctx.bezierCurveTo(200, 1600, 1800, 1600, 1800, 200);
    ctx.stroke();

    const texture = new THREE.CanvasTexture(groundCanvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    
    const groundGeo = new THREE.PlaneGeometry(CONFIG.mapSize, CONFIG.mapSize);
    const groundMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    
    return { mesh: ground, texture, ctx };
}

const groundData = initGround();

function updateGroundTexture(x, y) {
    // Convert world pos to UV (approx)
    const u = (x / CONFIG.mapSize) * groundSize + groundSize/2;
    const v = (-y / CONFIG.mapSize) * groundSize + groundSize/2;
    
    // Draw dirt patch
    ctx.fillStyle = 'rgba(50, 40, 30, 0.3)';
    ctx.beginPath();
    ctx.arc(u, v, 20, 0, Math.PI*2);
    ctx.fill();
    
    groundData.texture.needsUpdate = true;
}

function drawSkidMark(x, y, angle) {
    const u = (x / CONFIG.mapSize) * groundSize + groundSize/2;
    const v = (-y / CONFIG.mapSize) * groundSize + groundSize/2;
    ctx.save();
    ctx.translate(u, v);
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(20, 20, 20, 0.6)';
    ctx.fillRect(-5, -10, 4, 15); // Left tire
    ctx.fillRect(1, -10, 4, 15);  // Right tire
    ctx.restore();
    groundData.texture.needsUpdate = true;
}

/**
 * SECTION 4: GAME OBJECTS & CLASSES
 */

// Helper: Create Car Mesh
function createCarMesh(color) {
    const group = new THREE.Group();
    
    // Chassis
    const chassisGeo = new THREE.BoxGeometry(4, 2, 8);
    const chassisMat = new THREE.MeshStandardMaterial({ color: color });
    const chassis = new THREE.Mesh(chassisGeo, chassisMat);
    chassis.position.y = 1.5;
    chassis.castShadow = true;
    group.add(chassis);
    
    // Cabin
    const cabinGeo = new THREE.BoxGeometry(3, 1.5, 4);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.y = 3.25;
    cabin.position.z = -1;
    group.add(cabin);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(1, 1, 0.5, 8);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const positions = [
        [-2.2, 1, 3], [2.2, 1, 3], [-2.2, 1, -3], [2.2, 1, -3]
    ];
    positions.forEach(pos => {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(...pos);
        w.castShadow = true;
        group.add(w);
    });

    // Weapon (Visual Only)
    const gunGeo = new THREE.BoxGeometry(0.8, 0.8, 4);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    const gun = new THREE.Mesh(gunGeo, gunMat);
    gun.position.set(0, 2.5, 3);
    group.add(gun);

    return group;
}

// Helper: Create Obstacle
function createObstacle(x, z) {
    const type = Math.random();
    let mesh;
    
    if (type < 0.3) {
        // Rock
        const geo = new THREE.DodecahedronGeometry(Math.random() * 3 + 2);
        const mat = new THREE.MeshStandardMaterial({ color: 0x666666, flatShading: true });
        mesh = new THREE.Mesh(geo, mat);
    } else if (type < 0.6) {
        // Barrel
        const geo = new THREE.CylinderGeometry(1.5, 1.5, 3, 8);
        const mat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
        mesh = new THREE.Mesh(geo, mat);
    } else {
        // Rubble
        const geo = new THREE.BoxGeometry(Math.random()*4+2, Math.random()*2+1, Math.random()*4+2);
        const mat = new THREE.MeshStandardMaterial({ color: 0x554433 });
        mesh = new THREE.Mesh(geo, mat);
    }
    
    mesh.position.set(x, 1.5, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return { mesh, radius: 3, type: 'obstacle' };
}

// Helper: Create Pickup
function createPickup(x, z) {
    const types = Object.keys(WEAPONS);
    const type = types[Math.floor(Math.random() * types.length)];
    const color = WEAPONS[type].color;
    
    const geo = new THREE.OctahedronGeometry(1.5);
    const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 2, z);
    
    scene.add(mesh);
    return { mesh, type, radius: 2 };
}

class Car {
    constructor(x, z, isPlayer = false, weaponKey = 'machine_gun') {
        this.isPlayer = isPlayer;
        this.pos = new THREE.Vector3(x, 0, z);
        this.vel = new THREE.Vector3(0, 0, 0);
        this.angle = Math.random() * Math.PI * 2;
        this.radius = 4;
        this.hp = 100;
        this.maxHp = 100;
        this.dead = false;
        this.respawnTimer = 0;
        this.weapon = WEAPONS[weaponKey];
        this.weaponKey = weaponKey;
        this.cooldown = 0;
        this.stuckTimer = 0;
        this.lastPos = this.pos.clone();
        
        // Visuals
        this.mesh = createCarMesh(isPlayer ? CONFIG.colors.player : CONFIG.colors.enemyBase);
        if (!isPlayer) {
            // Randomize AI colors slightly
            this.mesh.children[0].material.color.setHex(Math.random() * 0xffffff);
        }
        
        scene.add(this.mesh);
        
        // Muzzle flash light
        this.flashLight = new THREE.PointLight(0xffaa00, 0, 10);
        this.mesh.add(this.flashLight);
        this.flashLight.position.set(0, 2.5, 5);
    }

    update(dt) {
        if (this.dead) {
            this.respawnTimer -= dt;
            if (this.respawnTimer <= 0) {
                this.respawn();
            }
            return;
        }

        // Physics Movement
        this.pos.add(this.vel.clone().multiplyScalar(dt));
        this.vel.multiplyScalar(CONFIG.physics.friction);
        
        // Update Mesh Position
        this.mesh.position.copy(this.pos);
        this.mesh.rotation.y = this.angle;

        // Ground Interaction (Skidmarks)
        if (Math.abs(this.vel.length()) > 1) {
            // Simple skid logic based on velocity vector vs angle
            const drift = Math.abs(Math.cos(this.angle) * this.vel.x + Math.sin(this.angle) * this.vel.z - this.vel.length());
            if (drift > 0.5 && Math.random() > 0.7) {
                drawSkidMark(this.pos.x, this.pos.z, this.angle);
            }
        }

        // Cooldown
        if (this.cooldown > 0) this.cooldown--;

        // Stuck detection
        if (this.pos.distanceTo(this.lastPos) < 0.1) {
            this.stuckTimer += dt;
        } else {
            this.stuckTimer = 0;
        }
        this.lastPos.copy(this.pos);

        if (this.stuckTimer > 3) {
            this.explode();
        }
    }

    shoot() {
        if (this.dead || this.cooldown > 0) return;

        this.cooldown = this.weapon.rate;
        
        // Muzzle Flash
        this.flashLight.intensity = 2;
        setTimeout(() => this.flashLight.intensity = 0, 50);

        // Create Projectiles
        for(let i=0; i<this.weapon.count; i++) {
            const spread = (Math.random() - 0.5) * this.weapon.spread;
            const projAngle = this.angle + spread;
            
            // Offset spawn position to tip of gun
            const spawnX = this.pos.x + Math.sin(this.angle) * 5;
            const spawnZ = this.pos.z + Math.cos(this.angle) * 5;
            
            projectiles.push(new Projectile(
                new THREE.Vector3(spawnX, 2.5, spawnZ),
                projAngle,
                this.weapon,
                this
            ));
        }
    }

    takeDamage(amount) {
        this.hp -= amount;
        
        // Flash white
        this.mesh.children[0].material.emissive = new THREE.Color(0xffffff);
        setTimeout(() => {
            if(!this.dead) this.mesh.children[0].material.emissive = new THREE.Color(0x000000);
        }, 50);

        // Dirt puff particles
        spawnParticles(this.pos.x, this.pos.y + 2, this.pos.z, 5, 0x8b4513, 1);

        if (this.hp <= 0) {
            this.explode();
        }
    }

    explode() {
        if(this.dead) return;
        this.dead = true;
        
        // Big Explosion
        spawnParticles(this.pos.x, this.pos.y + 2, this.pos.z, 30, 0xff4400, 4);
        spawnParticles(this.pos.x, this.pos.y + 2, this.pos.z, 10, 0x333333, 3);
        
        // Camera Shake
        if (this.isPlayer) {
            shakeCamera(2);
        } else {
            shakeCamera(0.5);
        }

        // Persistent stain
        updateGroundTexture(this.pos.x, this.pos.z);

        // Delete Mesh (or turn into wreck)
        scene.remove(this.mesh);

        if (this.isPlayer) {
            document.getElementById('death-screen').style.display = 'flex';
            playerScore = Math.max(0, playerScore - 50); // Penalty
        }

        this.respawnTimer = 3.0; // Respawn delay
    }

    respawn() {
        this.dead = false;
        this.hp = 100;
        
        // Find safe spot
        let safeX, safeZ;
        let attempts = 0;
        do {
            safeX = (Math.random() - 0.5) * CONFIG.mapSize * 0.8;
            safeZ = (Math.random() - 0.5) * CONFIG.mapSize * 0.8;
            attempts++;
        } while (obstacles.some(o => dist(safeX, safeZ, o.mesh.position.x, o.mesh.position.z) < 10) && attempts < 50);

        this.pos.set(safeX, 0, safeZ);
        this.vel.set(0,0,0);
        this.angle = Math.random() * Math.PI * 2;
        
        scene.add(this.mesh);
        document.getElementById('death-screen').style.display = 'none';
    }
}

class Projectile {
    constructor(pos, angle, stats, owner) {
        this.pos = pos;
        this.vel = new THREE.Vector3(Math.sin(angle) * stats.speed, 0, Math.cos(angle) * stats.speed);
        this.stats = stats;
        this.owner = owner;
        this.life = 100;
        this.isRocket = stats.name === 'RCKT';

        const geo = new THREE.BoxGeometry(0.5, 0.5, this.isRocket ? 2 : 1);
        const mat = new THREE.MeshBasicMaterial({ color: stats.color });
        this.mesh = new THREE.Mesh(geo, mat);
        this.mesh.position.copy(this.pos);
        scene.add(this.mesh);
    }

    update() {
        this.pos.add(this.vel);
        this.mesh.position.copy(this.pos);
        this.mesh.lookAt(this.pos
