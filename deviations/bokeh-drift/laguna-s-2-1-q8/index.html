<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bokeh Field</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0d021a;
    height: 100%;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="bokeh"></canvas>
<script>
(() => {
  const canvas = document.getElementById('bokeh');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Parallax depth layers
  const NUM_LAYERS = 4;
  const BOKES_PER_LAYER = [30, 25, 20, 15];
  const LAYER_SPEEDS = [0.6, 0.4, 0.25, 0.15];
  const LAYER_SCALE = [1.2, 1.0, 0.8, 0.6]; // size factor
  const LAYER_BLUR = [0.6, 0.8, 1.0, 1.4]; // base blur

  const COLORS = ['#ffb347', '#ffcc33', '#ff9a8b', '#ffd166', '#ff6b6b', '#a8edea'];

  const bokehs = [];
  for (let l = 0; l < NUM_LAYERS; l++) {
    for (let i = 0; i < BOKES_PER_LAYER[l]; i++) {
      const radius = 10 + Math.random() * 40 * LAYER_SCALE[l];
      bokehs.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * LAYER_SPEEDS[l] * 2,
        vy: (Math.random() * 0.1 + 0.05) * LAYER_SPEEDS[l],
        radius: radius,
        layer: l,
        brightness: 0.6 + Math.random() * 0.4,
        sides: 4 + Math.floor(Math.random() * 4),
        rotation: Math.random() * Math.PI * 2,
        rotVel: (Math.random() - 0.5) * 0.01
      });
    }
  }

  const startTime = performance.now();
  const FOCUS_DURATION = 10000; // ms per full cycle

  function animate(time) {
    const elapsed = time - startTime;
    const focusCycle = (elapsed % FOCUS_DURATION) / FOCUS_DURATION;
    const focusLayer = focusCycle * NUM_LAYERS;

    ctx.fillStyle = '#0d021abb';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    bokehs.forEach(b => {
      // Move
      b.x += b.vx;
      b.y += b.vy;

      // Wrap around
      if (b.x > canvas.width + b.radius) b.x = -b.radius;
      if (b.x < -b.radius) b.x = canvas.width + b.radius;
      if (b.y > canvas.height + b.radius) {
        b.y = -b.radius;
        b.x = Math.random() * canvas.width;
      }

      b.rotation += b.rotVel;

      // Focus calculation
      const layerDistFromFocus = Math.abs(b.layer - focusLayer);
      const focusDepthFactor = Math.max(0.1, 1 - layerDistFromFocus * 0.7);
      const focusIntensity = Math.exp(-layerDistFromFocus * 2);

      // Determine shape: sharp polygon when in focus
      const isFocused = layerDistFromFocus < 0.3;
      const polygonSides = b.sides;

      // Brightness: sharper = brighter
      const brightnessFactor = focusIntensity * 0.8 + 0.4;
      const finalBrightness = b.brightness * brightnessFactor;

      // Size factor: larger when moving fast and shallow
      const scale = LAYER_SCALE[b.layer] * (0.8 + focusDepthFactor * 0.4);
      const drawRadius = b.radius * scale;

      const blurAmount = LAYER_BLUR[b.layer] * (0.7 + focusDepthFactor * 0.5);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rotation);
      ctx.globalAlpha = Math.min(0.9, finalBrightness) * (0.3 + focusDepthFactor * 0.7);

      if (isFocused) {
        ctx.filter = 'blur(0px)';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(drawRadius, 0);
        for (let i = 1; i < polygonSides; i++) {
          const a = (i * 2 * Math.PI) / polygonSides;
          ctx.lineTo(drawRadius * Math.cos(a), drawRadius * Math.sin(a));
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.filter = `blur(${blurAmount}px)`;
        ctx.fillStyle = COLORS[b.layer % COLORS.length];
        ctx.beginPath();
        ctx.arc(0, 0, drawRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    });

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
