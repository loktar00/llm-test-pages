<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Playing Match-3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #2a2a2a;
        }

        canvas {
            display: block;
            background: #1e1e24;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }

        #score {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        #combo-text {
            font-size: 24px;
            color: #ffd700;
            opacity: 0;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div id="score">0</div>
        <div id="combo-text"></div>
    </div>
    <canvas id="canvas"></canvas>
</div>

<script>
/**
 * CONFIGURATION & CONSTANTS
 */
const COLS = 8;
const ROWS = 8;
const GEM_SIZE = 60;
const GAP = 4;
const BOARD_OFFSET_X = 30;
const BOARD_OFFSET_Y = 80; // Space for UI
const ANIMATION_SPEED = 0.15; // Lerp factor (0-1)
const GRAVITY_SPEED = 0.2;
const MATCH_DELAY = 400; // ms to wait before dropping
const SWAP_DELAY = 250; // ms for swap
const POP_DURATION = 300; // ms for gem pop

// Gem Types (Colors)
const COLORS = [
    '#FF4757', // Red
    '#2ED573', // Green
    '#1E90FF', // Blue
    '#FFA502', // Orange
    '#A55EEA', // Purple
    '#FF6B81'  // Pink
];

/**
 * UTILITIES
 */
function lerp(start, end, t) {
    return start * (1 - t) + end * t;
}

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function randomColor() {
    return COLORS[Math.floor(Math.random() * COLORS.length)];
}

// Check if starting board has matches
function hasMatches(grid) {
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let color = grid[r][c];
            // Horizontal
            if (c < COLS - 2 && grid[r][c + 1].color === color && grid[r][c + 2].color === color) return true;
            // Vertical
            if (r < ROWS - 2 && grid[r + 1][c].color === color && grid[r + 2][c].color === color) return true;
        }
    }
    return false;
}

/**
 * CLASSES
 */

class Gem {
    constructor(col, row, color) {
        this.col = col;
        this.row = row;
        this.color = color;
        
        // Visual coordinates (pixels)
        this.x = 0;
        this.y = 0;
        this.targetX = 0;
        this.targetY = 0;
        
        // Pop animation
        this.scale = 1;
        this.opacity = 1;
        this.matched = false;
        
        this.calculatePositions();
    }

    calculatePositions() {
        // Calculate where it SHOULD be based on grid coordinates
        this.targetX = BOARD_OFFSET_X + (this.col * GEM_SIZE) + (this.col * GAP) + (GEM_SIZE / 2);
        this.targetY = BOARD_OFFSET_Y + (this.row * GEM_SIZE) + (this.row * GAP) + (GEM_SIZE / 2);
        
        // Initialize visual position if first time
        if (this.x === 0 && this.y === 0) {
            this.x = this.targetX;
            this.y = this.targetY;
        }
    }

    update() {
        // Smooth movement to target
        if (this.matched) {
            this.scale += 0.2;
            this.opacity -= 0.1;
            if (this.opacity <= 0) this.opacity = 0;
        } else {
            // Lerp position
            this.x = lerp(this.x, this.targetX, 0.2);
            this.y = lerp(this.y, this.targetY, 0.2);
            
            // Snap if close
            if (Math.abs(this.x - this.targetX) < 0.5) this.x = this.targetX;
            if (Math.abs(this.y - this.targetY) < 0.5) this.y = this.targetY;

            // Pop scale animation
            if (this.scale > 1) {
                this.scale -= 0.05;
                if (this.scale < 1) this.scale = 1;
            }
        }
    }

    draw(ctx) {
        if (this.opacity <= 0) return;
        
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        // Draw Gem Shape
        const s = GEM_SIZE / 2 - 2;
        
        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.roundRect(-s + 2, -s + 4, s * 2, s * 2, 10);
        ctx.fill();

        // Main Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-s, -s, s * 2, s * 2, 10);
        ctx.fill();

        // Highlight (Glossy effect)
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.beginPath();
        ctx.ellipse(-s/2, -s/2, s/2, s/4, Math.PI/4, 0, Math.PI*2);
        ctx.fill();

        // Inner border
        ctx.strokeStyle = "rgba(0,0,0,0.1)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-s, -s, s * 2, s * 2, 10);
        ctx.stroke();

        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
        this.size = Math.random() * 4 + 2;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // Gravity
        this.life -= this.decay;
    }

    draw(ctx) {
        if (this.life <= 0) return;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

/**
 * MAIN GAME LOGIC
 */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo-text');

// Set canvas size
canvas.width = COLS * GEM_SIZE + (COLS - 1) * GAP + (GAP*2);
canvas.height = ROWS * GEM_SIZE + (ROWS - 1) * GAP + GAP*2 + 100;

let grid = []; // 2D array of Gem objects
let particles = [];
let score = 0;
let comboCount = 0;

// Animation State
let state = 'IDLE'; // IDLE, SWAPPING, CHECKING, FALLING, POPPING
let timer = 0;
let activeGems = []; // Gems involved in current animation

// Initialize Grid
function initGame() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        let row = [];
        for (let c = 0; c < COLS; c++) {
            // Simple generation: ensure no initial matches
            let color = randomColor();
            // Keep trying until valid
            while (true) {
                let match = false;
                // Check left
                if (c >= 2 && row[c-1].color === color && row[c-2].color === color) match = true;
                // Check up
                if (r >= 2 && grid[r-1][c].color === color && grid[r-2][c].color === color) match = true;
                
                if (!match) break;
                color = randomColor();
            }
            row.push(new Gem(c, r, color));
        }
        grid.push(row);
    }
    
    // Set initial visual positions slightly above to "drop in"
    grid.forEach(row => row.forEach(gem => {
        gem.y = -GEM_SIZE - (gem.row * GEM_SIZE); 
    }));
}

// Find a valid move
function findMove() {
    let moves = [];
    // Try swapping right
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 1; c++) {
            if (trySwap(r, c, r, c + 1)) {
                moves.push({r1: r, c1: c, r2: r, c2: c + 1});
            }
        }
    }
    // Try swapping down
    for (let r = 0; r < ROWS - 1; r++) {
        for (let c = 0; c < COLS; c++) {
            if (trySwap(r, c, r + 1, c)) {
                moves.push({r1: r, c1: c, r2: r + 1, c2: c});
            }
        }
    }
    return moves;
}

// Helper to check if a swap creates a match
function trySwap(r1, c1, r2, c2) {
    // Temp swap
    let temp = grid[r1][c1].color;
    grid[r1][c1].color = grid[r2][c2].color;
    grid[r2][c2].color = temp;

    let matches = findMatches();
    
    // Revert
    temp = grid[r1][c1].color;
    grid[r1][c1].color = grid[r2][c2].color;
    grid[r2][c2].color = temp;

    return matches.length > 0;
}

function findMatches() {
    let matchedSet = new Set();

    // Horizontal
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
            let color = grid[r][c].color;
            if (grid[r][c+1].color === color && grid[r][c+2].color === color) {
                matchedSet.add(grid[r][c]);
                matchedSet.add(grid[r][c+1]);
                matchedSet.add(grid[r][c+2]);
            }
        }
    }

    // Vertical
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
            let color = grid[r][c].color;
            if (grid[r+1][c].color === color && grid[r+2][c].color === color) {
                matchedSet.add(grid[r][c]);
                matchedSet.add(grid[r+1][c]);
                matchedSet.add(grid[r+2][c]);
            }
        }
    }
    return Array.from(matchedSet);
}

function processMatchStep() {
    const matches = findMatches();
    
    if (matches.length > 0) {
        comboCount++;
        updateScore(matches.length * 10 * comboCount);
        
        // Trigger Pop Animation
        matches.forEach(gem => {
            gem.matched = true;
            gem.scale = 1; // reset for pop start
            gem.opacity = 1;
            // Spawn particles
            for(let i=0; i<5; i++) {
                particles.push(new Particle(gem.x, gem.y, gem.color));
            }
        });

        state = 'POPPING';
        timer = POP_DURATION;
    } else {
        if (comboCount > 1) {
            showCombo(comboCount);
        }
        // No matches, check gravity
        if (checkGravity()) {
            state = 'FALLING';
            timer = MATCH_DELAY;
        } else {
            // Board is settled
            if (comboCount > 1) comboCount = 0; // Reset combo chain if idle
            nextTurn();
        }
    }
}

function checkGravity() {
    let moved = false;
    // We only care about gems not marked as 'matched'
    for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
            let gem = grid[r][c];
            if (gem.matched) continue;

            // Look down for empty slot (where a matched gem used to be)
            // Note: In this logic, matched gems stay in the grid but become invisible 
            // for a moment until they are physically removed and shifted.
            // However, standard match-3 logic usually clears matched, then shifts.
            // To simplify animation: 
            // 1. Mark matched.
            // 2. When popping done, we effectively set grid[r][c] to null (conceptually).
            // But since we have fixed grid size, we shift existing gems down.
            
            if (r < ROWS - 1) {
                let below = grid[r+1][c];
                if (below.matched) {
                    // This gem falls down
                    gem.row++; 
                    gem.calculatePositions();
                    moved = true;
                }
            }
        }
    }
    return moved;
}

function refillBoard() {
    let refilled = false;
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
            let gem = grid[r][c];
            if (gem.matched) {
                // Replace with new gem
                gem.color = randomColor();
                gem.matched = false;
                gem.scale = 1;
                gem.opacity = 1;
                // Position above board
                gem.row = r; // logical row
                gem.y = (r - 1) * (GEM_SIZE + GAP) - GEM_SIZE * 2; // Start way above
                gem.calculatePositions();
                refilled = true;
            }
        }
    }
    return refilled;
}

function updateScore(points) {
    score += points;
    scoreEl.innerText = score;
    scoreEl.style.transform = "scale(1.2)";
    setTimeout(() => scoreEl.style.transform = "scale(1)", 100);
}

function showCombo(count) {
    if(count > 1) {
        comboEl.innerText = count + "x COMBO!";
        comboEl.style.opacity = 1;
        comboEl.style.transform = "scale(1.5)";
        comboEl.style.transition = "transform 0.1s";
        
        // Animate scale back
        setTimeout(() => {
            comboEl.style.transition = "opacity 0.5s, transform 0.5s";
            comboEl.style.opacity = 0;
            comboEl.style.transform = "scale(1)";
        }, 800);
    }
}

// The AI Brain
function nextTurn() {
    state = 'SWAPPING';
    
    const moves = findMove();
    if (moves.length > 0) {
        const move = moves[Math.floor(Math.random() * moves.length)];
        const g1 = grid[move.r1][move.c1];
        const g2 = grid[move.r2][move.c2];

        // Swap Logical Positions
        let tempCol = g1.col;
        let tempRow = g1.row;
        g1.col = g2.col;
        g1.row = g2.row;
        g2.col = tempCol;
        g2.row = tempRow;

        // Swap Grid Array
        grid[move.r1][move.c1] = g2;
        grid[move.r2][move.c2] = g1;

        // Calculate new targets
        g1.calculatePositions();
        g2.calculatePositions();

        timer = SWAP_DELAY;
    } else {
        // Should not happen often if logic is sound, but fallback is reset
        initGame();
    }
}

/**
 * MAIN LOOP
 */
initGame();

function loop() {
    // 1. Update Logic based on State
    if (timer > 0) {
        timer -= 16.6; // approx 60fps
        if (timer <= 0) {
            timer = 0;
            // State Transition
            switch(state) {
                case 'SWAPPING':
                    state = 'CHECKING';
                    timer = 100;
                    break;
                case 'POPPING':
                    // Remove matched gems logically? 
                    // Actually, we just mark matched=true. 
                    // The refill logic handles replacing them.
                    // But we need to handle the shift.
                    
                    // Shift gems down to fill holes
                    for (let c = 0; c < COLS; c++) {
                        let writeRow = ROWS - 1;
                        for (let r = ROWS - 1; r >= 0; r--) {
                            if (!grid[r][c].matched) {
                                if (writeRow !== r) {
                                    // Swap logical positions
                                    grid[writeRow][c] = grid[r][c];
                                    grid[r][c] = null; // effectively remove
                                }
                                writeRow--;
                            }
                        }
                        // Fill top with new gems
                        for (let r = writeRow; r >= 0; r--) {
                            grid[r][c] = new Gem(c, r, randomColor());
                            grid[r][c].y = -GEM_SIZE - ((writeRow - r) * (GEM_SIZE+GAP));
                        }
                    }
                    state = 'FALLING';
                    timer = 300;
                    break;
                case 'FALLING':
                    // Refill holes if any (visual polish)
                    refillBoard(); 
                    state = 'IDLE';
                    timer = 200; // Small pause before next move
                    break;
                case 'CHECKING':
                    processMatchStep();
                    break;
            }
        }
    } else {
        // IDLE state logic
        if (state === 'IDLE') {
             // Wait briefly then move
             if(Math.random() < 0.05) nextTurn();
        }
    }

    // 2. Update Visuals
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c]) grid[r][c].update();
        }
    }
    particles.forEach(p => p.update());
    particles = particles
