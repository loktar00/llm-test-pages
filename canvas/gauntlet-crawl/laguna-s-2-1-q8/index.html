<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gauntlet Crawl</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:#000; }
#game { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
window.ASSET_MANIFEST = {
  floor:     { file: "assets/floor.png",     prompt: "512x512 seamless dungeon floor tile, stone bricks, mossy gray, top-down, game asset, tiled texture, repeat seamlessly" },
  wall:      { file: "assets/wall.png",      prompt: "512x512 seamless stone wall tile, medieval dungeon blocks, cracked, top-down, game asset" },
  hero:      { file: "assets/hero.png",      prompt: "Top-down hero character sprite, armored warrior, facing north, plain dark background, 64x64, pixel art style" },
  ghost:     { file: "assets/ghost.png",     prompt: "Floating ghost enemy sprite, translucent purple, top-down, glowing eyes, game asset, 64x64" },
  grunt:     { file: "assets/grunt.png",     prompt: "Brute grunt enemy sprite, red skin, club, top-down, game asset, 64x64" },
  generator: { file: "assets/generator.png", prompt: "Demon generator altar sprite, pulsing, spikes, top-down, game asset, 64x64" },
  key:       { file: "assets/key.png",       prompt: "Golden key pickup sprite, RPG item, top-down, plain background, game asset" },
  food:      { file: "assets/food.png",      prompt: "Rations food pickup sprite, medieval, top-down, plain background, game asset" },
  treasure:  { file: "assets/treasure.png",  prompt: "Treasure chest pickup sprite, ornate, top-down, plain background, game asset" },
  exit:      { file: "assets/exit.png",      prompt: "Glowing blue exit portal sprite, top-down, plain background, game asset" }
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', ()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;});

const TILE = 48;
const COLS = Math.floor(W / TILE);
const ROWS = Math.floor(H / TILE);
const MAP_W = Math.max(20, COLS + 4);
const MAP_H = Math.max(16, ROWS + 4);

let assets = {};
let assetPromises = [];

// Load external assets silently
for (const key in window.ASSET_MANIFEST) {
  const url = window.ASSET_MANIFEST[key].file;
  const p = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { assets[key] = img; res(); };
    img.onerror = () => { res(); }; // fallback to procedural if load fails
    img.src = url;
  });
  assetPromises.push(p);
}

// Procedural drawing functions
function drawFloor(x,y,s){
  ctx.fillStyle='#888';
  ctx.fillRect(x,y,s,s);
  ctx.strokeStyle='#777';
  ctx.strokeRect(x,y,s,s);
}
function drawWall(x,y,s){
  ctx.fillStyle='#aaa';
  ctx.fillRect(x,y,s,s);
  ctx.strokeStyle='#999';
  ctx.strokeRect(x,y,s,s);
}
function drawHero(x,y,s){
  ctx.fillStyle='#44f';
  ctx.beginPath();
  ctx.arc(x+s/2,y+s/2,s/3,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#004';
  ctx.stroke();
}
function drawGhost(x,y,s){
  ctx.fillStyle='#e0f';
  ctx.fillRect(x+2,y+2,s-4,s-4);
  ctx.fillStyle='#a0a';
  ctx.fillRect(x+6,y+6,s-12,4);
  ctx.fillRect(x+12,y+10,4,s-20);
}
function drawGrunt(x,y,s){
  ctx.fillStyle='#e44';
  ctx.fillRect(x+4,y+4,s-8,s-8);
  ctx.fillStyle='#a33';
  ctx.fillRect(x+8,y+8,s-16,6);
}
function drawGenerator(x,y,s){
  ctx.fillStyle='#505';
  ctx.fillRect(x+2,y+2,s-4,s-4);
  ctx.strokeStyle='#0ff';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s/4,0,Math.PI*2); ctx.stroke();
}
function drawKey(x,y,s){
  ctx.fillStyle='#fc0';
  ctx.beginPath();
  ctx.ellipse(x+s/2,y+s/3,s/4,s/6,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#da9';
  ctx.fillRect(x+s/3,y+s/3,s/6,s/3);
}
function drawFood(x,y,s){
  ctx.fillStyle='#c84';
  ctx.fillRect(x+4,y+4,s-8,8);
  ctx.fillStyle='#a63';
  ctx.fillRect(x+2,y+12,s-4,4);
}
function drawTreasure(x,y,s){
  ctx.fillStyle='#0c0';
  ctx.fillRect(x+4,y+6,s-8,s-10);
  ctx.strokeStyle='#080';
  ctx.strokeRect(x+4,y+6,s-8,s-10);
}
function drawExit(x,y,s){
  ctx.fillStyle='#0ff';
  ctx.beginPath();
  ctx.arc(x+s/2,y+s/2,s/3,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#0aa';
  ctx.lineWidth=3;
  ctx.stroke();
}

function drawTile(type,x,y,size){
  let fn;
  switch(type){
    case 'floor': fn=drawFloor; break;
    case 'wall': fn=drawWall; break;
    case 'hero': fn=drawHero; break;
    case 'ghost': fn=drawGhost; break;
    case 'grunt': fn=drawGrunt; break;
    case 'generator': fn=drawGenerator; break;
    case 'key': fn=drawKey; break;
    case 'food': fn=drawFood; break;
    case 'treasure': fn=drawTreasure; break;
    case 'exit': fn=drawExit; break;
  }
  if(assets[type]){
    ctx.drawImage(assets[type],x,y,size,size);
  } else if(fn) {
    ctx.save();
    fn(x,y,size);
    ctx.restore();
  }
}

// Game state
let state = {};
let inputMode = false;
let lastInputTime = 0;

function initGame(){
  const maze = generateMaze();
  state = {
    maze,
    hero: {x:0,y:0,hp:100,maxHp:100},
    keys:0,
    score:0,
    level:1,
    enemies:[],
    generators:[],
    items:[],
    projectiles:[],
    exit:{x:0,y:0},
    hpDrainTimer:0,
    gameOver:false,
    gameOverTimer:0,
    moveDir:{x:0,y:0}
  };
  
  // Place hero
  let placed = false;
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(maze[y][x]===0 && x>1 && y>1 && x<MAP_W-2 && y<MAP_H-2){
        if(Math.random()<0.02){
          state.hero.x=x; state.hero.y=y; placed=true;
        }
        if(placed) break;
      }
    }
    if(placed) break;
  }
  
  // Place exit - farthest from hero
  let bestDist=0, bestExit={};
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(maze[y][x]===0){
        let d=Math.abs(x-state.hero.x)+Math.abs(y-state.hero.y);
        if(d>bestDist){
          bestDist=d;
          bestExit={x,y};
        }
      }
    }
  }
  state.exit=bestExit;
  
  // Place items
  for(let i=0;i<5;i++){ // keys
    let p=randomFreeTile();
    if(p) state.items.push({...p,type:'key'});
  }
  for(let i=0;i<3;i++){ // food
    let p=randomFreeTile();
    if(p) state.items.push({...p,type:'food'});
  }
  for(let i=0;i<4;i++){ // treasure
    let p=randomFreeTile();
    if(p) state.items.push({...p,type:'treasure'});
  }
  
  // Place generators (locked rooms)
  for(let i=0;i<3;i++){
    let p=randomFreeTile();
    if(p) state.generators.push({...p,active:true});
  }
  
  function randomFreeTile(){
    for(let tries=0;tries<50;tries++){
      let x=Math.floor(Math.random()*(MAP_W-4))+2;
      let y=Math.floor(Math.random()*(MAP_H-4))+2;
      if(maze[y][x]===0 && 
         Math.abs(x-state.hero.x)+Math.abs(y-state.hero.y)>5){
        return {x,y};
      }
    }
    return null;
  }
}

function generateMaze(){
  // Initialize grid
  let maze = [];
  for(let y=0;y<MAP_H;y++){
    maze[y]=[];
    for(let x=0;x<MAP_W;x++){
      maze[y][x]=1; // walls
    }
  }
  
  // Carve paths with recursive backtracker
  function carve(x,y){
    maze[y][x]=0;
    let dirs=[[0,-2],[2,0],[0,2],[-2,0]];
    // shuffle
    for(let i=dirs.length-1;i>0;i--){
      let j=Math.floor(Math.random()*(i+1));
      [dirs[i],dirs[j]]=[dirs[j],dirs[i]];
    }
    
    for(let [dx,dy] of dirs){
      let nx=x+dx, ny=y+dy;
      if(nx>1 && ny>1 && nx<MAP_W-2 && ny<MAP_H-2 && maze[ny][nx]===1){
        maze[Math.floor((y+ny)/2)][Math.floor((x+nx)/2)]=0;
        carve(nx,ny);
      }
    }
  }
  
  carve(1,1);
  
  // Ensure some locked doors by converting some walls
  for(let y=1;y<MAP_H-1;y++){
    for(let x=1;x<MAP_W-1;x++){
      if(maze[y][x]===1 && Math.random()<0.15){
        // Convert to locked door (marked as 2)
        maze[y][x]=2;
      }
    }
  }
  
  return maze;
}

// AI Control
function aiControl(){
  let bestDir={x:0,y:0};
  let bestScore=-Infinity;
  
  let dirs=[
    {x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0},
    {x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}
  ];
  
  for(let d of dirs){
    let nx=state.hero.x+d.x;
    let ny=state.hero.y+d.y;
    
    if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
    
    let tile=state.maze[ny][nx];
    if(tile===1) continue; // solid wall
    if(tile===2 && state.keys<=0) continue; // locked door, no key
    
    let score=0;
    
    // Distance to exit
    let distToExit=Math.abs(nx-state.exit.x)+Math.abs(ny-state.exit.y);
    score+=1000/distToExit;
    
    // Check item proximity
    for(let item of state.items){
      let dist=Math.abs(nx-item.x)+Math.abs(ny-item.y);
      if(dist<3){
        if(item.type==='key') score+=15;
        else if(item.type==='food') score+=10;
        else if(item.type==='treasure') score+=8;
      }
      score+=1/dist;
    }
    
    // Check generator proximity (for shooting)
    for(let gen of state.generators){
      if(gen.active){
        let dist=Math.abs(nx-gen.x)+Math.abs(ny-gen.y);
        if(dist<5) score-=20/dist; // avoid if too close and can't shoot
        else score+=1/dist; // move to shoot at it
      }
    }
    
    // Enemy avoidance
    for(let enemy of state.enemies){
      let dist=Math.abs(nx-enemy.x)+Math.abs(ny-enemy.y);
      if(dist<3) score-=80/dist; // flee
    }
    
    // Health consideration
    if(state.hero.hp<30) {
      // Find food
      for(let item of state.items){
        if(item.type==='food'){
          let dist=Math.abs(nx-item.x)+Math.abs(ny-item.y);
          score+=20/dist;
        }
      }
    }
    
    if(score>bestScore){
      bestScore=score;
      bestDir=d;
    }
  }
  
  return bestDir;
}

// Input handling
let keysPressed={};
window.addEventListener('keydown',e=>{
  lastInputTime=Date.now();
  
  if(e.code==='Space' || ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){
    inputMode=true;
    lastInputTime=Date.now();
  }
  
  keysPressed[e.code]=true;
  handleInput(e);
});

window.addEventListener('keyup',e=>{
  delete keysPressed[e.code];
});

function handleInput(e){
  let dx=0, dy=0;
  
  if(keysPressed['ArrowUp']||keysPressed['KeyW']) dy=-1;
  else if(keysPressed['ArrowDown']||keysPressed['KeyS']) dy=1;
  if(keysPressed['ArrowLeft']||keysPressed['KeyA']) dx=-1;
  else if(keysPressed['ArrowRight']||keysPressed['KeyD']) dx=1;
  
  if(dx!==0||dy!==0){
    state.moveDir={x:dx,y:dy};
  }
  
  // Shoot in direction of movement
  if(e.code==='Space'){
    let p={
      x:state.hero.x+state.moveDir.x,
      y:state.hero.y+state.moveDir.y,
      dx:state.moveDir.x,
      dy:state.moveDir.y
    };
    state.projectiles.push(p);
  }
}

function update(){
  if(state.gameOver){
    state.gameOverTimer+=16;
    if(state.gameOverTimer>=2000){
      initGame();
    }
    return;
  }
  
  // Check for human input
  let timeSinceInput=Date.now()-lastInputTime;
  if(inputMode && timeSinceInput>10000){
    inputMode=false; // revert to AI
  }
  
  let moveDir;
  if(inputMode && (keysPressed['ArrowUp']||keysPressed['ArrowDown']||keysPressed['ArrowLeft']||keysPressed['ArrowRight']||keysPressed['KeyW']||keysPressed['KeyA']||keysPressed['KeyS']||keysPressed['KeyD'])){
    moveDir={
      x:(keysPressed['ArrowRight']||keysPressed['KeyD']?1:0)-(keysPressed['ArrowLeft']||keysPressed['KeyA']?1:0),
      y:(keysPressed['ArrowDown']||keysPressed['KeyS']?1:0)-(keysPressed['ArrowUp']||keysPressed['KeyW']?1:0)
    };
  } else {
    moveDir=aiControl();
    lastInputTime=Date.now();
  }
  
  // Move hero
  if(moveDir.x!==0||moveDir.y!==0){
    let nx=state.hero.x+moveDir.x;
    let ny=state.hero.y+moveDir.y;
    
    if(nx>=0&&ny>=0&&nx<MAP_W&&ny<MAP_H){
      let tile=state.maze[ny][nx];
      if(tile===0 || (tile===2 && state.keys>0)){
        if(tile===2){
          state.keys--;
        }
        state.hero.x=nx;
        state.hero.y=ny;
        state.moveDir=moveDir;
      }
    }
    
    // Shoot in movement direction when moving
    if(Math.random()<0.3){
      let p={
        x:state.hero.x+moveDir.x,
        y:state.hero.y+moveDir.y,
        dx:moveDir.x,
        dy:moveDir.y
      };
      state.projectiles.push(p);
    }
  }
  
  // Update projectiles
  for(let i=state.projectiles.length-1;i>=0;i--){
    let p=state.projectiles[i];
    p.x+=p.dx;
    p.y+=p.dy;
    
    if(p.x<0||p.y<0||p.x>=MAP_W||p.y>=MAP_H){
      state.projectiles.splice(i,1);
      continue;
    }
    
    let tile=state.maze[Math.floor(p.y)][Math.floor(p.x)];
    if(tile===1){
      state.projectiles.splice(i,1);
    } else if(tile===2){
      // Destroy door
      state.maze[Math.floor(p.y)][Math.floor(p.x)]=0;
      state.projectiles.splice(i,1);
    }
    
    // Check generator hit
    for(let j=state.generators.length-1;j>=0;j--){
      let g=state.generators[j];
      if(g.active && Math.abs(p.x-g.x)<1 && Math.abs(p.y-g.y)<1){
        g.active=false;
        state.projectiles.splice(i,1);
        state.score+=100;
        break;
      }
    }
    
    // Check enemy hit
    for(let j=state.enemies.length-1;j>=0;j--){
      let e=state.enemies[j];
      if(Math.abs(p.x-e.x)<1 && Math.abs(p.y-e.y)<1){
        state.enemies.splice(j,1);
        state.projectiles.splice(i,1);
        state.score+=50;
        break;
      }
    }
  }
  
  // Spawn enemies from generators
  for(let gen of state.generators){
    if(gen.active && Math.random()<0.02){
      let types=['ghost','grunt'];
      let type=types[Math.floor(Math.random()*types.length)];
      state.enemies.push({
        x:gen.x,
        y:gen.y,
        type:type,
        vx:0,
        vy:0
      });
    }
  }
  
  // Update enemies - move toward hero
  for(let i=state.enemies.length-1;i>=0;i--){
    let e=state.enemies[i];
    let dx=state.hero.x-e.x;
    let dy=state.hero.y-e.y;
    let dist=Math.sqrt(dx*dx+dy*dy);
    
    if(dist>0){
      e.vx=dx/dist*0.5;
      e.vy=dy/dist*0.5;
    }
    
    e.x+=e.vx;
    e.y+=e.vy;
    
    // Damage hero
    if(Math.abs(e.x-state.hero.x)<1.2 && Math.abs(e.y-state.hero.y)<1.2){
      state.hero.hp-=0.3;
    }
    
    if(e.x<0||e.y<0||e.x>=MAP_W||e.y>=MAP_H){
      state.enemies.splice(i,1);
    }
  }
  
  // Collect items
  for(let i=state.items.length-1;i>=0;i--){
    let item=state.items[i];
    if(Math.abs(state.hero.x-item.x)<1 && Math.abs(state.hero.y-item.y)<1){
      if(item.type==='key'){
        state.keys++;
      } else if(item.type==='food'){
        state.hero.hp=Math.min(state.hero.maxHp, state.hero.hp+25);
      } else if(item.type==='treasure'){
        state.score+=200;
      }
      state.items.splice(i,1);
    }
  }
  
  // Check exit
  if(Math.abs(state.hero.x-state.exit.x)<1 && Math.abs(state.hero.y-state.exit.y)<1){
    state.level++;
    state.hero.maxHp+=10;
    state.hero.hp=state.hero.maxHp;
    initGame();
    return;
  }
  
  // HP drain
  state.hero.hp-=0.03;
  if(state.hero.hp<=0){
    state.hero.hp=0;
    state.gameOver=true;
    state.gameOverTimer=0;
  }
  
  // Update score
  state.score+=0.1;
}

function render(){
  let camX=Math.floor(state.hero.x)-Math.floor(COLS/2);
  let camY=Math.floor(state.hero.y)-Math.floor(ROWS/2);
  camX=Math.max(0,Math.min(MAP_W-COLS,camX));
  camY=Math.max(0,Math.min(MAP_H-ROWS,camY));
  
  ctx.clearRect(0,0,W,H);
  
  // Draw maze
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      let mx=x+camX;
      let my=y+camY;
      let screenX=x*TILE;
      let screenY=y*TILE;
      
      if(mx>=0&&my>=0&&mx<MAP_W&&my<MAP_H){
        let tile=state.maze[my][mx];
        if(tile===1||tile===2){
          drawTile('wall',screenX,screenY,TILE);
        } else {
          drawTile('floor',screenX,screenY,TILE);
        }
      }
    }
  }
  
  // Draw items
  for(let item of state.items){
    let sx=item.x-camX;
    let sy=item.y-camY;
    if(sx>=0&&sy>=0&&sx<COLS&&sy<ROWS){
      drawTile(item.type,sx*TILE,sy*TILE,TILE);
    }
  }
  
  // Draw exit
  {
    let sx=state.exit.x-camX;
    let sy=state.exit.y-camY;
    if(sx>=0&&sy>=0&&sx<COLS&&sy<ROWS){
      drawTile('exit',sx*TILE,sy*TILE,TILE);
    }
  }
  
  // Draw generators
  for(let gen of state.generators){
    let sx=gen.x-camX;
    let sy=gen.y-camY;
    if(sx>=0&&sy>=0&&sx<COLS&&sy<ROWS){
      drawTile('generator',sx*TILE,sy*TILE,TILE);
    }
  }
  
  // Draw enemies
  for(let e of state.enemies){
    let sx=e.x-camX;
    let sy=e.y-camY;
    if(sx>=0&&sy>=0&&sx<COLS&&sy<ROWS){
      drawTile(e.type,sx*TILE,sy*TILE,TILE);
    }
  }
  
  // Draw projectiles
  for(let p of state.projectiles){
    let sx=p.x-camX;
    let sy=p.y-camY;
    if(sx>=0&&sy>=0&&sx<COLS&&sy<ROWS){
      ctx.fillStyle='#ff0';
      ctx.beginPath();
      ctx.arc(sx*TILE+TILE/2,sy*TILE+TILE/2,TILE/6,0,Math.PI*2);
      ctx.fill();
    }
  }
  
  // Draw hero
  {
    let hx=state.hero.x-camX;
    let hy=state.hero.y-camY;
    if(hx>=0&&hy>=0&&hx<COLS&&hy<ROWS){
      drawTile('hero',hx*TILE,hy*TILE,TILE);
    }
  }
  
  // Draw HUD
  ctx.fillStyle='#000';
  ctx.globalAlpha=0.7;
  ctx.fillRect(0,0,W,60);
  ctx.globalAlpha=1;
  
  ctx.fillStyle='#fff';
  ctx.font='16px monospace';
  ctx.textAlign='left';
  ctx.fillText('HP: '+Math.ceil(state.hero.hp)+' / '+state.hero.maxHp, 10, 25);
  ctx.fillText('SCORE: '+Math.floor(state.score), 10, 50);
  
  ctx.textAlign='center';
  ctx.fillText('KEYS: '+state.keys, W/2, 25);
  ctx.fillText('LEVEL: '+state.level, W/2, 50);
  
  ctx.textAlign='right';
  ctx.fillText('ENEMIES: '+state.enemies.length, W-10, 25);
  
  // Game Over screen
  if(state.gameOver){
    ctx.fillStyle='#f00';
    ctx.globalAlpha=0.8;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.font='48px monospace';
    ctx.textAlign='center';
    ctx.fillText('GAME OVER', W/2, H/2);
    ctx.font='24px monospace';
    ctx.fillText('Final Score: '+Math.floor(state.score), W/2, H/2+50);
  }
}

// Main loop
let lastTime=0;
function gameLoop(timestamp){
  let delta=timestamp-lastTime;
  lastTime=timestamp;
  
  if(!state.hero){
    initGame();
  }
  
  for(let i=0;i<Math.max(1,Math.floor(delta/16));i++){
    update();
    if(state.gameOver && state.gameOverTimer>=2000) break;
  }
  
  render();
  requestAnimationFrame(gameLoop);
}

// Initialize
