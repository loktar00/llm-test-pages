<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volcano Island Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Configuration ---
        const CYCLE_DURATION = 60000; // 60 seconds total cycle
        const SEA_LEVEL_RATIO = 0.7;
        const VOLCANO_WIDTH = 300;
        const VOLCANO_HEIGHT = 400;
        
        // --- State ---
        let time = 0; // 0 to 1 cycle progress
        let lavaOffset = 0; // How far the lava has flowed onto land
        let lavaCrust = 0; // 0 = molten, 1 = crust (dark rock)
        let rumble = 0; // Intensity of shake

        // --- Entities ---
        const particles = [];
        const birds = [];
        const stars = [];

        // --- Initialization ---
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random() * 0.6,
                size: Math.random() * 2,
                twinkle: Math.random() * Math.PI
            });
        }
        for(let i=0; i<15; i++) {
            birds.push({
                x: Math.random() * 1.5 - 0.25,
                y: 0.2 + Math.random() * 0.3,
                speed: 0.0005 + Math.random() * 0.0005,
                wingPhase: Math.random() * Math.PI,
                fleeing: false
            });
        }

        // --- Utilities ---
        function lerp(a, b, t) { return a + (b - a) * t; }
        function map(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) / (inMax - inMin) * (outMax - outMin) + outMin;
        }
        function randomRange(min, max) { return Math.random() * (max - min) + min; }

        function getSkyColors(t) {
            // t: 0-1. 0=noon, 0.25=sunset, 0.5=midnight, 0.75=sunrise
            let top, bottom;
            if (t < 0.25) { // Day -> Sunset
                top = lerpSky(0, t/0.25);
                bottom = lerpSky(1, t/0.25);
            } else if (t < 0.75) { // Sunset -> Sunrise (Night)
                const nightVal = (t - 0.25) / 0.5;
                top = lerpSky(2, nightVal);
                bottom = lerpSky(3, nightVal);
            } else { // Sunrise -> Day
                const dayVal = (t - 0.75) / 0.25;
                top = lerpSky(2, 1-dayVal);
                bottom = lerpSky(3, 1-dayVal);
            }
            return { top, bottom };
        }

        function lerpSky(index, t) {
            // 0: Day Top, 1: Day Bottom, 2: Night Top, 3: Night Bottom
            const colors = ['#4facfe', '#00f2fe', '#0f2027', '#203a43', '#ff7e5f', '#feb47b', '#141e30', '#243b55'];
            // Simplified palette
            if (index === 0) return t < 0.5 ? '#87CEEB' : '#FF7E5F'; // Day Top -> Sunset
            if (index === 1) return t < 0.5 ? '#E0F7FA' : '#FEB47B'; // Day Bottom -> Sunset
            if (index === 2) return t < 0.5 ? '#2c3e50' : '#0f2027'; // Sunset -> Night Top
            if (index === 3) return t < 0.5 ? '#34495e' : '#141e30'; // Sunset -> Night Bottom
            return '#FFF';
        }

        function getSunMoonPos(t) {
            // Simple arc
            const angle = (t * Math.PI * 2) - (Math.PI / 2);
            return {
                x: Math.cos(angle) * 0.4 + 0.5,
                y: Math.sin(angle) * 0.3 + 0.2
            };
        }

        // --- Classes ---

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'ash', 'lava', 'smoke', 'spark', 'steam'
                this.life = 1.0;
                this.decay = randomRange(0.005, 0.02);
                
                if (type === 'lava') {
                    const angle = randomRange(-Math.PI, 0);
                    const speed = randomRange(5, 12);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.gravity = 0.15;
                    this.size = randomRange(3, 8);
                    this.color = `hsl(${randomRange(10, 40)}, 100%, 50%)`;
                } else if (type === 'ash') {
                    this.vx = randomRange(-1, 1);
                    this.vy = randomRange(-2, -0.5);
                    this.size = randomRange(2, 5);
                    this.color = `rgba(50,50,50,${randomRange(0.3,0.8)})`;
                } else if (type === 'smoke') {
                    this.vx = randomRange(-0.5, 0.5);
                    this.vy = randomRange(-1, -2);
                    this.size = randomRange(10, 30);
                    this.color = 'rgba(100,100,100,0.3)';
                } else if (type === 'steam') {
                    this.vx = randomRange(-1, 1);
                    this.vy = randomRange(-2, -4);
                    this.size = randomRange(5, 15);
                    this.color = 'rgba(255,255,255,0.6)';
                    this.decay = 0.015;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;

                if (this.type === 'lava') {
                    this.vy += this.gravity;
                    // Splash logic
                    const seaY = height * SEA_LEVEL_RATIO - (lavaOffset);
                    if (this.y > seaY && this.vx > 0 && this.x < width * 0.6) {
                        this.life = 0;
                        createSplash(this.x, seaY);
                    }
                } else if (this.type === 'ash' || this.type === 'smoke') {
                    this.vx += (Math.random() - 0.5) * 0.1;
                    this.vy -= 0.01; // float up
                }
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                if (this.type === 'lava') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }

        function createSplash(x, y) {
            for(let i=0; i<8; i++) {
                particles.push(new Particle(x, y, 'steam'));
            }
        }

        // --- Scene Setup ---
        const volcanoX = width * 0.5;
        const volcanoBaseY = height * SEA_LEVEL_RATIO;
        const craterX = volcanoX;
        const craterY = height * 0.15; // Peak of volcano

        // --- Drawing Functions ---

        function drawSky(t) {
            const { top, bottom } = getSkyColors(t);
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, top);
            grad.addColorStop(1, bottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Sun/Moon
            const pos = getSunMoonPos(t);
            ctx.beginPath();
            ctx.arc(pos.x * width, pos.y * height, 30, 0, Math.PI * 2);
            ctx.fillStyle = t > 0.25 && t < 0.75 ? '#F4F6F0' : '#FFD700'; // Moon vs Sun
            ctx.fill();
            ctx.fillStyle = t > 0.25 && t < 0.75 ? '#E0E0E0' : '#FFFACD';
        }

        function drawStars(t) {
            if (t > 0.25 && t < 0.75) {
                const alpha = Math.min(1, (t < 0.5 ? t - 0.25 : 0.75 - t) * 5);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                stars.forEach(s => {
                    ctx.globalAlpha = alpha * (0.5 + 0.5 * Math.sin(time * 10 + s.twinkle));
                    ctx.beginPath();
                    ctx.arc(s.x * width, s.y * height, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
        }

        function drawWater() {
            const seaY = height * SEA_LEVEL_RATIO;
            const grad = ctx.createLinearGradient(0, seaY, 0, height);
            grad.addColorStop(0, '#006994');
            grad.addColorStop(1, '#001e36');
            ctx.fillStyle = grad;
            ctx.fillRect(0, seaY, width, height - seaY);

            // Waves (simple lines)
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                const y = seaY + 20 + i * 30;
                for(let x=0; x<width; x+=10) {
                    ctx.lineTo(x, y + Math.sin(x * 0.02 + time * 5 + i) * 5);
                }
                ctx.stroke();
            }
        }

        function drawVolcano() {
            ctx.save();
            // Shake effect
            if (rumble > 0) {
                ctx.translate((Math.random()-0.5)*rumble*2, (Math.random()-0.5)*rumble*2);
            }

            // Body
            ctx.beginPath();
            ctx.moveTo(volcanoX - VOLCANO_WIDTH/2 - lavaOffset*0.2, height);
            ctx.quadraticCurveTo(volcanoX - VOLCANO_WIDTH/2.5, volcanoBaseY - 100, craterX, craterY);
            ctx.lineTo(craterX, craterY + 20); // Crater floor
            ctx.quadraticCurveTo(volcanoX + VOLCANO_WIDTH/2.5, volcanoBaseY - 100, volcanoX + VOLCANO_WIDTH/2 + lavaOffset*0.2, height);
            ctx.fillStyle = '#4a3b3b';
            ctx.fill();

            // Crater rim
            ctx.beginPath();
            ctx.ellipse(craterX, craterY + 10, 30, 10, 0, 0, Math.PI*2);
            ctx.fillStyle = '#2a1f1f';
            ctx.fill();

            // Ash Plume (Passive)
            if (time % CYCLE_DURATION < 15000) {
                ctx.fillStyle = 'rgba(100,100,100,0.4)';
                for(let i=0; i<3; i++) {
                    const px = craterX + Math.sin(time*0.005 + i)*10;
                    const py = craterY - 10 - i*15;
                    const size = 20 + i*10;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            ctx.restore();
        }

        function drawLavaFlow() {
            if (lavaCrust > 0) {
                ctx.save();
                ctx.beginPath();
                // Flowing down right side
                ctx.moveTo(craterX + 10, craterY + 10);
                const endX = volcanoX + VOLCANO_WIDTH/2 + lavaOffset;
                const endY = height * SEA_LEVEL_RATIO + 20;
                
                ctx.quadraticCurveTo(volcanoX + VOLCANO_WIDTH/2 + 50, volcanoBaseY, endX, endY);
                ctx.lineTo(endX, endY + 10);
                ctx.lineTo(volcanoX + VOLCANO_WIDTH/2, volcanoBaseY + 10);
                ctx.quadraticCurveTo(volcanoX + VOLCANO_WIDTH/2.5, volcanoBaseY - 100, craterX + 10, craterY + 10);
                
                ctx.fillStyle = `rgb(${lerp(60, 20, lavaCrust)}, ${lerp(20, 10, lavaCrust)}, ${lerp(20, 10, lavaCrust)})`;
                ctx.fill();

                // Glow effect
                if (lavaCrust < 1) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'orange';
                    ctx.strokeStyle = `rgba(255, 200, 0, ${1-lavaCrust})`;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                ctx.restore();
            }
        }

        function drawTrees() {
            // Left Tree
            drawTree(width * 0.2, height * SEA_LEVEL_RATIO + 10);
            // Right Tree
            drawTree(width * 0.85 - (lavaOffset * 0.1), height * SEA_LEVEL_RATIO + 20);
        }

        function drawTree(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.sin(time * 0.001) * 0.05); // Sway

            // Trunk
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(10, -50, 0, -100);
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 8;
            ctx.stroke();

            // Leaves
            ctx.fillStyle = '#2e7d32';
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                const angle = (i / 5) * Math.PI * 2 + time * 0.0005;
                ctx.ellipse(0 + Math.cos(angle)*20, -100 + Math.sin(angle)*10, 40, 10, angle, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawBirds() {
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            
            birds.forEach(b => {
                // Move
                let speed = b.speed;
                if (b.fleeing) {
                    speed = b.speed * 5;
                    b.x -= speed; // Fly left/away
                } else {
                    b.x += speed; // Circle around
                }

                // Bounds
                if (b.x > 1.5) b.x = -0.2;
                if (b.x < -0.5) b.x = 1.5;

                ctx.beginPath();
                const wingY = Math.sin(time * 0.02 + b.wingPhase) * 5;
                ctx.moveTo(b.x * width - 5, b.y * height + wingY);
                ctx.quadraticCurveTo(b.x * width, b.y * height - 5, b.x * width + 5, b.y * height + wingY);
                ctx.stroke();
            });
        }

        // --- Main Loop ---

        function update(dt) {
            time += dt;
            if (time > CYCLE_DURATION) time -= CYCLE_DURATION;

            const cyclePos = time / CYCLE_DURATION; // 0 to 1
            const phase = (cyclePos * 100000) % 100000; // 0-100k scale for easier logic

            // --- Phase Logic ---
            // 0-2000: Idle (Rumble starts at 1800)
            // 2000-4000: Rumble
            // 4000-8000: Eruption
            // 8000-15000: Lava Flow
            // 15000-20000: Resetting
            // 20000-100000: Idle (Birds return)

            // 1. Rumble
            if (phase > 1800 && phase < 4000) {
                rumble = map(phase, 1800, 4000, 0, 5);
            } else {
                rumble *= 0.9;
            }

            // 2. Eruption (Ash + Lava Bombs)
            if (phase >= 4000 && phase < 8000) {
                rumble = 5;
                // Birds flee
                birds.forEach(b => b.fleeing = true);

                // Spawn Lava Bombs
                if (Math.random() < 0.5) {
                    particles.push(new Particle(craterX, craterY, 'lava'));
                }
                // Spawn Ash
                if (Math.random() < 0.8) {
                    particles.push(new Particle(craterX + (Math.random()-0.5)*20, craterY, 'ash'));
                }
            } else {
                birds.forEach(b => b.fleeing = false);
            }

            // 3. Lava Flow
            if (phase >= 8000 && phase < 15000) {
                lavaOffset = map(phase, 8000, 15000, 0, 150); // Extend shore
                lavaCrust = map(phase, 8000, 15000, 0, 0.9); // Start crusting
            } else if (phase >= 15000) {
                lavaOffset = 0;
                lavaCrust = 0;
            }

            // 4. Particles Update
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            drawSky(time / CYCLE_DURATION);
            drawStars(time / CYCLE_DURATION);
            
            ctx.globalCompositeOperation = 'source-over';
            drawVolcano();
            drawLavaFlow();
            drawWater();
            drawTrees();
            drawBirds();

            // Particles (Additive blending for fire/lava glow)
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => p.draw(ctx));
            ctx.globalCompositeOperation = 'source-over';
        }

        function loop() {
            update(16); // approx 60fps
            draw
