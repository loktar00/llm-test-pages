<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glyph Rain</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  html, body { width: 100%; height: 100%; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function(){
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height, columns, fontSize, columnCount;
    let layers = [];
    let words = ["HELLO", "MATRIX", "CODE", "DREAM", "NEON", "VOID", "CYBER", "GLYPH", "STREAM", "NIGHT", "SYSTEM", "DIGITAL"];
    let activeWords = [];
    let cameraX = 0, cameraY = 0;
    const glyphs = "アァカサタナハマヤラワガザダバパイィキシチニヒミリヰギジディビピウゥクスツヌフムユルヴグズヅブプエェケセテネヘメレヶゲゼデベペオォコソトホモヨロォゴゾドボポ";
    
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        fontSize = Math.max(12, Math.min(width, height) / 45);
        columnCount = Math.floor(width / fontSize);
        
        layers = [
            { count: Math.ceil(columnCount * 0.6), speed: 0.6, size: 0.7, blur: 3, opacity: 0.25 },
            { count: Math.ceil(columnCount * 0.8), speed: 1.0, size: 1.0, blur: 1, opacity: 0.6 },
            { count: Math.ceil(columnCount * 1.2), speed: 1.6, size: 1.4, blur: 0, opacity: 1.0 }
        ];
        
        for (let layer of layers) {
            layer.columns = [];
            for (let i = 0; i < layer.count; i++) {
                layer.columns.push({
                    x: Math.random() * width,
                    y: Math.random() * -height,
                    speed: layer.speed * (0.5 + Math.random())
                });
            }
        }
    }
    
    function randomGlyph() {
        return glyphs[Math.floor(Math.random() * glyphs.length)];
    }
    
    function spawnWord() {
        if (Math.random() < 0.003 && activeWords.length < 2) {
            const word = words[Math.floor(Math.random() * words.length)];
            const layer = layers[1]; // Middle layer for words
            const positions = [];
            let valid = true;
            
            for (let i = 0; i < word.length; i++) {
                const colIdx = Math.floor(Math.random() * (layer.count - word.length - 2)) + 1;
                positions.push({
                    x: colIdx * (width / layer.count),
                    y: Math.random() * height * 0.7,
                    col: colIdx
                });
            }
            
            if (positions.length === word.length) {
                activeWords.push({
                    word: word,
                    positions: positions,
                    life: 1.0,
                    fadeIn: 0.05,
                    layer: layer,
                    timer: 0
                });
            }
        }
    }
    
    function glitchBurst() {
        if (Math.random() < 0.001) {
            const layer = layers[Math.floor(Math.random() * layers.length)];
            const bursts = Math.floor(5 + Math.random() * 15);
            for (let i = 0; i < bursts; i++) {
                const col = layer.columns[Math.floor(Math.random() * layer.columns.length)];
                col.x += (Math.random() - 0.5) * 100;
                col.y += (Math.random() - 0.5) * 100;
            }
        }
    }
    
    function update() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, width, height);
        
        cameraX += (Math.random() - 0.5) * 0.3;
        cameraY += (Math.random() - 0.5) * 0.2;
        
        for (let layer of layers) {
            ctx.save();
            ctx.translate(cameraX * (layer.size - 1) * 0.3, cameraY * (layer.size - 1) * 0.3);
            ctx.font = `${fontSize * layer.size}px monospace`;
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            
            if (layer.blur > 0) {
                ctx.filter = `blur(${layer.blur}px)`;
            } else {
                ctx.filter = 'none';
            }
            
            for (let col of layer.columns) {
                col.y += col.speed;
                
                if (col.y * fontSize > height + fontSize) {
                    col.y = -fontSize;
                    col.x = Math.random() * width;
                }
                
                const yPos = col.y + (cameraY * layer.speed * 0.02);
                const xPos = col.x + (cameraX * layer.speed * 0.01);
                
                if (yPos * fontSize > -fontSize && yPos * fontSize < height + fontSize) {
                    ctx.fillStyle = `hsla(250, 70%, 65%, ${layer.opacity})`;
                    ctx.fillText(randomGlyph(), xPos, yPos);
                }
            }
            ctx.restore();
        }
        
        // Draw words
        for (let i = activeWords.length - 1; i >= 0; i--) {
            const w = activeWords[i];
            w.life -= w.fadeIn;
            w.timer += 0.016;
            
            if (w.life <= 0) {
                activeWords.splice(i, 1);
                continue;
            }
            
            ctx.save();
            ctx.translate(cameraX, cameraY);
            ctx.font = `${fontSize * w.layer.size}px monospace`;
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            
            const glowIntensity = Math.sin(w.timer * 5) * 0.5 + 0.5;
            ctx.shadowBlur = 15 + glowIntensity * 10;
            ctx.shadowColor = '#8A2BE2';
            
            for (let j = 0; j < w.word.length; j++) {
                const pos = w.positions[j];
                const xPos = pos.x + (cameraX * 0.01);
                const yPos = pos.y + (cameraY * 0.005);
                
                if (w.life > 0.7 || w.life < 0.3) {
                    ctx.fillStyle = `hsla(270, 80%, 70%, ${w.life})`;
                } else {
                    ctx.fillStyle = '#FFFFFF';
                }
                
                ctx.fillText(w.word[j], xPos, yPos);
            }
            
            ctx.restore();
        }
        
        spawnWord();
        glitchBurst();
        
        requestAnimationFrame(update);
    }
    
    window.addEventListener('resize', resize);
    resize();
    update();
})();
</script>
</body>
</html>
