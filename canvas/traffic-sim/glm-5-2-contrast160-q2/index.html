<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Traffic Intersection — Dusk Cycle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:0;background:#0d0e24}
canvas{display:block;width:100vw;height:100vh}
.hud{
  position:fixed;top:16;left:16;
  font:11 ui-monospace,system-ui,sans-serif;
  color:#cdb88e;letter-spacing:3;text-transform:uppercase;
  text-shadow:0 0 8 #000;
  pointer-events:none;z-index:3;
  line-height:1.6;
  opacity:0.7
}
.hud .lbl{display:block;color:#c2a3}
.hud .val{color:#fff;font-weight:600}
.hud .tag{
  display:inline-block;width:10;height:10;radius:50;
  margin:0 0 0;vertical-align:middle;
  background:#999
}
</style>
</head>
<body>
<canvas></canvas>
<div class="hud">
  <span class="lbl">Intersection Cycle</span>
  <span class="val" id="phase">— NS —</span>
</div>
<script>
(()=>{
const cv=document.querySelector('canvas');
const ctx=ctxSafe=cv.getContext('2d');
const db=d=>document.body;

// === Configuration =================================================
const C={
  // Palette — dusk, warm sodium + amber traffic lamps
  sky1:'#1a1626',sky2:'#2d1f37',sky3:'#4a2b36',sky4:'#1d1630',
  road:'#242528',roadAlt:'#2a2b2e',roadSnow:'#2d3238',
  shoulder:'#3a3b40',shoulder2:'#444448',
  yellow:'#d6c875',yellowOff:'#a09045',
  amber:'#ff9e3d',amberDim:'#9a4d22',
  green:'#32b034',greenOff:'#0b5022',
  red:'#ee3233',redDim:'#a02828',
  sodium:'#ffb64d',sodiumCool:'#ffd472',
  white:'#fff',
  skinT:'#c8604f',skinP:'#c8757f',skinS:'#a8633a',
  windowGlass:'#4d6e8b',windowDark:'#1a1f26',
  dark:'#1a1f26',darker:'#0d0e14'
};

const L={};
let DPR=Math.max(1,Math.min(2,Math.round(window.devicePixelRatio||1)));

const cv2=document.createElement('canvas');
const ctx2=ctxSafe;
const ctxCtx=ctx2.getContext('2d');

// === Canvas setup ============================================
function resize(){
  const w=innerWidth,h=innerHeight;
  cv.width=w*DPR;cv.height=h*DPR;
  cv.style.width=w+'px';cv.style.height=h+'px';
  ctxCtx.setTransform(DPR,0,0,DPR,0,0);
  L.w=w;L.h=h;L.cx=w/2;L.cy=h/2;
  L.min=Math.min(w,h);L.s=L.min*0.015;L.px=L.s;L.px=L.min/100;
  // Layout proportions (px unit = 1% of min dim)
  L.hRoadW=L.min*0.42; L.vRoadW=L.min*0.42;
  L.hLaneW=L.hRoadW/4; L.vLaneW=L.vRoadW/4;
  // Stopping-box: 2 px-lanes tall (2 lane widths on each side)
  // We define center coords and half-widths in pixels
  L.cx=innerWidth*0.46;
  // L.cy stays at h/2. Recalculate lane offsets
  // Lane center offsets relative to road center, in pixels:
  L.laneX=[L.hLaneW*0.75, L.hLaneW*2.75, L.hLaneW*3.25, L.hLaneW*5.25]; // N,E,S,W
  // Actually: road has 4 lanes, each lane center is at (laneIndex+0.5)*laneWidth
  // lane centers from road center: 0.5, 1.5, -2.5, -2.5 *laneWidth
  // No wait: road has 4 lanes total width = 4*laneWidth
  // centers: 0.5*lw, 1.5*lw, -0.5*lw, -2.5*lw  (relative to left edge)
  // Let me re-think
}
})();
</script>
</body>
</html>
