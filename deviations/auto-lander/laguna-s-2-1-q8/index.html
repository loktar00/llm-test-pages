<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous Lunar Lander</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        body { background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Set canvas to full window size
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Physics constants
const GRAVITY = 0.15;
const THRUST = 0.3;
const FUEL_CAPACITY = 1000;
const MAX_SPEED_LAND = 2;

// Game state
let lander = {
    x: canvas.width / 2,
    y: 50,
    vx: 0,
    vy: 0,
    fuel: FUEL_CAPACITY,
    rotation: 0,
    landed: false,
    phase: 'descent' // descent, landed, liftOff
};

let terrain = [];
let pad = {};
let particles = [];
let lights = [];
let scrollY = 0;
let targetX = 0;
let targetY = canvas.height - 100;
let cycleCount = 0;
let crash = false;

// Generate procedural terrain
function generateTerrain() {
    terrain = [];
    let x = 0;
    let y = canvas.height * 0.8 + (Math.random() - 0.5) * 40;
    
    while (x < canvas.width + 100) {
        let segmentWidth = 20 + Math.random() * 30;
        let slope = (Math.random() - 0.5) * 0.6;
        
        for (let i = 0; i < segmentWidth; i++) {
            terrain.push({x: x + i, y: y});
            y += slope;
        }
        
        x += segmentWidth;
        
        // Add some wider flat areas occasionally
        if (Math.random() < 0.3) {
            let flatLength = 80 + Math.random() * 100;
            for (let i = 0; i < flatLength; i++) {
                terrain.push({x: x + i, y: y});
            }
            x += flatLength;
        }
    }
    
    // Find a suitable flat area for landing pad
    findLandingPad();
}

// Find a flat area for the landing pad
function findLandingPad() {
    let bestStart = 0;
    let bestFlatness = 0;
    
    for (let i = 0; i < terrain.length - 30; i++) {
        let flatness = 0;
        for (let j = 1; j < 30; j++) {
            if (Math.abs(terrain[i+j].y - terrain[i].y) < 3) {
                flatness++;
            }
        }
        if (flatness > bestFlatness) {
            bestFlatness = flatness;
            bestStart = i;
        }
    }
    
    let padX = terrain[bestStart + 15].x;
    let padY = terrain[bestStart + 15].y;
    
    pad = {
        x: padX,
        y: padY,
        width: 40,
        height: 8
    };
    
    targetX = pad.x + pad.width/2;
    targetY = pad.y - 50;
}

// Reset game cycle
function resetCycle() {
    lander.x = canvas.width / 2;
    lander.y = -50;
    lander.vx = (Math.random() - 0.5) * 2;
    lander.vy = 0;
    lander.fuel = FUEL_CAPACITY;
    lander.rotation = 0;
    lander.landed = false;
    lander.phase = 'descent';
    scrollY = 0;
    crash = false;
    generateTerrain();
    cycleCount++;
}

// Create exhaust particles
function createExhaust() {
    for (let i = 0; i < 5; i++) {
        particles.push({
            x: lander.x + (Math.random() - 0.5) * 12,
            y: lander.y + 15,
            vx: (Math.random() - 0.5) * 2 - lander.vx * 0.5,
            vy: -3 + Math.random() * 1 - lander.vy,
            life: 0.5 + Math.random() * 0.3,
            size: 2 + Math.random() * 2,
            r: 255,
            g: 100 + Math.random() * 80,
            b: 0
        });
    }
    
    // Create light particles that illuminate terrain
    if (Math.random() < 0.3) {
        lights.push({
            x: lander.x + (Math.random() - 0.5) * 15,
            y: lander.y + 15,
            vx: (Math.random() - 0.5) * 1,
            vy: -1 - lander.vy * 0.5,
            life: 0.4 + Math.random() * 0.2,
            intensity: 0.5 + Math.random() * 0.5
        });
    }
}

// Create dust particles on hard landing
function createDust() {
    for (let i = 0; i < 30; i++) {
        particles.push({
            x: lander.x + (Math.random() - 0.5) * 20,
            y: lander.y + 15,
            vx: (Math.random() - 0.5) * 6,
            vy: -2 + Math.random() * 2,
            life: 0.8 + Math.random() * 0.4,
            size: 3 + Math.random() * 3,
            r: 180 + Math.random() * 50,
            g: 140 + Math.random() * 40,
            b: 80 + Math.random() * 30
        });
    }
}

// Auto-pilot control logic
function autoPilot() {
    if (lander.phase !== 'descent' || lander.fuel <= 0) return;
    
    // Calculate desired thrust based on position relative to target
    let dx = targetX - lander.x;
    let dy = targetY - lander.y;
    
    // Horizontal correction
    let desiredVx = dx * 0.02;
    let thrustX = (desiredVx - lander.vx) * 0.3;
    
    // Apply horizontal thrust (tilt the lander)
    if (Math.abs(thrustX) > 0.05 && lander.fuel > 10) {
        lander.rotation = Math.max(-Math.PI/4, Math.min(Math.PI/4, thrustX * 0.8));
        lander.vx += thrustX * 0.7;
        lander.fuel -= Math.abs(thrustX) * 0.5;
        createExhaust();
    } else {
        lander.rotation *= 0.9; // Return to upright
    }
    
    // Vertical control - check ground height ahead
    let groundHeight = getGroundHeight(lander.x);
    let distanceToGround = groundHeight - lander.y;
    
    // Calculate required deceleration for soft landing
    let requiredDecel = (lander.vy * lander.vy) / (2 * Math.max(distanceToGround, 10));
    let neededThrust = requiredDecel + GRAVITY;
    
    // Apply vertical thrust
    if (lander.fuel > 5) {
        if (Math.abs(neededThrust) > 0.1 || distanceToGround < 100) {
            let thrustPower = Math.min(THRUST, Math.max(0, neededThrust)) * 0.8 + 0.2;
            lander.vy -= thrustPower;
            lander.fuel -= thrustPower * 2;
            createExhaust();
        }
    }
}

// Get terrain height at x coordinate
function getGroundHeight(x) {
    if (terrain.length === 0) return canvas.height;
    
    // Find closest terrain point
    let closest = terrain[0];
    let minDist = Math.abs(terrain[0].x - x);
    
    for (let i = 1; i < terrain.length; i++) {
        let dist = Math.abs(terrain[i].x - x);
        if (dist < minDist) {
            minDist = dist;
            closest = terrain[i];
        }
    }
    
    return closest.y;
}

// Update game state
function update() {
    if (lander.phase === 'liftOff' || lander.phase === 'landedTransition') {
        // Scroll terrain upward for lift-off effect
        scrollY -= 3;
        if (scrollY < -canvas.height) {
            resetCycle();
        }
        // Apply some upward velocity during lift-off
        lander.y -= 2;
        lander.vy = -2;
        return;
    }
    
    if (lander.phase === 'descent') {
        // Apply gravity
        lander.vy += GRAVITY;
        
        // Run autopilot
        autoPilot();
        
        // Update position
        lander.x += lander.vx;
        lander.y += lander.vy;
        
        // Boundary checks
        if (lander.x < 10) { lander.x = 10; lander.vx *= -0.5; }
        if (lander.x > canvas.width - 10) { lander.x = canvas.width - 10; lander.vx *= -0.5; }
        
        // Check for landing
        let groundHeight = getGroundHeight(lander.x);
        
        if (lander.y + 10 > groundHeight) {
            lander.y = groundHeight - 10;
            
            // Check if landing pad is nearby
            let onPad = Math.abs(lander.x - pad.x) < pad.width;
            let speed = Math.sqrt(lander.vx * lander.vx + lander.vy * lander.vy);
            
            if (onPad && speed < MAX_SPEED_LAND) {
                // Successful landing
                lander.landed = true;
                lander.vx *= 0.3;
                lander.vy = 0;
                lander.phase = 'landed';
                
                // Brief pause then lift off
                setTimeout(() => {
                    lander.phase = 'liftOff';
                }, 1000);
            } else {
                // Crash landing
                crash = true;
                lander.vx *= 0.5;
                lander.vy *= 0.5;
                createDust();
                
                // Still lift off after delay even if crashed
                setTimeout(() => {
                    lander.phase = 'liftOff';
                    lander.landed = false;
                }, 1500);
            }
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // slight gravity on particles
        p.life -= 0.016;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
    
    // Update light particles
    for (let i = lights.length - 1; i >= 0; i--) {
        let l = lights[i];
        l.x += l.vx;
        l.y += l.vy;
        l.life -= 0.016;
        
        if (l.life <= 0) {
            lights.splice(i, 1);
        }
    }
    
    // Apply drag to lander
    if (lander.phase === 'descent') {
        lander.vx *= 0.98;
    }
}

// Render everything
function render() {
    // Clear canvas
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw starry background
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 200; i++) {
        let x = (i * 53 + scrollY * 0.1) % canvas.width;
        let y = (i * 77 + scrollY * 0.2) % canvas.height;
        let size = Math.sin(i + scrollY * 0.01) * 0.5 + 0.5;
        ctx.fillRect(x, y, size, size);
    }
    
    // Apply scroll offset to terrain drawing
    let terrainOffset = scrollY;
    
    // Draw terrain
    ctx.fillStyle = '#554433';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    ctx.lineTo(terrain[0].x, terrain[0].y + terrainOffset);
    
    for (let i = 1; i < terrain.length; i++) {
        ctx.lineTo(terrain[i].x, terrain[i].y + terrainOffset);
    }
    
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();
    
    // Draw landing pad
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(
        pad.x, 
        pad.y + terrainOffset, 
        pad.width, 
        pad.height
    );
    
    // Draw pad markings
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pad.x + 5, pad.y + terrainOffset + 4);
    ctx.lineTo(pad.x + pad.width - 5, pad.y + terrainOffset + 4);
    ctx.stroke();
    
    // Draw landing indicator light
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.arc(pad.x + pad.width/2, pad.y + terrainOffset + 4, 3, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw light particles (for terrain illumination effect)
    for (let light of lights) {
        ctx.save();
        ctx.translate(light.x, light.y + terrainOffset);
        let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 40);
        gradient.addColorStop(0, `rgba(255, 200, 100, ${light.intensity})`);
        gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(-40, -40, 80, 80);
        ctx.restore();
    }
    
    // Draw exhaust particles
    for (let p of particles) {
        ctx.fillStyle = `rgb(${p.r}, ${p.g}, ${p.b})`;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y + terrainOffset, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Draw lander
    drawLander();
    
    // Draw fuel gauge
    drawFuelGauge();
    
    // Draw cycle counter
    ctx.fillStyle = '#fff';
    ctx.font = '16px Arial';
    ctx.fillText(`Landings: ${cycleCount}`, 10, 30);
    
    if (crash) {
        ctx.fillStyle = '#ff5555';
        ctx.font = '20px Arial';
        ctx.fillText('ROUGH LANDING!', canvas.width/2 - 60, 50);
    }
}

// Draw the lunar lander craft
function drawLander() {
    ctx.save();
    ctx.translate(lander.x, lander.y);
    ctx.rotate(lander.rotation);
    
    // Main body
    ctx.fillStyle = '#cccccc';
    ctx.beginPath();
    ctx.moveTo(-10, -20);
    ctx.lineTo(10, -20);
    ctx.lineTo(10, 10);
    ctx.lineTo(-10, 10);
    ctx.fill();
    
    // Top dome
    ctx.beginPath();
    ctx.arc(0, -20, 10, Math.PI, 0, false);
    ctx.fill();
    
    // Engine section
    ctx.fillStyle = '#aaaaaa';
    ctx.fillRect(-8, 10, 16, 10);
    
    // Landing gear
    ctx.strokeStyle = '#888888';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, 18);
    ctx.lineTo(-18, 30);
    ctx.moveTo(10, 18);
    ctx.lineTo(18, 30);
    ctx.stroke();
    
    // Landing pads
    ctx.fillStyle = '#666666';
    ctx.fillRect(-20, 28, 4, 4);
    ctx.fillRect(16, 28, 4, 4);
    
    // Windows
    ctx.fillStyle = '#88ccff';
    ctx.beginPath();
    ctx.arc(-4, -10, 2, 0, Math.PI * 2);
    ctx.arc(4, -10, 2, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

// Draw fuel gauge UI
function drawFuelGauge() {
    let gaugeX = canvas.width - 150;
    let gaugeY = 20;
    let gaugeWidth = 120;
    let gaugeHeight = 20;
    
    // Background
    ctx.fillStyle = '#333';
    ctx.fillRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);
    
    // Fuel level
    let fuelPercent = lander.fuel / FUEL_CAPACITY;
    let fuelColor = fuelPercent > 0.3 ? '#00ff00' : fuelPercent > 0.1 ? '#ffff00' : '#ff0000';
    ctx.fillStyle = fuelColor;
    ctx.fillRect(gaugeX, gaugeY, gaugeWidth * fuelPercent, gaugeHeight);
    
    // Border
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);
    
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = '14px Arial';
    ctx.fillText('FUEL', gaugeX - 30, gaugeY + 14);
}

// Handle window resize
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    generateTerrain();
});

// Initialize and start game loop
generateTerrain();

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
