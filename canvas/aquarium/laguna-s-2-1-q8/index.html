<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquarium</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body { background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="aquarium"></canvas>
<script>
(() => {
  const canvas = document.getElementById('aquarium');
  const ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Utility functions
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

  // Fish species definitions with distinct silhouettes
  const SPECIES = [
    {
      name: 'Tetra',
      color: '#4A90E2',
      size: 8,
      shape: 'triangular',
      speed: 1.5,
      pattern: []
    },
    {
      name: 'Guppy',
      color: '#F5A623',
      size: 10,
      shape: 'oval',
      speed: 1.2,
      pattern: [{type: 'spots', count: 3}]
    },
    {
      name: 'Angelfish',
             color: '#D0021B',
      size: 18,
      shape: 'disc',
      speed: 1.0,
      pattern: [{type: 'stripe', width: 4}]
    },
    {
      name: 'Molly',
      color: '#7ED321',
      size: 12,
      shape: 'rounded',
      speed: 0.9,
      pattern: [{type: 'spots', count: 5}]
    },
    {
      name: 'Betta',
      color: '#9013FE',
      size: 7,
      shape: 'spike',
      speed: 1.8,
      pattern: [{type: 'fan', side: 'tail'}]
    }
  ];

  // Fish class with wandering and darting behavior
  class Fish {
    constructor() {
      this.species = SPECIES[randInt(0, SPECIES.length - 1)];
      
      // Scale size by species
      this.size = this.species.size * rand(0.8, 1.3);
      this.x = rand(this.size * 2, canvas.width - this.size * 2);
      this.y = rand(canvas.height * 0.1, canvas.height * 0.9);
      
      // Movement properties
      this.angle = rand(0, Math.PI * 2);
      this.speed = this.species.speed * rand(0.7, 1.3);
      this.maxSpeed = this.speed * 2.5;
      this.acceleration = 0.05;
      this.wanderAngle = rand(0, Math.PI * 2);
      this.steeringForce = 0.02;
      this.turnSpeed = 0.02;
      
      // Darting behavior
      this.isDarting = false;
      this.dartTimer = 0;
      this.dartDirection = 1;
      
      // Size variation for swimming animation
      this.swimPhase = rand(0, Math.PI * 2);
      this.swimSpeed = rand(0.02, 0.05);
      this.swimAmplitude = this.size * 0.3;
    }
    
    update() {
      // Wander steering using Perlin-like noise simulation
      this.wanderAngle += this.turnSpeed * (0.5 + Math.random());
      
      // Apply gentle wander steering
      const wanderForceX = Math.cos(this.wanderAngle) * this.steeringForce;
      const wanderForceY = Math.sin(this.wanderAngle) * this.steeringForce;
      
      this.angle += (Math.atan2(wanderForceY, wanderForceX) - this.angle) * 0.03;
      
      // Random small direction changes
      if (Math.random() < 0.005) {
        this.wanderAngle += rand(-1, 1);
      }
      
      // Darting when startled (random chance)
      if (!this.isDarting && Math.random() < 0.001) {
        this.isDarting = true;
        this.dartTimer = rand(10, 30);
        this.dartDirection = Math.random() > 0.5 ? 1 : -1;
      }
      
      // Handle darting
      if (this.isDarting) {
        if (this.dartTimer <= 0) {
          this.isDarting = false;
        } else {
          this.dartTimer--;
          // Dart in direction perpendicular to current heading or continue
          const dartAngle = this.angle + (this.dartDirection * Math.PI / 3);
          this.angle = this.angle + (dartAngle - this.angle) * 0.2;
        }
      }
      
      // Calculate velocity based on angle
      const vx = Math.cos(this.angle);
      const vy = Math.sin(this.angle);
      
      let currentSpeed = this.speed;
      if (this.isDarting) {
        currentSpeed = this.maxSpeed * 0.7;
      }
      
      this.x += vx * currentSpeed;
      this.y += vy * currentSpeed;
      
      // Wall avoidance with smooth steering
      const margin = this.size * 3;
      const turnForce = 0.1;
      
      if (this.x < margin) {
        this.angle += (Math.PI - this.angle) * turnForce * 0.1;
      } else if (this.x > canvas.width - margin) {
        this.angle += (-this.angle) * turnForce * 0.1;
      }
      
      if (this.y < margin + this.size) {
        this.angle += (Math.PI / 2 - this.angle) * turnForce * 0.1;
        this.y = margin + this.size;
      } else if (this.y > canvas.height - margin) {
        this.angle += (Math.PI * 1.5 - this.angle) * turnForce * 0.1;
      }
      
      // Keep in bounds
      this.x = Math.max(this.size, Math.min(canvas.width - this.size, this.x));
      this.y = Math.max(this.size * 2, Math.min(canvas.height - this.size, this.y));
      
      // Update swim animation phase
      this.swimPhase += this.swimSpeed * (0.8 + this.speed * 0.2);
    }
    
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Swim cycle animation
      const swimOffset = Math.sin(this.swimPhase) * this.swimAmplitude;
      
      // Draw fish based on species shape
      switch(this.species.shape) {
        case 'triangular':
          // Tetra - triangular body
          ctx.beginPath();
          ctx.moveTo(this.size, 0);
          ctx.bezierCurveTo(
            this.size * 0.3, this.size * 0.6,
            -this.size * 0.5, this.size * 0.4,
            -this.size * 0.2, 0
          );
          ctx.bezierCurveTo(
            -this.size * 0.5, -this.size * 0.4,
            this.size * 0.3, -this.size * 0.6,
            this.size, 0
          );
          ctx.closePath();
          ctx.fillStyle = this.species.color;
          ctx.fill();
          break;
          
        case 'oval':
          // Guppy - oval body with spotted pattern
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
          ctx.fillStyle = this.species.color;
          ctx.fill();
          
          // Spots
          ctx.fillStyle = darkenColor(this.species.color, 30);
          for (let i = 0; i < 3; i++) {
            const spotX = rand(-this.size * 0.4, this.size * 0.2);
            const spotY = rand(-this.size * 0.3, this.size * 0.3);
            const spotSize = rand(this.size * 0.15, this.size * 0.25);
            ctx.beginPath();
            ctx.arc(spotX, spotY, spotSize, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
          
        case 'disc':
          // Angelfish - disc shaped with vertical stripe
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size * 0.7, 0, 0, Math.PI * 2);
          ctx.fillStyle = this.species.color;
          ctx.fill();
          
          // Vertical stripe
          ctx.fillStyle = darkenColor(this.species.color, 40);
          ctx.fillRect(-2, -this.size * 0.6, 4, this.size * 1.2);
          break;
          
        case 'rounded':
          // Molly - rounded body
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size * 0.7, 0, 0, Math.PI * 2);
          ctx.fillStyle = this.species.color;
          ctx.fill();
          
          // Spots
          ctx.fillStyle = darkenColor(this.species.color, 30);
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const spotX = Math.cos(angle) * this.size * 0.5;
            const spotY = Math.sin(angle) * this.size * 0.4;
            ctx.beginPath();
            ctx.arc(spotX, spotY, this.size * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
          
        case 'spike':
          // Betta - spiky with flowing fins
          ctx.beginPath();
          ctx.moveTo(this.size, 0);
          ctx.bezierCurveTo(
            this.size * 0.4, this.size * 0.5,
            -this.size * 0.2, this.size * 0.6,
            -this.size * 0.4, this.size * 0.2
          );
          ctx.bezierCurveTo(
            -this.size * 0.5, this.size * 0.3,
            -this.size * 0.8, -this.size * 0.1,
            -this.size * 0.3, -this.size * 0.1
          );
          ctx.bezierCurveTo(
            -this.size * 0.8, -this.size * 0.3,
            -this.size * 0.5, -this.size * 0.6,
            -this.size * 0.2, -this.size * 0.4
          );
          ctx.bezierCurveTo(
            -this.size * 0.2, -this.size * 0.6,
            this.size * 0.4, -this.size * 0.5,
            this.size, 0
          );
          ctx.closePath();
          ctx.fillStyle = this.species.color;
          ctx.fill();
          
          // Tail fin
          ctx.beginPath();
          ctx.moveTo(-this.size * 0.8, 0);
          ctx.bezierCurveTo(
            -this.size * 1.2, this.size * 0.3,
            -this.size * 1.3, -this.size * 0.3,
            -this.size * 0.8, 0
          );
          ctx.closePath();
          ctx.fillStyle = this.species.color;
          ctx.fill();
          break;
      }
      
      // Draw eye
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(this.size * 0.3, -this.size * 0.2, this.size * 0.15, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }
  }

  function darkenColor(color, percent) {
    const num = parseInt(color.replace("#", ""), 2);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) - amt;
    const G = (num >> 8 & 0x00FF) - amt;
    const B = (num & 0x0000FF) - amt;
    return "#" + (0x1000000 + (R<0?0:R) * 0x10000 + (G<0?0:G) * 0x100 + (B<0?0:B)).toString(16).slice(1);
  }

  // Bubbler class - creates rising wobbling bubbles
  class Bubbler {
    constructor() {
      this.x = canvas.width * 0.1;
      this.y = canvas.height * 0.9;
      this.bubbles = [];
      this.wobble = 0;
    }
    
    update() {
      this.wobble += 0.05;
      
      // Create new bubbles
      if (Math.random() < 0.3) {
        this.bubbles.push({
          x: this.x + rand(-5, 5),
          y: this.y,
          size: rand(2, 6),
          speed: rand(0.5, 2),
          wobbleOffset: rand(0, Math.PI * 2),
          wobbleAmount: rand(0.5, 2)
        });
      }
      
      // Update bubbles
      for (let i = this.bubbles.length - 1; i >= 0; i--) {
        const b = this.bubbles[i];
        b.y -= b.speed;
        b.wobbleOffset += 0.1;
        b.x += Math.sin(b.wobbleOffset) * b.wobbleAmount * 0.1;
        
        // Remove bubbles that reach the surface
        if (b.y < 0) {
          this.bubbles.splice(i, 1);
        }
      }
    }
    
    draw() {
      ctx.save();
      
      // Draw bubbler base
      ctx.fillStyle = '#555';
      ctx.beginPath();
      ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw bubbles with highlight
      for (const b of this.bubbles) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(173, 216, 230, ${Math.min(1, b.y / canvas.height + 0.3)})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 255, 255, 0.7)`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
      
      ctx.restore();
    }
  }

  // Plant class - swaying underwater plants
  class Plant {
    constructor(x, height) {
      this.x = x;
      this.height = height;
      this.segments = Math.floor(height / 8);
      this.swayAmount = rand(0.5, 2);
      this.swaySpeed = rand(0.01, 0.02);
      this.phase = rand(0, Math.PI * 2);
    }
    
    update() {
      this.phase += 0.02;
    }
    
    draw() {
      ctx.save();
      ctx.beginPath();
      
      let currentX = this.x;
      const segmentHeight = this.height / this.segments;
      
      for (let i = 0; i <= this.segments; i++) {
        const y = canvas.height - (i * segmentHeight) - 10;
        const sway = Math.sin(this.phase + i * 0.3) * this.swayAmount * i;
        currentX = this.x + sway;
        
        if (i === 0) {
          ctx.moveTo(currentX, y);
        } else {
          ctx.quadraticCurveTo(currentX, y, currentX, y);
        }
        
        // Draw leaflets
        if (i > 0 && i % 2 === 0) {
          ctx.save();
          ctx.translate(currentX, y);
          ctx.rotate(Math.sin(this.phase + i) * 0.3);
          ctx.fillStyle = '#2ecc71';
          ctx.beginPath();
          ctx.ellipse(0, 0, 3, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      
      ctx.strokeStyle = '#27ae60';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();
      
      ctx.restore();
    }
  }

  // Hermit crab on the gravel
  class HermitCrab {
    constructor() {
      this.x = canvas.width * 0.8;
      this.y = canvas.height * 0.95;
      this.size = 10;
      this.angle = -Math.PI / 4;
      this.moving = false;
      this.targetX = this.x;
    }
    
    update() {
      // Occasionally move to a new position
      if (!this.moving && Math.random() < 0.005) {
        this.moving = true;
        this.targetX = rand(canvas.width * 0.6, canvas.width * 0.95);
      }
      
      if (this.moving) {
        const dx = this.targetX - this.x;
        if (Math.abs(dx) < 1) {
          this.moving = false;
        } else {
          this.x += dx * 0.03;
          this.angle = dx > 0 ? 0 : -Math.PI;
        }
      }
    }
    
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Shell
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size * 1.2, this.size, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#E67E22';
      ctx.fill();
      ctx.strokeStyle = '#D35400';
      ctx.lineWidth = 1;
      ctx.stroke();
      
      // Shell pattern
      ctx.strokeStyle = '#D35400';
      ctx.lineWidth = 0.8;
      for (let i = 0; i < 5; i++) {
        const y = -this.size + (i * this.size * 0.5);
        ctx.beginPath();
        ctx.arc(0, y, this.size * 0.8, 0, Math.PI);
        ctx.stroke();
      }
      
      // Legs
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const legY = i * 3;
        ctx.beginPath();
        ctx.moveTo(-this.size, legY);
        ctx.lineTo(-this.size * 2, legY + 2);
        ctx.stroke();
      }
      for (let i = 0; i < 3; i++) {
        const legY = i * 3 - 2;
        ctx.beginPath();
        ctx.moveTo(-this.size, legY);
        ctx.lineTo(-this.size * 2, legY + 2);
        ctx.stroke();
      }
      
      // Eyes on stalks
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(this.size * 0.5, -this.size * 0.8, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.size * 0.7, -this.size * 0.8, 2, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }
  }

  // Caustic light ripples effect
  class Caustics {
    constructor() {
      this.time = 0;
    }
    
    update() {
      this.time += 0.01;
    }
    
    draw() {
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
      gradient.addColorStop(0, 'rgba(255, 255, 200, 0.05)');
      gradient.addColorStop(0.5, 'rgba(255, 255, 220, 0.1)');
      gradient.addColorStop(1, 'rgba(255, 255, 200, 0.05)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw rippling lines to simulate caustics
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      
      for (let i = 0; i < 20; i++) {
        const y = (i / 20) * canvas.height;
        ctx.beginPath();
        ctx.moveTo(0, y);
        
        for (let x = 0; x < canvas.width; x += 20) {
          const wave = Math.sin(x * 0.02 + this.time + i * 0.5) * 3;
          ctx.lineTo(x, y + wave);
        }
        
        ctx.stroke();
      }
      
      ctx.restore();
    }
  }

  // Background gradient
  function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#87CEEB');
    gradient.addColorStop(0.3, '#B0E0E6');
    gradient.addColorStop(0.7, '#5F9EA0');
    gradient.addColorStop(1, '#2C5F66');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw gravel at bottom
  function drawGravel() {
    ctx.fillStyle = '#8B7D6B';
    ctx.fillRect(0, canvas.height * 0.9, canvas.width, canvas.height * 0.1);
    
    // Individual gravel pieces
    ctx.fillStyle = '#A0522D';
    for (let i = 0; i < 100; i++) {
      const x = rand(0, canvas.width);
      const y = canvas.height * 0.9 + rand(0, canvas.height * 0.1);
      const size = rand(2, 5);
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Initialize scene
  const fishCount = randInt(12, 20);
  const fishes = [];
  for (let i = 0; i < fishCount; i++) {
    fishes.push(new Fish());
  }

  const bubbler = new Bubbler();
  
  const plants = [];
  for (let i = 0; i < 8; i++) {
    const x = (canvas.width / 9) * (i + 1);
    const height = rand(40, 100);
    plants.push(new Plant(x, height));
  }
  
  const hermit = new HermitCrab();
  const caustics = new Caustics();

  // Animation loop
  function animate() {
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw background
    drawBackground();
    
    // Draw gravel
    drawGravel();
    
    // Draw and update caustics
    caustics.update();
    caustics.draw();
    
    // Draw and update plants
    for (const plant of plants) {
      plant.update();
      plant.draw();
    }
    
    // Draw and update hermit crab
    hermit.update();
    hermit.draw();
    
    // Draw and update fish
    for (const fish of fishes) {
      fish.update();
      fish.draw();
    }
    
    // Draw and update bubbler
    bubbler.update();
    bubbler.draw();
    
    // Continue animation
    requestAnimationFrame(animate);
  }

  // Start the aquarium
  animate();
})();
</script>
</body>
</html>
