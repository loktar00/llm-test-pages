<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wasteland Derby: Isometric Combat</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #eee;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }
        .bar-container { width: 200px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #555; margin-bottom: 5px; }
        #health-bar { width: 100%; height: 100%; background: #c0392b; transition: width 0.2s; }
        #weapon-info { font-size: 18px; color: #f1c40f; margin-top: 10px; }
        #score { font-size: 24px; color: #fff; margin-top: 5px; }
        #msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 40px; text-shadow: 0 0 10px red; display: none; font-weight: bold;
        }
    </style>
</head>
