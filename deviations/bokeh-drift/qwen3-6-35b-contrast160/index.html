<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
<title>Bokeh Field</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050510}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
var W,H;

function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// --- Color Palettes ---
var warmPalettes=[
    {r:255,g:210,b:130},{r:255,g:170,b:90},{r:255,g:130,b:80},
    {r:255,g:240,b:200},{r:220,g:180,b:120},{r:255,g:200,b:160},
    {r:200,g:150,b:100},{r:255,g:250,b:220}
];
var accentPalettes=[
    {r:80,g:140,b:255},{r:255,g:100,b:180},{r:100,g:255,b:200},
    {r:160,g:100,b:255},{r:255,g:140,b:60},{r:60,g:220,b:255}
];

// --- Config ---
var NUM_DOTS=60;
var NUM_DEPTH_LAYERS=5;
var CYCLE_DURATION=10;
var FOCUS_SMOOTHNESS=0.04;

// --- Dot Class ---
function Dot(){
    this.reset(true);
}

Dot.prototype.reset=function(initial){
    this.depth=Math.random();
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.baseRadius=8+this.depth*35;
    this.speed=(0.08+this.depth*0.25)*(Math.random()>0.5?1:-1);
    this.driftY=(0.02+this.depth*0.06)*(Math.random()>0.5?1:-1);
    this.phase=Math.random()*Math.PI*2;
    this.wobbleAmp=1+this.depth*3;

    // Color
    this.isAccent=Math.random()<0.15;
    if(this.isAccent){
        var ap=accentPalettes[Math.floor(Math.random()*accentPalettes.length)];
        this.color={r:ap.r,g:ap.g,b:ap.b};
    }else{
        var wp=warmPalettes[Math.floor(Math.random()*warmPalettes.length)];
        this.color={r:wp.r,g:wp.g,b:wp.b};
    }

    // Polygon sides
    this.sides=6;
    this.rotationPhase=Math.random()*Math.PI*2;
    this.rotationSpeed=(Math.random()-0.5)*0.3;

    // For initial placement spread
    if(initial){
        this.x=Math.random()*W;
        this.y=Math.random()*H;
    }
};

// --- State ---
var dots=[];
for(var i=0;i<NUM_DOTS;i++){
    dots.push(new Dot());
}

var focusTarget=0;
var focusCurrent=0;
var focusTimer=0;
var cyclePhase=0;

// --- Pre-rendered dot images ---
var dotCache=[];
var CACHE_SIZE=4;

function createDotImage(dot,w,h){
    var img=new Image();
    img.width=w;
    img.height=h;
    var cx=w/2;
    var cy=h/2;
    var r=Math.min(cx,cy);

    var c=dot.color;
    var sides=dot.sides;

    // Build polygon path
    ctx.beginPath();
    for(var i=0;i<=sides;i++){
        var angle=(i/sides)*Math.PI*2-Math.PI/2;
        var px=cx+r*Math.cos(angle);
        var py=cy+r*Math.sin(angle);
        if(i===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
    }
    ctx.closePath();

    // Radial gradient fill
    var grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0,"rgba("+Math.min(255,c.r+60)+","+Math.min(255,c.g+60)+","+Math.min(255,c.b+60)+",1)");
    grad.addColorStop(0.4,"rgba("+c.r+","+c.g+","+c.b+",0.85)");
    grad.addColorStop(0.75,"rgba("+Math.floor(c.r*0.7)+","+Math.floor(c.g*0.7)+","+Math.floor(c.b*0.7)+",0.5)");
    grad.addColorStop(1,"rgba("+Math.floor(c.r*0.3)+","+Math.floor(c.g*0.3)+","+Math.floor(c.b*0.3)+",0)");

    ctx.fillStyle=grad;
    ctx.fill();

    // Outer glow
    ctx.beginPath();
    ctx.arc(cx,cy,r*1.15,0,Math.PI*2);
    var glow=ctx.createRadialGradient(cx,cy,r*0.3,cx,cy,r*1.15);
    glow.addColorStop(0,"rgba("+c.r+","+c.g+","+c.b+",0.12)");
    glow.addColorStop(1,"rgba("+c.r+","+c.g+","+c.b+",0)");
    ctx.fillStyle=glow;
    ctx.fill();

    // Store image data
    var imageData=ctx.getImageData(0,0,w,h);
    return imageData;
}

function buildDotCache(){
    dotCache=[];
    for(var i=0;i<CACHE_SIZE;i++){
        var layerDots=[];
        for(var j=0;j<dots.length;j++){
            var dot=dots[j];
            if(Math.floor(dot.depth*(CACHE_SIZE-1))===i){
                var w=Math.ceil(dot.baseRadius*2.5);
                var h=Math.ceil(dot.baseRadius*2.5);
                layerDots.push(createDotImage(dot,w,h));
            }
        }
        dotCache.push(layerDots);
    }
}
buildDotCache();

// --- Main Loop ---
var lastTime=0;

function update(dt){
    cyclePhase+=dt/CYCLE_DURATION;
    if(cyclePhase>=1){
        cyclePhase-=1;
        focusTarget=Math.random();
    }

    focusCurrent+=(focusTarget-focusCurrent)*FOCUS_SMOOTHNESS;

    for(var i=0;i<dots.length;i++){
        var dot=dots[i];
        dot.x+=dot.speed*dt*60;
        dot.y+=dot.driftY*dt*60;
        dot.phase+=dt*1.5;
        dot.rotationPhase+=dot.rotationSpeed*dt;

        if(dot.x<-dot.baseRadius*2)dot.x=W+dot.baseRadius*2;
        if(dot.x>W+dot.baseRadius*2)dot.x=-dot.baseRadius*2;
        if(dot.y<-dot.baseRadius*2)dot.y=H+dot.baseRadius*2;
        if(dot.y>H+dot.baseRadius*2)dot.y=-dot.baseRadius*2;
    }
}

function render(){
    // Background
    ctx.fillStyle="#050510";
    ctx.fillRect(0,0,W,H);

    // Subtle background gradient for atmosphere
    var bgGrad=ctx.createRadialGradient(W/2,H*0.6,0,W/2,H*0.6,W*0.8);
    bgGrad.addColorStop(0,"rgba(20,15,30,0.6)");
    bgGrad.addColorStop(0.5,"rgba(10,8,20,0.3)");
    bgGrad.addColorStop(1,"rgba(5,5,16,0)");
    ctx.fillStyle=bgGrad;
    ctx.fillRect(0,0,W,H);

    // Sort dots by depth (back to front)
    var sortedDots=dots.slice().sort(function(a,b){return a.depth-b.depth});

    // Focus parameters
    var focusDepth=focusCurrent;
    var focusWidth=0.25;

    for(var i=0;i<sortedDots.length;i++){
        var dot=sortedDots[i];
        var depthDiff=Math.abs(dot.depth-focusDepth);
        var focusFactor=1-Math.max(0,Math.min(1,(depthDiff-focusWidth*0.3)/(focusWidth*0.7)));
        focusFactor=Math.pow(focusFactor,2);

        // Shimmer
        var shimmer=0.85+0.15*Math.sin(dot.phase*2+dot.x*0.01);

        // Effective radius
        var baseR=dot.baseRadius;
        var blurAmount=depthDiff*2;
        var r=baseR*(1+blurAmount*0.5);
        var displayR=r*(0.6+0.4*focusFactor);

        // Brightness based on focus
        var brightness=0.2+0.8*focusFactor;
        var alpha=(0.3+0.7*focusFactor)*shimmer*brightness;

        if(alpha<0.01)continue;

        // Get pre-rendered image for this depth layer
        var layerIdx=Math.floor(dot.depth*(CACHE_SIZE-1));
        if(layerIdx>=CACHE_SIZE)layerIdx=CACHE_SIZE-1;
        var layer=dotCache[layerIdx];
        if(!layer||layer.length===0)continue;

        var imgData=null;
        for(var j=0;j<layer.length;j++){
            if(layer[j].dot===dot){
                imgData=layer[j];
                break;
            }
        }
        // Fallback: find by index in sorted
        if(!imgData){
            // Re-find the dot in layer
            for(var j=0;j<layer.length;j++){
                // We store reference in the create function
            }
        }

        // Simpler approach: draw directly
        drawDot(dot,displayR,alpha);
    }
}

function drawDot(dot,r,alpha){
    var c=dot.color;
    var cx=dot.x;
    var cy=dot.y;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(dot.rotationPhase);

    var sides=dot.sides;
    var outerR=r;
    var innerR=r*0.6;

    // Glow
    ctx.beginPath();
    ctx.arc(0,0,outerR*1.3,0,Math.PI*2);
    var glow=ctx.createRadialGradient(0,0,outerR*0.2,0,0,outerR*1.3);
    glow.addColorStop(0,"rgba("+c.r+","+c.g+","+c.b+","+alpha*0.15+")");
    glow.addColorStop(1,"rgba("+c.r+","+c.g+","+c.b+",0)");
    ctx.fillStyle=glow;
    ctx.fill();

    // Polygon
    ctx.beginPath();
    for(var i=0;i<=sides;i++){
        var angle=(i/sides)*Math.PI*2-Math.PI/2;
        var px=outerR*Math.cos(angle);
        var py=outerR*Math.sin(angle);
        if(i===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
    }
    ctx.closePath();

    var grad=ctx.createRadialGradient(0,0,0,0,0,outerR);
    grad.addColorStop(0,"rgba("+Math.min(255,c.r+50)+","+Math.min(255,c.g+50)+","+Math.min(255,c.b+50)+","+(alpha*0.9)+")");
    grad.addColorStop(0.4,"rgba("+c.r+","+c.g+","+c.b+","+alpha*0.7+")");
    grad.addColorStop(0.75,"rgba("+Math.floor(c.r*0.6)+","+Math.floor(c.g*0.6)+","+Math.floor(c.b*0.6)+","+(alpha*0.35)+")");
    grad.addColorStop(1,"rgba("+Math.floor(c.r*0.2)+","+Math.floor(c.g*0.2)+","+Math.floor(c.b*0.2)+",0)");

    ctx.fillStyle=grad;
    ctx.fill();

    ctx.restore();
}

// --- Fixed: use pre-rendered images approach for performance ---
// Let's rebuild with simpler direct drawing for each dot per frame
// (Above function is kept for reference, now rewrite properly)

// Actually, let's use a simpler approach: draw each dot directly
// We'll clear the render function and rewrite properly

function renderOptimized(){
    ctx.fillStyle="#050510";
    ctx.fillRect(0,0,W,H);

    // Subtle background atmosphere
    var bgGrad=ctx.createRadialGradient(W*0.5,H*0.65,0,W*0.5,H*0.65,W*0.7);
    bgGrad.addColorStop(0,"rgba(18,12,28,0.5)");
    bgGrad.addColorStop(0.6,"rgba(8,6,18,0.2)");
    bgGrad.addColorStop(1,"rgba(5,5,16,0)");
    ctx.fillStyle=bgGrad;
    ctx.fillRect(0,0,W,H);

    // Sort by depth
    dots.sort(function(a,b){return a.depth-b.depth});

    var focusDepth=focusCurrent;
    var focusWidth=0.22;

    for(var i=0;i<dots.length;i++){
        var dot=dots[i];
        var depthDiff=Math.abs(dot.depth-focusDepth);
        var focusFactor=1-Math.max(0,Math.min(1,(depthDiff-focusWidth*0.25)/(focusWidth*0.75)));
        focusFactor=Math.pow(focusFactor,1.8);

        var shimmer=0.82+0.18*Math.sin(dot.phase*2.3+dot.x*0.008+dot.y*0.005);
        var blurAmount=depthDiff*2.5;
        var r=dot.baseRadius*(1+blurAmount*0.6);
        var displayR=r;
        var brightness=0.15+0.85*focusFactor;
        var alpha=(0.25+0.75*focusFactor)*shimmer*brightness;

        if(alpha<0.008)continue;

        drawBokehDot(dot,displayR,alpha);
    }
}

function drawBokehDot(dot,r,alpha){
    var c=dot.color;
    var cx=dot.x;
    var cy=dot.y;
    var sides=dot.sides;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(dot.rotationPhase);

    // Outer glow
    ctx.beginPath();
    ctx.arc(0,0,r*1.4,0,Math.PI*2);
    var glow=ctx.createRadialGradient(0,0,r*0.15,0,0,r*1.4);
    glow.addColorStop(0,"rgba("+c.r+","+c.g+","+c.b+","+alpha*0.18+")");
    glow.addColorStop(0.5,"rgba("+c.r+","+c.g+","+c.b+","+alpha*0.06+")");
    glow.addColorStop(1,"rgba("+c.r+","+c.g+","+c.b+",0)");
    ctx.fillStyle=glow;
    ctx.fill();

    // Polygon shape
    ctx.beginPath();
    for(var i=0;i<=sides;i++){
        var angle=(i/sides)*Math.PI*2-Math.PI/2;
        var px=r*Math.cos(angle);
        var py=r*Math.sin(angle);
        if(i===0)ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
    }
    ctx.closePath();

    // Fill gradient
    var grad=ctx.createRadialGradient(0,0,0,0,0,r);
    grad.addColorStop(0,"rgba("+Math.min(255,c.r+60)+","+Math.min(255,c.g+60)+","+Math.min(255,c.b+60)+","+(alpha*0.95)+")");
    grad.addColorStop(0.35,"rgba("+c.r+","+c.g+","+c.b+","+alpha*0.75+")");
    grad.addColorStop(0.7,"rgba("+Math.floor(c.r*0.65)+","+Math.floor(c.g*0.65)+","+Math.floor(c.b*0.65)+","+(alpha*0.35)+")");
    grad.addColorStop(1,"rgba("+Math.floor(c.r*0.25)+","+Math.floor(c.g*0.25)+","+Math.floor(c.b*0.25)+",0)");

    ctx.fillStyle=grad;
    ctx.fill();

    ctx.restore();
}

// --- Animation Loop ---
function animate(timestamp){
    if(!lastTime)lastTime=timestamp;
    var dt=Math.min((timestamp-lastTime)/1000,0.05);
    lastTime=timestamp;

    update(dt);
    renderOptimized();

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

})();
</script>
</body>
</html>
