<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowing Cloth Ribbons</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initRibbons(); });

const NUM_RIBBONS = 5;
const SEGMENTS = 80;
const REST_LENGTH = 12;
const CONSTRAINT_ITERATIONS = 12;
const GRAVITY = 0.15;
const DAMPING = 0.985;
const WIND_STRENGTH = 1.8;
const LIGHT_DIR = { x: 0.4, y: -0.6 };
const LIGHT_DIR_N = Math.sqrt(LIGHT_DIR.x * LIGHT_DIR.x + LIGHT_DIR.y * LIGHT_DIR.y);
LIGHT_DIR.x /= LIGHT_DIR_N;
LIGHT_DIR.y /= LIGHT_DIR_N;

const RIBBON_COLORS = [
  { r: 220, g: 60, b: 90 },
  { r: 240, g: 140, b: 40 },
  { r: 80, g: 180, b: 255 },
  { r: 160, g: 100, b: 240 },
  { r: 80, g: 220, b: 160 },
];

const RIBBON_WIDTHS = [18, 16, 20, 15, 19];

class Point {
  constructor(x, y, pinned = false) {
    this.x = x;
    this.y = y;
    this.ox = x;
    this.oy = y;
    this.pinned = pinned;
  }
}

class Ribbon {
  constructor(x, color, width, phaseOffset) {
    this.points = [];
    this.color = color;
    this.width = width;
    this.phaseOffset = phaseOffset;
    for (let i = 0; i < SEGMENTS; i++) {
      this.points.push(new Point(x, i * REST_LENGTH, i === 0));
    }
  }

  update(time) {
    const pts = this.points;

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p.pinned) continue;

      const vx = (p.x - p.ox) * DAMPING;
      const vy = (p.y - p.oy) * DAMPING;

      p.ox = p.x;
      p.oy = p.y;

      // Gravity
      p.x += vx;
      p.y += vy + GRAVITY;

      // Procedural wind field
      const yNorm = i / pts.length;
      const wind1 = Math.sin(time * 0.3 + yNorm * 3.0 + this.phaseOffset) * 0.6;
      const wind2 = Math.sin(time * 0.15 + yNorm * 5.5 + this.phaseOffset * 1.3) * 0.4;
      const wind3 = Math.sin(time * 0.5 + yNorm * 2.0 + this.phaseOffset * 0.7) * 0.3;
      const wind4 = Math.sin(time * 0.08 + yNorm * 8.0 + this.phaseOffset * 1.7) * 0.25;
      const gust = Math.sin(time * 0.05 + this.phaseOffset * 2.1) * 0.5 + 0.5;
      const windForce = (wind1 + wind2 + wind3 + wind4) * WIND_STRENGTH * (0.5 + gust * 0.5);

      // Wind increases with distance from top (like a flag)
      const windMultiplier = yNorm * yNorm;
      p.x += windForce * windMultiplier;

      // Slight vertical wind component for rippling
      p.y += Math.sin(time * 0.4 + yNorm * 4.0 + this.phaseOffset) * 0.15 * windMultiplier;
    }

    // Constraint solving
    for (let iter = 0; iter < CONSTRAINT_ITERATIONS; iter++) {
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i];
        const b = pts[i + 1];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist === 0) continue;
        const diff = (REST_LENGTH - dist) / dist * 0.5;
        const ox = dx * diff;
        const oy = dy * diff;
        if (!a.pinned) { a.x -= ox; a.y -= oy; }
        if (!b.pinned) { b.x += ox; b.y += oy; }
      }
    }
  }

  draw(ctx, time) {
    const pts = this.points;
    const c = this.color;
    const baseW = this.width;

    // Draw ribbon as a filled path
    ctx.beginPath();

    // Left edge (front to back)
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      let nx = 0, ny = 0;
      if (i < pts.length - 1) {
        const dx = pts[i + 1].x - p.x;
        const dy = pts[i + 1].y - p.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      } else {
        const dx = p.x - pts[i - 1].x;
        const dy = p.y - pts[i - 1].y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      }

      // Sheen based on segment orientation toward light
      let tangentX = 0, tangentY = 1;
      if (i < pts.length - 1) {
        tangentX = pts[i + 1].x - p.x;
        tangentY = pts[i + 1].y - p.y;
        const tlen = Math.sqrt(tangentX * tangentX + tangentY * tangentY) || 1;
        tangentX /= tlen;
        tangentY /= tlen;
      }

      // Normal pointing toward viewer (we use the perpendicular)
      // Sheen: dot of normal with light direction
      const sheen = Math.max(0, nx * LIGHT_DIR.x + ny * LIGHT_DIR.y);
      const sheenBright = Math.pow(sheen, 2) * 0.7;

      // Curvature-based sheen: how much the ribbon bends toward light
      const curvatureSheen = Math.abs(sheen) * 0.5;

      const wMod = 1.0 + sheenBright * 0.3;
      const w = baseW * wMod;

      const lx = p.x + nx * w * 0.5;
      const ly = p.y + ny * w * 0.5;

      if (i === 0) ctx.moveTo(lx, ly);
      else ctx.lineTo(lx, ly);
    }

    // Right edge (back to front)
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i];
      let nx = 0, ny = 0;
      if (i < pts.length - 1) {
        const dx = pts[i + 1].x - p.x;
        const dy = pts[i + 1].y - p.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      } else {
        const dx = p.x - pts[i - 1].x;
        const dy = p.y - pts[i - 1].y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      }

      let tangentX = 0, tangentY = 1;
      if (i < pts.length - 1) {
        tangentX = pts[i + 1].x - p.x;
        tangentY = pts[i + 1].y - p.y;
        const tlen = Math.sqrt(tangentX * tangentX + tangentY * tangentY) || 1;
        tangentX /= tlen;
        tangentY /= tlen;
      }

      const sheen = Math.max(0, nx * LIGHT_DIR.x + ny * LIGHT_DIR.y);
      const sheenBright = Math.pow(sheen, 2) * 0.7;
      const wMod = 1.0 + sheenBright * 0.3;
      const w = baseW * wMod;

      const rx = p.x - nx * w * 0.5;
      const ry = p.y - ny * w * 0.5;

      ctx.lineTo(rx, ry);
    }

    ctx.closePath();

    // Create gradient along the ribbon
    const topPt = pts[0];
    const botPt = pts[pts.length - 1];
    const grad = ctx.createLinearGradient(topPt.x, topPt.y, botPt.x, botPt.y);
    const alpha = 0.85;
    grad.addColorStop(0, `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`);
    grad.addColorStop(0.3, `rgba(${Math.min(255, c.r + 40)}, ${Math.min(255, c.g + 40)}, ${Math.min(255, c.b + 40)}, ${alpha})`);
    grad.addColorStop(0.7, `rgba(${Math.max(0, c.r - 30)}, ${Math.max(0, c.g - 30)}, ${Math.max(0, c.b - 30)}, ${alpha})`);
    grad.addColorStop(1, `rgba(${Math.max(0, c.r - 60)}, ${Math.max(0, c.g - 60)}, ${Math.max(0, c.b - 60)}, ${alpha})`);
    ctx.fillStyle = grad;
    ctx.fill();

    // Draw sheen overlay
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      let nx = 0, ny = 0;
      if (i < pts.length - 1) {
        const dx = pts[i + 1].x - p.x;
        const dy = pts[i + 1].y - p.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      } else {
        const dx = p.x - pts[i - 1].x;
        const dy = p.y - pts[i - 1].y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      }

      const sheen = Math.max(0, nx * LIGHT_DIR.x + ny * LIGHT_DIR.y);
      const sheenVal = Math.pow(sheen, 1.5);

      // Curvature sheen: compare consecutive segment directions
      let curvatureSheen = 0;
      if (i > 0 && i < pts.length - 2) {
        const dx1 = pts[i].x - pts[i - 1].x;
        const dy1 = pts[i].y - pts[i - 1].y;
        const dx2 = pts[i + 1].x - pts[i].x;
        const dy2 = pts[i + 1].y - pts[i].y;
        const l1 = Math.sqrt(dx1 * dx1 + dy1 * dy1) || 1;
        const l2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
        const dot = (dx1 / l1) * (dx2 / l2) + (dy1 / l1) * (dy2 / l2);
        curvatureSheen = Math.max(0, 1 - dot) * 0.6;
      }

      const totalSheen = Math.min(1, sheenVal + curvatureSheen);

      const wMod = 1.0 + sheenVal * 0.3;
      const w = baseW * wMod;

      const lx = p.x + nx * w * 0.5;
      const ly = p.y + ny * w * 0.5;

      if (i === 0) ctx.moveTo(lx, ly);
      else ctx.lineTo(lx, ly);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i];
      let nx = 0, ny = 0;
      if (i < pts.length - 1) {
        const dx = pts[i + 1].x - p.x;
        const dy = pts[i + 1].y - p.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      } else {
        const dx = p.x - pts[i - 1].x;
        const dy = p.y - pts[i - 1].y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      }

      const sheen = Math.max(0, nx * LIGHT_DIR.x + ny * LIGHT_DIR.y);
      const sheenVal = Math.pow(sheen, 1.5);
      let curvatureSheen = 0;
      if (i > 0 && i < pts.length - 2) {
        const dx1 = pts[i].x - pts[i - 1].x;
        const dy1 = pts[i].y - pts[i - 1].y;
        const dx2 = pts[i + 1].x - pts[i].x;
        const dy2 = pts[i + 1].y - pts[i].y;
        const l1 = Math.sqrt(dx1 * dx1 + dy1 * dy1) || 1;
        const l2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
        const dot = (dx1 / l1) * (dx2 / l2) + (dy1 / l1) * (dy2 / l2);
        curvatureSheen = Math.max(0, 1 - dot) * 0.6;
      }
      const totalSheen = Math.min(1, sheenVal + curvatureSheen);

      const wMod = 1.0 + sheenVal * 0.3;
      const w = baseW * wMod;

      const rx = p.x - nx * w * 0.5;
      const ry = p.y - ny * w * 0.5;

      ctx.lineTo(rx, ry);
    }
    ctx.closePath();

    const sheenGrad = ctx.createLinearGradient(topPt.x, topPt.y, botPt.x, botPt.y);
    sheenGrad.addColorStop(0, `rgba(255, 255, 255, 0.0)`);
    sheenGrad.addColorStop(0.5, `rgba(255, 255, 255, 0.15)`);
    sheenGrad.addColorStop(1, `rgba(255, 255, 255, 0.05)`);
    ctx.fillStyle = sheenGrad;
    ctx.fill();

    // Per-segment sheen highlights
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i];
      const prev = pts[i - 1];

      const dx = p.x - prev.x;
      const dy = p.y - prev.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const tx = dx / len;
      const ty = dy / len;

      // Normal
      const nx = -ty;
      const ny = tx;

      // Sheen from light direction
      const lightDot = Math.abs(nx * LIGHT_DIR.x + ny * LIGHT_DIR.y);
      const sheenIntensity = Math.pow(lightDot, 3);

      // Curvature sheen
      let curvatureSheen = 0;
      if (i > 0 && i < pts.length - 2) {
        const dx1 = pts[i].x - pts[i - 1].x;
        const dy1 = pts[i].y - pts[i - 1].y;
        const dx2 = pts[i + 1].x - pts[i].x;
        const dy2 = pts[i + 1].y - pts[i].y;
        const l1 = Math.sqrt(dx1 * dx1 + dy1 * dy1) || 1;
        const l2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
        const dot = (dx1 / l1) * (dx2 / l2) + (dy1 / l1) * (dy2 / l2);
        curvatureSheen = Math.max(0, 1 - dot) * 0.8;
      }

      const totalSheen = Math.min(1, sheenIntensity * 0.6 + curvatureSheen);

      if (totalSheen > 0.05) {
        const wMod = 1.0 + sheenIntensity * 0.3;
        const w = baseW * wMod;

        ctx.beginPath();
        const lx = p.x + nx * w * 0.5;
        const ly = p.y + ny * w * 0.5;
        const rx = p.x - nx * w * 0.5;
        const ry = p.y - ny * w * 0.5;

        // Draw a small highlight strip
        const segLen = REST_LENGTH * 0.8;
        const px = (lx + rx) / 2;
        const py = (ly + ry) / 2;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(Math.atan2(dy, dx));
        ctx.fillStyle = `rgba(255, 255, 255, ${totalSheen * 0.35})`;
        ctx.fillRect(-segLen * 0.5, -w * 0.15, segLen, w * 0.3);
        ctx.restore();
      }
    }
  }
}

let ribbons = [];

function initRibbons() {
  ribbons = [];
  const spacing = W / (NUM_RIBBONS + 1);
  for (let i = 0; i < NUM_RIBBONS; i++) {
    const x = spacing * (i + 1);
    const color = RIBBON_COLORS[i];
    const width = RIBBON_WIDTHS[i];
    const phaseOffset = i * 1.7 + i * i * 0.3;
    ribbons.push(new Ribbon(x, color, width, phaseOffset));
  }
}

initRibbons();

let time = 0;

function animate() {
  time += 0.016;

  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, Math.max(W, H) * 0.7);
  bgGrad.addColorStop(0, '#151525');
  bgGrad.addColorStop(1, '#0a0a12');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Update and draw ribbons
  for (const ribbon of ribbons) {
    ribbon.update(time);
    ribbon.draw(ctx, time);
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
