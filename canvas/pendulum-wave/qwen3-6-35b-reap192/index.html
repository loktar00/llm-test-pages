<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendulum Wave</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const NUM_PENDULUMS = 24;
        const CYCLE_DURATION = 60; // seconds
        
        // Physics constants
        const BASE_LENGTH = 200;
        const MAX_LENGTH = 450;
        const TRAIL_LENGTH = 100; // Number of history points to store
        const SEISMOGRAPH_HISTORY = 300; // Frames to keep for the bottom chart
        
        // State
        let time = 0;
        let lastTimestamp = 0;
        let pendulums = [];
        
        // Offscreen canvas for the seismograph trails
        let trailCanvas, trailCtx;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Setup trail canvas (transparent background)
            trailCanvas = document.createElement('canvas');
            trailCanvas.width = width;
            trailCanvas.height = height;
            trailCtx = trailCanvas.getContext('2d');
            
            initPendulums();
        }

        class Pendulum {
            constructor(index) {
                this.index = index;
                this.initPhysics();
                this.history = []; // For bob trail
                this.seismoHistory = []; // For bottom chart
            }

            initPhysics() {
                // Calculate length based on the requirement:
                // 24 pendulums. In one cycle, pendulum N completes N+1 oscillations relative to the slowest.
                // Formula: L = g / (f^2)
                // To fit 24 pendulums nicely, we vary the frequency.
                // Let the longest (index 0) complete 14 oscillations in the cycle.
                // Let the shortest (index 23) complete 37 oscillations.
                // Frequency k for pendulum i: k = start_osc + i * (diff / (N-1))
                
                const startOsc = 14;
                const endOsc = 37;
                const factor = (endOsc - startOsc) / (NUM_PENDULUMS - 1);
                
                // Oscillations per cycle for this pendulum
                const oscillationsPerCycle = startOsc + (this.index * factor);
                
                // Target frequency (Hz)
                const frequency = oscillationsPerCycle / CYCLE_DURATION;
                
                // Angular frequency
                this.omega = 2 * Math.PI * frequency;
                
                // Length derived from T = 2pi * sqrt(L/g) => L = (T/2pi)^2 * g
                // T = 1/frequency
                const g = 9.81 * 100; // cm/s^2
                const T = 1 / frequency;
                this.length = (g * (T * T)) / (4 * Math.PI * Math.PI);
                
                // Cap lengths for visual fit
                // We might need to scale the whole system down if the math above makes them too huge/small
                // Let's just normalize the lengths to fit the screen nicely while maintaining ratios
                
                this.angle = 0;
                this.amplitude = 0.4; // Radians
                
                // Color
                const hue = 200 + (this.index * 6); // Blue to Purple range
                this.color = `hsl(${hue}, 70%, 60%)`;
                this.colorBright = `hsl(${hue}, 90%, 80%)`;
            }

            update(dt) {
                // Update angle: theta = A * cos(omega * t)
                this.angle = this.amplitude * Math.cos(this.omega * time);
            }

            drawBob(ctx, x, y) {
                const bobX = x + this.length * Math.sin(this.angle);
                const bobY = y + this.length * Math.cos(this.angle);
                
                // Store history for trails
                this.history.push({ x: bobX, y: bobY });
                if (this.history.length > TRAIL_LENGTH) {
                    this.history.shift();
                }

                // Store history for seismograph
                this.seismoHistory.push(bobX);
                if (this.seismoHistory.length > SEISMOGRAPH_HISTORY) {
                    this.seismoHistory.shift();
                }

                return { x: bobX, y: bobY };
            }

            drawTrail(ctx) {
                if (this.history.length < 2) return;

                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                for (let i = 1; i < this.history.length; i++) {
                    ctx.lineTo(this.history[i].x, this.history[i].y);
                }

                // Create a gradient for the tail
                const head = this.history[this.history.length - 1];
                const tail = this.history[0];
                
                const grad = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
                grad.addColorStop(0, this.colorBright + '00'); // Transparent start
                grad.addColorStop(1, this.color + 'CC'); // Opaque end

                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            drawSeismo(ctx, chartX, chartY, chartHeight, chartWidth) {
                if (this.seismoHistory.length < 2) return;

                ctx.beginPath();
                // Map history to the chart coordinates
                // The history is oldest to newest. 
                // Chart renders left to right. 
                // So index 0 is at chartX, end is at chartX + chartWidth
                
                // Start point
                const startX = chartX;
                const startY = chartY + (chartHeight / 2) - (this.seismoHistory[0] - (width/2)) * 0.5;
                
                ctx.moveTo(startX, startY);

                for (let i = 1; i < this.seismoHistory.length; i++) {
                    const xPct = i / SEISMOGRAPH_HISTORY;
                    const xPos = chartX + (xPct * chartWidth);
                    const yPos = chartY + (chartHeight / 2) - (this.seismoHistory[i] - (width/2)) * 0.5;
                    ctx.lineTo(xPos, yPos);
                }

                ctx.strokeStyle = this.color + '66'; // Low opacity
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function initPendulums() {
            pendulums = [];
            for (let i = 0; i < NUM_PENDULUMS; i++) {
                pendulums.push(new Pendulum(i));
            }
        }

        function drawSeismographChart() {
            const chartHeight = 150;
            const chartPadding = 40;
            const chartWidth = width - (chartPadding * 2);
            const chartX = chartPadding;
            const chartY = height - chartHeight - chartPadding;

            // 1. Draw background and grid on the main canvas first
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(chartX, chartY, chartWidth, chartHeight);
            
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            // Center line
            ctx.moveTo(chartX, chartY + chartHeight/2);
            ctx.lineTo(chartX + chartWidth, chartY + chartHeight/2);
            // Border
            ctx.strokeRect(chartX, chartY, chartWidth, chartHeight);
            
            // Labels
            ctx.fillStyle = '#444';
            ctx.font = '12px monospace';
            ctx.fillText("0", chartX + 5, chartY + 12);
            ctx.fillText("60s", chartX + chartWidth - 25, chartY + 12);
            ctx.fillText("X", chartX + chartWidth - 12, chartY + chartHeight - 10);
            ctx.fillText("Time", chartX + 10, chartY + chartHeight - 10);

            // 2. Draw the lines from the offscreen canvas
            // We need to clear the trail canvas first
            trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

            pendulums.forEach(p => {
                p.drawSeismo(trailCtx, chartX, chartY, chartHeight, chartWidth);
            });

            // 3. Composite the trail canvas onto the main canvas
            ctx.drawImage(trailCanvas, 0, 0);

            // 4. Fade effect for the chart itself (drawing a semi-transparent rect over time)
            // Actually, doing this manually in the draw loop is better for the trails, 
            // but since we are using an offscreen canvas accumulating lines, 
            // we just redraw everything every frame.
        }

        function drawResetMarker() {
            // Calculate phase progress (0.0 to 1.0)
            // We use a high precision modulo for time
            const cycleProgress = (time % CYCLE_DURATION) / CYCLE_DURATION;
            
            // If we are very close to the start of a cycle (0.0)
            if (cycleProgress < 0.05 || cycleProgress > 0.95) {
                // Flash a subtle line
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(width, 0);
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * Math.sin(cycleProgress * 100)})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Flash text
                if (Math.abs(cycleProgress) < 0.01 || Math.abs(cycleProgress - 1) < 0.01) {
                     ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                     ctx.font = '14px sans-serif';
                     ctx.fillText("RESETTING", width/2 - 40, height/2);
                }
                ctx.restore();
            }
        }

        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            time += dt;

            // Clear Main Canvas
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // --- Draw Pendulum Area ---
            
            // Pivot line
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.lineTo(width, 50);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Calculate X spacing
            const spacing = width / (NUM_PENDULUMS + 1);
            
            // Update and Draw Pendulums
            pendulums.forEach((p, i) => {
                const pivotX = spacing * (i + 1);
                const pivotY = 50;

                p.update(dt);
                
                // Draw Rod
                const bob = p.drawBob(ctx, pivotX, pivotY);
                
                ctx.beginPath();
                ctx.moveTo(pivotX, pivotY);
                ctx.lineTo(bob.x, bob.y);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw Bob
                ctx.beginPath();
                ctx.arc(bob.x, bob.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = p.colorBright;
                ctx.fill();
                
                // Draw Trail
                p.drawTrail(ctx);
            });

            // Draw Reset Marker (Time check)
            drawResetMarker();

            // --- Draw Seismograph Chart ---
            drawSeismographChart();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
