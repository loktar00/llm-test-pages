<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Sea Vents</title>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%;}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener('resize', ()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});

const particles = [];
const snow = [];
const tubeWorms = [];
const shrimp = [];
const vents = [];

// Vent setup
for(let i=0;i<4;i++){
    vents.push({
        x: 100 + i*200 + Math.random()*50,
        y: h - 100 - Math.random()*50,
        w: 20 + Math.random()*10,
        h: 40 + Math.random()*20,
        strength: 0.5 + Math.random()*0.5
    });
}

// Particles (smoke)
for(let i=0;i<400;i++){
    particles.push({
        x:0, y:0,
        vx:0, vy:0,
        size: 1 + Math.random()*3,
        life: 0,
        maxLife: 100 + Math.random()*100,
        vent: Math.floor(Math.random()*vents.length)
    });
}

// Marine snow
for(let i=0;i<200;i++){
    snow.push({
        x: Math.random()*w,
        y: Math.random()*h,
        vx: -0.3 + Math.random()*0.6,
        vy: 0.1 + Math.random()*0.5,
        size: Math.random()*1.5
    });
}

// Tube worms
for(let i=0;i<20;i++){
    tubeWorms.push({
        x: vents[0].x + vents[0].w/2 + (Math.random()-0.5)*60,
        y: vents[0].y - vents[0].h,
        len: 30 + Math.random()*40,
        sway: Math.random()*Math.PI*2,
        swaySpeed: 0.01 + Math.random()*0.02,
        swayAmt: 2 + Math.random()*3
    });
}

// Shrimp
for(let i=0;i<15;i++){
    shrimp.push({
        x: vents[0].x + vents[0].w/2 + (Math.random()-0.5)*50,
        y: vents[0].y - vents[0].h/2,
        vx: -0.2 + Math.random()*0.4,
        vy: -0.1 + Math.random()*0.2,
        size: 2 + Math.random()*2
    });
}

// Siphonophore
const siph = {
    x: -100,
    y: h*0.3,
    vx: 0.2 + Math.random()*0.3,
    size: 30,
    tendrils: []
};
for(let i=0;i<5;i++){
    siph.tendrils.push(Math.random()*Math.PI*2);
}

// ROV
const rov = {
    x: 50,
    y: h*0.5,
    vx: 0.5,
    targetY: h*0.5,
    lightAngle: 0
};

function animate(){
    // Dim the scene
    ctx.fillStyle = 'rgba(0,0,20,0.15)';
    ctx.fillRect(0,0,w,h);

    // Update vents
    for(const v of vents){
        v.strength = 0.5 + Math.sin(Date.now()*0.002 + v.x)*0.2;

        // Emit particles
        for(let i=0;i<2;i++){
            const p = particles.find(p=>p.life<=0);
            if(p){
                p.x = v.x + v.w/2 + (Math.random()-0.5)*v.w;
                p.y = v.y;
                p.vx = -0.2 + Math.random()*0.4;
                p.vy = -v.strength * 3 - 0.5;
                p.life = p.maxLife;
                p.vent = vents.indexOf(v);
            }
        }
    }

    // Update particles
    for(const p of particles){
        if(p.life>0){
            p.vx += (Math.random()-0.5)*0.1;
            p.vy += 0.05;
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            const v = vents[p.vent];
            const dx = p.x - v.x;
            const dy = p.y - v.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 100){
                p.vx += dx/dist * 0.1;
                p.vy += dy/dist * 0.1;
            }
        }
    }

    // Draw particles
    for(const p of particles){
        if(p.life>0){
            const alpha = p.life / p.maxLife;
            const size = p.size * alpha;
            ctx.fillStyle = `rgba(255,200,150,${alpha*0.6})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // Draw vents (black smokers)
    for(const v of vents){
        ctx.fillStyle = '#222';
        ctx.fillRect(v.x, v.y, v.w, v.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(v.x+2, v.y+2, v.w-4, 4);
    }

    // Update and draw tube worms
    for(const t of tubeWorms){
        t.sway += t.swaySpeed;
        const offset = Math.sin(t.sway) * t.swayAmt;
        ctx.strokeStyle = '#4a7023';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        for(let i=0;i<5;i++){
            const py = t.y + (t.len/5)*i;
            const px = t.x + Math.sin(t.sway + i*0.3) * t.swayAmt * (i/5);
            ctx.lineTo(px, py);
        }
        ctx.stroke();
        // Worm head
        ctx.fillStyle = '#4a7023';
        ctx.beginPath();
        ctx.arc(t.x, t.y + t.len, 4, 0, Math.PI*2);
        ctx.fill();
    }

    // Update and draw shrimp
    for(const s of shrimp){
        s.x += s.vx;
        s.y += s.vy;
        // Constrain to vent area
        const v = vents[0];
        if(s.x < v.x || s.x > v.x + v.w) s.vx *= -1;
        if(s.y < v.y - v.h || s.y > v.y) s.vy *= -1;
        s.vx += (Math.random()-0.5)*0.02;
        s.vy += (Math.random()-0.5)*0.02;

        ctx.fillStyle = '#ff8844';
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.size, s.size*0.5, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // Update siphonophore
    siph.x += siph.vx;
    siph.y += Math.sin(Date.now()*0.001 + siph.x*0.01) * 0.5;
    if(siph.x > w + 100){
        siph.x = -100;
        siph.y = h * (0.2 + Math.random()*0.4);
    }

    // Draw siphonophore
    ctx.save();
    ctx.translate(siph.x, siph.y);
    ctx.fillStyle = 'rgba(200,255,200,0.4)';
    ctx.beginPath();
    ctx.arc(0, 0, siph.size/2, 0, Math.PI*2);
    ctx.fill();
    // Tendrils
    ctx.strokeStyle = 'rgba(150,200,150,0.3)';
    ctx.lineWidth = 2;
    for(let i=0;i<siph.tendrils.length;i++){
        const angle = siph.tendrils[i];
        const len = 20 + Math.sin(Date.now()*0.002 + i)*5;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(angle)*len, Math.sin(angle)*len);
        ctx.stroke();
    }
    ctx.restore();

    // Update marine snow
    for(const s of snow){
        s.x += s.vx;
        s.y += s.vy;
        if(s.x < 0) s.x = w;
        if(s.x > w) s.x = 0;
        if(s.y > h) s.y = 0;
    }
    ctx.fillStyle = 'rgba(200,200,255,0.7)';
    for(const s of snow){
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    }

    // ROV movement
    rov.x += rov.vx;
    if(rov.x > w - 50 || rov.x < 50){
        rov.vx *= -1;
        rov.targetY = 200 + Math.random()*(h-400);
    }
    rov.y += (rov.targetY - rov.y) * 0.02;

    // ROV lights
    ctx.save();
    ctx.translate(rov.x, rov.y);
    rov.lightAngle += 0.02;
    // Main light cone
    const gradient = ctx.createRadialGradient(rov.x, rov.y, 5, rov.x, rov.y, 100);
    gradient.addColorStop(0, 'rgba(255,255,200,0.8)');
    gradient.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(rov.x-100, rov.y-100, 200, 200);
    ctx.restore();

    // ROV body
    ctx.fillStyle = '#66ccff';
    ctx.fillRect(rov.x-15, rov.y-8, 30, 16);
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(rov.x+12, rov.y-5, 8, 10);
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(rov.x-18, rov.y-3, 6, 6);
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(rov.x-16, rov.y-2, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(rov.x-16, rov.y+2, 2, 0, Math.PI*2);
    ctx.fill();

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
