<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragdoll Dojo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Physics Constants ---
const GRAVITY = 0.45;
const DAMPING = 0.995;
const GROUND_Y = () => H - 40;
const CONSTRAINT_ITERATIONS = 12;
const JOINT_ITERATIONS = 8;

// --- Slow Motion ---
let timeScale = 1.0;
let slowMoTimer = 0;
let slowMoDuration = 0;

function triggerSlowMo(intensity) {
  if (slowMoTimer > 0) return;
  slowMoTimer = 90;
  slowMoDuration = 90;
  timeScale = Math.max(0.15, 1.0 - intensity * 0.7);
}

function updateSlowMo() {
  if (slowMoTimer > 0) {
    slowMoTimer--;
    if (slowMoTimer <= slowMoDuration * 0.3) {
      timeScale += (1.0 - timeScale) * 0.04;
    }
  } else {
    timeScale += (1.0 - timeScale) * 0.05;
  }
}

// --- Particle ---
class Particle {
  constructor(x, y, radius = 3, pinned = false) {
    this.x = x; this.y = y;
    this.oldx = x; this.oldy = y;
    this.radius = radius;
    this.pinned = pinned;
    this.mass = 1;
    this.alive = true;
    this.alpha = 1;
    this.dissolving = false;
    this.dissolveVx = 0;
    this.dissolveVy = 0;
  }
  update(dt) {
    if (!this.alive || this.pinned) return;
    if (this.dissolving) {
      this.x += this.dissolveVx * dt;
      this.y += this.dissolveVy * dt;
      this.dissolveVy += 0.05 * dt;
      this.alpha -= 0.012 * dt;
      if (this.alpha <= 0) this.alive = false;
      return;
    }
    let vx = (this.x - this.oldx) * DAMPING;
    let vy = (this.y - this.oldy) * DAMPING;
    this.oldx = this.x;
    this.oldy = this.y;
    this.x += vx * dt;
    this.y += (vy + GRAVITY * dt) * dt;
  }
  collideWithGround() {
    if (!this.alive || this.pinned || this.dissolving) return;
    let gy = GROUND_Y();
    if (this.y + this.radius > gy) {
      let vy = this.y - this.oldy;
      this.y = gy - this.radius;
      this.oldy = this.y + vy * 0.3;
      this.oldx = this.x - (this.x - this.oldx) * 0.85;
    }
  }
  collideWithWalls() {
    if (!this.alive || this.pinned || this.dissolving) return;
    if (this.x < this.radius) { this.x = this.radius; this.oldx = this.x + (this.x - this.oldx) * 0.5; }
    if (this.x > W - this.radius) { this.x = W - this.radius; this.oldx = this.x + (this.x - this.oldx) * 0.5; }
    if (this.y < this.radius) { this.y = this.radius; this.oldy = this.y + (this.y - this.oldy) * 0.5; }
  }
}

// --- Constraints ---
class DistanceConstraint {
  constructor(a, b, length, stiffness = 1.0) {
    this.a = a; this.b = b; this.length = length; this.stiffness = stiffness;
  }
  solve() {
    if (!this.a.alive || !this.b.alive) return;
    let dx = this.b.x - this.a.x;
    let dy = this.b.y - this.a.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.001) return;
    let diff = (this.length - dist) / dist * 0.5 * this.stiffness;
    let ox = dx * diff;
    let oy = dy * diff;
    if (!this.a.pinned && !this.a.dissolving) {
      this.a.x -= ox; this.a.y -= oy;
    }
    if (!this.b.pinned && !this.b.dissolving) {
      this.b.x += ox; this.b.y += oy;
    }
  }
}

class AngleConstraint {
  constructor(a, b, c, minAngle, maxAngle) {
    this.a = a; this.b = b; this.c = c;
    this.minAngle = minAngle; this.maxAngle = maxAngle;
  }
  solve() {
    if (!this.a.alive || !this.b.alive || !this.c.alive) return;
    let ba_x = this.a.x - this.b.x, ba_y = this.a.y - this.b.y;
    let bc_x = this.c.x - this.b.x, bc_y = this.c.y - this.b.y;
    let angle = Math.atan2(ba_x * bc_y - ba_y * bc_x, ba_x * bc_x + ba_y * bc_y);
    if (angle < this.minAngle) {
      let rot = this.minAngle - angle;
      this.rotate(this.a, rot * 0.15);
    } else if (angle > this.maxAngle) {
      let rot = this.maxAngle - angle;
      this.rotate(this.a, rot * 0.15);
    }
  }
  rotate(p, angle) {
    if (p.pinned || p.dissolving) return;
    let cos = Math.cos(angle), sin = Math.sin(angle);
    let dx = p.x - this.b.x, dy = p.y - this.b.y;
    p.x = this.b.x + dx * cos - dy * sin;
    p.y = this.b.y + dx * sin + dy * cos;
  }
}

// --- Ragdoll ---
class Ragdoll {
  constructor(x, y, scale = 1) {
    this.particles = [];
    this.constraints = [];
    this.jointConstraints = [];
    this.settledTime = 0;
    this.alive = true;
    this.dissolving = false;
    this.dissolveTime = 0;
    this.color = `hsl(${Math.random() * 360}, 70%, 65%)`;
    this.scale = scale;
    this.maxSpeed = 0;

    let s = scale;
    // Head
    let head = new Particle(x, y, 10 * s);
    // Neck
    let neck = new Particle(x, y + 14 * s, 3 * s);
    // Shoulders
    let lShoulder = new Particle(x - 10 * s, y + 18 * s, 3 * s);
    let rShoulder = new Particle(x + 10 * s, y + 18 * s, 3 * s);
    // Elbows
    let lElbow = new Particle(x - 16 * s, y + 32 * s, 3 * s);
    let rElbow = new Particle(x + 16 * s, y + 32 * s, 3 * s);
    // Hands
    let lHand = new Particle(x - 18 * s, y + 46 * s, 4 * s);
    let rHand = new Particle(x + 18 * s, y + 46 * s, 4 * s);
    // Hip
    let hip = new Particle(x, y + 40 * s, 4 * s);
    // Knees
    let lKnee = new Particle(x - 7 * s, y + 60 * s, 3 * s);
    let rKnee = new Particle(x + 7 * s, y + 60 * s, 3 * s);
    // Feet
    let lFoot = new Particle(x - 8 * s, y + 80 * s, 4 * s);
    let rFoot = new Particle(x + 8 * s, y + 80 * s, 4 * s);

    this.particles = [head, neck, lShoulder, rShoulder, lElbow, rElbow, lHand, rHand, hip, lKnee, rKnee, lFoot, rFoot];

    // Body constraints
    this.constraints.push(new DistanceConstraint(head, neck, 14 * s, 1));
    this.constraints.push(new DistanceConstraint(neck, lShoulder, 10 * s, 1));
    this.constraints.push(new DistanceConstraint(neck, rShoulder, 10 * s, 1));
    this.constraints.push(new DistanceConstraint(lShoulder, rShoulder, 20 * s, 1));
    this.constraints.push(new DistanceConstraint(lShoulder, lElbow, 14 * s, 1));
    this.constraints.push(new DistanceConstraint(rShoulder, rElbow, 14 * s, 1));
    this.constraints.push(new DistanceConstraint(lElbow, lHand, 14 * s, 1));
    this.constraints.push(new DistanceConstraint(rElbow, rHand, 14 * s, 1));
    this.constraints.push(new DistanceConstraint(neck, hip, 22 * s, 1));
    this.constraints.push(new DistanceConstraint(lShoulder, hip, 18 * s, 0.5));
    this.constraints.push(new DistanceConstraint(rShoulder, hip, 18 * s, 0.5));
    this.constraints.push(new DistanceConstraint(hip, lKnee, 20 * s, 1));
    this.constraints.push(new DistanceConstraint(hip, rKnee, 20 * s, 1));
    this.constraints.push(new DistanceConstraint(lKnee, lFoot, 20 * s, 1));
    this.constraints.push(new DistanceConstraint(rKnee, rFoot, 20 * s, 1));
    this.constraints.push(new DistanceConstraint(lFoot, rFoot, 16 * s, 0.3));

    // Joint limits
    this.jointConstraints.push(new AngleConstraint(head, neck, lShoulder, -1.2, 1.2));
    this.jointConstraints.push(new AngleConstraint(head, neck, rShoulder, -1.2, 1.2));
    this.jointConstraints.push(new AngleConstraint(neck, hip, lKnee, -0.5, 2.0));
    this.jointConstraints.push(new AngleConstraint(neck, hip, rKnee, -0.5, 2.0));
    this.jointConstraints.push(new AngleConstraint(lShoulder, lElbow, lHand, -2.0, 0.5));
    this.jointConstraints.push(new AngleConstraint(rShoulder, rElbow, rHand, -2.0, 0.5));
    this.jointConstraints.push(new AngleConstraint(hip, lKnee, lFoot, -0.3, 1.5));
    this.jointConstraints.push(new AngleConstraint(hip, rKnee, rFoot, -0.3, 1.5));

    // References for drawing
    this.head = head; this.neck = neck;
    this.lShoulder = lShoulder; this.rShoulder = rShoulder;
    this.lElbow = lElbow; this.rElbow = rElbow;
    this.lHand = lHand; this.rHand = rHand;
    this.hip = hip; this.lKnee = lKnee; this.rKnee = rKnee;
    this.lFoot = lFoot; this.rFoot = rFoot;
  }

  update(dt) {
    if (!this.alive) return;
    if (this.dissolving) {
      this.dissolveTime += dt;
      for (let p of this.particles) {
        p.alpha = Math.max(0, 1 - this.dissolveTime / 120);
        if (p.alpha <= 0) p.alive = false;
      }
      if (this.dissolveTime > 120) this.alive = false;
      return;
    }
    for (let p of this.particles) p.update(dt);
    for (let i = 0; i < CONSTRAINT_ITERATIONS; i++) {
      for (let c of this.constraints) c.solve();
    }
    for (let i = 0; i < JOINT_ITERATIONS; i++) {
      for (let c of this.jointConstraints) c.solve();
    }
    for (let p of this.particles) {
      p.collideWithGround();
      p.collideWithWalls();
    }
    // Track max speed
    let maxSpd = 0;
    for (let p of this.particles) {
      let vx = p.x - p.oldx, vy = p.y - p.oldy;
      maxSpd = Math.max(maxSpd, Math.sqrt(vx * vx + vy * vy));
    }
    this.maxSpeed = maxSpd;
    // Check if settled
    if (maxSpd < 0.3 && this.head.y > H * 0.3) {
      this.settledTime += dt;
      if (this.settledTime > 180) {
        this.startDissolving();
      }
    } else {
      this.settledTime = Math.max(0, this.settledTime - dt * 0.5);
    }
  }

  startDissolving() {
    this.dissolving = true;
    this.dissolveTime = 0;
    for (let p of this.particles) {
      p.dissolving = true;
      p.dissolveVx = (Math.random() - 0.5) * 3;
      p.dissolveVy = -Math.random() * 4 - 1;
    }
  }

  draw() {
    if (!this.alive) return;
    let alpha = this.dissolving ? this.head.alpha : 1;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2.5 * this.scale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawLine = (a, b) => {
      if (!a.alive || !b.alive) return;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    };

    // Arms
    drawLine(this.lShoulder, this.lElbow);
    drawLine(this.lElbow, this.lHand);
    drawLine(this.rShoulder, this.rElbow);
    drawLine(this.rElbow, this.rHand);
    // Legs
    drawLine(this.hip, this.lKnee);
    drawLine(this.lKnee, this.lFoot);
    drawLine(this.hip, this.rKnee);
    drawLine(this.rKnee, this.rFoot);
    // Torso
    drawLine(this.neck, this.hip);
    drawLine(this.lShoulder, this.rShoulder);
    // Head
    if (this.head.alive) {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.head.x, this.head.y, this.head.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// --- Course Elements ---
class Trampoline {
  constructor(x, y, width) {
    this.x = x; this.y = y; this.width = width;
    this.points = [];
    let segs = 8;
    for (let i = 0; i <= segs; i++) {
      let px = x - width / 2 + (width / segs) * i;
      this.points.push(new Particle(px, y, 2, false));
    }
    this.points[0].pinned = true;
    this.points[this.points.length - 1].pinned = true;
    this.constraints = [];
    for (let i = 0; i < this.points.length - 1; i++) {
      this.constraints.push(new DistanceConstraint(this.points[i], this.points[i + 1], width / segs, 0.8));
    }
    this.bounceStrength = 0.6;
  }
  update(dt) {
    for (let p of this.points) p.update(dt);
    for (let c of this.constraints) c.solve();
    // Restore height
    for (let i = 1; i < this.points.length - 1; i++) {
      let p = this.points[i];
      let targetY = this.y;
      p.y += (targetY - p.y) * 0.15 * dt;
      p.oldy = p.y - (p.y - p.oldy) * 0.8;
    }
  }
  collideWith(particles) {
    for (let p of particles) {
      if (!p.alive || p.pinned || p.dissolving) continue;
      for (let i = 0; i < this.points.length - 1; i++) {
        let a = this.points[i], b = this.points[i + 1];
        let hit = this.segmentCollision(p, a, b);
        if (hit) {
          let vy = p.y - p.oldy;
          if (vy > 0) {
            let impulse = Math.abs(vy) * this.bounceStrength;
            p.oldy = p.y + impulse;
            let impact = Math.abs(vy);
            if (impact > 4) triggerSlowMo(impact * 0.1);
          }
        }
      }
    }
  }
  segmentCollision(p, a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    let lenSq = dx * dx + dy * dy;
    if (lenSq < 0.01) return false;
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    let cx = a.x + t * dx, cy = a.y + t * dy;
    let dist = Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2);
    if (dist < p.radius + 3) {
      let ny = (p.y - cy);
      if (ny > 0) {
        p.y = cy - p.radius;
        return true;
      }
    }
    return false;
  }
  draw() {
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);
    for (let i = 1; i < this.points.length; i++) {
      ctx.lineTo(this.points[i].x, this.points[i].y);
    }
    ctx.stroke();
    // Glow
    ctx.strokeStyle = 'rgba(255,107,107,0.3)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);
    for (let i = 1; i < this.points.length; i++) {
      ctx.lineTo(this.points[i].x, this.points[i].y);
    }
    ctx.stroke();
  }
}

class Seesaw {
  constructor(x, y, width) {
    this.pivotX = x; this.pivotY = y; this.width = width;
    this.angle = 0;
    this.angularVel = 0;
    this.particles = [];
    this.leftEnd = new Particle(x - width / 2, y, 4);
    this.rightEnd = new Particle(x + width / 2, y, 4);
    this.particles.push(this.leftEnd, this.rightEnd);
    this.pivot = new Particle(x, y, 6, true);
  }
  update(dt) {
    let halfW = this.width / 2;
    this.leftEnd.x = this.pivotX + Math.cos(this.angle) * (-halfW);
    this.leftEnd.y = this.pivotY + Math.sin(this.angle) * (-halfW);
    this.rightEnd.x = this.pivotX + Math.cos(this.angle) * halfW;
    this.rightEnd.y = this.pivotY + Math.sin(this.angle) * halfW;
    this.leftEnd.oldx = this.leftEnd.x - (this.leftEnd.x - this.leftEnd.oldx) * 0.5;
    this.leftEnd.oldy = this.leftEnd.y - (this.leftEnd.y - this.leftEnd.oldy) * 0.5;
    this.rightEnd.oldx = this.rightEnd.x - (this.rightEnd.x - this.rightEnd.oldx) * 0.5;
    this.rightEnd.oldy = this.rightEnd.y - (this.rightEnd.y - this.rightEnd.oldy) * 0.5;
    this.angularVel *= 0.98;
    this.angle += this.angularVel * dt;
    this.angle = Math.max(-0.6, Math.min(0.6, this.angle));
    if (Math.abs(this.angle) < 0.01 && Math.abs(this.angularVel) < 0.001) {
      this.angle *= 0.9;
      this.angularVel *= 0.9;
    }
  }
  collideWith(particles) {
    let a = this.leftEnd, b = this.rightEnd;
    for (let p of particles) {
      if (!p.alive || p.pinned || p.dissolving) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      let lenSq = dx * dx + dy * dy;
      if (lenSq < 0.01) continue;
      let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      let cx = a.x + t * dx, cy = a.y + t * dy;
      let dist = Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2);
      if (dist < p.radius + 5) {
        let ny = p.y - cy;
        if (ny > -2) {
          p.y = cy - p.radius;
          let vy = p.y - p.oldy;
          if (vy > 0) {
            let force = Math.abs(vy) * 0.3;
            let lever = (t - 0.5) * 2;
            this.angularVel += force * lever * 0.008;
            p.oldy = p.y + Math.abs(vy) * 0.4;
            let impact = Math.abs(vy);
            if (impact > 3) triggerSlowMo(impact * 0.08);
          }
        }
      }
    }
  }
  draw() {
    // Pivot
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.arc(this.pivotX, this.pivotY, 8, 0, Math.PI * 2);
    ctx.fill();
    // Plank
    ctx.strokeStyle = '#ffd93d';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.leftEnd.x, this.leftEnd.y);
    ctx.lineTo(this.rightEnd.x, this.rightEnd.y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,217,61,0.3)';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(this.leftEnd.x, this.leftEnd.y);
    ctx.lineTo(this.rightEnd.x, this.rightEnd.y);
    ctx.stroke();
  }
}

class SwingingLog {
  constructor(x, y, width, swingSpeed) {
    this.pivotX = x; this.pivotY = y; this.width = width;
    this.angle = 0;
    this.swingSpeed = swingSpeed || 0.02;
    this.swingPhase = Math.random() * Math.PI * 2;
    this.particles = [];
    this.leftEnd = new Particle(x, y, 4);
    this.rightEnd = new Particle(x + width, y, 4);
    this.particles.push(this.leftEnd, this.rightEnd);
  }
  update(dt) {
    this.swingPhase += this.swingSpeed * dt;
    this.angle = Math.sin(this.swingPhase) * 0.8;
    let lx = this.pivotX + Math.cos(this.angle) * (-this.width / 2);
    let ly = this.pivotY + Math.sin(this.angle) * (-this.width / 2);
    let rx = this.pivotX + Math.cos(this.angle) * (this.width / 2);
    let ry = this.pivotY + Math.sin(this.angle) * (this.width / 2);
    this.leftEnd.x = lx; this.leftEnd.y = ly;
    this.rightEnd.x = rx; this.rightEnd.y = ry;
    this.leftEnd.oldx = this.leftEnd.x - (this.leftEnd.x - this.leftEnd.oldx) * 0.3;
    this.leftEnd.oldy = this.leftEnd.y - (this.leftEnd.y - this.leftEnd.oldy) * 0.3;
    this.rightEnd.oldx = this.rightEnd.x - (this.rightEnd.x - this.rightEnd.oldx) * 0.3;
    this.rightEnd.oldy = this.rightEnd.y - (this.rightEnd.y - this.rightEnd.oldy) * 0.3;
  }
  collideWith(particles) {
    let a = this.leftEnd, b = this.rightEnd;
    for (let p of particles) {
      if (!p.alive || p.pinned || p.dissolving) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      let lenSq = dx * dx + dy * dy;
      if (lenSq < 0.01) continue;
      let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      let cx = a.x + t * dx, cy = a.y + t * dy;
      let dist = Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2);
      if (dist < p.radius + 6) {
        let nx = p.x - cx, ny = p.y - cy;
        let nd = Math.sqrt(nx * nx + ny * ny);
        if (nd > 0.01) {
          nx /= nd; ny /= nd;
          p.x = cx + nx * (p.radius + 6);
          p.y = cy + ny * (p.radius + 6);
          // Add some velocity from swing
          let logVx = (this.rightEnd.x - this.rightEnd.oldx) * 0.5;
          let logVy = (this.rightEnd.y - this.rightEnd.oldy) * 0.5;
          p.oldx = p.x - (p.x - p.oldx) * 0.5 + logVx * 0.3;
          p.oldy = p.y - (p.y - p.oldy) * 0.5 + logVy * 0.3;
          let impact = Math.sqrt(logVx * logVx + logVy * logVy);
          if (impact > 2) triggerSlowMo(impact * 0.1);
        }
      }
    }
  }
  draw() {
    ctx.strokeStyle = '#6bcb77';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.leftEnd.x, this.leftEnd.y);
    ctx.lineTo(this.rightEnd.x, this.rightEnd.y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(107,203,119,0.3)';
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(this.leftEnd.x, this.leftEnd.y);
    ctx.lineTo(this.rightEnd.x, this.rightEnd.y);
    ctx.stroke();
    // Pivot
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.arc(this.pivotX, this.pivotY, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Scene Setup ---
let trampolines = [];
let seesaws = [];
let swingingLogs = [];
let ragdolls = [];
let spawnTimer = 0;
let spawnInterval = 200;
let particles = []; // all particles for collision

function buildCourse() {
  trampolines = [];
  seesaws = [];
  swingingLogs = [];

  // Ground trampolines
  trampolines.push(new Trampoline(W * 0.2, GROUND_Y() - 10, 120));
  trampolines.push(new Trampoline(W * 0.7, GROUND_Y() - 10, 120));
  trampolines.push(new Trampoline(W * 0.5, GROUND_Y() - 10, 150));

  // Mid-height trampolines
  trampolines.push(new Trampoline(W * 0.35, H * 0.55, 100));
  trampolines.push(new Trampoline(W * 0.65, H * 0.55, 100));

  // Seesaws
  seesaws.push(new Seesaw(W * 0.25, H * 0.4, 140));
  seesaws.push(new Seesaw(W * 0.75, H * 0.35, 160));
  seesaws.push(new Seesaw(W * 0.5, H * 0.65, 130));

  // Swinging logs
  swingingLogs.push(new SwingingLog(W * 0.15, H * 0.25, 100, 0.025));
  swingingLogs.push(new SwingingLog(W * 0.85, H * 0.3, 120, 0.018));
  swingingLogs.push(new SwingingLog(W * 0.5, H * 0.18, 140, 0.03));
  swingingLogs.push(new SwingingLog(W * 0.35, H * 0.42, 90, 0.022));
}

function spawnRagdoll(doubleDrop) {
  let x = W * 0.3 + Math.random() * W * 0.4;
  let y = -60;
  let s = 0.8 + Math.random() * 0.4;
  let r = new Ragdoll(x, y, s);
  ragdolls.push(r);
  particles.push(...r.particles);

  if (doubleDrop) {
    let x2 = x + (Math.random() - 0.5) * 80;
    let r2 = new Ragdoll(x2, y - 20, s * 0.9);
    ragdolls.push(r2);
    particles.push(...r2.particles);
  }
}

function getAllParticles() {
  let all = [];
  for (let r of ragdolls) {
    if (r.alive && !r.dissolving) {
      all.push(...r.particles);
    }
  }
  return all;
}

function interRagdollCollision() {
  let all = getAllParticles();
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      let a = all[i], b = all[j];
      if (!a.alive || !b.alive || a.pinned || b.pinned) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      let minDist = a.radius + b.radius;
      if (dist < minDist && dist > 0.01) {
        let nx = dx / dist, ny = dy / dist;
        let overlap = (minDist - dist) * 0.5;
        if (!a.pinned) { a.x -= nx * overlap; a.y -= ny * overlap; }
        if (!b.pinned) { b.x += nx * overlap; b.y += ny * overlap; }
        // Exchange some velocity
        let va_x = a.x - a.oldx, va_y = a.y - a.oldy;
        let vb_x = b.x - b.oldx, vb_y = b.y - b.oldy;
        let relVx = va_x - vb_x, relVy = va_y - vb_y;
        let impact = Math.sqrt(relVx * relVx + relVy * relVy);
        if (impact > 3) triggerSlowMo(impact * 0.06);
        let damp = 0.3;
        if (!a.pinned) {
          a.oldx = a.x - (va_x * (1 - damp) + vb_x * damp);
          a.oldy = a.y - (va_y * (1 - damp) + vb_y * damp);
        }
        if (!b.pinned) {
          b.oldx = b.x - (vb_x * (1 - damp) + va_x * damp);
          b.oldy = b.y - (vb_y * (1 - damp) + va_y * damp);
        }
      }
    }
  }
}

// --- Background ---
function drawBackground() {
  // Gradient sky
  let grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#1a1a3e');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 50; i++) {
    let sx = (i * 137.5 + 50) % W;
    let sy = (i * 97.3 + 30) % (H * 0.5);
    let sr = 0.5 + (i % 3) * 0.5;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ground
  ctx.fillStyle = '#2d2d44';
  ctx.fillRect(0, GROUND_Y(), W, H - GROUND_Y());
  ctx.strokeStyle = '#4a4a6a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y());
  ctx.lineTo(W, GROUND_Y());
  ctx.stroke();

  // Ground pattern
  ctx.strokeStyle = 'rgba(74,74,106,0.3)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i, GROUND_Y());
    ctx.lineTo(i, H);
    ctx.stroke();
  }
}

// --- Slow Motion Overlay ---
function drawSlowMoOverlay() {
  if (timeScale < 0.9) {
    let intensity = 1 - timeScale;
    ctx.fillStyle = `rgba(255,255,255,${intensity * 0.08})`;
    ctx.fillRect(0, 0, W, H);
    // Vignette
    let grad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.8);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${intensity * 0.3})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

// --- Speed Lines ---
let speedLines = [];
function updateSpeedLines() {
  if (timeScale < 0.7) {
    for (let i = 0; i < 3; i++) {
      speedLines.push({
        x: Math.random() * W,
        y: Math.random() * H,
        len: 30 + Math.random() * 60,
        alpha: 0.1 + Math.random() * 0.2,
        life: 20
      });
    }
  }
  speedLines = speedLines.filter(l => {
    l.life--;
    l.alpha *= 0.95;
    return l.life > 0;
  });
}

function drawSpeedLines() {
  for (let l of speedLines) {
    ctx.strokeStyle = `rgba(255,255,255,${l.alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.lineTo(l.x + l.len * 0.3, l.y + l.len);
    ctx.stroke();
  }
}

// --- Main Loop ---
let frameCount = 0;
function update() {
  updateSlowMo();
  let dt = timeScale;

  // Spawn logic
  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnInterval = 150 + Math.random() * 200;
    let doubleDrop = Math.random() < 0.25;
    spawnRagdoll(doubleDrop);
  }

  // Update course elements
  for (let t of trampolines) {
    t.update(dt);
    t.collideWith(getAllParticles());
  }
  for (let s of seesaws) {
    s.update(dt);
    s.collideWith(getAllParticles());
  }
  for (let sl of swingingLogs) {
    sl.update(dt);
    sl.collideWith(getAllParticles());
  }

  // Update ragdolls
  for (let r of ragdolls) r.update(dt);

  // Inter-ragdoll collision
  interRagdollCollision();

  // Clean up dead ragdolls
  ragdolls = ragdolls.filter(r => r.alive);

  // Update particles list
  particles = [];
  for (let r of ragdolls) {
    particles.push(...r.particles);
  }

  updateSpeedLines();
}

function draw() {
  drawBackground();

  // Draw course elements
  for (let s of seesaws) s.draw();
  for (let t of trampolines) t.draw();
  for (let sl of swingingLogs) sl.draw();

  // Draw ragdolls
  for (let r of ragdolls) r.draw();

  drawSpeedLines();
  drawSlowMoOverlay();

  // Title
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('RAGDOLL DOJO', 15, 25);
  ctx.textAlign = 'right';
  ctx.fillText(`ragdolls: ${ragdolls.length}`, W - 15, 25);
}

function loop() {
  update();
  draw();
  frameCount++;
  requestAnimationFrame(loop);
}

buildCourse();
loop();
</script>
