<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks Festival</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let fireworks = [];
        let cityBuildings = [];
        let stars = [];
        let time = 0;
        let lastTime = 0;
        
        // Configuration
        const GRAVITY = 0.08;
        const DRAG = 0.96;
        const RIVER_HEIGHT_RATIO = 0.35;
        const FINALE_INTERVAL = 120000; // 2 minutes
        const FINALE_DURATION = 8000;
        let lastFinaleTime = -FINALE_INTERVAL;
        let isFinale = false;

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateCity();
            generateStars();
        }
        window.addEventListener('resize', resize);

        // --- Utilities ---
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function hsl(h, s, l) {
            return `hsl(${h}, ${s}%, ${l}%)`;
        }

        // --- City Generation ---
        function generateCity() {
            cityBuildings = [];
            let x = -50;
            const groundY = height * (1 - RIVER_HEIGHT_RATIO);
            while (x < width + 50) {
                const w = random(30, 80);
                const h = random(50, 250);
                const windows = [];
                // Generate windows
                for(let wy = 10; wy < h - 10; wy += 15) {
                    for(let wx = 5; wx < w - 5; wx += 10) {
                        if(Math.random() > 0.3) {
                            windows.push({x: wx, y: wy, on: Math.random() > 0.4});
                        }
                    }
                }
                cityBuildings.push({
                    x: x,
                    y: groundY - h,
                    w: w,
                    h: h,
                    windows: windows,
                    color: `hsl(${random(200, 260)}, ${random(10, 30)}%, ${random(5, 15)}%)`
                });
                x += w + random(0, 5); // slight overlap or gap
            }
        }

        function generateStars() {
            stars = [];
            for(let i=0; i<150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * (1 - RIVER_HEIGHT_RATIO)),
                    size: Math.random() * 1.5,
                    alpha: Math.random()
                });
            }
        }

        // --- Classes ---

        class Firework {
            constructor(isFinale) {
                this.x = random(width * 0.1, width * 0.9);
                this.y = height;
                this.targetY = random(height * 0.1, height * 0.4);
                this.speed = isFinale ? random(12, 18) : random(8, 12);
                this.angle = -Math.PI / 2 + random(-0.1, 0.1);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.trail = [];
                this.trailLength = 10;
                this.isFinale = isFinale;
                this.hue = random(0, 360);
                this.dead = false;
                
                // Whistling effect
                this.whistlePhase = 0;
            }

            update() {
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > this.trailLength) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // slight gravity on ascent

                // Whistle simulation (visual flicker)
                this.whistlePhase += 0.5;

                if (this.vy >= 0 || this.y <= this.targetY) {
                    this.explode();
                    this.dead = true;
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 80%, 1)`;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Whistle spark
                const flicker = Math.sin(this.whistlePhase) * 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2 + flicker, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            explode() {
                const type = Math.random();
                let pattern = 'peony';
                if (type < 0.2) pattern = 'willow';
                else if (type < 0.4) pattern = 'ring';
                else if (type < 0.6) pattern = 'double';

                createExplosion(this.x, this.y, this.hue, pattern);
            }
        }

        class Particle {
            constructor(x, y, hue, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.hue = hue;
                this.alpha = 1;
                
                // Physics
                let angle, speed;
                
                if (type === 'ring') {
                    angle = Math.random() * Math.PI * 2;
                    speed = random(4, 6);
                } else if (type === 'willow') {
                    angle = Math.random() * Math.PI * 2;
                    speed = random(2, 5);
                    this.gravity = 0.04; // Higher gravity for droop
                    this.drag = 0.92;
                    this.decay = 0.008; // Slower decay
                    this.size = random(1, 2);
                } else {
                    // Peony / Standard
                    angle = Math.random() * Math.PI * 2;
                    speed = random(1, 8);
                    this.gravity = GRAVITY;
                    this.drag = DRAG;
                    this.decay = random(0.01, 0.025);
                    this.size = random(1.5, 3);
                }

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.decay = this.decay || random(0.015, 0.03);
                
                if (type !== 'willow') {
                    this.size = random(1.5, 3);
                    this.gravity = GRAVITY;
                    this.drag = DRAG;
                }
            }

            update() {
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                
                // Ember effect
                if (this.alpha < 0.3) {
                    this.size *= 0.95;
                }
            }

            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = hsl(this.hue, 100, 60);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Sparkle core
                if (this.alpha > 0.5) {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }

        function createExplosion(x, y, hue, type) {
            const count = type === 'willow' ? 80 : 100;
            
            if (type === 'double') {
                // Inner burst
                for (let i = 0; i < count/2; i++) {
                    particles.push(new Particle(x, y, hue, 'peony'));
                }
                // Outer burst different color
                for (let i = 0; i < count/2; i++) {
                    particles.push(new Particle(x, y, (hue + 180) % 360, 'ring'));
                }
            } else {
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, hue, type));
                }
            }
        }

        // --- Main Loop ---

        function drawSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#050510');
            gradient.addColorStop(0.5, '#0a0a20');
            gradient.addColorStop(1, '#1a1a30');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Stars
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                // Twinkle
                const twinkle = Math.sin(time * 0.05 + star.x) * 0.3 + 0.7;
                ctx.globalAlpha = star.alpha * twinkle;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawCity() {
            const groundY = height * (1 - RIVER_HEIGHT_RATIO);
            
            cityBuildings.forEach(b => {
                // Building body
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                
                // Windows
                ctx.fillStyle = '#ffddaa'; // Warm light
                b.windows.forEach(win => {
                    if (win.on) {
                        // Random flicker
                        if (Math.random() > 0.01) {
                            ctx.globalAlpha = random(0.6, 1);
                            ctx.fillRect(b.x + win.x, b.y + win.y, 6, 8);
                        }
                    }
                });
                ctx.globalAlpha = 1;
            });

            // Horizon line
            ctx.fillStyle = '#000';
            ctx.fillRect(0, groundY, width, 2);
        }

        function drawRiver() {
            const groundY = height * (1 - RIVER_HEIGHT_RATIO);
            const riverHeight = height - groundY;

            // Base water
            const gradient = ctx.createLinearGradient(0, groundY, 0, height);
            gradient.addColorStop(0, '#050515');
            gradient.addColorStop(1, '#020208');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, groundY, width, riverHeight);

            // Reflections
            ctx.save();
            ctx.translate(0, groundY * 2);
            ctx.scale(1, -1);
            
            // Draw City Reflection (dimmed and distorted)
            ctx.globalAlpha = 0.3;
            cityBuildings.forEach(b => {
                ctx.fillStyle = '#111';
                // Add some vertical jitter for water effect
                const jitter = Math.sin(time * 0.1 + b.x * 0.01) * 2;
                ctx.fillRect(b.x, b.y + jitter, b.w, b.h);
                
                // Windows Reflection
                ctx.fillStyle = '#aa8855';
                b.windows.forEach(win => {
                    if (win.on) {
                        ctx.fillRect(b.x + win.x, b.y + win.y + jitter, 6, 8);
                    }
                });
            });

            // Draw Fireworks Reflection
            // We iterate particles and draw them in the reflected space
            // Note: This is a visual approximation. 
            // We need to transform coordinates.
            // Actually, easier to just draw them directly with a transform matrix or manual calc.
            
            // Let's manually draw particle reflections
            ctx.restore(); // Back to normal orientation
            
            particles.forEach(p => {
                if (p.y < groundY) { // Only reflect sky particles
                    const dist = groundY - p.y;
                    const reflY = groundY + dist;
                    
                    // Distortion
                    const wave = Math.sin(time * 0.2 + p.x * 0.05) * (dist * 0.05);
                    const alpha = p.alpha * 0.4; // Dimmer
                    
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.fillStyle = hsl(p.hue, 100, 60);
                    
                    // Streak effect for water
                    ctx.beginPath();
                    ctx.ellipse(p.x + wave, reflY, p.size * 2, p.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1;

            // Shimmer overlay
            ctx.globalCompositeOperation = 'overlay';
            for (let i = 0; i < 10; i++) {
                const y = groundY + random(0, riverHeight);
                const x = random(0, width);
                const l = random(50, 150);
                ctx.fillStyle = `rgba(255, 255, 255, ${random(0.01, 0.05)})`;
                ctx.fillRect(x, y, l, 1);
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function loop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            time++;

            // Clear
            ctx.clearRect(0, 0, width, height);

            // Draw Environment
            drawSky();
            drawCity();
            drawRiver();

            // Logic: Launch Fireworks
            // Normal schedule
            if (!isFinale && Math.random() < 0.02) {
                fireworks.push(new Firework(false));
            }

            // Finale Logic
            const now = Date.now();
            if (now - lastFinaleTime > FINALE_INTERVAL) {
                isFinale = true;
                lastFinaleTime = now;
            }

            if (isFinale) {
                // Rapid fire
                if (Math.random() < 0.3) { // 30% chance per frame
                    fireworks.push(new Firework(true));
                }
                if (now - lastFinaleTime > FINALE_DURATION) {
                    isFinale = false;
                }
            }

            // Update & Draw Fireworks (Rockets)
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw(ctx);
                if (fireworks[i].dead) {
                    fireworks.splice(i, 1);
                }
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        }

        // Start
        resize();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
