<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rube Goldberg Loop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #08080f; overflow: hidden; }
canvas { display: block; }
</style>

<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

// ===================== CONSTANTS =====================
const GRAV = 0.35;
const REST = 0.55;
const FRICTION = 0.985;
const SUBSTEPS = 8;
const BALL_R = 10;
const MAX_TRAIL = 80;

// ===================== PARTICLE SYSTEM =====================
const particles = [];
function spawnDust(x, y, vx, vy, count, col) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, vx: (vx||0)*0.3 + (Math.random()-0.5)*4,
      vy: (vy||0)*0.3 - Math.random()*3,
      life: 1, decay: 0.02 + Math.random()*0.03,
      r: 2 + Math.random()*3, col: col || `hsl(${35+Math.random()*20},70%,${60+Math.random()*30}%)`
    });
  }
}
function spawnSparks(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random()*Math.PI*2;
    const s = 2+Math.random()*5;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, decay: 0.03+Math.random()*0.04,
      r: 1+Math.random()*2, col: `hsl(${40+Math.random()*30},100%,${70+Math.random()*30}%)`
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles(camX, camY) {
  for (const p of particles) {
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y - camY, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ===================== BALL STATE =====================
const ball = {
  x: 200, y: 140, vx: 1.2, vy: 0,
  squashX: 1, squashY: 1,
  trail: [], color: '#ff7043',
  active: true, dead: false, deadTimer: 0
};

// ===================== PHYSICS OBJECTS =====================

// Ramps (line segments with normal pointing up/left)
const ramps = [
  { x1:50, y1:140, x2:430, y2:340, color:'#6d4c41' },
  { x1:460, y1:340, x2:890, y2:340, color:'#5d4037' },
  { x1:890, y1:340, x2:1320, y2:540, color:'#6d4c41' },
  { x1:1320, y1:540, x2:1520, y2:540, color:'#5d4037' },
  { x1:1520, y1:540, x2:1800, y2:700, color:'#6d4c41' },
  { x1:1800, y1:700, x2:2100, y2:700, color:'#5d4037' },
  { x1:2100, y1:700, x2:2300, y2:830, color:'#6d4c41' },
  { x1:2300, y1:830, x2:2600, y2:830, color:'#5d4037' },
];

// Wall to keep ball in bounds
const walls = [
  { x1:0, y1:900, x2:0, y2:0 },
  { x1:3100, y1:900, x2:3100, y2:0 },
  { x1:0, y1:950, x2:3100, y2:950 },
];

// ===================== DOMINOES =====================
const dominoes = [
  { x:500, y:280, w:14, h:45, angle:0, angVel:0, active:true, grounded:false, color:'#a1887f' },
  { x:540, y:270, w:14, h:45, angle:0, angVel:0, active:true, grounded:false, color:'#a1887f' },
  { x:580, y:260, w:14, h:45, angle:0, angVel:0, active:true, grounded:false, color:'#a1887f' },
  { x:620, y:250, w:14, h:45, angle:0, angVel:0, active:true, grounded:false, color:'#a1887f' },
  { x:660, y:240, w:14, h:45, angle:0, angVel:0, active:true, grounded:false, color:'#a1887f' },
  { x:700, y:238, w:14, h:45, angle:0, angVel:0, active:true, grounded:false, color:'#a1887f' },
];

// ===================== PULLEY SYSTEM =====================
const pulley = {
  axleX: 1400, axleY: 440,
  ropeLen: 220,
  leftMass: 15, rightMass: 12,
  leftY: 520, rightY: 700,
  leftV: 0, rightV: 0,
  maxSpeed: 6,
  triggered: false,
  triggeredTimer: 0,

};

// ===================== SPRING HAMMER =====================
const hammer = {
  baseX: 2400, baseY: 780,
  pivotY: 720,
  armLen: 100,
  armAngle: 0,
  angVel: 0,
  restAngle: Math.PI * 0.65,
  springK: 0.15,
  damping: 0.88,

};

// ===================== FUNNEL =====================
const funnel = {
  cx: 2800, cy: 560,
  topW: 130, bottomW: 30,
  height: 150,
  innerR: 100,
  color: '#546e7a'
};

// ===================== ELEVATOR WHEEL =====================
const wheel = {
  cx: 200, cy: 100,
  radius: 80,
  angle: 0,
  speed: 0.008,
  platformW: 30,
  color: '#7986cb'
};

// ===================== TRAMPOLINE =====================
const trampoline = {
  x1: 1050, y1: 420, x2: 1200, y2: 420,
  deflection: 0, maxDeflect: 40,
  springK: 0.06, damping: 0.92,
  color: '#ef5350'
};

// ===================== PHYSICS HELPERS =====================
function linePointDist(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1;
  const len2 = dx*dx+dy*dy;
  if (len2 === 0) return { dist: Math.hypot(px-x1,py-y1), cx:x1, cy:y1, t:0 };
  let t = ((px-x1)*dx+(py-y1)*dy)/len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1+t*dx, cy = y1+t*dy;
  return { dist: Math.hypot(px-cx, py-cy), cx, cy, t };
}

function pushBallFromLine(x, y, vx, vy, x1, y1, x2, y2, r) {
  const { dist, cx, cy } = linePointDist(x, y, x1, y1, x2, y2);
  if (dist < r && dist > 0) {
    const nx = (x-cx)/dist, ny = (y-cy)/dist;
    x = cx + nx * (r+0.5);
    y = cy + ny * (r+0.5);
    const vn = vx*nx + vy*ny;
    if (vn < 0) {
      vx -= (1+REST)*vn*nx;
      vy -= (1+REST)*vn*ny;
    }
    vx *= FRICTION;
    vy *= FRICTION;
  }
  return { x, y, vx, vy };
}

// ===================== DOMINO PHYSICS =====================
function updateDominoes() {
  for (const d of dominoes) {
    if (!d.active) continue;
    // Gravity torque: tries to rotate down (right)
    const gTorque = Math.sin(d.angle) * 0.004;
    d.angVel += gTorque;
    d.angVel *= 0.995;
    d.angle += d.angVel;

    // Check if fallen enough to be "grounded"
    if (d.angle > 0.8) {
      d.grounded = true;
      d.angVel *= 0.3;
    }

    // Check ball collision with domino
    const dx = d.w/2 * Math.cos(d.angle), dy = d.w/2 * Math.sin(d.angle);
    const topX = d.x - dx, topY = d.y - d.h + dy;
    const botX = d.x + dx, botY = d.y + dy;
    const halfH = d.h * 0.5;

    // Check collision with right face of domino
    const rightX = d.x + Math.abs(dx) + BALL_R;
    const rightY = d.y - halfH*0.3;
    if (ball.x > rightX - 20 && ball.x < rightX + 10 &&
        ball.y > d.y - halfH && ball.y < d.y + halfH) {
      const force = Math.abs(ball.vx) * 0.04 + 0.02;
      d.angVel += force;
      d.active = false;
      d.color = '#d7ccc8';
      // Ball bounce off
      ball.vx *= 0.6;
      ball.vy -= 2;
      spawnDust(ball.x, ball.y, 0, -1, 3);
    }

    // Check if falling domino hits next domino
    if (d.angle > 0.5 && d.grounded) {
      // Find next active domino
      const idx = dominoes.indexOf(d);
      if (idx < dominoes.length - 1) {
        const next = dominoes[idx+1];
        if (next.active) {
          const dist = Math.hypot(d.x - next.x, d.y - next.y);
          if (dist < 60) {
            next.angVel += 0.03 + Math.abs(d.angVel) * 0.1;
            spawnDust(d.x, d.y, 0, -1, 2);
          }
        }
      }
    }
  }
}

function drawDominoes(camX, camY) {
  for (const d of dominoes) {
    const dx = d.w/2 * Math.cos(d.angle);
    const dy = d.w/2 * Math.sin(d.angle);
    const topX = d.x - dx, topY = d.y - d.h + dy;
    const botX = d.x + dx, botY = d.y + dy;

    ctx.fillStyle = d.color;
    ctx.strokeStyle = '#4e342e';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.lineTo(botX, botY);
    ctx.lineTo(botX, botY + 3);
    ctx.lineTo(topX, topY + 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

// ===================== PULLEY PHYSICS =====================
function updatePulley() {
  if (!pulley.triggered) {
    // Ball passes near axle -> trigger
    const dist = Math.hypot(ball.x - pulley.axleX, ball.y - (pulley.axleY+100));
    if (dist < 80 && ball.vx > 0) {
      pulley.triggered = true;
      pulley.leftMass += pulley.massAdd;
      pulley.triggeredTimer = 300;
      spawnDust(pulley.axleX, pulley.axleY+100, 0, -2, 5);
      spawnSparks(pulley.axleX, pulley.axleY+100, 8);
    }
    return;
  }
  pulley.triggeredTimer--;

  const totalMass = pulley.leftMass + pulley.rightMass;
  const netForce = (pulley.leftMass - pulley.rightMass) * GRAV * 0.3;
  pulley.leftV += netForce / totalMass;
  pulley.leftV *= 0.99;
  pulley.leftV = Math.max(-pulley.maxSpeed, Math.min(pulley.maxSpeed, pulley.leftV));
  pulley.rightV = -pulley.leftV;
  pulley.leftY += pulley.leftV;
  pulley.rightY += pulley.rightV;

  // Clamp positions
  pulley.leftY = Math.max(pulley.axleY+40, Math.min(pulley.axleY+pulley.ropeLen, pulley.leftY));
  pulley.rightY = Math.max(pulley.axleY+40, Math.min(pulley.axleY+pulley.ropeLen, pulley.rightY));
}

function drawPulley(camX, camY) {
  const ax = pulley.axleX, ay = pulley.axleY;
  // Axle
  ctx.fillStyle = '#455a64';
  ctx.beginPath();
  ctx.arc(ax, ay, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#37474f';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Left rope
  ctx.strokeStyle = '#90a4ae';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ax-25, ay);
  ctx.lineTo(ax-25, pulley.leftY);
  ctx.stroke();
  // Right rope
  ctx.beginPath();
  ctx.moveTo(ax+25, ay);
  ctx.lineTo(ax+25, pulley.rightY);
  ctx.stroke();

  // Left basket
  const ly = pulley.leftY;
  ctx.fillStyle = '#795548';
  ctx.beginPath();
  ctx.moveTo(ax-40, ly);
  ctx.lineTo(ax-35, ly+30);
  ctx.lineTo(ax-15, ly+30);
  ctx.lineTo(ax-10, ly);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4e342e';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Right basket
  const ry = pulley.rightY;
  ctx.fillStyle = '#8d6e63';
  ctx.beginPath();
  ctx.moveTo(ax+10, ry);
  ctx.lineTo(ax+15, ry+30);
  ctx.lineTo(ax+35, ry+30);
  ctx.lineTo(ax+40, ry);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Triggered indicator
  if (pulley.triggered && pulley.triggeredTimer > 0) {
    ctx.globalAlpha = pulley.triggeredTimer / 300 * 0.3;
    ctx.fillStyle = '#ff9800';
    ctx.beginPath();
    ctx.arc(ax, ay, 30 + (1-pulley.triggeredTimer/300)*20, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ===================== SPRING HAMMER PHYSICS =====================
function updateHammer() {
  if (!hammer.triggered) {
    // Ball hits the hammer head area
    const headX = hammer.baseX + Math.cos(hammer.restAngle)*hammer.armLen;
    const headY = hammer.pivotY + Math.sin(hammer.restAngle)*hammer.armLen;
    const dist = Math.hypot(ball.x - headX, ball.y - headY);
    if (dist < 40 && ball.vx > 0) {
      hammer.triggered = true;
      hammer.triggerTimer = 200;
      ball.vx *= 0.3;
      spawnSparks(headX, headY, 12);
      spawnDust(headX, headY, 0, -2, 5);
    }
    return;
  }
  hammer.triggerTimer--;

  // Spring force back to rest
  const diff = hammer.armAngle - hammer.restAngle;
  hammer.angVel += diff * hammer.springK;
  hammer.angVel *= hammer.damping;
  hammer.armAngle += hammer.angVel;

  if (hammer.triggerTimer <= 0) {
    hammer.triggered = false;
    hammer.armAngle = hammer.restAngle;
    hammer.angVel = 0;
  }
}

  ctx.fillStyle = '#546e7a';

  ctx.fillStyle = '#37474f';

  ctx.arc(hammer.baseX, hammer.pivotY, 6, 0, Math.PI*2);

  const endX = hammer.baseX + Math.cos(hammer.armAngle)*hammer.armLen;

  ctx.beginPath();
  ctx.moveTo(hammer.baseX, hammer.pivotY);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  // Head
  ctx.fillStyle = hammer.triggered ? '#ff7043' : '#78909c';
  ctx.beginPath();
  ctx.arc(endX, endY, hammer.headRadius, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#546e7a';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#607d8b';
  ctx.beginPath();
  ctx.arc(endX + Math.cos(hammer.armAngle)*5, endY + Math.sin(hammer.armAngle)*
