<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Poet</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // --- Configuration ---
        const CONFIG = {
            paperColor: '#fdfbf7',
            inkColor: '#1a1a1a',
            deskColor: '#110e0a',
            lampColor: '#ffcc66',
            lampRange: 600,
            charWidth: 14,
            lineHeight: 22,
            paperWidth: 500,
            paperHeight: 700,
            marginX: 50,
            marginY: 80,
            typeSpeedMin: 80,
            typeSpeedMax: 180,
            pauseLine: 800,
            pauseReturn: 400,
            pauseXStrike: 600,
        };

        // --- Word Lists for Haiku-like generation ---
        const WORDS = {
            nature: ['rain', 'wind', 'stone', 'leaf', 'cloud', 'sky', 'grass', 'river', 'moon', 'sun', 'tree', 'root', 'flower', 'dust', 'snow', 'wave', 'tide', 'mist', 'fog', 'dawn', 'dusk', 'night', 'star'],
            action: ['falls', 'rises', 'sleeps', 'wakes', 'runs', 'sits', 'breaks', 'flows', 'burns', 'freezes', 'whispers', 'screams', 'waits', 'goes', 'comes', 'fades', 'grows', 'dies'],
            abstract: ['time', 'love', 'soul', 'mind', 'ghost', 'dream', 'fear', 'hope', 'silence', 'noise', 'truth', 'lie', 'void', 'light', 'shadow', 'memory'],
            filler: ['the', 'a', 'an', 'in', 'on', 'at', 'with', 'by', 'for', 'to', 'of', 'and', 'but', 'or', 'is', 'was', 'are', 'were', 'his', 'her', 'its', 'our', 'my']
        };

        // --- State ---
        let state = {
            lines: [], // Array of strings
            currentLineText: "",
            cursorX: 0, // X offset from margin
            cursorY: 0, // Y offset from margin
            isTyping: true,
            isReturning: false,
            isXStriking: false,
            isRipping: false,
            isReloading: false,
            timer: 0,
            nextEvent: 0,
            bellFlash: 0,
            carriageOffset: 0, // Visual shake
            paperOffsetY: 0, // For tearing animation
            linesFilled: 0
        };

        // --- Resize Handling ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Helpers ---
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateHaikuLine() {
            // Simple 5-7-5 simulation by word count approximation
            // Just picking random words to create a poetic feel
            const length = randInt(3, 8); 
            let line = [];
            for(let i=0; i<length; i++) {
                const cat = randChoice(['nature', 'action', 'abstract', 'filler']);
                line.push(randChoice(WORDS[cat]));
            }
            // Capitalize first letter
            let s = line.join(' ');
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        // --- Core Logic ---

        function resetState() {
            state.lines = [];
            state.currentLineText = "";
            state.cursorX = CONFIG.marginX;
            state.cursorY = CONFIG.marginY;
            state.isTyping = true;
            state.isReturning = false;
            state.isXStriking = false;
            state.isRipping = false;
            state.isReloading = false;
            state.paperOffsetY = 0;
            state.linesFilled = 0;
            scheduleNextChar();
        }

        function scheduleNextChar() {
            // Decide if we X-strike (rarely)
            if (Math.random() < 0.05 && state.currentLineText.length > 3 && !state.isXStriking) {
                state.isXStriking = true;
                state.nextEvent = CONFIG.pauseXStrike;
                return;
            }

            state.nextEvent = randInt(CONFIG.typeSpeedMin, CONFIG.typeSpeedMax);
        }

        function typeChar() {
            const char = state.currentLineText[state.cursorX - CONFIG.marginX];
            
            // Visual feedback
            state.carriageOffset = randInt(-2, 2);
            setTimeout(() => state.carriageOffset = 0, 50);

            // Check for bell (end of line approach)
            if (state.cursorX > canvas.width/2 + CONFIG.paperWidth/2 - CONFIG.marginX - 20) {
                state.bellFlash = 10;
            }

            state.cursorX += CONFIG.charWidth;
            scheduleNextChar();
        }

        function handleXStrike() {
            // Remove last 2 chars
            const len = state.currentLineText.length;
            state.currentLineText = state.currentLineText.slice(0, len - 2);
            state.cursorX -= (CONFIG.charWidth * 2);
            state.isXStriking = false;
            scheduleNextChar();
        }

        function handleLineEnd() {
            state.lines.push(state.currentLineText);
            state.currentLineText = "";
            state.cursorY += CONFIG.lineHeight;
            
            // Check page full
            if (state.cursorY > CONFIG.paperHeight - CONFIG.marginY - 50) {
                startRip();
                return;
            }

            // New line logic
            state.currentLineText = generateHaikuLine();
            state.cursorX = CONFIG.marginX;
            state.nextEvent = CONFIG.pauseLine;
        }

        function startReturn() {
            state.isReturning = true;
            state.nextEvent = CONFIG.pauseReturn;
        }

        function finishReturn() {
            state.isReturning = false;
            state.cursorX = CONFIG.marginX;
            scheduleNextChar();
        }

        function startRip() {
            state.isRipping = true;
            state.nextEvent = 2000; // Wait before ripping
        }

        function finishRip() {
            // Reset and load new paper
            state.isRipping = false;
            state.isReloading = true;
            state.paperOffsetY = -CONFIG.paperHeight; // Start above
            
            // Simple animation loop for reload
            let loadProgress = 0;
            const loadAnim = setInterval(() => {
                loadProgress += 0.05;
                state.paperOffsetY += (CONFIG.paperHeight * 0.1);
                if (loadProgress >= 1) {
                    state.paperOffsetY = 0;
                    state.isReloading = false;
                    clearInterval(loadAnim);
                    resetState();
                }
            }, 20);
        }

        // --- Drawing ---

        function drawDesk() {
            // Dark wood gradient
            const grad = ctx.createRadialGradient(
                canvas.width/2, canvas.height/2 - 100, 50,
                canvas.width/2, canvas.height/2 - 100, canvas.width
            );
            grad.addColorStop(0, '#3e2b1f');
            grad.addColorStop(1, '#0a0806');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawPaper() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            // Paper dimensions
            const w = CONFIG.paperWidth;
            const h = CONFIG.paperHeight;
            const x = cx - w/2;
            const y = cy - h/2 + state.paperOffsetY;

            ctx.save();
            
            // Paper Shadow
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 10;

            // Draw Paper
            ctx.fillStyle = CONFIG.paperColor;
            ctx.fillRect(x, y, w, h);
            
            // Reset shadow for content
            ctx.shadowColor = "transparent";

            // Draw Text Lines
            ctx.font = "16px 'Courier New', monospace";
            ctx.fillStyle = CONFIG.inkColor;
            
            // Apply slight random rotation/offset to simulate typewriter unevenness
            // We draw the text block centered on the carriage position
            
            // The "Carriage" moves visually in X, but in a real typewriter the paper moves or the ribbon moves.
            // We simulate the carriage returning by snapping X.
            // For the "scrolling" effect, we just draw all lines.
            
            // Draw previous lines
            for (let i = 0; i < state.lines.length; i++) {
                drawLine(state.lines[i], x + CONFIG.marginX, y + CONFIG.marginY + (i * CONFIG.lineHeight));
            }

            // Draw current line
            if (state.currentLineText) {
                drawLine(state.currentLineText, x + CONFIG.marginX, y + CONFIG.marginY + state.cursorY);
            }

            // Draw X-strike overlay if active
            if (state.isXStriking) {
                const len = state.currentLineText.length;
                const strikeX = x + CONFIG.marginX + ((len - 2) * CONFIG.charWidth);
                const strikeY = y + CONFIG.marginY + state.cursorY;
                
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(strikeX, strikeY - 5);
                ctx.lineTo(strikeX + (CONFIG.charWidth*2), strikeY + 10);
                ctx.moveTo(strikeX + (CONFIG.charWidth*2), strikeY - 5);
                ctx.lineTo(strikeX, strikeY + 10);
                ctx.stroke();
            }

            // Draw Cursor (Blinking block or line)
            if (state.isTyping && !state.isReturning && !state.isRipping) {
                const curX = x + state.cursorX;
                const curY = y + CONFIG.marginY + state.cursorY;
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                // Draw a small block at the end of current text
                ctx.fillRect(curX, curY - 14, 2, 16);
            }

            // Paper texture/grain
            ctx.globalCompositeOperation = "multiply";
            ctx.fillStyle = "rgba(200,200,200,0.1)";
            for(let i=0; i<500; i++) {
                ctx.fillRect(x + Math.random()*w, y + Math.random()*h, 1, 1);
            }
            ctx.globalCompositeOperation = "source-over";

            ctx.restore();
        }

        function drawLine(text, x, y) {
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const charX = x + (i * CONFIG.charWidth);
                
                // Imperfections
                const offsetX = (Math.random() - 0.5) * 0.5;
                const offsetY = (Math.random() - 0.5) * 0.5;
                const opacity = 0.8 + Math.random() * 0.2;
                
                ctx.globalAlpha = opacity;
                ctx.fillText(char, charX + offsetX, y + offsetY);
            }
            ctx.globalAlpha = 1.0;
        }

        function drawLamp() {
            // Flashlight effect overlay
            // We create a radial gradient that is transparent in the center and dark at edges
            // This simulates the "vignette" of a desk lamp
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2 - 50; // Light is slightly above center
            
            const grad = ctx.createRadialGradient(cx, cy, 100, cx, cy, CONFIG.lampRange);
            grad.addColorStop(0, "rgba(0,0,0,0)");
            grad.addColorStop(0.8, "rgba(0,0,0,0.4)");
            grad.addColorStop(1, "rgba(0,0,0,0.85)");
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bell Flash
            if (state.bellFlash > 0) {
                ctx.beginPath();
                ctx.arc(cx + CONFIG.paperWidth/2 - 40, cy - CONFIG.paperHeight/2 + 20, 5, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 200, 50, ${state.bellFlash/10})`;
                ctx.fill();
                state.bellFlash--;
            }
        }

        // --- Main Loop ---

        let lastTime = 0;
        function loop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            // Logic Updates
            if (state.isTyping) {
                if (state.isXStriking) {
                    state.nextEvent -= dt;
                    if (state.nextEvent <= 0) handleXStrike();
                } else {
                    state.nextEvent -= dt;
                    if (state.nextEvent <= 0) {
                        // Check if line is full
                        if (state.cursorX > canvas.width/2 + CONFIG.paperWidth/2 - CONFIG.marginX - 20) {
                            startReturn();
                        } else {
                            // Type next char
                            if (state.cursorX - CONFIG.marginX < state.currentLineText.length) {
                                typeChar();
                            } else {
                                // Line finished typing
                                startReturn();
                            }
                        }
                    }
                }
            } else if (state.isReturning) {
                state.nextEvent -= dt;
                if (state.nextEvent <= 0) {
                    finishReturn();
                    handleLineEnd();
                    if (!state.isRipping) state.isTyping = true;
                }
            } else if (state.isRipping) {
                state.nextEvent -= dt;
                if (state.nextEvent <= 0) {
                    finishRip();
                }
            }

            // Render
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawDesk();
            
            // If reloading, draw the paper sliding in
            if (state.isReloading) {
                drawPaper();
            } else if (state.isRipping) {
                // Draw paper tearing away (moving down)
                state.paperOffsetY += dt * 0.5; // Speed of tear
                drawPaper();
            } else {
                drawPaper();
            }

            drawLamp();

            requestAnimationFrame(loop);
        }

        // Start
        resetState();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
