<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaaS Hero</title>
<style>
  :root {
    --clr-bg: #0f0e17;
    --clr-glass: rgba(255, 255, 255, 0.06);
    --clr-glass-border: rgba(255, 255, 255, 0.12);
    --clr-primary: #7b4ae4;
    --clr-primary-light: #a377f0;
    --clr-accent: #ff65a3;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: var(--clr-bg);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Floating blobs */
  .blobs {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    transform-origin: center;
  }

  .blob-1 {
    width: 420px;
    height: 420px;
    background: radial-gradient(circle at 30% 30%, var(--clr-primary-light), transparent 60%);
    top: 20%;
    left: 15%;
    animation: float1 32s ease-in-out infinite;
    opacity: 0.5;
  }

  .blob-2 {
    width: 360px;
    height: 360px;
    background: radial-gradient(circle at 70% 40%, var(--clr-accent), transparent 60%);
    bottom: 18%;
    right: 12%;
    animation: float2 38s ease-in-out infinite;
    opacity: 0.45;
  }

  .blob-3 {
    width: 280px;
    height: 280px;
    background: radial-gradient(circle at 40% 60%, var(--clr-primary), transparent 60%);
    top: 55%;
    left: 40%;
    animation: float3 28s ease-in-out infinite;
    opacity: 0.4;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.05); }
    66% { transform: translate(-10px, 20px) scale(0.95); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-25px, 15px) scale(1.08); }
    66% { transform: translate(15px, -25px) scale(0.92); }
  }

  @keyframes float3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(10px, 20px) scale(1.03); }
    66% { transform: translate(-20px, -10px) scale(0.97); }
  }

  /* Glass nav */
  .nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    backdrop-filter: blur(14px);
    background: var(--clr-glass);
    border-bottom: 1px solid var(--clr-glass-border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    color: #fff;
    text-decoration: none;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    position: relative;
  }

  .logo-mark::before,
  .logo-mark::after {
    content: "";
    position: absolute;
    border-radius: 50%;
  }

  .logo-mark::before {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
    box-shadow: 0 0 16px rgba(123, 74, 228, 0.5);
  }

  .logo-mark::after {
    width: 10px;
    height: 10px;
    background: #fff;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .nav-links {
    display: flex;
    gap: 28px;
    font-size: 15px;
  }

  .nav-links a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    transition: color 0.25s ease;
  }

  .nav-links a:hover {
    color: #fff;
  }

  /* Hero */
  .hero {
    position: relative;
    z-index: 5;
    text-align: center;
    max-width: 720px;
    padding: 0 24px;
  }

  .headline {
    font-size: clamp(2.8rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #ffffff 25%, var(--clr-primary-light) 50%, var(--clr-accent) 75%);
    background-size: 200% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    overflow: hidden;
    mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
    -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
    animation: reveal-headline 1.4s ease-out 0.6s both, shimmer 6s linear infinite;
  }

  @keyframes reveal-headline {
    0% {
      mask-size: 0% 100%;
      -webkit-mask-size: 0% 100%;
    }
    100% {
      mask-size: 100% 100%;
      -webkit-mask-size: 100% 100%;
    }
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .subheadline {
    font-size: clamp(1.05rem, 2.2vw, 1.25rem);
    font-weight: 400;
    color: rgba(255, 255, 255, 0.65);
    max-width: 560px;
    margin: 0 auto 36px;
    animation: fadeInUp 0.8s ease-out 1.1s both;
    opacity: 0;
  }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .cta-group {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    animation: fadeInUp 0.8s ease-out 1.3s both;
    opacity: 0;
  }

  .btn {
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15.5px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
    color: #fff;
    box-shadow: 0 10px 28px rgba(123, 74, 228, 0.35);
  }

  .btn-primary::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: 12px;
    padding: 2px;
    background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent), #fff, var(--clr-primary));
    background-size: 400% 400%;
    -webkit-mask: 
      linear-gradient(#fff 0 0) padding-box, 
      linear-gradient(#fff 0 0) border-box;
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.4s ease;
    animation: gradientShift 3s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .btn-primary:hover::before {
    opacity: 1;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 34px rgba(123, 74, 228, 0.45);
  }

  .btn-secondary {
    background: transparent;
    color: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--clr-glass-border);
    backdrop-filter: blur(8px);
  }

  .btn-secondary:hover {
    background: var(--clr-glass);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  @media (max-width: 640px) {
    .nav { padding: 14px 24px; }
    .cta-group { gap: 14px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>
  <div class="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <nav class="nav">
    <a href="#" class="logo">
      <span class="logo-mark"></span>
      BloomSaaS
    </a>
    <div class="nav-links">
      <a href="#">Product</a>
      <a href="#">Solutions</a>
      <a href="#">Pricing</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1 class="headline">
      Transform Your Workflow with Intelligent Automation
    </h1>
    <p class="subheadline">
      Streamline operations, reduce manual tasks, and empower your team to focus on what matters most — with our AI-powered platform built for modern businesses.
    </p>
    <div class="cta-group">
      <a href="#" class="btn btn-primary">Get Started Free</a>
      <a href="#" class="btn btn-secondary">Watch Demo</a>
    </div>
  </section>
</body>
</html>
