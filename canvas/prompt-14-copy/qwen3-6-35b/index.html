<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Dogfight Screensaver</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px #0f0;
            opacity: 1;
            transition: opacity 1s;
        }
        .hidden {
            opacity: 0 !important;
        }
        #death-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-size: 24px;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 48px; letter-spacing: 5px; }
        p { font-size: 18px; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h1>SYSTEM ONLINE</h1>
    <p>AI PILOT ENGAGED</p>
</div>

<div id="death-screen">
    <h1>HULL BREACH DETECTED</h1>
    <p>EVACUATING COCKPIT...</p>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * CONFIGURATION & CONSTANTS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathScreen = document.getElementById('death-screen');

// 3D Projection Constants
const FOCAL_LENGTH = 250; // As requested
let centerX, centerY;

// Game State
let state = 'FIGHTING'; // FIGHTING, DYING, RESPAWNING
let time = 0;
let camera = { x: 0, y: 0, z: 0, pitch: 0, yaw: 0, roll: 0 };
let player = { 
    x: 0, y: 0, z: 0, 
    vx: 0, vy: 0, vz: 0, 
    hp: 100, 
    target: null,
    lastShot: 0 
};
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];
let nebulaClouds = [];

/**
 * INITIALIZATION
 */
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    centerX = canvas.width / 2;
    centerY = canvas.height / 2;
}
window.addEventListener('resize', resize);
resize();

// Initialize Stars
for(let i=0; i<200; i++) {
    stars.push({
        x: (Math.random() - 0.5) * 4000,
        y: (Math.random() - 0.5) * 4000,
        z: (Math.random() - 0.5) * 4000,
        size: Math.random() * 2 + 0.5
    });
}

// Initialize Nebulae
for(let i=0; i<10; i++) {
    nebulaClouds.push({
        x: (Math.random() - 0.5) * 3000,
        y: (Math.random() - 0.5) * 3000,
        z: (Math.random() - 0.5) * 3000,
        r: 100 + Math.random() * 300,
        color: Math.random() > 0.5 ? 'rgba(100, 0, 200,' : 'rgba(0, 50, 200,'
    });
}

/**
 * MATH & 3D MATH
 */
function rotateX(point, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const y = point.y * cos - point.z * sin;
    const z = point.z * cos + point.y * sin;
    return { ...point, y, z };
}

function rotateY(point, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const x = point.x * cos - point.z * sin;
    const z = point.z * cos + point.x * sin;
    return { ...point, x, z };
}

function rotateZ(point, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const x = point.x * cos - point.y * sin;
    const y = point.y * cos + point.x * sin;
    return { ...point, x, y };
}

function project(x, y, z) {
    // Camera Rotation for projection
    let p = { x, y, z };
    // Rotate point around camera (opposite of camera rotation)
    p = rotateY(p, -camera.yaw);
    p = rotateX(p, -camera.pitch);
    
    // Perspective Projection
    const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
    
    // Check if behind camera
    if (p.z <= -FOCAL_LENGTH) return null;

    const screenX = centerX + p.x * scale;
    const screenY = centerY + p.y * scale;
    
    return { x: screenX, y: screenY, scale, z: p.z };
}

function drawLine3D(x1, y1, z1, x2, y2, z2, color, width) {
    const p1 = project(x1, y1, z1);
    const p2 = project(x2, y2, z2);
    
    if (!p1 || !p2) return;

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width * p1.scale; // Scale line width
    ctx.stroke();
}

function drawSprite3D(x, y, z, baseRadius, color, type = 'circle') {
    const p = project(x, y, z);
    if (!p) return;

    const radius = baseRadius * p.scale;

    ctx.beginPath();
    if (type === 'circle') {
        ctx.arc(p.x, p.y, Math.max(0, radius), 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
    } else if (type === 'triangle') {
        // Simple triangle for ships
        const s = radius * 1.5;
        ctx.moveTo(p.x, p.y - s);
        ctx.lineTo(p.x - s * 0.8, p.y + s * 0.6);
        ctx.lineTo(p.x + s * 0.8, p.y + s * 0.6);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

/**
 * GAME ENTITIES
 */
class Enemy {
    constructor() {
        this.reset();
        this.z = -500 - Math.random() * 1000; // Start far ahead
        this.y = (Math.random() - 0.5) * 500;
        this.x = (Math.random() - 0.5) * 500;
    }

    reset() {
        // Spawn somewhere around the player
        const angle = Math.random() * Math.PI * 2;
        const dist = 1000 + Math.random() * 1000;
        this.x = player.x + Math.cos(angle) * dist;
        this.y = player.y + (Math.random() - 0.5) * 500;
        this.z = player.z + Math.sin(angle) * dist;
        this.hp = 30;
        this.color = `hsl(${Math.random()*60 + 330}, 100%, 50%)`; // Red/Pink hues
        this.lastShot = 0;
    }

    update(dt) {
        // AI Behavior: Follow player loosely and shoot
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dz = player.z - this.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

        // Move towards player
        this.x += (dx / dist) * 80 * dt;
        this.y += (dy / dist) * 60 * dt;
        this.z += (dz / dist) * 80 * dt;

        // Shoot
        if (dist < 800 && time - this.lastShot > 0.8) {
            this.shoot();
            this.lastShot = time;
        }

        // Collision with player
        if (dist < 20) {
            player.hp -= 50;
            this.hp = 0;
            createExplosion(this.x, this.y, this.z, 20);
        }
    }

    shoot() {
        // Aim at player
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dz = player.z - this.z;
        const mag = Math.sqrt(dx*dx + dy*dy + dz*dz);
        
        // Add some inaccuracy
        bullets.push({
            x: this.x, y: this.y, z: this.z,
            vx: (dx/mag)*400 + (Math.random()-0.5)*50,
            vy: (dy/mag)*400 + (Math.random()-0.5)*50,
            vz: (dz/mag)*400 + (Math.random()-0.5)*50,
            owner: 'enemy',
            life: 2,
            color: '#ff0'
        });
    }

    draw() {
        // Draw Ship Body (Wireframe-ish)
        const p = project(this.x, this.y, this.z);
        if(!p) return;
        
        // Calculate rotation to face player roughly
        const dy = player.y - this.y;
        const dx = player.x - this.x;
        let angle = Math.atan2(dy, dx) + Math.PI; // Face player
        
        // Draw simple shape
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.scale * 2, p.scale * 2); // Scale visual size
        ctx.rotate(angle + Math.PI/2);
        
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(10, 10);
        ctx.lineTo(0, 5);
        ctx.lineTo(-10, 10);
        ctx.closePath();
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Engine glow
        ctx.beginPath();
        ctx.arc(0, 10, 3, 0, Math.PI*2);
        ctx.fillStyle = '#0ff';
        ctx.fill();
        
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, z, vx, vy, vz, life, color) {
        this.x = x; this.y = y; this.z = z;
        this.vx = vx; this.vy = vy; this.vz = vz;
        this.life = life;
        this.maxLife = life;
        this.color = color;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.z += this.vz * dt;
        this.life -= dt;
    }
    draw() {
        const alpha = this.life / this.maxLife;
        drawSprite3D(this.x, this.y, this.z, 5, this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba'), 'circle');
    }
}

function createExplosion(x, y, z, count) {
    for(let i=0; i<count; i++) {
        const speed = Math.random() * 200;
        const vx = (Math.random() - 0.5) * speed;
        const vy = (Math.random() - 0.5) * speed;
        const vz = (Math.random() - 0.5) * speed;
        particles.push(new Particle(x, y, z, vx, vy, vz, 1 + Math.random(), 'rgb(255, 100, 0)'));
    }
}

/**
 * LOGIC
 */
function updatePlayer(dt) {
    if (state !== 'FIGHTING') return;

    // Auto-Pilot Logic
    // Find closest enemy
    let closestDist = Infinity;
    let target = null;
    
    enemies.forEach(e => {
        const dx = e.x - player.x;
        const dy = e.y - player.y;
        const dz = e.z - player.z;
        const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (d < closestDist) {
            closestDist = d;
            target = e;
        }
    });

    // Smoothly move towards target
    if (target) {
        // Move position
        const dx = target.x - player.x;
        const dy = target.y - player.y;
        const dz = target.z - player.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        
        // If too far, close in. If close, maneuver
        let desiredX = dx;
        let desiredY = dy;
        let desiredZ = dz;

        if (dist < 300) {
            // Dodge logic (weave)
            desiredY += Math.sin(time * 5) * 50;
            desiredX += Math.cos(time * 3) * 50;
        }

        player.x += desiredX * dt * 2;
        player.y += desiredY * dt * 2;
        player.z += desiredZ * dt * 2;
    } else {
        // Patrol mode
        player.z += 100 * dt; // Fly forward
        player.y += Math.sin(time) * 50 * dt;
    }

    // Camera follows player
    camera.x = player.x;
    camera.y = player.y;
    camera.z = player.z - 100; // Behind ship
    camera.pitch = 0.05; // Look slightly up/straight
    camera.yaw = 0;
    camera.roll = 0;

    // Shooting
    if (target && closestDist < 800 && time - player.lastShot > 0.15) {
        // Aim at target
        const dx = target.x - player.x;
        const dy = target.y - player.y;
        const dz = target.z - player.z;
        const mag = Math.sqrt(dx*dx + dy*dy + dz*dz);
        
        bullets.push({
            x: player.x,
            y: player.y,
            z: player.z,
            vx: (dx/mag)*800,
            vy: (dy/mag)*800,
            vz: (dz/mag)*800,
            owner: 'player',
            life: 1.5,
            color: '#0ff'
        });
        player.lastShot = time;
    }
}

function spawnEnemy() {
    if (enemies.length < 5) {
        enemies.push(new Enemy());
    }
}

function update(dt) {
    time += dt;

    if (state === 'DYING') {
        // Camera follows explosion
        const p = particles[0];
        if(p) {
            camera.x += (p.x - camera.x) * 0.1;
            camera.y += (p.y - camera.y) * 0.1;
            camera.z += (p.z - camera.z) * 0.1;
        }
        if (time > 4) {
            respawn();
        }
    } else if (state === 'RESPAWNING') {
        // Reset
        player.hp = 100;
        player.x = 0; player.y = 0; player.z = 0;
        enemies = [];
        bullets = [];
        particles = [];
        state = 'FIGHTING';
        deathScreen.style.display = 'none';
        document.getElementById('ui-layer').classList.remove('hidden');
        setTimeout(() => document.getElementById('ui-layer').classList.add('hidden'), 2000);
    } else {
        // FIGHTING
        updatePlayer(dt);
        spawnEnemy();

        // Update Enemies
        enemies = enemies.filter(e => {
            e.update(dt);
            return e.hp > 0;
        });

        // Update Bullets
        bullets.forEach(b => {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.z += b.vz * dt;
            b.life -= dt;
        });
        bullets = bullets.filter(b => b.life > 0);

        // Collision Logic
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            if (b.owner === 'player') {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const dx = b.x - e.x;
                    const dy = b.y - e.y;
                    const dz = b.z - e.z;
                    if (dx*dx + dy*dy + dz*dz < 2500) { // Hit radius squared
                        e.hp -= 10;
                        bullets.splice(i, 1);
                        createExplosion(e.x, e.y, e.z, 2);
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, e.z, 20);
                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }
            } else if (b.owner === 'enemy') {
                const dx = b.x - player.x;
                const dy = b.y - player.y;
                const dz = b.z - player.z;
                if (dx*dx + dy*dy + dz*dz < 2500) {
                    bullets.splice(i, 1);
                    player.hp -= 20;
                    createExplosion(player.x, player.y, player.z, 5);
                    if (player.hp <= 0) die();
                }
            }
        }

        // Update Particles
        particles.forEach(p => p.update(dt));
        particles = particles.filter(p => p.life > 0);
    }
}

function die() {
    state = 'DYING';
    deathScreen.style.display = 'flex';
    createExplosion(player.x, player.y, player.z, 50);
    // Set camera center on explosion
    camera.x = player.x;
    camera.y = player.y;
    camera.z = player.z;
}

function respawn() {
    state = 'RESPAWNING';
    deathScreen.style.display = 'none';
    setTimeout(() => {
        state = 'FIGHTING';
        player.hp = 100;
        player.x = 0; player.y = 0; player.z = 0;
        enemies = [];
        bullets = [];
        particles = [];
    }, 1000);
}

/**
 * RENDERING
 */
function draw() {
    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Sort objects by Z depth for painter's algorithm
    // Note: Standard 3D projection requires sorting back-to-front
    
    // 1. Draw Stars
    stars.forEach(star => {
        const p = project(star.x, star.y, star.z);
        if (p) {
            ctx.fillStyle = `rgba(255,255,255, ${Math.min(1, p.scale * 2)})`;
            ctx.fillRect(p.x, p.y, star.size * p.scale * 2, star.size * p.scale * 2);
        }
    });

    // 2. Draw Nebulae (Billboards)
    // We draw them as circles scaled by distance
    const drawables = [];

    nebulaClouds.forEach(n => {
        const p = project(n.x, n.y, n.z);
        if (p) {
            drawables.push({ type: 'nebula', z: p.z, p: p, data: n });
        }
    });

    // 3. Draw Enemies
    enemies.forEach(e => {
        const p = project(e.x, e
