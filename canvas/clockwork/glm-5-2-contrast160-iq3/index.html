<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockwork Machine</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100; overflow: hidden; background: #1a1306; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const C = document.getElementById('c');
const G = C.getContext('2d');
let W = 0, H = 0;

const COL = {
  bg: '#15110a', bgMid: '#1f1605', bgEdge: '#100820',
  brass: '#8a7a4a', brassLt: '#bca868', brassDk: '#4a3c28',
  brassHlt: '#e2c586', brassShd: '#0e0c06',
  iron: '#3a342c', ironLt: '#676156', ironDk: '#181408',
  riv: '#231006', rivHlt: '#3a1418',
  chain: '#8e7a3c', chainHlt: '#c6a258',
  rod: '#40280a', rodLt: '#a08040',
  accent: '#cc4428', accentLt: '#f6a866',
  bird: '#2d1815', birdLt: '#5a2426', birdEye: '#f4a048'
};

const rand = (a=1) => Math.random() * a;
const rrange = (lo, hi) => lo + Math.random() * (hi - lo);
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = (t) => t * t * (3 - 2 * t);

function roundRect(c, x, y, w, h, r) {
  r = Math.max(0.001, Math.min(r, w/2, h/2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arcTo(x + w, y, x + w, y + r, r);
  c.lineTo(x + w, y + h - r);
  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);
  c.arcTo(x, y + h, x, y + h - r, r);
  c.lineTo(x, y + r);
  c.arcTo(x, y, x + r, y, r);
  c.closePath();
}

function drawGear(c, x, y, r, teeth, t, body, rim) {
  r = Math.max(2.5, r);
  const t0 = (2 * Math.PI) / teeth;
  c.save();
  c.translate(x, y);
  c.rotate(t);
  for (let i = 0; i < teeth; i++) {
    const a = i * t0;
    const a0 = a + 0.15 * t0;
    const a2 = a + t0 - 0.15 * t0;
    const inner = r * 0.9;
    const outer = r + r * 0.18;
    c.fillStyle = body;
    c.beginPath();
    c.moveTo(Math.cos(a0) * inner, Math.sin(a0) * inner);
    const am = a + t0 / 2;
    const bx = Math.cos(am) * outer, by = Math.sin(am) * outer;
    const ax = Math.cos(a2) * inner, ay = Math.sin(a2) * inner;
    c.bezierCurveTo(bx * 1.1, by * 1.1, ax * 0.85, ay * 0.85, ax, ay);
    c.lineTo(Math.cos(a2) * (outer * 0.4 + inner * 0.6), Math.sin(a2) * (outer * 0.4 + inner * 0.6));
    c.closePath();
    c.fill();
  }
  c.fillStyle = rim;
  c.beginPath();
  c.arc(0, 0, r * 0.92, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = body;
  c.beginPath();
  c.arc(0, 0, r * 0.85, 0, 2 * Math.PI);
  c.fill();
  if (rim === COL.brassLt) {
    c.fillStyle = 'rgba(255, 220, 130, 0.08)';
    c.beginPath();
    c.arc(-r * 0.3, -r * 0.3, r * 0.6, 0, 2 * Math.PI);
    c.fill();
  }
  const spokes = teeth > 6 ? Math.max(3, Math.min(8, Math.floor(teeth / 2))) : 4;
  const innerH = r * 0.7, innerL = r * 0.15;
  c.save();
  for (let i = 0; i < spokes; i++) {
    c.fillStyle = COL.brassDk;
    c.save();
    c.rotate(i * 2 * Math.PI / spokes);
    c.beginPath();
    c.moveTo(-innerL, -innerH);
    c.lineTo(innerL, innerH * 0.85);
    c.lineTo(-innerL, -innerH * 0.85);
    c.lineTo(innerL, innerH);
    c.closePath();
    c.fill();
    c.fillStyle = COL.brassLt;
    c.beginPath();
    c.moveTo(-innerL, -innerH);
    c.lineTo(innerL, innerH * 0.85);
    c.lineTo(-innerL, -innerH * 0.85);
    c.lineTo(innerL * 0.8, innerH);
    c.closePath();
    c.fill();
    c.restore();
  }
  c.restore();
  c.fillStyle = COL.riv;
  c.beginPath();
  c.arc(0, 0, r * 0.15, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = COL.rivHlt;
  c.beginPath();
  c.arc(-r * 0.06, -r * 0.06, r * 0.08, 0, 2 * Math.PI);
  c.fill();
  c.restore();
}

function drawSprocket(c, x, y, r, teeth, t) {
  c.save();
  c.translate(x, y);
  c.rotate(t);
  c.fillStyle = COL.brassDk;
  c.beginPath();
  c.arc(0, 0, r * 1.08, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = COL.brass;
  c.beginPath();
  c.arc(0, 0, r * 0.7, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = COL.brassLt;
  c.beginPath();
  c.arc(0, 0, r * 0.55, 0, 2 * Math.PI);
  c.fill();
  const T = (2 * Math.PI) / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = (i + 0.5) * T;
    const a0 = a - 0.35 * T, a2 = a + 0.35 * T;
    const rr = r * 0.92;
    c.fillStyle = COL.brass;
    c.beginPath();
    c.moveTo(Math.cos(a0) * rr, Math.sin(a0) * rr);
    c.arc(0, 0, rr * 1.07, a0, a2);
    c.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr);
    c.closePath();
    c.fill();
  }
  c.fillStyle = COL.riv;
  c.beginPath();
  c.arc(0, 0, r * 0.22, 0, 2 * Math.PI);
  c.fill();
  c.restore();
}

function drawChain(c, x1, y1, x2, y2, phase) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 2) return;
  const ux = dx / len, uy = dy / len;
  const px = -uy, py = ux;
  const segLen = 7;
  const n = Math.floor(len / segLen);
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) * segLen;
    const cx = x1 + ux * u;
    const cy = y1 + uy * u;
    const w = (i & 1) ? 5 : 4;
    const ang = Math.atan2(uy, ux) + ((i & 1) ? Math.PI / 2 : 0) + phase * (i & 1);
    c.save();
    c.translate(cx, cy);
    c.rotate(ang);
    c.fillStyle = COL.chain;
    roundRect(c, -w, -w * 0.5, w * 2, w, w * 0.5);
    c.fill();
    c.fillStyle = COL.chainHlt;
    c.beginPath();
    c.arc(0, 0, w * 0.2, 0, 2 * Math.PI);
    c.fill();
    c.fillStyle = COL.riv;
    c.beginPath();
    c.arc(-w * 0.7, 0, w * 0.2, 0, 2 * Math.PI);
    c.arc(w * 0.7, 0, w * 0.2, 0, 2 * Math.PI);
    c.fill();
    c.restore();
  }
  c.strokeStyle = 'rgba(140, 120, 40, 0.18)';
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(x1, y1);
  c.lineTo(x2, y2);
  c.stroke();
}

function drawBird(c, x, y, scale, flapPhase, chirpPhase, chirping) {
  c.save();
  c.translate(x, y);
  const sc = Math.max(0.001, scale);
  c.scale(sc, sc);
  const flap = Math.sin(flapPhase) * 0.4;
  c.save();
  c.translate(0, -8 * scale + 5 * Math.abs(Math.sin(flapPhase)));
  const wingY = -flap * 4;
  const wingSkew = Math.abs(flap) > 0.001 ? (1 - Math.abs(flap) * 3) : 1;
  c.fillStyle = COL.bird;
  c.beginPath();
  c.ellipse(-9, wingY, 14, 4, -0.4, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.ellipse(9, wingY, 14, 4, 0.4, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = COL.birdLt;
  c.beginPath();
  c.ellipse(-14, wingY - 1, 5, 3, -0.4, 0, Math.PI * 2);
  c.ellipse(14, wingY - 1, 5, 3, 0.4, 0, Math.PI * 2);
  c.fill();
  c.restore();
  c.fillStyle = COL.bird;
  roundRect(c, -6, -6, 12, 16, 5);
  c.fill();
  c.fillStyle = COL.birdLt;
  roundRect(c, -2, -7, 5, 8, 2.5);
  c.fill();
  c.fillStyle = COL.birdEye;
  c.beginPath();
  c.arc(-2, -6, 1.5, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = COL.bird;
  c.beginPath();
  c.arc(0, -1, 4, Math.PI, Math.PI * 2);
  c.lineTo(6, -1);
  c.lineTo(0, 0);
  c.closePath();
  c.fill();
  c.fillStyle = COL.birdLt;
  c.beginPath();
  c.ellipse(-4, 8, 6, 4, -0.4, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = COL.bird;
  roundRect(c, -9, -3, 5, 11, 1.5);
  c.ellipse(-9, 8, 3, 2, 0, Math.PI, 0);
  c.fill();
  c.beginPath();
  c.ellipse(9, 8, 3, 2, 0, 0, Math.PI);
  c.fill();
  if (chirping) {
    const cs = 1 + chirpPhase * 0.6;
    c.fillStyle = COL.birdLt;
    c.font = `bold ${Math.max(10, 8 * cs) * 1.5}px serif`;
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * 0.7;
      const r = 5 + 8 * chirpPhase;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r - 5;
      c.save();
      c.translate(px, py);
      c.rotate(a + Math.PI / 2);
      c.fillText('♩', -5 * cs, -5 * cs);
      c.restore();
    }
  }
  c.restore();
}

function drawPiston(c, px, py, cx, cy, r, pr, progress) {
  const ang = Math.atan2(cy - py, cx - px);
  const len = Math.sqrt((cx - px) ** 2 + (cy - py) ** 2);
  c.save();
  c.translate(px, py);
  c.rotate(ang);
  c.fillStyle = COL.ironDk;
  roundRect(c, 0, -pr, len, pr * 2, 4);
  c.fill();
  c.fillStyle = COL.iron;
  roundRect(c, 4, -pr + 2, len - 8, pr - 1.2, 4);
  c.fill();
  c.strokeStyle = COL.riv;
  c.lineWidth = 0.5;
  c.fillStyle = COL.iron;
  c.beginPath();
  c.arc(0, 0, 1, 0, 2 * Math.PI);
  c.fill();
  c.beginPath();
  c.arc(len, 0, 1, 0, 2 * Math.PI);
  c.fill();
  const strokeLen = len - 10;
  const x1 = 10;
  const y1 = 0;
  const x2 = 10 + strokeLen * progress;
  const y2 = 0;
  c.strokeStyle = COL.rod;
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(x1, y1);
  c.lineTo(x2, y2);
  c.stroke();
  c.strokeStyle = COL.rodLt;
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(x1 - 2, y1 - 1);
  c.lineTo(x2, y2 - 1);
  c.stroke();
  c.fillStyle = COL.riv;
  c.beginPath();
  c.arc(x2, y2, 2, 0, 2 * Math.PI);
  c.fill();
  c.strokeStyle = COL.ironDk;
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(x2, y2);
  c.lineTo(cx - px + 5, cy - py);
  c.stroke();
  c.restore();
}

function drawEscapement(c, x, y, t) {
  c.save();
  c.translate(x, y);
  c.fillStyle = COL.brassDk;
  c.beginPath();
  c.arc(0, 0, 4, 0, 2 * Math.PI);
  c.fill();
  const len = 9;
  const swing = Math.sin(t) * 0.08;
  const ang = -Math.PI / 2 + swing;
  const tipX = Math.cos(ang) * len;
  const tipY = Math.sin(ang) * len;
  c.save();
  c.rotate(sing = swing);
  c.fillStyle = COL.brassLt;
  c.beginPath();
  c.moveTo(-5, -5);
  c.lineTo(0, -7);
  c.lineTo(0, 0);
  c.lineTo(-3, 5);
  c.lineTo(-2, 2);
  c.lineTo(-5, -5);
  c.closePath();
  c.fill();
  c.fillStyle = COL.brassDk;
  c.beginPath();
  c.arc(0, 0, 2.5, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = COL.rivHlt;
  c.beginPath();
  c.arc(0, 0, 1.5, 0, 2 * Math.PI);
  c.fill();
  c.restore();
  const a1 = ang + 0.45;
  const a2 = ang - 0.45;
  c.strokeStyle = COL.brassLt;
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(0, 0);
  c.lineTo(Math.cos(a1) * len, Math.sin(a1) * len);
  c.stroke();
  c.beginPath();
  c.moveTo(0, 0);
  c.lineTo(Math.cos(a2) * len, Math.sin(a2) * len);
  c.stroke();
  const tip1X = Math.cos(a1) * len, tip1Y = Math.sin(a1) * len;
  const tip2X = Math.cos(a2) * len, tip2Y = Math.sin(a2) * len;
  c.fillStyle = COL.accent;
  c.beginPath();
  c.arc(tip1X, tip1Y, 1.5, 0, 2 * Math.PI);
  c.arc(tip2X, tip2Y, 1.5, 0, 2 * Math.PI);
  c.fill();
  c.restore();
}

const M = {
  time: 0,
  dt: 1 / 60,
  gears: [],
  sprockets: [],
  escapement: null,
  pistons: [],
  bird: null,
  repairArm: null,
  bgCanvas: null,
  bgW: 0, bgH: 0,
  looseGears: [],
  particles: []
};

function buildMachine(w, h) {
  const gears = [];
  const sprockets = [];
  const escapement = { x: w * 0.32, y: h * 0.48, phase: 0 };
  const pistons = [];
  M.looseGears = [];
  M.gearIndex = [];
  const sprocketsData = [
    { x: w * 0.05, y: h * 0.92, r: 32, teeth: 8, rate: 0.4 },
    { x: w * 0.5, y: h * 0.92, r: 32, teeth: 8, rate: 0.4 },
    { x: w * 0.95, y: h * 0.92, r: 32, teeth: 8, rate: 0.4 }
  ];
  for (const sp of sprocketsData) {
    const gear = { x: sp.x, y: sp.y, r: sp.r, teeth: sp.teeth, phase: 0, rate: sp.rate, type: 'sprocket' };
    gears.push(gear);
    sprockets.push(gear);
  }
  const mainX = w * 0.5, mainY = h * 0.28;
  const mainTeeth = 36, mainR = Math.min(w, h) * 0.06;
  const main = { x: mainX, y: mainY, r: mainR, teeth: mainTeeth, phase: 0, rate: 0.4, type: 'main' };
  gears.push(main);
  const g1X = w * 0.18, g1Y = mainY + mainR * 0.9 + Math.min(w, h) * 0.015;
  const g1 = { x: g1X, y: g1Y, r: Math.min(w, h) * 0.022, teeth: 18, phase: 0, rate: -mainTeeth / 18, type: 'g1' };
  gears.push(g1);
  const g3X = w * 0.82, g3Y = mainY + mainR * 0.9 + Math.min(w, h) * 0.015;
  const g3 = { x: g3X, y: g3Y, r: Math.min(w, h) * 0.022, teeth: 18, phase: 0, rate: -mainTeeth / 18, type: 'g3' };
  gears.push(g3);
  const g2X = w * 0.3, g2Y = g1Y + Math.min(w, h) * 0.022 * 0.9 + Math.min(w, h) * 0.022 * 0.9;
  const g2 = { x: g2X, y: g2Y, r: Math.min(w, h) * 0.012, teeth: 9, phase: 0, rate: -18 / 9, type: 'g2' };
  gears.push(g2);
  const g4X = w * 0.7, g4Y = g3Y + Math.min(w, h) * 0.022 * 0.9 + Math.min(w, h) * 0.022 * 0.9;
  const g4 = { x: g4X, y: g4Y, r: Math.min(w, h) * 0.012, teeth: 9, phase: 0, rate: -18 / 9, type: 'g4' };
  gears.push(g4);
  const g5X = w * 0.4, g5Y = g2Y + Math.min(w, h) * 0.012 * 0.9 + Math.min(w, h) * 0.012 * 0.9;
  const g5 = { x: g5X, y: g5Y, r: Math.min(w, h) * 0.008, teeth: 6, phase: 0, rate: -9 / 6, type: 'g5' };
  gears.push(g5);
  const g6X = w * 0.6, g6Y = g5Y + Math.min(w, h) * 0.012 * 0.9 + Math.min(w, h) * 0.012 * 0.9;
  const g6 = { x: g6X, y: g6Y, r: Math.min(w, h) * 0.008, teeth: 6, phase: 0, rate: -9 / 6, type: 'g6' };
  gears.push(g6);
  const g7X = w * 0.50, g7Y = g2Y + Math.min(w, h) * 0.034, g7R = Math.min(w, h) * 0.034;
  const g7 = { x: g7X, y: g7Y, r: g7R, teeth: 28, phase: 0, rate: mainTeeth / 28, type: 'g7' };
  gears.push(g7);
  const g8X = w * 0.50, g8Y = g7Y - g7R * 0.8 - Math.min(w, h) * 0.034 * 0.8, g8R = Math.min(w, h) * 0.034;
  const g8 = { x: g8X, y: g8Y, r: g8R, teeth: 24, phase: 0, rate: -28 / 24, type: 'g8' };
  gears.push(g8);
  const escapementG = { x: w * 0.32, y: h * 0.48, r: Math.min(w, h) * 0.018, teeth: 14, phase: 0, rate: -24 / 14, type: 'esc' };
  gears.push(escapementG);
  escapement.gear = escapementG;
  const p1X = w * 0.36, p1Y = h * 0.92;
  const p1 = { x: p1X, y: p1Y, r: 12, teeth: 12, phase: 0, rate: 0.4, type: 'p1' };
  gears.push(p1);
  const p1Piston = { cx: w * 0.36, cy: h * 0.9, r: 12, phase: 0, rate: 0.4, px: w * 0.36, py: h * 0.8, pr: 12, progress: 0 };
  pistons.push(p1Piston);
  const p2X = w * 0.64, p2Y = h * 0.92;
  const p2 = { x: p2X, y: p2Y, r: 12, teeth: 12, phase: 0, rate: -0.4, type: 'p2' };
  gears.push(p2);
  const p2Piston = { cx: w * 0.64, cy: h * 0.9, r: 12, phase: 0, rate: -0.4, px: w * 0.64, py: h * 0.8, pr: 12, progress: 0 };
  pistons.push(p2Piston);
  const bird = {
    x: w * 0.50, y: h * 0.05,
    popPhase: 0,
    lastPopTime: M.time - 45,
    chirpPhase: 0,
    flapPhase: 0,
    chirping: false,
    scale: 0,
    visible: false
  };
  M.gears = gears;
  M.sprockets = sprockets;
  M.pistons = pistons;
  M.bird = bird;
  M.escapement = escapement;
  M.bird = bird;
  const repairArm = {
    base: { x: w * 0.5, y: h * 0.05 },
    angle: 0,
    targetAngle: 0,
    length: Math.min(w, h) * 0.45,
    target: null,
    state: 'idle',
    timer: 0,
    progress: 0,
    x: w * 0.5, y: h * 0.05
  };
  M.repairArm = repairArm;
  M.repairArm = repairArm;
}

function updateGearPhase(phase, rate, dt) {
  phase += rate * dt;
  phase -= Math.floor(phase);
  return phase;
}

function updateSprocketPhase(phase, rate, dt) {
  phase += rate * dt;
  phase -= Math.floor(phase);
  return phase;
}

function updateEscapementPhase(phase, dt) {
  phase += dt * 8;
  phase -= Math.floor(phase);
  return phase;
}

function updatePistonPhase(phase, rate, dt) {
  phase += rate * dt;
  phase -= Math.floor(phase);
  return phase;
}

function updateLooseGearPhysics(loose, dt) {
  loose.x += loose.vx * dt;
  loose.y += loose.vy * dt;
  loose.phase += loose.av * dt;
  loose.phase -= Math.floor(loose.phase);
  const damp = Math.pow(0.4, dt * 60);
  loose.vx *= damp;
  loose.vy *= damp;
  loose.vy += 200 * dt;
  if (loose.y > H - loose.r) {
    loose.y = H - loose.r;
    loose.vy = -Math.abs(loose.vy) * 0.4;
    loose.vx *= 0.95;
  }
  if (loose.x < loose.r) {
    loose.x = loose.r;
    loose.vx = Math.abs(loose.vx) * 0.7;
  }
  if (loose.x > W - loose.r) {
    loose.x = W - loose.r;
    loose.vx = -Math.abs(loose.vx) * 0.7;
  }
  if (Math.abs(loose.vx) < 0.01 && Math.abs(loose.vy) < 0.01 && Math.abs(loose.y - (H - loose.r)) < 1) {
    loose.vx = 0; loose.vy = 0;
    return true;
  }
  for (const g of M.gears) {
    if (g === loose.gear) continue;
    const dx = loose.x - g.x;
    const dy = loose.y - g.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const minDist = loose.r + g.r;
    if (dist < minDist && dist > 0.01) {
      const nx = dx / dist, ny = dy / dist;
      const overlap = minDist - dist;
      loose.x += nx * overlap * 0.5;
      loose.y += ny * overlap * 0.5;
      const vn = loose.vx * nx + loose.vy * ny;
      if (vn < 0) {
        loose.vx -= 2 * vn * nx * 0.6;
        loose.vy -= 2 * vn * ny * 0.6;
        loose.av += (loose.vx * ny - loose.vy * nx) * 0.001;
      } else {
        loose.vy += 200 * dt;
      }
      loose.vx *= 0.95; loose.vy *= 0.95;
    }
  }
  return false;
}

function updateRepairArm(arm, dt, H, W) {
  if (!arm.target) {
    if (M.looseGears.length > 0 && M.looseGears[0].life > 2.5) {
      arm.target = M.looseGears[0];
      arm.state = 'tracking';
      arm.timer = 0;
    }
    return;
  }
  if (arm.state === 'tracking') {
    arm.timer += dt;
    arm.targetAngle = Math.atan2(arm.target.y - arm.base.y, arm.target.x - arm.base.x);
    const diff = arm.targetAngle - arm.angle;
    let d = Math.atan2(Math.sin(diff), Math.cos(diff));
    arm.angle += d * Math.min(1, dt * 5);
    if (arm.timer > 0.4 && Math.abs(d) < 0.05) {
      arm.state = 'approaching';
      arm.timer = 0;
    }
  }
  if (arm.state === 'approaching') {
    arm.timer += dt;
    const dist = Math.sqrt((arm.target.x - arm.base.x) ** 2 + (arm.target.y - arm.base.y) ** 2);
    const desired = dist - arm.target.r - 5;
    if (arm.length < desired) arm.length += (desired - arm.length) * Math.min(1, dt * 5);
    arm.angle += (arm.targetAngle - arm.angle) * Math.min(1, dt * 5);
    if (arm.timer > 2.5 && Math.abs(arm.length - desired) < 5) {
      arm.state = 'grabbing';
      arm.timer = 0;
    }
  }
  if (arm.state === 'grabbing') {
    arm.timer += dt;
    const tipX = arm.base.x + Math.cos(arm.angle) * arm.length;
    const tipY = arm.base.y + Math.sin(arm.angle) * arm.length;
    const dx = arm.target.x - tipX;
    const dy = arm.target.y - tipY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 0.1) {
      const pullSpeed = Math.min(1, dt * 5);
      arm.target.x += dx * pullSpeed;
      arm.target.y += dy * pullSpeed;
    }
    const targetX = arm.target.gear.x;
    const targetY = arm.target.gear.y;
    const ddx = arm.target.x - targetX;
    const ddy = arm.target.y - targetY;
    const ddist = Math.sqrt(ddx * ddx + ddy * ddy);
    if (arm.timer > 3 && ddist < 5) {
      arm.target.gear.phase = 0;
      const idx = M.looseGears.indexOf(arm.target);
      if (idx >= 0) M.looseGears.splice(idx, 1);
      arm.state = 'retracting';
      arm.timer = 0;
      arm.target = null;
      M.gearIndex = null;
      for (let i = 0; i < 30; i++) M.particles.push({
        x: targetX, y: targetY, vx: rand(2) - 1, vy: rand(2) - 1, r: rand(2) + 1, life: 1.5
      });
    }
  }
  if (arm.state === 'retracting') {
    arm.timer += dt;
    const desired = Math.min(W, H) * 0.45 * 0.5;
    arm.length += (desired - arm.length) * Math.min(1, dt * 5);
    if (arm.timer > 1.5) {
      arm.state = 'idle';
      arm.timer = 0;
    }
  }
}

function updateParticles(particles, dt) {
  for (const p of particles) {
    p.x += p.vx * 60 * dt;
    p.y += p.vy * 60 * dt;
    p.vy += 200 * dt;
    p.life -= dt;
  }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
}

function updateBird(bird, dt, time, W, H) {
  if (time - bird.lastPopTime >= 45) {
    bird.lastPopTime += 45;
    bird.popPhase = 0;
  }
  bird.popPhase += dt;
  const cycle = bird.popPhase / 45;
  if (cycle < 0.15) {
    const t = cycle / 0.15;
    bird.visible = true;
    bird.scale = Math.pow(t, 0.3) * 1;
    bird.flapPhase += dt * 40;
  } else if (cycle < 0.35) {
    const t = (cycle - 0.15) / 0.2;
    bird.visible = true;
    bird.scale = 1;
    bird.flapPhase += dt * 30;
    bird.chirpPhase += dt * 8;
    bird.chirping = (Math.sin(bird.chirpPhase * 8) > 0.4) && Math.sin(bird.chirpPhase * 0.5) > 0;
  } else if (cycle < 0.45) {
    const t = (cycle - 0.35) / 0.1;
    bird.visible = true;
    bird.scale = 1 - Math.pow(t, 0.5);
    bird.flapPhase += dt * 40;
    bird.chirping = false;
  } else if (cycle < 5) {
    bird.visible = false;
    bird.scale = 0;
    bird.chirping = false;
    bird.popPhase = 0;
  }
  bird.flapPhase += dt * 0.5;
  bird.y = H * 0.05 + Math.sin(M.time * 5) * 2;
}

function drawGearShadow(c, x, y, r) {
  c.save();
  c.fillStyle = 'rgba(0, 0, 0, 0.4)';
  c.beginPath();
  c.ellipse(x + 5, y + 5, r * 1.0, r * 0.6, 0, 0, 2 * Math.PI);
  c.fill();
  c.restore();
}

function drawBackground(c, w, h) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, COL.bgEdge);
  g.addColorStop(0.5, COL.bgMid);
  g.addColorStop(1, COL.bg);
  c.fillStyle = g;
  c.fillRect(0, 0, w, h);
  const rg = c.createRadialGradient(w * 0.5, h * 0.3, w * 0.05, w * 0.5, h * 0.3, w * 0.65);
  rg.addColorStop(0, 'rgba(80, 60, 30, 0.5)');
  rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
  c.fillStyle = rg;
  c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(40, 30, 15, 0.5)';
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(0, h * 0.6);
  c.lineTo(w, h * 0.6);
  c.stroke();
  c.fillStyle = 'rgba(40, 30, 15, 0.5)';
  c.beginPath();
  c.arc(w * 0.5, h * 0.3, w * 0.45, 0, 2 * Math.PI);
  c.fill();
}

function drawFrame(c, w, h) {
  c.save();
  c.fillStyle = COL.ironDk;
  const bw = Math.min(w, h) * 0.04;
  roundRect(c, 0, 0, w, bw, bw * 0.3);
  c.fill();
  roundRect(c, 0, h - bw, w, bw, bw * 0.3);
  c.fill();
  roundRect(c, 0, 0, bw, h, bw * 0.3);
  c.fill();
  roundRect(c, w - bw, 0, bw, h, bw * 0.3);
  c.fill();
  c.fillStyle = COL.iron;
  roundRect(c, bw * 0.3, bw * 0.3, w - bw * 0.6, bw * 0.5, bw * 0.25);
  c.fill();
  roundRect(c, bw * 0.3, h - bw - bw * 0.3, w - bw * 0.6, bw * 0.5, bw * 0.25);
  c.fill();
  roundRect(c, bw * 0.3, bw * 0.3, bw * 0.5, h - bw * 0.6, bw * 0.25);
  c.fill();
  roundRect(c, w - bw - bw * 0.3, bw * 0.3, bw * 0.5, h - bw * 0.6, bw * 0.25);
  c.fill();
  c.fillStyle = COL.riv;
  const r1 = bw * 0.2, r2 = bw * 0.55;
  [[r1, r1], [w - bw + r1, r1], [r1, h - bw + r1], [w - bw + r1, h - bw + r1], [bw + r1, bw + r1], [w - bw - bw + r1, bw + r1], [bw + r1, h - bw - bw + r1], [w - bw - bw + r1, h - bw - bw + r1]].forEach(p => {
    c.beginPath();
    c.arc(p[0], p[1], r2, 0, 2 * Math.PI);
    c.fill();
  });
  [[w * 0.3, h * 0.6 + bw * 0.5], [w * 0.7, h * 0.6 + bw * 0.5], [w * 0.5, h * 0.05 + bw * 0.5]].forEach(p => {
    c.beginPath();
    c.arc(p[0], p[1], bw * 0.4, 0, 2 * Math.PI);
    c.fill();
  });
  c.restore();
}

function tick(dt) {
  M.dt = Math.min(1/30, Math.max(1/240, dt));
  M.time += M.dt;
  for (const g of M.gears) {
    g.phase += g.rate * M.dt;
    g.phase -= Math.floor(g.phase);
  if (g.phase < 0) g.phase += 1;
  }
  M.escapement.phase += M.dt * 8;
  M.escapement.phase -= Math.floor(M.escapement.phase);
  for (const p of M.pistons) {
    p.phase += p.rate * M.dt;
    p.phase -= Math.floor(p.phase);
    const c = Math.cos(p.phase * 2 * Math.PI);
    p.progress = (c * 0.5 + 0.5) * 0.85 + 0.07;
  }
  updateBird(M.bird, M.dt, M.time, W, H);
  for (const lg of M.looseGears) {
    lg.life += M.dt;
    const settled = updateLooseGearPhysics(lg, M.dt);
    if (settled && !lg.settled) {
      lg.settled = true;
    }
  }
  for (let i = M.looseGears.length - 1; i >= 0; i--) {
    if (M.looseGears[i].life > 9) M.looseGears.splice(i, 1);
  }
  updateRepairArm(M.repairArm, M.dt, H, W);
  updateParticles(M.particles, M.dt);
  if (Math.random() < M.dt * 0.15 && M.gears.length > 0 && M.looseGears.length === 0) {
    const candidates = M.gears.filter(g => g.type !== 'sprocket' && g.r > 20);
    if (candidates.length > 0) {
      const g = candidates[Math.floor(Math.random() * candidates.length)];
      M.looseGears.push({
        x: g.x, y: g.y, vx: (Math.random() - 0.5) * 80, vy: -120 - Math.random() * 50, av: (Math.random() - 0.5) * 4,
        phase: g.phase, r: g.r, teeth: g.teeth, gear: g, life: 0, settled: false
      });
      for (let i = 0; i < 20; i++) M.particles.push({
        x: g.x, y: g.y, vx: rand(5) - 2.5, vy: rand(5) - 2.5, r: rand(2) + 1, life: 1.5
      });
    }
  }
}

function render() {
  G.fillStyle = COL.bg;
  G.fillRect(0, 0, W, H);
  if (M.bgCanvas) {
    G.drawImage(M.bgCanvas, 0, 0);
  }
  for (const sp of M.sprockets) drawSprocket(G, sp.x, sp.y, sp.r, sp.teeth, sp.phase);
  drawChain(G, M.sprockets[0].x, M.sprockets[0].y, M.sprockets[1].x, M.sprockets[1].y, M.time);
  drawChain(G, M.sprockets[1].x, M.sprockets[1].y, M.sprockets[2].x, M.sprockets[2].y, M.time);
  drawChain(G, M.sprockets[0].x, M.sprockets[0].y, M.sprockets[1].x, M.sprockets[1].y, M.time);
  for (const g of M.gears) {
    if (g.type === 'sprocket') continue;
    drawGearShadow(G, g.x, g.y, g.r);
    drawGear(G, g.x, g.y, g.r, g.teeth, g.phase * 2 * Math.PI, COL.brassLt, COL.brass);
  }
  drawEscapement(G, M.escapement.x, M.escapement.y, M.escapement.phase * 2 * Math.PI);
  for (const p of M.pistons) {
    drawPiston(G, p.px, p.py, p.cx, p.cy, p.r, p.pr, p.progress);
  }
  if (M.bird.visible) drawBird(G, M.bird.x, M.bird.y, M.bird.scale * 1.5, M.bird.flapPhase, M.bird.chirpPhase, M.bird.chirping);
  drawRepairArm(G, M.repairArm);
  for (const lg of M.looseGears) drawGear(G, lg.x, lg.y, lg.r, lg.teeth, lg.phase * 2 * Math.PI, COL.accentLt, COL.accent);
  for (const p of M.particles) {
    G.fillStyle = `rgba(40, 30, 15, ${Math.max(0, p.life / 1.5) * 0.6})`;
    G.beginPath();
    G.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
    G.fill();
  }
  drawFrame(G, W, H);
}

function drawRepairArm(c, arm) {
  c.save();
  c.translate(arm.base.x, arm.base.y);
  c.fillStyle = COL.riv;
  c.beginPath();
  c.arc(0, 0, 12, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = COL.iron;
  c.beginPath();
  c.arc(0, 0, 6, 0, 2 * Math.PI);
  c.fill();
  c.fillStyle = COL.rivHlt;
  c.beginPath();
  c.arc(0, 0, 2, 0, 2 * Math.PI);
  c.fill();
  c.rotate(arm.angle);
  for (let seg = 0; seg < 4; seg++) {
    const s = seg * arm.length / 4;
    const e = (seg + 1) * arm.length / 4;
    c.fillStyle = COL.ironDk;
    c.beginPath();
    c.arc(s, 0, 3, 0, 2 * Math.PI);
    c.arc(e, 0, 3, 0, 2 * Math.PI);
    c.fill();
    c.fillStyle = COL.iron;
    c.beginPath();
    c.moveTo(s, -2); c.lineTo(e, -2); c.lineTo(e, 2); c.lineTo(s, 2); c.closePath();
    c.fill();
    c.strokeStyle = COL.ironLt;
    c.lineWidth = 0.5;
    c.beginPath();
    c.moveTo(s, -1.5); c.lineTo(e, -1.5); c.stroke();
    c.fillStyle = COL.riv;
    c.beginPath();
    c.arc(s, 0, 2.5, 0, 2 * Math.PI); c.fill();
    c.fillStyle = COL.rivHlt;
    c.beginPath();
    c.arc(s - 0.5, -0.5, 1, 0, 2 * Math.PI); c.fill();
  }
  const tipX = arm.length;
  c.fillStyle = COL.ironDk;
  c.beginPath();
  c.arc(tipX, 0, 8, 0, 2 * Math.PI); c.fill();
  c.fillStyle = COL.brass;
  c.beginPath();
  c.arc(tipX, 0, 5, 0, 2 * Math.PI); c.fill();
  c.fillStyle = COL.brassLt;
  c.beginPath();
  c.arc(tipX, 0, 3, 0, 2 * Math.PI); c.fill();
  c.fillStyle = COL.accent;
  c.beginPath();
  c.arc(tipX, 0, 1.5, 0, 2 * Math.PI); c.fill();
  c.restore();
}

function init() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
  buildMachine(W, H);
  M.bgCanvas = document.createElement('canvas');
  M.bgCanvas.width = W;
  M.bgCanvas.height = H;
  const bgCtx = M.bgCanvas.getContext('2d');
  drawBackground(bgCtx, W, H);
  M.particles = [];
}

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  tick(dt);
  render();
  requestAnimationFrame(frame);
}

init();
window.addEventListener('resize', () => init());
requestAnimationFrame(frame);
</script>
</body>
