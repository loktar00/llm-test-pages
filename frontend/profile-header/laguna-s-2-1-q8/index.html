<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Social Profile Header</title>
  <style>
    :root {
      --bg: #0f0f14;
      --card: #1d1f27;
      --text: #ffffff;
      --muted: #9ca3af;
      --accent: #4f46e5;
      --accent2: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .profile-header {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .banner {
      height: 180px;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1e3c72 100%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f093fb 70%, #f5576c 100%);
      position: relative;
      overflow: hidden;
    }

    .banner::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(270deg, rgba(15,15,20,0.6) 0%, rgba(15,15,20,0.2) 100%);
      z-index: 1;
    }

    .avatar-container {
      position: absolute;
      bottom: -60px;
      left: 40px;
      z-index: 2;
    }

    .avatar-ring {
      width: 130px;
      height: 130px;
      border: 5px solid var(--card);
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #667eea, #f093fb);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: linear-gradient(45deg, #4f46e5, #38bdf8);
    }

    .status-dot {
      position: absolute;
      bottom: 20px;
      right: 8px;
      width: 22px;
      height: 22px;
      border: 3px solid var(--card);
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
      z-index: 3;
    }

    .info-section {
      padding: 80px 40px 24px;
    }

    .name {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .handle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .stats-row {
      display: flex;
      gap: 40px;
      margin-bottom: 28px;
    }

    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .follow-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
    }

    .follow-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    .follow-btn.morphing {
      pointer-events: none;
    }

    .follow-btn.following {
      background: var(--accent2);
    }

    .follow-btn .follow-text,
    .follow-btn .unfollow-text {
      display: inline-block;
      transition: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .follow-btn .follow-text.show { opacity: 0; transform: translateY(-20px); }
    .follow-btn .unfollow-text.hide { opacity: 0; transform: translateY(20px); }

    .follow-btn .unfollow-text {
      position: absolute;
      opacity: 0;
    }

    .follow-btn .check-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .follow-btn .unfollow-text.show,
    .follow-btn .unfollow-text.in {
      position: relative;
      opacity: 1;
      transform: translateY(0);
    }

    .follow-btn .check-icon.in {
      opacity: 1;
      width: 18px;
      height: 18px;
    }

    .tabs {
      display: flex;
      border-top: 1px solid #2d2f3a;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 18px 12px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      transition: color 0.3s ease;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--accent);
    }

    .tab-underline {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      width: 33.333%;
      background: var(--accent);
      transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateX(0%);
      border-radius: 4px 4px 0 0;
    }

    .tab:nth-child(2).active ~ .tab-underline {
      transform: translateX(100%);
    }

    .tab:nth-child(3).active ~ .tab-underline {
      transform: translateX(200%);
    }

    .check-icon {
      fill: white;
    }
  </style>
</head>
<body>
  <div class="profile-header">
    <div class="banner"></div>
    
    <div class="avatar-container">
      <div class="avatar-ring">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23667eea'/%3E%3Cpath d='M30,60 Q40,35 50,30 Q60,35 70,60' stroke='%2338bdf8' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt="Avatar" class="avatar" />
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="info-section">
      <div class="name">Alex Morgan</div>
      <div class="handle">@alexmorgan</div>
      
      <div class="stats-row">
        <div class="stat">
          <div class="stat-value count" data-target="1284">1,284</div>
          <div class="stat-label">Posts</div>
        </div>
        <div class="stat">
          <div class="stat-value count" data-target="4217">4,217</div>
          <div class="stat-label">Followers</div>
        </div>
        <div class="stat">
          <div class="stat-value count" data-target="329">329</div>
          <div class="stat-label">Following</div>
        </div>
      </div>

      <button class="follow-btn" id="followButton">
        <span class="follow-text">Follow</span>
        <span class="unfollow-text">Following</span>
        <svg class="check-icon" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>

    <div class="tabs">
      <div class="tab active">Posts</div>
      <div class="tab">About</div>
      <div class="tab">Media</div>
      <div class="tab-underline"></div>
    </div>
  </div>

  <script>
    // Animate counters on load
    function animateCounter(element, target) {
      const duration = 2000;
      const start = 0;
      const increment = target / (duration / 16);
      
      let current = start;
      const timer = setInterval(() => {
        current += increment;
        if (current >= target) {
          element.textContent = target.toLocaleString();
          clearInterval(timer);
        } else {
          element.textContent = Math.floor(current).toLocaleString();
        }
      }, 16);
    }

    // Initialize counters with ease out
    document.addEventListener('DOMContentLoaded', () => {
      const counters = document.querySelectorAll('.count');
      counters.forEach((counter, index) => {
        setTimeout(() => {
          const target = parseInt(counter.getAttribute('data-target'));
          
          // Custom easing for count-up
          let startTime;
          const animate = (timestamp) => {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / 2000, 1);
            // Ease out cubic
            const eased = 1 - Math.pow(1 - progress, 4);
            
            const value = Math.floor(eased * target);
            counter.textContent = value.toLocaleString();
            
            if (progress < 1) {
              requestAnimationFrame(animate);
            } else {
              counter.textContent = target.toLocaleString();
            }
          };
          requestAnimationFrame(animate);
        }, index * 200);
      });
    });

    // Follow button interaction
    const followButton = document.getElementById('followButton');
    let isFollowing = false;

    followButton.addEventListener('click', function() {
      if (isFollowing) {
        // Unfollow
        this.classList.add('morphing');
        const followText = this.querySelector('.follow-text');
        const unfollowText = this.querySelector('.unfollow-text');
        const checkIcon = this.querySelector('.check-icon');
        
        unfollowText.classList.remove('show');
        unfollowText.classList.add('hide');
        checkIcon.classList.remove('in');
        followText.style.opacity = '0';
        followText.style.transform = 'translateY(-20px)';
        
        setTimeout(() => {
          followText.style.display = 'inline-block';
          followText.style.opacity = '0';
          followText.style.transform = 'translateY(20px)';
          unfollowText.style.position = 'absolute';
          unfollowText.style.opacity = '0';
          
          setTimeout(() => {
            followText.textContent = 'Follow';
            followText.style.opacity = '1';
            followText.style.transform = 'translateY(0)';
            this.classList.remove('morphing');
            this.classList.remove('following');
            isFollowing = false;
          }, 300);
        }, 400);
      } else {
        // Follow
        this.classList.add('morphing');
        const followText = this.querySelector('.follow-text');
        const unfollowText = this.querySelector('.unfollow-text');
        const checkIcon = this.querySelector('.check-icon');
        
        followText.classList.add('show');
        
        setTimeout(() => {
          unfollowText.classList.remove('hide');
          unfollowText.classList.add('show');
          checkIcon.classList.add('in');
          this.classList.add('following');
          followText.style.display = 'none';
          unfollowText.style.position = 'relative';
          unfollowText.style.opacity = '1';
          unfollowText.style.transform = 'translateY(0)';
          
          setTimeout(() => {
            this.classList.remove('morphing');
            isFollowing = true;
          }, 400);
        }, 400);
      }
    });

    // Tab switching with animated underline
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', function() {
        tabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
