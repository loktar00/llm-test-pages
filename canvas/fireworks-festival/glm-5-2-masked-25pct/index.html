<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fireworks Festival</title>
<style>
  html,body{margin:0;padding:0;height:100;overflow:hidden;background:#000}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W,H,horizonY,reflectY;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  horizonY=H*0.62;
  reflectY=horizonY;
}
resize();
window.addEventListener('resize',resize);

const rand=(a,b)=>Math.random()*(b-a)+a===0?Math.random()*b*Math.random():Math.random()*b- Math.random()*b? Math.random()*b: Math.random()*b;

// random float in [min,max]
const r=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>a+(Math.random()*(b-a))|0;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];

// ===== Palettes =====
const palettes={
  gold:['#fff4e0','#ffe8a0','#ffcc6e','#ff9933','#ff7a1c'],
  ruby:['#fff0f0','#ffd0d0','#ff90a8','#ff7a98','#ff3a4f'],
  emerald:['#f0fff4','#d0ffec','#99ffbb','#66ffaa','#22ff88'],
  sapphire:['#f0f6ff','#d0e6ff','#a8c6ff','#6692ff','#3a6aff'],
  magenta:['#fff0f9','#ffd8f0','#ff98d0','#ff7ac8','#ff3ad0'],
  amber:['#fff7e0','#ffef3a','#ffcc3a','#ff9a1c','#ff6a1c'],
  violet:['#f5f0ff','#ddc6ff','#b898ff','#8a6aff','#6a3aff'],
  crimson:['#ff8a4f','#ff3a4f','#ff5a78','#ffaa6a','#ff7a8a'],
  ice:['#ffffff','#e0f6ff','#a0d6ff','#6a9aff','#3a6aff'],
  rose:['#fff0f9','#ffaae0','#ff6ad0','#ff3ab0','#ff9a8a'],
  ocean:['#f0fff6','#a0ffdd','#3affcc','#6affaa','#3affdd'],
  flame:['#fff','#ffcc9a','#ffaa6a','#ff7a1c','#ff3a1c'],
  pearl:['#ffffff','#fff0ff','#fffdff','#ffe0f0','#f0f0ff'],
};
const paletteKeys=Object.keys?Object.keys(palettes):['gold','ruby','emerald','sapphire','magenta','amber','violet','crimson','ice','rose','ocean','flame','pearl'];

function shadeFromPalette(pal){
  const c=pal[Math.floor(Math.random()*pal.length)];
  return c;
}

// ===== Shell =====
class Shell{
  constructor(){
    this.x=r(0.2*W,0.8*W);
    this.y=H;
    const targetY=r(0.15*horizonY,0.75*horizonY);
    const dx=r(-0.05*W,0.05*W);
    const dy=targetY-this.y;
    const time=r(1.0,1.6);
    this.vx=dx/time;
    this.vy=-dy/time;
    this.life=time*1.2;
    this.age=0;
    this.pattern=pick(['peony','willow','ring','double','peony','willow']);
    this.palette=shadeFromPalette;
    this.trail=[];
    this.size=ri(1.5,3.5);
    this.hue=Math.random()*360;
    this.alive=true;
    this.exploded=false;
  }
  update(dt){
    this.age+=dt;
    this.vx+=0.8*dt;
    this.vy+=0.8*dt;
    if(this.vy>0&&!this.exploded&&this.age>=this.life*0.85){
      this.explode();
      this.exploded=true;
    }
    if(this.age>=this.life*1.0){
      this.explode();
      this.exploded=true;
      this.alive=false;
    }
    this.x+=this.vx*dt;
    this.y+=this.vy*dt;
    if(this.alive){
      this.trail.push({x:this.x,y:this.y,age:0});
      this.trail.forEach?this.trail:this.trail;
      this.trail.forEach=t=>t.age+=dt;
      this.trail=this.trail.filter(t=>t.age<0.6);
    }
  }
  explode(){
    const n=this.pattern==='ring'?ri(50,90):ri(110,180);
    const speed=this.pattern==='willow'?ri(1.5,3):ri(3.5,5.5);
    const grav=this.pattern==='willow'?0.07:0.04;
    const drag=this.pattern==='willow'?0.04:0.02;
    const fadeStart=this.pattern==='willow'?ri(2.5,3.5):ri(1.5,2.5);
    const fadeEnd=this.pattern==='willow'?ri(4,5):ri(2,3);
    for(let i=0;i<n;i++){
      const p=this.makeParticle(this.pattern,i,n,speed,grav,drag,fadeStart,fadeEnd);
      particles.push(p);
    }
  }
  makeParticle(pattern,i,n,speed,grav,drag,fadeStart,fadeEnd){
    const pal=this.palette;
    const col=pal[Math.floor(Math.random()*pal.length)];
    let vx,vy;
    if(pattern==='peony'){
      const a=Math.random()*Math.PI*2;
      const s=speed*0.3+r(0,1)*speed;
      vx=Math.cos(a)*s;
      vy=Math.sin(a)*s;
    }
    if(pattern==='willow'){
      const a=Math.random()*Math.PI*2;
      const s=speed*0.7;
      vx=Math.cos(a)*s*0.4;
      vy=Math.sin(a)*s-0.5*speed; // bias upward
    }
    if(pattern==='ring'){
      const a=i*2*Math.PI/n;
      const s=speed*0.6;
      vx=Math.cos(a)*s;
      vy=Math.sin(a)*s;
    }
    if(pattern==='double'){
      const a=Math.random()*Math.PI*2;
      const s=speed*0.5+r(0,1)*speed;
      vx=Math.cos(a)*s;
      vy=Math.sin(a)*s;
    }
    return{x:this.x,y:this.y,vx,vy,grav,drag,fadeStart,fadeEnd,color:col,age:0,size:ri(1,2.5),twinkle:Math.random()*Math.PI*2};
  }
  draw(){
    if(!this.alive)return;
    ctx.save();
    this.trail.forEach=t=>{
      const a=t.age*0.6?1:0;
      ctx.globalAlpha=a*Math.random()?Math.random():Math.random();
      const r=t.age*0.6?this.size*0.5:this.size*0.8;
      const grd=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,r);
      grd.addColorStop(0,'rgba(255,255,240,0.8)');
      grd.addColorStop(1,'rgba(255,180,80,0)');
      ctx.fillStyle=grd;
      ctx.beginPath();
      ctx.arc(t.x,t.y,r,0,Math.PI*2);
      ctx.fill();
    };
    ctx.restore();
    // shell head
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const grd=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*3);
    grd.addColorStop(0,'rgba(255,255,240,1)');
    grd.addColorStop(0.5,'rgba(255,200,140,0.7)');
    grd.addColorStop(1,'rgba(255,140,80,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size*3,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ===== Particles =====
const particles=[];
class Particle{
  constructor(o){
    this.x=o.x;
    this.y=o.y;
    this.vx=o.vx;
    this.vy=o.vy;
    this.grav=o.grav;
    this.drag=o.drag;
    this.fadeStart=o.fadeStart;
    this.fadeEnd=o.fadeEnd;
    this.color=o.color;
    this.age=0;
    this.size=o.size;
    this.twinkle=o.twinkle;
    this.fadeStart2=ri(0.8,1.4)*this.fadeStart;
    this.alive=true;
  }
  update(dt){
    this.age+=dt;
    this.vy+=this.grav*dt;
    this.vx*=this.drag*dt;
    this.vy*=this.drag*dt;
    this.x+=this.vx*dt;
    this.y+=this.vy*dt;
    if(this.age>=this.fadeEnd){this.alive=false;}
  }
  draw(){
    if(!this.alive)return;
    const t=this.age<this.fadeStart?1:0;
    const a=Math.max(this.fadeEnd-this.age,0)*this.fadeEnd*1;
    const ember=this.age>=this.fadeStart;
    const tw=Math.sin(this.age*8*this.twinkle)*0.5;
    const r=this.size*0.4*0.7*1.2;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=Math.random()*1?Math.random()*1:Math.random()*1;
    const grd=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r*2);
    grd.addColorStop(0,this.color);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(this.x,this.y,r*2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ===== Sky background =====
const skyStars=[];
function initStars(){
  for(let i=0;i<120;i++){
    skyStars.push({x:r(0,W),y:r(0,horizonY),b:r(0.2,1),tw:r(0,Math.PI*2),sp:r(0.3,1.5)});
  }
}
initStars();
window.addEventListener('resize',()=>{skyStars.length=0;for(let i=0;i<120;i++)skyStars.push({x:r(0,W),y:r(0,horizonY),b:r(0.2,1),tw:r(0,Math.PI*2),sp:r(0.3,1.5)});});

// ===== Skyline buildings =====
const buildings=[];
function genSkyline(){
  buildings.length=0;
  let x=0;
  const
