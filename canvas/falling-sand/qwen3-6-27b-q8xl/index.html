<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Sand</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const AIR = 0, SAND = 1, WATER = 2, FIRE = 3, STONE = 4, WOOD = 5, ASH = 6, SMOKE = 7;

const COLS = 200, ROWS = 150;
let grid, nextGrid, age, colorGrid;
let scale;

function initGrid() {
  grid = new Uint8Array(COLS * ROWS);
  nextGrid = new Uint8Array(COLS * ROWS);
  age = new Int16Array(COLS * ROWS);
  colorGrid = new Uint32Array(COLS * ROWS);
}

function idx(x, y) { return y * COLS + x; }
function inBounds(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS; }
function isEmpty(x, y) { return inBounds(x, y) && grid[idx(x, y)] === AIR; }
function getType(x, y) { return inBounds(x, y) ? grid[idx(x, y)] : -1; }

function setCell(x, y, type, a, c) {
  const i = idx(x, y);
  grid[i] = type;
  age[i] = a || 0;
  colorGrid[i] = c || 0;
}

function swap(x1, y1, x2, y2) {
  const i1 = idx(x1, y1), i2 = idx(x2, y2);
  let t;
  t = grid[i1]; grid[i1] = grid[i2]; grid[i2] = t;
  t = age[i1]; age[i1] = age[i2]; age[i2] = t;
  t = colorGrid[i1]; colorGrid[i1] = colorGrid[i2]; colorGrid[i2] = t;
}

function sandColor() {
  const r = 180 + Math.random() * 40 | 0;
  const g = 140 + Math.random() * 30 | 0;
  const b = 60 + Math.random() * 20 | 0;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

function waterColor() {
  const r = 20 + Math.random() * 30 | 0;
  const g = 80 + Math.random() * 60 | 0;
  const b = 180 + Math.random() * 50 | 0;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

function fireColor(a) {
  const maxA = 80;
  const t = Math.min(a / maxA, 1);
  const r = 255;
  const g = (200 + t * 55) | 0;
  const b = (t * 100) | 0;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

function stoneColor() {
  const v = 60 + Math.random() * 40 | 0;
  return (255 << 24) | (v << 16) | (v << 8) | v;
}

function woodColor() {
  const r = 100 + Math.random() * 40 | 0;
  const g = 65 + Math.random() * 25 | 0;
  const b = 30 + Math.random() * 15 | 0;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

function ashColor() {
  const v = 30 + Math.random() * 25 | 0;
  return (255 << 24) | (v << 16) | (v << 8) | v;
}

function smokeColor() {
  const v = 40 + Math.random() * 30 | 0;
  return ((120 + Math.random() * 60 | 0) << 24) | (v << 16) | (v << 8) | v;
}

// Emitter state
let emitterX = 0, emitterDir = 1, emitterTimer = 0;
let emitterMaterial = SAND;
let emitterSwitchTimer = 0;

function updateEmitter() {
  emitterTimer++;
  if (emitterTimer >= 3) {
    emitterTimer = 0;
    emitterX += emitterDir;
    if (emitterX >= COLS - 5) emitterDir = -1;
    if (emitterX <= 5) emitterDir = 1;
  }

  emitterSwitchTimer++;
  if (emitterSwitchTimer > 120 + Math.random() * 180 | 0) {
    emitterSwitchTimer = 0;
    const r = Math.random();
    if (r < 0.45) emitterMaterial = SAND;
    else if (r < 0.8) emitterMaterial = WATER;
    else emitterMaterial = FIRE;
  }

  // Drop particles
  for (let dy = 0; dy < 3; dy++) {
    const x = emitterX + (Math.random() * 3 - 1 | 0);
    const y = 0 + dy;
    if (inBounds(x, y) && isEmpty(x, y)) {
      let c;
      if (emitterMaterial === SAND) c = sandColor();
      else if (emitterMaterial === WATER) c = waterColor();
      else c = fireColor(0);
      setCell(x, y, emitterMaterial, emitterMaterial === FIRE ? 0 : 0, c);
    }
  }
}

function updateSand(x, y) {
  const below = getType(x, y + 1);
  if (below === AIR) { swap(x, y, x, y + 1); return; }
  if (below === WATER) { swap(x, y, x, y + 1); return; }

  const dir = Math.random() < 0.5 ? -1 : 1;
  const bl = getType(x + dir, y + 1);
  if (bl === AIR || bl === WATER) { swap(x, y, x + dir, y + 1); return; }
  const br = getType(x - dir, y + 1);
  if (br === AIR || br === WATER) { swap(x, y, x - dir, y + 1); return; }
}

function updateWater(x, y) {
  const below = getType(x, y + 1);
  if (below === AIR) { swap(x, y, x, y + 1); return; }
  if (below === FIRE) {
    setCell(x, y + 1, SMOKE, 30, smokeColor());
    setCell(x, y, AIR, 0, 0);
    return;
  }

  const dir = Math.random() < 0.5 ? -1 : 1;
  const bl = getType(x + dir, y + 1);
  if (bl === AIR) { swap(x, y, x + dir, y + 1); return; }
  const br = getType(x - dir, y + 1);
  if (br === AIR) { swap(x, y, x - dir, y + 1); return; }

  // Flow sideways
  for (let d = 1; d <= 3; d++) {
    if (isEmpty(x + dir * d, y)) { swap(x, y, x + dir * d, y); return; }
  }
  for (let d = 1; d <= 3; d++) {
    if (isEmpty(x - dir * d, y)) { swap(x, y, x - dir * d, y); return; }
  }
}

function updateFire(x, y) {
  const a = age[idx(x, y)];
  if (a > 80 + Math.random() * 40 | 0) {
    if (Math.random() < 0.3) {
      setCell(x, y, SMOKE, 60 + Math.random() * 40 | 0, smokeColor());
    } else {
      setCell(x, y, AIR, 0, 0);
    }
    return;
  }

  age[idx(x, y)]++;
  colorGrid[idx(x, y)] = fireColor(age[idx(x, y)]);

  // Rise
  if (isEmpty(x, y - 1)) { swap(x, y, x, y - 1); return; }

  const dir = Math.random() < 0.5 ? -1 : 1;
  if (isEmpty(x + dir, y - 1)) { swap(x, y, x + dir, y - 1); return; }
  if (isEmpty(x - dir, y - 1)) { swap(x, y, x - dir, y - 1); return; }

  // Spread sideways occasionally
  if (Math.random() < 0.15) {
    const d = Math.random() < 0.5 ? -1 : 1;
    if (isEmpty(x + d, y)) { swap(x, y, x + d, y); return; }
  }

  // Burn neighbors
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      const nx = x + dx, ny = y + dy;
      if (inBounds(nx, ny) && grid[idx(nx, ny)] === WOOD) {
        if (Math.random() < 0.04) {
          setCell(nx, ny, FIRE, 0, fireColor(0));
        }
      }
      if (inBounds(nx, ny) && grid[idx(nx, ny)] === WATER) {
        setCell(x, y, SMOKE, 30, smokeColor());
        setCell(nx, ny, AIR, 0, 0);
        return;
      }
    }
  }
}

function updateSmoke(x, y) {
  const a = age[idx(x, y)];
  if (a > 80 + Math.random() * 40 | 0) {
    setCell(x, y, AIR, 0, 0);
    return;
  }
  age[idx(x, y)]++;

  if (isEmpty(x, y - 1)) { swap(x, y, x, y - 1); return; }
  const dir = Math.random() < 0.5 ? -1 : 1;
  if (isEmpty(x + dir, y - 1)) { swap(x, y, x + dir, y - 1); return; }
  if (isEmpty(x - dir, y - 1)) { swap(x, y, x - dir, y - 1); return; }
  if (isEmpty(x + dir, y)) { swap(x, y, x + dir, y); return; }
}

function updateStone(x, y) {
  // Slow erosion
  if (Math.random() < 0.00008) {
    setCell(x, y, AIR, 0, 0);
    return;
  }
  // Regeneration: nearby air can become stone
  if (Math.random() < 0.00005) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    if (isEmpty(x + dir, y)) {
      setCell(x + dir, y, STONE, 0, stoneColor());
    }
  }
}

function updateWood(x, y) {
  // Wood doesn't move, just check for fire neighbors (handled by fire update)
}

function simulate() {
  // Copy grid
  nextGrid.set(grid);
  const nextAge = new Int16Array(age);
  const nextColor = new Uint32Array(colorGrid);

  // Process bottom to top for falling, top to bottom for rising
  for (let y = ROWS - 1; y >= 0; y--) {
    const leftToRight = Math.random() < 0.5;
    for (let xi = 0; xi < COLS; xi++) {
      const x = leftToRight ? xi : COLS - 1 - xi;
      const i = idx(x, y);
      const type = grid[i];

      if (type === SAND) {
        if (nextGrid[i] === SAND) updateSand(x, y);
      } else if (type === WATER) {
        if (nextGrid[i] === WATER) updateWater(x, y);
      } else if (type === FIRE) {
        if (nextGrid[i] === FIRE) updateFire(x, y);
      } else if (type === SMOKE) {
        if (nextGrid[i] === SMOKE) updateSmoke(x, y);
      } else if (type === STONE) {
        if (nextGrid[i] === STONE) updateStone(x, y);
      }
    }
  }

  // Copy back
  grid.set(nextGrid);
  age.set(nextAge);
  colorGrid.set(nextColor);
}

function buildLedges() {
  // Create stone ledges at various heights
  const ledgeHeights = [
    { y: ROWS * 0.35, w: 0.6, cx: 0.3 },
    { y: ROWS * 0.55, w: 0.5, cx: 0.6 },
    { y: ROWS * 0.75, w: 0.7, cx: 0.5 },
    { y: ROWS * 0.2, w: 0.3, cx: 0.8 },
  ];

  for (const ledge of ledgeHeights) {
    const start = (ledge.cx - ledge.w / 2) * COLS | 0;
    const end = (ledge.cx + ledge.w / 2) * COLS | 0;
    const y = ledge.y | 0;
    for (let x = start; x <= end; x++) {
      if (inBounds(x, y) && grid[idx(x, y)] === AIR) {
        setCell(x, y, STONE, 0, stoneColor());
      }
      // Add some thickness
      if (inBounds(x, y + 1) && grid[idx(x, y + 1)] === AIR) {
        if (Math.random() < 0.5) setCell(x, y + 1, STONE, 0, stoneColor());
      }
    }
  }

  // Wood platforms
  const woodPlatforms = [
    { y: ROWS * 0.3, w: 0.2, cx: 0.5 },
    { y: ROWS * 0.5, w: 0.25, cx: 0.2 },
    { y: ROWS * 0.7, w: 0.15, cx: 0.75 },
  ];

  for (const plat of woodPlatforms) {
    const start = (plat.cx - plat.w / 2) * COLS | 0;
    const end = (plat.cx + plat.w / 2) * COLS | 0;
    const y = plat.y | 0;
    for (let x = start; x <= end; x++) {
      if (inBounds(x, y) && grid[idx(x, y)] === AIR) {
        setCell(x, y, WOOD, 0, woodColor());
      }
    }
  }
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  scale = Math.max(Math.ceil(w / COLS), Math.ceil(h / ROWS));
  canvas.width = COLS;
  canvas.height = ROWS;
  canvas.style.width = COLS * scale + 'px';
  canvas.style.height = ROWS * scale + 'px';
}

let imageData;
function render() {
  if (!imageData || imageData.width !== COLS || imageData.height !== ROWS) {
    imageData = ctx.createImageData(COLS, ROWS);
  }
  const data = imageData.data;
  for (let i = 0; i < COLS * ROWS; i++) {
    const type = grid[i];
    const j = i * 4;
    if (type === AIR) {
      data[j] = 10; data[j + 1] = 10; data[j + 2] = 15; data[j + 3] = 255;
    } else {
      const c = colorGrid[i] || 0;
      data[j] = c & 0xFF;
      data[j + 1] = (c >> 8) & 0xFF;
      data[j + 2] = (c >> 16) & 0xFF;
      data[j + 3] = (c >> 24) & 0xFF;
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

let frameCount = 0;
function loop() {
  updateEmitter();
  simulate();
  render();
  frameCount++;
  requestAnimationFrame(loop);
}

function init() {
  resize();
  initGrid();
  buildLedges();
  loop();
}

window.addEventListener('resize', resize);
init();
</script>
</body>
</html>
