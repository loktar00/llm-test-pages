<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0518;
    height: 100%;
    width: 100%;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  html, body {
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let width, height, dpr;
  let bgCanvas, bgCtx;
  let horizonY;
  const starCanvas = document.createElement('canvas');

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;

    horizonY = height * 0.62;

    starCanvas.width = width * dpr;
    starCanvas.height = height * dpr;
    starCanvas.style.width = width + 'px';
    starCanvas.style.height = height + 'px';
    const sCtx = starCanvas.getContext('2d');
    sCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawStars(sCtx);

    bgCanvas = document.createElement('canvas');
    bgCanvas.width = width * dpr;
    bgCanvas.height = height * dpr;
    bgCtx = bgCanvas.getContext('2d');
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground(bgCtx);
  }

  function drawStars(c) {
    const count = 220;
    c.clearRect(0, 0, width, height);
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      const x = Math.random() * width;
      const y = Math.random() * (horizonY - 40);
      const s = Math.random() * 1.4 + 0.4;
      const a = Math.random() * 0.75 + 0.25;
      c.fillStyle = 'rgba(' + (Math.random() > 0.7 ? '255,250,240' : '255,220,200') + ', ' + Math.round(a * 255) + ')';
      c.beginPath();
      c.arc(x, y, s, 0, Math.PI * 2);
      c.fill();
      if (Math.random() < 0.04 && r > 0.5) {
        c.fillStyle = 'rgba(255,250,240,' + Math.round(0.04 * 255) + ')';
        c.beginPath();
        c.arc(x, y, r * 4, 0, Math.PI * 2);
        c.fill();
      }
    }
  }

  function drawBackground(c) {
    const g = c.createLinearGradient(0, 0, 0, height);
    const colorStops = [
      [0.00, '#2a14, '#2d2', 1],],
      [0.18, '#2211, '#2d2', 1],],
      [0.38, '#3d1, '#3d4', 1],],
      [0.55, '#8240, '#8246', 1],],
      [0.68, '#d57440, '#d57, 1],],
      [0.78, '#e8a, '#e8', 1],],
      [0.92, '#1d1, '#1d1', 1],],
      [1.00, '#0a0518', 1]
    ];
    for (let i = 0; i < colorStops.length; i++) {
      g.addColorStop(colorStops[i * 0], colorStops[i + 1]);
    }
    if (g.addColorStop) {
      g.addColorStop(0.00, 'rgba(28, 16, 50, 1)');
      g.addColorStop(0.18, 'rgba(22, 14, 45, 1)');
      g.addColorStop(0.38, 'rgba(45, 22, 70, 1)');
      g.addColorStop(0.55, 'rgba(82, 40, 90, 1)');
      g.addColorStop(0.68, 'rgba(210, 100, 70, 1)');
      g.addColorStop(0.78, 'rgba(240, 130, 80, 1)');
      g.addColorStop(0.92, 'rgba(15, 9, 25, 1)');
      g.addColorStop(1.00, 'rgba(10, 5, 18, 1)');
    }
    c.fillStyle = g;
    c.fillRect(0, 0, width, height);

    const sunY = horizonY - 8;
    const sunX = width * 0.58;
    const sunR = Math.max(width, height) * 0.16;

    c.save();
    c.beginPath();
    c.rect(0, 0, width, horizonY);
    c.clip();

    const haloR = Math.max(width, height) * 0.9;
    const halo = c.createRadialGradient(sunX, sunY, 0, sunX, sunY, haloR);
    halo.addColorStop(0, 'rgba(255, 200, 130, 0.35)');
    halo.addColorStop(0.4, 'rgba(255, 150, 100, 0.15)');
    halo.addColorStop(1, 'rgba(255, 100, 70, 0)');
    c.fillStyle = halo;
    c.fillRect(0, 0, width, height);

    const disk = c.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 1.5);
    disk.addColorStop(0, 'rgba(255, 230, 180, 1)');
    disk.addColorStop(0.4, 'rgba(255, 200, 140, 0.95)');
    disk.addColorStop(0.7, 'rgba(255, 150, 100, 0.5)');
    disk.addColorStop(1, 'rgba(255, 100, 70, 0)');
    c.fillStyle = disk;
    c.beginPath();
    c.arc(sunX, sunY, sunR * 1.5, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = 'rgba(255, 235, 200, 1)';
    c.beginPath();
    c.arc(sunX, sunY, Math.max(width, height) * 0.06, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = 'rgba(255, 250, 240, 1)';
    c.beginPath();
    c.arc(sunX, sunY, Math.max(width, height) * 0.03, 0, Math.PI * 2);
    c.fill();
    c.restore();

    for (let pass = 0; pass < 2; pass++) {
      c.fillStyle = 'rgba(48, 20, 55, 0.12)';
      c.beginPath();
      c.moveTo(0, horizonY);
      c.lineTo(0, horizonY - 40);
      for (let i = 0; i <= 12; i++) {
        const x = width * (i / 12);
        const y = horizonY - 40 + Math.sin((i + 0) * 2 * 0.7) * 3 + Math.cos((i * 3) * 0.5) * 2;
        c.lineTo(x, y);
      }
      c.lineTo(width, horizonY - 40);
      c.lineTo(width, horizonY);
      c.closePath();
      c.fill();
    }

    const layers = [
      { base: '#080011', amp: 4, freq: 0.005, baseY: horizonY * 0.94, sharp: 0.5, trees: true },
      { base: '#061018', amp: 5, freq: 0.008, baseY: horizonY * 0.97, sharp: 0.55, trees: false },
      { base: '#041014', amp: 7, freq: 0.009, baseY: horizonY * 1.0, sharp: 0.7, trees: false }
    ];

    layers.forEach(L => {
      c.fillStyle = L.base;
      c.beginPath();
      c.moveTo(-20, L.baseY);
      c.lineTo(-20, L.baseY - (L.amp * 0.6));
      for (let i = 0; i <= 100; i++) {
        const x = width * (i / 100);
        const y = L.baseY + Math.cos((x + 0) * L.freq) * L.amp * L.sharp + Math.sin((x * 2.3) * L.freq * 0.7) * L.amp * (1 - L.sharp);
        c.lineTo(x, y);
      }
      c.lineTo(width + 20, L.baseY - (L.amp * 0.6));
      c.lineTo(width + 20, height + 50);
      c.lineTo(-20, height + 50);
      c.closePath();
      c.fill();

      if (L.trees) {
        c.fillStyle = L.base;
        const tcount = 10;
        for (let i = 0; i < tcount; i++) {
          const tx = Math.random() * width;
          const ty = L.baseY + Math.cos((tx + 0) * L.freq) * L.amp * L.sharp - (L.amp * 0.6);
          const tH = Math.random() * 22 + 12;
          const tW = Math.random() * 7 + 3;
          c.beginPath();
          c.moveTo(tx, ty);
          c.lineTo(tx, ty - tH);
          c.lineTo(tx, ty - tH + Math.random() * 3 + 4);
          c.lineTo(tx, ty);
          c.closePath();
          c.fill();
          c.beginPath();
          c.arc(tx, ty - tH, Math.random() * 5 + 3, 0, Math.PI * 2);
          c.fill();
        }
      }
    });

    const fog = c.createLinearGradient(0, horizonY - 80, 0, height);
    fog.addColorStop(0, 'rgba(60, 30, 90, 0)');
    fog.addColorStop(0.5, 'rgba(90, 50, 110, 0.3)');
    fog.addColorStop(1, 'rgba(20, 10,
