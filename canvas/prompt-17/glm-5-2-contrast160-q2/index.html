<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Ship Battle</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:height:overflow:hidden}
  body{height:100vh;overflow:hidden;background:#000;color:#fff}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="space"></canvas>
<script>
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
let W=0, H=0;
function resize(){ W=canvas.width=Math.max(128,window.innerWidth*1|0); H=canvas.height=Math.max(128,window.innerHeight*1|0); }
resize();
window.addEventListener('resize', resize);

// ---------- World constants ----------
const WORLD = { W: 1200, H: 800 };
const BOUNDS = { x:-WORLD.W/2, y:-WORLD.H/2, r:WORLD.W/2, t:WORLD.H/2 };

const TWO = Math.PI*2;
function angleDiff(a,b){ let d=(b-a)%TWO; if(d>Math.PI) d-=TWO; if(d<-Math.PI) d+=TWO; return d; }
function angleNorm(a){ a%=TWO; if(a<0) a+=TWO; return a; }
function hexToRGB(hex){ let r,g,b; if(hex.startsWith('#')){ r=parseInt(hex.slice(1,2),16); g=parseInt(hex.slice(3,5),16); b=parseInt(hex.slice(5,7),16); } else if(hex.startsWith('rgb')){ const n=parseInt(hex.match(/[\d]{2,}/)[0]); } else { r=255; g=0; b=0; } return [r,g,b]; }
function hexToRGBStr(hex){ let r,g,b; if(hex.startsWith('#') && hex.length===7){ r=parseInt(hex.slice(1,2),16); g=parseInt(hex.slice(3,5),16); b=parseInt(hex.slice(5,7),16); } else { r=255;g=0;b=0; } return [r,g,b]; }
function lighten([r,g,b],amt){ return `rgb(${clamp(r+(255-r)*amt,0,255)|0},${clamp(g+(255-g)*amt,0,255)|0},${clamp(b+(255-b)*amt,0,255)|0})`; }
function darken([r,g,b],amt){ return `rgb(${clamp(r*(1-amt)|0,0,255),${clamp(g*(1-amt)|0,0,255),${clamp(b*(1-amt)|0,0,255)}`; }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }
function lerp(a,b,t){ return a+(b-a)*t; }

const RED = '#f33d4e';
const BLU = '#2be6f3';
const RED_RGB = [255, 30, 60];
const BLU_RGB = [40, 230, 250];
const RED_GLOW = '#ff7777';
const BLU_GLOW = '#88e2ff';

// ---------- Particles ----------
class Particle {
  constructor(x,y,vx,vy,size,life,decay,color,type=1){
    this.x=x; this.y=y;
    this.vx=vx; this.vy=vy;
    this.size=size;
    this.life=life; this.maxLife=life;
    this.decay=decay;
    this.color=color;
    this.type=type;
    this.angle=Math.random()*TWO;
  }
  update(dt){
    this.x+=this.vx*dt;
    this.y+=this.vy*dt;
    this.life-=this.decay*dt;
    this.vx*=0.99;
    this.vy*=0.99;
    this.angle+=0.05;
  }
  draw(ctx){
    const a=clamp(this.life/this.maxLife,0,1);
    ctx.globalAlpha=a;
    if(this.type===0){
      const r=this.size*0.8;
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.rotate(this.angle);
      ctx.fillStyle=this.color;
      ctx.fillRect(-r*0.5,-r*0.5,r,r);
      ctx.restore();
    } else {
      ctx.fillStyle=this.color;
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.size,0,TWO);
      ctx.fill();
    }
  }
}
function explosion(x,y,colRGB,scl){
  const cs=colRGB;
  const sparkColor=`rgba(255,255,200,1)`;
  for(let i=0;i<40*scl;i++){
    const a=Math.random()*TWO;
    const s=(Math.random()*1.5+0.5)*0.05;
    const r=255*(Math.random()*0.2+0.8)|0;
    const g=(cs[1]*0.4+255*0.6)|0;
    const b=(cs[2]*0.4+200)|0;
    const col=`rgba(${r},${g},${b},1)`;
    particles.push(new Particle(x,y,Math.cos(a)*s*2,Math.sin(a)*s*2,Math.random()*1.5+0.5,0.8+Math.random()*0.5,0.02,sparkColor,0));
  }
  for(let i=0;i<12*scl;i++){
    const a=Math.random()*TWO;
    const s=Math.random()*0.3+0.0;
    const col=`rgba(${cs[0]|0},${cs[1]>>2|0},${cs[2]>>2|0},1)`;
    particles.push(new Particle(x,y,Math.cos(a)*s*2*2.5,Math.sin(a)*s*2*2.5,Math.random()*2+1,1.5,0.05,col,0));
  }
  for(let i=0;i<20*scl;i++){
    const a=Math.random()*TWO;
    const s=Math.random()*0.2+0;
    const col=`rgba(${cs[0]>>3|0},${cs[1]>>2|0},${cs[2]>>2|0},1)`;
    particles.push(new Particle(x,y,Math.cos(a)*s*5,Math.sin(a)*s*5,Math.random()*2+2,1.0,0.02,col,1));
  }
  // Flash
  flashes.push({x:x,y=y,r:30*scl,life=0.6,col=colRGB});
}

let flashes=[];

function drawFlashes(){
  for(const f of flashes){
    const t=1-f.life/0.6;
    const a=(1-t)*1;
    ctx.globalAlpha=a*0.7;
    ctx.fillStyle=`rgba(255,${(f.col[1]*0.2+255)|0},${(f.col[2]*0.5+200)|0},1)`;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r*(1+t*1.2),0,TWO);
    ctx.fill();
    f.life-=0.02;
  }
  flashes=flashes.filter(f=>f.life>0);
}

let particles=[];

// ---------- Stars ----------
class Star {
  constructor(){ this.reset(true); }
  reset(initial){
    this.x=Math.random()*WORLD.W-WORLD.W/2;
    this.y=Math.random()*WORLD.H-WORLD.H/2;
    this.depth=Math.random()*0.6+0.4;
    this.r=this.depth*0.6+0.3;
    this.color=Math.random()<0.5?0:1; // 0 = warm, 1 = cool
    this.twPhase=Math.random()*TWO;
    this.twRate=Math.random()*0.3+0.05;
  }
  draw(ctx){
    const tw=0.6+0.4*Math.sin(this.twPhase);
    const br=this.depth*0.5+0.5;
    const alpha=br*tw*0.7;
    ctx.globalAlpha=alpha;
    if(this.color===0) ctx.fillStyle='#ffe';
    ctx.fillStyle='#ffffff';
    if(this.color===1) ctx.fillStyle='#cdef';
    ctx.fillStyle=this.color===0?'rgba(255,255,226,'+alpha+')':'rgba(220,238,255,'+alpha+')';
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,TWO);
    ctx.fill();
    this.twPhase+=this.twRate*0.02;
    this.x+=this.depth*0.02; // gentle drift
    if(this.x>WORLD.W/2+5) this.reset(false);
  }
}
const stars=[];
for(let i=0;i<250;i++) stars.push(new Star());

// ---------- Ships ----------
let shipIdCounter=0;
class Ship {
  constructor(team,type,x,y,parent=false){
    this.team=team;
    this.type=type;
    this.x=x; this.y=y;
    this.angle=Math.atan2(1-x*0.01,1);
    this.angVel=0;
    this.id=++shipIdCounter;
    this.parent=parent;
    this.killCount=0;
    this.radius=parent?30:10;
    this.spawnTimer=Math.random()*4-3;
    this.weaponCD=Math.random()*1.8;
    this.maxWeaponCD=parent?5.5:1.1;
    this.range=parent?70:60;
    this.cooldown=parent?5.5:1.2;
    this.maxHealth=parent?100:20;
    this.health=this.maxHealth;
    this.maxSpeed=parent?0.6:(this.type==='ion'?0.45:0.6);
    this.target=null;
    this.spawnTimer=Math.random()*3-2;
    this.trail=[];
  }
  update(dt,ships){
    // Spawn timer for mother ships
    if(this.parent){
      this.spawnTimer-=dt;
      if(this.spawnTimer<0){
        this.spawnTimer=4+Math.random()*8;
        spawnFromMother(this);
      }
    }
    // Behavior
    if(!this.parent){
      // Find target
      const t=this.findTarget(ships);
      if(t){
        const d=distance(this,t);
        const desired=Math.atan2(t.y-this.y,t.x-this.x);
        const diff=angleDiff(this.angle,desired);
        // Seek
        if(this.type==='ion'){
          // Try to maintain range ~ 70
          if(d < this.range*0.6){
            // Slow down / back off
            const rev=desired+Math.PI;
            const revDiff=angleDiff(this.angle,rev);
            this.angVel+=clamp(revDiff*0.2,-0.02,0.02);
            this.speed*=0.9;
          } else if(d > this.range*1.1){
            this.angVel+=clamp(diff*0.2,-0.02,0.02);
            this.speed = lerp(this.speed, this.maxSpeed*0.8,0.05);
          } else {
            this.angVel+=clamp(diff*0.2,-0.02,0.02);
            this.speed = lerp(this.speed, this.maxSpeed*0.4,0.05);
          }
        } else {
          this.angVel+=clamp(diff*0.2,-0.02,0.02);
          if(d < 40){
            // too close - back off
            const rev=desired+Math.PI;
            const revDiff=angleDiff(this.angle,rev);
            this.angVel+=clamp(revDiff*0.2,-0.02,0.02);
            this.speed = lerp(this.speed, this.maxSpeed*0.3, 0.05);
          } else {
            this.speed = lerp(this.speed, this.maxSpeed,0.05);
          }
        }
        // Fire weapon
        this.fire(t,d,projectiles);
      } else {
        // No target found nearby, return to parent
        const px=parentShipPos(this.team);
        const desired=Math.atan2(px.y-this.y,px.x-this.x);
        const diff=angleDiff(this.angle,desired);
        this.angVel+=clamp(diff*0.1,-0.02,0.02);
        this.speed=lerp(this.speed,this.maxSpeed*0.4,0.05);
      }
    }
    // Formation / separation
    this.angVel += this.computeAvoidance(ships)*0.04;
    this.angVel = clamp(this.angVel, -0.08, 0.08);
    this.angle += this.angVel;
    this.angle = angleNorm(this.angle);
    // Move
    this.x += Math.cos(this.angle)*this.speed;
    this.y += Math.sin(this.angle)*this.speed;
    // Bounds
    if(!this.parent){
      if(this.x < BOUNDS.x+20){ this.angVel += 0.03; }
      if(this.x > BOUNDS.r-20){ this.angVel -= 0.03; }
      if(this.y < BOUNDS.y+20){ this.angVel += 0.03; }
      if(this.y > BOUNDS.t-20){ this.angVel -= 0.03; }
    }
    // Engine trail
    this.trail.push({x:this.x,y:this.y,a:1});
    if(this.trail.length>20) this.trail.shift();
    // Weapon CD
    this.weaponCD -= dt;
  }
  computeAvoidance(ships){
    let steer=0;
    for(const s of ships){
      if(s===this) continue;
      const dx=this.x-s.x;
      const dy=this.y-s.y;
      const d2=dx*dx+dy*dy;
      const r=this.radius+s.radius+5;
      if(d2 < r*r){
        const d=Math.sqrt(d2);
        const a=Math.atan2(dy,dx);
        const diff=angleDiff(this.angle,a+Math.PI);
        const intensity=(1-d/r)*1.5;
        steer += diff*intensity;
      }
    }
    return steer;
  }
  findTarget(ships){
    let best=null; let bestD=9999;
    for(const s of ships){
      if(s===this) continue;
      if(s.team===this.team) continue;
      if(!this.parent && s.parent && s.team!==this.team) {
        // Prioritize attacking the parent of enemy team
      }
      const dx=s.x-this.x;
      const dy=s.y-this.y;
      const d=dx*dx+dy*dy;
      if(d < 150*150 && d<bestD){
        bestD=d;
        best=s;
      }
    }
    return best;
  }
  fire(target,d,proj){
    if(this.weaponCD>0) return;
    if(d > this.range*150) return;
    const dx=target.x-this.x;
    const dy=target.y-this.y;
    const a=Math.atan2(dy,dx);
    // Check aim - only fire if roughly facing
    const aimDiff=Math.abs(angleDiff(this.angle,a));
    if(aimDiff > 0.6) return;
    if(this.type==='ion'){
      // Beam
      beams.push(new Beam(this.x,this.y, target.x,target.y, this.team, 0.7, 70, 15));
      this.weaponCD = 1.5;
      target.health -= 5;
      if(target.health<=0 && !target.__dead){ target.__dead=true; this.killCount++; explosion(target.x,target.y, target.team===0?RED_RGB:BLU_RGB, 1.0); target.__toRemove=true; }
    } else {
      const spread=(Math.random()-0.5)*0.05;
      const proj1=new Projectile(this.x,this.y, this.angle+spread, this.team, 5.5, 60, 8);
      proj1.x += Math.cos(this.angle)*5;
      proj1.y += Math.sin(this.angle)*5;
      proj.push(proj1);
      this.weaponCD = 1.0;
    }
  }
}

function distance(a,b){
  const dx=b.x-a.x;
  const dy=b.y-a.y;
  return dx*dx+dy*dy;
}

function parentShipPos(team){ return { x:(team===0?-300:300), y:0 }; }

// ---------- Projectiles ----------
class Projectile {
  constructor(x,y,angle,team,dmg,range,speed){
    this.x=x; this.y=y;
    this.vx=Math.cos(angle)*speed*0.5;
    this.vy=Math.sin(angle)*speed*0.5;
    this.angle=angle;
    this.team=team;
    this.damage=dmg;
    this.range=range;
    this.life=range*1.5;
    this.dist=0;
  }
  update(dt){
    const sp=0.5;
    this.x+=this.vx*0.4;
    this.y+=this.vy*0.4;
    this.dist+=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    this.life-=0.012;
    if(this.dist>this.range) this.life=0;
  }
  draw(ctx){
    const col=this.team===0?'#ff5e':'#5eff';
    const colRGB=this.team===0?[255,80,120]:[80,250,50];
    // Glow
    ctx.globalAlpha=0.6;
    ctx.fillStyle=`rgba(${colRGB[0]},${colRGB[1]>>1|0},${colRGB[2]>>1|0},1)`;
    ctx.beginPath();
    ctx.arc(this.x,this.y,6,0,TWO);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(this.x,this.y,2.5,0,TWO);
    ctx.fill();
    // Tail
    ctx.globalAlpha=0.7;
    ctx.strokeStyle=col;
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.x-this.vx*0.6,this.y-this.vy*0.6);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

// ---------- Beams ----------
class Beam {
  constructor(x1,y1,x2,y2,team,life,radius,dmg){
    this.x=x1; this.y=y1;
    this.tx=x2; this.ty=y2;
    this.team=team;
    this.life=life;
    this.maxLife=life;
    this.radius=radius;
    this.damage=dmg;
    this.angle=Math.atan2(y2-y1,x2-x1);
    this.len=Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1));
  }
  update(dt){
    this.life-=0.012;
  }
  draw(ctx){
    const a=this.life/this.maxLife;
    const col=this.team===0?'255,80,80':'80,250,250';
    ctx.globalAlpha=a*0.5;
    ctx.fillStyle=`rgba(${col},${a*0.5})`;
    ctx.beginPath();
    const x1=this.x;
    const y1=this.y;
    const dx=this.tx-this.x;
    const dy=this.ty-this.y;
    const dl=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/dl;
    const ny=dy/dl;
    const w=this.radius*3;
    ctx.beginPath();
    ctx.moveTo(this.x-ny*w, this.y+nx*w);
    ctx.lineTo(this.tx-ny*w*0.5, this.ty+nx*w*0.5);
    ctx.lineTo(this.tx+ny*w*0.5, this.ty-nx*w*0.5);
    ctx.lineTo(this.x+ny*w, this.y-nx*w);
    ctx.closePath();
    ctx.fill();
    // Core line
    ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(255,255,240,1)`;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.tx,this.ty);
    ctx.stroke();
    // Glow line
    ctx.strokeStyle=`rgba(${col},1)`;
    ctx.lineWidth=3;
    ctx.globalAlpha=a*0.5;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.tx,this.ty);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

let ships=[], projectiles=[], beams=[];

// Spawn from mother ship
function spawnFromMother(mother){
  const x=mother.x + Math.cos(mother.angle+Math.PI)*0;
  const y=mother.y + Math.sin(mother.angle+Math.PI)*0;
  const off=(Math.random()-0.5)*40;
  const a=mother.angle + Math.PI + (Math.random()-0.5)*0.2;
  const sx=mother.x + Math.cos(a)*30;
  const sy=mother.y + Math.sin(a)*30;
  const type=Math.random()<0.5?0:1; // 0 = projectile, 1 = ion
  const s=new Ship(mother.team, type===0?`proj`: `ion`, sx, sy, false);
  s.angle=a;
  s.angVel=(Math.random()-0.5)*0.02;
  ships.push(s);
}

// ---------- Initialization ----------
function initFleet(){
  ships=[]; projectiles=[]; beams=[]; particles=[]; flashes=[];
  // Team 0 - RED (left side)
  const m0=new Ship(0,'mother',-300,0,true);
  m0.angle=0;
  ships.push(m0);
  for(let i=0;i<4;i++){
    const a=Math.random()*TWO;
    const r=20+Math.random()*15;
    const sx=m0.x+Math.cos(a)*r;
    const sy=m0.y+Math.sin(a)*r;
    const t=Math.random()<0.5?`proj`:`ion`;
    const s=new Ship(0,t,sx,sy,false);
    s.angle=Math.random()*TWO;
    ships.push(s);
  }
  // Team 1 - BLUE (right side)
  const m1=new Ship(1,'mother',300,0,true);
  m1.angle=Math.PI;
  ships.push(m1);
  for(let i=0;i<4;i++){
    const a=Math.random()*TWO;
    const r=20+Math.random()*15;
    const sx=m1.x+Math.cos(a)*r;
    const sy=m1.y+Math.sin(a)*r;
    const t=Math.random()<0.5?`proj`:`ion`;
    const s=new Ship(1,t,sx,sy,false);
    s.angle=Math.random()*TWO;
    ships.push(s);
  }
}
initFleet();

// ---------- Camera ----------
let camera={
  x:0,y:0,zoom:1, targetZoom:1, follow:null, mode:'overview', modeTime:0, target:null, transition:0
};
function pickFollow(){
  // Pick a ship in middle of battle, not parent
  const cand=ships.filter(s=>!s.parent);
  if(cund.length>0){
    // Prefer ships near center / with most action
    cand.sort((a,b)=>{
      const sa=Math.abs(a.x)+Math.abs(a.y);
      const sb=Math.abs(b.x)+Math.abs(b.y);
      return sa-sb;
    });
    // pick one in middle
    const i=Math.floor(Math.length*0.4+Math.random()*cand.length*0.2);
    return cand[i]||cand[0];
  }
  return null;
}

// ---------- Rendering ----------
function drawShip(ctx, s, isSelected){
  // Glow underlay
  ctx.globalAlpha=1;
  const col=s.team===0?`#f33d4e`: `#2be6f3`;
  const glowCol=s.team===0?`#ff7777`: `#88e2ff`;
  const colRGB=s.team===0?RED_RGB:BLU_RGB;
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(s.angle);

  // Engine trail
  ctx.globalAlpha=0.7;
  const trailLen=s.trail.length;
  for(let i=0;i<trailLen;i++){
    const p1=s.trail[i];
    const alpha=(i/trailLen)*0.7;
    const t=1-i/trailLen;
    const cstr=`rgba(${colRGB[0]>>1|0},${colRGB[1]>>1|0},${colRGB[2]>>1|0},${alpha})`;
    ctx.fillStyle=cstr;
    ctx.beginPath();
    ctx.arc(p1.x-s.x,p1.y-s.y, t*0.5+0.5, 0, TWO);
    ctx.fill();
  }

  // Engine jet
  const jetLen=8+Math.random()*2;
  const wobble=Math.random()*0.5;
  ctx.globalAlpha=0.6;
  ctx.fillStyle=glowCol;
  ctx.beginPath();
  ctx.moveTo(-s.radius*1.8,-0.5+wobble);
  ctx.lineTo(-s.radius*1.8-jetLen*0.5-Math.random()*3, -3);
  ctx.lineTo(-s.radius*1.8-jetLen-MileRandom(), -0.5+wobble);
  ctx.fill();
  ctx.globalAlpha=0.8;
  ctx.fillStyle=`rgba(255,255,255,0.5)`;
  ctx.beginPath();
  ctx.moveTo(-s.radius*1.8, -0.5);
  ctx.lineTo(-s.radius*1.8-jetLen*0.5, -0.5);
  ctx.lineTo(-s.radius*1.8-jetLen, 0);
  ctx.lineTo(-s.radius*1.8-jetLen, 0.5);
  ctx.lineTo(-s.radius*1.8+jetLen*0.5, 0.5);
  ctx.fill();

  // Ship body
  ctx.globalAlpha=1;
  // Drop shadow glow
  ctx.shadowColor = glowCol;
  ctx.shadowBlur = s.parent?15:5;

  if(s.parent){
    // Mother ship - large rectangle with details
    ctx.fillStyle = darken(colRGB, 0.4);
    ctx.beginPath();
    ctx.moveTo(-14, -6);
    ctx.lineTo(-12, -16);
    ctx.lineTo(12, -16);
    ctx.lineTo(15, -6);
    ctx.lineTo(15, 6);
    ctx.lineTo(15, 6);
    ctx.lineTo(12, 16);
    ctx.lineTo(-12, 16);
    ctx.lineTo(-14, 6);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
    // Details
    ctx.fillStyle=lighten(colRGB, 0.3);
    ctx.fillRect(-2,-5,5,10);
    ctx.fillStyle=`#fff`;
    ctx.fillRect(10, -5, 4, 3);
    ctx.fillRect(10, 2, 4, 3);
    ctx.fillStyle=lighten(colRGB,0.6);
    ctx.beginPath();
    ctx.arc(15+2,0,2.5,0,TWO);
    ctx.fill();
    // Spawn indicator
    if(s.spawnTimer<0){
      ctx.globalAlpha=0.5+Math.random()*0.5;
      ctx.fillStyle=`#fff`;
      ctx.beginPath();
      ctx.arc(15,0,2,0,TWO);
      ctx.fill();
    ctx.globalAlpha=1;
  } else if(s.type==='ion'){
    // Ion ship - distinct look, diamond / elongated
    ctx.fillStyle=darken(colRGB, 0.2);
    ctx.beginPath();
    ctx.moveTo(s.radius, 0);
    ctx.lineTo(-s.radius*0.5, -s.radius*0.6);
    ctx.lineTo(-s.radius, -s.radius*0.4);
    ctx.lineTo(-s.radius, s.radius*0.4);
    ctx.lineTo(-s.radius*0.5, s.radius*0.6);
    ctx.closePath();
    ctx.fill();
    // Inner core line for beam
    ctx.shadowBlur=10;
    ctx.shadowColor=`#fff`;
    ctx.strokeStyle=`#fff`;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(s.radius, 0);
    ctx.lineTo(s.radius+4, 0);
    ctx.stroke();
    ctx.shadowBlur=0;
    // Tip
    ctx.fillStyle=lighten(colRGB, 0.6);
    ctx.beginPath();
    ctx.arc(s.radius, 0, 1.5, 0, TWO);
    ctx.fill();
  } else if(s.type==='proj'){
    // Projectile ship - triangle with fins
    ctx.fillStyle=darken(colRGB,0.2);
    ctx.beginPath();
    ctx.moveTo(s.radius, 0);
    ctx.lineTo(-s.radius*0.6, -s.radius*0.6);
    ctx.lineTo(-s.radius, -s.radius*0.4);
    ctx.lineTo(-s.radius, s.radius*0.4);
    ctx.lineTo(-s.radius*0.6, s.radius*0.6);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
    // Cockpit / center dot
    ctx.fillStyle=lighten(colRGB,0.6);
    ctx.beginPath();
    ctx.arc(0, 0, 1.5, 0, TWO);
    ctx.fill();
    ctx.fillStyle=`#fff`;
    ctx.beginPath();
    ctx.arc(0,0,0.8,0,TWO);
    ctx.fill();
  }

  ctx.shadowBlur=0;

  // Selection ring (highlight followed ship
  if(isSelected){
    ctx.globalAlpha=0.5+0.5*Math.sin(Date.now()*0.001*4);
    ctx.strokeStyle=`#ffff88`;
    ctx.lineWidth=0.5;
    ctx.beginPath();
    ctx.arc(0, 0, s.radius+10, 0, TWO);
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // Health bar
  if(!s.parent){
    const w=s.radius*1.8;
    const hp=clamp(s.health/s.maxHealth,0,1);
    ctx.globalAlpha=1;
    ctx.fillStyle=`rgba(0,0,0,0.5)`;
    ctx.fillRect(s.x-w*0.5, s.y-s.radius+5, w, 2);
    ctx.fillStyle=s.team===0?RED_GLU : BLU_GLOW;
    ctx.fillStyle=s.team===0?`#ff6e70`:`#88e2ff`;
    ctx.fillRect(s.x-w*0.5, s.y-s.radius+5, w*hp, 2);
  }

  // Kill count display (next to ship
  if(s.killCount>0){
    const lbl=String(s.killCount);
    ctx.font='600 7px "Helvetica",sans-serif';
    const text=lbl;
    const tw=ctx.measureText(text).width+4;
    const tx=s.x+5;
    const ty=s.y+5+4;
    ctx.globalAlpha=0.7;
    ctx.fillStyle=`rgba(0,0,0,0.6)`;
    ctx.fillRect(s.x+5, s.y+5, 6, 6);
    ctx.globalAlpha=1;
    ctx.fillStyle=`#fff`;
    ctx.fillText(text, s.x+5, s.y+5+4);
  }

  ctx.globalAlpha=1;
}

function MileRandom(){ return Math.random()*8; }

// ---------- Main loop ----------
let lastTime=0;
function loop(time){
  const dt=Math.min(time-lastTime, 0.04);
  lastTime=time;
  // Update ships
  for(const s of ships){
    s.update(dt, ships);
    // Remove dead
    if(s.__toRemove){
      const idx=ships.indexOf(s);
      if(idx>=0) ships.splice(idx,1);
    }
  }
  // Clean dead ships (done lazily
  ships = ships.filter(s=>!s.__dead);
  // Update projectiles
  for(const p of projectiles) p.update(dt);
  // Check collisions
  for(const p of projectiles){
    let hit=false;
    for(const s of ships){
      if(s.team===p.team) continue;
      const dx=s.x-p.x;
      const dy=s.y-p.y;
      const d=dx*dx+dy*dy;
      const r=s.radius+3;
      if(d < r*r){
        // Hit
        s.health -= p.damage*0.6;
        if(s.health<=0 && !s.__dead){
          // Find killer - projectile owner
          // Find a ship with same team and nearest to projectile origin
          let killer=null;
          let kd=Infinity;
          for(const ss of ships){
            if(ss.team===p.team) {
              const d=distance(ss,p);
              if(d < kd){ kd=d; killer=ss; }
            }
          }
          if(killer) killer.killCount++;
          explosion(s.x, s.y, s.team===0?RED_RGB:BLU_RGB, 1);
          s.__dead=true;
          s.__toRemove=true;
        } else {
          // Hit spark
          for(let i=0;i<3;i++){
            const a=Math.random()*TWO;
            const sp=Math.random()*0.2+0;
            projectiles.push(new Projectile(s.x, s.y, a, p.team, 0.05, 5, 0.5));
            // actually, sparks
          }
        }
        hit=true;
        break;
      }
    }
    p.life = hit ? 0 : p.life;
  }
  // Update beams
  for(const b of beams){
    b.update(dt);
  // Apply damage to target end (already applied in fire() directly for simplicity)
  }
  // Clean
  projectiles = projectiles.filter(p=>p.life>0);
  beams = beams.filter(b=>b.life>0);
  // Clean dead ships
  ships = ships.filter(s=>!s.__dead);

  // Spawn new ships from mothers occasionally
  for(const s of ships){
    if(s.parent){
      // (Already handled in update)
    }
  }

  // Camera update
  if(camera.mode==='overview'){
    camera.targetZoom = 1.1*0.5;
    camera.targetZoom = 1.5*0.6; // zoom out
    camera.target = null;
    camera.modeTime += dt;
    if(camera.modeTime > 5){
      camera.mode = 'follow';
      camera.modeTime = 0;
      camera.follow = pickFollow();
    }
  } else if(camera.mode==='follow'){
    camera.targetZoom = 3.4;
    camera.modeTime += dt;
    if(camera.modeTime > 6+Math.random()*4){
      // Check if followed still alive
      const stillAlive = camera.follow && !camera.follow.__dead && ships.includes(camera.follow);
      if(!stillAlive){
        camera.mode = 'overview';
        camera.modeTime = 0;
        camera.follow = null;
      } else if(camera.modeTime > 9+Math.random()*5){
        camera.mode = 'overview';
        camera.modeTime = 0;
        camera.follow = null;
      }
    }
  }

  // Smooth camera
  camera.zoom = lerp(camera.zoom, camera.targetZoom, 0.05);
  if(camera.follow && ships.includes(camera.follow)){
    const fs=camera.follow;
    camera.x = lerp(camera.x, fs.x, 0.05);
    camera.y = lerp(camera.y, fs.y, 0.05);
  } else if(camera.mode==='overview'){
    // Pan around for overview
    const t=Date.now()*0.001;
    camera.x = lerp(camera.x, Math.sin(t*0.3)*50, 0.05);
    camera.y = lerp(camera.y, Math.cos(t*0.3)*40, 0.05);
  }

  // Render
  ctx.globalAlpha=1;
  // Background gradient
  ctx.fillStyle=`#0a06121`;
  ctx.fillStyle=`rgb(10,20,40)`;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  // Camera transform
  ctx.translate(W/2, H/2);
  ctx.scale(1/camera.zoom, 1/camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  // Stars
  for(const star of stars){
    // Adjust for parallax - stars in world space, but drawn relative
    const sx=(star.x - camera.x) * camera.zoom;
    // Actually since we already translate, just draw at world position
    star.draw(ctx);
  }

  // Bounds (faint)
  ctx.globalAlpha=0.2;
  ctx.strokeStyle=`#3344aa`;
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.rect(BOUNDS.x, BOUNDS.y, WORLD.W, WORLD.H);
  ctx.stroke();
  ctx.globalAlpha=1;

  // Particles
  for(const p of particles){
    p.update(dt);
    p.draw(ctx);
  }
  particles = particles.filter(p=>p.life>0);

  // Beams
  for(const b of beams){
    b.draw(ctx);
  }

  // Projectiles
  for(const p of projectiles){
    p.draw(ctx);
  }

  // Ships
  for(const s of ships){
    drawShip(ctx, s, camera.follow===s);
  }

  // Flashes
  drawFlashes();

  ctx.restore();

  // Vignette overlay
  ctx.globalAlpha=0.6;
  ctx.fillStyle=`#000`;
  const grad=ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,`rgba(0,0,0,0.8)`);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;

  // Frame / overlay text
  ctx.font='700 10px Helvetica, sans-serif';
  ctx.fillStyle=`rgba(255,255,255,0.2)`;
  ctx.fillText('SPACE FLEET BATTLE', 20, 20);
  ctx.font='400 10px Helvetica, sans-serif';
  ctx.fillStyle=`rgba(255,255,255,0.4)`;
  ctx.fillText('Team 0: '+ ships.filter(s=>s.team===0).length + '   |   Team 1: ' + ships.filter(s=>s.team===1).length, 20, H-20);

  // Frame
  requestAnimationFrame(loop);
}
