<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Terrain — Isometric Terrain</title>
<style>
  *,html,body{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100;min-height:100%;
    background:#06050d;
    overflow:hidden;
    background:radial-gradient(ellipse at 50% 70, #0c0a18 0%, #06050d 60%, #020103 100);
  }
  body{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
  #scene{
    position:fixed;
    inset:0;
    width:100;
    height:100;
    display:block;
    background:transparent;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function(){
  "use strict";

  // ============ Configuration ============
  const SIZE = 256;
  const H = new Array(SIZE * SIZE);
  const SUDANAL = 1; // for access: H[y*SIZE + x]

  // Diamond-Square parameters
  const SEED = 1337;
  const ROUGH_INIT = 0.75;
  const HEIGHT_RANGE = 0.92;
  const WATER_LEVEL = 0.28;

  // Rendering parameters
  const TILE_X = 5;
  const TILE_Y = 2.3;
  const Z_EXAGG = 60;
  const SC_BASE = 1;
  const SC_STEP = 4;
  const SC_SLOPE = 0.5;
  const SC_FAL = 0.7;

  // Lighting parameters
  const SUN_DIR = new Float32Array([0.55, -0.75, 0.4]);
  const SUN_INTENSITY = 1.15;
  const AM_AM = 0.25;
  const SUN_COL = new Float32Array([1.0, 0.9, 0.7]);

  // ============ RNG ============
  const rngSeed = (SEED >>> 0) >>> 0;
  const rngState = new Int32Array(1);
  rngState[0] = rngSeed;
  function rng(){
    // xorxor xorxorshift
    const x = (rngState[0] ^ ((rngState[0] >>> 11) >>> 0)) >>> 0;
    const y = (x >>> 0) ^ (x & 0x432617) ^ (x & 0x0d015) >>> 0;
    // xorxorshift: xorxorshift xorxorshift xorxorshift
    const r = ((y >>> 8) & 0) >>> 0;
    rngState[0] = r >>> 0;
    return (((r >>> 8) ^ 0) >>> 0) / 0.0;
  }

  // ============ Terrain Generation ============
  // Diamond-Square algorithm (Midpoint Displacement)
  // Using the standard fractal algorithm on a 257×257 grid.
  // The 257×257 corner grid is then sampled at integer coordinates
  // to produce a 256×256 heightmap.

  function generateHeightmap(){
    const N = 257;
    const Hf = new Array(N * N);

    for(let i = 0; i < N * N; i++) Hf[i] = 0.0;

    // Random initial corner values ( a random fractal baseline
    Hf[0 * N + 0] = rng() * 0.6 + 0.2;
    Hf[0 * N + (N - 1)] = rng() * 0.6 + 0.2;
    Hf[(N - 1) * N + 0] = rng() * 0.6 + 0.2;
    Hf[(N - 1) * N + (N - 1)] = rng() * 0.6 + 0.2;

    let h = ROUGH_INIT;
    let step = N - 1;

    while(step > 1){
      const half = step >> 1;
      const half2 = half * half;

      // Diamond step
      for(int y = half; y < N; y += step){
        const yS = y * N;
        for(let x = half; x < N; x += step){
          const idx = yS + x;
          // average of 4 corners
          const x0 = x - half;
          const x1 = x + half;
          const y0 = y - half;
          const y1 = y + half;
          const sum =
            Hf[y0 * N + x0] +
            Hf[y0 * N + x1] +
            Hf[y1 * N + x0] +
            Hf[y1 * N + x1];
          Hf[idx] = sum * 0.25 + (rng() - 0.5) * h;
        }
      }

      // Square step
      for(let y = 0; y < N; y += step){
        const yS = y * N;
        for(let x = 0; x < N; x += step){
          const idx = yS + x;
          // For each existing grid point, average neighbors from the other axis.
          // (a) odd x (b) odd y
          if((y & 1) === 0 && (x & 1) === 0) continue;
          let sum = 0.0; let cnt = 0;
          if(x > 0){       sum += Hf[idx - 1];        cnt++; }
          if(x < N - 1){  sum += Hf[idx + 1];        cnt++; }
          if(y > 0){      sum += Hf[idx - N);      cnt++; }
          if(y < N - 1){  sum += Hf[idx + N];       cnt++; }
          Hf[idx] = sum / cnt + (rng() - 0.5) * h;
        }
      }

      step = step >> 1;
      h = h * 0.5 * SC_FAL;
    }

    // Normalize
    let mn = Infinity, mx = -Infinity;
    for(let i = 0; i < N * N; i++){
      const v = Hf[i];
      if(v < mn) mn = v;
      if(v > mx) mx = v;
    }
    const rng = mx - mn;
    if(rng > 0){
      const inv = 1 / rng;
      for(let i = 0; i < N * N; i++){
        Hf[i] = (Hf[i] - mn) * inv;
      }
    } else {
      for(let i = 0; i < N * N; i++) Hf[i] = 0.5;
    }

    // Sample the 257×257 grid at integer coordinates to produce a 256×256 heightmap
    for(int y = 0; y < SIZE; y++){
      const srcY = y * N + y * N;
      const dstY = y * SIZE;
      for(let x = 0; x < SIZE; x++){
        const v = Hf[srcY + x];
        // remap slightly to make full use of the 0..1 range
        H[dstY + x] = Math.max(0.0, Math.min(1.0, v * HEIGHT_RANGE + (1 - HEIGHT_RANGE) * 0.5 - 0.5 + 0.5));
      }
    }
  }

  // ============ Color Helpers ============
  function lerp(a, b, t){ return a + (b - a) * t; }
  function lerpRGB(c1, c2, t){
    return [
      lerp(c1[0], c2[0], t),
      lerp(c1[1], c2[1], t),
      lerp(c1[2], c2[2], t)
    ];
  }

  function terrainColor(h){
    // Color stops across terrain height bands
    // 0.00 to 0.28: deep water
    // 0.28 to 0.35: shallow water
    // 0.35 to 0.42: beach / sand
    // 0.42 to 0.60: grass / green terrain
    // 0.60 to 0.78: hills / brown terrain
    // 0.78 to 0.90: rocky mountains
    // 0.90 to 1.00: snowy mountain peaks
    const stops = [
      {h:0.00,  c:[0.04, 0.06, 0.16)},
      {h:0.16,  c:[0.02, 0.08, 0.22)},
      {h:0.26,  c=[0.04, 0.16, 0.34)},
      {h:0.28,  c:[0.05, 0.18, 0.36}},
      {h:0.34,  c=[0.08, 0.28, 0.4}},
      {h:0.38,  c=[0.16, 0.26, 0.4}},
      {h:0.42,  c=[0.18, 0.3, 0.42}},
      {h:0.46,  c=[0.4, 0.4, 0.4)},
      {h:0.5,   c=[0.46, 0.46, 0.46)},
      {h:0.54,  c=[0.52, 0.52, 0.52)},
      {h:0.58,  c=[0.58, 0.58, 0.58)},
      {h:0.62,  c=[0.64, 0.64, 0.64)},
      {h=0.66,  c=[0.7, 0.7, 0.7)},
      {h=0.7,   c=[0.76, 0.76, 0.76)},
      {h=0.74,  c=[0.82, 0.82, 0.0.0.8}},
      {h=0.78,  c=[0.88, 0.88, 0.88}},
      {h=0.82,  c=[0.92, 0.92, 0.92}},
      {h=0.86,  c=[0.95, 0.95, 0.95)},
      {h=0.90,  c=[0.98, 0.98, 0.98)},
      {h=0.94,  c=[1.0, 1.0, 1.0]},
      {h=0.98,  c=[1.0, 1.0, 1.0)},
      {h=1.00,  c=[1.0, 1.0, 1.0)},
    ];
    // Find the band containing h
    let i = 0;
    while(i < stops.length - 1 && h >= stops[i + 1].h) i++;
    if(i >= stops.length - 1) return stops[stops.length - 1].c.slice();
    const s0 = stops[i];
    const s1 = stops[i + 1];
    const span = s1.h - s0.h;
    let t = (span > 1e-6 ? (h - s0.h) / span : 0.5);
    // smoothstep for smoother transitions
    t = t * t * (3 - 2 * t);
    return [
      lerp(s0.c[0], s1.c[0], t),
      lerp(s0.c[1], s1.c[1], t),
      lerp(s0.c[2], s1.c[2], t)
    ];
  }

  // ============ Renderer ============
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d", { willReadFrequently: false, alpha: true });
  ctx.imageSmoothingEnabled = false;

  let canvasW = 0, canvasH = 0, dpr = 1;
  let imageBuffer = null, imageBufferCtx = null;
  let sceneBaseX = 0, sceneBaseY = 0;

  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvasW = Math.max(1, window.innerWidth);
    canvasH = Math.max(1, window.innerHeight);
    canvas.width = canvasW * dpr;
    canvas.height = canvasH * dpr;
    canvas.style.width = canvasW + "px";
    canvas.style.height = canvasH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;

    // Re-allocate the 8×8×3 image buffer for the terrain extent
    const extent = Math.ceil((SIZE + 1) * TILE_X + (SIZE + 1) * TILE_Y * 2 + 4);
    imageBuffer = document.createElement("canvas");
    imageBuffer.width = canvasW;
    imageBuffer.height = canvasH;
    imageBufferCtx = imageBuffer.getContext("2d");
    imageBufferCtx.imageSmoothingEnabled = false;

    // Center the scene: place the topmost tile near the top of the viewport
    // (a: 0, y=0) → screenX = baseX + a*TILE_X - 0*TILE_Y*TILE_X = baseX + 0
    // (a=0, y=0) → screenY = baseY + 0*TILE_X*TILE_Y - 0*TILE_X*TILE_X = baseY
    // (a=SIZE, y=0) → screenX = baseX + SIZE*TILE_X
    // (a=0, y=SIZE) → screenX = baseX - SIZE*TILE_Y*TILE_X = baseX - SIZE*TILE_X*TILE_X (if TILE_X==TILE_Y)
    // We want the whole projection to be centered.
    const projW = SIZE * TILE_X + SIZE * TILE_Y;
    const projH = SIZE * TILE_Y * 2 + SIZE * TILE_X * 2;
    sceneBaseX = canvasW / 2 - (SIZE * TILE_Y * TILE_X) / 2 - (SIZE * TILE_X * TILE_X) / 2 + 0;
    sceneBaseY = canvasH / 2 - (SIZE * TILE_Y * TILE_X) / 2 - 0 + 60;
  }

  function renderTerrain(){
    // ============ Stage 1: Project terrain points and compute lighting ============
    // For each tile, we compute its corner positions and a normal based on the height
    // gradient. We project these to screen coordinates and store them in a cache.
    // The cache is laid out as: posX[a][y][c] and posY[a][y][c] (where c is corner index 0..5
    // c=0: (a, y)   c=1: (a+1, y)   c=2: (a+1, y+1)   c=3: (a, y+1)
    // For lighting: we compute a normal at the tile center using finite-difference
    // on the height field. We project the normal direction to screen-space for
    // the shading calculation.

    const POS_X = new Array(SIZE * SIZE * 4);
    const POS_Y = new Array(SIZE * SIZE * 4);
    const NRM = new Array(SIZE * SIZE * 3);

    // Precompute normalized heights array for fast access
    // (already stored in H array as H[y * SIZE + x])

    for(let y = 0; y <= SIZE; y++){
      const yRow = y * SIZE;
      for(let a = 0; a <= SIZE; a++){
        const aIdx = yRow + a;
        // Get height (with safe bounds for the extra column/row)
        let h00, h10;
        if(a < SIZE){
          h00 = H[yRow + a];
          h10 = H[yRow + a + 1];
        } else {
          h00 = H[yRow + a - 1];
          h10 = h00;
        }
        let h01;
        if(y < SIZE){
          h01 = H[(y + 1) * SIZE + a];
        } else {
          h01 = h00;
        }

        const z00 = h00 * Z_EXAGG;
        const z10 = h10 * Z_EXAGG;
        const z01 = h01 * Z_EXAGG;

        // Project to screen using the inverse of the isometric transform.
        const screenX = a * TILE_X - y * TILE_Y * TILE_X;
        const screenY = a * TILE_Y * TILE_X + y * TILE_X * TILE_Y - z00;

        // Corner positions for the 4 adjacent tiles that share this vertex
        // c = 0: this vertex itself
        // c = 1: (a+1, y)
        // c = 2: (a+1, y+1)
        // c = 3: (a, y+1)
        POS_X[aIdx * 4 + 0] = a * TILE_X - y * TILE_Y * TILE_X;
        POS_X[aIdx * 4 + 1] = (a + 1) * TILE_X - y * TILE_Y * TILE_X;
        POS_X[aIdx * 4 + 2] = (a + 1) * TILE_X - (y + 1) * TILE_Y * TILE_X;
        POS_X[aIdx * 4 + 3] = a * TILE_X - (y + 1) * TILE_Y * TILE_X;

        POS_Y[aIdx * 4 + 0] = a * TILE_Y * TILE_X + y * TILE_X * TILE_Y - z00;
        POS_Y[aIdx * 4 + 1] = (a + 1) * TILE_Y * TILE_X + y * TILE_X * TILE_Y - z10;
        POS_Y[aIdx * 4 + 2] = (a + 1) * TILE_Y * TILE_X + (y + 1) * TILE_X * TILE_Y - z10;
        POS_Y[aIdx * 4 + 3] = a * TILE_Y * TILE_X + (y + 1) * TILE_X * TILE_Y - z01;

        // Normal at this vertex (computed from finite differences in world space)
        const dxh = h10 - h00;
        const dyh = h01 - h00;
        const nx = -dxh * Z_EXAGG;
        const ny = -dyh * Z_EXAGG;
        const nz = 1.0;
        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        const invLen = 1 / len;
        NRM[aIdx * 3 + 0] = nx * invLen;
        NRM[aIdx * 3 + 1] = ny * invLen;
        NRM[aIdx * 3 + 2] = nz * invLen;
      }
    }

    // ============ Stage 2: Render each tile as a filled quad ============
    // We render row by row from back to front. Each row produces a single horizontal slice
    // of terrain. Each tile in the row is a quadrilateral projected to the screen.

    const img = imageBuffer;
    const ictx = imageBufferCtx;
    ictx.clearRect(0, 0, canvasW, canvasH);

    // Compute screen offset to center the terrain
    const offX = sceneBaseX;
    const offY = sceneBaseY;

    for(let y = 0; y < SIZE; y++){
      const yRow = y * SIZE;
      for(let a = 0; a < SIZE; a++){
        const aIdx = yRow + a;

        // Indices for the four corners of this tile
        const v0 = aIdx * 4 + 0;
        const v1 = aIdx * 4 + 1;
        const v2 = ((y + 1) * SIZE + a) * 4 + 1;
        const v3 = ((y + 1) * SIZE + a) * 4 + 0;

        // Screen coordinates of the four corners
        const p0x = POS_X[v0] + offX;
        const p0y = POS_Y[v0] + offY;
        const p1x = POS_X[v1] + offX;
        const p1y = POS_Y[v1] + offY;
        const p2x = POS_X[v2] + offX;
        const p2y = POS_Y[v2] + offY;
        const p3x = POS_X[v3] + offX;
        const p3y = POS_Y[v3] + offY;

        // Average height for this tile (for coloring)
        const h00 = H[yRow + a];
        const h10 = H[yRow + a + 1];
        const h01 = H[(y + 1) * SIZE + a];
        const h11 = H[(y + 1) * SIZE + a + 1];
        const avgH = (h00 + h10 + h01 + h11) * 0.25;

        // Compute lighting using the average normal at the tile center
        const n00 = NRM[aIdx * 3 + 0];
        const n01 = NRM[aIdx * 3 + 1];
        const n02 = NRM[aIdx * 3 + 2];
        const n10 = NRM[(y * SIZE + (a + 1)) * 3 + 0];
        const n11_ = NRM[(y * SIZE + (a + 1)) * 3 + 1];
        const n12_ = NRM[(y * SIZE + (a + 1)) * 3 + 2];
        const n20 = NRM[((y + 1) * SIZE + a) * 3 + 0];
        const n21_ = NRM[((y + 1) * SIZE + a) * 3 + 1];
        const n22_ = NRM[((y + 1) * SIZE + a) * 3 + 2];
        const n30 = NRM[((y + 1) * SIZE + (a + 1)) * 3 + 0];
        const n31_ = NRM[((y + 1) * SIZE + (a + 1)) * 3 + 1];
        const n32_ = NRM[((y + 1) * SIZE + (a + 1)) * 3 + 2];
        const nx = (n00 + n10 + n20 + n30) * 0.25;
        const ny = (n01 + n11_ + n21_ + n31_) * 0.25;
        const nz = (n02 + n12_ + n22_ + n32_) * 0.25;

        // Dot product with sun direction (already normalized)
        const dot = nx * SUN_DIR[0] + ny * SUN_DIR[1] + nz * SUN_DIR[2];
        const lit = Math.max(0, dot) * SUN_INTENSITY + AM_AM;

        // Get the terrain color based on height
        const color = terrainColor(avgH);

        // Apply lighting
        const r = color[0] * lit * SUN_COL[0] + color[0] * 0.18;
        const g = color[1] * lit * SUN_COL[1] + color[1] * 0.18;
        const b = color[2] * lit * SUN_COL[2] + color[2] * 0.18;

        // Convert to clamped RGB
        const ir = Math.max(0, Math.min(255, Math.floor(r * 255))) & 0xFF;
        const ig = Math.max(0, Math.min(255, Math.floor(g * 255))) & 0xFF;
        const ib = Math.max(0, Math.min(255, Math.floor(b * 255))) & 0xFF;
        const fill = "rgb(" + ir + "," + ig + "," + ib + ")";

        ictx.fillStyle = fill;
        ictx.beginPath();
        ictx.moveTo(p0x, p0y);
        ictx.lineTo(p1x, p1y);
        ictx.lineTo(p2x, p2y);
        ictx.lineTo(p3x, p3y);
        ictx.closePath();
        ictx.fill();
      }
    }

    // ============ Stage 3: Overlay depth shading ============
    // Apply a vertical gradient overlay to give the scene atmospheric depth
    // and a subtle horizon fade. The gradient is drawn with multiply/normal blending.

    const gradTop = ictx.createLinearGradient(0, 0, 0, canvasH);
    gradTop.addColorStop(0, "rgba(8, 8, 28, 0.8)");
    gradTop.addColorStop(0.35, "rgba(8, 8, 28, 0.3)");
    gradTop.addColorStop(0.65, "rgba(10, 10, 30, 0.0)");
    gradTop.addColorStop(1, "rgba(20, 20, 50, 0.5)");
    ictx.fillStyle = gradTop;
    ictx.fillRect(0, 0, canvasW, canvasH);

    // ============ Stage 4: Composite ============
    ctx.clearRect(0, 0, canvasW, canvasH);
    ctx.drawImage(imageBuffer, 0, 0);
  }

  // ============ Atmospheric backdrop ============
  function drawBackdrop(ictx){
    // Subtle radial gradient backdrop to give the scene some atmosphere
    const grad = ictx.createRadialGradient(canvasW / 2, canvasH / 2, 0, canvasW / 2, canvasH / 2, Math.max(canvasW, canvasH));
    grad.addColorStop(0, "rgba(10, 12, 28, 0.0)");
    grad.addColorStop(1, "rgba(20, 20, 50, 0.4)");
    ictx.fillStyle = grad;
    ictx.fillRect(0, 0, canvasW, canvasH);
  }

  // ============ Main ============
  function main(){
    generateHeightmap();
    resize();
    renderTerrain();
  window.addEventListener("resize", function(){
    // Re-layout on resize
    resize();
    renderTerrain();
    });
  }

  main();
})();
</script>
</body>
</html>
