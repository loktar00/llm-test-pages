<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Metaball Lava Lamp</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="lamp"></canvas>
<script>
(() => {
    const canvas = document.getElementById('lamp');
    const gl = canvas.getContext('webgl2');
    if (!gl) alert('WebGL2 required');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    const vertShaderSrc = `#version 300 es
    precision highp float;
    out vec2 vUv;
    void main() {
        vUv = (gl_VertexID == 0) ? vec2(0.0) : 
              (gl_VertexID == 1) ? vec2(1.0, 0.0) :
              (gl_VertexID == 2) ? vec2(0.0, 1.0) : vec2(1.0);
        gl_Position = vec4(vUv * 2.0 - 1.0, 0.0, 1.0);
    }`;

    const fragmentShaderSrc = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;

    uniform vec2 u_resolution;
    uniform float u_time;

    // Hash function for pseudo-random numbers
    float hash(vec2 p) {
        return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    // Smooth noise over time
    float noise(vec2 p, float t) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    void main() {
        vec2 uv = vUv;
        vec2 resolution = u_resolution;

        // Normalize UV coordinates
        vec2 pos = uv * resolution;

        // Simulate heat convection cells - blobs rise at center, sink at edges
        // This creates natural-looking movement
        
        float t = u_time * 0.3;
        int numBlobs = 10;
        float metaballSum = 0.0;
        vec3 color = vec3(0.0);
        vec2 centerGlow = vec2(0.0);
        float glowWeight = 0.0;

        for (int i = 0; i < 12; i++) {
            if (i >= numBlobs) break;

            // Generate unique movement pattern per blob
            float phase = float(i) / float(numBlobs) * 3.14159 * 2.0;
            float speed = 0.2 + 0.1 * hash(vec2(float(i), 0.0));
            float driftX = sin(t * speed + phase) * 0.15 + cos(t * 0.05 + phase * 1.3) * 0.1;
            float verticalCycle = fract((t * (0.3 + speed) + phase) * 0.2 + hash(vec2(float(i), 1.0)));
            
            // Apply heat cycle: blobs rise slowly, cool down, sink back
            float yPos = mix(0.1, 0.9, verticalCycle);
            // Add some vertical oscillation based on convection
            float convectionRise = sin(yPos * 3.14159 + t * 0.2) * 0.02;
            yPos += convectionRise;
            
            vec2 blobPos = vec2(
                0.5 + driftX,
                yPos
            );

            // Blob size varies with temperature (larger when warm at bottom)
            float tempFactor = smoothstep(0.1, 0.9, yPos); // cooler at top, warmer at bottom
            float size = 0.08 + tempFactor * 0.05; // larger when warm

            vec2 diff = pos / resolution - blobPos;
            float distSq = dot(diff, diff);
            float influence = size * size / (distSq + 0.0001);
            
            metaballSum += influence;

            // Color based on temperature
            vec3 warmColor = mix(vec3(0.9, 0.4, 0.1), vec3(1.0, 0.7, 0.2), tempFactor);
            vec3 coolColor = mix(vec3(0.1, 0.3, 0.8), vec3(0.2, 0.2, 0.9), tempFactor);
            vec3 blobColor = mix(coolColor, warmColor, tempFactor);
            
            color += blobColor * influence;

            // Track glow positions
            centerGlow += blobPos * influence;
            glowWeight += influence;
        }

        // Threshold to create solid blobs
        float threshold = 0.8;
        if (metaballSum > threshold) {
            // Normalize color by total influence
            color /= max(glowWeight, 0.001);

            // Deep glass lamp color grading
            vec3 lampColor = mix(vec3(0.1, 0.05, 0.2), vec3(0.3, 0.1, 0.4), smoothstep(0.1, 0.7, metaballSum));
            color = mix(lampColor, color, 0.7);

            // Add subtle inner glow at blob cores
            vec2 glowCenter = centerGlow / max(glowWeight, 0.001);
            float coreGlow = exp(-length(pos / resolution - glowCenter) * 6.0) * 0.5;
            color += vec3(1.0, 0.8, 0.6) * coreGlow * smoothstep(0.0, 0.3, metaballSum - threshold);

            fragColor = vec4(color, 1.0);
        } else {
            // Background with dark gradient
            vec3 bg = mix(vec3(0.0, 0.0, 0.05), vec3(0.05, 0.0, 0.1), uv.y);
            fragColor = vec4(bg, 1.0);
        }
    }`;

    // Create shaders
    function createShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error('Shader compile error:', gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
        }
        return shader;
    }

    const vertexShader = createShader(gl.VERTEX_SHADER, vertShaderSrc);
    const fragmentShader = createShader(gl.FRAGMENT_SHADER, fragmentShaderSrc);

    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Program link error:', gl.getProgramInfoLog(program));
    }

    const resolutionLoc = gl.getUniformLocation(program, 'u_resolution');
    const timeLoc = gl.getUniformLocation(program, 'u_time');

    let startTime = Date.now();
    function render() {
        const elapsed = (Date.now() - startTime) * 0.001;

        gl.useProgram(program);
        gl.uniform2f(resolutionLoc, canvas.width, canvas.height);
        gl.uniform1f(timeLoc, elapsed);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(render);
    }

    render();
})();
</script>
</body>
</html>
