<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Desk</title>
<style>
  :root {
    --bg-color: #0f101a;
    --desk-color: #3e2723;
    --desk-highlight: #4e342e;
    --wall-color: #1a1a24;
    --wall-shadow: #0d0d14;
    --lamp-off: #333;
    --lamp-on: #ffcc80;
    --light-cone: rgba(255, 204, 128, 0.15);
    --transition-speed: 0.8s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #050505;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    overflow: hidden;
  }

  /* --- SCENE CONTAINER --- */
  .scene {
    position: relative;
    width: 800px;
    height: 600px;
    background-color: var(--wall-color);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    overflow: hidden;
    transition: filter var(--transition-speed);
  }

  .scene.dark-mode
