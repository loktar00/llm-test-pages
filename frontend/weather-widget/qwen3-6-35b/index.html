<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Weather Widget</title>
    <style>
        :root {
            --bg-day-top: #4facfe;
            --bg-day-bottom: #00f2fe;
            --bg-night-top: #0f2027;
            --bg-night-bottom: #203a43;
            
            --sun-color: #ffeb3b;
            --sun-glow: rgba(255, 235, 59, 0.6);
            --cloud-color: #ffffff;
            --moon-color: #f4f6f0;
            
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Day/Night Gradient Background controlled by CSS vars */
            background: linear-gradient(to bottom, var(--bg-day-top), var(--bg-day-bottom));
            transition: background 0.5s ease;
        }

        /* --- Main Card --- */
        .widget {
            width: 380px;
            height: 750px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 24px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s ease;
        }

        /* --- Header & Toggle --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .location {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .date {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- Hero Section (Temp & Scene) --- */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .temperature-container {
            position: relative;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .temp-display {
            font-size: 5.5rem;
            font-weight: 200;
            position: absolute;
            z-index: 2;
            line-height: 1;
        }

        .unit {
            font-size: 1.5rem;
            vertical-align: super;
            margin-left: 5px;
        }

        /* --- CSS Animation: Sun behind Cloud --- */
        .scene-container {
            position: relative;
            width: 180px;
            height: 120px;
            margin-bottom: 10px;
        }

        .sun {
            width: 60px;
            height: 60px;
            background: var(--sun-color);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--sun-glow);
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1;
            animation: sun-pulse 4s infinite alternate;
        }

        /* Sun Rays */
        .sun::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, transparent 60%, rgba(255, 235, 59, 0.4) 70%, transparent 72%);
            border-radius: 50%;
            animation: rotate-slow 10s linear infinite;
        }

        .cloud {
            width: 160px;
            height: 60px;
            background: var(--cloud-color);
            border-radius: 100px;
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 3;
            animation: float-cloud 6s ease-in-out infinite;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: var(--cloud-color);
            border-radius: 50%;
        }

        .cloud::before {
            width: 70px;
            height: 70px;
            top: -35px;
            left: 25px;
        }

        .cloud::after {
            width: 50px;
            height: 50px;
            top: -20px;
            left: 85px;
        }

        /* --- Weather Condition Text --- */
        .condition {
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .condition span {
            opacity: 0.9;
        }

        /* --- Hourly Scroll Strip --- */
        .hourly-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.7;
            margin-left: 5px;
        }

        .hourly-strip {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 5px;
            scroll-snap-type: x mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .hourly-strip::-webkit-scrollbar {
            display: none;
        }

        .hour-item {
            flex: 0 0 auto;
            width: 65px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            scroll-snap-align: center;
            transition: background 0.3s;
        }

        .hour-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .hour-time {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .hour-icon {
            width: 24px;
            height: 24px;
            position: relative;
        }

        .hour-temp {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* --- 5-Day Forecast --- */
        .daily-section {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .daily-section::-webkit-scrollbar {
            width: 4px;
        }
        .daily-section::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
        }

        .day-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .day-item:last-child {
            border-bottom: none;
        }

        .day-name {
            width: 35%;
            font-weight: 500;
        }

        .day-icon {
            width: 40px;
            height: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Forecast Range Bars (Visual Polish) --- */
        .day-range {
            flex-grow: 1;
            margin-left: 15px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
        }

        .day-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #ffeb3b, #ff9800);
            border-radius: 2px;
        }

        .day-temps {
            width: 60px;
            text-align: right;
            font-size: 0.9rem;
            margin-left: 10px;
        }

        .day-temps .low {
            color: rgba(255, 255, 255, 0.5);
            margin-right: 4px;
        }

        /* --- Pure CSS Icons --- */
        /* Sun */
        .ico-sun {
            width: 100%;
            height: 100%;
            background: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
            position: relative;
        }
        .ico-sun::after {
            content: '';
            position: absolute;
            top: -20%; left: -20%; width: 140%; height: 140%;
            background: repeating-radial-gradient(circle, transparent 0, transparent 6px, rgba(255, 235, 59, 0.2) 7px, transparent 8px);
            animation: rotate-slow 8s linear infinite;
        }

        /* Cloud */
        .ico-cloud {
            width: 30px;
            height: 14px;
            background: #fff;
            border-radius: 10px;
            position: relative;
        }
        .ico-cloud::before, .ico-cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .ico-cloud::before { width: 14px; height: 14px; top: -7px; left: 4px; }
        .ico-cloud::after { width: 10px; height: 10px; top: -4px; left: 16px; }

        /* Rain */
        .ico-rain {
            width: 30px;
            height: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rain-cloud {
            width: 30px;
            height: 10px;
            background: #d1d1d1;
            border-radius: 10px;
            position: relative;
            z-index: 2;
        }
        .rain-cloud::before, .rain-cloud::after {
            content: '';
            position: absolute;
            background: #d1d1d1;
            border-radius: 50%;
        }
        .rain-cloud::before { width: 12px; height: 12px; top: -6px; left: 3px; }
        .rain-cloud::after { width: 10px; height: 10px; top: -4px; left: 14px; }
        
        .rain-drop {
            width: 2px;
            height: 6px;
            background: #4facfe;
            margin-top: 2px;
            border-radius: 2px;
            animation: rain-fall 1s infinite linear;
        }
        .drop-1 { margin-left: -8px; animation-delay: 0.1s; }
        .drop-2 { margin-left: 0px; animation-delay: 0.3s; }
        .drop-3 { margin-left: 8px; animation-delay: 0.5s; }

        /* --- Animations --- */
        @keyframes sun-pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--sun-glow); }
            100% { transform: scale(1.1); box-shadow: 0 0 40px var(--sun-glow); }
        }

        @keyframes rotate-slow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes float-cloud {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        @keyframes rain-fall {
            0% { transform: translateY(0); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(10px); opacity: 0; }
        }

        /* --- Number Rolling Transition Class --- */
        .rolling {
            animation: roll-number 0.6s ease-in-out;
        }

        @keyframes roll-number {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="widget">
        <!-- Header -->
        <div class="header">
            <div>
                <div class="location">San Francisco, CA</div>
                <div class="date" id="current-date">Mon, 12 Oct</div>
            </div>
            <button class="toggle-btn" id="unit-toggle">°F / °C</button>
        </div>

        <!-- Hero Section -->
        <div class="hero">
            <!-- Animated CSS Scene -->
            <div class="scene-container">
                <div class="sun"></div>
                <div class="cloud"></div>
            </div>

            <!-- Temperature -->
            <div class="temperature-container">
                <div class="temp-display" id="main-temp">
                    72<span class="unit">°</span>
                </div>
            </div>

            <!-- Condition -->
            <div class="condition">
                <div class="hour-icon ico-cloud"></div>
                <span>Partly Cloudy</span>
            </div>
        </div>

        <!-- Hourly Forecast -->
        <div class="hourly-section">
            <div class="section-title">Hourly Forecast</div>
            <div class="hourly-strip" id="hourly-strip">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- 5 Day Forecast -->
        <div class="daily-section">
            <div class="section-title">5-Day Forecast</div>
            <div id="daily-list">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        // --- Data Simulation ---
        const hourData = [

            { time: '4 PM', temp: 71, type: 'rain' },
            { time: '5 PM', temp: 68, type: 'rain' },
            { time: '6 PM', temp: 66, type: 'cloud' },
            { time: '7 PM', temp: 64, type: 'sun' },

        const dayData = [

            { day: 'Wed', high: 71, low: 59, type: 'cloud' },

        function getIconHTML(type, size = 'normal') {
            if (size === 'small') {
                if (type === 'sun') return '<div class="ico-sun"></div>';
                if (type === 'cloud') return '<div class="ico-cloud"></div>';
                if (type === 'rain') return '<div class="ico-rain"><div class="rain-cloud"></div><div class="rain-drop drop-1"></div><div class="rain-drop drop-2"></div><div class="rain-drop drop-3"></div></div>';
            }
            // Standard sizes (used in hero or larger contexts)
            return ''; 
        }

        function convertTemp(f) {
            return Math.round((f - 32) * 5 / 9);
        }

        function getTempDisplay(f) {
            return isFahrenheit ? f : convertTemp(f);
        }

        // --- DOM Elements ---
        const mainTempEl = document.getElementById('main-temp');
        const unitBtn = document.getElementById('unit-toggle');
        const hourlyStrip = document.getElementById('hourly-strip');
        const dailyList = document.getElementById('daily-list');
        const currentDateEl = document.getElementById('current-date');

        // --- Render Functions ---

        function renderHourly() {
            hourlyStrip.innerHTML = '';
            hourData.forEach(h => {
                const temp = getTempDisplay(h.temp);
                const el = document.createElement('div');
                el.className = 'hour-item';
                el.innerHTML = `
                    <div class="hour-time">${h.time}</div>
                    <div class="hour-icon">${getIconHTML(h.type, 'small')}</div>
                    <div class="hour-temp">${temp}°</div>
                `;
                hourlyStrip.appendChild(el);
            });
        }

            dailyList.innerHTML = '';

            const minL = Math.min(...dayData.map(d => d.low));
            const maxH = Math.max(...dayData.map(d => d.high));
            const range = maxH - minL;

            dayData.forEach(d => {
                const high = getTempDisplay(d.high);
                const low = getTempDisplay(d.low);
                
                // Calculate percentages for the bar
