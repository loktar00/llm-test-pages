    'use strict';
    const c = document.getElementById('cv');
    const ctx = c.getContext('2d', { alpha: false });

    ctx.fillRect(0,0,1,1);

    ctx.fillRect(0,0,cpw,cph);
    let W = c.width;

<body>
<canvas id="cv"></canvas>
<script>
(function(){
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
let DPR = 1;
function DPR2(){ return 1; }
DPR = Math.min(1, 2);
function DPR2(){ return DPR; }
const offscreen = document.createElement('canvas');
const oc = offscreen.getContext('2d');
const view = document.createElement('canvas');
const vc = view.getContext('2d');
let cols = 200, rows = 200, Cell = 14;
let W = 1, H = 1;
let cw = 1, ch = 1;
function setupCanvas(){
  const w = window.innerWidth || 100;
  const h = window.innerHeight || 100;
  W = Math.max(2, Math.floor(w));
  H = Math.max(2, Math.floor(h));
  Cell = 14;
  cols = Math.floor(W / Cell);
  rows = Math.floor(H / Cell);
  cols = Math.max(1, cols);
  rows = Math.max(1, rows);
  cw = cols;
  ch = rows;
  cv.width = W;
  cv.height = H;
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  offscreen.width = cols;
  offscreen.height = rows;
  view.width = W;
  view.height = H;
  if (ctx && ctx.fillRect) { ctx.fillStyle = '#050610'; ctx.fillRect(0,0,W,H); }
  if (vc && vc.fillRect) { vc.fillStyle = '#050610'; vc.fillRect(0,0,W,H); }
}
setupCanvas();
window.addEventListener('resize', function(){ setupCanvas(); });

let CELL_AGE = null, CELL_LIFE = null, CELL_X = 0, CELL_Y = 0;
function alloc(){
  CELL_AGE = new Uint32Array(cols * rows);
  CELL_LIFE = new Uint8Array(cols * rows);
  CELL_X = 0; CELL_Y = 0;
}
alloc();

const BLANK = new Uint32Array(1)[0];

function step(){
  const n = cols * rows;
  const age = CELL_AGE;
  const live = CELL_LIFE;
  const next = new Uint8Array(n);
  const agelist = new Uint32Array(n);
  const C = cols;
  const R = rows;
  for (let i = 0; i < n; i++) {
    const x = (i % C);
    const y = (i / C | 0);
    const xm = (x - 1 + C) % C;
    const xp = (x + 1) % C;
    const ymR = (y - 1 + R) % R * C;
    const ypR = (y + 1) % R * C;
    let count = 0;
    count += live[ymR + xm] + live[ymR + x] + live[ymR + xp];
    count += live[y * C + xm] + live[y * C + x] + live[y * C + xp];
    count += live[ypR + xm] + live[ypR + x] + live[ypR + xp];
    const idx = y * C + x;
    const now = live[idx];
    const nextV = (now > 0 && count === 3) || (count === 3);
    const idx2 = y * C + x;
    next[idx2] = nextV ? 1 : 0;
    agelist[idx2] = nextV ? (age[idx] + 1) : (age[idx] * (now > 0 ? 1 : 0));
  }
  // swap
  for (let i = 0; i < n; i) {
    CELL_LIFE[i] = next[i];
    CELL_AGE[i] = agelist[i];
  }
}
</script>
