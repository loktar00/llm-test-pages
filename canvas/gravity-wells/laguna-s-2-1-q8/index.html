<!DOCTYPE html>
<html>
<head>
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let w=canvas.width=innerWidth;
let h=canvas.height=innerHeight;
addEventListener('resize',()=>{w=canvas.width=innerWidth;h=canvas.height=innerHeight});
const G=0.3;
const particles=[];
const wells=[];
for(let i=0;i<4;i++){
  wells.push({x:Math.random()*w,y:Math.random()*h,m:300+Math.random()*200,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3});
}
function spawn(){
  for(let i=0;i<300;i++){
    let edge=Math.floor(Math.random()*4);
    let x,y;
    if(edge==0){x=0;y=Math.random()*h}
    else if(edge==1){x=w;y=Math.random()*h}
    else if(edge==2){y=0;x=Math.random()*w}
    else{y=h;x=Math.random()*w}
    particles.push({x,y,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,life:1,age:0});
  }
}
function update(){
  // Move wells
  for(let well of wells){
    well.x+=well.vx;
    well.y+=well.vy;
    if(well.x<50||well.x>w-50)well.vx*=-1;
    if(well.y<50||well.y>h-50)well.vy*=-1;
  }
  
  // Spawn particles
  spawn();
  
  // Limit particles
  if(particles.length>8000){
    particles.splice(0,particles.length-8000);
  }
  
  // Update particles
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    for(let well of wells){
      let dx=well.x-p.x;
      let dy=well.y-p.y;
      let dist=Math.sqrt(dx*dx+dy*dy)+1;
      let force=G*well.m/(dist*dist);
      p.vx+=dx/dist*force;
      p.vy+=dy/dist*force;
    }
    p.x+=p.vx;
    p.y+=p.vy;
    p.age+=0.002;
    // Wrap or kill
    if(p.x<-50||p.x>w+50||p.y<-50||p.y>h+50){
      particles.splice(i,1);
    }
  }
}
function draw(){
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation='lighter';
  for(let p of particles){
    let alpha=Math.max(0,1-p.age);
    ctx.fillStyle=`hsla(180,100%,80%,${alpha*0.4})`;
    ctx.fillRect(p.x,p.y,2,2);
  }
  ctx.globalCompositeOperation='source-over';
}
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
