<!DOCTYPE html>
<html>
<head>
<style>
body,html{margin:0;padding:0;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
addEventListener('resize',()=>{w=canvas.width=innerWidth;h=canvas.height=innerHeight});

const TILE=24;
const GX=Math.ceil(w/TILE), GY=Math.ceil(h/TILE);
let grid=[], torches=[], visited=[], explorer;

function init(){
  grid=Array.from({length:GY},()=>new Uint8Array(GX).fill(1));
  visited=Array.from({length:GY},()=>new Uint8Array(GX).fill(0));
  torches=[];
  explorer={x:0,y:0,d:0,px:0,py:0,path:[],target:null};
}

function carveRoom(x,y,rw,rh){
  for(let i=0;i<rh;i++){
    for(let j=0;j<rw;j++){
      const xx=x+j, yy=y+i;
      if(xx>=0&&yy>=0&&xx<GX&&yy<GY){
        grid[yy][xx]=0;
        visited[yy][xx]=1;
      }
    }
  }
  // torches at corners
  for(const [dx,dy] of [[0,0],[rw-1,0],[0,rh-1],[rw-1,rh-1]]){
    const tx=x+dx, ty=y+dy;
    if(tx>=0&&ty>=0&&tx<GX&&ty<GY&&grid[ty][tx]===0){
      torches.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,size:Math.random()*0.4+0.6});
    }
  }
}

function carveCorridor(x1,y1,x2,y2){
  if(x1<x2){for(let x=x1;x<=x2;x++){if(grid[y1][x]&&!visited[y1][x])grid[y1][x]=0;}}
  else {for(let x=x1;x>=x2;x--){if(grid[y1][x]&&!visited[y1][x])grid[y1][x]=0;}}
  if(y1<y2){for(let y=y1;y<=y2;y++){if(grid[y][x2]&&!visited[y][x2])grid[y][x2]=0;}}
  else {for(let y=y1;y>=y2;y--){if(grid[y][x2]&&!visited[y][x2])grid[y][x2]=0;}}
  visited[y2][x2]=1;
}

let rooms=[], phase='growing', growTimer=0, fadeAlpha=0, explorerStep=0;

function startDungeon(){
  init();
  rooms=[];
  let sx=Math.floor(GX/2), sy=Math.floor(GY/2);
  const rw=4+Math.floor(Math.random()*3), rh=4+Math.floor(Math.random()*3);
  carveRoom(sx,sy,rw,rh);
  rooms.push({x:sx,y:sy,w:rw,h:rh});
  explorer.x=sx+rw/2|0; explorer.y=sy+rh/2|0;
  growTimer=0;
}

function grow(){
  growTimer++;
  if(rooms.length>40||growTimer>2000) return;
  
  const last=rooms[rooms.length-1];
  const dir=Math.floor(Math.random()*4);
  const dirs=[[1,0],[0,1],[-1,0],[0,-1]];
  const [dx,dy]=dirs[dir];
  
  const rw=3+Math.floor(Math.random()*3), rh=3+Math.floor(Math.random()*3);
  const nx=last.x+last.w+dx*2, ny=last.y+last.h*dy+(dy>0?rh:0);
  
  let adjX=last.x+last.w/2|0, adjY=last.y+last.h/2|0;
  let newX=last.x+(dx==1?last.w:dx==-1?-rw:0)+dx*2;
  let newY=last.y+(dy==-1?-rh:dy==1?last.h:0)+dy*2;
  if(dx!=0) newY=last.y+last.h/2|0;
  if(dy!=0) newX=last.x+last.w/2|0;
  
  if(newX<1||newX+rw>=GX-1||newY<1||newY+rh>=GY-1) return;
  
  carveCorridor(adjX,adjY,newX+rw/2|0,newY+rh/2|0);
  carveRoom(newX,newY,rw,rh);
  rooms.push({x:newX,y:newY,w:rw,h:rh});
  
  // torches along corridor
  for(let i=0;i<Math.floor(Math.hypot(adjX-newX,adjY-newY));i++){
    const tx=adjX+(newX-adjX)*i*.1|0, ty=adjY+(newY-adjY)*i*.1|0;
    if(grid[ty]&&grid[ty][tx]===0&&Math.random()<0.4){
      torches.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,size:Math.random()*0.4+0.6});
    }
  }
}

function updateExplorer(){
  const dirs=[[1,0],[0,1],[-1,0],[0,-1]];
  let best=null,bd=1e9;
  for(let d=0;d<4;d++){
    const [dx,dy]=dirs[d];
    const nx=explorer.x+dx, ny=explorer.y+dy;
    if(nx<0||ny<0||nx>=GX||ny>=GY) continue;
    if(grid[ny][nx]) continue;
    // prefer unvisited
    let score=visited[ny][nx]?d+50:0;
    if(score<bd){bd=score;best=d;}
  }
  if(best!==null){
    const [dx,dy]=dirs[best];
    explorer.x+=dx;explorer.y+=dy;
    visited[explorer.y][explorer.x]=1;
  }else{
    // random walk fallback
    const valid=[];
    for(let d=0;d<4;d++){
      const [dx,dy]=dirs[d];
      const nx=explorer.x+dx,ny=explorer.y+dy;
      if(nx>=0&&ny>=0&&nx<GX&&ny<GY&&!grid[ny][nx])valid.push(d);
    }
    if(valid.length){
      const d=valid[Math.random()*valid.length|0];
      explorer.x+=dirs[d][0];explorer.y+=dirs[d][1];
    }
  }
}

function drawTorch(x,y,size){
  const t=performance.now()/1000;
  const flicker=1+Math.sin(t*13+x)*0.1+Math.sin(t*7.3+y)*0.07+Math.sin(t*21.1)*0.05;
  const radius=8*size*flicker;
  const grad=ctx.createRadialGradient(x,y,0,x,y,radius);
  grad.addColorStop(0,'rgba(255,220,120,0.8)');
  grad.addColorStop(0.4,'rgba(255,140,30,0.4)');
  grad.addColorStop(1,'rgba(255,60,10,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.arc(x,y,radius,0,Math.PI*2);
  ctx.fill();
}

function draw(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,w,h);
  
  // background stone
  ctx.fillStyle='#1a120a';
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#2a1e12';
  for(let y=0;y<h;y+=TILE){
    for(let x=0;x<TILE;x+=2){
      ctx.fillRect(x+y%4,y,1,TILE/2);
    }
  }
  
  // draw grid
  for(let y=0;y<GY;y++){
    for(let x=0;x<GX;x++){
      if(grid[y][x]){
        ctx.fillStyle='#3a2e20';
        ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
        ctx.strokeStyle='#2a1e12';
        ctx.strokeRect(x*TILE,y*TILE,TILE,TILE);
      }else{
        ctx.fillStyle='#5d4e37';
        ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
      }
    }
  }
  
  // fog of war (dim unvisited)
  ctx.fillStyle='rgba(0,0,0,0.6)';
  for(let y=0;y<GY;y++){
    for(let x=0;x<GX;x++){
      if(!visited[y][x]){
        ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
      }
    }
  }
  
  // torches
  for(const t of torches){
    drawTorch(t.x,t.y,t.size);
  }
  
  // explorer
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(explorer.x*TILE+TILE/2,explorer.y*TILE+TILE/2,TILE*0.25,0,Math.PI*2);
  ctx.fill();
  
  if(fadeAlpha>0){
    ctx.fillStyle=`rgba(0,0,0,${fadeAlpha})`;
    ctx.fillRect(0,0,w,h);
  }
}

function loop(){
  if(phase==='growing'){
    grow();
    if(rooms.length%8===0) updateExplorer();
  }else if(phase==='exploring'){
    if(explorerStep%3===0)updateExplorer();
    explorerStep++;
  }else if(phase==='fading'){
    fadeAlpha+=0.01;
    if(fadeAlpha>=1)startDungeon();
  }
  
  draw();
  requestAnimationFrame(loop);
}

startDungeon();
loop();

// cycle phases
let genCount=0;
setInterval(()=>{
  genCount++;
  if(phase==='growing'&&genCount>150){
    phase='exploring';
    setTimeout(()=>phase='fading',8000);
    genCount=0;
  }
},200);
</script>
</body>
</html>
