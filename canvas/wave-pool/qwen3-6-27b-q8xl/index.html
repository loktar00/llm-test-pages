<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Interference Tank</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Simulation parameters
const SIM_SCALE = 4; // pixels per simulation cell
let W, H, simW, simH;

// Wave simulation buffers (typed arrays for performance)
let buf1, buf2, bufTemp;
const DAMPING = 0.997;
const WAVE_SPEED = 0.28;

// Sources
const sources = [];
const NUM_SOURCES = 5;

// Barriers with slits
const barriers = [];

function init() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  simW = Math.floor(W / SIM_SCALE);
  simH = Math.floor(H / SIM_SCALE);

  buf1 = new Float32Array(simW * simH);
  buf2 = new Float32Array(simW * simH);
  bufTemp = new Float32Array(simW * simH);

  // Create sources
  sources.length = 0;
  for (let i = 0; i < NUM_SOURCES; i++) {
    sources.push({
      x: Math.random() * simW,
      y: Math.random() * simH * 0.4 + simH * 0.1,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.15,
      freq: 0.08 + Math.random() * 0.06,
      freqTarget: 0.08 + Math.random() * 0.06,
      amp: 300 + Math.random() * 200,
      phase: Math.random() * Math.PI * 2,
      color: [100 + Math.random() * 50, 150 + Math.random() * 100, 255]
    });
  }

  // Create barriers with slits
  barriers.length = 0;
  const barrierX1 = Math.floor(simW * 0.3);
  const barrierX2 = Math.floor(simW * 0.6);
  const slitSize1 = 8 + Math.floor(Math.random() * 10);
  const slitSize2 = 6 + Math.floor(Math.random() * 12);
  const slitY1 = Math.floor(simH * 0.35 + Math.random() * simH * 0.3);
  const slitY2 = Math.floor(simH * 0.3 + Math.random() * simH * 0.4);

  barriers.push({ x: barrierX1, slitStart: slitY1 - Math.floor(slitSize1/2), slitEnd: slitY1 + Math.floor(slitSize1/2) });
  barriers.push({ x: barrierX2, slitStart: slitY2 - Math.floor(slitSize2/2), slitEnd: slitY2 + Math.floor(slitSize2/2) });
}

function updateSources(dt) {
  for (let s of sources) {
    // Move sources
    s.x += s.vx;
    s.y += s.vy;

    // Bounce off walls
    if (s.x < 10 || s.x > simW - 10) s.vx *= -1;
    if (s.y < 10 || s.y > simH * 0.5) s.vy *= -1;
    s.x = Math.max(10, Math.min(simW - 10, s.x));
    s.y = Math.max(10, Math.min(simH * 0.5, s.y));

    // Slowly change frequency
    if (Math.random() < 0.005) {
      s.freqTarget = 0.06 + Math.random() * 0.1;
    }
    s.freq += (s.freqTarget - s.freq) * 0.01;

    s.phase += s.freq * 60 * dt;
  }
}

function simulate() {
  // Inject sources
  for (let s of sources) {
    const sx = Math.floor(s.x);
    const sy = Math.floor(s.y);
    const val = Math.sin(s.phase) * s.amp;
    const radius = 2;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const nx = sx + dx;
        const ny = sy + dy;
        if (nx > 0 && nx < simW - 1 && ny > 0 && ny < simH - 1) {
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist <= radius) {
            const factor = 1 - dist / (radius + 1);
            buf1[ny * simW + nx] += val * factor;
          }
        }
      }
    }
  }

  // Wave equation step
  for (let y = 1; y < simH - 1; y++) {
    for (let x = 1; x < simW - 1; x++) {
      const idx = y * simW + x;

      // Check barriers
      let blocked = false;
      for (let b of barriers) {
        if (x === b.x && (y < b.slitStart || y > b.slitEnd)) {
          blocked = true;
          break;
        }
      }
      if (blocked) {
        buf2[idx] = 0;
        continue;
      }

      // Damped wave equation
      const laplacian = buf1[idx - 1] + buf1[idx + 1] + buf1[idx - simW] + buf1[idx + simW] - 4 * buf1[idx];
      buf2[idx] = (2 * buf1[idx] - bufTemp[idx] + WAVE_SPEED * WAVE_SPEED * laplacian) * DAMPING;
    }
  }

  // Swap buffers
  const temp = bufTemp;
  bufTemp = buf1;
  buf1 = buf2;
  buf2 = temp;
}

// Precompute color lookup table for performance
const colorLUT = new Uint8Array(512 * 4);
function buildColorLUT() {
  for (let i = 0; i < 512; i++) {
    const v = (i - 256) / 256; // -1 to 1
    const idx = i * 4;

    if (v < 0) {
      // Troughs: dark blue to navy
      const t = -v;
      colorLUT[idx] = Math.floor(5 + t * 20);
      colorLUT[idx + 1] = Math.floor(10 + t * 30);
      colorLUT[idx + 2] = Math.floor(40 + t * 80);
      colorLUT[idx + 3] = 255;
    } else {
      // Crests: white to light blue
      const t = v;
      colorLUT[idx] = Math.floor(180 + t * 75);
      colorLUT[idx + 1] = Math.floor(200 + t * 55);
      colorLUT[idx + 2] = Math.floor(220 + t * 35);
      colorLUT[idx + 3] = 255;
    }
  }
}
buildColorLUT();

let imageData, pixels;

function render() {
  if (!imageData || imageData.width !== W || imageData.height !== H) {
    imageData = ctx.createImageData(W, H);
    pixels = imageData.data;
  }

  const maxVal = 500;

  for (let y = 0; y < H; y++) {
    const sy = Math.floor(y / SIM_SCALE);
    const py = Math.min(sy, simH - 2);

    for (let x = 0; x < W; x++) {
      const sx = Math.floor(x / SIM_SCALE);
      const px = Math.min(sx, simW - 2);

      const idx = py * simW + px;
      const val = buf1[idx];

      // Map value to color index (-256 to 255 range)
      let ci = Math.floor(val / maxVal * 256) + 256;
      ci = Math.max(0, Math.min(511, ci));

      // Specular sparkle at crests
      let sparkle = 0;
      if (val > maxVal * 0.7) {
        sparkle = Math.floor((val - maxVal * 0.7) / (maxVal * 0.3) * 60);
      }

      const lutIdx = ci * 4;
      const pIdx = (y * W + x) * 4;

      pixels[pIdx] = Math.min(255, colorLUT[lutIdx] + sparkle);
      pixels[pIdx + 1] = Math.min(255, colorLUT[lutIdx + 1] + sparkle);
      pixels[pIdx + 2] = Math.min(255, colorLUT[lutIdx + 2] + sparkle);
      pixels[pIdx + 3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);

  // Draw barrier outlines on top
  ctx.strokeStyle = 'rgba(200, 220, 255, 0.6)';
  ctx.lineWidth = 2;
  for (let b of barriers) {
    const bx = b.x * SIM_SCALE;
    // Top segment
    ctx.beginPath();
    ctx.moveTo(bx, 0);
    ctx.lineTo(bx, b.slitStart * SIM_SCALE);
    ctx.stroke();
    // Bottom segment
    ctx.beginPath();
    ctx.moveTo(bx, b.slitEnd * SIM_SCALE);
    ctx.lineTo(bx, H);
    ctx.stroke();
  }

  // Draw source indicators
  for (let s of sources) {
    const cx = s.x * SIM_SCALE;
    const cy = s.y * SIM_SCALE;
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${s.color[0]}, ${s.color[1]}, ${s.color[2]}, 0.8)`;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

let lastTime = 0;
function animate(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.033); // cap at ~30fps min
  lastTime = time;

  updateSources(dt);

  // Run multiple simulation steps per frame for stability
  const steps = 2;
  for (let i = 0; i < steps; i++) {
    simulate();
  }

  render();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  init();
});

init();
requestAnimationFrame(animate);
</script>
</body>
</html>
