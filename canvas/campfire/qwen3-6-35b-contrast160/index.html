<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width-width, initial-scale=1.0">
    <title>Campfire Night</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050510; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

// --- Configuration ---
const CFG = {
    fireColor: ['#ff4500', '#ff8c00', '#ffd700', '#ffffff'],
    stoneColor: ['#4a4a4a', '#333333', '#555555'],
    grassColor: ['#0a1a0a', '#1a2a1a', '#0d1d0d'],
    treeColor: '#1a1512',
    starCount: 200,
    logCount: 5,
    emberCount: 60,
    smokeCount: 40
};

// --- State ---
let stars = [];
let meteors = [];
let stones = [];
let logs = [];
let embers = [];
let smoke = [];
let grassBlades = [];
let time = 0;

// --- Resize ---
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    initScene();
}
window.addEventListener('resize', resize);

// --- Helpers ---
function rand(min, max) { return Math.random() * (max - min) + min; }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

// --- Initialization ---
function initScene() {
    // Stars
    stars = [];
    for (let i = 0; i < CFG.starCount; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, size: Math.random() * 1.5 + 0.5, twinkle: Math.random() * Math.PI * 2 });
    }

    // Stones (Ring)
    stones = [];
    const stoneRadius = 120;
    const numStones = 16;
    for (let i = 0; i < numStones; i++) {
        const angle = (i / numStones) * Math.PI * 2;
        const r = stoneRadius + rand(-10, 10);
        stones.push({
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * r * 0.3, // Perspective squash
            w: rand(15, 25),
            h: rand(10, 15),
            color: CFG.stoneColor[Math.floor(Math.random() * CFG.stoneColor.length)]
        });
    }

    // Logs
    logs = [];
    const logAngles = [0, Math.PI / 3, Math.PI * 2 / 3];
    logAngles.forEach((a, i) => {
        logs.push({
            angle: a + rand(-0.1, 0.1),
            length: 100,
            width: 20,
            life: 1.0,
            decay: rand(0.0001, 0.0003),
            x: cx,
            y: cy + 20
        });
    });

    // Grass Blades
    grassBlades = [];
    const grassCount = 300;
    for (let i = 0; i < grassCount; i++) {
        const gx = rand(0, W);
        const gy = rand(H * 0.7, H);
        // Only grass near the fire or in foreground
        if (dist(gx, gy, cx, cy) < 400 || gy > H * 0.8) {
            grassBlades.push({
                x: gx, y: gy,
                h: rand(5, 15),
                angle: rand(-0.2, 0.2),
                sway: Math.random() * Math.PI * 2
            });
        }
    }
}

// --- Particle Systems ---
class Ember {
    constructor() { this.reset(); }
    reset() {
        this.x = cx + rand(-20, 20);
        this.y = cy + 10;
        this.vx = rand(-2, 2);
        this.vy = rand(-3, -1);
        this.life = 1.0;
        this.decay = rand(0.005, 0.02);
        this.size = rand(1, 3);
    }
    update() {
        this.x += this.vx + Math.sin(time * 0.05 + this.x) * 0.5; // Spiral jitter
        this.y += this.vy;
        this.life -= this.decay;
        this.vx *= 0.99;
        this.vy *= 0.99;
        if (this.life <= 0) this.reset();
    }
    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Smoke {
    constructor() { this.reset(); }
    reset() {
        this.x = cx + rand(-10, 10);
        this.y = cy - 20;
        this.vx = rand(-0.5, 0.5);
        this.vy = rand(-1, -2);
        this.life = 1.0;
        this.decay = rand(0.002, 0.005);
        this.size = rand(10, 30);
    }
    update() {
        this.x += this.vx + Math.sin(time * 0.02) * 0.2;
        this.y += this.vy;
        this.life -= this.decay;
        this.size += 0.2;
        if (this.life <= 0) this.reset();
    }
    draw() {
        ctx.globalAlpha = this.life * 0.2;
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// --- Drawing Functions ---

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#000011');
    grad.addColorStop(0.5, '#050520');
    grad.addColorStop(1, '#1a0a0a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    stars.forEach(s => {
        const twinkle = Math.sin(time * 0.05 + s.twinkle) * 0.5 + 0.5;
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Meteors
    if (Math.random() < 0.005) {
        meteors.push({ x: rand(0, W), y: 0, vx: rand(2, 5), vy: rand(2, 5), life: 1.0 });
    }
    meteors.forEach((m, i) => {
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.02;
        ctx.strokeStyle = `rgba(255, 255, 255, ${m.life})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 5, m.y - m.vy * 5);
        ctx.stroke();
        if (m.life <= 0) meteors.splice(i, 1);
    });
}

function drawGround() {
    // Base ground
    const grad = ctx.createLinearGradient(0, H * 0.6, 0, H);
    grad.addColorStop(0, '#0a0a0a');
    grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H * 0.6, W, H);

    // Firelight on ground
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const glow = ctx.createRadialGradient(cx, cy + 20, 10, cx, cy + 20, 300);
    glow.addColorStop(0, 'rgba(255, 100, 0, 0.3)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
}

function drawStones() {
    stones.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, s.w, s.h, 0, 0, Math.PI * 2);
        ctx.fill();
        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.ellipse(s.x, s.y - 2, s.w * 0.8, s.h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawLogs() {
    logs.forEach(log => {
        ctx.save();
        ctx.translate(log.x, log.y);
        ctx.rotate(log.angle);
        
        // Color based on life (darkens as it collapses)
        const r = 50 + (1 - log.life) * 100;
        const g = 20 + (1 - log.life) * 30;
        const b = 10;
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        
        // Draw log shape
        ctx.beginPath();
        ctx.roundRect(-log.length/2, -log.width/2, log.length, log.width, 5);
        ctx.fill();
        
        // Texture/Char marks
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for(let i=0; i<3; i++) {
            ctx.fillRect(-log.length/2 + i*30, -log.width/2 + 2, 10, log.width - 4);
        }

        ctx.restore();
    });
}

function drawGrass() {
    ctx.strokeStyle = '#2a3a2a';
    ctx.lineWidth = 2;
    
    // Cricket movement simulation
    const cricketX = cx + Math.sin(time * 0.01) * 100;
    
    grassBlades.forEach(g => {
        const sway = Math.sin(time * 0.05 + g.sway) * 0.1;
        const distFromFire = dist(g.x, g.y, cx, cy);
        const flicker = Math.sin(time * 0.1 + g.x) * 0.2 + 0.8; // Firelight flicker influence
        
        // Cricket effect: nearby grass jitter
        if (Math.abs(g.x - cricketX) < 20) {
            ctx.strokeStyle = '#4a5a4a'; // Brighter when lit
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(g.x, g.y);
            ctx.lineTo(g.x + Math.sin(time * 0.5) * 5, g.y - g.h);
            ctx.stroke();
        } else {
            ctx.strokeStyle = `rgba(20, 40, 20, ${flicker})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(g.x, g.y);
            ctx.quadraticCurveTo(g.x + sway * 10, g.y - g.h / 2, g.x + sway * 20, g.y - g.h);
            ctx.stroke();
        }
    });
}

function drawTrees() {
    // Left Tree
    ctx.fillStyle = CFG.treeColor;
    ctx.fillRect(100, H * 0.2, 40, H * 0.8);
    // Right Tree
    ctx.fillRect(W - 140, H * 0.3, 40, H * 0.7);

    // Shadows (Jittering)
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = '#000';
    
    const jitter = Math.sin(time * 0.1) * 5;
    
    // Left Tree Shadow
    ctx.beginPath();
    ctx.moveTo(100 + jitter, H * 0.2);
    ctx.lineTo(140 + jitter, H);
    ctx.lineTo(160 + jitter, H);
    ctx.lineTo(120 + jitter, H * 0.2);
    ctx.fill();

    // Right Tree Shadow
    ctx.beginPath();
    ctx.moveTo(W - 140 - jitter, H * 0.3);
    ctx.lineTo(W - 100 - jitter, H);
    ctx.lineTo(W - 80 - jitter, H);
    ctx.lineTo(W - 120 - jitter, H * 0.3);
    ctx.fill();
    
    ctx.restore();
}

function drawFireParticles() {
    // Smoke
    smoke.forEach(s => { s.update(); s.draw(); });

    // Embers
    embers.forEach(e => { e.update(); e.draw(); });

    // Main Flame (Layered)
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    
    // Outer Flame
    const grad1 = ctx.createRadialGradient(cx, cy, 10, cx, cy - 50, 100);
    grad1.addColorStop(0, 'rgba(255, 69, 0, 0.6)');
    grad1.addColorStop(1, 'rgba(255, 69, 0, 0)');
    ctx.fillStyle = grad1;
    ctx.beginPath();
    ctx.ellipse(cx, cy - 50, 60 + Math.sin(time*0.1)*10, 80 + Math.cos(time*0.15)*20, 0, 0, Math.PI*2);
    ctx.fill();

    // Inner Flame
    const grad2 = ctx.createRadialGradient(cx, cy, 5, cx, cy - 30, 50);
    grad2.addColorStop(0, 'rgba(255, 255, 200, 0.8)');
    grad2.addColorStop(0.5, 'rgba(255, 140, 0, 0.5)');
    grad2.addColorStop(1, 'rgba(255, 69, 0, 0)');
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.ellipse(cx, cy - 30, 30 + Math.sin(time*0.2)*5, 50 + Math.cos(time*0.3)*10, 0, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
}

function drawHeatDistortion() {
    // Simulate heat haze by drawing the scene slightly offset with low opacity
    // This is a cheap trick for performance
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(canvas, cx - 5, cy - 50, 10, 10); // Tiny slice
    ctx.restore();
}

// --- Main Loop ---
function update() {
    time++;
    
    // Update Logs
    logs.forEach(log => {
        log.life -= log.decay;
        if (log.life <= 0) {
            // Respawn
            log.life = 1.0;
            log.angle = rand(0, Math.PI * 2);
            log.x = cx + rand(-10, 10);
            log.y = cy + rand(-5, 5);
        }
    });

    // Ensure ember/smoke counts
    while (embers.length < CFG.emberCount) embers.push(new Ember());
    while (smoke.length < CFG.smokeCount) smoke.push(new Smoke());
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    drawSky();
    drawGround();
    drawTrees();
    drawStones();
    drawLogs();
    drawGrass();
    drawFireParticles();
    
    // Vignette
    const vignette = ctx.createRadialGradient(cx, cy, H * 0.3, cx, cy, H);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Start
resize();
loop();

</script>
</body>
</html>
