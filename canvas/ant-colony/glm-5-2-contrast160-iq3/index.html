<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ant Colony</title>
<style>
  html,body{margin:0;background:#050507;overflow:hidden}
  canvas{display:block;cursor:default}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{willReadStoragBuffer:false});
let W=0,H=0;
const DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

// pheromone fields
const GRID=4;
let gw,gh,gw2,gh2;
let tW,tH;
let trailW,trailH; // work+target pheromone
let trail,work,trailNest;

function initFields(){
  gw=Math.max(8,Math.ceil(W/GRID));
  gh=Math.max(8,Math.ceil(H/GRID));
  tW=gh,gw2,gh2; // unused
  trail=new Float32Array(gw*gh);
  work=new Float32Array(gw*gh);
  trailNest=new Float32Array(gw*gh);
}
initFields();

const nest={x:W*0.5,y:W*0.5,r:28};
nest.x=W*0.5;nest.y=H*0.5;

let ants=[];
let foods=[];
let foodPiles=[];

const params={
  num:120,
  sensorAngle:0.6,
  sensorDist:24,
  turnSpeed:0.7,
  wanderStrength:0.05,
  speed:1.4,
  evp:0.996,
  evw:0.98
};

function spawnFoodPile(){
  const r=15;
  const piles=3;
  const x=(Math.random()*(0.1,W*0.9)+W*0.05);
  const x=(.random()*W);
}
// simpler
function randPos(){
  const margin=80;
  return {x:margin+Math.random()*(W-margin*2),y:margin+Math.random()*(H-margin*2)};
}

function createPile(){
  const p=randPos();
  const cnt=18+Math.floor(Math.random()*15);
  const items=[];
  for(let i=0;i<cnt;i++){
    const a=Math.random()*Math.PI*2;
    const d=Math.sqrt(Math.random())*40;
    items.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,v:1});
  }
  foodPiles.push({x:p.x,y:p.y,r:50,items:items});
}

for(let i=0;i<6;i++)createPile();

function createAnt(){
  return {
    x:nest.x,y:nest.y,
    a:Math.random()*Math.PI*2,
    c:false,
    t:0,
    wob:Math.random()*Math.PI*2,
    trailT:0,
    food:0
  };
}
for(let i=0;i<params.num;i++){
  const a=createAnt();
  a.x=nest.x+(Math.random()-0.5)*40;
  a.y=nest.y+(Math.random()-0.5)*40;
  ants.push(a);
}

function sampleField(field,x,y,ang,dx){
  // returns value at point
  const cx=Math.floor(x/Math.cos(0)+0); // dummy
  const px=x+Math.cos(ang)*dx;
  const py=y+Math.sin(ang)*dx;
  const gx=Math.floor(px/GRID);
  const gy=Math.floor(py/GRID);
  if(gx<0||gy<0||gx>=gw||gy>=gh)return 0;
  return field[gy*gw+gx];
}

function deposit(field,x,y,amt){
  const gx=Math.floor(x/GRID);
  const gy=Math.floor(y/GRID);
  if(gx<0||gy<0||gx>=gw||gy>=gh)return;
  field[gy*gw+gx]+=amt;
}

function evap(){
  const d=0.996;
  // we'll do evaporation in step()
}

// Heat field rendering via offscreen canvas
const fieldCanvas=document.createElement('canvas');
const fctx=fieldCanvas.getContext('2d');
let fieldImgData=null;
let fieldW=0,fieldH=0;

function resizeField(){
  fieldCanvas.width=gw;
  fieldCanvas.height=gh;
  fieldImgData=fctx.createImageData(gw,gh);
  fieldW=gw;fieldH=gh;
}
resizeField();

function drawField(){
  const data=fieldImgData.data;
  const trailF=trail;
  const workF=work;
  // We'll render heatmap. Trail in warm orange. Work in cool blue.
  for(let i=0;i<gw*gh;i++){
    const t=trailF[i];
    const w=workF[i];
    let r,g,bb;
    // Background dark
    r=8;g=4;bb=10;
    // Trail (warm amber
    if(t>0.01){
      const tv=Math.min(1,t*0.05);
      r+=tv*255;
      g+=tv*150;
      bb+=tv*40;
    }
    if(w>0.01){
      const wv=Math.min(1,w*0.02);
      r+=wv*40;
      g+=wv*120;
      bb+=wv*200;
    }
    data[i*4]=Math.min(255,r);
    data[i*4+1]=Math.min(255,g);
    data[i*4+2]=Math.min(255,bb);
  }
  fctx.putImageData(fieldImgData,0,0);
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(fieldCanvas,0,0,W,H);
  ctx.restore();
}

function evapStep(){
  // diffuse+evap
  const decay=0.995;
  const decayWork=0.99;
  // simple evaporation pass
  for(let i=0;i<trail.length;i++){
    trail[i]*=0.995;
    work[i]*=0.99;
  }
  // light diffusion occasionally
  // skip
}

function simStep(){
  // ant movement
  const gw2=1;
  for(let k=0;k<ants.length;k++){
    const an=ants[k];
    an.trailT++;
    // state behavior
    if(an.c){
      // carry home -> go to nest
      const dx=nest.x-an.x;
      const dy=nest.y-an.y;
      const dd=Math.sqrt(dx*dx+dy*dy);
      const tang=Math.atan2(dy,dx);
      an.a+=angleDiff(an.a,tang)*0.5;
      an.wob+=0.1;
      an.a+=(Math.sin(an.wob)*0.12);
      deposit(work,an.x,an.y,2);
      deposit(trail,an.x,an.y,0.5);
      an.x+=Math.cos(an.a)*params.speed;
      an.y+=Math.sin(an.a)*params.speed;
      // boundary
      if(dd<20){
        an.c=false;
        an.food+=1;
      }
    } else {
      // searching -> follow work trail
      // sample 3 directions
      const s=params.sensorAngle;
      const d=params.sensorDist;
      const vl=sampleField(work,an.x,an.y,an.a,d);
      const vlL=sampleField(work,an.x,an.y,an.a-s,d);
      const vlR=sampleField(work,an.x,an.y,an.a-s,d);
      const vL=sampleField(work,an.x,an.y,an.a-s,d);
      const vR=sampleField(work,an.x,an.y,an.a+s,d);
      const vC=vl;
      if(vC>=vL&&vC>=vR){
        // continue
      } else if(vL>vR){
        an.a-=params.turnSpeed*(1-Match());
      } else if(vR>vL){
        an.a+=params.turnSpeed;
      } else {
        an.a+=(Math.random()-0.5)*0.8;
      }
      an.wob+=0.0;
      an.a+=Math.sin(an.wob)*0.06;
      an.x+=Math.cos(an.a)*params.speed;
      an.y+=Math.sin(an.a)*params.speed;
      deposit(trail,an.x,an.y,1);
      deposit(work,an.x,an.y,0.05);
    // boundary
    // food check
  }
}

// helpers
function sampleField(field,x,y,ang,dx){
  const px=x+Math.cos(ang)*dx;
  const py=y+Math.sin(ang)*dx;
  const gx=Math.floor(px/GRID);
  const gy=Math.floor(py/GRID);
  if(gx<0||gy<0||gx>=gw||gy>=gh)return 0;
  return field[gy*gw+gx];
}
function deposit(field,x,y,amt){
  const gx=Math.floor(x/GRID);
  const gy=Math.floor(y/GRID);
  if(gx<0||gy<0||gx>=gw||gy>=gh)return;
  field[gy*gw+gx]+=amt;
}
function angleDiff(a,b){
  let d=b-a;
  while(d<-Math.PI)d+=Math.PI*2;
  while(d>Math.PI)d-=Math.PI*2;
  return d;
}

// main loop
let last=0;
function loop(t){
  const dt=t-last;last=t;
  ctx.fillStyle='#050507';
  ctx.fillRect(0,0,W,H);
  // update ants
  updateAnts();
  updateFood();
  // draw
  drawField();
  drawNest();
  drawFood();
  drawAnts();
  // hud
  drawHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function updateAnts(){
  // evaporation
  for(let i=0;i<trail.length;i++){trail[i]*=params.evp;work[i]*=params.evw;}
  // ants
  for(let i=0;i<ants.length;i++){
    const an=ants[i];
    // sensing
    const sa=params.sensorAngle;
    const sd=params.sensorDist;
    if(!an.c){
      // search -> follow work trail (cool)
      const vL=sampleField(work,an.x,an.y,an.a-sa,sd);
      const vC=sampleField(work,an.x,an.y,an.a,sd);
      const vR=sampleField(work,an.x,an.y,an.a+sa,sd);
      if(vC>vL&&vC>vR){
        // straight
      } else if(vL>vC&&vL>vR){
        an.a-=params.turnSpeed;
      } else if(vR>vC&&vR>vL){
        an.a+=params.turnSpeed;
      } else {
        an.a+=(Math.random()-0.5)*0.8;
      }
      an.wob+=0.05;
      an.a+=Math.sin(an.wob)*0.03;
      deposit(trail,an.x,an.y,1.5);
      deposit(work,an.x,an.y,0.4);
      an.x+=Math.cos(an.a)*params.speed;
      an.y+=Math.sin(an.a)*params.speed;
      // boundary wrap
      // bounce
      if(an.x<10){an.x=10;an.a=Math.PI-an.a+ (0.5*(Math.random()-0.5);}
      if(an.x>W-10){an.x=W-10;an.a=Math.PI-an.a;}
      if(an.y<10){an.y=10;an.a=-an.a;}
      if(an.y>H-10){an.y=H-10;an.a=-an.a;}
      // check food
      for(let pi=0;pi<foodPiles.length;pi++){
        const p=foodPiles[pi];
        const dx=an.x-p.x;const dy=an.y-p.y;
        if(dx*dx+dy*dy<p.r*p.r){
          // found, grab one
          for(let fi=0;fi<p.items.length;fi++){
            const f=p.items[fi];
            if(f.v>0){
              const fdx=an.x-f.x;const fdy=an.y-f.y;
              if(fdx*fdx+fdy*fdy<40*40){
                // pick
                an.c=true;
                an.cfx=f.x;an.cfy=f.y;
                an.cfi=fi;an.cpi=pi;
                f.v=0;
                break;
              }
            }
          }
          break;
        }
      }
    } else {
      // carry to nest
      const dx=nest.x-an.x;const dy=nest.y-an.y;
      const dd=Math.sqrt(dx*dx+dy*dy);
      const tang=Math.atan2(dy,dx);
      an.a+=angleDiff(an.a,tang)*0.5;
      an.wob+=0.04;
      an.a+=Math.sin(an.wob)*0.05;
      deposit(work,an.x,an.y,2);
      deposit(trail,an.x,an.y,0.5);
      an.x+=Math.cos(an.a)*params.speed;
      an.y+=Math.sin(an.a)*params.speed;
      if(dd<20){
        an.c=false;
        // restore item to a new random spot? Actually remove it
        // We need to remove from pile and spawn elsewhere
        const p=foodPiles[an.cpi];
        p.items.splice(an.cfi,1);
        an.cpi=-1;
        // if pile empty -> remove and spawn elsewhere
        if(p.items.length===0){
          foodPiles.splice(foodPiles.indexOf(p),1);
          // spawn new pile elsewhere
          setTimeout(()=>createPile(),50+Math.random()*5);
        }
      }
      if(an.x<10){an.x=10;an.a+=0.2;}
      if(an.x>W-10){an.x=W-10;an.a+=0.2;}
      if(an.y<10){an.y=10;an.a+=0.2;}
      if(an.y>H-10){an.y=H-10;an.a+=0.2;}
    }
  }
}

function updateFood(){
  // food depletion handled in updateAnts
}

function drawNest(){
  // shadow
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(nest.x,nest.y+nest.r*0.8,nest.r*1.2,nest.r*0.5,0,0,Math.PI*2);
  ctx.fill();
  // mound
  const grad=ctx.createRadialGradient(nest.x-nest.r*0.4,nest.y-nest.r*0.4,nest.r*0.2,nest.x,nest.y,nest.r*1.5);
  grad.addColorStop(0,'#3a2a4a');
  grad.addColorStop(0.5,'#1a1014');
  grad.addColorStop(1,'#0a0508');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.arc(nest.x,nest.y,nest.r*1.5,0,Math.PI*2);
  ctx.fill();
  // rim
  ctx.strokeStyle='rgba(60,40,80,0.5)';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(nest.x,nest.y,nest.r*1.5,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawFood(){
  for(let pi=0;pi<foodPiles.length;pi++){
    const p=foodPiles[pi];
    for(let fi=0;fi<p.items.length;fi++){
      const f=p.items[fi];
      ctx.fillStyle='rgba(40,200,60,0.9)';
      ctx.beginPath();
      ctx.arc(f.x,f.y,2+Math.random()*1,0,Math.PI*2);
      ctx.fill();
    }
    // cluster halo
    ctx.fillStyle='rgba(40,200,60,0.05)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
}

function drawAnts(){
  for(let i=0;i<ants.length;i++){
    const an=ants[i];
    ctx.save();
    ctx.translate(an.x,an.y);
    ctx.rotate(an.a);
    if(an.c){
      ctx.fillStyle='#5a3a8a';
      // body
      ctx.beginPath();ctx.ellipse(0,0,3,2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(80,200,80,0.9)';
      ctx.beginPath();ctx.arc(2,0,1.5,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='#1a1018';
      ctx.beginPath();ctx.ellipse(0,0,3,1.5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(40,30,50,0.8)';
      ctx.beginPath();ctx.arc(0,0,1.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

function drawHUD(){
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.font='12px monospace';
  ctx.fillText('Ants: '+ants.length+'   Piles: '+foodPiles.length,12,12);
  ctx.restore();
}
