<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Drawn from Darkness</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cols, rows, cellSize;
const WALL = 0, FLOOR = 1, CORRIDOR = 2;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cellSize = Math.max(10, Math.min(Math.floor(W / 65), Math.floor(H / 40)));
    cols = Math.floor(W / cellSize);
    rows = Math.floor(H / cellSize);
}
resize();
window.addEventListener('resize', () => { resize(); generateDungeon(); });

let grid, revealed, torches, roomList, corridorList;
let revealQueue, revealIndex, revealTimer;
let explorer, explorerTimer, explorerVisited;
let fadeAlpha, fading, fadeDir;
let time = 0;
let dungeonActive = false;

function generateDungeon() {
    grid = Array.from({ length: rows }, () => Array(cols).fill(WALL));
    revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
    torches = [];
    roomList = [];
    corridorList = [];
    revealQueue = [];
    revealIndex = 0;
    revealTimer = 0;
    explorer = { x: 0, y: 0, visited: new Set() };
    explorerTimer = 0;
    explorerVisited = new Set();
    fadeAlpha = 0;
    fading = false;
    fadeDir = 0;
    dungeonActive = true;

    const numRooms = Math.floor(6 + Math.random() * 8);
    const rooms = [];

    for (let attempt = 0; attempt < numRooms * 20 && rooms.length < numRooms; attempt++) {
        const rw = 3 + Math.floor(Math.random() * 5);
        const rh = 3 + Math.floor(Math.random() * 4);
        const rx = 2 + Math.floor(Math.random() * (cols - rw - 4));
        const ry = 2 + Math.floor(Math.random() * (rows - rh - 4));

        let overlap = false;
        for (const r of rooms) {
            if (rx < r.x + r.w + 1 && rx + rw + 1 > r.x && ry < r.y + r.h + 1 && ry + rh + 1 > r.y) {
                overlap = true;
                break;
            }
        }
        if (overlap) continue;

        for (let y = ry; y < ry + rh; y++) {
            for (let x = rx; x < rx + rw; x++) {
                grid[y][x] = FLOOR;
            }
        }
        rooms.push({ x: rx, y: ry, w: rw, h: rh, cx: Math.floor(rx + rw / 2), cy: Math.floor(ry + rh / 2) });
    }

    for (let i = 1; i < rooms.length; i++) {
        const a = rooms[i - 1], b = rooms[i];
        carveCorridor(a.cx, a.cy, b.cx, b.cy);
    }

    for (let i = 0; i < rooms.length; i++) {
        const r = rooms[i];
        roomList.push({ x: r.x, y: r.y, w: r.w, h: r.h, cx: r.cx, cy: r.cy });
        const numTorches = 1 + Math.floor(Math.random() * 2);
        for (let t = 0; t < numTorches; t++) {
            const tx = r.x + 1 + Math.floor(Math.random() * Math.max(1, r.w - 2));
            const ty = r.y + 1 + Math.floor(Math.random() * Math.max(1, r.h - 2));
            torches.push({ x: tx, y: ty, flicker: Math.random() * Math.PI * 2, radius: 3 + Math.random() * 3 });
        }
    }

    for (let i = 0; i < corridorList.length; i++) {
        const c = corridorList[i];
        if (c.length > 0) {
            const mid = Math.floor(c.length / 2);
            const mc = c[mid];
            if (mc) {
                torches.push({ x: mc.x, y: mc.y, flicker: Math.random() * Math.PI * 2, radius: 2 + Math.random() * 2 });
            }
        }
    }

    for (const r of roomList) {
        revealQueue.push({ type: 'room', data: r });
    }
    for (const c of corridorList) {
        revealQueue.push({ type: 'corridor', data: c });
    }

    if (rooms.length > 0) {
        const sr = rooms[0];
        explorer.x = sr.cx;
        explorer.y = sr.cy;
        explorer.visited.add(`${sr.cx},${sr.cy}`);
        explorerVisited.add(`${sr.cx},${sr.cy}`);
    }
}

function carveCorridor(x1, y1, x2, y2) {
    const segs = [];
    let x = x1, y = y1;
    while (x !== x2) {
        if (grid[y] && grid[y][x] !== CORRIDOR) {
            grid[y][x] = CORRIDOR;
            segs.push({ x, y });
        }
        x += x < x2 ? 1 : -1;
    }
    while (y !== y2) {
        if (grid[y] && grid[y][x] !== CORRIDOR) {
            grid[y][x] = CORRIDOR;
            segs.push({ x, y });
        }
        y += y < y2 ? 1 : -1;
    }
    corridorList.push(segs);
}

function revealNext() {
    if (revealIndex >= revealQueue.length) {
        if (!fading) {
            fading = true;
            fadeDir = 1;
        }
        return;
    }
    const item = revealQueue[revealIndex];
    if (item.type === 'room') {
        const r = item.data;
        for (let y = r.y; y < r.y + r.h; y++) {
            for (let x = r.x; x < r.x + r.w; x++) {
                if (y >= 0 && y < rows && x >= 0 && x < cols) {
                    revealed[y][x] = true;
                }
            }
        }
    } else {
        for (const s of item.data) {
            if (s.y >= 0 && s.y < rows && s.x >= 0 && s.x < cols) {
                revealed[s.y][s.x] = true;
            }
        }
    }
    revealIndex++;
}

function updateExplorer(dt) {
    if (!dungeonActive) return;
    explorerTimer += dt;
    if (explorerTimer < 0.15) return;
    explorerTimer = 0;

    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    const shuffled = dirs.sort(() => Math.random() - 0.5);

    let best = null;
    let bestUnvisited = -1;

    for (const [dx, dy] of shuffled) {
        const nx = explorer.x + dx;
        const ny = explorer.y + dy;
        if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
        if (grid[ny][nx] === WALL) continue;
        const key = `${nx},${ny}`;
        if (!explorer.visited.has(key)) {
            if (bestUnvisited === -1 || Math.random() < 0.5) {
                best = { x: nx, y: ny };
                bestUnvisited = 0;
            }
        }
    }

    if (best) {
        explorer.x = best.x;
        explorer.y = best.y;
        explorer.visited.add(`${best.x},${best.y}`);
        explorerVisited.add(`${best.x},${best.y}`);
    } else {
        for (const [dx, dy] of shuffled) {
            const nx = explorer.x + dx;
            const ny = explorer.y + dy;
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
            if (grid[ny][nx] === WALL) continue;
            explorer.x = nx;
            explorer.y = ny;
            explorer.visited.add(`${nx},${ny}`);
            explorerVisited.add(`${nx},${ny}`);
            break;
        }
    }

    const totalFloor = explorerVisited.size;
    let allRevealed = true;
    for (let y = 0; y < rows && allRevealed; y++) {
        for (let x = 0; x < cols && allRevealed; x++) {
            if ((grid[y][x] === FLOOR || grid[y][x] === CORRIDOR) && !revealed[y][x]) allRevealed = false;
        }
    }

    if (allRevealed && !fading) {
        fading = true;
        fadeDir = 1;
    }
}

function update(dt) {
    time += dt;

    if (!dungeonActive) return;

    revealTimer += dt;
    if (revealTimer >= 0.4) {
        revealTimer = 0;
        revealNext();
    }

    updateExplorer(dt);

    if (fading) {
        fadeAlpha += fadeDir * dt * 0.6;
        if (fadeDir === 1 && fadeAlpha >= 1) {
            fadeDir = -1;
        } else if (fadeDir === -1 && fadeAlpha <= 0) {
            generateDungeon();
        }
    }
}

function drawStoneTile(x, y, type) {
    const px = x * cellSize;
    const py = y * cellSize;
    const hash = ((x * 73856093) ^ (y * 19349663)) & 0xFFFF;
    const variation = (hash % 30) / 30 - 0.5;

    if (type === WALL) {
        const r = 28 + variation * 15;
        const g = 26 + variation * 12;
        const b = 30 + variation * 12;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(px, py, cellSize, cellSize);
        ctx.strokeStyle = `rgba(15,14,16,0.5)`;
        ctx.lineWidth = 0.5;
        ctx.strokeRect(px + 0.5, py + 0.5, cellSize - 1, cellSize - 1);
        if (cellSize > 12) {
            const hash2 = ((x * 31) ^ (y * 57)) & 0xFF;
            if (hash2 > 180) {
                ctx.fillStyle = 'rgba(50,48,52,0.4)';
                ctx.fillRect(px + 2, py + 2, cellSize * 0.3, cellSize * 0.3);
            }
        }
    } else {
        const r = 55 + variation * 20;
        const g = 50 + variation * 18;
        const b = 42 + variation * 15;
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(px, py, cellSize, cellSize);
        ctx.strokeStyle = `rgba(35,32,28,0.4)`;
        ctx.lineWidth = 0.5;
        ctx.strokeRect(px + 0.5, py + 0.5, cellSize - 1, cellSize - 1);
        if (cellSize > 14) {
            const hash2 = ((x * 41) ^ (y * 71)) & 0xFF;
            if (hash2 > 200) {
                ctx.fillStyle = 'rgba(65,58,48,0.3)';
                ctx.fillRect(px + cellSize * 0.2, py + cellSize * 0.6, cellSize * 0.4, cellSize * 0.2);
            }
        }
    }
}

function drawLighting() {
    const lightCanvas = document.createElement('canvas');
    lightCanvas.width = W;
    lightCanvas.height = H;
    const lctx = lightCanvas.getContext('2d');

    lctx.fillStyle = 'rgba(0,0,0,0.88)';
    lctx.fillRect(0, 0, W, H);

    lctx.globalCompositeOperation = 'destination-out';

    for (const torch of torches) {
        const flicker = 0.7 + 0.3 * Math.sin(time * 5 + torch.flicker) * Math.sin(time * 7.3 + torch.flicker * 2.1);
        const radius = torch.radius * cellSize * flicker;
        const px = torch.x * cellSize + cellSize / 2;
        const py = torch.y * cellSize + cellSize / 2;

        const grad = lctx.createRadialGradient(px, py, 0, px, py, radius);
        grad.addColorStop(0, `rgba(255,255,255,${0.6 * flicker})`);
        grad.addColorStop(0.5, `rgba(255,255,255,${0.25 * flicker})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        lctx.fillStyle = grad;
        lctx.beginPath();
        lctx.arc(px, py, radius, 0, Math.PI * 2);
        lctx.fill();
    }

    ctx.drawImage(lightCanvas, 0, 0);
}

function drawTorchFlame(x, y) {
    const px = x * cellSize + cellSize / 2;
    const py = y * cellSize + cellSize / 2;
    const flicker = 0.7 + 0.3 * Math.sin(time * 5 + x * 13 + y * 7);

    const r = cellSize * 0.12 * flicker;
    const grad = ctx.createRadialGradient(px, py - r * 0.5, 0, px, py, r * 2);
    grad.addColorStop(0, `rgba(255,220,100,${0.9 * flicker})`);
    grad.addColorStop(0.4, `rgba(255,140,30,${0.7 * flicker})`);
    grad.addColorStop(1, 'rgba(200,60,10,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, r * 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255,240,180,${0.95 * flicker})`;
    ctx.beginPath();
    ctx.arc(px, py - r * 0.3, r * 0.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawExplorer() {
    if (!explorer || !dungeonActive) return;
    const px = explorer.x * cellSize + cellSize / 2;
    const py = explorer.y * cellSize + cellSize / 2;
    const pulse = 0.8 + 0.2 * Math.sin(time * 3);
    const r = cellSize * 0.25 * pulse;

    const glow = ctx.createRadialGradient(px, py, 0, px, py, r * 3);
    glow.addColorStop(0, `rgba(150,220,255,${0.5 * pulse})`);
    glow.addColorStop(1, 'rgba(100,180,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(px, py, r * 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(200,240,255,${pulse})`;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255,255,255,${0.9 * pulse})`;
    ctx.beginPath();
    ctx.arc(px, py, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
}

function draw() {
    ctx.fillStyle = '#0a0808';
    ctx.fillRect(0, 0, W, H);

    if (!dungeonActive) return;

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            if (revealed[y][x]) {
                drawStoneTile(x, y, grid[y][x]);
            } else {
                drawStoneTile(x, y, WALL);
            }
        }
    }

    for (const torch of torches) {
        if (torch.y >= 0 && torch.y < rows && torch.x >= 0 && torch.x < cols && revealed[torch.y][torch.x]) {
            drawTorchFlame(torch.x, torch.y);
        }
    }

    drawLighting();
    drawExplorer();

    if (fading) {
        ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
        ctx.fillRect(0, 0, W, H);
    }

    if (revealIndex < revealQueue.length) {
        ctx.fillStyle = 'rgba(180,140,80,0.5)';
        ctx.font = `${Math.max(11, cellSize * 0.6)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(`Carving room ${revealIndex} / ${revealQueue.length}...`, W / 2, H - 15);
    }
}

let lastTime = performance.now();
function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

generateDungeon();
requestAnimationFrame(loop);
</script>
</body>
</html>
