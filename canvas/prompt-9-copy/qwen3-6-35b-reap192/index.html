<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Terrain Generation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="map"></canvas>
    <script>
        const SIZE = 512;
        const canvas = document.getElementById('map');
        const ctx = canvas.getContext('2d');
        
        canvas.width = SIZE;
        canvas.height = SIZE;
        
        const grid = new Float32Array(SIZE * SIZE);

        // Helper to get index
        const idx = (x, y) => y * SIZE + x;

        // Generate Noise for the initial corners to make it more interesting than just 4 corners
        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // Initialize grid
        function initGrid() {
            // Set corners
            grid[idx(0, 0)] = Math.random();
            grid[idx(SIZE - 1, 0)] = Math.random();
            grid[idx(0, SIZE - 1)] = Math.random();
            grid[idx(SIZE - 1, SIZE - 1)] = Math.random();

            // Seed midpoints of edges
            grid[idx(Math.floor(SIZE/2), 0)] = Math.random();
            grid[idx(Math.floor(SIZE/2), SIZE-1)] = Math.random();
            grid[idx(0, Math.floor(SIZE/2))] = Math.random();
            grid[idx(SIZE-1, Math.floor(SIZE/2))] = Math.random();

            diamondSquare(SIZE, 0, 0, SIZE, SIZE, 1.0);
        }

        function diamondSquare(half, x1, y1, w, h, roughness) {
            if (w < 2 || h < 2) return;

            const halfw = Math.floor(w / 2);
            const halfh = Math.floor(h / 2);

            // Diamond Step
            const center = (
                grid[idx(x1, y1)] +
                grid[idx(x1 + w, y1)] +
                grid[idx(x1, y1 + h)] +
                grid[idx(x1 + w, y1 + h)]
            ) / 4.0;

            grid[idx(x1 + halfw, y1 + halfh)] = center + (Math.random() * 2 - 1) * roughness;

            // Square Step
            // Top
            grid[idx(x1 + halfw, y1)] = (
                grid[idx(x1 + halfw, y1)] + // Already set by seed or previous
                grid[idx(x1, y1 + halfh)] +
                grid[idx(x1 + w, y1 + halfh)]
            ) / 3.0;
            grid[idx(x1 + halfw, y1)] += (Math.random() * 2 - 1) * roughness;

            // Bottom
            grid[idx(x1 + halfw, y1 + h)] = (
                grid[idx(x1 + halfw, y1 + h)] + // Already set by seed or previous
                grid[idx(x1, y1 + h - halfh)] +
                grid[idx(x1 + w, y1 + h - halfh)]
            ) / 3.0;
            grid[idx(x1 + halfw, y1 + h)] += (Math.random() * 2 - 1) * roughness;

            // Left
            grid[idx(x1, y1 + halfh)] = (
                grid[idx(x1, y1 + halfh)] + // Already set by seed or previous
                grid[idx(x1 + halfw, y1)] +
                grid[idx(x1 + halfw, y1 + h)]
            ) / 3.0;
            grid[idx(x1, y1 + halfh)] += (Math.random() * 2 - 1) * roughness;

            // Right
            grid[idx(x1 + w, y1 + halfh)] = (
                grid[idx(x1 + w, y1 + halfh)] + // Already set by seed or previous
                grid[idx(x1 + halfw, y1)] +
                grid[idx(x1 + halfw, y1 + h)]
            ) / 3.0;
            grid[idx(x1 + w, y1 + halfh)] += (Math.random() * 2 - 1) * roughness;

            // Recursion
            const newRoughness = roughness / 2.0;

            diamondSquare(halfw, x1, y1, halfw, halfh, newRoughness);
            diamondSquare(halfw, x1 + halfw, y1, halfw, halfh, newRoughness);
            diamondSquare(halfw, x1, y1 + halfh, halfw, halfh, newRoughness);
            diamondSquare(halfw, x1 + halfw, y1 + halfh, halfw, halfh, newRoughness);
        }

        function colorMap(height) {
            // Normalize height roughly 0.2 to 0.8 for nice contrast
            const h = Math.max(0, Math.min(1, height));
            
            let r, g, b;

            if (h < 0.45) {
                // Deep water to shallow water
                const t = h / 0.45;
                r = 0;
                g = Math.floor(30 + t * 40);
                b = Math.floor(100 + t * 80);
            } else if (h < 0.50) {
                // Beach sand
                const t = (h - 0.45) / 0.05;
                r = Math.floor(194 + t * 30);
                g = Math.floor(178 + t * 20);
                b = Math.floor(128 + t * 30);
            } else if (h < 0.65) {
                // Grass to Forest
                const t = (h - 0.50) / 0.15;
                r = Math.floor(34 + t * 0);
                g = Math.floor(120 + t * 40);
                b = Math.floor(34 + t * 0);
            } else if (h < 0.75) {
                // Brown/Mountain
                const t = (h - 0.65) / 0.10;
                r = Math.floor(112 + t * 30);
                g = Math.floor(100 + t * 20);
                b = Math.floor(70 + t * 20);
            } else {
                // Snow
                const t = Math.min(1, (h - 0.75) / 0.20);
                r = Math.floor(142 + t * 113);
                g = Math.floor(128 + t * 127);
                b = Math.floor(96 + t * 159);
            }
            
            return `rgb(${r},${g},${b})`;
        }

        function generate() {
            initGrid();
            
            // Normalize heights to 0-1 range for coloring logic
            let min = Infinity, max = -Infinity;
            for (let i = 0; i < grid.length; i++) {
                if (grid[i] < min) min = grid[i];
                if (grid[i] > max) max = grid[i];
            }
            const range = max - min;

            const imageData = ctx.createImageData(SIZE, SIZE);
            const data = imageData.data;

            for (let i = 0; i < grid.length; i++) {
                // Normalize to 0..1
                const normalizedHeight = (grid[i] - min) / range;
                
                // Parse CSS color
                const colorStr = colorMap(normalizedHeight);
                const tempDiv = document.createElement('div');
                tempDiv.style.color = colorStr;
                document.body.appendChild(tempDiv);
                const computedColor = window.getComputedStyle(tempDiv).color;
                document.body.removeChild(tempDiv);
                
                const parts = computedColor.match(/\d+/g);
                const r = parseInt(parts[0]);
                const g = parseInt(parts[1]);
                const b = parseInt(parts[2]);

                data[i * 4] = r;
                data[i * 4 + 1] = g;
                data[i * 4 + 2] = b;
                data[i * 4 + 3] = 255;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        generate();
    </script>
</body>
</html>
