<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Auto-Combat</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1814;
            font-family: 'Courier New', Courier, monospace;
            color: #eee;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hud-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #5a4a3a;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .hud-right {
            left: auto;
            right: 20px;
            text-align: right;
        }
        .bar-container {
            width: 200px;
            height: 15px;
            background: #333;
            margin-top: 5px;
            border: 1px solid #555;
        }
