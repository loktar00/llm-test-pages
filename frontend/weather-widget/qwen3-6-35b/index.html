<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg-day: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --bg-night: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    --bg-sunset: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #fda085 100%);
    --card-bg: rgba(255,255,255,0.15);
    --card-border: rgba(255,255,255,0.25);
    --text-primary: #fff;
    --text-secondary: rgba(255,255,255,0.7);
    --text-muted: rgba(255,255,255,0.45);
    --accent: #ffd166;
    --shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 1.5s ease;
    overflow: hidden;
  }

  body.day { background: var(--bg-day); }
  body.night { background: var(--bg-night); }
  body.sunset { background: var(--bg-sunset); }

  .card {
    width: 380px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
    color: var(--text-primary);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  /* ── Scene: Sun Behind Cloud ── */
  .scene {
    position: relative;
    width: 120px;
    height: 90px;
    margin: 0 auto 8px;
  }

  .sun-scene {
    position: absolute;
    top: 8px;
    left: 18px;
    width: 50px;
    height: 50px;
    z-index: 1;
  }

  .sun-core {
    width: 32px;
    height: 32px;
    background: radial-gradient(circle, #ffe066 30%, #ffb830 100%);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 20px rgba(255,200,50,0.6), 0 0 40px rgba(255,180,50,0.3);
    animation: sunPulse 4s ease-in-out infinite;
  }

  @keyframes sunPulse {
    0%,100% { box-shadow: 0 0 20px rgba(255,200,50,0.6), 0 0 40px rgba(255,180,50,0.3); }
    50% { box-shadow: 0 0 28px rgba(255,200,50,0.8), 0 0 55px rgba(255,180,50,0.4); }
  }

  .sun-rays {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50px;
    height: 50px;
    transform: translate(-50%, -50%);
    animation: sunRotate 20s linear infinite;
  }

  @keyframes sunRotate {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .sun-ray {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 10px;
    background: rgba(255,210,80,0.7);
    border-radius: 1px;
    transform-origin: center -8px;
  }

  .sun-ray:nth-child(1) { transform: translate(-50%,-50%) rotate(0deg) translateY(-22px); }
  .sun-ray:nth-child(2) { transform: translate(-50%,-50%) rotate(45deg) translateY(-22px); }
  .sun-ray:nth-child(3) { transform: translate(-50%,-50%) rotate(90deg) translateY(-22px); }
  .sun-ray:nth-child(4) { transform: translate(-50%,-50%) rotate(135deg) translateY(-22px); }
  .sun-ray:nth-child(5) { transform: translate(-50%,-50%) rotate(180deg) translateY(-22px); }
  .sun-ray:nth-child(6) { transform: translate(-50%,-50%) rotate(225deg) translateY(-22px); }
  .sun-ray:nth-child(7) { transform: translate(-50%,-50%) rotate(270deg) translateY(-22px); }
  .sun-ray:nth-child(8) { transform: translate(-50%,-50%) rotate(315deg) translateY(-22px); }

  .cloud-scene {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    animation: cloudFloat 6s ease-in-out infinite;
  }

  @keyframes cloudFloat {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-4px); }
  }

  .cloud-body {
    width: 80px;
    height: 30px;
    background: rgba(255,255,255,0.9);
    border-radius: 30px;
    position: relative;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  .cloud-body::before {
    content: '';
    position: absolute;
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    top: -22px;
    left: 12px;
  }

  .cloud-body::after {
    content: '';
    position: absolute;
    width: 26px;
    height: 26px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    top: -14px;
    right: 14px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 4px;
    position: relative;
    z-index: 1;
  }

  .location {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .condition {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }

  /* ── Temp Display ── */
  .temp-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }

  .temp-value {
    font-size: 72px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -3px;
    position: relative;
    display: flex;
    align-items: flex-start;
  }

  .temp-number {
    display: inline-flex;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .temp-number.rolling-up {
    animation: rollUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .temp-number.rolling-down {
    animation: rollDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes rollUp {
    0% { transform: translateY(40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  @keyframes rollDown {
    0% { transform: translateY(-40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .temp-degree {
    font-size: 28px;
    font-weight: 300;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .toggle-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 6px 14px;
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.5px;
  }

  .toggle-btn:hover {
    background: rgba(255,255,255,0.22);
  }

  .toggle-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    transform: scale(0);
    transition: transform 0.3s ease;
  }

  .toggle-btn:active::after {
    transform: scale(1);
    transition: transform 0s;
  }

  /* ── Hourly Strip ── */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }

  .hourly-strip {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin: 0 -24px;
    padding-left: 24px;
    padding-right: 24px;
  }

  .hourly-strip::-webkit-scrollbar { display: none; }

  .hourly-item {
    flex: 0 0 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    scroll-snap-align: center;
    padding: 12px 4px;
    border-radius: 16px;
    transition: background 0.3s ease;
    cursor: default;
  }

  .hourly-item:hover {
    background: rgba(255,255,255,0.08);
  }

  .hourly-item.active {
    background: rgba(255,255,255,0.12);
  }

  .hourly-time {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .hourly-icon {
    width: 28px;
    height: 28px;
    position: relative;
  }

  .hourly-temp {
    font-size: 14px;
    font-weight: 500;
  }

  /* ── Daily List ── */
  .daily-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }

  .daily-item {
    display: grid;
    grid-template-columns: 52px 32px 1fr 52px;
    align-items: center;
    gap: 8px;
    padding: 10px 8px;
    border-radius: 12px;
    transition: background 0.3s ease;
  }

  .daily-item:hover {
    background: rgba(255,255,255,0.06);
  }

  .daily-day {
    font-size: 14px;
    font-weight: 500;
  }

  .daily-icon-wrap {
    width: 32px;
    height: 32px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .daily-high {
    font-size: 14px;
    font-weight: 500;
    text-align: right;
  }

  .daily-low {
    font-size: 14px;
    color: var(--text-muted);
    text-align: right;
  }

  /* ── CSS Mini Icons ── */

  /* Sun icon */
  .mini-sun {
    width: 20px;
    height: 20px;
    position: relative;
  }

  .mini-sun-core {
    width: 12px;
    height: 12px;
    background: #ffd166;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .mini-sun-rays {
    position: absolute;
    inset: 0;
    animation: sunRotate 12s linear infinite;
  }

  .mini-sun-rays::before,
  .mini-sun-rays::after {
    content: '';
    position: absolute;
    background: #ffd166;
    border-radius: 1px;
  }

  .mini-sun-rays::before {
    width: 2px;
    height: 14px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(0deg);
  }

  .mini-sun-rays::after {
    width: 14px;
    height: 2px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(0deg);
  }

  /* Cloud icon */
  .mini-cloud {
    width: 24px;
    height: 14px;
    position: relative;
  }

  .mini-cloud-body {
    width: 24px;
    height: 12px;
    background: rgba(255,255,255,0.85);
    border-radius: 12px;
    position: absolute;
    bottom: 0;
  }

  .mini-cloud-body::before {
    content: '';
    width: 12px;
    height: 12px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    position: absolute;
    top: -7px;
    left: 3px;
  }

  .mini-cloud-body::after {
    content: '';
    width: 9px;
    height: 9px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    position: absolute;
    top: -4px;
    right: 3px;
  }

  /* Rain icon */
  .mini-rain {
    width: 24px;
    height: 28px;
    position: relative;
  }

  .mini-rain-cloud {
    width: 22px;
    height: 10px;
    background: rgba(180,200,220,0.9);
    border-radius: 10px;
    position: absolute;
    top: 0;
  }

  .mini-rain-cloud::before {
    content: '';
    width: 11px;
    height: 11px;
    background: rgba(180,200,220,0.9);
    border-radius: 50%;
    position: absolute;
    top: -6px;
    left: 3px;
  }

  .mini-rain-cloud::after {
    content: '';
    width: 8px;
    height: 8px;
    background: rgba(180,200,220,0.9);
    border-radius: 50%;
    position: absolute;
    top: -3px;
    right: 3px;
  }

  .rain-drops {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 12px;
  }

  .rain-drop {
    position: absolute;
    width: 2px;
    height: 6px;
    background: #7ec8e3;
    border-radius: 1px;
    animation: rainFall 1s ease-in infinite;
  }

  .rain-drop:nth-child(1) { left: 2px; animation-delay: 0s; }
  .rain-drop:nth-child(2) { left: 6px; animation-delay: 0.3s; }
  .rain-drop:nth-child(3) { left: 10px; animation-delay: 0.6s; }

  @keyframes rainFall {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(10px); opacity: 0; }
  }

  /* Thunder icon */
  .mini-thunder .mini-rain-cloud { background: rgba(140,160,190,0.95); }
  .mini-thunder .mini-rain-cloud::before,
  .mini-thunder .mini-rain-cloud::after { background: rgba(140,160,190,0.95); }

  .lightning {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 10px solid #ffd166;
    animation: lightningFlash 3s ease-in-out infinite;
    filter: drop-shadow(0 0 3px rgba(255,209,102,0.6));
  }

  @keyframes lightningFlash {
    0%,90%,100% { opacity: 0; }
    92%,96% { opacity: 1; }
  }

  /* Snow icon */
  .mini-snow {
    width: 24px;
    height: 28px;
    position: relative;
  }

  .mini-snow-cloud {
    width: 22px;
    height: 10px;
    background: rgba(200,210,230,0.9);
    border-radius: 10px;
    position: absolute;
    top: 0;
  }

  .mini-snow-cloud::before {
    content: '';
    width: 11px;
    height: 11px;
    background: rgba(200,210,230,0.9);
    border-radius: 50%;
    position: absolute;
    top: -6px;
    left: 3px;
  }

  .mini-snow-cloud::after {
    content: '';
    width: 8px;
    height: 8px;
    background: rgba(200,210,230,0.9);
    border-radius: 50%;
    position: absolute;
    top: -3px;
    right: 3px;
  }

  .snowflakes {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 12px;
  }

  .snowflake {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    animation: snowFall 2s ease-in-out infinite;
  }

  .snowflake:nth-child(1) { left: 2px; animation-delay: 0s; }
  .snowflake:nth-child(2) { left: 6px; animation-delay: 0.7s; }
  .snowflake:nth-child(3) { left: 10px; animation-delay: 1.4s; }

  @keyframes snowFall {
    0% { transform: translateY(0) translateX(0); opacity: 1; }
    100% { transform: translateY(12px) translateX(-4px); opacity: 0; }
  }

  /* Partly cloudy icon */
  .mini-partly-cloudy {
    width: 24px;
    height: 24px;
    position: relative;
  }

  .mini-partly-sun {
    width: 14px;
    height: 14px;
    background: #ffd166;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    box-shadow: 0 0 8px rgba(255,209,102,0.4);
  }

  .mini-partly-cloud-body {
    width: 20px;
    height: 10px;
    background: rgba(255,255,255,0.85);
    border-radius: 10px;
    position: absolute;
    bottom: 0;
    left: 4px;
  }

  .mini-partly-cloud-body::before {
    content: '';
    width: 10px;
    height: 10px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    position: absolute;
    top: -6px;
    left: 2px;
  }

  /* ── Fake Clock Indicator ── */
  .clock-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
    position: relative;
    z-index: 1;
  }

  .clock-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.5s ease;
  }

  .clock-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px rgba(255,209,102,0.5);
  }

  .clock-time {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }

  /* ── Scrollbar for hourly ── */
  .scroll-hint {
    text-align: center;
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* ── Responsive ── */
  @media (max-width: 420px) {
    .card {
      width: 100%;
      min-height: 100vh;
      border-radius: 0;
      padding: 24px 20px;
    }
  }
</style>
</head>
<body class="day">

<div class="card">
  <!-- Sun Behind Cloud Scene -->
  <div class="scene">
    <div class="sun-scene">
      <div class="sun-rays">
        <div class="sun-ray"></div><div class="sun-ray"></div>
        <div class="sun-ray"></div><div class="sun-ray"></div>
        <div class="sun-ray"></div><div class="sun-ray"></div>
        <div class="sun-ray"></div><div class="sun-ray"></div>
      </div>
      <div class="sun-core"></div>
    </div>
    <div class="cloud-scene">
      <div class="cloud-body"></div>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="location">San Francisco, CA</div>
    <div class="condition">Partly Cloudy</div>
  </div>

  <!-- Temp -->
  <div class="temp-row">
    <div class="temp-value">
      <span class="temp-number" id="tempDisplay">72</span>
      <span class="temp-degree">°</span>
    </div>
    <button class="toggle-btn" id="toggleBtn" onclick="toggleUnit()">°F → °C</button>
  </div>

  <!-- Hourly -->
  <div class="section-label">Hourly</div>
  <div class="hourly-strip" id="hourlyStrip"></div>
  <div class="scroll-hint">← swipe for more →</div>

  <!-- 5-Day -->
  <div class="section-label" style="margin-top:24px">5-Day Forecast</div>
  <div class="daily-list" id="dailyList"></div>

  <!-- Fake Clock -->
  <div class="clock-bar">
    <span class="clock-time" id="fakeClock">3:42 PM</span>
    <div class="clock-dot active"></div>
    <div class="clock-dot"></div>
    <div class="clock-dot"></div>
    <div class="clock-dot"></div>
    <div class="clock-dot"></div>
  </div>
</div>

<script>
  // ── Data ──
  const hourlyData = [
    { time: 'Now', temp: 72, icon: 'partly-cloudy' },
    { time: '1PM', temp: 73, icon: 'partly-cloudy' },
    { time: '2PM', temp: 74, icon: 'sun' },
    { time: '3PM', temp: 73, icon: 'sun' },
    { time: '4PM', temp: 71, icon: 'cloud' },
    { time: '5PM', temp: 69, icon: 'cloud' },
    { time: '6PM', temp: 66, icon: 'rain' },
    { time: '7PM', temp: 64, icon: 'rain' },
    { time: '8PM', temp: 62, icon: 'thunder' },
    { time: '9PM', temp: 61, icon: 'thunder' },
    { time: '10PM', temp: 60, icon: 'cloud' },
    { time: '11PM', temp: 59, icon: 'cloud' },
  ];

  const dailyData = [
    { day: 'Today', high: 74, low: 58, icon: 'partly-cloudy' },
    { day: 'Tue', high: 76, low: 60, icon: 'sun' },
    { day: 'Wed', high: 71, low: 57, icon: 'rain' },
    { day: 'Thu', high: 68, low: 54, icon: 'thunder' },
    { day: 'Fri', high: 72, low: 56, icon: 'sun' },
  ];

  // ── Icon HTML Generators ──
  function iconHTML(type, size) {
    const s = size === 'small' ? '' : '';
    switch(type) {
      case 'sun':
        return `<div class="mini-sun"><div class="mini-sun-rays"></div><div class="mini-sun-core"></div></div>`;
      case 'cloud':
        return `<div class="mini-cloud"><div class="mini-cloud-body"></div></div>`;
      case 'rain':
        return `<div class="mini-rain"><div class="mini-rain-cloud"></div><div class="rain-drops"><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div></div></div>`;
      case 'thunder':
        return `<div class="mini-thunder mini-rain"><div class="mini-rain-cloud"></div><div class="rain-drops"><div class="rain-drop"></div><div class="rain-drop"></div><div class="rain-drop"></div></div><div class="lightning"></div></div>`;
      case 'snow':
        return `<div class="mini-snow"><div class="mini-snow-cloud"></div><div class="snowflakes"><div class="snowflake"></div><div class="snowflake"></div><div class="snowflake"></div></div></div>`;
      case 'partly-cloudy':
        return `<div class="mini-partly-cloudy"><div class="mini-partly-sun"></div><div class="mini-partly-cloud-body"></div></div>`;
      default:
        return `<div class="mini-sun"><div class="mini-sun-rays"></div><div class="mini-sun-core"></div></div>`;
    }
  }

  // ── Render Hourly ──
  const strip = document.getElementById('hourlyStrip');
  hourlyData.forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'hourly-item' + (i === 0 ? ' active' : '');
    div.innerHTML = `
      <span class="hourly-time">${h.time}</span>
      <div class="hourly-icon">${iconHTML(h.icon)}</div>
      <span class="hourly-temp">${h.temp}°</span>
    `;
    strip.appendChild(div);
  });

  // ── Render Daily ──
  const list = document.getElementById('dailyList');
  dailyData.forEach(d => {
    const div = document.createElement('div');
    div.className = 'daily-item';
    div.innerHTML = `
      <span class="daily-day">${d.day}</span>
      <div class="daily-icon-wrap">${iconHTML(d.icon)}</div>
      <span></span>
      <span class="daily-high">${d.high}°</span>
      <span class="daily-low">${d.low}°</span>
    `;
    list.appendChild(div);
  });

  // ── C/F Toggle ──
  let isF = true;
  const tempDisplay = document.getElementById('tempDisplay');
  const toggleBtn = document.getElementById('toggleBtn');

  function toggleUnit() {
    const currentF = parseInt(tempDisplay.textContent);
    let newTemp;
    let direction;

    if (isF) {
      newTemp = Math.round((currentF - 32) * 5 / 9);
      direction = 'rolling-down';
      toggleBtn.textContent = '°C → °F';
    } else {
      newTemp = Math.round(currentF * 9 / 5 + 32);
      direction = 'rolling-up';
      toggleBtn.textContent = '°F → °C';
    }

    tempDisplay.classList.remove('rolling-up', 'rolling-down');
    void tempDisplay.offsetWidth;
    tempDisplay.classList.add(direction);
    tempDisplay.textContent = newTemp;

    isF = !isF;

    setTimeout(() => {
      tempDisplay.classList.remove('rolling-up', 'rolling-down');
    }, 600);
  }

  // ── Fake Clock ──
  let fakeHour = 15;
  let fakeMinute = 42;
  const clockEl = document.getElementById('fakeClock');
  const clockDots = document.querySelectorAll('.clock-dot');

  function updateClock() {
    fakeMinute += 3;
    if (fakeMinute >= 60) {
      fakeMinute = 0;
      fakeHour++;
    }
    if (fakeHour >= 24) fakeHour = 0;

    const h = fakeHour % 12 || 12;
    const m = fakeMinute.toString().padStart(2, '0');
    const ampm = fakeHour < 12 ? 'AM' : 'PM';
    clockEl.textContent = `${h}:${m} ${ampm}`;

    // Update background based on hour
    const body = document.body;
    body.classList.remove('day', 'night', 'sunset');
    if (fakeHour >= 6 && fakeHour < 11) {
      body.classList.add('day');
    } else if (fakeHour >= 11 && fakeHour < 15) {
      body.classList.add('day');
    } else if (fakeHour >= 15 && fakeHour < 19) {
      body.classList.add('sunset');
    } else {
      body.classList.add('night');
    }

    // Update clock dots
    const activeIndex = Math.floor(fakeHour / 5);
    clockDots.forEach((dot, i) => {
      dot.classList.toggle('active', i === activeIndex);
    });
  }

  setInterval(updateClock, 2000);
  updateClock();

  // ── Scroll snap auto-advance ──
  let scrollInterval = setInterval(() => {
    strip.scrollBy({ left: 68, behavior: 'smooth' });
    if (strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 5) {
      clearInterval(scrollInterval);
    }
  }, 3000);

  strip.addEventListener('scroll', () => {
    clearInterval(scrollInterval);
  });

  strip.addEventListener('touchstart', () => {
    clearInterval(scrollInterval);
  });
</script>

</body>
</html>
