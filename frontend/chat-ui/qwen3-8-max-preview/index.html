<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrier — Messages</title>
<style>
  :root{
    --bg:#0a1114;
    --panel:#0f1a20;
    --panel-2:#0c161b;
    --field:#122028;
    --line:rgba(255,255,255,.07);
    --text:#e9f3f4;
    --muted:#7f97a0;
    --faint:#5a707a;
    --mint:#3fe0a8;
    --amber:#ffc466;
    --coral:#ff6d5a;
    --cyan:#5ac8ff;
    --out-1:#ff9a62;
    --out-2:#ff5c69;
    --disp:"Avenir Next Condensed","Helvetica Neue Condensed","Arial Narrow","Segoe UI",sans-serif;
    --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(63,224,168,.28)}

  /* ---------- ambient background ---------- */
  .amb{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1100px 700px at 88% -12%, rgba(23,124,112,.28), transparent 62%),
      radial-gradient(900px 640px at -8% 112%, rgba(255,109,90,.12), transparent 58%),
      linear-gradient(180deg,#0a1114 0%,#0b151a 100%);
  }
  .amb::before{content:"";position:absolute;width:64vw;height:64vw;left:-18vw;top:-28vw;
    background:radial-gradient(circle, rgba(63,224,168,.09), transparent 62%);
    animation:drift 18s ease-in-out infinite alternate;}
  .amb::after{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1.4px);
    background-size:22px 22px;
    mask-image:radial-gradient(80% 80% at 50% 40%, #000 30%, transparent 100%);}
  @keyframes drift{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(12vw,7vh) scale(1.18)}
  }

  /* ---------- shell ---------- */
  .app{
    position:relative;z-index:1;
    height:calc(100dvh - 40px);
    max-width:1460px;margin:20px auto;
    display:grid;grid-template-columns:340px 1fr;gap:18px;
    padding:0 20px;
  }
  .side,.chat{
    background:linear-gradient(180deg,#101c22,#0d171d);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .side{animation:rise .6s .05s cubic-bezier(.2,.9,.3,1) both}
  .chat{animation:rise .6s .14s cubic-bezier(.2,.9,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---------- scrollbars ---------- */
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:content-box}

  /* ---------- avatars & presence ---------- */
  .avatar{
    --h:165;
    position:relative;flex:none;
    width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(140deg, hsl(var(--h) 62% 46%), hsl(calc(var(--h) + 44) 58% 33%));
    font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.05em;
    color:rgba(255,255,255,.94);
    box-shadow:inset 0 -6px 12px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.3);
  }
  .avatar.sm{width:30px;height:30px;font-size:11px}
  .avatar.lg{width:42px;height:42px;font-size:14px}
  .pd{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
    background:var(--faint);border:2.5px solid var(--panel);}
  .pd.online{background:var(--mint)}
  .pd.away{background:var(--amber)}
  .pd.online::after{content:"";position:absolute;inset:-3px;border-radius:50%;
    border:2px solid var(--mint);opacity:0;animation:ping 2.4s ease-out infinite;}
  @keyframes ping{0%{transform:scale(.4);opacity:.7}70%,100%{transform:scale(1.6);opacity:0}}

  /* ---------- sidebar ---------- */
  .side-head{display:flex;align-items:center;gap:11px;padding:18px 18px 12px}
  .logo-tile{width:36px;height:36px;border-radius:11px;flex:none;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--out-1),var(--out-2));
    box-shadow:0 6px 16px rgba(255,110,90,.32);}
  .logo-tile svg{width:17px;height:17px;fill:#fff;transform:rotate(-18deg)}
  .wordmark{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.28em}
  .wordmark small{display:block;font-family:var(--mono);font-weight:400;font-size:8.5px;
    letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-top:2px}
  .live{margin-left:auto;display:flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint)}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 8px var(--mint);animation:blink 1.8s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  .search{display:flex;align-items:center;gap:9px;margin:2px 14px 12px;
    background:var(--field);border:1px solid var(--line);border-radius:13px;
    padding:9px 13px;transition:border-color .25s, box-shadow .25s;}
  .search:focus-within{border-color:rgba(90,200,255,.45);box-shadow:0 0 0 3px rgba(90,200,255,.1)}
  .search svg{width:14px;height:14px;stroke:var(--faint);flex:none}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--text);
    font:inherit;font-size:13px}
  .search input::placeholder{color:var(--faint)}

  .tabs{display:flex;gap:8px;padding:0 14px 12px}
  .tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer;
    font:600 11.5px var(--body);letter-spacing:.02em;
    display:flex;align-items:center;gap:7px;
    transition:background .25s,color .25s,border-color .25s,transform .15s;}
  .tab:hover{color:var(--text);transform:translateY(-1px)}
  .tab.on{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}
  .tab b{font:700 10px var(--mono);background:var(--amber);color:#231303;
    min-width:17px;height:17px;border-radius:9px;padding:0 4px;
    display:grid;place-items:center;font-style:normal}
  .tab:not(.on) b{background:rgba(255,255,255,.14);color:var(--muted)}

  .contacts{flex:1;overflow-y:auto;list-style:none;padding:2px 8px 10px;
    display:flex;flex-direction:column;gap:2px;}
  .contact{position:relative;display:flex;gap:12px;align-items:center;
    padding:11px 12px;border-radius:14px;cursor:pointer;
    transition:background .2s, transform .2s, box-shadow .2s;}
  .contact:hover{background:rgba(255,255,255,.045);transform:translateX(3px)}
  .contact.on{background:linear-gradient(90deg, rgba(63,224,168,.11), rgba(63,224,168,.02));
    box-shadow:inset 0 0 0 1px rgba(63,224,168,.22);}
  .cm{flex:1;min-width:0}
  .r1,.r2{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .r1{margin-bottom:3px}
  .nm{font-family:var(--disp);font-weight:700;font-size:14.5px;letter-spacing:.035em;
    color:#c9d8dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contact.unread .nm{color:#fff}
  .r1 time{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:none}
  .contact.unread .r1 time{color:var(--amber)}
  .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contact.unread .pv{color:var(--text)}
  .pv.flash{animation:flash .9s ease-out}
  @keyframes flash{0%{color:var(--mint)}100%{color:inherit}}
  .badge{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
    background:var(--amber);color:#231303;text-align:center;
    font:700 11px/20px var(--mono);
    box-shadow:0 2px 10px rgba(255,196,102,.4);}
  .badge.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes bump{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  .empty{padding:26px 12px;text-align:center;color:var(--faint);
    font-family:var(--mono);font-size:11px;letter-spacing:.08em}

  .me{display:flex;align-items:center;gap:11px;padding:13px 16px;
    border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
  .me .who b{display:block;font-family:var(--disp);font-weight:700;font-size:13.5px;letter-spacing:.04em}
  .me .who span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--mint)}
  .gbtn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;
    display:grid;place-items:center;color:var(--muted);cursor:pointer;
    transition:background .25s,color .25s,transform .2s;}
  .gbtn:hover{background:rgba(255,255,255,.08);color:var(--text);transform:translateY(-1px)}
  .gbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
  .me .gbtn{margin-left:auto}
  .me .gbtn:hover svg{transform:rotate(90deg)}
  .gbtn.wiggle svg{animation:wig .45s ease-in-out}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}60%{transform:rotate(12deg)}}

  /* ---------- chat header ---------- */
  .chat-head{display:flex;align-items:center;gap:13px;padding:13px 20px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
  .ch-name{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.05em}
  .ch-stat{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mint);margin-top:2px;display:flex;align-items:center;gap:5px}
  .ch-stat.away{color:var(--amber)}
  .ch-stat .tds{display:inline-flex;gap:3px;margin-left:2px}
  .ch-stat .tds i{width:3.5px;height:3.5px;border-radius:50%;background:var(--mint);
    animation:tb 1.15s infinite ease-in-out}
  .ch-stat .tds i:nth-child(2){animation-delay:.15s}
  .ch-stat .tds i:nth-child(3){animation-delay:.3s}
  .ch-actions{margin-left:auto;display:flex;gap:6px}
  .ch-actions .gbtn:hover{color:var(--cyan)}

  /* ---------- thread ---------- */
  .thread{flex:1;overflow-y:auto;padding:22px 26px 14px;
    display:flex;flex-direction:column;
    background:
      radial-gradient(620px 300px at 82% 0%, rgba(90,200,255,.05), transparent 60%),
      radial-gradient(520px 320px at 8% 100%, rgba(255,109,90,.05), transparent 60%);
    background-color:var(--panel-2);
  }
  .day{display:flex;align-items:center;gap:16px;margin:20px 6px 4px}
  .day:first-child{margin-top:2px}
  .day::before,.day::after{content:"";flex:1;height:1px}
  .day::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.13))}
  .day::after{background:linear-gradient(90deg,rgba(255,255,255,.13),transparent)}
  .day span{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);background:rgba(255,255,255,.045);border:1px solid var(--line);
    padding:5px 14px;border-radius:999px;white-space:nowrap;}

  .msg{display:flex;gap:9px;max-width:min(68%,560px);margin-top:3px;align-self:flex-start;
    animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0ms);}
  .msg.out{align-self:flex-end;flex-direction:row-reverse}
  .msg.gfirst,.msg.gonly{margin-top:15px}
  @keyframes pop{
    0%{opacity:0;transform:translateY(12px) scale(.8)}
    55%{opacity:1;transform:translateY(-2px) scale(1.04)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .sp{width:30px;flex:none}

  .bubble{position:relative;padding:10px 14px 8px;border-radius:18px;
    font-size:14px;line-height:1.5;
    transition:transform .2s, box-shadow .2s;}
  .msg:hover .bubble{transform:translateY(-1px)}
  .msg.in .bubble{background:#16262e;border:1px solid rgba(255,255,255,.06);
    color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .msg.out .bubble{background:linear-gradient(135deg,var(--out-1),var(--out-2));
    color:#fff;box-shadow:0 6px 18px rgba(255,105,85,.28)}
  /* grouping corners — in */
  .msg.in.gonly {border-radius:8px 18px 18px 8px}
  .msg.in.gfirst{border-radius:8px 18px 18px 18px}
  .msg.in.gmid  {border-radius:8px 18px 18px 8px}
  .msg.in.glast {border-radius:18px 18px 8px 18px}
  /* grouping corners — out */
  .msg.out.gonly {border-radius:18px 8px 8px 18px}
  .msg.out.gfirst{border-radius:18px 8px 18px 18px}
  .msg.out.gmid  {border-radius:18px 8px 8px 18px}
  .msg.out.glast {border-radius:18px 18px 18px 8px}

  .meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;}
  .msg.in .meta{color:var(--faint)}
  .msg.out .meta{color:rgba(255,255,255,.82)}
  .ticks{font-size:10px;letter-spacing:-2px;color:rgba(255,255,255,.85)}

  .react{position:absolute;top:-11px;width:23px;height:23px;border-radius:50%;
    border:1px solid var(--line);background:#1a2b33;color:var(--coral);
    font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center;
    opacity:0;transform:scale(.5);transition:opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1);}
  .msg.in .react{right:-8px}
  .msg.out .react{left:-8px}
  .msg:hover .react{opacity:1;transform:scale(1)}
  .react:hover{transform:scale(1.2)!important;background:#223640}
  .rchip{position:absolute;bottom:-11px;padding:2px 7px;border-radius:999px;
    background:#1d2f38;border:1px solid var(--line);font-size:11px;
    display:none;box-shadow:0 4px 10px rgba(0,0,0,.3);}
  .msg.in .rchip{right:-6px}
  .msg.out .rchip{left:-6px}
  .bubble.has-react .rchip{display:block;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

  /* typing indicator */
  .msg.typing{margin-top:16px}
  .tb{display:flex;align-items:center;gap:5px;padding:15px 17px}
  .tb i{width:7px;height:7px;border-radius:50%;background:var(--mint);opacity:.3;
    animation:tb 1.15s infinite ease-in-out;}
  .tb i:nth-child(2){animation-delay:.15s}
  .tb i:nth-child(3){animation-delay:.3s}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}

  /* ---------- composer ---------- */
  .composer{display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
  .bar{flex:1;display:flex;align-items:center;min-width:0;
    background:var(--field);border:1px solid var(--line);border-radius:25px;
    padding:4px 6px 4px 8px;transition:border-color .25s, box-shadow .25s;}
  .bar:focus-within{border-color:rgba(63,224,168,.45);box-shadow:0 0 0 3px rgba(63,224,168,.1)}
  .composer.shake .bar{animation:shake .4s;border-color:rgba(255,109,90,.6)}
  @keyframes shake{
    10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}
  }
  .bar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);
    font:inherit;font-size:14px;padding:10px 6px 10px 4px}
  .bar input::placeholder{color:var(--faint)}
  .emo{font-size:17px}
  .gbtn:active{transform:scale(.88)}

  .send{position:relative;flex:none;width:46px;height:46px;border-radius:23px;border:0;
    cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:linear-gradient(135deg,var(--out-1),var(--out-2));
    box-shadow:0 6px 16px rgba(255,100,80,.3);
    transition:width .4s cubic-bezier(.65,0,.35,1), box-shadow .3s, transform .15s;}
  .send svg{width:18px;height:18px;fill:#fff;flex:none;transform:rotate(-20deg);
    transition:transform .4s cubic-bezier(.65,0,.35,1)}
  .send .lbl{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:#fff;white-space:nowrap;
    max-width:0;opacity:0;transition:max-width .4s cubic-bezier(.65,0,.35,1), opacity .3s, margin .4s;}
  .send:hover{width:116px;box-shadow:0 9px 24px rgba(255,100,80,.46)}
  .send:hover svg{transform:rotate(0deg) translateX(-1px)}
  .send:hover .lbl{max-width:60px;opacity:1;margin-left:8px}
  .send:active{transform:scale(.9)}
  .send:focus-visible,.gbtn:focus-visible,.tab:focus-visible,.react:focus-visible{
    outline:2px solid var(--cyan);outline-offset:2px}

  /* ---------- responsive ---------- */
  @media (max-width:960px){.app{grid-template-columns:280px 1fr}}
  @media (max-width:700px){
    .app{grid-template-columns:1fr;padding:0 10px}
    .side{display:none}
    .msg{max-width:84%}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  }
</style>
</head>
<body>
<div class="amb" aria-hidden="true"></div>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <header class="side-head">
      <div class="logo-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </div>
      <div class="wordmark">CARRIER<small>secure messages</small></div>
      <span class="live"><i></i>live</span>
    </header>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search conversations…" autocomplete="off">
    </label>

    <div class="tabs" role="tablist">
      <button class="tab on" data-f="all">All</button>
      <button class="tab" data-f="unread" id="tabUnread">Unread</button>
    </div>

    <ul class="contacts" id="contactList"></ul>

    <footer class="me">
      <div class="avatar" style="--h:200">SA<i class="pd online"></i></div>
      <div class="who"><b>Sam Adeyemi</b><span>online</span></div>
      <button class="gbtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/>
        <path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
      </button>
    </footer>
  </aside>

  <!-- ============ CHAT ============ -->
  <main class="chat">
    <header class="chat-head">
      <span id="chAv"></span>
      <div>
        <div class="ch-name" id="chName">—</div>
        <div class="ch-stat" id="chStat"></div>
      </div>
      <div class="ch-actions">
        <button class="gbtn" title="Voice call" aria-label="Voice call">
          <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg>
        </button>
        <button class="gbtn" title="Video call" aria-label="Video call">
          <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
        <button class="gbtn" title="Details" aria-label="Details">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
    </header>

    <div class="thread" id="thread" aria-live="polite"></div>

    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="gbtn" id="attachBtn" title="Attach" aria-label="Attach">
        <svg viewBox="0 0 24 24"><path d="M21.4 11.05l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
      </button>
      <div class="bar">
        <input id="msgInput" type="text" placeholder="Message…" aria-label="Message">
        <button type="button" class="gbtn emo" id="emojiBtn" title="Emoji" aria-label="Insert emoji">🪸</button>
      </div>
      <button type="submit" class="send" aria-label="Send message">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        <span class="lbl">Send</span>
      </button>
    </form>
  </main>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const thread = $("#thread");
  const list = $("#contactList");
  const input = $("#msgInput");

  /* ---------------- data ---------------- */
  const contacts = [
    { id:"mira", name:"Mira Solano", initials:"MS", hue:165, presence:"online", typing:true,
      unread:0, last:"On it — sending mocks in a bit", time:"09:41",
      replies:["Ooh, show me 👀","Perfect — that's exactly the energy","Can you soften the easing a touch?","Love it. Shipping it to the client today.","Haha yes!","Adding that to the spec ✍️"],
      msgs:[
        {d:"Yesterday"},
        {o:0,x:"Hey! Did you see the palette for the tide-pool exhibit?",t:"18:02"},
        {o:0,x:"I went deep teal + bioluminescent coral 🪸",t:"18:03"},
        {o:1,x:"Just opened it — the coral accent is perfect",t:"18:11"},
        {o:1,x:"Ship it",t:"18:11"},
        {o:0,x:"One more thing… can the send button morph on hover?",t:"18:24"},
        {o:1,x:"Morph how? Like a circle into a pill?",t:"18:26"},
        {o:0,x:"Exactly. With the little plane sliding in ✈️",t:"18:27"},
        {d:"Today"},
        {o:0,x:"Morning! Any luck with the motion spec?",t:"09:12"},
        {o:1,x:"Prototyped it last night — pop-in bubbles, bouncing typing dots, the works",t:"09:38"},
        {o:0,x:"On it — sending mocks in a bit",t:"09:41"}
      ]},
    { id:"dev", name:"Dev Okonkwo", initials:"DO", hue:26, presence:"online", typing:true,
      unread:3, last:"Pushed the fix 🚀", time:"09:15",
      replies:["Nice — merging now","CI is green ✅","lol classic","Deploying to staging","Works on my machine 😏"],
      msgs:[
        {d:"Today"},
        {o:0,x:"Build's red again 😤",t:"08:55"},
        {o:0,x:"Same flaky test?",t:"08:56"},
        {o:1,x:"Yep — quarantining it now",t:"09:02"},
        {o:0,x:"Pushed the fix 🚀",t:"09:15"}
      ]},
    { id:"juke", name:"Jukebox Quartet", initials:"JQ", hue:210, presence:"away", typing:true,
      unread:5, last:"Setlist draft attached 🎸", time:"10:05",
      replies:["Rehearsal at 7, don't be late","Bring the amp!","🎷🎷🎷","Vote: funk or blues tonight?"],
      msgs:[
        {d:"Yesterday"},
        {o:0,x:"Rehearsal moved to 7pm",t:"17:40"},
        {o:0,x:"Bring the amp this time",t:"17:41"},
        {o:1,x:"Wouldn't forget it twice",t:"17:52"},
        {d:"Today"},
        {o:0,x:"Setlist draft attached 🎸",t:"10:05"}
      ]},
    { id:"priya", name:"Priya Nair", initials:"PN", hue:325, presence:"online", typing:true,
      unread:1, last:"Lunch at the noodle place?", time:"11:20",
      replies:["Great, see you at 12:30!","I'm getting the ramen 🍜","You owe me a spring roll"],
      msgs:[
        {d:"Today"},
        {o:0,x:"Lunch at the noodle place?",t:"11:20"}
      ]},
    { id:"theo", name:"Theo Marchetti", initials:"TM", hue:45, presence:"away", typing:true,
      unread:0, last:"Anytime — row F isn't bad", time:"20:30",
      replies:["See you Friday!","🎟️🎟️","Don't forget my jacket"],
      msgs:[
        {d:"Yesterday"},
        {o:1,x:"Thanks for the tickets!",t:"20:15"},
        {o:0,x:"Anytime — row F isn't bad",t:"20:30"}
      ]},
    { id:"nadia", name:"Nadia Petrov", initials:"NP", hue:198, presence:"online", typing:true,
      unread:0, last:"Review when you get a sec 🙏", time:"10:48",
      replies:["Thanks for the quick look!","Fixed in the latest commit","☕ on me tomorrow"],
      msgs:[
        {d:"Today"},
        {o:0,x:"Review when you get a sec 🙏",t:"10:48"},
        {o:1,x:"On it after standup",t:"10:52"}
      ]}
  ];

  const ambient = ["ping — you around?","Sent you the file 📎","Can we sync at 3?","☕ coffee run?",
    "New build is up","Did you see the announcement?","👍","Meeting moved to 4:15","Thoughts on this?"];

  let activeId = "mira";
  let tab = "all";
  let typingRow = null;
  const replyIdx = {};

  /* ---------------- helpers ---------------- */
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const now = () => {
    const d = new Date();
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  };
  const byId = id => contacts.find(c => c.id === id);
  const avatar = (c, cls) =>
    `<div class="avatar ${cls||""}" style="--h:${c.hue}">${c.initials}<i class="pd ${c.presence}"></i></div>`;

  /* ---------------- contact list ---------------- */
  function renderContacts(bumpId){
    const q = $("#searchInput").value.trim().toLowerCase();
    let rows = contacts.filter(c =>
      (tab === "all" || c.unread > 0) &&
      (!q || c.name.toLowerCase().includes(q))
    );
    if (!rows.length){
      list.innerHTML = `<li class="empty">— no conversations match —</li>`;
    } else {
      list.innerHTML = rows.map(c => `
        <li class="contact ${c.id===activeId?"on":""} ${c.unread?"unread":""}" data-id="${c.id}">
          ${avatar(c)}
          <div class="cm">
            <div class="r1"><span class="nm">${c.name}</span><time>${c.time}</time></div>
            <div class="r2">
              <span class="pv">${esc(c.last)}</span>
              ${c.unread ? `<span class="badge">${c.unread}</span>` : ""}
            </div>
          </div>
        </li>`).join("");
    }
    const total = contacts.reduce((n,c)=>n+c.unread,0);
    $("#tabUnread").innerHTML = total ? `Unread <b>${total}</b>` : "Unread";
    if (bumpId){
      const b = list.querySelector(`.contact[data-id="${bumpId}"] .badge`);
      if (b) b.classList.add("bump");
      const p = list.querySelector(`.contact[data-id="${bumpId}"] .pv`);
      if (p) p.classList.add("flash");
    }
  }

  /* ---------------- thread ---------------- */
  function msgRow(c, dir, x, t, cls, delay){
    const av = (dir==="in" && (cls==="gfirst"||cls==="gonly")) ? avatar(c,"sm") : '<span class="sp"></span>';
    const meta = dir==="out"
      ? `<span class="meta">${t}&nbsp;<span class="ticks">✓✓</span></span>`
      : `<span class="meta">${t}</span>`;
    return `<div class="msg ${dir} ${cls}" style="--d:${delay}ms">
      ${av}
      <div class="bubble">
        <p>${esc(x)}</p>${meta}
        <button type="button" class="react" aria-label="React">♥</button>
        <span class="rchip">❤️</span>
      </div>
    </div>`;
  }

  function renderThread(c){
    let html = "", prev = null, i = 0;
    const items = c.msgs;
    for (let k = 0; k < items.length; k++){
      const it = items[k];
      if (it.d){
        html += `<div class="day" style="--d:${Math.min(i*45,560)}ms"><span>${it.d}</span></div>`;
        prev = null; i++;
        continue;
      }
      const dir = it.o ? "out" : "in";
      let next = items[k+1];
      const samePrev = prev === dir;
      const sameNext = next && !next.d && ((next.o ? "out":"in") === dir);
      const cls = samePrev ? (sameNext ? "gmid" : "glast")
                           : (sameNext ? "gfirst" : "gonly");
      html += msgRow(c, dir, it.x, it.t, cls, Math.min(i*45,560));
      prev = dir; i++;
    }
    html += `<div class="msg in gonly typing" id="typingRow" style="--d:${Math.min(i*45,600)}ms">
      ${avatar(c,"sm")}
      <div class="bubble tb" aria-label="${c.name.split(" ")[0]} is typing"><i></i><i></i><i></i></div>
    </div>`;
    thread.innerHTML = html;
    typingRow = $("#typingRow");
    thread.scrollTop = thread.scrollHeight;
  }

  function appendMsg(c, dir, x, t){
    const wrap = document.createElement("div");
    wrap.innerHTML = msgRow(c, dir, x, t, "gonly", 0);
    const row = wrap.firstChild;
    thread.insertBefore(row, typingRow);
    thread.scrollTo({top: thread.scrollHeight, behavior:"smooth"});
  }

  /* ---------------- chat header ---------------- */
  function openChat(id){
    activeId = id;
    const c = byId(id);
    c.unread = 0;
    $("#chAv").innerHTML = avatar(c,"lg");
    $("#chName").textContent = c.name;
    const stat = $("#chStat");
    if (c.typing){
      stat.className = "ch-stat";
      stat.innerHTML = `typing<span class="tds"><i></i><i></i><i></i></span>`;
    } else {
      stat.className = "ch-stat " + c.presence;
      stat.textContent = c.presence;
    }
    input.placeholder = "Message " + c.name.split(" ")[0] + "…";
    renderContacts();
    renderThread(c);
  }

  /* ---------------- events ---------------- */
  list.addEventListener("click", e => {
    const li = e.target.closest(".contact");
    if (li) openChat(li.dataset.id);
  });

  document.querySelectorAll(".tab").forEach(t =>
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
      t.classList.add("on");
      tab = t.dataset.f;
      renderContacts();
    }));

  $("#searchInput").addEventListener("input", () => renderContacts());

  /* reactions */
  thread.addEventListener("click", e => {
    const b = e.target.closest(".react");
    if (!b) return;
    const bub = b.closest(".bubble");
    bub.classList.toggle("has-react");
  });

  /* composer */
  const composer = $("#composer");
  composer.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text){
      composer.classList.add("shake");
      setTimeout(() => composer.classList.remove("shake"), 450);
      return;
    }
    const c = byId(activeId);
    appendMsg(c, "out", text, now());
    input.value = "";
    c.last = text; c.time = now();
    renderContacts();
    /* simulated reply */
    setTimeout(() => {
      if (!replyIdx[c.id]) replyIdx[c.id] = 0;
      const r = c.replies[replyIdx[c.id]++ % c.replies.length];
      appendMsg(c, "in", r, now());
      c.last = r; c.time = now();
      renderContacts();
    }, 1500 + Math.random()*1300);
  });

  /* emoji cycler */
  const emojis = ["🪸","✨","🌊","🫧","🐙","⚡","🌴"];
  let ei = 0;
  const emojiBtn = $("#emojiBtn");
  emojiBtn.addEventListener("click", () => {
    input.value += emojis[ei];
    ei = (ei + 1) % emojis.length;
    emojiBtn.textContent = emojis[ei];
    input.focus();
  });

  /* attach wiggle */
  $("#attachBtn").addEventListener("click", function(){
    this.classList.remove("wiggle"); void this.offsetWidth; this.classList.add("wiggle");
  });

  /* ambient incoming traffic on other contacts */
  setInterval(() => {
    const pool = contacts.filter(c => c.id !== activeId);
    const c = pool[Math.floor(Math.random()*pool.length)];
    c.unread++;
    c.last = ambient[Math.floor(Math.random()*ambient.length)];
    c.time = now();
    renderContacts(c.id);
  }, 11000);

  /* ---------------- boot ---------------- */
  openChat(activeId);
})();
</script>
</body>
</html>
