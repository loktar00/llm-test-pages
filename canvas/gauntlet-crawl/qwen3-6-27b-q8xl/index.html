<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gauntlet Crawl</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
window.ASSET_MANIFEST = {
  floor:     { file: "assets/floor.png",     prompt: "seamless 512x512 dungeon stone floor tile, top-down view, dark gray cobblestone pattern, subtle cracks and moss, fantasy game asset, neutral lighting, no borders" },
  wall:      { file: "assets/wall.png",      prompt: "seamless 512x512 dungeon wall tile, top-down view, dark gray stone blocks with mortar lines, subtle shadow on bottom edge, fantasy game asset, neutral lighting, no borders" },
  hero:      { file: "assets/hero.png",      prompt: "top-down knight hero sprite, 64x64 centered, wearing golden armor and blue cape, holding a sword, plain dark background, pixel art style, fantasy game asset, facing forward" },
  ghost:     { file: "assets/ghost.png",      prompt: "top-down ghost enemy sprite, 48x48 centered, translucent pale green ghost with glowing red eyes and flowing bottom, plain dark background, pixel art style, fantasy game asset" },
  grunt:     { file: "assets/grunt.png",      prompt: "top-down orc grunt enemy sprite, 48x48 centered, green skin, brown armor, holding a club, plain dark background, pixel art style, fantasy game asset, facing forward" },
  generator: { file: "assets/generator.png", prompt: "top-down monster generator portal, 64x64 centered, swirling purple vortex with dark rim and glowing particles, plain dark background, pixel art style, fantasy game asset" },
  key:       { file: "assets/key.png",       prompt: "top-down golden key sprite, 32x32 centered, ornate fantasy key with round bow and single tooth, glowing golden aura, plain dark background, pixel art style, game asset" },
  food:      { file: "assets/food.png",       prompt: "top-down food item sprite, 32x32 centered, golden bread loaf with warm glow, plain dark background, pixel art style, fantasy game asset" },
  treasure:  { file: "assets/treasure.png",  prompt: "top-down treasure chest sprite, 32x32 centered, open wooden chest overflowing with gold coins and gems, warm golden glow, plain dark background, pixel art style, game asset" },
  exit:      { file: "assets/exit.png",      prompt: "top-down dungeon exit stairway, 64x64 centered, descending stone spiral staircase with blue magical glow, plain dark background, pixel art style, fantasy game asset" }
};

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

// --- Constants ---
const TILE = 40;
const MAP_W = 40, MAP_H = 30;
const PLAYER_SPEED = 180;
const PROJ_SPEED = 400;
const GHOST_SPEED = 55;
const GRUNT_SPEED = 70;
const GEN_HP = 4;
const GRUNT_HP = 2;
const GHOST_HP = 1;
const HEALTH_DRAIN_RATE = 0.3;
const MAX_HEALTH = 100;
const INACTIVITY_TIMEOUT = 10000;

// --- Asset Loading ---
const assets = {};
for (const [key, val] of Object.entries(window.ASSET_MANIFEST)) {
  const img = new Image();
  img.src = val.file;
  img.onload = () => { assets[key] = img; };
  img.onerror = () => {};
}

// --- Input ---
const keys = {};
let lastInputTime = 0;
let playerControl = false;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  lastInputTime = Date.now();
  if (!playerControl) playerControl = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('touchstart', () => {
  lastInputTime = Date.now();
  if (!playerControl) playerControl = true;
});

// --- Noise & Maze ---
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}

function generateMaze(level) {
  const rng = seededRandom(level * 1337 + 42);
  const grid = [];
  for (let y = 0; y < MAP_H; y++) {
    grid[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      grid[y][x] = 1; // wall
    }
  }

  // Recursive backtracker
  const visited = Array.from({length: MAP_H}, () => Array(MAP_W).fill(false));
  const stack = [];

  function carve(x, y) {
    visited[y][x] = true;
    grid[y][x] = 0;
    const dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(() => rng() - 0.5);
    for (const [dx, dy] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx > 0 && nx < MAP_W-1 && ny > 0 && ny < MAP_H-1 && !visited[ny][nx]) {
        grid[y + dy/2][x + dx/2] = 0;
        carve(nx, ny);
        return;
      }
    }
  }

  carve(1, 1);

  // Open up some extra passages for loops
  for (let i = 0; i < MAP_W * MAP_H * 0.08; i++) {
    const x = 1 + Math.floor(rng() * (MAP_W - 2));
    const y = 1 + Math.floor(rng() * (MAP_H - 2));
    if (grid[y][x] === 1) {
      let adj = 0;
      if (y > 0 && grid[y-1][x] === 0) adj++;
      if (y < MAP_H-1 && grid[y+1][x] === 0) adj++;
      if (x > 0 && grid[y][x-1] === 0) adj++;
      if (x < MAP_W-1 && grid[y][x+1] === 0) adj++;
      if (adj >= 2) grid[y][x] = 0;
    }
  }

  return grid;
}

function findFloorTiles(grid) {
  const tiles = [];
  for (let y = 1; y < MAP_H-1; y++)
    for (let x = 1; x < MAP_W-1; x++)
      if (grid[y][x] === 0) tiles.push({x, y});
  return tiles;
}

function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

// --- Game State ---
let level = 1;
let score = 0;
let health = MAX_HEALTH;
let keysCollected = 0;
let grid = [];
let exitPos = {x: 0, y: 0};
let player = {x: 1.5, y: 1.5, dir: 0, shootTimer: 0, invuln: 0};
let projectiles = [];
let enemies = [];
let generators = [];
let items = [];
let particles = [];
let lastTime = 0;
let spawnTimer = 0;

function initLevel() {
  grid = generateMaze(level);
  const floors = findFloorTiles(grid);
  
  // Player start
  player.x = 1.5;
  player.y = 1.5;
  player.dir = 0;
  player.shootTimer = 0;
  player.invuln = 0;

  // Exit far from player
  let bestExit = floors[0];
  let bestDist = 0;
  for (const t of floors) {
    const d = dist(t, {x:1, y:1});
    if (d > bestDist && t.x > MAP_W/3 && t.y > MAP_H/3) {
      bestDist = d;
      bestExit = t;
    }
  }
  exitPos = bestExit;

  projectiles = [];
  enemies = [];
  generators = [];
  items = [];
  particles = [];
  keysCollected = 0;

  // Place generators
  const genCount = 2 + Math.floor(level * 0.5);
  const used = new Set();
  used.add('1,1');
  used.add(`${exitPos.x},${exitPos.y}`);
  
  for (let i = 0; i < genCount; i++) {
    let attempts = 0;
    while (attempts < 200) {
      const t = floors[Math.floor(Math.random() * floors.length)];
      const k = `${t.x},${t.y}`;
      if (!used.has(k) && dist(t, {x:1, y:1}) > 8) {
        generators.push({x: t.x + 0.5, y: t.y + 0.5, hp: GEN_HP, type: Math.random() < 0.5 ? 'ghost' : 'grunt'});
        used.add(k);
        break;
      }
      attempts++;
    }
  }

  // Place keys
  const keyCount = 1 + Math.floor(level / 3);
  for (let i = 0; i < keyCount; i++) {
    let attempts = 0;
    while (attempts < 200) {
      const t = floors[Math.floor(Math.random() * floors.length)];
      const k = `${t.x},${t.y}`;
      if (!used.has(k)) {
        items.push({x: t.x + 0.5, y: t.y + 0.5, type: 'key'});
        used.add(k);
        break;
      }
      attempts++;
    }
  }

  // Place food
  const foodCount = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < foodCount; i++) {
    let attempts = 0;
    while (attempts < 200) {
      const t = floors[Math.floor(Math.random() * floors.length)];
      const k = `${t.x},${t.y}`;
      if (!used.has(k)) {
        items.push({x: t.x + 0.5, y: t.y + 0.5, type: 'food'});
        used.add(k);
        break;
      }
      attempts++;
    }
  }

  // Place treasure
  const treasureCount = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < treasureCount; i++) {
    let attempts = 0;
    while (attempts < 200) {
      const t = floors[Math.floor(Math.random() * floors.length)];
      const k = `${t.x},${t.y}`;
      if (!used.has(k)) {
        items.push({x: t.x + 0.5, y: t.y + 0.5, type: 'treasure'});
        used.add(k);
        break;
      }
      attempts++;
    }
  }
}

function canMove(x, y, radius) {
  const r = radius || 0.3;
  return grid[Math.floor(y - r)]?.[Math.floor(x - r)] === 0 &&
         grid[Math.floor(y - r)]?.[Math.floor(x + r)] === 0 &&
         grid[Math.floor(y + r)]?.[Math.floor(x - r)] === 0 &&
         grid[Math.floor(y + r)]?.[Math.floor(x + r)] === 0;
}

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 120,
      vy: (Math.random() - 0.5) * 120,
      life: 0.3 + Math.random() * 0.4,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

// --- Drawing Functions ---
function drawTile(type, x, y, s) {
  if (assets[type]) {
    ctx.drawImage(assets[type], x * s, y * s, s, s);
    return;
  }
  if (type === 'floor') {
    ctx.fillStyle = '#2a2a35';
    ctx.fillRect(x * s, y * s, s, s);
    ctx.fillStyle = '#252530';
    ctx.fillRect(x * s + 1, y * s + 1, s - 2, s - 2);
    ctx.strokeStyle = '#333340';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(x * s + 0.5, y * s + 0.5, s - 1, s - 1);
  } else if (type === 'wall') {
    ctx.fillStyle = '#4a4a5a';
    ctx.fillRect(x * s, y * s, s, s);
    ctx.fillStyle = '#555568';
    ctx.fillRect(x * s + 2, y * s + 2, s - 4, s - 4);
    ctx.fillStyle = '#3a3a4a';
    ctx.fillRect(x * s + s - 3, y * s + 2, 3, s - 4);
    ctx.fillRect(x * s + 2, y * s + s - 3, s - 4, 3);
  }
}

function drawHero(px, py, s) {
  if (assets.hero) {
    ctx.drawImage(assets.hero, px * s - s/2, py * s - s/2, s, s);
    return;
  }
  const cx = px * s, cy = py * s;
  // Body
  ctx.fillStyle = '#4488cc';
  ctx.fillRect(cx - s*0.25, cy - s*0.25, s*0.5, s*0.5);
  // Helmet
  ctx.fillStyle = '#cccc44';
  ctx.fillRect(cx - s*0.2, cy - s*0.3, s*0.4, s*0.25);
  // Cape
  ctx.fillStyle = '#cc2222';
  const capeDir = [Math.cos(player.dir), Math.sin(player.dir)];
  ctx.beginPath();
  ctx.moveTo(cx - s*0.15, cy + s*0.1);
  ctx.lineTo(cx + capeDir[0] * s*0.3, cy + capeDir[1] * s*0.3);
  ctx.lineTo(cx + s*0.15, cy + s*0.1);
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - s*0.08, cy - s*0.18, s*0.06, s*0.06);
  ctx.fillRect(cx + s*0.02, cy - s*0.18, s*0.06, s*0.06);
}

function drawEnemy(e, s) {
  const cx = e.x * s, cy = e.y * s;
  const type = e.type;
  
  if (type === 'ghost' && assets.ghost) {
    ctx.drawImage(assets.ghost, cx - s/2, cy - s/2, s, s);
    return;
  }
  if (type === 'grunt' && assets.grunt) {
    ctx.drawImage(assets.grunt, cx - s/2, cy - s/2, s, s);
    return;
  }

  if (type === 'ghost') {
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#88cc44';
    ctx.beginPath();
    ctx.arc(cx, cy - s*0.1, s*0.3, Math.PI, 0);
    ctx.lineTo(cx + s*0.3, cy + s*0.2);
    for (let i = 0; i < 4; i++) {
      const wx = cx + s*0.3 - (i+0.5) * s*0.15;
      ctx.lineTo(wx, cy + s*0.2 + (i%2 ? -s*0.08 : s*0.08));
    }
    ctx.lineTo(cx - s*0.3, cy + s*0.2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#ff2222';
    ctx.fillRect(cx - s*0.12, cy - s*0.15, s*0.08, s*0.08);
    ctx.fillRect(cx + s*0.04, cy - s*0.15, s*0.08, s*0.08);
    ctx.globalAlpha = 1;
  } else {
    // Grunt
    ctx.fillStyle = '#448833';
    ctx.fillRect(cx - s*0.25, cy - s*0.25, s*0.5, s*0.5);
    ctx.fillStyle = '#664422';
    ctx.fillRect(cx - s*0.3, cy - s*0.15, s*0.6, s*0.12);
    ctx.fillStyle = '#ffcc44';
    ctx.fillRect(cx - s*0.1, cy - s*0.2, s*0.08, s*0.08);
    ctx.fillRect(cx + s*0.02, cy - s*0.2, s*0.08, s*0.08);
    ctx.fillStyle = '#884422';
    ctx.fillRect(cx + s*0.2, cy - s*0.05, s*0.15, s*0.08);
  }
}

function drawGenerator(g, s) {
  const cx = g.x * s, cy = g.y * s;
  if (assets.generator) {
    ctx.drawImage(assets.generator, cx - s/2, cy - s/2, s, s);
    return;
  }
  const t = Date.now() / 500;
  ctx.fillStyle = '#220033';
  ctx.beginPath();
  ctx.arc(cx, cy, s*0.4, 0, Math.PI*2);
  ctx.fill();
  for (let i = 0; i < 6; i++) {
    const a = t + i * Math.PI / 3;
    ctx.fillStyle = `hsl(${270 + i*20}, 80%, ${50 + Math.sin(t*2+i)*20}%)`;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a)*s*0.2, cy + Math.sin(a)*s*0.2, s*0.1, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.strokeStyle = '#aa44ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, s*0.35, 0, Math.PI*2);
  ctx.stroke();
}

function drawItem(item, s) {
  const cx = item.x * s, cy = item.y * s;
  const t = Date.now() / 300;
  const bob = Math.sin(t + item.x * 3) * s * 0.05;

  if (item.type === 'key' && assets.key) {
    ctx.drawImage(assets.key, cx - s/2, cy - s/2 + bob, s, s);
    return;
  }
  if (item.type === 'food' && assets.food) {
    ctx.drawImage(assets.food, cx - s/2, cy - s/2 + bob, s, s);
    return;
  }
  if (item.type === 'treasure' && assets.treasure) {
    ctx.drawImage(assets.treasure, cx - s/2, cy - s/2 + bob, s, s);
    return;
  }

  if (item.type === 'key') {
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath();
    ctx.arc(cx, cy + bob - s*0.1, s*0.12, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(cx - s*0.03, cy + bob, s*0.06, s*0.2);
    ctx.fillRect(cx + s*0.03, cy + bob + s*0.1, s*0.1, s*0.04);
    ctx.fillStyle = '#ffee88';
    ctx.beginPath();
    ctx.arc(cx, cy + bob - s*0.1, s*0.06, 0, Math.PI*2);
    ctx.fill();
  } else if (item.type === 'food') {
    ctx.fillStyle = '#dd8833';
    ctx.beginPath();
    ctx.ellipse(cx, cy + bob, s*0.2, s*0.15, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#eeaa44';
    ctx.beginPath();
    ctx.ellipse(cx, cy + bob - s*0.05, s*0.15, s*0.1, 0, 0, Math.PI*2);
    ctx.fill();
  } else if (item.type === 'treasure') {
    ctx.fillStyle = '#884422';
    ctx.fillRect(cx - s*0.2, cy + bob - s*0.15, s*0.4, s*0.3);
    ctx.fillStyle = '#ffcc22';
    ctx.fillRect(cx - s*0.15, cy + bob - s*0.1, s*0.3, s*0.2);
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(cx - s*0.05, cy + bob, s*0.04, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#4444ff';
    ctx.beginPath();
    ctx.arc(cx + s*0.05, cy + bob + s*0.03, s*0.03, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawExit(s) {
  const cx = exitPos.x * s + s/2, cy = exitPos.y * s + s/2;
  if (assets.exit) {
    ctx.drawImage(assets.exit, exitPos.x * s, exitPos.y * s, s, s);
    return;
  }
  const t = Date.now() / 400;
  for (let i = 3; i >= 0; i--) {
    ctx.fillStyle = `rgba(40, 80, 200, ${0.3 + i * 0.15})`;
    ctx.beginPath();
    ctx.arc(cx, cy, s*0.35 - i*s*0.08, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = '#4488ff';
  ctx.beginPath();
  ctx.arc(cx, cy, s*0.15 + Math.sin(t)*s*0.05, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#66aaff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, s*0.3, 0, Math.PI*2);
  ctx.stroke();
}

// --- AI Controller ---
function aiUpdate(dt) {
  let dx = 0, dy = 0;
  
  // Find nearest interesting target
  let target = null;
  let minDist = Infinity;
  
  // Prioritize: food (if low health) > keys > treasure > exit > generators > enemies
  if (health < 40) {
    for (const item of items) {
      if (item.type === 'food') {
        const d = dist(player, item);
        if (d < minDist) { minDist = d; target = item; }
      }
    }
  }
  if (!target) {
    for (const item of items) {
      if (item.type === 'key') {
        const d = dist(player, item);
        if (d < minDist) { minDist = d; target = item; }
      }
    }
  }
  if (!target) {
    for (const item of items) {
      if (item.type === 'treasure') {
        const d = dist(player, item);
        if (d < minDist) { minDist = d; target = item; }
      }
    }
  }
  if (!target && keysCollected >= 1 + Math.floor(level / 3)) {
    const d = dist(player, exitPos);
    if (d < minDist) { minDist = d; target = exitPos; }
  }
  if (!target) {
    for (const g of generators) {
      const d = dist(player, g);
      if (d < minDist) { minDist = d; target = g; }
    }
  }
  if (!target) {
    for (const e of enemies) {
      const d = dist(player, e);
      if (d < minDist && d < 5) { minDist = d; target = e; }
    }
  }
  if (!target) {
    // Wander toward center
    target = {x: MAP_W/2, y: MAP_H/2};
  }

  // Move toward target with simple pathfinding
  const tdx = target.x - player.x;
  const tdy = target.y - player.y;
  const tdist = Math.sqrt(tdx*tdx + tdy*tdy);
  
  if (tdist > 0.5) {
    const nx = tdx / tdist;
    const ny = tdy / tdist;
    
    // Try to move, with obstacle avoidance
    const moves = [
      {dx: Math.sign(nx), dy: 0},
      {dx: 0, dy: Math.sign(ny)},
      {dx: Math.sign(nx), dy: Math.sign(ny)},
      {dx: -Math.sign(ny), dy: Math.sign(nx)},
      {dx: Math.sign(ny), dy: -Math.sign(nx)},
    ];
    
    for (const m of moves) {
      if (canMove(player.x + m.dx * dt * PLAYER_SPEED / TILE, player.y + m.dy * dt * PLAYER_SPEED / TILE, 0.25)) {
        dx = m.dx;
        dy = m.dy;
        break;
      }
    }
  }

  // Shoot if enemy or generator nearby
  let shooting = false;
  for (const e of enemies) {
    const d = dist(player, e);
    if (d < 4) { shooting = true; break; }
  }
  if (!shooting) {
    for (const g of generators) {
      const d = dist(player, g);
      if (d < 5) { shooting = true; break; }
    }
  }

  return {dx, dy, shooting};
}

// --- Main Update ---
function update(dt) {
  // Check inactivity
  if (playerControl && Date.now() - lastInputTime > INACTIVITY_TIMEOUT) {
    playerControl = false;
  }

  let moveX = 0, moveY = 0, shooting = false;

  if (playerControl) {
    if (keys['ArrowUp'] || keys['KeyW']) moveY = -1;
    if (keys['ArrowDown'] || keys['KeyS']) moveY = 1;
    if (keys['ArrowLeft'] || keys['KeyA']) moveX = -1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX = 1;
    shooting = !!keys['Space'];
  } else {
    const ai = aiUpdate(dt);
    moveX = ai.dx;
    moveY = ai.dy;
    shooting = ai.shooting;
  }

  // Normalize movement
  if (moveX !== 0 || moveY !== 0) {
    const len = Math.sqrt(moveX*moveX + moveY*moveY);
    moveX /= len;
    moveY /= len;
    player.dir = Math.atan2(moveY, moveX);
  }

  // Move player
  const speed = PLAYER_SPEED * dt;
  const nx = player.x + moveX * speed / TILE;
  const ny = player.y + moveY * speed / TILE;
  
  if (canMove(nx, player.y, 0.25)) player.x = nx;
  if (canMove(player.x, ny, 0.25)) player.y = ny;

  // Clamp to map
  player.x = Math.max(0.3, Math.min(MAP_W - 0.3, player.x));
  player.y = Math.max(0.3, Math.min(MAP_H - 0.3, player.y));

  // Shooting
  player.shootTimer -= dt;
  if (shooting && player.shootTimer <= 0) {
    player.shootTimer = 0.25;
    const pdx = Math.cos(player.dir);
    const pdy = Math.sin(player.dir);
    projectiles.push({
      x: player.x + pdx * 0.4,
      y: player.y + pdy * 0.4,
      vx: pdx * PROJ_SPEED,
      vy: pdy * PROJ_SPEED,
      life: 2
    });
  }

  // Update projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt / TILE;
    p.y += p.vy * dt / TILE;
    p.life -= dt;

    // Hit wall
    if (p.life <= 0 || grid[Math.floor(p.y)]?.[Math.floor(p.x)] === 1) {
      addParticles(p.x, p.y, '#ffaa44', 3);
      projectiles.splice(i, 1);
      continue;
    }

    // Hit enemies
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.abs(p.x - e.x) < 0.4 && Math.abs(p.y - e.y) < 0.4) {
        e.hp--;
        addParticles(e.x, e.y, e.type === 'ghost' ? '#88cc44' : '#448833', 5);
        if (e.hp <= 0) {
          score += e.type === 'ghost' ? 100 : 150;
          addParticles(e.x, e.y, '#ffffff', 8);
          enemies.splice(j, 1);
        }
        projectiles.splice(i, 1);
        hit = true;
        break;
      }
    }
    if (hit) continue;

    // Hit generators
    for (let j = generators.length - 1; j >= 0; j--) {
      const g = generators[j];
      if (Math.abs(p.x - g.x) < 0.5 && Math.abs(p.y - g.y) < 0.5) {
        g.hp--;
        addParticles(g.x, g.y, '#aa44ff', 5);
        if (g.hp <= 0) {
          score += 500;
          addParticles(g.x, g.y, '#ff44ff', 12);
          generators.splice(j, 1);
        }
        projectiles.splice(i, 1);
        break;
      }
    }
  }

  // Spawn enemies from generators
  spawnTimer -= dt;
  if (spawnTimer <= 0 && generators.length > 0) {
    spawnTimer = 2 + Math.random() * 2;
    const g = generators[Math.floor(Math.random() * generators.length)];
    if (enemies.length < 20 + level * 2) {
      enemies.push({
        x: g.x + (Math.random()-0.5)*0.5,
        y: g.y + (Math.random()-0.5)*0.5,
        type: g.type,
        hp: g.type === 'ghost' ? GHOST_HP : GRUNT_SPEED,
        speed: g.type === 'ghost' ? GHOST_SPEED : GRUNT_SPEED
      });
    }
  }

  // Update enemies
  for (const e of enemies) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > 0.3) {
      const ex = (dx/d) * e.speed * dt / TILE;
      const ey = (dy/d) * e.speed * dt / TILE;
      const enx = e.x + ex;
      const eny = e.y + ey;
      if (canMove(enx, e.y, 0.25)) e.x = enx;
      if (canMove(e.x, eny, 0.25)) e.y = eny;
    }

    // Damage player
    if (Math.abs(e.x - player.x) < 0.5 && Math.abs(e.y - player.y) < 0.5) {
      if (player.invuln <= 0) {
        health -= 10;
        player.invuln = 0.5;
        addParticles(player.x, player.y, '#ff4444', 6);
      }
    }
  }

  player.invuln -= dt;

  // Health drain
  health -= HEALTH_DRAIN_RATE * dt;

  // Collect items
  for (let i = items.length - 1; i >= 0; i--) {
    const item = items[i];
    if (Math.abs(item.x - player.x) < 0.5 && Math.abs(item.y - player.y) < 0.5) {
      if (item.type === 'key') {
        keysCollected++;
        addParticles(item.x, item.y, '#ffdd44', 6);
      } else if (item.type === 'food') {
        health = Math.min(MAX_HEALTH, health + 25);
        addParticles(item.x, item.y, '#44ff44', 6);
      } else if (item.type === 'treasure') {
        score += 200;
        addParticles(item.x, item.y, '#ffcc22', 6);
      }
      items.splice(i, 1);
    }
  }

  // Check exit
  if (Math.abs(exitPos.x + 0.5 - player.x) < 0.5 && Math.abs(exitPos.y + 0.5 - player.y) < 0.5) {
    if (keysCollected >= 1 + Math.floor(level / 3)) {
      level++;
      initLevel();
    }
  }

  // Death
  if (health <= 0) {
    health = MAX_HEALTH;
    score = Math.max(0, score - 500);
    level = 1;
    initLevel();
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt / TILE;
    p.y += p.vy * dt / TILE;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// --- Render ---
function render() {
  const w = canvas.width;
  const h = canvas.height;
  
  // Camera
  const camX = player.x * TILE - w / 2;
  const camY = player.y * TILE - h / 2;
  
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, w, h);
  
  ctx.save();
  ctx.translate(-camX, -camY);

  // Draw tiles
  const startX = Math.max(0, Math.floor(camX / TILE));
  const startY = Math.max(0, Math.floor(camY / TILE));
  const endX = Math.min(MAP_W, Math.ceil((camX + w) / TILE) + 1);
  const endY = Math.min(MAP_H, Math.ceil((camY + h) / TILE) + 1);

  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      if (grid[y][x] === 1) {
        drawTile('wall', x, y, TILE);
      } else {
        drawTile('floor', x, y, TILE);
      }
    }
  }

  // Draw exit
  drawExit(TILE);

  // Draw items
  for (const item of items) {
    drawItem(item, TILE);
  }

  // Draw generators
  for (const g of generators) {
    drawGenerator(g, TILE);
  }

  // Draw enemies
  for (const e of enemies) {
    drawEnemy(e, TILE);
  }

  // Draw player
  if (player.invuln <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
    drawHero(player.x, player.y, TILE);
  }

  // Draw projectiles
  for (const p of projectiles) {
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath();
    ctx.arc(p.x * TILE, p.y * TILE, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x * TILE, p.y * TILE, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw particles
  for (const p of particles) {
    ctx.globalAlpha = p.life / 0.5;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x * TILE - p.size/2, p.y * TILE - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // --- HUD ---
  const hudY = 10;
  const hudX = 10;
  
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, w, 50);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 50);
  ctx.lineTo(w, 50);
  ctx.stroke();

  ctx.font = 'bold 16px monospace';
  ctx.textBaseline = 'middle';

  // Health bar
  ctx.fillStyle = '#441111';
  ctx.fillRect(hudX, hudY + 10, 150, 16);
  const hpPct = Math.max(0, health / MAX_HEALTH);
  ctx.fillStyle = hpPct > 0.3 ? '#cc2222' : '#ff4444';
  ctx.fillRect(hudX, hudY + 10, 150 * hpPct, 16);
  ctx.strokeStyle = '#888';
  ctx.strokeRect(hudX, hudY + 10, 150, 16);
  ctx.fillStyle = '#fff';
  ctx.fillText(`HP ${Math.ceil(health)}/${MAX_HEALTH}`, hudX + 5, hudY + 18);

  // Score
  ctx.fillStyle = '#ffcc44';
  ctx.fillText(`SCORE: ${score}`, hudX + 170, hudY + 18);

  // Level
  ctx.fillStyle = '#44aaff';
  ctx.fillText(`LEVEL ${level}`, hudX + 370, hudY + 18);

  // Keys
  const needed = 1 + Math.floor(level / 3);
  ctx.fillStyle = '#ffdd44';
  ctx.fillText(`KEYS: ${keysCollected}/${needed}`, hudX + 500, hudY + 18);

  // Mode indicator
  if (!playerControl) {
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    ctx.fillText('ATTRACT MODE — Press any key to play', hudX, hudY + 38);
  } else {
    ctx.fillStyle = '#44ff44';
    ctx.font = '12px monospace';
    ctx.fillText('PLAYER CONTROL', hudX, hudY + 38);
  }

  // Enemies remaining hint
  if (generators.length > 0) {
    ctx.fillStyle = '#aa44ff';
    ctx.font = '12px monospace';
    ctx.fillText(`${generators.length} generator${generators.length>1?'s':''} active`, hudX + 200, hudY + 38);
  }
}

// --- Resize ---
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Game Loop ---
initLevel();
lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  
  update(dt);
  render();
  
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
