<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Falling Sand — auto-pour particle toy</title>
<style>
:root{
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --disp:'Impact','Haettenschweiler','Arial Black','Franklin Gothic Medium',sans-serif;
  --ink:#cfd8e6;--dim:#7e8ba1;--line:#2a3448;--panel:rgba(9,12,19,.86);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#07090f}
body{font-family:var(--mono);cursor:crosshair;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#veil{position:fixed;inset:0;pointer-events:none;z-index:2;background:
  radial-gradient(130% 100% at 50% 38%,transparent 55%,rgba(3,5,9,.62) 100%),
  linear-gradient(180deg,rgba(96,124,205,.055),transparent 16%)}
.hud{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.045);
  padding:10px 14px;color:var(--ink);font-size:11px;letter-spacing:.08em;
  animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
.tl{top:16px;left:16px;animation-delay:.05s}
.tr{top:16px;right:16px;text-align:right;animation-delay:.16s;min-width:176px}
.bl{bottom:16px;left:16px;animation-delay:.27s;min-width:176px}
.br{bottom:16px;right:16px;animation-delay:.38s;color:var(--dim);text-align:right}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(30px,4.2vw,50px);line-height:.92;
  letter-spacing:.03em;color:#f4e7c6;text-shadow:3px 3px 0 #8a4516,6px 6px 0 rgba(0,0,0,.4)}
h1 span{color:#e8a33c}
.sub{margin:7px 0 0;font-size:9px;color:var(--dim);letter-spacing:.3em}
.cursor{color:#e8a33c;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lab{color:var(--dim);font-size:9px;letter-spacing:.3em;margin-bottom:4px}
#dot{display:inline-block;font-style:normal;width:8px;height:8px;margin-left:6px;background:#e8c26a;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.45);opacity:.55}}
.big{font-family:var(--disp);font-size:26px;letter-spacing:.08em;color:#f4e7c6;margin:1px 0 7px}
.bar{width:100%;height:6px;border:1px solid var(--line);background:#0b0f17}
.bar i{display:block;height:100%;width:100%;background:#e8c26a}
.mini{margin-top:7px;color:var(--dim);font-size:9px;letter-spacing:.18em}
#legend .row{display:flex;align-items:center;gap:9px;padding:3px 5px;margin:0 -5px;cursor:pointer;
  transition:transform .12s ease,background .12s ease}
#legend .row:hover{transform:translateX(3px);background:rgba(255,255,255,.05)}
#legend .row.on{background:rgba(232,194,106,.12);box-shadow:inset 0 0 0 1px rgba(232,194,106,.45)}
#legend .row.static{cursor:default}
#legend .row.static:hover{transform:none;background:none}
.chip{width:10px;height:10px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.row b{font-weight:700;letter-spacing:.12em}
.row span{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.br div{margin:3px 0}
kbd{display:inline-block;border:1px solid var(--line);background:#141a28;color:var(--ink);
  padding:1px 5px;font-family:var(--mono);font-size:9px;letter-spacing:.05em}
#pauseStamp{position:fixed;inset:0;z-index:6;display:none;place-items:center;pointer-events:none}
body.paused #pauseStamp{display:grid}
#pauseStamp span{font-family:var(--disp);font-size:clamp(40px,8vw,72px);letter-spacing:.25em;color:#f4e7c6;
  border:3px solid #f4e7c6;padding:10px 18px 10px 32px;background:rgba(7,9,15,.72);
  text-shadow:4px 4px 0 rgba(0,0,0,.55);animation:stamp .28s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{from{transform:scale(1.7);opacity:0}}
body.nohud .hud{display:none}
@media(max-width:680px){.br{display:none}.tr{min-width:0}.big{font-size:20px}h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){.hud,#dot,.cursor,#pauseStamp span{animation:none}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="veil"></div>

<header class="hud tl">
  <h1>FALLING <span>SAND</span></h1>
  <p class="sub">AUTO-POUR PARTICLE TOY <span class="cursor">▮</span></p>
</header>

<div class="hud tr">
  <div class="lab">EMITTER FEED <i id="dot"></i></div>
  <div class="big" id="phaseName">SAND</div>
  <div class="bar"><i id="phaseBar"></i></div>
  <div class="mini"><span id="fps">60</span> FPS · GRID <span id="grid">—</span></div>
</div>

<div class="hud bl" id="legend">
  <div class="lab">MATTER · LIVE COUNT</div>
  <div class="row on" data-mat="1"><i class="chip" style="--c:#e8c26a"></i><b>SAND</b><span id="cSand">0</span></div>
  <div class="row" data-mat="2"><i class="chip" style="--c:#4f9fe8"></i><b>WATER</b><span id="cWater">0</span></div>
  <div class="row" data-mat="7"><i class="chip" style="--c:#ff8c3a"></i><b>FIRE</b><span id="cFire">0</span></div>
  <div class="row" data-mat="4"><i class="chip" style="--c:#9a6a34"></i><b>WOOD</b><span id="cWood">0</span></div>
  <div class="row" data-mat="3"><i class="chip" style="--c:#77839b"></i><b>STONE</b><span id="cStone">0</span></div>
  <div class="row static"><i class="chip" style="--c:#9fb4c8"></i><b>VAPOR</b><span id="cGas">0</span></div>
</div>

<div class="hud br">
  <div><kbd>1</kbd>–<kbd>5</kbd> material · <kbd>drag</kbd> pour</div>
  <div><kbd>R-drag</kbd> erase · <kbd>space</kbd> pause</div>
  <div><kbd>R</kbd> reset · <kbd>H</kbd> hud</div>
</div>

<div id="pauseStamp"><span>PAUSED</span></div>

<script>
(()=>{ 'use strict';
const T_EMPTY=0,T_SAND=1,T_WATER=2,T_STONE=3,T_WOOD=4,T_BURN=5,T_FIRE=6,T_EMBER=7,T_SMOKE=8,T_STEAM=9,T_ASH=10;
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const simCv=document.createElement('canvas'),simCtx=simCv.getContext('2d');
const glowCv=document.createElement('canvas'),glowCtx=glowCv.getContext('2d');
const gsCv=document.createElement('canvas'),gsCtx=gsCv.getContext('2d');
const $=id=>document.getElementById(id);
const ePhase=$('phaseName'),eBar=$('phaseBar'),eDot=$('dot'),eFps=$('fps'),eGrid=$('grid'),
      eSand=$('cSand'),eWater=$('cWater'),eFire=$('cFire'),eWood=$('cWood'),eStone=$('cStone'),eGas=$('cGas');

let cssW=0,cssH=0,dpr=1,gW=0,gH=0,cell=6;
let type,life,shade,hp,stamp,img,sim32,glowImg,glow32,bgRow;
let stoneBP=[],woodBP=[];
let frame=0,simTime=0,paused=false,fps=60,lastHud=0;

const PHASES=[[T_SAND,8],[T_WATER,5],[T_SAND,5],[T_EMBER,3.2],[T_WATER,4.5],[T_SAND,6],[T_EMBER,2.6]];
let phaseIdx=0,phaseT=0,phaseDur=PHASES[0][1],emitAcc=0,ex=10;
const RATE=[];RATE[T_SAND]=150;RATE[T_WATER]=240;RATE[T_EMBER]=55;
const MCOL=[];MCOL[T_SAND]='#e8c26a';MCOL[T_WATER]='#5fb0f2';MCOL[T_EMBER]='#ff9a3c';

const rnd=n=>(Math.random()*n)|0;
function pack(r,g,b){r=r<0?0:(r>255?255:r);g=g<0?0:(g>255?255:g);b=b<0?0:(b>255?255:b);return (255<<24)|(b<<16)|(g<<8)|r;}
const packA=(r,g,b,a)=>(a<<24)|(b<<16)|(g<<8)|r;

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  cssW=window.innerWidth;cssH=window.innerHeight;
  canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);
  cell=Math.max(4,Math.round(Math.min(cssW,cssH)/150));
  gW=Math.max(64,Math.floor(cssW/cell));gH=Math.max(48,Math.floor(cssH/cell));
  simCv.width=gW;simCv.height=gH;glowCv.width=gW;glowCv.height=gH;
  gsCv.width=Math.max(1,gW>>2);gsCv.height=Math.max(1,gH>>2);
  gsCtx.imageSmoothingEnabled=true;
  img=simCtx.createImageData(gW,gH);sim32=new Uint32Array(img.data.buffer);
  glowImg=glowCtx.createImageData(gW,gH);glow32=new Uint32Array(glowImg.data.buffer);
  bgRow=new Uint32Array(gH);
  for(let y=0;y<gH;y++){const f=y/gH;bgRow[y]=pack(13+f*12,16+f*9,24+f*16);}
  buildScene();
}

function buildScene(){
  const n=gW*gH;
  type=new Uint8Array(n);life=new Uint8Array(n);shade=new Uint8Array(n);
  hp=new Uint8Array(n);stamp=new Uint8Array(n);
  stoneBP.length=0;woodBP.length=0;
  const putStone=(x,y)=>{
    if(x<0||x>=gW||y<0||y>=gH)return;const i=y*gW+x;
    if(type[i]!==T_EMPTY&&type[i]!==T_STONE)return;
    type[i]=T_STONE;hp[i]=110+rnd(90);shade[i]=rnd(256);stoneBP.push(i);
  };
  const putWood=(x,y)=>{
    if(x<0||x>=gW||y<0||y>=gH)return;const i=y*gW+x;
    if(type[i]!==T_EMPTY&&type[i]!==T_WOOD)return;
    type[i]=T_WOOD;shade[i]=rnd(256);woodBP.push(i);
  };
  for(let x=0;x<gW;x++)for(let y=gH-3;y<gH;y++)putStone(x,y);
  const ledges=[
    {y:.80,x0:.03,x1:.33,t:3,lip:true},
    {y:.66,x0:.50,x1:.97,t:3,lip:true},
    {y:.50,x0:.08,x1:.40,t:2,lip:false},
    {y:.36,x0:.56,x1:.88,t:2,lip:true},
    {y:.22,x0:.16,x1:.36,t:2,lip:false}
  ];
  for(const L of ledges){
    const y0=Math.round(L.y*gH),x0=Math.round(L.x0*gW),x1=Math.round(L.x1*gW);
    for(let x=x0;x<=x1;x++){
      if(Math.random()<0.05)continue;
      const thick=L.t+(((Math.sin(x*0.7)+1)*0.5)|0);
      for(let k=0;k<thick;k++)putStone(x,y0+k);
      if(L.lip&&(x<=x0+1||x>=x1-1)){putStone(x,y0-1);putStone(x,y0-2);}
    }
  }
  const woods=[{y:.735,x0:.375,x1:.50},{y:.575,x0:.655,x1:.795},{y:.435,x0:.30,x1:.435},{y:.29,x0:.72,x1:.86}];
  for(const P of woods){
    const y0=Math.round(P.y*gH),x0=Math.round(P.x0*gW),x1=Math.round(P.x1*gW);
    for(let x=x0;x<=x1;x++){putWood(x,y0);putWood(x,y0+1);}
  }
}

/* ---------- simulation ---------- */
function swapCells(i,j){
  stamp[j]=stamp[i];
  let t=type[i];type[i]=type[j];type[j]=t;
  t=life[i];life[i]=life[j];life[j]=t;
  t=shade[i];shade[i]=shade[j];shade[j]=t;
}
const clear=i=>{type[i]=T_EMPTY;life[i]=0;};
function setCell(i,t,l,s){type[i]=t;life[i]=l;if(s>=0)shade[i]=s;}
const fallable=(t,sink)=>t===T_EMPTY||t===T_FIRE||t===T_SMOKE||t===T_STEAM||t===T_EMBER||(sink&&t===T_WATER);
function absorbMove(i,j,tj){
  if(tj===T_WATER){swapCells(i,j);return;}
  type[j]=type[i];life[j]=life[i];shade[j]=shade[i];stamp[j]=stamp[i];
  type[i]=T_EMPTY;life[i]=0;
}
function erode(i){
  const h=hp[i]-(6+rnd(9));
  if(h<=0){
    const above=i-gW;
    if(Math.random()<0.35){type[i]=T_SAND;life[i]=0;shade[i]=rnd(80);}
    else{
      type[i]=T_EMPTY;life[i]=0;
      if(above>=0&&type[above]===T_EMPTY&&Math.random()<0.5)setCell(above,T_SMOKE,30+rnd(30),-1);
    }
  }else hp[i]=h;
}
function nbHas(i,x,y,t){
  if(x>0&&type[i-1]===t)return true;
  if(x<gW-1&&type[i+1]===t)return true;
  if(y>0&&type[i-gW]===t)return true;
  if(y<gH-1&&type[i+gW]===t)return true;
  return false;
}
function igniteNbWood(i,x,y,p){
  if(x>0&&type[i-1]===T_WOOD&&Math.random()<p)setCell(i-1,T_BURN,130+rnd(90),20+rnd(40));
  if(x<gW-1&&type[i+1]===T_WOOD&&Math.random()<p)setCell(i+1,T_BURN,130+rnd(90),20+rnd(40));
  if(y>0&&type[i-gW]===T_WOOD&&Math.random()<p)setCell(i-gW,T_BURN,130+rnd(90),20+rnd(40));
  if(y<gH-1&&type[i+gW]===T_WOOD&&Math.random()<p)setCell(i+gW,T_BURN,130+rnd(90),20+rnd(40));
}

function updSand(i,x,y){
  if(y+1>=gH)return;
  const b=i+gW,bt=type[b];
  if(fallable(bt,true)){absorbMove(i,b,bt);return;}
  const d=Math.random()<0.5?1:-1;
  for(let s=0;s<2;s++){
    const dd=s?-d:d,xx=x+dd;
    if(xx<0||xx>=gW)continue;
    const j=b+dd,jt=type[j];
    if(fallable(jt,true)){absorbMove(i,j,jt);return;}
  }
  if(bt===T_STONE&&Math.random()<0.008)erode(b);
}

function updWater(i,x,y){
  const row=y*gW;
  if(y+1<gH){
    const b=i+gW,bt=type[b];
    if(bt===T_EMPTY||bt===T_SMOKE||bt===T_STEAM){swapCells(i,b);return;}
    if(bt===T_FIRE||bt===T_EMBER){setCell(b,T_STEAM,60+rnd(50),-1);clear(i);return;}
    if(bt===T_BURN){
      setCell(b,T_WOOD,0,15+rnd(25));
      if(Math.random()<0.6)setCell(i,T_STEAM,60+rnd(50),-1);
      return;
    }
    const d=Math.random()<0.5?1:-1;
    for(let s=0;s<2;s++){
      const dd=s?-d:d,xx=x+dd;
      if(xx<0||xx>=gW)continue;
      const j=b+dd,jt=type[j];
      if(jt===T_EMPTY||jt===T_SMOKE||jt===T_STEAM){swapCells(i,j);return;}
      if(jt===T_FIRE||jt===T_EMBER){setCell(j,T_STEAM,60+rnd(50),-1);clear(i);return;}
    }
  }
  let d=life[i]?1:-1;
  for(let s=0;s<2;s++){
    const dd=s?-d:d;
    let far=-1;
    for(let k=1;k<=4;k++){
      const xx=x+dd*k;
      if(xx<0||xx>=gW)break;
      const j=row+xx,jt=type[j];
      if(jt===T_EMPTY||jt===T_SMOKE||jt===T_STEAM)far=j;
      else if(jt===T_FIRE||jt===T_EMBER){far=j;break;}
      else break;
    }
    if(far>=0){
      const ft=type[far];
      if(ft===T_FIRE||ft===T_EMBER){setCell(far,T_STEAM,60+rnd(50),-1);clear(i);}
      else{swapCells(i,far);life[far]=dd>0?1:0;}
      return;
    }
  }
  life[i]=d>0?0:1;
  if(y+1<gH&&type[i+gW]===T_STONE&&Math.random()<0.0015)erode(i+gW);
}

function updFire(i,x,y){
  if(nbHas(i,x,y,T_WATER)){setCell(i,T_STEAM,50+rnd(40),-1);return;}
  igniteNbWood(i,x,y,0.05);
  const l=life[i]-1;
  if(l<=0){if(Math.random()<0.45)setCell(i,T_SMOKE,60+rnd(70),-1);else clear(i);return;}
  life[i]=l;
  if(y>0&&Math.random()<0.8){
    const a=Math.random()<0.5?1:-1,cand=[0,a,-a];
    for(let k=0;k<3;k++){
      const dd=cand[k],xx=x+dd;
      if(xx<0||xx>=gW)continue;
      const j=i-gW+dd;
      if(type[j]===T_EMPTY){swapCells(i,j);break;}
    }
  }else if(Math.random()<0.3){
    const dd=Math.random()<0.5?-1:1,xx=x+dd;
    if(xx>=0&&xx<gW&&type[i+dd]===T_EMPTY)swapCells(i,i+dd);
  }
  if(y>0&&type[i-gW]===T_EMPTY&&Math.random()<0.05)setCell(i-gW,T_SMOKE,70+rnd(60),-1);
}

function updBurn(i,x,y){
  if(nbHas(i,x,y,T_WATER)){
    setCell(i,T_WOOD,0,15+rnd(25));
    if(x>0&&type[i-1]===T_WATER&&Math.random()<0.5)setCell(i-1,T_STEAM,60+rnd(40),-1);
    else if(x<gW-1&&type[i+1]===T_WATER&&Math.random()<0.5)setCell(i+1,T_STEAM,60+rnd(40),-1);
    else if(y>0&&type[i-gW]===T_WATER&&Math.random()<0.5)setCell(i-gW,T_STEAM,60+rnd(40),-1);
    else if(y<gH-1&&type[i+gW]===T_WATER&&Math.random()<0.5)setCell(i+gW,T_STEAM,60+rnd(40),-1);
    return;
  }
  const l=life[i]-1;
  if(l<=0){
    const r=Math.random();
    if(r<0.4)setCell(i,T_ASH,0,-1);
    else if(r<0.7)setCell(i,T_FIRE,20+rnd(20),-1);
    else clear(i);
    return;
  }
  life[i]=l;
  if(y>0&&type[i-gW]===T_EMPTY){
    const r=Math.random();
    if(r<0.28)setCell(i-gW,T_FIRE,25+rnd(45),-1);
    else if(r<0.40)setCell(i-gW,T_SMOKE,70+rnd(70),-1);
  }
}

function updEmber(i,x,y){
  if(nbHas(i,x,y,T_WATER)){setCell(i,T_STEAM,50+rnd(40),-1);return;}
  igniteNbWood(i,x,y,0.25);
  if(y+1<gH){
    const b=i+gW,bt=type[b];
    if(bt===T_EMPTY){
      swapCells(i,b);
      if(Math.random()<0.12)setCell(i,T_SMOKE,35+rnd(30),-1);
    }else if(bt===T_WOOD){setCell(b,T_BURN,130+rnd(90),20+rnd(40));setCell(i,T_FIRE,35+rnd(25),-1);return;}
    else if(bt===T_WATER){setCell(i,T_STEAM,50+rnd(40),-1);return;}
    else{setCell(i,T_FIRE,35+rnd(30),-1);return;}
  }else{setCell(i,T_FIRE,35+rnd(30),-1);return;}
  const l=life[i]-1;
  if(l<=0)setCell(i,T_FIRE,30+rnd(25),-1);else life[i]=l;
}

function updGas(i,x,y,kind){
  const l=life[i]-1;
  if(l<=0){clear(i);return;}
  life[i]=l;
  const p=kind===T_STEAM?0.85:0.65;
  if(y>0&&Math.random()<p){
    const a=Math.random()<0.5?1:-1,cand=[0,a,-a];
    for(let k=0;k<3;k++){
      const dd=cand[k],xx=x+dd;
      if(xx<0||xx>=gW)continue;
      const j=i-gW+dd;
      if(type[j]===T_EMPTY){swapCells(i,j);return;}
    }
  }
  if(Math.random()<0.4){
    const dd=Math.random()<0.5?-1:1,xx=x+dd;
    if(xx>=0&&xx<gW&&type[i+dd]===T_EMPTY)swapCells(i,i+dd);
  }
  if(kind===T_STEAM&&y<3&&Math.random()<0.3)clear(i);
}

function updAsh(i,x,y){
  if(y+1<gH&&type[i+gW]===T_WATER&&Math.random()<0.003){clear(i);return;}
  if(Math.random()>0.75)return;
  if(y+1<gH){
    const b=i+gW,bt=type[b];
    if(bt===T_EMPTY){swapCells(i,b);return;}
    if(bt!==T_ASH){
      const d=Math.random()<0.5?1:-1;
      for(let s=0;s<2;s++){
        const dd=s?-d:d,xx=x+dd;
        if(xx<0||xx>=gW)continue;
        if(type[b+dd]===T_EMPTY){swapCells(i,b+dd);return;}
      }
    }
  }
}

function hasNb(i,t){
  const x=i%gW,y=(i/gW)|0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const xx=x+dx,yy=y+dy;
    if(xx<0||xx>=gW||yy<0||yy>=gH)continue;
    if(type[yy*gW+xx]===t)return true;
  }
  return false;
}
function hotNear(i){
  const x=i%gW,y=(i/gW)|0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const xx=x+dx,yy=y+dy;
    if(xx<0||xx>=gW||yy<0||yy>=gH)continue;
    const t=type[yy*gW+xx];
    if(t===T_FIRE||t===T_EMBER||t===T_BURN)return true;
  }
  return false;
}
function regen(){
  for(let n=0;n<12;n++){
    const i=stoneBP[(Math.random()*stoneBP.length)|0];
    if(type[i]!==T_EMPTY||Math.random()>0.012)continue;
    if(hasNb(i,T_STONE)||Math.random()<0.03){type[i]=T_STONE;hp[i]=110+rnd(90);shade[i]=rnd(256);}
  }
  for(let n=0;n<10;n++){
    const i=woodBP[(Math.random()*woodBP.length)|0];
    if(type[i]!==T_EMPTY||Math.random()>0.01)continue;
    if((hasNb(i,T_WOOD)||Math.random()<0.01)&&!hotNear(i)){type[i]=T_WOOD;shade[i]=rnd(256);}
  }
}

function step(){
  frame++;
  const st=frame&255,ltr=(frame&1)===0;
  for(let y=gH-1;y>=0;y--){
    const row=y*gW;
    for(let k=0;k<gW;k++){
      const x=ltr?k:gW-1-k,i=row+x,t=type[i];
      if(t===T_EMPTY||t===T_STONE||t===T_WOOD)continue;
      if(stamp[i]===st)continue;
      stamp[i]=st;
      switch(t){
        case T_SAND:updSand(i,x,y);break;
        case T_WATER:updWater(i,x,y);break;
        case T_FIRE:updFire(i,x,y);break;
        case T_EMBER:updEmber(i,x,y);break;
        case T_BURN:updBurn(i,x,y);break;
        case T_SMOKE:updGas(i,x,y,T_SMOKE);break;
        case T_STEAM:updGas(i,x,y,T_STEAM);break;
        case T_ASH:updAsh(i,x,y);break;
      }
    }
  }
  regen();
}

/* ---------- emitter ---------- */
function emitter(dt){
  simTime+=dt;phaseT+=dt;
  if(phaseT>=phaseDur){
    phaseT=0;
    phaseIdx=(phaseIdx+1)%PHASES.length;
    phaseDur=PHASES[phaseIdx][1]*(0.85+Math.random()*0.35);
  }
  const mat=PHASES[phaseIdx][0];
  ex=gW*(0.5+0.40*Math.sin(simTime*0.45)+0.06*Math.sin(simTime*1.33+2.1));
  if(ex<2)ex=2;if(ex>gW-3)ex=gW-3;
  emitAcc+=RATE[mat]*dt;
  let n=0;
  while(emitAcc>=1&&n<40){
    emitAcc--;n++;
    const x=Math.round(ex)+rnd(3)-1;
    if(x<1||x>=gW-1)continue;
    const i=(1+rnd(2))*gW+x;
    if(type[i]!==T_EMPTY)continue;
    if(mat===T_SAND){type[i]=T_SAND;shade[i]=rnd(256);}
    else if(mat===T_WATER){type[i]=T_WATER;life[i]=rnd(2);shade[i]=rnd(256);}
    else{type[i]=T_EMBER;life[i]=50+rnd(40);shade[i]=rnd(256);}
  }
}

/* ---------- render ---------- */
function render(){
  const d=sim32,gd=glow32,fl=frame;
  gd.fill(0);
  for(let y=0;y<gH;y++){
    const row=y*gW,bg=bgRow[y];
    for(let x=0;x<gW;x++){
      const i=row+x,t=type[i];
      let c=bg;
      switch(t){
        case T_EMPTY:{
          const h=((x*73856093)^(y*19349663))>>>0;
          if((h&511)<3){
            const tw=0.5+0.5*Math.sin(fl*0.03+((h>>>8)&255));
            const v=(20+tw*14)|0;
            c=pack(v,v+4,v+10);
          }
          break;}
        case T_SAND:{const s=shade[i]>>3;c=pack(193+s,154+s,84+(s>>1));break;}
        case T_WATER:{
          const s=shade[i]>>4;
          let r=38+s,g=110+s,b=190+(s<<1);
          if(y>0&&type[i-gW]!==T_WATER){r=120;g=190;b=240;}
          c=pack(r,g,b);break;}
        case T_STONE:{
          const s=shade[i]>>3,e=hp[i]<100?(100-hp[i])*0.3:0;
          c=pack(72+s-e,80+s-e,95+s-e*0.8);break;}
        case T_WOOD:{
          const s=shade[i]>>3,gr=((x+y)&1)?6:-6;
          c=pack(122+s+gr,82+(s>>1)+gr,44+(s>>2));break;}
        case T_BURN:{
          const f=Math.random();
          c=f<0.5?pack(200+f*55,90+f*60,25):pack(90,45,20);
          gd[i]=packA(255,120,30,140);break;}
        case T_FIRE:{
          const l=life[i],r0=Math.random();
          if(l>45||r0<0.3)c=pack(255,230,140);
          else if(l>20||r0<0.7)c=pack(255,150,40);
          else c=pack(230,70,25);
          gd[i]=packA(255,140,40,170);break;}
        case T_EMBER:{
          const f=Math.sin(fl*0.5+i)*0.5+0.5;
          c=pack(255,140+f*80,40);
          gd[i]=packA(255,120,30,150);break;}
        case T_SMOKE:{
          const l=life[i],v=18+(l>90?40:l*0.44)|0;
          c=pack(v,v+3,v+8);break;}
        case T_STEAM:{
          const l=life[i]>120?120:life[i],a=l/120;
          c=pack(60+a*90,70+a*95,85+a*100);break;}
        case T_ASH:{const s=shade[i]>>3;c=pack(52+s,52+s,56+s);break;}
      }
      d[i]=c;
    }
  }
  simCtx.putImageData(img,0,0);
  glowCtx.putImageData(glowImg,0,0);
  gsCtx.clearRect(0,0,gsCv.width,gsCv.height);
  gsCtx.drawImage(glowCv,0,0,gsCv.width,gsCv.height);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(simCv,0,0,cssW,cssH);
  ctx.globalCompositeOperation='lighter';
  ctx.imageSmoothingEnabled=true;
  ctx.globalAlpha=0.55;ctx.drawImage(gsCv,0,0,cssW,cssH);
  ctx.globalAlpha=0.28;ctx.drawImage(glowCv,0,0,cssW,cssH);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.imageSmoothingEnabled=false;
  drawNozzle();
}

function drawNozzle(){
  const m=PHASES[phaseIdx][0],col=MCOL[m];
  const px=ex*cell,w=cell*4,bob=Math.sin(simTime*6)*1.5;
  ctx.fillStyle='#1b2130';ctx.fillRect(px-w/2-3,0,w+6,cell*2+7+bob);
  ctx.fillStyle='#2c3550';ctx.fillRect(px-w/2,0,w,cell*2+3+bob);
  ctx.fillStyle='#48557a';ctx.fillRect(px-w/2-3,cell*2+5+bob,w+6,3);
  ctx.fillStyle=col;ctx.fillRect(px-3,cell+2+bob,6,6);
}

/* ---------- hud ---------- */
function hud(now){
  if(now-lastHud<200)return;
  lastHud=now;
  let cs=0,cw=0,cf=0,cwd=0,cst=0,cg=0;
  for(let i=0;i<type.length;i++){
    const t=type[i];
    if(t===T_SAND||t===T_ASH)cs++;
    else if(t===T_WATER)cw++;
    else if(t===T_FIRE||t===T_EMBER||t===T_BURN)cf++;
    else if(t===T_WOOD)cwd++;
    else if(t===T_STONE)cst++;
    else if(t===T_SMOKE||t===T_STEAM)cg++;
  }
  eSand.textContent=cs;eWater.textContent=cw;eFire.textContent=cf;
  eWood.textContent=cwd;eStone.textContent=cst;eGas.textContent=cg;
  eFps.textContent=Math.round(fps);
  eGrid.textContent=gW+'×'+gH;
  const m=PHASES[phaseIdx][0],col=MCOL[m];
  ePhase.textContent=m===T_SAND?'SAND':m===T_WATER?'WATER':'FIRE';
  eDot.style.background=col;eDot.style.boxShadow='0 0 10px '+col;
  eBar.style.background=col;
  eBar.style.width=Math.max(0,(1-phaseT/phaseDur)*100)+'%';
}

/* ---------- input ---------- */
let userMat=T_SAND,pouring=false;
function select(m){
  userMat=m;
  document.querySelectorAll('#legend .row[data-mat]').forEach(r=>{
    r.classList.toggle('on',+r.dataset.mat===m);
  });
}
function pour(e){
  const gx=(e.clientX/cell)|0,gy=(e.clientY/cell)|0;
  const erase=(e.buttons&2)!==0,r=erase?4:2;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r)continue;
    const x=gx+dx,y=gy+dy;
    if(x<0||x>=gW||y<0||y>=gH)continue;
    const i=y*gW+x;
    if(erase){if(type[i]!==T_EMPTY)clear(i);continue;}
    switch(userMat){
      case T_SAND:if((type[i]===T_EMPTY||type[i]===T_WATER)&&Math.random()<0.6){type[i]=T_SAND;shade[i]=rnd(256);}break;
      case T_WATER:if(type[i]===T_EMPTY&&Math.random()<0.8){type[i]=T_WATER;life[i]=rnd(2);shade[i]=rnd(256);}break;
      case T_EMBER:if(type[i]===T_EMPTY&&Math.random()<0.5){type[i]=T_EMBER;life[i]=50+rnd(40);shade[i]=rnd(256);}break;
      case T_WOOD:if(type[i]===T_EMPTY||type[i]===T_WATER){type[i]=T_WOOD;shade[i]=rnd(256);}break;
      case T_STONE:type[i]=T_STONE;hp[i]=150;shade[i]=rnd(256);break;
    }
  }
}
canvas.addEventListener('pointerdown',e=>{pouring=true;pour(e);});
canvas.addEventListener('pointermove',e=>{if(pouring)pour(e);});
window.addEventListener('pointerup',()=>pouring=false);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('#legend .row[data-mat]').forEach(r=>{
  r.addEventListener('click',()=>select(+r.dataset.mat));
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;document.body.classList.toggle('paused',paused);e.preventDefault();}
  else if(e.key==='1')select(T_SAND);
  else if(e.key==='2')select(T_WATER);
  else if(e.key==='3')select(T_EMBER);
  else if(e.key==='4')select(T_WOOD);
  else if(e.key==='5')select(T_STONE);
  else if(e.key==='h'||e.key==='H')document.body.classList.toggle('nohud');
  else if(e.key==='r'||e.key==='R')buildScene();
});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,180);});

/* ---------- main loop ---------- */
let last=performance.now(),acc=0;
const STEP=1000/60;
function loop(now){
  requestAnimationFrame(loop);
  let dt=now-last;last=now;
  if(dt>250)dt=250;
  fps+=(1000/Math.max(1,dt)-fps)*0.08;
  if(!paused){
    acc+=dt;
    let n=0;
    while(acc>=STEP&&n<3){emitter(STEP/1000);step();acc-=STEP;n++;}
    if(n===3)acc=0;
  }
  render();
  hud(now);
}
resize();
select(T_SAND);
requestAnimationFrame(loop);
})();
</script>
