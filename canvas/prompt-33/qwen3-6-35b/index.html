<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Seasons Screensaver</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, groundY, trees = [], grassBlades = [], fireflies = [], rainDrops = [], snowDrops = [], fallingLeaves = [], stars = [], bats = [], flowers = [];
let squirrelX = 0, squirrelDir = 1, squirrelTimer = 0;
let santaAngle = 0;
let time = 0, lastTime = 0;

function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    groundY = H * 0.72;
    initScene();
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }

function initScene() {
    trees = [];
    const numTrees = Math.floor(W / (W * 0.08));
    for (let i = 0; i < numTrees; i++) {
        const tx = rand(W * 0.05, W * 0.95);
        const ty = groundY - rand(H * 0.02, H * 0.06);
        const scale = rand(0.5, 1.2);
        const depth = rand(0.3, 1);
        trees.push(createTree(tx, ty, scale, depth));
    }
    trees.sort((a, b) => a.depth - b.depth);

    grassBlades = [];
    for (let i = 0; i < 600; i++) {
        grassBlades.push({
            x: rand(0, W),
            y: groundY + rand(0, H * 0.3),
            h: rand(H * 0.015, H * 0.04),
            phase: rand(0, Math.PI * 2),
            speed: rand(0.8, 1.5)
        });
    }

    fireflies = [];
    for (let i = 0; i < 40; i++) {
        fireflies.push({
            x: rand(W * 0.1, W * 0.9),
            y: rand(groundY - H * 0.3, groundY - H * 0.05),
            vx: rand(-0.5, 0.5),
            vy: rand(-0.5, 0.5),
            phase: rand(0, Math.PI * 2),
            size: rand(2, 5)
        });
    }

    rainDrops = [];
    for (let i = 0; i < 200; i++) {
        rainDrops.push({
            x: rand(0, W),
            y: rand(0, H),
            speed: rand(8, 14),
            len: rand(10, 25),
            wind: -1
        });
    }

    snowDrops = [];
    for (let i = 0; i < 150; i++) {
        snowDrops.push({
            x: rand(0, W),
            y: rand(0, H),
            speed: rand(1, 3),
            size: rand(1, 4),
            wobble: rand(0, Math.PI * 2),
            wobbleSpeed: rand(0.02, 0.05)
        });
    }

    fallingLeaves = [];
    for (let i = 0; i < 50; i++) {
        fallingLeaves.push({
            x: rand(0, W),
            y: rand(-H * 0.1, groundY * 0.5),
            speed: rand(0.5, 2),
            wobble: rand(0, Math.PI * 2),
            wobbleSpeed: rand(0.02, 0.04),
            rot: rand(0, Math.PI * 2),
            rotSpeed: rand(-0.05, 0.05),
            size: rand(4, 8),
            color: ['#c44', '#a62', '#d84', '#e96', '#b52', '#f80'][Math.floor(rand(0, 6))]
        });
    }

    stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push({
            x: rand(0, W),
            y: rand(0, groundY * 0.8),
            size: rand(0.5, 2.5),
            twinkleSpeed: rand(0.02, 0.08),
            phase: rand(0, Math.PI * 2)
        });
    }

    bats = [];
    for (let i = 0; i < 8; i++) {
        bats.push({
            x: rand(W * 0.1, W * 0.9),
            y: rand(groundY - H * 0.4, groundY - H * 0.15),
            speed: rand(1, 3),
            dir: Math.random() > 0.5 ? 1 : -1,
            wingPhase: rand(0, Math.PI * 2),
            wingSpeed: rand(0.1, 0.2),
            size: rand(6, 12)
        });
    }

    flowers = [];
    for (let i = 0; i < 40; i++) {
        flowers.push({
            x: rand(W * 0.05, W * 0.95),
            y: groundY + rand(0, H * 0.25),
            size: rand(4, 8),
            color: ['#f4a', '#fa4', '#ff4', '#4af', '#f64', '#a4f'][Math.floor(rand(0, 6))],
            phase: rand(0, Math.PI * 2),
            petals: Math.floor(rand(4, 8))
        });
    }
}

function createTree(x, y, scale, depth) {
    const tree = { x, y, scale, depth, branches: [] };
    function addBranch(px, py, angle, len, thickness, depthLevel) {
        tree.branches.push({ px, py, angle, len, thickness, depth: depthLevel });
        if (depthLevel < 4 + Math.floor(rand(0, 2))) {
            const childCount = rand(0, 1) > 0.3 ? (2 + Math.floor(rand(0, 2))) : 1;
            for (let i = 0; i < childCount; i++) {
                const childAngle = angle + rand(-0.6, 0.6);
                const childLen = len * rand(0.6, 0.82);
                const childThick = thickness * rand(0.55, 0.75);
                const cx = px + Math.cos(angle) * len;
                const cy = py + Math.sin(angle) * len;
                addBranch(cx, cy, childAngle, childLen, childThick, depthLevel + 1);
            }
        }
    }
    const trunkLen = rand(40, 70) * scale;
    addBranch(x, y, -Math.PI / 2 + rand(-0.15, 0.15), trunkLen, rand(4, 8) * scale, 0);
    return tree;
}

function getSeason(t) {
    const cycle = t % 40;
    if (cycle < 10) return 'spring';
    if (cycle < 20) return 'summer';
    if (cycle < 30) return 'fall';
    return 'winter';
}

function getDayNight(t, season) {
    const cycle = t % 40;
    const seasonTime = cycle % 10;
    const dayProgress = seasonTime / 10;
    const isDay = seasonTime < 5;
    const progress = isDay ? dayProgress * 2 : (dayProgress - 0.5) * 2;
    return { isDay, progress, seasonTime };
}

function getSkyColors(season, isDay, progress) {
    let topColor, midColor, botColor;
    if (isDay) {
        const p = progress;
        const sunLow = p < 0.2;
        const sunHigh = p > 0.8;
        if (season === 'spring') {
            topColor = lerpColor([135, 180, 240], [100, 150, 220], p);
            midColor = lerpColor([180, 210, 250], [150, 200, 245], p);
            botColor = lerpColor([200, 220, 245], [180, 210, 240], p);
        } else if (season === 'summer') {
            topColor = lerpColor([80, 140, 220], [60, 120, 200], p);
            midColor = lerpColor([130, 185, 240], [110, 170, 235], p);
            botColor = lerpColor([170, 210, 245], [150, 200, 240], p);
        } else if (season === 'fall') {
            topColor = lerpColor([160, 180, 210], [140, 165, 200], p);
            midColor = lerpColor([195, 205, 225], [180, 195, 218], p);
            botColor = lerpColor([210, 215, 230], [200, 210, 225], p);
        } else {
            topColor = lerpColor([170, 190, 215], [155, 178, 208], p);
            midColor = lerpColor([200, 215, 235], [190, 208, 230], p);
            botColor = lerpColor([215, 225, 240], [210, 220, 235], p);
        }
        if (sunLow) {
            const g = sunLow ? p / 0.2 : (1 - p) / 0.2;
            topColor = lerpColor(topColor, [200, 140, 80], 0.4 * (1 - g));
            botColor = lerpColor(botColor, [240, 180, 100], 0.6 * (1 - g));
        }
    } else {
        const p = progress;
        const fadeToNight = Math.min(p / 0.3, 1);
        const fadeFromNight = p > 0.7 ? (p - 0.7) / 0.3 : 0;
        const nightAlpha = fadeToNight * (1 - fadeFromNight);

        if (season === 'spring') {
            topColor = lerpColor([135, 180, 240], [15, 20, 50], nightAlpha);
            midColor = lerpColor([180, 210, 250], [25, 30, 65], nightAlpha);
            botColor = lerpColor([200, 220, 245], [30, 35, 70], nightAlpha);
        } else if (season === 'summer') {
            topColor = lerpColor([60, 100, 180], [10, 12, 35], nightAlpha);
            midColor = lerpColor([100, 150, 220], [18, 20, 50], nightAlpha);
            botColor = lerpColor([140, 185, 230], [22, 25, 55], nightAlpha);
        } else if (season === 'fall') {
            topColor = lerpColor([140, 160, 190], [18, 22, 45], nightAlpha);
            midColor = lerpColor([175, 190, 210], [25, 28, 55], nightAlpha);
            botColor = lerpColor([195, 205, 220], [28, 30, 60], nightAlpha);
        } else {
            topColor = lerpColor([150, 170, 200], [12, 15, 40], nightAlpha);
            midColor = lerpColor([185, 200, 225], [20, 22, 50], nightAlpha);
            botColor = lerpColor([205, 215, 235], [25, 28, 55], nightAlpha);
        }
    }
    return { top: topColor, mid: midColor, bot: botColor };
}

function lerpColor(a, b, t) {
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
}

function rgb(c) { return `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`; }
function rgba(c, a) { return `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`; }

function drawSky(season, isDay, progress) {
    const colors = getSkyColors(season, isDay, progress);
    const grad = ctx.createLinearGradient(0, 0, 0, groundY);
    grad.addColorStop(0, rgb(colors.top));
    grad.addColorStop(0.5, rgb(colors.mid));
    grad.addColorStop(1, rgb(colors.bot));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, groundY + 10);
}

function drawSun(isDay, progress) {
    if (!isDay) return;
    const sunX = lerp(W * 0.08, W * 0.92, progress);
    const sunY = lerp(groundY + H * 0.05, groundY * 0.15, Math.sin(progress * Math.PI)) + H * 0.05;
    const sunR = W * 0.025;

    ctx.save();
    ctx.globalAlpha = 0.3;
    const glowGrad = ctx.createRadialGradient(sunX, sunY, sunR * 0.5, sunX, sunY, sunR * 5);
    glowGrad.addColorStop(0, 'rgba(255,240,180,0.8)');
    glowGrad.addColorStop(0.5, 'rgba(255,200,100,0.2)');
    glowGrad.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(sunX - sunR * 5, sunY - sunR * 5, sunR * 10, sunR * 10);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
    sunGrad.addColorStop(0, '#fff8e0');
    sunGrad.addColorStop(0.7, '#ffe44d');
    sunGrad.addColorStop(1, '#ffaa00');
    ctx.fillStyle = sunGrad;
    ctx.fill();
}

function drawMoon(isDay, progress) {
    if (isDay) return;
    const moonX = lerp(W * 0.08, W * 0.92, progress);
    const moonY = lerp(groundY + H * 0.05, groundY * 0.15, Math.sin(progress * Math.PI)) + H * 0.05;
    const moonR = W * 0.02;

    ctx.save();
    ctx.globalAlpha = 0.2;
    const glowGrad = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 4);
    glowGrad.addColorStop(0, 'rgba(200,220,255,0.6)');
    glowGrad.addColorStop(1, 'rgba(150,180,255,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(moonX - moonR * 4, moonY - moonR * 4, moonR * 8, moonR * 8);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
    const moonGrad = ctx.createRadialGradient(moonX - moonR * 0.2, moonY - moonR * 0.2, 0, moonX, moonY, moonR);

    moonGrad.addColorStop(0.8, '#e8e8d0');
