<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Hello World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #c { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1;

  // === Configuration ===
  const PARTICLE_COUNT = 3500;
  const CYCLE_INTERVAL = 5000;
  const FONT_FAMILY = 'Arial';
  const FONT_WEIGHT = 'bold';

  // === Particle ===
  const p = [];
  class Particle {
    constructor() { this.init(); }
    init() {
      this.x = (W * 0.3) + (Math.random() - 0.5) * W * 0.4;
      this.y = (H * 0.3) + (Math.random() - 0.5) * H * 0.4;
      this.vx = 0;
      this.vy = 0;
      this.tx = W / 2;
      this.ty = H / 2;
      this.r = 1 + Math.random() * 4.2;
      this.r2 = this.r * this.r;
      // Color scheme
      const roll = Math.random();
      if (roll < 0.55) {
        const h = 48 + Math.random() * 12 - 6;
        const s = 95 + Math.random() * 5;
        const l = 45 + Math.random() * 25;
        this.color = `hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%`;
        this.alpha = 0.88 + Math.random() * 0.12;
        this.glow = 8;
      } else if (roll < 0.85) {
        const h = 5 + Math.random() * 10;
        const s = 95 + Math.random() * 5;
        const l = 55 + Math.random() * 25;
        this.color = `hsl(${h.toFixed(0)},${s.toFixed(0)}%,$`;
        this.alpha = 0.88 + Math.random() * 0.12;
        this.glow = 8;
      } else {
        const h = 30 + Math.random() * 30 - 15;
        const s = 95 + Math.random() * 5;
        const l = 50 + Math.random() * 30;
        this.color = `hsl(${h.toFixed(0)},${s.toFixed(0)}%,$`;
        this.alpha = 0.88 + Math.random() * 0.12;
        this.glow = 8;
      }
    }

    update() {
      const dx = this.tx - this.x;
      const dy = this.ty - this.y;
      const d2 = dx * dx + dy * dy;
      const d = Math.sqrt(d2) || 0.001;
      const f1 = (d2 < this.r2) ? 0 : 0.06;
      const f2 = 0.002;

      // Attract toward target (only when far enough
      const targetForce = Math.max(0.06 - d2 * 0.0, 0.6);
      const d = Math.sqrt(dx * dx + dy * dy) || 0.001;
      const ux = dx / d;
      const uy = dy / d;
      const f = this.r2 > d2 ? 0 : 0.6 * (1 - d / (this.r * 8));
      const a = Math.max(0.6 - d / 200, 0.1);

      this.vx += ux * f;
      this.vy += uy * f;

      // Gentle drift around target (when close)
      const driftRadius = 60;
      if (d < driftRadius) {
        const drift = (1 - d / driftRadius) * 0.02;
        // Orbital tangential drift (creates gentle wandering around target)
        const ang = Math.atan2(dy, dx);
        const tangentialX = -uy;
        const tangentialY = ux;
        const wander = (Math.sin(Date.now() * 0.001 + this.r2) * 2 - 1) * drift;
        this.vx += tangentialX * wander;
        this.vy += tangentialY * wander;
        // Small random wander
        const noise = drift * 0.5;
        this.vx += (Math.random() - 0.5) * noise;
        this.vy += (Math.random() - 0.5) * noise;
        // Damp heavily when close for floating feel
        this.vx *= 0.9;
        this.vy *= 0.9;
      } else {
        // Light damping during travel
        this.vx *= 0.97;
        this.vy *= 0.97;
      }

      this.x += this.vx;
      this.y += this.vy;

      // Cap speed for visual sanity
      const sp2 = this.vx * this.vx + this.vy * this.vy;
      if (sp2 > 25) {
        const sp = Math.sqrt(sp2);
        this.vx = (this.vx / sp) * 5;
        this.vy = (this.vy / sp) * 5;
      }
    }

    draw() {
      ctx.fillStyle = `${this.color},${(this.alpha.toFixed(3)});`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI);
      ctx.fill();
    }
  }

  // === Sample ===
  // Creates text sample points from offscreen canvas
  function sample(text) {
    if (W === 0) return [];
    const offscreen = document.createElement('canvas');
    offscreen.width = W;
    offscreen.height = H;
    const oc = offscreen.getContext('2d');
    oc.fillStyle = '#fff';
    oc.textAlign = 'center';
    oc.textBaseline = 'middle';
    oc.font = `${FONT_WEIGHT} 100px ${FONT_FAMILY}`;
    // Auto-fit text width to ~90% of canvas width
    oc.font = `${FONT_WEIGHT} 100px ${FONT_FAMILY}`;
    let metrics = oc.measureText(text);
    let size = 100 * W / metrics.width * 0.7;
    size = Math.min(size, H * 0.5);
    oc.font = `${FONT_WEIGHT} ${size.toFixed(0)}px ${FONT_FAMILY}`;
    oc.fillText(text, W / 2, H / 2);
    // Read pixels, step by 4-5 for target density ~3500
    const img = oc.getImageData(0, 0, W, H);
    const d = img.data;
    const points = [];
    // Adaptive step: keep roughly ~3500 points
    let step = 5;
    const targetCount = Math.round(PARTICLE_COUNT * 1.15);
    // First pass count
    let count = 0;
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; y += step) {
        const i = (y * W + x) * 4;
        if (d[i + 3] > 128) count++;
      }
    }
    // Adjust step if necessary
    while (count < targetCount * 0.8 && step > 1) {
      step--;
      count = 0;
      for (let y = 0; y < H; y += step) {
        for (let x = 0; x < W; x += step) {
          const i = (y * W + x) * 4;
          if (d[i + 3] > 128) count++;
        }
      }
      }
      break;
    }
    // Sample
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const i = (y * W + x) * 4;
        if (d[i + 3] > 128) points.push({ x: x, y: y });
      }
    }
    // Shuffle for nice distribution
    for (let i = points.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)|0;
      const t = points[i];
      points[i] = points[j];
      points[j] = t;
    }
    // Limit count to particle count
    if (points.length > PARTICLE_COUNT) {
      points.length = PARTICLE_COUNT;
    }
    return points;
  }

  // === State ===
  const words = ['HELLO', 'WORLD!', 'HELLO', 'WORLD!'];
  let wordIndex = 0;
  let cycleStart = 0;
  let cyclePhase = 'settled'; // settled -> exploding -> settling
  let cyclePhaseTime = 0;
  let targets = [];
  let targetsAvailable = [];

  function assignTargets(word) {
    const pts = sample(word);
    // If we have more particles than points, cycle the points
    if (p.length === 0) return;
    for (let i = 0; i < p.length; i++) {
      const pt = pts.length === 0 ? { x: W/2, y: H/2 } : pts[i % pts.length];
      p[i].tx = pt.x;
      p[i].ty = pt.y;
    }
  }

  function explode() {
    for (let i = 0; i < p.length; i++) {
      const pp = p[i];
      // Direction from current position to target (mostly outward)
      const dx = pp.tx - pp.x;
      const dy = pp.ty - pp.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const outDirX = -dx / d;
      const outDirY = -dy / d;
      // Outward explosion speed
      const speed = 5 + Math.random() * 25;
      pp.vx = outDirX * speed;
      pp.vy = outDirY * speed;
      // Send them to random offscreen positions first
      const angle = Math.atan2(outDirY, outDirX) + (Math.random() - 0.5) * 0.3;
      const dist = Math.max(W, H) * (0.6 + Math.random() * 0.6);
      // Push position outward temporarily by modifying velocity
      pp.x += outDirX * 0;
      pp.y += outDirY * 0;
      pp.vx = Math.cos(angle) * speed;
      pp.vy = Math.sin(angle) * speed;
    }
  }

  // === Resize ===
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Reassign targets immediately so particles don't fly offscreen after resize
    if (p.length > 0) assignTargets(words[wordIndex]);
  }
  window.addEventListener('resize', () { resize(); });
    resize();
  // Initialize particles
  for (let i = 0; i < PARTICLE_COUNT; i++) p.push(new Particle());
    // Assign initial word
    assignTargets(words[0]);
    cycleStart = performance.now();
    cyclePhase = 'settled';
    // Start animation
    let lastT = performance.now();
    let fpsLastReport = 0;
    let fpsFrames = 0;
    function tick(t) {
      const dt = t - lastT;
      lastT = t;
      // Logic update
      // Cycle phases:
      // settled -> 5s timeout -> exploding -> 0.6s -> settling -> settled -> 5s timeout -> exploding...
      cyclePhaseTime += dt;
      if (cyclePhase === 'settled' && cyclePhaseTime > CYCLE_INTERVAL) {
        // Move to next word and explode
        wordIndex = (wordIndex + 1) % words.length;
        // Only update if the word is different (to avoid jarring target swap
        assignTargets(words[wordIndex]);
        explode();
        cyclePhase = 'exploding';
        cyclePhaseTime = 0;
      } else if (cyclePhase === 'exploding' && cyclePhaseTime > 700) {
        cyclePhase = 'settled';
        cyclePhaseTime = 0;
      }
      // Update particles
      for (let i = 0; i < p.length; i++) {
        p[i].update();
      }
      // Render
      // Clear ( black background, no alpha to be fast
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.globalCompositeOperation = 'lighten';
      ctx.save();
      // Draw particles with additive blending
      ctx.globalCompositeOperation = 'lighten';
      for (let i = 0; i < p.length; i++) {
        const pp = p[i];
        ctx.fillStyle = `${p[i].color},1)`;
        ctx.beginPath();
        ctx.arc(pp.x, pp.y, pp.r, 0, 2 * Math.PI);
        ctx.fill();
      }
      ctx.restore();
      ctx.restore();
      // FPS counter ( invisible ( just for perf tracking, comment out if not needed
      fpsFrames++;
      if (t - fpsLastReport > 5000) {
        const fps = Math.round(fpsFrames * 1000 / (t - fpsLastReport));
        fpsLastReport = t;
        fpsFrames = 0;
        // console.log('FPS:', fps);
      }
      // requestAnimationFrame
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  // === Helpers ===
  function explode() {
    // Push particles outward with random velocity
    for (let i = 0; i < p.length; i++) {
      const pp = p[i];
      const angle = Math.random() * Math.PI * 2;
      const speed = 5 + Math.random() * 25;
      pp.vx = Math.cos(angle) * speed;
      pp.vy = Math.sin(angle) * speed;
    }
  }
})();
</script>
</body>
</html>
