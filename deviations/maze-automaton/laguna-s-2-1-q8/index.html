<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Living Maze</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        canvas { display: block; }
        body { background: #000; }
    </style>
</head>
<body>
<script>
(() => {
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    });

    const COLS = Math.floor(W / 4);
    const ROWS = Math.floor(H / 4);
    const GRID_W = COLS;
    const GRID_H = ROWS;

    // State grid: 0 = wall, 1 = open
    let grid = new Uint8Array(GRID_W * GRID_H);
    let next = new Uint8Array(GRID_W * GRID_H);

    // Pheromone grid for ants (float values)
    let pheromones = new Float32Array(GRID_W * GRID_H);
    let nextPheromones = new Float32Array(GRID_W * GRID_H);

    // Ants array
    let ants = [];

    // Regions for concurrent solve/grow
    const NUM_REGIONS_X = 4;
    const NUM_REGIONS_Y = 4;
    const regions = [];

    function initRegions() {
        const rw = Math.floor(GRID_W / NUM_REGIONS_X);
        const rh = Math.floor(GRID_H / NUM_REGIONS_Y);
        regions.length = 0;
        for (let ry = 0; ry < NUM_REGIONS_Y; ry++) {
            for (let rx = 0; rx < NUM_REGIONS_X; rx++) {
                regions.push({
                    x: rx * rw,
                    y: ry * rh,
                    w: rw,
                    h: rh,
                    state: 'growing', // 'growing' or 'solving'
                    timer: 0,
                    seedTimer: Math.random() * 100 + 50
                });
            }
        }
    }

    function seedInitial() {
        // Start with a few open cells in center
        for (let i = 0; i < 30; i++) {
            const x = Math.floor(Math.random() * GRID_W);
            const y = Math.floor(Math.random() * GRID_H);
            setCell(x, y, 1);
        }

        // Seed center area more densely
        const cx = Math.floor(GRID_W / 2);
        const cy = Math.floor(GRID_H / 2);
        for (let dy = -5; dy <= 5; dy++) {
            for (let dx = -5; dx <= 5; dx++) {
                if (Math.random() > 0.3) {
                    setCell(cx + dx, cy + dy, 1);
                }
            }
        }
    }

    function setCell(x, y, val) {
        if (x >= 0 && x < GRID_W && y >= 0 && y < GRID_H) {
            grid[y * GRID_W + x] = val;
        }
    }

    function getCell(x, y) {
        if (x >= 0 && x < GRID_W && y >= 0 && y < GRID_H) {
            return grid[y * GRID_W + x];
        }
        return 0;
    }

    function countOpenNeighbors(x, y) {
        let count = 0;
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                count += getCell(x + dx, y + dy);
            }
        }
        return count;
    }

    function countEdgeNeighbors(x, y) {
        let count = 0;
        count += getCell(x - 1, y);
        count += getCell(x + 1, y);
        count += getCell(x, y - 1);
        count += getCell(x, y + 1);
        return count;
    }

    // Mazectric CA rules:
    // - A wall becomes open if it has exactly 1 or 2 open neighbors, and at least one of those is adjacent (edge)
    // - An open cell stays open
    function mazectricStep(region) {
        const { x: rx, y: ry, w: rw, h: rh } = region;

        for (let y = ry; y < ry + rh; y++) {
            for (let x = rx; x < rx + rw; x++) {
                const idx = y * GRID_W + x;
                const current = grid[idx];
                const total = countOpenNeighbors(x, y);
                const edge = countEdgeNeighbors(x, y);

                if (current === 0) {
                    // Wall: become open if exactly 1 or 2 open neighbors, with at least 1 edge neighbor
                    if ((total === 1 || total === 2) && edge >= 1) {
                        next[idx] = 1;
                    } else {
                        next[idx] = 0;
                    }
                } else {
                    // Open: stays open
                    next[idx] = 1;
                }
            }
        }
    }

    function swapGrids() {
        const temp = grid;
        grid = next;
        next = temp;
    }

    function updateRegions() {
        regions.forEach(region => {
            if (region.state === 'growing') {
                mazectricStep(region);
                region.timer++;
                region.seedTimer--;

                if (region.seedTimer <= 0) {
                    // Check if growth has stabilized (no new cells in recent steps)
                    region.state = 'check';
                }

                if (region.timer > 200) {
                    region.state = 'check';
                }
            } else if (region.state === 'check') {
                // Check if region is stable
                if (isRegionStable(region)) {
                    region.state = 'solving';
                    region.timer = 0;
                    region.seedTimer = 100 + Math.random() * 100;

                    // Spawn an ant at a random open cell in region
                    spawnAntInRegion(region);
                } else {
                    region.state = 'growing';
                    region.timer = 0;
                }
            } else if (region.state === 'solving') {
                region.timer++;
                region.seedTimer--;

                if (region.seedTimer <= 0) {
                    // Reseed region for regrowth
                    region.state = 'growing';
                    region.timer = 0;
                    region.seedTimer = 50 + Math.random() * 50;

                    // Clear a small area to re-grow
                    clearRegionForRegrowth(region);
                }
            }
        });
    }

    function isRegionStable(region) {
        const { x: rx, y: ry, w: rw, h: rh } = region;
        let openCount = 0;
        for (let y = ry; y < ry + rh; y++) {
            for (let x = rx; x < rx + rw; x++) {
                openCount += getCell(x, y);
            }
        }
        return openCount > (rw * rh * 0.3); // At least 30% open
    }

    function spawnAntInRegion(region) {
        const { x: rx, y: ry, w: rw, h: rh } = region;
        // Find a random open cell
        for (let tries = 0; tries < 100; tries++) {
            const x = rx + Math.floor(Math.random() * rw);
            const y = ry + Math.floor(Math.random() * rh);
            if (getCell(x, y) === 1) {
                ants.push({
                    x: x,
                    y: y,
                    px: x,
                    py: y,
                    direction: Math.floor(Math.random() * 4),
                    region: region
                });
                break;
            }
        }
    }

    function clearRegionForRegrowth(region) {
        const { x: rx, y: ry, w: rw, h: rh } = region;
        for (let y = ry; y < ry + rh; y++) {
            for (let x = rx; x < rx + rw; x++) {
                if (Math.random() > 0.7) {
                    setCell(x, y, 0);
                }
            }
        }
        // Keep edges connected
        const ex = rx + Math.floor(rw / 2);
        const ey = ry + Math.floor(rh / 2);
        setCell(ex, ey, 1);
    }

    // Ant movement using pathfinding through open cells
    function updateAnts() {
        for (let i = ants.length - 1; i >= 0; i--) {
            const ant = ants[i];
            const { region } = ant;

            // Only move in solving regions
            if (region.state !== 'solving') continue;

            // Try to move forward, turn if blocked
            const dirs = [
                [0, -1], [1, 0], [0, 1], [-1, 0]
            ];

            let moved = false;
            for (let attempt = 0; attempt < 4; attempt++) {
                const dirIndex = (ant.direction + attempt) % 4;
                const [dx, dy] = dirs[dirIndex];
                const nx = ant.x + dx;
                const ny = ant.y + dy;

                if (nx >= region.x && nx < region.x + region.w &&
                    ny >= region.y && ny < region.y + region.h &&
                    getCell(nx, ny) === 1) {
                    ant.px = ant.x;
                    ant.py = ant.y;
                    ant.x = nx;
                    ant.y = ny;
                    ant.direction = dirIndex;
                    moved = true;

                    // Leave pheromone
                    const idx = ny * GRID_W + nx;
                    pheromones[idx] = Math.min(pheromones[idx] + 0.5, 2.0);
                    break;
                } else {
                    // Turn
                    ant.direction = (ant.direction + 1) % 4;
                }
            }

            if (!moved) {
                // Couldn't move, try random direction
                ant.direction = Math.floor(Math.random() * 4);
            }

            // Remove ants in regions that stop solving
            if (region.state !== 'solving' && Math.random() > 0.9) {
                ants.splice(i, 1);
            }
        }
    }

    function decayPheromones() {
        for (let i = 0; i < pheromones.length; i++) {
            pheromones[i] *= 0.97;
            if (pheromones[i] < 0.01) pheromones[i] = 0;
        }
    }

    function render() {
        const imageData = ctx.createImageData(W, H);
        const data = imageData.data;

        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                const px = Math.floor(x / 4);
                const py = Math.floor(y / 4);

                if (px >= GRID_W || py >= GRID_H) {
                    const idx = (y * W + x) * 4;
                    data[idx] = 0;
                    data[idx + 1] = 0;
                    data[idx + 2] = 0;
                    data[idx + 3] = 255;
                    continue;
                }

                const gIdx = py * GRID_W + px;
                const pIdx = py * GRID_W + px;

                const cellVal = grid[gIdx];
                const pherVal = pheromones[pIdx];

                const idx = (y * W + x) * 4;

                if (cellVal === 1) {
                    // Open corridor
                    if (pherVal > 0.1) {
                        // Pheromone trail
                        const intensity = Math.min(pherVal * 80, 255);
                        const glow = Math.min(pherVal * 40, 200);
                        data[idx] = intensity;
                        data[idx + 1] = 200;
                        data[idx + 2] = Math.max(100, intensity);
                        data[idx + 3] = 255;

                        // Add glow effect
                        if (x > 0) {
                            const prevIdx = (y * W + (x - 1)) * 4;
                            data[prevIdx] = Math.max(data[prevIdx], glow * 0.3);
                            data[prevIdx + 1] = Math.max(data[prevIdx + 1], glow * 0.5);
                            data[prevIdx + 2] = Math.max(data[prevIdx + 2], glow);
                        }
                    } else {
                        data[idx] = 30;
                        data[idx + 1] = 30;
                        data[idx + 2] = 50;
                        data[idx + 3] = 255;
                    }
                } else {
                    // Wall
                    data[idx] = 5;
                    data[idx + 1] = 5;
                    data[idx + 2] = 10;
                    data[idx + 3] = 255;
                }
            }
        }

        ctx.putImageData(imageData, 0, 0);
    }

    function animate() {
        // Update maze (grow)
        for (let i = 0; i < 3; i++) {
            updateRegions();
            swapGrids();
        }

        // Update ants
        updateAnts();

        // Decay pheromones
        decayPheromones();

        // Render
        render();

        requestAnimationFrame(animate);
    }

    // Initialize
    initRegions();
    seedInitial();

    // Start animation
    animate();
})();
</script>
</body>
</html>
