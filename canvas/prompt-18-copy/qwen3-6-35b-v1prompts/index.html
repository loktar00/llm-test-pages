<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Zombie Car Survival</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }
        h1 { margin: 0; font-size: 24px; color: #ff4444; }
        p { margin: 5px 0; font-size: 16px; }
        .bar-container {
            width: 200px;
            height: 10px;
            background: #333;
            border: 1px solid #555;
            margin-top: 5px;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #0f0;
            transition: width 0.1s, background 0.2s;
        }
    </
