<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Video Player</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --bg-control: rgba(15, 23, 42, 0.85);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --buffer: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Player Container */
        .player {
            position: relative;
            width: 800px;
            height: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            cursor: pointer;
            group: player;
        }

        /* Abstract Gradient Video Background */
        .video-canvas {
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: absolute;
            top: 0; left: 0;
            opacity: 0.6;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Central Play Button */
        .center-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through to container */
        }

        .play-icon-large {
            width: 70px;
            height: 70px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: scale(0.8);
        }

        .player.paused .play-icon-large {
            opacity: 1;
            transform: scale(1);
        }

        .play-icon-large svg {
            width: 30px;
            height: 30px;
            fill: white;
            margin-left: 4px; /* Optical centering */
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            opacity: 0;
            pointer-events: none;
        }

        .player.paused .ripple {
            animation: rippleOut 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }

        @keyframes rippleOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        /* Controls Bar */
        .controls-wrapper {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 1;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(0);
            z-index: 10;
        }

        .player.paused .controls-wrapper,
        .player:hover .controls-wrapper {
            opacity: 1;
        }
        
        .player:not(.paused):not(.idle) .controls-wrapper {
            opacity: 0;
            transform: translateY(10px);
            cursor: none;
        }

        /* Progress Bar Area */
        .progress-container {
            position: relative;
            height: 6px;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* The Track */
        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: visible;
            transition: height 0.1s;
        }

        .progress-container:hover .progress-track {
            height: 6px;
            background: rgba(255,255,255,0.3);
        }

        /* Buffered Region */
        .buffered {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            background: var(--buffer);
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        /* Playhead (Thumb) */
        .playhead {
            position: absolute;
            left: 0%; top: 50%;
            width: 14px; height: 14px;
            background: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.1s;
            pointer-events: none;
            z-index: 2;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .progress-container:hover .playhead {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Hover Preview Chip */
        .time-tooltip {
            position: absolute;
            top: -45px;
            left: 0;
            background: var(--bg-control);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            transform: translateX(-50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, top 0.2s;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .progress-container:hover .time-tooltip {
            opacity: 1;
            top: -50px;
        }

        /* Control Buttons Row */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text);
        }

        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 1; }
        
        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Volume Flyout */
        .volume-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .volume-slider-wrap {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            width: 6px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            padding: 2px;
        }

        .volume-container:hover .volume-slider-wrap {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .volume-fill {
            width: 100%;
            height: 70%;
            background: var(--primary);
            border-radius: 2px;
        }

        /* Time Text */
        .time-display {
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--text-dim);
            margin-left: 12px;
        }

        .time-current { color: white; font-weight: 500; }

        /* Settings Menu */
        .settings-container {
            position: relative;
        }

        .settings-menu {
            position: absolute;
            bottom: 35px;
            right: 0;
            width: 180px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.2s;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .settings-container:hover .settings-menu,
        .settings-menu:focus-within {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .menu-header {
            padding: 10px 16px;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .menu-item {
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .menu-item:hover { background: rgba(255,255,255,0.1); color: white; }
        .menu-item.active { color: var(--primary); font-weight: 600; }
        .menu-item.active::after { content: '✓'; font-size: 10px; }

    </style>
</head>
<body>

    <div class="player paused" id="player">
        <div class="video-canvas"></div>
        
        <!-- Central Play/Replay UI -->
        <div class="center-overlay">
            <div class="play-icon-large">
                <!-- Play SVG -->
                <svg viewBox="0 0 24 24" id="large-play-icon">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
            <div class="ripple"></div>
        </div>

        <!-- Controls -->
        <div class="controls-wrapper" id="controls">
            
            <!-- Progress Bar -->
            <div class="progress-container" id="progress-container">
                <div class="time-tooltip" id="time-tooltip">00:00</div>
                <div class="progress-track">
                    <div class="buffered" id="buffered"></div>
                    <div class="playhead" id="playhead"></div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="controls-row">
                <div class="left-controls">
                    <!-- Play/Pause -->
                    <button class="btn" id="play-btn">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" id="play-icon-small"/></svg>
                    </button>

                    <!-- Volume -->
                    <div class="volume-container">
                        <button class="btn">
                            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        </button>
                        <div class="volume-slider-wrap">
                            <div class="volume-fill"></div>
                        </div>
                    </div>

                    <!-- Time -->
                    <div class="time-display">
                        <span class="time-current" id="current-time">0:00</span> / <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="right-controls">

                    <div class="settings-container">

                        </button>
                        <div class="settings-menu">
                            <div class="menu-header">Playback Speed</div>
                            <div class="menu-item" data-speed="0.5">0.5x</div>
                            <div class="menu-item" data-speed="0.75">0.75x</div>
                            <div class="menu-item active" data-speed="1">Normal</div>
                            <div class="menu-item" data-speed="1.5">1.5x</div>
                            <div class="menu-item" data-speed="2">2x</div>
                        </div>
                    </div>
                    
                    <!-- Fullscreen (Mock) -->
                    <button class="btn">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
