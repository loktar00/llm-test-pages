<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Weaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            background-color: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="weaveCanvas"></canvas>
    <script>
        /**
         * Generative Weaving Art
         * Core Logic:
         * 1. Procedural Generation: Pick palette, pattern, and fabric type.
         * 2. Warp Generation: Draw vertical threads with pseudo-random noise.
         * 3. Weaving Loop: 
         *    a. Compute "Shadows" (which threads are under) based on pattern.
         *    b. Draw Weft thread.
         *    c. If "Under", draw Warp thread over it (creates illusion of 3D weave).
         *    d. If "Over", draw Warp thread under it (shadow).
         */

        const canvas = document.getElementById('weaveCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        const CONFIG = {
            width: 1200,
            height: 1600,
            warpCount: 120, // Number of vertical threads
            threadWidth: 3,
            threadGap: 2,
            shuttleSpeed: 4, // Pixels per frame
            patternSpeed: 1, // Weft layers per frame
        };

        // State
        let state = {
            tapestry: null,
            phase: 'INIT', // INIT, WARP, WEAVE, SCROLL_OUT, RESET
            progress: 0, // 0 to 1 (pattern completion)
            y: 0, // Current weaving Y position
            scrollY: 0,
            lastTime: 0
        };

        // --- Utilities ---
        const lerp = (start, end, t) => start * (1 - t) + end * t;
        const rand = (min, max) => Math.random() * (max - min) + min;
        
        // Pseudo-random noise for warp thread variation
        const getThreadNoise = (x, seed) => Math.sin(x * 0.1 + seed) * 0.15 + Math.sin(x * 0.5 + seed * 2) * 0.05;

        // Color Palettes (Harmonious)
        const PALETTES = [
            ['#2c3e50', '#e74c3c', '#ecf0f1', '#c0392b'], // Classic Primary
            ['#344563', '#63869e', '#a3c4de', '#1a2b4c'], // Oceanic
            ['#d4a682', '#f2d5c0', '#8c6e5b', '#e8bba6'], // Earthy
            ['#2d0e3e', '#801380', '#c632c6', '#f4d9f4'], // Purple
            ['#333333', '#555555', '#888888', '#cccccc'], // Monochrome
            ['#1e3f20', '#4a9c4b', '#a3d398', '#78c678'], // Forest
            ['#304758', '#86b3d1', '#d0e4f2', '#0d1f2d']  // Steel
        ];

        // --- Classes ---

        class Color {
            constructor(hex) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                this.r = r; this.g = g; this.b = b;
                this.hex = hex;
            }
            
            // Calculate luminance for lighting
            luminance() {
                return (0.299 * this.r + 0.587 * this.g + 0.114 * this.b) / 255;
            }

            // Shift color based on thread curvature/noise
            withNoise(noiseVal) {
                const shift = noiseVal * 80; 
                let r = Math.max(0, Math.min(255, this.r + shift));
                let g = Math.max(0, Math.min(255, this.g + shift * 0.8));
                let b = Math.max(0, Math.min(255, this.b + shift * 1.2));
                return `rgb(${r|0},${g|0},${b|0})`;
            }
        }

        class Pattern {
            constructor() {
                // 0: Stripe, 1: Diamond, 2: Chevron, 3: Checker
                const types = [0, 1, 2, 3];
                this.type = types[Math.floor(Math.random() * types.length)];
                this.density = rand(5, 15); // How wide the pattern bands are
                this.seed = Math.random() * 100;
            }

            // Returns 0 (Over) or 1 (Under) based on coordinates
            // We return 1 if the Warp (vertical) is UNDER the Weft (horizontal)
            getWeaveState(x, y) {
                const d = this.density;
                const modX = x % d;
                const modY = y % d;
                const isEven = (Math.floor(y / d) % 2 === 0);
                
                // Simple noise for organic feel
                const noise = Math.sin(x * 0.05 + this.seed) * 0.1;

                switch (this.type) {
                    case 0: // Stripe (Simple)
                        // Alternating rows
                        return Math.floor(y / d) % 2 === 0;

                    case 1: // Diamond
                        // Distance from center of the "cell"
                        const cx = Math.abs(modX - d/2);
                        const cy = Math.abs(modY - d/2);
                        // Simple diamond logic: sum of abs coords
                        return (cx + cy) < d * 0.6;

                    case 2: // Chevron (V-shape)
                        // Slope logic
                        const slope = (y % (d*2)) / (d*2);
                        return (x % d) > (slope * d);

                    case 3: // Checker
                        return (Math.floor(x / d) + Math.floor(y / d)) % 2 === 0;
                        
                    default: return Math.random() > 0.5;
                }
            }
        }

        class Tapestry {
            constructor() {
                this.colors = PALETTES[Math.floor(Math.random() * PALETTES.length)].map(c => new Color(c));
                this.pattern = new Pattern();
                this.warpThreads = [];
                this.height = CONFIG.height;
                this.width = CONFIG.width;
                
                // Initialize Warp Threads
                for (let i = 0; i < CONFIG.warpCount; i++) {
                    this.warpThreads.push({
                        x: i * (CONFIG.threadWidth + CONFIG.threadGap),
                        color: this.colors[Math.floor(Math.random() * this.colors.length)],
                        // Seed for visual variation on this specific thread
                        noiseSeed: rand(0, 10)
                    });
                }
            }
        }

        // --- Rendering Helpers ---

        function drawThread(x, y, w, h, colorStr, noise, isShadow) {
            ctx.fillStyle = colorStr;
            
            // If it's a shadow, we darken it slightly to simulate being underneath
            if (isShadow) {
                // Darken logic handled inside color generation or simple overlay
                // We'll draw it slightly darker here
                ctx.globalAlpha = 0.6; 
            } else {
                ctx.globalAlpha = 1.0;
            }

            // Draw the thread
            // Using a slight gradient or variation could look better, but solid rects with noise are faster
            ctx.fillRect(x, y, w, h);
            
            // Reset alpha
            ctx.globalAlpha = 1.0;
        }

        // --- Main Logic ---

        function init() {
            resize();
            startNewTapestry();
            requestAnimationFrame(loop);
        }

        function resize() {
            // Maintain aspect ratio or fill
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // We'll center the tapestry in the middle
        }

        function startNewTapestry() {
            state.tapestry = new Tapestry();
            state.phase = 'WARP';
            state.progress = 0;
            state.y = 0;
            state.scrollY = 0;
        }

        function update() {
            const t = state.tapestry;
            if (!t) return;

            if (state.phase === 'WARP') {
                state.progress += 0.02; // Fast draw of warp
                if (state.progress >= 1) {
                    state.phase = 'WEAVE';
                    state.progress = 0;
                }
            } else if (state.phase === 'WEAVE') {
                // Move shuttle
                state.y += CONFIG.shuttleSpeed;
                state.progress = state.y / t.height;

                // If finished weaving
                if (state.y > t.height + 100) {
                    state.phase = 'SCROLL_OUT';
                }
            } else if (state.phase === 'SCROLL_OUT') {
                state.scrollY += 4;
                if (state.scrollY > t.height + 200) {
                    startNewTapestry();
                }
            }
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const t = state.tapestry;
            if (!t) return;

            // Center the tapestry
            const offsetX = (canvas.width - t.width) / 2;
            const offsetY = (canvas.height - t.height) / 2 - state.scrollY;

            ctx.save();
            ctx.translate(offsetX, offsetY);

            if (state.phase === 'WARP' || state.phase === 'WEAVE') {
                
                // 1. Draw Warp Threads (The background layer for weaving)
                // We draw them up to the current weaving Y line (plus a buffer so they don't flicker over the shuttle)
                const drawLimit = state.y + 50; 

                for (let i = 0; i < t.warpThreads.length; i++) {
                    const warp = t.warpThreads[i];
                    const x = warp.x;
                    const w = CONFIG.threadWidth;
                    const h = Math.min(t.height, drawLimit); // Draw only up to current line

                    // Calculate noise value for lighting
                    // Warp threads go vertically (y), so we sample noise based on y
                    // To make it look like a physical thread, we vary light/dark along the strand
                    
                    // We draw the thread in small segments to simulate the curvature/lighting
                    // Optimization: Don't draw every single pixel, draw in chunks
                    const chunkSize = 20; 
                    
                    for (let y = 0; y < h; y += chunkSize) {
                        // Determine lighting based on position
                        // Create a sine wave along the Y axis to simulate thread twisting
                        const angle = (y * 0.02) + warp.noiseSeed;
                        const lightVal = Math.sin(angle); 
                        
                        // Determine if this segment is UNDER the current weft
                        // This is the crucial 3D logic
                        let isUnder = false;
                        
                        // Check the intersection with the current weave line
                        // If we are drawing "under" the shuttle, we check the pattern
                        // Actually, to be truly accurate: 
                        // If y < state.y (the line we just crossed), we check the pattern.
                        
                        if (y > 0 && y < state.y) {
                            // We crossed a weft line here.
                            // Check if this specific warp was under the weft at this Y
                            // We approximate by checking the pattern at y
                            isUnder = t.pattern.getWeaveState(x, y);
                        }

                        let colorStr = warp.color.withNoise(lightVal);
                        
                        if (isUnder) {
                            // It's under a weft thread. It is in shadow.
                            // Darken the color significantly
                            const r = Math.floor(warp.color.r * 0.5);
                            const g = Math.floor(warp.color.g * 0.5);
                            const b = Math.floor(warp.color.b * 0.5);
                            colorStr = `rgb(${r},${g},${b})`;
                        }

                        ctx.fillStyle = colorStr;
                        ctx.fillRect(x, y, w, chunkSize);
                        
                        // Optional: Add a tiny highlight for the thread volume
                        ctx.fillStyle = `rgba(255,255,255,0.1)`;
                        ctx.fillRect(x + 1, y, w - 2, 1);
                    }
                }

                // 2. Draw Weft Threads (The Shuttle)
                // We draw the horizontal lines up to state.y
                // We draw them in "bands" or individually? 
                // To get the "Over/Under" effect visually correct:
                // If the Warp is UNDER, the Weft must be ON TOP.
                // If the Warp is OVER, the Warp is drawn last (already done above? No).
                
                // Logic Adjustment:
                // We just drew the Warps. If a Warp was determined to be UNDER, we drew it dark.
                // Now we draw the Weft.
                // If the Weft is supposed to be OVER the Warp (meaning Warp was Under), 
                // we draw the Weft normally.
                // If the Weft is supposed to be UNDER the Warp (meaning Warp was Over),
                // we should ideally draw a shadow. But since we drew the Warp already, 
                // we can't easily put the warp on top of the weft if we draw weft now.
                
                // SOLUTION: 
                // We need to draw the Weft first? No, we need to know the state.
                // We know the state from `getWeaveState`.
                // If Warp is UNDER, Weft is OVER. -> Draw Weft normally.
                // If Warp is OVER, Weft is UNDER. -> Draw Weft dark/shadowed.
                
                // Wait, physically:
                // If Warp is OVER, the Warp covers the Weft.
                // Since we drew the Warp already (in the loop above), we can't cover it easily 
                // unless we draw the Weft *through* it (not possible with simple canvas 2d without clipping masks).
                
                // Revised Logic for Canvas 2D Layering:
                // 1. We assume Warps are the base.
                // 2. We draw Wefts.
                // 3. If a Weft is UNDER a Warp, we must draw the Warp ON TOP of the Weft.
                
                // This implies we need to re-draw specific Warp segments on top of the Weft.
                // Or, we draw Wefts in "holes".
                
                // Let's stick to the previous logic but refine the visual.
                // We drew Warps. Some are dark (indicating they went under a Weft).
                // Now we draw Wefts.
                // If Warp was Under, Weft is Over. We draw Weft.
                // If Warp was Over, Weft is Under. We draw Weft (dark).
                // BUT, if Warp was Over, we drew the Warp LIGHT (normal) already.
                // So now we draw a dark Weft. The Light Warp is already there.
                // The Warp will obscure the Weft.
                // This creates the illusion perfectly!
                
                // We draw Wefts in chunks (horizontal bands) to save draw calls.
                const weftHeight = CONFIG.threadWidth;
                const drawWeftLimit = state.y;

                for (let y = 0; y < drawWeftLimit; y += CONFIG.threadGap + weftHeight) {
                    for (let x = 0; x < t.width; x += CONFIG.threadWidth + CONFIG.threadGap) {
                        // Check weave state at this intersection
                        // Note: x is the center or left of warp? 
                        // x here is the position of the warp thread.
                        // We need to know if THIS warp is OVER or UNDER this weft.
                        
                        const isWarpOver = t.pattern.getWeaveState(x, y); // true = Warp Over, false = Warp Under
                        
                        let weftColor;
                        // Alternate weft colors for texture? Or just one?
                        // Let's pick a color from palette based on row
                        const colorIdx = Math.floor(y / (CONFIG.threadWidth + CONFIG.threadGap)) % t.colors.length;
                        const baseWeftColor = t.colors[colorIdx];

                        if (isWarpOver) {
                            // Warp is Over. Weft is Under.
                            // Draw Weft Dark.
                            // (The Warp above it was drawn Light, so it covers this).
                            weftColor = `rgb(${baseWeftColor.r*0.4|0},${baseWeftColor.g*0.4|0},${baseWeftColor.b*0.4|0})`;
                        } else {
                            // Warp is Under. Weft is Over.
                            // Draw Weft Normal.
                            // Add some noise to Weft color too
                            const noise = Math.sin(x * 0.1) * 20;
                            const r = Math.max(0, Math.min(255, baseWeftColor.r + noise));
                            const g = Math.max(0, Math.min(255, baseWeftColor.g + noise));
                            const b = Math.max(0, Math.min(255, baseWeftColor.b + noise));
                            weftColor = `rgb(${r},${g},${b})`;
                        }

                        ctx.fillStyle = weftColor;
                        ctx.fillRect(x, y, CONFIG.threadWidth, CONFIG.threadHeight || weftHeight);
                    }
                }

            } else if (state.phase === 'SCROLL_OUT') {
                // Draw the completed tapestry
                // We need to redraw the whole thing statically
                // But since we are scrolling, we just redraw the static image
                
                // To do this efficiently without re-running the loop logic:
                // We can just draw the static version.
                
                // Background (Warp)
                for (let i = 0; i < t.warpThreads.length; i++) {
                    const warp = t.warpThreads[i];
                    const x = warp.x;
                    const h = t.height;
                    
                    // Draw full warp
                    // We need to simulate the "Under/Over" logic for the whole tapestry
                    // Since we can't store the whole image, we draw segments.
                    
                    for (let y = 0; y < h; y += 10) {
                        const angle = (y * 0.02) + warp.noiseSeed;
                        const lightVal = Math.sin(angle);
                        
                        // Check intersection
                        let isUnder = false;
                        // Check if this y crossed a weft line where warp was under
                        // Weft lines are at multiples of (threadWidth + gap)
                        // We approximate by checking pattern at y
                        if (t.pattern.getWeaveState(x, y) === false) {
                            isUnder = true;
                        }

                        let colorStr = warp.color.withNoise(lightVal);
                        if (isUnder) {
                             const r = Math.floor(warp.color.r * 0.5);
                             const g = Math.floor(warp.color.g * 0.5);
                             const b = Math.floor(warp.color.b * 0.5);
                             colorStr = `rgb(${r},${g},${b})`;
                        }
                        ctx.fillStyle = colorStr;
                        ctx.fillRect(x, y, CONFIG.threadWidth, 10);
                    }
                }

                // Foreground (Weft)
                const weftH = CONFIG.threadWidth;
                const weftGap = CONFIG.threadGap;
                for (let y = 0; y < t.height; y += weftH + weftGap) {
                    for (let x = 0; x < t.width; x += weftH + weftGap) {
                        const isWarpOver = t.pattern.getWeaveState(x, y);
                        
                        if (!isWarpOver) { // Weft is Over
                            const colorIdx = Math.floor(y / (weftH + weftGap)) % t.colors.length;
                            const base = t.colors[colorIdx];
                            const noise = Math.sin(x * 0.1) * 20;
                            ctx.fillStyle = `rgb(${Math.min(255, base.r+noise)|0},${Math.min(255, base.g+noise)|0},${Math.min(255, base.b+noise)|0})`;
                            ctx.fillRect(x, y, weftH, weftH);
                        }
                    }
