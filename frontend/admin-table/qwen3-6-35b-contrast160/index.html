<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --row-hover: #f1f5f9;
    --row-selected: #eff6ff;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 / 0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system-ui, system-ui, 'Segoe UI', Roboto, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    line-height: 1.5;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
  .header p { color: var(--text-muted); font-size: 0.95rem; }

  .table-container {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* Scrollable wrapper */
  .scroll-wrapper {
    overflow-x: auto;
    overflow-y: visible;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px; /* Triggers horizontal scroll on mobile */
  }

  /* Sticky Header */
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface);
    padding: 1rem 1.5rem;
    text-align: left;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    user-select: none;
  }

  th.sortable { cursor: pointer; transition: color 0.2s; }
  th.sortable:hover { color: var(--accent); }

  /* Arrow Animation */
  .arrow {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-left: 6px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.3, 1);
    opacity: 0.3;
  }
  th.sort-asc .arrow { transform: rotate(180deg); opacity: 1; color: var(--accent); }
  th.sort-desc .arrow { transform: rotate(0deg); opacity: 1; color: var(--accent); }

  /* Body */
  tbody tr {
    transition: background-color 0.2s;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background-color: var(--row-hover); }
  tbody tr.selected { background-color: var(--row-selected); }

  td {
    padding: 1rem 1.5rem;
    vertical-align: middle;
    font-size: 0.95rem;
  }

  /* Checkbox */
  .checkbox-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Avatar */
  .avatar-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e0e7ff;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .info { display: flex; flex-direction: column; }
  .name { font-weight: 600; color: var(--text-main); }
  .email { font-size: 0.85rem; color: var(--text-muted); }

  /* Status Chip */
  .chip {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-block;
  }
  .status-active { background: #dcfce7; color: #166534; }
  .status-passive { background: #f1f5f9; color: #475569; }
  .status-banned { background: #fee2e2; color: #991b1b; }

  /* Footer / Pagination */
  .footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .pagination {
    display: flex;
    gap: 4px;
  }
  .page-pill {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .page-pill:hover { background: var(--row-hover); }
  .page-pill.active { background: var(--accent); color: white; }

  /* FLIP Animation Class */
  .flipping td {
    animation: rowSettle 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes rowSettle {
    0% { opacity: 0.5; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 1rem; }
    .header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    .footer { flex-direction: column; gap: 1rem; text-align: center; }
  }
</style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Users</h1>
      <p>Manage your application users and permissions.</p>
    </div>
    <div style="font-weight:600; color:var(--accent);">Total: <span id="count">0</span></div>
  </div>

  <div class="table-container">
    <div class="scroll-wrapper">
      <table id="userTable">
        <thead>
          <tr>
            <th style="width: 50px;"><div class="checkbox-wrapper"><input type="checkbox" id="selectAll"></div></th>
            <th class="sortable" data-col="0">Name <span class="arrow">▼</span></th>
            <th class="sortable" data-col="1">Role <span class="arrow">▼</span></th>
            <th class="sortable" data-col="2">Status <span class="arrow">▼</span></th>
            <th class="sortable" data-col="3">Last Login <span class="arrow">▼</span></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Rows generated by JS -->
        </tbody>
      </table>
    </div>
    <div class="footer">
      <span id="pageInfo">Showing 1-10 of 15</span>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

<script>
  // --- Data Generation ---
  const firstNames = ['Alex', 'Jordan', 'Taylor', 'Robin', 'Casey', 'Riley', 'Drew', 'Sage', 'Cameron', 'Avery', 'Quin', 'Dakota'];
  const lastNames = ['Olsen', 'Smith', 'Johnson', 'Williams', 'Jones', 'Brown', 'Miller', 'Davis', 'Garcia', 'Rodriguez'];
  const roles = ['Admin', 'Editor', 'Viewer', 'Guest'];
  const statuses = ['Active', 'Passive', 'Banned'];

  const generateData = (count) => {
    return Array.from({ length: count }, (_, i) => {
      const fn = firstNames[Math.floor(Math.random() * firstNames.length)];
      const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
      const initials = fn[0] + ln[0];
      const role = roles[Math.floor(Math.random() * roles.length)];
      const status = statuses[Math.floor(Math.random() * statuses.length)];
      const date = new Date(Date.now() - Math.floor(Math.random() * 10000000000));
      
      return {
        id: i,
        name: `${fn} ${ln}`,
        email: `${fn.toLowerCase()}${ln.toLowerCase()}@admin.io`,
        initials,
        role,
        status,
        lastLogin: date.toISOString().split('T')[0]
      };
    });
  };

  let data = generateData(15);
  let sortCol = null;
  let sortAsc = true;
  let currentPage = 1;
  const itemsPerPage = 10;

  // --- DOM Elements ---
  const tbody = document.getElementById('tableBody');
  const selectAll = document.getElementById('selectAll');
  const paginationEl = document.getElementById('pagination');
  const pageInfoEl = document.getElementById('pageInfo');
  const countEl = document.getElementById('count');

  // --- Render Logic ---
  const getStatusClass = (status) => {
    if (status === 'Active') return 'status-active';
    if (status === 'Passive') return 'status-passive';
    return 'status-banned';
  };

  const renderTable = (animate = false) => {
    // FLIP Animation trigger
    if (animate) {
      tbody.classList.add('flipping');
      setTimeout(() => tbody.classList.remove('flipping'), 400);
    }

    // Pagination Logic
    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageData = data.slice(start, end);

    tbody.innerHTML = pageData.map(row => `
      <tr class="${selectedRows.has(row.id) ? 'selected' : ''}">
        <td>
          <div class="checkbox-wrapper">
            <input type="checkbox" class="row-check" data-id="${row.id}" ${selectedRows.has(row.id) ? 'checked' : ''}>
          </div>
        </td>
        <td>
          <div class="avatar-group">
            <div class="avatar">${row.initials}</div>
            <div class="info">
              <span class="name">${row.name}</span>
              <span class="email">${row.email}</span>
            </div>
          </div>
        </td>
        <td>${row.role}</td>
        <td><span class="chip ${getStatusClass(row.status)}">${row.status}</span></td>
        <td style="color:var(--text-muted)">${row.lastLogin}</td>
      </tr>
    `).join('');

    // Re-attach listeners for checkboxes
    document.querySelectorAll('.row-check').forEach(cb => {
      cb.addEventListener('change', handleRowCheck);
    });

    updateIndeterminate();
    updatePaginationUI();
    countEl.innerText = data.length;
  };

  const updatePaginationUI = () => {
    paginationEl.innerHTML = '';
    const totalPages = Math.ceil(data.length / itemsPerPage);
    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('div');
      btn.className = `page-pill ${i === currentPage ? 'active' : ''}`;
      btn.innerText = i;
      btn.onclick = () => {
        currentPage = i;
        renderTable();
      };
      paginationEl.appendChild(btn);
    }
    pageInfoEl.innerText = `Showing ${startIndex()}-${endIndex()} of ${data.length}`;
  };

  const startIndex = () => (currentPage - 1) * itemsPerPage + 1;
  const endIndex = () => Math.min(currentPage * itemsPerPage, data.length);

  // --- Sorting Logic ---
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const colIdx = parseInt(th.dataset.col);
      
      // Toggle Sort Direction
      if (sortCol === colIdx) {
        sortAsc = !sortAsc;
      } else {
        sortCol = colIdx;
        sortAsc = true;
      }

      // Update Visuals
      document.querySelectorAll('th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
      th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');

      // Sort Data
      data.sort((a, b) => {
        let valA, valB;
        // Map column index to data keys
        const keys = ['name', 'role', 'status', 'lastLogin'];
        const key = keys[colIdx];
        
        valA = a[key];
        valB = b[key];

        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      renderTable(true);
    });
  });

  // --- Selection Logic ---
  const selectedRows = new Set();

  selectAll.addEventListener('change', (e) => {
    const isChecked = e.target.checked;
    // Select all visible items on current page for demo simplicity, 
    // or all items globally. Let do globally for full functionality
    if (isChecked) {
      data.forEach(u => selectedRows.add(u.id));
    } else {
      selectedRows.clear();
    }
    renderTable();
  });

  const handleRowCheck = (e) => {
    const id = parseInt(e.target.dataset.id);
    if (e.target.checked) selectedRows.add(id);
    else selectedRows.delete(id);
    renderTable();
  };

  const updateIndeterminate = () => {
    const total = data.length;
    const checked = selectedRows.size;
    selectAll.checked = checked === total && total > 0;
    selectAll.indeterminate = checked > 0 && checked < total;
  };

  // --- Init ---
  renderTable();

</script>
</body>
</html>
