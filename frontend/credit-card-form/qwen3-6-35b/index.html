<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #1a1b26;
            --card-gradient: linear-gradient(135deg, #3d405b 0%, #24283b 100%);
            --text-primary: #ffffff;
            --text-secondary: #a9b1d6;
            --input-bg: #ffffff;
            --accent: #7aa2f7;
            --shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Layout */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            perspective: 1000px; /* Essential for 3D effect */
        }

        /* Card Styles */
        .card-wrapper {
            width: 360px;
            height: 225px;
            position: relative;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            backface-visibility: hidden;
            padding: 25px;
            color: var(--text-primary);
            background: var(--card-gradient);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            user-select: none;
        }

        /* Sheen Effect */
        .card-face::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.1) 45%, rgba(255,255,255,0.2) 50%, transparent 55%);
            opacity: 0.8;
            pointer-events: none;
        }

        /* Front Specifics */
        .card-front {
            transform: rotateY(0deg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Back Specifics */
        .card-back {
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Card Elements */
        .chip {
            width: 50px;
            height: 35px;
            border-radius: 6px;
            background: linear-gradient(135deg, #e0e0e0 0%, #b0b0b0 100%);
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .chip::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 30%;
            border-right: 1px solid rgba(0,0,0,0.2);
            border-left: 1px solid rgba(0,0,0,0.2);
            background-image: linear-gradient(to bottom, transparent, rgba(0,0,0,0.1), transparent);
        }

        .chip svg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 20px;
            opacity: 0.4;
        }

        .logo-region {
            position: absolute;
            top: 25px;
            right: 25px;
            font-weight: 800;
            font-style: italic;
            font-size: 2rem;
            letter-spacing: -1px;
            opacity: 0.8;
            color: #fff;
            font-family: sans-serif;
        }

        .card-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.4rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 2px 2px rgba(0,0,0,0.3);
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .detail-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .value {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            text-transform: uppercase;
            text-shadow: 0 2px 2px rgba(0,0,0,0.3);
        }

        /* Back Elements */
        .magnetic-strip {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            height: 50px;
            background: #0f1016;
        }

        .cvv-strip-area {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-right: 25px;
        }

        .cvv-box {
            width: 80px;
            height: 40px;
            background: #d3d3d3;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-weight: bold;
            border-radius: 4px;
        }

        .card-back .logo-region {
            opacity: 0.5;
            transform: scale(0.8);
            position: relative;
            display: inline-block;
            margin-top: 15px;
            right: auto;
            top: auto;
        }

        /* Form Styles */
        .form-container {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 2px solid #eee;
            border-radius: 12px;
            transition: all 0.3s ease;
            color: #333;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(122, 162, 247, 0.1);
        }

        .flex-row {
            display: flex;
            gap: 20px;
        }

        .flex-row .form-group {
            flex: 1;
        }

        button.submit-btn {
            width: 100%;
            padding: 16px;
            background: #1a1b26;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(26, 27, 38, 0.4);
        }

        button.submit-btn:active {
            transform: translateY(0);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) rotateX(0) rotateY(0); }
            50% { transform: translateY(-10px) rotateX(2deg) rotateY(-2deg); }
            100% { transform: translateY(0px) rotateX(0) rotateY(0); }
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .container { gap: 30px; }
            .card-wrapper { transform: scale(0.9); }
            .form-container { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 3D Card -->
    <div class="card-wrapper" id="card">
        <!-- Front -->
        <div class="card-face card-front">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="chip">
                    <svg viewBox="0 0 40 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 0H40V25H0V0Z" stroke="black" stroke-width="0.5"/>
                        <path d="M0 10H40" stroke="black" stroke-width="0.5"/>
                        <path d="M0 15H40" stroke="black" stroke-width="0.5"/>
                        <path d="M20 0V25" stroke="black" stroke-width="0.5"/>
                    </svg>
                </div>
                <div class="logo-region">VISA</div>
            </div>
            
            <div class="card-number" id="display-number">#### #### #### ####</div>
            
            <div class="card-details">
                <div class="detail-group">
                    <span class="label">Card Holder</span>
                    <span class="value" id="display-name">FULL NAME</span>
                </div>
                <div class="detail-group">
                    <span class="label">Expires</span>
                    <span class="value" id="display-expiry">MM/YY</span>
                </div>
            </div>
        </div>

        <!-- Back -->
        <div class="card-face card-back">
            <div class="magnetic-strip"></div>
            <div class="cvv-strip-area">
                <span class="label" style="margin-bottom: 5px; color: #fff;">CVC</span>
                <div class="cvv-box" id="display-cvv">***</div>
            </div>
            <div class="logo-region">VISA</div>
        </div>
    </div>

    <!-- Form -->
    <form class="form-container" onsubmit="event.preventDefault()">
        <div class="form-group">
            <label>Card Number</label>
            <input type="text" id="input-number" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric">
        </div>
        
        <div class="form-group">
            <label>Cardholder Name</label>
            <input type="text" id="input-name" placeholder="JOHN DOE">
        </div>

        <div class="flex-row">
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" id="input-expiry" placeholder="MM/YY" maxlength="5" inputmode="numeric">
            </div>
            <div class="form-group">
                <label>CVC</label>
                <input type="text" id="input-cvc" placeholder="123" maxlength="4" inputmode="numeric">
            </div>
        </div>

        <button class="submit-btn">Pay Now</button>
    </form>
</div>

<script>
    const card = document.getElementById('card');
    
    // Inputs
    const inputNumber = document.getElementById('input-number');
    const inputName = document.getElementById('input-name');
    const inputExpiry = document.getElementById('input-expiry');
    const inputCvc = document.getElementById('input-cvc');

    // Displays
    const displayNumber = document.getElementById('display-number');
    const displayName = document.getElementById('display-name');
    const displayExpiry = document.getElementById('display-expiry');
    const displayCvv = document.getElementById('display-cvv');

    // State
    let isFlipped = false;

    // --- Number Formatting ---
    inputNumber.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        value = value.substring(0, 16); // Limit to 16 digits
        
        let formatted = '';
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) formatted += ' ';
            formatted += value[i];
        }
        
        e.target.value = formatted;
        
        // Update Display
        if (value.length === 0) {
            displayNumber.textContent = '#### #### #### ####';
        } else {
            displayNumber.textContent = formatted;
        }
    });

    // --- Name Formatting ---
    inputName.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 0) {
            displayName.textContent = 'FULL NAME';
        } else {
            displayName.textContent = val.toUpperCase();
        }
    });

    // --- Expiry Formatting ---
    inputExpiry.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        value = value.substring(0, 4); // Limit to 4 digits

        let formatted = '';
        if (value.length >= 2) {
            formatted = value.substring(0, 2) + '/' + value.substring(2);
        } else {
            formatted = value;
        }

        e.target.value = formatted;

        if (value.length === 0) {
            displayExpiry.textContent = 'MM/YY';
        } else {
            displayExpiry.textContent = formatted;
        }
    });

    // --- CVC Handling & Flip Logic ---
    inputCvc.addEventListener('focus', () => {
        if (!isFlipped) {
            card.style.transform = 'rotateY(180deg)';
            isFlipped = true;
        }
    });

    inputCvc.addEventListener('blur', () => {
        // Check if we are moving focus to another input
        if (document.activeElement !== inputCvc) {
             // Delay slightly to allow transition focus if moving back to other fields
             setTimeout(() => {
                if (document.activeElement !== inputCvc) {
                    card.style.transform = 'rotateY(0deg)';
                    isFlipped = false;
                }
            }, 200);
        }
    });

    inputCvc.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        value = value.substring(0, 4);
        e.target.value = value;
        displayCvv.textContent = value || '***';
    });

    // --- Hover Tilt Effect (Subtle 3D movement) ---
    document.addEventListener('mousemove', (e) => {
        if (window.innerWidth < 768) return; // Disable on mobile

        const { clientX, clientY } = e;
        const { innerWidth, innerHeight } = window;
        
        const xRotation = ((clientY - innerHeight / 2) / innerHeight) * 10; // -5 to 5 deg
        const yRotation = ((clientX - innerWidth / 2) / innerWidth) * -10; // -5 to 5 deg

        // If not flipped, apply tilt based on mouse. If flipped, we override tilt with rotation.
        if (!isFlipped) {
            card.style.transform = `rotateX(${-xRotation}deg) rotateY(${yRotation}deg)`;
        } else {
            // If user interacts while flipped, keep it flipped but maybe adjust slightly?
            // For simplicity, keep it flipped to show the back clearly.
        }
    });
    
    // Reset card position on mouse leave
    document.addEventListener('mouseleave', () => {
        if (!isFlipped) {
            card.style.transform = 'rotateX(0) rotateY(0)';
        }
    });

</script>
</body>
</html>
