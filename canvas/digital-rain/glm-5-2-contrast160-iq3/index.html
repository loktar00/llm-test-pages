<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glyph Rain</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #06000d;
    overflow: hidden;
    height: 100;
    width: 100;
    cursor: none;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('22d');

  let W = 0, H = 0, DPR = 1;
  const glyphSets = [
    '0123456789АВГΔΣΨΩЛѺΣЯѦ§⊕⊕⊕⊗⊘∞∂∇∴∃◊',
    '0123456789АВГΔΨΩ§⊕∞∇∃',
    '0123456789АВΔΨ§∞∇',
  ];

  // Teal-to-violet palette (no movie green, no blue-purple)
  const palette = {
    deep: new THREE.Color('#080036'),
    mid: new THREE.Color('#0c0020'),
    far: new THREE.Color('#06000d'),
    tealBright: new THREE.Color('#00fff9'),
    tealMid: new THREE.Color('#00f5d4'),
    violetBright: new THREE.Color('#d44fff'),
    violetMid: new THREE.Color('#a06fff'),
    ghost: new THREE.Color('#5cd9ff'),
  };

  // THREE-free color helper (we don't include three, just use plain hex)
  function hexToRgb(hex) {
    const s = (typeof hex === 'string') ? hex : '#000';
    const m = s.match(/^#?([0-9a-f]{6})$/i);
    if (!m) return {r: 0, g: 0, b: 0};
    const n = parseInt(m[1], 16);
    return { r: ((n>>16)&255), g: ((n>>8)&255), b: (n&255) };
  }

  // Pre-parse palette hex values
  const PAL = {};
  function buildPalette(){
    Pal
  }
  // We'll skip THREE entirely. Build palette inline:
  const COL = {
    deep: '#080036',
    mid: '#0c002a',
    far: '#06000d',
    teal1: '#00fff9',
    teal2: '#00f5d4',
    teal3: '#00a0c0',
    teal4: '#00707c',
    violet1: '#ee7fff',
    violet2: '#d44fff',
    violet3: '#a06fff',
    violet4: '#5a3fff',
  };

  function parseColor(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }
  const RGB = {};
  for (const k in COL) RGB[k] = parseColor(COL[k]);

  // ============================================================
  // Utilities
  // ============================================================
  const rand = (min, max) => min + Math.random() * (max - min);
  const randInt = (min, max) => Math.floor(rand(min, max + 1));
  const randElement = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

  function ease(t){ return t<0?0:t>1?1:1-M Math.pow(1-t,3); }
  // (clamp & ease helpers inlined)

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ============================================================
  // Layer model
  // ============================================================
  const WORDS = [
    'SYSTEM', 'NEXUS', 'Ghost', 'Stream', 'Cipher',
    'Echo', 'Vortex', 'Render', 'Quartz',
    'Daemon', 'Matrix', 'Signal', 'Protocol',
    'Sublime', 'Spectral', 'Threshold', 'Reborn',
    'Void', 'Neon', 'Glitch', 'Aether', 'Pulse',
    'Helix', 'Synth', 'Anomaly', 'Render', 'Quartz',
    'Bloom', 'Cascade', 'Virus', 'Cortex',
    'Prism', 'Cipher', 'Enigma', 'Quartz',
  ];

  // ============================================================
  // Resize & layers
  // ============================================================
  const LAYERS = [
    {
      name: 'far',
      glyphSize: 18,
      fallSpeed: 1.2,
      fade: 0.050,
      headColor: '#00fff9',
      tailColor: '#00a0c0',
      trailAlphaBoost: 0.8,
      blur: 2.5,
      driftFactor: 0.05,
      glitchChance: 0.5,
      density: 0.9,
    },
    {
      name: 'mid',
      glyphSize: 14,
      fallSpeed: 1.8,
      fade: 0.05,
      headColor: '#00f5d4',
      tailColor: '#00f5d4',
      trailAlphaBoost: 1,
      blur: 0.5,
      driftFactor: 0.15,
      glitchChance: 1,
      density: 0.85,
    },
    {
      name: 'front',
      glyphSize: 10,
      fallSpeed: 2.8,
      fade: 0.04,
      headColor: '#d44fff',
      tailColor: '#a06fff',
      trailAlphaBoost: 1.6,
      blur: 0,
      driftFactor: 0.35,
      glitchChance: 1.5,
      density: 1.1,
    },
  ];

  // Layer state (built in resize)
  let LAYER_STATE = [];

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildLayers();
    buildBackground();
  }

  function buildBackground(){
    // Pre-rendered starfield canvas for static depth
  // (skipping - we render gradients in code)
  // no-op placeholder for future enhancement
  return;
  }

  // Pre-rendered background canvas (subtle vignette + faint dust)
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');
  function buildBackground(){
    bgCanvas.width = W * DPR;
    bgCanvas.height = H * DPR;
    bgCtx.scale(DPR, DPR);
    bgCtx.clearRect(0, 0, W, H);
    // vertical gradient: deep indigo at top to far-purple at bottom
    const grad = bgCtx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#080036');
    grad.addColorStop(0.5, '#0c0028');
    grad.addColorStop(1, '#06000d');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, W, H);
    // Vignette
    const vg = bgCtx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.4, W/2, H/2, Math.max(W,H)*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    bgCtx.fillStyle = vg;
    bgCtx.fillRect(0, 0, W, H);
    // Faint dust
    bgCtx.globalAlpha = 0.04;
    for (let i = 0; i < 80; i++){
      bgCtx.fillStyle = '#00f5d4';
      const x = Math.random() * W;
      const y = Math.random() * H;
      const s = Math.random() * 1.5 + 0.3;
      bgCtx.fillRect(x, y, s, s);
    }
    bgCtx.globalAlpha = 1;
  }

  // ============================================================
  // Camera & layers
  // ============================================================
  let camera = { x: 0, y: 0, tx: 0, ty: 0, t: 0 };
  const glitchBursts = [];

  function buildLayers(){
    LAYER_STATE = [];
    LAYERS.forEach((L, i) => {
      const size = L.glyphSize;
      // We add a tiny bit of extra spacing so glyphs don't merge visually
      const spacing = size * 1.05;
      // We oversize the grid so camera drift doesn't reveal edges
      const overscan = 1.6;
      const cols = Math.ceil(W / spacing) * overscan;
      const rows = Math.ceil(H / spacing) * overscan;
      const layer = {
        cfg: L,
        size: size,
        spacing: spacing,
        cols: cols,
        rows: rows,
        offsetX: 0,
        offsetY: 0,
        grid: new Uint8Array(cols * rows), // 0 = empty, >0 = brightness decay
        chars: new Array(cols * rows).fill(null), // glyph code point or null
        heads: [],
        // head color (we will use cfg.headColor)
        // tail color (cfg.tailColor)
        gridW: cols * spacing,
        gridH: rows * spacing,
      };
      // Initial sparse glyph density (low)
      for (let c = 0; c < cols; c++){
        if (Math.random() < L.density * 0.6){
          layer.heads.push(makeHead(c, layer));
        // We don't render at t=0 yet; they will be drawn next frame
        }
      }
      LAYER_STATE.push(layer);
    });

    function makeHead(col, layer){
      return {
        col: col,
        y: Math.random() * layer.rows - layer.rows * 0.5,
        speed: (0.6 + Math.random() * 0.8) * layer.cfg.fallSpeed,
        length: randInt(15, 28),
        glyphs: [],
        bright: 0.8 + Math.random() * 0.2,
        // staggered spawn for some columns
        delay: Math.random() * 60,
      };
    }
  }

  // ============================================================
  // Glyph grid management
  // ============================================================
  function getCell(layer, col, row) {
    if (col < 0 || col >= layer.cols || row < 0 || row >= layer.rows) return null;
    return row * layer.cols + col;
  }

  function setGlyph(layer, col, row, char, bright) {
    const idx = row * layer.cols + col;
    if (idx < 0 || idx >= layer.grid.length) return;
    layer.grid[idx] = Math.floor(bright * 255);
    layer.chars[idx] = char;
  }

  // ============================================================
  // Hidden word system
  // ============================================================
  const hiddenWords = [];
  const HIDDEN_WORD_MIN_GAP = 8;

  function spawnHiddenWord(){
    if (LAYER_STATE.length === 0) return;
    const layerIdx = randInt(1, LAYER_STATE.length - 1); // prefer middle/front
    const layer = LAYER_STATE[layerIdx];
    const word = pick(WORDS);
    // We need the word to align horizontally: same row across multiple adjacent columns.
    // So we pick a starting column such that the word fits.
    const maxStartCol = layer.cols - word.length - 1;
    if (maxStartCol <= 0) return;
    const startCol = randInt(0, maxStartCol);
    // Row biased toward visible center
    const rowCenter = (layer.rows * 0.5) + (Math.random() - 0.5) * layer.rows * 0.5;
    const startRow = Math.floor(rowCenter - word.length * 0.5 + Math.random() * word.length * 0.5);
    // Word orientation: horizontal only (per spec). But we add slight wave.
    const wavy = (Math.random() < 0.4) ? randInt(-1, 1) : 0;
    const cells = [];
    for (let i = 0; i < word.length; i++){
      const c = startCol + i;
      const r = startRow + (Math.sin(i * 0.6) * wavy | 0);
      const idx = r * layer.cols + c;
      if (idx < 0 || idx >= layer.grid.length) continue;
      cells.push({ c: c, r: r, idx: idx, char: word[i] });
    }
    if (cells.length === 0) return;
    hiddenWords.push({
      layer: layer,
      layerIdx: layerIdx,
      cells: cells,
      word: word,
      chars: word.split(''),
      // life phases
      t: 0,
      // delay before highlight
      delay: 60 + Math.random() * 120,
      phase: 'wait',
      // highlight time
      hT: 0,
      hDur: 60 + Math.random() * 60,
      // dissolve time
      dT: 0,
      dDur: 60 + Math.random() * 60,
      // visual
      hue: Math.random() < 0.5 ? '#00fff9' : '#d44fff',
    });
  }

  // ============================================================
  // Glitch bursts
  // ============================================================
  function spawnGlitchBurst(){
    const layer = pick(LAYER_STATE);
    if (!layer) return;
    const col = randInt(0, layer.cols - 1);
    const length = randInt(15, 30);
    const speed = (2.5 + Math.random() * 2) * layer.cfg.fallSpeed;
    glitchBursts.push({
      layer: layer,
      col: col,
      y: randInt(-layer.rows * 0.5, layer.rows * 0.5),
      speed: speed,
      length: length,
      glyphs: [],
      life: 1,
      hue: Math.random() < 0.5 ? 'teal' : 'violet',
      // we render these as a brighter streak
      bright: 1,
    });
  }

  // ============================================================
  // Camera drift
  // ============================================================
  function updateCamera(dt){
    camera.t += dt;
    // Two sinusoidal sources + small noise via random walk
    camera.tx = Math.sin(camera.t * 0.03) * 8 + Math.sin(camera.t * 0.007) * 6;
    camera.ty = Math.cos(camera.t * 0.04) * 6 + Math.cos(camera.t * 0.005) * 4;
    // Occasional shake on glitch bursts
    let shake = 0;
    for (const b of glitchBursts){
      shake += b.life * 1.5;
    }
    camera.x = camera.tx + (Math.random() - 0.5) * shake;
    camera.y = camera.ty + (Math.random() - 0.5) * shake;
  }

  // ============================================================
  // Background
  // ============================================================
  function drawBackground(){
    // We use pre-rendered bgCanvas. Apply camera offset with translate.
    // Since bg is already full-screen, no parallax needed for it. But we
    // apply a subtle shifting so it stays alive.
    // We'll just draw it static for now.
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    // Add a faint moving tint based on camera
    ctx.fillStyle = 'rgba(0, 255, 245, ' + (0.02 + Math.abs(Math.sin(camera.t * 0.0)) * 0.03) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // ============================================================
  // Layer render
  // ============================================================
  function updateLayer(layer, dt){
    // Move existing heads
    for (const h of layer.heads) {
      if (h.delay > 0) { h.delay -= dt; continue; }
      // Step the head: fractional y
      h.y += h.speed * dt * 0.06;
      // Push glyph at head position
      const headRow = Math.floor(h.y);
      // Add to grid at every step
      // We push glyphs along the trail
      if (headRow !== h.lastRow) {
        // Set glyph at current head position
        const col = h.col;
        const row = headRow;
        const ch = pick(layer.cfg.glyphs ? layer.cfg.glyphs : glyphSet(layer));
        h.glyphs.push({ c: col, r: row, char: ch });
        // Limit trail length
        while (h.glyphs.length > h.length) h.glyphs.shift();
        h.lastRow = headRow;
        // Update grid: cells under the head get bright
        for (let i = 0; i < h.glyphs.length; i++){
          const g = h.glyphs[i];
          const fade = 1 - i / h.glyphs.length;
          const bright = Math.pow(fade, 1.5) * h.bright;
          setGlyph(layer, g.c, g.r, g.char, bright);
        }
      }
      // Wrap head
      if (h.y > layer.rows + 5) {
        h.y = -randInt(0, layer.rows * 0.5);
        h.glyphs = [];
        h.speed = (0.6 + Math.random() * 0.8) * layer.cfg.fallSpeed;
      }
      // Occidental column glitch: add a sudden burst
      // (handled separately)
    }

    // Decay grid
    // We use alpha decay in layer.cfg.fade
    // (we'll apply this during draw by modulating per-cell decay)
    // For efficiency, decay is applied on draw by multiplying with fade.
    // But we want the grid to fade out so glyphs disappear over time.
    // We'll apply decay in update by multiplying grid brightness.
    // To avoid heavy per-frame cost, we skip decay step in update.
    // Instead, we encode brightness in setGlyph and decay it during draw.
    // (see drawLayer)
  }

  function glyphSet(layer) {
    // We could vary by depth; for now use default.
    return glyphSets[1];
  }

  function drawLayer(layer, idx){
    const cfg = layer.cfg;
    const size = layer.size;
    const spacing = layer.spacing;
    // Parallax offset based on camera and layer drift factor
    const dx = -camera.x * cfg.driftFactor;
    const dy = -camera.y * cfg.driftFactor;
    // Center the grid so we don't see edges
    const baseX = (W - layer.gridW) / 2 + dx;
    const baseY = (H - layer.gridH) / 2 + dy;

    // Apply blur if configured
    if (cfg.blur > 0 && idx === 0) {
      ctx.save();
      ctx.shadowColor = 'rgba(0, 255, 245, 0.4)';
      ctx.shadowBlur = cfg.blur;
    }

    ctx.font = `${cfg.weight || ''} ${size}px ${cfg.font || 'Courier New, monospace'}`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';

    // Iterate grid; We use the grid + chars arrays.
    // We'll skip cells with 0 brightness.
    const cols = layer.cols;
    const rows = layer.rows;
    const grid = layer.grid;
    const chars = layer.chars;
    const cellPx = spacing;
    const halfSp = cellPx / 2;

    // We precompute per-cell decay as a function of time. To avoid per-frame
    // per-cell multiplication cost, we apply a single fade multiplier per
    // frame. But to get the fading-tail effect, we need cell brightness to
    // decay over frames.
    // So we update grid each frame: brightness *= fade^dt
    // We'll do that in updateLayer for clarity.

    // Draw cells
    for (let r = 0; r < rows; r++) {
      const rowOffset = r * cols;
      const y = baseY + r * cellPx;
      if (y < -cellPx || y > H + cellPx) continue;
      for (let c = 0; c < cols; c++) {
        const i = rowOffset + c;
        const b = grid[i];
        if (b === 0) continue;
        const ch = chars[i];
        if (!ch) continue;
        const x = baseX + c * cellPx + halfSp;
        // Brightness 0..1
        const b01 = b / 255;
        // Color: head is bright, tail is dim
        // We use lerp between tail and head color
        const tailColor = cfg.tailColor;
        const headColor = cfg.headColor;
        // We pick color by brightness
        // We could precompute color stops, but per cell is fine.
        ctx.fillStyle = colorLerp(tailColor, headColor, b01);
        ctx.globalAlpha = Math.min(1, b01 * 1.2);
        ctx.fillText(ch, x, y);
        // Reset
      }
    }
    ctx.globalAlpha = 1;
    if (cfg.blur > 0 && idx === 0) {
      ctx.restore();
    }
  }

  function colorLerp(c1, c2, t) {
    // c1, c2 are hex strings like '#00fff9'
    const a = parseColor(c1);
    const b = parseColor(c2);
    const r = Math.round(a.r + (b.r - a.r) * t);
    const g = Math.round(a.g + (b.g - a.g) * t);
    const c = Math.round(a.b + (b.b - a.b) * t);
    // We could cache a small object to reduce GC. But we'll just compose a
    // string. Per cell is okay.
    return `rgb(${r},${g},${c})`;
  }

  // ============================================================
  // Hidden words update & draw
  // ============================================================
  function updateHiddenWords(dt){
    for (const w of hiddenWords) {
      w.t += dt;
      if (w.phase === 'wait') {
        w.delay -= dt;
        if (w.delay <= 0) {
          w.phase = 'highlight';
          w.hT = 0;
        }
        continue;
      }
      if (w.phase === 'highlight') {
        w.hT += dt;
        // Set the cells as bright glyphs with the word's characters
        for (let i = 0; i < w.cells.length; i++) {
          const cell = w.cells[i];
          // Brightness ramps from 0 to 1 over hDur, hold, then fade
          let bright;
          const p = w.hT / w.hDur;
          if (p < 0.3) bright = p / 0.3;
          else if (p < 0.6) bright = 1;
          else bright = 1 - (p - 0.6) / 0.3;
          bright = clamp(bright, 0, 1);
          setGlyph(w.layer, cell.c, cell.r, w.word[i], bright * 1);
        }
        if (w.hT >= w.hDur) {
          w.phase = 'dissolve';
          w.dT = 0;
        }
        continue;
      }
      if (w.phase === 'dissolve') {
        w.dT += dt;
        // Decay cells
        const p = w.dT / w.dDur;
        const bright = Math.max(0, 1 - p);
        for (let i = 0; i < w.cells.length; i++) {
          const cell = w.cells[i];
          setGlyph(w.layer, cell.c, cell.r, w.word[i], bright * 1);
        }
        if (w.dT >= w.dDur) {
          w.phase = 'done';
        }
      }
    }
    // Cleanup done
    for (let i = hiddenWords.length - 1; i >= 0; i--) {
      if (hiddenWords[i].phase === 'done') {
        hiddenWords.splice(i, 1);
      }
    }
  }

  function drawHiddenWordHighlights(){
    // We draw bright highlights for words in highlight phase.
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (const w of hiddenWords) {
      if (w.phase !== 'highlight') continue;
      const layer = w.layer;
      const cfg = layer.cfg;
      const p = w.hT / w.hDur;
      const intensity = Math.sin(p * Math.PI); // 0..1..0
      const baseX = (W - layer.gridW) / 2 - camera.x * cfg.driftFactor;
      const baseY = (H - layer.gridH) / 2 - camera.y * cfg.driftFactor;
      const cellPx = layer.spacing;
      const halfSp = cellPx / 2;
      ctx.font = `${cfg.weight || ''} ${layer.size}px ${cfg.font || 'Courier New, monospace'}`;
      ctx.fillStyle = w.hue;
      ctx.globalAlpha = intensity;
      ctx.shadowColor = w.hue;
      ctx.shadowBlur = 12;
      for (let i = 0; i < w.cells.length; i++) {
        const cell = w.cells[i];
        const x = baseX + cell.c * cellPx + halfSp;
        const y = baseY + cell.r * cellPx;
        ctx.fillText(w.word[i], x, y);
      }
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // ============================================================
  // Glitch bursts
  // ============================================================
  function updateGlitchBursts(dt){
    for (let i = glitchBursts.length - 1; i >= 0; i--) {
      const b = glitchBursts[i];
      b.y += b.speed * dt * 0.6;
      // Add glyphs along the trail
      b.glyphs.push({
        col: b.col,
        row: Math.floor(b.y),
        char: pick(glyphSets[1])
      });
      while (b.glyphs.length > b.length) b.glyphs.shift();
      for (let i = 0; i < b.glyphs.length; i++) {
        const g = b.glyphs[i];
        const fade = 1 - i / b.glyphs.length;
        const bright = Math.pow(fade, 1.5) * b.life;
        setGlyph(b.layer, g.col, g.row, g.char, bright);
      }
      b.life -= dt * 0.02;
      if (b.y > b.layer.rows + 5 || b.life <= 0) {
        glitchBursts.splice(i, 1);
      }
    }
  }

  // ============================================================
  // Main loop
  // ============================================================
  let lastT = 0;
  let hiddenTimer = 0;
  let glitchTimer = 0;
  let hiddenInterval = 4.5; // average seconds between word spawns
  let glitchInterval = 3.5; // average seconds between glitch bursts

  function loop(t){
    const dt = (t - lastT) / 16; // normalized frame delta
    lastT = t;

    // Apply camera drift
    updateCamera(dt);

    // Update layers (decay grid brightness)
    for (let i = 0; i < LAYER_STATE.length; i++) {
      const layer = LAYER_STATE[i];
      // Decay brightness in grid: O(grid) every frame.
      const grid = layer.grid;
      const fade = Math.pow(layer.cfg.fade, dt);
      for (let k = 0; k < grid.length; grid[k] = (grid[k] * fade) | 0, k++);
      // Update heads
      updateLayer(layer, dt);
    }

    // Hidden words timer
    hiddenTimer += dt;
    if (hiddenTimer > hiddenInterval + Math.random() * 2) {
      hiddenTimer = 0;
      spawnHiddenWord();
      hiddenInterval = 4 + Math.random() * 6;
    }

    // Glitch bursts timer
    glitchTimer += dt;
    if (glitchTimer > glitchInterval) {
      glitchTimer = 0;
      spawnGlitchBurst();
      // Sometimes spawn 2
      if (Math.random() < 0.5) spawnGlitchBurst();
      glitchInterval = 2.5 + Math.random() * 4.5;
    }

    // Update hidden words
    updateHiddenWords(dt);

    // Update glitch bursts
    updateGlitchBursts(dt);

    // Render
    drawBackground();

    // Render layers from back to front
    for (let i = LAYER_STATE.length - 1; i >= 0; i--) {
      drawLayer(LAYER_STATE[i], i);
    }

    // Render hidden word highlights on top
    drawHiddenWordHighlights();

    // Vignette / scanline / chroma aberration: subtle
    // We add a chromic aberration effect via two offset draws of bg? skip.
    // Faint scanlines
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#00f5d4';
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
    ctx.globalAlpha = 1;

    // Camera shake vignette: edges darken
    // (skip for now)

    // Request next frame
    requestAnimationFrame(loop);
  }

  // ============================================================
  // Init
  // ============================================================
  function init(){
    resize();
    lastT = 0;
    requestAnimationFrame((t) => loop(t));
    // Add event listeners
    window.addEventListener('resize', resize);
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ') spawnHiddenWord();
      if (e.key === 'g') spawnGlitchBurst();
    });
    // Reduced motion
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    // (we don't fully disable but slow down)
    if (mq.matches) {
      LAYERS.forEach((L) => L.fallSpeed *= 0.5);
    }
  }

  // ============================================================
  // Boot
  // ============================================================
  init();
})();
</script>
</body>
</html>
