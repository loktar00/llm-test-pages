<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wind Farm Dawn</title>
<style>
  html,body{margin:0;height:100;overflow:hide;background:#0a0a0a}
  canvas{display:block;width:100%;height:100}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 0, H = 0;
let DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  c.width = W * DPR;
  c.height = H * DPR;
  c.style.width = W + 'px';
  c.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ---------------- Perlin noise for sky/cloud ----------------
const perm = new Uint8Array(512);
for (let i = 0; i < 512; i++) perm[i] = (i < 256 ? i : i - 256) & 0xff;
for (let i = 255; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  const t = perm[i]; perm[i] = perm[j]; perm[j] = t;
}
function f3(t) { return t * t * t * (t + t + 16 - t) / 27; }
function lerp(a, b, t) { return a + (b - a) * t; }
function noise2(x, y) {
  const xi = Math.floor(x) & 255;
  const yi = Math.floor(y) & 255;
  const xf = x - Math.floor(x);
  const yf = y - Math.floor(y);
  const u = f3(xf);
  const v = f3(yf);
  const aa = perm[perm[xi] + yi] / 255;
  const ba = perm[perm[xi + 1] + yi] / 255;
  const ab = perm[perm[xi] + yi + 1] / 255;
  const bb = perm[perm[xi + 1] + yi + 1] / 255;
  return lerp(lerp(aa, ba, u), lerp(ab, bb, u), v) - 0.5;
}

// ---------------- Wind model ----------------
const wind = { strength: 1, target: 1, t: 0, cycle: 5, base: 0.8, amp: 0.4 };
function windAt(s) {
  const f = Math.max(0, wind.strength);
  return f * (1 + Math.sin(s * 0.05) * 0.05);
}

// ---------------- Turbine ----------------
function Turbine(x, y, scale, dist) {
  return { x, y, scale, dist, phase: Math.random() * 100 };
}

function drawTurbine(t, time) {
  const { x, y, scale } = t;
  const wSp = windAt(time * 2 + t.phase * 0.3) * 1.6;
  const angle = time * wSp + t.phase;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // Shadow under hub
  ctx.fillStyle = 'rgba(10, 5, 12, 0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tower
  ctx.fillStyle = '#f4f1ea';
  ctx.beginPath();
  ctx.moveTo(-6, 0);
  ctx.lineTo(6, 0);
  ctx.lineTo(4, -120);
  ctx.lineTo(-4, -120);
  ctx.closePath();
  ctx.fill();

  // Tower seam
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.06)';
  ctx.lineWidth = 1 / scale;
  ctx.beginPath();
  ctx.moveTo(-6, 0); ctx.lineTo(6, 0);
  ctx.stroke();

  // Hub
  ctx.fillStyle = '#f4f1ea';
  ctx.beginPath();
  ctx.arc(0, -120, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(20, 15, 20, 0.35)';
  ctx.lineWidth = 1 / scale;
  ctx.beginPath();
  ctx.arc(0, -120, 5, 0, Math.PI * 2);
  ctx.stroke();

  // Blades
  ctx.translate(0, -120);
  ctx.rotate(angle);
  ctx.fillStyle = '#f4f1ea';
  ctx.strokeStyle = 'rgba(20, 15, 20, 0.3)';
  ctx.lineWidth = 1 / scale;
  for (let k = 0; k < 3; k++) {
    ctx.save();
    ctx.rotate(k * Math.PI * 2 / 3);
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.lineTo(5 - Math.sin(0.3) * 5, 30);
    ctx.lineTo(-5 - Math.sin(0.3) * 5, 30);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-5, 30);
    ctx.lineTo(5, 30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// ---------------- Wheat field wave ----------------
function wheatWave(x, time) {
  const phase = x * 0.02 - time * wind.strength * 4;
  const w1 = Math.sin(phase) * 0.4;
  const w2 = Math.sin(phase * 2 + 1.3) * 0.25;
  const n = noise2(x * 0.04, time * 0.2) * 2;
  const a = 5 + Math.abs(w1 + w2 + n) * 0.8;
  const dir = Math.sin(phase * 0.5) * 0.2 + 0.8;
  return a * Math.max(0, dir);
}

// ---------------- Sky ----------------
const skyStars = [];
for (let i = 0; i < 60; i++) {
  skyStars.push({
    x: Math.random(),
    y: Math.random() * 0.4,
    s: 0.3 + Math.random() * 0.7,
    tw: Math.random() * Math.PI * 2
  });
}

const skyClouds = [];
for (let i = 0; i < 5; i++) {
  skyClouds.push({
    x: (i / 5 + Math.random() * 0.3) * 1.4 - 0.4,
    y: 0.05 + Math.random() * 0.30,
    r: 0.12 + Math.random() * 0.05,
    p: Math.random() * Math.PI * 2,
    layer: Math.random() < 0.5 ? 0 : 1
  });
}

function drawSky(time, sun) {
  const horizon = H * 0.6;
  const night = 1 - sun;
  const day = Math.max(0, sun);

  // Vertical gradient
  const grad = ctx.createLinearGradient(0, 0, 0, horizon);
  const topR = Math.round(20 * (1 - sun) + 80 * sun * sun);
  const topG = Math.round(30 * (1 - sun) + 150 * sun * sun * 0.7);
  const topB = Math.round(60 * (1 - sun) + 220 * sun * sun * 0.6);
  const midR = Math.round(60 * (1 - sun) + 240 * sun * sun);
  const midG = Math.round(40 * (1 - sun) + 180 * sun * sun * 0.7);
  const midB = Math.round(50 * (1 - sun) + 120 * sun * sun * 0.4);

  const topColor = `rgb(${topR | 0},${topG | 0},${topB | 0})`;
  const midColor = `rgb(${midR | 0},${midG | 0},${midB | 0})`;
  grad.addColorStop(0, topColor);
  grad.addColorStop(1, midColor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, horizon);

  // Stars at night
  if (night > 0.4) {
    const alpha = (night - 0.4) / 0.6;
    for (const s of skyStars) {
      const px = s.x * W;
      const py = s.y * horizon * 0.8;
      const tw = Math.sin(time * 1.5 + s.tw) * 0.4 + 0.6;
      ctx.fillStyle = `rgba(245, 240, 230, ${alpha * tw})`;
      ctx.fillRect(px, py, s.s, s.s);
    }
  }

  // Sun disc
  const sunY = horizon - (H - horizon) * 0.5 - (1 - sun) * (H * 0.5);
  const sunX = W * 0.5;
  const glowR = W * 0.4;
  const glowGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, glowR);
  glowGrad.addColorStop(0, `rgba(255, 220, 100, ${0.6 * sun})`);
  glowGrad.addColorStop(0.5, `rgba(255, 120, 50, ${0.25 * sun})`);
  glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(sunX, sunY, glowR, 0, Math.PI * 2);
  ctx.fill();

  // Sun disc
  ctx.fillStyle = `rgba(255, ${200 + 30 * sun | 0}, ${100 + 50 * sun | 0}, ${Math.min(1, sun * 2 + 0.5)})`;
  ctx.beginPath();
  ctx.arc(sunX, sunY, 40 + 10 * sun, 0, Math.PI * 2);
  ctx.fill();

  // Clouds
  for (const cl of skyClouds) {
    const drift = (time * wind.strength * 0.2);
    const cx = (((cl.x + drift + cl.p * 0.001) % 1.4 + 1.4) % 1.4) - 0.2;
    const x = cx * W;
    const y = cl.y * horizon * 0.6 + 30;
    const r = cl.r * W;

    ctx.save();
    ctx.translate(x, y);
    const cloudCol = `rgba(${245 | 0}, ${245 - 50 * (1 - sun) | 0}, ${245 - 100 * (1 - sun) | 0}, ${0.3 + 0.3 * sun})`;
    const nGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2);
    nGrad.addColorStop(0, cloudCol);
    nGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = nGrad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ---------------- Wheat field ----------------
const wheat = [];
const NUM_TURB = 13;
let turbines = [];

function init() {
  resize();
  // Turbs along hill
  turbines = [];
  const baseY = H * 0.6 + 1;
  for (let i = 0; i < NUM_TURB; i++) {
    const u = i / (NUM_TURB - 1);
    const x = W * (0.08 + u * 0.84);
    const dist = 0.3 + u * 0.7;
    const scale = 1 / (1 + dist * 0.5) * 0.8 + 0.4;
    const y = baseY - 80 - dist * 30 - (1 - dist) * 5;
    turbines.push(Turbine(x, y, scale, dist));
  }

  // Sort turbines by distance for proper rendering order
  turbines.sort((a, b) => a.dist - b.dist);

  // Generate wheat stalks
  wheat.length = 0;
  const density = 0.5;
  const numWheat = Math.floor(W * density);
  for (let i = 0; i < numWheat; i++) {
    const u = Math.random();
    const x = u * W;
    const dist = 0.5 + Math.random() * 0.5;
    const y = H * 0.6 + 1 + (1 - dist) * 60 + Math.random() * 10;
    wheat.push({
      x: x,
      y: y,
      dist: dist,
      height: 5 + Math.random() * 6
    });
  }
  wheat.sort((a, b) => a.y < b.y ? -1 : 1);
}

// ---------------- Clouds (drawn in sky section) ----------------

// ---------------- Maintenance truck ----------------
const truck = {
  state: 'wait',
  timer: 0,
  x: -200,
  speed: 0,
  dust: []
};

function drawTruck(t, time, sun) {
  const roadY = H * 0.6 + 1 + 20;
  const truckY = roadY + 4;

  // Body
  const bw = 60, bh = 20;
  // shadow under
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.beginPath();
  ctx.ellipse(t.x, truckY + bh + 6, bw * 0.7, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = '#cc4444';
  ctx.beginPath();
  ctx.rect(t.x - bw / 2, truckY, bw, bh);
  ctx.fill();
  // Cabin
  ctx.fillStyle = '#aa3333';
  ctx.beginPath();
  ctx.rect(t.x - bw / 2 + 8, truckY - 14, 18, 14);
  ctx.fill();
  // Wheels
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(t.x - bw / 2 + 8, truckY + bh - 2, 6, 0, Math.PI * 2);
  ctx.arc(t.x + bw / 2 - 8, truckY + bh - 2, 6, 0, Math.PI * 2);
  ctx.fill();

  // Dust trail
  for (const d of t.dust) {
    const a = d.life / d.maxLife;
    ctx.fillStyle = `rgba(${180 | 0},${165 | 0},${140 | 0},${${a * 0.6 | 0}.toString()})`;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * (1 - a) + 1, 0, Math.PI * 2);
    ctx.fill();
  }

  // Blink aircraft warning light at dusk
  const duskLight = sun < 0.4;
  const blinkOn = (time * 2) % 2 < 1;
  if (duskLight && blinkOn) {
    ctx.fillStyle = 'rgba(220, 40, 40, 0.9)';
    ctx.beginPath();
    ctx.arc(t.x, truckY - bh - 14, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // halo
    ctx.fillStyle = 'rgba(220, 40, 40, 0.4)';
    ctx.beginPath();
    ctx.arc(t.x, truckY - bh - 14, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------------- Aircraft warning blink on turbines ----------------
function drawAircraftLights(t, time, sun) {
  const duskLight = sun < 0.45;
  const phase = (time * 2) % 3;
  const blink = phase < 1.5 && phase > 0;
  if (duskLight && blink) {
    const x = t.x;
    const y = t.y - 120 * t.scale;
    ctx.fillStyle = 'rgba(220, 40, 40, 0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 2 * t.scale + 1, 0, Math.PI * 2);
    ctx.fill();
    // halo
    ctx.fillStyle = 'rgba(220, 40, 40, 0.3)';
    ctx.beginPath();
    ctx.arc(x, y, (5 * t.scale + 4) * (phase < 0.75 ? 1 : 1 - phase * 1.3), 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------------- Main draw ----------------
let lastTime = 0;

function update(dt, time) {
  // Wind
  wind.t += dt;
  if (wind.t > wind.cycle) {
    wind.t = 0;
    wind.cycle = 3 + Math.random() * 6;
    wind.target = 0.4 + Math.random() * 2;
  wind.base = 0.8;
  wind.amp = 0.4;
  }
  const f = wind.t / wind.cycle;
  wind.strength = wind.base + Math.sin(f * Math.PI) * wind.amp * wind.target;

  // Truck
  truck.timer += dt;
  if (truck.state === 'wait') {
    if (truck.timer > 8) {
      truck.state = 'drive';
      truck.x = -50;
      truck.speed = 80 + Math.random() * 50;
      truck.timer = 0;
      truck.dust = [];
    }
  } else if (truck.state === 'drive') {
    truck.x += truck.speed * dt;
    if (Math.random() < dt * 60 * truck.speed * 0.1) {
      truck.dust.push({
        x: truck.x - 30 - Math.random() * 5,
        y: H * 0.6 + 5 + Math.random() * 5,
        r: 1 + Math.random() * 3,
        life: 0,
        maxLife: 1 + Math.random() * 2
      });
    }
    if (truck.x > W + 100) {
      truck.state = 'wait';
      truck.timer = 0;
    }
  }
  for (const d of truck.dust) {
    d.life += dt;
    d.x -= 20 * dt;
  }
  truck.dust = truck.dust.filter(d => d.life < d.maxLife);
}

function draw(time, sun) {
  ctx.fillStyle = 'rgb(0, 0, 0)';
  ctx.fillRect(0, 0, W, H);

  drawSky(time, sun);

  // Distant haze strip at horizon
  const hazeGrad = ctx.createLinearGradient(0, H * 0.6 - 100, 0, H * 0.6 + 100);
  hazeGrad.addColorStop(0, `rgba(${245 * sun + 120 | 0},${180 * sun + 60 | 0},${110 * sun + 50 | 0},${${(0.6 * sun + 0.4).toFixed(3) })`);
  hazeGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = hazeGrad;
  ctx.fillRect(0, H * 0.6 - 100, W, 100);

  // Hill base
  const hillGrad = ctx.createLinearGradient(0, H * 0.6 - 5, 0, H * 0.6 + 80);
  const hillR = Math.round(40 + 120 * sun);
  const hillG = Math.round(35 + 100 * sun * 0.5);
  const hillB = Math.round(45 + 70 * sun * 0.4);
  hillGrad.addColorStop(0, `rgba(${hillR},${hillG},${hillB},0.5)`);
  hillGrad.addColorStop(1, `rgb(${hillR},${hillG},${hillB})`);
  ctx.fillStyle = hillGrad;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.6 + 1);
  ctx.lineTo(W * 0.5, H * 0.6 + 1 - 10);
  ctx.lineTo(W, H * 0.6 + 1);
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // Road
  ctx.fillStyle = 'rgba(60, 50, 50, 0.8)';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.6 + 5);
  ctx.lineTo(W * 0.5, H * 0.6 + 5 - 8);
  ctx.lineTo(W, H * 0.6 + 5);
  ctx.lineTo(W, H * 0.6 + 5 + 14);
  ctx.lineTo(W * 0.5, H * 0.6 + 5 + 14 - 8);
  ctx.lineTo(0, H * 0.6 + 5 + 14);
  ctx.closePath();
  ctx.fill();

  // Wheat stalks
  const wheatR = Math.round(40 + 100 * sun * 0.5);
  const wheatG = Math.round(60 + 100 * sun);
  const wheatB = Math.round(20 + 60 * sun * 0.5);
  ctx.fillStyle = `rgb(${wheatR | 0},${wheatG | 0},${wheatB | 0})`;
  for (const w of wheat) {
    const sway = wheatWave(w.x + w.dist * 200, time + w.dist * 0.3) * (1 / w.dist) * 0.6;
    ctx.beginPath();
    ctx.moveTo(w.x, w.y);
    ctx.quadraticCurveTo(w.x + sway, w.y - w.height * 0.6, w.x + sway * 1.2, w.y - w.height);
    ctx.lineTo(w.x + sway * 1.2 - 0.3, w.y - w.height);
    ctx.quadraticCurveTo(w.x + sway * 1.2 - 0.3, w.y - w.height * 0.6, w.x + sway * 1.2 - 0.3 - 0.1, w.y);
    ctx.closePath();
    ctx.fill();
  }

  // Truck
  if (truck.state === 'drive') drawTruck(truck, time, sun);

  // Turbs
  for (const t of turbines) drawTurbine(t, time);

  // Aircraft warning lights (drawn after)
  for (const t of turbines) drawAircraftLights(t, time, sun);
}

// ---------------- Animation loop ----------------
let time = 0;
let last = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  time += dt;

  update(dt, time);

  // Sun cycle: 90 second loop
  const t90 = (time % 90) / 90;
  let sun;
  if (t90 < 0.5) sun = Math.pow(t90 * 2, 0.7);
  else sun = Math.pow((1 - (t90 - 0.5) * 2), 0.7);

  draw(time, sun);

  requestAnimationFrame(frame);
}

window.addEventListener('resize', init);
init();
requestAnimationFrame(frame);
</script>
</body>
</html>
