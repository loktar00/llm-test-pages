<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Messaging Panel</title>
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-panel: #ffffff;
            --bg-header: #ffffff;
            --bg-bubble-in: #f1f0f0;
            --bg-bubble-out: #007aff;
            --text-primary: #1d1d1f;
            --text-secondary: #8e8e93;
            --accent-green: #34c759;
            --accent-red: #ff3b30;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --radius-lg: 20px;
            --radius-md: 12px;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* Main Container */
        .app-container {
            width: 1000px;
            height: 85vh;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--bg-header);
            border-right: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .search-bar {
            margin: 0 24px 16px;
            background: #f5f5f7;
            padding: 10px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background 0.2s ease;
            position: relative;
        }

        .contact-item:hover {
            background: #f9f9fb;
        }

        .contact-item.active {
            background: #f0f4ff;
        }

        .avatar-wrapper {
            position: relative;
            margin-right: 14px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #e1e1e1;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
        }

        .status-dot.online { background-color: var(--accent-green); }
        .status-dot.offline { background-color: var(--text-secondary); }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .contact-time {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .contact-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--accent-red);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 8px;
            min-width: 18px;
            text-align: center;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            height: 80px;
            padding: 0 28px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .chat-header-info h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .chat-header-status {
            font-size: 12px;
            color: var(--accent-green);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chat-header-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .chat-header-actions button:hover {
            background: #f0f0f0;
        }

        .messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e1e1e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ccc; }

        /* Day Divider */
        .day-divider {
            display: flex;
            justify-content: center;
            margin: 16px 0;
        }

        .day-divider span {
            background: rgba(0,0,0,0.05);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Bubbles */
        .message-row {
            display: flex;
            margin-bottom: 4px;
            opacity: 0; /* For animation */
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .message-row.incoming {
            justify-content: flex-start;
        }

        .message-row.outgoing {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 10px 16px;
            font-size: 14px;
            line-height: 1.45;
            position: relative;
            word-wrap: break-word;
        }

        .incoming .bubble {
            background: var(--bg-bubble-in);
            color: var(--text-primary);
            border-radius: 18px 18px 18px 2px;
        }

        .outgoing .bubble {
            background: var(--bg-bubble-out);
            color: white;
            border-radius: 18px 18px 2px 18px;
            box-shadow: 0 2px 5px rgba(0,122,255,0.2);
        }

        .msg-time {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
            display: block;
        }

        /* Typing Indicator */
        .typing-indicator {
            background: var(--bg-bubble-in);
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: none; /* Hidden by default */
            align-items: center;
            gap: 4px;
            width: fit-content;
            margin-bottom: 8px;
        }

        .typing-indicator.visible {
            display: flex;
            animation: popIn 0.3s ease forwards;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #a1a1a6;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Composer */
        .composer {
            padding: 20px 24px;
            border-top: 1px solid #f0f0f0;
            background: var(--bg-panel);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .composer-input-wrapper {
            flex: 1;
            position: relative;
        }

        .composer input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #e5e5ea;
            font-size: 14px;
            font-family: var(--font-stack);
            outline: none;
            transition: border-color 0.2s;
        }

        .composer input:focus {
            border-color: var(--bg-bubble-out);
        }

        .send-btn {
            background: var(--bg-bubble-out);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
            transform: translateX(1px); /* Visual centering */
        }

        .send-btn:hover {
            transform: scale(1.1) rotate(10deg);
        }
        
        .send-btn:active {
            transform: scale(0.9);
        }

        /* Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
