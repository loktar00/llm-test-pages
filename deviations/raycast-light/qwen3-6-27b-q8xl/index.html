<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Raycast Lighting Demo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const obstacles = [];
        const numObstacles = 12;
        
        // Configuration
        const MAX_RAY_COUNT = 1000; // Limit for performance
        const RAY_DENSITY = 4; // Degrees between rays
        
        // Lights
        const lights = [
            {
                radius: 200,
                speed: 0.0003,
                orbitX: 0,
                orbitY: 0,
                colorBase: { h: 30, s: 100, l: 50 }, // Warm
                intensity: 1.0,
                angle: 0
            },
            {
                radius: 150,
                speed: -0.0005,
                orbitX: 0,
                orbitY: 0,
                colorBase: { h: 220, s: 80, l: 60 }, // Cool
                intensity: 0.6,
                angle: Math.PI
            }
        ];

        // Resize handler
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            generateObstacles();
        }

        // Generate random polygonal obstacles
        function generateObstacles() {
            obstacles.length = 0;
            const margin = 100;
            for (let i = 0; i < numObstacles; i++) {
                const sides = Math.floor(Math.random() * 3) + 3; // 3 to 5 sides
                const cx = margin + Math.random() * (width - margin * 2);
                const cy = margin + Math.random() * (height - margin * 2);
                const radius = 30 + Math.random() * 50;
                
                const vertices = [];
                const angleStep = (Math.PI * 2) / sides;
                const rotationOffset = Math.random() * Math.PI;

                for (let j = 0; j < sides; j++) {
                    const angle = j * angleStep + rotationOffset;
                    // Add slight randomness to radius for jagged look
                    const r = radius * (0.8 + Math.random() * 0.4);
                    vertices.push({
                        x: cx + Math.cos(angle) * r,
                        y: cy + Math.sin(angle) * r
                    });
                }
                obstacles.push(vertices);
            }
        }

        // Math helpers
        function getIntersection(p1, p2, p3, p4) {
            const x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y;
            const x3 = p3.x, y3 = p3.y, x4 = p4.x, y4 = p4.y;

            const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return null;

            const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;

            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
                return {
                    x: x1 + ua * (x2 - x1),
                    y: y1 + ua * (y2 - y1),
                    dist: Math.sqrt(Math.pow(x1 + ua * (x2 - x1) - x1, 2) + Math.pow(y1 + ua * (y2 - y1) - y1, 2))
                };
            }
            return null;
        }

        function getClosestIntersection(rayOrigin, rayDir) {
            let closest = null;
            let minDist = Infinity;

            // Ray end point (far away)
            const rayEnd = {
                x: rayOrigin.x + Math.cos(rayDir) * 10000,
                y: rayOrigin.y + Math.sin(rayDir) * 10000
            };

            for (let obs of obstacles) {
                for (let i = 0; i < obs.length; i++) {
                    const p1 = obs[i];
                    const p2 = obs[(i + 1) % obs.length];
                    
                    const hit = getIntersection(rayOrigin, rayEnd, p1, p2);
                    if (hit) {
                        if (hit.dist < minDist) {
                            minDist = hit.dist;
                            closest = hit;
                        }
                    }
                }
            }
            return closest;
        }

        // Lighting Logic
        function castLight(light, time) {
            const cx = width / 2 + Math.cos(time * light.speed * 1000 + light.angle) * (width * 0.3);
            const cy = height / 2 + Math.sin(time * light.speed * 1000 + light.angle) * (height * 0.3);
            
            const source = { x: cx, y: cy };
            
            // Shift hue slowly
            const hue = (light.colorBase.h + time * 0.02) % 360;
            const colorStr = `hsla(${hue}, ${light.colorBase.s}%, ${light.colorBase.l}%,`;
            
            ctx.save();
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for light

            // Draw rays
            ctx.beginPath();
            ctx.moveTo(source.x, source.y);
            
            let rayCount = 0;
            const startAngle = 0;
            const endAngle = Math.PI * 2;

            // Raycasting
            for (let angle = startAngle; angle < endAngle; angle += (Math.PI / 180) * RAY_DENSITY) {
                if (rayCount++ > MAX_RAY_COUNT) break;
                
                const hit = getClosestIntersection(source, angle);
                
                if (hit) {
                    ctx.lineTo(hit.x, hit.y);
                } else {
                    // If no hit, go off screen
                    const farX = source.x + Math.cos(angle) * Math.max(width, height) * 2;
                    const farY = source.y + Math.sin(angle) * Math.max(width, height) * 2;
                    ctx.lineTo(farX, farY);
                }
            }
            ctx.closePath();
            
            // Gradient for the light cone
            const gradient = ctx.createRadialGradient(source.x, source.y, 0, source.x, source.y, Math.max(width, height));
            gradient.addColorStop(0, colorStr + '0.8)');
            gradient.addColorStop(0.2, colorStr + '0.3)');
            gradient.addColorStop(1, colorStr + '0.0)');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.restore();

            return source;
        }

        // Render Loop
        function draw(time) {
            // 1. Clear with black (Dark room)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // 2. Cast Lights
            const lightSources = lights.map(l => castLight(l, time));

            // 3. Draw Obstacles
            // We draw them twice: once for the "shadow" body, once for the glowing edges
            ctx.save();
            
            // Draw filled polygons (dark, slightly visible to ground them)
            ctx.fillStyle = '#111';
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            
            for (let obs of obstacles) {
                ctx.beginPath();
                ctx.moveTo(obs[0].x, obs[0].y);
                for (let i = 1; i < obs.length; i++) {
                    ctx.lineTo(obs[i].x, obs[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Draw glowing edges based on proximity to light
            // This simulates "Lit edges glow faintly"
            ctx.globalCompositeOperation = 'screen';
            ctx.lineWidth = 3;
            
            for (let obs of obstacles) {
                for (let i = 0; i < obs.length; i++) {
                    const p1 = obs[i];
                    const p2 = obs[(i + 1) % obs.length];
                    
                    // Check distance to each light source
                    lightSources.forEach((src, idx) => {
                        // Simple distance check from light to segment midpoint
                        const midX = (p1.x + p2.x) / 2;
                        const midY = (p1.y + p2.y) / 2;
                        const dist = Math.sqrt(Math.pow(midX - src.x, 2) + Math.pow(midY - src.y, 2));
                        
                        // If close enough, glow
                        const threshold = 300;
                        if (dist < threshold) {
                            // Determine if this edge is actually facing the light (dot product)
                            // Normal vector of edge
                            const dx = p2.x - p1.x;
                            const dy = p2.y - p1.y;
                            const len = Math.sqrt(dx*dx + dy*dy);
                            const nx = -dy / len;
                            const ny = dx / len;
                            
                            // Vector from midpoint to light
                            const lx = src.x - midX;
                            const ly = src.y - midY;
                            
                            // Dot product
                            const dot = (nx * lx) + (ny * ly);
                            
                            // If dot > 0, it's facing the light
                            if (dot > 0) {
                                const intensity = (1 - dist / threshold) * lights[idx].intensity;
                                const hue = (lights[idx].colorBase.h + time * 0.02) % 360;
                                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${intensity})`;
                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    });
                }
            }
            
            ctx.restore();

            // 4. Vignette / Atmosphere (Optional, for depth)
            // Just a slight darkening at corners to enhance the room feel
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,width,height);

            requestAnimationFrame(draw);
        }

        // Init
        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(draw);

    </script>
</body>
</html>
