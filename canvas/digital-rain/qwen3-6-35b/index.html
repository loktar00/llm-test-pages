<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glyph Rain</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Glyph sets
  const KATAKANA = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const SYMBOLS = 'αβγδεζηθικλμνξοπρστυφχψω∞≈≠≤≥∆∑∏∫√∂∇◆◇○●◎★☆△▽□■▲▼♦♣♥♠†‡§¶©®™';
  const GLYPHS = KATAKANA + SYMBOLS;

  function randGlyph() {
    return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  }

  // Color palette: teal to violet
  const PALETTE = [
    { r: 0, g: 255, b: 204 },   // bright teal
    { r: 0, g: 200, b: 180 },   // teal
    { r: 0, g: 160, b: 220 },   // blue-teal
    { r: 60, g: 100, b: 220 },  // blue
    { r: 120, g: 60, b: 220 },  // violet
    { r: 160, g: 40, b: 220 },  // purple
    { r: 200, g: 40, b: 180 },  // magenta-violet
    { r: 220, g: 60, b: 160 },  // pink-violet
  ];

  function randomColor(alpha) {
    const c = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    return `rgba(${c.r},${c.g},${c.b},${alpha !== undefined ? alpha : 1})`;
  }

  function colorStr(c, alpha) {
    return `rgba(${c.r},${c.g},${c.b},${alpha})`;
  }

  // Camera drift
  let camX = 0, camY = 0;
  let camTargetX = 0, camTargetY = 0;
  let camDriftTime = 0;

  // Layers
  const LAYER_COUNT = 3;
  const LAYER_CONFIGS = [
    { size: 10, opacity: 0.15, blur: 3, speedMul: 0.4, weight: 0.3 },
    { size: 14, opacity: 0.35, blur: 1, speedMul: 0.7, weight: 0.4 },
    { size: 20, opacity: 0.8, blur: 0, speedMul: 1.0, weight: 0.3 },
  ];

  // Columns
  let columns = [];
  const GLYPH_SPACING = 22;

  function createColumn(layer, x) {
    const config = LAYER_CONFIGS[layer];
    const headY = -Math.random() * H * 2;
    const speed = (1 + Math.random() * 2) * config.speedMul * (0.8 + Math.random() * 0.4);
    const tailLength = 8 + Math.floor(Math.random() * 25);
    const glyphs = [];
    for (let i = 0; i < tailLength; i++) {
      glyphs.push({ char: randGlyph(), color: null });
    }
    if (!glyphs[0].color) glyphs[0].color = PALETTE[Math.floor(Math.random() * PALETTE.length)];

    return {
      layer, x, speed, headY, tailLength, glyphs,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      glitching: false, glitchTimer: 0, glitchDuration: 0,
      active: true,
      respawnTimer: 0,
    };
  }

  function initColumns() {
    columns = [];
    const totalWidth = W + 200;
    let x = -50;
    while (x < totalWidth) {
      const r = Math.random();
      let layer;
      if (r < LAYER_CONFIGS[0].weight) layer = 0;
      else if (r < LAYER_CONFIGS[0].weight + LAYER_CONFIGS[1].weight) layer = 1;
      else layer = 2;

      const spacing = LAYER_CONFIGS[layer].size * 2.5 + Math.random() * 8;
      x += spacing;
      const col = createColumn(layer, x);
      // Spread headY so they don't all start together
      col.headY = -Math.random() * H * 3;
      columns.push(col);
    }
  }

  initColumns();
  window.addEventListener('resize', () => { resize(); initColumns(); });

  // Hidden words
  const WORDS = [
    'SYSTEM', 'MATRIX', 'GLYPH', 'DREAM', 'CODE', 'NEURAL', 'SYNTH',
    'VOID', 'PULSE', 'ECHO', 'FLUX', 'DRIFT', 'NOVA', 'QUANTUM',
    'SHADOW', 'PHANTOM', 'NEXUS', 'PRISM', 'ZENITH', 'OMEGA',
    'ALPHA', 'DELTA', 'SIGMA', 'VECTOR', 'PIXEL', 'BINARY',
    'CIPHER', 'FRACTAL', 'HORIZON', 'INFINITY', 'KINETIC', 'LUMEN',
    'MORPH', 'NEXUS', 'ORBIT', 'PRIME', 'QUASAR', 'RESONANCE',
    'SPECTRUM', 'TENSOR', 'ULTRA', 'VORTEX', 'WAVEFORM', 'XENON',
    'YIELD', 'ZEPHYR', 'AETHER', 'COSMOS', 'ECLIPSE', 'FABLE',
  ];

  let activeWords = [];
  let wordTimer = 0;
  let wordInterval = 400 + Math.random() * 600;

  function spawnWord() {
    // Pick a random row (y) and a random word
    const word = WORDS[Math.floor(Math.random() * WORDS.length)];
    const layer = 2; // Foreground layer for readability
    const config = LAYER_CONFIGS[layer];
    const rowY = 60 + Math.random() * (H - 120);

    // Find columns in this layer near the rowY
    const layerCols = columns.filter(c => c.layer === layer && c.active);
    if (layerCols.length < word.length + 2) return;

    // Pick a starting column
    const startIdx = Math.floor(Math.random() * (layerCols.length - word.length));
    const startCol = layerCols[startIdx];

    // Create word highlight
    const wordHighlight = {
      word,
      rowY,
      layer,
      columns: [],
      spawnTime: performance.now(),
      duration: 3000 + Math.random() * 2000,
      fadeTime: 1500,
      highlighted: false,
      dissolving: false,
      alpha: 0,
    };

    for (let i = 0; i < word.length; i++) {
      const col = layerCols[startIdx + i];
      wordHighlight.columns.push({
        colIndex: columns.indexOf(col),
        charIndex: 0, // The glyph position in the column's tail
        originalChar: col.glyphs[0] ? col.glyphs[0].char : word[i],
        overrideChar: word[i],
        overrideColor: PALETTE[Math.floor(Math.random() * PALETTE.length)],
        highlightAlpha: 0,
      });
    }

    activeWords.push(wordHighlight);
  }

  // Glitch bursts
  function triggerGlitch(col) {
    col.glitching = true;
    col.glitchDuration = 300 + Math.random() * 700;
    col.glitchTimer = performance.now();
  }

  // Main loop
  let lastTime = 0;
  let glitchTimer = 0;

  function update(dt) {
    // Camera drift
    camDriftTime += dt * 0.0003;
    camTargetX = Math.sin(camDriftTime * 0.7) * 80 + Math.sin(camDriftTime * 1.3) * 40;
    camTargetY = Math.cos(camDriftTime * 0.5) * 30 + Math.sin(camDriftTime * 1.1) * 15;
    camX += (camTargetX - camX) * 0.005;
    camY += (camTargetY - camY) * 0.005;

    // Update columns
    for (const col of columns) {
      col.headY += col.speed * dt * 0.06;

      // Respawn if off screen
      if (col.headY > H + col.tailLength * GLYPH_SPACING + 100) {
        col.headY = -GLYPH_SPACING * (5 + Math.random() * 15);
        // Regenerate glyphs
        for (let i = 0; i < col.tailLength; i++) {
          col.glyphs[i] = { char: randGlyph(), color: null };
        }
        col.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
        col.speed = (1 + Math.random() * 2) * LAYER_CONFIGS[col.layer].speedMul * (0.8 + Math.random() * 0.4);
        col.tailLength = 8 + Math.floor(Math.random() * 25);
      }

      // Glitch
      if (col.glitching) {
        const elapsed = performance.now() - col.glitchTimer;
        if (elapsed > col.glitchDuration) {
          col.glitching = false;
        }
        // Randomly change head char during glitch
        if (Math.random() < 0.3) {
          col.headChar = randGlyph();
        }
      }

      // Random glitch bursts
      if (!col.glitching && Math.random() < 0.0002 * dt * 0.06) {
        triggerGlitch(col);
      }
    }

    // Word spawning
    wordTimer += dt;
    if (wordTimer > wordInterval * dt * 0.06) {
      wordTimer = 0;
      wordInterval = 300 + Math.random() * 500;
      if (activeWords.length < 3) {
        spawnWord();
      }
    }

    // Update words
    const now = performance.now();
    for (let i = activeWords.length - 1; i >= 0; i--) {
      const w = activeWords[i];
      const age = now - w.spawnTime;

      if (age < 800) {
        w.alpha = Math.min(1, age / 400);
      } else if (age < w.duration) {
        w.alpha = 1;
      } else if (age < w.duration + w.fadeTime) {
        w.alpha = 1 - (age - w.duration) / w.fadeTime;
      } else {
        activeWords.splice(i, 1);
      }
    }

    // Update word glyph overrides
    for (const w of activeWords) {
      for (const wh of w.columns) {
        const col = columns[wh.colIndex];
        if (col && col.glyphs[0]) {
          col.glyphs[0].char = wh.overrideChar;
          col.glyphs[0].color = wh.overrideColor;
        }
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(camX, camY);

    // Draw columns
    for (const col of columns) {
      const config = LAYER_CONFIGS[col.layer];
      const headX = col.x;

      // Draw tail
      for (let i = col.tailLength - 1; i >= 0; i--) {
        const y = col.headY - i * GLYPH_SPACING;
        if (y < -config.size || y > H + config.size) continue;

        const glyph = col.glyphs[i];
        let alpha;
        if (i === 0) {
          // Head
          if (col.glitching) {
            alpha = 0.7 + Math.random() * 0.3;
            ctx.fillStyle = `rgba(${200 + Math.random() * 55},${Math.random() * 100},${200 + Math.random() * 55},${alpha})`;
          } else {
            alpha = 1;
            ctx.fillStyle = colorStr(col.color, 1);
          }
        } else {
          // Tail fade
          const fade = 1 - (i / col.tailLength);
          alpha = fade * fade * config.opacity;
          if (col.glitching) {
            const glitchCol = PALETTE[Math.floor(Math.random() * PALETTE.length)];
            ctx.fillStyle = colorStr(glitchCol, alpha * (0.5 + Math.random() * 0.5));
          } else {
            ctx.fillStyle = colorStr(col.color, alpha);
          }
        }

        ctx.font = `${config.size}px "MS Gothic", "Yu Gothic", monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (config.blur > 0) {
          ctx.filter = `blur(${config.blur}px)`;
        } else {
          ctx.filter = 'none';
        }

        // Draw with slight glow for head
        if (i === 0) {
          ctx.shadowColor = colorStr(col.color, 0.8);
          ctx.shadowBlur = 15;
        } else {
          ctx.shadowBlur = 0;
        }

        ctx.fillText(glyph.char, headX, y);
      }
    }

    ctx.filter = 'none';
    ctx.shadowBlur = 0;

    // Draw word highlights
    for (const w of activeWords) {
      if (w.alpha <= 0) continue;

      const config = LAYER_CONFIGS[w.layer];

      // Draw the word text
      ctx.font = `bold ${config.size + 4}px "MS Gothic", "Yu Gothic", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Find the x positions from the columns
      const chars = w.word.split('');
      let totalWidth = 0;
      const charPositions = [];

      for (let i = 0; i < chars.length; i++) {
        const wh = w.columns[i];
        const col = columns[wh.colIndex];
        if (col) {
          charPositions.push(col.x);
        }
      }

      // Draw each character at its column position
      for (let i = 0; i < chars.length; i++) {
        if (i >= charPositions.length) continue;
        const x = charPositions[i];
        const y = w.rowY;

        // Glow effect
        ctx.shadowColor = `rgba(255,255,255,${w.alpha * 0.6})`;
        ctx.shadowBlur = 20;

        // Bright white-teal highlight
        ctx.fillStyle = `rgba(200,255,240,${w.alpha * 0.95})`;
        ctx.fillText(chars[i], x, y);

        // Second pass for extra brightness
        ctx.shadowBlur = 30;
        ctx.fillStyle = `rgba(255,255,255,${w.alpha * 0.4})`;
        ctx.fillText(chars[i], x, y);
      }

      // Draw connecting line
      if (charPositions.length > 1) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `rgba(200,255,240,${w.alpha * 0.3})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(charPositions[0], w.rowY);
        for (let i = 1; i < charPositions.length; i++) {
          ctx.lineTo(charPositions[i], w.rowY);
        }
        ctx.stroke();
      }
    }

    ctx.filter = 'none';
    ctx.shadowBlur = 0;

    ctx.restore();

    // Vignette
    const vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.8);
    vignette.addColorStop(0, 'rgba(5,5,16,0)');
    vignette.addColorStop(1, 'rgba(5,5,16,0.7)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    // Scanline effect
    ctx.fillStyle = 'rgba(5,5,16,0.03)';
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
  }

  function loop(time) {
    const dt = Math.min(time - lastTime, 50);
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame((time) => {
    lastTime = time;
    requestAnimationFrame(loop);
  });

})();
</script>
</body>
</html>
