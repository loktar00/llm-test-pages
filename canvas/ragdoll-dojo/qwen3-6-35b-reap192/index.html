<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragdoll Dojo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">Ragdoll Dojo - Verlet Physics</div>
    <canvas id="c"></canvas>
    <script>
        // --- Configuration ---
        const CONFIG = {
            gravity: 0.5,
            friction: 0.99,
            floorFriction: 0.8,
            bounce: 0.6,
            constraintIterations: 10,
            particleRadius: 4,
            constraintRadius: 2,
            subSteps: 2,
            slowMoTrigger: 0.2, // Velocity threshold for slow-mo
            slowMoFactor: 0.2,
            spawnRate: 200, // Frames between spawns
        };

        // --- Vector Math ---
        class Vec {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vec(this.x + v.x, this.y + v.y); }
