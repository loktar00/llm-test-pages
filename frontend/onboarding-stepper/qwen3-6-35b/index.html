<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Wizard</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --success: #10b981;
    --radius: 24px;
    --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: var(--font);
    background-color: var(--bg);
    background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
    background-size: 24px 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: var(--text-main);
    overflow: hidden;
  }

  /* Card Container */
  .wizard-card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2rem;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    transition: height 0.3s ease;
  }

  /* Progress Bar */
  .progress-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    margin-bottom: 1rem;
    z-index: 2;
  }

  .progress-line {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    transform: translateY(-50%);
    z-index: 1;
  }

  .progress-fill {
    position: absolute;
    top: 50%;
    left: 0;
    width: 0%; /* JS handles this */
    height: 4px;
    background: var(--primary);
    border-radius: 2px;
    transform: translateY(-50%);
    z-index: 1;
    transition: width 0.4s ease;
  }

  .dot {
    width: 12px;
    height: 12px;
    background: var(--card-bg);
    border: 3px solid var(--border);
    border-radius: 50%;
    transition: all 0.3s ease;
  }

  .dot.active {
    border-color: var(--primary);
    background: var(--primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
  }

  .dot.completed {
    border-color: var(--primary);
    background: var(--primary);
  }

  /* Step Container (Slider) */
  .steps-wrapper {
    position: relative;
    width: 100%;
    height: 320px; /* Fixed height for layout stability */
    overflow: hidden;
  }

  .step {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
    opacity: 0;
    pointer-events: none;
  }

  .step.active {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }

  .step.prev { transform: translateX(-100%); opacity: 0; }
  .step.next { transform: translateX(100%); opacity: 0; }

  /* Typography & Forms */
  h2 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    text-align: center;
    color: var(--text-main);
  }
  
  p {
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 2rem;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .input-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  input, select {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: var(--font);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--primary);
  }

  /* --- CSS Illustrations --- */
  
  /* Step 1: Avatar */
  .illustration {
    width: 100px;
    height: 100px;
    margin-bottom: 1.5rem;
    position: relative;
  }
  
  .avatar-bg {
    width: 100%;
    height: 100%;
    background: #e0e7ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  
  .avatar-head {
    width: 40px;
    height: 40px;
    background: var(--primary);
    border-radius: 50%;
    position: absolute;
    top: 30px;
  }
  
  .avatar-body {
    width: 60px;
    height: 30px;
    background: var(--primary);
    border-radius: 30px 30px 0 0;
    position: absolute;
    bottom: 0;
  }

  /* Step 2: Plan Cards */
  .plan-visual {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  
  .card-shape {
    width: 30px;
    height: 40px;
    border-radius: 6px;
    background: var(--border);
    position: relative;
  }
  
  .card-shape:nth-child(1) { transform: translateY(10px); }
  .card-shape:nth-child(2) { background: var(--primary); height: 50px; transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }
  .card-shape:nth-child(3) { transform: translateY(5px); }

  /* Step 3: Settings Toggles */
  .settings-visual {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 1.5rem;
    width: 100%;
    background: #f1f5f9;
    padding: 15px;
    border-radius: 12px;
  }
  
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  
  .setting-icon {
    width: 20px;
    height: 20px;
    background: #cbd5e1;
    border-radius: 4px;
  }
  
  .toggle {
    width: 36px;
    height: 20px;
    background: var(--primary);
    border-radius: 20px;
    position: relative;
  }
  
  .toggle::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    top: 2px;
    right: 2px;
  }

  /* Step 4: Success Checkmark */
  .success-check {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    opacity: 0;
    transform: scale(0.5);
  }

  .checkmark-svg {
    width: 40px;
    height: 40px;
    stroke: white;
    stroke-width: 4;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: drawCheck 0.6s 0.3s ease forwards;
  }

  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  /* Navigation Buttons */
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 1rem;
  }

  button {
    padding: 0.8rem 1.5rem;
    border-radius: 12px;
    font-family: var(--font);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-size: 0.95rem;
  }

  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
  }
  
  .btn-secondary:hover { color: var(--text-main); background: #f1f5f9; }

  .btn-primary {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
  }
  
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  
  .btn-primary:disabled {
    background: #c7d2fe;
    cursor: not-allowed;
    transform: none;
  }

  .hidden { display: none !important; }

</style>
</head>
<body>

<div class="wizard-card">
  
  <!-- Progress Header -->
  <div class="progress-container">
    <div class="progress-line"></div>
    <div class="progress-fill" id="progressFill"></div>
    <div class="dot active" data-step="1"></div>
    <div class="dot" data-step="2"></div>
    <div class="dot" data-step="3"></div>
    <div class="dot" data-step="4"></div>
  </div>

  <!-- Steps Viewport -->
  <div class="steps-wrapper">
    
    <!-- Step 1: Profile -->
    <div class="step active" id="step-1">
      <div class="illustration">
        <div class="avatar-bg">
          <div class="avatar-head"></div>
          <div class="avatar-body"></div>
        </div>
      </div>
      <h2>Welcome!</h2>
      <p>Let's start by getting to know you better. This helps us personalize your experience.</p>
      <div class="input-group">
        <input type="text" placeholder="Full Name" id="inputName">
        <input type="email" placeholder="Email Address" id="inputEmail">
      </div>
    </div>

    <!-- Step 2: Preferences -->
    <div class="step next" id="step-2">
      <div class="illustration">
        <div class="plan-visual">
          <div class="card-shape"></div>
          <div class="card-shape"></div>
          <div class="card-shape"></div>
        </div>
      </div>
      <h2>Your Preferences</h2>
      <p>Choose the category that best fits your needs.</p>
      <div class="input-group">
        <select id="selectCategory">
          <option value="" disabled selected>Select a category...</option>
          <option value="design">Creative Design</option>
          <option value="dev">Development</option>
          <option value="marketing">Marketing & SEO</option>
          <option value="business">Business Management</option>
        </select>
      </div>
    </div>

    <!-- Step 3: Notification Settings -->
    <div class="step next" id="step-3">
      <div class="illustration">
        <div class="settings-visual">
          <div class="setting-row">
            <div class="setting-icon"></div>
            <div class="toggle"></div>
          </div>
          <div class="setting-row">
            <div class="setting-icon"></div>
            <div class="toggle" style="background: #cbd5e1;">
              <div style="position:absolute; width:16px; height:16px; background:white; border-radius:50%; top:2px; left:2px;"></div>
            </div>
          </div>
        </div>
      </div>
      <h2>Notification Settings</h2>
      <p>How would you like to stay updated?</p>
      <div class="input-group">
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" checked> Email Newsletter
        </label>
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox"> Push Notifications
        </label>
      </div>
    </div>

    <!-- Step 4: Success -->
    <div class="step next" id="step-4">
      <div class="success-check">
        <svg class="checkmark-svg" viewBox="0 0 24 24">
          <polyline points="6 12 10 16 18 8"></polyline>
        </svg>
      </div>
      <h2>All Set!</h2>
      <p>You're all set up. We've sent a confirmation email to your inbox.</p>
      <div class="nav-buttons" style="width:100%; justify-content:center; padding-top:0;">
        <button class="btn-primary" onclick="location.reload()">Start Dashboard</button>
      </div>
    </div>

  </div>

  <!-- Footer Navigation -->
  <div class="nav-buttons" id="navButtons">
    <button class="btn-secondary hidden" id="prevBtn">Back</button>
    <button class="btn-primary" id="nextBtn">Next</button>
  </div>

</div>

<script>
  const totalSteps = 4;
  let currentStep = 1;

  const dots = document.querySelectorAll('.dot');
  const progressFill = document.getElementById('progressFill');
  const steps = document.querySelectorAll('.step');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const navButtons = document.getElementById('navButtons');

  function updateUI() {
    // Update Dots
    dots.forEach((dot, index) => {
      const stepNum = index + 1;
      dot.classList.remove('active', 'completed');
      if (stepNum === currentStep) {
        dot.classList.add('active');
      } else if (stepNum < currentStep) {
        dot.classList.add('completed');
      }
    });

    // Update Progress Line
    // Line goes from left to right. 
    // Step 1: 0%, Step 2: 33%, Step 3: 66%, Step 4: 100%
    const progressWidth = ((currentStep - 1) / (totalSteps - 1)) * 100;
    progressFill.style.width = `${progressWidth}%`;

    // Update Step Visibility
    steps.forEach(step => {
      const stepId = parseInt(step.id.split('-')[1]);
      step.classList.remove('active', 'prev', 'next');
      
      if (stepId === currentStep) {
        step.classList.add('active');
      } else if (stepId < currentStep) {
        step.classList.add('prev');
      } else {
        step.classList.add('next');
      }
    });

    // Update Buttons
    if (currentStep === 1) {
      prevBtn.classList.add('hidden');
    } else {
      prevBtn.classList.remove('hidden');
    }

    if (currentStep === totalSteps) {
      navButtons.classList.add('hidden');
    } else {
      navButtons.classList.remove('hidden');
      nextBtn.textContent = currentStep === totalSteps - 1 ? 'Finish' : 'Next';
    }
  }

  function nextStep() {
    if (currentStep < totalSteps) {
      currentStep++;
      updateUI();
    }
  }

  function prevStep() {
    if (currentStep > 1) {
      currentStep--;
      updateUI();
    }
  }

  // Event Listeners
  nextBtn.addEventListener('click', nextStep);
  prevBtn.addEventListener('click', prevStep);

  // Initialize
  updateUI();

</script>

</body>
</html>
