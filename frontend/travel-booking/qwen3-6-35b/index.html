<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Search Results</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f0f2f5;
    --surface:#fff;
    --text-primary:#1a1a2e;
    --text-secondary:#555770;
    --text-muted:#8b8da3;
    --accent:#4f46e5;
    --accent-light:#818cf8;
    --accent-bg:rgba(79,70,229,.08);
    --coral:#ef4444;
    --coral-light:#fca5a5;
    --gold:#f59e0b;
    --gold-light:#fde68a;
    --border:#e2e4ea;
    --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-md:0 4px 12px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04);
    --shadow-lg:0 12px 36px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.05);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --radius-xl:20px;
    --transition-fast:150ms cubic-bezier(.4,0,.2,1);
    --transition-base:250ms cubic-bezier(.4,0,.2,1);
    --transition-spring:400ms cubic-bezier(.34,1.56,.64,1);
    --transition-smooth:350ms cubic-bezier(.4,0,.2,1);
  }
  html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;line-height:1.5}

  /* ── Header / Search Bar ── */
  .search-bar{
    position:sticky;top:0;z-index:100;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    padding:16px 24px;
  }
  .search-bar-inner{max-width:1200px;margin:0 auto}
  .search-bar h1{font-size:1.125rem;font-weight:700;color:var(--text-primary);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .search-bar h1 svg{flex-shrink:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:100px;
    font-size:.8125rem;font-weight:500;color:var(--text-primary);
    cursor:pointer;
    transition:all var(--transition-fast);
    user-select:none;
    position:relative;
  }
  .chip:hover{border-color:var(--accent-light);background:var(--accent-bg)}
  .chip:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
  .chip svg{flex-shrink:0;opacity:.55}
  .chip input{
    border:none;outline:none;background:transparent;
    font:inherit;color:inherit;font-size:inherit;font-weight:inherit;
    width:70px;
  }
  .chip input::placeholder{color:var(--text-muted)}
  .chip .chip-remove{
    width:16px;height:16px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--border);color:var(--text-muted);
    cursor:pointer;transition:all var(--transition-fast);
    font-size:10px;line-height:1;
  }
  .chip .chip-remove:hover{background:var(--coral);color:#fff}
  .chip-add{
    padding:8px 14px;
    border:1.5px dashed var(--border);
    border-radius:100px;
    font-size:.8125rem;font-weight:500;color:var(--text-muted);
    cursor:pointer;transition:all var(--transition-fast);
    background:transparent;
  }
  .chip-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}

  /* ── Results Header ── */
  .results-header{
    max-width:1200px;margin:0 auto;
    padding:24px 24px 0;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;
  }
  .results-count{font-size:.9375rem;color:var(--text-secondary)}
  .results-count strong{color:var(--text-primary);font-weight:700}
  .sort-wrapper{position:relative}
  .sort-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    font-size:.8125rem;font-weight:500;color:var(--text-primary);
    cursor:pointer;transition:all var(--transition-fast);
  }
  .sort-btn:hover{border-color:var(--accent-light);background:var(--accent-bg)}
  .sort-btn svg{transition:transform var(--transition-fast)}
  .sort-btn.open svg{transform:rotate(180deg)}
  .sort-dropdown{
    position:absolute;top:calc(100% + 6px);right:0;
    min-width:200px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-lg);
    padding:6px;
    opacity:0;visibility:hidden;
    transform:translateY(-8px) scale(.96);
    transition:all var(--transition-base);
    z-index:50;
  }
  .sort-dropdown.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
  .sort-option{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    font-size:.8125rem;font-weight:500;color:var(--text-secondary);
    cursor:pointer;transition:all var(--transition-fast);
  }
  .sort-option:hover{background:var(--accent-bg);color:var(--accent)}
  .sort-option.active{color:var(--accent);background:var(--accent-bg)}
  .sort-option .check{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);flex-shrink:0}
  .sort-option.active .check{border-color:var(--accent);background:var(--accent)}
  .sort-option.active .check::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}

  /* ── Cards Grid ── */
  .results-grid{
    max-width:1200px;margin:0 auto;
    padding:20px 24px 48px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:20px;
    align-items:start;
  }

  /* ── Card ── */
  .card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:box-shadow var(--transition-base),transform var(--transition-base);
    will-change:transform;
    position:relative;
  }
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}

  .card-image{
    position:relative;
    width:100%;
    height:220px;
    overflow:hidden;
  }
  .card-gradient{
    position:absolute;inset:0;
    transition:transform 600ms cubic-bezier(.4,0,.2,1);
  }
  .card:hover .card-gradient{transform:scale(1.05)}

  .card-gradient-1{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%)}
  .card-gradient-2{background:linear-gradient(135deg,#f093fb 0%,#f5576c 50%,#ffd89b 100%)}
  .card-gradient-3{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 50%,#43e97b 100%)}
  .card-gradient-4{background:linear-gradient(135deg,#fa709a 0%,#fee140 50%,#a18cd1 100%)}
  .card-gradient-5{background:linear-gradient(135deg,#a18cd1 0%,#fbc2eb 50%,#f6d365 100%)}
  .card-gradient-6{background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 50%,#ff9a9e 100%)}
  .card-gradient-7{background:linear-gradient(135deg,#89f7fe 0%,#66a6ff 50%,#8fd3f4 100%)}
  .card-gradient-8{background:linear-gradient(135deg,#fddb92 0%,#d1fdff 50%,#a1c4fd 100%)}

  .card-gradient::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.35) 100%);
  }

  /* Decorative shapes inside gradients */
  .card-gradient .shape{position:absolute;border-radius:50%;opacity:.15;backdrop-filter:blur(2px)}
  .shape-1{width:120px;height:120px;background:#fff;top:-20px;right:-20px}
  .shape-2{width:80px;height:80px;background:#fff;bottom:20px;left:30px}
  .shape-3{width:50px;height:50px;background:#fff;top:40%;left:60%}

  /* Price badge */
  .price-badge{
    position:absolute;bottom:12px;left:12px;
    padding:6px 14px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:100px;
    font-size:.875rem;font-weight:700;color:var(--text-primary);
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    z-index:2;
    display:flex;align-items:baseline;gap:2px;
  }
  .price-badge .currency{font-size:.75rem;font-weight:600;opacity:.7}
  .price-badge .night{font-size:.7rem;font-weight:500;opacity:.5;margin-left:2px}

  /* Heart button */
  .heart-btn{
    position:absolute;top:12px;right:12px;
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
    transition:background var(--transition-fast),transform var(--transition-spring);
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .heart-btn:hover{background:rgba(255,255,255,.95);transform:scale(1.1)}
  .heart-btn svg{width:20px;height:20px;transition:all var(--transition-spring)}
  .heart-btn .heart-outline{fill:none;stroke:var(--text-secondary);stroke-width:2}
  .heart-btn .heart-filled{fill:var(--coral);stroke:var(--coral);stroke-width:0;transform:scale(0);transition:transform var(--transition-spring)}
  .heart-btn.saved .heart-outline{transform:scale(0);opacity:0}
  .heart-btn.saved .heart-filled{transform:scale(1)}
  .heart-btn.saved:hover{background:rgba(239,68,68,.1)}
  .heart-btn.pop{animation:heartPop 450ms cubic-bezier(.34,1.56,.64,1)}
  @keyframes heartPop{
    0%{transform:scale(1)}
    30%{transform:scale(1.35)}
    60%{transform:scale(.9)}
    100%{transform:scale(1)}
  }

  /* Heart burst particles */
  .heart-burst{position:absolute;pointer-events:none;z-index:3}
  .heart-burst span{
    position:absolute;
    width:6px;height:6px;
    background:var(--coral);
    border-radius:50%;
    animation:burst .5s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
  }

  /* Card body */
  .card-body{padding:16px 18px 18px}
  .card-location{
    font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    color:var(--accent);margin-bottom:4px;
  }
  .card-title{
    font-size:1.0625rem;font-weight:700;color:var(--text-primary);
    margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-rating{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .stars{display:flex;gap:1px}
  .stars svg{width:14px;height:14px}
  .stars .star-filled{fill:var(--gold)}
  .stars .star-half{fill:url(#starHalfGrad)}
  .stars .star-empty{fill:#ddd}
  .rating-text{font-size:.8125rem;color:var(--text-secondary);font-weight:500}
  .review-count{font-size:.75rem;color:var(--text-muted)}

  .card-amenities{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .amenity{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 10px;
    background:var(--bg);
    border-radius:100px;
    font-size:.6875rem;font-weight:500;color:var(--text-secondary);
  }
  .amenity svg{width:13px;height:13px;flex-shrink:0;opacity:.6}

  /* ── Responsive ── */
  @media(max-width:768px){
    .results-grid{grid-template-columns:1fr}
    .search-bar{padding:12px 16px}
    .results-header{padding:16px 16px 0}
    .results-grid{padding:16px 16px 40px}
  }

  /* ── Card entrance animation ── */
  .card{opacity:0;transform:translateY(24px);animation:cardIn .5s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes cardIn{to{opacity:1;transform:translateY(0)}}

  /* ── Sort reflow ── */
  .card-reflow{transition:all var(--transition-smooth)}

  /* ── Scrollbar ── */
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
</style>
</head>
<body>

<!-- SVG defs -->

</header>

<!-- Results Header -->
<div class="results-header">

  <div class="sort-wrapper">
    <button class="sort-btn" id="sortBtn" onclick="toggleSort()">

    </button>
    <div class="sort-dropdown" id="sortDropdown">
      <div class="sort-option active" data-sort="recommended" onclick="sortCards('recommended')">

      </div>
      <div class="sort-option" data-sort="price-low" onclick="sortCards('price-low')">

      </div>
      <div class="sort-option" data-sort="price-high" onclick="sortCards('price-high')">
        <span class="check"></span>Price: High to Low
      </div>
      <div class="sort-option" data-sort="rating" onclick="sortCards('rating')">
        <span class="check"></span>Highest Rated
      </div>
      <div class="sort-option" data-sort="reviews" onclick="sortCards('reviews')">
        <span class="check"></span>Most Reviewed
      </div>

  </div>
</div>

<!-- Results Grid -->
<div class="results-grid" id="resultsGrid"></div>

  parking: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 17V7h4a3 3 0 010 6H9"/></svg>',
  ac: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>',
  bike: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M12 17.5V14l-3-3 4-3 2 3h3"/></svg>',
  kitchen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>'
};

function renderStars(rating) {
  let html = '';
  const full = Math.floor(rating);
  const hasHalf = rating % 1 >= 0.3;
  for (let i = 0; i < full; i++) {
    html += '<svg class="star" viewBox="0 0 24 24"><polygon class="star-filled" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }
  if (hasHalf) {
    html += '<svg class="star" viewBox="0 0 24 24"><defs><linearGradient id="hg"><stop offset="50%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#ddd"/></linearGradient></defs><polygon fill="url(#hg)" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }
  const empty = 5 - full - (hasHalf ? 1 : 0);
  for (let i = 0; i < empty; i++) {
    html += '<svg class="star" viewBox="0 0 24 24"><polygon class="star-empty" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }
  return html;
}

function createCardHTML(data, delay) {
  const isSaved = savedState.has(data.id);
  const amenitiesHTML = data.amenities.map(a =>
    `<span class="amenity">${amenityIcons[a.icon] || ''}${a.label}</span>`
  ).join('');

  return `
    <article class="card card-reflow" data-id="${data.id}" data-price="${data.price}" data-rating="${data.rating}" data-reviews="${data.reviews}" style="animation-delay:${delay}ms">
      <div class="card-image">
        <div class="card-gradient ${data.gradient}">
          <span class="shape shape-1"></span>
          <span class="shape shape-2"></span>
          <span class="shape shape-3"></span>
        </div>
        <div class="price-badge">
          <span class="currency">$</span>${data.price}<span class="night">/night</span>
        </div>
        <button class="heart-btn ${isSaved ? 'saved' : ''}" onclick="toggleHeart(this, ${data.id})" aria-label="Save">
          <svg viewBox="0 0 24 24"><path class="heart-outline" d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          <svg viewBox="0 0 24 24" style="position:absolute"><path class="heart-filled" d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        </button>
      </div>
      <div class="card-body">
        <div class="card-location">${data.location}</div>
        <h3 class="card-title">${data.title}</h3>
        <div class="card-rating">
          <div class="stars">${renderStars(data.rating)}</div>
          <span class="rating-text">${data.rating}</span>
          <span class="review-count">(${data.reviews})</span>
        </div>
        <div class="card-amenities">${amenitiesHTML}</div>
      </div>
    </article>`;
}

function renderCards(data) {
  const grid = document.getElementById('resultsGrid');
  grid.innerHTML = data.map((d, i) => createCardHTML(d, i * 60)).join('');
}

function toggleHeart(btn, id) {
  btn.classList.add('pop');
  setTimeout(() => btn.classList.remove('pop'), 500);

  if (savedState.has(id)) {
    savedState.delete(id);
    btn.classList.remove('saved');
  } else {
    savedState.add(id);
    btn.classList.add('saved');
    createBurst(btn);
  }
}

function createBurst(btn) {
  const container = btn.parentElement;
  const burst = document.createElement('div');
  burst.className = 'heart-burst';
  burst.style.cssText = 'top:50%;left:50%;transform:translate(-50%,-50%)';
  for (let i = 0; i < 8; i++) {
    const span = document.createElement('span');
    const angle = (i / 8) * Math.PI * 2;
    const dist = 18 + Math.random() * 12;
    span.style.cssText = `--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;animation-delay:${i*30}ms`;
    burst.appendChild(span);
  }
  container.appendChild(burst);
  setTimeout(() => burst.remove(), 600);
}

function toggleSort() {
  const btn = document.getElementById('sortBtn');
  const dd = document.getElementById('sortDropdown');
  btn.classList.toggle('open');
  dd.classList.toggle('open');
}

function sortCards(type) {
  currentSort = type;
  const labels = {
    'recommended':'Recommended',
    'price-low':'Price: Low to High',
    'price-high':'Price: High to Low',
    'rating':'Highest Rated',
    'reviews':'Most Reviewed'
  };
  document.getElementById('sortBtn').innerHTML = `Sort by: ${labels[type]} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;

  document.querySelectorAll('.sort-option').forEach(o => {
    o.classList.toggle('active', o.dataset.sort === type);
  });

  toggleSort();

  const sorted = [...cardsData];
  switch(type) {
    case 'price-low': sorted.sort((a,b) => a.price - b.price); break;
    case 'price-high': sorted.sort((a,b) => b.price - a.price); break;
    case 'rating': sorted.sort((a,b) => b.rating - a.rating); break;
    case 'reviews': sorted.sort((a,b) => b.reviews - a.reviews); break;
  }

  const grid = document.getElementById('resultsGrid');
  const cards = [...grid.children];
  const idOrder = sorted.map(s => s.id);

  // Animate reflow
  cards.forEach(card => {
    const id = parseInt(card.dataset.id);
    const newIndex = idOrder.indexOf(id);
    const currentOrder = [...grid.children].indexOf(card);
    card.style.transition = 'all 350ms cubic-bezier(.4,0,.2,1)';
    card.style.zIndex = 10;
  });

  setTimeout(() => {
    renderCards(sorted);
    const newCards = [...grid.querySelectorAll('.card')];
    newCards.forEach((card, i) => {
      card.style.animationDelay = `${i * 50}ms`;
    });
  }, 50);
}

// Close dropdown on outside click
document.addEventListener('click', (e) => {
  const wrapper = document.querySelector('.sort-wrapper');
  if (!wrapper.contains(e.target)) {
    document.getElementById('sortBtn').classList.remove('open');
    document.getElementById('sortDropdown').classList.remove('open');
  }
});

// Chip remove functionality
document.querySelectorAll('.chip-remove').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const chip = btn.closest('.chip');
    chip.style.transition = 'all 200ms ease';
    chip.style.opacity = '0';
    chip.style.transform = 'scale(0.8)';
    chip.style.maxWidth = '0';
    chip.style.padding = '0 0';
    chip.style.margin = '0';
    chip.style.overflow = 'hidden';
    setTimeout(() => chip.remove(), 200);
  });
});

function addChip() {
  const chipsContainer = document.querySelector('.chips');
  const addBtn = document.querySelector('.chip-add');
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.style.opacity = '0';
  chip.style.transform = 'scale(0.8)';
  chip.innerHTML = `
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Filter..." />
    <span class="chip-remove" title="Remove">×</span>
  `;
  chipsContainer.insertBefore(chip, addBtn);
  requestAnimationFrame(() => {
    chip.style.transition = 'all 250ms cubic-bezier(.34,1.56,.64,1)';
    chip.style.opacity = '1';
    chip.style.transform = 'scale(1)';
  });
  chip.querySelector('input').focus();
  chip.querySelector('.chip-remove').addEventListener('click', (e) => {
    e.stopPropagation();
    chip.style.transition = 'all 200ms ease';
    chip.style.opacity = '0';
    chip.style.transform = 'scale(0.8)';
    chip.style.maxWidth = '0';
    chip.style.padding = '0 0';
    chip.style.margin = '0';
    chip.style.overflow = 'hidden';
    setTimeout(() => chip.remove(), 200);
  });
}

// Initial render
renderCards(cardsData);
</script>
</body>
</html>
