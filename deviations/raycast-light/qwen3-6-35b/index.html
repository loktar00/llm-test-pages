<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Raycast Lighting</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        
        // Configuration
        const OBSTACLE_COUNT = 15;
        const LIGHT_CYCLE_SECONDS = 30; // Full hue cycle duration
        const LIGHT_SPEED = 0.5;

        // Colors
        let mainLightColor = { h: 40, s: 100, l: 50 }; // Gold/Orange
        let secondLightColor = { h: 200, s: 80, l: 60 }; // Cyan/Blue

        // State
        const obstacles = [];
        const vertices = []; // All unique points for raycasting

        // --- Geometry Helpers ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Polygon {
            constructor(x, y, radius, sides, rotation) {
                this.points = [];
                this.color = `hsl(${Math.random() * 360}, 10%, 15%)`; // Dark grey base
                
                for (let i = 0; i < sides; i++) {
                    const angle = (i / sides) * Math.PI * 2 + rotation;
                    this.points.push({
                        x: x + Math.cos(angle) * radius,
                        y: y + Math.sin(angle) * radius
                    });
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i].x, this.points[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Add a subtle outline to prevent z-fighting visual glitches
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // --- Initialization ---

        function init() {
            // Generate random polygons
            for (let i = 0; i < OBSTACLE_COUNT; i++) {
                const radius = 30 + Math.random() * 60;
                const sides = 3 + Math.floor(Math.random() * 4); // 3 to 6 sides
                const x = Math.random() * width;
                const y = Math.random() * height;
                const rotation = Math.random() * Math.PI;
                obstacles.push(new Polygon(x, y, radius, sides, rotation));
            }

            // Collect all vertices from polygons to create a "room" boundary or extra obstacles
            // For this demo, we will treat the edges of the canvas as the main room boundary
            // but we will add the polygon vertices to our raycasting list.
        }

        // --- Core Logic ---

        // Raycast against a line segment
        function getIntersection(rayStart, rayEnd, lineStart, lineEnd) {
            const x1 = rayStart.x;
            const y1 = rayStart.y;
            const x2 = rayEnd.x;
            const y2 = rayEnd.y;

            const x3 = lineStart.x;
            const y3 = lineStart.y;
            const x4 = lineEnd.x;
            const y4 = lineEnd.y;

            const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            
            if (denom === 0) return null;

            const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;

            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
                return {
                    x: x1 + ua * (x2 - x1),
                    y: y1 + ua * (y2 - y1),
                    u: ua
                };
            }
            return null;
        }

        function render() {
            time += 0.016;

            // 1. Update Light Positions and Colors
            const t = time * LIGHT_SPEED;
            
            // Light 1: Drifting warm light
            const l1x = width / 2 + Math.cos(t) * (Math.min(width, height) * 0.35);
            const l1y = height / 2 + Math.sin(t * 1.3) * (Math.min(width, height) * 0.35);
            
            // Hue shift over minutes (60s * minutes)
            const hueShift = (time / (LIGHT_CYCLE_SECONDS * 60)) * 360;
            const l1h = (40 + hueShift) % 360;
            mainLightColor = `hsl(${l1h}, 90%, 60%)`;

            // Light 2: Counter-orbit cool light
            const l2x = width / 2 + Math.cos(-t * 0.8) * (Math.min(width, height) * 0.25);
            const l2y = height / 2 + Math.sin(-t * 0.8 + 2) * (Math.min(width, height) * 0.25);
            secondLightColor = `hsl(${200 + Math.sin(t)*20}, 80%, 60%)`;

            // 2. Clear Screen (Deep Dark)
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // 3. Draw Obstacles (Base Layer)
            // They are drawn dark. We will draw them again in "lit" mode on top.
            obstacles.forEach(obs => obs.draw(ctx));

            // 4. Lighting Layer
            // We use a clipping mask of the obstacles to ensure shadows are sharp
            // and light doesn't bleed through walls.
            
            // Create a mask of all obstacles
            ctx.save();
            ctx.beginPath();
            obstacles.forEach(obs => {
                ctx.moveTo(obs.points[0].x, obs.points[0].y);
                for (let i = 1; i < obs.points.length; i++) {
                    ctx.lineTo(obs.points[i].x, obs.points[i].y);
                }
                ctx.closePath();
            });
            ctx.clip();

            // Draw Darkness over everything inside obstacles (to darken them further)
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // --- Light 1 ---
            ctx.save();
            ctx.shadowBlur = 200;
            ctx.shadowColor = mainLightColor;
            
            // Draw the "cone" of light for Light 1
            // We trace rays to all vertices and the corners of the screen
            const rays1 = getRays(l1x, l1y);
            
            ctx.beginPath();
            ctx.moveTo(l1x, l1y);
            // Sort rays by angle to draw a proper polygon fan
            rays1.sort((a, b) => a.angle - b.angle);
            
            rays1.forEach(ray => {
                ctx.lineTo(ray.x, ray.y);
            });
            ctx.closePath();
            
            ctx.fillStyle = mainLightColor;
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for glow
            ctx.fill();
            ctx.restore();

            // --- Light 2 ---
            ctx.save();
            ctx.shadowBlur = 150;
            ctx.shadowColor = secondLightColor;
            
            const rays2 = getRays(l2x, l2y);
            
            ctx.beginPath();
            ctx.moveTo(l2x, l2y);
            rays2.sort((a, b) => a.angle - b.angle);
            
            rays2.forEach(ray => {
                ctx.lineTo(ray.x, ray.y);
            });
            ctx.closePath();
            
            ctx.fillStyle = secondLightColor;
            ctx.globalAlpha = 0.4; // Dimmer
            ctx.globalCompositeOperation = 'screen'; // Screen blend for depth
            ctx.fill();
            ctx.restore();

            ctx.restore(); // End Clip

            // 5. Draw Edge Glow
            // Iterate obstacles again, draw their edges with the light color
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.lineWidth = 2;
            
            // For Light 1
            ctx.strokeStyle = mainLightColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = mainLightColor;
            ctx.globalAlpha = 0.6;
            obstacles.forEach(obs => obs.drawEdges(ctx));

            // For Light 2
            ctx.strokeStyle = secondLightColor;
            ctx.shadowColor = secondLightColor;
            ctx.globalAlpha = 0.3;
            obstacles.forEach(obs => obs.drawEdges(ctx));
            
            ctx.restore();

            // 6. Draw Point Light Sources (Visual Glows)
            drawLightOrb(l1x, l1y, mainLightColor, 8, 0);
            drawLightOrb(l2x, l2y, secondLightColor, 5, 0.5);

            requestAnimationFrame(render);
        }

        function drawLightOrb(x, y, color, radius, alpha) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha;
            ctx.shadowBlur = 20;
            ctx.shadowColor = color;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function getRays(x, y) {
            const rays = [];
            const cx = x;
            const cy = y;
            
            // Helper to add a ray
            const addRay = (px, py) => {
                // Calculate angle
                let angle = Math.atan2(py - cy, px - cx);
                // Normalize angle to 0 -> 2PI for sorting
                if (angle < 0) angle += Math.PI * 2;
                
                rays.push({ x: px, y: py, angle: angle });
            };

            // 1. Add Corners of the Canvas
            addRay(0, 0);
            addRay(width, 0);
            addRay(width, height);
            addRay(0, height);

            // 2. Add Vertices of all Obstacles
            obstacles.forEach(obs => {
                obs.points.forEach(p => addRay(p.x, p.y));
            });

            // 3. Raycast to find intersection points
            const castedRays = [];

            rays.forEach(r => {
                let closest = null;
                let minDist = Infinity;

                // Ray direction
                const dx = r.x - cx;
                const dy = r.y - cy;
                const length = Math.sqrt(dx*dx + dy*dy);
                const dirX = dx / length;
                const dirY = dy / length;
                
                const rayEnd = { x: cx + dirX * 2000, y: cy + dirY * 2000 }; // Long ray

                // Check against all obstacle edges
                obstacles.forEach(obs => {
                    for (let i = 0; i < obs.points.length; i++) {
                        const p1 = obs.points[i];
                        const p2 = obs.points[(i + 1) % obs.points.length];
                        
                        const hit = getIntersection(
                            {x: cx, y: cy}, 
                            rayEnd, 
                            p1, 
                            p2
                        );

                        if (hit) {
                            const dist = Math.sqrt((hit.x - cx)**2 + (hit.y - cy)**2);
                            if (dist < minDist) {
                                minDist = dist;
                                closest = hit;
                            }
                        }
                    }
                });

                if (closest) {
                    castedRays.push(closest);
                } else {
                    // If no obstacle hit, extend to edge of canvas or far distance
                    // Simple approximation: project to canvas bounds
                    // We already added canvas corners, so if no obstacle hit, 
                    // the ray likely goes to the canvas edge. 
                    // To be precise, we could calculate intersection with canvas rects,
                    // but since we added corners, the sorting logic will handle the fan shape roughly.
                    // However, to fill the gaps between corners, we need the exact canvas edge hit.
                    
                    // Let's just use the original target if it didn't hit anything, 
                    // but clamp it to canvas bounds if it's a corner ray.
                    // For simplicity in this visual demo, if no obstacle hit, 
                    // we assume it hits the far wall.
                    
                    // A robust way:
                    let bestCanvasPoint = null;
                    let bestDist = Infinity;
                    
                    // Check intersection with 4 walls
                    const walls = [
                        {x1:0, y1:0, x2:width, y2:0}, // Top
                        {x1:width, y1:0, x2:width, y2:height}, // Right
                        {x1:width, y1:height, x2:0, y2:height}, // Bottom
                        {x1:0, y1:height, x2:0, y2:0} // Left
                    ];
                    
                    walls.forEach(w => {
                        const hit = getIntersection({x:cx, y:cy}, rayEnd, w.x1, w.y1);
                        if(hit) {
                            const d = Math.sqrt((hit.x-cx)**2 + (hit.y-cy)**2);
                            if(d < bestDist) {
                                bestDist = d;
                                bestCanvasPoint = hit;
                            }
                        }
                    });
                    
                    if(bestCanvasPoint) castedRays.push(bestCanvasPoint);
                }
            });

            // Remove duplicates (points very close to each other)
            const uniqueRays = [];
            const threshold = 1.0;
            
            castedRays.sort((a, b) => a.angle - b.angle);
            
            for(let i=0; i<castedRays.length; i++) {
                const curr = castedRays[i];
                // Check against last added
                if (uniqueRays.length === 0) {
                    uniqueRays.push(curr);
                } else {
                    const last = uniqueRays[uniqueRays.length - 1];
                    const dist = Math.sqrt((curr.x - last.x)**2 + (curr.y - last.y)**2);
                    if (dist > threshold) {
                        uniqueRays.push(curr);
                    }
                }
            }
            
            return uniqueRays;
        }

        // Add drawEdges method to Polygon class
        Polygon.prototype.drawEdges = function(ctx) {
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            for (let i = 1; i < this.points.length; i++) {
                ctx.lineTo(this.points[i].x, this.points[i].y);
            }
            ctx.closePath();
            ctx.stroke();
        };

        // Start
        init();
        render();

    </script>
</body>
</html>
