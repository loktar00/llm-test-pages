<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marble Run</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#14181d}
canvas{display:block;width:100;height:100}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',false);
let W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
resize();
addEventListener('resize',resize);

const WORLDH=6000;
const SEG_W=1200;
const SEG_H=1500;

const GRAV=0.32;
const MAX_SPEED=18.4;

let camX=0,cmY=0,cmS=1;
let camXTarget=0,cmYT=0,cmST=1;

const marbles=[];
const segments=[];
const spinners=[];
const bumpers=[];

function segIndexForY(y){
  return Math.floor((y-SEED)/SEG_H);
}
const SEED=0;

function makeWall(x0,y0,x1,y1,type,mat){
  const dx=x1-x0,dy=y1-y0;
  const len=Math.hypot(dx,dy) || 1;
  const nx=dy/len,ny=-dx/len;
  const nxn=Math.abs(nx);
  const nyv=Math.abs(ny);
  const nxr=nyv>0.04?Math.sign(ny):0;
  const nyr=-nxr*nxn;
  const o=nyv;
  return {x0,y0,x1,y1,type,mat,dx,dy,len,nx,ny,o,nxr,nyr};
}

function generateSeg(idx){
  const yStart=idx*SEG_H;
  const walls=[];
  const spinnersLocal=[];
  const bumpersLocal=[];
  const wallTypes=['metal','rubber','glass','wood','metal','rubber'];
  const mat=['metal','rubber','glass','wood'];
  const x0=-SEG_W/2-50,x1=SEG_W/2+50,y0=yStart,y1=yStart+SEG_H;
  const layout={
    start:yStart+150,
    end:yStart+SEG_H-150,
    spacing:150,
    variation:120,
  };
  const count=Math.max(1,Math.floor((layout.end-layout.start)/layout.spacing));
  for(let i=0;i<count;i++){
    const y=layout.start+i*layout.spacing+(Math.random()*layout.variation|0);
    const dir=(i%2===0)?1:-1;
    const width=400+(Math.random()*400|0);
    const xc=(Math.random()*200-100)|0;
    const wallType=wallTypes[Math.floor(Math.random()*wallTypes.length)];
    const matT=mat[Math.floor(Math.random()*mat.length)];
    walls.push(makeWall(xc-dir*width/2,y,xc+dir*width/2,y,wallType,matT));
  }
  const spinCount=2+(Math.floor(Math.random()*3));
  for(let i=0;i<spinCount;i++){
    const y=yStart+(Math.random()*SEG_H|0);
    const x=(Math.random()*1200-600)|0;
    const r=80+(Math.random()*60);
    const verts=6+(Math.floor(Math.random()*4));
    const dir=(Math.random()>0.5)?1:-1;
    spinnersLocal.push({x,y,r,angle:Math.random()*6,spin:dir*(0.008+Math.random()*0.012),verts,phase:Math.random()*6});
  }
  const bumpCount=2+(Math.floor(Math.random()*3));
  for(let i=0;i<bumpCount;i++){
    const y=yStart+(Math.random()*SEG_H|0);
    const x=(Math.random()*1200-600)|0;
    bumpersLocal.push({x,y,r:30+(Math.random()*15),phase:Math.random()*6,mat:mat[Math.floor(Math.random()*mat.length)]});
  }
  return {walls,spinners:spinnersLocal,bumpers:bumpersLocal,yStart,yEnd:yStart+SEG_H};
}

function rebuildSegment(idx){
  const data=generateSeg(idx);
  segments[idx]=data;
  spinners[idx]=data.spinners;
  bumpers[idx]=data.bumpers;
}

const visible=new Set();
function ensureVisible(){
  if(marbles.length===0) return;
  let minV=Infinity,maxV=-Infinity;
  for(const m of marbles){
    if(m.y<minV) minV=m.y;
    if(m.y>maxV) maxV=m.y;
  }
  const minIdx=Math.floor((minV-SEED)/SEG_H);
  const maxIdx=Math.floor((maxV-SEED)/SEG_H);
  visible.clear();
  for(const i of [minIdx,minIdx-1,maxIdx,maxIdx+1){
    if(i<0) continue;
    visible.add(i);
    if(!segments[i]) rebuildSegment(i);
  }
}
function cleanupDistant(){
  if(marbles.length===0) return;
  let minV=Infinity,maxV=-Infinity;
  for(const m of marbles){
    if(m.y<minV) minV=m.y;
    if(m.y>maxV) maxV=m.y;
  }
  for(const i in segments){
    const idx=parseInt(i);
    const seg=segments[idx];
    if(seg==null) continue;
    const top=seg.yStart;
    const bottom=seg.yEnd;
    if(bottom<minV-2000 || top>maxV+2000){
      segments[idx]=null;
      spinners[idx]=null;
      bumpers[idx]=null;
    }
  }
}
function rebuildDistant(){
  if(marbles.length===0) return;
  let minV=Infinity,maxV=-Infinity;
  for(const m of marbles){
    if(m.y<minV) minV=m.y;
    if(m.y>maxV) maxV=m.y;
  }
  for(const i in segments){
    const idx=parseInt(i);
    const seg=segments[idx];
    if(seg==null) continue;
    if(seg.yEnd<minV-1500 || seg.yStart>maxV+1500){
      rebuildSegment(idx);
    }
  }
}

function spawnMarble(){
  const colors=['#ff6b6b','#ffd95e','#5be3a1','#4ec5e2','#c277dd','#ff8a4a','#5aa0f0','#f5e3b2','#e8e8e8','#ff4d8b'];
  marbles.push({
    x:(Math.random()*400-200),
    y:1200+Math.random()*150,
    vx:(Math.random()*2-1),
    vy:0,
    r:10+Math.random()*3,
    color:colors[Math.floor(Math.random()*colors.length)],
    trail:[],
    age:0,
    bounced:0,
  });
}

let lastSpawn=0;
function update(){
  if(performance.now()-lastSpawn>1400){
    if(marbles.length<15){
      spawnMarble();
    }
    lastSpawn=performance.now();
  }
  ensureVisible();
  cleanupDistant();
  rebuildDistant();
  for(const s of spinners){
    if(s==null) continue;
    for(const sp of s) sp.angle+=sp.spin;
  }
  for(const m of marbles){
    m.age++;
    m.vy+=GRAV;
    if(m.vy>MAX_SPEED) m.vy=MAX_SPEED;
    if(m.vy<-MAX_SPEED) m.vy=-MAX_SPEED;
    m.vx*=0.996;
    m.x+=m.vx;
    m.y+=m.vy;
    const r=m.r;
    for(const i of visible){
      const seg=segments[i];
      if(seg==null) continue;
      if(m.y<seg.yStart-r*2 || m.y>seg.yEnd+r*2) continue;
      for(const w of seg.walls){
        const dx=m.x-w.x0;
        const dy=m.y-w.y0;
        const t=(dx*w.dx+dy*w.dy)/(w.len*w.len);
        let cx,cy;
        if(t<0){cx=w.x0;cy=w.y0;}
        else if(t>1){cx=w.x1;cy=w.y1;}
        else {cx=w.x0+t*w.dx;cy=w.y0+t*w.dy;}
        const dxc=m.x-cx;
        const dyc=m.y-cy;
        const d2=dxc*dxc+dyc*dyc;
        if(d2<r*r){
          const d=Math.sqrt(d2) || 1;
          const nxn=dxc/d;
          const nyn=dyc/d;
          const overlap=r-d;
          m.x+=nxn*overlap;
          m.y+=nyn*overlap;
          const vn=m.vx*nxn+m.vy*nyn;
          if(vn<0){
            let restitution=0.4;
            const friction=0.3;
            if(w.mat==='rubber'){restitution=0.85;friction=0.5;}
            if(w.mat==='metal'){restitution=0.55;friction=0.25;}
            if(w.mat==='glass'){restitution=0.4;friction=0.4;}
            if(w.mat==='wood'){restitution=0.35;friction=0.2;}
            const tvx=m.vx-vn*nxn;
            const tvy=m.vy-vn*nyn;
            const fr=tvx*friction;
            const fy=tvy*friction;
            const dot=fr*nxn+fy*nyn;
            const frn=dot*nxn;
            const frn2=dot*nyn;
            const nvx=tvx-frn;
            const nvy=tvy-frn2;
            m.vx=nvx-vn*nxn*(restitution);
            m.vy=nvy-vn*nyn*(restitution);
          }
        }
      }
      const spinnersArr=spinners[i];
      if(spinnersArr!=null){
        for(const sp of spinnersArr){
          const spx=sp.x;
          const spy=sp.y;
          const spr=sp.r;
          const spa=sp.angle;
          const d2x=m.x-spx;
          const d2y=m.y-spy;
          const d2=d2x*d2x+d2y*d2y;
          if(d2<(spr+r)*(spr+r) && d2>0){
            const d=Math.sqrt(d2) || 1;
            const nxn=d2x/d;
            const nyn=d2y/d;
            const overlap=(spr+r)-d;
            m.x+=nxn*overlap;
            m.y+=nyn*overlap;
            const tangX=-nyn;
            const tangY=nxn;
            const tangVel=m.vx*tangX+m.vy*tangY;
            const spTangVel=sp.spin*pr;
            const relVel=tangVel-spTangVel;
            const friction=0.95;
            const newRelVel=relVel*friction;
            const deltaRel=newRelVel-relVel;
            m.vx+=deltaRel*tangX;
            m.vy+=deltaRel*tangY;
            const vn=m.vx*nxn+m.vy*nyn;
            if(vn<0){
              const restitution=0.5;
              m.vx-=vn*nxn*(1+restitution);
              m.vy-=vn*nyn*(1+restitution);
            }
          }
        }
      }
      const bumpersArr=bumpers[i];
      if(bumpersArr!=null){
        for(const bu of bumpersArr){
          const bux=bu.x;
          const buy=bu.y;
          const bur=bu.r;
          const d2x=m.x-bux;
          const d2y=m.y-buy;
          const d2=d2x*d2x+d2y*d2y;
          if(d2<(bur+r)*(bur+r) && d2>0){
            const d=Math.sqrt(d2) || 1;
            const nxn=d2x/d;
            const nyn=d2y/d;
            const overlap=(bur+r)-d;
            m.x+=nxn*overlap;
            m.y+=nyn*overlap;
            const vn=m.vx*nxn+m.vy*nyn;
            if(vn<0){
              const restitution=0.8;
              const boost=4;
              m.vx-=vn*nxn*(1+restitution);
              m.vy-=vn*nyn*(1+restitution);
              m.vx+=nxn*boost*0.5;
              m.vy+=nyn*boost*0.5;
              m.bounced++;
            }
          }
        }
      }
    if(m.y<200){
      m.y=WorldH+200;
      m.x=(Math.random()*400-200);
      m.vx=(Math.random()*2-1);
      m.vy=0;
    }
    if(m.y>WorldH+100){
      m.y=1200;
      m.x=(Math.random()*400-200);
      m.vx=0;
      m.vy=0;
    }
    if(m.x<(-SEG_W/2+10)){
      m.x=-SEG_W/2+10;
      m.vx=Math.abs(m.vx)*0.5;
    }
    if(m.x>(SEG_W/2-10)){
      m.x=SEG_W/2-10;
      m.vx=-Math.abs(m.vx)*0.5;
    }
    m.trail.push({x:m.x,y:m.y});
    if(m.trail.length>8) m.trail.shift();
  }
  if(m.age>1800 && m.bounced>50){
    m.age=0;
    m.bounced=0;
    m.x=(Math.random()*400-200);
    m.y=1200;
    m.vx=0;
    m.vy=0;
    m.trail.length=0;
  }
}

function computeCameraTarget(){
  let cx=0,cy=0,n=0;
  for(const m of marbles){
    cx+=m.x;
    cy+=m.y;
    n++;
  }
  if(n>0){
    cx/=n;
    cy/=n;
  }
  let variance=0;
  if(n>1){
    for(const m of marbles){
      const dx=m.x-cx;
      const dy=m.y-cy;
      variance+=dx*dx+dy*dy;
    }
    variance/=n;
  }
  const idealZoom=Math.min(1.0,Math.max(0.7,5/(Math.sqrt(variance)+5)));
  camXTarget=cx;
  cmYT=cy;
  cmST=idealZoom;
  camX+=(camXTarget-camX)*0.025;
  cmY+=(cmYT-cmY)*0.025;
  cmS+=(cmST-cmS)*0.025;
}

function render(){
  const vW=W/cmS;
  const vH=H/cmS;
  const lB=camX-vW/2;
  const rB=camX+vW/2;
  const tB=cmY-vH/2;
  const bB=cmY+vH/2;
  ctx.save();
  ctx.fillStyle='#14181d';
  ctx.fillRect(0,0,W,H);
  ctx.translate(W/2,H/2);
  ctx.scale(cmS,cmS);
  ctx.translate(-camX,-cmY);
  for(const i of visible){
    const seg=segments[i];
    if(seg==null) continue;
    const top=seg.yStart;
    const bottom=seg.yEnd;
    const left=-SEG_W/2;
    const right=SEG_W/2;
    if(bottom<tB-50 || top>bottom+50) continue;
    const grd=ctx.createLinearGradient(left,top,right,bottom);
    grd.addColorStop(0,'rgba(40,40,50,0.15)');
    grd.addColorStop(1,'rgba(20,20,30,0.15)');
    ctx.fillStyle=grd;
    ctx.fillRect(left,top,SEG_W,SEG_H);
    for(const w of seg.walls){
      const wx0=w.x0;
      const wy0=w.y0;
      const wx1=w.x1;
      const wy1=w.y1;
      if(Math.max(wx0,wx1)<lB-50) continue;
      if(Math.min(wx0,wx1)>rB+50) continue;
      if(Math.max(wy0,wy1)<tB-50) continue;
      if(Math.min(wy0,wy1)>bottom+50) continue;
      const matColors={
        metal:'#7d7d8f',
        rubbers:'#3a3a3a',
        glass:'#5a8aa0',
        wood:'#8a5a3a',
      };
      const c=matColors[w.mat];
      const thickness=6;
      const dx=(wx1-wx0);
      const dy=(wy1-wy0);
      const len=Math.hsqrt(dx*dx+dy*dy);
      const nx=dy/len;
      const ny=-dx/len;
      const thicknessHalf=thickness/2;
      ctx.fillStyle=c;
      ctx.beginPath();
      ctx.moveTo(wx0-ny*thicknessHalf,wy0+nx*thicknessHalf);
      ctx.lineTo(wx1-ny*thicknessHalf,wy1+nx*thicknessHalf);
      ctx.lineTo(wx1+ny*thicknessHalf,wy1-nx*thicknessHalf);
      ctx.lineTo(wx0+ny*thicknessHalf,wy0-nx*thicknessHalf);
      ctx.fill();
      ctx.strokeStyle='#5a5a5a';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(wx0,wy0);
      ctx.lineTo(wx1,wy1);
      ctx.stroke();
    }
  }
  for(const i of visible){
    const seg=segments[i];
    if(seg==null) continue;
    const top=seg.yStart;
    const bottom=seg.yEnd;
    const spinnersArr=spinners[i];
    const bumpersArr=bumpers[i];
    if(spinnersArr!=null){
      for(const sp of spinnersArr){
        if(sp.y<top-100 || sp.y>bottom+100) continue;
        if(sp.y<tB-200 || sp.y>bottom+200) continue;
        ctx.save();
        ctx.translate(sp.x,sp.y);
        ctx.rotate(sp.angle);
        const r=sp.r;
        ctx.fillStyle='#2a2a2a';
        ctx.beginPath();
        ctx.arc(0,0,r,0,Math.PI*2);
        ctx.fill();
        const verts=sp.verts;
        for(const j of Array.from({length:verts})){
          const angle=j*Math.PI*2/verts;
          ctx.save();
          ctx.rotate(angle);
          ctx.fillStyle='#7d7d8f';
          ctx.beginPath();
          ctx.moveTo(0,0);
          ctx.lineTo(r,0);
          ctx.lineTo(r-5,-10);
          ctx.lineTo(r-5,10);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle='#9a9a9a';
        ctx.beginPath();
        ctx.arc(0,0,5,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }
    if(bumpersArr!=null){
      for(const bu of bumpersArr){
        const buy=bu.y;
        const bux=bu.x;
        const bur=bu.r;
        if(buy<top-50 || buy>bottom+50) continue;
        if(buy<tB-50 || buy>bottom+50) continue;
        const colors={
          metal:'#7d7d8f',
          rubber:'#3a3a3a',
          glass:'#5a8aa0',
          wood:'#8a5a3a',
        };
        const c=colors[bu.mat];
        ctx.fillStyle=c;
        ctx.beginPath();
        ctx.arc(bux,buy,bur,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#3a3a3a';
        ctx.beginPath();
        ctx.arc(bux,buy,bur*0.5,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#9a9a9a';
        ctx.beginPath();
        ctx.arc(bux,buy,bur*0.2,0,Math.PI*2);
        ctx.fill();
      }
    }
  }
  for(const m of marbles){
    if(m.trail.length<1) continue;
    const trail=m.trail;
    const len=trail.length;
    const r=m.r;
    const color=m.color;
    for(const i of Array.from({length:len})){
      const p=trail[i];
      const alpha=i/len*0.4;
      const sz=r*(i/len);
      ctx.fillStyle=color.replace(')',` ${alpha})`).replace('#','rgba(').slice(0,-5)+'rgba(';
      ctx.beginPath();
      ctx.arc(p.x,p.y,sz,0,Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(m.x,m.y,r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.globalAlpha=0.4;
    ctx.beginPath();
    ctx.arc(m.x-r*0.3,m.y-r*0.3,r*0.4,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

let frameCount=0;
function loop(){
  frameCount++;
  if(frameCount%30===0){
    const visibleKeys=Array.from(visible);
    for(const idx of visibleKeys){
      const i=parseInt(idx);
      const seg=segments[i];
      if(seg==null) continue;
      let minV=Infinity,maxV=-Infinity;
      for(const m of marbles){
        if(m.y<minV) minV=m.y;
        if(m.y>maxV) maxV=m.y;
      }
      if(seg.yEnd<minV-1500 || seg.yStart>maxV+1500){
        rebuildSegment(i);
      }
    }
  }
  update();
  computeCameraTarget();
  render();
  requestAnimationFrame(loop);
}

for(const i of Array.from({length:5})) spawnMarble();
loop();
</script>
</body>
</html>
