<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    height: 100%;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const N = 24;
const cycleDuration = 60; // seconds
const g = 9.81;
const centerX = canvas.width / 2;
const baseSpacing = Math.min(canvas.width / (N + 1), 60);
const pendulumSpacing = baseSpacing;

// We'll use a frequency-based tuning that creates a 60-second cycle.
// Each pendulum oscillates at a slightly different frequency.
// To get a cycle every 60 seconds, we use harmonic spacing around a base.
const baseFreq = 1.0; // Hz
const freqSpread = 0.05; // Spread of frequencies per pendulum index

let pendulums = [];
for (let i = 0; i < N; i++) {
  const freq = baseFreq + (i - (N - 1) / 2) * freqSpread;
  const period = 1 / freq;
  pendulums.push({
    freq: freq,
    phase: (i / N) * Math.PI * 2, // initial variation
    x: centerX + (i - (N - 1) / 2) * pendulumSpacing,
    trail: []
  });
}

const trailLength = 100;
const seismoHistory = 400;
let time = 0;
let lastResetFlash = 0;
const resetCycleTime = cycleDuration;

function animate() {
  const dt = 1 / 60; // fixed time step for consistency
  time += dt;

  ctx.fillStyle = 'rgba(17,17,17,0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const centerY = canvas.height * 0.3;
  const amplitude = 120;

  // Draw seismograph baseline
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, canvas.height * 0.7);
  ctx.lineTo(canvas.width, canvas.height * 0.7);
  ctx.stroke();

  pendulums.forEach((p, i) => {
    const angle = Math.sin(time * 2 * Math.PI * p.freq + p.phase) * 0.5;
    const x = p.x + Math.sin(angle) * amplitude * 0.3;
    const y = centerY + Math.cos(angle) * amplitude;

    // Update trail
    p.trail.push({x, y, t: time});
    if (p.trail.length > trailLength) p.trail.shift();

    // Draw trail
    for (let j = 1; j < p.trail.length; j++) {
      const alpha = j / p.trail.length * 0.5;
      ctx.strokeStyle = `rgba(100,200,255,${alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.trail[j-1].x, p.trail[j-1].y);
      ctx.lineTo(p.trail[j].x, p.trail[j].y);
      ctx.stroke();
    }

    // Draw bob
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();

    // Seismograph trace
    const seismoX = (i / (N - 1)) * canvas.width;
    const seismoY = canvas.height * 0.7 - x * 0.5 + canvas.height * 0.1;
    
    p.seismoHistory = p.seismoHistory || [];
    p.seismoHistory.push({x: seismoX, y: seismoY, t: time});
    if (p.seismoHistory.length > seismoHistory) p.seismoHistory.shift();
    
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let j = 1; j < p.seismoHistory.length; j++) {
      ctx.lineTo(p.seismoHistory[j].x, p.seismoHistory[j].y);
    }
    ctx.stroke();
  });

  // Flash marker at reset
  const sinceReset = time % resetCycleTime;
  if (sinceReset < 0.1 || sinceReset > resetCycleTime - 0.1) {
    ctx.fillStyle = 'rgba(255,255,0,0.3)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
