<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Unseen Poet</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1a1a;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/**
 * Configuration & Word Lists
 */
const WORD_LISTS = {
    nouns: ['wind', 'rain', 'stone', 'moss', 'sky', 'river', 'leaf', 'shadow', 'moon', 'night', 'bird', 'dream', 'fog', 'fire', 'snow', 'path', 'tree', 'root', 'cloud', 'star'],
    verbs: ['falls', 'rises', 'sings', 'whispers', 'breaks', 'flows', 'shines', 'drifts', 'sleeps', 'wakes', 'grows', 'fades', 'burns', 'freezes', 'moves'],
    adjectives: ['silent', 'old', 'blue', 'soft', 'cold', 'red', 'deep', 'quiet', 'gray', 'wild', 'pale', 'dark', 'warm', 'heavy', 'light'],
    conjunctions: ['the', 'and', 'of', 'in', 'a', 'on', 'at', 'to', 'for', 'with', 'by', 'from', 'it', 'is', 'as', 'so', 'but', 'an', 'or']
};

/**
 * Setup Canvas
 */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/**
 * Utility Functions
 */
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/**
 * Classes
 */

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.life = 1.0;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.02;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life * 0.3;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class TypewriterCarriage {
    constructor() {
        this.reset();
        this.carriageY = 0; // Current scroll position relative to page
        this.maxScroll = 1200; // How much paper goes up before tearing
    }

    reset() {
        this.carriageY = 0;
    }

    update(scrollAmount) {
        // Scroll up (carriage goes down visually relative to top of screen, 
        // but physically the paper moves up, so we track the paper's offset)
        this.carriageY -= scrollAmount;
        
        // Check for tear
        if (this.carriageY < -this.maxScroll) {
            this.triggerTear();
            return true; // Paper torn
        }
        return false;
    }

    triggerTear() {
        // Create dust/dust motes
        for(let i=0; i<20; i++) {
            particles.push(new Particle(width/2, height/2 - 100));
        }
        this.reset();
        // Play sound effect logic here if we had audio
    }

    draw(ctx, x, y, width, height) {
        // Metal housing behind paper
        ctx.fillStyle = '#111';
        // Top Bar (Paper guide)
        ctx.fillRect(x - 20, y - 60, width + 40, 60);
        
        // Platen (Roller)
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(x + width/2, y - 30, width/2 + 40, 40, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Platen highlight
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

class Paper {
    constructor() {
        this.reset();
    }

    reset() {
        this.text = [];
        this.lineHeight = 30;
        this.fontSize = 24;
        this.typeFont = "Courier New", "Courier", monospace;
        this.y = 0; // Vertical position on the canvas
        this.width = 500;
        this.height = 600;
        this.carriageX = 0; // Current typing position on the line
        this.linesCompleted = 0;
    }

    draw(ctx, screenX, screenY) {
        // Paper Color with Noise
        const baseColor = '#fdf6e3'; // Solarized light base
        
        // Paper Noise Layer
        ctx.save();
        // We can't easily draw noise per-pixel without performance hit, so we use a gradient
        // to simulate the texture and lighting
        const grad = ctx.createLinearGradient(screenX, screenY, screenX + this.width, screenY + this.height);
        grad.addColorStop(0, '#f4ecd8');
        grad.addColorStop(0.5, '#fdf6e3');
        grad.addColorStop(1, '#e8dcc7');
        
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 10;
        ctx.fillRect(screenX, screenY, this.width, this.height);
        ctx.shadowBlur = 0;
        
        // Texture grain (simple dots)
        ctx.fillStyle = 'rgba(0,0,0,0.03)';
        for(let i=0; i<300; i++) {
            const rx = screenX + Math.random() * this.width;
            const ry = screenY + Math.random() * this.height;
            ctx.fillRect(rx, ry, 2, 2);
        }
        ctx.restore();

        // Draw Text Lines
        ctx.font = `${this.fontSize}px ${this.typeFont}`;
        ctx.textBaseline = 'top';
        
        // Determine visible text range to optimize drawing
        const startLine = Math.floor(screenY / this.lineHeight);
        const endLine = Math.ceil((screenY + this.height) / this.lineHeight);

        this.text.forEach((line, index) => {
            if (index >= startLine && index <= endLine) {
                this.drawTextLine(ctx, screenX, screenY + (index * this.lineHeight), line);
            }
        });

        // Draw Line Numbers (subtle)
        ctx.fillStyle = '#ccc';
        ctx.font = '10px sans-serif';
        for(let i=0; i<this.text.length; i++) {
             if (i >= startLine && i <= endLine) {
                 ctx.fillText(i + 1, screenX - 30, screenY + (i * this.lineHeight));
             }
        }
    }

    drawTextLine(ctx, x, y, lineData) {
        const { text, cursorX, highlight } = lineData;
        
        ctx.save();
        // Lighting effect on text: darker at top, lighter at bottom (typewriter shadow)
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 1;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;
        
        ctx.fillStyle = highlight ? '#550000' : '#222'; // Red ink for highlight, black for text
        
        // Draw the ink
        ctx.fillText(text, x, y);
        
        // Draw Cursor (if active)
        // cursorX is passed in or calculated? Let's pass it in from main loop or store it.
        // We stored cursorX in the object.
        if (highlight) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + cursorX + 2, y + 5, 2, this.fontSize);
        }
        
        ctx.restore();
    }
}

class Poet {
    constructor() {
        this.state = 'TYPING'; // TYPING, PAUSING, ERASING, SCROLLING
        this.timer = 0;
        this.currentLine = "";
        this.currentWord = "";
        this.lineLength = 0;
        this.targetX = 0;
        this.wordTypeQueue = []; // Array of words to type for current line
        this.lineIndex = 0; // Which line on paper we are on
        this.lastWordListType = 'noun';
    }

    initNewLine(paper) {
        this.state = 'TYPING';
        this.currentLine = "";
        this.currentWord = "";
        this.lineLength = 0;
        this.lineIndex = paper.text.length;
        
        // Generate 3-4 words
        const wordCount = randInt(3, 5);
        this.wordTypeQueue = [];
        
        for(let i=0; i<wordCount; i++) {
            const type = pick(Object.keys(WORD_LISTS));
            const word = pick(WORD_LISTS[type]);
            this.wordTypeQueue.push(word);
        }
    }

    update(paper, bell) {
        // Logic to manage typing progress
        if (this.state === 'TYPING') {
            if (this.wordTypeQueue.length > 0) {
                this.currentWord = this.wordTypeQueue.shift();
                this.typeWord(paper, bell);
            } else {
                // Line finished
                this.state = 'PAUSING';
                this.timer = 60 + randInt(0, 40);
                paper.text.push({ text: this.currentLine, cursorX: 0, highlight: false });
                // Trigger bell if lines > 5 (odd numbers)
                if (paper.text.length % 2 === 1 && paper.text.length > 1) {
                    bell.ring();
                }
            }
        } else if (this.state === 'PAUSING') {
            this.timer--;
            if (this.timer <= 0) {
                // Check for erasure chance
                if (Math.random() < 0.3 && this.currentLine.length > 15) {
                    this.state = 'ERASING';
                    this.timer = 30; // Time to backspace
                    this.targetBackspaceIndex = Math.floor(rand(5, this.currentLine.length));
                    this.currentBackspaceIndex = this.currentLine.length;
                } else {
                    // New Line
                    this.initNewLine(paper);
                }
            }
        } else if (this.state === 'ERASING') {
            this.timer--;
            const speed = 2; // backspace speed
            this.currentBackspaceIndex -= speed;
            
            // Visual backspace logic: We need to rebuild the string without the last N chars
            // and remove the last few "characters" from the array stored in paper.text
            // This is tricky with our array structure, let's simplify:
            // We modify the last element directly.
            
            const lastObj = paper.text[paper.text.length - 1];
            const charsToRemove = speed;
            lastObj.text = lastObj.text.slice(0, -charsToRemove);
            lastObj.cursorX = this.fontMeasure(lastObj.text, paper);
            
            if (this.currentBackspaceIndex <= this.targetBackspaceIndex || this.timer <= 0) {
                // Finished erasing, retype
                this.state = 'TYPING';
                // Add a new word to queue to replace the erased one
                this.wordTypeQueue.unshift(pick(WORD_LISTS.nouns)); 
                // We assume we erased one conceptual "word" unit, though we erased chars.
            }
        }
    }

    typeWord(paper, bell) {
        // We need to type character by character
        const chars = this.currentWord.split('');
        if (!paper._charQueue) paper._charQueue = chars;
        
        // Type a few chars per frame for speed
        const charsPerFrame = 1; 
        for(let i=0; i<charsPerFrame; i++) {
            if (paper._charQueue.length > 0) {
                const char = paper._charQueue.shift();
                
                // Bell sound check
                if (this.currentLine.length % 10 === 0 && this.currentLine.length > 0) {
                    bell.ring();
                }

                // If starting a line, add new text object
                if (paper.text.length === 0 || paper.text[paper.text.length-1].text === "") {
                     if(paper.text.length > 0 && paper.text[paper.text.length-1].text === "") {
                         // continue existing empty line? No, we pushed a new one in initNewLine usually?
                         // Actually initNewLine doesn't push to paper yet.
                     }
                }
                
                // Ensure we have an active line to type on
                if (paper.text.length <= this.lineIndex) {
                    paper.text.push({ text: "", cursorX: 0, highlight: false });
                }

                const lineObj = paper.text[this.lineIndex];
                lineObj.text += char;
                lineObj.cursorX = this.fontMeasure(lineObj.text, paper);
                
                // Scroll the paper slightly? 
                // No, the paper stays still, the carriage moves.
                // But usually typewriters scroll up the paper.
                // In this simulation, we will keep the paper fixed on screen and "scroll" the content up via the CarriageY logic?
                // Actually, the simplest visual is: Paper stays, Carriage Y increases.
                // But the prompt says "sheet of paper scrolls".
                // Let's implement scrolling.
            }
        }
    }

    fontMeasure(text, paper) {
        // Approximate width
        return text.length * (paper.fontSize * 0.6);
    }
}

class Bell {
    constructor() {
        this.flash = 0;
    }
    ring() {
        this.flash = 20;
    }
    draw(ctx, x, y) {
        if (this.flash > 0) {
            ctx.save();
            ctx.fillStyle = `rgba(255, 200, 50, ${this.flash / 20})`;
            ctx.beginPath();
            ctx.arc(x, y, 10 + (20 - this.flash), 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            this.flash--;
        }
    }
}

/**
 * Main Simulation Objects
 */
const paper = new Paper();
const carriage = new TypewriterCarriage();
const poet = new Poet();
const bell = new Bell();
let particles = [];

// Initial Text
poet.initNewLine(paper);

/**
 * Main Loop
 */
function loop() {
    // 1. Update Logic
    poet.update(paper, bell);
    
    // Scroll Logic: The paper moves up based on lines typed
    // We only scroll if we just finished a line or during "erasure"
    // Actually, let's scroll continuously or in steps.
    // Let's keep the active line near the middle of the screen vertically.
    // Calculate desired Y
    const activeLineY = (paper.text.length - 1) * paper.lineHeight;
    const screenCenter = height / 2 + 100; // Target position for active line
    const targetY = -(activeLineY) + screenCenter;
    
    // Smooth scroll
    // We track paper.y which is the offset of the paper texture relative to the carriage
    // But the prompt implies the carriage moves. Let's fake the visual by moving the paper Y.
    // However, the Carriage class manages the 'scroll' (tear).
    // Let's reconcile: 
    // The `carriage.update(scrollAmount)` expects a positive amount to scroll paper UP (carriage down).
    // Our `paper.y` is the visual offset.
    
    // To make it look like a typewriter, we keep the active line roughly in view.
    // But we also need to accumulate total scroll for the tear effect.
    
    // Let's adjust paper.y directly for visual positioning, and track `totalScroll` for tearing.
    if (paper.y > targetY) {
        paper.y -= 2; // Scroll up speed
    }
    
    // Check if we hit the bottom of the paper visually and need to tear?
    // The paper height is 600.
    // If paper.y (offset) is too negative, we tear.
    // Let's say we tear after scrolling 2000px total.
    // We can approximate this by line count.
    if (paper.text.length > 40) { // 40 lines * 30px = 1200px
        // Trigger tear logic
        for(let i=0; i<10; i++) particles.push(new Particle(width/2, height/2));
        paper.text = []; // Clear paper
        poet.initNewLine(paper);
        paper.y = 0; // Reset visual offset
    }

    // 2. Draw
    ctx.clearRect(0, 0, width, height);

    // Draw Background (Desk)
    const bgGrad = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, width);
    bgGrad.addColorStop(0, '#3e342a'); // Lamp center
    bgGrad.addColorStop(1, '#0a0a0a'); // Corners
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    // Ambient Dust
    particles.forEach((p, i) => {
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
    });
    // Add ambient dust
    if (Math.random() < 0.1) {
        particles.push(new Particle(rand(0, width), rand(0, height)));
    }

    // Draw Typewriter Parts
    const paperScreenX = width/2 - paper.width/2;
    const paperScreenY = paper.y + 100; // 100px offset from top of viewport
    
    // Draw Paper
    paper.draw(ctx, paperScreenX, paperScreenY, paper.width, paper.height);
    
    // Draw Carriage/Housing on top of paper (the platen area)
    // The platen sits "behind" the text but "above" the paper base visually
    // Actually, standard typewriter: Paper goes between platen and guide.
    // So we draw paper, then draw the platen mechanism over the top edge of the paper.
    carriage.draw(ctx, paperScreenX, paperScreenY, paper.width, paper.height);

    // Draw Cursor on the screen (The pointer)
    // It sits where the carriage is.
    const lastLine = paper.text[paper.text.length - 1];
    if (lastLine) {
        const cx = paperScreenX + lastLine.cursorX;
        const cy = paperScreenY + (paper.text.length - 1) * paper.lineHeight;
        
        // Draw the pointer
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.beginPath();
        ctx.moveTo(cx + 10, cy);
        ctx.lineTo(cx - 5, cy - 5);
        ctx.lineTo(cx - 5, cy + 5);
        ctx.fill();
    }

    // Draw Bell Indicator
    bell.draw(ctx, width/2 + 250, paperScreenY - 20);

    // Draw Lamp Glow Overlay
    ctx.fillStyle = 'rgba(255, 220, 150, 0.05)';
    ctx.fillRect(0, 0, width, height);

    requestAnimationFrame(loop);
}

// Start
loop();

</script>
</body>
</html>
