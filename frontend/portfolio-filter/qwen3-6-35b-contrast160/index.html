<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
<title>Portfolio Grid</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0b0b0f;
  color: #f0f0f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 24px 80px;
  -webkit-font-smoothing: antialiased;
}

h1 {
  font-size: 2.2rem;
  font-weight: 300;
  letter-spacing: 0.06em;
  margin-bottom: 48px;
  color: #fff;
}

.controls {
  position: relative;
  display: flex;
  align-items: center;
  margin-bottom: 48px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 40px;
  padding: 5px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.pill {
  position: relative;
  z-index: 2;
  background: none;
  border: none;
  color: #888;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 10px 22px;
  cursor: pointer;
  border-radius: 32px;
  letter-spacing: 0.02em;
  transition: color 0.3s ease;
  outline: none;
  font-family: inherit;
}

.pill:hover {
  color: #ccc;
}

.pill.active {
  color: #fff;
}

.indicator {
  position: absolute;
  z-index: 1;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 32px;
  top: 5px;
  height: calc(100% - 10px);
  pointer-events: none;
  transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1), width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  width: 100%;
  max-width: 1000px;
  perspective: 1000px;
}

.tile-wrap {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

.tile {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  aspect-ratio: 4/3;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.tile.removing {
  transform: scale(0.85);
  opacity: 0;
  pointer-events: none;
}

.tile.entering {
  transform: scale(0.85);
  opacity: 0;
}

.tile.appearing {
  transform: scale(1);
  opacity: 1;
}

.tile-bg {
  position: absolute;
  inset: 0;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.tile:hover .tile-bg {
  transform: scale(1.08);
}

.tile-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 28px;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

.tile:hover .tile-overlay {
  opacity: 1;
}

.tile-info {
  transform: translateY(12px);
  transition: transform 0.4s ease 0.08s, opacity 0.4s ease 0.08s;
  opacity: 0;
}

.tile:hover .tile-info {
  transform: translateY(0);
  opacity: 1;
}

.tile-title {
  font-size: 1.15rem;
  font-weight: 600;
  margin-bottom: 4px;
  color: #fff;
}

.tile-cat {
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}

@media (max-width: 800px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<h1>Portfolio</h1>

<div class="controls" id="controls">
  <button class="pill active" data-filter="all">All</button>
  <button class="pill" data-filter="web">Web</button>
  <button class="pill" data-filter="brand">Brand</button>
  <button class="pill" data-filter="motion">Motion</button>
  <div class="indicator" id="indicator"></div>
</div>

<div class="grid" id="grid"></div>

<script>
const projects = [
  { title: "E-Commerce Platform", category: "web", gradient: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)" },
  { title: "Brand Identity", category: "brand", gradient: "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)" },
  { title: "Motion Design Lab", category: "motion", gradient: "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)" },
  { title: "Digital Marketplace", category: "web", gradient: "linear-gradient(135deg, #43e3b0 0%, #38f9d7 100%)" },
  { title: "Brand Typography", category: "brand", gradient: "linear-gradient(135deg, #fa709a 0%, #fee140 100%)" },
  { title: "Fluid Animations", category: "motion", gradient: "linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)" },
  { title: "Web Framework", category: "web", gradient: "linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)" },
  { title: "Brand Logo Suite", category: "brand", gradient: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)" },
  { title: "Motion Graphics", category: "motion", gradient: "linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)" }
];

const grid = document.getElementById('grid');
const controls = document.getElementById('controls');
const indicator = document.getElementById('indicator');
const pills = document.querySelectorAll('.pill');

let activeFilter = 'all';
let tileEls = [];

function createTiles() {
  grid.innerHTML = '';
  tileEls = [];

  projects.forEach((p, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'tile-wrap';
    wrap.dataset.index = i;

    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.category = p.category;

    const bg = document.createElement('div');
    bg.className = 'tile-bg';
    bg.style.background = p.gradient;

    const overlay = document.createElement('div');
    overlay.className = 'tile-overlay';

    const info = document.createElement('div');
    info.className = 'tile-info';

    const title = document.createElement('div');
    title.className = 'tile-title';
    title.textContent = p.title;

    const cat = document.createElement('div');
    cat.className = 'tile-cat';
    cat.textContent = p.category;

    info.appendChild(title);
    info.appendChild(cat);
    overlay.appendChild(info);
    tile.appendChild(bg);
    tile.appendChild(overlay);
    wrap.appendChild(tile);
    grid.appendChild(wrap);
    tileEls.push({ wrap, tile, data: p });
  });
}

function positionWrappers() {
  const gridRect = grid.getBoundingClientRect();
  const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  const gap = parseFloat(getComputedStyle(grid).gap) || 20;

  tileEls.forEach((t, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const colWidth = (gridRect.width - (cols - 1) * gap) / cols;

    t.wrap.style.width = colWidth + 'px';
    t.wrap.style.left = (col * (colWidth + gap)) + 'px';
    t.wrap.style.top = (row * (colWidth * 0.75 + gap)) + 'px';
    t.wrap.style.height = (colWidth * 0.75) + 'px';
  });
}

function updateIndicator(pill) {
  const pillRect = pill.getBoundingClientRect();
  const contRect = controls.getBoundingClientRect();
  indicator.style.width = pillRect.width + 'px';
  indicator.style.left = (pillRect.left - contRect.left) + 'px';
}

function filterProjects(filter) {
  if (filter === activeFilter) return;
  activeFilter = filter;

  const visible = filter === 'all' ? tileEls : tileEls.filter(t => t.data.category === filter);
  const removing = filter === 'all' ? tileEls.filter(t => t.data.category !== filter) : tileEls.filter(t => t.data.category === filter);

  removing.forEach((t, i) => {
    t.tile.classList.add('removing');
    t.wrap.style.pointerEvents = 'none';
  });

  setTimeout(() => {
    visible.forEach((t, i) => {
      t.tile.classList.remove('removing');
      t.wrap.style.pointerEvents = 'auto';
    });
  }, removing.length > 0 ? 400 : 0);
}

pills.forEach(pill => {
  pill.addEventListener('click', () => {
    pills.forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    updateIndicator(pill);
    filterProjects(pill.dataset.filter);
  });
});

window.addEventListener('resize', () => {
  positionWrappers();
  const active = document.querySelector('.pill.active');
  if (active) updateIndicator(active);
});

createTiles();
positionWrappers();

requestAnimationFrame(() => {
  const active = document.querySelector('.pill.active');
  if (active) updateIndicator(active);
});
</script>
</body>
</html>
