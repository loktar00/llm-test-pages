<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slime Mold</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, mapW, mapH;
const MAP_SCALE = 4;
const NUM_AGENTS = 35000;
const SENSOR_DIST = 16;
const SENSOR_ANGLE = Math.PI / 6;
const TURN_SPEED = 0.35;
const MOVE_SPEED = 1.8;
const DEPOSIT_AMOUNT = 8;
const FOOD_DEPOSIT = 60;
const DIFFUSE_RATE = 0.92;
const DECAY_RATE = 0.985;

let trail, trailNext;
let agentsX, agentsY, agentsAngle;
let foods;
let imageData, pixels;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  mapW = Math.ceil(W / MAP_SCALE);
  mapH = Math.ceil(H / MAP_SCALE);
  const size = mapW * mapH;
  trail = new Float32Array(size);
  trailNext = new Float32Array(size);
  imageData = ctx.createImageData(W, H);
  pixels = imageData.data;
  initAgents();
  initFoods();
}

function initAgents() {
  agentsX = new Float32Array(NUM_AGENTS);
  agentsY = new Float32Array(NUM_AGENTS);
  agentsAngle = new Float32Array(NUM_AGENTS);
  for (let i = 0; i < NUM_AGENTS; i++) {
    agentsX[i] = Math.random() * W;
    agentsY[i] = Math.random() * H;
    agentsAngle[i] = Math.random() * Math.PI * 2;
  }
}

function initFoods() {
  const count = 5 + Math.floor(Math.random() * 3);
  foods = [];
  for (let i = 0; i < count; i++) {
    foods.push({
      x: W * 0.15 + Math.random() * W * 0.7,
      y: H * 0.15 + Math.random() * H * 0.7,
      ox: W * 0.15 + Math.random() * W * 0.7,
      oy: H * 0.15 + Math.random() * H * 0.7,
      rx: 60 + Math.random() * 140,
      ry: 60 + Math.random() * 140,
      speed: 0.003 + Math.random() * 0.006,
      phase: Math.random() * Math.PI * 2,
      time: Math.random() * 1000
    });
  }
}

function getTrail(x, y) {
  const mx = Math.floor(x / MAP_SCALE);
  const my = Math.floor(y / MAP_SCALE);
  if (mx < 0 || mx >= mapW || my < 0 || my >= mapH) return 0;
  return trail[my * mapW + mx];
}

function deposit(mx, my, amount) {
  if (mx < 0 || mx >= mapW || my < 0 || my >= mapH) return;
  trail[my * mapW + mx] += amount;
}

function sense(x, y, angle) {
  const left = getTrail(
    x + Math.cos(angle - SENSOR_ANGLE) * SENSOR_DIST,
    y + Math.sin(angle - SENSOR_ANGLE) * SENSOR_DIST
  );
  const center = getTrail(
    x + Math.cos(angle) * SENSOR_DIST,
    y + Math.sin(angle) * SENSOR_DIST
  );
  const right = getTrail(
    x + Math.cos(angle + SENSOR_ANGLE) * SENSOR_DIST,
    y + Math.sin(angle + SENSOR_ANGLE) * SENSOR_DIST
  );
  return { left, center, right };
}

function updateAgents() {
  for (let i = 0; i < NUM_AGENTS; i++) {
    const x = agentsX[i];
    const y = agentsY[i];
    const angle = agentsAngle[i];

    const s = sense(x, y, angle);

    let turn = (Math.random() - 0.5) * 0.2;

    if (s.center > s.left && s.center > s.right) {
      // straight
    } else if (s.center < s.left && s.center < s.right) {
      turn += (Math.random() - 0.5) * TURN_SPEED * 2;
    } else if (s.left > s.right) {
      turn -= TURN_SPEED;
    } else if (s.right > s.left) {
      turn += TURN_SPEED;
    }

    agentsAngle[i] += turn;

    agentsX[i] += Math.cos(agentsAngle[i]) * MOVE_SPEED;
    agentsY[i] += Math.sin(agentsAngle[i]) * MOVE_SPEED;

    // Wrap around
    if (agentsX[i] < 0) agentsX[i] += W;
    if (agentsX[i] >= W) agentsX[i] -= W;
    if (agentsY[i] < 0) agentsY[i] += H;
    if (agentsY[i] >= H) agentsY[i] -= H;

    // Deposit
    const mx = Math.floor(agentsX[i] / MAP_SCALE);
    const my = Math.floor(agentsY[i] / MAP_SCALE);
    deposit(mx, my, DEPOSIT_AMOUNT);
  }
}

function updateFoods(time) {
  for (let i = 0; i < foods.length; i++) {
    const f = foods[i];
    f.time += f.speed;
    f.x = f.ox + Math.cos(f.time + f.phase) * f.rx;
    f.y = f.oy + Math.sin(f.time + f.phase * 1.3) * f.ry;

    const mx = Math.floor(f.x / MAP_SCALE);
    const my = Math.floor(f.y / MAP_SCALE);
    const radius = 4;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const dist = dx * dx + dy * dy;
        if (dist <= radius * radius) {
          deposit(mx + dx, my + dy, FOOD_DEPOSIT * (1 - dist / (radius * radius)));
        }
      }
    }
  }
}

function diffuse() {
  for (let y = 1; y < mapH - 1; y++) {
    for (let x = 1; x < mapW - 1; x++) {
      const idx = y * mapW + x;
      const val = trail[idx];
      const avg = (
        trail[idx - 1] + trail[idx + 1] +
        trail[idx - mapW] + trail[idx + mapW]
      ) * 0.25;
      trailNext[idx] = val * (1 - DIFFUSE_RATE) + avg * DIFFUSE_RATE;
    }
  }

  // Decay
  for (let i = 0; i < trailNext.length; i++) {
    trailNext[i] *= DECAY_RATE;
  }

  // Swap
  const tmp = trail;
  trail = trailNext;
  trailNext = tmp;
}

function render() {
  // Render trail map scaled up
  for (let y = 0; y < mapH; y++) {
    for (let x = 0; x < mapW; x++) {
      const val = trail[y * mapW + x];
      const intensity = Math.min(1, val / 40);

      // Two-tone palette: dark green to bright yellow-white
      const r = Math.floor(intensity * intensity * 255 * 0.3 + intensity * 255 * 0.7);
      const g = Math.floor(intensity * intensity * 255 * 0.6 + intensity * 255 * 0.4);
      const b = Math.floor(intensity * intensity * 255 * 0.15);

      // Fill MAP_SCALE x MAP_SCALE block
      for (let dy = 0; dy < MAP_SCALE; dy++) {
        for (let dx = 0; dx < MAP_SCALE; dx++) {
          const px = x * MAP_SCALE + dx;
          const py = y * MAP_SCALE + dy;
          if (px < W && py < H) {
            const pi = (py * W + px) * 4;
            pixels[pi] = r;
            pixels[pi + 1] = g;
            pixels[pi + 2] = b;
            pixels[pi + 3] = 255;
          }
        }
      }
    }
  }

  // Draw food sources as bright spots
  for (let i = 0; i < foods.length; i++) {
    const f = foods[i];
    const fx = Math.floor(f.x);
    const fy = Math.floor(f.y);
    const r2 = 5;
    for (let dy = -r2; dy <= r2; dy++) {
      for (let dx = -r2; dx <= r2; dx++) {
        const px = fx + dx;
        const py = fy + dy;
        if (px >= 0 && px < W && py >= 0 && py < H) {
          const dist = dx * dx + dy * dy;
          if (dist <= r2 * r2) {
            const pi = (py * W + px) * 4;
            const bright = 1 - dist / (r2 * r2);
            pixels[pi] = Math.min(255, pixels[pi] + 200 * bright);
            pixels[pi + 1] = Math.min(255, pixels[pi + 1] + 255 * bright);
            pixels[pi + 2] = Math.min(255, pixels[pi + 2] + 100 * bright);
          }
        }
      }
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

let lastTime = 0;
function loop(time) {
  requestAnimationFrame(loop);

  updateAgents();
  updateFoods(time);
  diffuse();
  render();
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
