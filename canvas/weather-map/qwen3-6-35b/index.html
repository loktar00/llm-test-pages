<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Weather System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #051020; /* Deep ocean blue */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="weatherCanvas"></canvas>
    <script>
        /**
         * CONFIGURATION
         */
        const CONFIG = {
            particleCount: 2000,
            particleSize: 1.5,
            particleDrag: 0.96,
            mapWidth: 2048,
            mapHeight: 1024,
            pressureSystemCount: 6,
            frontSpeed: 0.5,
            landNoiseScale: 0.0015
        };

        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let landMask; // Offscreen canvas for land
        let particles = [];
        let pressureSystems = [];
        let fronts = [];

        // Perlin-like Noise implementation (Simplex-ish)
        const noise = (() => {
            const p = new Uint8Array(512);
            const perm = new Uint8Array(512);
            for (let i = 0; i < 256; i++) p[i] = Math.floor(Math.random() * 256);
            for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

            function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            function lerp(t, a, b) { return a + t * (b - a); }
            function grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            return {
                perlin2D: (x, y) => {
                    // Simplified 2D noise for performance
                    let X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
                    x -= Math.floor(x); y -= Math.floor(y);
                    let u = fade(x), v = fade(y);
                    let A = perm[X] + Y, AA = perm[A], AB = perm[A + 1];
                    let B = perm[X + 1] + Y, BA = perm[B], BB = perm[B + 1];
                    return lerp(v, lerp(u, grad(perm[AA], x, y, 0), grad(perm[BA], x - 1, y, 0)),
                                   lerp(u, grad(perm[AB], x, y - 1, 0), grad(perm[BB], x - 1, y - 1, 0)));
                },
                // Fractal Brownian Motion
                fbm: (x, y, octaves = 4) => {
                    let val = 0, amp = 0.5, freq = 1;
                    for (let i = 0; i < octaves; i++) {
                        val += amp * noise.perlin2D(x * freq, y * freq);
                        amp *= 0.5;
                        freq *= 2.0;
                    }
                    return val;
                }
            };
        })();

        /**
         * SYSTEMS
         */
        class PressureSystem {
            constructor(type) {
                this.type = type; // 'high' or 'low'
                this.x = Math.random() * CONFIG.mapWidth;
                this.y = Math.random() * CONFIG.mapHeight;
                this.radius = 150 + Math.random() * 200;
                this.strength = 0.2 + Math.random() * 0.3;
                this.angle = Math.random() * Math.PI * 2;
                this.drift = {
                    x: (Math.random() - 0.5) * 0.5,
                    y: (Math.random() - 0.5) * 0.2
                };
            }

            update() {
                this.x += this.drift.x;
                this.y += this.drift.y;

                // Wrap around screen
                if (this.x < -this.radius) this.x = CONFIG.mapWidth + this.radius;
                if (this.x > CONFIG.mapWidth + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = CONFIG.mapHeight + this.radius;
                if (this.y > CONFIG.mapHeight + this.radius) this.y = -this.radius;

                // Slow rotation for visual flair
                this.angle += 0.002;
            }

            // Returns vector field [vx, vy] at point (px, py)
            getField(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                const distSq = dx * dx + dy * dy;
                const maxDist = this.radius * this.radius;

                if (distSq > maxDist) return [0, 0];

                const dist = Math.sqrt(distSq);
                const falloff = 1 - (dist / this.radius);
                
                // Cyclonic flow
                // High (H): Clockwise (Northern Hemisphere visual)
                // Low (L): Counter-Clockwise
                // Tangent vector is (-dy, dx)
                
                let spin = (this.type === 'low') ? -1 : 1; 
                // Add some inward/outward flow
                let radial = (this.type === 'low') ? -0.2 : 0.2;

                const vx = (-dy * spin + dx * radial) * this.strength * falloff;
                const vy = (dx * spin + dy * radial) * this.strength * falloff;

                return [vx * falloff, vy * falloff];
            }
        }

        class Front {
            constructor() {
                this.reset(true);
            }

            reset(randomX = false) {
                this.y = Math.random() * CONFIG.mapHeight;
                this.x = randomX ? Math.random() * CONFIG.mapWidth : -200;
                this.type = Math.random() > 0.5 ? 'cold' : 'warm';
                this.speed = CONFIG.frontSpeed * (0.5 + Math.random() * 0.5);
                this.wavelength = 40 + Math.random() * 20;
                this.amplitude = 10 + Math.random() * 10;
                this.phase = Math.random() * Math.PI;
                this.segments = [];
                // Pre-calculate points for smoother rendering
                this.pointCount = 20;
                for(let i=0; i<this.pointCount; i++) {
                    this.segments.push({ x: this.x + (i * 40), y: this.y + Math.sin(this.phase + i) * this.amplitude });
                }
            }

            update() {
                // Move points right
                for (let s of this.segments) {
                    s.x += this.speed;
                    // Add sine wave motion
                    s.y = this.y + Math.sin((s.x * 0.01) + Date.now() * 0.001) * this.amplitude;
                }
                
                // If last point is off screen, reset
                if (this.segments[this.segments.length-1].x > CONFIG.mapWidth + 100) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.beginPath();
                if (this.segments.length === 0) return;
                ctx.moveTo(this.segments[0].x, this.segments[0].y);
                for (let i = 1; i < this.segments.length; i++) {
                    ctx.lineTo(this.segments[i].x, this.segments[i].y);
                }

                ctx.strokeStyle = this.type === 'cold' ? '#0000aa' : '#cc0000'; // Blue for cold, Red for warm
                ctx.lineWidth = 2;
                ctx.setLineDash([]);
                ctx.stroke();

                // Draw Symbols
                const step = 15; // Draw every 15th frame roughly or specific distance
                // Simplified: Draw symbols based on position in segment array
                for (let i = 0; i < this.segments.length; i+=2) {
                    const p1 = this.segments[i];
                    const p2 = this.segments[i+1] || p1;
                    
                    // Determine direction
                    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                    
                    if (this.type === 'cold') {
                        // Triangles
                        ctx.save();
                        ctx.translate(p1.x, p1.y);
                        ctx.rotate(angle);
                        ctx.fillStyle = ctx.strokeStyle;
                        ctx.beginPath();
                        ctx.moveTo(6, 0);
                        ctx.lineTo(-4, 4);
                        ctx.lineTo(-4, -4);
                        ctx.fill();
                        ctx.restore();
                    } else {
                        // Semi-circles
                        ctx.save();
                        ctx.translate(p1.x, p1.y);
                        ctx.rotate(angle);
                        ctx.fillStyle = ctx.strokeStyle;
                        ctx.beginPath();
                        ctx.arc(0, 0, 4, -Math.PI/2, Math.PI/2, false);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }
        }

        class RainBand {
            constructor() {
                this.reset(true);
            }

            reset(randomX = false) {
                this.x = randomX ? Math.random() * CONFIG.mapWidth : -200;
                this.y = Math.random() * CONFIG.mapHeight;
                this.width = 100 + Math.random() * 150;
                this.height = 30 + Math.random() * 40;
                this.speed = 2 + Math.random() * 2;
                this.angle = -0.2 + Math.random() * 0.4; // Slight angle
                this.opacity = 0.1 + Math.random() * 0.15;
                this.texture = new Float32Array(this.width * this.height);
                
                // Generate texture
                for (let i = 0; i < this.texture.length; i++) {
                    this.texture[i] = Math.random() > 0.5 ? 1 : 0;
                }
            }

            update() {
                this.x += this.speed;
                if (this.x > CONFIG.mapWidth + 200) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Create gradient for soft edges
                const grad = ctx.createLinearGradient(-this.width/2, 0, this.width/2, 0);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(0.2, `rgba(0,0,0,${this.opacity})`);
                grad.addColorStop(0.8, `rgba(0,0,0,${this.opacity})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = grad;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                
                // Noise overlay
                ctx.fillStyle = `rgba(200,200,200, ${this.opacity * 0.5})`;
                // Don't draw pixels individually, just a rough overlay
                ctx.fillRect(-this.width/2, -this.height/2, this.width * 0.8, this.height * 0.8);

                ctx.restore();
            }
        }

        /**
         * INITIALIZATION
         */
        function init() {
            resize();
            window.addEventListener('resize', resize);

            // Create Land Mask
            createLand();

            // Init Particles
            for (let i = 0; i < CONFIG.particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: 0,
                    vy: 0,
                    life: Math.random()
                });
            }

            // Init Systems
            for (let i = 0; i < CONFIG.pressureSystemCount; i++) {
                pressureSystems.push(new PressureSystem(Math.random() > 0.5 ? 'high' : 'low'));
            }

            // Init Fronts
            fronts.push(new Front());
            fronts.push(new Front());

            // Init Rain
            for(let i=0; i<3; i++) rain.push(new RainBand());

            animate();
        }

        function createLand() {
            landMask = document.createElement('canvas');
            landMask.width = CONFIG.mapWidth;
            landMask.height = CONFIG.mapHeight;
            const lctx = landMask.getContext('2d');

            // Draw Land based on noise
            // We draw large blobs.
            // Ocean
            lctx.fillStyle = '#000'; // 0 = Ocean
            lctx.fillRect(0, 0, CONFIG.mapWidth, CONFIG.mapHeight);

            // Land logic
            const imageData = lctx.getImageData(0, 0, CONFIG.mapWidth, CONFIG.mapHeight);
            const data = imageData.data;
            
            // Define continent centers for interesting shapes
            const continents = [
                {x: 0.3, y: 0.3, r: 0.15},
                {x: 0.7, y: 0.4, r: 0.1},
                {x: 0.5, y: 0.7, r: 0.2},
                {x: 0.8, y: 0.8, r: 0.1}
            ];

            for (let y = 0; y < CONFIG.mapHeight; y++) {
                for (let x = 0; x < CONFIG.mapWidth; x++) {
                    const idx = (y * CONFIG.mapWidth + x) * 4;
                    const nx = x / CONFIG.mapWidth;
                    const ny = y / CONFIG.mapHeight;

                    // Simple noise
                    let n = noise.fbm(nx * 5, ny * 5, 4);
                    
                    // Add continent bias
                    let landBias = 0;
                    for(let c of continents) {
                        const dx = nx - c.x;
                        const dy = ny - c.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        landBias += Math.max(0, 1 - dist / c.r) * 0.8;
                    }

                    // Threshold for land
                    const isLand = (n * 0.5 + landBias) > 0.15;
                    
                    // Set alpha: 0 = Ocean, 255 = Land
                    data[idx + 3] = isLand ? 255 : 0;
                }
            }
            lctx.putImageData(imageData, 0, 0);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function drawMap() {
            // 1. Draw Base Ocean
            ctx.fillStyle = '#051020';
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Temperature Gradient
            // Simple cool-to-warm gradient
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, '#001a33'); // Cold pole
            grad.addColorStop(0.5, '#00334d'); // Temperate
            grad.addColorStop(1, '#33001a'); // Hot pole (inverted for visual contrast)
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 3. Draw Land (Scaled and Stretched to fit screen)
            // We use the pre-rendered land mask
            ctx.save();
            // Draw land mask centered and scaled
            const scaleX = width / CONFIG.mapWidth;
            const scaleY = height / CONFIG.mapHeight;
            ctx.scale(scaleX, scaleY);
            
            // Create land color
            // We want land to be warm (desert) or cool (mountains).
            // Let's just draw the mask.
            ctx.drawImage(landMask, 0, 0);
            
            // Colorize land pixels
            // This is expensive if done per frame, so we do a static pass? 
            // Or just use a mask composite.
            ctx.globalCompositeOperation = 'source-over';
            
            // Actually, let's just draw the mask directly as white, then composite a color
            // Redraw mask in white
            // No, better: Draw mask, then multiply by color.
            
            // Let's just draw the land mask as white on black, then color it.
            // Since we generated it as white/transparent.
            ctx.filter = 'sepia(1) saturate(2) brightness(1.2) hue-rotate(10deg)'; // Stylize land
            ctx.drawImage(landMask, 0, 0);
            ctx.filter = 'none';
            
            ctx.restore();
        }

        function getFieldAt(x, y) {
            // Interpolate wind from pressure systems
            // Transform screen coordinates back to map coordinates
            const scaleX = width / CONFIG.mapWidth;
            const scaleY = height / CONFIG.mapHeight;
            const mx = x / scaleX;
            const my = y / scaleY;

            let vx = 0, vy = 0;

            for (let sys of pressureSystems) {
                const [svx, svy] = sys.getField(mx, my);
                vx += svx;
                vy += svy;
            }

            // Add a general global wind vector
            vx += 0.5; 

            return { x: vx, y: vy };
        }

        function updateParticles() {
            const scaleX = width / CONFIG.mapWidth;
            const scaleY = height / CONFIG.mapHeight;

            ctx.beginPath();
            for (let p of particles) {
                // Get wind at current screen pos
                const wind = getFieldAt(p.x, p.y);

                p.vx = p.vx * CONFIG.particleDrag + wind.x * 2;
                p.vy = p.vy * CONFIG.particleDrag + wind.y * 2;

                p.x += p.vx;
                p.y += p.vy;

                // Check bounds
                if (p.x < 0 || p.x > width || p.y < 0 || p.y > height) {
                    p.x = Math.random() * width;
                    p.y = Math.random() * height;
                    p.vx = 0; p.vy = 0;
                }

                // Check Land Collision
                // Map back to mask
                const mx = p.x / scaleX;
                const my = p.y / scaleY;
                
                // Optimization: Don't check every pixel, just check center
                // Access landMask context directly is slow, check buffer if possible or use drawImage to temp canvas
                // For performance, let's just reset if near land borders? 
                // Better: check against the noise value we already have logic for.
                // Re-evaluating noise is cheaper than pixel access.
                
                const nx = mx / CONFIG.mapWidth;
                const ny = my / CONFIG.mapHeight;
                let n = noise.fbm(nx * 5, ny * 5, 4);
                let landBias = 0;
                const continents = [
                    {x: 0.3, y: 0.3, r: 0.15}, {x: 0.7, y: 0.4, r: 0.1}, {x: 0.5, y: 0.7, r: 0.2}, {x: 0.8, y: 0.8, r: 0.1}
                ];
                for(let c of continents) {
                    const dx = nx - c.x; const dy = ny - c.y;
                    landBias += Math.max(0, 1 - Math.sqrt(dx*dx + dy*dy) / c.r) * 0.8;
                }
                
                if ((n * 0.5 + landBias) > 0.15) {
                    // On land, push to ocean randomly or reset
                    if(Math.random() > 0.9) {
                         p.x = Math.random() * width;
                         p.y = Math.random() * height;
                    }
                }

                // Draw
                // Speed determines color intensity
                const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                const alpha = Math.min(0.8, speed / 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.rect(p
