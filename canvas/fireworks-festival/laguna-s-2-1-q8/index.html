function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);

const config = {
  gravity: 0.06,
  drag: 0.98,
  wind: 0.02,
  trailLength: 30,
  particleCount: 200,
  emberCount: 50
};

const colors = [
  "#FF6F61", "#FEB273", "#F4D35D", "#90BE6D",
  "#4361EE", "#BB89F3", "#FF6B9D", "#00BBF9"

let shells = [];

function launchShell(x, y) {
  const color = colors[Math.floor(Math.random() * colors.length)];
  const vx = (Math.random() - 0.5) * 2;
  shells.push({
    x, y, vx, vy: -8 - Math.random() * 2,
    trail: [], color, exploded: false,
    type: ["peony", "willow", "ring", "double"][Math.floor(Math.random() * 4)]
  });
}

function explode(shell) {
  const { x, y, color, type } = shell;
  switch (type) {
    case "peony":
      for (let i = 0; i < config.particleCount; i++) {
        const angle = (i / config.particleCount) * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 1,
          color,
          alpha: 1,
          gravity: config.gravity,
          drag: config.drag
        });
      }
      break;

    case "willow":
      for (let i = 0; i < config.particleCount / 2; i++) {
        const angle = (i / (config.particleCount / 2)) * Math.PI * 2;
        const speed = Math.random() * 3 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed + 2,
          size: Math.random() * 2 + 1,
          color,
          alpha: 1,
          gravity: config.gravity * 2,
          drag: config.drag
        });
      }
      break;

    case "ring":
      const ringSpeed = 5 + Math.random() * 2;
      for (let i = 0; i < config.particleCount; i++) {
        const angle = (i / config.particleCount) * Math.PI * 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * ringSpeed,
          vy: Math.sin(angle) * ringSpeed,
          size: 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          gravity: 0,
          drag: 1
        });
      }
      break;

    case "double":
      explode({ x, y: y + 50, color, type: "peony" });
      setTimeout(() => explode({ x, y: y - 50, color, type: "peony" }), 200);
      break;
  }

  for (let i = 0; i < config.emberCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    embers.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 2 + 0.5,
      alpha: 1,
      gravity: config.gravity * 0.5,
      drag: config.drag
    });
  }
}

function drawSkyline() {
  ctx.fillStyle = "#0a0a2a";
  ctx.strokeStyle = "#1a1a4a";
  ctx.lineWidth = 2;

  const scale = canvas.width / 2000;
  skyline.forEach(building => {
    const bx = building.x * scale;
    const bw = building.w * scale;
    const bh = building.h * scale;
    const by = canvas.height * 0.7 - bh;

    // Building
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeRect(bx, by, bw, bh);

    // Windows
    ctx.fillStyle = "#aaa";
    for (let i = 0; i < bw; i += 6) {
      for (let j = 0; j < bh; j += 10) {
        if (Math.random() > 0.7) {
          ctx.fillRect(bx + i, by + j, 3, 5);
        }
      }
    }
  });
}

let reflectionFrame = 0;
function drawRiver() {
  const riverY = canvas.height * 0.7;
  ctx.fillStyle = "rgba(0, 0, 20, 0.7)";
  ctx.fillRect(0, riverY, canvas.width, canvas.height - riverY);

  // Shimmer effect
  reflectionFrame += 0.05;
  ctx.globalCompositeOperation = "source-atop";
  for (let i = 0; i < canvas.width; i += 4) {
    const shimmerHeight = Math.sin(i * 0.02 + reflectionFrame) * 2 + 4;
    ctx.fillStyle = `rgba(100, 150, 255, ${0.3 + Math.sin(reflectionFrame + i * 0.01) * 0.1})`;
    ctx.fillRect(i, riverY + 10, 2, shimmerHeight);
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawReflection() {
  ctx.save();
  ctx.translate(0, canvas.height * 0.7);
  ctx.scale(1, -0.4);
  ctx.globalAlpha = 0.3;

  // Reflect sky (simulated with stars)
  ctx.fillStyle = "white";
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * (canvas.height * 0.3);
    ctx.globalAlpha = Math.random() * 0.3;
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.3;
  drawSkyline();

  ctx.restore();
}

let then = 0;
function animate(time = 0) {
  const dt = time - then;
  then = time;

  // Clear
  ctx.fillStyle = "rgba(0, 0, 10, 0.15)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Background stars
  ctx.fillStyle = "white";
  for (let i = 0; i < 200; i++) {
    const x = (i * 13.31 % canvas.width);
    const y = (i * 7.17 % (canvas.height * 0.6));
    ctx.globalAlpha = 0.4 + Math.sin(time * 0.002 + i) * 0.2;
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Draw river
  drawRiver();

  // Update and draw shells
  for (let i = shells.length - 1; i >= 0; i--) {
    const shell = shells[i];
    shell.trail.push({x: shell.x, y: shell.y});
    if (shell.trail.length > config.trailLength) shell.trail.shift();

    shell.x += shell.vx;
    shell.y += shell.vy;
    shell.vy += config.gravity;
    shell.vx += (Math.random() - 0.5) * config.wind;

    // Draw trail
    for (let j = 0; j < shell.trail.length - 1; j++) {
      const t = j / shell.trail.length;
      ctx.strokeStyle = shell.color;
      ctx.globalAlpha = t * 0.6;
      ctx.lineWidth = t * 3;
      ctx.beginPath();
      ctx.moveTo(shell.trail[j].x, shell.trail[j].y);
      ctx.lineTo(shell.trail[j + 1].x, shell.trail[j + 1].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Explode at peak
    if (shell.vy >= 0 && !shell.exploded) {
      shell.exploded = true;
      explode(shell);
      shells.splice(i, 1);
    }
  }

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.005;
    p.size *= 0.97;

    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI * 2);
    ctx.fill();

    if (p.alpha <= 0 || p.size <= 0) {
      particles.splice(i, 1);
    }
  }

  // Update and draw embers
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.vx *= e.drag;
    e.vy *= e.drag;
    e.vy += e.gravity;
    e.x += e.vx;
    e.y += e.vy;
    e.alpha -= 0.003;
    e.size *= 0.98;

    ctx.fillStyle = "#FF8C00";
    ctx.globalAlpha = e.alpha;
    ctx.beginPath();
    ctx.arc(e.x, e.y, Math.max(0, e.size), 0, Math.PI * 2);
    ctx.fill();

    if (e.alpha <= 0) {
      embers.splice(i, 1);
    }
  }
  ctx.globalAlpha = 1;

  // Draw skyline
  drawSkyline();

  // Launch new shells
  if (time - lastShellTime > 800 + Math.random() * 1200) {
    const x = 100 + Math.random() * (canvas.width - 200);
    launchShell(x, canvas.height * 0.7);
    lastShellTime = time;
  }

  // Finale barrage every ~30 seconds
  if (time - lastFinale > 30000) {
    lastFinale = time;
    for (let i = 0; i < 10; i++) {
      setTimeout(() => {
        const x = 50 + i * (canvas.width / 10);
        launchShell(x, canvas.height * 0.7);
      }, i * 300);
    }
  }

  requestAnimationFrame(animate);
}

// Start animation
requestAnimationFrame(animate);
