<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Plasma Reef</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050614;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============================================================
   Chromatic Plasma Reef — living aurora metaball screensaver
   ----------------------------------------------------
   Approach:
     1. Spawn N metaball field centres, each moving with layered
       Lévy-ish noise (superposition of sine fields) so motion is
       organic, never jittery.
     2. For each metaball, precompute a small radial gradient
       sprite (white-ish core, soft falloff). The sprite is
       cheap to draw and provides the "soft circular field" each
       metaball emits.
     3. Per frame, all sprites are drawn into an offscreen
       buffer using additive 'screen' blending. Bright cores
       stack up where metaballs overlap, giving the organic
       merging classic 2D metaball rendering produces.
     4. The buffer is then blurred via CSS filter:blur on the
       offscreen canvas, and thresholded with a pixel-level
       step function: pixels brighter than a threshold get the
       full vivid colour; dimmer areas get only faint haze.
       This threshold keeps the result from feeling like "just
       blurred circles" — only the dense merged regions keep
       their colour, while peripheral haze stays muted.
     5. The visible canvas composites: blurred haze layer +
       sharp thresholded metaballs + soft vignette, giving
       layered depth and bloom.
     6. Hue cycling and chromatic palette shift slowly so the
       scene evolves endlessly without repetition.
   ============================================================ */

const canvas = document.getElementById('c');
let ctx = canvas.getContext('2f');

const offscreen = document.createElement('canvas');
let offCtx = offscreen.getContext('2f', { alpha: true });

const blurCanvas = document.createElement('canvas');
let blurCtx = blurCanvas.getContext('2d');

let W = 0, H = 0;
let DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  offscreen.width = W;
  offscreen.height = H;

  blurCanvas.width = Math.floor(W * DPR);
  blurCanvas.height = Math.floor(H * DPR);
  blurCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// =================================================
// Metaball class
// =================================================
class Metaball {
  constructor(opts) {
    this.r = opts.r;
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.speed = opts.speed;
    this.phase = Math.random() * 1000;
    this.hot = 0;                 // brief pulse/burst timer

    const cR = opts.r;
    const hue = Math.random() * 360;
    const sat = 80 + Math.random() * 25;
    const lit = 60 + Math.random() * 25;

    // Sprite is a small radial gradient: hot white-ish core
    // surrounded by a coloured falloff. Drawn additively
    // onto the offscreen buffer so cores stack when metaballs
    // overlap, producing the classic metaball merging.
    const spr = document.createElement('canvas');
    const S = Math.max(8, Math.floor(cR * 2.0));
    spr.width = S;
    spr.height = S;
    const sctx = spr.getContext('2d');

    const cx = S * 0.5, cy = S * 0.5;
    const r1 = 0.4 * S;
    const r2 = 0.6 * S;
    const r3 = 1.0 * S;

    // Outer coloured halo
    let g = sctx.createRadialGradient(cx, cy, r1, cx, cy, r2);
    g.addColorStop(0, `hsl(${hue},${sat}%,${
        lit + 25}%`);
    g.addColorStop(1, `hsla(${hue},${sat}%,${
        lit}%,
        0)`);
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, S, S);

    // Middle halo
    g = sctx.createRadialGradient(cx, cy, 0.4 * S, cx, cy, 0.6 * S);
    g.addColorStop(0, `hsla(${((hue + 60) % 360)},${sat}%,$
        lit + 25}%,
        0.6`);
    g.addColorStop(1, `hsla(${((hue + 60) % 360)},${sat}%,$
        lit}%,
        0)`);
    sctx.fillStyle = g;
    sctx.globalCompositeOperation = 'lighter';
    sctx.fillRect(0, 0, S, S);

    // Hot white-ish core (drawn on top via screen)
    sctx.globalCompositeOperation = 'screen';
    g = sctx.createRadialGradient(cx, cy, 0, cx, cy, r3 * 0.4);
    g.addColorStop(0, 'rgba(255, 255, 255, 1)');
    g.addColorStop(0.6, 'rgba(255, 255, 255, 0.3)');
    g.addColorStop(1, 'rgba(255, 255, 255, 0)');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, S, S);

    sctx.globalCompositeOperation = 'source-over';
    this.sprite = spr;
  }

  // Smoothly-drifting motion via layered sine fields.
  update(t) {
    const f1 = 0.11 + this.phase * 0.001;
    const f2 = 0.05 + this.phase * 0.0005;
    const f3 = 0.18 + this.phase * 0.0001;

    const amp = this.speed * 0.9;
    const vx =
      Math.sin(t * f1 + this.phase) * amp +
      Math.cos(t * f2 + this.phase * 1.7) * amp * 0.6 +
      Math.sin(t * f3 + this.phase * 0.5) * amp * 0.3;
    const vy =
      Math.cos(t * f1 + this.phase * 1.3) * amp +
      Math.sin(t * f2 + this.phase * 0.5) * amp * 0.6 +
      Math.cos(t * f3 + this.phase * 2) * amp * 0.3;

    this.x += vx;
    this.y += vy;

    if (this.hot > 0) {
      const boost = 1.0 + this.hot * 9;
      this.x += vx * boost * 0.6;
      this.y += vy * boost * 0.6;
      this.hot *= 0.95;
      if (this.hot < 0.01) this.hot = 0;
    }

    // Wrap around edges so metaballs drift across the entire screen
    if (this.x < -this.r * 2.5) this.x = W + this.r * 2.5;
    if (this.x > W + this.r * 2.5) this.x = -this.r * 2.5;
    if (this.y < -this.r * 2.5) this.y = H + this.r * 2.5;
    if (this.y > H + this.r * 2.5) this.y = -this.r * 2.5;
  }

  draw(ctx) {
    const s = 1 + this.hot * 1.6;
    const r = this.r * s;
    ctx.drawImage(this.sprite, this.x - r, this.y - r, r * 2, r * 2);
  }
}

// =================================================
// Build metaball groups: background, midground, foreground
// (each moving at different speeds, providing layered depth.
// =================================================
let metaballs = [];

function buildMetaballs() {
  const groups = [
    // Background: large, slow, deep
    { r: 150, count: 4,  speed: 1.0 },
    { r: 130, count: 6,  speed: 0.8 },
    // Midground: medium
    { r: 60,  count: 16, speed: 1.4 },
    { r: 45,  count: 12, speed: 1.6 },
    // Foreground: small, fast, bright
    { r: 25,  count: 22, speed: 2.6 },
    { r: 35,  count: 8,  speed: 2.2 },
    { r: 80,  count: 4,  speed: 1.2 },
  ];
  metaballs = [];
  for (const g of groups) {
    for (let i = 0; i < g.count; i++) {
      metaballs.push(new Metaball({ r: g.r, speed: g.speed });
    }
  }
}
buildMetaballs();
window.addEventListener('resize', buildMetaballs);

// =================================================
// Atmospheric haze — very faint, drifting coloured glow
// =================================================
function drawHaze(ctx, t) {
  const blobs = [
    { x: W * 0.3, y: H * 0.4, r: W * 0.6, hue: 200, alpha: 0.04 },
    { x: W * 0.7, y: H * 0.5, r: W * 0.5, hue: 280, alpha: 0.04 },
    { x: W * 0.5, y: H * 0.8, r: W * 0.5, hue: 350, alpha: 0.04 },
    { x: W * 0.8, y: H * 0.15, r: W * 0.4, hue: 165, alpha: 0.03 },
    { x: W * 0.1, y: H * 0.7, r: W * 0.4, hue: 120, alpha: 0.03 },
  ];
  for (let b of blobs) {
    const dx = Math.sin(t * 0.01 + b.x * 0.001) * 30;
    const dy = Math.cos(t * 0.008 + b.y * 0.001) * 30;
    const g = ctx.createRadialGradient(
      b.x + dx, b.y + dy, 0, b.x + dx, b.y + dy, b.r
    );
    const h = (b.hue + t * 0.6) % 360;
    g.addColorStop(0, `hsla(${h}, 60%, 50%, ${b.alpha})`);
    g.addColorStop(1, `hsla(${h}, 60%, 50%, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(b.x + dx - b.r, b.y + dy - b.r, b.r * 2, b.r * 2);
  }
}

// =================================================
// Render loop
// =================================================
let lastBurst = 0;
let frameCount = 0;

function draw(now) {
  const t = now * 0.001;
  frameCount++;

  // Offscreen clear
  offCtx.globalCompositeOperation = 'source-over';
  offCtx.fillStyle = '#050614';
  offCtx.fillRect(0, 0, W, H);

  // Haze into offscreen
  drawHaze(offCtx, now);

  // Update metaballs and draw them (additively)
  for (const m of metaballs) {
    m.update(t);
    m.draw(offCtx);
  }

  // Occasionally add a burst/pulse: pick a few metaballs,
  // make them briefly larger and faster.
  if (now - lastBurst > 4000 + Math.random() * 800) {
    const burst = 3 + Math.floor(Math.random() * 5);
    const picked = [];
    for (let i = 0; i < burst; i++) {
      picked.push(mablls[Math.floor(Math.random() * metaballs.length)]);
    }
    for (let m of picked) m.hot = 1.0;
    lastBurst = now;
  }

  // Build blurred version (CSS filter blur on a separate canvas)
  blurCtx.clearRect(0, 0, W, H);
  blurCtx.drawImage(offscreen, 0, 0, W, H);

  // ---- Composite the final image ----
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#050614';
  ctx.fillRect(0, 0, W, H);

  // Soft blurred haze pass (gives bloom/atmospheric depth)
  ctx.save();
  ctx.filter = 'blur(14px)';
  ctx.globalAlpha = 0.95;
  ctx.drawImage(blurCanvas, 0, 0, W, H);
  ctx.filter = 'none';
  ctx.restore();

  // Sharp metaball pass (still slightly blurred for smooth edges)
  ctx.globalCompositeOperation = 'screen';
  ctx.save();
  ctx.filter = 'blur(3px)';
  ctx.globalAlpha = 1.0;
  ctx.drawImage(offscreen, 0, 0, W, H);
  ctx.filter = 'none';
  ctx.restore();

  // Threshold pass: keep only the brightest metaball regions
  // (classic metaball thresholding), boosting contrast so
  // only merged regions stay vivid while peripheral haze stays
  // muted.
  ctx.globalAlpha = 1.45;
  ctx.globalCompositeOperation = 'light';
  ctx.drawImage(offscreen, 0, 0, W, H);

  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = 'source-over';

  // Faint vignette for depth and focus
  drawVignette(ctx);

  // Continuous hue cycle is implicit: each metaball sprite
  // was drawn with a fixed hue, but the overall palette
  // evolves because metaballs drift across the haze hue
  // gradient. To make the palette evolve more globally,
  // we also periodically rebuild sprites so they get new
  // hues. ( cheap but smooth.
  if (frameCount % 60 === 0) {
    rebuildSpritesSmoothly();
  }

  requestAnimationFrame(draw);
}

// ------------------------------------------------
// Faint vignette
// ------------------------------------------------
function drawVignette(ctx) {
  const g = ctx.createRadialGradient(
    W * 0.5, H * 0.5, Math.min(W, H) * 0.15,
    W * 0.5, H * 0.5, Math.max(W, H) * 0.75
  );
  g.addColorStop(0, 'rgba(0, 0, 0, 0)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ------------------------------------------------
// Smoothly rebuild sprites so hue evolves over time
// ------------------------------------------------
function rebuildSpritesSmoothly() {
  for (const m of metaballs) {
    const cR = m.r;
    const hue = (m.phase * 180 / Math.PI + performance.now() * 0.01) % 360;
    const sat = 80 + Math.random() * 20;
    const lit = 60 + Math.random() * 20;

    const spr = document.createElement('canvas');
    const S = Math.max(8, Math.floor(cR * 2.0));
    spr.width = S;
    spr.height = S;
    const sctx = spr.getContext('2d');

    const cx = S * 0.5, cy = S * 0.5;
    const r1 = 0.4 * S;
    const r2 = 0.6 * S;
    const r3 = 1.0 * S;

    let g = sctx.createRadialGradient(cx, cy, r1, cx, cy, r2);
    g.addColorStop(0, `hsl(${hue}, ${sat}%,
        ${lit + 25}%`);
    g.addColorStop(1, `hsla(${hue}, ${sat}%,
        ${lit}%,
        0)`);
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, S, S);

    sctx.globalCompositeOperation = 'lighter';
    g = sctx.createRadialGradient(cx, cy, 0.4 * S, cx, cy, 0.6 * S);
    g.addColorStop(0, `hsla(${((hue + 60) % 360)}, ${sat}%,
        ${lit + 25}%,
        0.6`);
    g.addColorStop(1, `hsla(${((hue + 60) % 360)}, ${sat}%,
        ${lit}%,
        0)`);
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, S, S);

    sctx.globalCompositeOperation = 'screen';
    g = sctx.createRadialGradient(cx, cy, 0, cx, cy, r3 * 0.4);
    g.addColorStop(0, 'rgba(255, 255, 255, 1)');
    g.addColorStop(0.6, 'rgba(255, 255, 255, 0.3)');
    g.addColorStop(1, 'rgba(255, 255, 255, 0)');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, S, S);

    sctx.globalCompositeOperation = 'source-over';
    m.sprite = spr;
  }
}

// Kick off
requestAnimationFrame(draw);
</script>
</body>
</html>
