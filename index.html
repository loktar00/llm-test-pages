<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Test Pages</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    background: radial-gradient(circle at 50% 0%, #1a0606 0%, #080404 55%, #050303 100%);
    color: #f0e6e6;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  p.tagline { margin: 0; color: #9a7a7a; max-width: 38ch; line-height: 1.6; }
  .links { display: flex; flex-direction: column; gap: 0.75rem; width: min(420px, 100%); }
  a.card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.4rem;
    border: 1px solid rgba(255, 60, 60, 0.25);
    border-radius: 10px;
    background: rgba(255, 40, 40, 0.04);
    color: #f0e6e6;
    text-decoration: none;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  a.card:hover {
    border-color: rgba(255, 70, 70, 0.7);
    background: rgba(255, 40, 40, 0.1);
    transform: translateY(-2px);
  }
  a.card .name { font-weight: 600; letter-spacing: 0.03em; }
  a.card .arrow { color: #ff4747; }
  footer { color: #5a4444; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>LLM Test Pages</h1>
  <p class="tagline">Designs produced by language models in our benchmark suite, published with the model that created them.</p>
  <nav class="links">
    <a class="card" href="./virtual-boy-website/">
      <span class="name">Virtual Boy Website</span>
      <span class="arrow">&rarr;</span>
    </a>
  </nav>
  <footer>github.com/loktar00/llm-test-pages</footer>
</body>
</html>
