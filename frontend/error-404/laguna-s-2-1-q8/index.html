<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Lost in Space</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a1128;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    color: #e0e0ff;
  }

  .stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 4s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }

  .container {
    text-align: center;
    padding: 2rem;
  }

  .headline {
    font-size: 8rem;
    font-weight: 800;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    animation: glow 3s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
    50% { text-shadow: 0 0 40px rgba(100, 200, 255, 0.7), 0 0 60px rgba(255, 255, 255, 0.5); }
  }

  .zero {
    position: relative;
    display: inline-block;
    width: 140px;
    height: 140px;
  }

  .moon {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 35% 35%, #d4c17f, #a89b5e, #6b5b2e);
    border-radius: 50%;
    box-shadow: 
      inset 0 0 20px rgba(0, 0, 0, 0.5),
      0 0 30px rgba(212, 193, 127, 0.4);
  }

  .crater {
    position: absolute;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 50%;
  }

  .crater-1 {
    width: 25px;
    height: 25px;
    top: 30px;
    left: 40px;
  }

  .crater-2 {
    width: 18px;
    height: 18px;
    top: 70px;
    left: 20px;
  }

  .crater-3 {
    width: 22px;
    height: 22px;
    top: 90px;
    left: 60px;
  }

  .orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 200px;
    margin-top: -100px;
    margin-left: -100px;
    border: 1px dashed rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    animation: spin 12s linear infinite;
    transform-style: preserve-3d;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .satellite {
    position: absolute;
    top: -10px;
    left: 50%;
    margin-left: -25px;
    width: 50px;
    height: 20px;
    background: linear-gradient(90deg, #e0e0e0, #ffffff, #e0e0e0);
    border-radius: 4px;
    box-shadow: 
      0 0 10px rgba(255, 255, 255, 0.6),
      inset 0 0 5px rgba(0, 0, 0, 0.3);
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.6), inset 0 0 5px rgba(0, 0, 0, 0.3); }
    50% { box-shadow: 0 0 20px rgba(100, 200, 255, 0.8), inset 0 0 5px rgba(0, 0, 0, 0.3); }
  }

  .satellite::before,
  .satellite::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
  }

  .satellite::before {
    width: 6px;
    height: 6px;
    top: -3px;
    left: 5px;
    box-shadow: 
      12px 0 0 rgba(255, 255, 255, 0.7),
      0 10px 0 rgba(255, 255, 255, 0.7),
      12px 10px 0 rgba(255, 255, 255, 0.7);
  }

  .satellite::after {
    width: 4px;
    height: 4px;
    bottom: -2px;
    right: 5px;
    box-shadow: 
      -8px 0 0 rgba(255, 255, 255, 0.7),
      0 -8px 0 rgba(255, 255, 255, 0.7),
      -8px -8px 0 rgba(255, 255, 255, 0.7);
  }

  .message {
    font-size: 1.8rem;
    margin: 2rem 0;
    color: #c0c0ff;
    font-weight: 400;
    letter-spacing: 1px;
  }

  .home-button {
    display: inline-block;
    padding: 1rem 3rem;
    font-size: 1.2rem;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(135deg, #3a4a80, #1a2a6c);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  .home-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    border-color: rgba(255, 255, 255, 0.6);
  }

  .home-button::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 20px;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    transform: rotate(25deg);
    transition: 0.6s;
  }

  .home-button:hover::before {
    left: 120%;
  }

  .home-button:active {
    transform: translateY(-1px);
  }

  @media (max-width: 768px) {
    .headline {
      font-size: 5rem;
    }

    .zero {
      width: 100px;
      height: 100px;
    }

    .orbit {
      width: 150px;
      height: 150px;
      margin-top: -75px;
      margin-left: -75px;
    }

    .message {
      font-size: 1.3rem;
    }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="headline">
    <span>40</span>
    <div class="zero">
      <div class="moon">
        <div class="crater crater-1"></div>
        <div class="crater crater-2"></div>
        <div class="crater crater-3"></div>
      </div>
      <div class="orbit">
        <div class="satellite"></div>
      </div>
    </div>
  </div>
  <p class="message">Even the satellite can't find this page.</p>
  <a href="/" class="home-button">Take me home</a>
</div>

<script>
  // Generate twinkling stars
  const starsContainer = document.getElementById('stars');
  const numStars = 300;

  for (let i = 0; i < numStars; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    
    const size = Math.random() * 3;
    const posX = Math.random() * 100;
    const posY = Math.random() * 100;
    const animationDelay = Math.random() * 4;
    const animationDuration = 2 + Math.random() * 3;

    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.left = `${posX}vw`;
    star.style.top = `${posY}vh`;
    star.style.animationDelay = `${animationDelay}s`;
    star.style.animationDuration = `${animationDuration}s`;

    starsContainer.appendChild(star);
  }
</script>
</body>
</html>
