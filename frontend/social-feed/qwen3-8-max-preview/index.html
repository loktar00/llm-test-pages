<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flock — your evening feed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88' fill='%23ffc860'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1613; --card:#16211c; --line:rgba(230,240,233,.08);
    --ink:#e9f1ea; --sub:#8fa398; --faint:#5c6e64;
    --rose:#ff7a8a; --mint:#6fe3b0; --sky:#7cc4ff; --gold:#ffc860;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(1100px 520px at 85% -10%, rgba(255,200,96,.07), transparent 60%),
      radial-gradient(900px 620px at -10% 32%, rgba(111,227,176,.055), transparent 55%),
      radial-gradient(820px 520px at 72% 112%, rgba(255,122,138,.05), transparent 60%),
      radial-gradient(rgba(233,241,234,.028) 1px, transparent 1.4px);
    background-size:auto,auto,auto,26px 26px;
    background-attachment:fixed;
    color:var(--ink); font-family:var(--sans); min-height:100vh;
  }
  ::selection{background:var(--gold);color:#241a10}
  body::-webkit-scrollbar{width:10px}
  body::-webkit-scrollbar-thumb{background:#22322b;border-radius:8px}
  body::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

  /* ambient fireflies */
  #flies{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .fly{position:absolute;border-radius:50%;background:currentColor;box-shadow:0 0 10px 2px currentColor;
    animation:drift var(--t) ease-in-out infinite alternate, twinkle var(--t2) ease-in-out infinite}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
  @keyframes twinkle{0%,100%{opacity:.06}50%{opacity:.65}}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:rgba(13,22,19,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{font:italic 700 21px/1 var(--serif);letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
  .brand .mark{display:inline-block;color:var(--gold);font-style:normal;font-size:17px;
    animation:spin 14s linear infinite;transform-origin:50% 52%}
  @keyframes spin{to{transform:rotate(360deg)}}
  .beta{font:600 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    border:1px solid rgba(255,200,96,.4);border-radius:999px;padding:3px 7px;transform:translateY(-3px)}
  .clock{font:500 12px/1 var(--mono);color:var(--sub);letter-spacing:.04em}

  .col{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 90px}

  /* cards */
  .card{background:linear-gradient(180deg,#182420,#141e1a);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.28);transition:transform .22s ease,border-color .22s,box-shadow .22s}
  .post:hover{transform:translateY(-2px);border-color:rgba(233,241,234,.15);box-shadow:0 14px 34px rgba(0,0,0,.4)}

  /* composer */
  .composer{position:relative;overflow:hidden;display:flex;gap:12px;padding:16px 16px 13px}
  .composer::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;opacity:.85;
    background:linear-gradient(90deg,var(--gold),var(--rose) 45%,var(--mint))}
  .composer.pulse{animation:cpulse .9s ease-out}
  @keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(255,200,96,.45),0 8px 24px rgba(0,0,0,.28)}
    100%{box-shadow:0 0 0 14px rgba(255,200,96,0),0 8px 24px rgba(0,0,0,.28)}}
  .cbody{flex:1;min-width:0}
  textarea{width:100%;background:transparent;border:none;resize:none;color:var(--ink);
    font:400 15.5px/1.5 var(--sans);min-height:44px;max-height:180px}
  textarea:focus{outline:none}
  textarea::placeholder{color:var(--faint);font-style:italic}
  .crow{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:10px;
    border-top:1px solid rgba(230,240,233,.05)}
  .tools{display:flex;gap:2px}
  .tools button{background:none;border:none;color:var(--sub);width:32px;height:32px;border-radius:9px;
    display:grid;place-items:center;transition:color .2s,background .2s,transform .15s}
  .tools button:hover{transform:translateY(-1px)}
  .tools button:nth-child(1):hover{color:var(--mint);background:rgba(111,227,176,.1)}
  .tools button:nth-child(2):hover{color:var(--gold);background:rgba(255,200,96,.1)}
  .tools button:nth-child(3):hover{color:var(--sky);background:rgba(124,196,255,.1)}
  .tools button:nth-child(4):hover{color:var(--rose);background:rgba(255,122,138,.1)}
  .cright{display:flex;align-items:center;gap:12px}
  .ccount{font:500 12px/1 var(--mono);color:var(--faint);transition:color .2s;min-width:28px;text-align:right}
  .ccount.warn{color:var(--gold)} .ccount.over{color:var(--rose)}
  .btn-post{border:none;border-radius:999px;padding:8px 20px;font:700 13px/1 var(--sans);letter-spacing:.03em;
    color:#241a10;background:linear-gradient(135deg,#ffd166,#ff9a5e);
    box-shadow:0 6px 16px rgba(255,180,90,.22);transition:transform .15s,filter .2s,opacity .2s}
  .btn-post:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
  .btn-post:active:not(:disabled){transform:scale(.96)}
  .btn-post:disabled{opacity:.45;filter:saturate(.4);cursor:default}

  /* avatars */
  .av{border-radius:50%;display:grid;place-items:center;flex:none;width:42px;height:42px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.3);
    transition:transform .3s cubic-bezier(.3,1.5,.4,1)}
  .av span{font:700 17px/1 var(--serif);color:#14201a}
  .post:hover .av{transform:scale(1.07) rotate(-4deg)}
  .av1{background:linear-gradient(135deg,#ffc860,#ff7a5e)} .av2{background:linear-gradient(135deg,#6fe3b0,#2f9e8f)}
  .av3{background:linear-gradient(135deg,#7cc4ff,#4a7dff)} .av4{background:linear-gradient(135deg,#ff9ac2,#ff5e8a)}
  .av5{background:linear-gradient(135deg,#ffd166,#f4a261)} .av6{background:linear-gradient(135deg,#9be3d2,#5aa9e6)}
  .av7{background:linear-gradient(135deg,#f4a261,#c65b7c)}
  .av8{background:conic-gradient(from 210deg,#ffc860,#ff7a8a,#7cc4ff,#6fe3b0,#ffc860)}

  /* tabs */
  .tabs{position:relative;display:flex;margin:6px 0 14px;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:11px 0;background:none;border:none;color:var(--sub);
    font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;transition:color .2s}
  .tab:hover{color:var(--gold)} .tab.on{color:var(--ink)}
  .ink{position:absolute;bottom:-1px;left:0;width:50%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold),var(--rose));box-shadow:0 0 10px rgba(255,200,96,.5);
    transition:transform .35s cubic-bezier(.6,0,.2,1)}
  .tabs[data-t="1"] .ink{transform:translateX(100%)}

  /* feed */
  .feed{display:flex;flex-direction:column;gap:14px;transition:opacity .25s,transform .25s}
  .feed.swap{opacity:.3;transform:translateY(6px)}
  .post{display:flex;gap:12px;padding:16px 18px}
  .post.pre{opacity:0}
  .post.in{opacity:1;animation:rise .55s cubic-bezier(.2,.8,.25,1) backwards;animation-delay:var(--d,0ms)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .post.fresh{border-color:rgba(255,200,96,.5);box-shadow:0 0 0 1px rgba(255,200,96,.22),0 12px 30px rgba(0,0,0,.35);
    animation:drop .55s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:var(--d,0ms)}
  @keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.98)}to{opacity:1;transform:none}}
  .pbody{flex:1;min-width:0}
  .phead{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .pname{font:700 15.5px/1.2 var(--serif);letter-spacing:.005em}
  .vbadge{width:15px;height:15px;border-radius:50%;background:var(--gold);color:#241a10;
    display:inline-grid;place-items:center;transform:translateY(2px)}
  .vbadge svg{width:9px;height:9px;stroke-width:3.2}
  .phandle,.ts{font:500 12px/1 var(--mono);color:var(--sub)}
  .dot{color:var(--faint)}
  .ptext{font-size:15.5px;line-height:1.55;color:#dbe6dd;margin:7px 0 10px;overflow-wrap:break-word}

  /* gradient "images" */
  .post-img{position:relative;height:190px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:2px 0 10px}
  .post-img::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 24%)}
  .layer{position:absolute;inset:0;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
  .post-img:hover .layer{transform:scale(1.045)}
  .gh .layer{background:linear-gradient(180deg,#0f2f38 0%,#55303c 34%,#c85a49 58%,#ffab61 76%,#ffd98c 100%)}
  .gh .layer::before{content:"";position:absolute;width:64px;height:64px;left:58%;top:32%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff6dd,#ffd166 55%,rgba(255,180,90,0) 72%);
    animation:sunglow 5s ease-in-out infinite}
  @keyframes sunglow{0%,100%{box-shadow:0 0 34px 10px rgba(255,190,110,.35)}50%{box-shadow:0 0 50px 18px rgba(255,190,110,.55)}}
  .gh .layer::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;opacity:.55;
    background:repeating-linear-gradient(180deg,rgba(255,215,150,.3) 0 2px,rgba(255,215,150,0) 2px 7px),
      linear-gradient(180deg,rgba(20,20,30,0),rgba(12,18,22,.55))}
  .tide .layer{background:linear-gradient(180deg,#041e26 0%,#07333d 30%,#0d5f6b 58%,#159a97 78%,#6fdcb2 100%)}
  .tide .layer::before{content:"";position:absolute;width:38px;height:38px;left:20%;top:18%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#f4fff8,#bfeee0 55%,rgba(191,238,224,0) 72%);
    box-shadow:0 0 26px 8px rgba(191,238,224,.3)}
  .tide .layer::after{content:"";position:absolute;inset:42% 0 0;
    background:repeating-linear-gradient(96deg,rgba(255,255,255,.1) 0 2px,transparent 2px 14px);
    animation:watermove 10s linear infinite;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%);mask-image:linear-gradient(180deg,transparent,#000 40%)}
  @keyframes watermove{to{background-position:120px 0}}
  .bloom .layer{background:linear-gradient(150deg,#33182b 0%,#7c2f4b 40%,#d4566b 68%,#ff9d7e 88%,#ffd08a 100%)}
  .bloom .layer::before{content:"";position:absolute;inset:-18%;filter:blur(3px);animation:bokeh 14s ease-in-out infinite alternate;
    background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 6%,transparent 7%),
      radial-gradient(circle at 70% 20%,rgba(255,230,190,.3) 0 4%,transparent 5%),
      radial-gradient(circle at 40% 70%,rgba(255,255,255,.28) 0 8%,transparent 9%),
      radial-gradient(circle at 82% 62%,rgba(255,210,160,.32) 0 5%,transparent 6%),
      radial-gradient(circle at 55% 45%,rgba(255,255,255,.2) 0 3%,transparent 4%)}
  @keyframes bokeh{to{transform:translate(-16px,12px)}}
  .bloom .layer::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(20,10,18,.4))}

  /* action row */
  .acts{display:flex;align-items:center;gap:4px;margin:0 -9px}
  .act{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);
    padding:5px 10px;border-radius:999px;font:500 12.5px/1 var(--mono);transition:color .2s,background .2s,transform .15s}
  .act:active{transform:scale(.94)}
  .act svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .reply:hover{color:var(--sky);background:rgba(124,196,255,.1)}
  .rt:hover{color:var(--mint);background:rgba(111,227,176,.1)}
  .like:hover{color:var(--rose);background:rgba(255,122,138,.1)}
  .share:hover{color:var(--gold);background:rgba(255,200,96,.12)}
  .rt svg{transition:transform .35s cubic-bezier(.3,1.3,.4,1)}
  .rt.on{color:var(--mint)} .rt.on svg{transform:rotate(180deg)}
  .rt.spin svg{animation:rtspin .45s ease}
  @keyframes rtspin{from{transform:rotate(0)}to{transform:rotate(180deg)}}
  .like.liked{color:var(--rose)}
  .like svg path{fill:transparent;transition:fill .25s}
  .like.liked svg path{fill:var(--rose)}
  .like.pop .ic svg{animation:pop .45s cubic-bezier(.2,.9,.3,1.5)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
  .ic{position:relative;display:grid;place-items:center;width:20px;height:20px}
  .n.bump{animation:bump .4s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes bump{0%{transform:translateY(0)}35%{transform:translateY(-4px) scale(1.3)}100%{transform:translateY(0)}}
  .p{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);
    border-radius:50%;background:var(--c);pointer-events:none;
    animation:burst .7s cubic-bezier(.15,.75,.35,1) forwards}
  .p.spark{background:none;width:auto;height:auto;margin:0;font-size:10px;line-height:1;color:var(--c)}
  @keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}70%{opacity:1}
    100%{transform:translate(var(--x),var(--y)) scale(.15);opacity:0}}
  .ring{position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--rose);pointer-events:none;
    animation:ringOut .5s ease-out forwards}
  @keyframes ringOut{from{transform:scale(.5);opacity:.8}to{transform:scale(2.2);opacity:0}}

  .endcap{font:500 11.5px/1.6 var(--mono);letter-spacing:.06em;color:var(--faint);text-align:center;padding:30px 12px 6px}

  /* new-posts pill */
  .pill-wrap{position:fixed;top:70px;left:50%;z-index:30;transform:translate(-50%,-220%);
    transition:transform .55s cubic-bezier(.2,.9,.25,1.15);will-change:transform}
  .pill-wrap.show{transform:translate(-50%,0)}
  .pill{display:flex;align-items:center;gap:9px;border-radius:999px;padding:10px 18px;
    background:linear-gradient(135deg,#1e2c26,#16221e);border:1px solid rgba(255,200,96,.35);color:var(--ink);
    font:600 12.5px/1 var(--mono);letter-spacing:.03em;
    box-shadow:0 14px 34px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
    animation:bob 2.8s ease-in-out infinite;transition:border-color .2s,box-shadow .2s}
  .pill:hover{border-color:rgba(255,200,96,.7);
    box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 20px rgba(255,200,96,.15),inset 0 1px 0 rgba(255,255,255,.08)}
  .pill:active{transform:scale(.96)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .pdot{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pdot 1.6s ease-out infinite}
  @keyframes pdot{0%{box-shadow:0 0 0 0 rgba(111,227,176,.55)}100%{box-shadow:0 0 0 8px rgba(111,227,176,0)}}

  /* toast */
  .toast{position:fixed;bottom:26px;left:50%;z-index:50;transform:translate(-50%,90px);opacity:0;
    background:#182420;border:1px solid var(--line);border-radius:999px;padding:10px 18px;
    font:500 12.5px/1 var(--mono);color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.45);
    transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
  .toast.show{transform:translate(-50%,0);opacity:1}

  @media (max-width:480px){
    .col{padding:14px 12px 80px}
    .post{padding:14px}
    .post-img{height:158px}
    .clock{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    html{scroll-behavior:auto}
    #flies{display:none}
  }
</style>
</head>
<body>
<div id="flies" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand"><span class="mark">✦</span>flock<span class="beta">beta</span></div>
  <div class="clock" id="clock">—</div>
</header>

<main class="col">
  <section class="composer card" id="composer" aria-label="compose a post">
    <div class="av av8"><span>Y</span></div>
    <div class="cbody">
      <textarea id="ta" rows="1" maxlength="300" placeholder="what's the word tonight?"></textarea>
      <div class="crow">
        <div class="tools" id="tools"></div>
        <div class="cright">
          <span class="ccount" id="ccount">280</span>
          <button class="btn-post" id="postBtn" disabled>post</button>
        </div>
      </div>
    </div>
  </section>

  <nav class="tabs" id="tabs" data-t="0" aria-label="feed tabs">
    <button class="tab on">for you</button>
    <button class="tab">following</button>
    <span class="ink"></span>
  </nav>

  <div class="feed" id="feed"></div>

  <div class="endcap">✦ &nbsp;you're all caught up — stretch, sip water, pet a dog&nbsp; ✦</div>
</main>

<div class="pill-wrap" id="pillWrap" aria-live="polite">
  <button class="pill" id="pill"><span class="pdot"></span><span id="pillText">new posts</span></button>
</div>

<div class="toast" id="toast" role="status">link copied ✦</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- icons ---------- */
  const S = p => '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
  const I = {
    reply: S('<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-3-.4-4.2-1.1L3 20l1.1-5.3A8.5 8.5 0 1 1 21 11.5Z"/>'),
    rt:    S('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'),
    heart: S('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z"/>'),
    share: S('<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>'),
    check: S('<path d="M20 6 9 17l-5-5"/>'),
    img:   S('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 3 3 4-4 4 4"/>'),
    smile: S('<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.8 3.5 1.8 3.5-1.8 3.5-1.8"/><path d="M9 10h.01M15 10h.01"/>'),
    poll:  S('<path d="M6 20V10M12 20V4M18 20v-7"/>'),
    pin:   S('<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>')
  };

  /* ---------- helpers ---------- */
  const fmtK = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : String(n);
  const fmtTs = ts => {
    const s = (Date.now()-ts)/1000;
    if (s < 50) return 'now';
    if (s < 3600) return Math.floor(s/60)+'m';
    if (s < 86400) return Math.floor(s/3600)+'h';
    return Math.floor(s/86400)+'d';
  };
  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const el = html => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };

  /* ---------- data ---------- */
  const seed = [
    {n:'Mira Chen', h:'mirachen', av:'av4', i:'M', age:2, r:14, rt:6, l:218,
     t:"watched a crow rinse a walnut in a puddle for a full minute before eating it. nature's little chef. zero notes."},
    {n:'Dev Okafor', h:'devbuilds', av:'av2', i:'D', age:18, r:32, rt:21, l:842, v:1,
     t:"shipped the feature i'd been scared of for three weeks. took 40 minutes. the fear was a liar and i'm pressing charges."},
    {n:'June Park', h:'junebug', av:'av1', i:'J', age:64, r:18, rt:9, l:463, v:1, img:'gh',
     t:"golden hour hit the fire escape and for ten minutes my whole apartment looked like a film still. no filter, just physics being generous."},
    {n:'Theo Ramos', h:'theomakes', av:'av3', i:'T', age:187, r:57, rt:44, l:1204,
     t:"hot take: the best productivity app is a notebook that doesn't sync, doesn't notify, and doesn't know what year it is."},
    {n:'Sana Iqbal', h:'sanapaints', av:'av5', i:'S', age:312, r:26, rt:31, l:934, v:1, img:'tide',
     t:"study no. 41 — tide, memory, and the exact color of 6 a.m. gouache on a day that refused to be gray."},
    {n:'Ravi Menon', h:'ravireads', av:'av6', i:'R', age:540, r:41, rt:12, l:687,
     t:"rereading a book i loved at 19. it's an entirely different book now. genuinely curious what the 50-year-old me will make of this one."},
    {n:'Lena Voss', h:'lenaloops', av:'av7', i:'L', age:1560, r:9, rt:7, l:301, img:'bloom',
     t:"the tide chart said one thing, the gulls said another. trusted the gulls. the gulls were right. the gulls are always right."}
  ];
  const pool = [
    {n:'Nadia B.', h:'nadrifts', av:'av5', i:'N', r:3, rt:2, l:41,
     t:"the bakery downstairs just released a 'rainy day croissant' and honestly? that's the kind of product thinking i aspire to."},
    {n:'Kofi Mensah', h:'kofibeats', av:'av2', i:'K', r:11, rt:8, l:164,
     t:"made a beat out of my radiator's clank. it slaps. the radiator is credited as a featured artist and is negotiating for royalties."},
    {n:'Wren Ashby', h:'wrenwrites', av:'av4', i:'W', r:6, rt:5, l:98,
     t:"wrote 200 bad words on purpose to unstick the good ones. extremely recommend. the bad words did their job with dignity."},
    {n:'Oscar Lund', h:'oscarloops', av:'av3', i:'O', r:4, rt:9, l:210,
     t:"reminder that 'per aspera ad astra' is just latin for 'ship it anyway.'"},
    {n:'Priya Nair', h:'priyacodes', av:'av6', i:'P', r:8, rt:6, l:187,
     t:"my code review came back with a single comment: 'no notes.' framing it and hanging it above my desk."}
  ];

  /* ---------- post factory ---------- */
  const feed = $('#feed');
  function makePost(d, ts){
    return el(
      '<article class="post card pre">' +
        '<div class="av '+d.av+'"><span>'+d.i+'</span></div>' +
        '<div class="pbody">' +
          '<header class="phead">' +
            '<span class="pname">'+d.n+'</span>' +
            (d.v ? '<span class="vbadge" title="verified">'+I.check+'</span>' : '') +
            '<span class="phandle">@'+d.h+'</span><span class="dot">·</span>' +
            '<time class="ts" data-ts="'+ts+'">'+fmtTs(ts)+'</time>' +
          '</header>' +
          '<p class="ptext">'+d.t+'</p>' +
          (d.img ? '<div class="post-img '+d.img+'"><i class="layer"></i></div>' : '') +
          '<footer class="acts">' +
            '<button class="act reply" aria-label="reply">'+I.reply+'<span class="n">'+fmtK(d.r)+'</span></button>' +
            '<button class="act rt" aria-label="repost" aria-pressed="false">'+I.rt+'<span class="n" data-c="'+d.rt+'">'+fmtK(d.rt)+'</span></button>' +
            '<button class="act like" aria-label="like" aria-pressed="false"><span class="ic">'+I.heart+'</span><span class="n" data-c="'+d.l+'">'+fmtK(d.l)+'</span></button>' +
            '<button class="act share" aria-label="share">'+I.share+'</button>' +
          '</footer>' +
        '</div>' +
      '</article>'
    );
  }

  /* scroll-reveal */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }), {threshold:.08});

  seed.forEach((d,i) => {
    const node = makePost(d, Date.now() - d.age*60000);
    node.style.setProperty('--d', (i*70)+'ms');
    feed.appendChild(node);
    io.observe(node);
  });

  /* ---------- like burst ---------- */
  const PCOLS = ['#ff7a8a','#ffc860','#6fe3b0','#7cc4ff'];
  function burst(ic){
    const ring = el('<span class="ring"></span>');
    ring.addEventListener('animationend', () => ring.remove());
    ic.appendChild(ring);
    const N = 9;
    for (let i=0;i<N;i++){
      const spark = i % 4 === 3;
      const p = el('<span class="p'+(spark?' spark':'')+'">'+(spark?'✦':'')+'</span>');
      const a = (i/N)*Math.PI*2 + Math.random()*.6;
      const dist = 16 + Math.random()*17;
      p.style.setProperty('--x', (Math.cos(a)*dist).toFixed(1)+'px');
      p.style.setProperty('--y', (Math.sin(a)*dist - 4).toFixed(1)+'px');
      p.style.setProperty('--c', PCOLS[i % PCOLS.length]);
      p.style.setProperty('--s', (4 + Math.random()*3).toFixed(1)+'px');
      p.style.animationDelay = (Math.random()*60)+'ms';
      p.addEventListener('animationend', () => p.remove());
      ic.appendChild(p);
    }
  }
  const retrigger = (node,cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

  /* ---------- feed interactions (delegated) ---------- */
  feed.addEventListener('click', e => {
    const btn = e.target.closest('.act');
    if (!btn) return;

    if (btn.classList.contains('like')){
      const n = btn.querySelector('.n'), ic = btn.querySelector('.ic');
      let c = +n.dataset.c;
      const on = btn.classList.toggle('liked');
      btn.setAttribute('aria-pressed', on);
      c += on ? 1 : -1;
      n.dataset.c = c; n.textContent = fmtK(c);
      if (on){ burst(ic); retrigger(btn,'pop'); }
      retrigger(n,'bump');
    }
    else if (btn.classList.contains('rt')){
      const n = btn.querySelector('.n');
      let c = +n.dataset.c;
      const on = btn.classList.toggle('on');
      btn.setAttribute('aria-pressed', on);
      c += on ? 1 : -1;
      n.dataset.c = c; n.textContent = fmtK(c);
      retrigger(btn,'spin'); retrigger(n,'bump');
    }
    else if (btn.classList.contains('reply')){
      const h = btn.closest('.post').querySelector('.phandle').textContent.slice(1);
      ta.value = '@'+h+' ';
      ta.dispatchEvent(new Event('input'));
      composer.scrollIntoView({behavior:'smooth', block:'center'});
      retrigger(composer,'pulse');
      setTimeout(() => ta.focus(), 300);
    }
    else if (btn.classList.contains('share')){
      try { navigator.clipboard && navigator.clipboard.writeText(location.href); } catch(_){}
      toast('link copied to your clipboard ✦');
    }
  });

  /* ---------- composer ---------- */
  const ta = $('#ta'), ccount = $('#ccount'), postBtn = $('#postBtn'), composer = $('#composer');
  $('#tools').innerHTML = ['img','smile','poll','pin'].map(k =>
    '<button type="button" title="'+k+'" aria-label="'+k+'">'+I[k]+'</button>').join('');
  $('#tools').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b){ toast('that one\'s coming in v2 ✦'); }
  });

  function composerUpdate(){
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 180)+'px';
    const left = 280 - ta.value.length;
    ccount.textContent = left;
    ccount.classList.toggle('warn', left <= 20 && left >= 0);
    ccount.classList.toggle('over', left < 0);
    postBtn.disabled = !ta.value.trim() || left < 0;
  }
  ta.addEventListener('input', composerUpdate);
  ta.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') postBtn.click();
  });

  postBtn.addEventListener('click', () => {
    const text = ta.value.trim();
    if (!text) return;
    const node = makePost({n:'you', h:'you', av:'av8', i:'Y', r:0, rt:0, l:0, t:esc(text)}, Date.now());
    node.classList.remove('pre'); node.classList.add('in','fresh');
    feed.prepend(node);
    setTimeout(() => node.classList.remove('fresh'), 1600);
    ta.value = ''; composerUpdate();
    toast('posted to your flock ✦');
  });
  composerUpdate();

  document.addEventListener('keydown', e => {
    if (e.key === 'n' && !/^(textarea|input)$/i.test(document.activeElement.tagName)){
      e.preventDefault(); ta.focus();
    }
  });

  /* ---------- new-posts pill ---------- */
  const pillWrap = $('#pillWrap'), pillText = $('#pillText');
  let queue = [], pi = 0;
  function pillShow(){
    pillText.textContent = queue.length + (queue.length === 1 ? ' new post' : ' new posts');
    pillWrap.classList.add('show');
  }
  function nextWave(){
    queue.push(pool[pi++ % pool.length]);
    pillShow();
    setTimeout(nextWave, 14000 + Math.random()*9000);
  }
  setTimeout(nextWave, 6000);

  $('#pill').addEventListener('click', () => {
    if (!queue.length){ pillWrap.classList.remove('show'); return; }
    const items = queue.splice(0);
    pillWrap.classList.remove('show');
    window.scrollTo({top:0, behavior: reduced ? 'auto' : 'smooth'});
    setTimeout(() => {
      items.forEach((d,i) => {
        const node = makePost(d, Date.now());
        node.classList.remove('pre'); node.classList.add('in','fresh');
        node.style.setProperty('--d', (i*110)+'ms');
        feed.insertBefore(node, feed.children[i] || null);
        setTimeout(() => node.classList.remove('fresh'), 1800 + i*110);
      });
    }, reduced ? 0 : 380);
  });

  /* ---------- tabs ---------- */
  const tabs = $('#tabs');
  tabs.querySelectorAll('.tab').forEach((t,i) => t.addEventListener('click', () => {
    tabs.dataset.t = i;
    tabs.querySelectorAll('.tab').forEach((x,j) => x.classList.toggle('on', j===i));
    feed.classList.add('swap');
    setTimeout(() => feed.classList.remove('swap'), 280);
  }));

  /* ---------- toast ---------- */
  const toastEl = $('#toast'); let toastT;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  /* ---------- clock & timestamps ---------- */
  const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
  function tick(){
    const d = new Date();
    let h = d.getHours(); const ap = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    $('#clock').textContent = DAYS[d.getDay()]+' '+h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap;
  }
  tick(); setInterval(tick, 30000);
  setInterval(() => document.querySelectorAll('[data-ts]').forEach(n => n.textContent = fmtTs(+n.dataset.ts)), 30000);

  /* ---------- fireflies ---------- */
  if (!reduced){
    const wrap = $('#flies'), cols = ['#ffc860','#6fe3b0','#ff7a8a','#7cc4ff'];
    for (let i=0;i<9;i++){
      const f = document.createElement('span');
      f.className = 'fly';
      const sz = (2.5 + Math.random()*3.5).toFixed(1);
      f.style.cssText = 'left:'+(Math.random()*100)+'vw;top:'+(Math.random()*100)+'vh;width:'+sz+'px;height:'+sz+'px;' +
        'color:'+cols[i%4]+';--dx:'+((Math.random()*140-70)|0)+'px;--dy:'+((Math.random()*160-80)|0)+'px;' +
        '--t:'+(8+Math.random()*10).toFixed(1)+'s;--t2:'+(2+Math.random()*3).toFixed(1)+'s;' +
        'animation-delay:-'+(Math.random()*10).toFixed(1)+'s,-'+(Math.random()*3).toFixed(1)+'s';
      wrap.appendChild(f);
    }
  }
})();
</script>
</body>
</html>
