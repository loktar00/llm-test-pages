<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern E-Commerce Grid</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --sale-red: #ef4444;
            --gold: #fbbf24;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* --- Grid Layout --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        /* --- Card Styles --- */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: var(--shadow-lg);
        }

        /* --- Visual Product Area --- */
        .card-visual {
            height: 220px;
            background: radial-gradient(circle at center, #f9fafb 0%, #e5e7eb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- CSS Illustrations --- */
        .prod-ill {
            position: relative;
            transition: transform 0.4s ease;
        }

        .card:hover .prod-ill {
            transform: scale(1.05);
        }

        /* 1. Bottle */
        .bottle {
            width: 60px;
            height: 140px;
            background: linear-gradient(135deg, #a5f3fc 0%, #0ea5e9 100%);
            border-radius: 8px 8px 20px 20px;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.1);
        }
        .bottle::before { /* Cap */
            content: '';
            position: absolute;
            top: -20px;
            left: 10px;
            width: 40px;
            height: 20px;
            background: #1e293b;
            border-radius: 4px 4px 0 0;
        }
        .bottle::after { /* Label */
            content: '';
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bottle-label-line {
            position: absolute;
            top: 65px;
            left: 15px;
            width: 30px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
        }

        /* 2. Headphones */
        .headphones {
            width: 100px;
            height: 80px;
            position: relative;
        }
        .hp-band {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            border: 8px solid #374151;
            border-bottom: none;
            border-radius: 60px 60px 0 0;
        }
        .hp-cup {
            position: absolute;
            bottom: 0;
            width: 30px;
            height: 50px;
            background: linear-gradient(to right, #4b5563, #1f2937);
            border-radius: 6px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .hp-cup.left { left: 0; }
        .hp-cup.right { right: 0; }
        .hp-cushion {
            position: absolute;
            top: 5px;
            width: 10px;
            height: 40px;
            background: #111827;
            border-radius: 2px;
        }
        .hp-cushion.left { left: -6px; }
        .hp-cushion.right { right: -6px; }

        /* 3. Watch */
        .watch {
            width: 80px;
            height: 80px;
            background: #e5e7eb;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 4px solid #9ca3af;
        }
        .watch::before { /* Hands */
            content: '';
            position: absolute;
            top: 30px;
            left: 38px;
            width: 4px;
            height: 20px;
            background: #1f2937;
            transform-origin: bottom center;
            transform: rotate(45deg);
        }
        .watch::after { /* Center dot */
            content: '';
            position: absolute;
            top: 38px;
            left: 38px;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
        }
        .watch-band-top, .watch-band-bottom {
            position: absolute;
            left: 20px;
            width: 40px;
            height: 30px;
            background: #374151;
        }
        .watch-band-top { top: -20px; border-radius: 10px 10px 0 0; }
        .watch-band-bottom { bottom: -20px; border-radius: 0 0 10px 10px; }

        /* 4. Sneaker */
        .sneaker {
            width: 120px;
            height: 50px;
            background: #f87171;
            border-radius: 40px 10px 10px 10px;
            position: relative;
            transform: rotate(-10deg);
        }
        .sneaker::before { /* Sole */
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15px;
            background: white;
            border-radius: 0 0 10px 10px;
        }
        .sneaker::after { /* Swooshish */
            content: '';
            position: absolute;
            top: 15px;
            left: 20px;
            width: 60px;
            height: 8px;
            background: white;
            border-radius: 50%;
            transform: skewX(-20deg);
        }

        /* 5. Backpack */
        .backpack {
            width: 80px;
            height: 100px;
            background: #4b5563;
            border-radius: 15px 15px 5px 5px;
            position: relative;
        }
        .backpack::before { /* Pocket */
            content: '';
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 50px;
            height: 30px;
            background: #374151;
            border-radius: 5px;
        }
        .backpack::after { /* Strap */
            content: '';
            position: absolute;
            top: -10px;
            left: 30px;
            width: 20px;
            height: 20px;
            border: 6px solid #4b5563;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
        }

        /* 6. Perfume */
        .perfume {
            width: 50px;
            height: 100px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .perfume::before { /* Cap */
            content: '';
            position: absolute;
            top: -25px;
            left: 10px;
            width: 30px;
            height: 25px;
            background: linear-gradient(to right, #d1d5db, #9ca3af);
        }
        .perfume::after { /* Liquid */
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, #fbcfe8, #f472b6);
            border-radius: 0 0 4px 4px;
        }

        /* --- Card Content --- */
        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .product-name {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .rating {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            gap: 4px;
        }

        .stars {
            display: flex;
            color: #e5e7eb; /* Empty star color */
            font-size: 1rem;
        }

        .stars .filled {
            color: var(--gold);
        }

        /* Gradient Star Trick */
        .stars .partial {
            position: relative;
            color: #e5e7eb;
            z-index: 1;
        }
        .stars .partial::before {
            content: attr(data-content);
            position: absolute;
            left: 0;
            top: 0;
            width: var(--fill);
            overflow: hidden;
            color: var(--gold);
            z-index: -1;
        }

        .star-count {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-left: 6px;
        }

        .price-row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem; /* Space for the sliding button */
        }

        .price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .old-price {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-decoration: line-through;
            margin-left: 8px;
            font-weight: 500;
        }

        /* --- Quick Add Bar --- */
        .quick-add-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            background: linear-gradient(to top, rgba(255,255,255,1) 80%, rgba(255,255,255,0));
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            display: flex;
            justify-content: center;
        }

        .card:hover .quick-add-container {
            transform: translateY(0);
        }

        .add-btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-btn:hover {
            background-color: var(--accent);
        }

        .add-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* --- Sale Badge --- */
        .badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: var(--sale-red);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            z-index: 20;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
        }

        /* Wiggle Animation */
        .wiggle {
            animation: wiggle 3s infinite ease-in-out;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: rotate(-3deg); }
            20%, 40%, 60%, 80% { transform: rotate(3deg); }
        }

        /* Media Queries for tighter spacing on smaller screens */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
