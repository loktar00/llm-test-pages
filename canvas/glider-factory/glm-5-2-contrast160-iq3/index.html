<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game of Life Factory</title>
<style>
  html, body { margin: 0; padding: 0; height: 100; background: #050308; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, COLS = 0, ROWS = 0, CELL = 0;
  let cells, next, cellState, cellAge;
  let trail, trailAlpha;
  let activity = 0;
  let frameCount = 0;
  let sweepPhase = 0;
  let sweepActive = false;
  let sweepTimer = 0;
  let sweepSpeed = 0.6;
  const ACT_THRESHOLD = 50;
  const ACT_MIN = 18;
  const ACT_DECAY = 0.992;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    Cell = Math.max(4, Math.round(Math.sqrt(Math.max(W, H) / 12)));
    Cell = Math.max(5, Math.min(Cell, 7));
    COLS = Math.floor(W / Cell);
    ROWS = Math.floor(H / Cell);
    const N = COLS * ROWS;
    cells = new Uint8Array(N);
    next = new Uint8Array(N);
    cellState = new Float32Array(N);
    cellAge = new Float32Array(N);
    trailAlpha = new Float32Array(N);
    ctx.fillStyle = '#050308';
    ctx.fillRect(0, 0, W, H);
    seed();
  }

  let Cell = 5;
  function idx(x, y){ return ((y + ROWS) % ROWS) * COLS + ((x + COLS) % COLS); }

  function stamp(cx, cy, pat){
    const h = pat.length;
    const w = pat[0].length;
    for(let i = 0; i < h; i++){
      const row = pat[i];
      const base = ((cy + i + ROWS) % ROWS) * COLS;
      for(let j = 0; j < width; j++){
        if(row[j] === '1'){
          const k = base + (((cx + j + COLS) % COLS);
          cells[k] = 1;
          cellAge[k] = 1.0;
        }
      }
    }
  }

  const PATTERNS = {};
  function register(name, rows){
    const maxW = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const clean = rows.map(r => r.padEnd(maxW, '0'));
    const arr = clean.map(r => Array.from(r).map(c => (c === '1' ? 1 : 0)));
    PATTERNS[name] = arr;
    return arr;
  }
  register('glider', ['001','100','001']);
  register('lw_spaceship', ['1000','0110','0001','01100','0111']);
  register('gun', ['001','001','001','101','001','001']);
  register('block', ['11','11']);
  register('puffer_glider', ['001','100','001']);

  function seed(){
    cells.fill(0);
    cellState.fill(0);
    cellAge.fill(0);
    trailAlpha.fill(0);

    const marginX = Math.max(8, Math.floor(COLS * 0.1);
    const marginY = Math.max(4, Math.floor(ROWS * 0.08));

    // Two Gosider glider guns facing each another
    const gx1 = marginX;
    const gx2 = COLS - marginX - 36;
    const gy1 = Math.floor(ROWS * 0.25) + marginY;
    const gy2 = Math.floor(ROWS * 0.75) - marginY;
    stamp(gx1, gy1, PATTERNS.gun);
    stamp(gx2, gy2, PATTERNS.gun);

    // Spaceships drifting vertically toward center
    const sx = Math.floor(COLS * 0.4);
    stamp(sx, marginY + 4, PATTERNS.lw_spaceship);

    const sx2 = Math.floor(COLS * 0.5);
    stamp(sx2, ROWS - marginY - 10, rotatePat(PATTERNS.lw_spaceship, 2, 1));

    // Puffer traveling horizontally
    const py = Math.floor(ROWS * 0.5);
    stamp(marginX + 6, py, PATTERNS.puffer_glider);

    // Stability anchors — random blocks scattered
    const blockCount = Math.min(50, Math.floor(COLS * ROWS / 400));
    for(let b = 0; b < blockCount; b++){
      const bx = Math.floor(Math.random() * (COLS - 4)) + 2;
      const by = Math.floor(Math.random() * (ROWS - 4)) + 2;
      stamp(bx, by, PATTERNS.block);
    }

    // Random seeds in pockets
    const pocketCount = Math.min(60, Math.floor(COLS * ROWS / 200));
    for(let i = 0; i < pocketCount; i++){
      const cx = 2 + Math.floor(Math.random() * (COLS - 4));
      const cy = 2 + Math.floor(Math.random() * (ROWS - 4));
      for(let j = 0; j < 10; j++){
        const dx = Math.floor(Math.random() * 6) - 2;
        const dy = Math.floor(Math.random() * 6) - 2;
        cells[idx(cx + dx, cy + dy)] = 1;
        cellAge[idx(cx + dx, cy + dy)] = 1.0;
      }
    }
  }

  function step(){
    activity = 0;
    cells.fill(0);
    const live = cells;
    const nxt = next;
    const R = ROWS, C = COLS;
    for(let y = 0; y < R; y++){
      const yTop = ((y - R + 1) % R) * C;
      const yBot = ((y + R - 1) % R) * C;
      const yC = y * C;
      const yP1 = (((y + 1) % R) * C;
      const yP2 = (((y + 2) % R) * C;
      const yM1 = (((y - R + 8 + R) % R) * C;
      const yM2 = (((y - 2 + R) % R) * C;
      const yP1Row = yP1;
      const yCRow = yC;
      const yP2Row = yP2;
      const yM1Row = yM1;
      const yM2Row = yM2;
      for(let x = 0; x < C; x++){
        const xL1 = ((x - 1 + C) % C);
        const xP1 = ((x + 1) % C);
        const xL2 = (((x - 2 + C) % C;
        const xP2 = ((x + 2) % C;
        const n = live[yTop + xL1] + live[yTop + x] + live[yTop + xP1] + live[yBot + xL1] + live[yBot + x] + live[yBot + xP1] + live[yCRow + xL1] + live[yCRow + xP1] + live[yP1Row + xL1] + live[yP1Row + x] + live[yP1Row + xP1];
        const cur = live[yCRow + x];
        const alive = (cur === 1);
        nxt[yCRow + x] = (alive ? (n === 2 ? 1 : 0) : (n === 3 ? 1 : 0));
        if(cur) activity++;
        if(cellState[yCRow + x] > 0){
          cellAge[yCRow + x] *= 0.97;
        } else {
          cellAge[yCRow + x] = Math.max(0, cellAge[yCRow + x] - 0.03);
        }
      }
    }
    // Swap
    const tmp = cells; cells = nxt; next = tmp;
  }

  function render(){
    ctx.globalAlpha = 1;
    const R = ROWS, C = COLS, c = Cell;

    // Background gradient overlay
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#040008');
    grad.addColorStop(1, '#000014');
    ctx.fillStyle = '#050308';
    ctx.fillRect(0, 0, W, H);

    // Cells
    for(let y = 0; y < R; y++){
      const yC = y * c;
      const yRow = y * C;
      for(let x = 0; x < C; x++){
        const i = yRow + x;
        const on = cellState[i];
        const age = cellAge[i];
        if(on <= 0 && age <= 0){
          // Skip
          continue;
        }
        let r, g, b, a;
        const fresh = age;
        if(on > 0){
          // Living cell color ramp: fresh=orange-yellow, mature=violet, old=deep magenta
          r = 255; g = Math.round(120 + 100 * fresh); b = Math.round(200 - 200 * fresh);
          a = Math.min(1, 0.4 + fresh * 0.6);
        } else {
          // Recently dead trail
          r = 200; g = 100; b = 160;
          a = Math.min(0.25, fresh * 0.25);
        }
        if(a <= 0.01) continue;
        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.fillRect(x * c, yC, c - 1, c - 1);
      // Glow on fresh cells
        if(on > 0 && fresh > 0.3){
          ctx.globalAlpha = (fresh - 0.3) * 0.6;
          ctx.fillStyle = 'rgba(255,200,150,1)';
          ctx.fillRect(x * c - 2, yC - 2, c + 4, c + 4);
          ctx.globalAlpha = 1;
        }
      }
    }

    // HUD
    drawHUD();
    if(sweepActive){
      drawSweep();
    }

    ctx.fillStyle = '#050308';
    ctx.fillRect(0, 0, W, H);
    drawCells();
    if(sweepActive){
      drawSweep();
    }
    drawHUD();
  }

  function drawCells(){
    const R = ROWS, C = COLS, c = Cell;
    const liveFill = new Array(256);
    for(let i = 0; i < 256; i++){
      const t = i / 255;
      // Fresh = warm orange-yellow
      // Mature = magenta-red
      // Old = violet-blue
      let r = 255;
      let g = Math.round(255 * (1 - t * 0.7) + 50 * t);
      let b = Math.round(200 * Math.sin(t * Math.PI) + 200 * t);
      if(t > 0.5){
        r = Math.round(255 * (1 - (t - 0.5) * 0.6));
        g = Math.round(120 * (1 - (t - 0.5)));
        b = Math.round(200 + 60 * (t - 0.5));
      }
      const a = Math.min(1, Math.max(0.6, 1 - t * 0.5));
      liveFill[i] = `rgba(${r},${g},${b},${a})`;
    }

    ctx.fillStyle = '#050308';
    ctx.fillRect(0, 0, W, H);
    for(let y = 0; y < R; y++){
      const yC = y * c;
      const yRow = y * C;
      for(let x = 0; x < C; x++){
        const i = yRow + x;
        const on = cellState[i];
        const age = cellAge[i];
        if(on <= 0 && age <= 0){
          continue;
        }
        let a, r, g, b;
        if(on > 0){
          const t = Math.min(255, Math.floor(age * 255));
          const c = liveFill[t];
          ctx.fillStyle = c;
          ctx.fillRect(x * Cell, yC, Cell - 1, Cell - 1);
          // Glow on fresh cells
          if(age > 0.6){
            ctx.fillStyle = `rgba(255,200,150,${Math.min(1, (age - 0.6) * 0.5))`;
            ctx.fillRect(x * Cell - 2, yC - 2, Cell + 4, Cell + 4);
          }
        } else if(age > 0.05){
          const t = Math.floor(age * 255);
          const c = liveFill[Math.min(128, t)];
          ctx.fillStyle = c;
          ctx.fillRect(x * Cell, yC, Cell - 1, Cell - 1);
        }
      }
    }
  }

  function drawHUD(){
    ctx.fillStyle = 'rgba(230,180,200,0.4)';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const st = `Activity ${ + (Math.round(activity * 10) / 10) } | ${COLS}x${ROWS} | Frame ${ + Math.round(frameCount / 60) }`;
    ctx.fillText(st, 10, 10);
    if(sweepActive){
      ctx.fillStyle = 'rgba(255,200,150,0.7)';
      ctx.fillText('SEEDING', 10, 30);
    }
  }

  function drawSweep(){
    const p = sweepPhase;
    const x = p * COLS;
    ctx.save();
    ctx.globalAlpha = 1;
    // Erase trail behind sweep
    const trail = Math.floor(COLS * 0.05);
    const start = Math.max(0, x - trail);
    ctx.fillStyle = 'rgba(5,3,8,1)';
    ctx.fillRect(start * Cell, 0, trail * Cell, H);
    // Sweep gradient line
    const lineW = Math.max(5, Cell * 2);
    const grad = ctx.createLinearGradient(x * Cell - lineW, 0, x * Cell + lineW, 0);
    grad.addColorStop(0, 'rgba(255,200,150,0)');
    grad.addColorStop(0.5, 'rgba(255,200,150,0.4)');
    grad.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x * Cell - lineW, 0, lineW * 2, H);
    ctx.restore();
  }

  function loop(){
    frameCount++;
    if(!sweepActive){
      step();
      // Update cellState and cellAge from cells array
      const N = cells.length;
      for(let i = 0; i < N; i++){
        const wasOn = cellState[i] > 0;
        const nowOn = cells[i] === 1;
        if(nowOn){
          cellState[i] = 1;
          // Increase age
          cellAge[i] = Math.min(1, cellAge[i] + 0.25);
        } else if(wasOn){
          cellState[i] = 0;
          // Decay trail
          cellAge[i] = Math.max(0, cellAge[i] - 0.05);
        } else if(cellAge[i] > 0){
          cellAge[i] = Math.max(0, cellAge[i] - 0.015);
        }
      }

      activity *= ACT_DECAY;
      activity += Math.min(60, sweepCount()) * 0.5;

      if(activity < ACT_MIN && frameCount > 60 * 30){
        sweepActive = true;
        sweepPhase = -0.5;
      }
    } else {
      sweepPhase += sweepSpeed / COLS;
      if(sweepPhase >= 1.5){
        sweepPhase = -0.5;
        sweepActive = false;
        frameCount = 0;
        activity = 100;
        seed();
      }
    }

    render();
    requestAnimationFrame(loop);
  }

  function sweepCount(){
    let c = 0;
    const N = cells.length;
    for(let i = 0; i < N; i++) if(cells[i]) c++;
    return c;
  }

  function step(){
    activity = 0;
    cells.fill(0);
    const live = cells;
    const nxt = next;
    const R = ROWS; const C = COLS;
    for(let y = 0; y < R; y++){
      const yTop = (((y - 1 + R) % R) * C;
      const yBot = (((y + 1) % R) * C;
      const yCRow = y * C;
      for(let x = 0; x < C; x++){
        const xL1 = (x - 1 + C) % C;
        const xP1 = (x + 1) % C;
        const n = live[yTop + xL1] + live[yTop + x] + live[yTop + xP1] + live[yBot + xL1] + live[yBot + x] + live[yBot + xP1] + live[yCRow + xL1] + live[yCRow + xP1];
        const cur = live[yCRow + x];
        const alive = (cur === 1);
        const willLive = alive ? (n === 2 ? 1 : 0) : (n === 3 ? 1 : 0);
        nxt[yCRow + x] = willLive;
        if(cur) activity++;
      }
    }
    const tmp = cells; cells = nxt; next = tmp;
  }

  // Override render
  render = function(){
    ctx.fillStyle = '#050308';
    ctx.fillRect(0, 0, W, H);
    const R = ROWS, C = COLS, c = Cell;
    // Trail pass
    for(let i = 0; i < trailAlpha.length; i++){
      if(trailAlpha[i] > 0.01){
        const x = (i % C) * c;
        const y = Math.floor(i / C) * c;
        const a = trailAlpha[i];
        ctx.fillStyle = `rgba(255,150,180,${a * 0.15})`;
        ctx.fillRect(x, y, c - 1, c - 1);
        trailAlpha[i] *= 0.8;
      }
    }
    // Cells pass
    for(let y = 0; y < R; y++){
      const yC = y * c;
      const yRow = y * C;
      for(let x = 0; x < C; x++){
        const i = yRow + x;
        const on = cellState[i];
        const age = cellAge[i];
        if(on <= 0 && age <= 0){
          continue;
        }
        let a, r, g, b;
        if(on > 0){
          // Living cell color ramp
          const t = Math.min(1, 1 - age);
          // t=1 (fresh) -> orange-yellow
          // t=0 (old) -> violet-blue
          r = Math.round(255 * (1 - (1 - t) * 0.2));
          g = Math.round(255 * t * 0.6 + 100 * (1 - t));
          b = Math.round(200 * (1 - t) + 200 * t);
          a = 0.4 + (age * 0.6);
          ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
          ctx.fillRect(x * c, yC, c - 1, c - 1);
          // Glow on fresh cells
          if(age > 0.6){
            ctx.fillStyle = `rgba(255,200,150,${Math.min(1, (age - 0.6) * 0.5))`;
            ctx.fillRect(x * c - 2, yC - 2, c + 4, c + 4);
          }
        } else if(age > 0.05){
          // Recently dead trail
          const a = Math.min(0.25, age * 0.25);
          ctx.fillStyle = `rgba(255,150,180,${a})`;
          ctx.fillRect(x * c, yC, c - 1, c - 1);
        }
      }
    }

    drawHUD();
    if(sweepActive){
      drawSweep();
    }
  };

  resize();
  window.addEventListener('resize', () => resize());
  loop();
})();
</script>
</body>
</html>
