// ===== SUN =====

function sunPhase(t){return((t%SUN_CYC)/SUN_CYC+1)%1}
function sunAngle(t){return sunPhase(t)*Math.PI}

function sunPos(t){
  const a=sunAngle(t),r=Math.min(W,H)*0.42;
  return{x:W/2+Math.cos(a)*r,y:H*0.7-Math.sin(a)*r}
}

function sunHeight(t){return Math.sin(sunAngle(t))}

function dayBrightness(t){
  const h=sunHeight(t);
  return clamp(h*1.3+0.08,0,1);
}
