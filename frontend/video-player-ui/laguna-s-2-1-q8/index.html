<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Custom Video Player</title>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1c1c2e;
    --accent: #4f46e5;
    --accent-light: #818cf8;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --control-bg: rgba(28, 28, 46, 0.85);
    --border-radius: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .player {
    position: relative;
    width: 100%;
    max-width: 960px;
    border-radius: var(--border-radius);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    background: var(--card);
  }

  /* Drift animation background */
  .video-placeholder {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #1a1a2e, #16213e);
    background-size: 400% 400%;
    animation: driftBG 20s ease infinite;
    overflow: hidden;
  }

  @keyframes driftBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating particles */
  .particle {
    position: absolute;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    animation: float linear infinite;
  }

  @keyframes float {
    to {
      transform: translateY(-100vh) translateX(20px);
      opacity: 0;
    }
  }

  /* Play Button */
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: var(--transition);
    box-shadow: 0 8px 24px rgba(79, 70, 229, 0.5);
    border: none;
    outline: none;
  }

  .play-btn::before {
    content: '';
    border: solid var(--text-primary);
    border-width: 0 10px 16px 0;
    display: inline-block;
    padding: 5px;
    margin-left: 5px;
    transform: rotate(-30deg);
  }

  .play-btn.ripple {
    animation: ripple 0.7s ease-out;
  }

  @keyframes ripple {
    0% {
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7);
    }
    70% {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 0 0 0 20px rgba(79, 70, 229, 0);
    }
    100% {
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
    }
  }

  .play-btn:hover {
    background: var(--accent-light);
    transform: translate(-50%, -50%) scale(1.1);
  }

  /* Controls */
  .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    background: linear-gradient(transparent, var(--control-bg));
    backdrop-filter: blur(8px);
    opacity: 1;
    transition: opacity 0.3s ease;
    z-index: 5;
  }

  .controls.hide {
    opacity: 0;
  }

  .progress-container {
    position: relative;
    height: 6px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 12px;
    overflow: visible;
  }

  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--accent);
    width: 0%;
    border-radius: 3px;
    transition: width 0.1s linear;
  }

  .buffered-region {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: rgba(132, 204, 255, 0.6);
    border-radius: 3px;
  }

  /* Seek Tooltip */
  .seek-tooltip {
    position: absolute;
    top: -40px;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 20;
  }

  .seek-tooltip.visible {
    opacity: 1;
  }

  .seek-tooltip::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px;
    border-style: solid;
    border-color: var(--accent) transparent transparent transparent;
  }

  /* Control Row */
  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    font-size: 16px;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: var(--transition);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--accent-light);
  }

  .btn.active {
    color: var(--accent-light);
  }

  .progress-text {
    font-size: 13px;
    color: var(--text-secondary);
    min-width: 90px;
    text-align: center;
  }

  /* Volume Flyout */
  .volume-flyout {
    position: absolute;
    bottom: 60px;
    right: 0;
    background: var(--control-bg);
    border-radius: var(--border-radius);
    padding: 12px;
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: var(--transition);
    z-index: 10;
    width: 140px;
  }

  .volume-flyout.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .volume-slider {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
    outline: none;
    -webkit-appearance: none;
    margin-top: 8px;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* Settings Menu */
  .settings-menu {
    position: absolute;
    bottom: 60px;
    right: 0;
    background: var(--control-bg);
    border-radius: var(--border-radius);
    padding: 8px;
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: var(--transition);
    z-index: 10;
    min-width: 160px;
  }

  .settings-menu.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .settings-item {
    display: block;
    width: 100%;
    padding: 8px 12px;
    background: none;
    border: none;
    color: var(--text-primary);
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: var(--transition);
  }

  .settings-item:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--accent-light);
  }

  .settings-item.active {
    background: rgba(79, 70, 229, 0.2);
    color: var(--accent-light);
  }

  /* Playback Speed Indicator */
  .speed-indicator {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(79, 70, 229, 0.2);
    color: var(--accent-light);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 5;
  }

  .speed-indicator.visible {
    opacity: 1;
  }
</style>
</head>
<body>
<div class="player" id="player">
  <!-- Animated Video Placeholder -->
  <div class="video-placeholder" id="videoPlaceholder">
    <!-- Particles will be generated here -->
  </div>

  <!-- Center Play Button -->
  <button class="play-btn" id="playBtn"></button>

  <!-- Speed Indicator -->
  <div class="speed-indicator" id="speedIndicator">Speed: 1x</div>

  <!-- Controls Bar -->
  <div class="controls" id="controls">
    <!-- Seek Bar -->
    <div class="progress-container" id="progressContainer">
      <div class="buffered-region" id="bufferedRegion"></div>
      <div class="progress-fill" id="progressFill"></div>
      <div class="seek-tooltip" id="seekTooltip"></div>
    </div>

    <!-- Control Row -->
    <div class="control-row">
      <!-- Play/Pause -->
      <button class="btn" id="playPauseBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Mute -->
      <button class="btn" id="muteBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-.7-.1-1.4-.4-2.1l1.5 1.5c.3.4.5.9.5 1.5s-.2 1.1-.5 1.5l-1.5 1.5c.3.7.4 1.4.4 2.1h-1.2c-.1-.8-.3-1.6-.7-2.3l-1.3 1.3c.9 1 2.3 1.6 3.7 1.6 2.8 0 5-2.2 5-5s-2.2-5-5-5c-1.4 0-2.8.6-3.7 1.6l1.3 1.3c.4-.7.7-1.5.7-2.3V9h1.2z"/></svg>
      </button>

      <!-- Volume Slider -->
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">

      <!-- Progress Time -->
      <span class="progress-text" id="progressText">0:00 / 4:12</span>

      <!-- Fullscreen -->
      <button class="btn" id="fullscreenBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14c-1.7 0-3.2.8-4.2 2.1L0 13.3V17c0 1.1.9 2 2 2h5v-5zm0-4c1.1 0 2-.9 2-2s-.9-2-2-2S5 7.9 5 9s.9 2 2 2zm9 6.1l2.9-2.9c.6-.6.9-1.4.9-2.2V14c0 1.1-.9 2-2 2h-1.8zM12 2c0 1.1-.9 2-2 2S8 3.1 8 2s.9-2 2-2 2 .9 2 2zm6.1 5.9c-.9-1-2.3-1.6-3.7-1.6-1.1 0-2.1.4-2.9 1l1.3 1.3c.4-.4.9-.7 1.5-.7.8 0 1.5.7 1.5 1.5s-.7 1.5-1.5 1.5c-.6 0-1.1-.3-1.5-.7L11 14.1c.9 1.7 2.7 2.9 4.6 2.9 1.7 0 3.2-.8 4.2-2.1.9-1.3 1.5-2.9 1.5-4.6V7c-1.1-.2-2.3-.5-3.6-.9z"/></svg>
      </button>

      <!-- Settings -->
      <button class="btn" id="settingsBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM19.4 13a7.5 7.5 0 000-2l2-1.5-2-3.5-2.4 1a7.5 7.5 0 001.7-2l.4-2.5h-4l.4 2.5a7.5 7.5 0 001.7 2l-2.4 1-2-3.5L7 7.5l2 3.5a7.5 7.5 0 00-1.7 2L5 14.5H9l.4-2.5a7.5 7.5 0 011.7-2 7.5 7.5 0 012.3 2l2.4 1z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Settings Menu -->
<div class="settings-menu" id="settingsMenu">
  <button class="settings-item" data-speed="0.5">0.5x</button>
  <button class="settings-item" data-speed="0.75">0.75x</button>
  <button class="settings-item active" data-speed="1">Normal (1x)</button>
  <button class="settings-item" data-speed="1.25">1.25x</button>
  <button class="settings-item" data-speed="1.5">1.5x</button>
  <button class="settings-item" data-speed="2">2x</button>
</div>

<!-- Volume Flyout -->
<div class="volume-flyout" id="volumeFlyout">
  <input type="range" class="volume-slider" id="volumeSliderFlyout" min="0" max="100" value="80">
</div>

<script>
  // Generate floating particles
  const videoPlaceholder = document.getElementById('videoPlaceholder');
  for (let i = 0; i < 30; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');
    particle.style.width = `${Math.random() * 6 + 2}px`;
    particle.style.height = particle.style.width;
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;
    particle.style.animationDuration = `${Math.random() * 15 + 10}s`;
    particle.style.animationDelay = `${Math.random() * 5}s`;
    videoPlaceholder.appendChild(particle);
  }

  // State management
  let isPlaying = false;
  let isMuted = false;
  let volume = 80;
  let playbackSpeed = 1;
  let isSeeking = false;
  let isHovered = false;
  let controlsTimeout;

  // DOM Elements
  const playBtn = document.getElementById('playBtn');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeSliderFlyout = document.getElementById('volumeSliderFlyout');
  const controls = document.getElementById('controls');
  const progressContainer = document.getElementById('progressContainer');
  const progressFill = document.getElementById('progressFill');
  const bufferedRegion = document.getElementById('bufferedRegion');
  const seekTooltip = document.getElementById('seekTooltip');
  const progressText = document.getElementById('progressText');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  const volumeFlyout = document.getElementById('volumeFlyout');
  const speedIndicator = document.getElementById('speedIndicator');

  // Format time
  function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec.toString().padStart(2, '0')}`;
  }

  // Update progress bar
  function updateProgress() {
    if (!isPlaying || isSeeking) return;

    const totalDuration = 252; // 4:12 in seconds
    const currentTime = (Date.now() % totalDuration) / 1000;
    const percent = ((currentTime % totalDuration) / totalDuration) * 100;

    progressFill.style.width = `${percent}%`;
    bufferedRegion.style.width = `${Math.min(percent + 20, 100)}%`;
    progressText.textContent = `${formatTime(currentTime)} / 4:12`;
  }

  // Play/Pause toggle
  function togglePlay() {
    isPlaying = !isPlaying;
    playBtn.style.display = isPlaying ? 'none' : 'flex';

    if (isPlaying) {
      // Reset position if ended
      const currentPercent = parseFloat(progressFill.style.width || 0);
      if (currentPercent >= 99) {
        progressFill.style.width = '0%';
        bufferedRegion.style.width = '20%';
      }
      animateProgress();
    }
  }

  // Continuous progress animation
  function animateProgress() {
    if (!isPlaying) return;
    updateProgress();
    requestAnimationFrame(animateProgress);
  }

  // Handle seek
  function handleSeek(e) {
    const rect = progressContainer.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    const time = percent * 252;

    progressFill.style.width = `${percent * 100}%`;
    bufferedRegion.style.width = `${Math.min(percent * 100 + 20, 100)}%`;
    progressText.textContent = `${formatTime(time)} / 4:12`;
    seekTooltip.textContent = formatTime(time);
  }

  // Show seek tooltip
  function showTooltip(e) {
    if (!isPlaying) return;
    const rect = progressContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    seekTooltip.style.left = `${x}px`;
    seekTooltip.classList.add('visible');
  }

  // Hide seek tooltip
  function hideTooltip() {
    seekTooltip.classList.remove('visible');
  }

  // Mute toggle
  function toggleMute() {
    isMuted = !isMuted;
    const icon = muteBtn.querySelector('svg');
    if (isMuted) {
      icon.innerHTML = '<path d="M16.5 12c0-1.8-.8-3.4-2-4.5l-1.5 1.5c.8.9 1.3 2.1 1.3 3.5s-.5 2.6-1.3 3.5l1.5 1.5c1.2-1.1 2-2.7 2-4.5zm3.2.5h3.3v3h-3.3v-3zm-1.8-8.9l-1.5 1.5c1.8.9 3 2.7 3 4.9 0 1.5-.5 2.9-1.3 4l1.6 1.6c1.9-1.8 3-4.3 3-6.9 0-2.6-1.1-5-2.9-6.9l-1.6 1.7c.5 1.1.8 2.3.8 3.5s-.3 2.4-.8 3.5l-1.6 1.6c1.8.9 3 2.7 3 4.9 0 1.5-.5 2.9-1.3 4l1.6 1.6c1.9-1.8 3-4.4 3-7 0-2.7-1.1-5.2-2.9-7z"/>';
    } else {
      icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-.7-.1-1.4-.4-2.1l1.5 1.5c.3.4.5.9.5 1.5s-.2 1.1-.5 1.5l-1.5 1.5c.3.7.4 1.4.4 2.1h-1.2c-.1-.8-.3-1.6-.7-2.3l-1.3 1.3c.9 1 2.3 1.6 3.7 1.6 2.8 0 5-2.2 5-5s-2.2-5-5-5c-1.4 0-2.8.6-3.7 1.6l1.3 1.3c.4-.7.7-1.5.7-2.3V9h1.2z"/>';
    }
  }

  // Show/hide controls
  function updateControlsVisibility() {
    clearTimeout(controlsTimeout);
    controls.classList.remove('hide');

    if (isPlaying && isHovered) {
      controlsTimeout = setTimeout(() => {
        controls.classList.add('hide');
      }, 3000);
    }
  }

  // Speed change
  function changeSpeed(speed) {
    playbackSpeed = speed;
    document.querySelectorAll('.settings-item').forEach(item => {
      item.classList.toggle('active', item.dataset.speed == speed);
    });
    speedIndicator.textContent = `Speed: ${speed}x`;
    speedIndicator.classList.add('visible');
    setTimeout(() => {
      speedIndicator.classList.remove('visible');
    }, 2000);
  }

  // Event Listeners
  playBtn.addEventListener('click', () => {
    playBtn.classList.add('ripple');
    setTimeout(() => playBtn.classList.remove('ripple'), 700);
    togglePlay();
  });

  playPauseBtn.addEventListener('click', togglePlay);

  muteBtn.addEventListener('click', toggleMute);

  volumeSlider.addEventListener('input', (e) => {
    volume = e.target.value;
    volumeSliderFlyout.value = volume;
    isMuted = volume == 0;
  });

  volumeSliderFlyout.addEventListener('input', (e) => {
    volume = e.target.value;
    volumeSlider.value = volume;
    isMuted = volume == 0;
  });

  progressContainer.addEventListener('mousemove', (e) => {
    showTooltip(e);
    if (isPlaying) {
      isHovered = true;
      updateControlsVisibility();
    }
  });

  progressContainer.addEventListener('mouseleave', hideTooltip);

  progressContainer.addEventListener('click', (e) => {
    handleSeek(e);
  });

  progressContainer.addEventListener('mousemove', (e) => {
    isSeeking = true;
    handleSeek(e);
    setTimeout(() => isSeeking = false, 100);
  });

  // Mouse move to show controls
  document.querySelector('.player').addEventListener('mousemove', () => {
    isHovered = true;
    if (isPlaying) updateControlsVisibility();
  });

  document.querySelector('.player').addEventListener('mouseleave', () => {
    isHovered = false;
  });

  fullscreenBtn.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.querySelector('.player').requestFullscreen();
    }
  });

  settingsBtn.addEventListener('click', () => {
    settingsMenu.classList.toggle('visible');
  });

  document.querySelectorAll('.settings-item').forEach(item => {
    item.addEventListener('click', () => {
      changeSpeed(item.dataset.speed);
      settingsMenu.classList.remove('visible');
    });
  });

  // Volume flyout
  muteBtn.addEventListener('mouseenter', () => {
    volumeFlyout.classList.add('visible');
  });

  volumeFlyout.addEventListener('mouseleave', () => {
    volumeFlyout.classList.remove('visible');
  });

  // Click outside to close menus
  document.addEventListener('click', (e) => {
    if (!settingsBtn.contains(e.target) && !settingsMenu.contains(e.target)) {
      settingsMenu.classList.remove('visible');
    }
    if (!muteBtn.contains(e.target) && !volumeFlyout.contains(e.target)) {
      volumeFlyout.classList.remove('visible');
    }
  });

  // Initialize
  volumeSlider.value = volume;
  volumeSliderFlyout.value = volume;

  // Start animation loop
  setInterval(updateProgress, 500);
</script>
</body>
</html>
