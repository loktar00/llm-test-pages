<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheepdog Trials</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    background: radial-gradient(circle at 50% -10%, #1a0606 0%, #080404 55%, #050303 100%);
    color: #f0e6e6; padding: 3rem 1.5rem 4rem; }
  .wrap { max-width: 860px; margin: 0 auto; }
  a.back { color: #9a7a7a; text-decoration: none; font-size: 0.85rem; letter-spacing: 0.04em; }
  a.back:hover { color: #ff4747; }
  h1 { margin: 1.5rem 0 0.25rem; font-size: clamp(1.6rem, 5vw, 2.6rem); letter-spacing: 0.05em; text-transform: uppercase; }
  p.brief { color: #9a7a7a; line-height: 1.7; max-width: 64ch; }
  .cards { display: grid; gap: 0.8rem; margin-top: 2rem; }
  a.card { display: block; padding: 1.1rem 1.4rem; border: 1px solid rgba(255,60,60,0.22);
    border-radius: 12px; background: rgba(255,40,40,0.04); color: #f0e6e6; text-decoration: none;
    transition: border-color .2s, background .2s, transform .2s; }
  a.card:hover { border-color: rgba(255,70,70,0.7); background: rgba(255,40,40,0.1); transform: translateY(-2px); }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .name { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.03em; }
  .muted { color: #9a7a7a; font-size: 0.85rem; }
  .badges { display: flex; gap: .45rem; margin-top: .55rem; flex-wrap: wrap; }
  .b { font-size: .68rem; padding: .18rem .55rem; border-radius: 99px; letter-spacing: .06em; text-transform: uppercase; }
  .b.complete { background: rgba(60,220,130,.12); color: #5fe3a1; border: 1px solid rgba(60,220,130,.35); }
  .b.truncated { background: rgba(255,190,60,.10); color: #ffc95e; border: 1px solid rgba(255,190,60,.3); }
  .b.degenerated { background: rgba(255,70,70,.10); color: #ff6a6a; border: 1px solid rgba(255,70,70,.35); }
  footer { color: #5a4444; font-size: .8rem; margin-top: 3rem; }
  /* live-thumbnail grid (section pages) */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-top: 2rem; }
  a.tile { display: block; border: 1px solid rgba(255,60,60,0.22); border-radius: 12px; overflow: hidden;
    background: rgba(255,40,40,0.04); color: #f0e6e6; text-decoration: none;
    transition: border-color .2s, transform .2s; }
  a.tile:hover { border-color: rgba(255,70,70,0.7); transform: translateY(-2px); }
  .thumbwrap { position: relative; aspect-ratio: 16/10; overflow: hidden; background: #000; }
  .thumbwrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile-cap { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem;
    padding: .65rem .85rem; }
  .tile-cap .name { font-size: .85rem; }
  /* compare view (prompt pages) */
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr));
    gap: 1.2rem; margin-top: 2rem; }
  .panel { border: 1px solid rgba(255,60,60,0.22); border-radius: 12px; overflow: hidden;
    background: rgba(255,40,40,0.04); }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: .6rem;
    flex-wrap: wrap; padding: .7rem 1rem; }
  .panel-head .name { font-weight: 700; font-size: .95rem; }
  .panel-head a.full { color: #ff4747; text-decoration: none; font-size: .8rem; letter-spacing: .05em; }
  .panel-head a.full:hover { text-decoration: underline; }
  .panel iframe { display: block; width: 100%; height: 430px; border: 0; background: #000; }
  .wrap.wide { max-width: 1240px; }
</style>
</head>
<body>
  <div class="wrap wide">
    <a class="back" href="../">&larr; Canvas Demos</a>
    <h1>Sheepdog Trials</h1>
    <p class="brief">3 run(s), live. Add a model, get a panel.</p>
    <div class="panels">
      <div class="panel">
        <div class="panel-head">
          <span class="name">Qwen3.6 27B Q8</span>
          <span class="muted">9301 tok &middot; <span class="b complete">complete</span></span>
          <a class="full" href="./qwen3-6-27b-q8xl/">open full &rarr;</a>
        </div>
        <iframe src="./qwen3-6-27b-q8xl/" loading="lazy" title="Qwen3.6 27B Q8"></iframe>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="name">Qwen3.6 35B A3B</span>
          <span class="muted">5128 tok &middot; <span class="b complete">complete</span></span>
          <a class="full" href="./qwen3-6-35b/">open full &rarr;</a>
        </div>
        <iframe src="./qwen3-6-35b/" loading="lazy" title="Qwen3.6 35B A3B"></iframe>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="name">Qwen3.6 35B CONTRAST160</span>
          <span class="muted">13764 tok &middot; <span class="b complete">complete</span></span>
          <a class="full" href="./qwen3-6-35b-contrast160/">open full &rarr;</a>
        </div>
        <iframe src="./qwen3-6-35b-contrast160/" loading="lazy" title="Qwen3.6 35B CONTRAST160"></iframe>
      </div>
    </div>
    <footer>github.com/loktar00/llm-test-pages</footer>
  </div>
</body>
</html>
