<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volcano Island</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</canvas>
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Time tracking
let startTime = performance.now();
let dayNightTime = 0;
const DAY_CYCLE = 60000; // 60 seconds

// Volcano state machine
const VOLCANO_STATES = {
  CALM: 0,
  RUMBLING: 1,
  ASH_PLUMES: 2,
  ERUPTION: 3,
  LAVA_FLOW: 4,
  COOLING: 5
};

let volcanoState = VOLCANO_STATES.CALM;
let stateTimer = 0;
let shakeX = 0, shakeY = 0;
let rumbleIntensity = 0;

// State durations (ms)
const STATE_DURATIONS = {
  [VOLCANO_STATES.CALM]: 8000,
  [VOLCANO_STATES.RUMBLING]: 3000,
  [VOLCANO_STATES.ASH_PLUMES]: 4000,
  [VOLCANO_STATES.ERUPTION]: 6000,
  [VOLCANO_STATES.LAVA_FLOW]: 5000,
  [VOLCANO_STATES.COOLING]: 4000
};

// Particles
let ashParticles = [];
let lavaBombs = [];
let smokeParticles = [];
let steamParticles = [];
let lavaFlows = [];
let coolingFlows = [];

// Birds
let birds = [];
const NUM_BIRDS = 12;

// Palm trees
let palmTrees = [];

// Shoreline
let shoreExtension = 0;
let targetShoreExtension = 0;

// Stars
let stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.5,
    size: Math.random() * 2 + 0.5,
    twinkle: Math.random() * Math.PI * 2
  });
}

function initBirds() {
  birds = [];
  for (let i = 0; i < NUM_BIRDS; i++) {
    birds.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.3 + H * 0.05,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 0.5,
      wingPhase: Math.random() * Math.PI * 2,
      wingSpeed: 3 + Math.random() * 3,
      fleeing: false,
      size: 4 + Math.random() * 4
    });
  }
}
initBirds();

function initPalmTrees() {
  palmTrees = [];
  const beachLeft = W * 0.15;
  const beachRight = W * 0.38;
  const beachRight2 = W * 0.62;
  const beachRight3 = W * 0.85;
  
  for (let i = 0; i < 5; i++) {
    palmTrees.push({
      x: beachLeft + Math.random() * (beachRight - beachLeft),
      baseY: H * 0.68 + Math.random() * 10,
      height: 60 + Math.random() * 40,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.8 + Math.random() * 0.5,
      swayAmount: 3 + Math.random() * 4,
      leafCount: 5 + Math.floor(Math.random() * 3),
      trunkWidth: 3 + Math.random() * 2
    });
  }
  for (let i = 0; i < 4; i++) {
    palmTrees.push({
      x: beachRight2 + Math.random() * (beachRight3 - beachRight2),
      baseY: H * 0.68 + Math.random() * 10,
      height: 60 + Math.random() * 40,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.8 + Math.random() * 0.5,
      swayAmount: 3 + Math.random() * 4,
      leafCount: 5 + Math.floor(Math.random() * 3),
      trunkWidth: 3 + Math.random() * 2
    });
  }
}
initPalmTrees();

// Volcano geometry
function getVolcanoTop() {
  return { x: W * 0.5, y: H * 0.28 };
}

function getCrater() {
  const top = getVolcanoTop();
  return { x: top.x, y: top.y + 5, width: 30, height: 8 };
}

function getBeachLeft() { return W * 0.12; }
function getBeachRight() { return W * 0.88; }
function getSeaLevel() { return H * 0.72; }

// Day/night colors
function getDayNightColors(t) {
  const cycle = (t % DAY_CYCLE) / DAY_CYCLE;
  
  // 0 = dawn, 0.25 = noon, 0.5 = dusk, 0.75 = midnight
  let skyTop, skyMid, skyBot, seaColor, sunY, moonY, brightness;
  
  if (cycle < 0.15) { // Dawn
    const p = cycle / 0.15;
    skyTop = lerpColor([15, 10, 40], [135, 170, 220], p);
    skyMid = lerpColor([30, 15, 50], [255, 180, 120], p);
    skyBot = lerpColor([20, 10, 30], [255, 200, 150], p);
    seaColor = lerpColor([10, 20, 50], [30, 80, 120], p);
    brightness = 0.2 + p * 0.8;
    sunY = H * 0.7 - p * H * 0.3;
    moonY = -H * 0.1;
  } else if (cycle < 0.4) { // Day
    const p = (cycle - 0.15) / 0.25;
    skyTop = lerpColor([135, 170, 220], [70, 130, 200], p);
    skyMid = lerpColor([255, 180, 120], [180, 210, 240], p);
    skyBot = lerpColor([255, 200, 150], [200, 230, 255], p);
    seaColor = lerpColor([30, 80, 120], [20, 100, 150], p);
    brightness = 1.0;
    sunY = H * 0.4 - Math.sin(p * Math.PI) * H * 0.25;
    moonY = -H * 0.1;
  } else if (cycle < 0.55) { // Dusk
    const p = (cycle - 0.4) / 0.15;
    skyTop = lerpColor([70, 130, 200], [40, 15, 60], p);
    skyMid = lerpColor([180, 210, 240], [200, 80, 60], p);
    skyBot = lerpColor([200, 230, 255], [255, 120, 50], p);
    seaColor = lerpColor([20, 100, 150], [15, 30, 60], p);
    brightness = 1.0 - p * 0.6;
    sunY = H * 0.4 + p * H * 0.3;
    moonY = -H * 0.1;
  } else if (cycle < 0.85) { // Night
    const p = (cycle - 0.55) / 0.3;
    skyTop = lerpColor([40, 15, 60], [10, 8, 30], p);
    skyMid = lerpColor([200, 80, 60], [20, 15, 40], p);
    skyBot = lerpColor([255, 120, 50], [15, 10, 30], p);
    seaColor = lerpColor([15, 30, 60], [8, 15, 40], p);
    brightness = 0.4 - p * 0.2;
    sunY = H * 0.8;
    moonY = H * 0.15 + Math.sin(p * Math.PI) * H * 0.1;
  } else { // Late night to dawn
    const p = (cycle - 0.85) / 0.15;
    skyTop = lerpColor([10, 8, 30], [15, 10, 40], p);
    skyMid = lerpColor([20, 15, 40], [30, 15, 50], p);
    skyBot = lerpColor([15, 10, 30], [20, 10, 30], p);
    seaColor = lerpColor([8, 15, 40], [10, 20, 50], p);
    brightness = 0.2 + p * 0;
    sunY = H * 0.8;
    moonY = H * 0.15 - p * H * 0.25;
  }
  
  return { skyTop, skyMid, skyBot, seaColor, brightness, sunY, moonY };
}

function lerpColor(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  return [
    Math.round(a[0] + (b[0] - a[0]) * t),
    Math.round(a[1] + (b[1] - a[1]) * t),
    Math.round(a[2] + (b[2] - a[2]) * t)
  ];
}

function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }
function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// Draw sky
function drawSky(colors) {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
  grad.addColorStop(0, rgb(colors.skyTop));
  grad.addColorStop(0.5, rgb(colors.skyMid));
  grad.addColorStop(1, rgb(colors.skyBot));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// Draw stars
function drawStars(brightness) {
  const alpha = Math.max(0, 1 - brightness * 1.5);
  if (alpha <= 0) return;
  
  const t = performance.now() / 1000;
  for (const star of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(t * 2 + star.twinkle);
    ctx.fillStyle = `rgba(255,255,240,${alpha * twinkle})`;
    ctx.beginPath();
    ctx.arc(star.x * W, star.y * H, star.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Draw sun/moon
function drawSunMoon(colors, brightness) {
  // Sun
  if (colors.sunY < H * 0.75 && colors.sunY > 0) {
    const sunAlpha = Math.max(0, Math.min(1, 1 - Math.abs(colors.sunY - H * 0.4) / (H * 0.5)));
    if (sunAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = sunAlpha;
      const grad = ctx.createRadialGradient(W * 0.75, colors.sunY, 0, W * 0.75, colors.sunY, 60);
      grad.addColorStop(0, 'rgba(255,255,200,1)');
      grad.addColorStop(0.3, 'rgba(255,220,100,0.8)');
      grad.addColorStop(1, 'rgba(255,200,50,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(W * 0.75, colors.sunY, 60, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#FFF8E0';
      ctx.beginPath();
      ctx.arc(W * 0.75, colors.sunY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  
  // Moon
  if (colors.moonY > 0 && colors.moonY < H * 0.7) {
    const moonAlpha = Math.max(0, 1 - brightness * 1.5);
    if (moonAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = moonAlpha;
      ctx.fillStyle = '#E8E8D0';
      ctx.beginPath();
      ctx.arc(W * 0.25, colors.moonY, 25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb(colors.skyTop);
      ctx.beginPath();
      ctx.arc(W * 0.25 + 8, colors.moonY - 5, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// Draw sea
function drawSea(colors, time) {
  const seaLevel = getSeaLevel();
  const seaGrad = ctx.createLinearGradient(0, seaLevel, 0, H);
  seaGrad.addColorStop(0, rgb(colors.seaColor));
  seaGrad.addColorStop(1, rgb(lerpColor(colors.seaColor, [0, 0, 0], 0.5)));
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, seaLevel, W, H - seaLevel);
  
  // Waves
  const t = time / 1000;
  ctx.strokeStyle = rgba(lerpColor([255, 255, 255], colors.seaColor, 0.7), 0.3);
  ctx.lineWidth = 2;
  
  for (let row = 0; row < 5; row++) {
    const waveY = seaLevel + 10 + row * 25;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 5) {
      const y = waveY + Math.sin(x * 0.02 + t * 1.5 + row * 0.8) * 4 + Math.sin(x * 0.005 + t * 0.7) * 3;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  
  // Foam at shore
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for (let x = 0; x <= W; x += 3) {
    const foamY = seaLevel + Math.sin(x * 0.03 + t * 2) * 3;
    const foamH = 3 + Math.sin(x * 0.05 + t * 3) * 2;
    ctx.fillRect(x, foamY, 3, foamH);
  }
}

// Draw volcano
function drawVolcano(colors, brightness) {
  const top = getVolcanoTop();
  const seaLevel = getSeaLevel();
  
  // Main volcano body
  const volcanoGrad = ctx.createLinearGradient(top.x - 150, top.y, top.x + 150, seaLevel);
  const baseColor = lerpColor([80, 60, 50], [40, 30, 25], 1 - brightness);
  const darkColor = lerpColor([50, 35, 30], [20, 15, 12], 1 - brightness);
  volcanoGrad.addColorStop(0, rgb(baseColor));
  volcanoGrad.addColorStop(1, rgb(darkColor));
  
  ctx.fillStyle = volcanoGrad;
  ctx.beginPath();
  ctx.moveTo(top.x - 160, seaLevel);
  ctx.quadraticCurveTo(top.x - 120, top.y + 80, top.x - 20, top.y - 5);
  ctx.lineTo(top.x + 20, top.y - 5);
  ctx.quadraticCurveTo(top.x + 120, top.y + 80, top.x + 160, seaLevel);
  ctx.closePath();
  ctx.fill();
  
  // Rocky texture lines
  ctx.strokeStyle = rgba(lerpColor([60, 45, 35], [25, 18, 15], 1 - brightness), 0.4);
  ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) {
    const t = i / 12;
    const y = top.y + 10 + t * (seaLevel - top.y - 20);
    const spread = t * 140;
    ctx.beginPath();
    ctx.moveTo(top.x - spread * 0.8, y);
    ctx.lineTo(top.x + spread * 0.8, y);
    ctx.stroke();
  }
  
  // Crater
  const crater = getCrater();
  ctx.fillStyle = '#1a0a05';
  ctx.beginPath();
  ctx.ellipse(crater.x, crater.y, crater.width, crater.height, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Crater glow during eruption
  if (volcanoState === VOLCANO_STATES.ERUPTION || volcanoState === VOLCANO_STATES.ASH_PLUMES) {
    const glowIntensity = volcanoState === VOLCANO_STATES.ERUPTION ? 0.8 : 0.3;
    const glowGrad = ctx.createRadialGradient(crater.x, crater.y, 0, crater.x, crater.y, 40);
    glowGrad.addColorStop(0, `rgba(255,100,0,${glowIntensity})`);
    glowGrad.addColorStop(0.5, `rgba(255,50,0,${glowIntensity * 0.5})`);
    glowGrad.addColorStop(1, 'rgba(255,30,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(crater.x, crater.y, 40, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Draw beach
function drawBeach(colors, brightness) {
  const seaLevel = getSeaLevel();
  const beachLeft = getBeachLeft();
  const beachRight = getBeachRight();
  const ext = shoreExtension;
  
  const sandColor = lerpColor([210, 185, 140], [100, 85, 60], 1 - brightness);
  
  ctx.fillStyle = rgb(sandColor);
  ctx.beginPath();
  ctx.moveTo(beachLeft - ext, seaLevel + 5);
  ctx.quadraticCurveTo(beachLeft - ext * 0.5, seaLevel - 15, top.x - 160, seaLevel - 5);
  ctx.lineTo(top.x + 160, seaLevel - 5);
  ctx.quadraticCurveTo(beachRight + ext * 0.5, seaLevel - 15, beachRight + ext, seaLevel + 5);
  ctx.lineTo(beachRight + ext, seaLevel + 20);
  ctx.quadraticCurveTo(W * 0.5, seaLevel + 10, beachLeft - ext, seaLevel + 20);
  ctx.closePath();
  ctx.fill();
  
  // Wet sand near water
  const wetColor = lerpColor([180, 160, 120], [80, 70, 50], 1 - brightness);
  ctx.fillStyle = rgb(wetColor);
  ctx.beginPath();
  ctx.moveTo(beachLeft - ext, seaLevel + 5);
  ctx.quadraticCurveTo(W * 0.5, seaLevel + 12, beachRight + ext, seaLevel + 5);
  ctx.lineTo(beachRight + ext, seaLevel + 12);
  ctx.quadraticCurveTo(W * 0.5, seaLevel + 18, beachLeft - ext, seaLevel + 12);
  ctx.closePath();
  ctx.fill();
}

// Draw palm trees
function drawPalmTrees(time, colors, brightness) {
  const t = time / 1000;
  
  for (const tree of palmTrees) {
    const sway = Math.sin(t * tree.swaySpeed + tree.swayPhase) * tree.swayAmount;
    const baseColor = lerpColor([90, 60, 30], [40, 25, 12], 1 - brightness);
    const leafColor = lerpColor([40, 100, 30], [15, 40, 12], 1 - brightness);
    
    // Trunk
    const trunkTopX = tree.x + sway;
    const trunkTopY = tree.baseY - tree.height;
    
    ctx.strokeStyle = rgb(baseColor);
    ctx.lineWidth = tree.trunkWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tree.x, tree.baseY);
    ctx.quadraticCurveTo(tree.x + sway * 0.5, tree.baseY - tree.height * 0.5, trunkTopX, trunkTopY);
    ctx.stroke();
    
    // Leaves
    for (let i = 0; i < tree.leafCount; i++) {
      const angle = (i / tree.leafCount) * Math.PI * 2 + t * 0.3;
      const leafLen = 30 + Math.random() * 15;
      const leafSway = Math.sin(t * 1.5 + i) * 5;
      
      const endX = trunkTopX + Math.cos(angle) * leafLen + leafSway;
      const endY = trunkTopY + Math.sin(angle) * leafLen * 0.6 + 10;
      const cpX = trunkTopX + Math.cos(angle) * leafLen * 0.6 + leafSway * 0.5;
      const cpY = trunkTopY + Math.sin(angle) * leafLen * 0.2 - 5;
      
      ctx.strokeStyle = rgb(lerpColor(leafColor, [20, 60, 20], 0.3));
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(trunkTopX, trunkTopY);
      ctx.quadraticCurveTo(cpX, cpY, endX, endY);
      ctx.stroke();
      
      // Leaf detail
      ctx.strokeStyle = rgba(lerpColor(leafColor, [10, 30, 10], 0.5), 0.5);
      ctx.lineWidth = 1;
      for (let j = 0.3; j < 1; j += 0.2) {
        const lx = trunkTopX + (endX - trunkTopX) * j;
        const ly = trunkTopY + (endY - trunkTopY) * j;
        const perpX = -Math.sin(angle) * 3;
        const perpY = Math.cos(angle) * 3;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx + perpX, ly + perpY);
        ctx.stroke();
      }
    }
    
    // Coconuts
    ctx.fillStyle = rgb(lerpColor([80, 50, 20], [35, 22, 10], 1 - brightness));
    for (let i = 0; i < 2; i++) {
      const a = (i / 2) * Math.PI * 0.8 + Math.PI * 0.3;
      ctx.beginPath();
      ctx.arc(trunkTopX + Math.cos(a) * 5, trunkTopY + Math.sin(a) * 3 + 2, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Draw birds
function drawBirds(time) {
  const t = time / 1000;
  
  for (const bird of birds) {
    const wing = Math.sin(t * bird.wingSpeed + bird.wingPhase) * bird.size;
    
    ctx.strokeStyle = 'rgba(30,30,30,0.8)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bird.x - bird.size, bird.y + wing);
    ctx.quadraticCurveTo(bird.x - bird.size * 0.3, bird.y - Math.abs(wing) * 0.3, bird.x, bird.y);
    ctx.quadraticCurveTo(bird.x + bird.size * 0.3, bird.y - Math.abs(wing) * 0.3, bird.x + bird.size, bird.y + wing);
    ctx.stroke();
  }
}

// Update birds
function updateBirds(dt) {
  const isErupting = volcanoState === VOLCANO_STATES.ERUPTION || volcanoState === VOLCANO_STATES.LAVA_FLOW;
  
  for (const bird of birds) {
    if (isErupting && !bird.fleeing) {
      bird.fleeing = true;
      // Fly away from volcano
      const dx = bird.x - W * 0.5;
      bird.vx = Math.sign(dx) * (3 + Math.random() * 3);
      bird.vy = -2 - Math.random() * 2;
    }
    
    if (bird.fleeing && !isErupting) {
      bird.fleeing = false;
      bird.vx = (Math.random() - 0.5) * 2;
      bird.vy = (Math.random() - 0.5) * 0.5;
    }
    
    if (bird.fleeing) {
      bird.x += bird.vx;
      bird.y += bird.vy;
      bird.vy += 0.02; // slight gravity
    } else {
      bird.x += bird.vx;
      bird.y += bird.vy + Math.sin(performance.now() / 1000 + bird.wingPhase) * 0.3;
      
      // Gentle wandering
      if (Math.random() < 0.01) bird.vx += (Math.random() - 0.5) * 0.5;
      if (Math.random() < 0.01) bird.vy += (Math.random() - 0.5) * 0.2;
      
      bird.vx = Math.max(-2, Math.min(2, bird.vx));
      bird.vy = Math.max(-1, Math.min(1, bird.vy));
    }
    
    // Wrap around
    if (bird.x < -50) bird.x = W + 50;
    if (bird.x > W + 50) bird.x = -50;
    if (bird.y < 10) { bird.y = 10; bird.vy = Math.abs(bird.vy); }
    if (bird.y > H * 0.5) { bird.y = H * 0.5; bird.vy = -Math.abs(bird.vy); }
  }
}

// Spawn ash particles
function spawnAsh(count) {
  const crater = getCrater();
  for (let i = 0; i < count; i++) {
    ashParticles.push({
      x: crater.x + (Math.random() - 0.5) * crater.width,
      y: crater.y,
      vx: (Math.random() - 0.5) * 3,
      vy: -2 - Math.random() * 5,
      size: 2 + Math.random() * 4,
      life: 1,
      decay: 0.003 + Math.random() * 0.005,
      color: Math.random() > 0.5 ? [60, 55, 50] : [40, 35, 30]
    });
  }
}

// Spawn lava bomb
function spawnLavaBomb() {
  const crater = getCrater();
  const angle = -Math.PI * 0.2 - Math.random() * Math.PI * 0.6;
  const speed = 6 + Math.random() * 8;
  const side = Math.random() > 0.5 ? 1 : -1;
  
  lavaBombs.push({
    x: crater.x,
    y: crater.y,
    vx: Math.cos(angle) * speed * side,
    vy: Math.sin(angle) * speed,
    size: 3 + Math.random() * 5,
    life: 1,
    trail: [],
    side: side
  });
}

// Spawn smoke
function spawnSmoke(x, y, count) {
  for (let i = 0; i < count; i++) {
    smokeParticles.push({
      x: x + (Math.random() - 0.5) * 10,
      y: y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 1.5,
      vy: -0.5 - Math.random() * 1.5,
      size: 5 + Math.random() * 10,
      life: 1,
      decay: 0.005 + Math.random() * 0.008
    });
  }
}

// Spawn steam
function spawnSteam(x, y) {
  for (let i = 0; i < 15; i++) {
    steamParticles.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y,
      vx: (Math.random() - 0.5) * 3,
      vy: -1 - Math.random() * 3,
      size: 3 + Math.random() * 8,
      life: 1,
      decay: 0.01 + Math.random() * 0.015
    });
  }
}

// Spawn lava flow
function spawnLavaFlow() {
  const crater = getCrater();
  const side = Math.random() > 0.5 ? 1 : -1;
  const startX = crater.x + side * 10;
  const startY = crater.y + 5;
  
  lavaFlows.push({
    points: [{ x: startX, y: startY }],
    x: startX,
    y: startY,
    vx: side * (0.5 + Math.random() * 1),
    vy: 0.5 + Math.random() * 1,
    glow: 1,
    width: 3 + Math.random() * 4,
    active: true,
    reachedSea: false
  });
}

// Update particles
function updateParticles(dt) {
  const seaLevel = getSeaLevel();
  
  // Ash
  for (let i = ashParticles.length - 1; i >= 0; i--) {
    const p = ashParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02; // gravity
    p.vx *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0) ashParticles.splice(i, 1);
  }
  
  // Lava bombs
  for (let i = lavaBombs.length - 1; i >= 0; i--) {
    const b = lavaBombs[i];
    b.trail.push({ x: b.x, y: b.y, life: 1 });
    if (b.trail.length > 20) b.trail.shift();
    
    b.x += b.vx;
    b.y += b.vy;
    b.vy += 0.15; // gravity
    
    // Trail smoke
    if (Math.random() < 0.3) {
      smokeParticles.push({
        x: b.x + (Math.random() - 0.5) * 5,
        y: b.y + (Math.random() - 0.5) * 5,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -0.5 - Math.random(),
        size: 3 + Math.random() * 5,
        life: 0.7,
        decay: 0.015
      });
    }
    
    // Hit sea
    if (b.y >= seaLevel) {
      spawnSteam(b.x, seaLevel);
      spawnSmoke(b.x, seaLevel, 5);
      
      // Add to shore extension
      if (b.side > 0) {
        targetShoreExtension = Math.min(targetShoreExtension + 2, 80);
      } else {
        // Left side handled differently
      }
      
      lavaBombs.splice(i, 1);
      continue;
    }
    
    // Hit ground (volcano slope)
    const top = getVolcanoTop();
    const distFromCenter = Math.abs(b.x - top.x);
    const slopeY = top.y + 5 + (distFromCenter / 160) * (seaLevel - top.y - 10);
    if (b.y >= slopeY && b.y < seaLevel) {
      spawnSmoke(b.x, b.y, 3);
      lavaBombs.splice(i, 1);
      continue;
    }
    
    b.life -= 0.005;
    if (b.life <= 0 || b.y > H) lavaBombs.splice(i, 1);
  }
  
  // Smoke
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.size += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) smokeParticles.splice(i, 1);
  }
  
  // Steam
  for (let i = steamParticles.length - 1; i >= 0; i--) {
    const p = steamParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.size += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) steamParticles.splice(i, 1);
  }
  
  // Lava flows
  for (const flow of lavaFlows) {
    if (!flow.active) continue;
    
    flow.x += flow.vx;
    flow.y += flow.vy;
    flow.vy += 0.02;
    
    // Slight random deviation
    flow.vx += (Math.random() - 0.5) * 0.1;
    
    flow.points.push({ x: flow.x, y: flow.y });
    
    // Glow decreases over time
    flow.glow = Math.max(0.3, flow.glow - 0.001);
    
    // Check if reached sea
    if (flow.y >= seaLevel && !flow.reachedSea) {
      flow.reachedSea = true;
      spawnSteam(flow.x, seaLevel);
      targetShoreExtension = Math.min(targetShoreExtension + 5, 80);
    }
    
    // Stop if too far
    if (flow.y > seaLevel + 20 || flow.x < getBeachLeft() - 50 || flow.x > getBeachRight() + 50) {
      flow.active = false;
    }
  }
}

// Draw particles
function drawParticles() {
  const seaLevel = getSeaLevel();
  
  // Ash
  for (const p of ashParticles) {
    ctx.fillStyle = rgba(p.color, p.life * 0.8);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Lava bomb trails and bombs
  for (const b of lavaBombs) {
    // Trail
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const alpha = (i / b.trail.length) * 0.5;
      ctx.fillStyle = `rgba(255,${80 + i * 5},0,${alpha})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.size * (i / b.trail.length) * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Bomb
    const glowGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.size * 3);
    glowGrad.addColorStop(0, 'rgba(255,200,50,0.9)');
    glowGrad.addColorStop(0.4, 'rgba(255,100,0,0.6)');
    glowGrad.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size * 3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#FFD060';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Smoke
  for (const p of smokeParticles) {
    ctx.fillStyle = `rgba(80,75,70,${p.life * 0.4})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Steam
  for (const p of steamParticles) {
    ctx.fillStyle = `rgba(220,230,240,${p.life * 0.5})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Lava flows
  for (const flow of lavaFlows) {
    if (flow.points.length < 2) continue;
    
    // Glow
    ctx.strokeStyle = `rgba(255,80,0,${flow.glow * 0.3})`;
    ctx.lineWidth = flow.width * 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(flow.points[0].x, flow.points[0].y);
    for (let i = 1; i < flow.points.length; i++) {
      ctx.lineTo(flow.points[i].x, flow.points[i].y);
    }
    ctx.stroke();
    
    // Core
    ctx.strokeStyle = `rgba(255,${150 + flow.glow * 100},0,${flow.glow * 0.9})`;
    ctx.lineWidth = flow.width;
    ctx.beginPath();
    ctx.moveTo(flow.points[0].x, flow.points[0].y);
    for (let i = 1; i < flow.points.length; i++) {
      ctx.lineTo(flow.points[i].x, flow.points[i].y);
    }
    ctx.stroke();
    
    // Bright center
    ctx.strokeStyle = `rgba(255,240,150,${flow.glow * 0.6})`;
    ctx.lineWidth = flow.width * 0.4;
    ctx.beginPath();
    ctx.moveTo(flow.points[0].x, flow.points[0].y);
    for (let i = 1; i < flow.points.length; i++) {
      ctx.lineTo(flow.points[i].x, flow.points[i].y);
    }
    ctx.stroke();
  }
}

// Eruption light effect
function drawEruptionLight() {
  if (volcanoState === VOLCANO_STATES.ERUPTION) {
    const top = getVolcanoTop();
    const grad = ctx.createRadialGradient(top.x, top.y, 0, top.x, top.y, W * 0.4);
    grad.addColorStop(0, 'rgba(255,100,0,0.15)');
    grad.addColorStop(0.5, 'rgba(255,50,0,0.05)');
    grad.addColorStop(1, 'rgba(255,30,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
}

// Main update
function update(now) {
  const dt = 16; // approximate
  dayNightTime = now;
  
  // Volcano state machine
  stateTimer += dt;
  const duration = STATE_DURATIONS[volcanoState];
  
  if (stateTimer >= duration) {
    stateTimer = 0;
    volcanoState = (volcanoState + 1) % Object.keys(VOLCANO_STATES).length;
    
    // Reset on cycle complete
    if (volcanoState === VOLCANO_STATES.CALM) {
      ashParticles = [];
      lavaBombs = [];
      smokeParticles = [];
      steamParticles = [];
      lavaFlows = [];
      shoreExtension = 0;
      targetShoreExtension = 0;
      rumbleIntensity = 0;
    }
  }
  
  // State-specific behavior
  switch (volcanoState) {
    case VOLCANO_STATES.CALM:
      rumbleIntensity *= 0.95;
      break;
      
    case VOLCANO_STATES.RUMBLING:
      rumbleIntensity = Math.min(rumbleIntensity + 0.05, 1);
      shakeX = (Math.random() - 0.5) * rumbleIntensity * 4;
      shakeY = (Math.random() - 0.5) * rumbleIntensity * 3;
      break;
      
    case VOLCANO_STATES.ASH_PLUMES:
      rumbleIntensity = 0.5;
      shakeX = (Math.random() - 0.5) * 2;
      shakeY = (Math.random() - 0.5) * 1.5;
      if (Math.random() < 0.3) spawnAsh(3);
      break;
      
    case VOLCANO_STATES.ERUPTION:
      rumbleIntensity = 1;
      shakeX = (Math.random() - 0.5) * 8;
      shakeY = (Math.random() - 0.5) * 6;
      if (Math.random() < 0.15) spawnLavaBomb();
      if (Math.random() < 0.2) spawnAsh(5);
      if (Math.random() < 0.1) spawnSmoke(getCrater().x, getCrater().y, 3);
      break;
      
    case VOLCANO_STATES.LAVA_FLOW:
      rumbleIntensity = 0.6;
      shakeX = (Math.random() - 0.5) * 3;
      shakeY = (Math.random() - 0.5) * 2;
      if (Math.random() < 0.05) spawnLavaFlow();
      if (Math.random() < 0.1) spawnAsh(2);
      break;
      
    case VOLCANO_STATES.COOLING:
      rumbleIntensity *= 0.97;
      shakeX = (Math.random() - 0.5) * rumbleIntensity * 2;
      shakeY = (Math.random() - 0.5) * rumbleIntensity * 1.5;
      if (Math.random() < 0.05) spawnAsh(1);
      break;
  }
  
  // Smooth shore extension
  shoreExtension += (targetShoreExtension - shoreExtension) * 0.01;
  
  // Update birds
  updateBirds(dt);
  
  // Update particles
  updateParticles(dt);
}

// Main draw
function draw(now) {
  const colors = getDayNightColors(dayNightTime);
  const t = now / 1000;
  
  ctx.save();
  ctx.translate(shakeX, shakeY);
  
  // Sky
  drawSky(colors);
  drawStars(colors.brightness);
  drawSunMoon(colors, colors.brightness);
  
  // Sea
  drawSea(colors, now);
  
  // Beach
  drawBeach(colors, colors.brightness);
  
  // Volcano
  drawVolcano(colors, colors.brightness);
  
  // Palm trees
  drawPalmTrees(now, colors, colors.brightness);
  
  // Particles (behind birds)
  drawParticles();
  
  // Birds
  drawBirds(now);
  
  // Eruption light overlay
  drawEruptionLight();
  
  ctx.restore();
}

// Animation loop
let lastTime = 0;
function animate(now) {
  update(now);
  draw(now);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
