<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteor Storm Night</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const W = canvas.width;
  const H = canvas.height;

  // Ridge silhouette
  function drawRidge() {
    ctx.fillStyle = '#050505';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.7);
    let x = 0;
    while (x < W) {
      const seg = 40 + Math.random() * 30;
      const dip = H * 0.06 + Math.random() * 0.04;
      ctx.lineTo(x + seg, H * 0.7);
      ctx.quadraticCurveTo(x + seg / 2, H * 0.7 + dip, x + seg, H * 0.7);
      x += seg;
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();
  }

  function Meteor(x, y, len, speed, brightness) {
    return {
      x, y, len, speed, brightness,
      vx: speed * Math.cos(this.angle),
      vy: speed * Math.sin(this.angle),
      life: 1,
      fade: 0.002 + Math.random() * 0.003,
      angle: -Math.PI / 4 + (Math.random() - 0.5) * 0.4
    };
  }

  function Bolide(x, y) {
    return {
      x, y,
      vx: 2 + Math.random() * 2,
      vy: 2 + Math.random() * 1.5,
      brightness: 1,
      flash: 1,
      trail: []
    };
  }

  let meteors = [];
  let bolides = [];
  let wave = 0;
  let waveTime = 0;
  let waveDuration = 300;

  function spawnWave(intensity) {
    const count = Math.floor(intensity * 15);
    for (let i = 0; i < count; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H * 0.5;
      const len = 15 + Math.random() * 20;
      const speed = 3 + Math.random() * 4;
      const brightness = 0.5 + Math.random() * 0.5;
      meteors.push(new Meteor(x, y, len, speed, brightness));
    }

    if (Math.random() < intensity * 0.3) {
      const bx = Math.random() * W * 0.6 + W * 0.2;
      const by = Math.random() * H * 0.3 + H * 0.05;
      bolides.push(new Bolide(bx, by));
    }
  }

  function loop() {
    // Fade with trails
    ctx.fillStyle = 'rgba(0,0,0,0.03)';
    ctx.fillRect(0, 0, W, H);

    // Storm intensity wave
    const t = performance.now() * 0.001;
    const intensity = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(t * 0.2));

    waveTime++;
    if (waveTime >= waveDuration) {
      waveTime = 0;
      waveDuration = 250 + Math.random() * 200;
      spawnWave(intensity);
    }

    // Update and draw meteors
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.vx = m.speed * Math.cos(m.angle);
      m.vy = m.speed * Math.sin(m.angle);
      m.x += m.vx;
      m.y += m.vy;
      m.life -= m.fade;
      if (m.life <= 0 || m.x > W || m.y > H) {
        meteors.splice(i, 1);
        continue;
      }

      const grad = ctx.createLinearGradient(
        m.x, m.y,
        m.x - m.vx * m.len, m.y - m.vy * m.len
      );
      grad.addColorStop(0, `rgba(255,255,200,${m.brightness * m.life})`);
      grad.addColorStop(1, 'rgba(255,255,200,0)');

      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * m.len, m.y - m.vy * m.len);
      ctx.stroke();
    }

    // Update and draw bolides
    for (let i = bolides.length - 1; i >= 0; i--) {
      const b = bolides[i];

      // Flash sky
      if (b.flash > 0.001) {
        ctx.fillStyle = `rgba(255,255,255,${b.flash * 0.3})`;
        ctx.fillRect(0, 0, W, H);
        b.flash *= 0.92;
      }

      b.x += b.vx;
      b.y += b.vy;
      b.trail.push({ x: b.x, y: b.y, t: performance.now() });

      // Draw smoke train
      if (b.trail.length > 2) {
        ctx.strokeStyle = `rgba(100,100,120,${0.3 * b.brightness})`;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let j = 0; j < b.trail.length - 1; j++) {
          const a = b.trail[j];
          const c = b.trail[j + 1];
          const age = (performance.now() - a.t) * 0.0005;
          const alpha = Math.max(0, 0.4 * (1 - age));
          ctx.globalAlpha = alpha;
          if (j === 0) ctx.moveTo(a.x, a.y);
          ctx.lineTo(c.x, c.y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Draw bolide head and bright trail
      const headGrad = ctx.createLinearGradient(
        b.x, b.y,
        b.x - b.vx * 20, b.y - b.vy * 20
      );
      headGrad.addColorStop(0, `rgba(255,255,220,${b.brightness})`);
      headGrad.addColorStop(1, 'rgba(255,200,150,0)');
      ctx.strokeStyle = headGrad;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * 20, b.y - b.vy * 20);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fill();

      b.brightness *= 0.97;
      if (b.brightness < 0.01 && b.trail.length > 5) {
        bolides.splice(i, 1);
      }
    }

    // Draw ridge
    drawRidge();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
