<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Intersection</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, SCALE;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
  SCALE = Math.min(W, H) / 1000;
}
resize();
window.addEventListener('resize', resize);

// Road geometry
const LANE_W = 55;
const ROAD_W = LANE_W * 2;
const INTERSECTION_SIZE = ROAD_W * 2 + 10;
const STOP_LINE_DIST = INTERSECTION_SIZE / 2 + 5;
const CROSSWALK_W = 18;
const BUS_STOP_LEN = 100;
const BUS_STOP_OFFSET = 180;

// Directions: 0=North(southbound), 1=East(westbound), 2=South(northbound), 3=West(eastbound)
// Each direction has lanes: left-turn, straight

const DIR_ANGLES = [Math.PI / 2, 0, -Math.PI / 2, Math.PI];
const DIR_NAMES = ['S', 'W', 'N', 'E'];

// Traffic light state
const PHASES = [
  { name: 'NS-GT', ns: 'green', ew: 'red', nsLeft: 'green', ewLeft: 'red', dur: [6000, 12000] },
  { name: 'NS-Y', ns: 'yellow', ew: 'red', nsLeft: 'yellow', ewLeft: 'red', dur: [3000, 4000] },
  { name: 'EW-GT', ns: 'red', ew: 'green', nsLeft: 'red', ewLeft: 'green', dur: [6000, 12000] },
  { name: 'EW-Y', ns: 'red', ew: 'yellow', nsLeft: 'red', ewLeft: 'yellow', dur: [3000, 4000] },
];

let currentPhase = 0;
let phaseTimer = 0;
let phaseDuration = 8000;
let lightState = { ns: 'red', ew: 'red', nsLeft: 'red', ewLeft: 'red' };
let pedState = { ns: 'wait', ew: 'wait' };
let pedTimer = 0;
let pedPhase = 0;

// Cars
const cars = [];
const pedestrians = [];
let bus = null;
let busTimer = 0;

const CAR_COLORS = ['#c0392b', '#2980b9', '#27ae60', '#f39c12', '#8e44ad', '#1abc9c', '#e67e22', '#ecf0f1', '#34495e', '#d35400'];
const CAR_W = 28;
const CAR_H = 50;
const BUS_W = 34;
const BUS_H = 85;

class Car {
  constructor(dir, lane, isLeftTurn) {
    this.dir = dir;
    this.lane = lane; // 0=left-turn, 1=straight
    this.isLeftTurn = isLeftTurn;
    this.color = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
    this.w = CAR_W;
    this.h = CAR_H;
    this.speed = 0;
    this.maxSpeed = 120 + Math.random() * 40;
    this.accel = 80;
    this.decel = 150;
    this.stopped = false;
    this.runningYellow = Math.random() < 0.12;
    this.turning = false;
    this.turnProgress = 0;
    this.targetDir = (dir + 1) % 4;
    this.state = 'approaching';
    this.passedStop = false;
    this.spawned = false;
    this.remove = false;

    // Position based on direction
    const angle = DIR_ANGLES[dir];
    const laneOffset = lane === 0 ? -LANE_W / 2 : LANE_W / 2;
    const spawnDist = 400 + Math.random() * 200;

    this.x = CX + Math.cos(angle) * spawnDist + Math.cos(angle + Math.PI / 2) * laneOffset;
    this.y = CY + Math.sin(angle) * spawnDist + Math.sin(angle + Math.PI / 2) * laneOffset;
    this.angle = angle;
    this.laneOffset = laneOffset;
  }

  getTargetPos() {
    const angle = DIR_ANGLES[this.dir];
    const spawnDist = 400;
    return {
      x: CX + Math.cos(angle) * spawnDist + Math.cos(angle + Math.PI / 2) * this.laneOffset,
      y: CY + Math.sin(angle) * spawnDist + Math.sin(angle + Math.PI / 2) * this.laneOffset
    };
  }

  getStopLinePos() {
    const angle = DIR_ANGLES[this.dir];
    return {
      x: CX + Math.cos(angle) * STOP_LINE_DIST + Math.cos(angle + Math.PI / 2) * this.laneOffset,
      y: CY + Math.sin(angle) * STOP_LINE_DIST + Math.sin(angle + Math.PI / 2) * this.laneOffset
    };
  }

  distToStopLine() {
    const sl = this.getStopLinePos();
    const dx = this.x - sl.x;
    const dy = this.y - sl.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  distFromCenter() {
    return Math.sqrt((this.x - CX) ** 2 + (this.y - CY) ** 2);
  }

  isInIntersection() {
    return this.distFromCenter() < INTERSECTION_SIZE / 2 + 30;
  }

  update(dt, carAhead, lightColor, leftLightColor) {
    if (this.remove) return;

    const stopPos = this.getStopLinePos();
    const distToStop = this.distToStopLine();
    const angle = DIR_ANGLES[this.dir];

    // Determine if we should stop
    let shouldStop = false;
    let stopDist = 0;

    if (!this.passedStop) {
      const effectiveLight = this.isLeftTurn ? leftLightColor : lightColor;

      if (effectiveLight === 'red') {
        shouldStop = true;
        stopDist = 10;
      } else if (effectiveLight === 'yellow' && !this.runningYellow) {
        if (distToStop > 60) {
          shouldStop = true;
          stopDist = 10;
        }
      }

      // Car ahead in same lane
      if (carAhead && !carAhead.remove && !carAhead.turning) {
        const dx = carAhead.x - this.x;
        const dy = carAhead.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dot = dx * Math.cos(angle) + dy * Math.sin(angle);
        if (dot > 0 && dot < 200 && dist < 200) {
          if (carAhead.speed < 10 && dist < 80) {
            shouldStop = true;
            stopDist = 15;
          }
        }
      }
    }

    // Turning logic
    if (this.isLeftTurn && this.passedStop && !this.turning) {
      if (this.isInIntersection()) {
        this.turning = true;
        this.turnProgress = 0;
      }
    }

    if (this.turning) {
      this.turnProgress += dt * 1.5;
      if (this.turnProgress >= 1) {
        this.dir = this.targetDir;
        this.angle = DIR_ANGLES[this.dir];
        const laneOff = this.lane === 0 ? -LANE_W / 2 : LANE_W / 2;
        this.laneOffset = laneOff;
        this.turning = false;
        this.isLeftTurn = false;
        this.passedStop = false;
      }
      this.speed *= 0.95;
      return;
    }

    // Speed control
    let targetSpeed = this.maxSpeed;

    if (shouldStop) {
      targetSpeed = 0;
      if (distToStop < stopDist + 5) {
        this.speed = 0;
      } else {
        this.speed -= this.decel * dt;
      }
    } else {
      // Car following
      if (carAhead && !carAhead.remove && !carAhead.turning) {
        const dx = carAhead.x - this.x;
        const dy = carAhead.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dot = dx * Math.cos(angle) + dy * Math.sin(angle);
        if (dot > 0 && dot < 250) {
          const safeDist = 60 + carAhead.speed * 0.5;
          if (dist < safeDist) {
            targetSpeed = Math.max(0, carAhead.speed - (safeDist - dist) * 2);
          }
        }
      }

      // Slow down approaching intersection
      if (!this.passedStop && distToStop < 200 && distToStop > 50) {
        const effectiveLight = this.isLeftTurn ? leftLightColor : lightColor;
        if (effectiveLight === 'yellow') {
          targetSpeed = Math.min(targetSpeed, 60);
        }
      }

      this.speed += this.accel * dt;
    }

    this.speed = Math.max(0, Math.min(this.maxSpeed, this.speed));

    // Check if passed stop line
    if (!this.passedStop && distToStop < 20) {
      this.passedStop = true;
    }

    // Move
    if (!this.turning) {
      this.x += Math.cos(angle) * this.speed * dt;
      this.y += Math.sin(angle) * this.speed * dt;
    }

    // Remove if far past intersection
    if (this.passedStop && !this.isLeftTurn && this.distFromCenter() > 500) {
      this.remove = true;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle - Math.PI / 2);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-this.w / 2 + 2, -this.h / 2 + 2, this.w, this.h);

    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 4);
    ctx.fill();

    // Windshield
    ctx.fillStyle = 'rgba(150,200,255,0.5)';
    ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 5, this.w - 6, 12);

    // Rear window
    ctx.fillStyle = 'rgba(150,200,255,0.3)';
    ctx.fillRect(-this.w / 2 + 4, this.h / 2 - 14, this.w - 8, 10);

    // Headlights
    ctx.fillStyle = '#fffde7';
    ctx.shadowColor = '#fff9c4';
    ctx.shadowBlur = 15;
    ctx.fillRect(-this.w / 2 + 2, -this.h / 2, 6, 4);
    ctx.fillRect(this.w / 2 - 8, -this.h / 2, 6, 4);
    ctx.shadowBlur = 0;

    // Tail lights
    ctx.fillStyle = '#ff1744';
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 8;
    ctx.fillRect(-this.w / 2 + 2, this.h / 2 - 4, 6, 4);
    ctx.fillRect(this.w / 2 - 8, this.h / 2 - 4, 6, 4);
    ctx.shadowBlur = 0;

    ctx.restore();

    // Headlight beams
    if (this.speed > 0) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      const grad = ctx.createRadialGradient(0, -this.h / 2, 2, 0, -this.h / 2 - 120, 80);
      grad.addColorStop(0, 'rgba(255,253,200,0.15)');
      grad.addColorStop(1, 'rgba(255,253,200,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-20, -this.h / 2);
      ctx.lineTo(-40, -this.h / 2 - 150);
      ctx.lineTo(40, -this.h / 2 - 150);
      ctx.lineTo(20, -this.h / 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

class Bus {
  constructor() {
    this.dir = 0; // Southbound
    this.lane = 1;
    this.w = BUS_W;
    this.h = BUS_H;
    this.color = '#f57f17';
    this.speed = 0;
    this.maxSpeed = 100;
    this.accel = 60;
    this.decel = 120;
    this.angle = DIR_ANGLES[0];
    this.laneOffset = LANE_W / 2;
    this.stopped = false;
    this.stopTimer = 0;
    this.stopDuration = 5000 + Math.random() * 4000;
    this.state = 'approaching';
    this.passedStop = false;
    this.remove = false;

    const angle = DIR_ANGLES[0];
    this.x = CX + Math.cos(angle) * 450 + Math.cos(angle + Math.PI / 2) * this.laneOffset;
    this.y = CY + Math.sin(angle) * 450 + Math.sin(angle + Math.PI / 2) * this.laneOffset;

    this.busStopX = CX + Math.cos(angle + Math.PI / 2) * (ROAD_W / 2 + 15);
    this.busStopY = CY + Math.sin(angle) * BUS_STOP_OFFSET;
  }

  getStopLinePos() {
    const angle = DIR_ANGLES[this.dir];
    return {
      x: CX + Math.cos(angle) * STOP_LINE_DIST + Math.cos(angle + Math.PI / 2) * this.laneOffset,
      y: CY + Math.sin(angle) * STOP_LINE_DIST + Math.sin(angle + Math.PI / 2) * this.laneOffset
    };
  }

  distToStopLine() {
    const sl = this.getStopLinePos();
    return Math.sqrt((this.x - sl.x) ** 2 + (this.y - sl.y) ** 2);
  }

  distFromCenter() {
    return Math.sqrt((this.x - CX) ** 2 + (this.y - CY) ** 2);
  }

  update(dt, carAhead, lightColor) {
    if (this.remove) return;

    const angle = DIR_ANGLES[this.dir];
    const distToStop = this.distToStopLine();

    // Bus stop logic
    if (this.state === 'approaching') {
      const distToBusStop = Math.sqrt((this.x - this.busStopX) ** 2 + (this.y - this.busStopY) ** 2);
      if (distToBusStop < 30) {
        this.state = 'stopping';
      }
    }

    if (this.state === 'stopping') {
      this.speed -= this.decel * dt;
      if (this.speed <= 0) {
        this.speed = 0;
        this.state = 'stopped';
        this.stopTimer = this.stopDuration;
      }
    }

    if (this.state === 'stopped') {
      this.stopTimer -= dt * 1000;
      if (this.stopTimer <= 0) {
        this.state = 'departing';
      }
    }

    if (this.state === 'departing' || this.state === 'approaching') {
      let shouldStop = false;

      if (!this.passedStop && lightColor === 'red') {
        shouldStop = true;
      }

      if (carAhead && !carAhead.remove) {
        const dx = carAhead.x - this.x;
        const dy = carAhead.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const dot = dx * Math.cos(angle) + dy * Math.sin(angle);
        if (dot > 0 && dot < 200 && dist < 100 && carAhead.speed < 10) {
          shouldStop = true;
        }
      }

      if (shouldStop) {
        this.speed -= this.decel * dt;
      } else {
        this.speed += this.accel * dt;
      }
      this.speed = Math.max(0, Math.min(this.maxSpeed, this.speed));

      if (!this.passedStop && distToStop < 20) {
        this.passedStop = true;
      }
    }

    this.x += Math.cos(angle) * this.speed * dt;
    this.y += Math.sin(angle) * this.speed * dt;

    if (this.distFromCenter() > 550) {
      this.remove = true;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle - Math.PI / 2);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-this.w / 2 + 2, -this.h / 2 + 2, this.w, this.h);

    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.roundRect(-this.w / 2, -this.h / 2, this.w, this.h, 5);
    ctx.fill();

    // Stripe
    ctx.fillStyle = '#1b5e20';
    ctx.fillRect(-this.w / 2, -this.h / 2 + 20, this.w, 8);

    // Windows
    ctx.fillStyle = 'rgba(150,200,255,0.6)';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(-this.w / 2 + 3, -this.h / 2 + 30 + i * 14, this.w - 6, 10);
    }

    // Headlights
    ctx.fillStyle = '#fffde7';
    ctx.shadowColor = '#fff9c4';
    ctx.shadowBlur = 12;
    ctx.fillRect(-this.w / 2 + 2, -this.h / 2, 7, 5);
    ctx.fillRect(this.w / 2 - 9, -this.h / 2, 7, 5);
    ctx.shadowBlur = 0;

    // Tail lights
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(-this.w / 2 + 2, this.h / 2 - 5, 7, 5);
    ctx.fillRect(this.w / 2 - 9, this.h / 2 - 5, 7, 5);

    // "BUS" text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BUS', 0, 5);

    ctx.restore();

    // Headlight beams
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    const grad = ctx.createRadialGradient(0, -this.h / 2, 2, 0, -this.h / 2 - 160, 100);
    grad.addColorStop(0, 'rgba(255,253,200,0.12)');
    grad.addColorStop(1, 'rgba(255,253,200,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-25, -this.h / 2);
    ctx.lineTo(-50, -this.h / 2 - 180);
    ctx.lineTo(50, -this.h / 2 - 180);
    ctx.lineTo(25, -this.h / 2);
    ctx.fill();
    ctx.restore();
  }
}

class Pedestrian {
  constructor(side) {
    this.side = side; // 0=N, 1=E, 2=S, 3=W
    this.speed = 30 + Math.random() * 20;
    this.color = `hsl(${Math.random() * 360}, 60%, 60%)`;
    this.remove = false;
    this.crossing = false;
    this.crossProgress = 0;
    this.waiting = true;
    this.waitTimer = 0;

    const hw = INTERSECTION_SIZE / 2 + CROSSWALK_W / 2;
    const angle = DIR_ANGLES[side];
    const perpAngle = angle + Math.PI / 2;

    // Start at sidewalk edge
    const startSide = Math.random() < 0.5 ? 1 : -1;
    this.startX = CX + Math.cos(perpAngle) * (hw * startSide);
    this.startY = CY + Math.sin(perpAngle) * (hw * startSide);
    this.x = this.startX;
    this.y = this.startY;

    this.targetX = CX + Math.cos(perpAngle) * (hw * -startSide);
    this.targetY = CY + Math.sin(perpAngle) * (hw * -startSide);

    this.dirX = Math.cos(perpAngle) * -startSide;
    this.dirY = Math.sin(perpAngle) * -startSide;
  }

  update(dt, canCross) {
    if (this.remove) return;

    if (this.waiting) {
      if (canCross) {
        this.waiting = false;
        this.crossing = true;
      } else {
        this.waitTimer += dt;
      }
      return;
    }

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 5) {
      this.remove = true;
      return;
    }

    const nx = dx / dist;
    const ny = dy / dist;
    this.x += nx * this.speed * dt;
    this.y += ny * this.speed * dt;
  }

  draw() {
    ctx.save();

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(this.x + 1, this.y + 1, 4, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = '#ffe0b2';
    ctx.beginPath();
    ctx.arc(this.x, this.y - 2, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// Spawn management
let spawnTimers = [0, 0, 0, 0];
const SPAWN_INTERVAL = [1.2, 1.5, 1.0, 1.3];

function getQueueLength(dir) {
  let count = 0;
  for (const car of cars) {
    if (car.dir === dir && !car.remove && !car.passedStop && car.speed < 10) {
      count++;
    }
  }
  return count;
}

function updateTrafficLights(dt) {
  phaseTimer += dt * 1000;

  // Adaptive timing based on queue lengths
  const phase = PHASES[currentPhase];
  let baseDuration = phase.dur[0];
  let maxDuration = phase.dur[1];

  if (currentPhase === 0 || currentPhase === 2) {
    // Green phase - adapt based on queue
    const relevantDirs = currentPhase === 0 ? [0, 2] : [1, 3];
    let maxQueue = 0;
    for (const d of relevantDirs) {
      maxQueue = Math.max(maxQueue, getQueueLength(d));
    }
    baseDuration = phase.dur[0] + maxQueue * 800;
    maxDuration = phase.dur[1];
  }

  phaseDuration = Math.min(maxDuration, Math.max(phase.dur[0], baseDuration));

  if (phaseTimer >= phaseDuration) {
    phaseTimer = 0;
    currentPhase = (currentPhase + 1) % PHASES.length;
    lightState = {
      ns: PHASES[currentPhase].ns,
      ew: PHASES[currentPhase].ew,
      nsLeft: PHASES[currentPhase].nsLeft,
      ewLeft: PHASES[currentPhase].ewLeft,
    };
  }

  // Pedestrian signals
  pedTimer += dt * 1000;
  const isGreenPhase = currentPhase === 0 || currentPhase === 2;
  const isYellowPhase = currentPhase === 1 || currentPhase === 3;

  if (isGreenPhase) {
    const nsGreen = currentPhase === 0;
    pedState = {
      ns: nsGreen ? 'walk' : 'wait',
      ew: nsGreen ? 'wait' : 'walk'
    };
  } else {
    pedState = {
      ns: 'walk',
      ew: 'walk'
    };
  }
}

function spawnCars(dt) {
  for (let dir = 0; dir < 4; dir++) {
    spawnTimers[dir] -= dt;
    if (spawnTimers[dir] <= 0) {
      // Check if too many cars already
      const dirCars = cars.filter(c => c.dir === dir && !c.remove).length;
      if (dirCars < 8) {
        const lane = Math.random() < 0.3 ? 0 : 1;
        const isLeftTurn = lane === 0;
        const car = new Car(dir, lane, isLeftTurn);
        cars.push(car);
      }
      spawnTimers[dir] = SPAWN_INTERVAL[dir] + Math.random() * 1.5;
    }
  }
}

function spawnPedestrians(dt) {
  if (Math.random() < dt * 0.3) {
    const side = Math.floor(Math.random() * 4);
    pedestrians.push(new Pedestrian(side));
  }
}

function spawnBus(dt) {
  busTimer -= dt;
  if (busTimer <= 0 && (!bus || bus.remove)) {
    bus = new Bus();
    busTimer = 25 + Math.random() * 20;
  }
}

function getCarAhead(car) {
  let closest = null;
  let closestDist = Infinity;
  const angle = DIR_ANGLES[car.dir];

  for (const other of cars) {
    if (other === car || other.remove || other.dir !== car.dir || other.lane !== car.lane) continue;
    if (other.turning) continue;

    const dx = other.x - car.x;
    const dy = other.y - car.y;
    const dot = dx * Math.cos(angle) + dy * Math.sin(angle);
    if (dot > 0 && dot < 250) {
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < closestDist) {
        closestDist = dist;
        closest = other;
      }
    }
  }

  // Also check bus
  if (bus && !bus.remove && bus.dir === car.dir && bus.lane === car.lane) {
    const dx = bus.x - car.x;
    const dy = bus.y - car.y;
    const dot = dx * Math.cos(angle) + dy * Math.sin(angle);
    if (dot > 0 && dot < 250) {
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < closestDist) {
        closest = bus;
      }
    }
  }

  return closest;
}

function drawRoads() {
  // Background - dusk ground
  ctx.fillStyle = '#2d2d3a';
  ctx.fillRect(0, 0, W, H);

  // Road surfaces
  ctx.fillStyle = '#3a3a4a';

  // Horizontal road
  ctx.fillRect(0, CY - ROAD_W, W, ROAD_W * 2);

  // Vertical road
  ctx.fillRect(CX - ROAD_W, 0, ROAD_W * 2, H);

  // Intersection
  ctx.fillStyle = '#404050';
  ctx.fillRect(CX - INTERSECTION_SIZE / 2, CY - INTERSECTION_SIZE / 2, INTERSECTION_SIZE, INTERSECTION_SIZE);

  // Lane markings - horizontal road
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 15]);

  // Center line horizontal
  ctx.beginPath();
  ctx.moveTo(0, CY);
  ctx.lineTo(CX - INTERSECTION_SIZE / 2, CY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(CX + INTERSECTION_SIZE / 2, CY);
  ctx.lineTo(W, CY);
  ctx.stroke();

  // Center line vertical
  ctx.beginPath();
  ctx.moveTo(CX, 0);
  ctx.lineTo(CX, CY - INTERSECTION_SIZE / 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(CX, CY + INTERSECTION_SIZE / 2);
  ctx.lineTo(CX, H);
  ctx.stroke();

  ctx.setLineDash([]);

  // Stop lines
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;

  for (let dir = 0; dir < 4; dir++) {
    const angle = DIR_ANGLES[dir];
    const perpAngle = angle + Math.PI / 2;
    const slDist = STOP_LINE_DIST;

    for (let lane = 0; lane < 2; lane++) {
      const laneOff = lane === 0 ? -LANE_W / 2 : LANE_W / 2;
      const x1 = CX + Math.cos(angle) * slDist + Math.cos(perpAngle) * (laneOff - LANE_W / 4);
      const y1 = CY + Math.sin(angle) * slDist + Math.sin(perpAngle) * (laneOff - LANE_W / 4);
      const x2 = CX + Math.cos(angle) * slDist + Math.cos(perpAngle) * (laneOff + LANE_W / 4);
      const y2 = CY + Math.sin(angle) * slDist + Math.sin(perpAngle) * (laneOff + LANE_W / 4);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  }

  // Crosswalks
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  const cwHalf = INTERSECTION_SIZE / 2;

  for (let dir = 0; dir < 4; dir++) {
    const angle = DIR_ANGLES[dir];
    const perpAngle = angle + Math.PI / 2;

    for (let i = -3; i <= 3; i++) {
      const offset = i * 12;
      const x1 = CX + Math.cos(angle) * (cwHalf + 2) + Math.cos(perpAngle) * offset;
      const y1 = CY + Math.sin(angle) * (cwHalf + 2) + Math.sin(perpAngle) * offset;
      const x2 = CX + Math.cos(angle) * (cwHalf + CROSSWALK_W + 2) + Math.cos(perpAngle) * offset;
      const y2 = CY + Math.sin(angle) * (cwHalf + CROSSWALK_W + 2) + Math.sin(perpAngle) * offset;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.stroke();
    }
  }

  // Bus stop
  const busStopAngle = DIR_ANGLES[0];
  const busStopPerp = busStopAngle + Math.PI / 2;
  const bsX = CX + Math.cos(busStopPerp) * (ROAD_W / 2 + 10);
  const bsY = CY + Math.sin(busStopAngle) * BUS_STOP_OFFSET;

  ctx.fillStyle = 'rgba(255,152,0,0.3)';
  ctx.fillRect(bsX - BUS_STOP_LEN / 2 - 5, bsY - 15, BUS_STOP_LEN + 10, 30);
  ctx.strokeStyle = '#ff9800';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 4]);
  ctx.strokeRect(bsX - BUS_STOP_LEN / 2 - 5, bsY - 15, BUS_STOP_LEN + 10, 30);
  ctx.setLineDash([]);

  ctx.fillStyle = '#ff9800';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('BUS STOP', bsX, bsY - 20);

  // Sidewalks
  ctx.fillStyle = '#4a4a5a';
  const sw = 15;
  // North sidewalk
  ctx.fillRect(CX - INTERSECTION_SIZE / 2, CY - INTERSECTION_SIZE / 2 - sw, INTERSECTION_SIZE, sw);
  // South sidewalk
  ctx.fillRect(CX - INTERSECTION_SIZE / 2, CY + INTERSECTION_SIZE / 2, INTERSECTION_SIZE, sw);
  // East sidewalk
  ctx.fillRect(CX + INTERSECTION_SIZE / 2, CY - INTERSECTION_SIZE / 2, sw, INTERSECTION_SIZE);
  // West sidewalk
  ctx.fillRect(CX - INTERSECTION_SIZE / 2 - sw, CY - INTERSECTION_SIZE / 2, sw, INTERSECTION_SIZE);
}

function drawTrafficLights() {
  const positions = [
    { x: CX - INTERSECTION_SIZE / 2 - 20, y: CY - INTERSECTION_SIZE / 2 - 10, dir: 0 },
    { x: CX + INTERSECTION_SIZE / 2 + 20, y: CY - INTERSECTION_SIZE / 2 - 10, dir: 1 },
    { x: CX + INTERSECTION_SIZE / 2 + 20, y: CY + INTERSECTION_SIZE / 2 + 10, dir: 2 },
    { x: CX - INTERSECTION_SIZE / 2 - 20, y: CY + INTERSECTION_SIZE / 2 + 10, dir: 3 },
  ];

  for (const pos of positions) {
    const isNS = pos.dir === 0 || pos.dir === 2;
    const isLeft = pos.dir === 0 || pos.dir === 2;

    const mainColor = isNS ? lightState.ns : lightState.ew;
    const leftColor = isNS ? lightState.nsLeft : lightState.ewLeft;

    // Pole
    ctx.fillStyle = '#555';
    ctx.fillRect(pos.x - 2, pos.y - 25, 4, 30);

    // Main light housing
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.roundRect(pos.x - 6, pos.y - 22, 12, 24, 3);
    ctx.fill();

    // Red
    drawLightCircle(pos.x, pos.y - 17, mainColor === 'red' ? '#ff1744' : '#440000', mainColor === 'red');
    // Yellow
    drawLightCircle(pos.x, pos.y - 11, mainColor === 'yellow' ? '#ffeb3b' : '#444400', mainColor === 'yellow');
    // Green
    drawLightCircle(pos.x, pos.y - 5, mainColor === 'green' ? '#00e676' : '#004400', mainColor === 'green');

    // Left turn arrow (smaller)
    if (isLeft) {
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.roundRect(pos.x - 4, pos.y - 38, 8, 14, 2);
      ctx.fill();

      drawLightCircle(pos.x, pos.y - 31, leftColor === 'green' ? '#00e676' : '#004400', leftColor === 'green');
    }
  }

  // Pedestrian signals
  const pedPositions = [
    { x: CX - INTERSECTION_SIZE / 2 - 10, y: CY - INTERSECTION_SIZE / 2 + 5, axis: 'ew' },
    { x: CX + INTERSECTION_SIZE / 2 + 10, y: CY - INTERSECTION_SIZE / 2 + 5, axis: 'ew' },
    { x: CX - INTERSECTION_SIZE / 2 - 10, y: CY + INTERSECTION_SIZE / 2 - 5, axis: 'ew' },
    { x: CX + INTERSECTION_SIZE / 2 + 10, y: CY + INTERSECTION_SIZE / 2 - 5, axis: 'ew' },
    { x: CX - INTERSECTION_SIZE / 2 + 5, y: CY - INTERSECTION_SIZE / 2 - 10, axis: 'ns' },
    { x: CX + INTERSECTION_SIZE / 2 - 5, y: CY - INTERSECTION_SIZE / 2 - 10, axis: 'ns' },
    { x: CX - INTERSECTION_SIZE / 2 + 5, y: CY + INTERSECTION_SIZE / 2 + 10, axis: 'ns' },
    { x: CX + INTERSECTION_SIZE / 2 - 5, y: CY + INTERSECTION_SIZE / 2 + 10, axis: 'ns' },
  ];

  for (const pp of pedPositions) {
    const state = pp.axis === 'ns' ? pedState.ns : pedState.ew;
    const walkColor = state === 'walk' ? '#00e676' : '#440000';
    const waitColor = state === 'walk' ? '#444400' : '#ff1744';

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.roundRect(pp.x - 5, pp.y - 8, 10, 16, 2);
    ctx.fill();

    drawLightCircle(pp.x, pp.y - 4, walkColor, state === 'walk');
    drawLightCircle(pp.x, pp.y + 4, waitColor, state !== 'walk');
  }
}

function drawLightCircle(x, y, color, active) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();

  if (active) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawDuskOverlay() {
  // Vignette
  const grad = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.3, CX, CY, Math.max(W, H) * 0.7);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Street lamp glow
  const lampPositions = [
    { x: CX - INTERSECTION_SIZE / 2 - 15, y: CY - INTERSECTION_SIZE / 2 - 15 },
    { x: CX + INTERSECTION_SIZE / 2 + 15, y: CY - INTERSECTION_SIZE / 2 - 15 },
    { x: CX + INTERSECTION_SIZE / 2 + 15, y: CY + INTERSECTION_SIZE / 2 + 15 },
    { x: CX - INTERSECTION_SIZE / 2 - 15, y: CY + INTERSECTION_SIZE / 2 + 15 },
  ];

  for (const lamp of lampPositions) {
    const grad = ctx.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, 120);
    grad.addColorStop(0, 'rgba(255,200,100,0.08)');
    grad.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(lamp.x, lamp.y, 120, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawUI() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(10, 10, 180, 60, 5);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Phase: ${PHASES[currentPhase].name}`, 18, 30);
  ctx.fillText(`Cars: ${cars.filter(c => !c.remove).length}`, 18, 46);
  ctx.fillText(`Peds: ${pedestrians.filter(p => !p.remove).length}`, 18, 62);

  // Queue indicators
  for (let dir = 0; dir < 4; dir++) {
    const q = getQueueLength(dir);
    const angle = DIR_ANGLES[dir];
    const dist = INTERSECTION_SIZE / 2 + 40;
    const x = CX + Math.cos(angle) * dist;
    const y = CY + Math.sin(angle) * dist;

    ctx.fillStyle = q > 3 ? '#ff1744' : q > 1 ? '#ff9800' : '#4caf50';
    ctx.beginPath();
    ctx.arc(x, y, 4 + q * 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(q, x, y + 3);
  }
}

let lastTime = performance.now();

function update(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  resize();

  updateTrafficLights(dt);
  spawnCars(dt);
  spawnPedestrians(dt);
  spawnBus(dt);

  // Update cars
  for (const car of cars) {
    const carAhead = getCarAhead(car);
    const lightColor = car.dir === 0 || car.dir === 2 ? lightState.ns : lightState.ew;
    const leftLightColor = car.dir === 0 || car.dir === 2 ? lightState.nsLeft : lightState.ewLeft;
    car.update(dt, carAhead, lightColor, leftLightColor);
  }

  // Update bus
  if (bus && !bus.remove) {
    const busLight = lightState.ns;
    let busAhead = null;
    for (const car of cars) {
      if (car.dir === bus.dir && car.lane === bus.lane && !car.remove) {
        const dx = car.x - bus.x;
        const dy = car.y - bus.y;
        const dot = dx * Math.cos(DIR_ANGLES[0]) + dy * Math.sin(DIR_ANGLES[0]);
        if (dot > 0 && dot < 200) {
          busAhead = car;
          break;
        }
      }
    }
    bus.update(dt, busAhead, busLight);
  }

  // Update pedestrians
  for (const ped of pedestrians) {
    const canCross = ped.side % 2 === 0
      ? (pedState.ns === 'walk')
      : (pedState.ew === 'walk');
    ped.update(dt, canCross);
  }

  // Cleanup
  for (let i = cars.length - 1; i >= 0; i--) {
    if (cars[i].remove) cars.splice(i, 1);
  }
  for (let i = pedestrians.length - 1; i >= 0; i--) {
    if (pedestrians[i].remove) pedestrians.splice(i, 1);
  }
  if (bus && bus.remove) bus = null;

  // Draw
  drawRoads();

  // Draw cars (sort by position for proper overlap)
  const allVehicles = [...cars.filter(c => !c.remove)];
  if (bus && !bus.remove) allVehicles.push(bus);
  allVehicles.sort((a, b) => a.y - b.y);

  for (const v of allVehicles) {
    v.draw();
  }

  // Draw pedestrians
  for (const ped of pedestrians) {
    if (!ped.remove) ped.draw();
  }

  drawTrafficLights();
  drawDuskOverlay();
  drawUI();

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
