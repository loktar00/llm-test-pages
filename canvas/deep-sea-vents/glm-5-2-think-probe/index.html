<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hydrothermal Vent · 2700m</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- Utilities ----
const rand = (a=1,b=0) => Math.random()*(a-b)+b;
const randInt = (a,b) => Math.floor(rand(a,b));
const choice = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b) => v<a?a:v>b?b:v;

// ---- Marine snow ----
const snow = [];
const SNOW_COUNT = 600;
function initSnow() {
  snow.length = 0;
  for (let i=0;i<SNOW_COUNT;i++) {
    snow.push({
      x: rand(W),
      y: rand(H),
      r: rand(1.8, 0.3),
      vx: rand(0.15,-0.15),
      vy: rand(0.18, 0.04),
      phase: rand(Math.PI*2),
      alpha: rand(0.7, 0.15),
      drift: rand(0.3, 0.05)
    });
  }
}
initSnow();
window.addEventListener('resize', initSnow);

// ---- Vents (black smokers) ----
const vents = [];
function initVents() {
  vents.length = 0;
  const positions = [
    { x: W * 0.22, height: 0.28 },
    { x: W * 0.5,  height: 0.36 },
    { x: W * 0.78, height: 0.24 }
  ];
  positions.forEach(p => {
    vents.push({
      x: p.x,
      baseY: H * (1 - p.height),
      height: H * p.height,
      width: 30 + rand(15),
      segments: [],
      plume: [],
      // particle pool size estimate
    });
  });
  // Build chimneys (tall tapered towers)
  vents.forEach(v => {
    v.tipX = v.x + rand(8, -8);
    v.tipY = v.baseY;
    v.tipW = 8 + rand(4);
  });
}
initVents();
window.addEventListener('resize', initVents);

// ---- Plume particles ----
const MAX_PLUME = 1400;
const plume = [];
function spawnPlumeParticle(v) {
  if (plume.length > MAX_PLUME) return;
  const sx = v.tipX + rand(v.tipW/2, -v.tipW/2);
  const sy = v.tipY + rand(6, -2);
  plume.push({
    x: sx, y: sy,
    vx: rand(0.4, -0.4),
    vy: rand(-1.6, -0.8),
    life: 1,
    decay: rand(0.006, 0.002),
    size: rand(14, 4),
    heat: rand(1, 0.6),
    vent: v
  });
}

// ---- Tube worms ----
const tubeWorms = [];
function initTubeWorms() {
  tubeWorms.length = 0;
  vents.forEach(v => {
    // Cluster around base of chimney, on the seafloor mound
    const count = 40 + randInt(15);
    for (let i=0;i<count;i++) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const dist = rand(70, 5) * side;
      const x = v.x + dist;
      const y = v.baseY + 8 + rand(20, 0) * (Math.abs(dist)/70);
      // seafloor curve: farther = lower
      const baseY = v.baseY + Math.abs(dist) * 0.4 + rand(10);
      tubeWorms.push({
        x: x,
        baseY: baseY,
        height: rand(38, 16),
        width: rand(3.2, 1.8),
        sway: rand(Math.PI*2),
        swaySpeed: rand(0.02, 0.006),
        swayAmp: rand(8, 3),
        hue: choice([345, 350, 355, 0, 8, 12]),
        plume: Math.random() < 0.7
      });
    }
  });
}
initTubeWorms();
window.addEventListener('resize', initTubeWorms);
