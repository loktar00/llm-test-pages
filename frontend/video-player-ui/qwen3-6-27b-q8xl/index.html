<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Video Player</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --accent:#6c5ce7;
    --accent-light:#a29bfe;
    --bg-dark:#0a0a0f;
    --control-bg:linear-gradient(transparent,rgba(0,0,0,.85));
    --text:#e2e2e8;
    --text-dim:#888899;
    --radius:8px;
    --transition:0.3s cubic-bezier(.4,0,.2,1);
  }
  html,body{height:100%;overflow:hidden;background:var(--bg-dark);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text)}

  .player{
    position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:pointer;user-select:none;
  }

  /* Animated gradient "video" */
  .video-surface{
    position:absolute;inset:0;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e,#0f0c29);
    background-size:400% 400%;
    animation:drift 12s ease infinite;
  }
  .video-surface::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(ellipse 600px 400px at 30% 40%,rgba(108,92,231,.35),transparent),
      radial-gradient(ellipse 500px 500px at 70% 60%,rgba(0,206,209,.2),transparent),
      radial-gradient(ellipse 400px 300px at 50% 30%,rgba(253,121,168,.2),transparent);
    animation:sceneShift 8s ease-in-out infinite alternate;
  }
  .video-surface::after{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(circle 2px at 20% 30%,rgba(255,255,255,.6),transparent),
      radial-gradient(circle 1.5px at 60% 20%,rgba(255,255,255,.4),transparent),
      radial-gradient(circle 1px at 80% 70%,rgba(255,255,255,.5),transparent),
      radial-gradient(circle 2px at 40% 80%,rgba(255,255,255,.3),transparent),
      radial-gradient(circle 1px at 10% 60%,rgba(255,255,255,.5),transparent),
      radial-gradient(circle 1.5px at 90% 40%,rgba(255,255,255,.35),transparent);
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  @keyframes sceneShift{
    0%{opacity:.8;transform:scale(1) translate(0,0)}
    100%{opacity:1;transform:scale(1.05) translate(-2%,2%)}
  }
  @keyframes twinkle{
    0%{opacity:.6}
    100%{opacity:1}
  }

  /* Center play button */
  .center-btn{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);
    width:80px;height:80px;border-radius:50%;border:none;
    background:rgba(108,92,231,.85);
    backdrop-filter:blur(10px);
    cursor:pointer;z-index:10;
    display:flex;align-items:center;justify-content:center;
    transition:transform var(--transition),opacity var(--transition),background var(--transition);
    box-shadow:0 0 40px rgba(108,92,231,.4);
  }
  .center-btn:hover{transform:translate(-50%,-50%) scale(1.1);background:rgba(108,92,231,.95)}
  .center-btn:active{transform:translate(-50%,-50%) scale(.95)}
  .center-btn svg{width:32px;height:32px;fill:#fff;margin-left:3px}
  .center-btn.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.7)}

  /* Ripple */
  .ripple-ring{
    position:absolute;top:50%;left:50%;
    width:80px;height:80px;border-radius:50%;
    border:2px solid rgba(108,92,231,.6);
    transform:translate(-50%,-50%) scale(1);
    opacity:0;pointer-events:none;z-index:9;
  }
  .ripple-ring.animate{
    animation:rippleOut .8s ease-out forwards;
  }
  @keyframes rippleOut{
    0%{transform:translate(-50%,-50%) scale(1);opacity:.8}
    100%{transform:translate(-50%,-50%) scale(3);opacity:0}
  }

  /* Controls container */
  .controls{
    position:absolute;bottom:0;left:0;right:0;z-index:20;
    padding:0 16px 16px;
    background:var(--control-bg);
    transition:opacity var(--transition),transform var(--transition);
  }
  .controls.hidden{opacity:0;transform:translateY(8px);pointer-events:none}

  /* Seek bar */
  .seek-row{position:relative;padding:12px 0 8px;cursor:pointer}
  .seek-track{
    position:relative;height:5px;background:rgba(255,255,255,.15);
    border-radius:3px;overflow:visible;
  }
  .seek-buffered{
    position:absolute;top:0;left:0;height:100%;
    background:rgba(255,255,255,.2);border-radius:3px;
    transition:width .3s linear;
  }
  .seek-progress{
    position:absolute;top:0;left:0;height:100%;
    background:var(--accent);border-radius:3px;
    transition:width .1s linear;
  }
  .seek-thumb{
    position:absolute;top:50%;width:14px;height:14px;
    border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 0 6px rgba(0,0,0,.5);
    transition:opacity .15s,transform .15s;
    opacity:0;
  }
  .seek-row:hover .seek-thumb,
  .seek-row.dragging .seek-thumb{opacity:1;transform:translate(-50%,-50%) scale(1.3)}

  /* Seek tooltip */
  .seek-tooltip{
    position:absolute;bottom:24px;
    transform:translateX(-50%);
    padding:4px 8px;
    background:rgba(20,20,30,.92);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:6px;
    font-size:12px;font-weight:600;
    color:#fff;white-space:nowrap;
    pointer-events:none;
    opacity:0;transition:opacity .15s;
    z-index:30;
  }
  .seek-tooltip.visible{opacity:1}
  .seek-tooltip .chip{
    display:inline-block;width:8px;height:8px;border-radius:2px;
    margin-right:6px;vertical-align:middle;
  }

  /* Hover preview chip */
  .seek-preview{
    position:absolute;bottom:28px;
    width:120px;height:68px;
    border-radius:6px;overflow:hidden;
    border:2px solid rgba(255,255,255,.2);
    pointer-events:none;opacity:0;
    transition:opacity .15s;
    transform:translateX(-50%);
    z-index:31;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .seek-preview.visible{opacity:1}
  .seek-preview-inner{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:rgba(255,255,255,.8);
    font-weight:600;letter-spacing:.5px;
  }

  /* Control buttons row */
  .controls-row{
    display:flex;align-items:center;gap:4px;
    padding:4px 0;
  }
  .ctrl-btn{
    width:40px;height:40px;border-radius:var(--radius);border:none;
    background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);transition:background var(--transition),color var(--transition);
    position:relative;
  }
  .ctrl-btn:hover{background:rgba(255,255,255,.1)}
  .ctrl-btn svg{width:22px;height:22px;fill:currentColor}

  .time-display{
    font-size:13px;font-weight:500;color:var(--text-dim);
    margin-left:8px;font-variant-numeric:tabular-nums;
    white-space:nowrap;letter-spacing:.3px;
  }

  .spacer{flex:1}

  /* Volume */
  .volume-group{display:flex;align-items:center;position:relative}
  .volume-flyout{
    position:absolute;bottom:48px;left:50%;transform:translateX(-50%) translateY(8px);
    width:40px;padding:12px 0;
    background:rgba(15,15,25,.95);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;
    z-index:25;
  }
  .volume-group:hover .volume-flyout,
  .volume-flyout.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .volume-slider-track{
    position:relative;height:100%;width:4px;
    background:rgba(255,255,255,.15);border-radius:2px;
    margin:0 auto;cursor:pointer;
  }
  .volume-slider-fill{
    position:absolute;bottom:0;left:0;width:100%;
    background:var(--accent);border-radius:2px;
    transition:height .1s;
  }
  .volume-slider-thumb{
    position:absolute;left:50%;width:14px;height:14px;
    border-radius:50%;background:#fff;
    transform:translate(-50%,50%);
    box-shadow:0 0 4px rgba(0,0,0,.4);
    transition:opacity .15s;
    opacity:0;
  }
  .volume-slider-track:hover .volume-slider-thumb{opacity:1}

  /* Settings menu */
  .settings-group{position:relative}
  .settings-menu{
    position:absolute;bottom:48px;right:0;
    min-width:200px;padding:8px 0;
    background:rgba(15,15,25,.95);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    opacity:0;pointer-events:none;
    transform:translateY(8px);
    transition:opacity .2s,transform .2s;
    z-index:25;
  }
  .settings-menu.open{opacity:1;pointer-events:auto;transform:translateY(0)}
  .settings-title{
    padding:8px 16px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);
  }
  .settings-item{
    padding:8px 16px;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;
    transition:background .15s;
  }
  .settings-item:hover{background:rgba(255,255,255,.08)}
  .settings-item.active{color:var(--accent-light)}
  .settings-item .check{
    width:16px;height:16px;opacity:0;
    transition:opacity .15s;
  }
  .settings-item.active .check{opacity:1}

  /* Fullscreen */
  .player:fullscreen,.player:-webkit-full-screen{
    border-radius:0;
  }

  /* Big play overlay when paused */
  .play-indicator{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:60px;height:60px;border-radius:50%;
    background:rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:8;
    opacity:0;
  }
  .play-indicator.flash{
    animation:flashIn .4s ease-out forwards;
  }
  @keyframes flashIn{
    0%{transform:translate(-50%,-50%) scale(0);opacity:.8}
    100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}
  }

  /* Gradient text for title */
  .video-title{
    position:absolute;top:24px;left:24px;z-index:15;
    font-size:14px;font-weight:600;color:rgba(255,255,255,.7);
    letter-spacing:.3px;
    transition:opacity var(--transition);
  }
  .video-title.hidden{opacity:0}

  /* Loading spinner (decorative) */
  .loading-spinner{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:40px;height:40px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--accent);
    border-radius:50%;
    opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  .loading-spinner.visible{opacity:1;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
</style>
</head>
<body>

<div class="player" id="player">
  <!-- Animated video surface -->
  <div class="video-surface" id="videoSurface"></div>

  <!-- Title -->
  <div class="video-title" id="videoTitle">Ambient Drift — Visual Experience</div>

  <!-- Center play button -->
  <button class="center-btn" id="centerBtn" aria-label="Play">
    <svg id="centerPlayIcon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    <svg id="centerPauseIcon" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>
  </button>
  <div class="ripple-ring" id="rippleRing"></div>

  <!-- Play indicator flash -->
  <div class="play-indicator" id="playIndicator">
    <svg width="24" height="24" fill="#fff" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
  </div>

  <!-- Loading spinner -->
  <div class="loading-spinner" id="loadingSpinner"></div>

  <!-- Controls -->
  <div class="controls" id="controls">
    <!-- Seek bar -->
    <div class="seek-row" id="seekRow">
      <div class="seek-track" id="seekTrack">
        <div class="seek-buffered" id="seekBuffered"></div>
        <div class="seek-progress" id="seekProgress"></div>
        <div class="seek-thumb" id="seekThumb"></div>
      </div>
      <div class="seek-tooltip" id="seekTooltip">
        <span class="chip" id="tooltipChip"></span>
        <span id="tooltipTime">0:00</span>
      </div>
      <div class="seek-preview" id="seekPreview">
        <div class="seek-preview-inner" id="seekPreviewInner"></div>
      </div>
    </div>

    <!-- Buttons row -->
    <div class="controls-row">
      <!-- Play/Pause -->
      <button class="ctrl-btn" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>
      </button>

      <!-- Skip back -->
      <button class="ctrl-btn" id="skipBack" aria-label="Skip back 10s">
        <svg viewBox="0 0 24 24"><path d="M12.5 8C9.85 8 7.61 9.41 6.11 11.5L4 11v5h4.5l-1.5-2H7c0-2.76 2.24-5 5-5s5 2.24 5 5H15v2h3.5l-1-1.5C18.39 12.41 15.15 8 12.5 8z"/><text x="10" y="15.5" font-size="6" fill="currentColor" font-weight="bold">10</text></svg>
      </button>

      <!-- Volume -->
      <div class="volume-group" id="volumeGroup">
        <button class="ctrl-btn" id="volumeBtn" aria-label="Volume">
          <svg id="volHigh" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="volMuted" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <div class="volume-flyout" id="volumeFlyout">
          <div class="volume-slider-track" id="volumeTrack">
            <div class="volume-slider-fill" id="volumeFill"></div>
            <div class="volume-slider-thumb" id="volumeThumb"></div>
          </div>
        </div>
      </div>

      <!-- Time -->
      <span class="time-display" id="timeDisplay">0:00 / 3:24</span>

      <div class="spacer"></div>

      <!-- Settings -->
      <div class="settings-group" id="settingsGroup">
        <button class="ctrl-btn" id="settingsBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
        </button>
        <div class="settings-menu" id="settingsMenu">
          <div class="settings-title">Playback Speed</div>
          <div class="settings-item" data-speed="0.25"><span>0.25×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          <div class="settings-item" data-speed="0.5"><span>0.5×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          <div class="settings-item" data-speed="0.75"><span>0.75×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          <div class="settings-item active" data-speed="1"><span>Normal</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          <div class="settings-item" data-speed="1.25"><span>1.25×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          <div class="settings-item" data-speed="1.5"><span>1.5×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
          <div class="settings-item" data-speed="2"><span>2×</span><svg class="check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
        </div>
      </div>

      <!-- Fullscreen -->
      <button class="ctrl-btn" id="fullscreenBtn" aria-label="Fullscreen">
        <svg id="fsEnter" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="fsExit" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  // Elements
  const player = document.getElementById('player');
  const videoSurface = document.getElementById('videoSurface');
  const videoTitle = document.getElementById('videoTitle');
  const controls = document.getElementById('controls');
  const centerBtn = document.getElementById('centerBtn');
  const centerPlayIcon = document.getElementById('centerPlayIcon');
  const centerPauseIcon = document.getElementById('centerPauseIcon');
  const rippleRing = document.getElementById('rippleRing');
  const playIndicator = document.getElementById('playIndicator');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');

  const skipBack = document.getElementById('skipBack');
  const seekRow = document.getElementById('seekRow');
  const seekTrack = document.getElementById('seekTrack');
  const seekProgress = document.getElementById('seekProgress');
  const seekBuffered = document.getElementById('seekBuffered');
  const seekThumb = document.getElementById('seekThumb');
  const seekTooltip = document.getElementById('seekTooltip');
  const tooltipChip = document.getElementById('tooltipChip');
  const tooltipTime = document.getElementById('tooltipTime');
  const seekPreview = document.getElementById('seekPreview');
  const seekPreviewInner = document.getElementById('seekPreviewInner');
  const timeDisplay = document.getElementById('timeDisplay');
  const volumeBtn = document.getElementById('volumeBtn');
  const volHigh = document.getElementById('volHigh');
  const volMuted = document.getElementById('volMuted');
  const volumeTrack = document.getElementById('volumeTrack');
  const volumeFill = document.getElementById('volumeFill');
  const volumeThumb = document.getElementById('volumeThumb');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  const settingsItems = settingsMenu.querySelectorAll('.settings-item');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fsEnter = document.getElementById('fsEnter');
  const fsExit = document.getElementById('fsExit');
  const loadingSpinner = document.getElementById('loadingSpinner');

  // State
  const DURATION = 204; // 3:24 in seconds
  let currentTime = 0;
  let isPlaying = false;
  let playbackSpeed = 1;
  let volume = 0.75;
  let isMuted = false;
  let isDragging = false;
  let hideTimeout = null;
  let animFrame = null;
  let lastTime = 0;
  let bufferedEnd = 0.35;

  // Format time
  function fmt(s){
    s = Math.max(0, Math.min(s, DURATION));
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // Get color for time position
  function timeColor(t){
    const p = t / DURATION;
    const r = Math.round(108 + p * 147);
    const g = Math.round(92 + Math.sin(p * Math.PI) * 114);
    const b = Math.round(231 - p * 100);
    return `rgb(${r},${g},${b})`;
  }

  // Update UI
  function updateUI(){
    const pct = (currentTime / DURATION) * 100;
    seekProgress.style.width = pct + '%';
    seekThumb.style.left = pct + '%';
    timeDisplay.textContent = fmt(currentTime) + ' / ' + fmt(DURATION);
    seekBuffered.style.width = (bufferedEnd * 100) + '%';
  }

  // Toggle play/pause
  function togglePlay(){
    isPlaying = !isPlaying;
    if(isPlaying){
      centerPlayIcon.style.display = 'none';
      centerPauseIcon.style.display = 'block';
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      centerBtn.classList.add('hidden');
      lastTime = performance.now();

      showControls(true);
      startHideTimer();
    } else {
      centerPlayIcon.style.display = 'block';
      centerPauseIcon.style.display = 'none';
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      centerBtn.classList.remove('hidden');
      cancelAnimationFrame(animFrame);
      showControls(true);
    }
    triggerRipple();
  }

  function triggerRipple(){
    rippleRing.classList.remove('animate');
    void rippleRing.offsetWidth;
    rippleRing.classList.add('animate');
  }

  function flashPlayIndicator(){
    playIndicator.classList.remove('flash');
    void playIndicator.offsetWidth;
    playIndicator.classList.add('flash');
  }

  // Tick
  function tick(now){
    if(!isPlaying) return;
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    currentTime += dt * playbackSpeed;
    if(currentTime >= DURATION){
      currentTime = 0;
      bufferedEnd = Math.min(bufferedEnd + 0.05, 1);
    }
    // Advance buffered
    if(currentTime > bufferedEnd * DURATION * 0.8){
      bufferedEnd = Math.min(bufferedEnd + 0.002, 1);
    }
    updateUI();
    animFrame = requestAnimationFrame(tick);
  }

  // Show/hide controls
  function showControls(show){
    if(show){
      controls.classList.remove('hidden');
      videoTitle.classList.remove('hidden');
    } else {
      controls.classList.add('hidden');
      videoTitle.classList.add('hidden');
      settingsMenu.classList.remove('open');
    }
  }

  function startHideTimer(){
    clearTimeout(hideTimeout);
    if(isPlaying){
      hideTimeout = setTimeout(() => showControls(false), 3000);
    }
  }

  // Player mouse move
  player.addEventListener('mousemove', () => {
    showControls(true);
    startHideTimer();
  });

  player.addEventListener('mouseleave', () => {
    if(isPlaying) startHideTimer();
  });

  // Center button click
  centerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePlay();
  });

  // Play button click
  playBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    togglePlay();
    flashPlayIndicator();
  });

  // Skip back
  skipBack.addEventListener('click', (e) => {
    e.stopPropagation();
    currentTime = Math.max(0, currentTime - 10);
    updateUI();
  });

  // Seek bar interactions
  function getSeekPct(e){
    const rect = seekTrack.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  }

  seekRow.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    isDragging = true;
    seekRow.classList.add('dragging');
    const pct = getSeekPct(e);
    currentTime = pct * DURATION;
    updateUI();
  });

  document.addEventListener('mousemove', (e) => {
    if(isDragging){
      const pct = getSeekPct(e);
      currentTime = pct * DURATION;
      updateUI();
    }

    // Seek tooltip & preview
    if(seekRow.matches(':hover') || isDragging){
      const rect = seekTrack.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const hoverTime = pct * DURATION;

      // Tooltip
      tooltipTime.textContent = fmt(hoverTime);
      tooltipChip.style.background = timeColor(hoverTime);
      const tooltipX = pct * 100;
      seekTooltip.style.left = tooltipX + '%';
      seekTooltip.classList.add('visible');

      // Preview
      const previewW = 120;
      const trackW = rect.width;
      let previewX = pct * trackW;
      if(previewX < 60) previewX = 60;
      if(previewX > trackW - 60) previewX = trackW - 60;
      seekPreview.style.left = previewX + 'px';
      seekPreviewInner.style.background = `linear-gradient(135deg, ${timeColor(hoverTime)}, ${timeColor(hoverTime + 20)})`;
      seekPreviewInner.textContent = fmt(hoverTime);
      seekPreview.classList.add('visible');
    } else {
      seekTooltip.classList.remove('visible');
      seekPreview.classList.remove('visible');
    }
  });

  document.addEventListener('mouseup', () => {
    if(isDragging){
      isDragging = false;
      seekRow.classList.remove('dragging');
    }
  });

  // Volume
  function setVolume(v){
    volume = Math.max(0, Math.min(1, v));
    isMuted = volume === 0;
    volumeFill.style.height = (volume * 100) + '%';
    volumeThumb.style.bottom = (volume * 100) + '%';
    volHigh.style.display = isMuted ? 'none' : 'block';
    volMuted.style.display = isMuted ? 'block' : 'none';
  }

  setVolume(volume);

  volumeTrack.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    const rect = volumeTrack.getBoundingClientRect();
    const pct = 1 - Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    setVolume(pct);

    const onMove = (ev) => {
      const p = 1 - Math.max(0, Math.min(1, (ev.clientY - rect.top) / rect.height));
      setVolume(p);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  volumeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if(isMuted){
      setVolume(0.75);
    } else {
      setVolume(0);
    }
  });

  // Settings
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsMenu.classList.toggle('open');
  });

  settingsItems.forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      playbackSpeed = parseFloat(item.dataset.speed);
      settingsMenu.classList.remove('open');
    });
  });

  // Fullscreen
  fullscreenBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (player.requestFullscreen || player.webkitRequestFullscreen).call(player);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });

  function updateFS(){
    const fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fsEnter.style.display = fs ? 'none' : 'block';
    fsExit.style.display = fs ? 'block' : 'none';
  }
  document.addEventListener('fullscreenchange', updateFS);
  document.addEventListener('webkitfullscreenchange', updateFS);

  // Close menus on outside click
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.settings-group')){
      settingsMenu.classList.remove('open');
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    switch(e.key){
      case ' ':
      case 'k':
        e.preventDefault();
        togglePlay();
        flashPlayIndicator();
        break;
      case 'ArrowLeft':
        e.preventDefault();
        currentTime = Math.max(0, currentTime - 5);
        updateUI();
        showControls(true);
        startHideTimer();
        break;
      case 'ArrowRight':
        e.preventDefault();
        currentTime = Math.min(DURATION, currentTime + 5);
        updateUI();
        showControls(true);
        startHideTimer();
        break;
      case 'ArrowUp':
        e.preventDefault();
        setVolume(volume + 0.05);
        showControls(true);
        startHideTimer();
        break;
      case 'ArrowDown':
        e.preventDefault();
        setVolume(volume - 0.05);
        showControls(true);
        startHideTimer();
        break;
      case 'f':
        fullscreenBtn.click();
        break;
      case 'm':
        volumeBtn.click();
        break;
    }
  });

  // Double click to fullscreen
  player.addEventListener('dblclick', (e) => {
    if(e.target.closest('.controls')) return;
    fullscreenBtn.click();
  });

  // Initialize
  updateUI();
  showControls(true);
})();
</script>
</body>
</html>
