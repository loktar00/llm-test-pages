<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable N-Body Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4deeea;
        }
        p {
            font-size: 14px;
            margin: 0;
            color: #aaa;
        }
        #timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #4deeea;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h1 id="sim-title">Solar System</h1>
        <p>3-Second Cycle Simulation</p>
    </div>
