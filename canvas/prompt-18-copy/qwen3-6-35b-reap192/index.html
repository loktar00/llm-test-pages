<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie City Survival</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }
        .stat {
            margin-bottom: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        #title {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            pointer-events: none;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat" style="color: #ff4444">HEALTH: <span id="hp">100</span>%</div>
    <div class="stat" style="color: #ffff44">SCORE: <span id="score">0</span></div>
    <div class="stat" style="color: #44ff44">CARS: <span id="cars
