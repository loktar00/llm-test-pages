<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Painting Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        /**
         * CONFIGURATION
         */
        const NUM_WELLS = 4;
        const PARTICLE_SPAWN_RATE = 3; // Particles per frame
        const PARTICLE_SPEED = 0.5;
        const GRAVITY_STRENGTH = 800;
        const FADE_SPEED = 0.03; // How fast trails fade (lower = longer trails)
        const WELL_MOVE_SPEED = 0.3;
        const WELL_RADIUS = 60;
        
        /**
         * SETUP
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let wells = [];
        let particles = [];
        let frameCount = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * CLASSES
         */
