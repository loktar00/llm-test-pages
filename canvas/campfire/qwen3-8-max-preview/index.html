<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campfire Night</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:#04060c}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .hud{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
  .title{position:absolute;top:clamp(16px,3vh,30px);left:clamp(18px,3vw,34px);color:#f4dcb4}
  .title h1{margin:0;font:italic 600 clamp(21px,2.6vw,30px)/1.05 Georgia,'Iowan Old Style','Times New Roman',serif;letter-spacing:.015em;animation:tglow 3.4s ease-in-out infinite}
  @keyframes tglow{0%,100%{text-shadow:0 0 18px rgba(255,138,54,.28),0 1px 2px rgba(0,0,0,.85)}50%{text-shadow:0 0 28px rgba(255,160,72,.55),0 1px 2px rgba(0,0,0,.85)}}
  .title p{margin:7px 0 0;font:500 10px/1 ui-sans-serif,system-ui,-apple-system,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:rgba(244,220,180,.5)}
  .hint{position:absolute;left:clamp(18px,3vw,34px);bottom:clamp(16px,3vh,28px);font:400 12px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;color:rgba(244,220,180,.62);transition:opacity 1.4s ease}
  .hint.gone{opacity:0}
  .hint em{font-style:normal;color:#ffb36b;animation:hpulse 2.2s ease-in-out infinite}
  @keyframes hpulse{0%,100%{opacity:.75}50%{opacity:1}}
  #snd{position:absolute;right:clamp(18px,3vw,34px);bottom:clamp(16px,3vh,28px);pointer-events:auto;cursor:pointer;background:rgba(24,15,9,.62);border:1px solid rgba(255,166,88,.3);color:#f4dcb4;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:10px 16px;border-radius:999px;transition:border-color .25s,box-shadow .25s,transform .12s}
  #snd:hover{border-color:rgba(255,190,110,.8);box-shadow:0 0 20px rgba(255,140,50,.3)}
  #snd:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="title"><h1>Campfire Night</h1><p>endless &middot; ambient</p></div>
  <div class="hint" id="hint">click the fire to <em>stoke</em> it &mdash; the crickets don&rsquo;t mind</div>
  <button id="snd" aria-pressed="false">&#10022; sound off</button>
</div>
<script>
"use strict";
const TAU=Math.PI*2;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const rgb=(r,g,b)=>"rgb("+(r|0)+","+(g|0)+","+(b|0)+")";

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const bg=document.createElement("canvas"),bx=bg.getContext("2d");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

function sprite(r,g,b){const s=document.createElement("canvas");s.width=s.height=64;const c=s.getContext("2d");const gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,"rgba("+r+","+g+","+b+",1)");gr.addColorStop(.4,"rgba("+r+","+g+","+b+",.5)");gr.addColorStop(1,"rgba("+r+","+g+","+b+",0)");c.fillStyle=gr;c.fillRect(0,0,64,64);return s}
const SP={white:sprite(255,247,214),yellow:sprite(255,209,112),orange:sprite(255,130,40),red:sprite(226,66,24),ember:sprite(255,168,78),smoke:sprite(108,110,122)};

let W=0,H=0,DPR=1,SC=1,fr=null;
const w={};
const flames=[],embers=[],smoke=[],meteors=[],crickets=[];
let flameAcc=0,emberAcc=0,smokeAcc=0;
let t=0,last=performance.now();
let flick=.7,flickT=.7,flickTimer=0,stoke=0,wind=0,windT=0;
let meteorT=rand(2,7),popT=rand(.1,.4),chirpT=rand(3,7),cricketT=rand(2,5);

/* ---------- world construction ---------- */
function makeCracks(){const cs=[];const n=2+(Math.random()*2|0);
  for(let i=0;i<n;i++){const pts=[];const m=5+(Math.random()*3|0);let o=rand(-.5,.5);
    for(let j=0;j<m;j++)pts.push([.12+.78*j/(m-1)+rand(-.02,.02),clamp(o+rand(-.3,.3),-.8,.8)]);
    cs.push(pts)}return cs}
function newLog(th,age){return{th,age:age||0,life:rand(48,80),w:fr.r*rand(.24,.3),seed:rand(TAU),cracks:makeCracks()}}
function makeTree(x){return{x,baseY:H*rand(.66,.71),w:rand(26,42)*SC,topY:H*rand(.05,.13),lean:rand(-16,16),seed:rand(TAU),
  branches:[{t:rand(.28,.4),dir:Math.random()<.5?-1:1,len:rand(50,110)*SC},{t:rand(.5,.66),dir:Math.random()<.5?-1:1,len:rand(40,90)*SC}]}}

function build(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  cv.width=bg.width=Math.round(W*DPR);cv.height=bg.height=Math.round(H*DPR);
  SC=clamp(Math.min(W,H)/900,.6,1.5);
  fr={x:W*.5+rand(-30,30),y:H*.72,r:clamp(Math.min(W,H)*.115,56,150)};
  w.horizon=H*.60;
  w.stars=[];const sn=Math.round(W*H/5200*(RM?.7:1));
  const cols=["214,228,255","255,241,214","232,236,255"];
  for(let i=0;i<sn;i++)w.stars.push({x:rand(W),y:rand(w.horizon*.95),r:rand(.4,1.4),p:rand(TAU),s:rand(.3,2),b:rand(.3,1),c:cols[Math.random()*3|0],big:Math.random()<.045});
  w.treeline=[];let x=-30;while(x<W+30){const tw=rand(16,48);w.treeline.push({x,w:tw,h:rand(6,44)});x+=tw*rand(.45,.85)}
  w.pines=[];for(let i=0;i<5;i++)w.pines.push({x:rand(W),h:rand(46,120)*SC,wd:rand(22,46)*SC});
  w.grassBack=[];w.grassFront=[];
  const gn=Math.min(900,Math.round(W*H/3200*(RM?.6:1)));
  for(let i=0;i<gn;i++){
    const gx=rand(-12,W+12),gy=rand(w.horizon+8,H+12);
    const d=Math.hypot(gx-fr.x,(gy-fr.y)/.42);
    if(d<fr.r*1.8)continue;
    const depth=(gy-w.horizon)/(H-w.horizon);
    const b={x:gx,y:gy,h:lerp(6,46,depth*depth)*SC*rand(.7,1.35),w:lerp(.7,2.3,depth),lean:rand(-7,7),ph:rand(TAU),sp:rand(.5,1.7),tw:0,ts:rand(TAU),g:rand(.8,1.15),d};
    (gy<fr.y-fr.r*.12?w.grassBack:w.grassFront).push(b);
  }
  w.grassFront.sort((a,b)=>a.y-b.y);
  w.stones=[];const stn=11;
  for(let i=0;i<stn;i++){const a=i/stn*TAU+rand(-.14,.14),rr=fr.r*1.58*rand(.92,1.1);
    const pts=[];const pn=7+(Math.random()*3|0);const sz=fr.r*rand(.15,.24);
    for(let j=0;j<pn;j++){const pa=j/pn*TAU,pr=sz*rand(.72,1.15);pts.push([Math.cos(pa)*pr,Math.sin(pa)*pr*rand(.55,.8)])}
    w.stones.push({x:fr.x+Math.cos(a)*rr,y:fr.y+Math.sin(a)*rr*.42,sz,pts,tone:rand(.85,1.2),i});}
  w.stones.sort((a,b)=>a.y-b.y);
  w.trees=[makeTree(W*rand(.09,.16)),makeTree(W*rand(.84,.91))];
  w.coals=[];const cn=Math.round(fr.r/7);
  for(let i=0;i<cn;i++)w.coals.push({ox:rand(-1,1),oy:rand(-1,1),r:rand(5,15)*SC,ph:rand(TAU),sp:rand(1.2,3.6),warm:Math.random()<.5});
  w.logs=[];const ages=[.04,.36,.6,.84];
  for(let i=0;i<4;i++)w.logs.push(newLog(i/4*TAU+rand(-.35,.35),ages[i]+rand(-.04,.04)));
  w.vig=document.createElement("canvas");w.vig.width=cv.width;w.vig.height=cv.height;
  const v=w.vig.getContext("2d");v.setTransform(DPR,0,0,DPR,0,0);
  let g=v.createRadialGradient(W/2,H*.56,Math.min(W,H)*.34,W/2,H*.56,Math.hypot(W,H)*.6);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(1,2,7,.6)");v.fillStyle=g;v.fillRect(0,0,W,H);
  g=v.createLinearGradient(0,0,0,H*.22);g.addColorStop(0,"rgba(0,0,5,.38)");g.addColorStop(1,"rgba(0,0,0,0)");v.fillStyle=g;v.fillRect(0,0,W,H*.22);
  flames.length=embers.length=smoke.length=crickets.length=0;
  flameAcc=emberAcc=smokeAcc=0;
}

/* ---------- particles ---------- */
function spawnFlame(){
  const a=rand(TAU),rr=Math.sqrt(Math.random())*fr.r*.6;
  const x=fr.x+Math.cos(a)*rr,y=fr.y+Math.sin(a)*rr*.3+3;
  const q=Math.random();let spr,s,life,vy;
  if(q<.13){spr=SP.white;s=rand(6,12);life=rand(.3,.55);vy=rand(-100,-72)}
  else if(q<.45){spr=SP.yellow;s=rand(10,19);life=rand(.45,.8);vy=rand(-88,-56)}
  else if(q<.86){spr=SP.orange;s=rand(15,28);life=rand(.65,1.15);vy=rand(-72,-42)}
  else{spr=SP.red;s=rand(20,36);life=rand(.85,1.4);vy=rand(-56,-30)}
  s*=SC;
  flames.push({x,y,vx:rand(-9,9),vy:vy*SC,life,max:life,s:s*rand(.85,1.3),spr,seed:rand(TAU)});
}
function spawnEmber(burst){
  embers.push({ax:fr.x+rand(-1,1)*fr.r*.45,y:fr.y-rand(0,fr.r*.55),th:rand(TAU),
    av:rand(1.4,3.6)*(Math.random()<.5?-1:1),r0:rand(2,8)*SC,r1:rand(20,64)*SC,
    vy:rand(36,82)*SC*(burst?1.7:1),vx:rand(-12,12),age:0,life:rand(2.2,4.8),s:rand(1.1,2.5)*SC,ph:rand(TAU)});
}

/* ---------- audio (optional, synthesized) ---------- */
const Snd={ac:null,on:false,master:null,bedG:null,hissG:null,nb:null,
  ensure(){if(this.ac)return;const A=this.ac=new (window.AudioContext||window.webkitAudioContext)();
    this.master=A.createGain();this.master.gain.value=0;this.master.connect(A.destination);
    const nb=A.createBuffer(1,A.sampleRate*2,A.sampleRate);const d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=nb;
    const s1=A.createBufferSource();s1.buffer=nb;s1.loop=true;
    const lp=A.createBiquadFilter();lp.type="lowpass";lp.frequency.value=220;
    this.bedG=A.createGain();this.bedG.gain.value=.04;
    s1.connect(lp);lp.connect(this.bedG);this.bedG.connect(this.master);s1.start();
    const s2=A.createBufferSource();s2.buffer=nb;s2.loop=true;s2.playbackRate.value=.7;
    const bp=A.createBiquadFilter();bp.type="bandpass";bp.frequency.value=2600;bp.Q.value=.7;
    this.hissG=A.createGain();this.hissG.gain.value=.006;
    s2.connect(bp);bp.connect(this.hissG);this.hissG.connect(this.master);s2.start();},
  toggle(){this.ensure();this.ac.resume();this.on=!this.on;
    this.master.gain.setTargetAtTime(this.on?.9:0,this.ac.currentTime,.3);return this.on},
  pop(v){if(!this.on||!this.ac)return;const A=this.ac,s=A.createBufferSource();s.buffer=this.nb;s.playbackRate.value=rand(.4,1.6);
    const f=A.createBiquadFilter();f.type="bandpass";f.frequency.value=rand(700,3400);f.Q.value=rand(.8,2.5);
    const g=A.createGain();const t0=A.currentTime;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.16*(v||1),t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+rand(.04,.12));
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t0);s.stop(t0+.2);},
  chirp(){if(!this.on||!this.ac)return;const A=this.ac,t0=A.currentTime+rand(0,.3),f=rand(4100,4900);
    const n=3+(Math.random()*2|0);
    for(let i=0;i<n;i++){const o=A.createOscillator();o.type="sine";o.frequency.value=f;
      const g=A.createGain();const ts=t0+i*.055;
      g.gain.setValueAtTime(0,ts);g.gain.linearRampToValueAtTime(.02,ts+.012);g.gain.linearRampToValueAtTime(0,ts+.04);
      o.connect(g);g.connect(this.master);o.start(ts);o.stop(ts+.06);}}
};

/* ---------- update ---------- */
function update(dt,F){
  const rate=(RM?85:150)*SC*(1+stoke*2.4)*(.65+.5*F);
  flameAcc+=rate*dt;
  while(flameAcc>1&&flames.length<460){flameAcc--;spawnFlame()}
  for(let i=flames.length-1;i>=0;i--){const p=flames[i];p.life-=dt;
    if(p.life<=0){flames.splice(i,1);continue}
    const rise=1-p.life/p.max;
    p.vy-=30*SC*dt;
    p.x+=(p.vx+Math.sin(t*3.2+p.seed+p.y*.02)*30*SC+wind*70*rise)*dt;
    p.x+=(fr.x-p.x)*dt*1.1*rise;
    p.y+=p.vy*dt;}
  emberAcc+=(2+F*1.6+stoke*22)*dt;
  while(emberAcc>1&&embers.length<240){emberAcc--;spawnEmber(false)}
  for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.age+=dt;
    if(e.age>=e.life){embers.splice(i,1);continue}
    e.th+=e.av*dt;e.r0+=(e.r1-e.r0)*dt*.55;
    e.y-=e.vy*dt;e.vy*=1-dt*.12;e.ax+=(e.vx+wind*34)*dt;}
  smokeAcc+=dt*(2.6+stoke*7);
  while(smokeAcc>1){smokeAcc--;smoke.push({x:fr.x+rand(-8,8),y:fr.y-fr.r*1.9-rand(0,26),vx:rand(-5,5),vy:rand(-30,-16)*SC,s:rand(9,18)*SC,life:rand(3,5.5),age:0,seed:rand(TAU)})}
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.age+=dt;
    if(s.age>=s.life){smoke.splice(i,1);continue}
    s.x+=(s.vx+wind*46+Math.sin(t*.9+s.seed)*7)*dt;s.y+=s.vy*dt;s.s+=dt*16*SC;s.vx*=1-dt*.3;}
  meteorT-=dt;if(meteorT<=0){meteorT=rand(5,16);
    meteors.push({x:rand(W*.08,W*.92),y:rand(H*.03,H*.28),vx:(Math.random()<.5?-1:1)*rand(300,540),vy:rand(80,190),age:0,life:rand(.7,1.25)})}
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.age+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.age>=m.life)meteors.splice(i,1)}
  cricketT-=dt;if(cricketT<=0&&crickets.length<2){cricketT=rand(3.5,9);
    const cands=w.grassBack.filter(b=>b.d>fr.r*2.2&&b.d<fr.r*8);
    if(cands.length){const b=cands[Math.random()*cands.length|0];
      crickets.push({x0:b.x,y0:b.y,dx:rand(-46,46),h:rand(9,20)*SC,t:0,dur:rand(.45,.7)});
      if(Snd.on)Snd.chirp();}}
  for(let i=crickets.length-1;i>=0;i--){const c=crickets[i];c.t+=dt;
    if(c.t>=c.dur){for(const b of w.grassBack){if(Math.abs(b.x-c.x0-c.dx)<42&&Math.abs(b.y-c.y0)<30)b.tw=1}crickets.splice(i,1)}}
  for(let i=0;i<w.grassBack.length;i++){const b=w.grassBack[i];
    if(b.tw>0)b.tw-=dt*2.4;
    else if(Math.random()<dt*.014*(.3+clamp(1-Math.abs(b.d-fr.r*3.5)/(fr.r*4),0,1)*2))b.tw=1;}
  for(const L of w.logs){L.age+=dt/L.life;
    if(L.age>=1){Object.assign(L,newLog(rand(TAU),0));
      smoke.push({x:fr.x+rand(-6,6),y:fr.y-fr.r*1.1,vx:rand(-4,4),vy:rand(-26,-14)*SC,s:rand(8,14)*SC,life:rand(2,3.5),age:0,seed:rand(TAU)});
      for(let k=0;k<5;k++)spawnEmber(true);
      if(Snd.on)Snd.pop(.8);}}
  if(Snd.on&&Snd.ac){const n=Snd.ac.currentTime;
    Snd.bedG.gain.setTargetAtTime(.026+F*.04+stoke*.06,n,.09);
    Snd.hissG.gain.setTargetAtTime(.004+F*.011+stoke*.02,n,.09);
    popT-=dt*(1+stoke*4);if(popT<=0){popT=rand(.05,.5);Snd.pop(.35+Math.random()*.5+stoke*.5)}
    chirpT-=dt;if(chirpT<=0){chirpT=rand(3,9);Snd.chirp()}}
}

/* ---------- scene painters ---------- */
function drawSky(F){
  const hz=w.horizon;
  let g=bx.createLinearGradient(0,0,0,hz*1.02);
  g.addColorStop(0,"#020308");g.addColorStop(.5,"#060c1c");g.addColorStop(.82,"#0b1424");g.addColorStop(1,"#101b30");
  bx.fillStyle=g;bx.fillRect(0,0,W,hz+2);
  bx.save();bx.translate(W*.5,H*.26);bx.rotate(-.48);
  g=bx.createLinearGradient(0,-110,0,110);
  g.addColorStop(0,"rgba(180,200,255,0)");g.addColorStop(.5,"rgba(190,208,255,.05)");g.addColorStop(1,"rgba(180,200,255,0)");
  bx.fillStyle=g;bx.fillRect(-W,-110,W*2,220);bx.restore();
  g=bx.createRadialGradient(fr.x,hz,0,fr.x,hz,W*.5);
  g.addColorStop(0,"rgba(255,120,48,"+(.10*F+.03).toFixed(3)+")");g.addColorStop(1,"rgba(255,120,48,0)");
  bx.fillStyle=g;bx.fillRect(0,0,W,hz+2);
}
function drawStars(){
  for(const s of w.stars){const a=s.b*(.4+.6*(.5+.5*Math.sin(t*s.s+s.p)));
    if(a<.06)continue;
    bx.fillStyle="rgba("+s.c+","+a.toFixed(3)+")";
    bx.beginPath();bx.arc(s.x,s.y,s.r,0,TAU);bx.fill();
    if(s.big&&a>.5){bx.strokeStyle="rgba("+s.c+","+(a*.35).toFixed(3)+")";bx.lineWidth=.7;
      bx.beginPath();bx.moveTo(s.x-5,s.y);bx.lineTo(s.x+5,s.y);bx.moveTo(s.x,s.y-5);bx.lineTo(s.x,s.y+5);bx.stroke();}}
}
function drawMeteors(){
  for(const m of meteors){const q=clamp(m.age/m.life,0,1),a=Math.sin(Math.PI*q);
    const tx=m.x-m.vx*.13,ty=m.y-m.vy*.13;
    const g=bx.createLinearGradient(m.x,m.y,tx,ty);
    g.addColorStop(0,"rgba(255,250,235,"+(.9*a).toFixed(3)+")");g.addColorStop(1,"rgba(140,180,255,0)");
    bx.strokeStyle=g;bx.lineWidth=1.6;
    bx.beginPath();bx.moveTo(m.x,m.y);bx.lineTo(tx,ty);bx.stroke();
    bx.fillStyle="rgba(255,255,240,"+a.toFixed(3)+")";
    bx.beginPath();bx.arc(m.x,m.y,1.6,0,TAU);bx.fill();
    bx.fillStyle="rgba(200,220,255,"+(a*.25).toFixed(3)+")";
    bx.beginPath();bx.arc(m.x,m.y,5,0,TAU);bx.fill();}
}
function drawTreeline(){
  bx.fillStyle="#05080f";
  bx.beginPath();bx.moveTo(-30,w.horizon+3);
  for(const tr of w.treeline){bx.lineTo(tr.x+tr.w/2,w.horizon-tr.h);bx.lineTo(tr.x+tr.w,w.horizon+3)}
  bx.lineTo(W+30,w.horizon+3);bx.closePath();bx.fill();
  for(const p of w.pines){bx.beginPath();
    for(let k=0;k<3;k++){const yy=w.horizon-p.h*k/3,ww=p.wd*(1-k*.28),hh=p.h*.45;
      bx.moveTo(p.x-ww/2,yy);bx.lineTo(p.x,yy-hh);bx.lineTo(p.x+ww/2,yy);}
    bx.fill();}
}
function drawGround(F){
  let g=bx.createLinearGradient(0,w.horizon,0,H);
  g.addColorStop(0,"#0b0e09");g.addColorStop(.4,"#070906");g.addColorStop(1,"#030403");
  bx.fillStyle=g;bx.fillRect(0,w.horizon,W,H-w.horizon);
  const R=Math.min(W,H)*(.62+.09*F);
  g=bx.createRadialGradient(fr.x,fr.y,fr.r*.3,fr.x,fr.y,R);
  g.addColorStop(0,"rgba(255,150,66,"+(.22*F).toFixed(3)+")");
  g.addColorStop(.45,"rgba(255,100,36,"+(.09*F).toFixed(3)+")");
  g.addColorStop(1,"rgba(255,80,30,0)");
  bx.fillStyle=g;bx.fillRect(0,w.horizon,W,H-w.horizon);
}
function drawTreeShadow(T,F){
  const dir=T.x<fr.x?1:-1;
  const j=1+.14*Math.sin(t*8.3+T.seed)+.08*Math.sin(t*13.7+T.seed*2)+(1-F)*.3;
  const len=(170*SC+110*SC*(1.05-F))*j;
  const swy=Math.sin(t*6.1+T.seed)*5*SC;
  bx.fillStyle="rgba(2,3,7,"+(.3+.28*F).toFixed(3)+")";
  bx.beginPath();
  bx.moveTo(T.x-T.w*.55,T.baseY+2);
  bx.lineTo(T.x+dir*len,T.baseY+20+swy);
  bx.lineTo(T.x+dir*len*.92,T.baseY+34+swy);
  bx.lineTo(T.x+T.w*.55,T.baseY+2);
  bx.closePath();bx.fill();
}
function drawTree(T,F){
  const side=fr.x>T.x?1:-1;
  const x=T.x,bY=T.baseY,tY=T.topY,bw=T.w,tw=T.w*.42,ln=T.lean;
  bx.fillStyle="rgba(4,7,12,.95)";
  bx.beginPath();bx.ellipse(x+ln,tY-6,bw*1.5,bw*.9,0,0,TAU);bx.fill();
  bx.beginPath();bx.ellipse(x+ln-bw,tY+bw*.3,bw*1.1,bw*.7,0,0,TAU);bx.fill();
  bx.beginPath();bx.ellipse(x+ln+bw,tY+bw*.35,bw*1.05,bw*.65,0,0,TAU);bx.fill();
  const g=bx.createLinearGradient(x-bw/2,0,x+bw/2,0);
  if(side>0){g.addColorStop(0,"#0c0806");g.addColorStop(1,"#2b1a0f")}else{g.addColorStop(0,"#2b1a0f");g.addColorStop(1,"#0c0806")}
  bx.fillStyle=g;
  bx.beginPath();
  bx.moveTo(x-bw/2,bY);
  bx.quadraticCurveTo(x-bw*.4+ln*.35,(bY+tY)/2,x-tw/2+ln,tY);
  bx.lineTo(x+tw/2+ln,tY);
  bx.quadraticCurveTo(x+bw*.4+ln*.35,(bY+tY)/2,x+bw/2,bY);
  bx.closePath();bx.fill();
  bx.fillStyle="#0c0806";
  bx.beginPath();bx.moveTo(x-bw*.45,bY);bx.lineTo(x-bw*.9,bY+9);bx.lineTo(x-bw*.2,bY+4);bx.closePath();bx.fill();
  bx.beginPath();bx.moveTo(x+bw*.45,bY);bx.lineTo(x+bw*.9,bY+9);bx.lineTo(x+bw*.2,bY+4);bx.closePath();bx.fill();
  bx.strokeStyle="rgba(0,0,0,.35)";bx.lineWidth=1.2;
  for(let k=0;k<3;k++){const o=(k-1)*bw*.18;
    bx.beginPath();bx.moveTo(x+o,bY-4);bx.quadraticCurveTo(x+o+ln*.3,(bY+tY)/2,x+o*.6+ln*.8,tY+bw);bx.stroke();}
  function rimPath(){bx.beginPath();
    if(side>0){bx.moveTo(x+bw/2,bY);bx.quadraticCurveTo(x+bw*.4+ln*.35,(bY+tY)/2,x+tw/2+ln,tY)}
    else{bx.moveTo(x-bw/2,bY);bx.quadraticCurveTo(x-bw*.4+ln*.35,(bY+tY)/2,x-tw/2+ln,tY)}}
  const rimA=.22+.42*F;
  bx.strokeStyle="rgba(255,148,66,"+(rimA*.35).toFixed(3)+")";bx.lineWidth=6;rimPath();bx.stroke();
  bx.strokeStyle="rgba(255,170,90,"+rimA.toFixed(3)+")";bx.lineWidth=1.8;rimPath();bx.stroke();
  for(const b of T.branches){const yb=lerp(bY,tY,b.t),xb=x+ln*b.t;
    bx.strokeStyle="#0d0906";bx.lineWidth=5*SC;
    bx.beginPath();bx.moveTo(xb,yb);
    bx.quadraticCurveTo(xb+b.dir*b.len*.5,yb-b.len*.12,xb+b.dir*b.len,yb-b.len*.42);bx.stroke();
    bx.lineWidth=2.5*SC;
    bx.beginPath();bx.moveTo(xb+b.dir*b.len*.55,yb-b.len*.16);
    bx.quadraticCurveTo(xb+b.dir*b.len*.8,yb-b.len*.3,xb+b.dir*b.len*.95,yb-b.len*.6);bx.stroke();
    bx.strokeStyle="rgba(255,140,60,"+(.14*F+.05).toFixed(3)+")";bx.lineWidth=1.2;
    bx.beginPath();bx.moveTo(xb,yb+2);bx.quadraticCurveTo(xb+b.dir*b.len*.5,yb-b.len*.1+2,xb+b.dir*b.len,yb-b.len*.4+3);bx.stroke();}
}
function drawBlade(c,b,F,front){
  const light=Math.pow(clamp(1-b.d/(fr.r*6.8),0,1),1.5)*(.4+.6*F);
  const jit=b.tw>0?Math.sin(t*57+b.ts)*5.5*b.tw*(b.h/26):0;
  const sway=Math.sin(t*b.sp+b.ph)*b.h*.1+wind*b.h*.65+jit;
  const tx=b.x+b.lean+sway,ty=b.y-b.h;
  c.lineCap="round";
  c.beginPath();c.moveTo(b.x,b.y);
  c.quadraticCurveTo(b.x+(b.lean+sway)*.3,b.y-b.h*.62,tx,ty);
  if(front){c.strokeStyle="#05070b";c.lineWidth=b.w+.7;c.stroke();
    if(light>.04){const sg=Math.sign(b.x-fr.x);
      c.beginPath();c.moveTo(b.x-sg*1.1,b.y);
      c.quadraticCurveTo(b.x+(b.lean+sway)*.3-sg*1.1,b.y-b.h*.62,tx-sg*1.3,ty);
      c.strokeStyle="rgba(255,142,58,"+(.55*light).toFixed(3)+")";c.lineWidth=b.w*.5;c.stroke();}}
  else{c.strokeStyle=rgb(lerp(17,236,light*.85)*b.g,lerp(32,142,light*.6)*b.g,lerp(15,44,light*.35));
    c.lineWidth=b.w;c.stroke();}
}
function drawCrickets(){
  for(const c of crickets){const q=clamp(c.t/c.dur,0,1);
    const x=lerp(c.x0,c.x0+c.dx,q),y=c.y0-Math.sin(Math.PI*q)*c.h;
    bx.fillStyle="rgba(3,4,6,.9)";
    bx.beginPath();bx.ellipse(x,y,2.6,1.5,0,0,TAU);bx.fill();
    bx.fillStyle="rgba(255,150,70,.25)";
    bx.fillRect(x-1,y-1.6,1.2,.8);}
}
function drawStoneShadow(c,s,F){
  const dx=s.x-fr.x,dy=(s.y-fr.y)*1.5,d=Math.hypot(dx,dy)||1;
  const jl=1+.18*Math.sin(t*9.1+s.i*2.4)+(1-F)*.22;
  const len=s.sz*(1.15+(1.1-F)*.9)*jl;
  c.fillStyle="rgba(2,3,7,"+(.28+.26*F).toFixed(3)+")";
  c.beginPath();c.ellipse(s.x+dx/d*len,s.y+dy/d*len*.35+3,s.sz*1.05,s.sz*.4,Math.atan2(dy,dx),0,TAU);c.fill();
}
function drawStone(c,s,F){
  const dx=fr.x-s.x,dy=fr.y-s.y,d=Math.hypot(dx,dy)||1,lx=dx/d,ly=dy/d;
  const warmN=clamp((.3+.7*F)*s.tone*clamp(1.7-d/(fr.r*4.2),.3,1.15),0,1.25);
  const g=c.createLinearGradient(s.x-lx*s.sz,s.y-ly*s.sz*.7,s.x+lx*s.sz,s.y+ly*s.sz*.7);
  g.addColorStop(0,rgb(lerp(96,255,warmN*.75),lerp(90,158,warmN*.62),lerp(84,64,warmN*.5)));
  g.addColorStop(.55,"rgb(52,48,45)");
  g.addColorStop(1,"rgb(20,18,17)");
  c.fillStyle=g;
  c.beginPath();
  s.pts.forEach((p,i)=>{i?c.lineTo(s.x+p[0],s.y+p[1]):c.moveTo(s.x+p[0],s.y+p[1])});
  c.closePath();c.fill();
}
function drawCoalsBed(F){
  bx.fillStyle="#0d0805";
  bx.beginPath();bx.ellipse(fr.x,fr.y+3,fr.r*1.18,fr.r*.42,0,0,TAU);bx.fill();
  bx.fillStyle="#160b05";
  bx.beginPath();bx.ellipse(fr.x,fr.y,fr.r*.85,fr.r*.3,0,0,TAU);bx.fill();
  bx.globalCompositeOperation="lighter";
  for(const c of w.coals){const p=.5+.5*Math.sin(t*c.sp+c.ph);
    const a=(.18+.5*p)*(.45+.55*F);
    const spr=c.warm?SP.orange:SP.red,rr=c.r*(2.2+p);
    bx.globalAlpha=a;bx.drawImage(spr,fr.x+c.ox*fr.r*.8-rr,fr.y+c.oy*fr.r*.3-rr,rr*2,rr*2);}
  bx.globalAlpha=1;bx.globalCompositeOperation="source-over";
}
function drawLog(c,L,F,front){
  const age=L.age,char=smooth(.12,.68,age),col=smooth(.78,.97,age);
  const fade=1-smooth(.92,1,age)*.92;
  const th=L.th+col*.7*Math.sin(L.seed*3.1);
  const bd=fr.r*1.06*(1-col*.55);
  const lx0=fr.x+Math.cos(th)*bd,ly0=fr.y+Math.sin(th)*bd*.42+2;
  if(front?ly0<fr.y:ly0>=fr.y)return;
  const ax=fr.x+Math.cos(th)*fr.r*.14+Math.sin(L.seed)*4;
  const ay=fr.y-fr.r*(1.02-col*.88)+Math.sin(th)*fr.r*.05;
  const dx=ax-lx0,dy=ay-ly0,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  const w0=L.w*(1-col*.45),w1=w0*.4;
  const br=lerp(122,30,char),bgc=lerp(88,21,char),bb=lerp(58,14,char);
  c.beginPath();
  c.moveTo(lx0+nx*w0/2,ly0+ny*w0/2);
  c.lineTo(ax+nx*w1/2,ay+ny*w1/2);
  c.lineTo(ax-nx*w1/2,ay-ny*w1/2);
  c.lineTo(lx0-nx*w0/2,ly0-ny*w0/2);
  c.closePath();
  const g=c.createLinearGradient(lx0-nx*w0/2,ly0-ny*w0/2,lx0+nx*w0/2,ly0+ny*w0/2);
  g.addColorStop(0,rgb(br*.45,bgc*.45,bb*.45));
  g.addColorStop(.5,rgb(br,bgc,bb));
  g.addColorStop(1,rgb(br*.7,bgc*.7,bb*.7));
  c.globalAlpha=fade;c.fillStyle=g;c.fill();
  const glow=char*(.45+.55*F)*(.75+.25*Math.sin(t*3.1+L.seed));
  const g2=c.createLinearGradient(lx0,ly0,ax,ay);
  g2.addColorStop(0,"rgba(255,110,36,0)");
  g2.addColorStop(.55,"rgba(255,110,36,"+(.12*glow).toFixed(3)+")");
  g2.addColorStop(1,"rgba(255,150,60,"+(.5*glow).toFixed(3)+")");
  c.fillStyle=g2;c.fill();
  if(char<.7){c.strokeStyle="rgba(30,20,12,"+(.5*(1-char)).toFixed(3)+")";c.lineWidth=1;
    for(let k=0;k<3;k++){const o=(k/2-.5)*.6*w0;
      c.beginPath();c.moveTo(lx0+nx*o+ux*len*.08,ly0+ny*o+uy*len*.08);
      c.lineTo(lx0+nx*o*.7+ux*len*.85,ly0+ny*o*.7+uy*len*.85);c.stroke();}}
  if(char>.22){c.save();c.globalCompositeOperation="lighter";
    for(const cr of L.cracks){c.beginPath();
      cr.forEach((pt,i)=>{const ww=lerp(w0,w1,pt[0])/2;
        const X=lx0+ux*len*pt[0]+nx*pt[1]*ww,Y=ly0+uy*len*pt[0]+ny*pt[1]*ww;
        i?c.lineTo(X,Y):c.moveTo(X,Y)});
      c.strokeStyle="rgba(255,90,26,"+(.28*glow*fade).toFixed(3)+")";c.lineWidth=3.2*SC;c.stroke();
      c.strokeStyle="rgba(255,214,140,"+(.75*glow*fade).toFixed(3)+")";c.lineWidth=1.1*SC;c.stroke();}
    c.restore();}
  c.save();c.translate(lx0,ly0);c.rotate(Math.atan2(dy,dx));
  c.fillStyle=rgb(lerp(196,40,char),lerp(158,27,char),lerp(106,17,char));
  c.beginPath();c.ellipse(0,0,w0*.18,w0*.5,0,0,TAU);c.fill();
  c.strokeStyle="rgba(60,40,24,"+(.6*(1-char*.7)).toFixed(3)+")";c.lineWidth=1;
  for(let k=1;k<=3;k++){c.beginPath();c.ellipse(0,0,w0*.18*k/3.6,w0*.5*k/3.6,0,0,TAU);c.stroke();}
  if(char>.35){c.strokeStyle="rgba(255,120,44,"+(.6*glow).toFixed(3)+")";c.lineWidth=1.2;
    for(let k=0;k<3;k++){const aa=L.seed+k*2.1;
      c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(aa)*w0*.16,Math.sin(aa)*w0*.44);c.stroke();}}
  c.restore();c.globalAlpha=1;
}

/* ---------- main-canvas painters ---------- */
function blobAt(spr,x,y,rw,rh,a){ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(spr,x-rw,y-rh,rw*2,rh*2)}
function heat(F){
  const bandW=Math.max(fr.r*3.4,150);
  const yTop=fr.y-H*.5,yBot=fr.y-fr.r*.15;
  const sx0=Math.max(0,Math.round((fr.x-bandW)*DPR)),sx1=Math.min(bg.width,Math.round((fr.x+bandW)*DPR));
  const sw=sx1-sx0;if(sw<=0)return;
  const step=Math.max(2,Math.round(2*DPR));
  const ampS=RM?.4:1;
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  const y0=Math.max(0,Math.round(yTop*DPR)),y1=Math.min(bg.height,Math.round(yBot*DPR));
  for(let y=y0;y<y1;y+=step){
    const yc=y/DPR;
    const vert=smooth(yTop,yTop+H*.12,yc)*(1-smooth(yBot-70,yBot,yc));
    if(vert<=.004)continue;
    const dx=(Math.sin(yc*.088+t*8.4)*3.4+Math.sin(yc*.033-t*5.3+1.7)*2.6)*vert*(.45+.75*F)*ampS;
    ctx.drawImage(bg,sx0,y,sw,step,sx0+dx*DPR,y,sw,step);
  }
  ctx.restore();
}
function drawFlames(F){
  ctx.globalCompositeOperation="lighter";
  const wob=Math.sin(t*7.7)*3*SC+wind*26;
  blobAt(SP.red,fr.x+wob,fr.y-fr.r*.55,fr.r*(1.5+.25*F),fr.r*(2.1+.4*F),.28*F);
  blobAt(SP.orange,fr.x-wob*.6,fr.y-fr.r*.45,fr.r*(1.05+.2*F),fr.r*(1.6+.3*F),.4*F);
  blobAt(SP.yellow,fr.x+wob*.4,fr.y-fr.r*.3,fr.r*.7,fr.r*(1.05+.2*F),.42*F);
  blobAt(SP.white,fr.x,fr.y-fr.r*.12,fr.r*.38,fr.r*.55,.4*F);
  for(const p of flames){const ageN=1-p.life/p.max;
    const a=smooth(0,.12,ageN)*(1-smooth(.5,1,ageN));
    if(a<=0)continue;
    const sz=p.s*(.4+.6*(p.life/p.max));
    ctx.globalAlpha=a*.85;
    ctx.drawImage(p.spr,p.x-sz,p.y-sz*2.4,sz*2,sz*3.4);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}
function coalsHot(F){
  ctx.globalCompositeOperation="lighter";
  blobAt(SP.yellow,fr.x,fr.y-2,fr.r*.75,fr.r*.3,.5*F);
  blobAt(SP.white,fr.x,fr.y-4,fr.r*.4,fr.r*.16,.45*F);
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}
function drawSmoke(){
  for(const s of smoke){const q=s.age/s.life;
    const a=.11*smooth(0,.18,q)*(1-smooth(.45,1,q));
    if(a<=.004)continue;
    ctx.globalAlpha=a;ctx.drawImage(SP.smoke,s.x-s.s,s.y-s.s,s.s*2,s.s*2);}
  ctx.globalAlpha=1;
}
function drawEmbers(){
  ctx.globalCompositeOperation="lighter";
  for(const e of embers){const q=e.age/e.life;
    const fade=smooth(0,.15,q)*(1-smooth(.55,1,q));
    const twk=.55+.45*Math.sin(t*22+e.ph);
    const pop=Math.sin(t*34+e.ph*3)>.985?2.2:1;
    const x=e.ax+Math.cos(e.th)*e.r0,y=e.y+Math.sin(e.th)*e.r0*.35;
    const s=e.s*3*pop;
    ctx.globalAlpha=.55*fade*twk;
    ctx.drawImage(SP.ember,x-s,y-s,s*2,s*2);
    ctx.globalAlpha=fade*(.5+.5*twk);
    ctx.fillStyle=q<.5?"#ffe9b0":"#ff9a4a";
    ctx.beginPath();ctx.arc(x,y,e.s*.8*pop,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}

/* ---------- render ---------- */
function render(F){
  bx.setTransform(DPR,0,0,DPR,0,0);
  drawSky(F);drawStars();drawMeteors();drawTreeline();drawGround(F);
  for(const T of w.trees)drawTreeShadow(T,F);
  for(const T of w.trees)drawTree(T,F);
  for(const b of w.grassBack)drawBlade(bx,b,F,false);
  drawCrickets();
  for(const s of w.stones)if(s.y<fr.y){drawStoneShadow(bx,s,F);drawStone(bx,s,F)}
  drawCoalsBed(F);
  for(const L of w.logs)drawLog(bx,L,F,false);

  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  heat(F);
  ctx.globalCompositeOperation="lighter";
  blobAt(SP.orange,fr.x,fr.y-fr.r*.2,Math.min(W,H)*.6,Math.min(W,H)*.5,.045*F);
  ctx.globalCompositeOperation="source-over";
  drawFlames(F);
  coalsHot(F);
  for(const L of w.logs)drawLog(ctx,L,F,true);
  for(const s of w.stones)if(s.y>=fr.y){drawStoneShadow(ctx,s,F);drawStone(ctx,s,F)}
  drawSmoke();
  for(const b of w.grassFront)drawBlade(ctx,b,F,true);
  drawEmbers();
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(w.vig,0,0);
}

/* ---------- loop ---------- */
function frame(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;t+=dt;
  flickTimer-=dt;if(flickTimer<=0){flickT=rand(.3,1);flickTimer=rand(.04,.16)}
  flick+=(flickT-flick)*clamp(dt*13,0,1);
  stoke=Math.max(0,stoke-dt*(.5+stoke*.5));
  wind+=(windT+Math.sin(t*.4)*.12-wind)*clamp(dt*2.2,0,1);
  const micro=.05*Math.sin(t*43)+.04*Math.sin(t*29.3+1.2)+.03*Math.sin(t*67.7+2.1);
  const F=clamp(flick+micro+stoke*.4,.1,1.35);
  update(dt,F);render(F);
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
const hint=document.getElementById("hint");
const btn=document.getElementById("snd");
addEventListener("pointermove",e=>{windT=clamp((e.clientX-fr.x)/W,-.5,.5)*.7});
cv.addEventListener("pointerdown",e=>{
  const d=Math.hypot(e.clientX-fr.x,(e.clientY-fr.y)*1.5);
  if(d<fr.r*3.6){stoke=Math.min(1.5,stoke+1);
    for(let k=0;k<18;k++)spawnFlame();
    for(let k=0;k<24;k++)spawnEmber(true);
    if(Snd.on){Snd.pop(1);Snd.pop(.6)}
    hint.classList.add("gone");}
});
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();
  stoke=Math.min(1.5,stoke+1);
  for(let k=0;k<24;k++)spawnEmber(true);
  if(Snd.on)Snd.pop(.9);
  hint.classList.add("gone");}});
btn.addEventListener("click",()=>{const on=Snd.toggle();
  btn.innerHTML=on?"&#10022; sound on":"&#10022; sound off";
  btn.setAttribute("aria-pressed",on);btn.blur();});
setTimeout(()=>hint.classList.add("gone"),12000);
let rsT;addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(build,180)});

build();
requestAnimationFrame(n=>{last=n;frame(n)});
</script>
</body>
