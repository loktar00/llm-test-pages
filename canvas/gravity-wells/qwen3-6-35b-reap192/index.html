<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Painting</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // --- Setup ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let w, h;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Clear background on resize just in case
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Configuration ---
        const MAX_WELLS = 5;
        const MIN_WELLS = 3;
        const PARTICLE_SPAWN_RATE = 4; // Particles per frame per well
        const FRICTION = 0.995;
        const WELLS_SPEED = 1.5;
        const TRAIL_FADE = 0.005; // Lower is slower fade
        
        // --- State ---
        const particles = [];
        const wells = [];
        
        // --- Utility ---
        const random = (min, max) => Math.random() * (max - min) + min;
        
        function createWell(x, y, mass) {
            return {
                x: x || random(100, width - 100),
                y: y || random(100, height - 100),
                vx: random(-WELLS_SPEED, WELLS_SPEED),
                vy: random(-WELLS_SPEED, WELLS_SPEED),
                mass: mass || random(100, 400),
                color: `hsl(${random(0, 360)}, 70%, 50%)`,
                radius: Math.sqrt(mass) * 0.5
            };
        }

        // Initialize Wells
        for (let i = 0; i < MIN_WELLS; i++) {
            wells.push(createWell());
        }

        // --- Particle Class ---
        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = 100;
                this.size = random(0.5, 2);
            }

            update() {
                // Physics
                this.vx *= FRICTION;
                this.vy *= FRICTION;
                this.x += this.vx;
                this.y += this.vy;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.8; // Brightness
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        // --- Event Handlers ---

        // Emit particles from edges
        function emitEdgeParticles() {
            if (wells.length === 0) return;

            // We want streams. Pick a random well, shoot particles from edges towards it 
            // but with slight randomness so they don't all hit the exact center.
            const targetWell = wells[Math.floor(Math.random() * wells.length)];
            const edge = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
            
            let px, py, angle;
            
            // Slight offset to create stream width
            const offset = (Math.random() - 0.5) * 100; 

            if (edge === 0) { // Top
                px = random(0, width);
                py = -10;
            } else if (edge === 1) { // Right
                px = width + 10;
                py = random(0, height);
            } else if (edge === 2) { // Bottom
                px = random(0, width);
                py = height + 10;
            } else { // Left
                px = -10;
                py = random(0, height);
            }

            // Calculate vector to well
            let dx = targetWell.x - px;
            let dy = targetWell.y - py;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            // Normalize and add randomness
            let speed = random(1, 3);
            let angle = Math.atan2(dy, dx);
            
            // Add some spread
            angle += random(-0.5, 0.5); 

            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed;

            // Color based on target well
            const c = targetWell.color;
            
            for(let i=0; i<PARTICLE_SPAWN_RATE; i++) {
                particles.push(new Particle(
                    px + random(-5,5), 
                    py + random(-5,5), 
                    vx + random(-0.5, 0.5), 
                    vy + random(-0.5, 0.5),
                    c
                ));
            }
        }

        // Physics Engine
        function updatePhysics() {
            // Update Wells
            wells.forEach(well => {
                well.x += well.vx;
                well.y += well.vy;
                
                // Bounce wells off walls
                if (well.x < 0 || well.x > width) well.vx *= -1;
                if (well.y < 0 || well.y > height) well.vy *= -1;

                // Wander slightly
                well.vx += random(-0.1, 0.1);
                well.vy += random(-0.1, 0.1);
                
                // Clamp velocity
                const speed = Math.sqrt(well.vx*well.vx + well.vy*well.vy);
                if (speed > WELLS_SPEED * 2) {
                    well.vx *= 0.9;
                    well.vy *= 0.9;
                }
            });

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                // Apply gravity from all wells
                for (let well of wells) {
                    const dx = well.x - p.x;
                    const dy = well.y - p.y;
                    const distSq = dx*dx + dy*dy;
                    const dist = Math.sqrt(distSq);
                    
                    // Collision/Death (absorbed)
                    if (dist < well.radius) {
                        particles.splice(i, 1);
                        continue;
                    }

                    // Gravity force
                    const force = (well.mass * 0.5) / distSq;
                    const ax = (dx / dist) * force;
                    const ay = (dy / dist) * force;
                    
                    p.vx += ax;
                    p.vy += ay;
                }
                
                p.update();
                
                // Remove if off screen (too far)
                if (p.x < -200 || p.x > width + 200 || p.y < -200 || p.y > height + 200) {
                    particles.splice(i, 1);
                }
            }

            // Ensure number of wells
            if (wells.length < MIN_WELLS) {
                if (Math.random() < 0.01) wells.push(createWell());
            }
            
            // Occasional Merge/Split
            if (Math.random() < 0.002 && wells.length > MIN_WELLS) {
                // Find closest pair
                let minDist = Infinity;
                let idx1 = -1, idx2 = -1;
                for(let i=0; i<wells.length; i++) {
                    for(let j=i+1; j<wells.length; j++) {
                        const dx = wells[i].x - wells[j].x;
                        const dy = wells[i].y - wells[j].y;
                        const d = Math.sqrt(dx*dx + dy*dy);
                        if (d < minDist) {
                            minDist = d;
                            idx1 = i;
                            idx2 = j;
                        }
                    }
                }
                
                if (minDist < 100) {
                    // Merge them
                    const w1 = wells[idx1];
                    const w2 = wells[idx2];
                    // Center of mass
                    const newX = (w1.x + w2.x) / 2;
                    const newY = (w1.y + w2.y) / 2;
                    const newMass = w1.mass + w2.mass;
                    const newVx = (w1.vx + w2.vx) / 2;
                    const newVy = (w1.vy + w2.vy) / 2;
                    
                    wells.splice(Math.max(idx1, idx2), 1);
                    wells.splice(Math.min(idx1, idx2), 1);
                    wells.push(createWell(newX, newY, newMass));
                    wells[wells.length-1].vx = newVx;
                    wells[wells.length-1].vy = newVy;
                }
            }
        }

        // --- Main Loop ---
        function loop() {
            // 1. Fade the existing canvas
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = `rgba(0, 0, 0, ${TRAIL_FADE})`;
            ctx.fillRect(0, 0, width, height);
            
            // 2. Set blending for additive mixing (Glow effect)
            ctx.globalCompositeOperation = 'lighter';
            
            // 3. Emit new particles
            emitEdgeParticles();
            
            // 4. Update physics
            updatePhysics();
            
            // 5. Draw particles
            // Note: We iterate directly. For performance with thousands of particles, 
            // we avoid creating objects in draw loop, though we create them in emit.
            // We only draw a subset to keep performance high if needed, 
            // but modern GPUs handle simple rects well.
            
            let count = 0;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.draw(ctx);
                count++;
            }
            
            // Optional: Limit particle count for performance. 
            // If we have too many, the trails become too long and heavy.
            if (particles.length > 8000) {
                particles.splice(0, particles.length - 8000);
            }

            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
