<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --glass-bg: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: rgba(0,0,0,0.4);
    --glow: rgba(139,92,246,0.35);
    --text-primary: rgba(255,255,255,0.92);
    --text-secondary: rgba(255,255,255,0.5);
    --text-label: rgba(255,255,255,0.45);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.1);
    --input-focus: rgba(139,92,246,0.6);
    --btn-bg: rgba(139,92,246,0.85);
    --btn-hover: rgba(167,139,250,0.95);
    --danger: rgba(239,68,68,0.8);
  }

  @supports (backdrop-filter: blur(1px)) {
    :root {
      --glass-bg: rgba(255,255,255,0.06);
    }
  }

  @supports not (backdrop-filter: blur(1px)) {
    :root {
      --glass-bg: rgba(20,10,40,0.88);
    }
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
  }

  /* ── Animated gradient background ── */
  .bg {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(ellipse 600px 600px at 20% 30%, rgba(88,28,135,0.6) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 75% 20%, rgba(30,58,138,0.5) 0%, transparent 70%),
      radial-gradient(ellipse 550px 550px at 60% 80%, rgba(6,78,59,0.45) 0%, transparent 70%),
      radial-gradient(ellipse 450px 450px at 10% 75%, rgba(131,24,67,0.4) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 85% 65%, rgba(30,27,75,0.5) 0%, transparent 70%),
      linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1628 100%);
    animation: drift 25s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%  { transform: translate(3%, -4%) rotate(1.5deg) scale(1.02); }
    50%  { transform: translate(-2%, 3%) rotate(-1deg) scale(0.98); }
    75%  { transform: translate(4%, 2%) rotate(2deg) scale(1.03); }
    100% { transform: translate(-3%, -2%) rotate(-1.5deg) scale(1); }
  }

  /* ── Glass card ── */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    padding: 48px 40px 40px;
    border-radius: 24px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 8px 32px var(--glass-shadow),
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 0 80px -20px var(--glow);
    animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Heading ── */
  .card h1 {
    font-size: 1.65rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .card .subtitle {
    font-size: 0.875rem;
    color: var(--text-secondary);
    margin-bottom: 36px;
    font-weight: 400;
  }

  /* ── Input groups ── */
  .field {
    position: relative;
    margin-bottom: 24px;
  }

  .field input {
    width: 100%;
    padding: 16px 16px 8px;
    font-size: 0.9375rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    -webkit-appearance: none;
  }

  .field input::placeholder {
    color: transparent;
  }

  .field label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.9375rem;
    color: var(--text-label);
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    transform-origin: left center;
  }

  .field input:focus ~ label,
  .field input:not(:placeholder-shown) ~ label {
    top: 10px;
    transform: translateY(0) scale(0.75);
    color: var(--input-focus);
  }

  .field input:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15), 0 0 20px -4px var(--glow);
    background: rgba(255,255,255,0.07);
  }

  /* ── Invalid / shake ── */
  .field input:user-invalid {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
  }

  .field input:user-invalid ~ label {
    color: var(--danger);
  }

  .field.shake {
    animation: shake 0.5s cubic-bezier(0.36,0.07,0.19,0.97) both;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-3px); }
    40%, 60% { transform: translateX(3px); }
  }

  /* ── Button ── */
  .btn {
    position: relative;
    width: 100%;
    padding: 15px 24px;
    margin-top: 8px;
    font-size: 0.9375rem;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.01em;
    color: #fff;
    background: var(--btn-bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    cursor: pointer;
    overflow: hidden;
    transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
  }

  .btn:hover {
    background: var(--btn-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(139,92,246,0.3), 0 0 40px -10px var(--glow);
  }

  .btn:active {
    transform: translateY(0) scale(0.985);
  }

  /* Shine sweep */
  .btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(
      105deg,
      transparent 20%,
      rgba(255,255,255,0.18) 50%,
      transparent 80%
    );
    transform: skewX(-20deg);
    transition: left 0.6s ease;
    pointer-events: none;
  }

  .btn:hover::after {
    left: 130%;
  }

  /* ── Forgot password ── */
  .forgot {
    display: block;
    text-align: right;
    margin-top: 18px;
    font-size: 0.8125rem;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.25s ease;
    position: relative;
  }

  .forgot::after {
    content: '';
    position: absolute;
    bottom: -1px;
    right: 0;
    width: 0;
    height: 1px;
    background: var(--text-secondary);
    transition: width 0.3s ease;
  }

  .forgot:hover {
    color: var(--text-primary);
  }

  .forgot:hover::after {
    width: 100%;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 28px 0;
    color: var(--text-secondary);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--input-border);
  }

  /* ── Sign-up link ── */
  .signup {
    text-align: center;
    font-size: 0.8125rem;
    color: var(--text-secondary);
  }

  .signup a {
    color: rgba(167,139,250,0.9);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.25s ease;
  }

  .signup a:hover {
    color: #c4b5fd;
  }

  /* ── Password toggle ── */
  .toggle-pw {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-label);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease;
  }

  .toggle-pw:hover {
    color: var(--text-primary);
  }

  .toggle-pw svg {
    width: 18px;
    height: 18px;
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .card {
      padding: 36px 28px 32px;
      border-radius: 20px;
    }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<form class="card" id="loginForm" novalidate autocomplete="off">
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to continue to your account</p>

  <div class="field" id="emailField">
    <input type="email" id="email" name="email" placeholder="Email address" required autocomplete="off" />
    <label for="email">Email address</label>
  </div>

  <div class="field" id="passwordField">
    <input type="password" id="password" name="password" placeholder="Password" required minlength="6" autocomplete="off" />
    <label for="password">Password</label>
    <button type="button" class="toggle-pw" aria-label="Toggle password visibility" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <button type="submit" class="btn">Sign in</button>

  <a href="#" class="forgot">Forgot password?</a>

  <div class="divider">or</div>

  <p class="signup">Don't have an account? <a href="#">Create one</a></p>
</form>

<script>
  const form = document.getElementById('loginForm');
  const emailField = document.getElementById('emailField');
  const passwordField = document.getElementById('passwordField');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const togglePw = document.querySelector('.toggle-pw');
  const eyeIcon = document.getElementById('eyeIcon');

  // Shake on blur if invalid
  [emailInput, passwordInput].forEach(input => {
    input.addEventListener('blur', () => {
      const field = input.closest('.field');
      if (input.validity.invalid && input.value.length > 0) {
        field.classList.add('shake');
        field.addEventListener('animationend', () => field.classList.remove('shake'), { once: true });
      }
    });

    // Remove shake on input
    input.addEventListener('input', () => {
      const field = input.closest('.field');
      field.classList.remove('shake');
    });
  });

  // Toggle password visibility
  let pwVisible = false;
  togglePw.addEventListener('click', () => {
    pwVisible = !pwVisible;
    passwordInput.type = pwVisible ? 'text' : 'password';
    eyeIcon.innerHTML = pwVisible
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  // Form submit
  form.addEventListener('submit', e => {
    e.preventDefault();
    let hasError = false;

    [emailInput, passwordInput].forEach(input => {
      const field = input.closest('.field');
      if (!input.validity.valid) {
        hasError = true;
        field.classList.add('shake');
        field.addEventListener('animationend', () => field.classList.remove('shake'), { once: true });
      }
    });

    if (!hasError) {
      const btn = form.querySelector('.btn');
      btn.textContent = 'Signing in…';
      btn.style.pointerEvents = 'none';
      setTimeout(() => {
        btn.textContent = '✓ Signed in';
        btn.style.background = 'rgba(34,197,94,0.7)';
        setTimeout(() => {
          btn.textContent = 'Sign in';
          btn.style.background = '';
          btn.style.pointerEvents = '';
          form.reset();
        }, 1500);
      }, 1200);
    }
  });
</script>

</body>
</html>
