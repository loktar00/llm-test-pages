<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dark Analytics Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d26;
      --border: #2a2e3a;
      --text: #c7c9d4;
      --muted: #7a7f92;
      --accent: #00c8ff;
      --green: #00e676;
      --red: #ff5252;
      --sidebar-w: 240px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }

    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: var(--sidebar-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .sidebar .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.65rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .nav-item:hover { background: rgba(255,255,255,0.04); }
    .nav-item.active { background: rgba(0,200,255,0.1); color: var(--accent); }

    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; fill: currentColor; }

    .main {
      margin-left: var(--sidebar-w);
      padding: 1.75rem 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .header h1 { font-size: 1.4rem; font-weight: 600; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .search-box {
      position: relative;
      width: 240px;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 0.85rem 0.5rem 2.2rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: var(--accent); }

    .search-box svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--muted);
      pointer-events: none;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      transition: transform 0.2s ease;
    }

    .card:hover { transform: translateY(-2px); }

    .card .title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .delta-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .delta-up { background: rgba(0,230,118,0.12); color: var(--green); }
    .delta-down { background: rgba(255,82,82,0.12); color: var(--red); }

    .charts {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }

    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }

    .chart-card .chart-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    canvas { width: 100%; height: auto; display: block; }

    @media(max-width: 900px) {
      .charts { grid-template-columns: 1fr; }
    }

    .tooltip {
      position: fixed;
      pointer-events: none;
      padding: 0.4rem 0.7rem;
      border-radius: 0.4rem;
      background: rgba(15,17,23,0.95);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text);
      font-weight: 500;
      backdrop-filter: blur(4px);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.15s ease;
      transform: translate(-50%, -120%);
    }

    .tooltip.show { opacity: 1; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">📊 Analytics</div>
    <nav>
      <a href="#" class="nav-item active">
        <svg><path d="M3 12l7-7v4h7v-4l7 7v7a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        Dashboard
      </a>
      <a href="#" class="nav-item">
        <svg><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        Reports
      </a>
      <a href="#" class="nav-item">
        <svg><path d="M3 7h18v2H3zM3 12h18v2H3zM3 17h12v2H3z"/></svg>
        Settings
      </a>
      <a href="#" class="nav-item">
        <svg><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v5l3 3" stroke="#fff" stroke-width="2" fill="none"/></svg>
        Logs
      </a>
    </nav>
  </aside>

  <main class="main">
    <header class="header">
      <h1>Analytics Dashboard</h1>
      <div class="header-right">
        <div class="search-box">
          <svg><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M1 1l22 22"/></svg>
          <input type="text" placeholder="Search..." />
        </div>
        <div class="avatar">U</div>
      </div>
    </header>

    <section class="cards">
      <div class="card">
        <div class="title">Total Sales</div>
        <div class="value" id="sales">0</div>
        <span class="delta-chip delta-up"><span>▲</span> +12.4%</span>
      </div>
      <div class="card">
        <div class="title">Visitors</div>
        <div class="value" id="visitors">0</div>
        <span class="delta-chip delta-down"><span>▼</span> -3.1%</span>
      </div>
      <div class="card">
        <div class="title">Conversions</div>
        <div class="value" id="conv">0%</div>
        <span class="delta-chip delta-up"><span>▲</span> +5.2%</span>
      </div>
      <div class="card">
        <div class="title">Revenue</div>
        <div class="value" id="rev">$0</div>
        <span class="delta-chip delta-down"><span>▼</span> -1.8%</span>
      </div>
    </section>

    <section class="charts">
      <div class="chart-card">
        <div class="chart-title">Sales Over Time</div>
        <canvas id="areaChart" width="600" height="260"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Traffic Sources</div>
        <canvas id="donutChart" width="260" height="260"></canvas>
      </div>
    </section>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const tooltip = document.getElementById('tooltip');

    // Count-up animation
    function animateValue(el, start, end, duration, prefix = '', suffix = '') {
      let startTs = null;
      const step = (ts) => {
        if (!startTs) startTs = ts;
        const progress = Math.min((ts - startTs) / duration, 1);
        const value = Math.floor(start + (end - start) * progress);
        el.textContent = prefix + value + suffix;
        if (progress < 1) window.requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    animateValue(document.getElementById('sales'), 0, 12847, 1200);
    animateValue(document.getElementById('visitors'), 0, 8932, 1200);
    animateValue(document.getElementById('conv'), 0, 27, 1200, '', '%');
    animateValue(document.getElementById('rev'), 0, 94200, 1200, '$');

    // Area chart drawing
    const areaCanvas = document.getElementById('areaChart');
    const areaCtx = areaCanvas.getContext('2d');
    const areaData = [20, 35, 30, 50, 45, 60, 75, 70, 85, 90];

    function drawAreaChart(progress) {
      areaCtx.clearRect(0, 0, areaCanvas.width, areaCanvas.height);

      const padding = 20;
      const chartW = areaCanvas.width - padding * 2;
      const chartH = areaCanvas.height - padding * 2;
      const n = areaData.length;

      areaCtx.beginPath();
      areaCtx.moveTo(padding, padding + chartH);
      areaCtx.lineTo(padding + chartW, padding + chartH);
      areaCtx.strokeStyle = 'var(--border)'.replace('var(--border)', '#2a2e3a');
      areaCtx.lineWidth = 1;
      areaCtx.stroke();

      areaCtx.beginPath();
      areaCtx.moveTo(padding, padding);
      areaCtx.lineTo(padding, padding + chartH);
      areaCtx.stroke();

      const maxVal = Math.max(...areaData);
      const scaleY = chartH / maxVal;

      areaCtx.fillStyle = 'rgba(0,200,255,0.1)';
      areaCtx.strokeStyle = 'var(--accent)'.replace('var(--accent)', '#00c8ff');
      areaCtx.lineWidth = 2;

      areaCtx.beginPath();
      areaCtx.moveTo(padding, padding + chartH);

      const visiblePoints = Math.floor(n * progress);

      for (let i = 0; i < visiblePoints; i++) {
        const x = padding + (chartW / (n - 1)) * i;
        const y = padding + chartH - areaData[i] * scaleY;
        if (i === 0) areaCtx.moveTo(x, y);
        else areaCtx.quadraticCurveTo(
          (padding + (chartW / (n - 1)) * (i - 1) + x) / 2,
          (padding + chartH - areaData[i - 1] * scaleY + y) / 2,
          x, y
        );
      }

      // Fill under the curve
      areaCtx.lineTo(padding + chartW, padding + chartH);
      areaCtx.closePath();
      areaCtx.fill();
      areaCtx.stroke();
    }

    let areaProgress = 0;
    const areaInterval = setInterval(() => {
      areaProgress += 0.02;
      drawAreaChart(areaProgress);
      if (areaProgress >= 1) clearInterval(areaInterval);
    }, 30);

    // Donut chart drawing
    const donutCanvas = document.getElementById('donutChart');
    const donutCtx = donutCanvas.getContext('2d');
    const donutData = [
      { label: 'Organic', value: 35, color: '#00c8ff' },
      { label: 'Referral', value: 25, color: '#7c4dff' },
      { label: 'Direct', value: 20, color: '#4facfe' },
      { label: 'Social', value: 20, color: '#ff5283' },
    ];

    function drawDonutChart(progress) {
      donutCtx.clearRect(0, 0, donutCanvas.width, donutCanvas.height);

      const centerX = donutCanvas.width / 2;
      const centerY = donutCanvas.height / 2;
      const radius = 90;
      const innerRadius = 65;

      const total = donutData.reduce((sum, d) => sum + d.value, 0);
      let startAngle = -Math.PI / 2;

      donutData.forEach(d => {
        const sliceAngle = (d.value / total) * progress * 2 * Math.PI;
        const endAngle = startAngle + sliceAngle;

        donutCtx.beginPath();
        donutCtx.arc(centerX, centerY, radius, startAngle, endAngle);
        donutCtx.arc(centerX, centerY, innerRadius, endAngle, startAngle, true);
        donutCtx.closePath();
        donutCtx.fillStyle = d.color;
        donutCtx.fill();

        startAngle = endAngle;
      });

      // Center label
      donutCtx.fillStyle = '#fff';
      donutCtx.font = 'bold 16px sans-serif';
      donutCtx.textAlign = 'center';
      donutCtx.fillText('Traffic', centerX, centerY - 5);
      donutCtx.font = 'normal 12px sans-serif';
      donutCtx.fillStyle = 'var(--muted)'.replace('var(--muted)', '#7a7f92');
      donutCtx.fillText('Sources', centerX, centerY + 12);
    }

    let donutProgress = 0;
    const donutInterval = setInterval(() => {
      donutProgress += 0.02;
      drawDonutChart(donutProgress);
      if (donutProgress >= 1) clearInterval(donutInterval);
    }, 30);

    // Tooltip functionality
    areaCanvas.addEventListener('mousemove', (e) => {
      const rect = areaCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const padding = 20;
      const chartW = areaCanvas.width - padding * 2;
      const n = areaData.length;
      const index = Math.min(Math.floor((x - padding) / (chartW / (n - 1))), n - 1);

      if (index >= 0) {
        tooltip.textContent = `Value: ${areaData[index]}`;
        tooltip.style.left = `${e.pageX}px`;
        tooltip.style.top = `${e.pageY}px`;
        tooltip.classList.add('show');
      }
    });

    areaCanvas.addEventListener('mouseleave', () => {
      tooltip.classList.remove('show');
    });

    donutCanvas.addEventListener('mousemove', (e) => {
      const rect = donutCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = donutCanvas.width / 2;
      const centerY = donutCanvas.height / 2;
      const radius = 90;
      const dist = Math.sqrt((x - centerX)**2 + (y - centerY)**2);

      if (dist >= 65 && dist <= 90) {
        const angle = Math.atan2(y - centerY, x - centerX);
        let deg = (angle * 180 / Math.PI + 90 + 360) % 360;

        const total = donutData.reduce((sum, d) => sum + d.value, 0);
        let cumulative = 0;

        for (const d of donutData) {
          const sliceAngle = (d.value / total) * 360;
          if (deg >= cumulative && deg < cumulative + sliceAngle) {
            tooltip.textContent = `${d.label}: ${d.value}%`;
            break;
          }
          cumulative += sliceAngle;
        }

        tooltip.style.left = `${e.pageX}px`;
        tooltip.style.top = `${e.pageY}px`;
        tooltip.classList.add('show');
      } else {
        tooltip.classList.remove('show');
      }
    });

    donutCanvas.addEventListener('mouseleave', () => {
      tooltip.classList.remove('show');
    });
  </script>
</body>
</html>
