<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Paper Planes</title>
<style>
*,html,body{margin:0;padding:0;height:100;width:100;overflow:hidden}
html,body{background:#0c0c0e;width:100%;height:100%;overflow:hidden}
#scene{display:block;width:100%;height:100()}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
'use strict';

(function(){
const canvas = document.getElementById('scene');
let ctx = canvas.getContext('2d', {lowLatency:true, alpha:false});
let W = 0, H = 0, DPR = 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.floor(W * DPR));
  canvas.height = Math.max(1, Math.floor(H * DPR));
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

// Utilities
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (t) * (b - a);

// Color palette
const PAPER = 252, 252, 252;
const PAPER_M = 218, 215, 220;
const PSHADOW = 40, 40, 50;

// Background bands (back to front, with parallax depth)
const BANDS = [
  { depth: 1.00, ceilingY: -1.4, ceilingGrad: ['#14121a', '#322c34'], floorY: 2.4, floorGrad: ['#242028', '#403036'], motes: 60 },
  { depth: 0.55, ceilingY: 0.5, ceilingGrad: ['#1e1a22', '#463e4e'], floorY: 2.2, floorGrad: ['#5c4856', '#403036'], motes: 40 },
  { depth: 0.10, ceilingY: 0.65, ceilingGrad: ['#2c2634', '#584f62'], floorY: 0.85, floorGrad: ['#1a1620', '#342436'], motes: 0 }
];

function bandColor(i, t) {
  const c = BANDS[i];
  const r0 = c.ceilingGrad[0].slice(1);
  const r1 = c.ceilingGrad[1].slice(1);
  const f0 = c.floorGrad[0].slice(1);
  const f1 = c.floorGrad[1].slice(1);
  const r = Math.round(parseInt(r0,16) + t*(parseInt(r1,16)-parseInt(r0,16)));
  const g = Math.round(parseInt(r0,16)+1*3 + t*0);
  const b = Math.round(parseInt(r0,16)+1*6 + t*0);
  // quick parse
  const p = (h, i) => parseInt(h.slice(i, i+2), 16);
  return `rgb(${Math.round(lerp(p(r0,1),p(r1,1),t),0)|0},${Math.round(lerp(p(r0,3),p(r1,3),t),0)|0},${Math.round(lerp(p(r0,5),p(r1,5),t),0)|0)`;
}

// Plane class
class Plane {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = rand(-0.05, 0.95) * W;
    this.y = rand(0.35, 0.45) * H;
    const dir = Math.random() < 0.5 ? -1 : 1;
    this.vx = dir * rand(80, 90);
    this.vy = rand(-20, 12);
    this.angle = this.vx >= 0 ? 0 : Math.PI;
    this.bank = 0;
    this.scale = rand(0.8, 1.0);
    this.targetBank = 0;
    this.life = 0;
    this.launching = true;
    this.launchDur = rand(0.6, 0.9);
    this.launchT = 0;
    this.launchStartX = this.x;
    this.launchStartY = this.y;
    this.launchBank = rand(-0.3, 0.3);
    this.launchDir = dir;
    this.launchEndY = this.launchStartY - rand(100, 140);
    this.launchEndX = this.launchStartX + this.launchDir * rand(150, 200);
    this.landed = false;
    this.landT = 0;
    this.landDuration = rand(0.6, 0.7);
    this.foldStart = 0;
    this.foldDur = 0.5;
    this.foldPhase = 0;
    this.foldDone = false;
    this.moteTimer = 0;
    this.trail = [];
  }
  
  update(dt) {
    if (this.landed) {
      this.landT += dt;
      if (this.landT < this.foldStart) {
        // floating phase
        this.vy += 10 * dt;
        this.y += this.vy * dt;
        if (this.y > H - 50) this.y = H - 50;
        return;
      }
      // folding phase
      const fp = (this.landT - this.foldStart) / this.foldDur;
      if (fp >= 1) {
        if (!this.foldDone) {
          // restart
          this.reset();
          this.launching = true;
        }
        return;
      }
      // during fold: still floats
      this.vy += 5 * dt;
      this.y += this.vy * dt;
      if (this.y > H - 50) this.y = H - 50;
      return;
    }
    
    this.life += dt;
    
    // Launch phase
    if (this.launching) {
      this.launchT += dt;
      const t = clamp(this.launchT / this.launchDur, 0, 1);
      const ease = Math.pow(t, 0.7);
      const x = lerp(this.launchStartX, this.launchEndX, ease);
      const y = lerp(this.launchStartY, this.launchEndY, ease);
      this.x = x;
      this.y = y;
      this.angle = this.launchDir > 0 ? 0 : Math.PI;
      this.bank = this.launchBank * (1 - ease) * 0.7;
      
      if (t >= 1) {
        this.launching = false;
        this.vx = this.launchDir * rand(90, 100);
        this.vy = rand(-10, 6);
        this.bank = 0;
      }
      return;
    }
    
    // Physics
    const speed = Math.hypot(this.vx, this.vy);
    // Lift: more lift when moving forward, and when climbing
    const liftMag = 18 * (0.5 + Math.abs(this.bank) * 0.5) * (Math.abs(this.vx) > 30 ? 1 : 0.6);
    this.vy -= liftMag * dt;
    
    // Bank turning
    if (Math.random() < 0.01) {
      this.targetBank = rand(-0.5, 0.5);
    }
    this.bank = lerp(this.bank, this.targetBank, 1 - Math.pow(0.5, dt * 0.6));
    
    const speedFactor = 1 + Math.abs(this.bank) * 0.5;
    const targetAngle = Math.PI/2 + Math.asin(clamp(this.bank, -1, 1)) * 0.5;
    
    // Drag
    const drag = 0.2 * dt;
    this.vx -= this.vx * drag;
    this.vy -= this.vy * drag * 1.5;
    
    // Gravity (mild)
    this.vy += 40 * dt;
    
    // Thermal loft
    if (Math.abs(this.x - THERMAL.cx) < THERMAL.halfW) {
      const fromCenter = (this.x - THERMAL.cx) / THERMAL.halfW;
      const proximity = 1 - Math.abs(fromCenter);
      const liftBoost = 60 * proximity;
      const targetVy = -120;
      this.vy = lerp(this.vy, targetVy, dt * 5 * proximity);
      // gentle push toward center horizontally
      this.vx -= fromCenter * 60 * dt * proximity;
      
      this.bank = lerp(this.bank, fromCenter * 0.6, dt * 3);
      
      this.moteTimer += dt;
      if (this.moteTimer > 0.03) {
        this.moteTimer = 0;
        if (motes.length < MOTE_CAP * 0.6) {
          motes.push(new Mote(
            this.x + rand(-5, 5), this.y + rand(-3, 3),
            rand(-3, 3), rand(-15, 20),
            rand(2, 4) * 0.3, rand(0.6, 0.9), 1
          ));
        }
      }
    }
    
    // Speed clamp
    const sp = Math.hypot(this.vx, this.vy);
    const MAX_SP = 150;
    if (sp > MAX_SP) {
      this.vx = this.vx / sp * MAX_SP;
      this.vy = this.vy / sp * MAX_SP;
    }
    
    // Integrate
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    
    // Trail
    this.trail.push({x: this.x, y: this.y, t: this.life});
    if (this.trail.length > 18) this.trail.shift();
    
    // Edge bounce
    const margin = 50;
    if (this.x < -margin) {
      this.x = -margin;
      this.vx = Math.abs(this.vx) * 0.5;
      this.targetBank = -this.bank;
    }
    if (this.x > W + margin) {
      this.x = W + margin;
      this.vx = -Math.abs(this.vx) * 0.5;
    }
    if (this.y < 60) {
      this.y = 60;
      this.vy = Math.abs(this.vy) * 0.2;
    }
    if (this.y < 130) {
      this.vy += 30 * dt; // soft push-down at ceiling
    }
    
    // Land detection
    if (this.y > H - 50 && !this.landed) {
      this.landed = true;
      this.landT = 0;
      this.foldStart = rand(0.6, 1.2);
      this.foldDur = 1.2;
      this.foldPhase = 0;
      this.foldDone = false;
      this.y = H - 50 + rand(-5, 5);
      this.x += rand(-10, 10);
      this.vx = 0;
      this.vy = 0;
      this.bank = rand(-0.05, 0.05);
      this.targetBank = this.bank;
      this.trail.length = 0;
      spawnDust(this.x, H - 50, 5);
    }
    
    // Slow bank toward 0
    this.targetBank *= Math.pow(0.5, dt * 0.2);
    if (Math.abs(this.bank) < 0.05) this.bank *= 0.8;
  }
  
  draw(c) {
    if (this.landed) {
      // Landed: floating + folding
      const foldAlpha = 1;
      const landTotal = this.landT;
      const fp = clamp((landTotal - this.foldStart) / this.foldDur, 0, 1);
      const ease = Math.pow(fp, 0.8);
      const foldAngle = ease * Math.PI * 2.4;
      
      c.save();
      c.translate(this.x, this.y);
      // gentle drift
      const drift = Math.sin(this.landT * 2.0 + this.x * 0.01) * 2;
      c.translate(drift, 0);
      // gentle bob
      const bob = Math.sin(this.landT * 4) * 1;
      c.translate(0, bob);
      c.rotate(this.bank + (foldAngle > 0 && foldAngle < Math.PI*2 ? Math.sin(foldAngle)*0.3 : 0));
      c.scale(this.scale, this.scale);
      
      // Shadow on floor (during landing, dimmer as folded)
      const shAlpha = 0.3 * (1 - ease * 0.5);
      drawPlaneShadowAt(c, this.x, this.y, shAlpha, this.scale);
      // Note: shadow drawn in world coords; we'll draw separately below
      
      // Folded look: reduce wing alpha to simulate folding
      const wingAlpha = Math.cos(foldAngle/2) * 0.5 + 0.5;
      drawPlaneBody(c, wingAlpha);
      c.restore();
      return;
    }
    
    // Normal flying
    c.save();
    c.translate(this.x, this.y);
    const visAngle = this.vx >= 0 ? 0 : Math.PI;
    let dispAngle = lerp(this.angle, visAngle, 0.4);
    // bank tilt
    c.rotate(dispAngle + this.bank * 0.7);
    c.scale(this.scale, this.scale);
    drawPlaneBody(c, 1);
    c.restore();
  }
}

function drawPlaneBody(c, alpha) {
  // Center fold line
  c.strokeStyle = `rgba(60, 50, 60, ${0.6 * alpha})`;
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, 0);
  c.stroke();
  
  // Left wing top
  c.fillStyle = `rgba(${PAPER}, ${alpha})`;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, -8);
  c.lineTo(-15, -3);
  c.closePath();
  c.fill();
  
  // Left wing shadow
  c.fillStyle = `rgba(150, 145, 152, ${0.3 * alpha})`;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, 8);
  c.lineTo(-15, 3);
  c.closePath();
  c.fill();
  
  // Top wing shadow line ( subtle gradient)
  c.strokeStyle = `rgba(100, 80, 100, ${0.2 * alpha})`;
  c.lineWidth = 0.5;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, -8);
  c.stroke();
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, 8);
  c.stroke();
  
  // Nose highlight
  c.fillStyle = `rgba(255, 255, 255, ${0.7 * alpha})`;
  c.beginPath();
  c.arc(15, -1, 1, 0, TAU);
  c.fill();
}

function drawPlaneShadowAt(c, x, y, alpha, scale) {
  c.save();
  c.translate(x, H - 30);
  c.scale(scale, scale);
  // squash for perspective
  c.scale(1.3, 0.4);
  c.fillStyle = `rgba(${PSHADOW}, ${alpha})`;
  // simple wing silhouette
  c.beginPath();
  c.moveTo(-15, -2);
  c.lineTo(15, -8);
  c.lineTo(-15, 1);
  c.closePath();
  c.fill();
  c.beginPath();
  c.moveTo(-15, 2);
  c.lineTo(15, 8);
  c.lineTo(-15, -1);
  c.closePath();
  c.fill();
  c.restore();
}

// Mote (dust particle)
class Mote {
  constructor(x, y, vx, vy, size, alpha, behavior) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.size = size;
    this.alpha = alpha;
    this.life = 0;
    this.maxLife = rand(4, 8);
    this.behavior = behavior;
    this.driftA = rand(0, TAU);
    this.driftSp = rand(0.5, 1);
  }
  update(dt) {
    this.life += dt;
    if (this.behavior === 0) {
      // ambient dust
      this.driftA += rand(-0.5, 0.5) * dt;
      this.x += Math.sin(this.driftA) * this.driftSp * dt * 5;
      this.y += this.vy * dt * 0.5;
      this.vy *= Math.pow(0.8, dt);
    } else {
      // thermal mote
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vy -= 5 * dt; // buoyant
      this.vy *= Math.pow(0.6, dt);
      this.vx += (THERMAL.cx - this.x) * 0.5 * dt;
    }
    if (this.life > this.maxLife) this.alpha *= 0.94;
  }
  draw(c) {
    const a = this.alpha * (1 - this.life / this.maxLife) * 0.7;
    if (a < 0.01) return;
    c.fillStyle = `rgba(255, 238, 170, ${a})`;
    c.beginPath();
    c.arc(this.x, this.y, this.size, 0, TAU);
    c.fill();
  }
  dead() { return this.life > this.maxLife; }
}

// Static dust array (ambient motes)
const AMBI = [];
const THERMAL = {
  cx: 0,
  halfW: 80,
  baseY: 0,
  topY: 0
};
function updateThermal() {
  THERMAL.cx = W * 0.5;
  THERMAL.halfW = W * 0.08;
  THERMAL.baseY = H - 30;
  THERMAL.topY = H * 0.6;
}

function initAmbientMotes() {
  AMBI.length = 0;
  const total = 80;
  for (let i = 0; i < total; i++) {
    AMBI.push(new Mote(
      rand(0, W),
      rand(0, H),
      0,
      rand(-5, 5),
      rand(0.5, 1.5),
      rand(0.4, 0.6),
      0
    );
  );
}

// Plane array
const PLANES = [];
const MOTES = [];
const MOTE_CAP = 200;

function init() {
  resize();
  updateThermal();
  PLANES.length = 0;
  const count = Math.floor(rand(8, 12.5));
  for (let i = 0; i < count; i++) PLANES.push(new Plane());
  initAmbientMotes();
  // background bands' motes
  for (let i = 0; i < 200; i++) {
    MOTES.push(new Mote(
      rand(0, W),
      rand(0, H),
      rand(-2, 2),
      rand(-2, 2),
      rand(0.5, 1),
      rand(0.2, 0.5),
      0
    ));
  }
}

// Drawing functions
function drawBackground(c) {
  // Far wall gradient
  const g0 = c.createLinearGradient(0, 0, 0, H);
  g0.addColorStop(0, '#14121a');
  g0.addColorStop(0.45, '#241e26');
  g0.addColorStop(1, '#403036');
  c.fillStyle = g0;
  c.fillRect(0, 0, W, H);
  
  // Floor base
  const fg = c.createLinearGradient(0, H*0.6, 0, H);
  fg.addColorStop(0, 'rgba(60,40,50,0.5)');
  fg.addColorStop(1, 'rgba(20,16,24,1)');
  c.fillStyle = fg;
  c.fillRect(0, H*0.6, W, H*0.4);
  
  // Light shafts (subtle vertical wash)
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const cx = W * (0.3 + i * 0.20);
    const lg = c.createLinearGradient(cx - 100, 0, cx + 100, H);
    lg.addColorStop(0, 'rgba(40,30,40,0)');
    lg.addColorStop(0.5, `rgba(60,40,50,${0.06})`);
    lg.addColorStop(1, 'rgba(40,30,40,0)');
    c.fillStyle = lg;
    c.beginPath();
    const halfW = 150;
    c.moveTo(cx - halfW * 0.5, 0);
    c.lineTo(cx + halfW * 0.5, 0);
    c.lineTo(cx + halfW, H);
    c.lineTo(cx - halfW, H);
    c.closePath();
    c.fill();
  }
  c.restore();
  
  // Floor lines
  c.strokeStyle = 'rgba(180, 180, 200, 0.06)';
  c.lineWidth = 1;
  for (let i = 1; i <= 8; i++) {
    const y = H - 30 - (i / 8) * 30;
    c.beginPath();
    c.moveTo(0, y);
    c.lineTo(W, y);
    c.stroke();
  }
  // perspective lines
  c.strokeStyle = 'rgba(180, 180, 200, 0.04)';
  for (let i = 0; i < 20; i++) {
    const x = (i / 20) * W;
    c.beginPath();
    c.moveTo(x, H - 30);
    c.lineTo(x + (x - W*0.5) * 0.5, H * 0.7);
    c.stroke();
  }
}

function drawLightColumn(c, time) {
  // Thermal column visualization
  const cx = THERMAL.cx;
  const baseY = THERMAL.baseY;
  
  // Base glow
  c.save();
  const grad = c.createRadialGradient(cx, baseY, 5, cx, baseY, 200);
  grad.addColorStop(0, 'rgba(60, 40, 50, 0.4)');
  grad.addColorStop(0.5, 'rgba(40, 30, 40, 0.15)');
  grad.addColorStop(1, 'rgba(40, 30, 40, 0)');
  c.fillStyle = grad;
  c.fillRect(cx - 200, baseY - 200, 400, 200);
  c.restore();
  
  // Rising thermal motes (visualization of the column)
  // (drawn in mote update)
}

function drawPlane(c, p) {
  c.save();
  // Shadow first
  const distFromFloor = (H - 30) - p.y;
  const shScale = 1 / (1 + distFromFloor * 0.004);
  const shAlpha = 0.35 * shScale * (1 - Math.abs(p.bank) * 0.4);
  // shadow squash for perspective
  c.save();
  c.translate(p.x + (p.vx * 0.5), H - 30);
  c.scale(p.scale * shScale * 1.2, p.scale * 0.4 * shScale);
  c.rotate(p.bank * 0.5);
  c.fillStyle = `rgba(${PSHADOW}, ${shAlpha})`;
  c.beginPath();
  // wing silhouette (mirror of plane shape, simplified)
  c.moveTo(-15, -1.5);
  c.lineTo(15, -6);
  c.lineTo(-15, 0.5);
  c.closePath();
  c.fill();
  c.beginPath();
  c.moveTo(-15, 1.5);
  c.lineTo(15, 6);
  c.lineTo(-15, -0.5);
  c.closePath();
  c.fill();
  c.restore();
  
  // Plane body
  c.save();
  c.translate(p.x, p.y);
  // bank tilt
  c.rotate(p.bank * 0.7);
  // face direction
  if (p.vx < 0) c.scale(-1, 1);
  c.scale(p.scale, p.scale);
  
  // Center fold line
  c.strokeStyle = 'rgba(60, 50, 60, 0.6)';
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, 0);
  c.stroke();
  
  // Top wing
  c.fillStyle = `rgba(${PAPER}, 1)`;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, -7);
  c.lineTo(-15, -2.5);
  c.closePath();
  c.fill();
  
  // Top wing inner shadow (subtle, like crease shadow)
  c.fillStyle = 'rgba(150, 145, 152, 0.5)';
  c.beginPath();
  c.moveTo(-15, -2.5);
  c.lineTo(15, -7);
  c.lineTo(-15, -4);
  c.closePath();
  c.fill();
  
  // Bottom wing
  c.fillStyle = `rgba(${PAPER_M}, 1)`;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, 7);
  c.lineTo(-15, 2.5);
  c.closePath();
  c.fill();
  
  // Bottom wing inner shadow
  c.fillStyle = 'rgba(100, 90, 100, 0.4)';
  c.beginPath();
  c.moveTo(-15, 2.5);
  c.lineTo(15, 7);
  c.lineTo(-15, 4);
  c.closePath();
  c.fill();
  
  // Wing edge creases
  c.strokeStyle = 'rgba(80, 70, 80, 0.4)';
  c.lineWidth = 0.4;
  c.beginPath();
  c.moveTo(-15, 0); c.lineTo(15, -7);
  c.moveTo(-15, 0); c.lineTo(15, 7);
  c.stroke();
  
  // Nose highlight (subtle)
  c.fillStyle = 'rgba(255, 240, 200, 0.5)';
  c.beginPath();
  c.arc(15, -1.5, 1, 0, TAU);
  c.fill();
  
  c.restore();
}

// Landing plane (folded look)
function drawPlaneLanding(c, p) {
  // Shadow first
  const distFromFloor = (H - 30) - p.y;
  const shScale = 1 / (1 + distFromFloor * 0.004);
  const shAlpha = 0.4 * shScale;
  c.save();
  c.translate(p.x + (p.vx * 0.5), H - 30);
  c.scale(p.scale * shScale * 1.2, p.scale * 0.4 * shScale);
  c.rotate(p.bank * 0.5);
  c.fillStyle = `rgba(${PSHADOW}, ${shAlpha})`;
  c.beginPath();
  c.moveTo(-15, -1.5);
  c.lineTo(15, -6);
  c.lineTo(-15, 0.5);
  c.closePath();
  c.fill();
  c.beginPath();
  c.moveTo(-15, 1.5);
  c.lineTo(15, 6);
  c.lineTo(-15, -0.5);
  c.closePath();
  c.fill();
  c.restore();
  
  // Plane body with fold animation
  const foldAlpha = 1;
  // foldProgress 0 -> 1 within fold phase
  let fp = 0;
  if (p.landT > p.foldStart) {
    fp = clamp((p.landT - p.foldStart) / p.foldDur, 0, 1);
    fp = Math.pow(fp, 0.8);
  }
  // The wing is progressively narrowing as folded
  const wingScale = Math.cos(fp * Math.PI * 1.2) * 0.5 + 0.5;
  // wingScale 1= unfolded, 0 = fully folded
  
  c.save();
  c.translate(p.x, p.y);
  // bank tilt
  c.rotate(p.bank * 0.7);
  // face direction
  if (p.vx < 0) c.scale(-1, 1);
  c.scale(p.scale, p.scale);
  
  // Center fold line (always)
  c.strokeStyle = `rgba(60, 50, 60, ${0.6 * wingScale})`;
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, 0);
  c.stroke();
  
  // Top wing (shrinking y as folded)
  const topY = -7 * wingScale;
  const topY2 = -2.5 * wingScale;
  c.fillStyle = `rgba(${PAPER}, ${wingScale})`;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, topY);
  c.lineTo(-15, topY2);
  c.closePath();
  c.fill();
  // inner shadow
  c.fillStyle = `rgba(150, 145, 152, ${0.5 * wingScale})`;
  c.beginPath();
  c.moveTo(-15, topY2);
  c.lineTo(15, topY);
  c.lineTo(-15, topY2 - 1.5 * wingScale);
  c.closePath();
  c.fill();
  
  // Bottom wing
  const bottomY = 7 * wingScale;
  const bottomY2 = 2.5 * wingScale;
  c.fillStyle = `rgba(${PAPER_M}, ${wingScale})`;
  c.beginPath();
  c.moveTo(-15, 0);
  c.lineTo(15, bottomY);
  c.lineTo(-15, bottomY2);
  c.closePath();
  c.fill();
  // inner shadow
  c.fillStyle = `rgba(100, 90, 100, ${0.4 * wingScale})`;
  c.beginPath();
  c.moveTo(-15, bottomY2);
  c.lineTo(15, bottomY);
  c.lineTo(-15, bottomY2 + 1.5 * wingScale);
  c.closePath();
  c.fill();
  
  // creases
  c.strokeStyle = `rgba(80, 70, 80, ${0.4 * wingScale})`;
  c.lineWidth = 0.4;
  c.beginPath();
  c.moveTo(-15, 0); c.lineTo(15, topY);
  c.moveTo(-15, 0); c.lineTo(15, bottomY);
  c.stroke();
  
  // fold flash during the last bit of fold phase
  if (fp > 0.7 && fp < 1) {
    const flashAlpha = (1 - (fp - 0.7) / 0.3) * 0.8;
    c.fillStyle = `rgba(255, 250, 240, ${flashAlpha})`;
    c.beginPath();
    c.arc(15, 0, 5, 0, TAU);
    c.fill();
  }
  
  c.restore();
}

function drawMotes(c, motes) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    if (m.dead()) continue;
    const a = m.alpha * (1 - m.life / m.maxLife) * 0.7;
    if (a < 0.01) continue;
    c.fillStyle = `rgba(255, 238, 170, ${a})`;
    c.beginPath();
    c.arc(m.x, m.y, m.size, 0, TAU);
    c.fill();
  }
  // ambient
  for (const m of AMBI) {
    m.update(0.016);
    m.draw(c);
    // wrap
    if (m.x < -10) m.x = W + 10;
    if (m.x > W + 10) m.x = -10;
    if (m.y < -10) m.y = H + 10;
    if (m.y > H + 10) m.y = -10;
  }
  c.restore();
}

function drawPlaneFlying(c, p) {
  // Trail (subtle)
  if (p.trail && p.trail.length > 5) {
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < p.trail.length; i++) {
      const t = p.trail[i];
      const age = (p.life - t.t);
      const alpha = (1 - age / 1.0) * 0.07;
      if (alpha < 0.01) continue;
      const r = 1.5;
      c.fillStyle = `rgba(255, 240, 200, ${alpha})`;
      c.beginPath();
      c.arc(t.x, t.y, r, 0, TAU);
      c.fill();
    }
    c.restore();
  }
  drawPlane(c, p);
}

// Vignette
function drawVignette(c) {
  const vg = c.createRadialGradient(W/2, H/2, Math.min(W, H) * 0.3, W/2, H/2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vg.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
  c.fillStyle = vg;
  c.fillRect(0, 0, W, H);
}

// Main loop
let lastT = 0;
let time = 0;
let rafId = 0;

function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  time += dt;
  
  // Update planes
  for (const p of PLANES) p.update(dt);
  
  // Update motes (thermal)
  for (let i = MOTES.length - 1; i >= 0; i--) {
    MOTES[i].update(dt);
    if (MOTES[i].dead()) MOTES.splice(i, 1);
  }
  
  // Spawn ambient thermal motes (visualization of the rising thermal)
  if (Math.random() < 0.5) {
    const r = Math.random();
    const x = THERMAL.cx + rand(-THERMAL.halfW * 0.5, THERMAL.halfW * 0.5);
    const y = THERMAL.baseY + rand(-5, 0);
    MOTES.push(new Mote(x, y, rand(-3, 3), rand(-30, 50), rand(1, 2), rand(0.5, 0.7), 1));
  }
  
  // Render
  drawBackground(ctx);
  drawLightColumn(ctx, time);
  
  // Motes (background layer)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of MOTES) {
    if (m.dead()) continue;
    const a = m.alpha * (1 - m.life / m.maxLife) * 0.7;
    if (a < 0.01) continue;
    ctx.fillStyle = `rgba(255, 238, 170, ${a})`;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size, 0, TAU);
    ctx.fill();
  }
  // Ambient motes
  for (const m of AMBI) {
    m.update(0.016);
    const a = m.alpha * (1 - m.life / m.maxLife) * 0.7;
    if (a < 0.01) continue;
    ctx.fillStyle = `rgba(255, 238, 170, ${a})`;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size, 0, TAU);
    ctx.fill();
    if (m.x < -10) m.x = W + 10;
    if (m.x > W + 10) m.x = -10;
    if (m.y < -10) m.y = H + 10;
    if (m.y > H + 10) m.y = -10;
  }
  ctx.restore();
  
  // Shadows pass (floor)
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  for (const p of PLANES) {
    if (p.landed && p.landT > p.foldStart) continue; // folded, skip
    const distFromFloor = (H - 30) - p.y;
    const shScale = 1 / (1 + distFromFloor * 0.004);
    const shAlpha = 0.35 * shScale * (1 - Math.abs(p.bank) * 0.4);
    if (shAlpha < 0.01) continue;
    // shadow squash for perspective
    ctx.save();
    ctx.translate(p.x + (p.vx * 0.5), H - 30);
    ctx.scale(p.scale * shScale * 1.2, p.scale * 0.4 * shScale);
    ctx.rotate(p.bank * 0.5);
    ctx.fillStyle = `rgba(${PSHADOW}, ${shAlpha})`;
    // wing silhouette
    ctx.beginPath();
    ctx.moveTo(-15, -1.5);
    ctx.lineTo(15, -6);
    ctx.lineTo(-15, 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-15, 1.5);
    ctx.lineTo(15, 6);
    ctx.lineTo(-15, -0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  
  // Draw planes
  for (const p of PLANES) {
    if (p.landed) drawPlaneLanding(ctx, p);
    else drawPlaneFlying(ctx, p);
  }
  
  // Vignette
  drawVignette(ctx);
  
  rafId = requestAnimationFrame(loop);
}

// Boot
window.addEventListener('resize', () => {
  resize();
  updateThermal();
  initAmbientMotes();
});

// Visibility
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
  } else {
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
  }
});

// Pointer parallax (optional, subtle)
let parallaxX = 0, parallaxY = 0;
window.addEventListener('pointermove', e => {
  parallaxX = (e.clientX / W - 0.5) * 8;
  parallaxY = (e.clientY / H - 0.5) * 4;
});

// Start
init();
lastT = performance.now();
rafId = requestAnimationFrame(loop);

})();
</script>
