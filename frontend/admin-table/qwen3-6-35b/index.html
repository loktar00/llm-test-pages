<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — User Management</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --border: #e2e6ee;
    --text: #1a1d26;
    --text-secondary: #6b7280;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --accent-hover: #4338ca;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 16px rgba(0,0,0,.08);
    --transition: .25s cubic-bezier(.4,0,.2,1);

    --status-active: #059669;
    --status-active-bg: #ecfdf5;
    --status-inactive: #d97706;
    --status-inactive-bg: #fffbeb;
    --status-pending: #2563eb;
    --status-pending-bg: #eff6ff;
    --status-banned: #dc2626;
    --status-banned-bg: #fef2f2;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ��─ Header ��─ */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .page-header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--text);
  }

  .page-header h1 span {
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    gap: .5rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .5rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: .8125rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }

  /* ��─ Table Card ��─ */
  .table-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ��─ Table ��─ */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .875rem;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 10;
  }

  thead th {
    background: #f1f3f7;
    padding: .75rem 1rem;
    text-align: left;
    font-weight: 600;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-secondary);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    user-select: none;
    position: relative;
  }

  thead th.sortable {
    cursor: pointer;
    transition: color var(--transition), background var(--transition);
  }

  thead th.sortable:hover {
    color: var(--accent);
    background: var(--accent-light);
  }

  thead th.sort-asc,
  thead th.sort-desc {
    color: var(--accent);
  }

  .sort-arrow {
    display: inline-block;
    margin-left: .3rem;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    opacity: .3;
    font-size: .65rem;
    vertical-align: middle;
  }

  thead th.sort-asc .sort-arrow {
    opacity: 1;
    transform: translateY(1px);
  }

  thead th.sort-desc .sort-arrow {
    opacity: 1;
    transform: translateY(-1px);
  }

  tbody tr {
    transition: background var(--transition);
  }

  tbody tr:hover {
    background: #f9fafb;
  }

  tbody tr.row-flipping {
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    opacity: .7;
  }

  tbody td {
    padding: .7rem 1rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    white-space: nowrap;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  /* ��─ Checkbox ��─ */
  .checkbox-cell {
    width: 40px;
    text-align: center;
    padding-left: .75rem;
  }

  .custom-checkbox {
    position: relative;
    width: 18px;
    height: 18px;
    display: inline-block;
  }

  .custom-checkbox input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    z-index: 1;
    margin: 0;
  }

  .custom-checkbox .checkmark {
    position: absolute;
    inset: 0;
    border: 2px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    transition: all .2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .custom-checkbox .checkmark svg {
    width: 12px;
    height: 12px;
    opacity: 0;
    transform: scale(.5);
    transition: all .2s cubic-bezier(.34,1.56,.64,1);
    color: #fff;
  }

  .custom-checkbox input:checked + .checkmark {
    background: var(--accent);
    border-color: var(--accent);
  }

  .custom-checkbox input:checked + .checkmark svg {
    opacity: 1;
    transform: scale(1);
  }

  .custom-checkbox input.indeterminate + .checkmark {
    background: var(--accent);
    border-color: var(--accent);
  }

  .custom-checkbox input.indeterminate + .checkmark svg {
    opacity: 1;
    transform: scale(1);
  }

  .custom-checkbox input.indeterminate + .checkmark .check-dash {
    display: block;
  }

  .custom-checkbox input.indeterminate + .checkmark .check-tick {
    display: none;
  }

  .check-tick, .check-dash { display: none; }
  .custom-checkbox input.indeterminate + .checkmark .check-tick { display: none; }
  .custom-checkbox input.indeterminate + .checkmark .check-dash { display: block; }

  /* ��─ Avatar ��─ */
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: .75rem;
    color: #fff;
    flex-shrink: 0;
    letter-spacing: .02em;
  }

  .user-cell {
    display: flex;
    align-items: center;
    gap: .65rem;
  }

  .user-info .name {
    font-weight: 600;
    color: var(--text);
    font-size: .875rem;
  }

  .user-info .email {
    font-size: .75rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }

  /* ��─ Status Chip ��─ */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    padding: .2rem .65rem;
    border-radius: 999px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
  }

  .chip::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .chip-active { background: var(--status-active-bg); color: var(--status-active); }
  .chip-active::before { background: var(--status-active); }

  .chip-inactive { background: var(--status-inactive-bg); color: var(--status-inactive); }
  .chip-inactive::before { background: var(--status-inactive); }

  .chip-pending { background: var(--status-pending-bg); color: var(--status-pending); }
  .chip-pending::before { background: var(--status-pending); }

  .chip-banned { background: var(--status-banned-bg); color: var(--status-banned); }
  .chip-banned::before { background: var(--status-banned); }

  /* ��─ Role Badge ��─ */
  .role {
    font-size: .8125rem;
    color: var(--text-secondary);
  }

  .role strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ��─ Table Footer / Pagination ��─ */
  .table-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .75rem 1rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: .75rem;
    background: #fafbfc;
  }

  .footer-info {
    font-size: .8125rem;
    color: var(--text-secondary);
  }

  .pagination {
    display: flex;
    align-items: center;
    gap: .25rem;
  }

  .pagination .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    padding: 0 .5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: .8125rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
    text-decoration: none;
  }

  .pagination .pill:hover:not(.active):not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .pagination .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 2px 6px rgba(79,70,229,.3);
  }

  .pagination .pill:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  .pagination .pill.nav-pill {
    min-width: auto;
    padding: 0 .65rem;
    font-size: .75rem;
    font-weight: 600;
    gap: .25rem;
  }

  /* ��─ Responsive ��─ */
  @media (max-width: 900px) {
    .col-role, .col-phone { display: none; }
  }

  @media (max-width: 640px) {
    body { padding: 1rem .5rem; }
    .col-email { display: none; }
    .user-info .email { display: none; }
    .page-header h1 { font-size: 1.25rem; }
    thead th { padding: .6rem .75rem; }
    tbody td { padding: .6rem .75rem; }
  }

  @media (max-width: 420px) {
    .col-joined { display: none; }
  }

  /* ��─ Select All Label ��─ */
  .select-all-cell {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ��─ Selection bar ��─ */
  .selection-bar {
    display: none;
    align-items: center;
    gap: .75rem;
    padding: .6rem 1rem;
    background: var(--accent-light);
    border-bottom: 1px solid rgba(79,70,229,.15);
    font-size: .8125rem;
    color: var(--accent);
    font-weight: 500;
  }

  .selection-bar.visible {
    display: flex;
  }

  .selection-bar .btn {
    font-size: .75rem;
    padding: .35rem .75rem;
  }

  /* ��─ Animations ��─ */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  tbody tr {
    animation: fadeInUp .3s ease both;
  }

  tbody tr:nth-child(1) { animation-delay: .02s; }
  tbody tr:nth-child(2) { animation-delay: .04s; }
  tbody tr:nth-child(3) { animation-delay: .06s; }
  tbody tr:nth-child(4) { animation-delay: .08s; }
  tbody tr:nth-child(5) { animation-delay: .10s; }
  tbody tr:nth-child(6) { animation-delay: .12s; }
  tbody tr:nth-child(7) { animation-delay: .14s; }
  tbody tr:nth-child(8) { animation-delay: .16s; }
  tbody tr:nth-child(9) { animation-delay: .18s; }
  tbody tr:nth-child(10) { animation-delay: .20s; }
  tbody tr:nth-child(11) { animation-delay: .22s; }
  tbody tr:nth-child(12) { animation-delay: .24s; }
  tbody tr:nth-child(13) { animation-delay: .26s; }
  tbody tr:nth-child(14) { animation-delay: .28s; }
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <h1>User Management</h1>
    <div class="header-actions">
      <button class="btn" onclick="exportData()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h11M9 4v8M7 8l2 2 2-2"/></svg>
        Export
      </button>
      <button class="btn btn-primary">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v10M2 7h10"/></svg>
        Add User
      </button>
    </div>
  </div>

  <div class="table-card">
    <div class="selection-bar" id="selectionBar">
      <span id="selectionCount">0 selected</span>
      <button class="btn" onclick="bulkAction('activate')">Activate</button>
      <button class="btn" onclick="bulkAction('deactivate')">Deactivate</button>
      <button class="btn" onclick="bulkAction('delete')" style="color:var(--status-banned);border-color:var(--status-banned-bg)">Delete</button>
      <button class="btn" onclick="clearSelection()" style="margin-left:auto">Clear</button>
    </div>

    <div class="table-wrapper">
      <table id="dataTable">
        <thead>
          <tr>
            <th class="checkbox-cell">
              <div class="select-all-cell">
                <label class="custom-checkbox">
                  <input type="checkbox" id="selectAll" aria-label="Select all">
                  <span class="checkmark">
                    <svg class="check-tick" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 5 9 10 3"/></svg>
                    <svg class="check-dash" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="9" y2="6"/></svg>
                  </span>
                </label>
              </div>
            </th>
            <th class="sortable" data-col="name">Name <span class="sort-arrow">▲</span></th>
            <th class="sortable col-email" data-col="email">Email <span class="sort-arrow">▲</span></th>
            <th class="sortable col-role" data-col="role">Role <span class="sort-arrow">▲</span></th>
            <th class="sortable" data-col="status">Status <span class="sort-arrow">▲</span></th>
            <th class="sortable col-phone" data-col="phone">Phone <span class="sort-arrow">▲</span></th>
            <th class="sortable col-joined" data-col="joined">Joined <span class="sort-arrow">▲</span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody
