<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clockwork Machine</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body { background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  // Set up full screen canvas
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Colors - Brass and iron palette
  const COLORS = {
    brass: '#B8860B',
    brassHighlight: '#D4AF37',
    brassShadow: '#8B6500',
    iron: '#2F4F4F',
    ironHighlight: '#3A5A5A',
    ironShadow: '#1C2F2F',
    wood: '#8B4513',
    woodHighlight: '#A0522D',
    chain: '#555',
    shadow: 'rgba(0,0,0,0.3)'
  };

  // Utility functions
  function rect(x, y, w, h) { return {x, y, w, h}; }
  function circle(x, y, r) { return {x, y, r}; }
  function distance(a, b) {
    return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
  }
  function angleBetween(p1, p2) {
    return Math.atan2(p2.y - p1.y, p2.x - p1.x);
  }
  function rotatePoint(point, angle, origin) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const dx = point.x - origin.x;
    const dy = point.y - origin.y;
    return {
      x: dx * cos - dy * sin + origin.x,
      y: dx * sin + dy * cos + origin.y
    };
  }
  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  // Gear class with proper meshing ratios
  class Gear {
    constructor(x, y, teeth, radius, color = COLORS.brass) {
      this.x = x;
      this.y = y;
      this.teeth = teeth;
      this.radius = radius;
      this.angle = 0;
      this.color = color;
      this.speedMultiplier = 1;
      this.loose = false;
      this.vx = 0;
      this.vy = 0;
      this.angularVel = 0;
      this.targetAngle = 0;
      
      // Calculate gear ratio based on teeth count
      this.ratio = teeth;
    }

    update(deltaTime, parentGear = null) {
      if (this.loose) {
        // Physics for loose gear
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.98; // Air resistance
        this.vy += 0.2; // Gravity
        this.vy *= 0.98;
        this.angularVel *= 0.98;
        this.angle += this.angularVel;
        
        // Bounce off edges
        if (this.x < this.radius || this.x > canvas.width - this.radius) {
          this.vx *= -0.7;
          this.angularVel += this.vx * 0.1;
        }
        if (this.y > canvas.height - 100) {
          this.vy *= -0.5;
          this.vx *= 0.9;
        }
      } else if (parentGear) {
        // Calculate angle based on parent gear's rotation and meshing ratio
        this.angle = -parentGear.angle * (parentGear.teeth / this.teeth);
      } else {
        // Driven gear (motor)
        this.angle += 0.02 * this.speedMultiplier;
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      // Draw gear
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 1.2);
      grad.addColorStop(0, this.color === COLORS.brass ? COLORS.brassHighlight : COLORS.ironHighlight);
      grad.addColorStop(0.7, this.color);
      grad.addColorStop(1, this.color === COLORS.brass ? COLORS.brassShadow : COLORS.ironShadow);
      
      ctx.fillStyle = grad;
      
      // Draw gear teeth
      const teethCount = this.teeth;
      const outerRadius = this.radius + this.radius * 0.1;
      const innerRadius = this.radius;
      
      ctx.beginPath();
      for (let i = 0; i < teethCount; i++) {
        const angle = (i / teethCount) * Math.PI * 2;
        const nextAngle = ((i + 0.5) / teethCount) * Math.PI * 2;
        
        // Tooth
        ctx.moveTo(
          innerRadius * Math.cos(angle),
          innerRadius * Math.sin(angle)
        );
        ctx.lineTo(
          outerRadius * Math.cos(angle),
          outerRadius * Math.sin(angle)
        );
        
        // Gap between teeth
        const gapAngle = angle + (Math.PI * 2 / teethCount) * 0.3;
        ctx.lineTo(
          innerRadius * Math.cos(gapAngle),
          innerRadius * Math.sin(gapAngle)
        );
      }
      ctx.closePath();
      ctx.fill();
      
      // Draw inner circle
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.7, 0, Math.PI * 2);
      ctx.fill();
      
      // Draw center hole
      const centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 0.2);
      centerGrad.addColorStop(0, '#000');
      centerGrad.addColorStop(1, this.color === COLORS.brass ? COLORS.brassShadow : COLORS.ironShadow);
      ctx.fillStyle = centerGrad;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }
  }

  // Chain class
  class Chain {
    constructor(x, y, length, sprocket1, sprocket2) {
      this.x = x;
      this.y = y;
      this.length = length;
      this.sprocket1 = sprocket1;
      this.sprocket2 = sprocket2;
      this.offset = 0;
    }

    update(deltaTime) {
      this.offset += deltaTime * 0.002;
    }

    draw(ctx) {
      ctx.save();
      
      // Draw chain links
      const startX = this.sprocket1.x + Math.cos(this.sprocket1.angle) * this.sprocket1.radius * 0.8;
      const startY = this.sprocket1.y + Math.sin(this.sprocket1.angle) * this.sprocket1.radius * 0.8;
      const endX = this.sprocket2.x + Math.cos(this.sprocket2.angle) * this.sprocket2.radius * 0.8;
      const endY = this.sprocket2.y + Math.sin(this.sprocket2.angle) * this.sprocket2.radius * 0.8;
      
      const chainLength = distance({x: startX, y: startY}, {x: endX, y: endY});
      const links = Math.floor(chainLength / 20);
      
      for (let i = 0; i < links; i++) {
        const t = (i + this.offset * 0.01) % links / links;
        const x = startX + (endX - startX) * t;
        const y = startY + (endY - startY) * t;
        
        const linkAngle = Math.atan2(endY - startY, endX - startX);
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(linkAngle);
        
        ctx.fillStyle = COLORS.chain;
        ctx.fillRect(-8, -3, 16, 6);
        
        ctx.fillStyle = '#333';
        ctx.fillRect(-6, -1, 12, 2);
        
        ctx.restore();
      }
      
      ctx.restore();
    }
  }

  // Sprocket class
  class Sprocket {
    constructor(x, y, radius, teeth, color = COLORS.iron) {
      this.x = x;
      this.y = y;
      this.radius = radius;
      this.teeth = teeth;
      this.angle = 0;
      this.color = color;
    }

    update(angle) {
      this.angle = angle;
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
      grad.addColorStop(0, COLORS.ironHighlight);
      grad.addColorStop(0.7, COLORS.iron);
      grad.addColorStop(1, COLORS.ironShadow);
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      
      const outerRadius = this.radius * 1.1;
      
      for (let i = 0; i < this.teeth; i++) {
        const angle = (i / this.teeth) * Math.PI * 2;
        const nextAngle = angle + (Math.PI * 2 / this.teeth) * 0.4;
        
        ctx.moveTo(
          this.radius * Math.cos(angle),
          this.radius * Math.sin(angle)
        );
        ctx.lineTo(
          outerRadius * Math.cos(nextAngle),
          outerRadius * Math.sin(nextAngle)
        );
      }
      ctx.closePath();
      ctx.fill();
      
      // Center
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }
  }

  // Piston class
  class Piston {
    constructor(x, y, width, height) {
      this.x = x;
      this.y = y;
      this.width = width;
      this.height = height;
      this.stroke = 0;
      this.direction = 1;
    }

    update() {
      this.stroke += 0.05 * this.direction;
      if (this.stroke > 1 || this.stroke < 0) {
        this.direction *= -1;
      }
    }

    draw(ctx) {
      ctx.save();
      
      // Piston rod
      ctx.strokeStyle = COLORS.iron;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y + this.height * this.stroke);
      ctx.lineTo(this.x, this.y - 50);
      ctx.stroke();
      
      // Piston body
      const grad = ctx.createLinearGradient(this.x - this.width/2, 0, this.x + this.width/2, 0);
      grad.addColorStop(0, COLORS.ironShadow);
      grad.addColorStop(0.5, COLORS.iron);
      grad.addColorStop(1, COLORS.ironHighlight);
      
      ctx.fillStyle = grad;
      ctx.fillRect(this.x - this.width/2, this.y + this.height * this.stroke - this.height/2, this.width, this.height);
      
      // Highlights
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(this.x - this.width/2 + 2, this.y + this.height * this.stroke - this.height/2, 4, this.height);
      
      ctx.restore();
    }
  }

  // Escapement class
  class Escapement {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = 0;
      this.pallets = 15;
      this.escapeAngle = 0;
    }

    update(sourceAngle) {
      // The escapement locks and unlocks based on source gear rotation
      this.escapeAngle = sourceAngle * 0.3;
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.escapeAngle);
      
      // Draw anchor
      ctx.fillStyle = COLORS.iron;
      ctx.beginPath();
      ctx.moveTo(-30, -10);
      ctx.lineTo(30, -10);
      ctx.lineTo(20, 10);
      ctx.lineTo(-20, 10);
      ctx.closePath();
      ctx.fill();
      
      // Draw pallets
      ctx.fillStyle = COLORS.brass;
      for (let i = 0; i < 2; i++) {
        ctx.save();
        ctx.translate(i === 0 ? -20 : 20, 0);
        ctx.rotate(i === 0 ? 0.3 : -0.3);
        ctx.fillRect(-5, -15, 10, 30);
        ctx.restore();
      }
      
      // Pendulum
      ctx.strokeStyle = COLORS.iron;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 10);
      ctx.lineTo(0, 80);
      ctx.stroke();
      
      // Pendulum weight
      ctx.fillStyle = COLORS.ironHighlight;
      ctx.beginPath();
      ctx.arc(0, 90, 15, 0, Math.PI * 2);
      ctx.fill();
      
      // Pendulum swing
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 90, 100, -0.3, 0.3);
      ctx.stroke();
      
      ctx.restore();
    }
  }

  // Repair arm class
  class RepairArm {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = 0;
      this.active = false;
      this.targetGear = null;
    }

    update(deltaTime) {
      if (this.active && this.targetGear) {
        this.angle += deltaTime * 0.005;
        
        const armLength = 200;
        const endX = this.x + Math.cos(this.angle) * armLength;
        const endY = this.y + Math.sin(this.angle) * armLength;
        
        // Check if near target gear
        if (distance({x: endX, y: endY}, {x: this.targetGear.x, y: this.targetGear.y}) < 30) {
          // Re-seat the gear
          this.targetGear.loose = false;
          this.targetGear.x = this.targetGear.originalX;
          this.targetGear.y = this.targetGear.originalY;
          this.targetGear.vx = 0;
          this.targetGear.vy = 0;
          this.targetGear.angularVel = 0;
          this.active = false;
          this.targetGear = null;
        }
      }
    }

    draw(ctx) {
      if (this.active) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // Draw arm
        const armLength = 200;
        const grad = ctx.createLinearGradient(0, 0, armLength, 0);
        grad.addColorStop(0, COLORS.ironShadow);
        grad.addColorStop(0.5, COLORS.iron);
        grad.addColorStop(1, COLORS.ironHighlight);
        
        ctx.fillStyle = grad;
        ctx.fillRect(0, -8, armLength, 16);
        
        // Draw claw
        ctx.fillStyle = COLORS.brass;
        ctx.fillRect(armLength - 20, -20, 40, 40);
        
        ctx.restore();
      }
    }
  }

  // Bird automaton class
  class BirdAutomaton {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.active = false;
      this.flapProgress = 0;
      this.chirpTimer = 0;
      this.visible = false;
    }

    activate() {
      this.active = true;
      this.visible = true;
      this.flapProgress = 0;
      this.chirpTimer = 0;
    }

    update(deltaTime) {
      if (this.active) {
        this.flapProgress += deltaTime * 0.01;
        this.chirpTimer += deltaTime;
        
        if (this.flapProgress > Math.PI * 4) {
          this.active = false;
          this.visible = false;
        }
        
        // Simulate chirp by changing color briefly
        if (this.chirpTimer > 500) {
          this.chirpTimer = -10000; // Long pause
        }
      }
    }

    draw(ctx) {
      if (!this.visible) return;
      
      ctx.save();
      ctx.translate(this.x, this.y);
      
      const flap = Math.sin(this.flapProgress) * 0.5;
      
      // Bird body
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Bird head
      ctx.beginPath();
      ctx.arc(25, -5, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Bird wing
      ctx.save();
      ctx.rotate(flap);
      ctx.fillStyle = '#A0522D';
      ctx.beginPath();
      ctx.ellipse(-5, 5, 15, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      
      // Bird tail
      ctx.fillStyle = '#654321';
      ctx.beginPath();
      ctx.moveTo(-15, 0);
      ctx.lineTo(-30, -10);
      ctx.lineTo(-30, 10);
      ctx.closePath();
      ctx.fill();
      
      // Bird eye
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(28, -7, 2, 0, Math.PI * 2);
      ctx.fill();
      
      // Bird beak
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.moveTo(30, 0);
      ctx.lineTo(40, -3);
      ctx.lineTo(40, 3);
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
    }
  }

  // Base/frame class
  class Frame {
    constructor(x, y, width, height) {
      this.x = x;
      this.y = y;
      this.width = width;
      this.height = height;
    }

    draw(ctx) {
      // Outer frame
      const frameGrad = ctx.createLinearGradient(this.x, this.y, this.x + this.width, this.y + this.height);
      frameGrad.addColorStop(0, COLORS.ironShadow);
      frameGrad.addColorStop(0.5, COLORS.iron);
      frameGrad.addColorStop(1, COLORS.ironHighlight);
      
      ctx.fillStyle = frameGrad;
      ctx.fillRect(this.x, this.y, this.width, this.height);
      
      // Inner panels
      ctx.fillStyle = COLORS.wood;
      ctx.fillRect(this.x + 20, this.y + 20, this.width - 40, this.height - 40);
      
      // Panel highlights
      const woodGrad = ctx.createLinearGradient(this.x + 20, this.y + 20, this.x + this.width - 20, this.y + this.height - 20);
      woodGrad.addColorStop(0, COLORS.woodHighlight);
      woodGrad.addColorStop(0.5, COLORS.wood);
      woodGrad.addColorStop(1, COLORS.woodHighlight);
      ctx.fillStyle = woodGrad;
      ctx.fillRect(this.x + 20, this.y + 20, this.width - 40, this.height - 40);
      
      // Ornamental edges
      ctx.strokeStyle = COLORS.brass;
      ctx.lineWidth = 3;
      ctx.strokeRect(this.x + 15, this.y + 15, this.width - 30, this.height - 30);
    }
  }

  // Main clockwork machine
  const machine = {
    gears: [],
    sprockets: [],
    chains: [],
    escapements: [],
    pistons: [],
    repairArms: [],
    bird: null,
    frame: null,
    looseGearChance: 0.0002,
    looseGearTimer: 5000,
    hourTimer: 45000,
    
    init() {
      // Create frame
      this.frame = new Frame(
        canvas.width * 0.1, 
        canvas.height * 0.1, 
        canvas.width * 0.8, 
        canvas.height * 0.8
      );
      
      // Create main gear (driven by motor)
      const mainGear = new Gear(canvas.width * 0.5, canvas.height * 0.5, 20, 60);
      mainGear.originalX = mainGear.x;
      mainGear.originalY = mainGear.y;
      this.gears.push(mainGear);
      
      // Create interlocking gears with proper ratios
      // Gear 1: 20 teeth, 60px radius (main driver)
      // Gear 2: 10 teeth, 30px radius (driven by 1, ratio 2:1)
      // Gear 3: 30 teeth, 90px radius (driven by 2, ratio 3:1)
      // etc.
      
      let prevGear = mainGear;
      let gearX = canvas.width * 0.5;
      let gearY = canvas.height * 0.3;
      
      // Upper gear train
      for (let i = 0; i < 4; i++) {
        const teeth = prevGear.teeth * (i % 2 === 0 ? 0.5 : 2);
        const radius = prevGear.radius * (i % 2 === 0 ? 0.5 : 2);
        const yDiff = i % 2 === 0 ? -150 : 150;
        
        const gear = new Gear(
          prevGear.x + (i % 2 === 0 ? -120 : 120),
          prevGear.y + yDiff,
          teeth,
          radius
        );
        gear.originalX = gear.x;
        gear.originalY = gear.y;
        this.gears.push(gear);
        prevGear = gear;
      }
      
      // Lower gear train
      prevGear = mainGear;
      gearX = canvas.width * 0.3;
      gearY = canvas.height * 0.6;
      
      for (let i = 0; i < 3; i++) {
        const teeth = 15 + i * 10;
        const radius = teeth * 3;
        
        const gear = new Gear(
          canvas.width * 0.2 + i * 120,
          canvas.height * 0.7,
          teeth,
          radius,
          COLORS.iron
        );
        gear.originalX = gear.x;
        gear.originalY = gear.y;
        this.gears.push(gear);
        
        if (i > 0) {
          // Connect to previous gear
        }
      }
      
      // Create sprockets
      const sprocket1 = new Sprocket(canvas.width * 0.2, canvas.height * 0.4, 25, 8);
      const sprocket2 = new Sprocket(canvas.width * 0.8, canvas.height * 0.4, 25, 8);
      this.sprockets.push(sprocket1, sprocket2);
      
      // Create chain
      const chain = new Chain(sprocket1.x, sprocket1.y, 400, sprocket1, sprocket2);
      this.chains.push(chain);
      
      // Create escapement
      const escapement = new Escapement(canvas.width * 0.6, canvas.height * 0.3);
      this.escapements.push(escapement);
      
      // Create pistons
      const piston1 = new Piston(canvas.width * 0.4, canvas.height * 0.5, 30, 50);
      const piston2 = new Piston(canvas.width * 0.7, canvas.height * 0.5, 25, 40);
      this.pistons.push(piston1, piston2);
      
      // Create repair arm
      const repairArm = new RepairArm(canvas.width * 0.1, canvas.height * 0.2);
      this.repairArms.push(repairArm);
      
      // Create bird automaton
      this.bird = new BirdAutomaton(canvas.width * 0.5, canvas.height * 0.1);
      
      // Create additional gears for complexity
      for (let i = 0; i < 8; i++) {
        const teeth = rand(8, 24);
        const radius = teeth * 3;
        const x = rand(canvas.width * 0.2, canvas.width * 0.8);
        const y = rand(canvas.height * 0.2, canvas.height * 0.8);
        
        const gear = new Gear(x, y, teeth, radius, i % 2 === 0 ? COLORS.brass : COLORS.iron);
        gear.originalX = x;
        gear.originalY = y;
        gear.speedMultiplier = rand(0.8, 1.5);
        this.gears.push(gear);
      }
    },
    
    update(deltaTime) {
      // Update main gear (motor)
      this.gears[0].update(deltaTime);
      
      // Update dependent gears
      for (let i = 1; i < this.gears.length; i++) {
        const gear = this.gears[i];
        if (!gear.loose) {
          // Find nearest driven gear to mesh with
          let closest = null;
          let minDist = Infinity;
          for (let j = 0; j < this.gears.length; j++) {
            if (j !== i && !this.gears[j].loose) {
              const dist = distance({x: gear.x, y: gear.y}, {x: this.gears[j].x, y: this.gears[j].y});
              if (dist < minDist && dist < 300) {
                minDist = dist;
                closest = this.gears[j];
              }
            }
          }
          
          if (closest) {
            gear.update(deltaTime, closest);
          } else {
            gear.update(deltaTime);
          }
        } else {
          gear.update(deltaTime);
        }
      }
      
      // Update sprockets and chains
      this.sprockets.forEach((sprocket, i) => {
        sprocket.update(this.gears[0].angle * (i === 0 ? 1 : -1));
      });
      
      this.chains.forEach(chain => chain.update(deltaTime));
      
      // Update escapements
      this.escapements.forEach(escapement => escapement.update(this.gears[0].angle));
      
      // Update pistons
      this.pistons.forEach(piston => piston.update());
      
      // Update repair arms
      this.repairArms.forEach(arm => arm.update(deltaTime));
      
      // Update bird
      this.bird.update(deltaTime);
      
      // Check for loose gear
      this.looseGearTimer -= deltaTime;
      if (this.looseGearTimer < 0 && Math.random() < 0.02 && this.gears.length > 2) {
        const gearIndex = Math.floor(Math.random() * (this.gears.length - 2)) + 2;
        const gear = this.gears[gearIndex];
        if (!gear.loose) {
          gear.loose = true;
          gear.vx = rand(-5, 5);
          gear.vy = -10;
          gear.angularVel = rand(-0.3, 0.3);
          
          this.looseGearTimer = 5000;
          
          // Activate repair arm
          if (Math.random() < 0.7) {
            const repairArm = this.repairArms[0];
            repairArm.active = true;
            repairArm.targetGear = gear;
            repairArm.angle = angleBetween(
              {x: repairArm.x, y: repairArm.y}, 
              {x: gear.x, y: gear.y}
            );
          }
        }
      }
      
      // Check for hourly bird (every 45 seconds)
      this.hourTimer -= deltaTime;
      if (this.hourTimer < 0) {
        this.bird.activate();
        this.hourTimer = 45000;
      }
    },
    
    draw(ctx) {
      // Clear canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Draw frame
      this.frame.draw(ctx);
      
      // Draw gears
      this.gears.forEach(gear => gear.draw(ctx));
      
      // Draw sprockets
      this.sprockets.forEach(sprocket => sprocket.draw(ctx));
      
      // Draw chains
      this.chains.forEach(chain => chain.draw(ctx));
      
      // Draw escapements
      this.escapements.forEach(escapement => escapement.draw(ctx));
      
      // Draw pistons
      this.pistons.forEach(piston => piston.draw(ctx));
      
      // Draw repair arms
      this.repairArms.forEach(arm => arm.draw(ctx));
      
      // Draw bird
      this.bird.draw(ctx);
      
      // Draw shadows
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      this.gears.forEach(gear => {
        if (!gear.loose) {
          ctx.beginPath();
          ctx.arc(gear.x, gear.y + 10, gear.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }
  };

  // Initialize machine
  machine.init();

  // Animation loop
  let lastTime = 0;
  function animate(time) {
    const deltaTime = time - lastTime;
    lastTime = time;
    
    machine.update(deltaTime);
    machine.draw(ctx);
    
    requestAnimationFrame(animate);
  }
  
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
