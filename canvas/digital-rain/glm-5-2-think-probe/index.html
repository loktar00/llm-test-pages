<!DOCTYPE html>
<html lang="en">

<title>Falling Glyph Rain</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #06080f;
}

canvas { display: block; position: fixed; inset: 0; }

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(6, 8, 15, 0.6) 100%);
  z-index: 5;
}

.hud {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(168, 231, 220, 0.4);
  font-family: 'Courier New', monospace;
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 0 8px rgba(45, 212, 191, 0.3);
}
</style>
</head>
