<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Sorting Race</title>
    <style>
        body, html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const COLORS = {
            bg: '#050505',
            bar: {
                bubble: '#FF4081',
                insertion: '#00E676',
                merge: '#FFD740',
                quick: '#2979FF'
            },
            highlight: '#FFFFFF',
            text: '#FFFFFF',
            dim: '#333333'
        };

        const NAMES = ['Bubble Sort', 'Insertion Sort', 'Merge Sort', 'Quick Sort'];
        const KEYS = ['bubble', 'insertion', 'merge', 'quick'];

        // Algorithm State
        class SortRunner {
            constructor(key, data) {
                this.key = key;
                this.data = [...data];
                this.opCount = 0;
                this.finished = false;
                this.finishedTime = 0;
                
                // Bubble State
                this.bPass = 0;
                this.bIdx = 0;
                
                // Insertion State
                this.iOuter = 1;
                this.iInner = 0;
                this.iTemp = 0;
                
                // Merge State
                this.mPass = 1;
                this.mIdx = 0;
                this.mTemp = [];
                this.mPhase = 0; // 0: copy, 1: merge
                
                // Quick State
                this.qStack = [[0, this.data.length - 1]];
                this.qPivot = 0;
                this.qScan = 0;
                this.qStore = 0;
                this.qPhase = 0; // 0: partition, 1: recurse
            }

            step() {
                if (this.finished) return;

                switch (this.key) {
                    case 'bubble': this.stepBubble(); break;
                    case 'insertion': this.stepInsertion(); break;
                    case 'merge': this.stepMerge(); break;
                    case 'quick': this.stepQuick(); break;
                }
            }

            // --- Bubble Sort ---
            stepBubble() {
                const n = this.data.length;
                if (this.bPass >= n - 1) {
                    this.finish();
                    return;
                }

                if (this.bIdx < n - 1 - this.bPass) {
                    const j = this.bIdx;
                    const j1 = this.bIdx + 1;
                    
                    // Highlight comparison
                    this.comparing = [j, j1];
                    
                    if (this.data[j] > this.data[j1]) {
                        [this.data[j], this.data[j1]] = [this.data[j1], this.data[j]];
                        this.swapping = [j, j1];
                    }
                    
                    this.opCount++;
                    this.bIdx++;
                } else {
                    this.comparing = [];
                    this.swapping = [];
                    this.bPass++;
                    this.bIdx = 0;
                }
            }

            // --- Insertion Sort ---
            stepInsertion() {
                const n = this.data.length;
                if (this.iOuter >= n) {
                    this.finish();
                    return;
                }

                if (this.iInner < this.iOuter) {
                    // Highlight
                    this.comparing = [this.iInner, this.iOuter];
                    
                    if (this.data[this.iInner] > this.data[this.iInner + 1]) {
                        [this.data[this.iInner], this.data[this.iInner + 1]] = 
                        [this.data[this.iInner + 1], this.data[this.iInner]];
                        this.swapping = [this.iInner, this.iInner + 1];
                    } else {
                        // Break inner loop logic handled by by stepping back
                    }
                    this.opCount++;
                    this.iInner++;
                } else {
                    this.comparing = [];
                    this.swapping = [];
                    this.iOuter++;
                    this.iInner = 0;
                }
            }

            // --- Merge Sort ---
            stepMerge() {
                const n = this.data.length;
                
                // Simple iterative merge sort simulation
                // We use a temporary array for merging, but we need to reflect changes back
                // To avoid creating new arrays every step, we manage the pass size
                
                // If we need to initialize temp array for this pass
                if (this.mPass === 1 && this.mIdx === 0) {
                    this.mTemp = [...this.data];
                }

                if (this.mPass >= n) {
                    // Copy back from temp to data if not identity
                    if (this.mIdx < n) {
                        this.data[this.mIdx] = this.mTemp[this.mIdx];
                        this.comparing = [this.mIdx];
                        this.mIdx++;
                        this.opCount++;
                        return;
                    } else {
                        this.finish();
                        return;
                    }
                }

                // Merge logic simulation
                // We iterate through blocks of size 'mPass'
                if (this.mIdx < n) {
                    const size = this.mPass;
                    const left = this.mIdx;
                    const mid = Math.min(left + size, n);
                    const right = Math.min(left + 2 * size, n);
                    
                    // We simulate the merge of data[left...mid-1] and data[mid...right-1] into mTemp
                    // This requires careful state management. 
                    // Simplified approach: Justify logic.
                    
                    // For visualization, we highlight the ranges being merged
                    this.comparing = [left, right - 1]; 
                    
                    // Actually, let's use a standard helper but "slow it down" via state
                    // Since the above structure is rigid, let's switch to a recursive-like stack simulation for stability?
                    // No, iterative is better for single-step.
                    
                    // Re-evaluating the merge step properly:
                    // We need to track indices inside the merge block
                    // This hack: We recalculate the merge indices based on mIdx
                    
                    let i = left;
                    let j = mid;
                    let k = left;
                    
                    // We need to persist i, j, k inside the object.
                    if (!this.iM_i) this.iM_i = left;
                    if (!this.iM_j) this.iM_j = mid;
                    if (!this.iM_k) this.iM_k = left;

                    if (this.iM_j < right && (this.iM_i < mid || this.data[this.iM_i] > this.data[this.iM_j])) {
                         this.mTemp[this.iM_k] = this.data[this.iM_j];
                         this.comparing = [this.iM_j];
                         this.iM_j++;
                    } else {
                         this.mTemp[this.iM_k] = this.data[this.iM_i];
                         this.comparing = [this.iM_i];
                         this.iM_i++;
                    }
                    this.mTemp[this.iM_k] = (this.iM_i < mid && this.iM_j < right) ? 
                        (this.data[this.iM_i] <= this.data[this.iM_j] ? this.data[this.iM_i] : this.data[this.iM_j]) : 
                        (this.iM_i < mid ? this.data[this.iM_i] : this.data[this.iM_j]);
                    
                    // Correct logic above is messy, let's rewrite clean:
                    
                    // Reset and redo clean logic
                    this.mTemp[this.iM_k] = (this.iM_i < mid && this.iM_j < right) ?
                        (this.data[this.iM_i] <= this.data[this.iM_j] ? this.data[this.iM_i] : this.data[this.iM_j]) :
                        (this.iM_i < mid ? this.data[this.iM_i] : this.data[this.iM_j]);
                    
                    this.iM_k++;
                    this.opCount++;

                    if (this.iM_k === right) {
                        // Block merged, move to next block
                        this.mIdx += (2 * this.mPass);
                        this.mPass *= 2;
                        // Reset inner merge pointers
                        this.iM_i = null; 
                    }
                } else {
                     // Finish pass
                     this.mPass = 1;
                     this.mIdx = 0;
                     this.iM_i = null;
                }
            }
            
            // Override Merge Step for clean implementation
            stepMerge() {
                 const n = this.data.length;
                 
                 if (this.mPass >= n) {
                     // Copy remaining from temp to data
                     if (this.mIdx < n) {
                         this.comparing = [this.mIdx];
                         this.data[this.mIdx] = this.mTemp[this.mIdx];
                         this.mIdx++;
                         this.opCount++;
                         return;
                     }
                     this.finish();
                     return;
                 }

                 // Init pointers if start of pass
                 if (this.mIdx === 0) {
                     this.mTemp = [...this.data];
                     this.iM_i = 0; // Temp pointer
                 }

                 const size = this.mPass;
                 
                 // We iterate blocks
                 if (this.mIdx < n) {
                     const left = this.mIdx;
                     const mid = Math.min(left + size, n);
                     const right = Math.min(left + 2 * size, n);
                     
                     // Merge pointers
                     if (this.iM_i === 0) {
                         this.pL = left;
                         this.pR = mid;
                         this.pOut = left;
                     }
                     
                     // Merge logic
                     if (this.pR < right && (this.pL >= mid || this.data[this.pL] > this.data[this.pR])) {
                         this.mTemp[this.pOut] = this.data[this.pR];
                         this.comparing = [this.pR];
                         this.pR++;
                     } else {
                         this.mTemp[this.pOut] = this.data[this.pL];
                         this.comparing = [this.pL];
                         this.pL++;
                     }
                     this.pOut++;
                     this.opCount++;
                     
                     if (this.pOut === right) {
                         this.mIdx += (2 * size);
                         this.mPass *= 2;
                         this.iM_i = 0; // Reset flag
                     }
                 } else {
                     this.mPass = 1;
                     this.mIdx = 0;
                 }
            }

            // --- Quick Sort ---
            stepQuick() {
                if (this.qStack.length === 0) {
                    this.finish();
                    return;
                }

                const [start, end] = this.qStack[this.qStack.length - 1];
                
                if (start >= end) {
                    this.qStack.pop();
                    return;
                }

                // Partition step
                if (this.qPhase === 0) {
                    this.qPivot = this.data[end];
                    this.qStore = start;
                    this.qScan = start;
                    this.qPhase = 1;
                }

                if (this.qScan <= end) {
                    this.comparing = [this.qScan, end]; // Highlight scan and pivot
                    
                    if (this.data[this.qScan] <= this.qPivot) {
                        [this.data[this.qStore], this.data[this.qScan]] = 
                        [this.data[this.qScan], this.data[this.qStore]];
                        this.swapping = [this.qStore, this.qScan];
                        this.qStore++;
                    }
                    this.qScan++;
                    this.opCount++;
                } else {
                    // Partition complete
                    [this.data[this.qStore], this.data[end]] = 
                    [this.data[end], this.data[this.qStore]];
                    this.swapping = [this.qStore, end];
                    this.qPhase = 0; // Reset phase for next call
                    
                    // Push right subarray
                    this.qStack.push([this.qStore + 1, end]);
                    
                    // Update current stack top to left subarray
                    this.qStack.pop(); // Remove right
                    this.qStack[this.qStack.length - 1] = [start, this.qStore - 1];
                }
            }

            finish() {
                this.finished = true;
                this.finishedTime = Date.now();
                this.comparing = [];
                this.swapping = [];
            }
        }

        // Game State
        let runners = [];
        let allFinished = false;
        let finishedCount = 0;
        let raceData = [];
        let barCount = 50;
        let lastTime = 0;
        const SPEED = 2; // Steps per frame

        function initRace() {
            raceData = Array.from({ length: barCount }, () => Math.floor(Math.random() * 100) + 10);
            runners = KEYS.map(key => new SortRunner(key, raceData));
            allFinished = false;
            finishedCount = 0;
            lastTime = Date.now();
        }

        initRace();

        function draw() {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, W, H);

            const panelW = W / 4;
            const barW = Math.max(2, (panelW - 20) / barCount);
            const maxVal = 110;
            const graphH = H * 0.75;
            const startY = H * 0.2;

            runners.forEach((runner, i) => {
                const x = i * panelW;
                const color = COLORS.bar[runner.key];
                
                // Draw Panel Background
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 5, startY, panelW - 10, graphH);

                // Title
                ctx.fillStyle = '#fff';
                ctx.font = '16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(NAMES[i], x + panelW / 2, startY - 10);

                // Draw Bars
                for (let j = 0; j < barCount; j++) {
                    const val = runner.data[j];
                    const h = (val / maxVal) * graphH;
                    const bx = x + 10 + j * barW;
                    const by = startY + graphH - h;

                    // Color logic
                    let fill = color;
                    if (runner.comparing && runner.comparing.includes(j)) {
                        fill = COLORS.highlight;
                    } else if (runner.swapping && runner.swapping.includes(j)) {
                        fill = '#FF0000'; // Bright red for swap
                    }

                    ctx.fillStyle = fill;
                    ctx.fillRect(bx, by, barW - 1, h);
                }

                // Counters
                ctx.fillStyle = '#888';
                ctx.font = '12px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText(`Ops: ${runner.opCount}`, x + 10, startY + graphH + 20);
                
                if (runner.finished) {
                    ctx.fillStyle = '#00E676';
                    ctx.fillText('DONE', x + 10, startY + graphH + 35);
                }
            });

            // Standings Overlay
            if (allFinished) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, W, H);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('RACE COMPLETE', W / 2, H / 2 - 50);

                // Sort finished runners
                const sorted = [...runners].sort((a, b) => a.finishedTime - b.finishedTime);
                
                ctx.font = '20px Courier New';
                sorted.forEach((r, idx) => {
                    ctx.fillStyle = COLORS.bar[r.key];
                    ctx.fillText(`#${idx + 1} ${NAMES[KEYS.indexOf(r.key)]}`, W / 2, H / 2 + idx * 30);
                });
            }
        }

        function loop() {
            if (!allFinished) {
                let anyActive = false;
                runners.forEach(r => {
                    if (!r.finished) {
                        for (let k = 0; k < SPEED; k++) r.step();
                        if (r.finished) finishedCount++;
                        anyActive = true;
                    }
                });

                if (finishedCount === runners.length) {
                    allFinished = true;
                    setTimeout(initRace, 3000);
                }
            }
            
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
