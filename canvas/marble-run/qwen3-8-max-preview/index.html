<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Marble Run — Endless Kinetic Course</title>
<style>
  :root{
    --ink:#f2e8d5; --amber:#ffc247; --teal:#45d6c3; --coral:#ff5c49;
    --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
    --disp:Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Medium',sans-serif;
    --body:'Avenir Next','Segoe UI','Trebuchet MS',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#080f12;overscroll-behavior:none}
  body{font-family:var(--body);-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(125% 95% at 50% 42%,transparent 55%,rgba(3,8,10,.62) 100%)}
  .hud{position:fixed;z-index:5;color:var(--ink)}
  .hud-title{top:24px;left:28px;pointer-events:none}
  .hud-title h1{font-family:var(--disp);font-weight:400;font-size:clamp(30px,4.4vw,48px);
    letter-spacing:.05em;line-height:.92;text-shadow:0 3px 22px rgba(0,0,0,.65)}
  .hud-title h1 em{font-style:normal;color:var(--amber)}
  .hud-title .rule{width:74px;height:3px;margin:10px 0 9px;
    background:linear-gradient(90deg,var(--coral),var(--amber) 55%,var(--teal))}
  .hud-title .tag{font-family:var(--mono);font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;color:rgba(242,232,213,.6)}
  .hud-stats{top:24px;right:28px;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:196px}
  .chip{pointer-events:auto;display:grid;grid-template-columns:1fr auto;align-items:baseline;
    column-gap:12px;padding:8px 12px;background:rgba(7,15,19,.66);
    border:1px solid rgba(160,205,210,.15);border-left:3px solid rgba(255,194,71,.75);
    border-radius:2px;transition:transform .25s ease,border-color .25s ease,background .25s ease}
  .chip:hover{transform:translateY(-2px);border-color:rgba(255,194,71,.55);background:rgba(10,22,27,.85)}
  .chip .lab{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,232,213,.55)}
  .chip b{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--amber)}
  #nextBar{grid-column:1/-1;height:3px;margin-top:6px;background:rgba(242,232,213,.14);overflow:hidden}
  #nextFill{display:block;height:100%;background:var(--teal);transform-origin:left;transform:scaleX(1)}
  .chip.warn{border-left-color:var(--coral)}
  .chip.warn b{color:var(--coral);animation:blink .8s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.4}}
  .hud-map{left:28px;top:50%;transform:translateY(-50%);pointer-events:none}
  .hud-map .lab{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;
    color:rgba(242,232,213,.5);margin-bottom:8px}
  .mapbar{width:34px;height:15px;margin-bottom:6px;background:rgba(242,232,213,.1);
    border:1px solid rgba(242,232,213,.18);transition:background .45s,box-shadow .45s}
  .mapbar.active{background:rgba(69,214,195,.8);box-shadow:0 0 16px rgba(69,214,195,.55)}
  .mapbar.flash{animation:sflash 1s ease}
  @keyframes sflash{0%{background:var(--amber);box-shadow:0 0 22px var(--amber)}100%{}}
  .hud-note{bottom:18px;right:28px;pointer-events:none;font-family:var(--mono);font-size:9px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(242,232,213,.38);text-align:right}
  #toasts{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
    background:var(--amber);color:#1c1204;padding:8px 18px;border-radius:2px;
    box-shadow:0 8px 28px rgba(0,0,0,.45);animation:toast 2.6s ease forwards}
  @keyframes toast{0%{opacity:0;transform:translateY(14px)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  @media(max-width:680px){.hud-map{display:none}.hud-stats{width:158px}.hud-note{display:none}}
  @media(prefers-reduced-motion:reduce){.toast,.chip.warn b,.mapbar.flash{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<header class="hud hud-title">
  <h1>MARBLE<em>RUN</em></h1>
  <div class="rule"></div>
  <p class="tag">endless kinetic machine · plays itself</p>
</header>

<aside class="hud hud-stats">
  <div class="chip"><span class="lab">marbles</span><b id="stMarbles">0</b></div>
  <div class="chip"><span class="lab">avg speed</span><b id="stSpeed">0000</b></div>
  <div class="chip"><span class="lab">bumper hits</span><b id="stBumps">0</b></div>
  <div class="chip" id="chipNext"><span class="lab">next rebuild</span><b id="stNext">0:30</b>
    <span id="nextBar"><i id="nextFill"></i></span></div>
  <div class="chip"><span class="lab">rebuilds</span><b id="stRebuilds">0</b></div>
</aside>

<nav class="hud hud-map" aria-hidden="true">
  <div class="lab">course</div>
  <div id="map"></div>
</nav>

<footer class="hud hud-note">circle · segment impulses — 240 hz — sections re-roll every 30 s</footer>
<div id="toasts"></div>

<script>
(()=>{ 'use strict';
const TAU=Math.PI*2;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const MONO="ui-monospace,'SF Mono',Menlo,Consolas,monospace";
let dpr=1,vw=0,vh=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;
  cvs.width=Math.round(vw*dpr);cvs.height=Math.round(vh*dpr);}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32((Date.now()^0x9E3779B9)>>>0);
const rand=(a,b)=>a+rng()*(b-a);
const pick=a=>a[(rng()*a.length)|0];
const newSeed=()=>(Math.random()*0x7FFFFFFF)|0;
const hx=c=>{const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255];};
const mix=(c1,c2,t)=>{const a=hx(c1),b=hx(c2);
  return'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';};
const rgba=(c,a)=>{const n=hx(c);return'rgba('+n[0]+','+n[1]+','+n[2]+','+a+')';};

/* ---------------- world & course ---------------- */
const W=1200,H=1100,NSEC=6,WORLD_H=H*NSEC,WALL=26,GRAV=980;
const MARBLE_N=22,REBUILD_EVERY=30;
const MARBLE_COLS=['#ff6b57','#ffc247','#5ad1a0','#59b7ff','#c88bff','#ff8fb1','#8fe3ff','#ffd98f'];
const BUMPER_COLS=['#ff5c49','#45d6c3','#ffc247'];

const ports=new Array(NSEC+1);
ports[0]=W/2;
for(let i=0;i<NSEC;i++)ports[i+1]=clamp(ports[i]+rand(-430,430),240,W-240);

function buildSection(i,seed){
  const R=mulberry32(seed);
  const rr=(a,b)=>a+R()*(b-a);
  const y0=i*H,entryX=ports[i],exitX=ports[i+1];
  const s={i,y0,seed,entryX,exitX,segs:[],pegs:[],bumpers:[],spinners:[],rebuiltAt:-9};
  const add=(ax,ay,bx,by,type)=>s.segs.push({ax,ay,bx,by,type:type||'track'});
  add(WALL-14,y0-40,WALL-14,y0+H+40,'wall');
  add(W-WALL+14,y0-40,W-WALL+14,y0+H+40,'wall');
  add(entryX-170,y0+16,entryX-30,y0+86);
  add(entryX+170,y0+16,entryX+30,y0+86);
  const top=y0+150,bot=y0+H-190;
  const nSt=3+((R()*2)|0),sh=(bot-top)/nSt;
  let last='';
  for(let k=0;k<nSt;k++){
    const st=top+sh*k;
    const bag=['ramp','ramp','funnel','spinner','bumpers','pegs'].filter(t=>t!==last);
    const type=bag[(R()*bag.length)|0];last=type;
    const cx=rr(300,W-300);
    if(type==='ramp'){
      const dir=R()<0.5?1:-1,yA=st+rr(28,60),drop=rr(72,112);
      const x1=dir>0?WALL-14:W-WALL+14,x2=dir>0?W-WALL+14-drop:WALL-14+drop;
      const y2=yA+Math.min(sh*rr(.42,.6),540);
      add(x1,yA,x2,y2);
      if(R()<0.6){
        const yB=y2+rr(70,110);
        const x3=dir>0?W-WALL+14:WALL-14,x4=dir>0?WALL-14+drop+46:W-WALL+14-drop-46;
        add(x3,yB,x4,yB+Math.min(sh*rr(.3,.45),420));
      }
    }else if(type==='funnel'){
      const half=Math.min(rr(240,330),cx-70,W-70-cx);
      const fy=st+sh*rr(.35,.55),g=rr(30,36);
      add(cx-half,fy-70,cx-g,fy+46);
      add(cx+half,fy-70,cx+g,fy+46);
    }else if(type==='spinner'){
      const sy=st+sh*rr(.3,.5);
      s.spinners.push({x:cx,y:sy,len:rr(120,178),arms:2+((R()*3)|0),ang:R()*TAU,
        omega:rr(1.2,2.4)*(R()<0.5?-1:1),hub:16});
      const lx=Math.max(WALL+30,cx-rr(280,340)),rx=Math.min(W-WALL-30,cx+rr(280,340));
      add(cx-rr(120,160),sy+rr(130,160),lx,sy+rr(185,215));
      add(cx+rr(120,160),sy+rr(130,160),rx,sy+rr(185,215));
    }else if(type==='bumpers'){
      const put=(x,y,r)=>s.bumpers.push({x:clamp(x,110,W-110),y,r,flash:0,lr:-9,
        col:BUMPER_COLS[s.bumpers.length%3]});
      put(cx-rr(120,185),st+sh*.32,rr(24,32));
      put(cx+rr(120,185),st+sh*.44,rr(24,32));
      put(cx+rr(-70,70),st+sh*.7,rr(26,36));
    }else{
      const rows=3,cols=5;
      for(let ry=0;ry<rows;ry++)for(let c2=0;c2<cols;c2++){
        const px=cx+(c2-(cols-1)/2)*96+(ry%2?48:0);
        if(px<90||px>W-90)continue;
        s.pegs.push({x:px,y:st+sh*.3+ry*74,r:11});
      }
    }
  }
  add(WALL-14,y0+H-150,exitX-32,y0+H-44);
  add(W-WALL+14,y0+H-150,exitX+32,y0+H-44);
  return s;
}
const sections=[];
for(let i=0;i<NSEC;i++)sections.push(buildSection(i,newSeed()));

/* ---------------- marbles ---------------- */
const marbles=[];
for(let i=0;i<MARBLE_N;i++){
  marbles.push({x:ports[0]+rand(-42,42),y:-30-i*58-rand(0,26),px:0,py:0,
    vx:rand(-30,30),vy:rand(20,80),r:rand(10,14.5),color:pick(MARBLE_COLS),
    spin:rand(0,TAU),spinV:0,stuck:0,ls:-9});
}
for(const m of marbles){m.px=m.x;m.py=m.y;}

/* ---------------- effects ---------------- */
const rings=[],sparks=[];
const addRing=(x,y,col,max)=>{if(rings.length<60)rings.push({x,y,col,max,t:0,life:.65});};
function sparkAt(x,y,col,n){for(let i=0;i<n;i++){const a=rand(0,TAU),sp=rand(40,200);
  sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,t:0,life:rand(.35,.7),col,r:rand(1.2,2.6)});}}

/* ---------------- physics ---------------- */
let simT=0,bumpCount=0,camShake=0;
function collideSeg(m,ax,ay,bx,by,rest,fric,svx,svy){
  const abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby||1e-9;
  let t=((m.x-ax)*abx+(m.y-ay)*aby)/len2;t=t<0?0:t>1?1:t;
  const px=ax+abx*t,py=ay+aby*t;
  let dx=m.x-px,dy=m.y-py;const d2=dx*dx+dy*dy;
  if(d2>=m.r*m.r)return null;
  let d=Math.sqrt(d2),nx,ny;
  if(d<1e-6){const l=Math.sqrt(len2);nx=-aby/l;ny=abx/l;d=0;}else{nx=dx/d;ny=dy/d;}
  m.x+=nx*(m.r-d);m.y+=ny*(m.r-d);
  const rvx=m.vx-svx,rvy=m.vy-svy,vn=rvx*nx+rvy*ny;
  let impact=0;
  if(vn<0){
    impact=-vn;
    m.vx+=nx*(1+rest)*impact;m.vy+=ny*(1+rest)*impact;
    const tx=-ny,ty=nx;
    const vt=(m.vx-svx)*tx+(m.vy-svy)*ty;
    m.vx-=tx*vt*fric;m.vy-=ty*vt*fric;
  }
  return{px,py,nx,ny,impact};
}
function collideCircle(m,ox,oy,or,rest,boost){
  const dx=m.x-ox,dy=m.y-oy,rr2=m.r+or,d2=dx*dx+dy*dy;
  if(d2>=rr2*rr2)return null;
  const d=Math.sqrt(d2);let nx,ny;
  if(d<1e-6){nx=0;ny=-1;}else{nx=dx/d;ny=dy/d;}
  m.x+=nx*(rr2-d);m.y+=ny*(rr2-d);
  const vn=m.vx*nx+m.vy*ny;let impact=0;
  if(vn<0){impact=-vn;m.vx+=nx*((1+rest)*impact+boost);m.vy+=ny*((1+rest)*impact+boost);}
  return{px:m.x-nx*m.r,py:m.y-ny*m.r,impact};
}
function pairCollide(){
  for(let i=0;i<marbles.length;i++){const a=marbles[i];
    for(let j=i+1;j<marbles.length;j++){const b=marbles[j];
      const dx=b.x-a.x,dy=b.y-a.y,rs=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2>=rs*rs||d2===0)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,pen=rs-d;
      const ma=a.r*a.r,mb=b.r*b.r,mt=ma+mb;
      a.x-=nx*pen*(mb/mt);a.y-=ny*pen*(mb/mt);
      b.x+=nx*pen*(ma/mt);b.y+=ny*pen*(ma/mt);
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){const jimp=-1.42*vn/(1/ma+1/mb);
        a.vx-=nx*jimp/ma;a.vy-=ny*jimp/ma;
        b.vx+=nx*jimp/mb;b.vy+=ny*jimp/mb;}
    }}
}
function recycle(m){
  addRing(m.x,WORLD_H+36,m.color,56);
  m.x=ports[0]+rand(-44,44);m.y=-rand(10,120);
  m.vx=rand(-40,40);m.vy=rand(30,90);m.stuck=0;m.px=m.x;m.py=m.y;
  addRing(m.x,m.y+14,m.color,34);
}
function physics(dt){
  simT+=dt;
  for(const s of sections)for(const sp of s.spinners)sp.ang+=sp.omega*dt;
  for(const m of marbles){
    m.px=m.x;m.py=m.y;
    m.vy+=GRAV*dt;m.x+=m.vx*dt;m.y+=m.vy*dt;
    let best=null;
    for(const s of sections){
      if(m.y<s.y0-90||m.y>s.y0+H+90)continue;
      for(const g of s.segs){
        const c=collideSeg(m,g.ax,g.ay,g.bx,g.by,0.16,0.004,0,0);
        if(c&&(!best||c.impact>best.impact))best=c;
      }
      for(const p of s.pegs)collideCircle(m,p.x,p.y,p.r,0.5,0);
      for(const b of s.bumpers){
        const c=collideCircle(m,b.x,b.y,b.r,0.85,150);
        if(c&&c.impact>50){
          b.flash=1;bumpCount++;
          if(simT-b.lr>0.12){b.lr=simT;addRing(c.px,c.py,b.col,42);}
          if(c.impact>520)camShake=Math.min(5,camShake+1.6);
          if(c.impact>230&&simT-m.ls>0.12){m.ls=simT;sparkAt(c.px,c.py,m.color,3);}
        }
      }
      for(const sp of s.spinners){
        collideCircle(m,sp.x,sp.y,sp.hub,0.3,0);
        const rx=m.x-sp.x,ry=m.y-sp.y,svx=-sp.omega*ry,svy=sp.omega*rx;
        for(let a=0;a<sp.arms;a++){
          const an=sp.ang+a*TAU/sp.arms,ca=Math.cos(an),sa=Math.sin(an);
          const c=collideSeg(m,sp.x+ca*16,sp.y+sa*16,sp.x+ca*sp.len,sp.y+sa*sp.len,0.3,0.003,svx,svy);
          if(c&&c.impact>320&&simT-m.ls>0.12){m.ls=simT;sparkAt(c.px,c.py,'#ffd98f',2);}
        }
      }
    }
    if(best){
      m.spinV=(m.vx*-best.ny+m.vy*best.nx)/m.r;
      if(best.impact>430&&simT-m.ls>0.15){m.ls=simT;sparkAt(best.px,best.py,m.color,2);}
    }else m.spinV=m.vx/m.r;
    m.spin+=m.spinV*dt;
    const s2=m.vx*m.vx+m.vy*m.vy;
    if(s2>2250000){const k=1500/Math.sqrt(s2);m.vx*=k;m.vy*=k;}
    if(m.y>40&&m.y<WORLD_H-40&&s2<900)m.stuck+=dt;else m.stuck=Math.max(0,m.stuck-dt*3);
    if(m.stuck>2.5){m.stuck=0;m.vx+=rand(-180,180);m.vy-=rand(40,150);}
    if(m.y>WORLD_H+70)recycle(m);
  }
  pairCollide();
}

/* ---------------- camera ---------------- */
const cam={x:W/2,y:100,s:0.6,ts:0.6};
function updateCamera(dt){
  let sx=0,sy=0,n=0,minY=1e9,maxY=-1e9;
  for(const m of marbles){if(m.y<-220)continue;sx+=m.x;sy+=m.y;n++;
    if(m.y<minY)minY=m.y;if(m.y>maxY)maxY=m.y;}
  if(!n){sx=cam.x;sy=cam.y;n=1;minY=cam.y;maxY=cam.y;}
  const spread=maxY-minY;
  const viewH=clamp(spread*1.1+760,950,2700);
  let ts=vh/viewH;ts=Math.min(ts,vw/760);
  const k=1-Math.exp(-dt*2.1),ks=1-Math.exp(-dt*1.5);
  cam.x+=(sx/n-cam.x)*k;cam.y+=(sy/n-cam.y)*k;
  cam.ts+=(ts-cam.ts)*ks;cam.s=cam.ts;
  const halfH=vh/cam.s/2,halfW=vw/cam.s/2;
  cam.y=clamp(cam.y,halfH-900,WORLD_H-halfH+400);
  if(halfW*2>=W)cam.x=W/2;else cam.x=clamp(cam.x,halfW-60,W-halfW+60);
}

/* ---------------- ambient ---------------- */
const dust=[];
for(let i=0;i<64;i++)dust.push({x:Math.random(),y:Math.random(),r:rand(.7,2.1),sp:rand(6,20),ph:rand(0,TAU)});
const bokeh=[];
for(let i=0;i<9;i++)bokeh.push({x:Math.random(),y:Math.random(),r:rand(90,220),
  c:pick(['#45d6c3','#ffc247','#ff5c49','#59b7ff','#c88bff']),ph:rand(0,TAU)});
function updateFX(dt){
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>=rings[i].life)rings.splice(i,1);}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=520*dt;
    if(s.t>=s.life)sparks.splice(i,1);}
  for(const s of sections)for(const b of s.bumpers)b.flash*=Math.exp(-dt*5);
  camShake*=Math.exp(-dt*5);
  for(const d of dust){d.y-=d.sp*dt/vh;if(d.y<-0.02)d.y=1.02;}
}

/* ---------------- rendering ---------------- */
let viewL=0,viewR=0,viewT=0,viewB=0;
function line(ax,ay,bx,by){ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();}
function drawBG(t){
  const g=ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,'#0e1d23');g.addColorStop(.5,'#0a1519');g.addColorStop(1,'#060d10');
  ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
  ctx.globalCompositeOperation='lighter';
  const spanX=vw*1.3,spanY=vh*1.3;
  for(const b of bokeh){
    const sx=((b.x*spanX-cam.x*cam.s*.1)%spanX+spanX)%spanX-vw*.15;
    const sy=((b.y*spanY-cam.y*cam.s*.1)%spanY+spanY)%spanY-vh*.15;
    const a=.045+.02*Math.sin(t*.7+b.ph);
    const rg=ctx.createRadialGradient(sx,sy,0,sx,sy,b.r);
    rg.addColorStop(0,rgba(b.c,a));rg.addColorStop(1,rgba(b.c,0));
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(sx,sy,b.r,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}
function drawGrid(){
  ctx.fillStyle='rgba(130,190,200,.06)';
  const gs=72,x0=Math.floor(viewL/gs)*gs,y0=Math.floor(viewT/gs)*gs;
  for(let x=x0;x<viewR;x+=gs)for(let y=y0;y<viewB;y+=gs)ctx.fillRect(x-1.2,y-1.2,2.4,2.4);
  ctx.strokeStyle='rgba(130,190,200,.07)';ctx.lineWidth=1.5;ctx.setLineDash([10,14]);
  for(let i=1;i<NSEC;i++){const y=i*H;if(y<viewT||y>viewB)continue;line(WALL-60,y,W-WALL+60,y);}
  ctx.setLineDash([]);
}
function drawRails(){
  const yT=Math.max(viewT,-320),yB=Math.min(viewB,WORLD_H+90);
  for(const x of[WALL-26,W-WALL+26]){
    ctx.lineCap='butt';
    ctx.strokeStyle='#141f25';ctx.lineWidth=12;line(x,yT,x,yB);
    ctx.strokeStyle='#22343c';ctx.lineWidth=6;line(x,yT,x,yB);
    ctx.fillStyle='#3b5560';
    const ry=Math.floor(yT/90)*90;
    for(let y=ry;y<yB;y+=90){ctx.beginPath();ctx.arc(x,y,3.4,0,TAU);ctx.fill();}
  }
}
function drawGhost(now){
  ctx.textAlign='right';
  ctx.font='170px Impact,"Arial Narrow Bold",sans-serif';
  for(let i=0;i<NSEC;i++){
    const s=sections[i],y=s.y0+H/2;
    if(y<viewT-220||y>viewB+220)continue;
    const age=now-s.rebuiltAt,a=age<1.6?.05+.2*(1-age/1.6):.05;
    ctx.fillStyle='rgba(150,210,215,'+a+')';
    ctx.fillText('0'+(i+1),W-WALL-36,y+58);
  }
}
function drawPortal(t){
  const y=WORLD_H+36;
  if(y<viewT-40||y>viewB+60)return;
  const grd=ctx.createLinearGradient(WALL,0,W-WALL,0);
  grd.addColorStop(0,'rgba(69,214,195,0)');grd.addColorStop(.5,'rgba(69,214,195,.9)');grd.addColorStop(1,'rgba(69,214,195,0)');
  ctx.save();ctx.shadowColor='rgba(69,214,195,.8)';ctx.shadowBlur=22;
  ctx.fillStyle=grd;ctx.fillRect(WALL,y,W-2*WALL,7);ctx.restore();
  ctx.fillStyle='rgba(220,255,248,.5)';
  const off=(t*140)%52;
  for(let x=WALL+off;x<W-WALL;x+=52)ctx.fillRect(x,y-4,14,2.5);
  ctx.font='11px '+MONO;ctx.textAlign='center';
  ctx.fillStyle='rgba(150,210,215,.45)';ctx.fillText('R E C Y C L E R',W/2,y+32);
}
function drawGate(){
  if(-160>viewB)return;
  const x=ports[0];
  const seg2=(ax,ay,bx,by)=>{ctx.lineCap='round';
    ctx.strokeStyle='#231105';ctx.lineWidth=15;line(ax,ay,bx,by);
    ctx.strokeStyle='#8a5a2e';ctx.lineWidth=9;line(ax,ay,bx,by);
    ctx.strokeStyle='rgba(255,208,140,.38)';ctx.lineWidth=2.6;line(ax,ay-2.6,bx,by-2.6);};
  seg2(x-160,-120,x-30,-34);seg2(x+160,-120,x+30,-34);
  ctx.font='11px '+MONO;ctx.textAlign='center';
  ctx.fillStyle='rgba(150,210,215,.45)';ctx.fillText('F E E D',x,-138);
}
function drawSeg(g){
  ctx.lineCap='round';
  if(g.type==='wall'){
    ctx.strokeStyle='#1a2b32';ctx.lineWidth=16;line(g.ax,g.ay,g.bx,g.by);
    ctx.strokeStyle='#2b434d';ctx.lineWidth=8;line(g.ax,g.ay,g.bx,g.by);
  }else{
    ctx.strokeStyle='#231105';ctx.lineWidth=15;line(g.ax,g.ay,g.bx,g.by);
    ctx.strokeStyle='#8a5a2e';ctx.lineWidth=9;line(g.ax,g.ay,g.bx,g.by);
    ctx.strokeStyle='rgba(255,208,140,.38)';ctx.lineWidth=2.6;line(g.ax,g.ay-2.6,g.bx,g.by-2.6);
  }
}
function drawPeg(p){
  ctx.fillStyle='#1a0e05';ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,TAU);ctx.fill();
  const g=ctx.createRadialGradient(p.x-3,p.y-3,1,p.x,p.y,p.r);
  g.addColorStop(0,'#ffe1a1');g.addColorStop(1,'#a3722f');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
}
function drawBumper(b){
  const R=b.r*(1+0.16*b.flash);
  const gl=ctx.createRadialGradient(b.x,b.y,b.r*.4,b.x,b.y,R*2.7);
  gl.addColorStop(0,rgba(b.col,0.2+0.45*b.flash));gl.addColorStop(1,rgba(b.col,0));
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(b.x,b.y,R*2.7,0,TAU);ctx.fill();
  ctx.fillStyle='#101b20';ctx.beginPath();ctx.arc(b.x,b.y,R+4,0,TAU);ctx.fill();
  const g=ctx.createRadialGradient(b.x-R*.35,b.y-R*.4,R*.1,b.x,b.y,R);
  g.addColorStop(0,mix(b.col,'#ffffff',.65));g.addColorStop(.5,b.col);g.addColorStop(1,mix(b.col,'#000c12',.5));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,R,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.arc(b.x,b.y,R*.72,0,TAU);ctx.stroke();
}
function drawSpinner(sp){
  for(let a=0;a<sp.arms;a++){
    const an=sp.ang+a*TAU/sp.arms,ca=Math.cos(an),sa=Math.sin(an);
    const ax=sp.x+ca*14,ay=sp.y+sa*14,bx=sp.x+ca*sp.len,by=sp.y+sa*sp.len;
    ctx.lineCap='round';
    ctx.strokeStyle='#231105';ctx.lineWidth=13;line(ax,ay,bx,by);
    ctx.strokeStyle='#d8a54c';ctx.lineWidth=7;line(ax,ay,bx,by);
    ctx.fillStyle='#f4d489';ctx.beginPath();ctx.arc(bx,by,4.5,0,TAU);ctx.fill();
  }
  const gl=ctx.createRadialGradient(sp.x,sp.y,2,sp.x,sp.y,44);
  gl.addColorStop(0,'rgba(69,214,195,.35)');gl.addColorStop(1,'rgba(69,214,195,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(sp.x,sp.y,44,0,TAU);ctx.fill();
  ctx.fillStyle='#12262c';ctx.beginPath();ctx.arc(sp.x,sp.y,sp.hub,0,TAU);ctx.fill();
  ctx.strokeStyle='#45d6c3';ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(sp.x,sp.y,sp.hub,0,TAU);ctx.stroke();
  ctx.fillStyle='#45d6c3';ctx.beginPath();
  ctx.arc(sp.x+Math.cos(sp.ang)*8,sp.y+Math.sin(sp.ang)*8,3,0,TAU);ctx.fill();
}
function drawSection(s,now){
  for(const g of s.segs){
    const mnx=Math.min(g.ax,g.bx),mxx=Math.max(g.ax,g.bx);
    const mny=Math.min(g.ay,g.by),mxy=Math.max(g.ay,g.by);
    if(mxx<viewL||mnx>viewR||mxy<viewT||mny>viewB)continue;
    drawSeg(g);
  }
  for(const p of s.pegs){if(p.y<viewT-30||p.y>viewB+30)continue;drawPeg(p);}
  for(const b of s.bumpers){if(b.y<viewT-90||b.y>viewB+90)continue;drawBumper(b);}
  for(const sp of s.spinners){if(sp.y<viewT-240||sp.y>viewB+240)continue;drawSpinner(sp);}
  const age=now-s.rebuiltAt;
  if(age>=0&&age<1.4){
    const a=1-age/1.4;
    ctx.strokeStyle='rgba(69,214,195,'+(.2*a)+')';ctx.lineWidth=1.6;
    const yT=Math.max(s.y0,viewT),yB=Math.min(s.y0+H,viewB);
    for(let y=yT;y<yB;y+=36)line(WALL-40,y,W-WALL+40,y);
    ctx.strokeStyle='rgba(69,214,195,'+(.45*a)+')';ctx.lineWidth=2;
    ctx.strokeRect(WALL-40,s.y0+6,W-2*WALL+80,H-12);
  }
}
function drawStreak(m){
  const sp=Math.hypot(m.vx,m.vy);
  if(sp<90)return;
  const tail=Math.min(.05,36/sp);
  const x2=m.x-m.vx*tail,y2=m.y-m.vy*tail;
  const g=ctx.createLinearGradient(m.x,m.y,x2,y2);
  g.addColorStop(0,rgba(m.color,Math.min(.38,sp/2600)));
  g.addColorStop(1,rgba(m.color,0));
  ctx.strokeStyle=g;ctx.lineWidth=m.r*1.7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(x2,y2);ctx.stroke();
}
function drawMarble(m){
  const g=ctx.createRadialGradient(m.x-m.r*.38,m.y-m.r*.42,m.r*.12,m.x,m.y,m.r);
  g.addColorStop(0,mix(m.color,'#ffffff',.75));
  g.addColorStop(.45,m.color);
  g.addColorStop(1,mix(m.color,'#001018',.55));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.fill();
  ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.spin);
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=m.r*.16;
  ctx.beginPath();ctx.arc(0,0,m.r*.55,.3,2.4);ctx.stroke();
  ctx.strokeStyle='rgba(6,20,26,.28)';
  ctx.beginPath();ctx.arc(0,0,m.r*.3,3.3,5.4);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.beginPath();ctx.arc(m.x-m.r*.4,m.y-m.r*.45,m.r*.15,0,TAU);ctx.fill();
}
function drawRings(){
  for(const r of rings){const k=r.t/r.life,e=1-Math.pow(1-k,2.2);
    ctx.strokeStyle=rgba(r.col,(1-k)*.55);ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,6+e*r.max,0,TAU);ctx.stroke();}
}
function drawSparks(){
  ctx.globalCompositeOperation='lighter';
  for(const s of sparks){ctx.fillStyle=rgba(s.col,(1-s.t/s.life)*.9);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
}
function drawDust(t){
  for(const d of dust){
    const sx=((d.x*vw+Math.sin(t*.3+d.ph)*14-cam.x*cam.s*.03)%vw+vw)%vw;
    const sy=d.y*vh;
    const a=.05+.06*(0.5+0.5*Math.sin(t*1.7+d.ph));
    ctx.fillStyle='rgba(190,225,225,'+a+')';
    ctx.beginPath();ctx.arc(sx,sy,d.r,0,TAU);ctx.fill();
  }
}
function render(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBG(now);
  const shx=(Math.random()*2-1)*camShake,shy=(Math.random()*2-1)*camShake;
  ctx.save();
  ctx.translate(vw/2,vh/2);ctx.scale(cam.s,cam.s);ctx.translate(-cam.x+shx,-cam.y+shy);
  viewL=cam.x-vw/2/cam.s-90;viewR=cam.x+vw/2/cam.s+90;
  viewT=cam.y-vh/2/cam.s-90;viewB=cam.y+vh/2/cam.s+90;
  drawGrid();drawRails();drawGhost(now);drawPortal(now);drawGate();
  for(const s of sections){if(s.y0>viewB||s.y0+H<viewT)continue;drawSection(s,now);}
  for(const m of marbles)if(m.y>viewT-40&&m.y<viewB+40)drawStreak(m);
  for(const m of marbles)if(m.y>viewT-40&&m.y<viewB+40)drawMarble(m);
  drawRings();drawSparks();
  ctx.restore();
  drawDust(now);
}

/* ---------------- HUD & rebuild scheduler ---------------- */
const $=id=>document.getElementById(id);
const bars=[];
for(let i=0;i<NSEC;i++){const d=document.createElement('div');d.className='mapbar';$('map').appendChild(d);bars.push(d);}
let activeBar=-1;
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;
  $('toasts').appendChild(d);setTimeout(()=>d.remove(),2700);}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
let nextRebuild=performance.now()/1000+REBUILD_EVERY,rebuildCount=0,hudT=0;
function tryRebuild(now){
  if(now<nextRebuild)return;
  const cands=[];
  for(let i=0;i<NSEC;i++){
    let empty=true;
    for(const m of marbles){if(m.y>sections[i].y0-140&&m.y<sections[i].y0+H+140){empty=false;break;}}
    if(empty)cands.push(i);
  }
  if(!cands.length){nextRebuild=now+2.5;return;}
  const i=cands[(Math.random()*cands.length)|0];
  const ns=buildSection(i,newSeed());ns.rebuiltAt=now;
  sections[i]=ns;
  rebuildCount++;nextRebuild=now+REBUILD_EVERY;
  toast('section '+(i+1)+' rebuilt');
  bars[i].classList.remove('flash');void bars[i].offsetWidth;bars[i].classList.add('flash');
  for(let k=0;k<30;k++)sparks.push({x:rand(WALL,W-WALL),y:ns.y0+rand(0,H),
    vx:rand(-30,30),vy:rand(-60,-10),t:0,life:rand(.6,1.3),
    col:Math.random()<.5?'#45d6c3':'#ffc247',r:rand(1.5,3.5)});
}
function updateHUD(dt,now){
  hudT-=dt;if(hudT>0)return;hudT=0.12;
  let sum=0;for(const m of marbles)sum+=Math.hypot(m.vx,m.vy);
  $('stMarbles').textContent=marbles.length;
  $('stSpeed').textContent=String(Math.round(marbles.length?sum/marbles.length:0)).padStart(4,'0');
  $('stBumps').textContent=bumpCount;
  $('stRebuilds').textContent=rebuildCount;
  const remain=nextRebuild-now;
  $('stNext').textContent=fmt(remain);
  $('nextFill').style.transform='scaleX('+clamp(1-remain/REBUILD_EVERY,0,1)+')';
  $('chipNext').classList.toggle('warn',remain<5);
  const idx=clamp(Math.floor(cam.y/H),0,NSEC-1);
  if(idx!==activeBar){if(activeBar>=0)bars[activeBar].classList.remove('active');
    bars[idx].classList.add('active');activeBar=idx;}
}

/* ---------------- main loop ---------------- */
let last=performance.now()/1000,acc=0;
const FIXED=1/240;
function frame(){
  const now=performance.now()/1000;
  let dt=now-last;last=now;if(dt>0.1)dt=0.1;
  acc+=dt;let steps=0;
  while(acc>=FIXED&&steps<12){physics(FIXED);acc-=FIXED;steps++;}
  updateCamera(dt);updateFX(dt);tryRebuild(now);updateHUD(dt,now);
  render(now);
  requestAnimationFrame(frame);
}
setTimeout(()=>toast('course generated · '+NSEC+' sections'),900);
requestAnimationFrame(frame);
})();
</script>
