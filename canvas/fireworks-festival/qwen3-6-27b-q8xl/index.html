<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks Festival</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, riverY, skylineY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  riverY = H * 0.62;
  skylineY = riverY;
}
resize();
window.addEventListener('resize', resize);

// Stars
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 600,
    r: Math.random() * 1.5 + 0.3,
    twinkle: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.005
  });
}

// City buildings
const buildings = [];
function generateCity() {
  buildings.length = 0;
  let x = -10;
  while (x < W + 20) {
    const w = Math.random() * 60 + 25;
    const h = Math.random() * 120 + 40;
    const windows = [];
    const cols = Math.floor(w / 14);
    const rows = Math.floor(h / 18);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() > 0.35) {
          windows.push({
            rx: c * 14 + 4,
            ry: r * 18 + 6,
            lit: Math.random() > 0.3,
            color: Math.random() > 0.5 ? '255,230,150' : '200,220,255'
          });
        }
      }
    }
    buildings.push({ x, w, h, windows, shade: Math.random() * 0.3 + 0.1 });
    x += w + Math.random() * 8 + 2;
  }
}
generateCity();
window.addEventListener('resize', () => { resize(); generateCity(); });

// Palettes
const palettes = [
  ['#FF1461', '#FF6B6B', '#FFE66D', '#F8A5C2'],
  ['#00F5FF', '#00D4AA', '#7B68EE', '#00FFFF'],
  ['#FFD700', '#FFA500', '#FF6347', '#FFE4B5'],
  ['#FF00FF', '#DA70D6', '#BA55D3', '#EE82EE'],
  ['#00FF7F', '#7FFF00', '#ADFF2F', '#32CD32'],
  ['#FF4500', '#FF6347', '#FF7F50', '#FFA07A'],
  ['#FFFFFF', '#E0E0FF', '#B0C4DE', '#F0F8FF'],
  ['#FF1493', '#FF69B4', '#FFB6C1', '#FFC0CB'],
];

// Particle class
class Particle {
  constructor(x, y, vx, vy, color, life, size, type, trail) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.life = life; this.maxLife = life;
    this.size = size;
    this.type = type || 'normal';
    this.trail = trail || [];
    this.maxTrail = type === 'willow' ? 18 : (type === 'whistle' ? 12 : 6);
    this.gravity = type === 'willow' ? 0.06 : 0.035;
    this.drag = type === 'willow' ? 0.985 : 0.992;
    this.alive = true;
    this.ember = false;
    this.sparkle = Math.random();
  }

  update() {
    this.trail.push({ x: this.x, y: this.y, life: this.life / this.maxLife });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    this.vx *= this.drag;
    this.vy *= this.drag;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    if (this.life < this.maxLife * 0.3) this.ember = true;
    if (this.life <= 0) this.alive = false;
  }

  draw(ctx) {
    const t = this.life / this.maxLife;
    // Trail
    for (let i = 0; i < this.trail.length - 1; i++) {
      const p = this.trail[i];
      const a = (i / this.trail.length) * t * 0.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.size * (i / this.trail.length) * 0.6, 0, Math.PI * 2);
      ctx.fillStyle = this.ember ? `rgba(180,80,20,${a})` : hexToRGBA(this.color, a);
      ctx.fill();
    }
    // Main particle
    const alpha = t;
    const sz = this.size * (0.3 + t * 0.7);
    if (this.ember) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, sz * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,100,30,${alpha * 0.8})`;
      ctx.fill();
    } else {
      // Glow
      ctx.beginPath();
      ctx.arc(this.x, this.y, sz * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = hexToRGBA(this.color, alpha * 0.15);
      ctx.fill();
      // Core
      ctx.beginPath();
      ctx.arc(this.x, this.y, sz, 0, Math.PI * 2);
      ctx.fillStyle = hexToRGBA(this.color, alpha);
      ctx.fill();
      // Sparkle
      if (this.sparkle > 0.7 && t > 0.3) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, sz * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
        ctx.fill();
      }
    }
  }
}

function hexToRGBA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// Firework shell (ascending)
class Shell {
  constructor(x, targetY, burstType, palette) {
    this.x = x;
    this.y = H;
    this.targetY = targetY;
    this.vy = -(Math.random() * 3 + 8);
    this.vx = (Math.random() - 0.5) * 2;
    this.burstType = burstType;
    this.palette = palette;
    this.alive = true;
    this.trail = [];
    this.whistle = true;
    this.time = 0;
  }

  update() {
    this.time++;
    this.trail.push({ x: this.x, y: this.y, t: 1 });
    if (this.trail.length > 20) this.trail.shift();
    for (let p of this.trail) p.t *= 0.92;

    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.02;

    if (this.y <= this.targetY || this.vy >= 0) {
      this.alive = false;
      burst(this.x, this.y, this.burstType, this.palette);
    }
  }

  draw(ctx) {
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const p = this.trail[i];
      const a = p.t * 0.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2 * p.t, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,200,100,${a})`;
      ctx.fill();
    }
    // Whistle sparks
    if (this.whistle && this.time % 2 === 0) {
      particles.push(new Particle(
        this.x + (Math.random() - 0.5) * 4,
        this.y,
        (Math.random() - 0.5) * 1.5,
        Math.random() * 2 + 1,
        '#FFD700',
        20 + Math.random() * 15,
        1.5,
        'whistle',
        []
      ));
    }
    // Shell head
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#FFF8DC';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,240,200,0.3)';
    ctx.fill();
  }
}

// Burst patterns
function burst(x, y, type, palette) {
  const count = { peony: 120, willow: 80, ring: 60, double: 100, chrysanthemum: 150, star: 70 };
  const n = count[type] || 100;

  if (type === 'peony') {
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1.5;
      const c = palette[Math.floor(Math.random() * palette.length)];
      particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, c, 60 + Math.random() * 40, Math.random() * 2 + 1, 'normal'));
    }
  } else if (type === 'willow') {
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      const c = palette[Math.floor(Math.random() * palette.length)];
      particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, c, 90 + Math.random() * 60, Math.random() * 1.5 + 0.8, 'willow'));
    }
  } else if (type === 'ring') {
    const ringCount = 3;
    for (let r = 0; r < ringCount; r++) {
      const speed = 2 + r * 1.8;
      const rc = palette[r % palette.length];
      const segs = 30 + r * 10;
      for (let i = 0; i < segs; i++) {
        const angle = (i / segs) * Math.PI * 2;
        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, rc, 50 + Math.random() * 30, 2, 'normal'));
      }
    }
  } else if (type === 'double') {
    // Inner burst
    for (let i = 0; i < 50; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 2 + 0.5;
      const c = palette[0];
      particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, c, 40 + Math.random() * 20, 2.5, 'normal'));
    }
    // Outer burst with delay simulated by slower particles
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3.5 + 2;
      const c = palette[1] || palette[0];
      particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, c, 70 + Math.random() * 40, 1.8, 'normal'));
    }
  } else if (type === 'chrysanthemum') {
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 5 + 2;
      const c = palette[Math.floor(Math.random() * palette.length)];
      const p = new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, c, 80 + Math.random() * 50, Math.random() * 2 + 1, 'willow');
      p.drag = 0.988;
      p.gravity = 0.04;
      particles.push(p);
    }
  } else if (type === 'star') {
    const points = 5;
    for (let i = 0; i < n; i++) {
      const baseAngle = (Math.floor(i / (n / points)) / points) * Math.PI * 2;
      const spread = (Math.random() - 0.5) * 0.4;
      const angle = baseAngle + spread;
      const speed = Math.random() * 3 + 2;
      const c = palette[Math.floor(Math.random() * palette.length)];
      particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, c, 55 + Math.random() * 35, Math.random() * 2 + 1, 'normal'));
    }
  }

  // Center flash
  flashEffects.push({ x, y, radius: 5, maxRadius: 40, alpha: 0.8, color: palette[0] });
}

let particles = [];
let shells = [];
let flashEffects = [];
let time = 0;
let launchTimer = 0;
let finaleActive = false;
let finaleTimer = 0;
let finaleCooldown = 0;
const FINALE_INTERVAL = 180; // seconds between finales
const FINALE_DURATION = 12; // seconds of finale

const burstTypes = ['peony', 'willow', 'ring', 'double', 'chrysanthemum', 'star'];

function launchShell() {
  const x = Math.random() * W * 0.8 + W * 0.1;
  const targetY = Math.random() * (riverY * 0.5) + riverY * 0.1;
  const type = burstTypes[Math.floor(Math.random() * burstTypes.length)];
  const palette = palettes[Math.floor(Math.random() * palettes.length)];
  shells.push(new Shell(x, targetY, type, palette));
}

// Draw sky gradient
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, riverY);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.4, '#0d1025');
  grad.addColorStop(0.7, '#151530');
  grad.addColorStop(1, '#1a1a3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, riverY);
}

// Draw stars
function drawStars() {
  for (const s of stars) {
    s.twinkle += s.speed;
    const alpha = 0.4 + Math.sin(s.twinkle) * 0.4;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,240,${alpha})`;
    ctx.fill();
  }
}

// Draw moon
function drawMoon() {
  const mx = W * 0.82, my = H * 0.12, mr = 25;
  // Glow
  const glow = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4);
  glow.addColorStop(0, 'rgba(255,250,220,0.15)');
  glow.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(mx, my, mr * 4, 0, Math.PI * 2);
  ctx.fill();
  // Moon body
  ctx.beginPath();
  ctx.arc(mx, my, mr, 0, Math.PI * 2);
  ctx.fillStyle = '#FFF8DC';
  ctx.fill();
  // Crescent shadow
  ctx.beginPath();
  ctx.arc(mx + 8, my - 3, mr * 0.85, 0, Math.PI * 2);
  ctx.fillStyle = '#0d1025';
  ctx.fill();
}

// Draw city skyline
function drawCity() {
  for (const b of buildings) {
    const bx = b.x;
    const by = skylineY - b.h;
    // Building body
    const shade = Math.floor(b.shade * 40 + 10);
    ctx.fillStyle = `rgb(${shade},${shade + 5},${shade + 15})`;
    ctx.fillRect(bx, by, b.w, b.h);
    // Building edge highlight
    ctx.fillStyle = `rgba(100,120,160,0.08)`;
    ctx.fillRect(bx, by, 2, b.h);
    // Roof
    ctx.fillStyle = `rgba(60,70,90,0.5)`;
    ctx.fillRect(bx - 2, by, b.w + 4, 4);
    // Windows
    for (const win of b.windows) {
      if (win.lit) {
        const flicker = Math.sin(time * 0.01 + win.rx + win.ry) > 0.8 ? 0.7 : 1;
        ctx.fillStyle = `rgba(${win.color},${flicker * 0.8})`;
        ctx.fillRect(bx + win.rx, by + win.ry, 8, 10);
        // Window glow
        ctx.fillStyle = `rgba(${win.color},${flicker * 0.1})`;
        ctx.fillRect(bx + win.rx - 2, by + win.ry - 2, 12, 14);
      } else {
        ctx.fillStyle = 'rgba(20,25,40,0.6)';
        ctx.fillRect(bx + win.rx, by + win.ry, 8, 10);
      }
    }
  }
  // Ground line
  ctx.fillStyle = '#0a0a15';
  ctx.fillRect(0, skylineY - 2, W, 4);
}

// Draw river
function drawRiver() {
  const grad = ctx.createLinearGradient(0, riverY, 0, H);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.3, '#0c0c20');
  grad.addColorStop(1, '#050510');
  ctx.fillStyle = grad;
  ctx.fillRect(0, riverY, W, H - riverY);

  // Subtle horizontal lines for water texture
  for (let y = riverY + 5; y < H; y += 8) {
    const waveOffset = Math.sin(time * 0.015 + y * 0.05) * 2;
    ctx.strokeStyle = `rgba(40,50,80,${0.08 + Math.sin(time * 0.02 + y * 0.1) * 0.03})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y + waveOffset);
    for (let x = 0; x < W; x += 20) {
      ctx.lineTo(x, y + waveOffset + Math.sin(time * 0.02 + x * 0.02 + y * 0.03) * 1.5);
    }
    ctx.stroke();
  }
}

// Draw reflections
function drawReflections() {
  ctx.save();
  ctx.globalAlpha = 0.35;

  // Reflect shells
  for (const s of shells) {
    const ry = 2 * riverY - s.y;
    if (ry > riverY) {
      const shimmer = Math.sin(time * 0.05 + s.x * 0.01) * 3;
      ctx.beginPath();
      ctx.arc(s.x + shimmer, ry, 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,240,200,0.5)';
      ctx.fill();
    }
  }

  // Reflect particles
  for (const p of particles) {
    if (!p.alive) continue;
    const ry = 2 * riverY - p.y;
    if (ry > riverY && ry < H) {
      const t = p.life / p.maxLife;
      const shimmer = Math.sin(time * 0.04 + p.x * 0.015 + p.y * 0.01) * (4 + (1 - t) * 6);
      const distFromRiver = ry - riverY;
      const fadeFactor = Math.max(0, 1 - distFromRiver / (H - riverY));
      const alpha = t * fadeFactor * 0.4;

      if (p.ember) {
        ctx.beginPath();
        ctx.arc(p.x + shimmer, ry, p.size * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,80,20,${alpha})`;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x + shimmer, ry, p.size * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = hexToRGBA(p.color, alpha);
        ctx.fill();
      }
    }
  }

  // Reflect flash effects
  for (const f of flashEffects) {
    const ry = 2 * riverY - f.y;
    if (ry > riverY) {
      const shimmer = Math.sin(time * 0.06 + f.x * 0.01) * 5;
      const grad = ctx.createRadialGradient(f.x + shimmer, ry, 0, f.x + shimmer, ry, f.radius);
      grad.addColorStop(0, hexToRGBA(f.color, f.alpha * 0.4));
      grad.addColorStop(1, hexToRGBA(f.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(f.x + shimmer, ry, f.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();

  // River surface shimmer overlay
  for (let i = 0; i < 15; i++) {
    const sx = Math.random() * W;
    const sy = riverY + Math.random() * 20;
    const sw = Math.random() * 40 + 10;
    const shimmer = Math.sin(time * 0.03 + sx * 0.05) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(80,100,140,${shimmer * 0.04})`;
    ctx.fillRect(sx, sy, sw, 1);
  }
}

// Draw city reflection
function drawCityReflection() {
  ctx.save();
  ctx.globalAlpha = 0.12;
  for (const b of buildings) {
    const bx = b.x;
    const bw = b.w;
    const bh = b.h;
    const ry = riverY;
    const reflH = Math.min(bh, H - riverY);
    const shade = Math.floor(b.shade * 30 + 8);
    ctx.fillStyle = `rgb(${shade},${shade + 3},${shade + 10})`;

    // Wavy reflection
    ctx.beginPath();
    ctx.moveTo(bx, ry);
    for (let y = 0; y <= reflH; y += 4) {
      const wave = Math.sin(time * 0.02 + y * 0.1 + bx * 0.01) * (2 + y * 0.05);
      ctx.lineTo(bx + wave, ry + y);
    }
    ctx.lineTo(bx + bw, ry + reflH);
    for (let y = reflH; y >= 0; y -= 4) {
      const wave = Math.sin(time * 0.02 + y * 0.1 + bx * 0.01) * (2 + y * 0.05);
      ctx.lineTo(bx + bw + wave, ry + y);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Flash effects update and draw
function updateFlashes() {
  for (let i = flashEffects.length - 1; i >= 0; i--) {
    const f = flashEffects[i];
    f.radius += 3;
    f.alpha *= 0.88;
    if (f.alpha < 0.01) flashEffects.splice(i, 1);
  }
}

function drawFlashes() {
  for (const f of flashEffects) {
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    grad.addColorStop(0, hexToRGBA(f.color, f.alpha));
    grad.addColorStop(0.5, hexToRGBA(f.color, f.alpha * 0.3));
    grad.addColorStop(1, hexToRGBA(f.color, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Launch scheduling
function scheduleLaunches() {
  if (finaleActive) {
    finaleTimer -= 1 / 60;
    // Rapid launches during finale
    if (Math.random() < 0.35) {
      launchShell();
    }
    // Extra shells
    if (Math.random() < 0.15) {
      launchShell();
    }
    if (finaleTimer <= 0) {
      finaleActive = false;
      finaleCooldown = FINALE_INTERVAL;
    }
  } else {
    finaleCooldown -= 1 / 60;
    if (finaleCooldown <= 0) {
      finaleActive = true;
      finaleTimer = FINALE_DURATION;
    }
    launchTimer -= 1 / 60;
    if (launchTimer <= 0) {
      launchShell();
      // Sometimes launch pairs
      if (Math.random() < 0.3) {
        setTimeout(() => { if (!finaleActive) launchShell(); }, 200);
      }
      launchTimer = Math.random() * 1.5 + 0.5;
    }
  }
}

// Main loop
function animate() {
  time++;

  // Clear
  ctx.clearRect(0, 0, W, H);

  // Draw scene layers
  drawSky();
  drawStars();
  drawMoon();
  drawCity();
  drawRiver();
  drawCityReflection();

  // Update and draw shells
  for (let i = shells.length - 1; i >= 0; i--) {
    shells[i].update();
    shells[i].draw(ctx);
    if (!shells[i].alive) shells.splice(i, 1);
  }

  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (!particles[i].alive) particles.splice(i, 1);
  }

  // Flash effects
  updateFlashes();
  drawFlashes();

  // Reflections
  drawReflections();

  // Ambient light on water from fireworks
  let totalBrightness = 0;
  for (const p of particles) {
    if (p.alive) totalBrightness += p.life / p.maxLife;
  }
  if (totalBrightness > 0) {
    const waterGlow = Math.min(totalBrightness * 0.002, 0.15);
    const grad = ctx.createLinearGradient(0, riverY, 0, riverY + 60);
    grad.addColorStop(0, `rgba(100,120,180,${waterGlow})`);
    grad.addColorStop(1, 'rgba(100,120,180,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, riverY, W, 60);
  }

  // Schedule
  scheduleLaunches();

  requestAnimationFrame(animate);
}

// Start with a few initial fireworks
setTimeout(() => launchShell(), 500);
setTimeout(() => launchShell(), 1200);
setTimeout(() => launchShell(), 1800);

animate();
</script>
</body>
</html>
