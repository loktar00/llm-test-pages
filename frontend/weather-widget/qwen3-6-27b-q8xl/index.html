<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget</title>
    <style>
        :root {
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --color-text: #ffffff;
            --color-text-secondary: rgba(255, 255, 255, 0.7);
            --bg-day-start: #4facfe;
            --bg-day-end: #00f2fe;
            --bg-night-start: #0f2027;
            --bg-night-end: #203a43;
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.2);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg-day-start), var(--bg-day-end));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 1s ease;
            overflow: hidden;
            color: var(--color-text);
        }

        body.night {
            background: linear-gradient(135deg, var(--bg-night-start), var(--bg-night-end));
        }

        /* Main Card */
        .weather-card {
            width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .location-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .location-info p {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }

        /* Toggle Switch */
        .unit-toggle {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 4px;
            display: flex;
            cursor: pointer;
            position: relative;
        }

        .toggle-btn {
            padding: 4px 12px;
            font-size: 0.8rem;
            border-radius: 16px;
            transition: color 0.3s;
            z-index: 2;
            user-select: none;
        }

        .toggle-btn.active {
            color: #fff;
            font-weight: bold;
        }

        .toggle-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: 45%; /* Approximate width of one btn */
            background: #fff;
            border-radius: 16px;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 1;
        }

        /* Main Scene */
        .main-weather {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 140px;
        }

        .temp-display {
            font-size: 5rem;
            font-weight: 200;
            line-height: 1;
            z-index: 10;
            position: relative;
        }

        .condition-text {
            font-size: 1.2rem;
            margin-top: 8px;
            text-transform: capitalize;
            z-index: 10;
        }

        /* CSS Art: Sun & Cloud */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 10px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: sun-pulse 4s infinite alternate;
        }

        .sun::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 215, 0, 0.4);
            animation: spin 10s linear infinite;
        }

        /* Cloud */
        .cloud {
            position: absolute;
            top: 30px;
            left: 20px;
            width: 100px;
            height: 40px;
            background: #fff;
            border-radius: 50px;
            opacity: 0.9;
            animation: float 6s ease-in-out infinite;
        }

        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud::after { width: 40px; height: 40px; top: -20px; left: 15px; }
        .cloud::before { width: 30px; height: 30px; top: -15px; right: 15px; }

        /* Hourly Strip */
        .hourly-section {
            margin-top: 10px;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 10px 4px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
        }
        
        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .hour-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 50px;
            scroll-snap-align: center;
        }

        .hour-time {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            margin-bottom: 6px;
        }

        .hour-temp {
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 6px;
        }

        /* 5 Day List */
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }

        .day-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: background 0.2s;
        }

        .day-row:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .day-name {
            width: 80px;
            font-size: 0.9rem;
        }

        .day-icon {
            width: 30px;
            height: 30px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .day-temps {
            width: 60px;
            text-align: right;
            font-size: 0.9rem;
        }

        .day-temps span:last-child {
            color: var(--color-text-secondary);
            margin-left: 6px;
        }

        /* Mini Icons CSS */
        
        /* Mini Sun */
        .icon-sun {
            width: 16px;
            height: 16px;
            background: #FFD700;
            border-radius: 50%;
            position: relative;
            animation: spin 8s linear infinite;
        }
        .icon-sun::before {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 2px solid #FFD700;
            border-radius: 50%;
            border-style: dashed;
        }

        /* Mini Rain */
        .icon-rain {
            width: 20px;
            height: 12px;
            background: #fff;
            border-radius: 10px;
            position: relative;
            top: -4px;
        }
        .drop {
            position: absolute;
            width: 2px;
            height: 4px;
            background: #4facfe;
            border-radius: 2px;
            left: 50%;
            top: 100%;
            transform: translateX(-50%);
            animation: rain-fall 1s infinite linear;
        }
        .drop:nth-child(1) { left: 40%; animation-delay: 0.2s; }
        .drop:nth-child(2) { left: 60%; animation-delay: 0.5s; }

        /* Mini Cloud */
        .icon-cloud {
            width: 20px;
            height: 8px;
            background: #ddd;
            border-radius: 10px;
            position: relative;
        }
        .icon-cloud::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ddd;
            border-radius: 50%;
            top: -6px;
            left: 4px;
        }

        /* Animations */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes sun-pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
            100% { transform: scale(1.1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
        }

        @keyframes rain-fall {
            0% { transform: translate(-50%, 0); opacity: 1; }
            100% { transform: translate(-50%, 10px); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="weather-card">
        <!-- Header -->
        <div class="header">
            <div class="location-info">
                <h2>San Francisco</h2>
                <p id="current-date">Mon, 12 Sep</p>
            </div>
            <div class="unit-toggle" id="unitToggle">
                <div class="toggle-bg"></div>
                <div class="toggle-btn active" data-unit="C">°C</div>
                <div class="toggle-btn" data-unit="F">°F</div>
            </div>
        </div>

        <!-- Main Scene -->
        <div class="main-weather">
            <div class="scene-container">
                <div class="sun"></div>
                <div class="cloud"></div>
            </div>
            <div class="temp-display">
                <span id="main-temp">21</span>°
            </div>
            <div class="condition-text">Partly Cloudy</div>
        </div>

        <!-- Hourly Strip -->
        <div class="hourly-section">
            <div class="scroll-container" id="hourly-strip">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- 5 Day List -->
        <div class="daily-list" id="daily-list">
            <!-- Injected via JS -->
        </div>
    </div>

    <script>
        // --- Data & State ---
        const weatherData = {
            current: { tempC: 21, condition: 'Partly Cloudy' },
            hourly: [
                { time: 'Now', tempC: 21, type: 'cloud' },
                { time: '14:00', tempC: 22, type: 'sun' },
                { time: '15:00', tempC: 23, type: 'sun' },
                { time: '16:00', tempC: 22, type: 'cloud' },
                { time: '17:00', tempC: 20, type: 'rain' },
                { time: '18:00', tempC: 19, type: 'rain' },
                { time: '19:00', tempC: 18, type: 'cloud' }
            ],
            daily: [
                { day: 'Today', minC: 17, maxC: 21, type: 'cloud' },
                { day: 'Tue', minC: 16, maxC: 22, type: 'sun' },
                { day: 'Wed', minC: 15, maxC: 20, type: 'rain' },
                { day: 'Thu', minC: 14, maxC: 19, type: 'rain' },
                { day: 'Fri', minC: 16, maxC: 23, type: 'sun' }
            ]
        };

        let isCelsius = true;

        // --- Logic ---

        function cToF(c) {
            return Math.round((c * 9 / 5) + 32);
        }

        function getIconHTML(type) {
            if (type === 'sun') {
                return `<div class="icon-sun"></div>`;
            } else if (type === 'rain') {
                return `
                    <div class="icon-rain"></div>
                    <div class="drop"></div>
                    <div class="drop"></div>
                `;
            } else {
                return `<div class="icon-cloud"></div>`;
            }
        }

        function render() {
            // Update Date
            const now = new Date();
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', options);

            // Update Main Temp
            const mainTempEl = document.getElementById('main-temp');
            const targetTemp = isCelsius ? weatherData.current.tempC : cToF(weatherData.current.tempC);
            
            // Simple rolling effect
            animateValue(mainTempEl, parseInt(mainTempEl.textContent), targetTemp, 500);

            // Render Hourly
            const hourlyContainer = document.getElementById('hourly-strip');
            hourlyContainer.innerHTML = weatherData.hourly.map(h => {
                const temp = isCelsius ? h.tempC : cToF(h.tempC);
                return `
                    <div class="hour-item">
                        <span class="hour-time">${h.time}</span>
                        <div class="hour-icon">${getIconHTML(h.type)}</div>
                        <span class="hour-temp">${temp}°</span>
                    </div>
                `;
            }).join('');

            // Render Daily
            const dailyContainer = document.getElementById('daily-list');
            dailyContainer.innerHTML = weatherData.daily.map(d => {
                const min = isCelsius ? d.minC : cToF(d.minC);
                const max = isCelsius ? d.maxC : cToF(d.maxC);
                return `
                    <div class="day-row">
                        <div class="day-name">${d.day}</div>
                        <div class="day-icon">${getIconHTML(d.type)}</div>
                        <div class="day-temps">
                            <span>${max}°</span>
                            <span>${min}°</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- Animations ---

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // --- Event Listeners ---

        const toggleBtns = document.querySelectorAll('.toggle-btn');
        const toggleBg = document.querySelector('.toggle-bg');

        document.getElementById('unitToggle').addEventListener('click', () => {
            isCelsius = !isCelsius;
            
            // Toggle Visuals
            toggleBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.unit === (isCelsius ? 'C' : 'F'));
            });
            
            // Move background pill
            toggleBg.style.transform = isCelsius ? 'translateX(0)' : 'translateX(100%)';

            render();
        });

        // Fake Clock / Day-Night Cycle
        function updateDayNight() {
            const hour = new Date().getHours();
            // Simple logic: Night between 18:00 and 06:00
            if (hour >= 18 || hour < 6) {
                document.body.classList.add('night');
            } else {
                document.body.classList.remove('night');
            }
        }

        // Init
        updateDayNight();
        setInterval(updateDayNight, 60000); // Check every minute
        render();

    </script>
</body>
</html>
