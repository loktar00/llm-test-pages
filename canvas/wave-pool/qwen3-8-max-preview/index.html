<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Wave Tank — Interference &amp; Diffraction</title>
<style>
  :root{
    --ink:#d9ecff;
    --dim:#7fa8c9;
    --acc:#7fd4ff;
    --line:rgba(127,212,255,.30);
    --panel:rgba(5,13,26,.74);
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --disp:"Bahnschrift","Avenir Next Condensed","Futura","Trebuchet MS",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#02060d;color:var(--ink);font-family:var(--mono)}
  #tank{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:
    radial-gradient(125% 95% at 50% 42%, transparent 55%, rgba(1,4,10,.58) 100%),
    linear-gradient(180deg, rgba(2,6,13,.55), transparent 16%),
    linear-gradient(0deg, rgba(2,6,13,.45), transparent 14%);}
  .hud{position:fixed;inset:0;z-index:5;pointer-events:none;user-select:none;transition:opacity .35s ease}
  .hud.hidden{opacity:0}
  .hud.hidden *{pointer-events:none!important}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(0,0,0,.45), 0 12px 34px rgba(0,0,0,.4);
    animation:rise .8s cubic-bezier(.2,.75,.2,1) both}
  .panel::before{content:"";position:absolute;top:-1px;left:-1px;width:11px;height:11px;
    border-top:2px solid var(--acc);border-left:2px solid var(--acc)}
  .panel::after{content:"";position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;
    border-bottom:2px solid var(--acc);border-right:2px solid var(--acc)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .brand{top:22px;left:22px;padding:14px 20px 15px;max-width:min(580px,74vw);animation-delay:.05s}
  .overline{font-size:10px;letter-spacing:.42em;color:var(--acc);display:flex;align-items:center;gap:9px;white-space:nowrap}
  .led{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:pulse 1.6s ease-in-out infinite;flex:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  body.paused .led{background:#ffcf7f;box-shadow:0 0 12px #ffcf7f;animation:none}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,4.6vw,52px);
    letter-spacing:.06em;line-height:.95;margin:7px 0 5px;text-transform:uppercase;
    text-shadow:0 0 26px rgba(90,180,255,.4)}
  h1 em{font-style:normal;font-weight:300;color:var(--acc)}
  .sub{font-size:10px;color:var(--dim);letter-spacing:.16em}

  .data{top:22px;right:22px;min-width:238px;padding:13px 16px;font-size:11px;animation-delay:.2s}
  .row{display:flex;justify-content:space-between;gap:18px;padding:2.5px 0;color:var(--dim);letter-spacing:.08em}
  .row b{color:var(--ink);font-weight:600}
  .data hr{border:0;border-top:1px solid rgba(127,212,255,.18);margin:8px 0 6px}
  .srcrow{display:grid;grid-template-columns:12px 1fr 58px;align-items:center;gap:9px;padding:3.5px 0}
  .dot{width:8px;height:8px;border-radius:50%}
  .bar{height:4px;background:rgba(127,212,255,.12);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(.4);
    background:linear-gradient(90deg,#2b7cc9,var(--acc));transition:transform .12s linear}
  .sval{text-align:right;color:var(--ink);font-size:10px}

  .dock{position:absolute;bottom:22px;left:22px;display:flex;gap:8px;flex-wrap:wrap;animation:rise .8s .35s cubic-bezier(.2,.75,.2,1) both}
  .chip{pointer-events:auto;font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink);background:var(--panel);border:1px solid var(--line);
    padding:10px 13px;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease, border-color .16s ease}
  .chip kbd{color:var(--acc);margin-left:7px;font-family:inherit}
  .chip:hover{border-color:var(--acc);color:#fff;transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,60,120,.5), 0 0 14px rgba(127,212,255,.28)}
  .chip:active{transform:translateY(0)}
  .chip.on{background:var(--acc);color:#03203a;border-color:var(--acc)}
  .chip.on kbd{color:#03203a}

  .hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--dim);letter-spacing:.28em;white-space:nowrap;
    animation:rise .8s .65s cubic-bezier(.2,.75,.2,1) both}

  .legend{bottom:22px;right:22px;padding:11px 15px;font-size:9px;letter-spacing:.3em;color:var(--dim);animation-delay:.5s}
  .lbar{width:190px;height:8px;margin:7px 0 6px;position:relative;overflow:hidden;
    background:linear-gradient(90deg,#03091a 0%,#051c3c 18%,#083a6e 38%,#0e5692 50%,#1a7cba 62%,#40a8e0 74%,#8ed4f6 85%,#d6f0fc 94%,#fafdff 100%);
    box-shadow:0 0 14px rgba(80,170,255,.35)}
  .lbar::after{content:"";position:absolute;top:0;bottom:0;width:34px;left:-40px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:sweep 3.4s ease-in-out infinite}
  @keyframes sweep{0%{left:-40px}60%,100%{left:200px}}
  .lrow{display:flex;justify-content:space-between}
  .lrow .spec{color:var(--acc)}

  @media (max-width:780px){
    .hint,.legend,.sub{display:none}
    .brand{top:12px;left:12px;padding:10px 14px}
    .data{top:12px;right:12px;min-width:0;padding:10px 12px;font-size:10px}
    .dock{left:12px;bottom:12px}
  }
</style>
</head>
<body>
<canvas id="tank"></canvas>
<div id="vignette"></div>

<div class="hud" id="hud">
  <header class="panel brand">
    <div class="overline"><span class="led"></span>SHALLOW-WATER&nbsp;FDTD&nbsp;·&nbsp;DAMPED&nbsp;WAVE&nbsp;EQUATION</div>
    <h1>WAVE<em>TANK</em></h1>
    <div class="sub">INTERFERENCE · DIFFRACTION · REFLECTION — LIVE TYPED-ARRAY GRID</div>
  </header>

  <aside class="panel data">
    <div class="row"><span>FPS</span><b id="fps">—</b></div>
    <div class="row"><span>GRID</span><b id="grid">—</b></div>
    <div class="row"><span>THROUGHPUT</span><b id="rate">—</b></div>
    <div class="row"><span>PHYS / FRAME</span><b id="phys">—</b></div>
    <hr>
    <div class="row"><span>SOURCES</span><b id="scount">—</b></div>
    <div id="srcList"></div>
  </aside>

  <div class="dock">
    <button class="chip" id="chipPause">Pause<kbd>SPC</kbd></button>
    <button class="chip on" id="chipBarriers">Barriers<kbd>B</kbd></button>
    <button class="chip" id="chipRemove">− Source<kbd>−</kbd></button>
    <button class="chip" id="chipAdd">+ Source<kbd>+</kbd></button>
    <button class="chip" id="chipCalm">Calm<kbd>C</kbd></button>
  </div>

  <div class="hint">CLICK / DRAG TO DISTURB THE SURFACE&nbsp;&nbsp;·&nbsp;&nbsp;H HIDES UI</div>

  <div class="panel legend">
    <div>FIELD HEIGHT</div>
    <div class="lbar"></div>
    <div class="lrow"><span>TROUGH</span><span>CREST</span></div>
    <div class="lrow" style="margin-top:4px"><span class="spec">✦ SPECULAR AT CRESTS</span></div>
  </div>
</div>

<script>
(function(){
'use strict';
const TAU = Math.PI*2;
const canvas = document.getElementById('tank');
const ctx = canvas.getContext('2d',{alpha:false});
const off = document.createElement('canvas');
const octx = off.getContext('2d');

/* ---------- palette LUT (blue → white) ---------- */
const LUT = new Uint8Array(512*3);
(function(){
  const stops = [
    [0.00,  3,  9, 26],[0.18,  5, 28, 60],[0.38,  8, 58,110],
    [0.50, 14, 86,146],[0.62, 26,124,186],[0.74, 64,168,224],
    [0.85,142,212,246],[0.94,214,240,252],[1.00,250,253,255]
  ];
  for(let i=0;i<512;i++){
    const t=i/511;
    let a=stops[0], b=stops[stops.length-1];
    for(let s=0;s<stops.length-1;s++){
      if(t>=stops[s][0] && t<=stops[s+1][0]){ a=stops[s]; b=stops[s+1]; break; }
    }
    const f=(b[0]===a[0])?0:(t-a[0])/(b[0]-a[0]);
    LUT[i*3  ]=a[1]+(b[1]-a[1])*f;
    LUT[i*3+1]=a[2]+(b[2]-a[2])*f;
    LUT[i*3+2]=a[3]+(b[3]-a[3])*f;
  }
})();

/* ---------- state ---------- */
let W=0,H=0,cw=0,ch=0,dpr=1;
let prev,cur,nxt,solid,imgData,data8;
let barriersOn=true, paused=false;
let wallX1=0, wallX2=0, slit1C=0, slit2C=0, slitH=4;
const SUB=2, C2=0.25, DAMP=0.0030, LOSS=0.9992, CLAMP=3.5;
const SCOL=['#8fd8ff','#ffd27f','#9dffb0','#ff9db0','#c9a6ff','#7fffdf'];
const sources=[]; const fx=[]; let seed=0;
const fract=x=>x-Math.floor(x);

/* ---------- geometry ---------- */
function buildMask(){
  solid.fill(0);
  for(let x=0;x<W;x++){
    solid[x]=1; solid[W+x]=1;
    solid[(H-1)*W+x]=1; solid[(H-2)*W+x]=1;
  }
  for(let y=0;y<H;y++){
    solid[y*W]=1; solid[y*W+1]=1;
    solid[y*W+W-1]=1; solid[y*W+W-2]=1;
  }
  wallX1=Math.round(W*0.47); wallX2=Math.round(W*0.73);
  slit1C=Math.round(H*0.40); slit2C=Math.round(H*0.64);
  slitH=Math.max(3,Math.round(H*0.045));
  if(barriersOn){
    for(let x=wallX1;x<wallX1+2;x++)
      for(let y=2;y<H-2;y++)
        if(Math.abs(y-slit1C)>slitH) solid[y*W+x]=1;
    for(let x=wallX2;x<wallX2+2;x++)
      for(let y=2;y<H-2;y++)
        if(Math.abs(y-slit2C)>slitH) solid[y*W+x]=1;
  }
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=window.innerWidth; ch=window.innerHeight;
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const aspect=cw/ch, TARGET=150000;
  H=Math.max(96,Math.min(420,Math.round(Math.sqrt(TARGET/aspect))));
  W=Math.max(160,Math.min(760,Math.round(H*aspect)));
  prev=new Float32Array(W*H);
  cur =new Float32Array(W*H);
  nxt =new Float32Array(W*H);
  solid=new Uint8Array(W*H);
  buildMask();
  off.width=W; off.height=H;
  imgData=octx.createImageData(W,H);
  data8=imgData.data;
}

/* ---------- sources ---------- */
function makeSource(i){
  return {
    ax:0.07+0.16*fract((i+1)*0.618), ay:0.5,
    baseF:0.036+0.05*fract(i*0.618+0.13)+0.012*fract(i*0.37+0.7),
    p1:i*2.399+0.7, p2:i*4.117+1.1, p3:i*1.732+2.0,
    sx:0.14+0.10*fract(i*0.31+0.1), sy:0.10+0.09*fract(i*0.77+0.4),
    frate:0.09+0.08*fract(i*0.53+0.2),
    color:SCOL[i%SCOL.length],
    phase:i*4.117+1.1, f:0.05, x:4, y:4, _bar:null, _val:null
  };
}
function layoutSources(){
  const n=sources.length;
  for(let i=0;i<n;i++) sources[i].ay=(i+0.5)/n;
}
function rebuildDom(){
  const list=document.getElementById('srcList');
  list.innerHTML='';
  sources.forEach((s,i)=>{
    const row=document.createElement('div'); row.className='srcrow';
    const dot=document.createElement('span'); dot.className='dot';
    dot.style.background=s.color; dot.style.boxShadow='0 0 8px '+s.color;
    const bar=document.createElement('span'); bar.className='bar';
    const fill=document.createElement('i'); bar.appendChild(fill);
    const val=document.createElement('span'); val.className='sval';
    row.appendChild(dot); row.appendChild(bar); row.appendChild(val);
    list.appendChild(row);
    s._bar=fill; s._val=val;
  });
  document.getElementById('scount').textContent=String(sources.length);
}
function addSource(){ if(sources.length>=6)return; sources.push(makeSource(seed++)); layoutSources(); rebuildDom(); }
function removeSource(){ if(sources.length<=1)return; sources.pop(); layoutSources(); rebuildDom(); }

/* ---------- physics ---------- */
function step(t){
  const w=W,u=prev,c=cur,n=nxt;
  for(let y=1,hh=H-1;y<hh;y++){
    let i=y*w+1;
    for(let x=1,ww=w-1;x<ww;x++,i++){
      if(solid[i]){ n[i]=0; continue; }
      const c0=c[i];
      const lap=c[i-1]+c[i+1]+c[i-w]+c[i+w]-4*c0;
      let v=2*c0-u[i]+C2*lap-DAMP*(c0-u[i]);
      v*=LOSS;
      n[i]=v>CLAMP?CLAMP:(v<-CLAMP?-CLAMP:v);
    }
  }
  const maxX=barriersOn?wallX1-4:w-4;
  for(let k=0;k<sources.length;k++){
    const s=sources[k];
    s.f=s.baseF*(1+0.35*Math.sin(t*s.frate+s.p3));
    const ax=w*(s.ax+0.05*Math.sin(t*s.sx+s.p1));
    const ay=H*(s.ay+0.085*Math.sin(t*s.sy+s.p2));
    s.x=Math.max(3,Math.min(maxX,Math.round(ax)));
    s.y=Math.max(3,Math.min(H-4,Math.round(ay)));
    s.phase+=TAU*s.f;
    const v=Math.sin(s.phase)*0.6, i=s.y*w+s.x;
    n[i]+=v; n[i-1]+=v*0.4; n[i+1]+=v*0.4; n[i-w]+=v*0.4; n[i+w]+=v*0.4;
  }
  const tmp=prev; prev=cur; cur=nxt; nxt=tmp;
}

/* ---------- render ---------- */
function render(){
  const c=cur,d=data8,w=W;
  for(let y=0;y<H;y++){
    let i=y*w, j=i*4;
    for(let x=0;x<w;x++,i++,j+=4){
      if(solid[i]){
        if((x>0&&!solid[i-1])||(x<w-1&&!solid[i+1])||(y>0&&!solid[i-w])||(y<H-1&&!solid[i+w])){
          d[j]=42;d[j+1]=64;d[j+2]=94;
        }else{
          d[j]=8;d[j+1]=13;d[j+2]=24;
        }
        d[j+3]=255; continue;
      }
      const hgt=c[i];
      let li=(256+hgt*213)|0;
      if(li<0)li=0; else if(li>511)li=511;
      li*=3;
      const r=LUT[li],g=LUT[li+1],b=LUT[li+2];
      const lap=c[i-1]+c[i+1]+c[i-w]+c[i+w]-4*hgt;
      const s=-lap-0.18;
      if(s>0){
        let wgt=hgt; if(wgt<0)wgt=0; else if(wgt>1.5)wgt=1.5;
        const a=s*(70+170*wgt);
        d[j]=r+a; d[j+1]=g+a; d[j+2]=b+a; d[j+3]=255;
      }else{
        d[j]=r; d[j+1]=g; d[j+2]=b; d[j+3]=255;
      }
    }
  }
  octx.putImageData(imgData,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,cw,ch);
}

/* ---------- overlays ---------- */
function overlays(t){
  const sx=cw/W, sy=ch/H;
  ctx.save();
  if(barriersOn){
    ctx.strokeStyle='rgba(140,210,255,.15)';
    ctx.setLineDash([2,7]); ctx.lineWidth=1;
    for(const wx of [wallX1+1,wallX2+1]){
      const px=(wx+0.5)*sx;
      ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,ch); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.strokeStyle='rgba(127,212,255,.55)'; ctx.lineWidth=2;
    for(const [wx,sc] of [[wallX1+1,slit1C],[wallX2+1,slit2C]]){
      const px=(wx+0.5)*sx;
      const y1=(sc-slitH)*sy, y2=(sc+slitH)*sy;
      ctx.beginPath();
      ctx.moveTo(px-6,y1); ctx.lineTo(px+6,y1);
      ctx.moveTo(px-6,y2); ctx.lineTo(px+6,y2);
      ctx.stroke();
    }
  }
  ctx.font='10px ui-monospace, Menlo, Consolas, monospace';
  for(let k=0;k<sources.length;k++){
    const s=sources[k];
    const px=(s.x+0.5)*sx, py=(s.y+0.5)*sy;
    const lam=(0.5/s.f)*sx;
    ctx.strokeStyle=s.color;
    ctx.globalAlpha=.26; ctx.setLineDash([3,5]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(px,py,lam,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha=.9; ctx.lineWidth=1.5;
    const rr=5+2.2*Math.sin(t*5+s.p1);
    ctx.beginPath(); ctx.arc(px,py,rr,0,TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px-rr-4,py); ctx.lineTo(px-rr+1,py);
    ctx.moveTo(px+rr-1,py); ctx.lineTo(px+rr+4,py);
    ctx.moveTo(px,py-rr-4); ctx.lineTo(px,py-rr+1);
    ctx.moveTo(px,py+rr-1); ctx.lineTo(px,py+rr+4);
    ctx.stroke();
    ctx.globalAlpha=.85; ctx.fillStyle=s.color;
    ctx.fillText('ƒ '+s.f.toFixed(3), px+rr+7, py-6);
  }
  for(let k=fx.length-1;k>=0;k--){
    const f=fx[k], age=t-f.t0;
    if(age>0.7){ fx.splice(k,1); continue; }
    const a=1-age/0.7;
    ctx.globalAlpha=a*0.8;
    ctx.strokeStyle='rgba(205,240,255,1)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(f.px,f.py,6+age*300,0,TAU); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

/* ---------- interaction ---------- */
let down=false, lastGX=0, lastGY=0;
function stir(gx,gy,R,str){
  const x0=Math.max(2,Math.floor(gx-R)), x1=Math.min(W-3,Math.ceil(gx+R));
  const y0=Math.max(2,Math.floor(gy-R)), y1=Math.min(H-3,Math.ceil(gy+R));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x-gx, dy=y-gy, d2=dx*dx+dy*dy;
    if(d2>R*R) continue;
    const i=y*W+x;
    if(solid[i]) continue;
    cur[i]-=str*(1-d2/(R*R));
  }
}
function toGrid(e){ return [e.clientX/cw*W, e.clientY/ch*H]; }
canvas.addEventListener('pointerdown',e=>{
  down=true; canvas.setPointerCapture(e.pointerId);
  const [gx,gy]=toGrid(e); lastGX=gx; lastGY=gy;
  stir(gx,gy,3.5,1.7);
  fx.push({px:e.clientX,py:e.clientY,t0:tNow});
});
canvas.addEventListener('pointermove',e=>{
  if(!down) return;
  const [gx,gy]=toGrid(e);
  const dist=Math.hypot(gx-lastGX,gy-lastGY);
  const steps=Math.max(1,Math.ceil(dist/1.5));
  for(let s=1;s<=steps;s++){
    stir(lastGX+(gx-lastGX)*s/steps, lastGY+(gy-lastGY)*s/steps, 2.6, 0.55);
  }
  lastGX=gx; lastGY=gy;
});
const release=()=>{ down=false; };
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

/* ---------- controls ---------- */
const hud=document.getElementById('hud');
const chipPause=document.getElementById('chipPause');
const chipBarriers=document.getElementById('chipBarriers');
function togglePause(){
  paused=!paused;
  document.body.classList.toggle('paused',paused);
  chipPause.classList.toggle('on',paused);
}
function toggleBarriers(){
  barriersOn=!barriersOn;
  buildMask();
  chipBarriers.classList.toggle('on',barriersOn);
}
function calm(){ prev.fill(0); cur.fill(0); nxt.fill(0); fx.length=0; }
function bind(chip,fn){ chip.addEventListener('click',function(){ fn(); this.blur(); }); }
bind(chipPause,togglePause);
bind(chipBarriers,toggleBarriers);
bind(document.getElementById('chipAdd'),addSource);
bind(document.getElementById('chipRemove'),removeSource);
bind(document.getElementById('chipCalm'),calm);
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  const k=e.key;
  if(k===' '){ e.preventDefault(); togglePause(); }
  else if(k==='b'||k==='B') toggleBarriers();
  else if(k==='c'||k==='C') calm();
  else if(k==='+'||k==='=') addSource();
  else if(k==='-'||k==='_') removeSource();
  else if(k==='h'||k==='H') hud.classList.toggle('hidden');
});

/* ---------- HUD readouts ---------- */
const elFps=document.getElementById('fps'), elGrid=document.getElementById('grid'),
      elRate=document.getElementById('rate'), elPhys=document.getElementById('phys');
function updateHud(){
  elFps.textContent=String(Math.round(fps));
  elGrid.textContent=W+'×'+H;
  elRate.textContent=(W*H*SUB*fps/1e6).toFixed(1)+' M cells/s';
  elPhys.textContent=physMs.toFixed(2)+' ms';
  for(let k=0;k<sources.length;k++){
    const s=sources[k];
    if(!s._bar) continue;
    s._bar.style.transform='scaleX('+Math.max(0.06,Math.min(1,s.f/0.11)).toFixed(3)+')';
    s._val.textContent='λ'+(0.5/s.f).toFixed(1);
  }
}

/* ---------- main loop ---------- */
let last=performance.now(), tNow=0, fps=60, physMs=0, acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  tNow=now/1000;
  if(dt>0) fps+=(1/dt-fps)*0.08;
  if(!paused){
    const t0=performance.now();
    for(let s=0;s<SUB;s++) step(tNow);
    physMs+=(performance.now()-t0-physMs)*0.1;
  }
  render();
  overlays(tNow);
  acc+=dt;
  if(acc>0.25){ acc=0; updateHud(); }
}

/* ---------- init ---------- */
resize();
for(let i=0;i<4;i++) sources.push(makeSource(seed++));
layoutSources();
rebuildDom();
window.addEventListener('resize',resize);
requestAnimationFrame(frame);
})();
</script>
</body>
