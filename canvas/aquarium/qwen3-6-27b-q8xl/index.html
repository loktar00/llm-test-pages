<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="aquarium"></canvas>
    <script>
        const canvas = document.getElementById('aquarium');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Utility
        const random = (min, max) => Math.random() * (max - min) + min;
        const randomInt = (min, max) => Math.floor(random(min, max));
        const dist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Classes ---

        // Background Gradient
        const waterGradient = () => {
            const g = ctx.createLinearGradient(0, 0, 0, height);
            g.addColorStop(0, '#006994');
            g.addColorStop(1, '#001e2b');
            return g;
        };

        // Caustics (Light Ripples)
        class Caustics {
            constructor() {
                this.points = [];
                for(let i=0; i<30; i++) {
                    this.points.push({
                        x: random(0, width),
                        y: random(0, height),
                        vx: random(-0.5, 0.5),
                        vy: random(-0.5, 0.5),
                        size: random(50, 150)
                    });
                }
            }
            update() {
                this.points.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if(p.x < -100) p.x = width + 100;
                    if(p.x > width + 100) p.x = -100;
                    if(p.y < -100) p.y = height + 100;
                    if(p.y > height + 100) p.y = -100;
                });
            }
            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                this.points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }
        }

        // Plants
        class Plant {
            constructor(x) {
                this.x = x;
                this.segments = randomInt(8, 15);
                this.segLength = random(10, 20);
                this.angle = random(-0.5, 0.5);
                this.hue = random(80, 140);
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, height);
                let curX = 0;
                let curY = 0;
                ctx.strokeStyle = `hsl(${this.hue}, 60%, 30%)`;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                
                for(let i=0; i<this.segments; i++) {
                    const sway = Math.sin(time * 0.002 + i * 0.5) * (i * 0.05);
                    const segAngle = this.angle + sway;
                    curX += Math.sin(segAngle) * this.segLength;
                    curY -= Math.cos(segAngle) * this.segLength;
                    ctx.lineTo(curX, curY);
                }
                ctx.stroke();
                ctx.restore();
            }
        }

        // Bubbles
        class Bubble {
            constructor() {
                this.reset();
                this.y = random(height, height + 100); // Start off screen
            }
            reset() {
                this.x = width / 4 + random(-20, 20); // Near bubbler
                this.y = height + 10;
                this.size = random(2, 6);
                this.speed = random(0.5, 1.5);
                this.wobbleOffset = random(0, Math.PI * 2);
            }
            update() {
                this.y -= this.speed;
                this.x += Math.sin(time * 0.01 + this.wobbleOffset) * 0.5;
                if(this.y < -10) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                ctx.fill();
                ctx.stroke();
            }
        }

        // Hermit Crab
        class Crab {
            constructor() {
                this.x = random(width * 0.2, width * 0.8);
                this.y = height - 20;
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.speed = 0.2;
                this.state = 'walk'; // walk, hide
                this.timer = 0;
            }
            update() {
                this.timer++;
                if(this.state === 'walk') {
                    this.x += this.dir * this.speed;
                    if(this.x < 50 || this.x > width - 50) {
                        this.dir *= -1;
                    }
                    if(Math.random() < 0.005) this.state = 'hide';
                } else {
                    if(this.timer > 200) {
                        this.state = 'walk';
                        this.timer = 0;
                    }
                }
            }
            draw() {
                if(this.state === 'hide') return; // Invisible inside shell (visual trick)
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.dir, 1);

                // Shell
                ctx.beginPath();
                ctx.arc(-5, -5, 12, Math.PI, 0);
                ctx.fillStyle = '#8B4513';
                ctx.fill();
                ctx.strokeStyle = '#5D4037';
                ctx.stroke();

                // Legs
                ctx.strokeStyle = '#D2691E';
                ctx.lineWidth = 2;
                for(let i=0; i<3; i++) {
                    const legY = -2 + i*3;
                    const walkOffset = Math.sin(time * 0.01 + i) * 2;
                    ctx.beginPath();
                    ctx.moveTo(-2, legY);
                    ctx.lineTo(5 + walkOffset, legY + 2);
                    ctx.stroke();
                }

                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(4, -8, 2, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Fish Species
        const SPECIES = {
            NEON: { color: '#00FFFF', size: 15, speed: 2, shape: 'slender' },
            GOLDFISH: { color: '#FFA500', size: 25, speed: 1.5, shape: 'round' },
            ANGLER: { color: '#4B0082', size: 35, speed: 1, shape: 'blob' },
            CLOWN: { color: '#FF4500', size: 20, speed: 1.8, shape: 'oval' }
        };

        class Fish {
            constructor(speciesKey) {
                this.species = SPECIES[speciesKey];
                this.x = random(100, width - 100);
                this.y = random(100, height - 100);
                this.vx = random(-1, 1);
                this.vy = random(-1, 1);
                this.angle = 0;
                this.state = 'wander'; // wander, dart
                this.stateTimer = 0;
                this.scale = random(0.8, 1.2);
            }

            update() {
                // State Machine
                if (this.state === 'wander') {
                    // Gentle steering
                    this.vx += random(-0.05, 0.05);
                    this.vy += random(-0.05, 0.05);
                    
                    // Limit speed
                    const speed = Math.sqrt(this.vx**2 + this.vy**2);
                    if(speed > this.species.speed) {
                        this.vx *= 0.99;
                        this.vy *= 0.99;
                    }

                    // Random chance to dart
                    if(Math.random() < 0.005) {
                        this.state = 'dart';
                        this.stateTimer = 30;
                    }
                } else if (this.state === 'dart') {
                    this.stateTimer--;
                    // Accelerate
                    this.vx *= 1.1;
                    this.vy *= 1.1;
                    if(this.stateTimer <= 0) this.state = 'wander';
                }

                // Wall Avoidance (Soft)
                const margin = 50;
                const turnStrength = 0.1;
                if (this.x < margin) this.vx += turnStrength;
                if (this.x > width - margin) this.vx -= turnStrength;
                if (this.y < margin) this.vy += turnStrength;
                if (this.y > height - margin) this.vy -= turnStrength;

                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Calculate Angle for drawing
                this.angle = Math.atan2(this.vy, this.vx);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Flip if swimming left
                if (this.vx < 0) ctx.scale(-1, 1);
                
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = this.species.color;
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;

                // Tail animation
                const tailWag = Math.sin(time * 0.2 + this.x) * 5;

                if (this.species.shape === 'slender') {
                    // Neon Tetra style
                    ctx.beginPath();
                    ctx.moveTo(15, 0); // Nose
                    ctx.quadraticCurveTo(0, -8, -15, -5 + tailWag); // Top back
                    ctx.lineTo(-10, 0); // Tail notch
                    ctx.lineTo(-15, 5 + tailWag); // Bottom back
                    ctx.quadraticCurveTo(0, 8, 15, 0); // Belly
                    ctx.fill();
                    // Stripe
                    ctx.fillStyle = 'blue';
                    ctx.fillRect(-5, -2, 10, 4);
                } else if (this.species.shape === 'round') {
                    // Goldfish style
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 20, 12, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(-25, -10 + tailWag);
                    ctx.lineTo(-25, 10 + tailWag);
                    ctx.fill();
                    // Eye
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(10, -4, 3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath(); ctx.arc(11, -4, 1, 0, Math.PI*2); ctx.fill();
                } else if (this.species.shape === 'blob') {
                    // Angler/Puffer style
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI*2);
                    ctx.fill();
                    // Spines
                    ctx.beginPath();
                    for(let i=0; i<8; i++) {
                        const a = (i/8) * Math.PI * 2;
                        ctx.moveTo(0,0);
                        ctx.lineTo(Math.cos(a)*25, Math.sin(a)*25);
                    }
                    ctx.stroke();
                    // Eye
                    ctx.fillStyle = 'yellow';
                    ctx.beginPath(); ctx.arc(8, -5, 4, 0, Math.PI*2); ctx.fill();
                } else {
                    // Clownfish style
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 18, 10, 0, 0, Math.PI*2);
                    ctx.fill();
                    // Stripes
                    ctx.fillStyle = 'white';
                    ctx.fillRect(-5, -10, 3, 20);
                    ctx.fillRect(5, -10, 3, 20);
                    // Tail
                    ctx.fillStyle = this.species.color;
                    ctx.beginPath();
                    ctx.moveTo(-15, 0);
                    ctx.lineTo(-22, -8 + tailWag);
                    ctx.lineTo(-22, 8 + tailWag);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // --- Setup Scene ---

        const caustics = new Caustics();
        const crab = new Crab();
        const plants = [];
        for(let i=0; i<10; i++) {
            plants.push(new Plant(random(0, width)));
        }
        const bubbles = [];
        for(let i=0; i<30; i++) {
            bubbles.push(new Bubble());
        }

        const fishSchool = [];
        // Add 12-20 fish
        const keys = Object.keys(SPECIES);
        for(let i=0; i<16; i++) {
            const key = keys[randomInt(0, keys.length)];
            fishSchool.push(new Fish(key));
        }

        // --- Main Loop ---

        function drawGravel() {
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(0, height - 30, width, 30);
            
            ctx.fillStyle = '#5d4037';
            for(let i=0; i<50; i++) {
                // Use pseudo-random based on index to keep gravel static-ish without storing state
                const gx = (i * 137) % width;
                const gy = height - 30 + (i * 31) % 25;
                ctx.beginPath();
                ctx.arc(gx, gy, (i%3)+2, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawBubbler() {
            ctx.fillStyle = '#555';
            ctx.fillRect(width/4 - 10, height - 20, 20, 10);
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(width/4, height - 20, 5, 0, Math.PI*2);
            ctx.fill();
        }

        function loop() {
            time++;
            ctx.clearRect(0, 0, width, height);

            // 1. Background
            ctx.fillStyle = waterGradient();
            ctx.fillRect(0, 0, width, height);

            // 2. Caustics
            caustics.update();
            caustics.draw();

            // 3. Background Plants
            plants.forEach(p => p.draw());

            // 4. Fish (Sort by Y for depth)
            fishSchool.sort((a, b) => a.y - b.y);
            fishSchool.forEach(f => {
                f.update();
                f.draw();
            });

            // 5. Foreground Elements
            drawGravel();
            crab.update();
            crab.draw();
            drawBubbler();

            // 6. Bubbles
            bubbles.forEach(b => {
                b.update();
                b.draw();
            });

            requestAnimationFrame(loop);
        }

        loop();

    </script>
</body>
</html>
