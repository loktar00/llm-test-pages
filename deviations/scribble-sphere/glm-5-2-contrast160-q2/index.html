<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scribble sphere</title>
<style>
html, body {
  margin: 0; padding: 0; overflow: hidden;
  width: 100; height: 100%;
  background: #050505; color: #ccc;
  cursor: default;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const c = document.getElementById('c');
let ctx = c.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

const cfg = {
  segments: 40,
  sphereR: 220,
  sphereRBase: 1.8,
  persp: 800,
  cx: 0, cy: 0
};
cfg.sphereR = Math.min(window.innerWidth, window.innerHeight) * 0.42;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  c.width = Math.floor(W * DPR);
  c.height = Math.floor(H * DPR);
  c.style.width = W + 'px';
  c.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cfg.cx = W * 0.5;
  cfg.cy = H * 0.5;
  cfg.sphereR = Math.min(W, H) * 0.42;
  cfg.persp = cfg.sphereR * 2.3;
}
resize();
window.addEventListener('resize', resize);

const SEGS = 40;
let totalPoints = 0;
let path = [];
let prevPt = null;
let prevPhi = null;
let prevPtXY = null;
let phi = 0.1;
const phiStep = Math.PI * 2 / 40; // 40 points per loop, 40 loops per turn

function pushPhi(phiVal) {
  const cosP = Math.cos(phiVal);
  if (cosP >= -1.05) {
    const sinP = Math.sin(phiVal);
    const r = cfg.sphereR * (1.0 + cosP);
    const x = r * sinP;
    const y = r * cosP;
    const z = Math.sqrt(Math.max(1, r * r - x * x - y * y));
    const zSign = ((phiVal % (Math.PI * 2)) % (Math.PI) > 0) ? -1 : 1;
    const z3 = z * zSign;
    path.push({
      x: x, y: y, z: z3,
      phi: phiVal
    });
    totalPoints++;
  } else {
    const pt = { x: 0, y: -cfg.sphereR, z: 0, phi: phiVal };
    path.push(pt);
    totalPoints++;
  }
}

function initPath() {
  phi = 0.1;
  prevPhi = null;
  prevPt = null;
  prevPtXY = null;
  path.length = 0;
  totalPoints = 0;
  pushPhi(phi);
  phi += phiStep;
}

function tickPath() {
  pushPhi(phi);
  phi += phiStep;
}

function resetPath() {
  phi = (Math.random() * 0.4 + 0.2) * phiStep;
  phi = phiStep * 0.2 + (Math.random() - 0.5) * phiStep * 0.4;
  path.length = 0;
  totalPoints = 0;
  pushPhi(phi);
  phi += phiStep;
}

const rot = { x: Math.PI * 0.25, y: Math.PI * 0.3 };
const rotV = { x: 0, y: 0 };
const rotTgt = { x: Math.PI * 0.25, y: Math.PI * 0.3 };

let frame = 0;
const dPhase = {
  phase: 'BUILD',
  phaseTimer: 0,
  phaseDur: 0,
  phaseInt: 0,
  phaseStartFrame: 0
};
dPhase.phaseDur = Math.floor(60 * 6.2);
dPhase.phaseInt = Math.floor(60 * 0.3);

let drag = false;
let dragX = 0, dragY = 0, dragLX = 0, dragLY = 0;
let dragVX = 0, dragVY = 0;

c.addEventListener('mousedown', (e) => {
  const r = c.getBoundingClientRect();
  dragLX = e.clientX - r.left;
  dragLY = e.clientY - r.top;
  dragX = dragLX; dragY = dragLY;
  drag = true;
  c.style.cursor = ' grabbing';
  rotV.x = 0; rotV.y = 0;
});
c.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const r = c.getBoundingClientRect();
  const t = e.touches[0];
  dragLX = t.clientX - r.left;
  dragLY = t.clientY - r.top;
  dragX = dragLX; dragY = dragLY;
  drag = true;
  rotV.x = 0; rotV.y = 0;
}, { passive: false });
c.addEventListener('touchend', (e) => { drag = false; });
c.addEventListener('mouseup', () => { drag = false; c.style.cursor = 'default'; });
c.addEventListener('touchend', () => { drag = false; });

window.addEventListener('mousemove', (e) => {
  if (drag) {
    const r = c.getBoundingClientRect();
    const nx = e.clientX - r.left;
    const ny = e.clientY - r.top;
    dragVX = nx - dragX;
    dragVY = ny - dragY;
    dragX = nx; dragY = ny;
    rotTgt.y += dragVX * 0.005;
    rotTgt.x += dragVY * 0.005;
    c.style.cursor = ' grabbing';
  }
});
window.addEventListener('touchmove', (e) => {
  if (drag) {
    e.preventDefault();
    const r = c.getBoundingClientRect();
    const t = e.touches[0];
    const nx = t.clientX - r.left;
    const ny = t.clientY - r.top;
    dragVX = nx - dragX;
    dragVY = ny - dragY;
    dragX = nx; dragY = ny;
    rotTgt.y += dragVX * 0.005;
    rotTgt.x += dragVY * 0.005;
  }
}, { passive: false });

window.addEventListener('keyup', (e) => {
  if (e.key === 'r' || e.key === 'R') resetPath();
});

function loop() {
  frame++;

  if (!drag) {
    if (Math.abs(rotV.x) > 0.0001 || Math.abs(rotV.y) > 0.0001) {
      rotTgt.x += rotV.x;
      rotTgt.y += rotV.y;
      rotV.x *= 0.93;
      rotV.y *= 0.93;
    } else {
      rotTgt.y += 0.008;
      rotTgt.x += 0.002;
    }
    rot.x = rotTgt.x;
    rot.y = rotTgt.y;
  } else {
    rot.x = rotTgt.x;
    rot.y = rotTgt.y;
    rotV.x = dragVY * 0.005;
    rotV.y = dragVX * 0.005;
    dragVX *= 0.6;
    dragVY *= 0.6;
  }

  dPhase.phaseTimer++;
  if (dPhase.phase === 'BUILD') {
    tickPath();
    if (dPhase.phaseTimer >= dPhase.phaseDur) {
      const target = 40 * 40;
      const actual = totalPoints;
      const ratio = actual / target;
      if (ratio > 0.9) {
        dPhase.phase = 'UNRAVEL';
        dPhase.phaseTimer = 0;
        dPhase.phaseStartFrame = frame;
      }
    }
  } if (dPhase.phase === 'UNRAVEL') {
    const elapsed = frame - dPhase.phaseStartFrame;
    const dur = dPhase.phaseInt;
    const t = elapsed / dur;
    const c1 = 0.5, c3 = 1.1, c4 = 0.5, c7 = 0.6;
    const x = Math.min(1, t / c1);
    const y = 1;
    const z = 1;
    const u = 2.4;
    const e = (1 - Math.pow(Math.max(1, 2 * x - 1 + u, 1), 2))
      - (1 - Math.pow(Math.max(1, 2 * x - 2 + c3, 1), 2))
      * 1.4;
    const f = ((e - 0.5) * (1 - y / c3) * 0.6 - 0.2)
      + Math.pow(1 - Math.pow(2 - x, 2), 2)
      * Math.pow(1 - Math.pow(2 - x, 2), 2)
      * (1 - Math.pow(2 - x, 2) * z * c4)
      - 0.3;
    const g = 0.5;
    const h = -0.1;
    const unravelFactor = Math.max(0, Math.min(1, Math.pow(0, 2) - h));
    const unrF = Math.max(0, Math.min(1, t);
    const targetLen = Math.floor(path.length * (1 - unrF));
    if (path.length > targetLen) {
      const toRemove = path.length - targetLen;
      path.splice(path.length - toRemove - 1, toRemove);
      totalPoints -= toRemove;
    } if (t >= 1) {
      phi = (Math.random() - 0.5) * 2;
      phi = 0;
      path.length = 0;
      totalPoints = 0;
      pushPhi(phi);
      phi += phiStep;
      dPhase.phase = 'BUILD';
      dPhase.phaseTimer = 0;
      dPhase.phaseDur = Math.floor(60 * (4.5 + Math.random() * 2.5));
    }
  } if (dPhase.phase === 'BUILD2') {
    const targetLen = 40 * 40;
    if (totalPoints < targetLen) tickPath();
    dPhase.phaseTimer++;
    if (dPhase.phaseTimer >= dPhase.phaseDur) {
      dPhase.phase = 'UNRAVEL';
      dPhase.phaseTimer = 0;
      dPhase.phaseStartFrame = frame;
    }
  }

  render();

  if (dPhase.phase === 'BUILD') {
    const target = 40 * 40;
    const ratio = Math.min(1, totalPoints / target);
  ctx.fillStyle = 'rgba(40, 40, 50, 1)';
    ctx.font = '11px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('building  ' + Math.round(ratio * 100) + '%   ' + totalPoints + ' pts', W / 2, H * 0.92);
  }
  if (dPhase.phase === 'UNRAVEL') {
    const elapsed = frame - dPhase.phaseStartFrame;
    const t = Math.min(1, elapsed / dPhase.phaseInt);
    ctx.fillStyle = 'rgba(40, 40, 50, 1)';
    ctx.font = '11px "Courier New", mon-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('unravelling  ' + Math.round(t * 100) + '%', W / 2, H * 0.92);
  }
  ctx.font = '10px "Courier New", mon-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(40, 40, 50, 1)';
  ctx.fillText('drag to rotate   •   press R to restart   •   ' + totalPoints + ' points', 8, H - 8);

  requestAnimationFrame(loop);
}

function render() {
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, W, H);

  const cx = cfg.cx, cy = cfg.cy;
  const R = cfg.sphereR;
  const persp = cfg.persp;

  const sX = Math.sin(rot.x), cX = Math.cos(rot.x);
  const sY = Math.sin(rot.y), cY = Math.cos(rot.y);
  const sX2 = sX * sX, cX2 = cX * cX, sY2 = sY * sY, cY2 = cY * cY;
  const sX2cX2 = sX2 + cX2, sY2cY2 = sY2 + cY2;

  ctx.lineWidth = 1;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let prevP = null;
  let prevX = 0, prevY = 0;

  for (let i = 0; i < path.length; i++) {
    const pt = path[i];
    const x0 = pt.x;
    const y0 = pt.y;
    const z0 = pt.z;

    const tYc = y0 * cY + z0 * sY;
    const tZc = z0 * cY - y0 * sY;
    const tXc = x0;
    const rXc = y0 * sX + tZc * cX;
    const rXc2 = rXc * rXc;

    const tXc2 = tXc * tXc;
    const tYC2 = tYC * tYC;
    const tZc2 = tZc * tZc;
    const tYCtZc2 = tYC * tZc;
    const sX2cX2sY2cY2 = sX2cX2 * sY2cY2;

    const rXc3 = rXc * rXc * sX2cX2;
    const rXc3cX2sY2cY2 = rXc3 * cX2 * sY2cY2;
    const rXc3cX2 = rXc3 * cX2;

    const screenX = cx + (tXc - tYc * 0) * persp * 0;
    const screenY = cy + (rXc - tZc * 0) * persp * 0;
    const screenX2 = cx + (tXc - tYc * sY) * persp;
    const screenY2 = cy + (rXc - tZc * sX) * persp;
    const depth = (tZc * cX - y0 * sX) / persp;
    const screenX3 = cx + (tXc - tYc * sY) * persp;
    const screenY3 = cy + (rXc - tZc * sX) * persp;
    const depth3 = (tZc * cX - y0 * sX) / persp;
    const depth2 = 1 - 0.7 * depth;

    const d = depth3;
    const br = 0.5 + 0.6 * d;
    const br2 = br * br * 0.6;
    const br3 = br2 * br * 1;
    const br4 = br3 * 0.8 + 0.2;
    const br5 = br4 * 0.3 + 0.7;

    const r = (br4 * br3 * 0.6 + 0.2) * 0.6;
    const g = (br3 * 0.5 + 0.4) * 0.7;
    const b = (br2 * 0.6 + 0.2) * 0.5;

    ctx.strokeStyle = 'rgba(' + Math.floor(Math.min(1, br5) * 10) * 24 + ','
      + Math.floor(Math.min(1, g) * 10) * 24 + ','
      + Math.floor(Math.min(1, b) * 10) * 24 + ','
      + Math.min(1, br5 * 1.2) + ')';

    ctx.lineWidth = 0.5 + d * 2;

    if (prevP) {
      ctx.beginPath();
      ctx.moveTo(prevX, prevY);
      ctx.lineTo(screenX3, screenY3);
      ctx.stroke();
    }
    prevP = pt;
    prevX = screenX3;
    prevY = screenY3;
  }
}

initPath();
loop();
</script>
</body>
</html>
