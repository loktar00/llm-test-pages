<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.12);
    --card-glow: rgba(140,100,255,0.15);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.1);
    --input-focus: rgba(160,120,255,0.5);
    --text-primary: rgba(255,255,255,0.92);
    --text-secondary: rgba(255,255,255,0.5);
    --text-placeholder: rgba(255,255,255,0.35);
    --accent: #9b6dff;
    --accent-hover: #b08aff;
    --danger: #ff6b8a;
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ��─ Animated Gradient Background ��─ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: linear-gradient(
      135deg,
      #1a0533 0%,
      #0d1f3c 15%,
      #1a0a2e 25%,
      #0b2e2a 40%,
      #1e0a3c 55%,
      #0d0b2e 70%,
      #2a0a1e 85%,
      #0d1f3c 100%
    );
    background-size: 400% 400%;
    animation: drift 20s ease infinite;
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 30%, rgba(100,40,180,0.25), transparent),
      radial-gradient(ellipse 500px 500px at 75% 60%, rgba(20,80,100,0.2), transparent),
      radial-gradient(ellipse 400px 300px at 60% 20%, rgba(140,30,60,0.15), transparent),
      radial-gradient(ellipse 350px 350px at 30% 80%, rgba(30,60,120,0.18), transparent);
    animation: driftOffsets 25s ease infinite reverse;
  }

  @keyframes drift {
    0%,100% { background-position: 0% 50%; }
    25% { background-position: 50% 0%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 50% 100%; }
  }

  @keyframes driftOffsets {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(30px,-20px) scale(1.05); }
    66% { transform: translate(-20px,15px) scale(0.98); }
  }

  /* ��─ Noise Overlay ��─ */
  .bg::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  /* ��─ Glass Card ��─ */
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 24px;
    padding: 48px 40px 40px;
    border-radius: var(--radius);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.3),
      0 0 80px rgba(100,60,200,0.08),
      inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  /* Fallback when backdrop-filter isn't supported */
  @supports not (backdrop-filter: blur(1px)) {
    .card {
      background: rgba(15,10,30,0.85);
    }
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: calc(var(--radius) + 1px);
    padding: 1px;
    background: linear-gradient(
      160deg,
      rgba(255,255,255,0.15) 0%,
      transparent 40%,
      transparent 60%,
      rgba(140,100,255,0.1) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    box-shadow:
      0 0 0 1px rgba(140,100,255,0.05),
      0 0 60px rgba(120,80,220,0.06);
    pointer-events: none;
  }

  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      filter: blur(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }

  /* ��─ Header ��─ */
  .card-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .card-header .logo {
    width: 48px;
    height: 48px;
    margin: 0 auto 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #6b3fa0);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(155,109,255,0.3);
    position: relative;
  }

  .card-header .logo svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .card-header p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* ��─ Form ��─ */
  .form-group {
    position: relative;
    margin-bottom: 24px;
  }

  .form-group input {
    width: 100%;
    padding: 16px 16px 8px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    -webkit-appearance: none;
  }

  .form-group input:focus {
    border-color: var(--input-focus);
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 0 3px rgba(155,109,255,0.12);
  }

  .form-group input::placeholder {
    color: transparent;
  }

  .form-group label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    color: var(--text-placeholder);
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    transform-origin: left center;
  }

  .form-group input:focus + label,
  .form-group input:not(:placeholder-shown) + label {
    top: 10px;
    transform: translateY(0) scale(0.75);
    color: var(--accent);
    font-weight: 500;
  }

  .form-group input:focus + label {
    color: var(--accent-hover);
  }

  /* ��─ Shake Animation ��─ */
  .form-group.shake input {
    animation: shake 0.5s cubic-bezier(0.36,0.07,0.19,0.97) both;
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(255,107,138,0.12);
  }

  .form-group.shake label {
    color: var(--danger) !important;
  }

  @keyframes shake {
    10%,90% { transform: translateX(-1px); }
    20%,80% { transform: translateX(2px); }
    30%,50%,70% { transform: translateX(-3px); }
    40%,60% { transform: translateX(3px); }
  }

  /* ��─ Error Message ��─ */
  .error-msg {
    display: block;
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
    margin-left: 4px;
    opacity: 0;
    transform: translateY(-4px);
    transition: all 0.25s ease;
    height: 0;
    overflow: hidden;
  }

  .form-group.has-error .error-msg {
    opacity: 1;
    transform: translateY(0);
    height: auto;
  }

  /* ��─ Password Toggle ��─ */
  .password-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--text-secondary);
    transition: color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .password-toggle:hover {
    color: var(--text-primary);
  }

  .password-toggle svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ��─ Submit Button ��─ */
  .btn-submit {
    position: relative;
    width: 100%;
    padding: 15px 24px;
    margin-top: 8px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: white;
    background: linear-gradient(135deg, var(--accent), #7b4fd4);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.3s ease;
    letter-spacing: 0.01em;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(155,109,255,0.35);
    filter: brightness(1.08);
  }

  .btn-submit:active {
    transform: translateY(0) scale(0.985);
    box-shadow: 0 2px 12px rgba(155,109,255,0.25);
  }

  /* Shine sweep */
  .btn-submit::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      120deg,
      transparent 0%,
      transparent 30%,
      rgba(255,255,255,0.2) 50%,
      transparent 70%,
      transparent 100%
    );
    transition: left 0.6s ease;
  }

  .btn-submit:hover::before {
    left: 100%;
  }

  /* ��─ Forgot Password ��─ */
  .forgot-link {
    display: inline-block;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
    position: relative;
  }

  .forgot-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .forgot-link:hover {
    color: var(--accent);
  }

  .forgot-link:hover::after {
    width: 100%;
  }

  /* ��─ Divider ��─ */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 28px 0;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--input-border);
  }

  .divider span {
    font-size: 12px;
    color: var(--text-placeholder);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ��─ Footer ��─ */
  .card-footer {
    text-align: center;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .card-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }

  .card-footer a:hover {
    color: var(--accent-hover);
  }

  /* ��─ Responsive ��─ */
  @media (max-width: 480px) {
    .card {
      padding: 40px 28px 32px;
      margin: 16px;
    }
    .card-header h1 { font-size: 20px; }
  }

  /* ��─ Focus-visible for accessibility ��─ */
  .btn-submit:focus-visible,
  .forgot-link:focus-visible,
  .card-footer a:focus-visible,
  .password-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ��─ Loading state ��─ */
  .btn-submit.loading {
    pointer-events: none;
    opacity: 0.8;
  }

  .btn-submit.loading .btn-text {
    opacity: 0;
  }

  .btn-submit .spinner {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 22px;
    height: 22px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .btn-submit.loading .spinner {
    display: block;
  }

  @keyframes spin {
    to { transform: translate(-50%,-50%) rotate(360deg); }
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">
  <div class="card-header">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
