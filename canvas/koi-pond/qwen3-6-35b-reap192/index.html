<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranquil Koi Pond</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #001a26; /* Deep teal fallback */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="pond"></canvas>
    <script>
        /**
         * TRANQUIL KOI POND
         * Single file implementation.
         * Features: 
         * - Splined fish rendering with body flex
         * - Layered caustics (procedural noise)
         * - Ripple physics with intersection logic
         * - Koi AI with wandering and nibbling
         */

        const canvas = document.getElementById('pond');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;
        let time = 0;

        // Configuration
        const CONFIG = {
            fishCount: 7,
            lilyCount: 6,
            dragonflyChance: 0.002,
            causticLayers: 3,
            maxRipples: 30
        };

        // State
        let ripples = [];
        let lilies = [];
        let fish = [];
        let dragonflies = [];

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initScene();
        }
        window.addEventListener('resize', resize);

        // --- UTILITIES ---

        function rand(min, max) { return Math.random() * (max - min) + min; }
        function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }

        // Simple pseudo-random noise for caustics (deterministic-ish)
        function noise(x, y, t) {
            return Math.sin(x * 0.01 + t) * Math.cos(y * 0.01 + t * 0.7) + 
                   Math.sin(x * 0.02 - t * 0.5) * Math.cos(y * 0.03 + t * 1.2) * 0.5;
        }

        // --- CLASSES ---

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 1;
                this.maxRadius = rand(50, 150);
                this.speed = rand(0.5, 1.5);
                this.opacity = 1;
                this.history = []; // For "crossing" interaction effect
            }

            update() {
                this.radius += this.speed;
                this.opacity = 1 - (this.radius / this.maxRadius);
                
                if (this.opacity <= 0) return false; // Dead
                return true;
            }

            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                // Interact logic: if crossing other ripples (distance check simplified)
                // We draw multiple rings based on width
                ctx.lineWidth = 3;
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.4})`;
                ctx.stroke();
                
                ctx.lineWidth = 1;
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity * 0.8})`;
                ctx.stroke();

                ctx.restore();
            }
        }

        class Koi {
            constructor() {
                this.x = rand(50, width - 50);
                this.y = rand(50, height - 50);
                this.angle = rand(0, Math.PI * 2);
                this.speed = rand(0.5, 1.5);
                this.targetX = this.x;
                this.targetY = this.y;
                this.size = rand(15, 25);
                
                // Color Palette
                const palettes = [
                    { body: '#e85d04', spot: '#ffffff' }, // Orange/White
                    { body: '#ffffff', spot: '#d00000' }, // White/Red
                    { body: '#ffffff', spot: '#000000' }, // White/Black
                    { body: '#e85d04', spot: '#ffffff' }, // Orange/White
                    { body: '#ffffff', spot: '#d00000' }, // Koshimago
                ];
                this.colors = palettes[Math.floor(Math.random() * palettes.length)];

                // Spline segments
                this.history = [];
                this.maxHistory = 10;
                this.tailPhase = rand(0, 10);
            }

            update() {
                // Movement Logic
                const distToTarget = dist(this.x, this.y, this.targetX, this.targetY);
                
                if (distToTarget < 10) {
                    // Pick new target
                    if (Math.random() < 0.05) {
                        // Nibble behavior (slow movement)
                        this.targetX = rand(50, width - 50);
                        this.targetY = rand(50, height - 50);
                        this.speed = rand(0.5, 1.0);
                        // Create ripple occasionally if nibbling
                        if (Math.random() < 0.02) {
                            ripples.push(new Ripple(this.x, this.y));
                        }
                    } else {
                        // Wander behavior
                        this.targetX = this.x + Math.cos(this.angle) * 200;
                        this.targetY = this.y + Math.sin(this.angle) * 200;
                        this.speed = rand(1.0, 2.0);
                    }
                } else {
                    // Steer
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const targetAngle = Math.atan2(dy, dx);
                    
                    // Smooth angle interpolation
                    let diff = targetAngle - this.angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    this.angle += diff * 0.02;
                }

                // Move
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Boundary wrap/bounce
                if (this.x < 0 || this.x > width) {
                    this.angle = Math.PI - this.angle;
                    this.x = Math.max(0, Math.min(width, this.x));
                }
                if (this.y < 0 || this.y > height) {
                    this.angle = -this.angle;
                    this.y = Math.max(0, Math.min(height, this.y));
                }

                // History for spline
                this.history.push({x: this.x, y: this.y});
                if (this.history.length > this.maxHistory) this.history.shift();

                // Ripple when changing direction quickly (turning)
                if (Math.abs(diff) > 0.2 && Math.random() < 0.1) {
                     // ripples.push(new Ripple(this.x, this.y)); // Too noisy
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(5, 5, this.size, this.size/2.5, 0, 0, Math.PI*2);
                ctx.fill();

                // Tail (animated)
                this.tailPhase += 0.2;
                const tailWag = Math.sin(this.tailPhase) * (this.speed * 0.5);
                
                ctx.fillStyle = this.colors.body;
                ctx.beginPath();
                // Draw body and tail in one shape for smoothness
                // Head
                ctx.moveTo(this.size, 0);
                // Top curve
                ctx.quadraticCurveTo(0, -this.size/2, -this.size, 0);
                // Bottom curve
                ctx.quadraticCurveTo(0, this.size/2, this.size, 0);
                ctx.fill();

                // Tail fin
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.8, 0);
                ctx.lineTo(-this.size * 1.5, -this.size * 0.4 + tailWag);
                ctx.lineTo(-this.size * 1.5, this.size * 0.4 + tailWag);
                ctx.fill();

                // Spots (Simplified blotches)
                ctx.fillStyle = this.colors.spot;
                ctx.beginPath();
                ctx.arc(-this.size * 0.2, -this.size * 0.2, this.size * 0.3, 0, Math.PI * 2);
                ctx.arc(this.size * 0.3, this.size * 0.3, this.size * 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.size * 0.7, -this.size * 0.1, 1.5, 0, Math.PI*2);
                ctx.arc(this.size * 0.7, this.size * 0.1, 1.5, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Lily {
            constructor() {
                this.x = rand(50, width - 50);
                this.y = rand(50, height - 50);
                this.size = rand(20, 40);
                this.rotation = rand(0, Math.PI * 2);
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(5, 5, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Leaf
                ctx.fillStyle = '#2d6b38'; // Darker green
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0.2, Math.PI * 2 - 0.2);
                ctx.lineTo(0, 0);
                ctx.fill();

                // Veins
                ctx.strokeStyle = '#1e4d26';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.lineTo(this.size * Math.cos(0), this.size * Math.sin(0));
                ctx.stroke();

                // Flower (Lotus) occasionally
                if (this.size > 30 && Math.random() > 0.5) {
                    ctx.fillStyle = '#ff99cc';
                    ctx.beginPath();
                    for(let i=0; i<5; i++) {
                        ctx.ellipse(0, 0, this.size/2, this.size/4, (i * Math.PI/5), 0, Math.PI*2);
                    }
                    ctx.fill();
                    ctx.fillStyle = '#ffffcc'; // Center
                    ctx.beginPath();
                    ctx.arc(0,0, this.size/4, 0, Math.PI*2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class Dragonfly {
            constructor() {
                this.x = rand(-50, width + 50);
                this.y = rand(-50, height + 50);
                this.vx = rand(-2, 2);
                this.vy = rand(-2, 2);
                this.landTimer = 0;
                this.landing = false;
                this.target = { x: rand(0, width), y: rand(0, height) };
            }

            update() {
                if (this.landing) {
                    this.landTimer--;
                    if (this.landTimer <= 0) {
                        this.landing = false;
                        this.vx = rand(-3, 3);
                        this.vy = rand(-3, 3);
                    }
                } else {
                    // Move towards target
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    this.vx += dx * 0.005;
                    this.vy += dy * 0.005;

                    // Random landing check
                    if (Math.random() < CONFIG.dragonflyChance) {
                        this.landing = true;
                        this.landTimer = rand(100, 300); // Stay for a bit
                    }
                }

                this.x += this.vx;
                this.y += this.vy;
                
                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                const angle = Math.atan2(this.vy, this.vx);
                ctx.rotate(angle);

                // Wings
                const wingFlap = this.landing ? 0 : Math.sin(time * 2) * 0.5;
                
                ctx.fillStyle = 'rgba(200, 230, 255, 0.8)';
                
                // Left Wing
                ctx.save();
                ctx.rotate(wingFlap);
                ctx.beginPath();
                ctx.ellipse(-2, -2, 8, 2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                // Right Wing
                ctx.save();
                ctx.rotate(-wingFlap);
                ctx.beginPath();
                ctx.ellipse(-2, 2, 8, 2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                // Body
                ctx.fillStyle = '#1a4d6e';
                ctx.fillRect(-10, -1, 20, 2);

                // Head
                ctx.beginPath();
                ctx.arc(8, 0, 2, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- INITIALIZATION ---

        function initScene() {
            ripples = [];
            fish = [];
            lilies = [];
            dragonflies = [];

            for (let i = 0; i < CONFIG.fishCount; i++) fish.push(new Koi());
            for (let i = 0; i < CONFIG.lilyCount; i++) lilies.push(new Lily());
            // Start with a couple dragonflies
            dragonflies.push(new Dragonfly());
            dragonflies.push(new Dragonfly());
        }

        // --- MAIN LOOP ---

        function drawWater() {
            // Deep water base
            ctx.fillStyle = '#003344';
            ctx.fillRect(0, 0, width, height);

            // Caustics
            // We draw large blurred shapes or just noise
            // For performance, we'll use a low-res noise overlay or just math lines
            // Here we use a simple procedural shader-like effect via rectangles for performance
            
            ctx.globalCompositeOperation = 'screen';
            
            for (let i = 0; i < 3; i++) {
                const offset = i * 100;
                const scale = 0.005 * (i + 1);
                const speed = time * (0.5 + i * 0.2);
                
                ctx.fillStyle = `rgba(100, 255, 255, 0.05)`;
                
                // Grid of caustic blobs
                for (let x = 0; x < width; x += 100) {
                    for (let y = 0; y < height; y += 100) {
                        const val = noise(x + offset, y, speed);
                        if (val > 0.5) {
                            const size = val * 100;
                            ctx.beginPath();
                            ctx.arc(x, y, size, 0, Math.PI*2);
                            ctx.fill();
                        }
                    }
                }
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function animate() {
            time += 0.01;

            // 1. Draw Background
            drawWater();

            // 2. Update & Draw Ripples (Bottom Layer)
            // Use lighter composition for ripples to make them pop against water
            ctx.globalCompositeOperation = 'lighter';
            for (let i = ripples.length - 1; i >= 0; i--) {
                const alive = ripples[i].update();
                if (!alive) {
                    ripples.splice(i, 1);
                } else {
                    ripples[i].draw(ctx);
                }
            }
            ctx.globalCompositeOperation = 'source-over';

            // 3. Draw Lilies
            lilies.forEach(l => l.draw(ctx));

            // 4. Draw Fish (Draw Fish first so they appear "under" ripples/shallow)
            // Actually, in a pond, light comes from top. Fish cast shadows.
            // But ripples are on surface. So order: Fish -> Shadows -> Ripples is tricky.
            // Let's do: Fish -> Ripples -> Surface Highlights.
            
            fish.sort((a, b) => a.y - b.y); // Simple depth sort
            fish.forEach(f => {
                f.update();
                f.draw(ctx);
            });

            // 5. Draw Ripples again on top? No, ripples are surface.
            // We drew them earlier with 'lighter'.
            // Let's add a dark shadow layer for Lilies over Fish if fish are "under" them?
            // For simplicity in 2D: Lilies cast shadows on water. Fish are in water.
            
            // Lily Shadows
            lilies.forEach(l => {
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(l.x + 10, l.y + 10, l.size, l.size/1.5, l.rotation, 0, Math.PI*2);
                ctx.fill();
            });

            // 6. Dragonflies
            // Randomly add/remove
            if (dragonflies.length < 3 && Math.random() < CONFIG.dragonflyChance) {
                dragonflies.push(new Dragonfly());
            }
            
            // Sort dragonflies by Y for depth
            dragonflies.sort((a, b) => a.y - b.y);
            dragonflies.forEach(d => {
                d.update();
                d.draw(ctx);
            });

            // 7. Surface Sparkle / Highlights
            // A subtle overlay to make it look wet
            ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.fillRect(0,0,width,height);
            
            // Vignette
            const grad = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,20,30,0.6)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,width,height);

            requestAnimationFrame(animate);
        }

        // --- INTERACTION ---
        
        canvas.addEventListener('mousedown', (e) => {
            ripples.push(new Ripple(e.clientX, e.clientY));
            // Startle nearby fish
            fish.forEach(f => {
                const d = dist(f.x, f.y, e.clientX, e.clientY);
                if (d < 150) {
                    f.angle += Math.PI; // Swim away
                }
            });
        });

        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                ripples.push(new Ripple(e.clientX, e.clientY));
            }
        });

        // Start
        resize();
        animate();

    </script>
</body>
</html>
