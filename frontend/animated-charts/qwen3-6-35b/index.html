<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Showcase</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #0f1117;
    --surface: #181a24;
    --surface-2: #1e2130;
    --border: #2a2d3e;
    --text: #e4e6f0;
    --text-dim: #7a7f96;
    --accent-1: #6c5ce7;
    --accent-2: #00cec9;
    --accent-3: #fd79a8;
    --accent-4: #fdcb6e;
    --accent-5: #55efc4;
    --accent-6: #74b9ff;
    --tooltip-bg: #252838;
    --tooltip-border: #3d4159;
    --grid-color: rgba(255,255,255,0.04);
    --axis-color: rgba(255,255,255,0.08);
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  html { scroll-behavior: smooth }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }

  .hero {
    text-align: center;
    padding: 100px 24px 60px;
    position: relative;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .hero p {
    color: var(--text-dim);
    font-size: 1.1rem;
    max-width: 500px;
    margin: 0 auto;
  }

  .chart-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    position: relative;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .chart-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .chart-card h2 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .chart-card .subtitle {
    color: var(--text-dim);
    font-size: 0.875rem;
    margin-bottom: 32px;
  }

  .chart-container {
    position: relative;
    width: 100%;
  }

  /* Bar Chart */
  .bar-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    height: 300px;
    padding: 0 8px;
    position: relative;
    gap: 12px;
  }

  .bar-chart .gridlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    z-index: 0;
  }

  .bar-chart .gridline {
    width: 100%;
    height: 1px;
    background: var(--grid-color);
  }

  .bar-chart .grid-label {
    position: absolute;
    left: -4px;
    transform: translateX(-100%);
    font-size: 0.7rem;
    color: var(--text-dim);
    line-height: 1;
  }

  .bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 1;
    height: 100%;
    justify-content: flex-end;
    position: relative;
    cursor: pointer;
  }

  .bar {
    width: 100%;
    max-width: 60px;
    border-radius: 8px 8px 4px 4px;
    position: relative;
    transform-origin: bottom;
    transform: scaleY(0);
    transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-height: 4px;
  }

  .bar.animated {
    transform: scaleY(1);
  }

  .bar-wrapper:hover .bar {
    filter: brightness(1.2);
  }

  .bar-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    white-space: nowrap;
  }

  .bar-value {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.3s;
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
  }

  .bar-wrapper:hover .bar-value {
    opacity: 1;
  }

  .bar-wrapper:hover .bar-value {
    opacity: 1;
  }

  /* Line Chart */
  .line-chart-container {
    position: relative;
    width: 100%;
    height: 300px;
  }

  .line-chart-container svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .line-grid line {
    stroke: var(--grid-color);
  }

  .line-axis text {
    fill: var(--text-dim);
    font-size: 11px;
    font-family: var(--font);
  }

  .line-axis path, .line-grid line {
    stroke: var(--axis-color);
  }

  .line-path {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .line-area {
    opacity: 0;
    transition: opacity 1s ease 0.5s;
  }

  .line-area.animated {
    opacity: 1;
  }

  .line-dot {
    transition: r 0.2s ease;
    filter: drop-shadow(0 0 6px rgba(108,92,231,0.5));
  }

  .line-dot:hover {
    r: 7;
  }

  .line-dot-trail {
    opacity: 0.3;
  }

  /* Donut Chart */
  .donut-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
  }

  .donut-container {
    position: relative;
    width: 260px;
    height: 260px;
    flex-shrink: 0;
  }

  .donut-container svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .donut-segment {
    fill: none;
    stroke-width: 32;
    stroke-linecap: butt;
    transition: stroke-width 0.2s ease;
    cursor: pointer;
  }

  .donut-segment:hover {
    stroke-width: 36;
  }

  .donut-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }

  .donut-center .total {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .donut-center .label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .donut-legend {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .legend-item:hover {
    background: var(--surface-2);
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .legend-text {
    font-size: 0.875rem;
    color: var(--text-dim);
  }

  .legend-value {
    font-weight: 600;
    color: var(--text);
    margin-left: auto;
    padding-left: 16px;
    font-size: 0.875rem;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    background: var(--tooltip-bg);
    border: 1px solid var(--tooltip-border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
    backdrop-filter: blur(12px);
    max-width: 220px;
  }

  .tooltip.active {
    opacity: 1;
    transform: translateY(0);
  }

  .tooltip .tt-label {
    color: var(--text-dim);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  .tooltip .tt-value {
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }

  .tooltip .tt-color {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* Scroll indicator */
  .scroll-hint {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 0.8rem;
    animation: bounce 2s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }

  @media (max-width: 640px) {
    .chart-card { padding: 24px 16px; }
    .bar-chart { height: 220px; }
    .line-chart-container { height: 220px; }
    .donut-wrapper { flex-direction: column; gap: 32px; }
    .donut-container { width: 200px; height: 200px; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>Chart Showcase</h1>
  <p>Animated visualizations that come alive as you scroll</p>
</div>

<div class="scroll-hint">↓ Scroll to explore ↓</div>

<!-- Bar Chart -->
<section class="chart-section">
  <div class="chart-card" id="barSection">
    <h2>Revenue by Quarter</h2>
    <p class="subtitle">Annual performance overview in millions</p>
    <div class="chart-container">
      <div class="bar-chart" id="barChart">
        <div class="gridlines" id="barGridlines"></div>
      </div>
    </div>
  </div>
</section>

<!-- Line Chart -->
<section class="chart-section">
  <div class="chart-card" id="lineSection">
    <h2>User Growth Trajectory</h2>
    <p class="subtitle">Monthly active users over 12 months</p>
    <div class="chart-container">
      <div class="line-chart-container" id="lineChartContainer">
        <svg id="lineSvg"></svg>
      </div>
    </div>
  </div>
</section>

<!-- Donut Chart -->
<section class="chart-section">
  <div class="chart-card" id="donutSection">
    <h2>Traffic Sources</h2>
    <p class="subtitle">Distribution of website visitors by channel</p>
    <div class="chart-container">
      <div class="donut-wrapper">
        <div class="donut-container" id="donutContainer">
          <svg id="donutSvg" viewBox="0 0 260 260"></svg>
          <div class="donut-center">
            <div class="total" id="donutTotal">0</div>
            <div class="label">Total Visits</div>
          </div>
        </div>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>
  </div>
</section>

<div class="tooltip" id="tooltip"></div>

<script>
(function() {
  // ── Data ──
  const barData = [
    { label: 'Q1', value: 42, color: 'var(--accent-1)' },
    { label: 'Q2', value: 68, color: 'var(--accent-2)' },
    { label: 'Q3', value: 55, color: 'var(--accent-3)' },
    { label: 'Q4', value: 89, color: 'var(--accent-4)' },
    { label: 'Q5', value: 73, color: 'var(--accent-5)' },
    { label: 'Q6', value: 96, color: 'var(--accent-6)' },
  ];

  const lineData = [12, 19, 15, 28, 35, 32, 45, 52, 48, 63, 71, 85];
  const lineLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const donutData = [
    { label: 'Organic', value: 4200, color: '#6c5ce7' },
    { label: 'Direct', value: 2800, color: '#00cec9' },
    { label: 'Referral', value: 1900, color: '#fd79a8' },
    { label: 'Social', value: 3100, color: '#fdcb6e' },
    { label: 'Email', value: 1400, color: '#55efc4' },
  ];

  // ── Tooltip ──
  const tooltip = document.getElementById('tooltip');
  let tooltipTimeout;

  function showTooltip(e, label, value, color) {
    clearTimeout(tooltipTimeout);
    tooltip.innerHTML = `
      <div class="tt-label">${label}</div>
      <div class="tt-value"><span class="tt-color" style="background:${color}"></span>${value}</div>
    `;
    tooltip.classList.add('active');
    moveTooltip(e);
  }

  function moveTooltip(e) {
    const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    const y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
    const rect = tooltip.getBoundingClientRect();
    let left = x + 16;
    let top = y - 12;
    if (left + rect.width > window.innerWidth - 16) left = x - rect.width - 16;
    if (top + rect.height > window.innerHeight - 16) top = y - rect.height - 12;
    if (top < 8) top = 8;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function hideTooltip() {
    tooltipTimeout = setTimeout(() => {
      tooltip.classList.remove('active');
    }, 100);
  }

  // ── Intersection Observer ──
  const observerOptions = { threshold: 0.2, rootMargin: '0px 0px -50px 0px' };
  const animState = { bar: false, line: false, donut: false };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        const id = entry.target.id;
        if (id === 'barSection' && !animState.bar) { animState.bar = true; animateBarChart(); }
        if (id === 'lineSection' && !animState.line) { animState.line = true; animateLineChart(); }
        if (id === 'donutSection' && !animState.donut) { animState.donut = true; animateDonutChart(); }
      }
    });
  }, observerOptions);

  document.querySelectorAll('.chart-card').forEach(c => observer.observe(c));

  // ── Bar Chart ──
  function buildBarChart() {
    const chart = document.getElementById('barChart');
    const gridlines = document.getElementById('barGridlines');
    const maxVal = Math.max(...barData.map(d => d.value));
    const gridMax = Math.ceil(maxVal / 20) * 20;
    const steps = 5;

    for (let i = 0; i <= steps; i++) {
      const line = document.createElement('div');
      line.className = 'gridline';
      const val = Math.round((gridMax / steps) * i);
      const label = document.createElement('span');
      label.className = 'grid-label';
      label.style.top = 'auto';
      label.style.bottom = ((i / steps) * 100) + '%';
      label.style.transform = 'translate(-100%, 50%)';
      label.textContent = val + 'M';
      gridlines.appendChild(line);
      gridlines.appendChild(label);
    }

    barData.forEach((d, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'bar-wrapper';

      const valLabel = document.createElement('div');
      valLabel.className = 'bar-value';
      valLabel.textContent = d.value + 'M';

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.background = `linear-gradient(180deg, ${d.color}dd, ${d.color}88)`;
      bar.style.height = '0%';
      bar.dataset.targetHeight = (d.value / gridMax) * 100;

      const label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = d.label;

      wrapper.appendChild(valLabel);
      wrapper.appendChild(bar);
      wrapper.appendChild(label);
      chart.appendChild(wrapper);

      // Tooltip events
      wrapper.addEventListener('mousemove', (e) => showTooltip(e, d.label, d.value + 'M revenue', d.color));
      wrapper.addEventListener('mouseleave', hideTooltip);
    });
  }

  function animateBarChart() {
    buildBarChart();
    const bars = document.querySelectorAll('.bar');
    bars.forEach((bar, i) => {
      setTimeout(() => {
        bar.style.transform = 'scaleY(1)';
        bar.style.height = bar.dataset.targetHeight + '%';
      }, i * 100);
    });
  }

  // ── Line Chart ──
  function animateLineChart() {
    const container = document.getElementById('lineChartContainer');
    const svg = document.getElementById('lineSvg');
    const w = container.clientWidth;
    const h = container.clientHeight;
    const pad = { top: 30, right: 20, bottom: 40, left: 45 };
    const cw = w - pad.left - pad.right;
    const ch = h - pad.top - pad.bottom;

    const maxVal = Math.ceil(Math.max(...lineData) / 10) * 10;
    const minVal = 0;

    const points = lineData.map((v, i) => ({
      x: pad.left + (i / (lineData.length - 1)) * cw,
      y: pad.top + ch - ((v - minVal) / (maxVal - minVal)) * ch
    }));

    // Build path
    let pathD = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
      const prev = points[i - 1];
      const curr = points[i];
      const cpx1 = prev.x + (curr.x - prev.x) * 0.4;
      const cpx2 = curr.x - (curr.x - prev.x) * 0.4;
      pathD += ` C ${cpx1} ${prev.y}, ${cpx2} ${curr.y}, ${curr.x} ${curr.y}`;
    }

    // Area path
    const areaD = pathD + ` L ${points[points.length-1].x} ${pad.top + ch} L ${points[0].x} ${pad.top + ch} Z`;

    // Grid lines
    let gridHTML = '';
    const gridSteps = 5;
    for (let i = 0; i <= gridSteps; i++) {
      const y = pad.top + (ch / gridSteps) * i;
      const val = Math.round(maxVal - ((maxVal - minVal) / gridSteps) * i);
      gridHTML += `<line x1="${pad.left}" y1="${y}" x2="${w - pad.right}" y2="${y}" class="grid-line" style="stroke: var(--grid-color)"/>`;
      gridHTML += `<text x="${pad.left - 8}" y="${y + 4}" text-anchor="end" fill="var(--text-dim)" font-size="11" font-family="var(--font)">${val}</text>`;
    }

    // X labels
    let xLabels = '';
    lineLabels.forEach((lbl, i) => {
      const x = points[i].x;
      xLabels += `<text x="${x}" y="${h - pad.bottom + 24}" text-anchor="middle" fill="var(--text-dim)" font-size="11" font-family="var(--font)">${lbl}</text>`;
    });

    // Axis lines
    const axisPath = `M ${pad.left} ${pad.top} L ${pad.left} ${pad.top + ch} L ${w - pad.right} ${pad.top + ch}`;

    // Dot
    const dot = `<circle class="line-dot" cx="${points[0].x}" cy="${points[0].y}" r="5" fill="#6c5ce7" stroke="#0f1117" stroke-width="2" opacity="0"/>`;

    svg.innerHTML = `
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#6c5ce7"/>
          <stop offset="50%" stop-color="#00cec9"/>
          <stop offset="100%" stop-color="#fd79a8"/>
        </linearGradient>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridHTML}
      ${xLabels}
      <path d="${axisPath}" fill="none" stroke="var(--axis-color)" stroke-width="1"/>
      <path d="${areaD}" fill="url(#areaGrad)" class="line-area" id="lineArea"/>
      <path d="${pathD}" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        id="linePath" stroke-dasharray="2000" stroke-dashoffset="2000"/>
      ${dot}
    `;

    const pathEl = document.getElementById('linePath');
    const areaEl = document.getElementById('lineArea');
    const dotEl = svg.querySelector('.line-dot');
    const totalLen = pathEl.getTotalLength();
    pathEl.style.strokeDasharray = totalLen;
    pathEl.style.strokeDashoffset = totalLen;

    const duration = 2000;
    const startTime = performance.now();

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function animateLine(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(progress);

      pathEl.style.strokeDashoffset = totalLen * (1 - eased);

      if (progress < 1) {
        requestAnimationFrame(animateLine);
      } else {
        areaEl.classList.add('animated');
        // Show dots at all data points
        points.forEach((p, i) => {
          setTimeout(() => {
            const d = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            d.setAttribute('cx', p.x);
            d.setAttribute('cy', p.y);
            d.setAttribute('r', '4');
            d.setAttribute('fill', '#6c5ce7');
            d.setAttribute('stroke', '#0f1117');
            d.setAttribute('stroke-width', '2');
            d.style.opacity = '0';
            d.style.transition = 'opacity 0.3s, r 0.2s';
            d.style.cursor = 'pointer';
            d.addEventListener('mouseenter', (e) => {
              d.setAttribute('r', '7');
              showTooltip(e, lineLabels[i], lineData[i] + 'K users', '#6c5ce7');
            });
            d.addEventListener('mousemove', moveTooltip);
            d.addEventListener('mouseleave', () => {
              d.setAttribute('r', '4');
              hideTooltip();
            });
            svg.appendChild(d);
            setTimeout(() => d.style.opacity = '1', 10);
          }, i * 80);
        });
      }

      // Move dot along path
      const currentLen = totalLen * eased;
      const point = pathEl.getPointAtLength(currentLen);
      dotEl.setAttribute('cx', point.x);
      dotEl.setAttribute('cy', point.y);
      dotEl.style.opacity = '1';
      dotEl.style.transition = 'r 0.2s';
    }

    // Tooltip for the moving dot
    dotEl.addEventListener('mouseenter', (e) => {
      const idx = Math.round(eased * (lineData.length - 1));
      showTooltip(e, lineLabels[Math.min(idx, lineData.length - 1)], lineData[Math.min(idx, lineData.length - 1)] + 'K users', '#6c5ce7');
    });
    dotEl.addEventListener('mousemove', moveTooltip);
    dotEl.addEventListener('mouseleave', hideTooltip);

    requestAnimationFrame(animateLine);
  }

  // ── Donut Chart ──
  function animateDonutChart() {
    const svg = document.getElementById('donutSvg');
    const legend = document.getElementById('donutLegend');
    const totalEl = document.getElementById('donutTotal');
    const cx = 130, cy = 130, r = 90;
    const circumference = 2 * Math.PI * r;
    const total = donutData.reduce((s, d) => s + d.value, 0);
    const gap = 4;

    let accumulated = 0;

    donutData.forEach((d, i) => {
      const segLen = (d.value / total) * circumference;
      const gapLen = gap;
      const dashLen = Math.max(segLen - gapLen, 0);
      const offset = accumulated;

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', r);
      circle.setAttribute('stroke', d.color);
      circle.setAttribute('stroke-dasharray', `0 ${circumference}`);
      circle.setAttribute('stroke-dashoffset', -offset);
      circle.classList.add('donut-segment');
      circle.style.transformOrigin = 'center';
      circle.style.transform = 'rotate(-90deg)';
      svg.appendChild(circle);

      // Tooltip
      circle.addEventListener('mouseenter', (e) => {
        showTooltip(e, d.label, d.value.toLocaleString() + ' visits', d.color);
      });
      circle.addEventListener('mousemove', moveTooltip);
      circle.addEventListener('mouseleave', hideTooltip);

      // Legend
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `
        <span class="legend-dot" style="background:${d.color}"></span>
        <span class="legend-text">${d.label}</span>
        <span class="legend-value">${d.value.toLocaleString()}</span>
      `;
      item.addEventListener('mouseenter', () => {
        circle.style.strokeWidth = '36';
      });
      item.addEventListener('mouseleave', () => {
        circle.style.strokeWidth = '32';
      });
      legend.appendChild(item);

      accumulated += segLen;
    });

    // Animate segments sweeping in
    const circles = svg.querySelectorAll('.donut-segment');
    circles.forEach((circle, i) => {
      const d = donutData[i];
      const segLen = (d.value / total) * circumference;
      const gapLen = gap;
      const dashLen = Math.max(segLen - gapLen, 0);
      const offset = accumulated - segLen;

      circle.setAttribute('stroke-dasharray', `${circumference}`);
      circle.style.strokeDashoffset = -offset;

      setTimeout(() => {
        circle.style.transition = 'stroke-dasharray 1s cubic-bezier(0.4, 0, 0.2, 1)';
        circle.setAttribute('stroke-dasharray', `${dashLen} ${circumference - dashLen}`);
      }, i * 150);
    });

    // Count up total
    const duration = 1500;
    const startTime = performance.now();
    function countUp(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      totalEl.textContent = Math.round(total * eased).toLocaleString();
      if (progress < 1) requestAnimationFrame(countUp);
    }
    setTimeout(() => requestAnimationFrame(countUp), 200);
  }

  // ── Init ──
  buildBarChart();
})();
</script>
</body>
</html>
