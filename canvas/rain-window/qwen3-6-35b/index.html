<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain on Glass Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;
        
        // Configuration
        const DENSITY = 0.15; // 0 to 1, ratio of drops per pixel area
        const STREAK_THRESHOLD = 6; // Radius at which a drop starts sliding
        const LIGHTNING_CHANCE = 0.002;
        
        // State
        let drops = [];
        let bokehParticles = [];
        let lightningAlpha = 0;

        // Resize Handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initWorld();
        }
        window.addEventListener('resize', resize);

        // --- Classes & Helpers ---

        class Bokeh {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 60 + 10;
                this.color = this.getCityColor();
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.5 + 0.1;
                // Offset for blur simulation
                this.blurRadius = Math.random() * 15 + 5;
            }

            getCityColor() {
                const colors = [
                    '255, 166, 0',   // Streetlights
                    '0, 255, 255',   // Neon
                    '255, 50, 50',   // Red neon
                    '100, 100, 255', // Blue neon
                    '255, 255, 255'  // White
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < -this.radius) this.x = width + this.radius;
                if (this.x > width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = height + this.radius;
                if (this.y > height + this.radius) this.y = -this.radius;
            }

            drawBackground(ctx, isBlurred) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                
                if (isBlurred) {
                    ctx.filter = `blur(${this.blurRadius}px)`;
                } else {
                    ctx.filter = 'none';
                }
                
                ctx.fill();
                ctx.filter = 'none'; // Reset
            }
        }

        class Drop {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 1.5 + 0.5; // Condensation size
                this.speed = 0;
                this.streaking = false;
                this.opacity = 1;
            }

            draw() {
                // Glass Refraction Effect
                // Draw the drop outline
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; // Slight highlight
                ctx.fill();
                
                // Inner shadow for volume
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fill();

                // Streak Logic
                if (this.streaking) {
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y + (this.radius * 6));
                    ctx.strokeStyle = `rgba(200, 220, 255, ${0.4 * (this.radius / 5)})`;
                    ctx.lineWidth = this.radius * 0.5;
                    ctx.stroke();
                }
            }

            update(dt) {
                // Gravity simulation
                if (this.radius > STREAK_THRESHOLD) {
                    this.streaking = true;
                    this.speed += 0.005 * dt; // Accelerate
                }

                if (this.streaking) {
                    this.y += this.speed * dt;
                    this.radius += 0.01 * dt; // Grow while falling (collecting water)

                    // Reset if off screen
                    if (this.y > height + 20) {
                        this.reset();
                    }
                }
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.5; // Spawn in upper half mostly
                this.radius = Math.random() * 1.5 + 0.5;
                this.speed = 0;
                this.streaking = false;
            }
        }

        // --- Initialization ---

        function initWorld() {
            drops = [];
            bokehParticles = [];

            // Create Bokeh
            const numBokeh = 80;
            for (let i = 0; i < numBokeh; i++) {
                bokehParticles.push(new Bokeh());
            }

            // Create Drops
            // We simulate drops on a grid or random spots.
            // A rough approximation of pixel density for performance.
            const area = width * height;
            const numDrops = Math.floor(area * DENSITY / 1000); 
            
            for (let i = 0; i < numDrops; i++) {
                drops.push(new Drop(
                    Math.random() * width,
                    Math.random() * height
                ));
            }
        }

        // --- Main Loop ---

        function loop() {
            const dt = 1; // Fixed delta for simplicity, could be time-based
            
            // 1. Clear
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Background (Blurred City)
            ctx.save();
            bokehParticles.forEach(p => {
                p.update();
                p.drawBackground(ctx, true);
            });
            ctx.restore();

            // 3. Lightning Flash
            if (Math.random() < LIGHTNING_CHANCE) {
                lightningAlpha = 0.6 + Math.random() * 0.4;
            }
            
            // Apply Lightning
            if (lightningAlpha > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(240, 240, 255, ${lightningAlpha})`;
                ctx.fillRect(0, 0, width, height);
                
                // Occasional jagged line (simplified for code golf / performance)
                if (lightningAlpha > 0.4 && Math.random() > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * width, 0);
                    let lx = Math.random() * width;
                    let ly = 0;
                    while(ly < height) {
                        lx += (Math.random() - 0.5) * 100;
                        ly += Math.random() * 50 + 20;
                        ctx.lineTo(lx, ly);
                    }
                    ctx.strokeStyle = `rgba(255, 255, 255, 1)`;
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "white";
                    ctx.shadowBlur = 20;
                    ctx.stroke();
                }
                ctx.restore();
                
                lightningAlpha -= 0.02;
                if (lightningAlpha < 0) lightningAlpha = 0;
            }

            // 4. Refract & Draw Drops
            // We draw the background again, but clipped to the drop shapes,
            // creating a magnifying glass effect.
            
            // We need the background to be sharp for the refraction to look good.
            // However, redrawing 80 blurs is expensive. 
            // Optimization: We draw the bokeh "sharp" inside the drops.
            
            ctx.save();
            for (let i = 0; i < drops.length; i++) {
                const d = drops[i];
                
                // Physics Update
                d.update(dt);
                
                // Merge Logic (Simplified: Check against a subset of drops to avoid O(N^2))
                // In a real heavy physics engine, we'd use a spatial grid. 
                // Here we rely on gravity pulling bigger drops into smaller ones below them.
                // We perform a simple check against nearby drops.
                if (i < drops.length) {
                   // This is computationally expensive to do fully connected.
                   // Instead, we rely on the fact that drops are static until they streak.
                   // When a drop streaks, it passes through others.
                   // Visual merge: We just check if a drop is drawn over another.
                   // To simulate "wipe", we reset the passed drop.
                }

                // Draw Refraction Effect
                ctx.save();
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                ctx.clip(); // Only draw background inside the drop
                
                // Draw Bokeh "Sharp" inside the drop
                // To save perf, we just draw a colored circle with the drop's properties
                // The visual trick is the "lens" look.
                ctx.globalCompositeOperation = 'source-over';
                
                // We draw a slightly zoomed version of the scene? 
                // Since we can't capture the screen easily per pixel, we simulate refraction
                // by drawing a distorted version of the light source that would be behind it.
                // For this screensaver, we simulate refraction by drawing the Bokeh colors
                // centered at the drop, slightly larger.
                
                ctx.fillStyle = `rgba(255, 255, 255, 0.1)`; // Lens tint
                ctx.fill();
                
                ctx.restore();

                // Draw the Drop Outline/Glass effect
                d.draw();
            }
            
            // Merge Check (Simple optimization: check only drops below)
            // If a streaking drop touches a smaller drop, consume it.
            for (let i = 0; i < drops.length; i++) {
                if (drops[i].streaking) {
                    for (let j = i + 1; j < drops.length; j++) {
                        const other = drops[j];
                        const dx = drops[i].x - other.x;
                        const dy = drops[i].y - other.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < drops[i].radius + other.radius) {
                            // Merge
                            drops[i].radius += other.radius * 0.5;
                            // Reset other drop
                            other.reset();
                        }
                    }
                }
            }

            ctx.restore();

            requestAnimationFrame(loop);
        }

        // Start
        resize();
        loop();

    </script>
</body>
</html>
