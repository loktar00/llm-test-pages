<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Doom Melt</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COLS = 4;
const HOLD_TIME = 2500;
const MELT_DURATION = 2200;

let sceneA = null, sceneB = null;
let meltPhase = false;
let meltStart = 0;
let holdStart = 0;
let colOffsets = [];
let colSpeeds = [];
let colWobble = [];
let colWobbleSpeed = [];
let sceneIndex = 0;

function initColumns() {
  colOffsets = [];
  colSpeeds = [];
  colWobble = [];
  colWobbleSpeed = [];
  for (let x = 0; x < W; x++) {
    colOffsets[x] = 0;
    colSpeeds[x] = 0.3 + Math.random() * 0.7;
    colWobble[x] = Math.random() * Math.PI * 2;
    colWobbleSpeed[x] = 0.5 + Math.random() * 2;
  }
}

function hsl(h, s, l) {
  return `hsl(${h},${s}%,${l}%)`;
}

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function generateSkyline(c) {
  const cw = c.width, ch = c.height;
  const g = c.getContext('2d');

  const skyGrad = g.createLinearGradient(0, 0, 0, ch * 0.6);
  const hueBase = Math.random() * 360;
  skyGrad.addColorStop(0, hsl(hueBase, 60, 8));
  skyGrad.addColorStop(0.5, hsl(hueBase + 20, 50, 20));
  skyGrad.addColorStop(1, hsl(hueBase + 40, 40, 35));
  g.fillStyle = skyGrad;
  g.fillRect(0, 0, cw, ch);

  for (let i = 0; i < 80; i++) {
    g.fillStyle = `rgba(255,255,255,${rand(0.1, 0.6)})`;
    g.fillRect(rand(0, cw), rand(0, ch * 0.4), rand(1, 2), rand(1, 2));
  }

  const layers = 3;
  for (let l = 0; l < layers; l++) {
    const yBase = ch * (0.45 + l * 0.12);
    const darkness = 5 + l * 8;
    g.fillStyle = hsl(hueBase + l * 15, 30, darkness);
    g.beginPath();
    g.moveTo(0, ch);
    let x = 0;
    while (x < cw) {
      const bw = rand(20, 80);
      const bh = rand(30, 150 + l * 30);
      const by = yBase - bh;
      g.lineTo(x, by);
      g.lineTo(x + bw * 0.1, by);
      g.lineTo(x + bw * 0.1, by - rand(5, 25));
      g.lineTo(x + bw * 0.15, by - rand(5, 25));
      g.lineTo(x + bw * 0.15, by);
      g.lineTo(x + bw * 0.85, by);
      g.lineTo(x + bw * 0.85, by + rand(5, 15));
      g.lineTo(x + bw * 0.9, by + rand(5, 15));
      g.lineTo(x + bw * 0.9, by);
      g.lineTo(x + bw, by);
      x += bw + rand(2, 15);
    }
    g.lineTo(cw, ch);
    g.closePath();
    g.fill();

    g.fillStyle = `rgba(255,200,100,${0.05 + l * 0.03})`;
    for (let wx = 0; wx < cw; wx += rand(15, 40)) {
      const wy = yBase - rand(10, 100);
      if (wy > 0) {
        g.fillRect(wx, wy, rand(2, 4), rand(2, 4));
      }
    }
  }

  const groundGrad = g.createLinearGradient(0, ch * 0.85, 0, ch);
  groundGrad.addColorStop(0, hsl(hueBase, 20, 8));
  groundGrad.addColorStop(1, hsl(hueBase, 10, 3));
  g.fillStyle = groundGrad;
  g.fillRect(0, ch * 0.85, cw, ch * 0.15);
}

function generateTerrain(c) {
  const cw = c.width, ch = c.height;
  const g = c.getContext('2d');

  const hueBase = Math.random() * 360;
  const skyGrad = g.createLinearGradient(0, 0, 0, ch * 0.5);
  skyGrad.addColorStop(0, hsl(hueBase + 200, 70, 5));
  skyGrad.addColorStop(0.6, hsl(hueBase + 220, 60, 25));
  skyGrad.addColorStop(1, hsl(hueBase + 240, 50, 45));
  g.fillStyle = skyGrad;
  g.fillRect(0, 0, cw, ch);

  const sunX = rand(cw * 0.2, cw * 0.8);
  const sunY = rand(ch * 0.15, ch * 0.35);
  const sunGrad = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, 120);
  sunGrad.addColorStop(0, `rgba(255,220,150,0.9)`);
  sunGrad.addColorStop(0.3, `rgba(255,150,80,0.4)`);
  sunGrad.addColorStop(1, `rgba(255,100,50,0)`);
  g.fillStyle = sunGrad;
  g.fillRect(0, 0, cw, ch);

  const layers = 5;
  for (let l = 0; l < layers; l++) {
    const yBase = ch * (0.35 + l * 0.12);
    const lightness = 10 + l * 8;
    const sat = 20 + l * 10;
    g.fillStyle = hsl(hueBase + l * 25, sat, lightness);
    g.beginPath();
    g.moveTo(0, ch);
    const segments = 60;
    const amp = 60 + l * 20;
    const freq = 0.003 + l * 0.002;
    const phase = Math.random() * 100;
    for (let x = 0; x <= cw; x += 3) {
      const y = yBase - Math.sin((x + phase) * freq) * amp
        - Math.sin((x + phase) * freq * 2.3) * amp * 0.4
        - Math.sin((x + phase) * freq * 0.5) * amp * 0.6;
      g.lineTo(x, y);
    }
    g.lineTo(cw, ch);
    g.closePath();
    g.fill();
  }

  g.fillStyle = hsl(hueBase, 10, 3);
  g.fillRect(0, ch * 0.92, cw, ch * 0.08);
}

function generateAbstract(c) {
  const cw = c.width, ch = c.height;
  const g = c.getContext('2d');

  const hueBase = Math.random() * 360;
  g.fillStyle = hsl(hueBase, 40, 8);
  g.fillRect(0, 0, cw, ch);

  const numCircles = rand(15, 40) | 0;
  for (let i = 0; i < numCircles; i++) {
    const cx = rand(0, cw);
    const cy = rand(0, ch);
    const r = rand(20, 200);
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r);
    const h = hueBase + rand(-60, 60);
    grad.addColorStop(0, hsl(h, 80, 50));
    grad.addColorStop(0.5, hsl(h + 30, 60, 30));
    grad.addColorStop(1, hsl(h + 60, 40, 10));
    g.fillStyle = grad;
    g.globalAlpha = rand(0.1, 0.5);
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;

  const numLines = rand(20, 60) | 0;
  for (let i = 0; i < numLines; i++) {
    g.strokeStyle = hsl(hueBase + rand(-40, 40), 70, rand(40, 70));
    g.lineWidth = rand(1, 4);
    g.globalAlpha = rand(0.1, 0.4);
    g.beginPath();
    const sx = rand(0, cw);
    const sy = rand(0, ch);
    g.moveTo(sx, sy);
    g.bezierCurveTo(
      rand(0, cw), rand(0, ch),
      rand(0, cw), rand(0, ch),
      rand(0, cw), rand(0, ch)
    );
    g.stroke();
  }
  g.globalAlpha = 1;

  const numRects = rand(10, 30) | 0;
  for (let i = 0; i < numRects; i++) {
    g.fillStyle = hsl(hueBase + rand(-50, 50), 60, rand(20, 50));
    g.globalAlpha = rand(0.05, 0.25);
    g.fillRect(rand(0, cw), rand(0, ch), rand(20, 150), rand(20, 150));
  }
  g.globalAlpha = 1;

  const numDots = rand(100, 300) | 0;
  for (let i = 0; i < numDots; i++) {
    g.fillStyle = hsl(rand(0, 360), 80, rand(50, 80));
    g.globalAlpha = rand(0.2, 0.7);
    g.beginPath();
    g.arc(rand(0, cw), rand(0, ch), rand(1, 4), 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
}

const generators = [generateSkyline, generateTerrain, generateAbstract];

function createScene() {
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  generators[sceneIndex % generators.length](c);
  sceneIndex++;
  return c;
}

function init() {
  sceneA = createScene();
  sceneB = createScene();
  initColumns();
  holdStart = performance.now();
  meltPhase = false;
}

function drawMelt(now) {
  const elapsed = now - meltStart;
  const progress = Math.min(elapsed / MELT_DURATION, 1);

  ctx.clearRect(0, 0, W, H);

  for (let x = 0; x < W; x++) {
    const baseSpeed = colSpeeds[x];
    const easedProgress = progress * progress;
    const meltY = easedProgress * H * (0.5 + baseSpeed * 0.5);

    const wobble = Math.sin(now * 0.001 * colWobbleSpeed[x] + colWobble[x]) * 2;
    const srcX = Math.round(x + wobble);
    const clampedSrcX = Math.max(0, Math.min(W - 1, srcX));

    if (meltY >= H) {
      ctx.drawImage(sceneB, x, 0, 1, H, x, 0, 1, H);
    } else {
      ctx.drawImage(sceneB, clampedSrcX, 0, 1, Math.ceil(meltY), x, 0, 1, Math.ceil(meltY));
      ctx.drawImage(sceneA, clampedSrcX, 0, 1, H - Math.ceil(meltY), x, meltY, 1, H - Math.ceil(meltY));
    }
  }

  if (progress >= 1) {
    sceneA = sceneB;
    sceneB = createScene();
    initColumns();
    meltPhase = false;
    holdStart = performance.now();
  }
}

function drawHold() {
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(sceneA, 0, 0);
}

function loop(now) {
  if (!meltPhase) {
    drawHold();
    if (now - holdStart > HOLD_TIME) {
      meltPhase = true;
      meltStart = now;
    }
  } else {
    drawMelt(now);
  }
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
