<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boids Murmuration</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0f0612; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = Math.floor(window.innerWidth * DPR);
  H = canvas.height = Math.floor(window.innerHeight * DPR);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  buildScene();
}
window.addEventListener('resize', resize);

let scene = {};

function buildScene() {
  // Dusk sky color stops (warm blue to muted amber-rose)
  const c = function() { return '#0f0612'; };
  
  // Sky vertical gradient
  scene.skyTop = { r: 18, g: 8, b: 24 };
  scene.skyMid = { r: 40, g: 18, b: 38 };
  scene.skyHor  = { r: 80, g: 30, b: 40 };
  
  // Mountains (proced at resize)
  scene.layers = [];
  for (let i = 0; i < 4; i++) {
    const layer = { baseY: 0, points: [], depth: i };
    const yMin = H * (0.65 + i * 0.05);
    const yMax = H * (0.85 + i * 0.05);
    const baseY = H * (0.7 + i * 0.08);
    layer.baseY = baseY;
    layer.yMin = yMin;
    layer.yMax = yMax;
    const step = 40 * DPR;
    const pts = [];
    const seed = (i + 1) * 99.5 + Math.random() * 100;
    let ph = seed * 13;
    for (let x = -200 * DPR; x < W + 200 * DPR + step; x += step) {
      const k = 0;
      // Simple deterministic pseudo via sin/c cos
      const y = baseY 
            + Math.sin(x * 0.004 + i * 0.7) * (40 + i * 10) * DPR
            + Math.sin(x * 0.012 + i * 0.3 + seed) * (60 - i * 6) * DPR
            + Math.sin(x * 0.005 + seed * 0.4) * 30 * DPR
            - Math.abs(Math.sin(x * 0.0028 + i * 2.3 + seed * 0.7)) * (40 + i * 8) * DPR
            - i * 20 * DPR;
      pts.push({ x: x, y: y });
    }
    layer.points = pts;
    layer.color = i === 0 ? 'rgb(10,6,16)' 
                : i === 1 ? 'rgb(20,10,22)' 
                : i === 2 ? 'rgb(33,15,32)'
                : 'rgb(48,24,50)';
    scene.layers.push(layer);
  }
  
  // Trees silhouettes in foreground
  scene.trees = [];
  const treeCount = 25;
  for (let i = 0; i < treeCount; i++) {
    const x = Math.random() * W;
    const baseY = H * (0.92 + Math.random() * 0.05);
    const h = (30 + Math.random() * 50) * DPR;
    const w = (5 + Math.random() * 6) * DPR;
    scene.trees.push({
      x: x,
      baseY: baseY,
      h: h,
      w: w,
      bend: (Math.random() - 0.5) * 5,
      kind: Math.random()
    });
  }
  
  // Stars
  scene.stars = [];
  const starCount = 80;
  for (let i = 0; i < starCount; i++) {
    scene.stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      r: (Math.random() * 0.7 + 0.4) * DPR,
      a: Math.random() * 0.6 + 0.2
    });
  }
}

resize();

function drawScene() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, `rgb(${scene.skyTop.r},${scene.skyTop.g},${scene.skyTop.b})`);
  grad.addColorStop(0.35, `rgb(${Math.floor(scene.skyMid.r),${Math.floor(scene.skyMid.g),${Math.floor(scene.skyMid.b})`);
  grad.addColorStop(0.6, `rgb(${Math.floor(scene.skyHor.r*0.85),${Math.floor(scene.skyHor.g*0.85),${Math.floor(scene.skyHor.b*0.85))`);
  grad.addColorStop(1, `rgb(${Math.floor(scene.skyHor.r*0.4),${Math.floor(scene.skyHor.g*0.4),${Math.floor(scene.skyHor.b*0.4))`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Sun haze
  const sx = W * 0.75;
  const sy = H * 0.32;
  const sr = Math.max(W, H) * 0.5;
  const sun = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
  sun.addColorStop(0, 'rgba(255, 120, 70, 0.6)');
  sun.addColorStop(0.25, 'rgba(255, 80, 50, 0.35)');
  sun.addColorStop(0.5, 'rgba(180, 40, 30, 0.18)');
  sun.addColorStop(1, 'rgba(80, 30, 40, 0)');
  ctx.fillStyle = sun;
  ctx.fillRect(0, 0, W, H);
  
  // Stars (faint)
  ctx.fillStyle = 'rgba(245, 220, 200, 1)';
  for (let s of scene.stars) {
    ctx.globalAlpha = s.a;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
}

function drawMountains() {
  for (let layer of scene.layers) {
    ctx.fillStyle = layer.color;
    ctx.beginPath();
    ctx.moveTo(layer.points[0].x, H + 50);
    for (let p of layer.points) {
      ctx.lineTo(p.x, p.y);
    }
    ctx.lineTo(layer.points[layer.points.length - 1].x, H + 50);
    ctx.closePath();
    ctx.fill();
  }
}

function drawTrees() {
  ctx.fillStyle = 'rgb(8, 6, 10)';
  for (let t of scene.trees) {
    drawTree(t);
  }
}

function drawTree(t) {
  // Trunk
  ctx.fillRect(t.x, t.baseY, t.w * 0.5, t.h * 0.4);
  // Crown
  const cx = t.x + t.bend;
  const cy = t.baseY - t.h * 0.4;
  ctx.beginPath();
  ctx.ellipse(cx, cy, t.w * 4, t.w * 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + t.w * 2, cy - t.w, t.w * 3, t.w * 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx - t.w * 2, cy + t.w, t.w * 3, t.w * 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + t.w * 1.5, cy - t.w * 1.5, t.w * 2.5, t.w * 2, 0, 0, Math.PI * 2);
  ctx.fill();
}

// Boid class
class Boid {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = 2.5 + Math.random() * 0.5;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.ax = 0;
    this.ay = 0;
    this.faction = 0;
    this.factionTarget = 0;
    this.factionTimer = Math.random() * 300;
  }
}

let boids = [];
function initBoids() {
  boids = [];
  const count = 600;
  const cx = W / 2;
  const cy = H / 2;
  for (let i = 0; i < count; i++) {
    const r = Math.random() * Math.min(W, H) * 0.3;
    const a = Math.random() * Math.PI * 2;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    boids.push(new Boid(x, y));
  }
}

initBoids();

// Predator ( invisible but causes splitting occasionally
let predator = {
  x: W / 2,
  y: H / 2,
  tx: W / 2,
  ty: H / 2,
  active: false,
  timer: 0,
  duration: 0,
  radius: 120
};

function updatePredator() {
  predator.timer--;
  if (predator.active) {
    predator.duration--;
    if (predator.duration <= 0) {
      predator.active = false;
      predator.timer = 200 + Math.random() * 300;
    }
  } else {
    if (predator.timer <= 0) {
      predator.active = true;
      predator.duration = 180 + Math.random() * 120;
      predator.tx = W * (0.25 + Math.random() * 0.5);
      predator.ty = H * (0.25 + Math.random() * 0.5);
    }
  }
  // Move toward target
  const dx = predator.tx - predator.x;
  const dy = predator.ty - predator.y;
  predator.x += dx * 0.025;
  predator.y += dy * 0.025;
  if (predator.active) {
    predator.tx += (Math.random() - 0.5) * 5;
    predator.ty += (Math.random() - 0.5) * 5;
    // Stay within bounds
    predator.tx = Math.max(W * 0.15, Math.min(W * 0.85, predator.tx));
    predator.ty = Math.max(H * 0.15, Math.min(H * 0.85, predator.ty));
  }
}

// Spatial grid for efficient neighbor lookup
let grid = new Map();
function hashKey(x, y, cell) {
  return ((Math.floor(x / cell)) << 16) ^ Math.floor(y / cell);
}

function boidSim() {
  const cellSize = 20 * DPR;
  grid.clear();
  
  // Build spatial hash
  for (let i = 0; i < boids.length; i++) {
    const b = boids[i];
    const kx = Math.floor(b.x / cellSize);
    const ky = Math.floor(b.y / cellSize);
    const key = (kx & 0xffff) | ((ky & 0xffff) << 16);
    let cell = grid.get(key);
    if (!cell) {
      cell = [];
      grid.set(key, cell);
    }
    b._i = i;
    cell.push(b);
  }
}

const SEP = 2.0;
const ALN = 1.2;
const COH = 0.6;
const PRED = 1.5;
const IN_VIEW = 40 * DPR;
const IN_VIEW_SQ = IN_VIEW * IN_VIEW;
const SEP_DIST = 22 * DPR;
const SEP_SQ = SEP_DIST * SEP_DIST;
const MAX_SPEED = 3.4;
const MAX_FORCE = 0.06;
const cellSize = 20 * DPR;

function steer(b, neighbors, out) {
  let ax = 0, ay = 0;
  let alSX = 0, alSY = 0, alCount = 0;
  let coX = 0, coY = 0, coCount = 0;
  let sepX = 0, sepY = 0, sepCount = 0;
  let pred = predator;
  let predActive = predator.active;
  let predRadius = 60 * DPR;
  let predSq = predRadius * predRadius;
  let predFX = 0, predFY = 0;
  let predF = 0;
  
  // Check neighbors via grid
  const bx = b.x, by = b.y;
  const cx = Math.floor(bx / cellSize);
  const cy = Math.floor(by / cellSize);
  
  for (let ox = -1; ox <= 1; ox++) {
    for (let oy = -1; oy <= 1; oy++) {
      const key = (cx + ox & 0xffff) | ((cy + oy & 0xffff) << 16);
      const cell = grid.get(key);
      if (cell) {
        for (let j = 0; j < cell.length; j++) {
          const other = cell[j];
          if (other === b) continue;
          const dx = other.x - b.x;
          const dy = other.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < IN_VIEW_SQ && d2 > 0.01) {
            // Alignment
            alSX += other.vx;
            alSY += other.vy;
            alCount++;
            // Cohesion
            coX += other.x;
            coY += other.y;
            coCount++;
            // Separation
            if (d2 < SEP_SQ) {
              const d = Math.sqrt(d2);
              const fx = dx / d;
              const fy = dy / d;
              const strength = 1 - d / SEP_DIST;
              sepX += fx * strength;
              sepY += fy * strength;
              sepCount++;
            }
          }
        }
      }
    }
  }
  
  // Apply forces
  // Separation
  if (sepCount > 0) {
    ax += (sepX / sepCount) * SEP;
    ay += (sepY / sepCount) * SEP;
  }
  // Alignment
  if (alCount > 0) {
    ax += (alSX / alCount * 0.06 - b.vx * 0.06) * ALN;
    ay += (alSY / alCount * 0.06 - b.vy * 0.06) * ALN;
  }
  // Cohesion
  if (coCount > 0) {
    const ddx = (coX / coCount - b.x) * 0.001;
    const ddy = (coY / coCount - b.y) * 0.001;
    ax += ddx * COH;
    ay += ddy * COH;
  }
  
  // Predator influence
  if (predActive) {
    const dxp = b.x - pred.x;
    const dyp = b.y - pred.y;
    const d2p = dxp * dxp + dyp * dyp;
    if (d2p < predSq) {
      const d = Math.sqrt(d2p);
      const strength = (1 - d / Math.sqrt(predSq)) * PRED * 5;
      predFX = (dxp / d) * strength;
      predFY = (dyp / d) * strength;
      ax += predFX;
      ay += predFY;
      b._pred = 1;
    } else {
      b._pred = 0;
    }
  } else {
    b._pred = 0;
  }
  
  // Wander / faint turning
  const w = 0.005;
  ax += (Math.random() - 0.5) * w;
  ay += (Math.random() - 0.5) * w;
  
  // Edge steer
  const margin = 70 * DPR;
  const edgeFL = 0.04;
  if (b.x < margin) {
    ax += edgeFL * (1 - b.x / margin);
    // ay += (Math.random() - 0.5) * 0.005;
  } else if (b.x > W - margin) {
    ax -= edgeFL * (1 - (W - b.x) / margin);
  }
  if (b.y < margin) {
    ay += edgeFL * (1 - b.y / margin);
  } else if (b.y > H - margin) {
    ay -= edgeFL * (1 - (H - b.y) / margin);
  }
  
  out.x = ax;
  out.y = ay;
}

function applyForce(b, ax, ay) {
  b.vx += ax;
  b.vy += ay;
  // Cap speed
  const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
  if (sp > MAX_SPEED) {
    const f = MAX_SPEED / sp;
    b.vx *= f;
    b.vy *= f;
  }
  // Limit force - smooth turn
  const dx = b.vx;
  const dy = b.vy;
  // Move
  b.x += b.vx;
  b.y += b.vy;
}

// Frame loop
let frame = 0;
let lastTime = 0;
const tmp = { x: 0, y: 0 };

function loop(time) {
  // FPS-based step
  // Run simulation
  boidSim();
  
  // Draw scene (static bg)
  drawScene();
  drawMountains();
  
  // Boids - draw on top with smoke-like
  // Use a separate low-alpha overlay pass to create smoke density
  
  // Update boids
  for (let i = 0; i < boids.length; i++) {
    const b = boids[i];
    steer(b, null, tmp);
    // Apply force with smooth turning ( limit acceleration
    const targetVx = b.vx + tmp.x;
    const targetVy = b.vy + tmp.y;
    const tSp = Math.sqrt(targetVx * targetVx + targetVy * targetVy);
    const maxSp = MAX_SPEED;
    if (tSp > maxSp) {
      const f = maxSp / tSp;
      targetVx *= f;
      targetVy *= f;
    }
    // Smooth turn
    b.vx = b.vx * 0.85 + targetVx * 0.15;
    b.vy = b.vy * 0.85 + targetVy * 0.15;
    // Cap
    const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    if (sp > maxSp) {
      const f = maxSp / sp;
      b.vx *= f;
      b.vy *= f;
    }
    // Move
    b.x += b.vx;
    b.y += b.vy;
    // Keep in bounds softly
    if (b.x < -50) b.x = W + 50;
    if (b.x > W + 50) b.x = -50;
    if (b.y < -50) b.y = H + 50;
    if (b.y > H + 50) b.y = -50;
  }
  
  // Update predator
  updatePredator();
  
  // Draw boids as small dark specks
  // Use a temp image data accumulation for density feel
  ctx.fillStyle = 'rgba(5, 3, 6, 0.8)';
  // Draw specks
  // Smoke-like: each boid is a 1px dot + faint halo
  // Use destination-over or simply dark fill
  ctx.globalAlpha = 1;
  // Specks
  ctx.fillStyle = 'rgba(10, 8, 12, 0.92)';
  for (let i = 0; i < boids.length; i++) {
    const b = boids[i];
    // Small dark dot
    const r = 0.6 * DPR;
    // ctx.fillRect(b.x - r, b.y - r, r * 2, r * 2);
    // Smoke halo
    ctx.beginPath();
    ctx.arc(b.x, b.y, r * 2.7, 0, Math.PI * 2);
    ctx.fill();
  }
  // Crisp speck
  ctx.fillStyle = 'rgba(0, 0, 0, 1)';
  for (let i = 0; i < boids.length; i++) {
    const b = boids[i];
    const r = 0.45 * DPR;
    ctx.fillRect(b.x - r, b.y - r, r, r * 2);
    // ctx.beginPath();
    // ctx.arc(b.x, b.y, r * 0.4, 0, Math.PI * 2);
    // ctx.fill();
  }
  
  // Trees silhouettes (drawn last to be in front
  drawTrees();
  
  // Faint vignette
  const vign = ctx.createRadialGradient(W/2, H/2, Math.max(W, H) * 0.3, W/2, H/2, Math.max(W, H) * 0.8);
  vign.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vign.addColorStop(1, 'rgba(0, 0, 0, 0.45)');
  ctx.fillStyle = vign;
  ctx.fillRect(0, 0, W, H);
  
  frame++;
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
