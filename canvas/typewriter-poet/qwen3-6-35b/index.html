function pickWord(minS, maxS) {
  const pool = wordBank.filter(w => w.s >= minS && w.s <= maxS);
  return pool[Math.floor(Math.random() * pool.length)].w;
}

function generateLine(targetSyllables) {
  let line = '';
  let totalS = 0;
  let attempts = 0;
  while (totalS < targetSyllables && attempts < 20) {
    const remaining = targetSyllables - totalS;
    const maxPick = Math.min(remaining, 3);
    const minPick = Math.max(1, remaining - 2);
    const s = minPick + Math.floor(Math.random() * (maxPick - minPick + 1));
    const word = pickWord(s - 1, s + 1);
    if (word) {
      line += (line ? ' ' : '') + word;
      totalS += s;
    }
    attempts++;
  }
  // Trim to target syllables
  const words = line.split(' ');
  let accumulated = 0;
  let result = '';
  for (const w of words) {
    const ws = wordBank.find(x => x.w === w)?.s || 1;
    if (accumulated + ws > targetSyllables) break;
    result += (result ? ' ' : '') + w;
    accumulated += ws;
  }
  return result;
}

// Typewriter state
const LINE_HEIGHT = 28;
const LINE_SPACING = 42;
const PAGE_HEIGHT = 600;
const MAX_LINES = Math.floor(PAGE_HEIGHT / LINE_SPACING);
const TYPE_X = 200;
const TYPE_Y_START = 180;
const FONT_SIZE = 18;
const FONT = '"Courier New", Courier, monospace';

let state = {
  phase: 'idle', // idle, striking, returning, bell, pausing, tearing, loading
  lines: [], // rendered lines {text, y, opacity, x}
  currentLine: '',
  currentLineY: 0,
  charIndex: 0,
  carriageX: TYPE_X,
  carriageTargetX: TYPE_X,
  paperOffset: 0,
  strikeProgress: 0,
  bellFlash: 0,
  tearProgress: 0,
  loadProgress: 0,
  currentPage: 0,
  totalPages: 0,
  backspace: false,
  backspaceProgress: 0,
  pauseTimer: 0,
  returnTimer: 0,
  strikeTimer: 0,
  haikuLineTarget: 0,
  haikuSyllableTarget: 0,
  haikuPhase: 0, // 0=first line(5), 1=second(7), 2=third(5)
  haikuCompleted: false,
  lineComplete: false,
  delayTimer: 0,
  inkDrops: [],
  typeBarY: 0,
  typeBarTargetY: 0,
  typeBarActive: false,
  lastCharTime: 0,
  xStrikeCount: 0,
  xStrikeTimer: 0,
};

function resetHaiku() {
  state.haikuPhase = 0;
  state.haikuCompleted = false;
  state.currentLine = '';
  state.charIndex = 0;
  state.lineComplete = false;
  generateNewHaikuLine();
}

function generateNewHaikuLine() {
  const targets = [5, 7, 5];
  state.haikuSyllableTarget = targets[state.haikuPhase];
  state.currentLine = generateLine(state.haikuSyllableTarget);
  state.charIndex = 0;
  state.lineComplete = false;
  state.backspace = false;
}

function initPage() {
  state.lines = [];
  state.currentLineY = TYPE_Y_START;
  state.currentLine = '';
  state.charIndex = 0;
  state.haikuPhase = 0;
  state.haikuCompleted = false;
  state.inkDrops = [];
  state.pageOffset = 0;
  resetHaiku();
}

function startTear() {
  state.phase = 'tearing';
  state.tearProgress = 0;
}

function startLoad() {
  state.phase = 'loading';
  state.loadProgress = 0;
  state.currentPage++;
}

function addInkDrop(x, y, char) {
  state.inkDrops.push({
    x: x + (Math.random() - 0.5) * 3,
    y: y + (Math.random() - 0.5) * 2,
    radius: 1.5 + Math.random() * 1.5,
    opacity: 0.3 + Math.random() * 0.4,
    char: char,
    age: 0
  });
}

function typeChar() {
  if (state.charIndex >= state.currentLine.length) {
    state.lineComplete = true;
    return;
  }

  const ch = state.currentLine[state.charIndex];
  const x = state.carriageX + state.charIndex * 9.5;
  const y = state.currentLineY;

  addInkDrop(x, y, ch);

  state.charIndex++;

  // Occasional x-strike (backspace and retype)
  if (!state.backspace && state.charIndex > 3 && Math.random() < 0.03 && state.xStrikeCount < 2) {
    state.backspace = true;
    state.backspaceProgress = 0;
    state.xStrikeCount++;
    return;
  }

  state.lastCharTime = performance.now();
}

function update(dt) {
  const now = performance.now();

  switch (state.phase) {
    case 'idle':
      state.pauseTimer += dt;
      if (state.pauseTimer > 800 + Math.random() * 1200) {
        state.phase = 'striking';
        state.strikeProgress = 0;
        state.typeBarTargetY = 15;
        state.typeBarY = 0;
        state.typeBarActive = true;
        state.pauseTimer = 0;
      }
      break;

    case 'striking':
      state.strikeProgress += dt / 120;
      state.typeBarY = Math.sin(Math.min(state.strikeProgress, 1) * Math.PI) * 15;
      if (state.strikeProgress >= 0.3 && state.strikeProgress < 0.35) {
        typeChar();
      }
      if (state.strikeProgress >= 1) {
        state.typeBarActive = false;
        state.phase = 'pausing';
        state.pauseTimer = 50 + Math.random() * 100;
      }
      break;

    case 'pausing':
      state.pauseTimer -= dt;
      if (state.pauseTimer <= 0) {
        if (state.lineComplete) {
          // Add line to paper
          state.lines.push({
            text: state.currentLine,
            y: state.currentLineY,
            opacity: 0,
            targetOpacity: 0.85
          });
          state.currentLineY += LINE_SPACING;
          state.carriageX = TYPE_X;

          // Check if line filled
          if (state.lines.length >= MAX_LINES) {
            startTear();
            return;
          }

          // Check haiku completion
          state.haikuPhase++;
          if (state.haikuPhase >= 3) {
            state.haikuCompleted = true;
            state.phase = 'pausing';
            state.pauseTimer = 1500 + Math.random() * 2000;
          } else {
            state.phase = 'pausing';
            state.pauseTimer = 300 + Math.random() * 600;
          }
        } else {
          state.phase = 'returning';
          state.returnTimer = 0;
        }
      }
      break;

    case 'returning':
      state.returnTimer += dt;
      const returnDuration = 400;
      const t = Math.min(state.returnTimer / returnDuration, 1);
      // Eased return
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      state.carriageX = TYPE_X + (state.charIndex * 9.5) * (1 - eased);
      if (t >= 1) {
        state.carriageX = TYPE_X;
        state.charIndex = 0;

        if (state.haikuCompleted) {
          state.phase = 'pausing';
          state.pauseTimer = 1000 + Math.random() * 1500;
          resetHaiku();
        } else {
          generateNewHaikuLine();
          state.phase = 'idle';
          state.pauseTimer = 200 + Math.random() * 800;
        }
      }
      break;

    case 'tearing':
      state.tearProgress += dt / 1500;
      if (state.tearProgress >= 1) {
        startLoad();
      }
      break;

    case 'loading':
      state.loadProgress += dt / 1000;
      if (state.loadProgress >= 1) {
        initPage();
        state.phase = 'idle';
        state.pauseTimer = 500 + Math.random() * 1000;
      }
      break;
  }

  // Update ink drops
  for (let i = state.inkDrops.length - 1; i >= 0; i--) {
    state.inkDrops[i].age += dt;
    if (state.inkDrops[i].age > 8000) {
      state.inkDrops[i].opacity -= dt / 10000;
      if (state.inkDrops[i].opacity <= 0) {
        state.inkDrops.splice(i, 1);
      }
    }
  }

  // Update line opacity
  for (const line of state.lines) {
    if (line.opacity < line.targetOpacity) {
      line.opacity += dt / 800;
      if (line.opacity > line.targetOpacity) line.opacity = line.targetOpacity;
    }
  }

  // Bell flash
  if (state.bellFlash > 0) {
    state.bellFlash -= dt / 500;
  }
}

function drawPaper() {
  const paperW = W * 0.55;
  const paperH = PAGE_HEIGHT;
  const paperX = (W - paperW) / 2;
  const paperY = 100;

  // Paper shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetX = 5;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = '#f5f0e8';
  ctx.fillRect(paperX, paperY, paperW, paperH);
  ctx.restore();

  // Paper texture
  ctx.save();
  ctx.globalAlpha = 0.03;
  for (let i = 0; i < 200; i++) {
    const px = paperX + Math.random() * paperW;
    const py = paperY + Math.random() * paperH;
    ctx.fillStyle = Math.random() > 0.5 ? '#000' : '#8B7355';
    ctx.fillRect(px, py, Math.random() * 2, Math.random() * 2);
  }
  ctx.restore();

  // Paper edges
  ctx.strokeStyle = '#d4c9b8';
  ctx.lineWidth = 1;
  ctx.strokeRect(paperX, paperY, paperW, paperH);

  // Margin lines
  ctx.save();
  ctx.strokeStyle = 'rgba(150,180,200,0.2)';
  ctx.lineWidth = 0.5;
  for (let y = TYPE_Y_START; y < paperH - 40; y += LINE_SPACING) {
    ctx.beginPath();
    ctx.moveTo(paperX + 40, y);
    ctx.lineTo(paperX + paperW - 40, y);
    ctx.stroke();
  }
  // Left margin
  ctx.strokeStyle = 'rgba(200,80,80,0.15)';
  ctx.beginPath();
  ctx.moveTo(paperX + 55, paperY);
  ctx.lineTo(paperX + 55, paperY + paperH);
  ctx.stroke();
  ctx.restore();

  // Draw typed lines
  ctx.save();
  for (const line of state.lines) {
    const ly = line.y - state.paperOffset;
    if (ly < paperY - 20 || ly > paperY + paperH + 20) continue;

    ctx.globalAlpha = line.opacity;
    ctx.font = `${FONT_SIZE}px ${FONT}`;
    ctx.fillStyle = '#2a2520';

    // Slight unevenness
    const chars = line.text.split('');
    let cx = paperX + 60;
    for (const ch of chars) {
      const charY = ly + (Math.random() - 0.5) * 0.5;
      // Ink variation
      const inkVar = Math.random() * 0.05;
      ctx.fillStyle = `rgba(30,25,20,${0.8 - inkVar})`;
      ctx.fillText(ch, cx, charY);
      cx += 9.5;
    }
  }
  ctx.restore();

  // Ink drops (smudges)
  ctx.save();
  for (const drop of state.inkDrops) {
    const dy = drop.y - state.paperOffset;
    if (dy < paperY || dy > paperY + paperH) continue;
    ctx.globalAlpha = drop.opacity;
    ctx.fillStyle = '#1a1510';
    ctx.beginPath();
    ctx.arc(drop.x - paperX + paperX, dy, drop.radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Current line being typed
  if (state.phase !== 'tearing' && state.phase !== 'loading') {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.font = `${FONT_SIZE}px ${FONT}`;
    ctx.fillStyle = '#2a2520';

    const visibleText = state.currentLine.substring(0, state.charIndex);
    let cx = paperX + 60;
    for (const ch of visibleText) {
      ctx.fillText(ch, cx, state.currentLineY);
      cx += 9.5;
    }

    // Blinking cursor
    if (Math.floor(performance.now() / 530) % 2 === 0 && state.phase === 'striking') {
      ctx.fillStyle = '#1a1510';
      ctx.fillRect(cx, state.currentLineY - 14, 2, 16);
    }
    ctx.restore();
  }
}

function drawTypewriter() {
  const centerX = W * 0.5;
  const baseY = H - 80;

  // Typewriter body
  ctx.save();

  // Main body
  const bodyGrad = ctx.createLinearGradient(centerX - 200, baseY - 100, centerX + 200, baseY);
  bodyGrad.addColorStop(0, '#3a3530');
  bodyGrad.addColorStop(0.5, '#4a4540');
  bodyGrad.addColorStop(1, '#2a2520');
  ctx.fillStyle = bodyGrad;

  // Body shape
  ctx.beginPath();
  ctx.moveTo(centerX - 220, baseY - 20);
  ctx.lineTo(centerX - 240, baseY + 60);
  ctx.lineTo(centerX + 240, baseY + 60);
  ctx.lineTo(centerX + 220, baseY - 20);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#1a1510';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Platen (roller)
  ctx.fillStyle = '#1a1a18';
  ctx.beginPath();
  ctx.ellipse(centerX, baseY - 30, 260, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2a2a28';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Platen highlights
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(centerX, baseY - 35, 240, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Carriage
  const carriageX = centerX + (state.carriageX - TYPE_X) * 2;
  ctx.fillStyle = '#5a5550';
  ctx.fillRect(carriageX - 180, baseY - 55, 360, 30);
  ctx.strokeStyle = '#2a2520';
  ctx.lineWidth = 1;
  ctx.strokeRect(carriageX - 180, baseY - 55, 360, 30);

  // Carriage return lever
  ctx.fillStyle = '#6a6560';
  ctx.beginPath();
  ctx.moveTo(centerX + 220, baseY - 50);
  ctx.lineTo(centerX + 260, baseY - 60);
  ctx.lineTo(centerX + 260, baseY - 30);
  ctx.lineTo(centerX + 220, baseY - 25);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#2a2520';
  ctx.stroke();

  // Type bar
  const typeBarX = carriageX;
  const typeBarY = baseY - 55 - state.typeBarY;

  // Type bar arm
  ctx.strokeStyle = '#5a5550';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(typeBarX, baseY - 45);
  ctx.lineTo(typeBarX, typeBarY + 5);
  ctx.stroke();

  // Type bar head (the striking part)
  if (state.typeBarActive) {
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(state.strikeProgress * Math.PI) * 0.3;
    ctx.fillStyle = '#8a8580';
    ctx.beginPath();
    ctx.arc(typeBarX, typeBarY + 5, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Type bar head (normal)
  ctx.fillStyle = '#6a6560';
  ctx.beginPath();
  ctx.arc(typeBarX, typeBarY + 5, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2a2520';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Keyboard area
  ctx.fillStyle = '#2a2520';
  ctx.fillRect(centerX - 180, baseY + 10, 360, 50);

  // Keys
  const keyRows = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M']
  ];
  const keyW = 22;
  const keyH = 16;
  let keyY = baseY + 15;
  for (let row = 0; row < keyRows.length; row++) {
    const rowKeys = keyRows[row];
    const rowW = rowKeys.length * (keyW + 3) - 3;
    const rowStartX = centerX - rowW / 2;
    for (let col = 0; col < rowKeys.length; col++) {
      const kx = rowStartX + col * (keyW + 3);
      // Key
      ctx.fillStyle = '#1a1510';
      ctx.beginPath();
      ctx.roundRect(kx, keyY, keyW, keyH, 3);
      ctx.fill();
      ctx.strokeStyle = '#3a3530';
      ctx.lineWidth = 0.5;
      ctx.stroke();
      // Key label
      ctx.fillStyle = '#8a8580';
      ctx.font = '9px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(rowKeys[col], kx + keyW / 2, keyY + keyH / 2);
    }
    keyY += keyH + 4;
  }

  // Bell
  const bellX = centerX + 180;
  const bellY = baseY - 40;
  ctx.fillStyle = '#8a7a50';
  ctx.beginPath();
  ctx.arc(bellX, bellY, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#5a4a30';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Bell clapper
  ctx.fillStyle = '#6a5a40';
  ctx.beginPath();
  ctx.arc(bellX, bellY + 3, 3, 0, Math.PI * 2);
  ctx.fill();

  // Bell flash
  if (state.bellFlash > 0) {
    ctx.save();
    ctx.globalAlpha = state.bellFlash * 0.6;
    ctx.fillStyle = '#ffdd88';
    ctx.beginPath();
    ctx.arc(bellX, bellY, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Paper guide
  ctx.fillStyle = '#4a4540';
  ctx.fillRect(centerX - 250, baseY - 60, 10, 30);
  ctx.fillRect(centerX + 240, baseY - 60, 10, 30);

  ctx.restore();
}

function drawDeskLamp() {
  // Lamp glow
  const lampX = W * 0.75;
  const lampY = 0;

  // Lamp arm
  ctx.save();
  ctx.strokeStyle = '#5a5040';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(lampX, 0);
  ctx.quadraticCurveTo(lampX, H * 0.3, W * 0.5, H * 0.45);
  ctx.stroke();

  // Lamp shade
  ctx.fillStyle = '#8a7a50';
  ctx.beginPath();
  ctx.moveTo(W * 0.5 - 40, H * 0.45);
  ctx.lineTo(W * 0.5 + 40, H * 0.45);
  ctx.lineTo(W * 0.5 + 60, H * 0.48);
  ctx.lineTo(W * 0.5 - 60, H * 0.48);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#5a4a30';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Light beam
  const lightGrad = ctx.createRadialGradient(W * 0.5, H * 0.48, 10, W * 0.5, H * 0.5, W * 0.5);
  lightGrad.addColorStop(0, 'rgba(255,220,150,0.25)');
  lightGrad.addColorStop(0.5, 'rgba(255,200,120,0.1)');
  lightGrad.addColorStop(1, 'rgba(255,180,100,0)');
  ctx.fillStyle = lightGrad;
  ctx.beginPath();
  ctx.moveTo(W * 0.5 - 60, H * 0.48);
  ctx.lineTo(W * 0.1, H);
  ctx.lineTo(W * 0.9, H);
  ctx.lineTo(W * 0.5 + 60, H * 0.48);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Warm overlay
  ctx.save();
  const overlayGrad = ctx.createRadialGradient(W * 0.5, H * 0.5, W * 0.1, W * 0.5, H * 0.5, W * 0.7);
  overlayGrad.addColorStop(0, 'rgba(255,210,140,0.08)');
  overlayGrad.addColorStop(0.5, 'rgba(200,160,100,0.04)');
  overlayGrad.addColorStop(1, 'rgba(20,15,10,0.6)');
  ctx.fillStyle = overlayGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawDesk() {
  // Desk surface
  const deskY = H - 80;
  const deskGrad = ctx.createLinearGradient(0, deskY, 0, H);
  deskGrad.addColorStop(0, '#3a2a1a');
  deskGrad.addColorStop(0.3, '#2a1a0a');
  deskGrad.addColorStop(1, '#1a0a00');
  ctx.fillStyle = deskGrad;
  ctx.fillRect(0, deskY, W, H - deskY);

  // Desk edge
  ctx.strokeStyle = '#4a3a2a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, deskY);
  ctx.lineTo(W, deskY);
  ctx.stroke();

  // Wood grain
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  for (let i = 0; i < 30; i++) {
    const gy = deskY + 10 + Math.random() * (H - deskY - 20);
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.bezierCurveTo(W * 0.3, gy + (Math.random() - 0.5) * 10, W * 0.7, gy + (Math.random() - 0.5) * 10, W, gy);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTearEffect() {
  if (state.phase !== 'tearing') return;

  const paperW = W * 0.55;
  const paperX = (W - paperW) / 2;
  const paperH = PAGE_HEIGHT;
  const tearY = 100 + state.tearProgress * (paperH + 100);

  // Torn edge effect
  ctx.save();
  ctx.strokeStyle = '#d4c9b8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(paperX, tearY);
  const segments = 30;
  for (let i = 0; i <= segments; i++) {
    const tx = paperX + (paperW / segments) * i;
    const ty = tearY + Math.sin(i * 2.5) * 3 + Math.random() * 2;
    ctx.lineTo(tx, ty);
  }
  ctx.stroke();
  ctx.restore();

  // Rising paper
  ctx.save();
  ctx.globalAlpha = 1 - state.tearProgress;
  ctx.fillStyle = '#f5f0e8';
  ctx.fillRect(paperX, tearY, paperW, paperH * state.tearProgress);
  ctx.restore();
}

function drawLoadEffect() {
  if (state.phase !== 'loading') return;

  const paperW = W * 0.55;
  const paperX = (W - paperW) / 2;
  const paperH = PAGE_HEIGHT;

  ctx.save();
  ctx.globalAlpha = state.loadProgress;
  ctx.fillStyle = '#f5f0e8';
  const loadY = 100 + (1 - state.loadProgress) * paperH;
  ctx.fillRect(paperX, loadY, paperW, paperH * state.loadProgress);
  ctx.strokeStyle = '#d4c9b8';
  ctx.lineWidth = 1;
  ctx.strokeRect(paperX, loadY, paperW, paperH * state.loadProgress);
  ctx.restore();
}

function drawVignette() {
  const grad = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawPageIndicator() {
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#c4a878';
  ctx.font = '12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(`Page ${state.currentPage + 1}`, W / 2, H - 20);
  ctx.restore();
}

function draw() {
  // Background
  ctx.fillStyle = '#1a1410';
  ctx.fillRect(0, 0, W, H);

  // Desk
  drawDesk();

  // Paper
  drawPaper();

  // Typewriter
  drawTypewriter();

  // Tear effect
  drawTearEffect();

  // Load effect
  drawLoadEffect();

  // Desk lamp lighting
  drawDeskLamp();

  // Vignette
  drawVignette();

  // Page indicator
  drawPageIndicator();
}

let lastTime = performance.now();
function loop(time) {
  const dt = Math.min(time - lastTime, 50);
  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

// Polyfill roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
  };
}

// Trigger bell periodically
setInterval(() => {
  if (state.phase === 'idle' || state.phase === 'pausing') {
    state.bellFlash = 1;
  }
}, 8000 + Math.random() * 5000);

initPage();
state.phase = 'idle';
state.pauseTimer = 1000;
requestAnimationFrame(loop);
</script>
</body>
</html>
