<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS Hero</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f1117;
  color: #fff;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
}

/* Blobs */
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
}

.blob1 {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, #6366f1, transparent 70%);
  top: -100px;
  left: -100px;
  animation: drift 28s ease-in-out infinite;
}

.blob2 {
  width: 350px;
  height: 350px;
  background: radial-gradient(circle, #a855f7, transparent 70%);
  bottom: -80px;
  right: -80px;
  animation: drift2 35s ease-in-out infinite;
}

.blob3 {
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, #ec4899, transparent 70%);
  top: 50%;
  right: 100px;
  animation: drift3 30s ease-in-out infinite;
}

@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(-20px, 30px) scale(1.05); }
  50% { transform: translate(0, -20px) scale(0.95); }
  75% { transform: translate(20px, 10px) scale(1.02); }
}

@keyframes drift2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -20px) scale(1.08); }
  50% { transform: translate(-10px, 20px) scale(0.97); }
  75% { transform: translate(20px, 0) scale(1.03); }
}

@keyframes drift3 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(-30px, -10px) scale(1.04); }
  50% { transform: translate(10px, 30px) scale(0.96); }
  75% { transform: translate(-20px, -20px) scale(1.01); }
}

/* Navbar */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  z-index: 100;
  backdrop-filter: blur(12px);
  background: rgba(15, 17, 23, 0.6);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.nav .logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 700;
  font-size: 1.2rem;
  color: #fff;
  text-decoration: none;
}

.logo-mark {
  width: 26px;
  height: 26px;
  position: relative;
}

.logo-mark::before,
.logo-mark::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, #6366f1, #a855f7);
  border-radius: 2px;
  transition: all 0.3s ease;
}

.logo-mark::before {
  top: 0;
  transform: rotate(0deg);
}

.logo-mark::after {
  bottom: 0;
  transform: rotate(0deg);
}

.logo-mark:hover::before {
  transform: rotate(45deg) translate(3px, 3px);
}

.logo-mark:hover::after {
  transform: rotate(-45deg) translate(3px, -3px);
}

.nav-links {
  display: flex;
  gap: 1.5rem;
}

.nav-links a {
  text-decoration: none;
  color: #cbd5e1;
  font-size: 0.95rem;
  transition: color 0.2s ease;
}

.nav-links a:hover {
  color: #fff;
}

/* Content */
.hero-content {
  max-width: 700px;
  margin-top: 4rem;
}

h1 {
  font-size: clamp(2.4rem, 6vw, 4rem);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 1.2rem;
  background: linear-gradient(90deg, #ffffff 20%, #6366f1 50%, #a855f7 80%, #ffffff);
  background-size: 250% auto;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: reveal 1.4s cubic-bezier(0.22, 1, 0.35, 1) forwards;
  opacity: 0;
  mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
}

@keyframes reveal {
  0% {
    opacity: 0;
    transform: translateY(40px);
    mask-size: 100% 0;
  }
  100% {
    opacity: 1;
    transform: translateY(0);
    mask-size: 100% 100%;
  }
}

.subheadline {
  font-size: clamp(1.1rem, 2.5vw, 1.3rem);
  color: #94a3b8;
  margin-bottom: 2rem;
  line-height: 1.6;
  animation: fadeInUp 0.8s ease forwards;
  opacity: 0;
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.cta-row {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 2rem;
}

.btn {
  padding: 0.85rem 2rem;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: linear-gradient(135deg, #6366f1, #a855f7);
  border: 2px solid transparent;
  color: white;
}

.btn-primary::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 14px;
  z-index: -1;
  background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899, #6366f1);
  opacity: 0;
  transition: opacity 0.5s ease;
  animation: spinBorder 3s linear infinite;
  animation-play-state: paused;
}

.btn-primary:hover::before {
  animation-play-state: running;
  opacity: 1;
}

@keyframes spinBorder {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #e2e8f0;
  backdrop-filter: blur(8px);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.15);
  transform: translateY(-2px);
}

/* Sequence animations */
.subheadline {
  animation-delay: 0.3s;
}

.cta-row {
  animation: fadeInUp 0.8s ease 0.6s forwards;
  opacity: 0;
}
</style>
</head>
<body>
  <!-- Nav -->
  <nav class="nav">
    <a href="#" class="logo">
      <span class="logo-mark"></span>
      <span>SaaSFlow</span>
    </a>
    <div class="nav-links">
      <a href="#">Product</a>
      <a href="#">Solutions</a>
      <a href="#">Pricing</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <!-- Floating Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <!-- Hero -->
  <div class="hero-content">
    <h1>Supercharge Your Workflow with AI-Powered Insights</h1>
    <p class="subheadline">Built for teams who move fast and ship faster. Get real-time analytics, seamless integrations, and predictive intelligence — all in one elegant platform.</p>
    <div class="cta-row">
      <button class="btn btn-primary">Start Free Trial</button>
      <button class="btn btn-secondary">Watch Demo</button>
    </div>
  </div>

  <script>
    // Reveal animation for subheadline with slight delay sequence
    document.addEventListener("DOMContentLoaded", () => {
      const sub = document.querySelector(".subheadline");
      const ctaRow = document.querySelector(".cta-row");
      sub.style.animationDelay = "0.3s";
      ctaRow.style.animationDelay = "0.6s";
    });
  </script>
</body>
</html>
