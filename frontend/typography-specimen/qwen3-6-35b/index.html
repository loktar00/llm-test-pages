<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINETIC — Type Specimen</title>
    <style>
        :root {
            /* Palette */
            --bg: #050505;
            --fg: #f0f0f0;
            --accent: #3b82f6;
            --muted: #444444;
            --subtle: #2a2a2a;

            /* Typography Defaults */
            --base-size: 16px;
            --scale-ratio: 1.25;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Interactive State */
            --active-size: 1.0;
            --active-weight: 400;
            --active-tracking: 0;

            /* Spacing */
            --space-unit: 1rem;
            --grid-gap: 2rem;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-family);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Layout & Utility --- */
        .
