<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heightmap</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    overflow: hidden;
    width: 100;
    height: 100;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  canvas {
    display: block;
    box-shadow: 0 2px 60px rgba(0,0,0,.7);
    border-radius: 4px;
    max-width: 90vw;
    max-height: 90vmax;
  }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const SIZE = 512;
  const STEP = 8;
  const COLS = SIZE / STEP;
  const ROWS = SIZE / STEP;
  const N = COLS + 1;

  function hashCoord(x, y) {
    const r = Math.sin(x * 12.9897 + y * 78.234) * 4378.5453;
    return (Math.abs(r) % 1);
  }

  function hash2(x, y) {
    const a = Math.sin(x * 127.1 + y * 311.10) * 4378.5453;
    return (a - Math.floor(a));
  }

  function valueNoise(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;

    const a = hash2(xi, yi);
    const b = hash2(xi + 1, yi);
    const c = hash2(xi, yi + 1);
    const d = hash2(xi + 1, yi + 1);

    const u = 1 - Math.pow(1 - xf, 3);
    const v = 1 - Math.pow(1 - yf, 3);

    const ab = a + (b - a) * u;
    const cd = c + (d - c) * u;
    return ab + (cd - ab) * v;
  }

  function fbm(x, y) {
    let v = 0;
    let amp = 0.5;
    let freq = 1;
    for (let i = 0; i < 5; i++) {
      v += valueNoise(x * freq, y * freq) * amp;
      freq *= 2.5;
      amp *= 0.45;
    }
    return v / 1.2;
  }

  function fbm2(x, y) {
    let v = 0;
    let amp = 0.5;
    let freq = 1;
    for (let i = 0; i < 4; i++) {
      v += valueNoise((x + 100) * freq, (y + 100) * freq) * amp;
      freq *= 2.2;
      amp *= 0.4;
    }
    return v;
  }

  function fbm3(x, y) {
    let v = 0;
    let amp = 0.5;
    let freq = 1;
    for (let i = 0; i < 4; i++) {
      v += valueNoise((x + 300) * freq, (y + 300) * freq) * amp;
      freq *= 2.0;
      amp *= 0.4;
    }
    return v;
  }

  function midpointDisplacement(h, size, rough) {
    const n = size + 1;
    const step = size;
    const r = rough;
    while (step > 1) {
      const half = step >> 1;

      const halfStep = step * 0.5;

      for (let y = halfStep; y < n; y += step) {
        for (let x = halfStep; x < n; x += step) {
          const sum =
            h[(y - halfStep) * n + (x - halfStep)] +
            h[(y - halfStep) * n + (x + halfStep)] +
            h[(y + halfStep) * n + (x - halfStep)] +
            h[(y + halfStep) * n + (x + halfStep)];
          h[y * n + x] = (sum / 4) + (Math.random() * 2 - 1) * r;
        }
      }

      for (let y = 0; y < n; y += step) {
        for (let x = step; x < n; x += step) {
          const sum =
            h[(y) * n + (x - halfStep)] +
            h[(y) * n + (x + halfStep)] +
            h[(Math.max(y - halfStep, 0)) * n + (x)] +
            h[(Math.min(y + halfStep, size)) * n + (x)];
          h[y * n + x] = (sum / 4) + (Math.random() * 2 - 1) * r;
        }
      }

      for (let x = 0; x < n; x += step) {
        for (let y = step; y < n; y += step) {
          const sum =
            h[(Math.max(y - halfStep, 0)) * n + (x)] +
            h[(y + halfStep) * n + (x)] +
            h[(y) * n + (Math.max(x - halfStep, 0))] +
            h[(y) * n + (Math.min(x + halfStep, size))];
          h[y * n + x] = (sum / 4) + (Math.random() * 2 - 1) * r;
        }
      }

      step = half;
      r *= 0.6;
    }
  }

  const h = new Float32Array(N * N);
  const base = 0.0;
  const range = 1.0;
  h[0] = base + Math.random() * range;
  h[size] = base + Math.random() * range;
  h[size * N] = base + Math.random() * range;
  h[size * N + size] = base + Math.random() * range;
  midpointDisplacement(h, size, 0.75);

  const hMin = h.reduce((a, b) => Math.min(a, b), Infinity);
  let hMax = -Infinity;
  for (let i = 0; i < h.length; i++) {
    if (h[i] > hMax) hMax = h[i];
  }
  const hRange = hMax - hMin || 1;
  for (let i = 0; i < h.length; i++) {
    h[i] = (h[i] - hMin) / hRange;
  }

  const imgData = ctx.createImageData(SIZE, SIZE);
  const pixels = imgData.data;

  const snowNoise = new Float32Array(COLS * ROWS);
  for (let i = 0; i < COLS; i++) {
    for (let j = 0; j < ROWS; j++) {
      const x = i / COLS * 4;
      const y = j / ROWS * 4;
      snowNoise[i * ROWS + j] = fbm3(x * 0.5, y * 0.5);
    }
  }

  const grad = new Float32Array(256 * 2);
  for (let i = 0; i < 256; i++) {
    const angle = (i / 256) * Math.PI * 2;
    grad[i * 2] = Math.cos(angle);
    grad[i * 2 + 1] = Math.sin(angle);
  }

  function gradDot(hash, x, y) {
    const g = grad[hash * 2];
    const g2 = grad[hash * 2 + 1];
    return g * x + g2 * y;
  }

  function perlin(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;

    const u = 1 - Math.pow(1 - xf, 5);
    const v = 1 - Math.pow(1 - yf, 5);

    const aa = hash2(xi, yi);
    const ba = hash2(xi + 1, yi);
    const ab = hash2(xi, yi + 1);
    const bb = hash2(xi + 1, yi + 1);

    const x1 = gradDot(aa, xf, yf);
    const x2 = gradDot(ba, xf - 1, yf);
    const y1 = gradDot(ab, xf, yf - 1);
    const y2 = gradDot(bb, xf - 1, yf - 1);

    const xa = x1 + (x2 - x1) * u;
    const yb = y1 + (y2 - y1) * u;
    return (xa + (yb - xa) * v) * 0.5 + 0.5;
  }

  function smoothstep(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t * t * (3 - 2 * t);
  }

  function getColor(height, snow, detail, detail2, px, py) {
    if (height < 0.36) {
      const t = height / 0.36;
      const r = 10 + t * 30;
      const g = 30 + t * 60;
      const b = 75 + t * 100;
      return [r, g, b];
    }
    if (height < 0.42) {
      const t = (height - 0.36) / (0.42 - 0.36);
      const r = 40 + t * 180 + detail * 20;
      const g = 30 + t * 160 + detail2 * 20;
      const b = 40 + t * 60;
      return [r, g, b];
    }
    if (height < 0.5) {
      const t = (height - 0.42) / (0.5 - 0.42);
      const r = 220 + t * 25 + detail * 20;
      const g = 185 + t * 25 + detail2 * 15;
      const b = 145 + t * 20;
      return [r, g, b];
    }
    if (height < 0.55) {
      const t = (height - 0.5) / (0.55 - 0.5);
      const r = 40 + t * 60 + detail * 40;
      const g = 75 + t * 70 + detail2 * 25;
      const b = 40 + t * 60;
      return [r, g, b];
    }
    if (height < 0.72) {
      const t = (height - 0.55) / (0.72 - 0.55);
      const r = 100 + t * 60 + detail * 50;
      const g = 145 + t * 50 + detail2 * 40;
      const b = 100 + t * 40;
      return [r, g, b];
    }
    if (height < 0.85) {
      const t = (height - 0.72) / (0.85 - 0.72);
      const r = 160 + t * 50 + detail * 30;
      const g = 160 + t * 50 + detail2 * 25;
      const b = 160 + t * 25;
      return [r, g, b];
    }
    if (height < 0.92) {
      const t = (height - 0.85) / (0.92 - 0.85);
      const base = 200 + t * 30;
      const sn = smoothstep((snow - 0.5) * 2);
      const r = base * (1 - sn) + 250 * sn;
      const g = base * (1 - sn) + 250 * sn;
      const b = base * (1 - sn) + 255 * sn;
      return [r, g, b];
    }
    const t = (height - 0.92) / (1 - 0.92);
    const base = 230 + t * 15;
    const r = base;
    const g = base;
    const b = base;
    return [r, g, b];
  }

  function bilinear(x, y) {
    const gx = Math.floor(x);
    const gy = Math.floor(y);
    const tx = x - gx;
    const ty = y - gy;

    const h0 = h[gy * N + gx];
    const h1 = h[gy * N + gx + 1];
    const h2 = h[(gy + 1) * N + gx];
    const h3 = h[(gy + 1) * N + gx + 1];
    const hTop = h0 + (h1 - h0) * tx;
    const hBottom = h2 + (h3 - h2) * tx;
    return hTop + (hBottom - hTop) * ty;
  }

  function bilinearSnow(x, y) {
    const gx = Math.floor(x);
    const gy = Math.floor(y);
    const tx = x - gx;
    const ty = y - gy;

    const h0 = snowNoise[gy * ROWS + gx];
    const h1 = snowNoise[gy * ROWS + gx + 1];
    const h2 = snowNoise[(gy + 1) * ROWS + gx];
    const h3 = snowNoise[(gy + 1) * ROWS + gx + 1];
    const hTop = h0 + (h1 - h0) * tx;
    const hBottom = h2 + (h3 - h2) * tx;
    return hTop + (hBottom - hTop) * ty;
  }

  function normalAt(x, y) {
    const gx = Math.floor(x);
    const gy = Math.floor(y);
    const tx = x - gx;
    const ty = y - gy;

    const h00 = h[gy * N + gx];
    const h10 = h[gy * N + gx + 1];
    const h02 = h[gy * N + gx + 2];
    const h01 = h[gy * N + gx - 1 >= 0 ? gx - 1 : 0];
    const h02y = h[gy * N + gx + 1];
    const h11 = h[(gy + 1) * N + gx];
    const h21 = h[(gy + 1) * N + gx + 1];
    const hm1 = h[(gy - 1 >= 0 ? gy - 1 : 0) * N + gx];
    const h_m1 = h[(gy - 1 >= 0 ? gy - 1 : 0) * N + gx + 1];

    const topRight = h00 + (h10 - h00) * tx + (h02 - h10) * ty * (1 - tx) * 0;
    const right = h10 + (h02 - h10) * tx;
    const top = h00;
    const bottom = h11 + (h21 - h11) * tx;
    const bottomLeft = hm1 + (h_m1 - hm1) * tx;

    const hL = h01;
    const hR = h02;
    const hUp = hm1;
    const hDown = h21;

    const nx = hR - hL;
    const ny = hDown - hUp;
    const nz = 2.0 / (N * 0.12);

    const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
    return [nx / len, ny / len, nz / len];
  }

  const L = [0.5, -0.4, 0.75];
  let lLen = Math.sqrt(L[0] * L[0] + L[1] * L[1] + L[2] * L[2]);
  L[0] /= lLen; L[1] /= lLen; L[2] /= lLen;

  const px = new Uint8ClampedArray(SIZE * 4);
  const p = new Uint32Array(SIZE);

  let pi = 0;
  for (let i = 0; i < SIZE; i++) {
    p[i] = i;
  }

  function heightAt(x, y) {
    const gx = Math.floor(x);
    const gy = Math.floor(y);
    const tx = x - gx;
    const ty = y - gy;

    const h00 = h[gy * N + gx];
    const h10 = h[gy * N + gx + 1];
    const h02 = h[gy * N + gx + 2];
    const h01 = h[gy * N + Math.max(gx - 1, 0)];
    const h22 = h[gy * N + gx + 2];

    return h00 + (h10 - h00) * tx;
  }

  function shadeAt(px, py) {
    const gx = Math.floor(px / STEP);
    const gy = Math.floor(py / STEP);
    const tx = (px / STEP) - gx;
    const ty = (py / STEP) - gy;

    const h00 = h[gy * N + gx];
    const h10 = h[gy * N + gx + 1];
    const h20 = h[gy * N + gx + 2];
    const h01 = h[gy * N + Math.max(gx - 1, 0)];
    const h0_1 = h[(Math.max(gy - 1, 0)) * N + gx];
    const h11 = h[(gy + 1) * N + gx];
    const h21 = h[(gy + 1) * N + gx + 1];
    const h2_1 = h[(Math.max(gy - 1, 0)) * N + gx + 1];

    const hL = h01 + (h[gy * N + Math.max(gx - 1, 0)] - h01) * tx;
    const hR = h10 + (h20 - h10) * tx;
    const hU = h0_1 + (h2_1 - h0_1) * tx;
    const hD = h11 + (h21 - h11) * tx;

    const dx = (hR - hL) * 0.5;
    const dy = (hD - hU) * 0.5;
    const dz = 1.0 / (N * 0.16);

    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const nz = 1.0 / (N * 0.16);
    const len2 = Math.sqrt(dx * dx + dy * dy + nz * nz);
    const nx = dx / len2;
    const ny_ = dy / len2;
    const nz2 = nz / len2;

    const diff = Math.max(0, nx * L[0] + ny_ * L[1] + nz2 * L[2]);

    const x = px / SIZE * 2;
    const y = py / SIZE * 2;
    const detail = fbm(x * 50, y * 50);
    const detail2 = fbm2(x * 25, y * 25);
    const detail3 = perlin(x * 100, y * 100);

    const height = h00 + (h10 - h00) * tx + (h11 - h10) * ty * tx;
    const snowAt = bilinearSnow(px / SIZE * COLS, py / SIZE * ROWS);
    const col = getColor(height, snowAt, detail, detail2, px, py);

    const shade = 0.4 + diff * 0.6 + detail3 * 0.15;
    const r = Math.min(255, col[0] * shade);
    const g = Math.min(255, col[1] * shade);
    const b = Math.min(255, col[2] * shade);

    return [r, g, b];
  }

  const data = imgData.data;
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const col = shadeAt(x, y);
      const idx = (y * SIZE + x) * 4;
      data[idx + 0] = col[0];
      data[idx + 1] = col[1];
      data[idx + 2] = col[2];
      data[idx + 3] = 255;
    }
  }

  ctx.putImageData(imgData, 0, 0);
})();
</script>
</body>
</html>
