<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Downhill Sled</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = window.innerWidth, H = window.innerHeight;
canvas.width = W;
canvas.height = H;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

// --- Constants ---
const SEGMENT_W = 3;
const TERRAIN_LOOKAHEAD = 3000;
const GRAVITY = 0.35;
const FRICTION = 0.998;
const SLED_LENGTH = 30;
const SCARF_SEGMENTS = 12;
const SCARF_SEG_LEN = 8;

// --- State ---
let distTraveled = 0;
let gameTime = 0;
let dayPhase = 0; // 0-1 cycle

// Terrain
let terrainPoints = [];
let terrainGenX = 0;

// Sledder
let sled = {
  x: 200, y: 0,
  vx: 2, vy: 0,
  angle: 0, va: 0,
  grounded: false,
  stuckTimer: 0,
  upsideDown: 0
