<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Koi Pond</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #021a2b; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/**
 * KOI POND SIMULATION
 * A single-file, self-contained HTML5 Canvas implementation.
 * Features:
 * - 6-9 Koi with procedural patterns (Orange/White/Black)
 * - Spline-based smooth swimming physics
 * - Dynamic flexing/bending of fish bodies
 * - Lily pads with distinct blotches
 * - Water caustics, shadows, and refraction
 * - Dragonflies (land and take off)
 * - Ripple physics (crossing waves)
 */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height;
let time = 0;

// --- CONFIGURATION ---
const FISH_COUNT = 8;
const PAD_COUNT = 12;
const DRAGONFLY_COUNT = 3;
const RIPPLE_MAX_RADIUS = 300;
const RIPPLE_LIFETIME = 150; // frames
const RIPPLE_SPEED = 2;

// --- UTILS ---
const rand = (min, max) => Math.random() * (max - min) + min;
const dist = (x1, y1, x2, y2) => Math.sqrt((x1 - x2) ** 2 + (y1 - y2) ** 2);

// --- STATE ---
const ripples = [];
const dragonflies = [];
const pads = [];
const fish = [];

// --- CLASSES ---

class Ripple {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.r = 0;
        this.life = RIPPLE_LIFETIME;
        this.maxR = RIPPLE_MAX_RADIUS;
    }

    update() {
        this.r += RIPPLE_SPEED;
        this.life--;
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life / RIPPLE_LIFETIME) * 0.3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

class Dragonfly {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = rand(0, width);
        this.y = rand(0, height);
        this.angle = rand(0, Math.PI * 2);
        this.state = 'flying'; // flying, landing, resting, takeoff
        this.targetX = rand(0, width);
        this.targetY = rand(0, height);
        this.speed = rand(1, 2);
        this.restTimer = 0;
    }

    update() {
        if (this.state === 'flying') {
            const dx = this.targetX - this.x;
            const dy = this.targetY - this.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            
            if (d < 10) {
                this.state = 'landing';
            } else {
                this.angle = Math.atan2(dy, dx);
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }
        } else if (this.state === 'landing') {
            // Find a pad to land on
            let closestPad = null;
            let minDist = Infinity;
            pads.forEach(p => {
                const d = dist(this.x, this.y, p.x, p.y);
                if (d < minDist) { minDist = d; closestPad = p; }
            });

            if (closestPad) {
                this.x += (closestPad.x - this.x) * 0.05;
                this.y += (closestPad.y - this.y) * 0.05;
                if (minDist < 5) {
                    this.state = 'resting';
                    this.restTimer = rand(100, 300);
                }
            } else {
                this.state = 'flying'; // fallback
            }
        } else if (this.state === 'resting') {
            this.restTimer--;
            if (this.restTimer <= 0) {
                this.state = 'takeoff';
            }
        } else if (this.state === 'takeoff') {
            this.x += Math.cos(this.angle) * 4;
            this.y += Math.sin(this.angle) * 4;
            if (this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) {
                this.reset();
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        if (this.state === 'flying' || this.state === 'takeoff') {
            ctx.rotate(this.angle);
            // Wings
            const wingFlap = Math.sin(time * 0.8) * 0.5;
            ctx.fillStyle = 'rgba(200, 230, 255, 0.8)';
            ctx.beginPath();
            ctx.ellipse(0, -3, 8, 2, wingFlap, 0, Math.PI*2);
            ctx.ellipse(0, 3, 8, 2, -wingFlap, 0, Math.PI*2);
            ctx.fill();
            // Body
            ctx.fillStyle = '#111';
            ctx.fillRect(-6, -0.5, 12, 1);
        } else {
            // Resting
            ctx.fillStyle = '#111';
            ctx.fillRect(-6, -0.5, 12, 1);
        }
        ctx.restore();
    }
}

class LilyPad {
    constructor() {
        this.x = rand(50, width - 50);
        this.y = rand(50, height - 50);
        this.size = rand(20, 45);
        this.rot = rand(0, Math.PI * 2);
        this.blotch = rand(0, 1); // 0=green, 1=yellowish
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.beginPath();
        ctx.ellipse(4, 4, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Leaf
        ctx.fillStyle = `hsl(130, 60%, ${this.blotch > 0.5 ? 40 : 30}%)`;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, this.size, 0.2, Math.PI * 2 - 0.2);
        ctx.lineTo(0, 0);
        ctx.fill();
        
        // Veins
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(this.size * 0.8, 0);
        ctx.stroke();

        ctx.restore();
    }
}

class Koi {
    constructor() {
        this.x = rand(0, width);
        this.y = rand(0, height);
        this.vx = rand(-1, 1);
        this.vy = rand(-1, 1);
        this.speed = rand(0.5, 1.5);
        this.turnSpeed = rand(0.01, 0.03);
        this.segments = 20;
        this.segmentLength = 4;
        
        // Appearance
        this.type = Math.floor(rand(0, 3)); // 0: Orange, 1: White, 2: Black/Red
        this.pat = [];
        for(let i=0; i<this.segments; i++) {
            this.pat.push(rand(0, 1));
        }
        
        // Wobble
        this.wobblePhase = rand(0, Math.PI * 2);
    }

    update() {
        // Movement Logic
        this.vx += (rand(-1, 1) * 0.1);
        this.vy += (rand(-1, 1) * 0.1);
        
        // Normalize speed
        const currentSpeed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        if (currentSpeed > this.speed * 1.5) {
            this.vx = (this.vx / currentSpeed) * this.speed;
            this.vy = (this.vy / currentSpeed) * this.speed;
        }

        this.x += this.vx;
        this.y += this.vy;

        // Wall avoidance (soft)
        const margin = 50;
        if (this.x < margin) this.vx += 0.2;
        if (this.x > width - margin) this.vx -= 0.2;
        if (this.y < margin) this.vy += 0.2;
        if (this.y > height - margin) this.vy -= 0.2;

        // Occasional ripples
        if (Math.random() < 0.005) {
            ripples.push(new Ripple(this.x, this.y));
        }

        this.wobblePhase += 0.1;
    }

    draw(ctx) {
        // Calculate body path
        // We need to draw the fish backwards from tail to head to handle flex
        const points = [];
        let cx = this.x;
        let cy = this.y;
        let angle = Math.atan2(this.vy, this.vx);

        // Head
        points.push({x: cx, y: cy, angle: angle});

        // Spine curve (reverse)
        for (let i = 1; i < this.segments; i++) {
            // Add sine wave for movement
            const bend = Math.sin(this.wobblePhase - i * 0.3) * 2;
            
            // Get previous angle
            const prevAngle = points[i-1].angle;
            
            // Calculate new point
            const nx = cx - Math.cos(prevAngle) * this.segmentLength - Math.sin(prevAngle) * (bend * 0.1);
            const ny = cy - Math.sin(prevAngle) * this.segmentLength + Math.cos(prevAngle) * (bend * 0.1);
            
            cx = nx;
            cy = ny;
            
            points.push({x: cx, y: cy, angle: prevAngle});
        }

        // Draw Shadow
        ctx.save();
        ctx.translate(4, 6);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#000';
        this.drawShape(ctx, points, true);
        ctx.restore();

        // Draw Fish
        ctx.save();
        this.drawShape(ctx, points, false);
        ctx.restore();
    }

    drawShape(ctx, points, isShadow) {
        // Draw filled shape
        ctx.beginPath();
        
        // Top edge
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        
        // Bottom edge (reverse)
        for (let i = points.length - 1; i >= 0; i--) {
            // Offset slightly for thickness
            const p = points[i];
            const nextP = points[Math.min(i+1, points.length-1)];
            const prevP = points[Math.max(i-1, 0)];
            
            // Normal vector approximation
            let dx = nextP.x - prevP.x;
            let dy = nextP.y - prevP.y;
            let len = Math.sqrt(dx*dx + dy*dy);
            let nx = -dy / len;
            let ny = dx / len;
            
            const thick = (i === 0) ? 3 : (i === points.length-1) ? 0 : 2 + Math.sin(i)*0.5;
            
            ctx.lineTo(p.x + nx * thick, p.y + ny * thick);
        }
        
        ctx.closePath();

        if (isShadow) {
            ctx.fill();
            return;
        }

        // Pattern Gradient
        const grad = ctx.createLinearGradient(points[0].x, points[0].y, points[points.length-1].x, points[points.length-1].y);
        
        // Color logic based on type
        if (this.type === 0) { // Orange
            grad.addColorStop(0, '#ffaa00');
            grad.addColorStop(0.5, '#ffcc00');
            grad.addColorStop(1, '#ffaa00');
        } else if (this.type === 1) { // White
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.5, '#ffeeee');
            grad.addColorStop(1, '#ffffff');
        } else { // Black/Red
            grad.addColorStop(0, '#111');
            grad.addColorStop(0.5, '#333');
            grad.addColorStop(1, '#111');
        }
        
        ctx.fillStyle = grad;
        ctx.fill();

        // Draw Blotches
        // We sample the pattern array along the spine
        ctx.save();
        ctx.clip(); // Clip to body shape
        
        // We draw spots along the spine
        for (let i = 0; i < points.length; i++) {
            if (this.pat[i] > 0.6) {
                ctx.fillStyle = (this.type === 0) ? '#fff' : (this.type === 1) ? '#faa' : '#fa0';
                ctx.beginPath();
                const p = points[i];
                const nextP = points[Math.min(i+1, points.length-1)];
                const prevP = points[Math.max(i-1, 0)];
                let dx = nextP.x - prevP.x;
                let dy = nextP.y - prevP.y;
                let len = Math.sqrt(dx*dx + dy*dy);
                let nx = -dy / len;
                let ny = dx / len;
                
                ctx.arc(p.x, p.y, 2 + Math.sin(i)*0.5, 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.restore();
        
        // Head detail (Eye)
        const head = points[0];
        const next = points[1];
        const eyeAngle = Math.atan2(head.y - next.y, head.x - next.x);
        
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(
            head.x + Math.cos(eyeAngle + 0.5) * 2, 
            head.y + Math.sin(eyeAngle + 0.5) * 2, 
            1, 0, Math.PI*2
        );
        ctx.fill();
    }
}

// --- INITIALIZATION ---

function init() {
    resize();
    
    // Create Fish
    for(let i=0; i<FISH_COUNT; i++) {
        fish.push(new Koi());
    }
    
    // Create Pads
    for(let i=0; i<PAD_COUNT; i++) {
        pads.push(new LilyPad());
    }
    
    // Create Dragonflies
    for(let i=0; i<DRAGONFLY_COUNT; i++) {
        dragonflies.push(new Dragonfly());
    }
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}

window.addEventListener('resize', resize);

// --- RENDER LOOP ---

function drawWaterBackground() {
    // Deep water gradient
    const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
    grad.addColorStop(0, '#0a3a4a');
    grad.addColorStop(1, '#021a2b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Animated Caustics
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#fff';
    
    // Simple moving circles to simulate caustics
    for(let i=0; i<20; i++) {
        const x = (Math.sin(time * 0.005 + i) * width/2) + width/2;
        const y = (Math.cos(time * 0.003 + i * 2) * height/2) + height/2;
        const r = 50 + Math.sin(time * 0.01 + i) * 20;
        
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
}

function loop() {
    time++;
    
    // 1. Background
    drawWaterBackground();
    
    // 2. Update & Draw Ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
        ripples[i].update();
        if (ripples[i].life <= 0) {
            ripples.splice(i, 1);
        } else {
            ripples[i].draw(ctx);
        }
    }
    
    // 3. Lily Pads (Bottom layer)
    pads.forEach(p => p.draw(ctx));
    
    // 4. Fish
    fish.forEach(f => {
        f.update();
        f.draw(ctx);
    });
    
    // 5. Dragonflies
    dragonflies.forEach(d => {
        d.update();
        d.draw(ctx);
    });
    
    // 6. Interaction (Fish nibbling pads)
    fish.forEach(f => {
        pads.forEach(p => {
            const d = dist(f.x, f.y, p.x, p.y);
            if (d < p.size + 20) {
                ripples.push(new Ripple(f.x, f.y));
            }
        });
    });

    requestAnimationFrame(loop);
}

// --- START ---
init();
loop();

</script>
</body>
</html>
