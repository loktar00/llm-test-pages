<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>2D Dynamic Lighting Demo</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body, html { width: 100%; height: 100%; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const W = canvas.width;
  const H = canvas.height;

  // Light sources
  const light1 = { x: W/2, y: H/2, radius: 200, hue: 0 };
  const light2 = { x: W/2, y: H/2, radius: 120, hue: 180 };

  let angle1 = 0;
  let angle2 = Math.PI;

  // Obstacles as polygons (arrays of points)
  const obstacles = [
    [{x:100,y:100},{x:200,y:110},{x:180,y:200},{x:90,y:190}],
    [{x:300,y:150},{x:400,y:140},{x:390,y:230},{x:290,y:240}],
    [{x:500,y:100},{x:580,y:120},{x:560,y:200},{x:490,y:190}],
    [{x:650,y:160},{x:720,y:150},{x:700,y:240},{x:630,y:230}],
    [{x:800,y:110},{x:870,y:130},{x:850,y:200},{x:790,y:190}],
    [{x:250,y:350},{x:330,y:340},{x:310,y:430},{x:240,y:440}],
    [{x:450,y:360},{x:520,y:350},{x:500,y:430},{x:440,y:440}],
    [{x:620,y:370},{x:690,y:360},{x:670,y:440},{x:610,y:450}],
    [{x:780,y:380},{x:850,y:370},{x:830,y:450},{x:770,y:460}],
    [{x:150,y:500},{x:220,y:490},{x:200,y:580},{x:140,y:570}],
    [{x:350,y:510},{x:420,y:500},{x:400,y:590},{x:340,y:600}],
    [{x:550,y:520},{x:620,y:510},{x:600,y:600},{x:540,y:590}]
  ];

  function castShadows(light, polys, maxRadius) {
    const shadows = [];
    for (const poly of polys) {
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i];
        const b = poly[(i + 1) % poly.length];
        const edgeVec = {x: b.x - a.x, y: b.y - a.y};
        const lightVec = {x: a.x - light.x, y: a.y - light.y};
        const cross = edgeVec.x * lightVec.y - edgeVec.y * lightVec.x;

        if (cross > 0) { // Backface culling
          const len = Math.sqrt(edgeVec.x*edgeVec.x + edgeVec.y*edgeVec.y);
          const nx = -edgeVec.y / len;
          const ny = edgeVec.x / len;
          const normalDot = (nx * lightVec.x + ny * lightVec.y);

          let intensity = 1;
          const dist = Math.sqrt(lightVec.x*lightVec.x + lightVec.y*lightVec.y);
          if (dist > 0) {
            intensity = Math.max(0, Math.min(1, 1 - dist / maxRadius));
          }

          shadows.push({
            a: a,
            b: b,
            normal: {x: nx, y: ny},
            intensity: intensity,
            dot: normalDot
          });
        }
      }
    }

    // Generate shadow polygons
    const shadowPolys = [];
    for (const s of shadows) {
      const v1 = {x: s.b.x - s.a.x, y: s.b.y - s.a.y};
      const v2 = {x: s.a.x - light.x, y: s.a.y - light.y};
      const v3 = {x: s.b.x - light.x, y: s.b.y - light.y};
      
      const len = Math.sqrt(v1.x*v1.x + v1.y*v1.y);
      const n = {x: -v1.y/len, y: v1.x/len};
      const ndot = n.x * v2.x + n.y * v2.y;

      if (ndot > 0) {
        const v2len = Math.sqrt(v2.x*v2.x + v2.y*v2.y);
        const v3len = Math.sqrt(v3.x*v3.x + v3.y*v3.y);
        
        if (v2len > 0.1 && v3len > 0.1) {
          const scale = maxRadius / Math.min(v2len, v3len);
          const p1 = {x: light.x + v2.x*scale, y: light.y + v2.y*scale};
          const p2 = {x: light.x + v3.x*scale, y: light.y + v3.y*scale};
          
          shadowPolys.push([
            s.a, s.b, p2, p1
          ]);
        }
      }
    }

    return shadowPolys;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Update light positions
    angle1 += 0.001;
    angle2 += 0.0015;
    
    light1.x = W/2 + Math.cos(angle1) * 250;
    light1.y = H/2 + Math.sin(angle1 * 0.7) * 180;
    light1.hue = (Date.now() * 0.01) % 360;

    light2.x = W/2 + Math.cos(angle2 + Math.PI) * 200;
    light2.y = H/2 + Math.sin(angle2 * 0.6) * 160;

    // Draw obstacles
    for (const poly of obstacles) {
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) {
        ctx.lineTo(poly[i].x, poly[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#333';
      ctx.fill();
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Draw light1 shadows
    const shadows1 = castShadows(light1, obstacles, light1.radius);
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    for (const spoly of shadows1) {
      ctx.beginPath();
      ctx.moveTo(spoly[0].x, spoly[0].y);
      for (let i = 1; i < spoly.length; i++) {
        ctx.lineTo(spoly[i].x, spoly[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#000';
      ctx.fill('evenodd');
    }
    ctx.restore();

    // Draw light1 glow
    const gradient1 = ctx.createRadialGradient(
      light1.x, light1.y, 0,
      light1.x, light1.y, light1.radius
    );
    gradient1.addColorStop(0, `hsla(${light1.hue}, 80%, 60%, 0.6)`);
    gradient1.addColorStop(1, `hsla(${light1.hue}, 80%, 60%, 0)`);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gradient1;
    ctx.beginPath();
    ctx.arc(light1.x, light1.y, light1.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Lit edges for light1
    for (const poly of obstacles) {
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i];
        const b = poly[(i + 1) % poly.length];
        
        const edgeVec = {x: b.x - a.x, y: b.y - a.y};
        const lightVec = {x: a.x - light1.x, y: a.y - light1.y};
        const cross = edgeVec.x * lightVec.y - edgeVec.y * lightVec.x;
        
        if (cross > 0) {
          const len = Math.sqrt(edgeVec.x*edgeVec.x + edgeVec.y*edgeVec.y);
          const nx = -edgeVec.y / len;
          const ny = edgeVec.x / len;
          
          const dot = (nx * (light1.x - a.x) + ny * (light1.y - a.y)) / Math.sqrt((light1.x-a.x)**2 + (light1.y-a.y)**2 || 1);
          
          const dist = Math.sqrt((a.x - light1.x)**2 + (a.y - light1.y)**2);
          const intensity = Math.max(0, Math.min(1, 1 - dist / light1.radius));
          
          if (intensity > 0.1) {
            ctx.strokeStyle = `hsla(${light1.hue}, 80%, 70%, ${intensity * 0.5})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
    }

    // Draw light2 shadows
    const shadows2 = castShadows(light2, obstacles, light2.radius);
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    for (const spoly of shadows2) {
      ctx.beginPath();
      ctx.moveTo(spoly[0].x, spoly[0].y);
      for (let i = 1; i < spoly.length; i++) {
        ctx.lineTo(spoly[i].x, spoly[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = '#000';
      ctx.fill('evenodd');
    }
    ctx.restore();

    // Draw light2 glow
    const gradient2 = ctx.createRadialGradient(
      light2.x, light2.y, 0,
      light2.x, light2.y, light2.radius
    );
    gradient2.addColorStop(0, `hsla(${light2.hue}, 70%, 70%, 0.3)`);
    gradient2.addColorStop(1, `hsla(${light2.hue}, 70%, 70%, 0)`);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gradient2;
    ctx.beginPath();
    ctx.arc(light2.x, light2.y, light2.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
