<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Profile Header</title>
    <style>
        :root {
            --bg-body: #0f0f11;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --avatar-size: 100px;
            --banner-height: 180px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #18181b;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-radius: 0 0 16px 16px;
            overflow: hidden;
            position: relative;
        }

        /* Banner Section */
        .banner {
            height: var(--banner-height);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .banner-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.6) 0%, transparent 40%),
                linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #831843 100%);
            filter: blur(0px);
            transform: scale(1.1);
            animation: bannerZoom 20s infinite alternate ease-in-out;
        }

        @keyframes bannerZoom {
            from { transform: scale(1.1) translate(0, 0); }
            to { transform: scale(1.2) translate(-10px, -10px); }
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(24, 24, 27, 1) 100%);
        }

        /* Profile Info Section */
        .profile-section {
            padding: 0 24px 24px;
            position: relative;
        }

        .avatar-wrapper {
            width: var(--avatar-size);
            height: var(--avatar-size);
            margin-top: calc(var(--avatar-size) / -2);
            position: relative;
            z-index: 10;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #18181b; /* Matches card bg */
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23333" width="100" height="100"/><text x="50" y="55" font-family="Arial" font-size="40" fill="white" text-anchor="middle" dy=".1em">AJ</text></svg>');
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 22px;
            height: 22px;
            background-color: var(--success);
            border: 4px solid #18181b;
            border-radius: 50%;
        }

        .status-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        .header-content {
            margin-top: 12px;
            text-align: left;
        }

        .name-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .user-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .user-handle {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .bio {
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.5;
            color: #d1d5db;
        }

        /* Stats Row */
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 16px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item {
            text-align: center;
            flex: 1;
            cursor: default;
            transition: transform 0.2s;
        }

        .stat-item:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            display: block;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-follow {
            flex: 1;
            height: 44px;
            border-radius: 12px;
            border: none;
            background-color: var(--text-primary);
            color: #000;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-follow:active {
            transform: scale(0.97);
        }

        .btn-follow.is-following {
            background-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Morphing Animation Elements */
        .btn-text {
            position: relative;
            overflow: hidden;
            height: 20px;
            width: 60px; /* default width */
            transition: width 0.3s;
        }

        .btn-text span {
            display: block;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
        }

        .text-follow {
            transform: translateY(0);
            opacity: 1;
        }

        .text-following {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            text-align: center;
            transform: translateY(150%);
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Active States for Animation */
        .btn-follow.is-following .text-follow {
            transform: translateY(-150%);
            opacity: 0;
        }

        .btn-follow.is-following .text-following {
            transform: translateY(0);
            opacity: 1;
        }
        
        /* Slight width adjustment for text difference */
        .btn-follow.is-following .btn-text {
            width: 85px; 
        }

        .icon-check {
            width: 16px;
            height: 16px;
            fill: var(--success);
        }

        .btn-message {
            width: 44px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-message:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Tabs */
        .tabs {
            display: flex;
            margin-top: 24px;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s;
            user-select: none;
        }

        .tab.active {
            color: var(--text-primary);
        }

        /* Animated Underline */
        .tab-indicator {
            position: absolute;
            bottom: -1px; /* align with border */
            height: 2px;
            background-color: var(--text-primary);
            width: 33.33%; /* 100% / 3 tabs */
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 -2px 8px rgba(255,255,255,0.2);
        }

        /* Initial state of indicator */
        .tab-indicator {
            transform: translateX(0);
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Header / Banner -->
        <div class="banner">
            <div class="banner-bg"></div>
            <div class="banner-overlay"></div>
        </div>

        <!-- Profile Info -->
        <div class="profile-section">
            <div class="avatar-wrapper">
                <div class="avatar"></div>
                <div class="status-dot"></div>
            </div>

            <div class="header-content">
                <div class="name-row">
                    <h1 class="user-name">Alex Jensen</h1>
                    <span class="user-handle">@alexj_design</span>
                </div>
                <p class="bio">Digital Artisan ��� • UI/UX Enthusiast ��� • Capturing light & shadow around the world. ��� NYC</p>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-value" data-target="842">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" data-target="24500">0</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" data-target="412">0</span>
                    <span class="stat-label">Following</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button class="btn-follow" id="followBtn">
                    <div class="btn-text">
                        <span class="text-follow">Follow</span>
                        <span class="text-following">
                            <svg class="icon-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                            Following
                        </span>
                    </div>
                </button>
                <button class="btn-message" aria-label="Message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                </button>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab-indicator" id="tabIndicator"></div>
                <div class="tab active" data-index="0">Posts</div>
                <div class="tab" data-index="1">Replies</div>
                <div class="tab" data-index="2">Media</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. Counter Animation ---
            const counters = document.querySelectorAll('.stat-value');
            const duration = 2000; // 2 seconds
            
            counters.forEach(counter => {
                const target = +counter.getAttribute('data-target');
                const start = 0;
                const startTime = performance.now();
                
                // Custom easing function: easeOutExpo
                function easeOutExpo(t) {
                    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
                }

                function updateCounter(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    const currentVal = Math.floor(easeOutExpo(progress) * (target - start) + start);
                    
                    // Format large numbers (e.g., 24.5k)
                    if (target >= 1000) {
                        counter.innerText = (currentVal / 1000).toFixed(1).replace('.0', '') + 'k';
                    } else {
                        counter.innerText = currentVal;
                    }

                    if (progress < 1) {
                        requestAnimationFrame(updateCounter);
                    }
                }
                
                requestAnimationFrame(updateCounter);
            });


            // --- 2. Follow Button Morph ---
            const followBtn = document.getElementById('followBtn');
            let isFollowing = false;

            followBtn.addEventListener('click', () => {
                isFollowing = !isFollowing;
                if (isFollowing) {
                    followBtn.classList.add('is-following');
                } else {
                    followBtn.classList.remove('is-following');
                }
            });


            // --- 3. Tab Underline Slide ---
            const tabs = document.querySelectorAll('.tab');
            const indicator = document.getElementById('tabIndicator');
            let activeIndex = 0;

            // Initialize indicator width
            indicator.style.width = `${100 / tabs.length}%`;

            tabs.forEach((tab) => {
                tab.addEventListener('click', (e) => {
                    const index = parseInt(e.currentTarget.getAttribute('data-index'));
                    
                    // Update classes
                    tabs.forEach(t => t.classList.remove('active'));
                    e.currentTarget.classList.add('active');

                    // Move indicator
                    // translateX(0) for index 0, translateX(100%) for index 1, etc.
                    const translateValue = `${index * 100}%`;
                    indicator.style.transform = `translateX(${translateValue})`;
                    
                    activeIndex = index;
                });
            });
        });
    </script>
</body>
</html>
