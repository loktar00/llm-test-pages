<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Painting Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        /**
         * CONFIGURATION
         */
        const NUM_WELLS = 4;
        const PARTICLE_SPAWN_RATE = 3; // Particles per frame
        const PARTICLE_SPEED = 0.5;
        const GRAVITY_STRENGTH = 800;
        const FADE_SPEED = 0.03; // How fast trails fade (lower = longer trails)
        const WELL_MOVE_SPEED = 0.3;
        const WELL_RADIUS = 60;
        
        /**
         * SETUP
         */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let wells = [];
        let particles = [];
        let frameCount = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * CLASSES
         */
        class Well {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * WELL_MOVE_SPEED;
                this.vy = (Math.random() - 0.5) * WELL_MOVE_SPEED;
                this.mass = 1000 + Math.random() * 500;
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                this.life = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls softly
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // Keep within bounds
                this.x = Math.max(0, Math.min(width, this.x));
                this.y = Math.max(0, Math.min(height, this.y));

                this.life++;
            }

            draw() {
                // Visualize the well (optional, keeps it subtle as requested, but adds to the painting)
                // We draw a faint glow representing the gravity area
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, WELL_RADIUS);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, WELL_RADIUS, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor() {
                // Spawn on edges
                const edge = Math.floor(Math.random() * 4); // 0:top, 1:right, 2:bottom, 3:left
                if (edge === 0) { this.x = Math.random() * width; this.y = -10; }
                else if (edge === 1) { this.x = width + 10; this.y = Math.random() * height; }
                else if (edge === 2) { this.x = Math.random() * width; this.y = height + 10; }
                else { this.x = -10; this.y = Math.random() * height; }

                // Initial velocity (inward biased)
                this.vx = (Math.random() - 0.5) * PARTICLE_SPEED;
                this.vy = (Math.random() - 0.5) * PARTICLE_SPEED;
                
                // Slight bias towards center
                this.vx += (width / 2 - this.x) * 0.001;
                this.vy += (height / 2 - this.y) * 0.001;

                this.life = 1;
                this.decay = 0.002 + Math.random() * 0.005;
                
                // Color based on position or random
                this.hue = Math.random() * 360;
            }

            update() {
                // Gravity calculation
                let ax = 0;
                let ay = 0;

                for (let well of wells) {
                    const dx = well.x - this.x;
                    const dy = well.y - this.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist < 5) continue; // Prevent singularity divide by zero

                    // F = G * m1 * m2 / r^2
                    // Acceleration = F / m1 = G * m2 / r^2
                    const force = GRAVITY_STRENGTH * well.mass / distSq;
                    
                    ax += (dx / dist) * force;
                    ay += (dy / dist) * force;
                }

                this.vx += ax;
                this.vy += ay;

                this.x += this.vx;
                this.y += this.vy;

                this.life -= this.decay;
            }

            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.life})`;
                ctx.fillRect(this.x, this.y, 1.5, 1.5);
            }
        }

        /**
         * LOGIC
         */
        function initWells() {
            for (let i = 0; i < NUM_WELLS; i++) {
                wells.push(new Well(
                    Math.random() * width,
                    Math.random() * height
                ));
            }
        }

        function handleWellLogic() {
            // Occasionally change well direction
            if (Math.random() < 0.01) {
                wells.forEach(w => {
                    w.vx = (Math.random() - 0.5) * WELL_MOVE_SPEED;
                    w.vy = (Math.random() - 0.5) * WELL_MOVE_SPEED;
                });
            }

            // Merge Logic: If wells get too close, combine them
            for (let i = 0; i < wells.length; i++) {
                for (let j = i + 1; j < wells.length; j++) {
                    const dx = wells[i].x - wells[j].x;
                    const dy = wells[i].y - wells[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 30) {
                        // Merge j into i
                        wells[i].mass += wells[j].mass;
                        // Conservation of momentum
                        wells[i].vx = (wells[i].vx * wells[i].mass + wells[j].vx * wells[j].mass) / (wells[i].mass + wells[j].mass);
                        wells[i].vy = (wells[i].vy * wells[i].mass + wells[j].vy * wells[j].mass) / (wells[i].mass + wells[j].mass);
                        wells[i].x = wells[i].x; // Keep position
                        wells[i].y = wells[i].y;
                        wells[i].color = wells[i].color; // Keep color
                        
                        // Visual merge effect
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.beginPath();
                        ctx.arc(wells[i].x, wells[i].y, 40, 0, Math.PI*2);
                        ctx.fill();

                        wells.splice(j, 1);
                        j--; // Adjust index
                    }
                }
            }

            // Split Logic: If a well gets too heavy, split it
            wells.forEach(w => {
                if (w.mass > 3000 && Math.random() < 0.005) {
                    const newMass = w.mass * 0.5;
                    w.mass = newMass;
                    const splitWell = new Well(w.x, w.y);
                    splitWell.mass = newMass;
                    splitWell.vx = w.vx + (Math.random() - 0.5);
                    splitWell.vy = w.vy + (Math.random() - 0.5);
                    wells.push(splitWell);
                }
            });

            // Maintain minimum number of wells
            if (wells.length < 3) {
                wells.push(new Well(Math.random() * width, Math.random() * height));
            }
        }

        function drawWells() {
            // Draw the wells themselves as bright cores
            wells.forEach(w => {
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = w.color;
                ctx.beginPath();
                ctx.arc(w.x, w.y, 2 + (w.mass / 2000), 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function loop() {
            // 1. Fade the canvas (create trails)
            ctx.fillStyle = `rgba(0, 0, 0, ${FADE_SPEED})`;
            ctx.fillRect(0, 0, width, height);

            // 2. Update Wells
            handleWellLogic();
            wells.forEach(w => w.update());
            drawWells();

            // 3. Spawn Particles
            for (let i = 0; i < PARTICLE_SPAWN_RATE; i++) {
                particles.push(new Particle());
            }

            // 4. Update and Draw Particles
            // Use additive blending for glowing effect
            ctx.globalCompositeOperation = 'lighter';
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                // Remove dead particles or those that fly too far away
                if (p.life <= 0 || 
                    p.x < -200 || p.x > width + 200 || 
                    p.y < -200 || p.y > height + 200) {
                    particles.splice(i, 1);
                }
            }
            
            ctx.globalCompositeOperation = 'source-over';

            frameCount++;
            requestAnimationFrame(loop);
        }

        // Start
        initWells();
        loop();

    </script>
</body>
</html>
