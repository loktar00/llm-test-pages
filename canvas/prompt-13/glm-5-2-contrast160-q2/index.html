<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jellyfish — Generative Ribbon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #04627;
    height: 100;
  #canvas { display block; }
  .ui {
    position fixed;
    left 16px;
    bottom 16px;
    font-family 'Inter', sans-serif;
  }
  .ui button {
    background: rgba(20,  0, 0.85);
    color: #c0fbff;
    border 1px solid rgba(128, 226, 255, 0.3);
    border-radius 4px;
    padding 8px 16px;
    cursor pointer;
    backdrop-filter: blur(3px);
    font-weight 500;
    letter-spacing 0.08em;
    transition: transform .2s ease, border-color .2s ease;
  .ui button:hover {
    border-color rgba(128, 226, 255, 0.7);
    transform translateY(-2px);
  .ui button:active {
    transform translateY(0);
  .ui .label {
    color rgba(200, 241, 255, 0.5);
    font-size 11px;
    margin-right 10px;
  .info {
    position fixed;
    top 16px;
    right 16px;
    color rgba(200, 241, 255, 0.55);
    font-size 11px;
    font-family 'Inter', sans-serif;
    letter-spacing 0.08em;
    text-align right;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
  <span class="label">MIDPOINT DISPLACEMENT</span>
  <button id="regen">Regenerate</button>
</div>
<div class="info">JELLYFISH — 1D NOISE CONTOURDS</div>

<script>
/* === Core generative idea adapted into a static jellyfish illustration.
 *    All shapes are built from one-dimensional midpoint displacement noise. */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0, H = 0;
let seed = Math.random();

/* deterministic pseudo-random so each draw is stable between its own seed */
function rng() {
  /* simple xor-ish shift */
  seed = (Math.sin(seed * 6.012345) + Math.cos(seed * 3.77777)) * 4.0;
  const r = Math.abs(Math.sin(seed) * 1.0);
  seed = (seed + 1.7) * 2.0;
  return (r % 1);
}

/* === midpointDisplacement(power, displacement)
 *    Returns a 1D array of numeric points using midpoint displacement. */
function midpointDisplacement(power, displacement) {
  const points = new Array(power + 1);
  const d = displacement;
  points[0] = (rng() - 0.5) * d;
  points[power] = (rng() - 0.5) * d;

  let cur = d;
  for (let i = 1; i < power; i *= 2) {
    for (let j = (power / i / 2); j < power; j += power / i) {
      points[j] = (points[j - (power / i / 2)] + points[j + (power / i / 2)]) / 2 +
                 (rng() - 0.5) * cur;
    }
    cur *= 0.6;
  }
  return points;
}

/* === smoothPoints(points, passes)
 *    Smooths the point array by averaging neighboring values. */
function smoothPoints(points, passes) {
  let p = points.slice();
  for (let s = 0; s < passes; s++) {
    const out = p.slice();
    for (let i = 0; i < p.length; i++) {
      const a = p[i === 0 ? 0 : i - 1];
      const b = p[i];
      const c = p[i === p.length - 1 ? p.length - 1 : i + 1];
      out[i] = (a + b + c) / 3;
    }
    p = out;
  }
  return p;
}

/* === drawBackground(ctx, w, h)
 *    Soft underwater gradient with a faint glow ring and floating bubbles. */
function drawBackground(ctx, w, h) {
  /* base vertical gradient */
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0,    'rgb(1,   14,  044');
  grad.addColorStop(0.45, 'rgb(10,  58,  080');
  grad.addColorStop(0.85, 'rgb(20,  78,  080');
  grad.addColorStop(1.0,  'rgb(12,  40,  080');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  /* central halo */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.6;
  const cx = w * 0.5, cy = h * 0.42;
  for (let i = 0; i < 3; i++) {
    const r = 600 + i * 200;
    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    halo.addColorStop(0, `rgba(18, 100, 140, 0.${ 5 - i })`);
    halo.addColorStop(1,  'rgba(18,   8, 140, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  /* floating water specks */
  ctx.save();
  for (let i = 0; i < 60; i++) {
    const x = rng() * w;
    const y = rng() * h;
    const r = rng() * 2.5 + 0.6;
    const a = 0.1 + (rng() * 0.15);
    ctx.fillStyle = `rgba(180, 240, 254, ${a})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* === drawGlow(ctx, cx, cy, width, height)
 *    Optional soft glow behind the jellyfish using low alpha fills. */
function drawGlow(ctx, cx, cy, width, height) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 4; i++) {
    const r = width * (1.8 + i * 0.6);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0,  `rgba(110, 130, 250, ${0.16 - i * 0.04})`);
    grad.addColorStop(1, 'rgba(110, 130, 250, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* === drawJellyfishBell(ctx, cx, cy, width, height)
 *    Main translucent dome. Uses midpoint displacement noise to distort the
 *    bell edge slightly while keeping the silhouette readable as a jellyfish. */
function drawJellyfishBell(ctx, cx, cy, width, height) {
  const n = 128;
  let noise = midpointDisplacement(n, 80);
  noise = smoothPoints(noise, 3);
  /* normalize to small amplitude */
  const amp = width * 0.08;
  const path = [];

  /* Top dome: left -> right, height driven by sin(t * PI), plus noise. */
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const base = Math.sin(t * Math.PI);
    const dx = (t - 0.5) * width;
    const edge = base * height * 0.5;
    const noiseOffset = noise[i] * amp;
    const y = -edge + noiseOffset;
    path.push([dx, y));
  /* Build path from left edge to right edge */
  ctx.beginPath();
  ctx.moveTo(cx + path[0][0], cy + path[0][1]);
  for (let i = 1; i < path.length; i++) {
    ctx.lineTo(cx + path[i][0], cy + path[i][1]);
  }

  /* Close the lower part of the bell with a smooth underside curve.
   *   Underside points are mirrored and softened. */
  const undersidePath = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const base = Math.sin(t * Math.PI);
    const dx = (1 - t - 0.5) * width;
    const edge = base * height * 0.2;
    const noiseOffset = noise[i] * amp * 0.5;
    const y = edge + noiseOffset;
    undersidePath.push([dx, y]);
  /* trace back from right to left */
  for (let i = undersidePath.length - 1; i >= 0; i--) {
    ctx.lineTo(cx + undersidePath[i][0], cy + undersidePath[i][1]);
  }
  ctx.closePath();

  /* glassy translucent fill */
  const fillGrad = ctx.createLinearGradient(cx, cy - height * 0.5, cx, cy + height * 0.4);
  fillGrad.addColorStop(0, 'rgba(180, 246, 254, 0.40)');
  fillGrad.addColorStop(0.6, 'rgba(170, 200, 254, 0.22)');
  fillGrad.addColorStop(1, 'rgba(150, 170,  250, 0.12)');
  ctx.fillStyle = fillGrad;
  ctx.fill();

  /* upper rim stroke */
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(200, 240, 254, 0.5)';
  ctx.stroke();

  /* lower rim stroke */
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(190, 210, 254, 0.35)';
  ctx.stroke();
}

/* === drawUnderside(ctx, cx, cy, width, height)
 *    Softer underside hanging slightly below the bell.
 *    Uses its own midpoint displacement sample so the fold differs between. */
function drawUnderside(ctx, cx, cy, width, height) {
  const n = 128;
  let noise = midpointDisplacement(n, 60);
  noise = smoothPoints(noise, 2);

  /* sample underside hanging from the rim */
  ctx.beginPath();
  ctx.moveTo(cx - width * 0.5, cy);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const dx = (t - 0.5) * width;
    /* hang downward with a smooth cosine-driven bulge */
    const base = (1 - Math.cos(t * Math.PI)) * 0.5;
    const edge = base * height * 0.25;
    const noiseOffset = noise[i] * width * 0.05;
    const y = edge + noiseOffset;
    ctx.lineTo(cx + dx, cy + y);
  }

  /* continue underside to the right rim */
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    const dx = (t - 0.5) * width;
    const edge = (1 - Math.cos(t * Math.PI)) * 0.5 * height * 0.25;
    const y = edge + 8;
    ctx.lineTo(cx + dx, cy + y);
  }
  ctx.closePath();

  ctx.fillStyle = 'rgba(150, 170, 250, 0.18)';
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(150, 170, 250, 0.30)';
  ctx.stroke();
}

/* === drawInnerRibs(ctx, cx, cy, width, height)
 *    Several subtle curved rib or fold lines inside the bell.
 *    Each rib uses its own midpoint displacement sample to curve organic. */
function drawInnerRibs(ctx, cx, cy, width, height) {
  const ribs = 5;
  for (let r = 0; r < ribs; r++) {
    const n = 64;
    let noise = midpointDisplacement(n, 40);
    noise = smoothPoints(noise, 2);

    /* vertical position of the rib inside the bell */
    const baseY = (r + 0.5) / ribs;
    const cyR = cy - 1 + baseY * height * 0.6;

    /* rib goes from left to right inside the bell */
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      /* dome-shaped envelope so rib ends shorter than rim */
      const env = Math.sin(t * Math.PI);
      const dx = (t - 0.5) * width * env * 0.8;
      const y = cyR + noise[i] * 2 + env * height * 0.0;
      if (i === 0) ctx.moveTo(cx + dx, y);
      else ctx.lineTo(cx + dx, y);
    }

    /* translucent stroke */
    ctx.strokeStyle = `rgba(160, 200, 254, ${0.1 + 0.6 * (1 - r / ribs)})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

  /* === drawTentacle(ctx, startX, startY, length, sway, thickness)
 *    Draw one flowing tentacle using many connected line segments.
 *    A sine wave defines the sway, and a tiny noise drift adds organic flow. */
function drawTentacle(ctx, startX, startY, length, sway, thickness) {
  const n = 40;
  let noise = midpointDisplacement(n, 1.6);
  noise = smoothPoints(noise, 2);

  /* base direction */
  const baseDir = (rng() - 0.5) * 0.6;
  const dirX = Math.sin(baseDir);
  const dirY = 1 + Math.cos(baseDir) * 0.3;

  /* walk downward in small segments */
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    const len = length * t;
    /* sine wave + little noise drift */
    const wave = Math.sin(t * 5 + sway) * sway * (0.4 + t * 0.7);
    const drift = noise[i] * (0.5 + t);
    const x = startX + dirX * len + wave * 3 + drift * 1.0;
    const y = startY + dirY * len;
    ctx.lineTo(x, y);
  }

  ctx.lineWidth = thickness;
  ctx.stroke();

  /* glowing tip */
  ctx.beginPath();
  const tipX = startX + dirX * length;
  const tipY = startY + dirY * length;
  ctx.globalAlpha = 0.5;
  ctx.arc(tipX, tipY, thickness * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* === drawTentacles(ctx, cx, cy, width, height)
 *    Multiple tentacles starting under the bell, each with its own length and sway. */
function drawTentacles(ctx, cx, cy, width, height) {
  const count = 9;
  const palette = ['rgba(160, 200, 254, 0.4)',
    'rgba(170, 220, 254, 0.3',
    'rgba(150, 170, 250, 0.35',
    'rgba(180, 200, 254, 0.25',
    'rgba(170, 220, 254, 0.30',
    'rgba(160, 180, 254, 0.35'];
  /* starting points spread across the underside */
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    /* slight inward bias so tentacles cluster toward middle */
    const sx = (t - 0.5) * width * 0.6;
    const sy = (1 - Math.cos(t * Math.PI)) * 0.5 * height * 0.25 + 2;
    const length = 1.50 + (rng() * 1.00) * 0.140;
    const sway = (rng() * 0.6) + 0.1;
    const thickness = 1.6 + (rng() * 0.0);
    ctx.strokeStyle = palette[i % palette.length];
    drawTentacle(ctx, cx + sx, cy + sy, length, sway, thickness);
  }

/* === drawScene()
 *    Clears canvas, draws background, glow, bell, underside, ribs, tentacles. */
function drawScene() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w;
  canvas.height = h;
  W = w; H = h;

  drawBackground(ctx, w, h);

  const cx = w * 0.5;
  const cy = h * 0.42;
  const bellWidth = Math.min(w, h) * 0.6;
  const bellHeight = bellWidth * 0.6;

  /* glow behind the jellyfish */
  drawGlow(ctx, cx, cy, bellWidth * 0.5, bellHeight * 0.6);

  /* bell */
  drawJellyfishBell(ctx, cx, cy, bellWidth, bellHeight);
  /* underside hangs below */
  drawUnderside(ctx, cx, cy + bellHeight * 0.5, bellWidth, bellHeight);
  /* ribs inside */
  drawInnerRibs(ctx, cx, cy - bellHeight * 0.25, bellWidth * 0.8, bellHeight * 0.6);
  /* tentacles start under the underside */
  drawTentacles(ctx, cx, cy + bellHeight * 0.5, bellWidth * 0.7, bellHeight * 0.6);
}

/* regenerate button */
const regen = document.getElementById("regen");
regen.addEventListener("click", () => {
  seed = Math.random();
  drawScene();
});

/* resize handler */
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    seed = Math.random();
    drawScene();
  }, 60);
});

/* initial draw */
window.addEventListener("load", () => {
  setTimeout(drawScene, 30);
});
</script>
</body>
</html>
