<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ragdoll Dojo</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Resize canvas to full window
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Vector class
class Vec2 {
    constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
    }
    add(v) { this.x += v.x; this.y += v.y; return this; }
    sub(v) { this.x -= v.x; this.y -= v.y; return this; }
    mul(s) { this.x *= s; this.y *= s; return this; }
    clone() { return new Vec2(this.x, this.y); }
    static sub(a, b) { return new Vec2(a.x - b.x, a.y - b.y); }
    static add(a, b) { return new Vec2(a.x + b.x, a.y + b.y); }
}

// Verlet Particle
class Particle {
    constructor(x, y) {
        this.pos = new Vec2(x, y);
        this.prev = new Vec2(x, y);
        this.pinned = false;
    }
    update(dt, gravity) {
        if (this.pinned) return;
        const nx = this.pos.x + (this.pos.x - this.prev.x) * 0.99 + gravity.x * dt * dt;
        const ny = this.pos.y + (this.pos.y - this.prev.y) * 0.99 + gravity.y * dt * dt;
        this.prev.x = this.pos.x;
        this.prev.y = this.pos.y;
        this.pos.x = nx;
        this.pos.y = ny;
    }
}

// Distance Constraint
class Constraint {
    constructor(p1, p2, distance, stiffness = 0.9) {
        this.p1 = p1;
        this.p2 = p2;
        this.distance = distance;
        this.stiffness = stiffness;
    }
    solve() {
        const dx = this.p2.pos.x - this.p1.pos.x;
        const dy = this.p2.pos.y - this.p1.pos.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
        const diff = (dist - this.distance) / dist;
        if (!this.p1.pinned) {
            this.p1.pos.x += dx * 0.5 * diff * this.stiffness;
            this.p1.pos.y += dy * 0.5 * diff * this.stiffness;
        }
        if (!this.p2.pinned) {
            this.p2.pos.x -= dx * 0.5 * diff * this.stiffness;
            this.p2.pos.y -= dy * 0.5 * diff * this.stiffness;
        }
    }
}

// Ragdoll
class Ragdoll {
    constructor(x, y) {
        this.particles = [];
        this.constraints = [];
        this.dead = false;
        this.lifetime = 0;

        // Create joints
        const head = new Particle(x, y);
        const torsoTop = new Particle(x, y + 15);
        const torsoMid = new Particle(x, y + 30);
        const torsoBottom = new Particle(x, y + 45);
        const leftShoulder = new Particle(x - 10, y + 15);
        const rightShoulder = new Particle(x + 10, y + 15);
        const leftElbow = new Particle(x - 15, y + 25);
        const rightElbow = new Particle(x + 15, y + 25);
        const leftHand = new Particle(x - 20, y + 35);
        const rightHand = new Particle(x + 20, y + 35);
        const leftHip = new Particle(x - 8, y + 45);
        const rightHip = new Particle(x + 8, y + 45);
        const leftKnee = new Particle(x - 10, y + 58);
        const rightKnee = new Particle(x + 10, y + 58);
        const leftFoot = new Particle(x - 12, y + 70);
        const rightFoot = new Particle(x + 12, y + 70);

        this.particles = [
            head, torsoTop, torsoMid, torsoBottom,
            leftShoulder, rightShoulder,
            leftElbow, rightElbow,
            leftHand, rightHand,
            leftHip, rightHip,
            leftKnee, rightKnee,
            leftFoot, rightFoot
        ];

        // Constraints (bones)
        const addC = (a, b, d, s = 0.9) => this.constraints.push(new Constraint(a, b, d, s));
        addC(head, torsoTop, 15);
        addC(torsoTop, torsoMid, 15);
        addC(torsoMid, torsoBottom, 15);
        addC(leftShoulder, rightShoulder, 20);
        addC(torsoTop, leftShoulder, 10);
        addC(torsoTop, rightShoulder, 10);
        addC(leftShoulder, leftElbow, 10);
        addC(rightShoulder, rightElbow, 10);
        addC(leftElbow, leftHand, 10);
        addC(rightElbow, rightHand, 10);
        addC(torsoBottom, leftHip, 8);
        addC(torsoBottom, rightHip, 8);
        addC(leftHip, leftKnee, 13);
        addC(rightHip, rightKnee, 13);
        addC(leftKnee, leftFoot, 12);
        addC(rightKnee, rightFoot, 12);
        addC(leftHip, rightHip, 16);
        addC(head, leftShoulder, 12);
        addC(head, rightShoulder, 12);
    }

    update(dt, gravity) {
        for (const p of this.particles) p.update(dt, gravity);
        for (let i = 0; i < 5; i++) {
            for (const c of this.constraints) c.solve();
        }
    }

    draw(ctx) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        for (const c of this.constraints) {
            ctx.beginPath();
            ctx.moveTo(c.p1.pos.x, c.p1.pos.y);
            ctx.lineTo(c.p2.pos.x, c.p2.pos.y);
            ctx.stroke();
        }
    }

    checkDissolve(groundY) {
        let settled = true;
        for (const p of this.particles) {
            if (Math.abs(p.pos.y - p.prev.y) > 0.1 || Math.abs(p.pos.x - p.prev.x) > 0.1) {
                settled = false;
                break;
            }
        }
        if (settled) {
            this.lifetime += 1;
            if (this.lifetime > 60) {
                this.dead = true;
            }
        }
    }
}

// Obstacles
class Trampoline {
    constructor(x, w) {
        this.x = x;
        this.y = 300;
        this.w = w;
        this.h = 10;
        this.p1 = new Particle(x - w/2, this.y); this.p1.pinned = true;
        this.p2 = new Particle(x + w/2, this.y); this.p2.pinned = true;
    }
    update(dt, gravity) {}
    draw(ctx) {
        ctx.fillStyle = '#4a4';
        ctx.fillRect(this.x - this.w/2, this.y - 5, this.w, this.h);
    }
}

class Seesaw {
    constructor(x) {
        this.x = x;
        this.y = 400;
        this.p1 = new Particle(x - 60, this.y);
        this.p2 = new Particle(x + 60, this.y);
        this.pivot = new Particle(x, this.y); this.pivot.pinned = true;
        this.constraints = [
            new Constraint(this.p1, this.pivot, 60, 0.8),
            new Constraint(this.pivot, this.p2, 60, 0.8)
        ];
        this.thickness = 8;
    }
    update(dt, gravity) {
        for (const p of [this.p1, this.p2]) p.update(dt, gravity);
        for (let i = 0; i < 3; i++) for (const c of this.constraints) c.solve();
    }
    draw(ctx) {
        ctx.fillStyle = '#a64';
        ctx.fillRect(this.p1.pos.x, this.y - this.thickness/2, this.w(), this.thickness);
    }
    w() { return this.p2.pos.x - this.p1.pos.x; }
}

let ragdolls = [];
let obstacles = [];
let gravity = new Vec2(0, 0.5);

function initObstacles() {
    obstacles = [];
    for (let i = 1; i < 5; i++) {
        obstacles.push(new Trampoline(i * 200, 100));
    }
    obstacles.push(new Seesaw(300));
    obstacles.push(new Seesaw(700));
}

function spawnRagdoll() {
    const x = 100 + Math.random() * (canvas.width - 200);
    ragdolls.push(new Ragdoll(x, -50));
}

let lastSpawn = 0;
function loop() {
    const dt = 1;
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Update obstacles
    for (const obs of obstacles) obs.update(dt, gravity);
    for (const obs of obstacles) obs.draw(ctx);

    // Update ragdolls
    for (const r of ragdolls) r.update(dt, gravity);
    for (const r of ragdolls) r.draw(ctx);
    for (const r of ragdolls) r.checkDissolve(canvas.height);
    
    // Remove dead
    ragdolls = ragdolls.filter(r => !r.dead);

    // Spawn
    lastSpawn++;
    if (lastSpawn > 120) {
        spawnRagdoll();
        lastSpawn = 0;
        if (Math.random() < 0.3) {
            setTimeout(spawnRagdoll, 300);
        }
    }

    requestAnimationFrame(loop);
}

initObstacles();
loop();
</script>
</body>
</html>
