<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raycast Lighting Demo</title>
<style>
*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();
addEventListener('resize',resize);

// Polygon definitions (room boundaries + scattered obstacles)
const polygons=[];

// Room boundary
function addPoly(pts){polygons.push(pts)}

function makeRect(x,y,w,h){return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]}
function makePoly(sides,rx,ry,r){
    const p=[];
    for(let i=0;i<sides;i++){
        const a=Math.PI*2*i/sides-Math.PI/2;
        p.push([rx+r*Math.cos(a),ry+r*Math.sin(a)]);
    }
    return p;
}
function makePolyIrregular(sides,rx,ry,baseR,variance){
    const p=[];
    for(let i=0;i<sides;i++){
        const a=Math.PI*2*i/sides;
        const r=baseR+variance*(Math.sin(a*3+i)+Math.cos(a*2+i*1.7))*0.5;
        p.push([rx+r*Math.cos(a),ry+r*Math.sin(a)]);
    }
    return p;
}

// Room walls
const margin=60;
const room=makeRect(margin,margin,W-margin*2,H-margin*2);
addPoly(room);

// Scattered polygonal obstacles
const obstacles=[
    makePolyIrregular(5, W*0.2,H*0.3, 40, 15),
    makePolyIrregular(7, W*0.7,H*0.25, 55, 18),
    makePolyIrregular(4, W*0.5,H*0.55, 45, 12),
    makePolyIrregular(6, W*0.15,H*0.7, 35, 10),
    makePolyIrregular(5, W*0.8,H*0.65, 50, 14),
    makePolyIrregular(8, W*0.35,H*0.15, 30, 8),
    makePolyIrregular(4, W*0.6,H*0.8, 42, 13),
    makePolyIrregular(6, W*0.45,H*0.35, 38, 11),
    makePolyIrregular(5, W*0.75,H*0.45, 48, 16),
    makePolyIrregular(7, W*0.25,H*0.55, 32, 9),
    makePolyIrregular(4, W*0.55,H*0.75, 44, 12),
    makePolyIrregular(6, W*0.9,H*0.35, 36, 10),
    makePolyIrregular(5, W*0.1,H*0.45, 30, 8),
    makePolyIrregular(8, W*0.4,H*0.65, 28, 7),
    makePolyIrregular(4, W*0.65,H*0.15, 34, 9),
];
obstacles.forEach(p=>addPoly(p));

// Light sources
const lights=[];
const startTime=performance.now();

function createLight(x,y,radius,baseHue,saturation,lightness,orbitRadius,orbitSpeed,orbitPhase,orbitTilt){
    return{x,y,radius,baseHue,saturation,lightness,orbitRadius,orbitSpeed,orbitPhase,orbitTilt,angle:orbitPhase};
}

// Warm main light
lights.push(createLight(W/2,H/2, 350, 35, 90, 65, 50, W*0.35, 0.00008, 0, 0.3));
// Cool dim counter-orbiting light
lights.push(createLight(W/2,H/2, 200, 200, 80, 40, 40, W*0.3, -0.00006, Math.PI, -0.5));

// Ray-polygon intersection
function raySegmentIntersect(p1,p2,p3,p4){
    const d1x=p2[0]-p1[0],d1y=p2[1]-p1[1];
    const d2x=p4[0]-p3[0],d2y=p4[1]-p3[1];
    const denom=d1x*d2y-d1y*d2x;
    if(Math.abs(denom)<1e-10)return null;
    const t=((p3[0]-p1[0])*d2y-(p3[1]-p1[1])*d2x)/denom;
    const u=((p3[0]-p1[0])*d1y-(p3[1]-p1[1])*d1x)/denom;
    if(u>=0&&u<=1&&t>0&&t<1e9)return[p1[0]+d1x*t,p1[1]+d1y*t];
    return null;
}

function rayPolygonIntersect(origin,point,poly){
    let closest=null,closestDist=1e18;
    for(let i=0;i<poly.length;i++){
        const p1=poly[i],p2=poly[(i+1)%poly.length];
        const hit=raySegmentIntersect(origin,point,p1,p2);
        if(hit){
            const dx=hit[0]-origin[0],dy=hit[1]-origin[1];
            const dist=dx*dx+dy*dy;
            if(dist<closestDist){closestDist=dist;closest=hit;}
        }
    }
    return closest;
}

function distSq(a,b){return(a[0]-b[0])**2+(a[1]-b[1])**2}

// Precompute shadow polygons for a light
function computeShadows(light,polygons){
    const pts=[];
    for(const poly of polygons){
        for(const v of poly){
            const angle=Math.atan2(v[1]-light.y,v[0]-light.x);
            pts.push({v,angle,poly});
        }
    }
    pts.sort((a,b)=>a.angle-b.angle);
    
    const shadowRegions=[];
    
    for(let i=0;i<pts.length;i++){
        const curr=pts[i];
        const next=pts[(i+1)%pts.length];
        // Use midpoint direction for this angular sector
        let midAngle=(curr.angle+next.angle)/2;
        if(Math.abs(next.angle-curr.angle)>Math.PI) midAngle+=Math.PI;
        const midLen=3000;
        const midPoint=[light.x+midLen*Math.cos(midAngle),light.y+midLen*Math.sin(midAngle)];
        
        // Find first intersection
        let firstHit=null,firstHitDist=1e18;
        for(const poly of polygons){
            const hit=rayPolygonIntersect(light,midPoint,poly);
            if(hit){
                const d=distSq(light,hit);
                if(d<firstHitDist){firstHitDist=d;firstHit=hit;}
            }
        }
        
        if(firstHit){
            // Build shadow polygon: light -> firstHit -> extend beyond
            const ext=[light.x+(firstHit[0]-light.x)*4,light.y+(firstHit[1]-light.y)*4];
            // Also include the vertex direction for tighter shadows
            const vHit=rayPolygonIntersect(light,curr.v,polygons[0]);
            shadowRegions.push({from:curr.v,to:ext,shadowHit:firstHit});
        }
    }
    return shadowRegions;
}

// Simpler but more reliable shadow computation
function computeVisibilityShadowPolygons(light,polygons){
    // For each polygon vertex, compute angle from light
    let allPts=[];
    for(const poly of polygons){
        for(let i=0;i<poly.length;i++){
            allPts.push({v:poly[i],angle:Math.atan2(poly[i][1]-light.y,poly[i][0]-light.x),poly,vi:i});
        }
    }
    allPts.sort((a,b)=>a.angle-b.angle);
    
    const shadowPolygons=[];
    
    for(let i=0;i<allPts.length;i++){
        const p1=allPts[i];
        const p2=allPts[(i+1)%allPts.length];
        
        // Mid-angle
        let midA=(p1.angle+p2.angle)/2;
        if(p2.angle-p1.angle>Math.PI) midA+=Math.PI;
        
        const rayLen=5000;
        const rayEnd=[light.x+rayLen*Math.cos(midA),light.y+rayLen*Math.sin(midA)];
        
        // Find closest intersection along this ray
        let closestHit=null,closestDist=1e18;
        for(const poly of polygons){
            for(let j=0;j<poly.length;j++){
                const e1=poly[j],e2=poly[(j+1)%poly.length];
                const hit=raySegmentIntersect(light,rayEnd,e1,e2);
                if(hit){
                    const d=distSq(light,hit);
                    if(d<closestDist){closestDist=d;closestHit=hit;}
                }
            }
        }
        
        if(closestHit && closestDist < rayLen*rayLen){
            // This sector is shadowed
            // Shadow polygon: light -> closestHit -> extend -> back
            const ext=[light.x+(closestHit[0]-light.x)*5,light.y+(closestHit[1]-light.y)*5];
            shadowPolygons.push([light,closestHit,ext]);
        }
    }
    return shadowPolygons;
}

function pointInPoly(x,y,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
        const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
        if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
    }
    return inside;
}

// Offscreen canvas for shadow compositing
const offCanvas=document.createElement('canvas');
const offCtx=offCanvas.getContext('2d');

function render(time){
    const t=time/1000;
    
    // Update light positions
    for(const light of lights){
        light.angle+=light.orbitSpeed;
        light.x=W/2+light.orbitRadius*Math.cos(light.angle)*Math.cos(light.orbitTilt);
        light.y=H/2+light.orbitRadius*Math.sin(light.angle)*Math.sin(light.orbitTilt);
        // Hue shift over minutes: cycle through ~6 minutes
        light.hue=light.baseHue+Math.sin(t*0.01)*30;
    }
    
    // Clear
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,W,H);
    
    // Draw room floor (very dark)
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(margin,margin,W-margin*2,H-margin*2);
    
    // Draw polygons (dark)
    for(const poly of polygons){
        ctx.beginPath();
        ctx.moveTo(poly[0][0],poly[0][1]);
        for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i][0],poly[i][1]);
        ctx.closePath();
        ctx.fillStyle='#111';
        ctx.fill();
        ctx.strokeStyle='#1a1a1a';
        ctx.lineWidth=1;
        ctx.stroke();
    }
    
    // Compute shadows for each light and composite
    offCanvas.width=W;
    offCanvas.height=H;
    offCtx.clearRect(0,0,W,H);
    
    for(const light of lights){
        const shadowPolygons=computeVisibilityShadowPolygons(light,polygons);
        
        // Create shadow mask
        const maskCanvas=document.createElement('canvas');
        maskCanvas.width=W;maskCanvas.height=H;
        const maskCtx=maskCanvas.getContext('2d');
        maskCtx.clearRect(0,0,W,H);
        
        // Draw lit area first (light circle)
        const hueShift=light.baseHue+Math.sin(t*0.01)*30;
        const color=`hsl(${hueShift},${light.saturation}%,${light.lightness}%)`;
        const dimColor=`hsl(${hueShift},${light.saturation}%,${light.lightness*0.3}%)`;
        
        const grad=maskCtx.createRadialGradient(light.x,light.y,0,light.x,light.y,light.radius);
        grad.addColorStop(0,color);
        grad.addColorStop(0.5,dimColor);
        grad.addColorStop(1,'rgba(0,0,0,0)');
        
        maskCtx.fillStyle=grad;
        maskCtx.beginPath();
        maskCtx.arc(light.x,light.y,light.radius,0,Math.PI*2);
        maskCtx.fill();
        
        // Cut out shadows
        maskCtx.globalCompositeOperation='destination-out';
        for(const sp of shadowPolygons){
            maskCtx.beginPath();
            maskCtx.moveTo(sp[0][0],sp[0][1]);
            for(let i=1;i<sp.length;i++)maskCtx.lineTo(sp[i][0],sp[i][1]);
            maskCtx.closePath();
            maskCtx.fill();
        }
        
        maskCtx.globalCompositeOperation='source-over';
        
        // Draw lit regions
        offCtx.drawImage(maskCanvas,0,0);
    }
    
    // Apply lit regions to main canvas
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(offCanvas,0,0);
    
    // Draw glowing edges
    ctx.globalCompositeOperation='source-over';
    for(const poly of polygons){
        let anyLit=false;
        for(const light of lights){
            const midX=(poly[0][0]+poly[Math.floor(poly.length/2)][0])/2;
            const midY=(poly[0][1]+poly[Math.floor(poly.length/2)][1])/2;
            const dx=midX-light.x,dy=midY-light.y;
            const d=Math.sqrt(dx*dx+dy*dy);
            if(d<light.radius){
                anyLit=true;
                break;
            }
        }
        if(anyLit){
            ctx.beginPath();
            ctx.moveTo(poly[0][0],poly[0][1]);
            for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i][0],poly[i][1]);
            ctx.closePath();
            ctx.strokeStyle='rgba(255,200,100,0.15)';
            ctx.lineWidth=2;
            ctx.stroke();
        }
    }
    
    // Draw light sources
    for(const light of lights){
        const hueShift=light.baseHue+Math.sin(t*0.01)*30;
        const glowGrad=ctx.createRadialGradient(light.x,light.y,0,light.x,light.y,25);
        glowGrad.addColorStop(0,`hsla(${hueShift},100%,90%,0.9)`);
        glowGrad.addColorStop(0.3,`hsla(${hueShift},100%,70%,0.4)`);
        glowGrad.addColorStop(1,`hsla(${hueShift},100
