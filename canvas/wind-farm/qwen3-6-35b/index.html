<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Farm Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const CYCLE_TIME = 90000; // 90 seconds for a full day/night cycle
        let time = 0; // 0 to CYCLE_TIME

        // Mouse interaction to advance time manually if needed
        let mouseX = 0;
        
        // Turbines
        const turbines = [];
        const NUM_TURBINES = 12;

        // Truck
        let truck = {
            active: false,
            timer: 0,
            x: -200,
            speed: 2,
            dust: []
        };

        // Clouds
        const clouds = [];
        const NUM_CLOUDS = 8;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => mouseX = e.clientX);
