<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player Card</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-color: #ff4757;
            --card-width: 320px;
            --card-height: 460px;
            --art-size: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Ambient Background Blur */
        .ambient-light {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            transition: background 0.5s ease;
        }

        /* Main Card Container */
        .player-card {
            position: relative;
            z-index: 1;
            width: var(--card-width);
            height: var(--card-height);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            transition: transform 0.3s ease, background 0.5s ease;
        }

        /* Album Art */
        .art-container {
            width: var(--art-size);
            height: var(--art-size);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            position: relative;
        }

        .album-art {
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
        }

        /* CSS Generated Art Overlay */
        .art-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0,0,0,0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.1) 0%, transparent 40%),
                linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.1) 50%, transparent 55%);
        }

        /* Metadata */
        .track-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .track-title {
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .artist-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Controls Area */
        .controls-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .progress-line {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-line-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .progress-wrapper {
            position: relative;
            width: 100%;
            height: 20px; /* Hit area */
            display: flex;
            align-items: center;
        }

        /* Main Controls */
        .main-controls {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            transform: scale(1.1);
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        .btn-skip {
            width: 40px;
            height: 40px;
            opacity: 0.7;
        }
        
        .btn-skip svg {
            fill: currentColor;
            width: 24px;
            height: 24px;
        }

        /* Play Button Ring */
        .play-btn-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #fff;
            color: #121212;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        
        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: #121212;
            transition: d 0.3s ease; /* Morphing the path data is complex, we use opacity/transform swap */
        }

        /* SVG Icons */
        .icon-play, .icon-pause {
            position: absolute;
            transition: all 0.3s ease;
        }
        
        .icon-play {
            transform: translateX(3px); /* Optical centering */
        }
        
        .icon-pause {
            transform: translateX(-2px); /* Optical centering */
        }

        /* Progress Ring */
        .progress-ring {
            position: absolute;
            top: -5px; /* Overlap slightly */
            left: -5px;
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
            z-index: 1;
            pointer-events: none;
        }

        .progress-ring__bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
        }

        .progress-ring__circle {
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 220; /* 2 * PI * r (r=35) approx */
            stroke-dashoffset: 220;
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
        }

        /* Volume Slider */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 200px;
        }

        .volume-icon {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        .slider-wrapper {
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
            flex-grow: 1;
            cursor: pointer;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            position: absolute;
            z-index: 2;
            margin: 0;
            cursor: grab;
        }

        /* Track styling */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        /* Thumb styling */
        input[type=range]::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #fff;
            -webkit-appearance: none;
            margin-top: -5px; /* centers thumb */
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
            opacity: 0; /* Hidden by default */
        }

        .slider-wrapper:hover input[type=range]::-webkit-slider-thumb {
            opacity: 1;
        }

        /* Animations */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .is-playing .album-art {
            animation: gradientShift 5s ease infinite, spin 12s linear infinite;
        }
        
        .is-playing .progress-ring__circle {
            /* handled by JS */
        }

    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="player-card" id="playerCard">
        <!-- Album Art -->
        <div class="art-container">
            <div class="album-art"></div>
            <div class="art-overlay"></div>
        </div>

        <!-- Info -->
        <div class="track-info">
            <div class="track-title">Midnight City</div>
            <div class="artist-name">Neon Dreams</div>
        </div>

        <!-- Controls -->
        <div class="controls-area">
            
            <!-- Progress -->
            <div class="progress-wrapper">
                <div class="progress-line">
                    <div class="progress-line-fill" id="progressFill"></div>
                </div>
                <div class="progress-container" style="width: 100%">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">3:45</span>
                </div>
            </div>

            <!-- Main Buttons -->
            <div class="main-controls">
                <!-- Previous -->
                <button class="btn btn-skip" id="prevBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <!-- Play/Pause with Ring -->
                <div class="play-btn-wrapper">
                    <svg class="progress-ring" width="80" height="80">
                        <circle class="progress-ring__bg" cx="40" cy="40" r="35"></circle>
                        <circle class="progress-ring__circle" cx="40" cy="40" r="35"></circle>
                    </svg>
                    
                    <button class="btn play-btn" id="playBtn">
                        <!-- Play Icon -->
                        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <!-- Pause Icon -->
                        <svg class="icon-pause" viewBox="0 0 24 24" style="opacity: 0; transform: translateX(-2px) scale(0.5);"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>

                <!-- Next -->
                <button class="btn btn-skip" id="nextBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <!-- Volume -->
            <div class="volume-container">
                <svg class="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <div class="slider-wrapper">
                    <input type="range" min="0" max="100" value="70" id="volumeSlider">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.getElementById('playBtn');
            const iconPlay = document.querySelector('.icon-play');
            const iconPause = document.querySelector('.icon-pause');
            const circle = document.querySelector('.progress-ring__circle');
            const progressFill = document.getElementById('progressFill');
            const currentTimeEl = document.getElementById('currentTime');
            const ambientLight = document.querySelector('.ambient-light');
            const playerCard = document.getElementById('playerCard');
            
            // State
            let isPlaying = false;
            let progress = 0;
            const totalDuration = 225; // 3:45 in seconds
            let animationFrame;

            // Constants for animation
            const circleRadius = 35;
            const circleCircumference = 2 * Math.PI * circleRadius;

            // Initial setup
            circle.style.strokeDasharray = `${circleCircumference} ${circleCircumference}`;
            circle.style.strokeDashoffset = circleCircumference;

            // Color Palette
            const colors = {
                gradient: 'linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%)',
                cardBorder: 'rgba(255, 154, 158, 0.3)',
                ambient: 'linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1)'
            };

            function updateProgress(percent) {
                // Update Line Bar
                progressFill.style.width = `${percent}%`;
                
                // Update Ring
                const offset = circleCircumference - (percent / 100) * circleCircumference;
                circle.style.strokeDashoffset = offset;

                // Update Time
                const currentSeconds = Math.floor((percent / 100) * totalDuration);
                const mins = Math.floor(currentSeconds / 60);
                const secs = currentSeconds % 60;
                currentTimeEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function togglePlay() {
                isPlaying = !isPlaying;
                
                // Toggle Icons
                if (isPlaying) {
                    iconPlay.style.opacity = '0';
                    iconPlay.style.transform = 'translateX(3px) scale(0.5)';
                    
                    iconPause.style.opacity = '1';
                    iconPause.style.transform = 'translateX(-2px) scale(1)';
                    
                    playerCard.classList.add('is-playing');
                    ambientLight.style.background = colors.ambient;
                    playerCard.style.background = 'rgba(255, 255, 255, 0.08)';
                    
                    animate();
                } else {
                    iconPlay.style.opacity = '1';
                    iconPlay.style.transform = 'translateX(3px) scale(1)';
                    
                    iconPause.style.opacity = '0';
                    iconPause.style.transform = 'translateX(-2px) scale(0.5)';
                    
                    playerCard.classList.remove('is-playing');
                    
                    cancelAnimationFrame(animationFrame);
                }
            }

            function animate() {
                if (!isPlaying) return;

                // Simulation of playback
                const increment = 100 / (totalDuration * 60); // Assuming 60fps
                progress += increment;

                if (progress >= 100) {
                    progress = 0; // Loop
                }

                updateProgress(progress);
                animationFrame = requestAnimationFrame(animate);
            }

            // Event Listeners
            playBtn.addEventListener('click', togglePlay);

            document.getElementById('prevBtn').addEventListener('click', () => {
                progress = 0;
                updateProgress(progress);
                if(!isPlaying) togglePlay();
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                progress = 0;
                updateProgress(progress);
                if(!isPlaying) togglePlay();
            });

            // Volume Slider Visuals (Background fill)
            const slider = document.getElementById('volumeSlider');
            slider.addEventListener('input', (e) => {
                const val = e.target.value;
                // Calculate background size for the track
                // Note: This is a visual hack for a range slider background fill
                e.target.style.background = `linear-gradient(to right, #fff 0%, #fff ${val}%, rgba(255,255,255,0.1) ${val}%, rgba(255,255,255,0.1) 100%)`;
            });
            
            // Trigger initial slider style
            slider.dispatchEvent(new Event('input'));
        });
    </script>
</body>
</html>
