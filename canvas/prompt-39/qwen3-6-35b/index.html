<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Downhill Sled</title>
<style>
  body { margin: 0; overflow: hidden; background: #1a1a2e; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = window.innerWidth, H = window.innerHeight;
canvas.width = W;
canvas.height = H;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

// --- Constants ---
const SEGMENT_W = 3;
const TERRAIN_LOOKAHEAD = 3000;
const GRAVITY = 0.35;
const FRICTION = 0.998;
const SLED_LENGTH = 30;
const SCARF_SEGMENTS = 12;
const SCARF_SEG_LEN = 8;

// --- State ---
let distTraveled = 0;
let gameTime = 0;
let dayPhase = 0; // 0-1 cycle

// Terrain
let terrainPoints = [];
let terrainGenX = 0;

// Sledder
let sled = {
  x: 200, y: 0,
  vx: 2, vy: 0,
  angle: 0, va: 0,
  grounded: false,
  stuckTimer: 0,
  upsideDown: 0,
  scarfPoints: [],
  scarfVelocities: []
};

// Particles
let snowParticles = [];
let burstParticles = [];

// Background layers
let bgLayers = [];
let clouds = [];
let stars = [];
let snowmen = [];
let trees = [];
let obstacles = [];
let easterEggs = [];

// Weather
let weather = 'clear'; // clear, light, heavy, windy
let weatherTimer = 0;
let wind = 0;

// UI
let speed = 0;
let distance = 0;

// --- Initialization ---
function init() {
  distTraveled = 0;
  gameTime = 0;
  dayPhase = 0;
  
  // Reset sledder
  sled.x = 300;
  sled.y = 0;
  sled.vx = 2;
  sled.vy = 0;
  sled.angle = 0;
  sled.va = 0;
  sled.grounded = false;
  sled.stuckTimer = 0;
  sled.upsideDown = 0;
  
  // Generate initial terrain
  terrainPoints = [];
  terrainGenX = 0;
  generateTerrain();
  
  // Init scarf
  sled.scarfPoints = [];
  sled.scarfVelocities = [];
  for (let i = 0; i < SCARF_SEGMENTS; i++) {
    sled.scarfPoints.push({ x: sled.x - 20 - i * 5, y: sled.y - 5 });
    sled.scarfVelocities.push({ x: 0, y: 0 });
  }
  
  // Init particles
  snowParticles = [];
  burstParticles = [];
  
  // Init background
  bgLayers = [];
  clouds = [];
  stars = [];
  snowmen = [];
  trees = [];
  obstacles = [];
  easterEggs = [];
  
  generateBackground();
  
  // Init weather
  weather = 'clear';
  weatherTimer = 0;
  wind = 0;
}

function generateTerrain() {
  let startX = terrainGenX;
  let endX = startX + TERRAIN_LOOKAHEAD;
  
  let slope = 0.02; // initial downward slope
  let height = 300;
  
  for (let x = startX; x <= endX; x += SEGMENT_W) {
    let y = height;
    
    // Add some variation
    let variation = Math.sin(x * 0.005) * 30 + Math.sin(x * 0.01) * 15 + Math.sin(x * 0.002) * 50;
    y += variation;
    
    // Occasional bump
    if (Math.random() < 0.005) {
      slope += 0.01 + Math.random() * 0.02;
    }
    
    // Occasional dip
    if (Math.random() < 0.003) {
      slope -= 0.01;
    }
    
    // Clamp slope to prevent impossible terrain
    slope = Math.max(-0.05, Math.min(0.15, slope));
    
    height += slope;
    
    // Ensure terrain stays in reasonable range
    if (height < 100) {
      height = 100;
      slope = 0.02;
    } else if (height > 600) {
      height = 600;
      slope = 0.02;
    }
    
    terrainPoints.push({ x: x, y: y });
  }
  
  terrainGenX = endX;
  
  // Clean up old terrain
  if (terrainPoints.length > 3000) {
    terrainPoints = terrainPoints.slice(-1000);
  }
}

function generateBackground() {
  // Generate clouds
  for (let i = 0; i < 15; i++) {
    clouds.push({
      x: Math.random() * W * 3,
      y: 50 + Math.random() * 150,
      w: 80 + Math.random() * 120,
      h: 30 + Math.random() * 40,
      speed: 0.2 + Math.random() * 0.5
    });
  }
  
  // Generate stars
  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.6,
      size: 0.5 + Math.random() * 1.5,
      twinkle: Math.random() * Math.PI * 2
    });
  }
  
  // Generate snowmen, trees, obstacles
  generateDecorations();
}

function generateDecorations() {
  let startX = terrainGenX - TERRAIN_LOOKAHEAD;
  let endX = terrainGenX + TERRAIN_LOOKAHEAD;
  
  for (let x = startX; x < endX; x += 100 + Math.random() * 200) {
    // Get terrain height at this x
    let ty = getTerrainHeight(x);
    
    let type = Math.random();
    if (type < 0.2) {
      // Snowman
      snowmen.push({
        x: x,
        y: ty,
        height: 40 + Math.random() * 20,
        hatColor: ['#ff0000', '#0000ff', '#ffaa00', '#00aa00'][Math.floor(Math.random() * 4)],
        eyeColor: '#000',
        noseColor: '#ff6600'
      });
    } else if (type < 0.4) {
      // Pine tree
      trees.push({
        x: x,
        y: ty,
        height: 60 + Math.random() * 40,
        width: 30 + Math.random() * 20
      });
    } else if (type < 0.5) {
      // Sign
      obstacles.push({
        x: x,
        y: ty,
        type: 'sign',
        text: ['SLOW DOWN!', 'ICE AHEAD', 'WELCOME', 'CUTE'][Math.floor(Math.random() * 4)]
      });
    } else if (type < 0.6) {
      // Rock
      obstacles.push({
        x: x,
        y: ty,
        type: 'rock',
        size: 10 + Math.random() * 15
      });
    } else if (type < 0.7) {
      // Log
      obstacles.push({
        x: x,
        y: ty,
        type: 'log',
        length: 20 + Math.random() * 20
      });
    } else if (type < 0.8) {
      // Present
      obstacles.push({
        x: x,
        y: ty,
        type: 'present',
        width: 20 + Math.random() * 15,
        height: 15 + Math.random() * 10,
        color: ['#ff0000', '#00ff00', '#0000ff', '#ffff00'][Math.floor(Math.random() * 4)]
      });
    } else if (type < 0.85) {
      // Penguin
      obstacles.push({
        x: x,
        y: ty,
        type: 'penguin',
        height: 25 + Math.random() * 10
      });
    } else if (type < 0.9) {
      // Rabbit
      obstacles.push({
        x: x,
        y: ty,
        type: 'rabbit'
      });
    } else if (type < 0.95) {
      // Igloo
      obstacles.push({
        x: x,
        y: ty,
        type: 'igloo',
        radius: 20 + Math.random() * 15
      });
    } else if (type < 0.98) {
      // Snow fort
      obstacles.push({
        x: x,
        y: ty,
        type: 'fort',
        width: 40 + Math.random() * 30,
        height: 20 + Math.random() * 15
      });
    }
  }
}

function getTerrainHeight(x) {
  // Find closest terrain point
  let idx = Math.floor(x / SEGMENT_W);
  if (idx < 0) idx = 0;
  if (idx >= terrainPoints.length - 1) idx = terrainPoints.length - 2;
  
  let p1 = terrainPoints[idx];
  let p2 = terrainPoints[idx + 1];
  
  let t = (x - p1.x) / SEGMENT_W;
  return p1.y + (p2.y - p1.y) * t;
}

function getTerrainAngle(x) {
  let dx = SEGMENT_W;
  let y1 = getTerrainHeight(x - dx);
  let y2 = getTerrainHeight(x + dx);
  return Math.atan2(y2 - y1, dx * 2);
}

// --- Update Functions ---
function updateSledder(dt) {
  // Physics
  let slopeAngle = getTerrainAngle(sled.x);
  
  if (sled.grounded) {
    // Follow terrain
    let terrainY = getTerrainHeight(sled.x);
    sled.y = terrainY - 5; // Slight offset for sled
    
    // Rotate toward slope
    let angleDiff = slopeAngle - sled.angle;
    sled.va += angleDiff * 0.1;
    sled.va *= 0.9; // Damping
    sled.angle += sled.va;
    
    // Accelerate from gravity
    sled.vx += Math.sin(sled.angle) * 0.15;
    
    // Friction
    sled.vx *= FRICTION;
    
    // Keep minimum speed
    if (sled.vx < 1) sled.vx = 1;
    
    // Check if stuck or upside down
    if (Math.abs(sled.va) < 0.01 && sled.vx < 1.5) {
      sled.stuckTimer += dt;
    } else {
      sled.stuckTimer = 0;
    }
    
    if (Math.abs(sled.angle) > Math.PI * 0.4) {
      sled.upsideDown += dt;
    } else {
      sled.upsideDown = 0;
    }
    
  } else {
    // Airborne
    sled.vy += GRAVITY;
    sled.y += sled.vy;
    sled.x += sled.vx;
    
    // Rotate slightly based on takeoff
    sled.angle += sled.va * 0.5;
    sled.va *= 0.95;
    
    // Check landing
    let terrainY = getTerrainHeight(sled.x);
    if (sled.y >= terrainY - 5) {
      sled.y = terrainY - 5;
      sled.vy = 0;
      sled.grounded = true;
      
      // Smooth landing
      let landingAngle = getTerrainAngle(sled.x);
      if (Math.abs(landingAngle - sled.angle) < Math.PI * 0.5) {
        sled.angle += (landingAngle - sled.angle) * 0.3;
      }
    }
  }
  
  // Update scarf
  updateScarf(dt);
  
  // Distance tracking
  distance = Math.floor(sled.x / 10);
  speed = Math.floor(sled.vx * 10);
}

function updateScarf(dt) {
  let headX = sled.x + Math.cos(sled.angle) * 15;
  let headY = sled.y + Math.sin(sled.angle) * 15;
  
  // First segment follows head
  sled.scarfPoints[0].x = headX;
  sled.scarfPoints[0].y = headY;
  
  // Rest follow previous segment with spring physics
  for (let i = 1; i < SCARF_SEGMENTS; i++) {
    let prev = sled.scarfPoints[i - 1];
    let curr = sled.scarfPoints[i];
    let vel = sled.scarfVelocities[i];
    
    let dx = prev.x - curr.x;
    let dy = prev.y - curr.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    let targetDist = SCARF_SEG_LEN;
    
    if (dist > 0) {
      let force = (dist - targetDist) / dist;
      vel.x += dx * force * 0.1;
      vel.y += dy * force * 0.1;
    }
    
    // Wind effect
    vel.x += wind * 0.5;
    vel.y += Math.sin(gameTime * 0.01 + i) * 0.1;
    
    // Damping
    vel.x *= 0.9;
    vel.y *= 0.9;
    
    curr.x += vel.x;
    curr.y += vel.y;
  }
}

function updateWeather(dt) {
  weatherTimer += dt;
  
  if (weatherTimer > 500) {
    weatherTimer = 0;
    let r = Math.random();
    if (r < 0.3) {
      weather = 'clear';
    } else if (r < 0.6) {
      weather = 'light';
    } else if (r < 0.8) {
      weather = 'heavy';
    } else {
      weather = 'windy';
    }
  }
  
  // Update wind
  if (weather === 'windy') {
    wind = 2 + Math.sin(gameTime * 0.005) * 1;
  } else if (weather === 'heavy') {
    wind = 1 + Math.sin(gameTime * 0.003) * 0.5;
  } else {
    wind *= 0.95;
  }
  
  // Update snow particles
  let maxSnow = weather === 'clear' ? 50 : weather === 'light' ? 100 : weather === 'heavy' ? 200 : 300;
  
  while (snowParticles.length < maxSnow) {
    snowParticles.push({
      x: Math.random() * W + sled.x * 0.1,
      y: Math.random() * H,
      size: 1 + Math.random() * 2,
      speed: 0.5 + Math.random() * 1.5,
      drift: Math.random() * 2 - 1
    });
  }
  
  // Update snow
  for (let i = snowParticles.length - 1; i >= 0; i--) {
    let p = snowParticles[i];
    p.y += p.speed;
    p.x += wind + p.drift;
    
    if (p.y > H) {
      p.y = -10;
      p.x = sled.x + Math.random() * W;
    }
  }
}

function updateBackground(dt) {
  // Update clouds
  for (let cloud of clouds) {
    cloud.x += cloud.speed + wind * 0.5;
    if (cloud.x > sled.x + W * 2) {
      cloud.x = sled.x - W * 0.5;
      cloud.y = 50 + Math.random() * 150;
    }
  }
  
  // Update stars (visible at night)
  for (let star of stars) {
    star.twinkle += 0.02;
  }
  
  // Update easter eggs
  updateEasterEggs(dt);
}

function updateEasterEggs(dt) {
  // Santa
  if (Math.random() < 0.0001) {
    easterEggs.push({
      type: 'santa',
      x: sled.x - W,
      y: 100 + Math.random() * 100,
      speed: 3 + Math.random() * 2
    });
  }
  
  // Yeti
  if (Math.random() < 0.0001) {
    easterEggs.push({
      type: 'yeti',
      x: sled.x - W,
      y: 300 + Math.random() * 100,
      speed: 2 + Math.random() * 1
    });
  }
  
  // UFO
  if (Math.random() < 0.00005) {
    easterEggs.push({
      type: 'ufo',
      x: sled.x - W,
      y: 50 + Math.random() * 150,
      targetSnowman: null
    });
  }
  
  // Update existing easter eggs
  for (let i = easterEggs.length - 1; i >= 0; i--) {
    let egg = easterEggs[i];
    egg.x += egg.speed;
    
    if (egg.x > sled.x + W * 2) {
      easterEggs.splice(i, 1);
    }
    
    // UFO targeting snowman
    if (egg.type === 'ufo' && !egg.targetSnowman) {
      for (let sm of snowmen) {
        if (Math.abs(sm.x - egg.x) < 50 && Math.abs(sm.y - egg.y) < 50) {
          egg.targetSnowman = sm;
          break;
        }
      }
    }
  }
}

function checkRestarts() {
  // Check if sledder is stuck
  if (sled.stuckTimer > 300) {
    return true;
  }
  
  // Check if sledder is upside down for too long
  if (sled.upsideDown > 300) {
    return true;
  }
  
  // Check if sledder fell below terrain
  let terrainY = getTerrainHeight(sled.x);
  if (sled.y > terrainY + 100) {
    return true;
  }
  
  return false;
}

// --- Render Functions ---
function render() {
  // Clear
  ctx.fillStyle = getSkyColor();
  ctx.fillRect(0, 0, W, H);
  
  // Render background layers
  renderBackground();
  
  // Render terrain
  renderTerrain();
  
  // Render decorations
  renderDecorations();
  
  // Render sledder
  renderSledder();
  
  // Render easter eggs
  renderEasterEggs();
  
  // Render snow
  renderSnow();
  
  // Render UI
  renderUI();
}

function getSkyColor() {
  let phase = dayPhase;
  // 0 = midnight, 0.25 = dawn, 0.5 = noon, 0.75 = dusk
  if (phase < 0.25) {
    // Night to dawn
    let t = phase / 0.25;
    let r = Math.floor(26 + t * 100);
    let g = Math.floor(26 + t * 80);
    let b = Math.floor(46 + t * 100);
    return `rgb(${r},${g},${b})`;
  } else if (phase < 0.75) {
    // Day
    return '#87CEEB';
  } else {
    // Dusk to night
    let t = (phase - 0.75) / 0.
