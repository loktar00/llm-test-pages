<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,-width=device-width">
    <title>Oil Painting Self-Creation</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="p"></canvas>
    <script>
        const canvas = document.getElementById('p');
        const ctx = canvas.getContext('2d');
        
        let W, H;
        let seed = Date.now();
        
        // Seeded Random
        function rand(min = 0, max = 1) {
            seed = (seed * 9301 + 4929) % 233280;
            return min + (seed / 233280) * (max - min);
        }

        // Noise for terrain
        function noise(x) {
            return Math.sin(x * 0.002) * 100 + Math.sin(x * 0.005) * 50 + Math.sin(x * 0.01) * 20;
        }

        // Resize handling
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            resetCanvas();
        }

        let strokes = [];
        let currentStrokeIndex = 0;
        let animationId;

        function resetCanvas() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, W, H);
            generatePainting();
        }

        function generatePainting() {
            strokes = [];
            const horizon = H * 0.55 + noise(W/2);
            
            // 1. Sky Strokes (Horizontal)
            for (let y = 0; y < horizon; y += 4) {
                const h = rand(2, 8);
                const color = getSkyColor(y, horizon);
                strokes.push({
                    x: 0, y: y, w: W, h: h,
                    type: 'sky',
                    color: color,
                    opacity: 0.6,
                    roughness: 0.1
                });
            }

            // 2. Sun
            const sunX = W * 0.7 + rand(-50, 50);
            const sunY = horizon * 0.6 + rand(-20, 20);
            for (let i = 0; i < 40; i++) {
                const r = rand(10, 100);
                const angle = rand(0, Math.PI * 2);
                strokes.push({
                    x: sunX + Math.cos(angle) * r * rand(0.5, 1.5),
                    y: sunY + Math.sin(angle) * r * rand(0.5, 1.5),
                    w: rand(20, 60), h: rand(10, 30),
                    type: 'sun',
                    color: `rgba(255, ${Math.floor(rand(150, 255))}, ${Math.floor(rand(50, 150))}, 0.8)`,
                    opacity: 0.7,
                    roughness: 0.05
                });
            }

            // 3. Mountains (Diagonal)
            for (let i = 0; i < 1500; i++) {
                const x = rand(0, W);
                const h = noise(x);
                const yBase = horizon + h;
                const yTop = yBase - rand(50, 200);
                strokes.push({
                    x: x, y: yTop, w: rand(5, 15), h: rand(10, 40),
                    type: 'mountain',
                    color: `rgba(${50 + rand(0,50)}, ${60 + rand(0,50)}, ${80 + rand(50)}, ${rand(0.5, 0.9)})`,
                    opacity: 0.8,
                    roughness: 0.2
                });
            }

            // 4. Grass (Vertical)
            for (let y = horizon; y < H; y += 3) {
                const h = rand(5, 15);
                const w = rand(2, 6);
                const color = getGrassColor(y);
                strokes.push({
                    x: 0, y: y, w: w, h: h,
                    type: 'grass',
                    color: color,
                    opacity: 0.75,
                    roughness: 0.05
                });
            }
            
            // Sort by depth (simple z-indexing)
            strokes.sort((a, b) => {
                if (a.type === 'sky' && b.type !== 'sky') return -1;
                if (a.type !== 'sky' && b.type === 'sky') return 1;
                return 0;
            });
        }

        function getSkyColor(y, horizon) {
            const t = y / horizon;
            const r = Math.floor(30 + t * 100);
            const g = Math.floor(40 + t * 80);
            const b = Math.floor(80 + t * 120);
            return `rgba(${r},${g},${b}, 0.8)`;
        }

        function getGrassColor(y) {
            const t = (y - H * 0.55) / (H * 0.45);
            const r = Math.floor(40 + t * 60);
            const g = Math.floor(80 + t * 40);
            const b = Math.floor(30 + t * 20);
            return `rgba(${r},${g},${b}, 0.8)`;
        }

        // Impasto Shader
        function drawImpastoStroke(s) {
            ctx.save();
            
            // Clip to stroke shape
            ctx.beginPath();
            ctx.rect(s.x, s.y, s.w, s.h);
            ctx.clip();
            
            // Fill base
            ctx.fillStyle = s.color;
            ctx.fillRect(s.x, s.y, s.w, s.h);
            
            // Bristle Texture
            const numBristles = Math.floor(s.h / 2) || 1;
            for (let i = 0; i < numBristles; i++) {
                const by = s.y + (i / numBristles) * s.h;
                ctx.strokeStyle = `rgba(0,0,0,${rand(0.1, 0.3)})`;
                ctx.lineWidth = rand(0.5, 2);
                ctx.beginPath();
                
                // Slight curve for organic feel
                const startX = s.x + rand(-2, 2);
                const endX = s.x + s.w + rand(-2, 2);
                
                ctx.moveTo(startX, by + rand(-1, 1));
                ctx.quadraticCurveTo(
                    (startX + endX) / 2, 
                    by + rand(-3, 3), 
                    endX, 
                    by + rand(-1, 1)
                );
                ctx.stroke();
            }
            
            // Highlight (Impasto)
            ctx.fillStyle = `rgba(255,255,255,${rand(0.05, 0.15)})`;
            ctx.fillRect(s.x, s.y, s.w, s.h * 0.3);
            
            ctx.restore();
        }

        function animate() {
            // Draw a batch of strokes per frame
            const batchSize = 5; 
            
            for (let i = 0; i < batchSize && currentStrokeIndex < strokes.length; i++) {
                drawImpastoStroke(strokes[currentStrokeIndex]);
                currentStrokeIndex++;
            }

            if (currentStrokeIndex < strokes.length) {
                animationId = requestAnimationFrame(animate);
            } else {
                // Completion Flourish
                flourish();
            }
        }

        function flourish() {
            // Signature
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = 'italic 20px serif';
            ctx.fillText('Oil Painting', W - 160, H - 30);
            
            // Fade out after 2s
            setTimeout(() => {
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fillRect(0, 0, W, H);
                
                // Start New Cycle
                seed = Date.now() + Math.random();
                generatePainting();
                currentStrokeIndex = 0;
                animate();
            }, 2000);
        }

        window.addEventListener('resize', () => {
            cancelAnimationFrame(animationId);
            resize();
            animate();
        });

        resize();
        animate();

    </script>
</body>
</html>
