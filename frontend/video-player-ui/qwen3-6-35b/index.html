<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Video Player</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --bg: #0a0a0f;
    --surface: rgba(255,255,255,0.07);
    --surface-hover: rgba(255,255,255,0.13);
    --text: #f0f0f5;
    --text-dim: rgba(240,240,245,0.55);
    --accent: #6c5ce7;
    --accent-glow: rgba(108,92,231,0.45);
    --buffered: rgba(255,255,255,0.18);
    --radius: 8px;
    --transition-fast: 0.2s cubic-bezier(.4,0,.2,1);
    --transition-smooth: 0.35s cubic-bezier(.4,0,.2,1);
  }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .player {
    position: relative;
    width: 900px;
    max-width: 95vw;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
    cursor: default;
    user-select: none;
  }

  /* ── Drifting gradient "video" ── */
  .video-canvas {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    background-size: 400% 400%;
    animation: driftGradient 12s ease infinite;
    transition: filter var(--transition-smooth);
  }

  .video-canvas.playing {
    animation: driftGradient 12s ease infinite, pulseGlow 4s ease-in-out infinite;
  }

  @keyframes driftGradient {
    0%   { background-position: 0% 50%; }
    25%  { background-position: 100% 0%; }
    50%  { background-position: 100% 100%; }
    75%  { background-position: 0% 100%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes pulseGlow {
    0%,100% { filter: brightness(1) saturate(1); }
    50%     { filter: brightness(1.08) saturate(1.15); }
  }

  /* Floating orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    pointer-events: none;
  }
  .orb-1 {
    width: 300px; height: 300px;
    background: #6c5ce7;
    top: -10%; left: -5%;
    animation: orbFloat1 18s ease-in-out infinite;
  }
  .orb-2 {
    width: 250px; height: 250px;
    background: #00cec9;
    bottom: -15%; right: -5%;
    animation: orbFloat2 22s ease-in-out infinite;
  }
  .orb-3 {
    width: 200px; height: 200px;
    background: #fd79a8;
    top: 40%; left: 50%;
    animation: orbFloat3 15s ease-in-out infinite;
  }

  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(120px,80px) scale(1.15); }
    66%     { transform: translate(60px,160px) scale(0.9); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(-100px,-60px) scale(1.1); }
    66%     { transform: translate(-50px,-120px) scale(0.95); }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-80px,60px) scale(1.2); }
  }

  /* ── Center play button ── */
  .center-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 72px; height: 72px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--transition-fast), background var(--transition-fast), opacity 0.3s;
    z-index: 5;
  }
  .center-play:hover {
    transform: translate(-50%,-50%) scale(1.1);
    background: rgba(255,255,255,0.2);
  }
  .center-play:active { transform: translate(-50%,-50%) scale(0.95); }

  .center-play svg {
    width: 28px; height: 28px;
    fill: var(--text);
    margin-left: 3px;
    transition: fill var(--transition-fast);
  }

  .center-play .ripple-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    opacity: 0;
    pointer-events: none;
  }

  .center-play.animating .ripple-ring {
    animation: rippleOut 0.7s cubic-bezier(.25,.46,.45,.94) forwards;
  }
  .center-play.animating .ripple-ring:nth-child(2) { animation-delay: 0.12s; }
  .center-play.animating .ripple-ring:nth-child(3) { animation-delay: 0.24s; }

  @keyframes rippleOut {
    0%   { transform: scale(0.8); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  .center-play.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%,-50%) scale(0.7);
  }

  /* ── Control bar ── */
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 16px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
    transition: opacity var(--transition-smooth), transform var(--transition-smooth);
  }

  .controls.hide {
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
  }

  /* ── Seek bar row ── */
  .seek-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-icon {
    width: 36px; height: 36px;
    border: none;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition-fast);
    flex-shrink: 0;
  }
  .btn-icon:hover { background: var(--surface-hover); }
  .btn-icon svg { width: 20px; height: 20px; fill: var(--text); }

  .time-display {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .time-display .current { color: var(--text); }

  /* ── Seek bar ── */
  .seek-container {
    flex: 1;
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .seek-track {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    position: relative;
    overflow: visible;
    transition: height 0.15s;
  }
  .seek-container:hover .seek-track { height: 6px; }

  .seek-buffered {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--buffered);
    border-radius: 4px;
    transition: width 0.3s linear;
  }

  .seek-progress {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.05s linear;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .seek-thumb {
    position: absolute;
    top: 50%;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%,-50%) scale(0);
    transition: transform 0.15s cubic-bezier(.4,0,.2,1), box-shadow 0.15s;
    box-shadow: 0 0 0 0 rgba(255,255,255,0);
    z-index: 2;
    pointer-events: none;
  }
  .seek-container:hover .seek-thumb,
  .seek-container.dragging .seek-thumb {
    transform: translate(-50%,-50%) scale(1);
    box-shadow: 0 0 0 5px rgba(255,255,255,0.12), 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ── Seek preview chip ── */
  .seek-preview {
    position: absolute;
    bottom: 26px;
    transform: translateX(-50%);
    background: rgba(20,20,30,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .seek-preview.visible { opacity: 1; }

  .seek-preview::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: rgba(20,20,30,0.92);
    border-right: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  /* ── Right controls row ── */
  .controls-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .controls-row .spacer { flex: 1; }

  /* ── Volume ── */
  .volume-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .volume-flyout {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    width: 40px;
    height: 120px;
    background: rgba(20,20,30,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-fast), transform var(--transition-fast);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .volume-wrapper:hover .volume-flyout {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  .volume-slider-track {
    width: 4px;
    height: 100%;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    position: relative;
    cursor: pointer;
  }

  .volume-slider-fill {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: height 0.1s;
  }

  .volume-slider-thumb {
    position: absolute;
    left: 50%;
    width: 12px; height: 12px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%,50%);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
    pointer-events: none;
  }

  /* ── Settings ── */
  .settings-wrapper {
    position: relative;
  }

  .settings-menu {
    position: absolute;
    bottom: 44px;
    right: 0;
    width: 200px;
    background: rgba(20,20,30,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 6px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px) scale(0.96);
    transition: opacity var(--transition-fast), transform var(--transition-fast);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    z-index: 30;
  }

  .settings-menu.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .settings-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    padding: 8px 12px 6px;
  }

  .settings-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .settings-item:hover {
    background: var(--surface-hover);
    color: var(--text);
  }
  .settings-item.active {
    color: var(--accent);
  }
  .settings-item.active::after {
    content: '✓';
    font-size: 11px;
    color: var(--accent);
  }

  /* ── Fullscreen toggle ── */
  .btn-fullscreen svg { width: 18px; height: 18px; }

  /* ── Keyboard hint ── */
  .keyboard-hint {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 11px;
    color: var(--text-dim);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    padding: 5px 10px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 15;
  }
  .keyboard-hint.show { opacity: 1; }
</style>
</head>
<body>

<div class="player" id="player">
  <!-- Video canvas -->
  <div class="video-canvas" id="videoCanvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Center play button -->
  <button class="center-play" id="centerPlay" aria-label="Play">
    <span class="ripple-ring"></span>
    <span class="ripple-ring"></span>
    <span class="ripple-ring"></span>
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <!-- Keyboard hint -->
  <div class="keyboard-hint" id="kbHint">Space to play · M to mute · ← → to seek</div>

  <!-- Controls -->
  <div class="controls" id="controls">
    <!-- Seek row -->
    <div class="seek-row">
      <button class="btn-icon" id="btnPlay" aria-label="Play/Pause">
        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="time-display">
        <span class="current" id="currentTime">0:00</span>
        <span> / </span>
        <span id="duration">3:24</span>
      </div>
      <div class="seek-container" id="seekContainer">
        <div class="seek-track" id="seekTrack">
          <div class="seek-buffered" id="seekBuffered"></div>
          <div class="seek-progress" id="seekProgress"></div>
          <div class="seek-thumb" id="seekThumb"></div>
        </div>
        <div class="seek-preview" id="seekPreview">0:00</div>
      </div>
    </div>
    <!-- Bottom row -->
    <div class="controls-row">
      <div class="spacer"></div>
      <!-- Volume -->
      <div class="volume-wrapper">
        <button class="btn-icon" id="btnVolume" aria-label="Volume">
          <svg id="iconVolHigh" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.49 4.49 0 002.5-3.5zM14 3.23v2.06a6.51 6.51 0 010 13.42v2.06A8.51 8.51 0 0014 3.23z"/></svg>
          <svg id="iconVolMute" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0014 8.5v2.09l2.41 2.41c.09-.31.09-.65.09-.99zM19 12c0 .82-.15 1.61-.41 2.34l1.53 1.53c.56-1.17.88-2.48.88-3.87 0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.47 8.47 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <div class="volume-flyout">
          <div class="volume-slider-track" id="volumeTrack">
            <div class="volume-slider-fill" id="volumeFill"></div>
            <div class="volume-slider-thumb" id="volumeThumb"></div>
          </div>
        </div>
      </div>
      <!-- Settings -->
      <div class="settings-wrapper">
        <button class="btn-icon" id="btnSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.48.48 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.27.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg>
        </button>
        <div class="settings-menu" id="settingsMenu">
          <div class="settings-label">Playback Speed</div>
          <div class="settings-item" data-speed="0.5">0.5×</div>
          <div class="settings-item" data-speed="0.75">0.75×</div>
          <div class="settings-item active" data-speed="1">Normal</div>
          <div class="settings-item" data-speed="1.25">1.25×</div>
          <div class="settings-item" data-speed="1.5">1.5×</div>
          <div class="settings-item" data-speed="2">2×</div>
        </div>
      </div>
      <!-- Fullscreen -->
      <button class="btn-icon btn-fullscreen" id="btnFullscreen" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  const player   = document.getElementById('player');
  const canvas   = document.getElementById('videoCanvas');
  const centerPlay = document.getElementById('centerPlay');
  const controls = document.getElementById('controls');
  const btnPlay  = document.getElementById('btnPlay');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause= document.getElementById('iconPause');
  const seekContainer = document.getElementById('seekContainer');
  const seekTrack   = document.getElementById('seekTrack');
  const seekBuffered= document.getElementById('seekBuffered');
  const seekProgress= document.getElementById('seekProgress');
  const seekThumb   = document.getElementById('seekThumb');
  const seekPreview = document.getElementById('seekPreview');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl    = document.getElementById('duration');
  const btnVolume = document.getElementById('btnVolume');
  const iconVolHigh = document.getElementById('iconVolHigh');
  const iconVolMute = document.getElementById('iconVolMute');
  const volumeTrack = document.getElementById('volumeTrack');
  const volumeFill  = document.getElementById('volumeFill');
  const volumeThumb = document.getElementById('volumeThumb');
  const btnSettings = document.getElementById('btnSettings');
  const settingsMenu= document.getElementById('settingsMenu');
  const btnFullscreen = document.getElementById('btnFullscreen');
  const kbHint = document.getElementById('kbHint');

  // ── State ──
  const TOTAL_DURATION = 204; // 3:24 in seconds
  let isPlaying = false;
  let currentTime = 0;
  let volume = 0.75;
  let playbackSpeed = 1;
  let hideTimer = null;
  let isDragging = false;
  let volumeDragging = false;
  let showHintTimeout = null;

  // Fake buffered (simulates ahead loading)
  let bufferedEnd = 0;
  const BUFFER_CHUNKS = [0.3, 0.55, 0.7, 0.85, 0.95];
  let bufferIndex = 0;

  // ── Helpers ──
  function formatTime(s) {
    s = Math.max(0, Math.min(s, TOTAL_DURATION));
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function pct(x, min, max) {
    return Math.max(0, Math.min(1, (x - min) / (max - min)));
  }

  // ── Play / Pause ──
  function togglePlay() {
    isPlaying = !isPlaying;
    if (isPlaying) {
      iconPlay.style.display = 'none';
      iconPause.style.display = '';
      centerPlay.classList.add('hidden');
      canvas.classList.add('playing');
      startPlayback();
      showControls();
      scheduleHide();
      showKBHint();
    } else {
      iconPlay.style.display = '';
      iconPause.style.display = 'none';
      centerPlay.classList.remove('hidden');
      canvas.classList.remove('playing');
      stopPlayback();
      showControls();
    }
    // Ripple on center play
    centerPlay.classList.remove('animating');
    void centerPlay.offsetWidth;
    centerPlay.classList.add('animating');
  }

  centerPlay.addEventListener('click', togglePlay);
  btnPlay.addEventListener('click', togglePlay);

  // ── Playback simulation ──
  let lastTick = null;
  let rafId = null;

  function startPlayback() {
    lastTick = performance.now();
    tick();
  }

  function stopPlayback() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function tick() {
    if (!isPlaying) return;
    const now = performance.now();
    const dt = (now - lastTick) / 1000;
    lastTick = now;
    currentTime += dt * playbackSpeed;

    if (currentTime >= TOTAL_DURATION) {
      currentTime = TOTAL_DURATION;
      isPlaying = false;
      iconPlay.style.display = '';
      iconPause.style.display = 'none';
      centerPlay.classList.remove('hidden');
      canvas.classList.remove('playing');
      updateUI();
      showControls();
      return;
    }

    // Simulate buffered chunks
    updateBuffered();

    updateUI();
    rafId = requestAnimationFrame(tick);
  }

  function updateBuffered() {
    const progress = currentTime / TOTAL_DURATION;
    const nextChunk = BUFFER_CHUNKS[bufferIndex];
    if (nextChunk && progress >= nextChunk - 0.02) {
      bufferIndex = Math.min(bufferIndex + 1, BUFFER_CHUNKS.length - 1);
      bufferedEnd = BUFFER_CHUNKS[bufferIndex] * TOTAL_DURATION;
    }
  }

  // ── UI Update ──
  function updateUI() {
    const pct = currentTime / TOTAL_DURATION;
    seekProgress.style.width = (pct * 100) + '%';
    seekBuffered.style.width = (bufferedEnd / TOTAL_DURATION * 100) + '%';
    seekThumb.style.left = (pct * 100) + '%';
    currentTimeEl.textContent = formatTime(currentTime);
  }

  // ── Seek ──
  function getTimeFromX(clientX) {
    const rect = seekTrack.getBoundingClientRect();
    const x = clientX - rect.left;
    return pct(x, 0, rect.width) * TOTAL_DURATION;
  }

  seekContainer.addEventListener('mousemove', function(e) {
    if (isDragging) return;
    const rect = seekTrack.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const t = pct(x, 0, rect.width) * TOTAL_DURATION;

    seekPreview.textContent = formatTime(t);
    seekPreview.style.left = Math.max(10, Math.min(rect.width - 10, x)) + 'px';
    seekPreview.classList.add('visible');
  });

  seekContainer.addEventListener('mouseleave', function() {
    if (!isDragging) seekPreview.classList.remove('visible');
  });

  seekContainer.addEventListener('mousedown', function(e) {
    e.preventDefault();
    isDragging = true;
    seekContainer.classList.add('dragging');
    handleSeek(e);
  });

  document.addEventListener('mousemove', function(e) {
    if (isDragging) handleSeek(e);
    if (volumeDragging) handleVolume(e);
  });

  document.addEventListener('mouseup', function(e) {
    if (isDragging) {
      isDragging = false;
      seekContainer.classList.remove('dragging');
      seekPreview.classList.remove('visible');
    }
    if (volumeDragging) {
      volumeDragging = false;
    }
  });

  function handleSeek(e) {
    currentTime = getTimeFromX(e.clientX);
    updateUI();
  }

  // ── Volume ──
  function getVolumeFromY(clientY) {
    const rect = volumeTrack.getBoundingClientRect();
    return 1 - pct(clientY - rect.top, 0, rect.height);
  }

  volumeTrack.addEventListener('mousedown', function(e) {
    e.preventDefault();
    e.stopPropagation();
    volumeDragging = true;
    handleVolume(e);
  });

  function handleVolume(e) {
    volume = getVolumeFromY(e.clientY);
    volume = Math.max(0, Math.min(1, volume));
    volumeFill.style.height = (volume * 100) + '%';
    volumeThumb.style.bottom = (volume * 100) + '%';
    volumeThumb.style.top = 'auto';
    updateVolumeIcon();
  }

  function updateVolumeIcon() {
    if (volume < 0.05) {
      iconVolHigh.style.display = 'none';
      iconVolMute.style.display = '';
    } else {
      iconVolHigh.style.display = '';
      iconVolMute.style.display = 'none';
    }
  }

  // Init volume UI
  volumeFill.style.height = (volume * 100) + '%';
  volumeThumb.style.bottom = (volume * 100) + '%';

  btnVolume.addEventListener('click', function() {
    if (volume > 0.05) {
      volume = 0;
    } else {
      volume = 0.75;
    }
    volumeFill.style.height = (volume * 100) + '%';
    volumeThumb.style.bottom = (volume * 100) + '%';
    updateVolumeIcon();
  });

  // ── Settings ──
  btnSettings.addEventListener('click', function(e) {
    e.stopPropagation();
    settingsMenu.classList.toggle('open');
  });

  document.addEventListener('click', function(e) {
    if (!settingsMenu.contains(e.target) && e.target !== btnSettings) {
      settingsMenu.classList.remove('open');
    }
  });

  settingsMenu.querySelectorAll('.settings-item').forEach(function(item) {
    item.addEventListener('click', function() {
      settingsMenu.querySelectorAll('.settings-item').forEach(function(i) {
        i.classList.remove('active');
      });
      item.classList.add('active');
      playbackSpeed = parseFloat(item.dataset.speed);
      settingsMenu.classList.remove('open');
    });
  });

  // ── Controls visibility ──
  function showControls() {
    controls.classList.remove('hide');
    resetHideTimer();
  }

  function scheduleHide() {
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
      if (isPlaying) controls.classList.add('hide');
    }, 2500);
  }

  function resetHideTimer() {
    if (hideTimer) clearTimeout(hideTimer);
    if (isPlaying) {
      hideTimer = setTimeout(function() {
        controls.classList.add('hide');
      }, 2500);
    }
  }

  player.addEventListener('mousemove', function() {
    showControls();
  });

  player.addEventListener('mouseleave', function() {
    if (isPlaying) {
      hideTimer = setTimeout(function() {
        controls.classList.add('hide');
      }, 1000);
    }
  });

  // ── Fullscreen ──
  btnFullscreen.addEventListener('click', function() {
    if (!document.fullscreenElement) {
      player.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen();
    }
  });

  // ── Keyboard ──
  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'KeyM') {
      volume = volume > 0.05 ? 0 : 0.75;
      volumeFill.style.height = (volume * 100) + '%';
      volumeThumb.style.bottom = (volume * 100) + '%';
      updateVolumeIcon();
    } else if (e.code === 'ArrowRight') {
      currentTime = Math.min(currentTime + 5, TOTAL_DURATION);
      updateUI();
    } else if (e.code === 'ArrowLeft') {
      currentTime = Math.max(currentTime - 5, 0);
      updateUI();
    }
  });

  // ── Keyboard hint ──
  function showKBHint() {
    kbHint.classList.add('show');
    if (showHintTimeout) clearTimeout(showHintTimeout);
    showHintTimeout = setTimeout(function() {
      kbHint.classList.remove('show');
    }, 3000);
  }

  // Show hint on first interaction
  let hintShown = false;
  player.addEventListener('mousemove', function() {
    if (!hintShown && !isPlaying) {
      hintShown = true;
      kbHint.classList.add('show');
      showHintTimeout = setTimeout(function() {
        kbHint.classList.remove('show');
      }, 4000);
    }
  });

  // ── Click on canvas to toggle play ──
  canvas.addEventListener('click', function(e) {
    if (e.target === canvas || e.target.classList.contains('orb')) {
      togglePlay();
    }
  });

  // Initialize
  updateUI();
})();
</script>
</body>
</html>
