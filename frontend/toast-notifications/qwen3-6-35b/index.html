<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Notification Playground</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            
            --success-hue: 145;
            --error-hue: 0;
            --info-hue: 215;
            --warning-hue: 38;

            --toast-width: 360px;
            --toast-height: 64px;
            --toast-gap: 12px;
            --radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* UI Controls */
        .controls {
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }

        button {
            border: none;
            background: #334155;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:active {
            transform: scale(0.96);
        }

        button:hover {
            background: #475569;
        }

        button span {
            font-size: 1.1rem;
        }

        /* Toast Container */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: var(--toast-width);
            display: flex;
            flex-direction: column;
            gap: var(--toast-gap);
            z-index: 100;
            pointer-events: none; /* Let clicks pass through to empty space */
        }

        /* Individual Toast */
        .toast {
            position: relative;
            background: var(--surface-color);
            border-radius: var(--radius);
            height: var(--toast-height);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: auto;
            overflow: hidden;
            
            /* Animation Entry */
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: left center;
        }

        .toast.removing {
            animation: slideOut 0.3s cubic-bezier(0.5, 1, 0.89, 0) forwards;
        }

        /* Type Specific Styles */
        .toast.success { border-left: 4px solid hsl(var(--success-hue), 60%, 50%); }
        .toast.error { border-left: 4px solid hsl(var(--error-hue), 60%, 50%); }
        .toast.info { border-left: 4px solid hsl(var(--info-hue), 60%, 50%); }
        .toast.warning { border-left: 4px solid hsl(var(--warning-hue), 60%, 50%); }

        .toast.success .icon-color { color: hsl(var(--success-hue), 70%, 60%); }
        .toast.error .icon-color { color: hsl(var(--error-hue), 70%, 60%); }
        .toast.info .icon-color { color: hsl(var(--info-hue), 70%, 60%); }
        .toast.warning .icon-color { color: hsl(var(--warning-hue), 70%, 60%); }

        /* Icon */
        .icon-container {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-color { font-size: 20px; line-height: 1; }

        /* Content */
        .toast-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-right: 16px;
            z-index: 2;
        }

        .toast-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2px;
            letter-spacing: 0.02em;
        }

        .toast-message {
            font-size: 0.75rem;
            color: var(--muted-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Progress Bar */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            transform-origin: left;
            animation: progress 5s linear forwards;
        }

        .toast.success .progress-fill { background: hsl(var(--success-hue), 60%, 50%); }
        .toast.error .progress-fill { background: hsl(var(--error-hue), 60%, 50%); }
        .toast.info .progress-fill { background: hsl(var(--info-hue), 60%, 50%); }
        .toast.warning .progress-fill { background: hsl(var(--warning-hue), 60%, 50%); }

        /* Hover Pause Logic */
        .toast:hover .progress-fill {
            animation-play-state: paused;
        }

        /* Close Button */
        .close-btn {
            background: transparent;
            border: none;
            color: var(--muted-text);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.2s;
            z-index: 2;
        }

        .close-btn:hover {
            opacity: 1;
            background: rgba(255,255,255,0.05);
        }

        .close-btn svg {
            width: 14px;
            height: 14px;
            stroke-width: 3;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(100%) scale(0.9);
                height: 0;
                margin-top: 0;
                margin-bottom: 0;
                padding: 0;
                border: none;
            }
        }

        @keyframes progress {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            #toast-container {
                width: calc(100% - 2rem);
                bottom: 1rem;
                right: 1rem;
            }
            .controls {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="triggerToast('success')">
            <span>✓</span> Success
        </button>
        <button onclick="triggerToast('error')">
            <span>��</span> Error
        </button>
        <button onclick="triggerToast('info')">
            <span>��</span> Info
        </button>
        <button onclick="triggerToast('warning')">
            <span>!</span> Warning
        </button>
    </div>

    <div id="toast-container">
        <!-- Toasts injected here -->
    </div>

    <script>
        const container = document.getElementById('toast-container');
        
        const config = {
            success: {
                title: "Success",
                message: "Operation completed successfully.",
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`
            },
            error: {
                title: "Error",
                message: "Something went wrong. Please try again.",
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`
            },
            info: {
                title: "Information",
                message: "System update available at 2:00 PM.",
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`
            },
            warning: {
                title: "Warning",
                message: "Storage space is running low.",
                icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`
            }
        };

        function triggerToast(type) {
            const data = config[type];
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            // Construct HTML
            toast.innerHTML = `
                <div class="icon-container">
                    <span class="icon-color">${data.icon}</span>
                </div>
                <div class="toast-content">
                    <span class="toast-title">${data.title}</span>
                    <span class="toast-message">${data.message}</span>
                </div>
                <button class="close-btn" onclick="removeToast(this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            `;

            container.appendChild(toast);

            // Remove after timeout if not closed
            setTimeout(() => {
                removeToast(toast.querySelector('.close-btn'));
            }, 5000);
        }

        function removeToast(btn) {
            // Find the toast container (parent of button)
            const toast = btn.closest('.toast');
            if (!toast) return;

            // Add removal class for animation
            toast.classList.add('removing');

            // Wait for animation to finish before removing from DOM
            // We match the CSS animation duration (0.3s)
            setTimeout(() => {
                if (toast.parentNode === container) {
                    container.removeChild(toast);
                }
            }, 300);
        }
    </script>
</body>
</html>
