<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:monospace}
#race{display:flex;justify-content:space-around;align-items:center;height:100%;padding:5px;gap:5px}
.panel{position:relative;width:25%;height:100%;border:1px solid #333}
 canvas{display:block;width:100%;height:100%}
 .overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
 .label{position:absolute;top:5px;left:5px;background:rgba(0,0,0,0.7);padding:2px 6px;font-size:12px;border-radius:3px}
 .stats{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,0.7);padding:2px 6px;font-size:12px;border-radius:3px}
 .standings{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#fff;padding:20px;border-radius:10px;text-align:center;display:none;z-index:10}
 .standings h2{margin-bottom:15px}
 .standing-row{display:flex;align-items:center;gap:10px;margin:5px 0}
 .rank{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
 .standing-name{width:120px;text-align:left}
</style>
</head>
<body>
<div id="race"></div>
<div id="standings" class="standings"></div>
<script>
// ====== Configuration ======
const PANEL_COUNT = 4;
const ALGORITHMS = ['bubble', 'insertion', 'merge', 'quick'];
const ALGO_LABELS = {
    bubble: 'Bubble Sort',
    insertion: 'Insertion Sort',
    merge: 'Merge Sort',
    quick: 'Quick Sort'
};
const COLORS = [
    ['#FF6B6B', '#FF8E8E', '#FFB4B4'], // Red
    ['#4ECDC4', '#78D1CB', '#A8E6CF'], // Teal
    ['#FFE66D', '#FFF59D', '#FFEB3B'], // Yellow
    ['#A8E6CF', '#B8E9D6', '#C8F0E0'], // Green
];

// ====== Utility Functions ======
function shuffleArray(arr) {
    const result = [...arr];
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}

function createArray(size) {
    const arr = [];
    for (let i = 1; i <= size; i++) {
        arr.push(i);
    }
    return arr;
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// ====== Sorting Algorithms with Steps ======
class SortingStep {
    constructor(comparison = [], swap = null, finished = false, left = -1, mid = -1, right = -1, sorted = []) {
        this.comparison = comparison; // indices being compared
        this.swap = swap;              // indices being swapped (or null)
        this.finished = finished;      // algorithm finished
        this.left = left;              // merge sort: left boundary
        this.mid = mid;                // merge sort: mid boundary
        this.right = right;            // merge sort: right boundary
        this.sorted = sorted;          // indices that are confirmed sorted
    }
}

// Bubble Sort Generator
function* bubbleSort(arr) {
    const n = arr.length;
    let sortedCount = 0;
    for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - 1 - i; j++) {
            yield new SortingStep([j, j + 1]);
            
            if (arr[j] > arr[j + 1]) {
                [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
                yield new SortingStep([j, j + 1], [j, j + 1]);
            }
        }
        sortedCount++;
        yield new SortingStep([], null, false, -1, -1, -1, Array.from({length: sortedCount}, (_, k) => n - 1 - k));
    }
    yield new SortingStep([], null, true);
}

// Insertion Sort Generator
function* insertionSort(arr) {
    const n = arr.length;
    for (let i = 1; i < n; i++) {
        const key = arr[i];
        let j = i - 1;
        
        yield new SortingStep([j, i]);
        
        while (j >= 0 && arr[j] > key) {
            [arr[j + 1], arr[j]] = [arr[j], arr[j + 1]];
            yield new SortingStep([j, j + 1], [j, j + 1]);
            j--;
            if (j >= 0) {
                yield new SortingStep([j, j + 1]);
            }
        }
        yield new SortingStep([], null, false, -1, -1, -1, Array.from({length: i + 1}, (_, k) => k));
    }
    yield new SortingStep([], null, true);
}

// Merge Sort Generator
function* mergeSort(arr) {
    const n = arr.length;
    const size = 1;
    const sorted = new Array(n).fill(false);
    
    for (let currSize = 1; currSize < n; currSize *= 2) {
        for (let left = 0; left < n; left += 2 * currSize) {
            const mid = Math.min(left + currSize - 1, n - 1);
            const right = Math.min(left + 2 * currSize - 1, n - 1);
            
            if (mid >= right) continue;
            
            yield* merge(arr, left, mid, right);
        }
    }
    
    yield new SortingStep([], null, true);
}

function* merge(arr, left, mid, right) {
    const leftArr = arr.slice(left, mid + 1);
    const rightArr = arr.slice(mid + 1, right + 1);
    let i = 0, j = 0, k = left;
    
    while (i < leftArr.length && j < rightArr.length) {
        yield new SortingStep([left + i, mid + 1 + j], null, false, left, mid, right);
        
        if (leftArr[i] <= rightArr[j]) {
            arr[k] = leftArr[i];
            i++;
        } else {
            arr[k] = rightArr[j];
            j++;
            yield new SortingStep([left + i, mid + 1 + j], [k], false, left, mid, right);
        }
        k++;
    }
    
    while (i < leftArr.length) {
        arr[k] = leftArr[i];
        i++;
        k++;
    }
    
    while (j < rightArr.length) {
        arr[k] = rightArr[j];
        j++;
        k++;
    }
}

// Quick Sort Generator
function* quickSort(arr) {
    const n = arr.length;
    const stack = [[0, n - 1]];
    
    while (stack.length > 0) {
        const [low, high] = stack.pop();
        
        if (low >= high) continue;
        
        const pivotIndex = yield* partition(arr, low, high);
        
        // Push in order so we process smaller subarrays first
        stack.push([low, pivotIndex - 1]);
        stack.push([pivotIndex + 1, high]);
    }
    
    yield new SortingStep([], null, true);
}

function* partition(arr, low, high) {
    const pivot = arr[high];
    let i = low - 1;
    
    yield new SortingStep([high], null, false, low, -1, high);
    yield new SortingStep([high], null, false, low, -1, high, []);
    
    for (let j = low; j < high; j++) {
        yield new SortingStep([j, high]);
        
        if (arr[j] <= pivot) {
            i++;
            if (i !== j) {
                [arr[i], arr[j]] = [arr[j], arr[i]];
                yield new SortingStep([i, j], [i, j], false, low, -1, high);
            }
        }
    }
    
    [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
    yield new SortingStep([i + 1, high], [i + 1, high], false, low, -1, high);
    
    return i + 1;
}

// ====== Visualization Panel ======
class SortingPanel {
    constructor(container, algoName, colorScheme, index) {
        this.container = container;
        this.algoName = algoName;
        this.colorScheme = colorScheme;
        this.index = index;
        this.operations = 0;
        this.generator = null;
        this.arr = [];
        
        this.panelEl = document.createElement('div');
        this.panelEl.className = 'panel';
        this.panelEl.style.background = `linear-gradient(180deg, ${colorScheme[0]}, ${colorScheme[0]})`;
        
        this.canvas = document.createElement('canvas');
        this.canvas.width = 200;
        this.canvas.height = 500;
        this.ctx = this.canvas.getContext('2d');
        
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = ALGO_LABELS[algoName];
        label.style.background = colorScheme[0];
        label.style.color = '#fff';
        
        this.statsEl = document.createElement('div');
        this.statsEl.className = 'stats';
        this.statsEl.style.background = colorScheme[0];
        this.statsEl.style.color = '#fff';
        this.statsEl.textContent = `Ops: 0`;
        
        this.panelEl.appendChild(this.canvas);
        this.panelEl.appendChild(label);
        this.panelEl.appendChild(this.statsEl);
        container.appendChild(this.panelEl);
    }
    
    setup(arr) {
        this.arr = [...arr];
        this.operations = 0;
        this.updateStats();
        
        switch (this.algoName) {
            case 'bubble': this.generator = bubbleSort(this.arr); break;
            case 'insertion': this.generator = insertionSort(this.arr); break;
            case 'merge': this.generator = mergeSort(this.arr); break;
            case 'quick': this.generator = quickSort(this.arr); break;
        }
    }
    
    step() {
        if (!this.generator) return { finished: false };
        
        const result = this.generator.next();
        if (result.done) return { finished: true };
        
        const step = result.value;
        
        if (step.comparison.length > 0 || step.swap) {
            this.operations++;
            this.updateStats();
        }
        
        this.render(step);
        
        return { finished: step.finished };
    }
    
    updateStats() {
        this.statsEl.textContent = `Ops: ${this.operations}`;
    }
    
    render(step) {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const n = this.arr.length;
        const barWidth = Math.max(1, Math.floor(w / n)) - 1;
        const gap = 1;
        
        ctx.clearRect(0, 0, w, h);
        
        for (let i = 0; i < n; i++) {
            const val = this.arr[i];
            const barHeight = (val / n) * (h - 20);
            const x = i * (barWidth + gap);
            const y = h - barHeight;
            
            // Determine color based on state
            let color = this.colorScheme[1];
            let borderColor = this.colorScheme[2];
            
            if (step.sorted.includes(i)) {
                color = '#4CAF50';
                borderColor = '#66BB6A';
            } else if (step.comparison.includes(i)) {
                color = '#FFD700';
                borderColor = '#FFE066';
            } else if (step.swap && step.swap.includes(i)) {
                color = '#FF6B6B';
                borderColor = '#FF8E8E';
            }
            
            if (step.left !== -1 && (i < step.left || i > step.right)) {
                color = this.colorScheme[1];
                borderColor = this.colorScheme[2];
            }
            
            ctx.fillStyle = color;
            ctx.fillRect(x, y, barWidth, barHeight);
            ctx.strokeStyle = borderColor;
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, barWidth, barHeight);
        }
    }
}

// ====== Main Race Controller ======
class SortingRace {
    constructor() {
        this.container = document.getElementById('race');
        this.standingsEl = document.getElementById('standings');
        this.panels = [];
        this.results = [];
        this.animationId = null;
        this.isShowingStandings = false;
        
        // Initialize panels
        for (let i = 0; i < PANEL_COUNT; i++) {
            const panel = new SortingPanel(
                this.container,
                ALGORITHMS[i],
                COLORS[i],
                i
            );
            this.panels.push(panel);
        }
        
        this.runRace();
    }
    
    getNextConfig() {
        // Start with smaller sizes and work up
        if (!this.currentSize) this.currentSize = 30;
        else this.currentSize = Math.min(this.currentSize + 5, 80);
        
        const size = this.currentSize;
        const colorIdx = Math.floor(Math.random() * COLORS.length);
        const baseColors = COLORS[colorIdx];
        
        // Generate a new color palette
        const hue = Math.floor(Math.random() * 360);
        const palette = [
            `hsl(${hue}, 70%, 50%)`,
            `hsl(${(hue + 30) % 360}, 70%, 60%)`,
            `hsl(${(hue + 60) % 360}, 70%, 70%)`
        ];
        
        return { size, palette };
    }
    
    async runRace() {
        // Reset results
        this.results = [];
        
        // Generate new shuffled array
        const { size, palette } = this.getNextConfig();
        const baseArray = createArray(size);
        const shuffled = shuffleArray(baseArray);
        
        // Setup panels with new arrays
        for (let i = 0; i < PANEL_COUNT; i++) {
            this.panels[i].setup(shuffled);
            this.panels[i].colorScheme = palette;
            // Re-render initial state
            this.panels[i].render(new SortingStep());
        }
        
        // Animation loop
        let allFinished = false;
        const startTime = Date.now();
        const raceDuration = 30000; // 30 seconds max
        
        const animate = () => {
            if (allFinished) return;
            
            // Check if we've exceeded max time
            if (Date.now() - startTime > raceDuration) {
                // Force finish all unfinished algorithms
                for (let panel of this.panels) {
                    if (!this.results.some(r => r.algo === panel.algoName)) {
                        this.results.push({
                            algo: panel.algoName,
                            time: Date.now() - startTime,
                            color: palette
                        });
                    }
                }
                this.showStandings();
                return;
            }
            
            let anyActive = false;
            
            for (let i = 0; i < this.panels.length; i++) {
                const panel = this.panels[i];
                // Skip if already finished
                if (this.results.some(r => r.algo === panel.algoName)) {
                    continue;
                }
                
                const result = panel.step();
                
                if (result.finished) {
                    this.results.push({
                        algo: panel.algoName,
                        time: Date.now() - startTime,
                        color: palette
                    });
                } else {
                    anyActive = true;
                }
            }
            
            if (this.results.length < PANEL_COUNT) {
                this.animationId = requestAnimationFrame(animate);
            } else {
                this.showStandings();
            }
        };
        
        this.animationId = requestAnimationFrame(animate);
    }
    
    showStandings() {
        if (this.isShowingStandings) return;
        this.isShowingStandings = true;
        
        // Sort by time
        this.results.sort((a, b) => a.time - b.time);
        
        // Build standings HTML
        const colors = ['#FFD700', '#C0C0C0', '#CD7F32', '#8B4513'];
        
        let html = '<h2>🏁 Race Finished!</h2>';
        this.results.forEach((result, i) => {
            const color = colors[i] || '#888';
            html += `
                <div class="standing-row">
                    <div class="rank" style="background:${color};">
                        ${i + 1}
                    </div>
                    <div class="standing-name">
                        ${ALGO_LABELS[result.algo]}
                    </div>
                    <div>
                        ${Math.round(result.time)}ms
                    </div>
                </div>
            `;
        });
        
        this.standingsEl.innerHTML = html;
        this.standingsEl.style.display = 'block';
        
        // Fade out and restart
        setTimeout(() => {
            this.standingsEl.style.display = 'none';
            this.isShowingStandings = false;
            this.runRace();
        }, 3000);
    }
}

// Start the race when page loads
window.addEventListener('load', () => {
    new SortingRace();
});
</script>
</body>
</html>
