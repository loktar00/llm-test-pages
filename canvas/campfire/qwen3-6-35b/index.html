<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire Night</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, groundY, fireX, fireY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  groundY = H * 0.72;
  fireX = cx;
  fireY = groundY;
}
resize();
window.addEventListener('resize', resize);

// --- Stars ---
const stars = [];
for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random() * 3000,
    y: Math.random() * 800,
    r: Math.random() * 1.5 + 0.3,
    twinkleSpeed: Math.random() * 2 + 0.5,
    twinkleOffset: Math.random() * Math.PI * 2,
    brightness: Math.random() * 0.5 + 0.5
  });
}

// --- Meteors ---
const meteors = [];
function spawnMeteor() {
  if (meteors.length < 2 && Math.random() < 0.003) {
    meteors.push({
      x: Math.random() * W,
      y: -20,
      vx: (Math.random() - 0.3) * 4,
      vy: Math.random() * 3 + 2,
      life: 1,
      decay: Math.random() * 0.008 + 0.005,
      length: Math.random() * 60 + 40
    });
  }
}

// --- Flame particles ---
class FlameParticle {
  constructor(layer) {
    this.layer = layer;
    this.reset();
  }
  reset() {
    const spread = this.layer === 0 ? 8 : this.layer === 1 ? 14 : 22;
    const height = this.layer === 0 ? 80 : this.layer === 1 ? 55 : 35;
    this.x = fireX + (Math.random() - 0.5) * spread;
    this.y = fireY - 5;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = -(Math.random() * 1.5 + 1 + this.layer * 0.3);
    this.life = 1;
    this.decay = Math.random() * 0.02 + 0.015 + this.layer * 0.005;
    this.maxSize = (Math.random() * 6 + 4) * (this.layer === 0 ? 1.2 : this.layer === 1 ? 1 : 0.7);
    this.size = this.maxSize;
    this.wobbleSpeed = Math.random() * 3 + 2;
    this.wobbleOffset = Math.random() * Math.PI * 2;
  }
  update(t) {
    this.life -= this.decay;
    this.x += this.vx + Math.sin(t * this.wobbleSpeed + this.wobbleOffset) * 0.3;
    this.y += this.vy;
    this.size = this.maxSize * this.life;
    if (this.life <= 0) this.reset();
  }
  draw(ctx, flicker) {
    const alpha = this.life * (0.6 + flicker * 0.4);
    if (this.layer === 0) {
      const r = 255, g = 200 + flicker * 55, b = 50 + flicker * 100;
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    } else if (this.layer === 1) {
      const r = 255, g = 120 + flicker * 80, b = 10 + flicker * 40;
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.8})`;
    } else {
      const r = 255, g = 60 + flicker * 60, b = 0;
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.5})`;
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const flames = [];
for (let l = 0; l < 3; l++) {
  const count = l === 0 ? 30 : l === 1 ? 25 : 20;
  for (let i = 0; i < count; i++) {
    const p = new FlameParticle(l);
    p.life = Math.random();
    p.y = fireY - Math.random() * 60;
    flames.push(p);
  }
}

// --- Embers ---
class Ember {
  constructor() { this.reset(); }
  reset() {
    this.x = fireX + (Math.random() - 0.5) * 16;
    this.y = fireY - Math.random() * 20;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -(Math.random() * 2 + 1);
    this.life = 1;
    this.decay = Math.random() * 0.003 + 0.002;
    this.size = Math.random() * 2.5 + 1;
    this.spiralSpeed = Math.random() * 2 + 1;
    this.spiralRadius = Math.random() * 15 + 5;
    this.spiralOffset = Math.random() * Math.PI * 2;
    this.height = 0;
    this.maxHeight = Math.random() * 200 + 100;
  }
  update(t) {
    this.life -= this.decay;
    this.height += this.vy;
    const spiralAngle = t * this.spiralSpeed + this.spiralOffset;
    this.x += this.vx + Math.cos(spiralAngle) * this.spiralRadius * 0.02;
    this.y += this.vy;
    this.vx += (Math.random() - 0.5) * 0.1;
    this.vy *= 0.999;
    if (this.life <= 0 || this.y < -20 || this.height > this.maxHeight) this.reset();
  }
  draw(ctx, flicker) {
    const alpha = this.life * (0.5 + flicker * 0.5);
    const g = 180 + flicker * 75;
    ctx.fillStyle = `rgba(255,${g},30,${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const embers = [];
for (let i = 0; i < 40; i++) {
  const e = new Ember();
  e.life = Math.random();
  embers.push(e);
}

// --- Logs ---
class Log {
  constructor(angle, length) {
    this.angle = angle;
    this.length = length;
    this.maxLife = 1;
    this.life = 1;
    this.width = 14 + Math.random() * 8;
    this.collapsed = false;
    this.collapseProgress = 0;
    this.darkness = 0;
    this.respawnTime = 0;
    this.respawnDelay = 8 + Math.random() * 4;
    this.chargePattern = [];
    for (let i = 0; i < 5; i++) {
      this.chargePattern.push({
        pos: Math.random(),
        size: Math.random() * 0.15 + 0.05,
        intensity: Math.random()
      });
    }
  }
  update(dt) {
    if (this.life <= 0) {
      this.respawnTime -= dt;
      if (this.respawnTime <= 0) {
        this.life = this.maxLife;
        this.collapsed = false;
        this.collapseProgress = 0;
        this.darkness = 0;
        this.angle = Math.random() * 0.3 - 0.15;
        for (let i = 0; i < 5; i++) {
          this.chargePattern[i].intensity = Math.random();
        }
      }
      return;
    }
    this.life -= dt * 0.02;
    this.darkness = 1 - this.life;
    if (this.life < 0.4 && !this.collapsed) {
      this.collapsed = true;
    }
    if (this.collapsed) {
      this.collapseProgress = Math.min(1, this.collapseProgress + dt * 0.5);
    }
    if (this.life <= 0) {
      this.respawnTime = this.respawnDelay;
    }
  }
  draw(ctx, flicker) {
    const baseX = fireX;
    const baseY = fireY - 2;
    const cosA = Math.cos(this.angle);
    const sinA = Math.sin(this.angle);
    const collapseY = this.collapseProgress * 15;

    ctx.save();
    ctx.translate(baseX, baseY);

    // Draw log
    const darkness = this.darkness * 0.6;
    const r = Math.floor(60 * (1 - darkness * 0.7));
    const g = Math.floor(35 * (1 - darkness * 0.7));
    const b = Math.floor(20 * (1 - darkness * 0.7));
    const glow = this.life > 0.3 ? (1 - this.darkness) * flicker * 40 : 0;

    ctx.fillStyle = `rgb(${r + glow},${g + glow * 0.5},${b})`;
    ctx.strokeStyle = `rgba(20,10,5,0.5)`;
    ctx.lineWidth = 1;

    ctx.save();
    ctx.rotate(this.angle);
    ctx.translate(0, -collapseY);

    // Log body
    const hw = this.width / 2;
    ctx.beginPath();
    ctx.moveTo(-this.length / 2, -hw);
    ctx.lineTo(this.length / 2, -hw);
    ctx.lineTo(this.length / 2 + 3, hw);
    ctx.lineTo(-this.length / 2 - 3, hw);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Bark texture lines
    ctx.strokeStyle = `rgba(0,0,0,${0.2 + this.darkness * 0.3})`;
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 4; i++) {
      const ly = -hw + (this.width / 5) * (i + 1);
      ctx.beginPath();
      ctx.moveTo(-this.length / 2 + 5, ly);
      ctx.lineTo(this.length / 2 - 5, ly + Math.sin(i) * 2);
      ctx.stroke();
    }

    // Glow on top from fire
    if (this.life > 0.2) {
      const grad = ctx.createLinearGradient(0, -hw, 0, -hw - 10);
      grad.addColorStop(0, `rgba(255,${150 + flicker * 100},30,${(1 - this.darkness) * 0.4 * (0.6 + flicker * 0.4)})`);
      grad.addColorStop(1, 'rgba(255,100,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(-this.length / 2, -hw - 10, this.length, 12);
    }

    // Charred ends
    ctx.fillStyle = `rgba(20,10,5,${0.5 + this.darkness * 0.5})`;
    ctx.beginPath();
    ctx.ellipse(-this.length / 2 - 2, 0, 4, hw + 1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(this.length / 2 + 2, 0, 4, hw + 1, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    ctx.restore();
  }
}

const logs = [
  new Log(-0.25, 70),
  new Log(0.25, 70),
  new Log(0.0, 60),
  new Log(-0.15, 65),
  new Log(0.15, 55)
];

// --- Stones ---
const stones = [];
const stoneCount = 18;
for (let i = 0; i < stoneCount; i++) {
  const angle = (i / stoneCount) * Math.PI * 2;
  const radius = 55 + Math.random() * 15;
  stones.push({
    x: fireX + Math.cos(angle) * radius,
    y: groundY + Math.sin(angle) * radius * 0.3 + 5,
    rx: Math.random() * 10 + 8,
    ry: Math.random() * 7 + 5,
    rotation: Math.random() * 0.3 - 0.15,
    shade: Math.random() * 30 + 40
  });
}

// --- Grass ---
const grassPatches = [];
for (let i = 0; i < 200; i++) {
  grassPatches.push({
    x: Math.random() * 2000,
    y: groundY + Math.random() * (H - groundY) * 0.6,
    height: Math.random() * 20 + 8,
    width: Math.random() * 2 + 1,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 1.5 + 0.5,
    twitchTimer: Math.random() * 5,
    twitching: false,
    twitchDuration: 0,
    fireInfluence: Math.max(0, 1 - Math.abs(Math.random() * W - fireX) / (W * 0.6))
  });
}

// --- Trees ---
const trees = [
  { x: W * 0.12, baseY: groundY, height: 280, trunkWidth: 28, canopyWidth: 90 },
  { x: W * 0.88, baseY: groundY, height: 310, trunkWidth: 32, canopyWidth: 100 }
];

// --- Heat distortion lines ---
const heatLines = [];
for (let i = 0; i < 12; i++) {
  heatLines.push({
    x: fireX + (Math.random() - 0.5) * 30,
    baseY: fireY - 10,
    y: fireY - 10,
    length: Math.random() * 40 + 20,
    speed: Math.random() * 2 + 1,
    offset: Math.random() * Math.PI * 2,
    alpha: Math.random() * 0.15 + 0.05
  });
}

// --- Ambient particles (dust/moths) ---
const ambientParticles = [];
for (let i = 0; i < 25; i++) {
  ambientParticles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.2,
    size: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.3,
    phase: Math.random() * Math.PI * 2
  });
}

// --- Main render ---
let lastTime = 0;
let gameTime = 0;

function drawSky(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, groundY);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.4, '#0d1025');
  grad.addColorStop(0.7, '#111530');
  grad.addColorStop(1, '#1a1520');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, groundY + 10);
}

function drawStars(t) {
  for (const s of stars) {
    const sx = s.x % W;
    const sy = s.y % (groundY);
    const twinkle = Math.sin(t * s.twinkleSpeed + s.twinkleOffset) * 0.3 + 0.7;
    const alpha = s.brightness * twinkle;
    ctx.fillStyle = `rgba(220,230,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMeteors(t) {
  for (const m of meteors) {
    const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * m.length / 5, m.y - m.vy * m.length / 5);
    grad.addColorStop(0, `rgba(255,255,255,${m.life})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx * m.length / 4, m.y - m.vy * m.length / 4);
    ctx.stroke();
    m.x += m.vx;
    m.y += m.vy;
    m.life -= m.decay;
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    if (meteors[i].life <= 0) meteors.splice(i, 1);
  }
}

function drawGround(flicker) {
  const grad = ctx.createLinearGradient(0, groundY, 0, H);
  const f = 0.6 + flicker * 0.4;
  grad.addColorStop(0, `rgb(${Math.floor(25 * f)},${Math.floor(30 * f)},${Math.floor(15 * f)})`);
  grad.addColorStop(0.3, `rgb(${Math.floor(18 * f)},${Math.floor(22 * f)},${Math.floor(10 * f)})`);
  grad.addColorStop(1, `rgb(${Math.floor(8 * f)},${Math.floor(10 * f)},${Math.floor(5 * f)})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, groundY - 5, W, H - groundY + 5);

  // Ground texture near fire
  const fireGrad = ctx.createRadialGradient(fireX, fireY, 0, fireX, fireY, 120);
  fireGrad.addColorStop(0, `rgba(80,50,20,${0.3 + flicker * 0.2})`);
  fireGrad.addColorStop(0.5, `rgba(40,25,10,${0.15 + flicker * 0.1})`);
  fireGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = fireGrad;
  ctx.fillRect(fireX - 120, fireY - 10, 240, 60);
}

function drawStones(flicker) {
  for (const s of stones) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rotation);

    // Shadow
    ctx.fillStyle = `rgba(0,0,0,0.3)`;
    ctx.beginPath();
    ctx.ellipse(2, 3, s.rx + 1, s.ry + 1, 0, 0, Math.PI * 2);
    ctx.fill();

    // Stone body
    const fireGlow = s.fireInfluence ? (0.6 + flicker * 0.4) : 0.5;
    const shade = Math.floor(s.shade * fireGlow);
    ctx.fillStyle = `rgb(${shade + 15},${shade + 10},${shade})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // Highlight
    ctx.fillStyle = `rgba(255,255,255,${0.05 + flicker * 0.05})`;
    ctx.beginPath();
    ctx.ellipse(-s.rx * 0.2, -s.ry * 0.3, s.rx * 0.6, s.ry * 0.4, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function drawLogs(t, flicker) {
  for (const log of logs) {
    log.update(1 / 60);
    log.draw(ctx, flicker);
  }
}

function drawFlames(t, flicker) {
  for (const f of flames) {
    f.update(t);
    f.draw(ctx, flicker);
  }
}

function drawEmbers(t, flicker) {
  for (const e of embers) {
    e.update(t);
    e.draw(ctx, flicker);
  }
}

function drawHeatDistortion(t, flicker) {
  for (const h of heatLines) {
    h.y = h.baseY - ((t * h.speed + h.offset) % 1) * 80;
    const wobble = Math.sin(t * 3 + h.offset) * 5;
    const alpha = h.alpha * (0.5 + flicker * 0.5) * (1 - Math.abs(h.y - h.baseY + 40) / 40);
    if (alpha > 0.01) {
      ctx.strokeStyle = `rgba(255,200,100,${alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(h.x + wobble, h.y);
      ctx.quadraticCurveTo(h.x + wobble + 3, h.y - h.length * 0.5, h.x + wobble - 2, h.y - h.length);
      ctx.stroke();
    }
  }
}

function drawGrass(t, flicker) {
  for (const g of grassPatches) {
    g.twitchTimer -= 1 / 60;
    if (g.twitchTimer <= 0 && !g.twitching) {
      g.twitching = true;
      g.twitchDuration = Math.random() * 0.3 + 0.1;
      g.twitchTimer = Math.random() * 4 + 1;
    }
    if (g.twitching) {
      g.twitchDuration -= 1 / 60;
      if (g.twitchDuration <= 0) g.twitching = false;
    }

    const sway = Math.sin(t * g.speed + g.phase) * (3 + flicker * 5);
    const twitch = g.twitching ? Math.sin(t * 30) * 8 : 0;
    const fireLight = 0.4 + g.fireInfluence * flicker * 0.6;

    ctx.strokeStyle = `rgba(${Math.floor(30 * fireLight + 20 * flicker * g.fireInfluence)},${Math.floor(50 * fireLight + 40 * flicker * g.fireInfluence)},${Math.floor(15 * fireLight)},${0.6 + flicker * 0.3})`;
    ctx.lineWidth = g.width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.quadraticCurveTo(g.x + sway * 0.5 + twitch, g.y - g.height * 0.5, g.x + sway + twitch, g.y - g.height);
    ctx.stroke();
  }
}

function drawTrees(t, flicker) {
  for (const tree of trees) {
    const treeFlicker = 0.5 + flicker * 0.5;
    const distFromFire = Math.abs(tree.x - fireX);
    const fireInfluence = Math.max(0, 1 - distFromFire / (W * 0.5));

    // Tree trunk
    ctx.fillStyle = `rgb(${Math.floor(25 * treeFlicker + 15 * (1 - fireInfluence * flicker))},${Math.floor(15 * treeFlicker + 10 * (1 - fireInfluence * flicker))},${Math.floor(10 * treeFlicker + 5 * (1 - fireInfluence * flicker))})`;
    ctx.fillRect(tree.x - tree.trunkWidth / 2, tree.baseY - tree.height, tree.trunkWidth, tree.height);

    // Bark texture
    ctx.strokeStyle = `rgba(0,0,0,0.2)`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const by = tree.baseY - tree.height * (0.1 + i * 0.12);
      ctx.beginPath();
      ctx.moveTo(tree.x - tree.trunkWidth / 2 + 2, by);
      ctx.lineTo(tree.x + tree.trunkWidth / 2 - 2, by + Math.sin(i * 2) * 3);
      ctx.stroke();
    }

    // Jittering shadow
    const shadowJitter = Math.sin(t * 4 + tree.x) * 3 + Math.sin(t * 7) * 2;
    const shadowJitter2 = Math.cos(t * 5.3 + tree.x) * 2;
    ctx.fillStyle = `rgba(0,0,0,${0.15 + fireInfluence * 0.1 * flicker})`;
    ctx.save();
    ctx.translate(tree.x + shadowJitter, tree.baseY);
    ctx.beginPath();
    ctx.ellipse(shadowJitter2, 0, tree.trunkWidth * 2.5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Canopy (dark, with firelight edge)
    const canopyY = tree.baseY - tree.height;
    const canopyGrad = ctx.createRadialGradient(tree.x, canopyY - 20, 0, tree.x, canopyY - 20, tree.canopyWidth);
    const cr = Math.floor(10 * treeFlicker + 15 * fireInfluence * flicker);
    const cg = Math.floor(18 * treeFlicker + 20 * fireInfluence * flicker);
    const cb = Math.floor(8 * treeFlicker + 5 * fireInfluence * flicker);
    canopyGrad.addColorStop(0, `rgb(${cr + 5},${cg + 8},${cb})`);
    canopyGrad.addColorStop(0.6, `rgb(${cr},${cg},${cb})`);
    canopyGrad.addColorStop(1, `rgba(${cr - 3},${cg - 3},${cb},0)`);
    ctx.fillStyle = canopyGrad;
    ctx.beginPath();
    ctx.arc(tree.x, canopyY - 20, tree.canopyWidth, 0, Math.PI * 2);
    ctx.fill();

    // Canopy detail blobs
    for (let i = 0; i < 5; i++) {
      const bx = tree.x + Math.cos(i * 1.3 + tree.x) * tree.canopyWidth * 0.5;
      const by = canopyY - 20 + Math.sin(i * 1.7) * tree.canopyWidth * 0.35;
      const br = tree.canopyWidth * (0.3 + Math.sin(i * 2.1) * 0.15);
      ctx.fillStyle = `rgba(${cr - 2},${cg},${cb},0.7)`;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }

    // Firelight glow on tree
    if (fireInfluence > 0.1) {
      const glowGrad = ctx.createRadialGradient(tree.x, canopyY, 0, tree.x, canopyY, tree.canopyWidth * 0.8);
      glowGrad.addColorStop(0, `rgba(255,120,20,${fireInfluence * 0.15 * flicker})`);
      glowGrad.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(tree.x, canopyY, tree.canopyWidth * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawFireGlow(t, flicker) {
  // Main fire glow
  const glowRadius = 150 + flicker * 30;
  const grad = ctx.createRadialGradient(fireX, fireY - 20, 0, fireX, fireY - 20, glowRadius);
  grad.addColorStop(0, `rgba(255,150,30,${0.25 + flicker * 0.15})`);
  grad.addColorStop(0.3, `rgba(255,100,10,${0.12 + flicker * 0.08})`);
  grad.addColorStop(0.6, `rgba(200,60,10,${0.05 + flicker * 0.03})`);
  grad.addColorStop(1, 'rgba(100,30,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(fireX - glowRadius, fireY - glowRadius - 50, glowRadius * 2, glowRadius * 2 + 50);

  // Ground reflection
  const groundGlow = ctx.createRadialGradient(fireX, fireY + 5, 0, fireX, fireY + 5, 100);
  groundGlow.addColorStop(0, `rgba(255,120,20,${0.2 + flicker * 0.15})`);
  groundGlow.addColorStop(0.5, `rgba(200,80,10,${0.08 + flicker * 0.05})`);
  groundGlow.addColorStop(1, 'rgba(100,40,0,0)');
  ctx.fillStyle = groundGlow;
  ctx.fillRect(fireX - 100, fireY - 5, 200, 60);
}

function drawAmbientParticles(t) {
  for (const p of ambientParticles) {
    p.x += p.vx + Math.sin(t * 0.5 + p.phase) * 0.1;
    p.y += p.vy + Math.cos(t * 0.3 + p.phase) * 0.05;

    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;

    const dist = Math.sqrt((p.x - fireX) ** 2 + (p.y - fireY) ** 2);
    const fireGlow = Math.max(0, 1 - dist / 200);
    const alpha = p.alpha * (0.3 + fireGlow * 0.7);

    ctx.fillStyle = `rgba(200,180,140,${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMoon(t) {
  const mx = W * 0.78;
  const my = H * 0.12;
  const mr = 18;

  // Moon glow
  const moonGlow = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 6);
  moonGlow.addColorStop(0, 'rgba(180,190,220,0.15)');
  moonGlow.addColorStop(0.5, 'rgba(120,130,180,0.05)');
  moonGlow.addColorStop(1, 'rgba(80,90,140,0)');
  ctx.fillStyle = moonGlow;
  ctx.beginPath();
  ctx.arc(mx, my, mr * 6, 0, Math.PI * 2);
  ctx.fill();

  // Moon body
  ctx.fillStyle = 'rgba(210,215,230,0.9)';
  ctx.beginPath();
  ctx.arc(mx, my, mr, 0, Math.PI * 2);
  ctx.fill();

  // Crescent shadow
  ctx.fillStyle = 'rgba(10,10,25,0.6)';
  ctx.beginPath();
  ctx.arc(mx + 6, my - 2, mr * 0.85, 0, Math.PI * 2);
  ctx.fill();
}

function drawVignette() {
  const grad = ctx.createRadialGradient(cx, H * 0.4, H * 0.3, cx, H * 0.5, H * 0.9);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function render(timestamp) {
  const t = timestamp / 1000;
  gameTime = t;

  // Flicker calculation
  const flickerBase = Math.sin(t * 3.7) * 0.15 + Math.sin(t * 7.3) * 0.1 + Math.sin(t * 13.1) * 0.05;
  const flicker = Math.max(0, Math.min(1, 0.7 + flickerBase + Math.sin(t * 17.7) * 0.08));

  spawnMeteor();

  ctx.clearRect(0, 0, W, H);

  drawSky(t);
  drawMoon(t);
  drawStars(t);
  drawMeteors(t);
  drawGround(flicker);
  drawFireGlow(t, flicker);
  drawStones(flicker);
  drawLogs(t, flicker);
  drawFlames(t, flicker);
  drawEmbers(t, flicker);
  drawHeatDistortion(t, flicker);
  drawGrass(t, flicker);
  drawTrees(t, flicker);
  drawAmbientParticles(t);
  drawVignette();

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
