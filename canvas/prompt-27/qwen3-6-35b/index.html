<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Bike Slider</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        // --- Vector Math Helpers ---
        class Vec2 {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
            mult(s) { return new Vec2(this.x * s, this.y * s); }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            norm() { const m = this.mag(); return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m); }
            dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
            dot(v) { return this.x * v.x + this.y * v.y; }
            rotate(angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return new Vec2(this.x * cos - this.y * sin, this.x * sin + this.y * cos);
            }
        }

        // --- Configuration ---
        const CONFIG = {
            gravity: 0.35,
            friction: 0.985,
            constraintIterations: 10,
            physicsSubSteps: 5,
            colors: {
                bg: '#050510',
                track: '#00f3ff',
                bike: '#ff0055',
                rider: '#ffffff',
                trail: 'rgba(255, 0, 85, 0.4)',
                text: 'rgba(255, 255, 255, 0.5)'
            }
        };

        // --- Physics Engine ---
        class Particle {
            constructor(x, y, pinned = false, radius = 1, color = null) {
                this.pos = new Vec2(x, y);
                this.oldPos = new Vec2(x, y);
                this.acc = new Vec2(0, 0);
                this.pinned = pinned;
                this.radius = radius;
                this.color = color;
                this.mass = 1;
            }

            update() {
                if (this.pinned) return;
                const vel = this.pos.sub(this.oldPos).mult(CONFIG.friction);
                this.oldPos = this.pos.copy ? this.pos : new Vec2(this.pos.x, this.pos.y);
                this.pos = this.pos.add(vel).add(this.acc);
                this.acc = new Vec2(0, 0);
                
                // Clamp velocity
                const speed = this.pos.sub(this.oldPos).mag();
                if (speed > 15) {
                    this.oldPos = this.pos.sub(this.pos.sub(this.oldPos).norm().mult(15));
                }
            }
        }

        class Constraint {
            constructor(p1, p2, length = null, stiffness = 1) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = length || p1.pos.dist(p2.pos);
                this.stiffness = stiffness;
            }

            solve() {
                const diff = this.p1.pos.sub(this.p2.pos);
                const dist = diff.mag();
                const error = dist - this.length;
                const percent = error / dist / 2;
                const offset = diff.mult(percent * this.stiffness);

                if (!this.p1.pinned) this.p1.pos = this.p1.pos.add(offset);
                if (!this.p2.pinned) this.p2.pos = this.p2.pos.sub(offset);
            }
        }

        // --- Track System ---
        class TrackGenerator {
            constructor() {
                this.points = [];
                this.maxX = 0;
                this.nextX = 0;
                this.startPoint = new Vec2(0, 0);
                
                // Initial flat ground
                this.addSegment('flat', 20);
                
                // Generate start safely
                for(let i=0; i<5; i++) this.addSegment('flat', 20);
            }

            addSegment(type, count) {
                for (let i = 0; i < count; i++) {
                    const prev = this.points[this.points.length - 1];
                    let p = new Vec2(prev.x + 2, prev.y); // 2px spacing
                    
                    if (type === 'flat') {
                        // slight variance
                        p.y = prev.y + (Math.random() - 0.5) * 2;
                    } 
                    else if (type === 'hill') {
                        p.y -= 2.5;
                    } 
                    else if (type === 'dip') {
                        p.y += 3;
                    } 
                    else if (type === 'rampUp') {
                        p.y -= 4;
                    } 
                    else if (type === 'rampDown') {
                        p.y += 4;
                    }
                    else if (type === 'loop') {
                        // Simple approximation of a loop via steep curves
                        if (i % 2 === 0) p.y -= 3; else p.y += 3;
                    }

                    this.points.push(p);
                    this.nextX = p.x;
                }
            }

            addComplexTerrain() {
                const r = Math.random();
                if (r < 0.3) {
                    // Hills and Dips
                    this.addSegment('hill', 8);
                    this.addSegment('flat', 5);
                    this.addSegment('dip', 8);
                    this.addSegment('flat', 5);
                } else if (r < 0.6) {
                    // Ramps
                    this.addSegment('rampUp', 10);
                    this.addSegment('flat', 5);
                    this.addSegment('rampDown', 10);
                    this.addSegment('flat', 10);
                } else if (r < 0.8) {
                    // Loops (approximated)
                    this.addSegment('rampUp', 12);
                    this.addSegment('loop', 20);
                    this.addSegment('rampDown', 10);
                } else {
                    // Flat
                    this.addSegment('flat', 20);
                }
            }

            update(cameraX) {
                // Generate ahead
                while (this.nextX < cameraX + 3000) {
                    this.addComplexTerrain();
                }
                
                // Remove behind
                while (this.points.length > 0 && this.points[0].x < cameraX - 1000) {
                    this.points.shift();
                }
            }

            // Get track data at specific X
            getTrackAt(x) {
                // Binary search could be faster, but linear scan is fine for sparse array logic if optimized.
                // Here we just find the segment.
                for (let i = 0; i < this.points.length - 1; i++) {
                    const p1 = this.points[i];
                    const p2 = this.points[i+1];
                    if (x >= p1.x && x < p2.x) {
                        return { p1, p2, t: (x - p1.x) / (p2.x - p1.x) };
                    }
                }
                return null;
            }

            draw(ctx, camX, camY, scale) {
                if (this.points.length < 2) return;
                
                ctx.beginPath();
                ctx.strokeStyle = CONFIG.colors.track;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = CONFIG.colors.track;
                
                // Optimization: Only draw visible points
                const startIdx = Math.floor((camX - 100) / 2);
                const endIdx = Math.floor((camX + 1900) / 2);
                
                if (startIdx >= 0 && startIdx < this.points.length) {
                    const start = Math.max(0, startIdx);
                    const end = Math.min(this.points.length - 1, endIdx);
                    
                    ctx.moveTo(this.points[start].x - camX, this.points[start].y - camY);
                    for (let i = start; i < end; i++) {
                        ctx.lineTo(this.points[i].x - camX, this.points[i].y - camY);
                    }
                    ctx.stroke();
                }
                
                // Draw bottom fill (gradient)
                ctx.lineTo(this.points[end].x - camX, 2000);
                ctx.lineTo(this.points[start].x - camX, 2000);
                ctx.closePath();
                const grad = ctx.createLinearGradient(0, camY, 0, camY + 1000);
                grad.addColorStop(0, 'rgba(0, 243, 255, 0.05)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fill();
                
                ctx.shadowBlur = 0;
            }
        }

        // --- Particle System ---
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            emit(x, y, count, color, speed = 2, life = 30) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const vel = new Vec2(Math.cos(angle), Math.sin(angle)).mult(Math.random() * speed);
                    this.particles.push({
                        x, y, vx: vel.x, vy: vel.y, 
                        life: life, maxLife: life, color: color
                    });
                }
            }

            update() {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1; // gravity
                    p.life--;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            }

            draw(ctx, camX, camY) {
                for (const p of this.particles) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / p.maxLife;
                    ctx.fillRect(p.x - camX, p.y - camY, 2, 2);
                }
                ctx.globalAlpha = 1;
            }
        }

        // --- The Bike & Rider ---
        class BikeSystem {
            constructor(world, x, y) {
                this.world = world;
                this.particles = [];
                this.constraints = [];
                this.wheelAngle = 0;
                this.stuckTimer = 0;
                this.lastX = x;
                this.crashed = false;

                // --- Bike Geometry ---
                // 0: Rear Wheel, 1: Front Wheel, 2: Seat, 3: Handlebars, 4: Frame Center
                const rw = new Particle(x, y);
                const fw = new Particle(x + 30, y);
                const seat = new Particle(x + 10, y - 25);
                const hbar = new Particle(x + 22, y - 35);
                const frame = new Particle(x + 16, y - 15);

                this.particles.push(rw, fw, seat, hbar, frame);

                // Frame Constraints
                this.addConstraint(rw, frame, 18);
                this.addConstraint(fw, frame, 18);
                this.addConstraint(seat, frame, 12);
                this.addConstraint(hbar, frame, 14);
                this.addConstraint(rw, seat, 28);
                this.addConstraint(fw, hbar, 28);
                this.addConstraint(seat, hbar, 25); // Backbone

                // Wheels (cross bracing for shape, not physics strictness, but helps stability)
                this.addConstraint(rw, fw, 30, 0.1); // Flexible distance

                // --- Rider Geometry ---
                // 5: Hips, 6: Chest, 7: Head, 8: Hands, 9: Feet
                const hips = new Particle(x + 10, y - 40);
                const chest = new Particle(x + 18, y - 65);
                const head = new Particle(x + 22, y - 85);
                const hands = new Particle(x + 26, y - 45); // Initially near hbar
                const feet = new Particle(x + 5, y - 5); // Initially near pedals

                this.particles.push(hips, chest, head, hands, feet);

                // Rider Constraints
                this.addConstraint(hips, seat, 10); // Loose connection to seat
                this.addConstraint(chest, hips, 20);
                this.addConstraint(head, chest, 12);
                this.addConstraint(hands, hbar, 5); // Hands hold bars tightly-ish
                this.addConstraint(feet, rw, 25); // Feet near rear wheel/pedals

                // Body Structure
                this.addConstraint(hips, chest, 22);
                this.addConstraint(chest, head, 15);
                
                // Arms
                this.addConstraint(chest, hands, 25);

                // Legs
                this.addConstraint(hips, feet, 25);
                this.addConstraint(chest, feet, 40); // Stability

                // Initial Pin (for setup)
                this.particles.forEach(p => p.pinned = true);
                this.world.step(); // Resolve initial positions
                this.particles.forEach(p => p.pinned = false);
            }

            addConstraint(p1, p2, dist, stiffness = 1) {
                const c = new Constraint(p1, p2, dist, stiffness);
                this.constraints.push(c);
            }

            update(track, particles, effects) {
                // 1. Physics
                this.world.step();

                // 2. Motor Force (Rear Wheel)
                const rw = this.particles[0];
                const fw = this.particles[1];
                
                // Find track under rear wheel
                const trackData = track.getTrackAt(rw.pos.x);
                let motorForce = 0;
                let slope = 0;

                if (trackData) {
                    // Slope
                    const dx = trackData.p2.x - trackData.p1.x;
                    const dy = trackData.p2.y - trackData.p1.y;
                    slope = Math.atan2(dy, dx);
                    
                    // Friction check
                    const vel = rw.pos.sub(rw.oldPos);
                    if (vel.mag() < 0.1 && vel.mag() > 0) {
                        // Friction against gravity
                        // Simple logic: push in direction of track slope
                    }

                    // Motor Logic
                    // Force needed to maintain speed against gravity
                    const gravityComponent = Math.sin(slope) * 0.5;
                    motorForce = gravityComponent + 0.08; // Base acceleration
                    
                    // Boost on ramps
                    if (slope < -0.2) motorForce += 0.05;
                } else {
                    // Air control (minimal)
                    motorForce = 0;
                }

                // Apply motor force to rear wheel in tangent direction
                const tangent = new Vec2(Math.cos(slope), Math.sin(slope));
                rw.acc = rw.acc.add(tangent.mult(motorForce));

                // 3. Visual Rotation
                const distTraveled = rw.pos.x - this.lastX;
                this.wheelAngle += distTraveled / 10;
                this.lastX = rw.pos.x;

                // 4. Reset / Crash Logic
                const vel = rw.pos.sub(rw.oldPos);
                const speed = vel.mag();

                // Check Stuck
                if (speed < 0.05 && trackData && this.crashed === false) {
                    this.stuckTimer++;
                    if (this.stuckTimer > 120) this.reset();
                } else {
                    this.stuckTimer = 0;
                }

                // Check Crash (Upside down or fell off)
                // Vector from frame to head
                const frame = this.particles[4];
                const head = this.particles[7];
                const upVec = head.sub(frame).norm();
                
                // If head is below frame
                if (head.y > frame.y && trackData) {
                    this.stuckTimer++;
                    if (this.stuckTimer > 100) this.reset();
                }

                // Check Distance from track (Fallen off world)
                if (rw.pos.y > trackData.p1.y + 400) {
                    this.reset();
                }

                // Dust while moving
                if (speed > 2 && trackData && Math.random() > 0.7) {
                    effects.emit(rw.pos.x, rw.pos.y, 1, 'rgba(255,255,255,0.5)', 1, 20);
                }
                
                // Spikes on impact
                // Check vertical velocity of frame
                const frameVel = rw.pos.sub(rw.oldPos).y;
                if (frameVel > 8 && trackData) {
                     effects.emit(frame.pos.x, frame.pos.y, 20, '#00f3ff', 5, 40);
                }
            }

            reset() {
                // Find safe spot ahead
                // We assume the generator always puts something rideable within 2000px
                // Just pick a random point ahead and clamp to track
                const spawnX = this.world.cameraX + 800 + Math.random() * 500;
                const data = track.getTrackAt(spawnX);
                
                if (data) {
                    const newX = data.p1.x + (data.p2.x - data.p1.x) * 0.5;
                    const newY = data.p1.y;
                    
                    // Teleport particles
                    this.particles.forEach(p => {
                        p.pos = new Vec2(newX + (p.pos.x - this.particles[4].pos.x), newY + (p.pos.y - this.particles[4].pos.y));
                        p.oldPos = p.pos.copy();
                    });
                    
                    // Explosion visual
                    effects.emit(newX, newY, 50, '#ffffff', 5, 60);
                    this.crashed = true;
                    setTimeout(() => this.crashed = false, 500);
                }
            }

            draw(ctx, camX, camY) {
                const rw = this.particles[0];
                const fw = this.particles[1];
                const seat = this.particles[2];
                const hbar = this.particles[3];
                const frame = this.particles[4];
                const feet = this.particles[9];

                // Draw Bike Frame
                ctx.beginPath();
                ctx.strokeStyle = CONFIG.colors.bike;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 5;
                ctx.shadowColor = CONFIG.colors.bike;
                
                ctx.moveTo(rw.pos.x - camX, rw.pos.y - camY);
                ctx.lineTo(frame.pos.x - camX, frame.pos.y - camY);
                ctx.lineTo(fw.pos.x - camX, fw.pos.y - camY);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(seat.pos.x - camX, seat.pos.y - camY);
                ctx.lineTo(hbar.pos.x - camX, hbar.pos.y - camY);
                ctx.lineTo(frame.pos.x - camX, frame.pos.y - camY);
                ctx.stroke();

                // Draw Wheels
                const drawWheel = (p) => {
                    ctx.save();
                    ctx.translate(p.pos.x - camX, p.pos.y - camY);
                    ctx.rotate(this.wheelAngle);
                    ctx.beginPath();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.stroke();
                    // Spokes
                    ctx.beginPath();
                    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
                    ctx.moveTo(0, -12); ctx.lineTo(0, 12);
                    ctx.stroke();
                    ctx.restore();
                };
                drawWheel(rw);
                drawWheel(fw);

                // Draw Rider
                ctx.beginPath();
                ctx.strokeStyle = CONFIG.colors.rider;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
                
                const p = this.particles;
                // Hips to Chest
                ctx.moveTo(p[5].pos.x - camX, p[5].pos.y -
