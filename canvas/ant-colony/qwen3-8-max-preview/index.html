<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant Colony — pheromone foraging simulation</title>
<style>
  :root{
    --display:'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L',Georgia,serif;
    --mono:'SF Mono','Cascadia Code',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;
    --ink:#ecd9ae; --dim:#94805c; --amber:#f0a832; --green:#9fdd63;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0e0a06}
  #world{position:fixed;inset:0;display:block}
  .hud{position:fixed;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none}
  .head{top:26px;left:30px;animation:rise .9s .15s ease both}
  .title-row{display:flex;align-items:center;gap:13px}
  .ant-icon{flex:none;animation:bob 3.4s ease-in-out infinite}
  h1{margin:0;font:italic 600 42px/1 var(--display);color:var(--ink);letter-spacing:.01em;text-shadow:0 2px 22px rgba(0,0,0,.85)}
  .sub{margin:9px 0 0 53px;font:500 10px/1.6 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .stats{display:flex;gap:30px;margin:24px 0 0 2px;flex-wrap:wrap}
  .stat .num{display:block;font:600 23px/1 var(--mono);color:var(--ink);text-shadow:0 1px 10px rgba(0,0,0,.85)}
  #sStored{color:var(--green)} #sTrail{color:var(--amber)}
  .stat .lbl{display:block;margin-top:7px;font:500 9px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .stat .lbl::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--tick,#888);margin-right:7px;vertical-align:1px;box-shadow:0 0 7px var(--tick,#888)}
  .badge{top:30px;right:30px;font:500 9px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--dim);border:1px solid rgba(236,217,174,.16);background:rgba(14,10,6,.55);padding:8px 12px;animation:rise .9s .3s ease both}
  .legend{right:30px;bottom:26px;text-align:right;animation:rise .9s .45s ease both}
  .legend .lbl{font:500 9px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .legend .bar{width:152px;height:7px;margin:9px 0 6px auto;border:1px solid rgba(236,217,174,.18);background:linear-gradient(90deg,rgba(46,20,4,0),#80360a,#d66c12,#ffa434,#ffe096)}
  .legend .scale{display:flex;justify-content:space-between;width:154px;margin-left:auto;font:400 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#6f5f44}
  .logline{left:30px;bottom:26px;max-width:62vw;font:500 11.5px/1.5 var(--mono);color:#cdb887;text-shadow:0 1px 8px rgba(0,0,0,.9);opacity:0}
  .logline::before{content:'»  ';color:var(--amber)}
  .logline.show{animation:logfade 8s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes logfade{0%{opacity:0;transform:translateY(6px)}6%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0}}
  @media (max-width:760px){
    h1{font-size:30px}
    .sub{margin-left:45px;letter-spacing:.16em}
    .stats{gap:18px}
    .stat .num{font-size:18px}
    .legend,.badge{display:none}
  }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div class="hud head">
  <div class="title-row">
    <svg class="ant-icon" viewBox="0 0 52 32" width="40" height="25" aria-hidden="true">
      <g stroke="#c9a05f" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M23 13 L15 5 M26 12.5 L25 3.5 M29 13 L36 5.5 M23 19 L15 27 M26 19.5 L25 28.5 M29 19 L36 26.5"/>
        <path d="M40.5 12.5 Q45.5 6.5 50.5 5.5 M40.5 19.5 Q45.5 25.5 50.5 26.5"/>
      </g>
      <g fill="#c9a05f">
        <ellipse cx="10.5" cy="16" rx="7" ry="5"/>
        <circle cx="19.5" cy="16" r="2.1"/>
        <ellipse cx="26.5" cy="16" rx="5" ry="3.6"/>
        <circle cx="37" cy="16" r="4.6"/>
      </g>
    </svg>
    <h1>Ant Colony</h1>
  </div>
  <p class="sub">Pheromone foraging · trails form · reinforce · evaporate</p>
  <div class="stats">
    <div class="stat" style="--tick:#9fdd63"><span class="num" id="sStored">0</span><span class="lbl">food stored</span></div>
    <div class="stat" style="--tick:#d8b06a"><span class="num" id="sForage">0</span><span class="lbl">foraging</span></div>
    <div class="stat" style="--tick:#f2a54a"><span class="num" id="sReturn">0</span><span class="lbl">returning</span></div>
    <div class="stat" style="--tick:#f0a832"><span class="num" id="sTrail">0%</span><span class="lbl">trail network</span></div>
    <div class="stat" style="--tick:#8a7657"><span class="num" id="sTime">0:00</span><span class="lbl">elapsed</span></div>
  </div>
</div>

<div class="hud badge">autonomous · no input</div>

<div class="hud legend">
  <span class="lbl">trail pheromone</span>
  <div class="bar"></div>
  <div class="scale"><span>faint</span><span>saturated</span></div>
</div>

<div class="hud logline" id="log"></div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const bg = document.createElement('canvas');
const pherCanvas = document.createElement('canvas');
const pherCtx = pherCanvas.getContext('2d');
const logEl = document.getElementById('log');
const sStored = document.getElementById('sStored'),
      sForage = document.getElementById('sForage'),
      sReturn = document.getElementById('sReturn'),
      sTrail  = document.getElementById('sTrail'),
      sTime   = document.getElementById('sTime');

const CELL = 5, MAXP = 2.5;
let W = 0, H = 0, dpr = 1, gw = 0, gh = 0;
let pher, pher2, pherImg;
let nestSprite = null, nestGlow = 0;
let piles = [], respawnQ = [], ants = [];
let stored = 0, elapsed = 0, statAcc = 0, nSearch = 0, nReturn = 0, inited = false;
const MILE = [50, 150, 400, 1000, 2500, 6000];
let mi = 0;
const nest = { x: 0, y: 0, r: 24 };

/* pheromone colour LUT — soft amber heat */
const LUT = new Uint8ClampedArray(256 * 4);
(() => {
  const stops = [
    [0.00,   0,   0,   0,   0],
    [0.12,  46,  20,   4,  60],
    [0.35, 128,  54,   8, 132],
    [0.62, 214, 108,  18, 192],
    [0.85, 255, 166,  52, 222],
    [1.00, 255, 224, 150, 242]
  ];
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let k = 0;
    while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
    const A = stops[k], B = stops[k + 1];
    const f = clamp((t - A[0]) / ((B[0] - A[0]) || 1), 0, 1);
    LUT[i*4]   = A[1] + (B[1]-A[1]) * f;
    LUT[i*4+1] = A[2] + (B[2]-A[2]) * f;
    LUT[i*4+2] = A[3] + (B[3]-A[3]) * f;
    LUT[i*4+3] = A[4] + (B[4]-A[4]) * f;
  }
})();

function log(msg) {
  logEl.textContent = msg;
  logEl.classList.remove('show');
  void logEl.offsetWidth;
  logEl.classList.add('show');
}

function compass(p) {
  const ang = Math.atan2(-(p.y - nest.y), p.x - nest.x);
  const dirs = ['E','NE','N','NW','W','SW','S','SE'];
  const i = Math.round(ang / (Math.PI / 4));
  return dirs[((i % 8) + 8) % 8];
}

function paintGround() {
  bg.width = Math.ceil(W * dpr); bg.height = Math.ceil(H * dpr);
  const g = bg.getContext('2d');
  g.scale(dpr, dpr);
  g.fillStyle = '#161009';
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 30; i++) {                       /* mottled earth patches */
    const x = rand(0, W), y = rand(0, H), r = rand(60, 240);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, Math.random() < 0.5 ? 'rgba(48,35,20,0.30)' : 'rgba(9,6,3,0.34)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const n = Math.round(W * H / 380);                   /* soil grains */
  for (let i = 0; i < n; i++) {
    const x = rand(0, W), y = rand(0, H), s = rand(0.5, 1.7);
    g.fillStyle = Math.random() < 0.55
      ? 'rgba(90,67,42,' + rand(0.05, 0.13).toFixed(3) + ')'
      : 'rgba(0,0,0,' + rand(0.08, 0.20).toFixed(3) + ')';
    g.fillRect(x, y, s, s);
  }
  for (let i = 0; i < 46; i++) {                       /* tiny pebbles */
    g.fillStyle = 'rgba(72,56,38,0.35)';
    g.beginPath();
    g.arc(rand(0, W), rand(0, H), rand(0.8, 2.2), 0, TAU);
    g.fill();
  }
  const gr = g.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.hypot(W,H)*0.6);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = gr;
  g.fillRect(0, 0, W, H);
}

function makeNest() {
  const R = nest.r, s = R * 8;
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(s * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const cx = s / 2, cy = s / 2;
  let gr = g.createRadialGradient(cx, cy, R * 0.4, cx, cy, s / 2);   /* swept clearing */
  gr.addColorStop(0, 'rgba(66,49,30,0.5)');
  gr.addColorStop(0.55, 'rgba(52,38,23,0.22)');
  gr.addColorStop(1, 'rgba(52,38,23,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  gr = g.createRadialGradient(cx - R*0.25, cy - R*0.3, R*0.1, cx, cy, R*1.5);  /* dark mound */
  gr.addColorStop(0, '#35271a');
  gr.addColorStop(0.35, '#241a11');
  gr.addColorStop(0.68, '#140e08');
  gr.addColorStop(0.88, '#0b0705');
  gr.addColorStop(1, 'rgba(11,7,5,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(cx, cy, R * 1.5, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(158,120,78,0.16)';            /* rim light */
  g.lineWidth = R * 0.18;
  g.beginPath(); g.arc(cx, cy, R * 1.06, -2.7, -0.5); g.stroke();
  for (let i = 0; i < 80; i++) {                      /* mound grains */
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * R * 1.35;
    g.fillStyle = Math.random() < 0.5 ? 'rgba(94,70,45,0.5)' : 'rgba(0,0,0,0.45)';
    g.beginPath();
    g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, rand(0.5, 1.6), 0, TAU);
    g.fill();
  }
  for (let i = 0; i < 7; i++) {                       /* pebbles at rim */
    const a = rand(0, TAU), r = rand(R * 0.95, R * 1.42);
    g.fillStyle = 'rgba(88,70,50,0.8)';
    g.beginPath();
    g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, rand(1.2, 2.4), 0, TAU);
    g.fill();
  }
  gr = g.createRadialGradient(cx, cy, 0, cx, cy, R * 0.62);           /* entrance */
  gr.addColorStop(0, 'rgba(0,0,0,0.95)');
  gr.addColorStop(0.55, 'rgba(0,0,0,0.75)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(cx, cy, R * 0.62, 0, TAU); g.fill();
  [[0.62, 0.3], [-0.5, 0.52]].forEach(([ox, oy]) => { /* side tunnels */
    gr = g.createRadialGradient(cx + ox*R, cy + oy*R, 0, cx + ox*R, cy + oy*R, R*0.2);
    gr.addColorStop(0, 'rgba(0,0,0,0.85)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(cx + ox*R, cy + oy*R, R*0.2, 0, TAU); g.fill();
  });
  return { c, s };
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.ceil(W * dpr); canvas.height = Math.ceil(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  gw = Math.ceil(W / CELL); gh = Math.ceil(H / CELL);
  pher = new Float32Array(gw * gh);
  pher2 = new Float32Array(gw * gh);
  pherCanvas.width = gw; pherCanvas.height = gh;
  pherImg = pherCtx.createImageData(gw, gh);
  nest.x = W * 0.5; nest.y = H * 0.53;
  nest.r = clamp(Math.min(W, H) * 0.03, 17, 28);
  paintGround();
  nestSprite = makeNest();
  if (inited) {
    for (const p of piles) { p.x = clamp(p.x, 55, W - 55); p.y = clamp(p.y, 65, H - 55); }
    for (const a of ants)  { a.x = clamp(a.x, 4, W - 4);   a.y = clamp(a.y, 4, H - 4); }
  }
}

function targetPiles() { return Math.round(clamp(W * H / 380000, 3, 6)); }

function spawnPile() {
  for (let t = 0; t < 24; t++) {
    const ang = rand(0, TAU);
    const minR = Math.max(130, Math.min(W, H) * 0.16);
    const maxR = Math.max(minR + 60, Math.min(W, H) * 0.46);
    const x = nest.x + Math.cos(ang) * rand(minR, maxR);
    const y = nest.y + Math.sin(ang) * rand(minR, maxR);
    if (x < 60 || x > W - 60 || y < 70 || y > H - 60) continue;
    if (piles.some(p => (p.x - x) ** 2 + (p.y - y) ** 2 < 14400)) continue;
    const cr = [], n = Math.round(rand(24, 44)), crR = rand(13, 24);
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), r = crR * Math.sqrt(Math.random());
      cr.push({ dx: Math.cos(a) * r, dy: Math.sin(a) * r, r: rand(1.4, 2.7), h: Math.random() });
    }
    const p = { x, y, cr, crR, phase: rand(0, TAU), discovered: false };
    piles.push(p);
    return p;
  }
  return null;
}

function spawnAnts() {
  const n = Math.round(clamp(W * H / 6500, 120, 300));
  ants = [];
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    ants.push({
      x: nest.x + Math.cos(a) * nest.r * 0.4,
      y: nest.y + Math.sin(a) * nest.r * 0.4,
      a, st: 0, carry: false,
      sp: rand(52, 80), sz: rand(0.85, 1.2), leave: rand(0.2, 2.4)
    });
  }
}

function sample(x, y) {
  if (x < 0 || y < 0 || x >= W || y >= H) return 0;
  return pher[(y / CELL | 0) * gw + (x / CELL | 0)];
}

function update(dt) {
  elapsed += dt;
  nestGlow *= Math.pow(0.5, dt / 1.4);

  for (let i = respawnQ.length - 1; i >= 0; i--) {
    if (elapsed >= respawnQ[i]) {
      respawnQ.splice(i, 1);
      const p = spawnPile();
      if (p) log('Fresh food appeared ' + compass(p) + ' of the nest');
    }
  }
  if (piles.length < targetPiles() && respawnQ.length === 0 && Math.random() < dt) {
    respawnQ.push(elapsed + rand(2, 5));
  }

  nSearch = 0; nReturn = 0;
  const lay = 26 * dt;

  for (const an of ants) {
    const dxn = nest.x - an.x, dyn = nest.y - an.y;
    const dn = Math.hypot(dxn, dyn);

    if (an.st === 1) {                                   /* carrying food home */
      nReturn++;
      const ta = Math.atan2(dyn, dxn);
      an.a += wrapA(ta - an.a) * Math.min(1, dt * 7) + (Math.random() - 0.5) * 1.2 * dt;
      const sp = an.sp * 1.08;
      an.x += Math.cos(an.a) * sp * dt;
      an.y += Math.sin(an.a) * sp * dt;
      if (an.x > 1 && an.y > 1 && an.x < W - 2 && an.y < H - 2) {
        const ci = (an.y / CELL | 0) * gw + (an.x / CELL | 0);
        pher[ci] = Math.min(MAXP, pher[ci] + lay);       /* reinforce trail */
      }
      if (dn < nest.r * 0.95) {                          /* deposit */
        an.st = 0; an.carry = false;
        stored++;
        nestGlow = Math.min(1, nestGlow + 0.1);
        an.a = Math.atan2(-dyn, -dxn) + rand(-1.2, 1.2);
        an.leave = rand(1, 2);
        if (mi < MILE.length && stored >= MILE[mi]) { log('Colony stores pass ' + MILE[mi] + ' crumbs'); mi++; }
      }
    } else {                                             /* searching */
      nSearch++;
      an.leave -= dt;
      let sig = 0, f = 0, l = 0, r = 0;
      if (an.leave <= 0 && dn > 90) {                    /* three-point pheromone sense */
        const sd = 17, sa = 0.62;
        f = sample(an.x + Math.cos(an.a) * sd,      an.y + Math.sin(an.a) * sd);
        l = sample(an.x + Math.cos(an.a - sa) * sd, an.y + Math.sin(an.a - sa) * sd);
        r = sample(an.x + Math.cos(an.a + sa) * sd, an.y + Math.sin(an.a + sa) * sd);
        sig = f + l + r;
      }
      if (sig > 0.03) {                                  /* follow gradient */
        if (f >= l && f >= r) an.a += (l - r) * 2.2 * dt;
        else if (l > r) an.a -= 3.4 * dt;
        else an.a += 3.4 * dt;
        an.a += (Math.random() - 0.5) * 2.4 * dt;
      } else {                                           /* wander / cast */
        an.a += (Math.random() - 0.5) * 7.6 * dt;
      }
      const m = 26;
      if (an.x < m || an.x > W - m || an.y < m || an.y > H - m) {
        const ta = Math.atan2(H * 0.5 - an.y, W * 0.5 - an.x);
        an.a += wrapA(ta - an.a) * Math.min(1, dt * 5);
      }
      an.x += Math.cos(an.a) * an.sp * dt;
      an.y += Math.sin(an.a) * an.sp * dt;

      for (let pi = piles.length - 1; pi >= 0; pi--) {   /* find & take a crumb */
        const p = piles[pi];
        const ex = p.x - an.x, ey = p.y - an.y, rr = p.crR + 6;
        if (ex * ex + ey * ey < rr * rr) {
          let bi = -1, bd = Infinity;
          for (let k = 0; k < p.cr.length; k++) {
            const c = p.cr[k];
            const gx = p.x + c.dx - an.x, gy = p.y + c.dy - an.y;
            const d2 = gx * gx + gy * gy;
            if (d2 < bd) { bd = d2; bi = k; }
          }
          if (bi >= 0) {
            p.cr.splice(bi, 1);
            if (!p.discovered) {
              p.discovered = true;
              log('Scout found food ' + compass(p) + ' of the nest — recruits inbound');
            }
            an.st = 1; an.carry = true;
            an.a = Math.atan2(nest.y - an.y, nest.x - an.x) + rand(-0.5, 0.5);
            if (p.cr.length === 0) {
              piles.splice(pi, 1);
              log('Food exhausted ' + compass(p) + ' of the nest — trail collapsing');
              respawnQ.push(elapsed + rand(2.5, 7));
            }
          }
          break;
        }
      }
    }
  }

  /* evaporate + diffuse the field */
  const ev = Math.pow(0.5, dt / 6.5);
  for (let y = 1; y < gh - 1; y++) {
    let i = y * gw + 1;
    for (let x = 1; x < gw - 1; x++, i++) {
      const nb = (pher[i-1] + pher[i+1] + pher[i-gw] + pher[i+gw]) * 0.25;
      const v = (pher[i] * 0.82 + nb * 0.18) * ev;
      pher2[i] = v < 0.004 ? 0 : v;
    }
  }
  for (let x = 0; x < gw; x++) {
    pher2[x] = pher[x] * ev;
    pher2[(gh - 1) * gw + x] = pher[(gh - 1) * gw + x] * ev;
  }
  for (let y = 0; y < gh; y++) {
    pher2[y * gw] = pher[y * gw] * ev;
    pher2[y * gw + gw - 1] = pher[y * gw + gw - 1] * ev;
  }
  const tmp = pher; pher = pher2; pher2 = tmp;

  statAcc += dt;
  if (statAcc >= 0.25) {
    statAcc = 0;
    sStored.textContent = stored;
    sForage.textContent = nSearch;
    sReturn.textContent = nReturn;
    let cov = 0, tot = 0;
    for (let i = 0; i < pher.length; i += 23) { if (pher[i] > 0.06) cov++; tot++; }
    sTrail.textContent = Math.round(cov / tot * 100) + '%';
    const mm = Math.floor(elapsed / 60), ss = Math.floor(elapsed % 60);
    sTime.textContent = mm + ':' + String(ss).padStart(2, '0');
  }
}

function render() {
  ctx.drawImage(bg, 0, 0, W, H);

  /* pheromone heat layer */
  const d = pherImg.data;
  for (let i = 0, n = gw * gh; i < n; i++) {
    let v = pher[i] * 0.4;
    if (v > 1) v = 1;
    v = Math.sqrt(v);
    const li = (v * 255 | 0) * 4, o = i * 4;
    d[o] = LUT[li]; d[o+1] = LUT[li+1]; d[o+2] = LUT[li+2]; d[o+3] = LUT[li+3];
  }
  pherCtx.putImageData(pherImg, 0, 0);
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(pherCanvas, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  /* nest glows green while food is flowing in */
  if (nestGlow > 0.02) {
    const gr = ctx.createRadialGradient(nest.x, nest.y, 0, nest.x, nest.y, nest.r * 3.6);
    gr.addColorStop(0, 'rgba(150,225,95,' + (nestGlow * 0.28).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(150,225,95,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(nest.x, nest.y, nest.r * 3.6, 0, TAU); ctx.fill();
  }

  /* food piles */
  for (const p of piles) {
    const pulse = 0.72 + 0.28 * Math.sin(elapsed * 2.1 + p.phase);
    const gr = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.crR * 2.6);
    gr.addColorStop(0, 'rgba(130,205,80,' + (0.16 * pulse).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(130,205,80,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.crR * 2.6, 0, TAU); ctx.fill();
    for (const c of p.cr) {
      ctx.fillStyle = c.h < 0.34 ? '#5f9f38' : c.h < 0.72 ? '#7cc24c' : '#93d963';
      ctx.beginPath(); ctx.arc(p.x + c.dx, p.y + c.dy, c.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(224,255,196,0.5)';
      ctx.beginPath(); ctx.arc(p.x + c.dx - c.r * 0.3, p.y + c.dy - c.r * 0.35, c.r * 0.42, 0, TAU); ctx.fill();
    }
  }

  /* nest mound */
  ctx.drawImage(nestSprite.c, nest.x - nestSprite.s / 2, nest.y - nestSprite.s / 2, nestSprite.s, nestSprite.s);

  /* ants */
  for (const an of ants) {
    ctx.save();
    ctx.translate(an.x, an.y);
    ctx.rotate(an.a);
    ctx.scale(an.sz, an.sz);
    ctx.fillStyle = '#3a2a1c';
    ctx.beginPath(); ctx.ellipse(-2.6, 0, 2.7, 1.75, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4d3722';
    ctx.beginPath(); ctx.ellipse(0.7, 0, 1.45, 1.1, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.2, 0, 1.55, 1.3, 0, 0, TAU); ctx.fill();
    if (an.carry) {
      ctx.fillStyle = '#9be063';
      ctx.beginPath(); ctx.arc(5.1, 0, 1.55, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

let last = performance.now();
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
spawnAnts();
for (let i = 0; i < targetPiles(); i++) spawnPile();
inited = true;
log('Colony awakens — scouts fan out into the dark');
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
