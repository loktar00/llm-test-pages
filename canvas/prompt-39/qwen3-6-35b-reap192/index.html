<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Sled</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a2e; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// ENDLESS DOWNHILL SLEDING SCREENSAVER
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ============================================================
// UTILITIES
// ============================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
function lerpAngle(a, b, t) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    return a + d * t;
}

// ============================================================
// TERRAIN GENERATION
// ============================================================
const TERRAIN = {
    points: [],
    xMin: 0,
    xMax: 0,
    segmentWidth: 2,
    _cacheH: {},
    _cacheS: {},

    generate(startX, count) {
        let lastY = this.points.length > 0 ? this.points[this.points.length-1].y : H * 0.4;
        let lastAngle = Math.sin(0.3) * 0.15;
        for (let i = 0; i < count; i++) {
            let x = startX + i * this.segmentWidth;
            let slope = lastAngle + rand(-0.04, 0.03);
            slope = clamp(slope, -0.25, 0.35);
            lastAngle = lerp(lastAngle, slope, 0.1);
            lastY += slope * this.segmentWidth * 0.5;
            lastY = clamp(lastY, H * 0.15, H * 0.85);

            // Gentle downhill bias
            lastY += 0.15;

            // Add bumps and dips
            let bump = Math.sin(x * 0.008) * 20 + Math.sin(x * 0.025) * 8 + Math.sin(x * 0.07) * 3;
            let ramp = Math.sin(x * 0.005 + 1.2) * 30;
            let jump = Math.sin(x * 0.011 + 3.7) * 15;

            lastY += bump * 0.3 + ramp * 0.1 + jump * 0.05;
            lastY = clamp(lastY, H * 0.12, H * 0.9);

            this.points.push({ x, y: lastY });
        }
        this.xMin = this.points[0].x;
        this.xMax = this.points[this.points.length - 1].x;
    },

    getHeight(x) {
        if (this.points.length === 0) return H * 0.5;
        // Binary search for segment
        let lo = 0, hi = this.points.length - 1;
        while (lo < hi - 1) {
            let mid = (lo + hi) >> 1;
            if (this.points[mid].x < x) lo = mid; else hi = mid;
        }
        if (lo === hi) return this.points[lo].y;
        let p1 = this.points[lo], p2 = this.points[hi];
        let t = (x - p1.x) / (p2.x - p1.x);
        return lerp(p1.y, p2.y, t);
    },

    getAngle(x) {
        let h1 = this.getHeight(x - 5);
        let h2 = this.getHeight(x + 5);
        return Math.atan2(h2 - h1, 10);
    },

    cleanup(xMin) {
        let keep = this.points.filter(p => p.x > xMin - 2000);
        if (keep.length < this.points.length) {
            // reindex
            this.points = keep;
        }
    },

    extendForward(xCenter, totalAhead) {
        let maxX = this.points[this.points.length - 1].x;
        let needed = xCenter + totalAhead - maxX;
        if (needed > 0) {
            this.generate(maxX, Math.ceil(needed / this.segmentWidth));
        }
    }
};

// Initial terrain
TERRAIN.generate(-500, 3000);

// ============================================================
// SLEDDER
// ============================================================
const sledder = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    angle: 0,
    angularVel: 0,
    grounded: false,
    distance: 0,
    scarf: [],
    scarfLength: 12,
    scarfSegLen: 14,

    init() {
        this.x = 100;
        this.y = TERRAIN.getHeight(100) - 25;
        this.vx = 2;
        this.vy = 0;
        this.angle = TERRAIN.getAngle(this.x);
        this.angularVel = 0;
        this.grounded = false;
        this.distance = 0;
        this.scarf = [];
        for (let i = 0; i < this.scarfLength; i++) {
            this.scarf.push({ x: this.x - i * 8, y: this.y - 35 });
        }
    },

    update(dt) {
        let gravity = 600;
        let friction = 0.98;
        let airControl = 0.3;
        let maxSpeed = 400;
        let minSpeed = 50;

        // Check terrain
        let terrainY = TERRAIN.getHeight(this.x);
        let slopeAngle = TERRAIN.getAngle(this.x);
        let sledBottom = this.y + 12 * Math.cos(this.angle);

        if (sledBottom >= terrainY) {
            // Grounded
            this.grounded = true;
            this.y = terrainY - 12;

            // Gravity + slope acceleration
            let slopeAccel = -Math.sin(slopeAngle) * gravity * 0.7;
            let frictionForce = this.grounded ? 0.997 : 0.999;

            this.vx += slopeAccel * dt;
            this.vx = clamp(this.vx, minSpeed, maxSpeed);

            // Align to slope
            this.angle = lerpAngle(this.angle, slopeAngle, 0.15);
            this.angularVel = lerp(this.angularVel, 0, 0.15);

            // Keep from going through terrain
            if (this.y > terrainY - 5) {
                this.y = terrainY - 12;
                this.vy = 0;
            }
        } else {
            // Airborne
            this.grounded = false;
            this.vy += gravity * dt;

            // Forward momentum preserved in air
            this.vx *= 0.999;

            // Slight rotation in air based on previous angle
            this.angularVel += (slopeAngle - this.angle) * 0.5 * dt;
            this.angle += this.angularVel * dt;
            this.angle = lerpAngle(this.angle, slopeAngle * 0.3, 0.05);
            this.angularVel *= 0.96;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Update distance
        this.distance += Math.max(0, this.vx) * dt;

        // Update scarf
        this.updateScarf();

        // Check stuck/flip/fall
        let timeStuck = this.grounded && Math.abs(this.vx) < 10;
        let flipped = Math.abs(Math.abs(this.angle % (Math.PI*2)) - Math.PI) > 0.5;
        let fallen = this.y > terrainY + 100;

        return { timeStuck, flipped, fallen };
    },

    updateScarf() {
        // Scarf attachment point (neck)
        let neckX = this.x + Math.cos(this.angle) * (-8);
        let neckY = this.y + Math.sin(this.angle) * (-8) - 38;

        // Wind influence
        let windX = -this.vx * 0.15;
        let windY = Math.sin(Date.now() * 0.003) * 15;

        // Update scarf segments
        this.scarf[0] = { x: neckX + windX * 0.5, y: neckY + windY * 0.3 };

        for (let i = 1; i < this.scarf.length; i++) {
            let prev = this.scarf[i - 1];
            let targetX = prev.x - this.scarfSegLen * (1 + Math.abs(this.vx) * 0.002);
            let targetY = prev.y + windY * 0.15 + Math.sin(Date.now() * 0.005 + i * 0.5) * 3;

            let dx = targetX - this.scarf[i].x;
            let dy = targetY - this.scarf[i].y;
            let d = Math.hypot(dx, dy);

            this.scarf[i].x += dx * 0.4;
            this.scarf[i].y += dy * 0.3;
        }
    },

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Shadow on snow
        ctx.save();
        ctx.rotate(-this.angle);
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(0, 14, 28, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // === SLED ===
        // Runner
        ctx.fillStyle = '#8B4513';
        ctx.beginPath();
        ctx.moveTo(-28, 10);
        ctx.quadraticCurveTo(-30, 14, -25, 15);
        ctx.lineTo(25, 15);
        ctx.quadraticCurveTo(30, 14, 28, 10);
        ctx.lineTo(20, 4);
        ctx.lineTo(-20, 4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#5C2E00';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Sled front curve
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-28, 10);
        ctx.quadraticCurveTo(-32, 0, -28, -6);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(28, 10);
        ctx.quadraticCurveTo(32, 0, 28, -6);
        ctx.stroke();

        // Cross bars
        ctx.strokeStyle = '#A0522D';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-18, 4); ctx.lineTo(-18, 13);
        ctx.moveTo(0, 4); ctx.lineTo(0, 13);
        ctx.moveTo(18, 4); ctx.lineTo(18, 13);
        ctx.stroke();

        // === LEGS ===
        // Left leg
        ctx.fillStyle = '#2E5080';
        ctx.beginPath();
        ctx.ellipse(-8, -2, 5, 8, -0.3, 0, Math.PI * 2);
        ctx.fill();
        // Boot
        ctx.fillStyle = '#4A2010';
        ctx.beginPath();
        ctx.ellipse(-10, 6, 5, 4, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Right leg
        ctx.fillStyle = '#2E5080';
        ctx.beginPath();
        ctx.ellipse(8, -2, 5, 8, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4A2010';
        ctx.beginPath();
        ctx.ellipse(10, 6, 5, 4, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // === TORSO ===
        ctx.fillStyle = '#CC3333';
        ctx.beginPath();
        ctx.ellipse(0, -14, 10, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#991111';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Scarf body (on neck)
        ctx.fillStyle = '#FF6600';
        ctx.beginPath();
        ctx.ellipse(0, -26, 10, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // === ARMS ===
        ctx.strokeStyle = '#CC3333';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        // Left arm
        ctx.beginPath();
        ctx.moveTo(-8, -18);
        ctx.quadraticCurveTo(-16, -12, -14, -6);
        ctx.stroke();
        // Right arm
        ctx.beginPath();
        ctx.moveTo(8, -18);
        ctx.quadraticCurveTo(16, -12, 14, -6);
        ctx.stroke();

        // Mittens
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(-14, -6, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(14, -6, 3, 0, Math.PI * 2);
        ctx.fill();

        // === HEAD ===
        ctx.fillStyle = '#FFCC99';
        ctx.beginPath();
        ctx.arc(0, -36, 10, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(-3, -38, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(4, -38, 2, 0, Math.PI * 2);
        ctx.fill();

        // Blush
        ctx.fillStyle = 'rgba(255,150,150,0.4)';
        ctx.beginPath();
        ctx.arc(-6, -34, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(7, -34, 3, 0, Math.PI * 2);
        ctx.fill();

        // Smile
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, -35, 4, 0.1, Math.PI - 0.1);
        ctx.stroke();

        // === HAT ===
        ctx.fillStyle = '#CC2222';
        ctx.beginPath();
        ctx.moveTo(-10, -42);
        ctx.lineTo(10, -42);
        ctx.lineTo(4, -60);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#991111';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Hat brim
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(0, -42, 11, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Hat pom-pom
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(4, -60, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // === SCARF TAIL (drawn in world space behind rider) ===
        if (this.scarf.length > 1) {
            ctx.strokeStyle = '#FF6600';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(this.scarf[0].x, this.scarf[0].y);
            for (let i = 1; i < this.scarf.length; i++) {
                ctx.lineTo(this.scarf[i].x, this.scarf[i].y);
            }
            ctx.stroke();

            // Scarf stripe
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.scarf[0].x, this.scarf[0].y);
            for (let i = 1; i < this.scarf.length; i++) {
                ctx.lineTo(this.scarf[i].x, this.scarf[i].y);
            }
            ctx.stroke();

            // Scarf tip
            let tip = this.scarf[this.scarf.length - 1];
            ctx.fillStyle = '#FF6600';
            ctx.beginPath();
            ctx.arc(tip.x, tip.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
};

// ============================================================
// PARTICLES (SNOW)
// ============================================================
const snowParticles = [];
const MAX_SNOW = 300;

function spawnSnow(count) {
    for (let i = 0; i < count; i++) {
        snowParticles.push({
            x: rand(-200, W + 200),
            y: rand(-200, -10),
            size: rand(1, 4),
            speed: rand(30, 120),
            drift: rand(-30, 30),
            opacity: rand(0.3, 0.9),
            depth: rand(0.3, 1)
        });
    }
}

function updateSnow(dt) {
    let wind = sledder.vx * 0.3;

    for (let i = snowParticles.length - 1; i >= 0; i--) {
        let p = snowParticles[i];
        p.y += p.speed * dt * p.depth;
        p.x += (p.drift + wind) * dt * p.depth;

        if (p.y > H + 50 || p.x < -50 || p.x > W + 50) {
            snowParticles.splice(i, 1);
        }
    }

    // Maintain snow count
    if (snowParticles.length < MAX_SNOW) {
        spawnSnow(Math.min(5, MAX_SNOW - snowParticles.length));
    }
}

function drawSnow(ctx) {
    for (let p of snowParticles) {
        ctx.fillStyle = `rgba(255,255,255,${p.opacity * p.depth})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.depth, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ============================================================
// BACKGROUND LAYERS
// ============================================================
const BG = {
    dayProgress: 0,
    stars: [],
    clouds: [],
    mountains: [],
    hills: [],
    trees: [],

    init() {
        // Stars
        for (let i = 0; i < 200; i++) {
            this.stars.push({
                x: rand(0, 3000),
                y: rand(0, H * 0.5),
                size: rand(0.5, 2.5),
                twinkle: rand(0, Math.PI * 2)
            });
        }

        // Clouds
        for (let i = 0; i < 15; i++) {
            this.clouds.push({
                x: rand(-50
