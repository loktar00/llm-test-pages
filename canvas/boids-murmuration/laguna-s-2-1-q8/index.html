<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Boids Murmuration</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body, html { width: 100%; height: 100%; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const NUM_BOIDS = 600;
  const BOIDS = [];

  // Dusk landscape silhouette
  function drawLandscape() {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(1, '#131320');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Horizon
    const horizonY = height * 0.75;
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, horizonY, width, height - horizonY);

    // Silhouette hills
    ctx.fillStyle = '#05050d';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    for (let x = 0; x <= width; x += 20) {
      const y = horizonY + Math.sin(x * 0.01) * 15;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.fill();
  }

  class Boid {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height * 0.7;
      this.vx = (Math.random() - 0.5) * 0.6;
      this.vy = (Math.random() - 0.5) * 0.6;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;

      // Wrap edges
      if (this.x < -5) this.x = width + 5;
      if (this.x > width + 5) this.x = -5;
      if (this.y < -5) this.y = height * 0.7 + 5;
      if (this.y > height * 0.7 + 5) this.y = -5;
    }
  }

  function initBoids() {
    BOIDS.length = 0;
    for (let i = 0; i < NUM_BOIDS; i++) {
      BOIDS.push(new Boid());
    }
  }

  let predatorX = width / 2;
  let predatorY = height / 2;
  let predatorTargetX = width / 2;
  let predatorTargetY = height / 2;

  function updatePredator() {
    predatorTargetX = width * 0.2 + Math.random() * width * 0.6;
    predatorTargetY = height * 0.3 + Math.random() * height * 0.4;
    predatorX += (predatorTargetX - predatorX) * 0.02;
    predatorY += (predatorTargetY - predatorY) * 0.02;
  }

  const PERCEPTION = 40;
  const NEIGHBORHOOD_PREDATOR = 60;

  function flock(boid) {
    let fx = 0, fy = 0;
    let neighbors = 0;
    let avoidance = 0;

    for (let other of BOIDS) {
      const dx = other.x - boid.x;
      const dy = other.y - boid.y;
      const distSq = dx * dx + dy * dy;

      if (distSq < PERCEPTION * PERCEPTION && other !== boid && distSq > 0) {
        const dist = Math.sqrt(distSq);
        const influence = 1 / dist;

        // Cohesion
        fx += dx * influence;
        fy += dy * influence;

        // Separation + alignment (weighted toward closer boids)
        if (dist < 15) {
          fx += (boid.x - other.x) * 0.8;
          fy += (boid.y - other.y) * 0.8;
        }

        neighbors++;
      }
    }

    if (neighbors > 0) {
      boid.vx += (fx / neighbors) * 0.02;
      boid.vy += (fy / neighbors) * 0.02;
    }

    // Predator avoidance
    const pdx = predatorX - boid.x;
    const pdy = predatorY - boid.y;
    const pdistSq = pdx * pdx + pdy * pdy;

    if (pdistSq < NEIGHBORHOOD_PREDATOR * NEIGHBORHOOD_PREDATOR && pdistSq > 0) {
      const dist = Math.sqrt(pdistSq);
      const influence = (NEIGHBORHOOD_PREDATOR - dist) / NEIGHBORHOOD_PREDATOR;
      boid.vx += (boid.x - predatorX) * influence * 0.3;
      boid.vy += (boid.y - predatorY) * influence * 0.3;
    }

    // Speed limit
    const speed = Math.sqrt(boid.vx * boid.vx + boid.vy * boid.vy);
    const maxSpeed = 2.5;
    if (speed > maxSpeed) {
      boid.vx = (boid.vx / speed) * maxSpeed;
      boid.vy = (boid.vy / speed) * maxSpeed;
    }
  }

  let frameCount = 0;

  function animate() {
    requestAnimationFrame(animate);

    drawLandscape();

    // Update predator every few frames
    if (frameCount % 120 === 0) {
      updatePredator();
    }
    frameCount++;

    ctx.fillStyle = '#000814';
    for (let boid of BOIDS) {
      flock(boid);
      boid.update();

      // Draw boid as a tiny dark speck
      ctx.beginPath();
      ctx.arc(boid.x, boid.y, 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  initBoids();
  animate();
})();
</script>
</body>
</html>
