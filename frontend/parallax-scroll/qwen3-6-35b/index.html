<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit | Parallax Experience</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sky-top: #1e293b;
            --sky-bottom: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Mountain Colors */
            --layer-1: #1e293b; /* Back */
            --layer-2: #334155; /* Mid */
            --layer-3: #475569; /* Front */
            --layer-4: #0f172a; /* Foreground */
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Layout Structure */
        main {
            width: 100%;
            position: relative;
        }
