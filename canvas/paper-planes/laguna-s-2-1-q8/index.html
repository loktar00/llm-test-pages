<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Planes</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body { background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Set full screen
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    
    // Colors and constants
    const SUN_YELLOW = '#FFD700';
    const LIGHT_BEAM = 'rgba(255, 215, 0, 0.1)';
    const SKY_TOP = '#87CEEB';
    const SKY_BOTTOM = '#B0E0E6';
    const BALCONY_RED = '#8B4513';
    const FLOOR_COLOR = '#5D4037';
    const SHADOW_COLOR = 'rgba(0, 0, 0, 0.3)';
    const DUST_COLOR = 'rgba(255, 255, 255, 0.6)';
    const PLANE_COLOR_1 = '#FF6B6B';
    const PLANE_COLOR_2 = '#4ECDC4';
    const PLANE_COLOR_3 = '#45B7D1';
    const PLANE_COLOR_4 = '#96CEB4';
    
    // Physics constants
    const GRAVITY = 0.05;
    const LIFT_COEFFICIENT = 0.002;
    const DRAG_COEFFICIENT = 0.0005;
    const THERMAL_STRENGTH = 0.08;
    const THERMAL_RADIUS = 120;
    const MAX_SPEED = 3.5;
    const MIN_SPEED = 0.5;
    
    // Scene setup
    const planes = [];
    const dustMotes = [];
    const NUM_PLANES = 10;
    const NUM_DUST = 100;
    
    // Thermal column position (center of atrium)
    const thermalX = canvas.width / 2;
    const thermalY = 100;
    const thermalHeight = canvas.height - 200;
    
    // Balcony positions
    const balconies = [
        { x: 100, y: 150, width: 80, height: 20 },
        { x: canvas.width - 180, y: 150, width: 80, height: 20 },
        { x: 200, y: canvas.height - 100, width: 80, height: 20 },
        { x: canvas.width - 300, y: canvas.height - 100, width: 80, height: 20 }
    ];
    
    // Paper Airplane class
    class PaperAirplane {
        constructor() {
            this.reset();
        }
        
        reset() {
            // Start from a random balcony
            const balcony = balconies[Math.floor(Math.random() * balconies.length)];
            this.x = balcony.x + balcony.width / 2;
            this.y = balcony.y;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = Math.random() * -1 - 0.5;
            this.angle = Math.atan2(this.vy, this.vx);
            this.bankAngle = 0;
            this.targetBank = 0;
            this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            this.lift = 0;
            this.altitudePhase = 0;
            this.color = [PLANE_COLOR_1, PLANE_COLOR_2, PLANE_COLOR_3, PLANE_COLOR_4][Math.floor(Math.random() * 4)];
            this.foldTimer = 0;
            this.isLanding = false;
            this.isFolding = false;
            this.landingTarget = null;
        }
        
        update() {
            if (this.isFolding) {
                this.foldTimer += 0.05;
                if (this.foldTimer >= 1) {
                    this.reset();
                }
                return;
            }
            
            if (this.isLanding) {
                // Landing approach
                if (this.landingTarget) {
                    const dx = this.landingTarget.x - this.x;
                    const dy = this.landingTarget.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 5) {
                        // Landed
                        this.isFolding = true;
                        this.foldTimer = 0;
                        this.vx = 0;
                        this.vy = 0;
                        return;
                    }
                    
                    // Adjust angle toward target
                    const targetAngle = Math.atan2(dy, dx);
                    this.angle += (targetAngle - this.angle) * 0.05;
                    
                    // Slow down
                    this.speed *= 0.98;
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                    this.y += this.vy;
                    this.x += this.vx;
                    
                    // Check if landed
                    if (this.y >= canvas.height - 120) {
                        this.landingTarget = { x: this.x, y: canvas.height - 120 };
                    }
                    
                    // Gentle banking
                    this.targetBank = Math.sin(this.altitudePhase * 2) * 0.3;
                    this.bankAngle += (this.targetBank - this.bankAngle) * 0.05;
                    
                    this.altitudePhase += 0.02;
                    return;
                }
                
                if (this.y >= canvas.height - 100) {
                    this.landingTarget = { x: this.x, y: canvas.height - 120 };
                }
                return;
            }
            
            // Normal flight physics
            this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            
            // Apply drag
            this.speed *= (1 - DRAG_COEFFICIENT);
            this.speed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, this.speed));
            
            // Update velocity
            this.vx = Math.cos(this.angle) * this.speed;
            this.vy = Math.sin(this.angle) * this.speed;
            
            // Apply gravity
            this.vy += GRAVITY;
            
            // Check for thermal
            const dx = this.x - thermalX;
            const dy = this.y - thermalY;
            const distToThermal = Math.sqrt(dx * dx + dy * dy);
            
            if (distToThermal < THERMAL_RADIUS && this.y < thermalY + thermalHeight) {
                // Apply lift from thermal
                const liftFactor = 1 - (distToThermal / THERMAL_RADIUS);
                this.vy -= THERMAL_STRENGTH * liftFactor;
                
                // Gentle banking in thermal
                this.targetBank = Math.sin(this.altitudePhase * 3) * 0.8;
                this.altitudePhase += 0.03;
            } else {
                // Normal banking
                this.targetBank = Math.sin(this.altitudePhase * 1.5) * 0.4;
                this.altitudePhase += 0.01;
            }
            
            // Smooth banking
            this.bankAngle += (this.targetBank - this.bankAngle) * 0.03;
            
            // Update position
            this.x += this.vx;
            this.y += this.vy;
            
            // Gentle course corrections (simulate lift from wings)
            const lift = LIFT_COEFFICIENT * this.speed * this.speed;
            this.vy -= lift * Math.cos(this.bankAngle * 0.5);
            
            // Boundary check - start landing if near floor
            if (this.y > canvas.height - 100) {
                this.isLanding = true;
            }
            
            // Reset if gone too far
            if (this.y > canvas.height + 100 || this.x < -100 || this.x > canvas.width + 100) {
                this.reset();
            }
        }
        
        draw(ctx) {
            if (this.isFolding) {
                // Draw folding animation
                ctx.save();
                ctx.translate(this.x, this.y);
                const foldProgress = this.foldTimer;
                ctx.globalAlpha = 1 - foldProgress;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -15 * (1 - foldProgress));
                ctx.lineTo(-10 * (1 - foldProgress), 5 * (1 - foldProgress));
                ctx.lineTo(10 * (1 - foldProgress), 5 * (1 - foldProgress));
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                return;
            }
            
            // Draw shadow
            ctx.save();
            ctx.translate(this.x, this.y + 5);
            ctx.globalAlpha = SHADOW_COLOR;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.beginPath();
            const shadowSize = 6 * Math.cos(this.bankAngle) || 4;
            ctx.ellipse(0, 0, Math.abs(shadowSize), 2, this.angle, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // Draw plane
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.scale(1, Math.cos(this.bankAngle) || 0.5);
            
            // Plane body
            ctx.fillStyle = this.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 0.5;
            
            // Main wing body
            ctx.beginPath();
            ctx.moveTo(-12, 0);
            ctx.lineTo(8, 0);
            ctx.lineTo(6, 3);
            ctx.lineTo(-10, 3);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Tail fin
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(-14, -6);
            ctx.lineTo(-6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Wing tips
            ctx.beginPath();
            ctx.moveTo(-8, 0);
            ctx.lineTo(-6, 8);
            ctx.lineTo(-4, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.lineTo(2, 8);
            ctx.lineTo(6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Nose cone
            ctx.beginPath();
            ctx.moveTo(8, 0);
            ctx.lineTo(12, -1);
            ctx.lineTo(10, 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.restore();
        }
    }
    
    // Dust mote class
    class DustMote {
        constructor() {
            this.reset();
        }
        
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.vx = (Math.random() - 0.5) * 0.3;
            this.vy = (Math.random() - 0.5) * 0.2;
            this.brightness = Math.random() * 0.5 + 0.5;
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            // Drift in thermal area
            const dx = this.x - thermalX;
            const dy = this.y - thermalY;
            const distToThermal = Math.sqrt(dx * dx + dy * dy);
            
            if (distToThermal < THERMAL_RADIUS * 1.5) {
                this.vy -= 0.02;
            }
            
            // Reset if out of bounds
            if (this.x < -10 || this.x > canvas.width + 10 || this.y < -10 || this.y > canvas.height + 10) {
                this.reset();
                this.x = Math.random() * canvas.width;
                this.y = -10;
            }
        }
        
        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = this.brightness * 0.7;
            ctx.fillStyle = DUST_COLOR;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
    
    // Initialize planes
    for (let i = 0; i < NUM_PLANES; i++) {
        planes.push(new PaperAirplane());
    }
    
    // Initialize dust
    for (let i = 0; i < NUM_DUST; i++) {
        dustMotes.push(new DustMote());
    }
    
    // Animation loop
    function animate() {
        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw sky gradient
        const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, SKY_TOP);
        skyGradient.addColorStop(1, SKY_BOTTOM);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw sun light beam
        const gradient = ctx.createRadialGradient(thermalX, thermalY, 10, thermalX, thermalY, canvas.height * 0.6);
        gradient.addColorStop(0, LIGHT_BEAM);
        gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw atrium floor
        ctx.fillStyle = FLOOR_COLOR;
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        
        // Draw balconies
        for (const balcony of balconies) {
            ctx.fillStyle = BALCONY_RED;
            ctx.fillRect(balcony.x, balcony.y, balcony.width, balcony.height);
            
            // Balcony railing
            ctx.strokeStyle = '#5D4037';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(balcony.x, balcony.y + 5);
            ctx.lineTo(balcony.x + balcony.width, balcony.y + 5);
            ctx.stroke();
            
            // Balcony supports
            ctx.beginPath();
            ctx.moveTo(balcony.x, balcony.y + 5);
            ctx.lineTo(balcony.x - 10, balcony.y + 20);
            ctx.moveTo(balcony.x + balcony.width, balcony.y + 5);
            ctx.lineTo(balcony.x + balcony.width + 10, balcony.y + 20);
            ctx.stroke();
        }
        
        // Draw sun
        const sunGradient = ctx.createRadialGradient(thermalX, thermalY, 20, thermalX, thermalY, 80);
        sunGradient.addColorStop(0, SUN_YELLOW);
        sunGradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
        ctx.fillStyle = sunGradient;
        ctx.beginPath();
        ctx.arc(thermalX, thermalY, 40, 0, Math.PI * 2);
        ctx.fill();
        
        // Draw thermal column (invisible but affects physics)
        // Visualize with dust particles
        
        // Update and draw dust
        for (const dust of dustMotes) {
            dust.update();
            dust.draw(ctx);
        }
        
        // Update and draw planes
        for (const plane of planes) {
            plane.update();
            plane.draw(ctx);
        }
        
        requestAnimationFrame(animate);
    }
    
    animate();
})();
</script>
</body>
</html>
