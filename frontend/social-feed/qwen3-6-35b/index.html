<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Feed</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --accent: #6366f1;
    --accent-light: #a5b4fc;
    --accent-glow: rgba(99,102,241,0.25);
    --border: #e5e7eb;
    --like-red: #ef4444;
    --like-glow: rgba(239,68,68,0.3);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    padding: 28px 0 20px;
    position: relative;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), #8b5cf6, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ── Composer ── */
  .composer {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 20px;
    margin-bottom: 20px;
    transition: box-shadow var(--transition);
  }
  .composer:focus-within {
    box-shadow: var(--shadow-lg), 0 0 0 3px var(--accent-glow);
  }
  .composer-top {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .composer-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }
  .composer-input-wrap {
    flex: 1;
    position: relative;
  }
  .composer textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.55;
    color: var(--text);
    background: transparent;
    min-height: 52px;
    max-height: 200px;
  }
  .composer textarea::placeholder { color: #9ca3af; }
  .composer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .composer-actions {
    display: flex;
    gap: 4px;
  }
  .composer-action-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all var(--transition);
  }
  .composer-action-btn:hover {
    background: var(--bg);
    color: var(--accent);
  }
  .composer-action-btn svg { width: 18px; height: 18px; }
  .char-count {
    font-size: 12px;
    color: #9ca3af;
    font-variant-numeric: tabular-nums;
  }
  .post-btn {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: 0 2px 10px var(--accent-glow);
  }
  .post-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .post-btn:active { transform: scale(0.97); }

  /* ── Feed ── */
  .feed { display: flex; flex-direction: column; gap: 16px; }

  /* ── Post Card ── */
  .post {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow var(--transition), transform var(--transition);
    animation: postIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .post:hover {
    box-shadow: var(--shadow-md);
  }
  @keyframes postIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .post-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px 0;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .post-meta { flex: 1; min-width: 0; }
  .post-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    line-height: 1.3;
  }
  .post-time {
    font-size: 12px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .post-more {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all var(--transition);
  }
  .post-more:hover { background: var(--bg); }
  .post-more svg { width: 16px; height: 16px; }

  .post-body {
    padding: 12px 20px 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    word-wrap: break-word;
  }
  .post-body .hashtag { color: var(--accent); font-weight: 600; }

  .post-image {
    margin: 14px 20px 0;
    border-radius: var(--radius-sm);
    height: 240px;
    position: relative;
    overflow: hidden;
  }
  .post-image.gradient-1 {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .post-image.gradient-2 {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  }
  .post-image.gradient-3 {
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  }
  .post-image.gradient-4 {
    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
  }
  .post-image.gradient-5 {
    background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
  }
  .post-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.08) 100%);
  }
  .post-image-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.3;
  }
  .post-image-icon svg { width: 48px; height: 48px; fill: #fff; }

  /* ── Action Row ── */
  .post-actions {
    display: flex;
    align-items: center;
    padding: 12px 20px 16px;
    gap: 4px;
  }
  .action-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    user-select: none;
  }
  .action-btn:hover { background: var(--bg); }
  .action-btn svg { width: 18px; height: 18px; transition: transform var(--transition); }
  .action-btn:active svg { transform: scale(0.85); }

  .action-btn.like-btn:hover { color: var(--like-red); background: rgba(239,68,68,0.06); }
  .action-btn.like-btn.liked { color: var(--like-red); }
  .action-btn.like-btn.liked svg { fill: var(--like-red); }
  .action-btn.like-btn.liked .count { animation: countPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .action-btn.comment-btn:hover { color: var(--accent); background: rgba(99,102,241,0.06); }
  .action-btn.share-btn:hover { color: #10b981; background: rgba(16,185,129,0.06); }

  @keyframes countPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }

  /* ── Particle Burst ── */
  .particle-container {
    position: absolute;
    top: 50%;
    left: 50%;
    pointer-events: none;
    z-index: 10;
  }
  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: particleBurst 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes particleBurst {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  /* ── New Posts Pill ── */
  .new-posts-pill {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card);
    border: none;
    border-radius: 28px;
    padding: 12px 28px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(99,102,241,0.1);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    white-space: nowrap;
  }
  .new-posts-pill.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .new-posts-pill:hover {
    box-shadow: var(--shadow-lg), 0 0 0 3px var(--accent-glow);
    transform: translateX(-50%) translateY(-2px);
  }
  .new-posts-pill:active { transform: translateX(-50%) translateY(0) scale(0.97); }
  .new-posts-pill svg { width: 18px; height: 18px; }
  .pill-badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 10px;
    min-width: 20px;
    text-align: center;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .app { padding: 12px 10px 100px; }
    .post-body { font-size: 14px; }
    .post-image { height: 180px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>✦ Social Feed</h1>
    <p>What's happening today</p>
  </div>

  <!-- Composer -->
  <div class="composer" id="composer">
    <div class="composer-top">
      <div class="composer-avatar">Y</div>
      <div class="composer-input-wrap">
        <textarea id="composerInput" placeholder="What's on your mind?" rows="2"></textarea>
      </div>
    </div>
    <div class="composer-bottom">
      <div class="composer-actions">
        <button class="composer-action-btn" title="Photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <button class="composer-action-btn" title="GIF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M9 9v6"/><M15 9v6"/><path d="M9 12h6"/></svg>
        </button>
        <button class="composer-action-btn" title="Emoji">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>
      </div>
      <span class="char-count" id="charCount"></span>
      <button class="post-btn" id="postBtn">Post</button>
    </div>
  </div>

  <!-- Feed -->
  <div class="feed" id="feed"></div>
</div>

<!-- New Posts Pill -->
<button class="new-posts-pill" id="newPostsPill">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  <span>View new posts</span>
  <span class="pill-badge" id="pillBadge">3</span>
</button>

<script>
const postsData = [
  {
    name: "Aria Chen",
    initials: "AC",
    gradient: "linear-gradient(135deg, #6366f1, #8b5cf6)",
    time: "2m",
    text: "Just finished building my first 3D website with pure CSS. The depth and shadows are insane! 🎨✨",
    hasImage: true,
    imageGradient: "gradient-1",
    likes: 42,
    comments: 7,
    shares: 3,
    liked: false
  },
  {
    name: "Marcus Rivera",
    initials: "MR",
    gradient: "linear-gradient(135deg, #f59e0b, #ef4444)",
    time: "18m",
    text: "Hot take: the best code is the code you don't write. Simplicity wins every time. 🧘‍♂️",
    hasImage: false,
    likes: 128,
    comments: 23,
    shares: 15,
    liked: false
  },
  {
    name: "Luna Park",
    initials: "LP",
    gradient: "linear-gradient(135deg, #ec4899, #f43f5e)",
    time: "1h",
    text: "Sunset from the rooftop tonight. Sometimes you just need to stop and look up. 🌅",
    hasImage: true,
    imageGradient: "gradient-5",
    likes: 256,
    comments: 31,
    shares: 42,
    liked: false
  },
  {
    name: "James Okonkwo",
    initials: "JO",
    gradient: "linear-gradient(135deg, #10b981, #06b6d4)",
    time: "2h",
    text: "Day 100 of coding every day. Here's what I learned: consistency > intensity. Show up, even when you don't feel like it. 💪",
    hasImage: false,
    likes: 89,
    comments: 14,
    shares: 8,
    liked: false
  },
  {
    name: "Sofia Andersson",
    initials: "SA",
    gradient: "linear-gradient(135deg, #8b5cf6, #06b6d4)",
    time: "3h",
    text: "The aurora borealis last night was absolutely unreal. Nature's original gradient. 🇸🇪✨",
    hasImage: true,
    imageGradient: "gradient-3",
    likes: 341,
    comments: 52,
    shares: 67,
    liked: false
  },
  {
    name: "Kai Tanaka",
    initials: "KT",
    gradient: "linear-gradient(135deg, #f97316, #eab308)",
    time: "5h",
    text: "Coffee + rain + new project = perfect Sunday. Who else is in their flow state today? ☕🌧️",
    hasImage: false,
    likes: 67,
    comments: 11,
    shares: 4,
    liked: false
  }
];

const feed = document.getElementById('feed');
const composerInput = document.getElementById('composerInput');
const charCount = document.getElementById('charCount');
const postBtn = document.getElementById('postBtn');
const newPostsPill = document.getElementById('newPostsPill');
const pillBadge = document.getElementById('pillBadge');

function timeAgo(text) {
  return `<span class="post-time">${text}</span>`;
}

function processText(text) {
  return text.replace(/#(\w+)/g, '<span class="hashtag">#$1</span>');
}

function createPostCard(data, index) {
  const post = document.createElement('div');
  post.className = 'post';
  post.style.animationDelay = `${index * 0.06}s`;

  let imageHTML = '';
  if (data.hasImage) {
    imageHTML = `
      <div class="post-image ${data.imageGradient}">
        <div class="post-image-icon">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </div>
      </div>`;
  }

  post.innerHTML = `
    <div class="post-header">
      <div class="avatar" style="background:${data.gradient}">${data.initials}</div>
      <div class="post-meta">
        <div class="post-name">${data.name}</div>
        ${timeAgo(data.time)}
      </div>
      <button class="post-more">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
    <div class="post-body">${processText(data.text)}</div>
    ${imageHTML}
    <div class="post-actions">
      <button class="action-btn like-btn ${data.liked ? 'liked' : ''}" data-index="${index}">
        <svg viewBox="0 0 24 24" fill="${data.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="count">${data.likes}</span>
      </button>
      <button class="action-btn comment-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>${data.comments}</span>
      </button>
      <button class="action-btn share-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        <span>${data.shares}</span>
      </button>
    </div>
  `;

  return post;
}

function renderFeed() {
  feed.innerHTML = '';
  postsData.forEach((data, i) => {
    feed.appendChild(createPostCard(data, i));
  });
  attachLikeListeners();
}

function attachLikeListeners() {
  document.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const index = parseInt(this.dataset.index);
      const data = postsData[index];
      data.liked = !data.liked;
      data.likes += data.liked ? 1 : -1;

      // Re-render the specific post
      const post = this.closest('.post');
      const newPost = createPostCard(data, index);
      post.replaceWith(newPost);

      if (data.liked) {
        spawnParticles(this);
      }
    });
  });
}

function spawnParticles(btn) {
  const container = document.createElement('div');
  container.className = 'particle-container';
  btn.appendChild(container);

  const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899', '#f43f5e'];
  const count = 14;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const dist = 18 + Math.random() * 22;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - 4;
    p.style.setProperty('--tx', tx + 'px');
    p.style.setProperty('--ty', ty + 'px');
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = (4 + Math.random() * 4) + 'px';
    p.style.height = p.style.width;
    p.style.animationDuration = (0.5 + Math.random() * 0.3) + 's';
    container.appendChild(p);
  }

  setTimeout(() => container.remove(), 900);
}

// Character counter
composerInput.addEventListener('input', () => {
  const len = composerInput.value.length;
  charCount.textContent = len > 0 ? len + ' chars' : '';
});

// Post button
postBtn.addEventListener('click', () => {
  const text = composerInput.value.trim();
  if (!text) return;

  const newPost = {
    name: "You",
    initials: "Y",
    gradient: "linear-gradient(135deg, #6366f1, #8b5cf6)",
    time: "now",
    text: text,
    hasImage: false,
    likes: 0,
    comments: 0,
    shares: 0,
    liked: false
  };

  postsData.unshift(newPost);
  composerInput.value = '';
  charCount.textContent = '';
  renderFeed();
  feed.scrollTo({ top: 0, behavior: 'smooth' });
});

// New posts pill simulation
let pillShown = false;
setTimeout(() => {
  if (!pillShown) {
    pillShown = true;
    newPostsPill.classList.add('visible');
  }
}, 4000);

newPostsPill.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  newPostsPill.classList.remove('visible');
});

// Initial render
renderFeed();
</script>

</body>
</html>
