<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Cloud layers
const clouds = [];
for (let i = 0; i < 8; i++) {
    clouds.push({
        x: Math.random() * canvas.width * 2,
        y: 80 + i * 60,
        w: 150 + Math.random() * 200,
        h: 60 + Math.random() * 40,
        speed: 0.2 + Math.random() * 0.5
    });
}

// Farmhouse
const farmhouse = {
    x: canvas.width / 2 - 40,
    y: canvas.height - 200,
    w: 80,
    h: 60
};

// Lightning bolts
const bolts = [];

// Rain streaks
const rain = [];
for (let i = 0; i < 500; i++) {
    rain.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        len: 10 + Math.random() * 20,
        speed: 15 + Math.random() * 10
    });
}

// Sheet lightning
const sheets = [];

// Bolt timing
let lastBoltTime = 0;
let boltWaveCount = 0;
let boltWaveTimer = 0;

function midPointDisp(x1, y1, x2, y2, displace, bolts, depth) {
    if (displace < 2 || depth > 12) return;
    
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2 + (Math.random() - 0.5) * displace * 2;
    
    bolts.push({x1: x1, y1: y1, x2: mx, y2: my});
    bolts.push({x1: mx, y1: my, x2: x2, y2: y2});
    
    midPointDisp(x1, y1, mx, my, displace / 2.2, bolts, depth + 1);
    midPointDisp(mx, my, x2, y2, displace / 2.2, bolts, depth + 1);
}

function createLightning() {
    const startX = canvas.width / 2 + (Math.random() - 0.5) * 200;
    const segments = [];
    const endY = canvas.height - 150;
    
    // Main bolt
    const mainBolt = [];
    const forkPoints = [];
    const endX = startX + (Math.random() - 0.5) * 100;
    
    // Generate main path points
    const pathPoints = [{x: startX, y: 50}];
    let currentY = 50;
    while (currentY < endY) {
        currentY += 20 + Math.random() * 30;
        const offset = (Math.random() - 0.5) * 40;
        pathPoints.push({x: startX + offset + (currentY / endY) * (endX - startX) * 0.3, y: currentY});
    }
    pathPoints.push({x: endX, y: endY});
    
    // Build segments from path
    for (let i = 0; i < pathPoints.length - 1; i++) {
        const p1 = pathPoints[i];
        const p2 = pathPoints[i + 1];
        const segBolts = [];
        midPointDisp(p1.x, p1.y, p2.x, p2.y, 10, segBolts, 0);
        for (const seg of segBolts) {
            mainBolt.push({...seg, brightness: 1});
        }
        // Fork occasionally
        if (Math.random() < 0.4 && p1.y > 200) {
            const forkEndX = p1.x + (Math.random() - 0.5) * 200;
            const forkEndY = p1.y + 100 + Math.random() * 100;
            const forkBolts = [];
            midPointDisp(p1.x, p1.y, forkEndX, forkEndY, 8, forkBolts, 0);
            for (const seg of forkBolts) {
                mainBolt.push({...seg, brightness: 0.7});
            }
        }
    }
    
    bolts.push({
        segments: mainBolt,
        time: 0,
        duration: 300 + Math.random() * 200,
        alpha: 1
    });
    
    // Sheet lightning
    sheets.push({
        time: 0,
        duration: 500 + Math.random() * 500,
        intensity: 0.3 + Math.random() * 0.4,
        x: Math.random() * canvas.width,
        y: 100 + Math.random() * 300,
        size: 200 + Math.random() * 300
    });
}

function animate(time) {
    if (!lastBoltTime) lastBoltTime = time;
    const dt = time - lastBoltTime;
    lastBoltTime = time;
    
    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw ground
    ctx.fillStyle = '#1a1a0a';
    ctx.fillRect(0, canvas.height - 140, canvas.width, 140);
    
    // Draw rolling hills
    ctx.fillStyle = '#0f0f05';
    ctx.beginPath();
    ctx.ellipse(canvas.width * 0.3, canvas.height - 100, 200, 40, 0, 0, Math.PI * 2);
    ctx.ellipse(canvas.width * 0.7, canvas.height - 120, 150, 35, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Sheet lightning effect
    let sheetIllum = 0;
    for (let i = sheets.length - 1; i >= 0; i--) {
        const s = sheets[i];
        s.time += dt * 1000;
        if (s.time > s.duration) {
            sheets.splice(i, 1);
            continue;
        }
        const fade = 1 - s.time / s.duration;
        s.intensityFade = s.intensity * fade * Math.sin(s.time / s.duration * Math.PI);
        sheetIllum += s.intensityFade;
        
        // Draw sheet
        ctx.fillStyle = `rgba(200, 220, 255, ${s.intensityFade * 0.3})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * fade, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Draw clouds
    ctx.fillStyle = '#333';
    for (const cloud of clouds) {
        const illum = sheetIllum * 0.5;
        ctx.fillStyle = `rgba(50 + illum * 100, 50 + illum * 100, 60 + illum * 80, 0.7)`;
        ctx.beginPath();
        ctx.ellipse(cloud.x, cloud.y, cloud.w, cloud.h, 0, 0, Math.PI * 2);
        ctx.ellipse(cloud.x + cloud.w * 0.5, cloud.y - cloud.h * 0.3, cloud.w * 0.7, cloud.h * 0.8, 0, 0, Math.PI * 2);
        ctx.ellipse(cloud.x - cloud.w * 0.4, cloud.y, cloud.w * 0.6, cloud.h * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        
        cloud.x -= cloud.speed;
        if (cloud.x < -cloud.w) {
            cloud.x = canvas.width + cloud.w;
            cloud.y = 80 + Math.random() * 400;
        }
    }
    
    // Bolt wave timing
    boltWaveTimer += dt * 1000;
    
    // Trigger bolts in waves
    if (boltWaveTimer > 2000 + Math.random() * 3000) {
        boltWaveTimer = 0;
        const numBolts = 1 + Math.floor(Math.random() * 4);
        for (let i = 0; i < numBolts; i++) {
            setTimeout(createLightning, Math.random() * 2000);
        }
    }
    
    // Draw lightning bolts
    let boltIllum = 0;
    for (let i = bolts.length - 1; i >= 0; i--) {
        const bolt = bolts[i];
        bolt.time += dt * 1000;
        const fade = 1 - bolt.time / bolt.duration;
        if (fade <= 0) {
            bolts.splice(i, 1);
            continue;
        }
        
        boltIllum += 0.3 * fade;
        
        ctx.strokeStyle = `rgba(255, 255, 255, ${fade})`;
        ctx.lineWidth = 1 + fade * 2;
        ctx.beginPath();
        for (const seg of bolt.segments) {
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
        }
        ctx.stroke();
        
        // Glow
        ctx.shadowColor = 'white';
        ctx.shadowBlur = 20 * fade;
        ctx.strokeStyle = `rgba(100, 200, 255, ${fade * 0.5})`;
        ctx.lineWidth = 3 * fade;
        ctx.beginPath();
        for (const seg of bolt.segments) {
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    
    // Total illumination
    const totalIllum = Math.max(sheetIllum, boltIllum) * 0.8;
    
    // Update cloud color based on illumination
    for (const cloud of clouds) {
        // Already drawn, but we can add flash effect
    }
    
    // Draw farmhouse
    ctx.fillStyle = `rgba(40, 30, 20, 1)`;
    ctx.fillRect(farmhouse.x, farmhouse.y, farmhouse.w, farmhouse.h);
    
    // Roof
    ctx.fillStyle = '#2a1a0a';
    ctx.beginPath();
    ctx.moveTo(farmhouse.x - 10, farmhouse.y);
    ctx.lineTo(farmhouse.x + farmhouse.w + 10, farmhouse.y);
    ctx.lineTo(farmhouse.x + farmhouse.w / 2, farmhouse.y - 30);
    ctx.closePath();
    ctx.fill();
    
    // Lit window
    ctx.fillStyle = `rgba(255, 255, 200, ${0.8 + totalIllum * 0.5})`;
    ctx.fillRect(farmhouse.x + 15, farmhouse.y + 15, 20, 15);
    
    // Draw rain
    ctx.strokeStyle = 'rgba(180, 200, 255, 0.5)';
    ctx.lineWidth = 1;
    for (const drop of rain) {
        ctx.beginPath();
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x + (Math.random() - 0.5) * 4, drop.y + drop.len);
        ctx.stroke();
        
        drop.x -= drop.speed * 0.1;
        drop.y += drop.speed;
        
        if (drop.y > canvas.height) {
            drop.y = -20;
            drop.x = Math.random() * canvas.width;
        }
    }
    
    // Ground illumination from lightning
    if (totalIllum > 0) {
        ctx.fillStyle = `rgba(100, 150, 255, ${totalIllum * 0.3})`;
        ctx.fillRect(0, canvas.height - 140, canvas.width, 140);
    }
    
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
