<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SELENE-7 · Lunar Descent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100;height:100;height:100vh;overflow:hide;background:#000;font-family:'Courier New',monospace}
canvas{display:grid;width:100%;height:100vh;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2');
var W=0,H=0,DPR=1;
function resize(){
 DPR=Math.min(2,window.devicePixelRatio||1);
 W=window.innerWidth;
 H=window.innerHeight;
 canvas.width=Math.floor(W*DPR);
 canvas.height=Math.floor(H*DPR);
 canvas.style.width=W+'px';
 canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize',resize);

var RND=function(){var s=1;return function(a,b){if(a===undefined)return Math.random();if(b===undefined){s=(s*166)%(0;s=(Math.random()*(21474856)&0xffffffff}return s/21474856*(b-a)+a;};}();

var GRAV=0.012;
var MAX_THR=0.0228;
var FUEL_R=0.0016;
var LAND_OK=0.5;

// State
var state='NEW'; // NEW,DESCENT,LANDING,REST,CRASH
var stateT=0;
var cycle=0;

// Craft
var cx=0,cy=0,cvx=0,cvy=0;
var cang=0,cangv=0;
var fuel=1;
var padX=0,padW=0;
var padY=0;
var padLight=0;
var landT=0;
var restT=0;
var crashT=0;
var crashType='';
var lastLanding=null;

// Terrain
var terrain=[];
var tBaseY=0;

// Camera
var camX=0,camY=0;
var camTX=0,camY=0;

// Particles
var P_SIZE=6000;
var pX=new Float32Array(P_SIZE);
var pY=new Float32Array(P_SIZE);
var pVX=new Float32Array(P_SIZE);
var pVY=new Float32Array(P_SIZE);
var pLife=new Float32Array(P_SIZE);
var pMax=new Float32Array(P_SIZE);
var pR=new Float32Array(P_SIZE);
var pG=new Float32Array(P_SIZE);
var pB=new Float32Array(P_SIZE);
var pSz=new Float32Array(P_SIZE);
var pType=new Int8Array(P_SIZE); // 0=spark,1=dust,2=star
var pFree=[];
for(var i=0;i<P_SIZE;i++)pFree.push(i);

// Stars
var stars=[];

// === TERRAIN ===
function genTerrain(){
 terrain.length=0;
 tBaseY=H*0.62;
 for(var i=0;i<W+100;i+=2){
  var x=i;
  var h=0;
  h+=Math.sin(i*0.005)*40;
  h+=Math.sin(i*0.012+0.7)*20;
  h+=Math.sin(i*0.026+1.3)*10;
  h+=RND()*5;
  terrain.push({x:x,y=tBaseY+h});
 }
 // carve pad
 padX=RND(W*0.20,W*0.70);
 padW=RND(70,130);
 var pi=Math.floor(padX/2);
 padY=terrain[pi].y;
 var ps=Math.floor(padX/2), pe=Math.floor((padX+padW)/2);
 for(var i=ps;i<pe&&i<terrain.length;i++){
  terrain[i].y=padY;
  terrain[i].pad=true;
 }
 // slope leading edges
 for(var i=0;i<5;i++){
  var k=ps-5+i;
  if(k>=0&&k<terrain.length){
   var t=i/5;
   terrain[k].y=terrain[ps].y+(1-t)*(terrain[ps].y-terrain[k].y)*0;
   terrain[k].y=Math.lerp(terrain[ps].y,terrain[ps].y-25,1-t);
  }
 }
}

// === STARS ===
function genStars(){
 stars.length=0;
 for(var i=0;i<150;i++){
  stars.push({
   x:Math.random()*W,
   y:Math.random()*H*0.55,
   r:Math.pow(Math.random(),2)*2+0.5,
   br:Math.random()*0.5+0.5,
   tw:Math.random()*Math.PI*2,
   twSp:Math.random()*0.024+0.008,
   hue:Math.random()<0.9?255:(Math.random()*240+40)
  });
 }
}

// === LANDING CYCLE ===
function newCycle(){
 cycle++;
 genTerrain();
 genStars();
 // Place craft above pad, off-axis
 cx=padX+(RND(-1,1)*RND(60,160));
 cy=-50;
 cvx=0;cvy=0;
 cang=0;cangv=0;
 fuel=1;
 camTX=cx-W/2; camY=0;
 state='DESCENT';
 stateT=0;
}

// === PARTICLES ===
function spawn(x,y,vx,vy,life,r,g,b,sz,t){
 if(pFree.length===0)return;
 var i=pFree.pop();
 pX[i]=x;pY[i]=y;
 pVX[i]=vx;pVY[i]=vy;
 pLife[i]=life;pMax[i]=life;
 pR[i]=r;pG[i]=g;pB[i]=b;
 pSz[i]=sz;pType[i]=t;
}
function updateParticles(dt){
 for(var i=0;i<P_SIZE;i++){
  if(pLife[i]>0){
   pVX[i]*=0.998;
   pVY[i]+=GRAV*0.5*dt;
   pX[i]+=pVX[i]*dt*0.06;
   pY[i]+=pVY[i]*dt*0.06;
   pLife[i]-=dt*0.016;
   if(pType[i]==1){
    var t=getTerrainElev(pX[i]);
    if(pY[i]>t){
     pLife[i]=0;
     spawnDustB(pX[i],t,1);
    }
   }
   if(pLife[i]<=0)pFree.push(i);
  }
 }
}

function spawnDustB(x,y,n){
 for(var k=0;k<n;k++){
  var i;
  if(pFree.length===0)return;
  i=pFree.pop();
  pX[i]=x;pY[i]=y;
  var a=RND(-Math.PI*0.8,Math.PI*0.8)-Math.PI/2;
  var sp=RND(0.5,4.5);
  pVX[i]=Math.cos(a)*sp*0.4;
  pVY[i]=Math.sin(a)*sp;
  pLife[i]=RND(60,150);
  pMax[i]=pLife[i];
  pR[i]=200+Math.random()*40;
  pG[i]=180+Math.random()*30;
  pB[i]=150+Math.random()*30;
  pSz[i]=RND(1,3);
  pType[i]=1;
 }
}

function spawnExplosion(x,y,n){
 for(var k=0;k<n;k++){
  if(pFree.length===0)return;
  var i=pFree.pop();
  pX[i]=x;pY[i]=y;
  var a=Math.random()*Math.PI*2;
  var sp=RND(2,7);
  pVX[i]=Math.cos(a)*sp;
  pVY[i]=Math.sin(a)*sp;
  pLife[i]=RND(50,150);
  pMax[i]=pLife[i];
  pR[i]=255;
  pG[i]=180+Math.random()*70;
  pB[i]=40+Math.random()*40;
  pSz[i]=RND(2,6);
  pType[i]=1;
 }
}

// === PHYSICS ===
function physicsStep(dt){
 cx+=cvx*dt;
 cy+=cvy*dt;
 var oldAng=cang;
 cang+=cangv*dt;
 // wrap angle
 if(cang>Math.PI)cang-=Math.PI*2;
 if(cang<-Math.PI)cang+=Math.PI*2;
}

// === CONTROLLER ===
function controller(dt){
 // Compute target hover height above pad
 var hoverH=RND(120,150); // per-cycle target hover
 if(state=='DESCENT'){
  // Phase 1: descend from start hover to landing hover
  // Phase 2: hover & search landing window
 }
 // Compute landing window (when craft above pad, slow, low angle)
 var dX=cx-padX;
 var dY=cy-padY;
 var distV=Math.hypot(dX,dY);
 
 // Landing approach control:
 // 1. Bring craft to hover above pad
 // 2. Match velocity with pad (0)
 // 3. Reduce vertical speed gradually
 // 4. Land softly

 // Simple cascade:
 var phase='APPROACH'; // APPROACH, MATCH,DESCEND
 if(state=='DESCENT'){
  // Approach: hover above pad with offset
  // Compute desired position
  var hoverTgt=120+cycle*0; // start hover
  // Phase 1: come from cy=-50, hover at padY-150
  var phase1Done=cy<(H-150-30); // arbitrary
  
  // Compute error
  var tx=padX;
  var ty=padY-hoverTgt;
  // PID-ish
  var ex=tx-cx;
  var ey=ty-cy;
  // Horizontal correction
  cvx+=ex*0.001*0.06;
  cvx*=0.998;
  // Thrust for hovering
  var hoverThrust=GRAV;
  // descend speed control
  if(cy>ty+30){
   hoverThrust=GRAV*1.6;
  }
  cvy+=hoverThrust*dt;
  // counter fuel burn
 }
 // ...
}

// === LANDING DETECT ===
function detectLand(){
 var te=getTerrainElev(cx);
 if(cy>te-3){
  // landed or crashed
  var dx=padX+padW/2;
  var pd=Math.abs(cx-dx);
  var sp=Math.hypot(cvx,cvy);
  var onPad=cx>padX-5&&cx<padX+padW+5;
  if(onPad && sp<LAND_OK && Math.abs(cang)<0.3){
   return 'LAND';
  } else if(sp>1.5){
   return 'CRASH_SP';
  } else if(!onPad){
   return 'CRASH_POS';
  } else if(Math.abs(cang)>0.4){
   return 'CRASH_ANG';
  } else {
   return 'CRUSH_OTHER';
  }
 }
 return null;
}

// === MAIN ===
var lastT=performance.now();
function frame(){
 var now=performance.now();
 var dt=Math.min(32,(now-lastT));
 lastT=now;
 update(dt);
 render();
 requestAnimationFrame(frame);
}

function update(dt){
 stateT+=dt;
 camX+=(camTX-camX)*0.04;
 // Particles
 updateParticles(dt);
 
 if(state=='NEW'){
  newCycle();
 }
 if(state=='DESCENT'){
  physicsStep(dt);
  controller(dt);
  // fuel burn
  // particles thruster
  // ...
  var res=detectLand();
  if(res!=null){
   if(res=='LAND'){
    state='LANDING'; landT=0; 
    lastLanding={x:padX+padW/2,y:padY,success:true};
    padLight=1;
    cx=padX+padW/2; cy=padY; cvx=0;cvy=0; cang=0;
   } else {
    state='CRASH'; crashT=0; crashType=res;
    spawnExplosion(cx,cy,80);
    lastLanding={x:cx,y:cy,success=false};
   }
  }
 }
 if(state=='LANDING'){
  landT+=dt;
  // pad lights stay
  if(landT<180){
   // hold
  }
  if(landT>180 && landT<180+200){
   // Phase: lift off
   var t=(landT-180)/200;
   cy=padY-t*t*t*100;
   if(t<1){
   // burn particles downward
   spawn(...);
   }
   // fuel burn
  }
  if(landT>380){
   state='REST'; restT=0;
   restStart=cx;
  }
 }
 if(state=='REST'){
  restT+=dt;
  // Phase: scroll terrain to new pad
  var dur=120;
  if(restT<dur){
   var t=restT/dur;
   var ease=1-M.pow(1-t,3);
   camTX=restStart+ease*(padX-restStart-W);
   // Actually scroll terrain
  // We need to physically move terrain array
  // easier: regenerate new terrain and shift
  }
  if(restT>=dur){
   // Generate new terrain with same craft relative position
   // Save relative craft pos
   // genTerrain() then offset craft
   state='NEW';
  }
 }
}

function render(){
 // bg
 ctx.fillStyle='rgb(8,15,28)';
 ctx.fillRect(0,0,W,H);
 
 // stars
 for(var s of stars){
  // twinkle
  var br=s.br*(0.6+0.4*Math.sin(s.tw));
  s.tw+=s.twSp;
  ctx.fillStyle=`rgba(${{0},${0},${0},...)`;
 }
 // ...
 
 // terrain
 // ...
 
 // craft
 // ...
 
 // HUD
 // ...
}

})();
</script>
</body>
</html>
