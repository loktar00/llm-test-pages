<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaball Lava Lamp</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050005;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="lampCanvas"></canvas>
    <script>
        const canvas = document.getElementById('lampCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // Offscreen buffer for the field calculation (lower resolution for performance)
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');

        // Configuration
        const config = {
            blobCount: 10,
            baseRadius: 40,
            fieldResolution: 6, // Pixel size of offscreen grid (higher = faster, blockier)
            threshold: 1.0,     // Field density required to render
            viscosity: 0.96,    // Velocity damping
            heatBase: 0.02,     // Upward force at bottom
            coolTop: -0.02,     // Downward force at top
            wobbleSpeed: 0.002, // Random horizontal drift
            colors: {
                bgTop: '#2a0000',
                bgBot: '#000000',
                blobCore: '#ffcc00',
                blobEdge: '#ff0000',
                blobDark: '#550000'
            }
        };

        let width, height;
        let blobs = [];

        class Blob {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                // If initial, random height. If resetting, force to bottom.
                this.y = initial ? Math.random() * height : height + 50;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = config.baseRadius + (Math.random() * 20 - 10);
                // Random phase for wobble
                this.wobbleOffset = Math.random() * 1000;
            }

            update() {
                // Heat/Cool Dynamics
                const normalizedY = this.y / height;
                
                // Base heats up (pushes up), Top cools down (pulls down)
                // Using a sine wave for smooth transition zone in the middle
                let forceY = 0;
                
                if (normalizedY > 0.8) {
                    // At bottom: strong push up
                    forceY = config.heatBase;
                } else if (normalizedY < 0.2) {
                    // At top: strong pull down
                    forceY = config.coolTop;
                } else {
                    // Middle: slight turbulence/drift
                    forceY = Math.sin(this.wobbleOffset + performance.now() * 0.001) * 0.002;
                }

                this.vy += forceY;
                
                // Horizontal Wobble
                this.vx += (Math.random() - 0.5) * 0.05;
                
                // Apply Viscosity (Air resistance / Liquid density)
                this.vx *= config.viscosity;
                this.vy *= config.viscosity;

                // Update Position
                this.x += this.vx;
                this.y += this.vy;

                // Wall Constraints
                const margin = this.radius;
                if (this.x < margin) { this.x = margin; this.vx *= -0.5; }
                if (this.x > width - margin) { this.x = width - margin; this.vx *= -0.5; }
                
                // Floor/Ceiling soft bounce
                if (this.y > height + 100) this.reset();
                if (this.y < -100) this.reset();
            }
        }

        function init() {
            resize();
            blobs = [];
            for (let i = 0; i < config.blobCount; i++) {
                blobs.push(new Blob());
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Offscreen buffer scaled down for performance
            offCanvas.width = Math.ceil(width / config.fieldResolution);
            offCanvas.height = Math.ceil(height / config.fieldResolution);
        }

        function drawField() {
            // Clear offscreen
            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.globalCompositeOperation = 'lighter'; // Additive blending
            offCtx.fillStyle = 'white';

            // Draw blobs onto the low-res buffer
            // We draw them larger because the canvas is smaller
            blobs.forEach(blob => {
                const r = blob.radius / config.fieldResolution;
                const x = blob.x / config.fieldResolution;
                const y = blob.y / config.fieldResolution;

                // Create gradient for the blob field (Inverse Square Law approximation)
                // Radial gradient creates a smooth falloff for the metaball math
                const grad = offCtx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                offCtx.fillStyle = grad;
                offCtx.beginPath();
                offCtx.arc(x, y, r, 0, Math.PI * 2);
                offCtx.fill();
            });

            // Thresholding:
            // We use globalCompositeOperation 'source-in' to keep only pixels 
            // that exist in the field and have sufficient alpha (density).
            // However, standard canvas doesn't support mathematical thresholding directly on alpha.
            // Trick: Draw the field, then use a solid rect with 'source-in' to clip, 
            // but we need to discard weak pixels.
            
            // Better Trick for Canvas:
            // 1. Fill screen with semi-transparent white (The Threshold value).
            // 2. Draw the blobs (Additive).
            // 3. Use a composite operation to keep only what is "brighter" than background?
            // Actually, simpler: Draw blobs. Then use getImageData to threshold alpha, 
            // but that's slow.
            
            // Fastest Canvas Trick:
            // Draw blobs (Additive).
            // Create a "Threshold" layer.
            // Use 'destination-in' with a mask? No.
            
            // Let's use the standard "Threshold via GlobalCompositeOperation" hack:
            // 1. Fill background with 'white' (represents the threshold value 1.0).
            // 2. Draw blobs with 'lighter' (additive).
            // 3. Now pixels > 1.0 are saturated (255,255,255). Pixels < 1.0 are dimmer.
            // 4. This doesn't strictly threshold.
            
            // Reliable Threshold:
            // We will draw the blobs. Then we will draw a solid color over the whole screen
            // with composite operation 'source-atop' or similar? No.
            
            // Let's go with the pixel manipulation on the small buffer. 
            // It's small enough (width/6) that it won't kill 60fps.
            
            const w = offCanvas.width;
            const h = offCanvas.height;
            const imgData = offCtx.getImageData(0, 0, w, h);
            const data = imgData.data;
            
            // Threshold value (0-255). 
            // Since we used alpha in gradient, we look at Alpha channel.
            // If we used additive blending of white, we look at Red/Green/Blue.
            // We used white gradients.
            
            const thresholdVal = 100; // Adjust for thickness

            for (let i = 0; i < data.length; i += 4) {
                // The field value is in the Alpha or RGB channels (since we drew white)
                // Because of 'lighter', RGB values add up.
                const val = data[i]; // Red channel
                
                if (val > thresholdVal) {
                    // Inside the blob
                    // Make it opaque white
                    data[i] = 255;
                    data[i+1] = 255;
                    data[i+2] = 255;
                    data[i+3] = 255;
                } else {
                    // Outside
                    data[i+3] = 0;
                }
            }
            offCtx.putImageData(imgData, 0, 0);
        }

        function render() {
            // 1. Background Gradient (The Glass Lamp)
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, config.colors.bgTop);
            bgGrad.addColorStop(1, config.colors.bgBot);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. Calculate Field
            drawField();

            // 3. Draw the Lava
            // We draw the offscreen buffer scaled up. 
            // To get smooth edges, we use 'imageSmoothingEnabled'.
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high'; // 'high' helps smooth the blocky low-res mask
            
            // To get the "Glow" and "Core" look, we draw the mask multiple times or use gradients.
            // But we only have a binary mask in offCanvas now.
            
            // Let's create the coloring on the main canvas using the mask as a clipping path.
            
            // A. Draw the "Dark/Edge" color
            ctx.save();
            // Draw the mask
            ctx.drawImage(offCanvas, 0, 0, width, height);
            // Use the mask to clip
            ctx.globalCompositeOperation = 'source-in';
            ctx.fillStyle = config.colors.blobEdge;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();

            // B. Draw the "Core/Glow" color (Inner Glow)
            // We want the center to be lighter. 
            // We can draw the blobs again on the main canvas, but that defeats the merge purpose.
            // Instead, we can draw the mask again, but scaled down slightly (inset), 
            // and composite that over the dark layer.
            
            ctx.save();
            // Draw the mask again to use as alpha source for the core
            // But we want it smaller. 
            // Draw the offscreen canvas scaled down slightly into the center
            const scale = 0.85;
            const w = width;
            const h = height;
            const sw = w * scale;
            const sh = h * scale;
            
            // We need to draw the mask, then apply a gradient to it.
            // This is tricky with just one mask.
            
            // Alternative: Draw the mask. Then draw the blobs individually on top with 'screen' or 'lighter'
            // to add the core glow, while keeping the hard edge defined by the mask.
            
            // Reset composite
            ctx.globalCompositeOperation = 'source-over';
            
            // Draw the main body (Dark Red)
            // We already did this in step A, but let's refine.
            // Step A left us with a sharp red shape.
            
            // Now add the hot core.
            ctx.save();
            ctx.drawImage(offCanvas, 0, 0, width, height);
            ctx.globalCompositeOperation = 'source-in';
            
            // Create a radial gradient that matches the blob centers? No, too complex.
            // Just a general bright center glow for the whole shape?
            // Or simply draw the blobs again as soft glowing circles on top.
            // Since the mask is 'source-in', anything drawn here stays inside the merged shape.
            
            // Draw a full screen gradient that is lighter in the "middle" of the screen?
            // No, the blobs are distinct.
            
            // Best visual hack: Draw the blobs again as soft glowing circles.
            // Because of 'source-in', they will be clipped to the merged shape.
            blobs.forEach(blob => {
                const grad = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.radius);
                grad.addColorStop(0, config.colors.blobCore);
                grad.addColorStop(0.4, config.colors.blobEdge);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
            
            // C. Add a subtle rim light / glass reflection
            ctx.save();
            ctx.drawImage(offCanvas, 0, 0, width, height);
            ctx.globalCompositeOperation = 'source-in';
            
            // Light source from top left
            const rimGrad = ctx.createLinearGradient(0, 0, width, height);
            rimGrad.addColorStop(0, 'rgba(255,255,255,0.3)');
            rimGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
            rimGrad.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.fillStyle = rimGrad;
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
        }

        function loop() {
            // Update physics
            blobs.forEach(blob => blob.update());
            
            // Render
            render();
            
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        init();
        loop();

    </script>
</body>
</html>
