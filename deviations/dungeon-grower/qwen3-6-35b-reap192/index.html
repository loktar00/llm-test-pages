<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Self-Generation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;
        const TILE_SIZE = 40;
        const COLS = 40;
        const ROWS = 30;
        
        // Game State
        let grid = [];
        let rooms = [];
        let torches = [];
        let explorer = null;
        let generationQueue = [];
        let state = 'GENERATING'; // GENERATING, EXPLORE, FADE, RESET
        let globalTime = 0;
        let fadeAlpha = 1.0;

        // Initialize Canvas
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Classes ---

        class Room {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.cx = Math.floor(x + w/2);
                this.cy = Math.floor(y + h/2);
                this.floors = [];
                this.corridors = [];
                this.carvingSpeed = 1; // Tiles per frame
                this.carveIndex = 0;
                this.isComplete = false;
            }

            carve(grid) {
                // Create floors
                for(let i = this.x; i < this.x + this.w; i++) {
                    for(let j = this.y; j < this.y + this.h; j++) {
                        this.floors.push({x: i, y: j});
                        if(grid[i] && grid[i][j] === 0) {
                            grid[i][j] = 1; // Wall to Floor
                        }
                    }
                }
            }

            update(grid) {
                if (this.isComplete) return;
                
                // Fill floors
                let filled = 0;
                while(filled < this.carvingSpeed && this.carveIndex < this.floors.length) {
                    const t = this.floors[this.carveIndex];
                    const tile = grid[t.x][t.y];
                    if(tile === 1) {
                        grid[t.x][t.y] = 2; // Active Floor
                        filled++;
                        this.carveIndex++;
                    } else {
                        this.carveIndex++; // Skip already active
                    }
                }

                // Corridors are handled by the connector object, 
                // but here we check if we are done if the connector is done
            }
        }

        class Corridor {
            constructor(roomA, roomB) {
                this.roomA = roomA;
                this.roomB = roomB;
                this.points = [];
                this.carvedPoints = 0;
                this.speed = 2;

                // Determine path
                const midX = Math.floor(roomA.cx + (roomB.cx - roomA.cx)/2);
                
                // Horizontal then Vertical or vice versa
                if (Math.random() > 0.5) {
                    // H then V
                    for(let i = Math.min(roomA.cx, roomB.cx); i <= Math.max(roomA.cx, roomB.cx); i++) this.points.push({x: i, y: roomA.cy});
                    for(let i = Math.min(roomA.cy, roomB.cy); i <= Math.max(roomA.cy, roomB.cy); i++) this.points.push({x: roomB.cx, y: i});
                } else {
                    // V then H
                    for(let i = Math.min(roomA.cy, roomB.cy); i <= Math.max(roomA.cy, roomB.cy); i++) this.points.push({x: roomA.cx, y: i});
                    for(let i = Math.min(roomA.cx, roomB.cx); i <= Math.max(roomA.cx, roomB.cx); i++) this.points.push({x: i, roomB.cy});
                }
            }

            update(grid) {
                if (this.carvedPoints >= this.points.length) return;

                let count = 0;
                while(count < this.speed && this.carvedPoints < this.points.length) {
                    const p = this.points[this.carvedPoints];
                    if (grid[p.x] && grid[p.x][p.y] === 1) {
                        grid[p.x][p.y] = 2; // Activate floor
                    }
                    this.carvedPoints++;
                    count++;
                }
            }
        }

        class Torch {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.flickerSpeed = 0.05 + Math.random() * 0.1;
                this.phase = Math.random() * Math.PI * 2;
                this.range = 80 + Math.random() * 40;
            }

            update() {
                this.phase += this.flickerSpeed;
            }

            draw(ctx) {
                // Draw the torch base (simple visual)
                ctx.fillStyle = '#332211';
                ctx.fillRect(this.x * TILE_SIZE + 12, this.y * TILE_SIZE + 12, 16, 16);
                ctx.fillStyle = '#ffaa00'; // Flame
                ctx.fillRect(this.x * TILE_SIZE + 16, this.y * TILE_SIZE + 8, 8, 8);
                
                // Visual Light
                const intensity = 0.5 + 0.2 * Math.sin(this.phase);
                const grad = ctx.createRadialGradient(
                    this.x * TILE_SIZE + TILE_SIZE/2, 
                    this.y * TILE_SIZE + TILE_SIZE/2, 
                    5, 
                    this.x * TILE_SIZE + TILE_SIZE/2, 
                    this.y * TILE_SIZE + TILE_SIZE/2, 
                    this.range
                );
                grad.addColorStop(0, `rgba(255, 180, 50, ${intensity})`);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x * TILE_SIZE + TILE_SIZE/2, this.y * TILE_SIZE + TILE_SIZE/2, this.range, 0, Math.PI*2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            }
        }

        class Explorer {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.timer = 0;
                this.moveInterval = 15; // Frames between moves
                this.path = [];
                this.dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
            }

            update(grid) {
                this.timer++;
                if(this.timer >= this.moveInterval) {
                    this.timer = 0;
                    this.move(grid);
                }
                // Always draw
                this.draw(ctx);
            }

            move(grid) {
                // Get valid neighbors
                const validMoves = this.dirs.filter(d => {
                    const nx = this.x + d.x;
                    const ny = this.y + d.y;
                    if(!grid[nx] || !grid[nx][ny]) return false;
                    // Prefer unvisited (0) > active (2) > active (1)
                    // But for simplicity, just ensure it's floor
                    return grid[nx][ny] === 1 || grid[nx][ny] === 2;
                });

                if(validMoves.length > 0) {
                    // Simple logic: chance to turn, otherwise try to keep going
                    // Or purely random valid step
                    const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    this.x += move.x;
                    this.y += move.y;
                }
            }

            draw(ctx) {
                const cx = this.x * TILE_SIZE + TILE_SIZE/2;
                const cy = this.y * TILE_SIZE + TILE_SIZE/2;
                
                ctx.fillStyle = '#55ffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#55ffff';
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // --- Logic ---

        function generateDungeon() {
            state = 'GENERATING';
            fadeAlpha = 1.0;
            
            // Init Grid
            grid = [];
            for(let i=0; i<COLS; i++) {
                grid[i] = [];
                for(let j=0; j<ROWS; j++) {
                    grid[i][j] = 0; // 0=Wall, 1=Floor(Static), 2=Floor(Active)
                }
            }
            
            rooms = [];
            torches = [];
            generationQueue = [];
            
            // BSP or simple Random Placement
            // Simple Random with overlap check
            const maxRooms = 15;
            let attempts = 0;
            while(rooms.length < maxRooms && attempts < 100) {
                const w = 4 + Math.floor(Math.random() * 6);
                const h = 4 + Math.floor(Math.random() * 6);
                const x = Math.floor(Math.random() * (COLS - w - 2)) + 1;
                const y = Math.floor(Math.random() * (ROWS - h - 2)) + 1;
                
                let overlap = false;
                for(let r of rooms) {
                    if(x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y) {
                        overlap = true;
                        break;
                    }
                }
                
                if(!overlap) {
                    const room = new Room(x, y, w, h);
                    room.carve(grid);
                    rooms.push(room);
                    
                    // Add Torch
                    if(Math.random() > 0.3) {
                        torches.push(new Torch(room.cx, room.cy));
                    }
                }
                attempts++;
            }

            // Connect Rooms
            for(let i=0; i<rooms.length-1; i++) {
                const r1 = rooms[i];
                const r2 = rooms[i+1]; // Connect to next logical one
                
                // To ensure full connectivity, connect to nearest neighbor if distance is high
                // But linear connection is simpler for visual flow
                const conn = new Corridor(r1, r2);
                generationQueue.push(conn);
            }
            
            // Add rooms to queue first so they carve
            rooms.forEach(r => generationQueue.push(r));
            
            // Start Explorer in first room
            explorer = new Explorer(rooms[0].cx, rooms[0].cy);
        }

        function drawGrid() {
            // Fill Background
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, width, height);
            
            // Draw Active Floors (2)
            ctx.fillStyle = '#222';
            // Optimization: Draw rects instead of iterating every pixel
            // But for "carving" effect, we draw the 1s and 2s distinctly
            for(let i=0; i<COLS; i++) {
                for(let j=0; j<ROWS; j++) {
                    if(grid[i][j] === 2) {
                        // Floor
                        ctx.fillStyle = '#2a2a2a';
                        ctx.fillRect(i*TILE_SIZE, j*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        // Tile detail
                        ctx.strokeStyle = '#333';
                        ctx.strokeRect(i*TILE_SIZE, j*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    } else if (grid[i][j] === 1) {
                        // Hidden Floor (carving animation)
                        ctx.fillStyle = '#444';
                        ctx.fillRect(i*TILE_SIZE, j*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
        }

        function update() {
            globalTime++;

            if (state === 'FADE') {
                fadeAlpha -= 0.01;
                if (fadeAlpha <= 0) {
                    generateDungeon();
                }
                return;
            }

            // Generation
            if (state === 'GENERATING') {
                let activeItems = 0;
                for(let item of generationQueue) {
                    if(item.update) item.update(grid);
                    if(!item.isComplete) activeItems++;
                }
                
                // Check if all done
                let allDone = true;
                for(let r of rooms) if(!r.isComplete) allDone = false;
                for(let c of generationQueue) if (c instanceof Corridor && c.carvedPoints < c.points.length) allDone = false;
                
                if(allDone) {
                    state = 'EXPLORE';
                }
            }

            // Exploration
            if (state === 'EXPLORE') {
                // Check completion (optional: count visited tiles)
                // For now, just wander until user hits space or timer
                // Let's wander forever until fade trigger
                
                // 1. Check if map is "full" (arbitrary check: all tiles are active floor)
                // Optimization: track active count
                let activeCount = 0;
                let totalFloor = 0;
                for(let i=0; i<COLS; i++) {
                    for(let j=0; j<ROWS; j++) {
                        if(grid[i][j] !== 0) totalFloor++;
                        if(grid[i][j] === 2) activeCount++;
                    }
                }

                if(activeCount === totalFloor) {
                    state = 'FADE';
                }
                
                explorer.update(grid);
            }

            // Torch flicker
            torches.forEach(t => t.update());
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // 1. Draw Map
            drawGrid();

            // 2. Draw Torch Visuals
            torches.forEach(t => t.draw(ctx));

            // 3. Draw Explorer
            if(explorer) explorer.draw(ctx);

            // 4. Darkness / Lighting Overlay
            // We use composite operations to draw darkness
            // First, fill with darkness
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, width, height);
            
            // Cut out light from torches
            // We need to be careful about performance. 
            // Instead of subtracting from a massive canvas, 
            // we draw a "darkness" fill with 'destination-out' 
            // but we need the map to be visible first.
            
            // Strategy: 
            // 1. Draw Map (done above)
            // 2. Draw Torch Lights (done above with additive)
            // 3. Draw "Darkness" layer with 'destination-out' to cut holes? 
            // No, that destroys the map pixels.
            
            // Better Strategy:
            // 1. Draw Map
            // 2. Create an offscreen canvas (or reuse) for "The Darkness"
            // 3. On Darkness Canvas: Fill Black. Draw Red/Green/Blue circles (torch light) with lighter logic?
            // 4. Overlay Darkness Canvas with alpha.
            
            // Let's do the Torch Light logic in a separate pass for clarity or stick to standard compositing.
            
            // Current visual:
            // Map is drawn.
            // Torch Light is drawn on top (additive).
            // This looks okay, but torch light shouldn't add brightness to the background, it should reveal it.
            
            // Let's refine the Torch Light drawing.
            // We need to clear the previous frame's light or redraw.
            
            // Redrawing logic for proper lighting:
            
            // 1. Clear Canvas
            ctx.clearRect(0,0,width,height);
            
            // 2. Draw Map
            drawGrid();
            
            // 3. Prepare Darkness Overlay
            // We can't easily "punch" holes in a full screen canvas without an offscreen buffer 
            // if we want to preserve the map underneath.
            
            // Let's use a simple trick:
            // Fill Darkness.
            // Set Composite to 'destination-out'.
            // Draw Torch Lights (White circles). This erases the darkness.
            // Draw Map on top.
            // Set Composite back to 'source-over'.
            
            // Wait, if we draw Map ON TOP, the torch lights drawn underneath won't look right (they won't fade onto the walls).
            // Torch lights need to sit BETWEEN Map and Darkness.
            
            // Correct Order:
            // 1. Draw Map
            // 2. Draw Torch Lights (Additive)
            // 3. Fill Darkness (with 'destination-out' to punch holes based on Torch Lights?)
            //    No, that requires storing the torch light mask.
            
            // Simplest Approach for Single Canvas:
            // 1. Draw Map
            // 2. Draw Torch Lights
            // 3. Fill Darkness with alpha.
            // This creates a "glow" effect which is acceptable.
            
            // To make torches look like they reveal darkness:
            // We need the darkness to be solid, and torches to "cut" it.
            
            // Let's try the 'destination-out' method on a separate "Darkness Layer" canvas.
            // But we only have one canvas.
            
            // Let's cheat:
            // Draw Map.
            // Draw Torch Lights (Additive) -> This makes the map brighter around torches.
            // Fill Darkness with 0.9 opacity.
            // This creates a hazy fog effect, not a sharp light cutout.
            
            // To do sharp cutouts:
            // 1. Draw Map to TempCanvas
            // 2. Draw Map to MainCanvas
            // 3. Draw Darkness to MainCanvas
            // 4. Draw Torch Lights to MainCanvas with 'destination-out' (Erasing Darkness)
            // 5. Draw Map (from TempCanvas) to MainCanvas (Overwriting Darkness)
            
            // Since I can't easily create offscreen canvases without memory overhead in this snippet,
            // I will do a "Fake Light" using radial gradients on the main canvas 
            // but strictly using 'destination-out' on a specific layer if I were using multiple.
            
            // Let's stick to the visual that looks good:
            // Map -> Torch Lights (Additive) -> Darkness Overlay.
            // It looks like a foggy dungeon.
            
            // Actually, let's try to do the cutout properly without extra canvas if possible.
            // We can't.
            
            // Let's do the "Two Layer" trick with one canvas by clearing and redrawing the map?
            // No.
            
            // Let's stick to the "Foggy" look or the "Additive" look.
            // Additive is best for "Torchlight".
            
            // Refine Torch Light Drawing:
            // Clear Canvas
            // Draw Map
            // For each Torch:
            //   ctx.globalCompositeOperation = 'lighter';
            //   Draw Radial Gradient (Warm -> Transparent)
            //   ctx.globalCompositeOperation = 'source-over';
            // Fill Darkness (Black with opacity)
            
            // This makes the torch light glow ON the walls.
            
            // Let's execute this refined drawing logic in the draw loop.
        }

        // Override draw for better lighting
        function render() {
            // 1. Draw Map
            drawGrid();

            // 2. Torch Lights
            ctx.globalCompositeOperation = 'lighter';
            for(let t of torches) {
                const cx = t.x * TILE_SIZE + TILE_SIZE/2;
                const cy = t.y * TILE_SIZE + TILE_SIZE/2;
                const r = t.range;
                
                // Flicker color shift
                const hue = 30 + Math.sin(globalTime * 0.1 + t.phase) * 10;
                
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                grad.addColorStop(0, `hsla(${hue}, 100%, 60%, 0.8)`);
                grad.addColorStop(0.4, `hsla(${hue}, 100%, 50%, 0.3)`);
                grad.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';

            // 3. Torch Visuals (The Stick)
            for(let t of torches) {
