<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Social Profile Header</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f5f6fa;
      color: #2d3436;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .profile-header {
      width: 100%;
      max-width: 720px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .banner {
      position: relative;
      height: 180px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-container {
      position: absolute;
      bottom: -48px;
      left: 2rem;
      width: 96px;
      height: 96px;
    }

    .avatar-ring {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 4px;
      background: conic-gradient(from 0deg, #667eea, #f093fb, #667eea);
      animation: rotateRing 8s linear infinite;
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #dfe6e3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #fff;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #27ae60;
      box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.3);
      z-index: 2;
      transition: all 0.3s ease;
    }

    .avatar-container:hover .status-dot {
      transform: scale(1.15);
      box-shadow: 0 0 0 5px rgba(39, 174, 96, 0.4);
    }

    .info {
      padding: 3.5rem 2rem 1.25rem 2rem;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 0.25rem;
    }

    .handle {
      font-size: 1rem;
      color: #636e72;
      margin-bottom: 1.25rem;
    }

    .stats {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #2d3436;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #636e72;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem 1.5rem 2rem;
    }

    .follow-btn {
      position: relative;
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
      z-index: 1;
    }

    .follow-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #00b894, #00cec9);
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -1;
      border-radius: 30px;
    }

    .follow-btn.following::before {
      opacity: 1;
    }

    .follow-btn span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.3s ease;
    }

    .follow-btn.following span.text {
      opacity: 0;
      transform: translateX(-10px);
    }

    .follow-btn span.check-icon {
      display: none;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.4s ease;
    }

    .follow-btn.following span.check-icon {
      display: inline-flex;
      opacity: 1;
      transform: scale(1);
    }

    .follow-btn.followed span.text {
      opacity: 1;
      transform: translateX(0);
    }

    .tabs {
      display: flex;
      border-top: 1px solid #ecf0f1;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 1rem 0;
      font-size: 0.95rem;
      font-weight: 500;
      color: #636e72;
      cursor: pointer;
      position: relative;
      transition: color 0.3s ease;
    }

    .tab:hover {
      color: #667eea;
    }

    .tab.active {
      color: #667eea;
    }

    .tab-underline {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 33.333%;
      height: 3px;
      background: linear-gradient(90, #667eea, #764ba2);
      border-radius: 3px 3px 0 0;
      transition: transform 0.45s cubic-bezier(0.25, 0.4, 0.25, 1);
    }

    .tab:nth-child(1).active ~ .tab-underline { transform: translateX(0); }
    .tab:nth-child(2).active ~ .tab-underline { transform: translateX(100%); }
    .tab:nth-child(3).active ~ .tab-underline { transform: translateX(200%); }

    /* Fallback if sibling selector doesn't work due to structure */
    .tab-underline[data-tab="1"] { transform: translateX(0); }
    .tab-underline[data-tab="2"] { transform: translateX(100%); }
    .tab-underline[data-tab="3"] { transform: translateX(200%); }
  </style>
</head>
<body>
  <div class="profile-header">
    <div class="banner"></div>

    <div class="avatar-container">
      <div class="avatar-ring">
        <div class="avatar-inner">
          <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JvePSIwIDAgMTAwIDEwMCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI2RmZTZlMyIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNDUiIHI9IjIwIiBmaWxsPSIjYmYzNDU0Ii8+PC9zdmc+" alt="Avatar" />
        </div>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="info">
      <div class="name">Alex Morgan</div>
      <div class="handle">@alexmorgan</div>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-value" data-target="1256">0</span>
          <span class="stat-label">Posts</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" data-target="8421">0</span>
          <span class="stat-label">Followers</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" data-target="328">0</span>
          <span class="stat-label">Following</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="follow-btn" id="followBtn">
        <span>
          <span class="text">Follow</span>
          <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12.5L10 17.5L19 7.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <div class="tabs">
        <div class="tab active" data-tab="1">Posts</div>
        <div class="tab" data-tab="2">Media</div>
        <div class="tab" data-tab="3">Likes</div>
        <div class="tab-underline" data-tab="1"></div>
      </div>
    </div>
  </div>

  <script>
    // Count-up animation
    document.querySelectorAll('.stat-value').forEach(el => {
      const target = parseInt(el.getAttribute('data-target'));
      const duration = 2000;
      const start = performance.now();

      const update = (now) => {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        // Ease out cubic
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(target * eased);
        if (progress < 1) requestAnimationFrame(update);
      };
      requestAnimationFrame(update);
    });

    // Follow button toggle
    const followBtn = document.getElementById('followBtn');
    let followed = false;

    followBtn.addEventListener('click', () => {
      if (!followed) {
        followBtn.classList.add('following');
        setTimeout(() => {
          followBtn.classList.add('followed');
        }, 500);
        followed = true;
      } else {
        followBtn.classList.remove('followed');
        setTimeout(() => {
          followBtn.classList.remove('following');
        }, 500);
        followed = false;
      }
    });

    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const underline = document.querySelector('.tab-underline');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const tabNum = tab.getAttribute('data-tab');
        underline.setAttribute('data-tab', tabNum);
      });
    });

    // Initialize underline position
    underline.setAttribute('data-tab', '1');
  </script>
</body>
</html>
