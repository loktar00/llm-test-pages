<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Transit Growth</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100;
    height: 100vmax;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    background: #16171a;
    font-family: 'S1CD', sans-serif;
  }
  body { background: #16171a; }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
  }
  .hud {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    letter-spacing: 0.6em;
    font-family: 'SFM Mono', 'JetBrains Mono', Consoria, monospace;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 2;
    user-select: none;
  }
  .hud b {
    color: rgba(255,255,255,0.6);
    font-weight: 500;
    letter-spacing: 0.6em;
  }
  .hud i {
    font-style: normal;
    color: rgba(255,255,255,0.2);
    font-size: 9px;
    letter-spacing: 0.8em;
  }
  .stamp {
    position: fixed;
    top: 20px;
    right: 20px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    letter-spacing: 0.5em;
    font-family: 'SFM Mono', 'Jetetarts Mono', Consoria, monospace;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 2;
  }
  .stamp i {
    font-style: normal;
    color: rgba(255,255,0.1);
  }
  .stamp::before {
    content: '';
    display: block;
    width: 1px;
    height: 30px;
    background: rgba(255,255,255,0.20);
    margin-bottom: 5px;
  }
  .stamp::after {
    content: '◉';
    color: rgba(255,255,255,0.5);
    display: block;
    width: 12px;
    height: 12px;
    font-size: 8px;
    margin-top: 5px;
    line-height: 1;
  }
  .stamp i::after { content: ''; }
  .legend {
    position: fixed;
    top: 20px;
    left: 20px;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    letter-spacing: 0.4em;
    font-family: 'SFM Mono', 'Jetetarts Mono', Consoria, monospace;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 2;
    max-width: 120px;
    line-height: 1.9;
    font-weight: 400;
  }
  .legend b {
    color: rgba(255,255,255,0.6);
    font-weight: 500;
  }
  .legend i {
    font-style: normal;
    color: rgba(255,255,0.1);
    font-size: 9px;
    letter-spacing: 0.6em;
  }
  .legend::after {
    content: '---';
    display: block;
    margin-top: 1px;
    color: rgba(255,255,255,0.2);
    font-size: 8px;
    letter-spacing: 0;
  }
  .legend::before {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: rgba(255,255,255,0.2);
    margin-bottom: 3px;
  }
</style>
</head>
<body>
<div class="legend">North Line<br><b>Line 012</b><br><i>Central District</i></div>
<div class="hud"><b id="hudLine">—</b> &nbsp; / &nbsp; <i id="hudTime">00.00</i></div>
<div class="stamp"><i>SECTOR</i>&nbsp;01</div>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// === Palette ===
const PALETTE = [
  '#e6156d', '#ff7e00', '#0073a2', '#019a4f', '#ff5c00',
  '#5b2c90', '#ffb326', '#23b8a1', '#ef3624', '#004c5d',
  '#a60f2f', '#5cd7f6', '#b5238a', '#19b8a6', '#cc5599'
];

const DOT = 12, DOT2 = DOT/2;
const DIAG = 0.707;
const H0 = 1/3;

// === Easing ===
const easeOutC1 = x => 1 - (1 - (1 - x)) * (1 - x) * 0.5;
const easeInC1 = x => x * x * 0.5;

function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

// === Vec ===
class Vec {
  constructor(x, y) { this.x = x; this.y = y; }
  add(v, c=1) { return new Vec(this.x + v.x*c, this.y + v.y*c); }
  sub(v) { return new Vec(this.x - v.x, this.y - v.y); }
  scale(s) { return new Vec(this.x * s, this.y * s); }
  dot(v) { return this.x*v.x + this.y*v.y; }
  cross(v) { return this.x*v.y - this.y*v.x; }
  len() { return Math.hypot(this.x, this.y); }
  norm() { const l = this.len(); return l > 1e-6 ? new Vec(this.x/l, this.y/l) : new Vec(this.x, this.y); }
  rotate(a) {
    const c = Math.cos(a), s = Math.sin(a);
    return new Vec(this.x*c - this.y*s, this.x*s + this.y*c);
  }
}

function s8(a, c) {
  const d = c ? a - 1 : a;
  const s = Math.abs(Math.sin(a * Math.PI * 4 / (Math.PI * 4))) * Math.sign(a - Math.PI/2) | 0;
  return a + 2;
}

function pL(a) { return { x: a, y: 0 }; }
const pL = a => { return { x: a, y: 0 }; };

function pL1(a) {
  return { x: a };
}

function lU8(x) {
  if (x < 0) return '';
  return Math.floor(Math.log(10) + Math.abs(x));
}

// === Utilities ===
const _C = {
  V: (x, y) => { const v = new Vec(x, y); return v; }
};

function h(a) { return a; }
function pL3(a) { return { x: a }; }

function l2k0(s, c) {
  const r = 2 - 2 * s;
  return r;
}
function pL5(a) { return a; }

// === Line generation ===
class Line {
  constructor(name, color, idx) {
    this.name = name;
    this.color = color;
    this.idx = idx;
    this.stations = [];
    this.segs = [];
    this.complete = false;
    this.progress = 0;
    this.trains = [];
    this.b = new Bounds();
  this._s0 = null;
    this._s1 = null;
    this._s2 = null;
  }

  add(p) {
    this.stations.push(p);
    if (this.stations.length === 1) return true;
    const prev = this.stations[this.stations.length - 2];
    const d = p.sub(prev);
    const dLen = d.len();
    if (dLen < 0.01) return false;

    const dN = d.scale(1/dLen);
    let len = dLen;
    const prevSeg = this.segs.length > 0 ? this.segs[this.segs.length - 1] : null;
    let prevA = prevSeg ? prevSeg.aOut : dN;
    const prevSegIdx = prevSeg ? prevSeg.bIdx : -1;
    const prevSegSeg = prevSeg ? prevSeg.seg : -1;
    const prevSegLen = prevSeg ? prevSeg.len : 0;
    const prevSegP = prevSeg ? prevSeg.p : -1;
    const prevSegQ = prevSeg ? prevSeg.q : -1;

    const inSeg = Math.abs(dN.x*prevA.x + dN.y*prevA.y);
    const outSeg = Math.abs(dN.x*prevA.x - dN.y*prevA.y);
    const turnSeg = Math.abs(dN.x*prevA.y - dN.y*prevA.x);

    if (this.segs.length > 0 && inSeg > 1 - 1e-3) {
      const newSeg = new Seg(prev, prevSegIdx, prevSegSeg, len, prevSegP, prevSegQ);
      newSeg.dIn = new Vec(dN.x, dN.y);
      newSeg.aIn = new Vec(prevSeg.aOut.x, prevSeg.aOut.y);
      newSeg.aOut = new Vec(dN.x, dN.y);
      newSeg.isStraight = true;
      prevSeg.bOut = new Vec(dN.x, dN.y);
      prevSeg.bIdx = this.segs.length;
      prevSeg.bSeg = -1;
      this.segs.push(newSeg);
      this.b.add(prev);
      this.b.add(p);
      return true;
    } else if (this.segs.length > 0 && outSeg > 1 - 1e-3) {
      const corner = prev.add(dN.scale(DOT2));
      const newSeg = new Seg(prev, prevSegIdx, prevSegSeg, len, prevSegP, prevSegQ);
      newSeg.dIn = new Vec(prevSeg.aOut.x, prevSeg.aOut.y);
      newSeg.aIn = new Vec(prevSeg.aOut.x, prevSeg.aOut.y);
      newSeg.aOut = new Vec(-prevSeg.aOut.x, -prevSeg.aOut.y);
      newSeg.isStraight = true;
      newSeg.corner = corner;
      prevSeg.bOut = new Vec(prevSeg.aOut.x, prevSeg.aOut.y);
      prevSeg.bIdx = this.segs.length;
      prevSeg.bSeg = -1;
      this.segs.push(newSeg);
      this.b.add(prev);
      this.b.add(p);
      this.b.add(corner);
      return true;
    } else if (this.segs.length > 0 && turnSeg > 0.5) {
      const turnSign = Math.sign(dN.x*prevA.y - dN.y*prevA.x);
      const corner = prev.add(dN.scale(-DOT2));
      const arc = new Seg(prev, -1, -1, Math.PI/2 * DOT2, -1, -1);
      arc.dIn = new Vec(-prevSeg.aOut.x, -prevSeg.aOut.y);
      arc.aIn = new Vec(prevSeg.aOut.x, prevSeg.aOut.y);
      arc.aOut = new Vec(dN.x, dN.y);
      arc.arcR = DOT2;
      arc.arcStart = Math.atan2(-prevSeg.aOut.y, -prevSeg.aOut.x);
      arc.arcEnd = Math.atan2(dN.y, dN.x);
      arc.arcDir = turnSign;
      arc.corner = corner;
      prevSeg.bOut = new Vec(prevSeg.aOut.x, prevSeg.aOut.y);
      prevSeg.bIdx = this.segs.length;
      prevSeg.bSeg = this.segs.length + 1;
      this.segs.push(arc);
      const newSeg = new Seg(corner, this.segs.length, -1, len - DOT2, prevSegP, prevSegQ);
      newSeg.dIn = new Vec(dN.x, dN.y);
      newSeg.aIn = new Vec(dN.x, dN.y);
      newSeg.aOut = new Vec(dN.x, dN.y);
      newSeg.isStraight = true;
      this.segs.push(newSeg);
      this.b.add(prev);
      this.b.add(p);
      this.b.add(corner);
      return true;
    } else {
      const newSeg = new Seg(prev, prevSegIdx, prevSegSeg, len, prevSegP, prevSegQ);
      newSeg.dIn = new Vec(dN.x, dN.y);
      newSeg.aIn = new Vec(prevSeg ? prevSeg.aOut.x : dN.x, prevSeg ? prevSeg.aOut.y : dN.y);
      newSeg.aOut = new Vec(dN.x, dN.y);
      newSeg.isStraight = true;
      prevSeg.bOut = new Vec(dN.x, dN.y);
      prevSeg.bIdx = this.segs.length;
      prevSeg.bSeg = -1;
      this.segs.push(newSeg);
      this.b.add(prev);
      this.b.add(p);
      return true;
    }
  }

  finalize() {
    for (let i = 0; i < this.stations.length; i++) this.stations[i].line = this;
    this.complete = true;
    const a = new Train(this);
    a.pos = 0;
    a.t = 0;
    a.dir = 1;
    this.trains.push(a);
    const b = new Train(this);
    b.pos = this.totalLength();
    b.t = 0;
    b.dir = -1;
    this.trains.push(b);
  }

  totalLength() {
    let t = 0;
    for (const s of this.segs) t += s.len;
    return t;
  }
}

class Seg {
  constructor(s, bIdx, bSeg, len, p, q) {
    this.s = s;
    this.aIn = new Vec(0, 0);
    this.bOut = new Vec(0, 0);
    this.bIdx = bIdx;
    this.bSeg = bSeg;
    this.len = len;
    this.p = p;
    this.q = q;
  }
}

class Train {
  constructor(line) {
    this.line = line;
    this.pos = 0;
    this.t = 0;
    this.dir = 1;
  }
}

class Station {
  constructor(p, line, idx) {
    this.x = p.x;
    this.y = p.y;
    this.line = line;
    this.idx = idx;
    this.isInter = false;
  }
  get p() { return new Vec(this.x, this.y); }
}

class Bounds {
  constructor() { this.min = new Vec(1e6, 1e6); this.max = new Vec(-1e6, -1e6); }
  add(p) {
    if (p.x < this.min.x) this.min.x = p.x;
    if (p.y < this.min.y) this.min.y = p.y;
    if (p.x > this.max.x) this.max.x = p.x;
    if (p.y > this.max.y) this.max.y = p.y;
  }
}

// === Drawing ===
function drawLineBase(line) {
  if (line.segs.length === 0) return;
  ctx.strokeStyle = line.color;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < line.segs.length; i++) {
    const sg = line.segs[i];
    if (sg.corner) ctx.moveTo(sg.corner.x, sg.corner.y);
    else ctx.moveTo(sg.s.x, sg.s.y);
    ctx.lineTo(sg.s.x + sg.dIn.x * sg.len, sg.s.y + sg.dIn.y * sg.len);
  }
  ctx.stroke();
}

function drawLineCap(line) {
  if (!line.complete) return;
  ctx.strokeStyle = line.color;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.arc(line.segs[0].s.x, line.segs[0].s.y, 9, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  const last = line.segs[line.segs.length - 1];
  ctx.arc(last.s.x + last.dIn.x * last.len, last.s.y + last.dIn.y * last.len, 9, 0, Math.PI*2);
  ctx.stroke();
}

function drawLine(line) {
  const fade = easeOutC1(line.progress);
  const capFade = fade * fade * fade;
  const capA = capFade * 0.7 + 0.2;

  // Shadow
  ctx.strokeStyle = line.color;
  ctx.globalAlpha = 0.15 * capFade;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < line.segs.length; i++) {
    const sg = line.segs[i];
    const dEnd = sg.len * fade;
    const x = sg.s.x + sg.dIn.x * dEnd;
    const y = sg.s.y + sg.dIn.y * dEnd;
    ctx.moveTo(sg.s.x, sg.s.y);
    ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.globalAlpha = capFade;
  ctx.strokeStyle = line.color;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < line.segs.length; i++) {
    const sg = line.segs[i];
    const dEnd = sg.len * fade;
    const x = sg.s.x + sg.dIn.x * dEnd;
    const y = sg.s.y + sg.dIn.y * dEnd;
    if (sg.corner) {
      ctx.moveTo(sg.corner.x, sg.corner.y);
    } else {
      ctx.moveTo(sg.s.x, sg.s.y);
    }
    ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // End cap (tick perpendicular to last segment)
  const last = line.segs[line.segs.length - 1];
  const tipPos = new Vec(last.s.x + last.dIn.x * last.len * fade, last.s.y + last.dIn.y * last.len * fade);
  ctx.globalAlpha = capA;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tipPos.x - last.dIn.y * 5, tipPos.y + last.dIn.x * 5);
  ctx.lineTo(tipPos.x + last.dIn.y * 5, tipPos.y - last.dIn.x * 5);
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (line.complete) drawTrains(line, capFade);
  if (line.complete) {
    drawLineCap(line);
    ctx.globalAlpha = capFade;
    for (const stn of line.stations) {
      if (stn.isInter) drawTick(stn);
      else drawTick(stn);
    }
    ctx.globalAlpha = 1;
  }
}

function drawTick(stn) {
  ctx.save();
  ctx.translate(stn.x, stn.y);
  ctx.rotate(Math.atan2(stn.line.segs[0].dIn.y, stn.line.segs[0].dIn.x));
  ctx.fillStyle = stn.line.color;
  ctx.beginPath();
  ctx.moveTo(-DOT2, -6);
  ctx.lineTo(DOT2, -6);
  ctx.lineTo(DOT2, 0);
  ctx.lineTo(-DOT2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTrains(line, fade) {
  for (const tr of line.trains) {
    const pos = tr.pos;
    let s = null;
    let sLen = 0;
    let rem = pos;
    for (const sg of line.segs) {
      if (rem < sg.len || Math.abs(rem - sg.len) < 1e-6) {
        s = sg;
        sLen = sg.len;
        break;
      }
      rem -= sg.len;
    }
    if (!s) continue;
    const t = clamp(rem / s.len, 0, 1);
    let px, py;
    if (s.isStraight && s.corner) {
      const corner = s.corner;
      const dx = s.s.x + s.dIn.x * s.len;
      const dy = s.s.y + s.dIn.y * s.len;
      px = (corner.x === s.s.x && corner.y === s.s.y) ? corner.x : ((corner.x === dx || corner.y === dy) ? corner.x : corner.x);
      py = (corner.x === s.s.x && corner.y === s.s.y) ? corner.y : ((corner.x === dx || corner.y === dy) ? corner.y : corner.y);
      // Fallback if logic above is wrong: just use corner
      px = corner.x;
      py = corner.y;
    } else if (s.isStraight) {
      px = s.s.x + s.dIn.x * s.len * t;
      py = s.s.y + s.dIn.y * s.len * t;
    } else {
      const a0 = s.aIn;
      const a1 = s.aOut;
      const r = s.arcR;
      const turn = (a1.x*a0.y - a1.y*a0.x) > 0 ? -1 : 1;
      const center = new Vec(s.s.x - turn * r * a0.y, s.s.y + turn * r * a0.x);
      const ang = s.arcStart + turn * s.arcDir * t;
      const rr = s.arcR;
      px = center.x + rr * Math.cos(ang);
      py = center.y + rr * Math.sin(ang);
    }

    ctx.globalAlpha = fade;
    ctx.fillStyle = tr.dir > 0 ? '#fff' : line.color;
    ctx.beginPath();
    ctx.ellipse(px, py, 3.7, 2.5, 0, 0, Math.PI*2);
    ctx.fill();

    // Headlights
    ctx.fillStyle = line.color;
    ctx.globalAlpha = fade * 0.8;
    ctx.beginPath();
    ctx.ellipse(px + tr.dir * 2.2, py, 0.7, 0.5, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.globalAlpha = fade * 0.4;
    ctx.strokeStyle = line.color;
    ctx.lineWidth = 0.3;
    ctx.beginPath();
    ctx.moveTo(px + tr.dir * 2.2, py);
    ctx.lineTo(px + tr.dir * 3.6, py);
    ctx.stroke();

    ctx.globalAlpha = 1;
  }
}

function drawInter(stns, fade) {
  for (const stn of stns) {
    const r = 5;
    ctx.globalAlpha = fade;
    ctx.fillStyle = '#16171a';
    ctx.beginPath();
    ctx.arc(stn.x, stn.y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(stn.x, stn.y, r, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// === City ===
function generateCity() {
  const margin = Math.max(40, W * 0.05);
  const usable = Math.min(W, H) - margin * 2;
  const dot = Math.max(6, Math.min(20, Math.floor(usable * 0.01)));
  const dot2 = dot / 2;
  const dotD = Math.max(8, dot);
  const dotDiag = dot / 2;
  const diagLen = dot * Math.sqrt(2);
  const diagHalfLen = diagLen / 2;

  const dirs = [];
  for (const a of [0, Math.PI/2, -Math.PI/2, Math.PI/4, -Math.PI/4, 3*Math.PI/4, -3*Math.PI/4]) {
    dirs.push(new Vec(Math.cos(a), Math.sin(a)));
  }

  // Place origin station
  const oX = Math.round((W/2 - margin/2) / dot) * dot;
  const oY = Math.round((H/2 - margin/2) / dot) * dot;
  const origin = new Vec(oX, oY);

  const city = { lines: [], inter: [], stations: [], origin: origin };

  const numLines = 8 + Math.floor(Math.random() * 3); // 8-10
  const palette = PALETTE.slice();
  for (let i = palette.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = palette[i];
    palette[i] = palette[j];
    palette[j] = t;
  }

  const names = ['North', 'Cross', 'West', 'Loop', 'Rivers', 'Trunk', 'Sonic', 'Express', 'Cargo', 'Pavilion'];
  for (let i = names.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = names[i];
    names[i] = names[j];
    names[j] = t;
  }

  const bounds = new Bounds();
  bounds.add(origin);
  bounds.min = new Vec(margin, margin);
  bounds.max = new Vec(W - margin, H - margin);
  const marginInner = margin + dot * 2;

  const attempts = numLines * 3;
  for (let a = 0; a < attempts; a++) {
    if (city.lines.length >= numLines) break;
    const color = palette[city.lines.length % palette.length];
    const lineName = names[city.lines.length];
    const line = new Line(lineName, color, city.lines.length);

    // Direction
    const dirIdx = Math.floor(Math.random() * dirs.length);
    const lineDir = dirs[dirIdx].scale(1);
    const startStn = origin.add(lineDir.scale(dot));

    const firstStn = new Station(startStn, line, 0);
    line.stations.push(firstStn);
    line.b.add(firstStn);
    city.stations.push(firstStn);

    let pos = startStn;
    let last = pos;
    let cur = lineDir;
    let n = 1;
    const maxStations = 3 + Math.floor(Math.random() * 9);

    // Add stations
    let safety = 100;
    while (n < maxStations && safety > 0) {
      safety--;
      const candidates = [];
      for (const d of dirs) {
        const dot = d.dot(cur);
        const cross = d.x*cur.y - d.y*cur.x;
        if (dot > 1 - 1e-3) candidates.push(d);
        else if (Math.abs(ccross) > 0.5) candidates.push(d);
      }

      if (candidates.length === 0) break;
      const next = candidates[Math.floor(Math.random() * candidates.length)];

      const dx = next.x * dot;
      const dy = next.y * dot;
      const diag = Math.abs(next.x + next.y) > 1e-3 ? dot * Math.abs(next.x + next.y) : dot;

      const candidate = new Vec(pos.x + dx, pos.y + dy);

      let ok = true;
      const marginInner2 = marginInner;
      if (candidate.x < bounds.min.x + 4 || candidate.x > bounds.max.x - 4 || candidate.y < bounds.min.y + 4 || candidate.y > bounds.max.y - 4) ok = false;

      if (!ok) break;

      const newStation = new Station(candidate, line, n);
      const added = line.add(newStation);
      if (!added) break;

      // Intercheck
      const all = new Array();
      for (const l of city.lines) for (const s of l.stations) all.push(s);
      for (const s of city.stations) all.push(s);

      const inter = new Array();
      for (const s of all) {
        if (s.line === line) continue;
        const dd = Math.hypot(s.x - candidate.x, s.y - candidate.y);
        if (Math.abs(dd - dot) < 1.5 || Math.abs(dd - dot * Math.sqrt(2)) < 1.5) inter.push(s);
      }

      if (inter.length > 0) {
        const ix = Math.floor(Math.random() * inter.length);
        const other = inter[ix];
        newStation.isInter = true;
        other.isInter = true;
      }

      city.stations.push(newStation);

      n++;
      pos = candidate;
      last = candidate;
      cur = next;
    }

    if (line.stations.length >= 2) {
      city.lines.push(line);
      line.finalize();
    }
  }

  return city;
}

function generateCity() {
  const margin = Math.max(40, Math.min(W, H) * 0.05);
  const dot = Math.max(6, Math.min(20, Math.floor((Math.min(W, H) - margin * 2) / 50)));
  const dot2 = dot / 2;
  const dotD = Math.max(8, dot);
  const diagLen = dot * Math.sqrt(2);
  const diagHalfLen = diagLen / 2;

  const dirs = [];
  for (const a of [0, Math.PI/2, -Math.PI/2, Math.PI/4, -Math.PI/4, 3*Math.PI/4, -3*Math.PI/4]) {
    dirs.push(new Vec(Math.cos(a), Math.sin(a)));
  }

  const oX = Math.round((W/2 - margin/2) / dot) * dot;
  const oY = Math.round((H/2 - margin/2) / dot) * dot;
  const origin = new Vec(oX, oY);

  const city = { lines: [], inter: [], stations: [], origin: origin };
  const bounds = { min: new Vec(margin, margin), max: new Vec(W - margin, H - margin) };
  bounds.min.x = margin;
  bounds.min.y = margin;
  bounds.max.x = W - margin;
  bounds.max.y = H - margin;

  const numLines = 8 + Math.floor(Math.random() * 3);
  const palette = PALETTE.slice();
  for (let i = palette.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = palette[i];
    palette[i] = palette[j];
    palette[j] = t;
  }

  const names = ['North', 'Cross', 'West', 'Loop', 'Rivers', 'Trunk', 'Sonic', 'Express', 'Cargo', 'Pavilion'];
  for (let i = names.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = names[i];
    names[i] = names[j];
    names[j] = t;
  }

  const marginInner = margin + dot * 2;
  const attempts = numLines * 3;
  for (let a = 0; a < attempts; a++) {
    if (city.lines.length >= numLines) break;
    const color = palette[city.lines.length % palette.length];
    const lineName = names[city.lines.length];
    const line = new Line(lineName, color, city.lines.length);

    const dirIdx = Math.floor(Math.random() * dirs.length);
    const lineDir = dirs[dirIdx].scale(1);
    const startStn = origin.add(lineDir.scale(dot));

    const firstStn = new Station(startStn, line, 0);
    line.stations.push(firstStn);
    city.stations.push(firstStn);

    let pos = startStn;
    let cur = lineDir;
    let n = 1;
    const maxStations = 3 + Math.floor(Math.random() * 9);
    let safety = 50;
    while (n < maxStations && safety > 0) {
      safety--;
      const candidates = [];
      for (const d of dirs) {
        const dot = d.dot(cur);
        const cross = d.x*cur.y - d.y*cur.x;
        if (dot > 1 - 1e-3) candidates.push(d);
        else if (Math.abs(ccross) > 0.5) candidates.push(d);
      }
      if (candidates.length === 0) break;
      const next = candidates[Math.floor(Math.random() * candidates.length)];

      const dx = next.x * dot;
      const dy = next.y * dot;
      const candidate = new Vec(pos.x + dx, pos.y + dy);

      if (candidate.x < bounds.min.x + 4 || candidate.x > bounds.max.x - 4 || candidate.y < bounds.min.y + 4 || candidate.y > bounds.max.y - 4) break;

      const newStation = new Station(candidate, line, n);
      const added = line.add(newStation);
      if (!added) break;

      const all = [];
      for (const l of city.lines) for (const s of l.stations) all.push(s);
      for (const s of city.stations) all.push(s);

      const inter = [];
      for (const s of all) {
        if (s.line === line) continue;
        const dd = Math.hypot(s.x - candidate.x, s.y - candidate.y);
        if (Math.abs(dd - dot) < 1.5 || Math.abs(dd - dot * Math.sqrt(2)) < 1.5) inter.push(s);
      }
      if (inter.length > 0) {
        const ix = Math.floor(Math.random() * inter.length);
        const other = inter[ix];
        newStation.isInter = true;
        other.isInter = true;
      }
      city.stations.push(newStation);
      n++;
      pos = candidate;
      cur = next;
    }

    if (line.stations.length >= 2) {
      city.lines.push(line);
      line.finalize();
    }
  }
  return city;
}

// === Animation ===
let cities = [];
let activeCity = null;
let phase = 'start';
let phaseTime = 0;

function init() {
  cities = [];
  activeCity = null;
  phase = 'start';
  phaseTime = 0;
  generateAndStart();
}

function generateAndStart() {
  const c = generateCity();
  c.phase = 'intro';
  c.phaseTime = 0;
  for (const line of c.lines) {
    line.progress = 0;
  for (const tr of line.trains) {
      tr.pos = 0;
      tr.t = 0;
      tr.dir = 1;
    }
    if (line.trains.length > 0) line.trains[1].pos = line.totalLength();
  }
  cities.push(c);
}

function updateCity(c, dt) {
  c.phaseTime += dt;
  if (c.phase === 'intro') {
    if (c.phaseTime < 2) return;
    const l = c.lines[Math.min(c.lines.length - 1, Math.floor((c.phaseTime - 2) / 0.6))];
    if (l.progress < 1) l.progress = Math.min(1, l.progress + dt * 1.8);
    if (c.phaseTime > 2 + 0.6 * c.lines.length + 2) c.phase = 'active';
  }
  if (c.phase === 'active') {
    for (const l of c.lines) {
      for (const tr of l.trains) {
        const tt = l.totalLength();
        tr.pos += tr.dir * dt * (40 + (tr.dir > 0 ? 10 : 5));
        if (tr.dir > 0 && tr.pos > tt) { tr.pos = tt; tr.dir = -1; }
        if (tr.dir < 0 && tr.pos < 0) { tr.pos = 0; tr.dir = 1; }
      }
    }
  }
}

function drawCity(c) {
  for (const line of c.lines) drawLine(line);
  drawInter(c.stations, 1);
}

function loop(now) {
  const dt = 0.016;
  if (phase === 'start') {
    phase = 'intro';
    phaseTime = 0;
    if (!activeCity) generateAndStart();
  }
  phaseTime += dt;
  if (phase === 'intro') {
    if (!activeCity) {
      const c = cities[0];
      if (c.phase === 'intro' && c.phaseTime > 2) {
        const l = c.lines[Math.min(c.lines.length - 1, Math.floor((c.phaseTime - 2) / 0.6))];
        if (l.progress < 1) l.progress = Math.min(1, l.progress + 0.03);
      }
      if (c.phaseTime > 2 + 0.6 * c.lines.length + 1) {
        c.phase = 'active';
        phase = 'active';
        phaseTime = 0;
      }
    }
  } else if (phase === 'active') {
    if (activeCity) {
      for (const l of activeCity.lines) {
        for (const tr of l.trains) {
          const tt = l.totalLength();
          tr.pos += tr.dir * 0.7;
          if (tr.dir > 0 && tr.pos > tt) { tr.pos = tt; tr.dir = -1; }
          if (tr.dir < 0 && tr.pos < 0) { tr.pos = 0; tr.dir = 1; }
        }
      }
    }
  }

  // Fade
  ctx.fillStyle = 'rgba(16,17,26,0.6)';
  ctx.fillRect(0, 0, W, H);

  // Draw
  if (activeCity) {
    for (const line of activeCity.lines) drawLine(line);
    drawInter(activeCity.stations, 1);
  }

  // HUD
  const hudLine = document.getElementById('hudLine');
  if (hudLine && activeCity && activeCity.lines.length > 0) {
    const idx = Math.floor(phaseTime * 0.5) % activeCity.lines.length;
    hudLine.textContent = activeCity.lines[idx].name.toUpperCase();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
