<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Onboarding Wizard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .wizard-container {
      width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 32px;
      position: relative;
    }

    .progress-bar::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      height: 4px;
      background: #e0e0e0;
      z-index: 1;
    }

    .progress-fill {
      position: absolute;
      top: 10px;
      left: 0;
      height: 4px;
      background: #4a90e2;
      z-index: 2;
      width: 0%;
      transition: width 0.5s ease-in-out;
    }

    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #4a90e2;
      transform: scale(1.2);
    }

    .dot::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      display: none;
    }

    .dot.active::after {
      display: block;
    }

    .step {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateX(0);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .step.active {
      display: flex;
    }

    .step.animated-in {
      opacity: 1;
    }

    .illustration {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      position: relative;
    }

    /* Step 1 - Welcome */
    .illustration.step1::before,
    .illustration.step1::after {
      content: '';
      position: absolute;
      background: #4a90e2;
    }

    .illustration.step1::before {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      top: 30px;
      left: 30px;
    }

    .illustration.step1::after {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      top: 60px;
      left: 60px;
      background: white;
    }

    /* Step 2 - Profile */
    .illustration.step2::before,
    .illustration.step2::after {
      content: '';
      position: absolute;
      background: #4a90e2;
    }

    .illustration.step2::before {
      width: 70px;
      height: 80px;
      border: 6px solid #4a90e2;
      border-bottom: none;
      border-radius: 50% 50% 0 0;
      top: 20px;
      left: 25px;
    }

    .illustration.step2::after {
      width: 40px;
      height: 20px;
      background: #4a90e2;
      top: 60px;
      left: 40px;
      transform: rotate(-20deg);
    }

    /* Step 3 - Preferences */
    .illustration.step3 {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #4a90e2;
    }

    .square {
      width: 30px;
      height: 30px;
      background: #4a90e2;
      transform: rotate(45deg);
    }

    /* Step 4 - Success */
    .checkmark-container {
      width: 100px;
      height: 80px;
      position: relative;
    }

    .checkmark {
      position: absolute;
      left: 0;
      top: 0;
      width: 100px;
      height: 80px;
    }

    .checkmark-path {
      fill: none;
      stroke: #4a90e2;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 1s ease-in-out forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }

    .form-group {
      width: 100%;
      margin-bottom: 20px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #4a90e2;
    }

    .options {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }

    .option {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .option:hover {
      border-color: #4a90e2;
      background: #f5fbff;
    }

    .option.selected {
      border-color: #4a90e2;
      background: #e6f0ff;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    button.back {
      background: #f0f0f0;
      color: #555;
    }

    button.back:hover {
      background: #e0e0e0;
    }

    button.next {
      background: #4a90e2;
      color: white;
    }

    button.next:hover {
      background: #357abd;
    }

    button.finish {
      background: #28a745;
      color: white;
    }

    button.finish:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="wizard-container">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
      <div class="dot" id="dot4"></div>
    </div>

    <!-- Step 1 -->
    <div class="step active" id="step1">
      <div class="illustration step1"></div>
      <h2>Welcome Aboard!</h2>
      <p>We're excited to have you get started with our platform.</p>
      <div class="navigation">
        <div></div>
        <button class="next" onclick="nextStep(1)">Next</button>
      </div>
    </div>

    <!-- Step 2 -->
    <div class="step" id="step2">
      <div class="illustration step2"></div>
      <h2>Create Your Profile</h2>
      <p>Tell us about yourself so we can personalize your experience.</p>
      <div class="form-group">
        <input type="text" placeholder="Full Name"/>
      </div>
      <div class="form-group">
        <input type="email" placeholder="Email Address"/>
      </div>
      <div class="navigation">
        <button class="back" onclick="prevStep(2)">Back</button>
        <button class="next" onclick="nextStep(2)">Next</button>
      </div>
    </div>

    <!-- Step 3 -->
    <div class="step" id="step3">
      <div class="illustration step3">
        <div class="circle"></div>
        <div class="square"></div>
        <div class="circle"></div>
      </div>
      <h2>Choose Preferences</h2>
      <p>Select your preferred layout style.</p>
      <div class="options">
        <div class="option" onclick="selectOption(this)">Layout A</div>
        <div class="option" onclick="selectOption(this)">Layout B</div>
      </div>
      <div class="navigation">
        <button class="back" onclick="prevStep(3)">Back</button>
        <button class="next" onclick="nextStep(3)">Next</button>
      </div>
    </div>

    <!-- Step 4 -->
    <div class="step" id="step4">
      <div class="checkmark-container">
        <svg class="checkmark" viewBox="0 0 100 80">
          <path class="checkmark-path" d="M10 40 L35 65 L90 15"/>
        </svg>
      </div>
      <h2>All Set!</h2>
      <p>Your account is ready. Enjoy the experience!</p>
      <div class="navigation">
        <button class="back" onclick="prevStep(4)">Back</button>
        <button class="finish" onclick="finish()">Finish</button>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;

    function updateProgress(step) {
      const fill = document.getElementById('progressFill');
      const percent = ((step - 1) / 3) * 100;
      fill.style.width = percent + '%';

      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById('dot' + i);
        dot.classList.toggle('active', i <= step);
      }
    }

    function nextStep(step) {
      const current = document.getElementById('step' + step);
      current.style.display = 'none';
      current.classList.remove('animated-in');

      currentStep = step + 1;
      const next = document.getElementById('step' + currentStep);
      next.style.display = 'flex';

      setTimeout(() => {
        next.classList.add('animated-in');
      }, 50);

      updateProgress(currentStep);
    }

    function prevStep(step) {
      const current = document.getElementById('step' + step);
      current.style.display = 'none';
      current.classList.remove('animated-in');

      currentStep = step - 1;
      const prev = document.getElementById('step' + currentStep);
      prev.style.display = 'flex';

      setTimeout(() => {
        prev.classList.add('animated-in');
      }, 50);

      updateProgress(currentStep);
    }

    function selectOption(el) {
      const parent = el.parentNode;
      parent.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }

    function finish() {
      alert("Onboarding complete!");
    }

    // Initialize
    updateProgress(1);
  </script>
</body>
</html>
