        canvas {
            display: block;
        }
        /* Add a subtle vignette via CSS to enhance the feeling of depth */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

         * 
         * This creates a highly performant, demoscene-style effect.
