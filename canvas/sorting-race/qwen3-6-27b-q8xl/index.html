<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);
resize();

let panels=[];
let raceActive=false;
let standingsDone=false;
let standingsTimer=0;
let roundNum=0;
let globalTime=0;
const TITLE_H=36;
const COUNTER_H=28;
const LABEL_H=24;
const MARGIN=8;
const ALGO_NAMES=['Bubble Sort','Insertion Sort','Merge Sort','Quicksort'];

function hsl(h,s,l){return`hsl(${h},${s}%,${l}%)`}

function generatePalette(){
  const h1=Math.random()*360;
  const h2=(h1+150+Math.random()*60)%360;
  return{
    bg:hsl(h1,12,7),
    panelBg:hsl(h1,10,10),
    bar:hsl(h1,55,50),
    barLight:hsl(h1,50,65),
    compare:hsl(h2,85,65),
    swap:hsl(h2,100,78),
    sorted:hsl(h1,65,68),
    cursor:hsl(h2,100,88),
    text:hsl(h1,25,88),
    title:hsl(h1,45,78),
    accent:hsl(h2,70,55),
    doneBg:hsl(h1,20,15),
    barDim:hsl(h1,30,25)
  };
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function cloneArray(arr){return arr.slice()}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function getBarWidth(panelWidth,arrLen){
  const maxBarW=Math.floor(panelWidth/(arrLen+1));
  return Math.max(1,maxBarW);
}

function drawPanel(p,idx){
  const pw=W/4;
  const px=idx*pw;
  const py=TITLE_H+LABEL_H;
  const ph=H-py-COUNTER_H;
  const pal=p.palette;
  const arr=p.arr;
  const n=arr.length;

  // Panel background
  ctx.fillStyle=pal.panelBg;
  ctx.fillRect(px+1,py,pw-2,ph);

  // Title
  ctx.fillStyle=pal.title;
  ctx.font=`bold 14px monospace`;
  ctx.textAlign='center';
  ctx.fillText(ALGO_NAMES[idx],px+pw/2,py-6);

  // Counter
  ctx.fillStyle=pal.text;
  ctx.font='11px monospace';
  ctx.fillText(`ops: ${p.ops}`,px+pw/2,H-COUNTER_H+16);

  // Bars
  const barW=getBarWidth(pw,n);
  const gap=Math.max(1,Math.floor((pw-n*(barW+1))/(n-1)));
  const totalW=n*barW+(n-1)*gap;
  const startX=px+(pw-totalW)/2;

  for(let i=0;i<n;i++){
    const x=startX+i*(barW+gap);
    const barH=(arr[i]/255)*ph;
    const y=py+ph-barH;

    let color=pal.bar;
    if(p.sorted && p.allSorted){
      color=pal.sorted;
    } else if(p.sorted && i<=p.sortedUpTo){
      color=pal.sorted;
    }

    if(p.comparing){
      if(p.comparing[0]===i||p.comparing[1]===i){
        color=pal.compare;
      }
    }
    if(p.swapping){
      if(p.swapping[0]===i||p.swapping[1]===i){
        color=pal.swap;
      }
    }
    if(p.merging){
      if(p.merging.includes(i)){
        color=pal.compare;
      }
    }
    if(p.pivot!==undefined&&p.pivot===i){
      color=pal.swap;
    }

    ctx.fillStyle=color;
    ctx.fillRect(x,y,barW,barH);
  }

  // Scan cursor
  if(p.cursor!==undefined){
    const cx=startX+p.cursor*(barW+gap);
    ctx.fillStyle=pal.cursor;
    ctx.fillRect(cx-1,py,barW+2,ph);
    ctx.globalAlpha=0.3;
    ctx.fillRect(cx-1,py,barW+2,ph);
    ctx.globalAlpha=1;
  }

  // Done overlay
  if(p.done){
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(px+1,py,pw-2,ph);
    ctx.fillStyle=pal.accent;
    ctx.font='bold 22px monospace';
    ctx.textAlign='center';
    ctx.fillText('DONE',px+pw/2,py+ph/2-10);
    ctx.font='13px monospace';
    ctx.fillStyle=pal.text;
    ctx.fillText(`${p.ops} ops`,px+pw/2,py+ph/2+16);
    ctx.fillText(`${p.time.toFixed(0)}ms`,px+pw/2,py+ph/2+34);
  }

  // Border
  ctx.strokeStyle=pal.accent;
  ctx.lineWidth=1;
  ctx.strokeRect(px+1,py,pw-2,ph);
}

function render(){
  ctx.fillStyle=panels[0]?panels[0].palette.bg:'#000';
  ctx.fillRect(0,0,W,H);

  // Top label
  ctx.fillStyle=panels[0]?panels[0].palette.accent:'#888';
  ctx.font='bold 12px monospace';
  ctx.textAlign='left';
  ctx.fillText(`ROUND ${roundNum}`,10,16);

  if(standingsDone){
    ctx.fillStyle='rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle=panels[0].palette.accent;
    ctx.font='bold 28px monospace';
    ctx.textAlign='center';
    ctx.fillText('STANDINGS',W/2,H/2-80);

    const sorted=[...panels].map((p,i)=>({...p,idx:i})).sort((a,b)=>a.time-b.time);
    const medals=['🥇','🥈','🥉','4th'];

    sorted.forEach((p,i)=>{
      const y=H/2-30+i*44;
      ctx.fillStyle=i===0?p.palette.swap:p.palette.text;
      ctx.font=i===0?'bold 20px monospace':'18px monospace';
      ctx.textAlign='left';
      ctx.fillText(`${medals[i]} ${ALGO_NAMES[p.idx]}`,W/2-120,y);
      ctx.textAlign='right';
      ctx.font='14px monospace';
      ctx.fillText(`${p.ops} ops  ${p.time.toFixed(0)}ms`,W/2+120,y);
    });

    ctx.fillStyle=panels[0].palette.text;
    ctx.font='13px monospace';
    ctx.textAlign='center';
    ctx.fillText('Next race starting...',W/2,H/2+140);
  } else {
    panels.forEach((p,i)=>drawPanel(p,i));
  }
}

async function bubbleSort(arr,panelIdx){
  const p=panels[panelIdx];
  const n=arr.length;
  for(let i=0;i<n-1;i++){
    for(let j=0;j<n-i-1;j++){
      p.comparing=[j,j+1];
      p.cursor=j;
      p.ops++;
      render();
      await sleep(p.speed);
      if(arr[j]>arr[j+1]){
        [arr[j],arr[j+1]]=[arr[j+1],arr[j]];
        p.swapping=[j,j+1];
        p.ops++;
        render();
        await sleep(p.speed);
      }
    }
    p.sortedUpTo=n-i-1;
  }
  p.sortedUpTo=n-1;
}

async function insertionSort(arr,panelIdx){
  const p=panels[panelIdx];
  const n=arr.length;
  for(let i=1;i<n;i++){
    const key=arr[i];
    let j=i-1;
    p.cursor=i;
    p.comparing=[i,j];
    p.ops++;
    render();
    await sleep(p.speed);
    while(j>=0&&arr[j]>key){
      arr[j+1]=arr[j];
      p.swapping=[j,j+1];
      p.cursor=j;
      p.ops++;
      render();
      await sleep(p.speed);
      j--;
    }
    arr[j+1]=key;
    p.comparing=null;
    p.swapping=null;
    p.sortedUpTo=i;
  }
  p.sortedUpTo=n-1;
}

async function mergeSort(arr,panelIdx){
  const p=panels[panelIdx];
  async function merge(l,m,r){
    const n1=m-l+1;
    const n2=r-m;
    const L=arr.slice(l,m+1);
    const R=arr.slice(m+1,r+1);
    let i=0,j=0,k=l;
    while(i<n1&&j<n2){
      p.comparing=[l+i,m+1+j];
      p.cursor=l+i;
      p.merging=[l+i,m+1+j];
      p.ops++;
      render();
      await sleep(p.speed);
      if(L[i]<=R[j]){
        arr[k]=L[i];
        i++;
      } else {
        arr[k]=R[j];
        p.swapping=[k,m+1+j];
        j++;
        p.ops++;
        render();
        await sleep(p.speed);
      }
      k++;
    }
    while(i<n1){
      arr[k]=L[i];
      p.merging=[k,l+i];
      p.ops++;
      render();
      await sleep(p.speed);
      i++;k++;
    }
    while(j<n2){
      arr[k]=R[j];
      p.merging=[k,m+1+j];
      p.ops++;
      render();
      await sleep(p.speed);
      j++;k++;
    }
    p.merging=null;
  }
  async function sort(l,r){
    if(l>=r)return;
    const m=Math.floor((l+r)/2);
    await sort(l,m);
    await sort(m+1,r);
    await merge(l,m,r);
  }
  await sort(0,arr.length-1);
  p.sortedUpTo=arr.length-1;
}

async function quickSort(arr,panelIdx){
  const p=panels[panelIdx];
  async function partition(low,high){
    const pivot=arr[high];
    p.pivot=high;
    let i=low-1;
    for(let j=low;j<high;j++){
      p.comparing=[j,high];
      p.cursor=j;
      p.ops++;
      render();
      await sleep(p.speed);
      if(arr[j]<pivot){
        i++;
        [arr[i],arr[j]]=[arr[j],arr[i]];
        p.swapping=[i,j];
        p.ops++;
        render();
        await sleep(p.speed);
      }
    }
    [arr[i+1],arr[high]]=[arr[high],arr[i+1]];
    p.swapping=[i+1,high];
    p.ops++;
    render();
    await sleep(p.speed);
    p.pivot=undefined;
    return i+1;
  }
  async function sort(low,high){
    if(low<high){
      const pi=await partition(low,high);
      await sort(low,pi-1);
      await sort(pi+1,high);
    }
  }
  await sort(0,arr.length-1);
  p.sortedUpTo=arr.length-1;
}

const sortFns=[bubbleSort,insertionSort,mergeSort,quickSort];

async function startRace(){
  roundNum++;
  standingsDone=false;
  standingsTimer=0;
  const palette=generatePalette();
  const arrSize=40+Math.floor(Math.random()*40);
  const baseArr=shuffle(Array.from({length:arrSize},()=>Math.floor(Math.random()*255)+1));
  const speed=Math.max(2,Math.min(25,35-arrSize/5));

  panels=[];
  for(let i=0;i<4;i++){
    panels.push({
      arr:cloneArray(baseArr),
      palette,
      speed,
      ops:0,
      done:false,
      sorted:false,
      sortedUpTo:-1,
      comparing:null,
      swapping:null,
      merging:null,
      cursor:undefined,
      pivot:undefined,
      time:0,
      startTime:performance.now()
    });
  }

  raceActive=true;
  render();

  const promises=panels.map((p,i)=>{
    return sortFns[i](p.arr,i).then(()=>{
      p.done=true;
      p.sorted=true;
      p.time=performance.now()-p.startTime;
      p.comparing=null;
      p.swapping=null;
      p.merging=null;
      p.cursor=undefined;
      p.pivot=undefined;
      render();
    });
  });

  await Promise.all(promises);
  raceActive=false;

  // Check if all done
  if(panels.every(p=>p.done)){
    await sleep(800);
    standingsDone=true;
    render();
    await sleep(3000);
    startRace();
  }
}

// Animation loop for smooth rendering during races
function loop(){
  requestAnimationFrame(loop);
  if(!raceActive&&!standingsDone){
    // idle
  }
}

requestAnimationFrame(loop);
startRace();
</script>
</body>
</html>
