<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Ink Entity</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff; /* Pure White */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        /* 
           ORGANIC INK ENTITY
           A procedural, 3D simulation of a bio-genetic ink mass.
           Uses Perlin-like noise for organic movement and multiple vanishing points 
           to create a deep, swirling tentacle effect.
        */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        let width, height;
        const NUM_TENTACLES = 12;
        const SEGMENTS_PER_TENTACLE = 50;
        const SEGMENT_LENGTH = 6; // Distance between points
        const FOV = 600;
        const ROTATION_SPEED_MULTIPLIER = 0.0003;
        
        // Global State
        let time = 0;
        let angleX = 0;
        let angleY = 0;
        let angleZ = 0;

        // Simple pseudo-random generator for noise consistency
        function noise(x, y, z) {
            return Math.sin(x) * Math.cos(y) * Math.sin(z);
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 3D Point Class
        class Point3D {
            constructor(x, y, z) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.ox = x; // Original X for rotation
                this.oy = y;
                this.oz = z;
                this.cx = 0; // Camera offset
                this.cy = 0;
                this.cz = 0;
                this.screenX = 0;
                this.screenY = 0;
                this.scale = 0;
            }

            rotate() {
                // Rotate X
                let cos = Math.cos(angleX);
                let sin = Math.sin(angleX);
                let y1 = this.oy * cos - this.oz * sin;
                let z1 = this.oz * cos + this.oy * sin;
                this.oy = y1;
                this.oz = z1;

                // Rotate Y
                cos = Math.cos(angleY);
                sin = Math.sin(angleY);
                let x1 = this.ox * cos - this.oz * sin;
                z1 = this.oz * cos + this.ox * sin;
                this.ox = x1;
                this.oz = z1;
                
                // Rotate Z (subtle roll)
                cos = Math.cos(angleZ);
                sin = Math.sin(angleZ);
                x1 = this.ox * cos - this.oy * sin;
                y1 = this.oy * cos + this.ox * sin;
                this.ox = x1;
                this.oy = y1;

                // Project
                this.scale = FOV / (FOV + this.oz + this.cz);
                this.screenX = width / 2 + (this.ox + this.cx) * this.scale;
                this.screenY = height / 2 + (this.oy + this.cy) * this.scale;
                
                return this.scale;
            }
        }

        // Tentacle Class
        class Tentacle {
            constructor(index) {
                this.points = [];
                this.initPoints(index);
            }

            initPoints(index) {
                // Base rotation offset for each tentacle to space them out
                const baseAngle = (index / NUM_TENTACLES) * Math.PI * 2;
                
                for (let i = 0; i < SEGMENTS_PER_TENTACLE; i++) {
                    // Initial positions form a cone shape pointing outwards
                    const radius = i * 2; 
                    const offsetAngle = baseAngle + (Math.random() * 0.5); 
                    
                    const x = Math.cos(offsetAngle) * radius;
                    const y = Math.sin(offsetAngle) * radius;
                    const z = i * SEGMENT_LENGTH; // Lengthwise depth

                    this.points.push(new Point3D(x, y, z));
                }
            }

            update() {
                // Move the "head" (first point) organically
                // We use sine waves based on time to create a pulsing/reaching motion
                const moveSpeed = 0.02;
                const head = this.points[0];
                
                // Head moves in a figure-8 pattern with depth
                const pulse = Math.sin(time * 0.05) * 50;
                const wave = Math.cos(time * 0.03) * 30;
                
                head.ox = Math.sin(time * 0.02 + this.points[0].oz) * 100 + pulse;
                head.oy = Math.cos(time * 0.02 + this.points[0].oz) * 100 + wave;
                head.oz = Math.sin(time * 0.03) * 50; // Breathing depth

                // Inverse Kinematics (Approximated for visual effect)
                // Each segment tries to stay at SEGMENT_LENGTH distance from the previous one
                for (let i = 1; i < this.points.length; i++) {
                    const prev = this.points[i - 1];
                    const curr = this.points[i];

                    // Calculate current distance
                    let dx = curr.ox - prev.ox;
                    let dy = curr.oy - prev.oy;
                    let dz = curr.oz - prev.oz;
                    
                    let dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                    // If too far or too close, adjust
                    // We add a "Noise" factor to make it look like it's exploring
                    const noiseX = Math.sin(time * 0.1 + i * 0.5) * 2;
                    const noiseY = Math.cos(time * 0.1 + i * 0.5) * 2;
                    const noiseZ = Math.sin(time * 0.05 + i * 0.5) * 1;

                    // Lerp position back to segment length
                    // 0.1 is the "stiffness" of the tentacle
                    curr.ox += (dx / dist) * (SEGMENT_LENGTH - dist) * 0.1 + noiseX;
                    curr.oy += (dy / dist) * (SEGMENT_LENGTH - dist) * 0.1 + noiseY;
                    curr.oz += (dz / dist) * (SEGMENT_LENGTH - dist) * 0.1 + noiseZ;
                }

                // Rotate all points for the 3D view
                for (let i = 0; i < this.points.length; i++) {
                    this.points[i].rotate();
                }
            }

            render() {
                if (this.points.length < 2) return;

                ctx.beginPath();
                ctx.moveTo(this.points[0].screenX, this.points[0].screenY);

                for (let i = 1; i < this.points.length - 1; i++) {
                    const p0 = this.points[i - 1];
                    const p1 = this.points[i];
                    const p2 = this.points[i + 1];
                    
                    // Quadratic Bezier for smoothness
                    const midPointX = (p1.screenX + p2.screenX) / 2;
                    const midPointY = (p1.screenY + p2.screenY) / 2;
                    
                    ctx.quadraticCurveTo(p1.screenX, p1.screenY, midPointX, midPointY);
                }
                
                // Draw the last segment straight
                const last = this.points[this.points.length - 1];
                ctx.lineTo(last.screenX, last.screenY);

                // Dynamic Styling based on depth (Z)
                // Near = Thick/Opaque, Far = Thin/Transparent
                const headDepth = this.points[0].oz;
                
                // Calculate a normalized depth factor (0 to 1)
                // We assume a Z range of roughly -200 to 800 for visual clarity
                let depthFactor = (headDepth + 200) / 1000;
                if (depthFactor < 0) depthFactor = 0;
                if (depthFactor > 1) depthFactor = 1;

                // Ink properties
                // Thicker lines for depth, pure black
                ctx.lineWidth = 12 * depthFactor;
                ctx.strokeStyle = `rgba(0, 0, 0, ${0.8 + (depthFactor * 0.2)})`;
                
                // Optional: Add a slight blur to the "ink" edges
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.stroke();
            }
        }

        // Initialize Entities
        const tentacles = [];
        for (let i = 0; i < NUM_TENTACLES; i++) {
            tentacles.push(new Tentacle(i));
        }

        // Animation Loop
        function animate() {
            // Clear with white background (creates the trail effect if opacity < 1)
            ctx.fillStyle = 'rgba(255, 255, 255, 1)'; 
            ctx.fillRect(0, 0, width, height);

            // Global Rotation Logic
            // We use mouse position logic but map it to time for auto-movement
            // This creates a slow, hypnotic rotation
            const timeScale = 0.0001;
            angleX = Math.sin(time * timeScale) * 0.02; 
            angleY = Math.cos(time * timeScale) * 0.02;
            angleZ = Math.sin(time * timeScale * 0.5) * 0.01;

            time++;

            // Sort by Z-depth (Painter's Algorithm)
            // However, since these are connected lines, sorting lines by their head depth
            // is usually sufficient for this visual style.
            tentacles.sort((a, b) => b.points[0].oz - a.points[0].oz);

            for (let i = 0; i < tentacles.length; i++) {
                tentacles[i].update();
                tentacles[i].render();
            }

            requestAnimationFrame(animate);
        }

        animate();

    </script>
</body>
</html>
