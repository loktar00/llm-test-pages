<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Fireworks Festival</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020205; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H, groundY, horizonY;
        
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            groundY = H * 0.85;
            horizonY = H * 0.65;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Utils ---
        const rand = (min, max) => Math.random() * (max - min) + min;
        const randInt = (min, max) => Math.floor(rand(min, max));
        const hsl = (h, s, l, a=1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;

        // --- Assets Generation ---
        const cityProfile = [];
        const stars = [];
        
        function initWorld() {
            cityProfile.length = 0;
            stars.length = 0;
            
            // Generate Skyline
            let x = -10;
            while (x < W + 10) {
                const w = rand(20, 80);
                const h = rand(20, (groundY - horizonY) * 0.9);
                cityProfile.push({ x, w, h });
                x += w + rand(0, 10);
            }

            // Generate Stars
            for(let i=0; i<200; i++) {
                stars.push({
                    x: rand(0, W),
                    y: rand(0, horizonY),
                    r: rand(0.5, 1.5),
                    alpha: rand(0.3, 0.8),
                    twinkleSpeed: rand(0.01, 0.05)
                });
            }
        }
        initWorld();

        // --- Entities ---
        const fireworks = [];
        const particles = [];
        const trails = [];

        class Firework {
            constructor() {
                this.x = rand(W * 0.1, W * 0.9);
                this.y = groundY;
                this.targetY = rand(H * 0.1, H * 0.45);
                this.speed = rand(6, 10);
                this.hue = rand(0, 360);
                this.dead = false;
                this.type = randInt(0, 5); // 0: Peony, 1: Willow, 2: Ring, 3: Double, 4: Chrysanthemum
            }

            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.y * 0.02) * 0.5; // Slight sway

                // Trail particles
                if (Math.random() > 0.2) {
                    trails.push(new Trail(this.x, this.y, this.hue));
                }

                if (this.y <= this.targetY) {
                    this.explode();
                    this.dead = true;
                }
            }

            explode() {
                const count = randInt(80, 150);
                const baseHue = this.hue;
                
                if (this.type === 0) { // Peony
                    createExplosion(this.x, this.y, count, baseHue, 1, 3);
                } else if (this.type === 1) { // Willow
                    createExplosion(this.x, this.y, count, baseHue, 0.5, 6);
                } else if (this.type === 2) { // Ring
                    for (let i = 0; i < count; i++) {
                        const angle = (Math.PI * 2 / count) * i;
                        const speed = 3;
                        particles.push(new Particle(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed, baseHue, 2));
                    }
                } else if (this.type === 3) { // Double Break
                    createExplosion(this.x, this.y, count/2, baseHue, 1, 2.5);
                    setTimeout(() => {
                        createExplosion(this.x, this.y, count/2, (baseHue + 180) % 360, 1.5, 1.5);
                    }, 200);
                } else { // Chrysanthemum
                    createExplosion(this.x, this.y, count * 1.5, baseHue, 2, 1);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, vx, vy, hue, type = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.hue = hue + rand(-20, 20);
                this.alpha = 1;
                this.type = type; // 1: Peony, 2: Willow
                this.decay = rand(0.005, 0.015);
                this.gravity = 0.05;
                this.drag = 0.96;
            }

            update() {
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                if (this.type === 2) { // Willow physics
                    this.vx *= 0.98;
                    this.vy += 0.08; // Heavier gravity feel
                    this.alpha -= 0.005; // Fade slower
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.type === 2 ? 1.5 : 2, 0, Math.PI * 2);
                ctx.fillStyle = hsl(this.hue, 100, 60);
                ctx.shadowBlur = 10;
                ctx.shadowColor = hsl(this.hue, 100, 60);
                ctx.fill();
                ctx.restore();
            }
        }

        class Trail {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.life = 1;
                this.hue = hue;
            }
            update() {
                this.life -= 0.05;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = hsl(this.hue, 100, 80);
                ctx.fillRect(this.x, this.y, 2, 4);
                ctx.restore();
            }
        }

        function createExplosion(x, y, count, hue, speedMult, type) {
            for (let i = 0; i < count; i++) {
                const angle = rand(0, Math.PI * 2);
                const speed = rand(0.5, 4) * speedMult;
                particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, hue, type));
            }
        }

        // --- Render Functions ---

        function drawSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, groundY);
            grad.addColorStop(0, '#020108');
            grad.addColorStop(1, '#1a152d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, groundY);

            // Stars
            const time = Date.now() * 0.001;
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed * 100))})`;
                ctx.fill();
            });
        }

        function drawCity() {
            ctx.fillStyle = '#050510';
            cityProfile.forEach(b => {
                ctx.fillRect(b.x, groundY - b.h, b.w, b.h);
                // Windows
                ctx.fillStyle = '#1a1a2e';
                for(let wx = b.x + 5; wx < b.x + b.w - 5; wx += 10) {
                    for(let wy = groundY - b.h + 5; wy < groundY - 5; wy += 15) {
                        if (Math.random() > 0.3) {
                            ctx.fillRect(wx, wy, 4, 8);
                        }
                    }
                }
                ctx.fillStyle = '#050510';
            });
        }

        function drawWater() {
            // Base water
            const grad = ctx.createLinearGradient(0, groundY, 0, H);
            grad.addColorStop(0, '#0a0a15');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, groundY, W, H - groundY);

            // Shimmer / Reflections
            const time = Date.now() * 0.002;
            ctx.save();
            ctx.translate(0, groundY * 2);
            ctx.scale(1, -1); // Flip for reflection logic if we would draw the scene, but we do it manually here

            // We simulate reflection by drawing horizontal lines that slightly offset
            // This is a cheap trick for "shimmer"
            ctx.globalCompositeOperation = 'screen';
            
            // Draw colored ripples based on existing particles for performance
            // Actually, simple ripples is better for performance
            
            for (let y = groundY; y < H; y += 4) {
                const opacity = 1 - ((y - groundY) / (H - groundY));
                const width = W * opacity * 0.5;
                const xOff = Math.sin(y * 0.05 + time) * 20;
                
                // Random color glitch
                if (Math.random() > 0.95) {
                     ctx.fillStyle = hsl(rand(0,360), 80, 50, opacity * 0.1);
                     ctx.fillRect(W/2 + xOff + rand(-100,100), y, width, 2);
                }
            }
            ctx.restore();
            
            // Simple wave lines
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<10; i++) {
                ctx.beginPath();
                const y = groundY + rand(10, H - groundY);
                ctx.moveTo(0, y);
                ctx.bezierCurveTo(W/3, y+rand(-5,5), W*2/3, y+rand(-5,5), W, y+rand(-10,10));
                ctx.stroke();
            }
        }

        // --- Main Loop ---
        let lastTime = 0;
        let finaleTimer = 0;

        function loop(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            // Clear
            ctx.clearRect(0, 0, W, H);

            // 1. Sky
            drawSky();

            // 2. City
            drawCity();

            // 3. Logic
            // Random Launch
            if (Math.random() < 0.02) {
                fireworks.push(new Firework());
            }

            // Finale Logic (Every 20 seconds roughly for demo, real spec is minutes)
            finaleTimer += dt;
            if (finaleTimer > 20000) { // 20 seconds for visual demo pacing
                for(let i=0; i<10; i++) {
                    setTimeout(() => fireworks.push(new Firework()), i * 100);
                }
                finaleTimer = 0;
            }

            // Update & Draw Fireworks
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const f = fireworks[i];
                f.update();
                f.draw();
                if (f.dead) fireworks.splice(i, 1);
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Update & Draw Trails
            for (let i = trails.length - 1; i >= 0; i--) {
                const t = trails[i];
                t.update();
                t.draw();
                if (t.life <= 0) trails.splice(i, 1);
            }

            // 4. Water Reflection (Fake the reflection by drawing the scene upside down with blur)
            // We do this after drawing particles so they appear in water
            ctx.save();
            ctx.translate(0, groundY * 2);
            ctx.scale(1, -1);
            ctx.filter = 'blur(8px)';
            ctx.globalAlpha = 0.3;
            ctx.globalCompositeOperation = 'source-over';
            
            // Re-draw scene elements (This is a hacky way to get reflection without complex physics)
            // Ideally, we would have a offscreen canvas, but here we simulate "shimmer" by drawing glowing rects
            // We just draw the particles again flipped
            particles.forEach(p => {
                 ctx.beginPath();
                 ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                 ctx.fillStyle = hsl(p.hue, 100, 50);
                 ctx.fill();
            });
            
            ctx.restore();

            // 5. River overlay
            drawWater();

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

    </script>
</body>
</html>
