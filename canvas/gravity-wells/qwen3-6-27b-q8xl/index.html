<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Painting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const G = 800;
const SOFTENING = 15;
const MAX_PARTICLES = 4000;
const FADE_ALPHA = 0.012;
const PARTICLE_LIFE = 600;

const wellColors = [
  [255, 80, 120],
  [80, 180, 255],
  [120, 255, 100],
  [255, 200, 60],
  [200, 100, 255]
];

class GravityWell {
  constructor(x, y, mass, colorIdx) {
    this.x = x;
    this.y = y;
    this.mass = mass;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.colorIdx = colorIdx % wellColors.length;
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.wanderSpeed = 0.003 + Math.random() * 0.005;
    this.age = 0;
  }

  update(dt) {
    this.age += dt;
    this.wanderAngle += (Math.random() - 0.5) * 0.3;
    this.vx += Math.cos(this.wanderAngle) * this.wanderSpeed * dt;
    this.vy += Math.sin(this.wanderAngle) * this.wanderSpeed * dt;
    const maxV = 1.2;
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > maxV) {
      this.vx = (this.vx / speed) * maxV;
      this.vy = (this.vy / speed) * maxV;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    const margin = 60;
    if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx); }
    if (this.x > W - margin) { this.x = W - margin; this.vx = -Math.abs(this.vx); }
    if (this.y < margin) { this.y = margin; this.vy = Math.abs(this.vy); }
    if (this.y > H - margin) { this.y = H - margin; this.vy = -Math.abs(this.vy); }
  }

  get color() {
    return wellColors[this.colorIdx];
  }
}

let wells = [];

function spawnWells() {
  wells = [];
  const count = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const x = W * 0.2 + Math.random() * W * 0.6;
    const y = H * 0.2 + Math.random() * H * 0.6;
    wells.push(new GravityWell(x, y, 100 + Math.random() * 200, i));
  }
}

function mergeWells() {
  if (wells.length < 2) return;
  let minDist = Infinity;
  let mi = 0, mj = 1;
  for (let i = 0; i < wells.length; i++) {
    for (let j = i + 1; j < wells.length; j++) {
      const dx = wells[i].x - wells[j].x;
      const dy = wells[i].y - wells[j].y;
      const d = dx * dx + dy * dy;
      if (d < minDist) {
        minDist = d;
        mi = i;
        mj = j;
      }
    }
  }
  const threshold = 2500;
  if (minDist < threshold) {
    const a = wells[mi];
    const b = wells[mj];
    const totalMass = a.mass + b.mass;
    const newX = (a.x * a.mass + b.x * b.mass) / totalMass;
    const newY = (a.y * a.mass + b.y * b.mass) / totalMass;
    const newWell = new GravityWell(newX, newY, totalMass * 0.95, a.colorIdx);
    newWell.vx = (a.vx * a.mass + b.vx * b.mass) / totalMass;
    newWell.vy = (a.vy * a.mass + b.vy * b.mass) / totalMass;
    wells.splice(Math.max(mi, mj), 1);
    wells.splice(Math.min(mi, mj), 1);
    wells.push(newWell);
  }
}

function splitWell() {
  if (wells.length >= 6) return;
  let maxMass = 0;
  let mi = 0;
  for (let i = 0; i < wells.length; i++) {
    if (wells[i].mass > maxMass) {
      maxMass = wells[i].mass;
      mi = i;
    }
  }
  if (maxMass < 200) return;
  const w = wells[mi];
  const m1 = w.mass * 0.55;
  const m2 = w.mass * 0.45;
  const angle = Math.random() * Math.PI * 2;
  const sep = 40 + Math.random() * 40;
  const w1 = new GravityWell(w.x + Math.cos(angle) * sep, w.y + Math.sin(angle) * sep, m1, w.colorIdx);
  const w2 = new GravityWell(w.x - Math.cos(angle) * sep, w.y - Math.sin(angle) * sep, m2, (w.colorIdx + 1) % wellColors.length);
  w1.vx = w.vx + Math.cos(angle + Math.PI / 2) * 0.3;
  w1.vy = w.vy + Math.sin(angle + Math.PI / 2) * 0.3;
  w2.vx = w.vx - Math.cos(angle + Math.PI / 2) * 0.3;
  w2.vy = w.vy - Math.sin(angle + Math.PI / 2) * 0.3;
  wells.splice(mi, 1);
  wells.push(w1, w2);
}

let mergeTimer = 0;
let splitTimer = 0;

// Particle pool using flat arrays for performance
const px = new Float32Array(MAX_PARTICLES);
const py = new Float32Array(MAX_PARTICLES);
const pvx = new Float32Array(MAX_PARTICLES);
const pvy = new Float32Array(MAX_PARTICLES);
const pcr = new Uint8Array(MAX_PARTICLES);
const pcg = new Uint8Array(MAX_PARTICLES);
const pcb = new Uint8Array(MAX_PARTICLES);
const pLife = new Int32Array(MAX_PARTICLES);
const pMaxLife = new Int32Array(MAX_PARTICLES);
let particleCount = 0;

function emitParticle() {
  if (particleCount >= MAX_PARTICLES) return;
  const i = particleCount;
  const edge = Math.floor(Math.random() * 4);
  const speed = 0.5 + Math.random() * 1.5;
  switch (edge) {
    case 0: px[i] = Math.random() * W; py[i] = -5; pvx[i] = (Math.random() - 0.5) * 1; pvy[i] = speed; break;
    case 1: px[i] = W + 5; py[i] = Math.random() * H; pvx[i] = -speed; pvy[i] = (Math.random() - 0.5) * 1; break;
    case 2: px[i] = Math.random() * W; py[i] = H + 5; pvx[i] = (Math.random() - 0.5) * 1; pvy[i] = -speed; break;
    case 3: px[i] = -5; py[i] = Math.random() * H; pvx[i] = speed; pvy[i] = (Math.random() - 0.5) * 1; break;
  }
  // Assign color based on nearest well
  let minD = Infinity;
  let nearestColor = 0;
  for (let w = 0; w < wells.length; w++) {
    const dx = px[i] - wells[w].x;
    const dy = py[i] - wells[w].y;
    const d = dx * dx + dy * dy;
    if (d < minD) {
      minD = d;
      nearestColor = wells[w].colorIdx;
    }
  }
  const c = wellColors[nearestColor];
  pcr[i] = c[0];
  pcg[i] = c[1];
  pcb[i] = c[2];
  pLife[i] = 0;
  pMaxLife[i] = PARTICLE_LIFE + Math.floor(Math.random() * 300);
  particleCount++;
}

function updateParticles(dt) {
  for (let i = 0; i < particleCount; i++) {
    let ax = 0, ay = 0;
    for (let w = 0; w < wells.length; w++) {
      const dx = wells[w].x - px[i];
      const dy = wells[w].y - py[i];
      const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
      const dist = Math.sqrt(distSq);
      const force = G * wells[w].mass / distSq;
      ax += force * dx / dist;
      ay += force * dy / dist;
    }
    pvx[i] += ax * dt;
    pvy[i] += ay * dt;
    // Damping
    pvx[i] *= 0.999;
    pvy[i] *= 0.999;
    // Speed limit
    const spd = pvx[i] * pvx[i] + pvy[i] * pvy[i];
    if (spd > 900) {
      const s = 30 / Math.sqrt(spd);
      pvx[i] *= s;
      pvy[i] *= s;
    }
    px[i] += pvx[i] * dt;
    py[i] += pvy[i] * dt;
    pLife[i] += dt;
  }
  // Remove dead or off-screen particles
  let writeIdx = 0;
  for (let i = 0; i < particleCount; i++) {
    if (pLife[i] < pMaxLife[i] && px[i] > -100 && px[i] < W + 100 && py[i] > -100 && py[i] < H + 100) {
      if (writeIdx !== i) {
        px[writeIdx] = px[i];
        py[writeIdx] = py[i];
        pvx[writeIdx] = pvx[i];
        pvy[writeIdx] = pvy[i];
        pcr[writeIdx] = pcr[i];
        pcg[writeIdx] = pcg[i];
        pcb[writeIdx] = pcb[i];
        pLife[writeIdx] = pLife[i];
        pMaxLife[writeIdx] = pMaxLife[i];
      }
      writeIdx++;
    }
  }
  particleCount = writeIdx;
}

// Pre-create offscreen canvas for particles to batch draw
const offCanvas = document.createElement('canvas');
const offCtx = offCanvas.getContext('2d');

function drawParticles() {
  offCanvas.width = W;
  offCanvas.height = H;
  offCtx.clearRect(0, 0, W, H);
  offCtx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < particleCount; i++) {
    const lifeRatio = pLife[i] / pMaxLife[i];
    const alpha = lifeRatio < 0.1 ? lifeRatio * 10 : (lifeRatio > 0.8 ? (1 - lifeRatio) * 5 : 1);
    const r = pcr[i];
    const g = pcg[i];
    const b = pcb[i];
    const x = px[i];
    const y = py[i];
    const speed = Math.sqrt(pvx[i] * pvx[i] + pvy[i] * pvy[i]);
    const size = Math.max(0.5, 1.5 - speed * 0.02);

    offCtx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.7})`;
    offCtx.beginPath();
    offCtx.arc(x, y, size, 0, Math.PI * 2);
    offCtx.fill();
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(offCanvas, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
}

function fadeCanvas() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(0,0,0,${FADE_ALPHA})`;
  ctx.fillRect(0, 0, W, H);
}

// Draw subtle well indicators (very faint)
function drawWellHints() {
  ctx.globalCompositeOperation = 'lighter';
  for (let w = 0; w < wells.length; w++) {
    const well = wells[w];
    const c = well.color;
    const radius = Math.sqrt(well.mass) * 0.8;
    const grad = ctx.createRadialGradient(well.x, well.y, 0, well.x, well.y, radius * 3);
    grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0.04)`);
    grad.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(well.x, well.y, radius * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

let lastTime = performance.now();
let emitAccum = 0;
const emitRate = 80; // particles per second

function loop(now) {
  const rawDt = (now - lastTime) / 1000;
  const dt = Math.min(rawDt, 0.05);
  lastTime = now;

  // Fade
  fadeCanvas();

  // Update wells
  for (const w of wells) w.update(dt * 60);

  // Merge / split events
  mergeTimer += dt;
  splitTimer += dt;
  if (mergeTimer > 8 + Math.random() * 5) {
    mergeTimer = 0;
    mergeWells();
  }
  if (splitTimer > 12 + Math.random() * 8) {
    splitTimer = 0;
    splitWell();
  }

  // Ensure minimum wells
  while (wells.length < 3) {
    wells.push(new GravityWell(
      W * 0.2 + Math.random() * W * 0.6,
      H * 0.2 + Math.random() * H * 0.6,
      100 + Math.random() * 200,
      Math.floor(Math.random() * wellColors.length)
    ));
  }

  // Emit particles
  emitAccum += emitRate * dt;
  while (emitAccum >= 1 && particleCount < MAX_PARTICLES) {
    emitParticle();
    emitAccum -= 1;
  }

  // Update particles
  updateParticles(dt * 60);

  // Draw
  drawParticles();
  drawWellHints();

  requestAnimationFrame(loop);
}

spawnWells();
requestAnimationFrame(loop);
</script>
</body>
</html>
