<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Settings</title>
<style>
  :root {
    --accent: #4f46e5;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 1.5rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }

  .card h2 {
    font-size: 1.1rem;
    margin-bottom: 1rem;
    color: var(--text);
  }

  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 0;
    border-bottom: 1px solid var(--border);
  }

  .setting:last-child { border: none; }

  .setting-label {
    display: flex;
    flex-direction: column;
  }

  .setting-label .title {
    font-size: 0.95rem;
  }

  .setting-label .desc {
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* Toggle */
  .toggle {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
  }

  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ccc;
    border-radius: 999px;
    transition: .3s;
  }

  .slider:before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: .3s;
  }

  input:checked + .slider {
    background-color: var(--accent);
  }

  input:checked + .slider:before {
    transform: translateX(20px);
  }

  /* Radio Pills */
  .radio-group {
    display: flex;
    gap: 0.5rem;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all .2s;
    background: var(--bg);
  }

  .radio-option:hover { background: #e5e7eb; }

  .radio-option input { display: none; }

  .radio-option.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* Select */
  select {
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--card);
    color: var(--text);
    outline: none;
  }

  select:focus { border-color: var(--accent); }

  /* Swatches */
  .swatch-group {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .2s, border-color .2s;
  }

  .swatch:hover { transform: scale(1.1); }

  .swatch.active { border-color: #000; }

  .swatch[data-color="#4f46e5"] { background: #4f46e5; }
  .swatch[data-color="#ef4444"] { background: #ef4444; }
  .swatch[data-color="#f59e0b"] { background: #f59e0b; }
  .swatch[data-color="#10b981"] { background: #10b981; }
  .swatch[data-color="#3b82f6"] { background: #3b82f6; }
  .swatch[data-color="#8b5cf6"] { background: #8b5cf6; }

  /* Save Bar */
  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--accent);
    color: white;
    text-align: center;
    padding: 1rem;
    font-weight: 600;
    transform: translateY(100%);
    transition: transform .3s ease;
  }

  .save-bar.visible {
    transform: translateY(0);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <!-- Profile -->
    <div class="card">
      <h2>Profile</h2>
      <div class="setting">
        <div class="setting-label">
          <span class="title">Public Profile</span>
          <span class="desc">Allow others to view your profile</span>
        </div>
        <label class="toggle">
          <input type="checkbox" checked/>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting">
        <div class="setting-label">
          <span class="title">Email</span>
          <span class="desc">Notifications about your account</span>
        </div>
        <input type="email" value="jane@example.com" style="padding:.5rem .8rem;border:1px solid var(--border);border-radius:8px;font-size:.9rem;outline:none;" onfocus="this.style.borderColor='var(--accent)'">
      </div>
    </div>

    <!-- Notifications -->
    <div class="card">
      <h2>Notifications</h2>
      <div class="setting">
        <div class="setting-label">
          <span class="title">Push Notifications</span>
          <span class="desc">Enable push notifications</span>
        </div>
        <label class="toggle">
          <input type="checkbox"/>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting">
        <div class="setting-label">
          <span class="title">Email Frequency</span>
          <span class="desc">How often you receive emails</span>
        </div>
        <select>
          <option>Daily</option>
          <option>Weekly</option>
          <option>Monthly</option>
        </select>
      </div>
    </div>

    <!-- Appearance -->
    <div class="card">
      <h2>Appearance</h2>
      <div class="setting">
        <div class="setting-label">
          <span class="title">Theme Mode</span>
        </div>
        <div class="radio-group">
          <label class="radio-option active" data-value="light">
            <input type="radio" name="theme"/>
            Light
          </label>
          <label class="radio-option" data-value="dark">
            <input type="radio" name="theme"/>
            Dark
          </label>
          <label class="radio-option" data-value="system">
            <input type="radio" name="theme"/>
            System
          </label>
        </div>
      </div>

      <div class="setting">
        <div class="setting-label">
          <span class="title">Accent Color</span>
        </div>
        <div class="swatch-group" id="accentSwatches">
          <div class="swatch active" data-color="#4f46e5"></div>
          <div class="swatch" data-color="#ef4444"></div>
          <div class="swatch" data-color="#f59e0b"></div>
          <div class="swatch" data-color="#10b981"></div>
          <div class="swatch" data-color="#3b82f6"></div>
          <div class="swatch" data-color="#8b5cf6"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Save Bar -->
  <div class="save-bar" id="saveBar">
    You have <span id="changeCount">1</span> unsaved change(s). Click to save.
  </div>

<script>
  const saveBar = document.getElementById('saveBar');
  const changeCountSpan = document.getElementById('changeCount');
  let changedCount = 0;

  function updateSaveBar() {
    if (changedCount > 0) {
      changeCountSpan.textContent = changedCount;
      saveBar.classList.add('visible');
    } else {
      saveBar.classList.remove('visible');
    }
  }

  // Toggle tracking
  document.querySelectorAll('.toggle input').forEach(input => {
    input.addEventListener('change', () => {
      changedCount++;
      updateSaveBar();
    });
  });

  // Radio pills tracking
  document.querySelectorAll('.radio-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const group = opt.parentNode;
      group.querySelectorAll('.radio-option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      changedCount++;
      updateSaveBar();
    });
  });

  // Select tracking
  document.querySelectorAll('select').forEach(sel => {
    sel.addEventListener('change', () => {
      changedCount++;
      updateSaveBar();
    });
  });

  // Email input tracking
  const emailInput = document.querySelector('input[type="email"]');
  if (emailInput) {
    let initial = emailInput.value;
    emailInput.addEventListener('change', () => {
      if (emailInput.value !== initial) {
        initial = emailInput.value;
        changedCount++;
        updateSaveBar();
      }
    });
  }

  // Accent swatches
  document.getElementById('accentSwatches').addEventListener('click', e => {
    if (e.target.classList.contains('swatch')) {
      const color = e.target.dataset.color;
      document.documentElement.style.setProperty('--accent', color);
      // Re-tint checked toggles
      document.querySelectorAll('.toggle input:checked + .slider').forEach(slider => {
        slider.style.backgroundColor = color;
      });
      // Update active swatch
      document.querySelectorAll('#accentSwatches .swatch').forEach(s => s.classList.remove('active'));
      e.target.classList.add('active');
      changedCount++;
      updateSaveBar();
    }
  });

  // Save bar click resets
  saveBar.addEventListener('click', () => {
    changedCount = 0;
    updateSaveBar();
  });

  // Initialize: tint existing checked toggles
  document.querySelectorAll('.toggle input:checked + .slider').forEach(slider => {
    slider.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--accent');
  });
</script>
</body>
</html>
