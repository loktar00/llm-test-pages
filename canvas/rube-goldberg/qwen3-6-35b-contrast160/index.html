<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rube Goldberg Loop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;cursor:crosshair}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Physics constants
const GRAVITY = 600;
const SUBSTEPS = 4;
const FRICTION = 0.985;
const RESTITUTION = 0.45;
const ANGULAR_DAMPING = 0.995;

// World bounds
const WORLD_W = 1400;
const WORLD_H = 800;
const WALL_L = -50;
const WALL_R = WORLD_W + 50;
const WALL_T = -50;
const WALL_B = WORLD_H + 50;

// Ball properties
const BALL_R = 14;
const BALL_MASS = 1;

// Particle system
const particles = [];
function spawnDust(x, y, vx, vy, count = 5) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: vx * 0.3 + (Math.random() - 0.5) * 80,
      vy: vy * 0.3 + (Math.random() - 0.5) * 80 - 30,
      life: 1,
      decay: 1.5 + Math.random(),
      size: 2 + Math.random() * 4
    });
  }
}

function spawnSquash(x, y, intensity) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * intensity;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 20,
      life: 1,
      decay: 2 + Math.random(),
      size: 3 + Math.random() * 5
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}

// Camera
const camera = { x: 0, y: 0, zoom: 1 };
function updateCamera(tx, ty) {
  camera.x += (tx - camera.x) * 0.06;
  camera.y += (ty - camera.y) * 0.06;
}

// Drawing helpers
function drawWorldRect(x, y, w, h, color = '#222') {
  ctx.fillStyle = color;
  ctx.fillRect(x - W / 2 + camera.x, y - H / 2 + camera.y, w, h);
}

function drawLine(x1, y1, x2, y2, color = '#555', width = 3) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1 - W / 2 + camera.x, y1 - H / 2 + camera.y);
  ctx.lineTo(x2 - W / 2 + camera.x, y2 - H / 2 + camera.y);
  ctx.stroke();
}

function drawCircle(x, y, r, color = '#f44') {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x - W / 2 + camera.x, y - H / 2 + camera.y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticle(p) {
  ctx.fillStyle = `rgba(255,200,100,${p.life * 0.7})`;
  ctx.beginPath();
  ctx.arc(p.x - W / 2 + camera.x, p.y - H / 2 + camera.y, p.size * p.life, 0, Math.PI * 2);
  ctx.fill();
}

// Rube Goldberg Machine Components
class Ramp {
  constructor(x1, y1, x2, y2, color = '#445') {
    this.x1 = x1; this.y1 = y1;
    this.x2 = x2; this.y2 = y2;
    this.color = color;
  }
  draw() {
    drawLine(this.x1, this.y1, this.x2, this.y2, this.color, 8);
    drawLine(this.x1, this.y1, this.x2, this.y2, '#667', 4);
  }
  intersects(x, y, r) {
    const dx = this.x2 - this.x1, dy = this.y2 - this.y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    const nx = -dy / len, ny = dx / len;
    const dist = (x - this.x1) * nx + (y - this.y1) * ny;
    if (Math.abs(dist) > r) return false;
    const t = ((x - this.x1) * dx + (y - this.y1) * dy) / (len * len);
    if (t < -0.05 || t > 1.05) return false;
    return true;
  }
  normal() {
    const dx = this.x2 - this.x1, dy = this.y2 - this.y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    return { x: -dy / len, y: dx / len };
  }
}

class Domino {
  constructor(x, y, w = 12, h = 50) {
    this.x = x; this.y = y;
    this.w = w; this.h = h;
    this.angle = 0;
    this.angularVel = 0;
    this.mass = 0.5;
    this.activated = false;
    this.fallen = false;
    this.restAngle = 0;
  }
  get cx() { return this.x + Math.sin(this.angle) * this.w / 2; }
  get cy() { return this.y - Math.cos(this.angle) * this.h / 2; }
  update(dt) {
    if (this.fallen) {
      this.angularVel += GRAVITY * Math.sin(this.angle) * 0.01;
      this.angularVel *= ANGULAR_DAMPING;
      this.angle += this.angularVel * dt;
      if (this.angle > Math.PI / 2 - 0.05) {
        this.angle = Math.PI / 2 - 0.02;
        this.angularVel *= 0.3;
        this.fallen = true;
      }
    }
  }
  draw() {
    const cx = this.x - W / 2 + camera.x;
    const cy = this.y - H / 2 + camera.y;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.angle);
    ctx.fillStyle = this.activated ? '#e74c3c' : '#8B4513';
    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);
    ctx.restore();
  }
  getTop() {
    return {
      x: this.x + Math.sin(this.angle) * this.w / 2,
      y: this.y - Math.cos(this.angle) * this.h / 2
    };
  }
  getBottom() {
    return {
      x: this.x - Math.sin(this.angle) * this.w / 2,
      y: this.y + Math.cos(this.angle) * this.h / 2
    };
  }
}

class Pulley {
  constructor(x, y, ropeLen = 200) {
    this.x = x; this.y = y;
    this.ropeLen = ropeLen;
    this.basketY = y + ropeLen / 2;
    this.basketVel = 0;
    this.basketMass = 0.3;
    this.active = false;
    this.triggered = false;
    this.triggerY = y - 30;
  }
  update(dt, ball) {
    if (!this.triggered && ball && ball.y < this.triggerY && ball.y > this.triggerY - 50 &&
        Math.abs(ball.x - this.x) < 60) {
      this.triggered = true;
      this.active = true;
      spawnDust(this.x, this.triggerY, 0, -50, 10);
    }
    if (this.active) {
      const tension = (this.basketMass * GRAVITY * 0.5);
      this.basketVel += tension * dt;
      this.basketVel *= 0.98;
      this.basketY += this.basketVel * dt;
      const maxY = this.y + this.roLen / 2;
      const minY = this.y - this.ropeLen / 2;
      if (this.basketY > maxY) { this.basketY = maxY; this.basketVel *= -0.3; }
      if (this.basketY < minY) { this.basketY = minY; this.basketVel *= -0.3; }
    }
  }
  draw() {
    // Pulley wheel
    const cx = this.x - W / 2 + camera.x;
    const cy = this.y - H / 2 + camera.y;
    ctx.fillStyle = '#556';
    ctx.beginPath();
    ctx.arc(cx, cy, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#889';
    ctx.lineWidth = 3;
    ctx.stroke();
    // Rope
    const basketCY = this.basketY - H / 2 + camera.y;
    ctx.strokeStyle = '#a89';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, basketCY);
    ctx.stroke();
    // Basket
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(cx - 20, basketCY - 15, 40, 30);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - 20, basketCY - 15, 40, 30);
    // Handle
    ctx.beginPath();
    ctx.arc(cx, basketCY - 25, 8, 0, Math.PI);
    ctx.stroke();
  }
}

class SpringHammer {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.angle = 0;
    this.angularVel = 0;
    this.triggered = false;
    this.triggerX = x - 80;
    this.armLen = 80;
    this.headSize = 20;
  }
  update(dt, ball) {
    if (!this.triggered && ball && Math.abs(ball.x - this.triggerX) < 30 &&
        ball.y > this.y - 50 && ball.y < this.y + 50) {
      this.triggered = true;
      this.angularVel = 15;
      spawnDust(this.x, this.y, 0, 0, 8);
    }
    this.angularVel -= 8 * dt;
    this.angularVel *= 0.95;
    this.angle += this.angularVel * dt;
    if (this.angle > Math.PI / 3) {
      this.angle = Math.PI / 3;
      this.angularVel *= -0.4;
    }
  }
  draw() {
    const cx = this.x - W / 2 + camera.x;
    const cy = this.y - H / 2 + camera.y;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.angle);
    // Arm
    ctx.fillStyle = '#666';
    ctx.fillRect(0, -6, this.armLen, 12);
    // Head
    ctx.fillStyle = '#888';
    ctx.fillRect(this.armLen - 5, -this.headSize, 25, this.headSize * 2);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.strokeRect(this.armLen - 5, -this.headSize, 25, this.headSize * 2);
    ctx.restore();
    // Pivot
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Funnel {
  constructor(x, y, width = 100, depth = 60) {
    this.x = x; this.y = y;
    this.width = width; this.depth = depth;
    this.triggered = false;
  }
  draw() {
    const cx = this.x - W / 2 + camera.x;
    const cy = this.y - H / 2 + camera.y;
    ctx.fillStyle = '#334';
    ctx.beginPath();
    ctx.moveTo(cx - this.width / 2, cy - this.depth);
    ctx.lineTo(cx - this.width / 6, cy);
    ctx.lineTo(cx + this.width / 6, cy);
    ctx.lineTo(cx + this.width / 2, cy - this.depth);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#556';
    ctx.lineWidth = 3;
    ctx.stroke();
    // Opening
    ctx.fillStyle = '#111';
    ctx.fillRect(cx - this.width / 6, cy, this.width / 3, 10);
  }
}

class ElevatorWheel {
  constructor(x, y, radius = 60) {
    this.x = x; this.y = y;
    this.radius = radius;
    this.angle = 0;
    this.speed = 1.5;
    this.triggers = [];
    for (let i = 0; i < 8; i++) {
      this.triggers.push({
        angle: (i / 8) * Math.PI * 2,
        x: x + Math.cos((i / 8) * Math.PI * 2) * radius,
        y: y + Math.sin((i / 8) * Math.PI * 2) * radius
      });
    }
  }
  update(dt) {
    this.angle += this.speed * dt;
    for (let t of this.triggers) {
      t.x = this.x + Math.cos(t.angle + this.angle) * this.radius;
      t.y = this.y + Math.sin(t.angle + this.angle) * this.radius;
    }
  }
  draw() {
    const cx = this.x - W / 2 + camera.x;
    const cy = this.y - H / 2 + camera.y;
    // Wheel
    ctx.strokeStyle = '#556';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, this.radius, 0, Math.PI * 2);
    ctx.stroke();
    // Spokes
    ctx.lineWidth = 2;
    for (let t of this.triggers) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(t.x - W / 2 + camera.x, t.y - H / 2 + camera.y);
      ctx.stroke();
    }
    // Hubs
    ctx.fillStyle = '#445';
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fill();
    // Triggers
    for (let t of this.triggers) {
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(t.x - W / 2 + camera.x, t.y - H / 2 + camera.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Build the machine
const ramps = [
  new Ramp(100, 100, 300, 250, '#4a5'),
  new Ramp(300, 250, 500, 200, '#5a4'),
  new Ramp(500, 200, 700, 350, '#45a'),
  new Ramp(700, 350, 900, 300, '#54a'),
  new Ramp(900, 300, 1100, 450, '#a45'),
  new Ramp(1100, 450, 1250, 350, '#a54'),
  new Ramp(1250, 350, 1150, 200, '#5a5'),
  new Ramp(1150, 200, 1000, 100, '#55a'),
  new Ramp(1000, 100, 800, 150, '#a55'),
  new Ramp(800, 150, 600, 300, '#5a5'),
  new Ramp(600, 300, 400, 250, '#a55'),
  new Ramp(400, 250, 250, 400, '#55a'),
  new Ramp(250, 400, 150, 550, '#a55'),
];

const dominos = [];
for (let i = 0; i < 5; i++) {
  dominos.push(new Domino(350 + i * 30, 250));
}

const pulley = new Pulley(900, 150, 250);
const springHammer = new SpringHammer(1150, 250);
const funnel = new Funnel(1050, 350, 80, 50);
const elevator = new ElevatorWheel(800, 550, 70);

// Ball
const ball = {
  x: 100, y: 80,
  vx: 20, vy: 0,
  r: BALL_R,
  mass: BALL_MASS,
  active: true,
  resetTimer: 0,
  trail: []
};

function resetBall() {
  ball.x = 100;
  ball.y = 80;
  ball.vx = 20;
  ball.vy = 0;
  ball.active = true;
  ball.trail = [];
  // Reset dominos
  for (let d of dominos) {
    d.angle = 0;
    d.angularVel = 0;
    d.activated = false;
    d.fallen = false;
  }
  // Reset pulley
  pulley.triggered = false;
  pulley.active = false;
  pulley.basketY = pulley.y + pulley.ropeLen / 2;
  pulley.basketVel = 0;
  // Reset hammer
  springHammer.triggered = false;
  springHammer.angle = 0;
  springHammer.angularVel = 0;
}

// Physics collision
function resolveRampCollision(ramp, ball) {
  if (!ramp.intersects(ball.x, ball.y, ball.r)) return false;
  const n = ramp.normal();
  const dist = (ball.x - ramp.x1) * n.x + (ball.y - ramp.y1) * n.y;
  const penetration = ball.r - Math.abs(dist);
  if (penetration <= 0) return false;
  
  const pushDir = dist > 0 ? 1 : -1;
  ball.x += n.x * penetration * pushDir;
  ball.y += n.y * penetration * pushDir;
  
  const dot = ball.vx * n.x + ball.vy * n.y;
  if (dot < 0) {
    ball.vx -= (1 + RESTITUTION) * dot * n.x;
    ball.vy -= (1 + RESTITUTION) * dot * n.y;
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;
    
    const impactSpeed = Math.sqrt(dot * dot);
    if (impactSpeed > 30) {
      spawnDust(ball.x, ball.y, -n.x * impactSpeed * 0.5, -n.y * impactSpeed * 0.5, 5);
      spawnSquash(ball.x, ball.y, impactSpeed * 0.3);
    }
  }
  return true;
}

function resolveDominoCollision(domino, ball) {
  const top = domino.getTop();
  const bottom = domino.getBottom();
  
  // Simple AABB check first
  if (ball.x > domino.x - 30 && ball.x < domino.x + 30 &&
      ball.y > domino.y - domino.h && ball.y < domino.y + 10) {
    
    const distX = Math.abs(ball.x - domino.x);
    const distY = Math.abs(ball.y - domino.y);
    
    if (distX < domino.w / 2 + ball.r && distY < domino.h / 2 + ball.r) {
      // Push ball away
      const pushX = (ball.x - domino.x) > 0 ? 1 : -1;
      ball.x += pushX * 5;
      
      if (!domino.activated) {
        domino.activated = true;
        domino.fallen = true;
        domino.angularVel = 8;
        spawnDust(domino.x, domino.y - domino.h / 2, 0, 0, 10);
      }
      return true;
    }
  }
  return false;
}

function updatePhysics(dt) {
  const subDt = dt / SUBSTEPS;
  
  for (let step = 0; step < SUBSTEPS; step++) {
    // Gravity
    ball.vy += GRAVITY * subDt;
    
    // Movement
    ball.x += ball.vx * subDt;
    ball.y += ball.vy * subDt;
    
    // Wall collisions
    if (ball.x < WALL_L + ball.r) { ball.x = WALL_L + ball.r; ball.vx = Math.abs(ball.vx) * RESTITUTION; }
    if (ball.x > WALL_R - ball.r) { ball.x = WALL_R - ball.r; ball.vx = -Math.abs(ball.vx) * RESTITUTION; }
    if (ball.y < WALL_T + ball.r) { ball.y = WALL_T + ball.r; ball.vy = Math.abs(ball.vy) * RESTITUTION; }
    if (ball.y > WALL_B - ball.r) { ball.y = WALL_B - ball.r; ball.vy = -Math.abs(ball.vy) * RESTITUTION; }
    
    // Ramp collisions
    for (let ramp of ramps) {
      resolveRampCollision(ramp, ball);
    }
    
    // Domino collisions
    for (let domino of dominos) {
      resolveDominoCollision(domino, ball);
    }
    
    // Pulley trigger
    pulley.update(subDt, ball);
    
    // Spring hammer
    springHammer.update(subDt, ball);
    
    // Elevator
    elevator.update(subDt);
    
    // Check if ball near elevator triggers
    for (let t of elevator.triggers) {
      const dx = ball.x - t.x;
      const dy = ball.y - t.y;
      if (Math.sqrt(dx * dx + dy * dy) < ball.r + 10) {
        // Push ball toward top of wheel
        const angle = Math.atan2(t.y - elevator.y, t.x - elevator.x);
        ball.vx = Math.cos(angle) * 100;
        ball.vy = Math.sin(angle) * 100;
        spawnDust(t.x, t.y, 0, 0, 3);
      }
    }
    
    // Update dominos
    for (let domino of dominos) {
      domino.update(subDt);
    }
  }
  
  // Trail
  ball.trail.push({ x: ball.x, y: ball.y, life: 1 });
  if (ball.trail.length > 20) ball.trail.shift();
  for (let t of ball.trail) t.life -= dt * 2;
  
  // Check reset conditions
  if (ball.y > WALL_B - 20 || ball.x < 0 || ball.x > WORLD_W || ball.y < 0) {
    ball.resetTimer += dt;
    if (ball.resetTimer > 1) {
      resetBall();
      ball.resetTimer = 0;
    }
  }
}

// Draw everything
function draw() {
  // Background
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, W, H);
  
  // Grid
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 1;
  const gridSize = 50;
  const offsetX = (-W / 2 + camera.x) % gridSize;
  const offsetY = (-H / 2 + camera.y) % gridSize;
  for (let x = offsetX; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = offsetY; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  
  // Draw machine components
  for (let ramp of ramps) ramp.draw();
  for (let domino of dominos) domino.draw();
  pulley.draw();
  springHammer.draw();
  funnel.draw();
  elevator.draw();
  
  // Draw ball trail
  for (let i = 0; i < ball.trail.length - 1; i++) {
    const t = ball.trail[i];
    if (t.life > 0) {
      ctx.strokeStyle = `rgba(255,100,100,${t.life * 0.3})`;
      ctx.lineWidth = ball.r * t.life;
      ctx.beginPath();
      ctx.moveTo(t.x - W / 2 + camera.x, t.y - H / 2 + camera.y);
      if (i + 1 < ball.trail.length) {
        const t2 = ball.trail[i + 1];
        ctx.lineTo(t2.x - W / 2 + camera.x, t2.y - H / 2 + camera.y);
      }
      ctx.stroke();
    }
  }
  
  // Draw ball
  drawCircle(ball.x, ball.y, ball.r, '#ff6b6b');
  // Ball shine
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(ball.x - W / 2 + camera.x - 3, ball.y - H / 2 + camera.y - 3, ball.r * 0.3, 0, Math.PI * 2);
  ctx.fill();
  
  // Particles
  for (let p of particles) drawParticle(p);
  
  // UI
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('Rube Goldberg Loop', 20, 30);
  ctx.fillText('Speed: ' + Math.round(Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy)), 20, 55);
  
  // Reset warning
  if (ball.resetTimer > 0) {
    ctx.fillStyle = 'rgba(255,100,100,0.5)';
    ctx.font = '24px monospace';
    ctx.fillText('RESETTING...', W / 2 - 60, H / 2);
  }
}

// Main loop
let lastTime = 0;
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.033);
  lastTime = time;
  
  updatePhysics(dt);
  updateParticles(dt);
  
  // Camera follows ball
  updateCamera(ball.x, ball.y);
  
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
