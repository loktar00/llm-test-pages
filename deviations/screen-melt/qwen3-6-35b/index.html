<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Melt</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let columns = [];
        let currentColIndex = 0;
        let state = 'IDLE'; // IDLE, MELT, REVEAL, FADE
        let meltSpeed = 12;
        let holdTimer = 0;
        const HOLD_TIME = 120; // Frames to hold scene
        
        // Scene Generators
        const palettes = {
            city: ['#0a0a1a', '#1a1a3a', '#2a2a5a', '#000'],
            canyon: ['#2b1117', '#4a1c20', '#70282c', '#000'],
            matrix: ['#001100', '#003300', '#006600', '#000']
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initColumns();
            drawScene(0); // Draw initial background
        }

        function initColumns() {
            columns = [];
            const numCols = Math.ceil(width / 4); // 4px wide columns
            for (let i = 0; i < numCols; i++) {
                columns.push({
                    x: i * 4,
                    y: 0,
                    speed: 1 + Math.random() * 1.5, // Random speed
                    wobble: Math.random() * 1000, // Random phase offset
                    delay: Math.random() * 60 // Random stagger delay
                });
            }
        }

        // --- PROCEDURAL GENERATORS ---

        function drawCityScene(ctx, w, h, seed) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#0f0518');
            grad.addColorStop(1, '#2a1b3d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Sun/Moon
            ctx.beginPath();
            ctx.arc(w/2, h/2 + Math.sin(seed)*100, 60, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0055';
            ctx.fill();
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#ff0055';

            // Buildings
            let x = 0;
            while(x < w) {
                const bw = 20 + Math.random() * 60;
                const bh = 100 + Math.random() * 300;
                ctx.fillStyle = '#050510';
                ctx.fillRect(x, h - bh, bw, bh);
                
                // Windows
                ctx.fillStyle = Math.random() > 0.7 ? '#ffff00' : '#000';
                for(let wy = h - bh + 10; wy < h; wy += 15) {
                    for(let wx = x + 5; wx < x + bw - 5; wx += 10) {
                        if(Math.random() > 0.5) ctx.fillRect(wx, wy, 4, 8);
                    }
                }
                x += bw;
            }
            ctx.shadowBlur = 0;
        }

        function drawCanyonScene(ctx, w, h, seed) {
            // Sky
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#1a0505');
            grad.addColorStop(1, '#551a1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Sun
            ctx.beginPath();
            ctx.arc(w * 0.8, h * 0.2, 40, 0, Math.PI * 2);
            ctx.fillStyle = '#ffaa00';
            ctx.fill();

            // Top Canyon Walls
            ctx.fillStyle = '#3d1214';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            for(let x = 0; x <= w; x+=20) {
                ctx.lineTo(x, (Math.sin(x * 0.01 + seed) * 50) + 100);
            }
            ctx.lineTo(w, 0);
            ctx.fill();

            // Bottom Canyon Floor
            ctx.fillStyle = '#1a0505';
            ctx.beginPath();
            ctx.moveTo(0, h);
            for(let x = 0; x <= w; x+=20) {
                ctx.lineTo(x, (Math.cos(x * 0.02 + seed) * 80) + (h - 150));
            }
            ctx.lineTo(w, h);
            ctx.fill();
        }

        function drawMatrixScene(ctx, w, h, seed) {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            
            ctx.fillStyle = '#0f0';
            ctx.font = '14px monospace';
            
            const cols = Math.floor(w / 14);
            for(let i = 0; i < cols; i++) {
                // Random characters
                const char = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(char, i * 14, (Math.random() * h));
                
                // "Trail"
                if(Math.random() > 0.9) {
                    ctx.fillStyle = '#0f0';
                    ctx.fillText(char, i * 14, (Math.random() * h) + 20);
                    ctx.fillStyle = '#000';
                }
            }
        }

        const scenes = [
            { draw: drawCityScene, seed: Math.random() },
            { draw: drawCanyonScene, seed: Math.random() },
            { draw: drawMatrixScene, seed: Math.random() }
        ];

        function drawScene(index) {
            const scene = scenes[index % scenes.length];
            // Clear to black first
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            scene.draw(ctx, width, height, scene.seed);
        }

        // --- MAIN LOOP ---

        function update() {
            if (state === 'IDLE') {
                holdTimer++;
                if (holdTimer > HOLD_TIME) {
                    state = 'MELT';
                }
                requestAnimationFrame(update);
                return;
            }

            if (state === 'MELT') {
                let meltedCount = 0;
                let maxMelt = false;

                columns.forEach((col, i) => {
                    // Apply stagger
                    if (i < currentColIndex) {
                        // Already melted this column
                        // Logic handled by draw
                    } else if (i === currentColIndex) {
                        // Currently melting
                        col.y += col.speed + (Math.sin(col.wobble + Date.now() * 0.01) * 0.5);
                        col.wobble += 0.1;

                        if (col.y > height) {
                            currentColIndex++;
                            if (currentColIndex >= columns.length) {
                                maxMelt = true;
                            }
                        }
                    }
                });

                if (maxMelt) {
                    state = 'REVEAL';
                    // Prepare next scene
                    drawScene((scenes.indexOf(scenes.find(s => true)) + 1) % scenes.length); 
                    // Note: In this simple version, we just cycle the index. 
                    // The "underneath" is just the next scene drawn fully.
                    currentColIndex = 0;
                    holdTimer = 0;
                }

                requestAnimationFrame(update);
                return;
            }

            // Render Logic
            // 1. Draw the underlying (new) scene partially? 
            // No, standard melt effect: We draw the NEW scene, then mask the OLD scene on top.
            // But to do that efficiently in 2D canvas without layers:
            // We keep the NEW scene in the buffer.
            // We draw the OLD scene into the "holes" (where y > col.y).
            
            // Get current OLD scene (based on currentColIndex progress, we assume it's the one before the new one)
            // Actually, let's just track the scene index.
            
            // Re-evaluating flow:
            // 1. Draw New Scene (Background)
            // 2. Draw Old Scene where columns haven't melted yet.
            
            const currentSceneIndex = (scenes.length + 1) % scenes.length; // The "New" scene is currently at index 1 relative to start
            
            // Let's fix the scene indexing logic.
            // We have `scenes` array.
            // We need to know which one is "Old" and which is "New".
            // Since we rotate them:
            let oldSceneIndex = (scenes.length - 1) % scenes.length;
            let newSceneIndex = 0; 
            
            // To make it loop correctly with distinct scenes:
            // Let's just redraw the "Old" scene on top of the "New" scene in the cutouts.
            // We need to store the previous scene object.
            
            // Simplified approach:
            // 1. Fill with New Scene.
            // 2. Loop columns.
            //    - If column melted (x < currentColIndex * width/numCols): Skip (shows New Scene).
            //    - If column NOT melted: Draw Old Scene slice.
            
            // We need to know the index of the Old Scene.
            // Let's assume `sceneCounter` tracks the ID of the scene being displayed.
            // When melt finishes, we increment `sceneCounter` and redraw New Scene.
            
            // To keep it simple:
            // We have `scenes` array.
            // We just need to know which index is the "Active/Hidden" one and which is "Revealed".
            // Let's say we just generated scene[1]. It is now the background.
            // Scene[0] is the mask.
            
            // We need to track the previous scene index globally.
            if (typeof lastSceneIndex === 'undefined') lastSceneIndex = 0;
            const prevSceneIndex = lastSceneIndex;
            const currSceneIndex = (lastSceneIndex + 1) % scenes.length;

            // Draw Background (New Scene)
            scenes[currSceneIndex].draw(ctx, width, height, scenes[currSceneIndex].seed);

            // Draw Mask (Old Scene)
            // We need to draw the Old Scene, but only in the "intact" parts.
            // However, `drawScene` fills the whole rect. We can't easily draw "only" parts unless we use clipping or draw rects.
            // Drawing rects:
            
            ctx.save();
            // We draw the old scene column by column.
            // BUT, we only want to draw it where y > col.y.
            
            // Optimization: 
            // 1. Fill rects of the old scene for the "melted" holes? No, that's the new scene.
            // 2. Fill rects of the old scene for the "intact" tops.
            
            // Let's iterate columns.
            columns.forEach((col, i) => {
                // Determine if this column is "intact" (Old Scene) or "melted" (New Scene)
                // Note: currentColIndex is the count of fully melted columns.
                // So columns 0 to currentColIndex-1 are gone.
                // Column currentColIndex is melting.
                // Columns currentColIndex+1 to end are intact.
                
                let drawY = 0;
                let drawHeight = height;

                if (i < currentColIndex) {
                    // Already melted. New Scene is visible. Do nothing (background is already drawn).
                    return; 
                } 
                else if (i === currentColIndex) {
                    // Melting. 
                    // Draw Old Scene from 0 to col.y (Top part).
                    drawHeight = col.y;
                } 
                else {
                    // Intact. Draw Old Scene fully.
                    drawHeight = height;
                }

                // We need to draw the Old Scene content for this specific slice.
                // Since we don't have pixel buffers of the old scene, we must re-render the procedural function
                // but restricted to this column and height.
                
                // To avoid gaps, we use a small overlap
                const sliceW = 5; 
                const sliceX = col.x - 2;
                
                // Clip to this slice
                ctx.save();
                ctx.beginPath();
                ctx.rect(sliceX, 0, sliceW, drawHeight);
                ctx.clip();
                
                // Re-draw the Old Scene within this clip
                // We need to pass the same seed to get the same pattern
                scenes[prevSceneIndex].draw(ctx, width, height, scenes[prevSceneIndex].seed);
                
                ctx.restore();
            });
            ctx.restore();

            requestAnimationFrame(update);
        }

        // Start
        window.addEventListener('resize', resize);
        resize();
        
        // Start the loop
        requestAnimationFrame(update);

        // Helper to advance scenes when reveal happens
        // We need to hook into the REVEAL state change.
        // Since update is recursive, we can't easily call a function out of the loop without structure.
        // Let's modify the update loop slightly to handle the "Next Scene" logic.

        // Refined Update Structure to handle scene switching cleanly:
        let activeSceneIndex = 0;
        let isMelted = true; // Start melted so the first scene shows immediately? 
        // Actually, let's start with Scene 0.

        // Let's restart the logic cleanly inside the script to ensure robustness.
        
        let state = 'IDLE';
        let meltIdx = 0;
        let currentSceneIdx = 0;
        let nextSceneIdx = 1;
        
        // Reset resize to fix logic
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initColumns();
            // Initial draw
            drawScene(currentSceneIdx);
            state = 'IDLE';
            meltIdx = 0;
        }

        function loop() {
            if (state === 'IDLE') {
                holdTimer++;
                if (holdTimer > HOLD_TIME) {
                    state = 'MELT';
                    // Prepare next scene index
                    nextSceneIdx = (currentSceneIdx + 1) % scenes.length;
                }
                requestAnimationFrame(loop);
                return;
            }

            if (state === 'MELT') {
                // Update physics
                let allDone = true;
                columns.forEach((col, i) => {
                    if (i < meltIdx) {
                        // Already melted
                    } else if (i === meltIdx) {
                        // Melting
                        col.y += col.speed + (Math.sin(col.wobble + Date.now() * 0.01) * 0.5);
                        col.wobble += 0.1;
                        if (col.y > height) {
                            meltIdx++;
                        } else {
                            allDone = false;
                        }
                    } else {
                        allDone = false;
                    }
                });

                if (allDone) {
                    state = 'REVEAL';
                    // Swap scenes
                    currentSceneIdx = nextSceneIdx;
                    meltIdx = 0;
                    holdTimer = 0;
                    state = 'IDLE';
                }
                
                // Draw
                drawFrame();
                requestAnimationFrame(loop);
                return;
            }
            
            // IDLE state draw
            drawFrame();
            requestAnimationFrame(loop);
        }

        function drawFrame() {
            // 1. Draw the "New" scene (which is effectively the background for the old scene to melt off of)
            // Wait, if we are in IDLE or MELT, the "New" scene is the one that hasn't fully appeared yet?
            // No. 
            // Standard Melt: 
            // We have Scene A. We melt it to reveal Scene B.
            // So Scene B is the background. Scene A is the mask.
            
            // When IDLE (Scene A is up), draw Scene A.
            // When MELT (Scene A melting to reveal B), draw Scene B (bg) then Scene A (mask).
            // When IDLE (Scene B is up), draw Scene B.
            
            // Logic:
            // If state is IDLE (hold), we are displaying `currentSceneIdx`.
            if (state === 'IDLE') {
                drawScene(currentSceneIdx);
                return;
            }
            
            // If state is MELT, we are transitioning from `currentSceneIdx` (Old) to `nextSceneIdx` (New).
            // 1. Draw New Scene (Background)
            drawScene(nextSceneIdx);
            
            // 2. Draw Old Scene (Mask) on top of the "holes"
            // We iterate columns. If col is melted (i < meltIdx), we skip (showing New Scene).
            // If col is melting (i === meltIdx), we draw Old Scene slice from 0 to col.y.
            // If col is intact (i > meltIdx), we draw Old Scene slice fully.
            
            ctx.save();
            columns.forEach((col, i) => {
                let drawH = height;
                
                if (i < meltIdx) {
                    // Fully melted: New Scene is visible. Do nothing.
                    return;
                } else if (i === meltIdx) {
                    // Melting: Draw Old Scene top part
                    drawH = col.y;
                }
                
                // Draw slice of Old Scene
                const sliceW = 5; // Slightly wider than column step to prevent gaps
                const sliceX = col.x - 2;
                
                ctx.save();
                ctx.beginPath();
                ctx.rect(sliceX, 0, sliceW, drawH);
                ctx.clip();
                
                // Redraw Old Scene
                drawScene(currentSceneIdx);
                
                ctx.restore();
            });
            ctx.restore();
        }

        // Start
        window.addEventListener('resize', resize);
        resize();
        loop();

    </script>
</body>
</html>
