<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Cavern</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; }
canvas { display:block; width:100vw; height:100vh; cursor:pointer; }
.hint { position:fixed; bottom:14px; left:14px; color:rgba(255,255,255,0.35); font:11px/1.4 monospace; letter-spacing:0.1em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">CRYSTAL CAVERN · click anywhere to seed a new vein</div>
<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(2, window.devicePixelRatio || 1);
function resize(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    initCavern();
}
window.addEventListener('resize', () => resize());
resize();

// Palette - cool mineral/crystal tones
const ROCK_TOP = '#0a0e1a';
const ROCK_BOT = '#1a0e2a';
