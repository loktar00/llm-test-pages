<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Burn Away Reveal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let W, H;
        let imgData, burnMap, charMap;
        let cx, cy, radius, maxRadius;
        let sparks = [];
        let phase = 'burn';
        let burnSpeed = 3.5;
        let cycleDuration = 180;
        let frameCount = 0;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            init();
        }

        function init() {
            // Generate Background Pattern
            const bgCanvas = document.createElement('canvas');
            bgCanvas.width = W;
            bgCanvas.height = H;
            const bgCtx = bgCanvas.getContext('2d');
            generatePattern(bgCtx, W, H);

            // Create Image Data Buffer
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = W;
            tempCanvas.height = H;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(bgCanvas, 0, 0);
            imgData = tempCtx.getImageData(0, 0, W, H);

            // Initialize Burn Map (0 to 255)
            burnMap = new Uint8Array(W * H);
            // Initialize Char Map (0 to 1)
            charMap = new Float32Array(W * H);

            // Reset State
            cx = Math.random() * W;
            cy = Math.random() * H;
            radius = 0;
            maxRadius = Math.sqrt(cx * cx + cy * cy) + 50; // Ensure covers corners
            phase = 'burn';
            sparks = [];
            frameCount = 0;
        }

        function generatePattern(c, w, h) {
            // Procedural Abstract Art
            const grad = c.createLinearGradient(0, 0, w, h);
            const hue1 = Math.random() * 360;
            const hue2 = (hue1 + 180) % 360;
            grad.addColorStop(0, `hsl(${hue1}, 70%, 20%)`);
            grad.addColorStop(1, `hsl(${hue2}, 70%, 10%)`);
            c.fillStyle = grad;
            c.fillRect(0, 0, w, h);

            for (let i = 0; i < 15; i++) {
                c.beginPath();
                c.arc(Math.random() * w, Math.random() * h, Math.random() * 200 + 50, 0, Math.PI * 2);
                c.fillStyle = `hsla(${Math.random() * 360}, 60%, 40%, 0.2)`;
                c.fill();
            }
            
            // Grid lines for tech feel
            c.strokeStyle = 'rgba(255,255,255,0.05)';
            c.lineWidth = 2;
            for(let x=0; x<w; x+=50) { c.beginPath(); c.moveTo(x,0); c.lineTo(x,h); c.stroke(); }
            for(let y=0; y<h; y+=50) { c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke(); }
        }

        // Simple Perlin-ish noise for burn edge
        function noise(x, y) {
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function fbm(x, y) {
            let v = 0, a = 1, f = 1;
            for (let i = 0; i < 4; i++) {
                v += a * noise(x * f, y * f);
                f *= 2;
                a *= 0.5;
            }
            return v;
        }

        function update() {
            frameCount++;

            if (phase === 'burn') {
                radius += burnSpeed;
                
                // Update Burn Map
                const rSq = radius * radius;
                const rMinSq = (radius - 15) * (radius - 15);
                
                // Create new sparks
                if (frameCount % 2 === 0) {
                    const angle = Math.random() * Math.PI * 2;
                    const jitter = (Math.random() - 0.5) * 10;
                    const sx = cx + (radius + jitter) * Math.cos(angle);
                    const sy = cy + (radius + jitter) * Math.sin(angle);
                    if (sx > 0 && sx < W && sy > 0 && sy < H) {
                        sparks.push({
                            x: sx, y: sy,
                            vx: Math.cos(angle) * (Math.random() * 2 + 1),
                            vy: Math.sin(angle) * (Math.random() * 2 + 1) - 1,
                            life: 1.0
                        });
                    }
                }

                // Process pixels in a ring
                // Optimization: Only check pixels near the edge
                // We iterate x, check y range
                const minX = Math.max(0, Math.floor(cx - radius));
                const maxX = Math.min(W - 1, Math.ceil(cx + radius));
                
                for (let x = minX; x <= maxX; x++) {
                    const dx = x - cx;
                    const distSq = dx * dx;
                    // Y range check
                    const dyMax = Math.sqrt(Math.max(0, rSq - distSq));
                    const yMin = Math.max(0, Math.floor(cy - dyMax));
                    const yMax = Math.min(H - 1, Math.ceil(cy + dyMax));

                    for (let y = yMin; y <= yMax; y++) {
                        const dy = y - cy;
                        const dist = Math.sqrt(distSq + dy * dy);
                        
                        // Noise factor for irregular edge
                        const noiseVal = fbm(x * 0.05, y * 0.05);
                        const effectiveRadius = radius + (noiseVal - 0.5) * 15;

                        const idx = y * W + x;

                        if (dist < effectiveRadius) {
                            // Burned
                            burnMap[idx] = 255;
                            // Create char residue
                            if (charMap[idx] === 0) {
                                charMap[idx] = 1.0; // Fresh char
                            }
                        } else if (dist < effectiveRadius + 10) {
                            // Edge zone (smoke/sparks)
                            if (Math.random() < 0.1) {
                                burnMap[idx] = Math.max(burnMap[idx], 200);
                            }
                        }
                    }
                }

                if (radius > maxRadius) {
                    phase = 'clear';
                    frameCount = 0;
                }

            } else if (phase === 'clear') {
                // Fade out char and reset
                let totalChar = 0;
                for (let i = 0; i < burnMap.length; i++) {
                    if (charMap[i] > 0) {
                        charMap[i] -= 0.02;
                        if (charMap[i] < 0) charMap[i] = 0;
                    }
                    totalChar += charMap[i];
                    if (burnMap[i] === 255) burnMap[i] = 0; // Reset burn map
                }

                if (totalChar < 10) {
                    init();
                }
            }

            // Update Sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.vy += 0.05; // Gravity
                s.life -= 0.02;
                if (s.life <= 0) sparks.splice(i, 1);
            }
        }

        function draw() {
            // 1. Put the background pattern (revealed part)
            // We only put pixels where burnMap is fully burnt
            // For performance, we putImageData the whole buffer and composite
            
            const outputData = ctx.createImageData(W, H);
            const oD = outputData.data;
            const iD = imgData.data;

            for (let i = 0; i < burnMap.length; i++) {
                const pIdx = i * 4;
                const isBurned = burnMap[i] > 128;
                const charIntensity = charMap[i];

                if (isBurned) {
                    // Reveal Background
                    oD[pIdx] = iD[pIdx];
                    oD[pIdx + 1] = iD[pIdx + 1];
                    oD[pIdx + 2] = iD[pIdx + 2];
                    oD[pIdx + 3] = 255;
                } else {
                    // Keep Overlay (Black) + Char effect
                    // Base black overlay
                    let r = 0, g = 0, b = 0;
                    
                    // Add char residue color (dark brown/grey)
                    if (charIntensity > 0) {
                        r = 40 * charIntensity;
                        g = 20 * charIntensity;
                        b = 10 * charIntensity;
                    }
                    
                    oD[pIdx] = r;
                    oD[pIdx + 1] = g;
                    oD[pIdx + 2] = b;
                    oD[pIdx + 3] = 255;
                }
            }

            ctx.putImageData(outputData, 0, 0);

            // 2. Draw Burn Edge Glow
            // We iterate the burnMap again to draw the glowing edge
            // This is a slightly expensive pixel iteration but fast in JS
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            
            // Draw edge ring
            // We sample points along the calculated burn front
            const steps = 360;
            for (let i = 0; i < steps; i++) {
                const angle = (i / steps) * Math.PI * 2;
                const noiseVal = fbm(Math.cos(angle) * 20, Math.sin(angle) * 20);
                const r = radius + (noiseVal - 0.5) * 15;
                
                const ex = cx + r * Math.cos(angle);
                const ey = cy + r * Math.sin(angle);

                if (ex > 0 && ex < W && ey > 0 && ey < H) {
                    // Gradient for fire
                    const grad = ctx.createRadialGradient(ex, ey, 0, ex, ey, 15);
                    grad.addColorStop(0, 'rgba(255, 255, 200, 0.8)'); // White core
                    grad.addColorStop(0.2, 'rgba(255, 100, 0, 0.6)'); // Orange
                    grad.addColorStop(1, 'rgba(50, 0, 0, 0)'); // Fade
                    
                    ctx.fillStyle = grad;
                    ctx.fillRect(ex - 15, ey - 15, 30, 30);
                }
            }
            ctx.restore();

            // 3. Draw Sparks
            ctx.save();
            for (const s of sparks) {
                ctx.fillStyle = `rgba(255, ${Math.floor(150 * s.life)}, 0, ${s.life})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 1.5 * s.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        loop();

    </script>
</body>
</html>
