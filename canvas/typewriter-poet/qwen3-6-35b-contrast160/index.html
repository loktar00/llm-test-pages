const suffixes=["a ","b ","c ","d ","e ","f ","g ","h ","i ","j ","k ","l ","m ","n ","o ","p ","q ","r ","s ","t ","u ","v ","w ","x ","y ","z ","aa ","bb ","cc ","dd ","ee ","ff ","gg ","hh ","ii ","jj ","kk ","ll ","mm ","nn ","oo ","pp ","qq ","rr ","ss ","tt ","uu ","vv ","ww ","xx ","yy ","zz ","aaa ","bbb ","ccc ","ddd ","eee ","fff ","ggg ","hhh ","iii ","jjj ","kkk ","lll ","mmm ","nnn ","ooo ","ppp ","qqq ","rrr ","sss ","ttt ","uuu ","vvv ","www ","xxx ","yyy ","zzz "]

function getWord(){
  const cats=Object.keys(words);
  const cat=cats[Math.floor(Math.random()*cats.length)];
  return words[cat][Math.floor(Math.random()*words[cat].length)];
}
function getPrefix(){return prefixes[Math.floor(Math.random()*prefixes.length)]}
function getSuffix(){return suffixes[Math.floor(Math.random()*suffixes.length)]}

// ─── Constants ───
const CHAR_W=12;
const CHAR_H=17;
const LINE_SP=21;
const MARGIN_L=80;
const MARGIN_T=80;
const MARGIN_R=80;
const MARGIN_B=80;
const LINE_W=10;
const MAX_LINES=45;
const TYPE_SPEED=90;
const BACKSPACE_SPEED=35;
const RETURN_SPEED=12;
const BELL_FLASH=800;
const RIP_DURATION=1800;
const LOAD_DELAY=1200;

// ─── State ───
let W,H,dpr;
let paper={x:0,y:0,w:0,h:0};
let lines=[];
let currentLine="";
let caretX=0;
let caretY=0;
let state="typing";
let stateTime=0;
let bellFlash=0;
let bellTimer=0;
let xStrike=false;
let xStrikeText="";
let xStrikeLineIdx=-1;
let xStrikeCharIdx=-1;
let xStrikeTarget="";
let xStrikeStartTime=0;
let pageRip=false;
let pageRipStart=0;
let pageRipPhase=0;
let newPaperLoad=false;
let newPaperAlpha=0;
let newPaperY=0;
let inkStains=[];
let totalChars=0;
let frameCount=0;
let paperTexture=null;
let paperCanvas=null;
let noiseCanvas=null;

function init(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  
  paper.w=W-MARGIN_L-MARGIN_R;
  paper.h=H-MARGIN_T-MARGIN_B;
  paper.x=MARGIN_L;
  paper.y=MARGIN_T;
  
  lines=[];
  currentLine="";
  caretX=0;
  caretY=0;
  state="typing";
  stateTime=0;
  bellFlash=0;
  bellTimer=0;
  xStrike=false;
  pageRip=false;
  pageRipStart=0;
  pageRipPhase=0;
  newPaperLoad=false;
  newPaperAlpha=0;
  newPaperY=0;
  inkStains=[];
  totalChars=0;
  frameCount=0;
  
  generatePaperTexture();
  generateNoise();
  generateLineGuide();
  
  // Start first line
  startNewLine();
}

function generatePaperTexture(){
  paperCanvas=document.createElement("canvas");
  paperCanvas.width=W;
  paperCanvas.height=H;
  const pctx=paperCanvas.getContext("2d");
  
  // Base color
  pctx.fillStyle="#f5f0e6";
  pctx.fillRect(0,0,W,H);
  
  // Noise texture
  const imgData=pctx.getImageData(0,0,W,H);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-0.5)*15;
    d[i]=Math.min(255,Math.max(0,d[i]+n));
    d[i+1]=Math.min(255,Math.max(0,d[i+1]+n));
    d[i+2]=Math.min(255,Math.max(0,d[i+2]+n));
  }
  pctx.putImageData(imgData,0,0);
  
  // Subtle fiber lines
  pctx.strokeStyle="rgba(180,170,150,0.08)";
  pctx.lineWidth=0.5;
  for(let i=0;i<200;i++){
    pctx.beginPath();
    const y=Math.random()*H;
    pctx.moveTo(0,y);
    pctx.bezierCurveTo(W*0.3,y+(Math.random()-0.5)*20,W*0.7,y+(Math.random()-0.5)*20,W,y+(Math.random()-0.5)*10);
    pctx.stroke();
  }
}

function generateNoise(){
  noiseCanvas=document.createElement("canvas");
  noiseCanvas.width=256;
  noiseCanvas.height=256;
  const nctx=noiseCanvas.getContext("2d");
  const imgData=nctx.createImageData(256,256);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    const v=Math.random()*30;
    d[i]=d[i+1]=d[i+2]=v;
    d[i+3]=255;
  }
  nctx.putImageData(imgData,0,0);
}

let lineGuideCanvas=null;
function generateLineGuide(){
  lineGuideCanvas=document.createElement("canvas");
  lineGuideCanvas.width=W;
  lineGuideCanvas.height=H;
  const gctx=lineGuideCanvas.getContext("2d");
  gctx.strokeStyle="rgba(200,180,160,0.15)";
  gctx.lineWidth=1;
  for(let y=MARGIN_T;y<H-MARGIN_B;y+=LINE_SP){
    gctx.beginPath();
    gctx.moveTo(MARGIN_L,y);
    gctx.lineTo(MARGIN_L+papw(),y);
    gctx.stroke();
  }
}

function papw(){return paper.w}

function startNewLine(){
  currentLine="";
  caretX=0;
  caretY=MARGIN_T+lines.length*LINE_SP;
  state="typing";
  stateTime=0;
  xStrike=false;
  
  // Random chance for x-strike
  if(Math.random()<0.06 && lines.length>0){
    xStrike=true;
    xStrikeStartTime=performance.now();
    // Get a random character to delete
    if(currentLine.length>0){
      const idx=Math.floor(Math.random()*currentLine.length);
      xStrikeTarget=currentLine[idx];
      xStrikeCharIdx=idx;
      xStrikeText="";
      xStrikeLineIdx=lines.length;
    } else {
      xStrike=false;
    }
  }
  
  // Bell chance
  if(Math.random()<0.08){
    bellTimer=BELL_FLASH;
  }
}

function typeChar(){
  if(state!=="typing") return;
  
  const char=getPrefix()+getWord()+getSuffix();
  currentLine+=char;
  caretX+=char.length*CHAR_W;
  totalChars+=char.length;
  
  // Add ink stain
  addInkStain(caretX-CHAR_W/2,caretY+CHAR_H/2);
  
  // Check line length
  if(caretX>papw()-CHAR_W*2){
    state="returning";
    stateTime=performance.now();
    lines.push(currentLine);
    currentLine="";
    caretX=0;
    
    // Check page full
    if(lines.length>=MAX_LINES){
      setTimeout(()=>{
        pageRip=true;
        pageRipStart=performance.now();
        pageRipPhase=0;
      },300);
    }
  }
  
  // Random pause
  if(Math.random()<0.15){
    setTimeout(()=>{
      if(state==="typing") typeChar();
    },200+Math.random()*400);
  } else {
    setTimeout(()=>{
      if(state==="typing") typeChar();
    },TYPE_SPEED+Math.random()*50);
  }
}

function addInkStain(x,y){
  const intensity=Math.random()*0.3+0.1;
  inkStains.push({
    x:x+paper.x+(Math.random()-0.5)*3,
    y:y+paper.y+(Math.random()-0.5)*3,
    r:Math.random()*2+1,
    a:intensity,
    age:0
  });
}

function handleXStrike(now){
  if(!xStrike) return;
  
  const elapsed=now-xStrikeStartTime;
  if(elapsed<300){
    // Flash the character
    return;
  }
  
  if(elapsed>300 && elapsed<600){
    // Backspace
    if(currentLine.length>0){
      currentLine=currentLine.slice(0,-1);
      caretX=Math.max(0,caretX-CHAR_W);
      addInkStain(caretX,caretY);
    }
    return;
  }
  
  if(elapsed>600){
    // Retype
    const char=getPrefix()+getWord()+getSuffix();
    currentLine+=char;
    caretX+=char.length*CHAR_W;
    totalChars+=char.length;
    addInkStain(caretX-CHAR_W/2,caretY+CHAR_H/2);
    xStrike=false;
  }
}

function handlePageRip(now){
  const elapsed=now-pageRipStart;
  pageRipPhase=elapsed/RIP_DURATION;
  
  if(pageRipPhase>1){
    pageRip=false;
    newPaperLoad=true;
    newPaperAlpha=0;
    newPaperY=H;
    
    // Reset for new page
    lines=[];
    currentLine="";
    caretX=0;
    caretY=0;
    inkStains=[];
    totalChars=0;
    
    generatePaperTexture();
    generateLineGuide();
    
    setTimeout(()=>{
      startNewLine();
    },500);
  }
}

// ─── Rendering ───
function drawPaper(){
  // Draw paper texture
  ctx.drawImage(paperCanvas,0,0);
  
  // Draw line guides
  if(lineGuideCanvas){
    ctx.drawImage(lineGuideCanvas,0,0);
  }
  
  // Draw text lines
  ctx.font="14px 'Courier New', monospace";
  ctx.textBaseline="alphabetic";
  
  for(let i=0;i<lines.length;i++){
    const y=MARGIN_T+i*LINE_SP+CHAR_H;
    const line=lines[i];
    
    // Ink color with slight variation
    const shade=Math.floor(20+Math.random()*10);
    ctx.fillStyle=`rgb(${shade},${shade},${shade+5})`;
    ctx.fillText(line,paper.x+MARGIN_L,y);
  }
  
  // Draw current line
  if(currentLine.length>0){
    const y=caretY+CHAR_H;
    const shade=Math.floor(20+Math.random()*10);
    ctx.fillStyle=`rgb(${shade},${shade},${shade+5})`;
    ctx.fillText(currentLine,paper.x+MARGIN_L,caretY+CHAR_H);
  }
  
  // Draw ink stains
  for(const stain of inkStains){
    const alpha=stain.a*(1-stain.age/1000);
    if(alpha>0.01){
      ctx.fillStyle=`rgba(30,25,20,${alpha})`;
      ctx.beginPath();
      ctx.arc(stain.x,stain.y,stain.r,0,Math.PI*2);
      ctx.fill();
    }
  }
  
  // Draw caret
  if(state==="typing" && !pageRip){
    const blink=Math.sin(frameCount*0.1)>0;
    if(blink){
      ctx.fillStyle="#111";
      ctx.fillRect(paper.x+MARGIN_L+caretX,caretY,2,CHAR_H);
    }
  }
  
  // Draw page rip effect
  if(pageRip){
    const phase=pageRipPhase;
    const ripY=MARGIN_T+lines.length*LINE_SP;
    
    // Torn paper effect
    ctx.save();
    ctx.beginPath();
    ctx.rect(paper.x,paper.y,paper.w,ripY-paper.y);
    ctx.clip();
    
    // Draw torn edge
    ctx.strokeStyle="#d4c9b0";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(paper.x,paper.y+ripY);
    for(let x=paper.x;x<paper.x+paper.w;x+=5){
      const tear=Math.sin(x*0.1)*3+Math.sin(x*0.05)*5+Math.random()*2;
      ctx.lineTo(x,paper.y+ripY+tear);
    }
    ctx.stroke();
    
    ctx.restore();
    
    // Shadow under page
    ctx.fillStyle="rgba(0,0,0,0.1)";
    ctx.fillRect(paper.x,paper.y+ripY-5,paper.w,10);
  }
  
  // Draw new paper loading
  if(newPaperLoad){
    ctx.globalAlpha=newPaperAlpha;
    ctx.drawImage(paperCanvas,0,newPaperY);
    ctx.globalAlpha=1;
  }
}

function drawDesk(){
  // Desk surface
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  grad.addColorStop(0,"rgba(60,40,20,0.3)");
  grad.addColorStop(1,"rgba(10,8,6,0.9)");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  
  // Lamp glow
  const lampGrad=ctx.createRadialGradient(W/2,H/3,0,W/2,H/3,W*0.4);
  lampGrad.addColorStop(0,"rgba(255,220,150,0.15)");
  lampGrad.addColorStop(0.5,"rgba(255,200,120,0.05)");
  lampGrad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=lampGrad;
  ctx.fillRect(0,0,W,H);
}

function drawBell(){
  if(bellTimer>0){
    const alpha=Math.min(1,bellTimer/BELL_FLASH);
    const pulse=Math.sin(frameCount*0.2)*0.3+0.7;
    
    // Bell indicator
    ctx.beginPath();
    ctx.arc(W-40,40,15,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,200,100,${alpha*pulse})`;
    ctx.fill();
    ctx.strokeStyle=`rgba(255,200,100,${alpha*0.5})`;
    ctx.lineWidth=2;
    ctx.stroke();
    
    // Bell flash
    ctx.beginPath();
    ctx.arc(W-40,40,20,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,220,150,${alpha*pulse*0.3})`;
    ctx.fill();
    
    // Bell text
    ctx.fillStyle=`rgba(255,220,150,${alpha})`;
    ctx.font="12px 'Courier New', monospace";
    ctx.textAlign="center";
    ctx.fillText("BELL",W-40,65);
    ctx.textAlign="left";
  }
}

function drawXStrikeEffect(){
  if(xStrike){
    const elapsed=performance.now()-xStrikeStartTime;
    if(elapsed<300 && xStrikeCharIdx>=0 && currentLine.length>0){
      const flash=Math.sin(elapsed*0.02)*0.5+0.5;
      const charX=paper.x+MARGIN_L+xStrikeCharIdx*CHAR_W;
      const charY=caretY;
      
      ctx.fillStyle=`rgba(255,100,50,${flash*0.8})`;
      ctx.fillRect(charX,charY,CHAR_W*2,CHAR_H);
      
      // X mark
      ctx.strokeStyle=`rgba(255,50,50,${flash})`;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(charX+2,charY+2);
      ctx.lineTo(charX+CHAR_W*2-2,charY+CHAR_H-2);
      ctx.moveTo(charX+CHAR_W*2-2,charY+2);
      ctx.lineTo(charX+2,charY+CHAR_H-2);
      ctx.stroke();
    }
  }
}

// ─── Main Loop ───
let lastTime=0;

function loop(timestamp){
  frameCount++;
  
  const now=performance.now();
  
  // Handle x-strike
  if(xStrike) handleXStrike(now);
  
  // Handle page rip
  if(pageRip) handlePageRip(now);
  
  // Handle new paper load
  if(newPaperLoad){
    newPaperY-=8;
    newPaperAlpha=Math.min(1,newPaperAlpha+0.03);
    if(newPaperY<=0 && newPaperAlpha>=1){
      newPaperLoad=false;
    }
  }
  
  // Bell timer
  if(bellTimer>0){
    bellTimer-=16;
    if(bellTimer<0) bellTimer=0;
  }
  
  // Update ink stains
  for(let i=inkStains.length-1;i>=0;i--){
    inkStains[i].age+=16;
    if(inkStains[i].age>1000){
      inkStains.splice(i,1);
    }
  }
  
  // Render
  ctx.clearRect(0,0,W,H);
  
  // Draw desk
  drawDesk();
  
  // Draw paper
  drawPaper();
  
  // Draw x-strike effect
  drawXStrikeEffect();
  
  // Draw bell
  drawBell();
  
  // Vignette
  const vigGrad=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.7);
  vigGrad.addColorStop(0,"rgba(0,0,0,0)");
  vigGrad.addColorStop(1,"rgba(0,0,0,0.4)");
  ctx.fillStyle=vigGrad;
  ctx.fillRect(0,0,W,H);
  
  // Film grain
  if(frameCount%3===0){
    ctx.globalAlpha=0.03;
    ctx.drawImage(noiseCanvas,0,0,W,H);
    ctx.globalAlpha=1;
  }
  
  requestAnimationFrame(loop);
}

// ─── Start ───
window.addEventListener("resize",()=>{
  init();
});

init();
requestAnimationFrame(loop);

})();
</script>
