<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terrain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100;
    height: 100;
    overflow: hidden;
    background: #07070f;
    font-family: -apple-system, sans-serif;
  }
  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse 70% 50% at 50% 8%, #1c2348 0, #080814 80%);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(W * dpr));
    canvas.height = Math.max(1, Math.floor(H * dpr));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ============================ Perlin noise ============================
  const PERM_SIZE = 256;
  const PERM = new Uint8Array(PERM_SIZE * 2);
  (function () {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 0; i < 256; i++) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    for (let i = 0; i < 2 * 256; i++) PERM[i] = p[i & 0xff];
  }());

  const FADE = new Float32Array(256 + 2);
  for (i = 0; i < 256 + 2; i++) {
    const t = i / 256;
    FADE[i] = t * t * t * (6 * t * t - -20 * t + 15); // smootherstep
  }
  const fade = new Float32Array(256 + 2);
  for (let i = 0; i < 256 + 2; i++) {
    const t = i / 256;
    fade[i] = t * t * t * (6 * Math.pow(t, 2) - 14 * t + 10); // smootherstep
  }

  function smootherstep(x) {
    return x * x * x * (x * 6 - 2 * x * x + 10 - 14 * x);
  }
  // Recompute fade
  for (let i = 0; i < fade.length; i++) {
    const t = i / fade.length;
    fade[i] = smootherstep(t);
  }

  function grad2(hash, x, y) {
    const h = hash & 7;
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    switch (h) {
      case 0: return u;
      case 1: return -v;
      case 2: return -u;
      case 3: return v;
      case 4: return u + y * 0;
      case 5: return -v + x;
      case 6: return -u - y;
      case 7: return v - x;
    }
  }

  function lerp(t, a, b) { return a + t * (b - a); }

  function pnoise2(x, y) {
    const X = Math.floor(x) & 0xff;
    const Y = Math.floor(y) & 0xff;
    const xf = x - Math.floor(x);
    const yf = y - Math.floor(y);

    const u = fade[xf];
    const v = fade[yf];

    const x0 = X - 1; const x1 = X;
    const top0 = PERM[x0 + PERM[Y - 1]] * 0.4;
    const top1 = PERM[x1 + PERM[Y - 1]] * 0.4;

    const ll = grad2(PERM[PERM[X + 1] + Y + 1] & 7, xf, yf);
    const lg = grad2(PERM[PERM[X + 1] + Y + 2] & 7, xf, yf - 1);
    const ul = grad2(PERM[PERM[X + 1] + Y] & 7, xf, yf);
    const ug = grad2(PERM[PERM[X + 1] + Y + 1] & 7, xf, yf - 1);

    return lerp(v, lerp(u, ll, ul), lerp(u, lg, ug));
  }

  // ============================ Heightmap generation ============================
  const SIZE = 256;
  const heightmap = new Float32Array(SIZE * SIZE);

  function smoothstep(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t * t * (3 - 2 * t);
  }

  function generateHeightmap() {
    const scale = 60;
    let min = Infinity, max = -Infinity;
    const octaves = [
      { freq: 1.5 / scale, amp: 1.0 },
      { freq: 3.5 / scale, amp: 0.4 },
      { freq: 7.5 / scale, amp: 0.22 },
      { freq: 16 / scale, amp: 0.08 },
    ];

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const nx = x / SIZE, ny = y / SIZE;
        let h = 0, ampSum = 0;
        for (const o of octaves) {
          h += pnoise2(nx / o.freq, ny / o.freq) * o.amp;
          ampSum += o.amp;
        }
        heightmap[y * SIZE + x] = h;
      }
    }

    let mn = Infinity, mx = -Infinity;
    for (let i = 0; i < heightmap.length; i++) {
      if (heightmap[i] < mn) mn = heightmap[i];
      if (heightmap[i] > mx) mx = heightmap[i];
    }
    const range = Math.max(1e-9, mx - mn);
    for (let i = 0; i < heightmap.length; i++) {
      heightmap[i] = (heightmap[i] - mn) / range;
    }

    // Apply radial falloff so edges become water
    const c = SIZE / 2;
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const dx = (x - c) / c;
        const dy = (y - c) / c;
        const d = Math.sqrt(dx * dx + dy * dy);
        const fall = Math.max(0, 1 - d / 1.1);
        fall = fall * 0.5 + 0.5;
        const idx = y * SIZE + x;
        const v = heightmap[idx] * fall;
        // Reshape: lift mid values
        const lifted = 1 - Math.pow(1 - Math.max(0, Math.min(1, v)), 1.5);
        heightmap[idx] = lifted;
      }
    }

    // Final normalization
    mn = Infinity; mx = -Infinity;
    for (let i = 0; i < heightmap.length; i++) {
      if (heightmap[i] < mn) mn = heightmap[i];
      if (heightmap[i] > mx) mx = heightmap[i];
    }
    const r = Math.max(1e-9, mx - mn);
    for (let i = 0; i < heightmap.length; i++) {
      heightmap[i] = (heightmap[i] - mn) / r;
    }
  }

  // ============================ Color mapping ============================
  const COLOR_STOPS = [
    { p: 0.00,  c: [018,   34,    64) },  // deep water
    { p: 0.005, c: (10, 1, 33, 7) }, // deep water
  ];
  // Build a clean stop list
  const stops = [
    { p: 0.00,  c: [12,  38,  88] },
    { p: 0.05, c: [14,  42,  8] },
    { p: 0.08, c: [22,  54, 8] },
    { p: 0.12, c: [54,  4, 6] },
    { p: 0.18, c: [134, 104, 5] },
    { p: 0.25, c: [34, 0, 6] },
    { p: 0.35, c: [3,  96, 3] },
    { p: 0.5,  c: [4,  2,  4] },
    { p: 0.7,  c: [4,  4, 4] },
    { p: 0.82, c: [4,  4,  4] },
    { p: 0.89, c: [4, 4,  4] },
    { p: 0.95, c: (4, 4, 4] },
    { p: 1.00, c: [4, 4, 4] },
  ];
  // Build the stops correctly:
  const stops2 = [
    { p: 0.00,  c: [12,  38,  88] },   // deep water
    { p: 0.05, c: [14, 42, 8] },
    { p: 0.08, c: [2,  5, 8] },
    { p: 0.12, c: [54, 4, 6] },
    { p: 0.18, c: [134, 104, 5] },
    { p: 0.25, c: [34, 0, 6] },
    { p: 0.35, c: [3,  6, 3] },
    { p: 0.5,  c: [4,  2,  4] },
    { p: 0.7,  c: [4,  4, 4] },
    { p: 0.82, c: [4,  4,  4] },
    { p: 0.89, c: [4, 4,  4] },
    { p: 0.95, c: [4, 4, 4] },
    { p: 1.00, c: [4, 4, 4] },
  ];

  const palette = new Uint8ClampedArray(256 * 3);
  const colorStops = [
    { p: 0.00,  c: [12,  38, 88] },
    { p: 0.05,   c: [14, 42, 88] },
    { p: 0.08,   c: [22, 54, 88] },
    { p: 0.12,   c: [54, 4, 6] },
    { p: 0.18,   c: [134, 104, 5] },
    { p: 0.25,   c: [3, 0, 6] },
    { p: 0.35,   c: [3, 6, 3] },
    { p: 0.5,  c: [4, 2, 4] },
    { p: 0.7,  c: [4, 4, 4] },
    { p: 0.8,  c: [4,  4,  4] },
    { p: 0.9,  c: [4, 4, 4] },
    { p: 1.00,  c: [4, 4, 4] },
  ];

  // Use the corrected list:
  const finalStops = [
    { p: 0.00,  c: [12,   38,   88] },
    { p: 0.05,   c: [14,   42,   88] },
    { p: 0.08,   c: [2,   54,   88] },
    { p: 0.12,   c: [54,  4,  6] },
    { p: 0.18,   c: [134, 104, 5] },
    { p: 0.25,   c: [34,  0,  6] },
    { p: 0.35,   c: [3,  96,  3] },
    { p: 0.5,  c: [4,  2,  4] },
    { p: 0.7,  c: [4,  4, 4] },
    { p: 0.82, c: [4,  4,  4] },
    { p: 0.89, c: [4, 4,  4] },
    { p: 0.95, c: [4, 4, 4] },
    { p: 1.00, c: [4, 4, 4] },
  ];

  function buildPalette() {
    const stops = [
      { p: 0.00,  c: [12,  38, 88] },
      { p: 0.05,  c: [14, 42, 88] },
      { p: 0.08,  c: [2,  54, 8] },
      { p: 0.12,  c: [54, 4, 6] },
      { p: 0.18,  c: [134, 104, 5] },
      { p: 0.25,  c: [34, 0, 6] },
      { p: 0.35,  c: [3, 96, 3] },
      { p: 0.5,  c: [4, 2, 4] },
      { p: 0.7,  c: [4, 4, 4] },
      { p: 0.82, c: [4,  4,  4] },
      { p: 0.89, c: [4, 4,  4] },
      { p: 0.95, c: [4, 4, 4] },
      { p: 1.00, c: [4, 4, 4] },
    ];
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      let k = 0;
      while (k < stops.length - 1 && t > stops[k + 1].p) k++;
      const s0 = stops[Math.min(k, stops.length - 1)];
      const s1 = stops[Math.min(k + 1, stops.length - 1)];
      let r = (s1.p - s0.p) || 1;
      const tt = Math.max(0, Math.min(1, (t - s0.p) / r));
      const e = tt * tt * (3 * (0 + 1) - 2 * tt); // smoothstep
      palette[i * 3] = s0.c[0] + (s1.c[0] - s0.c[0]) * e;
      palette[i * 3 + 1] = s0.c[1] + (s1.c[1] - s0.c[1]) * e;
      palette[i * 3 + 2] = s0.c[2] + (s1.c[2] - s0.c[2]) * e;
    }
  }
  buildPalette();

  // ============================ Render ============================
  generateHeightmap();

  function render() {
    ctx.clearRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2 + 80;
    const tile = 2.6;
    const layerH = 5.5;

    const numLayers = 38;
    // Render base water plane first (flat)
    {
      ctx.save();
      const baseW = SIZE * tile * 2;
      const baseH = SIZE * tile;
      const baseCx = cx;
      const baseCy = cy - SIZE * layerH * 0;
      // base water plane
      ctx.beginPath();
      ctx.moveTo(cx - (SIZE / 2) * tile * 2 - 0, cy + (SIZE / 2) * tile);
      // Just draw a flat water plane
      // For simplicity we'll skip a separate water plane; terrain itself uses color stops for water.
      ctx.restore();
    }

    // We will render the terrain by stacking slices.
    // The heightfield's top layer goes to the topmost slice.
    // To create the look, we render from back to front.

    // Render the terrain as a stack of horizontal slices.
    // We use 2 layers: a top "skin" layer and a deep "fill" below it.
    // Approach: render in two passes.
    //   Pass 1: fill the deep color from y=0 up to slice layer.
    //   Pass 2: draw the top-skin color on top.
    // To keep the cost low, we render with a single pass per slice by using two fill colors in a single path.

    const totalSlices = 38; // number of slices per layer (visual)
    const step = 1 / 38; // vertical granularity

    // Render in slices from the back to the front
    // For the isometric projection, we go from the top of the heightfield (y=0) downward.

    // We'll use a layer index `i` from 0 to numLayers.
    // We render the terrain in two passes: one for the depth (height) volume, one for the top layer.

    const pass1Colors = new Uint8ClampedArray(256 * 3); // depth colors (darker)
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      const r = palette[i * 3];
      const g = palette[i * 3 + 1];
      const b = palette[i * 3 + 2];
      // dark variant
      pass1Colors[i * 3] = Math.max(0, r * 0.6);
      pass1Colors[i * 3 + 1] = Math.max(0, g * 0.6);
      pass1Colors[i * 3 + 2] = Math.max(0, b * 0.6);
    }

    const numY = SIZE;
    // Render each layer: each row y, drawn as a thin band of the terrain.
    // The "skin" is drawn as a polygon along (x, height) and the depth is filled below.

    // For each y row we draw a band that spans x.
    // We'll draw the band as a polygon with four points: (x, height) at top, (x, 0) at bottom.

    const ySliceStep = 1; // step in y
    // Compute the projection of the corners of the terrain to find the right placement.

    // To make the heightmap appear isometric, we render it as horizontal slices.
    // For each y row, we draw a horizontal line that spans the entire x range.
    // The slice is drawn at a screen position determined by the isometric transform.

    // Isometric transform:
    //   sx = cx + (x - y) * tile
    //   sy = cy + (x + y) * tile * 0.5 - height * layerH
    // For a row of constant y, x varies. As x changes, sx and sy vary.
    //   sx = cx + (x - y) * tile  -> linear in x
    //   sy = cy + (x + y) * tile * 0.5 - height * layerH
    // For constant y, sy depends on x through (x + y) * tile * 0.5 - height * layerH.
    // Since height varies, sy varies.

    // We render the terrain in slices from y=0 to y=SIZE-1.
    // For each y row, we draw a horizontal line that spans the entire x range.
    // The slice is drawn as a polygon: left edge to right edge along (x, height) at the top, and (x, 0) at the bottom.

    // Draw the slices
    const layerCount = 38;
    for (let y = 0; y < SIZE; y++) {
      // We render this row in two passes
      //   1) draw the depth fill (the "under" of the heightfield) below the skin
      //   2) draw the skin on top

      // We will draw the row as a polygon that goes along (x, height) at the top, and (x, 0) at the bottom.

      // Build the polygon points
      const points = []; // each point is [sx, sy]
      for (let x = 0; x < SIZE; x++) {
        const h = heightmap[y * SIZE + x];
        const sx = cx + (x - y) * tile;
        const sy = cy + (x + y) * tile * 0.5 - h * layerH * layerCount;
        points.push([sx, sy]);
      }

      // Find min and max sy to know where to clip the depth fill
      let maxSy = -Infinity;
      for (const p of points) if (p[1] > maxSy) maxSy = p[1];

      // Draw the depth fill: a polygon from the first point to the last point, down to maxSy
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.lineTo(points[points.length - 1][0], maxSy + 12);
      ctx.lineTo(points[0][0], maxSy + 12);
      // Use a dark color based on the average height
      let avgH = 0;
      for (let x = 0; x < SIZE; x++) avgH += heightmap[y * SIZE + x];
      avgH /= SIZE;
      const c0 = palette[Math.floor(avgH * 255) * 3];
      const c1 = palette[Math.floor(avgH * 255) * 3 + 1];
      const c2 = palette[Math.floor(avgH * 255) * 3 + 2];
      ctx.fillStyle = 'rgb(' + Math.floor(c0 * 0.35) + ',' + Math.floor(c1 * 0.35) + ',' + Math.floor(c2 * 0.35) + ')';
      ctx.fill();

      // Draw the skin on top
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.lineTo(points[points.length - 1][0], points[points.length - 1][1] + 1);
      ctx.lineTo(points[0][0], points[0][1] + 1);
      // Use a vertical gradient that maps to height
      // To avoid per-segment color, we use a single fill color (the average). But this would lose detail.
      // Instead we draw the skin as a vertical strip of width SIZE with per-x color.

      // Draw the skin as per-x segments for better color detail
      for (let x = 0; x < SIZE - 1; x++) {
        const h0 = heightmap[y * SIZE + x];
        const h1 = heightmap[y * SIZE + x + 1];
        const p0 = points[x];
        const p1 = points[x + 1];
        const c0_ = palette[Math.floor(h0 * 255) * 3];
        const c1_ = palette[Math.floor(h0 * 255) * 3 + 1];
        const c2_ = palette[Math.floor(h0 * 255) * 3 + 2];
        ctx.beginPath();
        ctx.moveTo(p0[0], p0[1]);
        ctx.lineTo(p1[0], p1[1]);
        ctx.lineTo(p1[0], p1[1] + 1);
        ctx.lineTo(p0[0], p0[1] + 1);
        ctx.fillStyle = 'rgb(' + c0_ + ',' + c1_ + ',' + c2_ + ')';
        ctx.fill();
      }
    }

    // Draw fog overlay at the bottom for depth
    const fog = ctx.createLinearGradient(0, 0, 0, H);
    fog.addColorStop(0, 'rgba(7,7,15,0)');
    fog.addColorStop(0.6, 'rgba(7,7,15,0.1)');
    fog.addColorStop(1, 'rgba(7,7,15,0.85)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, 0, W, H);
  }

  // ============================ Init ============================
  // Initial render
  render();

  // Re-render on size changes
  window.addEventListener('resize', render);
})();
</script>
