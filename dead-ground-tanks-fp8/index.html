(function(){

var PI=Math.PI, TAU=PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function wrapA(a){a=a%TAU; if(a>PI)a-=TAU; if(a<-PI)a+=TAU; return a;}
function angLerp(a,b,t){return a+wrapA(b-a)*t;}
function dist2(ax,ay,bx,by){var dx=bx-ax,dy=by-ay;return dx*dx+dy*dy;}
function mulberry32(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;
 var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
 return((t^t>>>14)>>>0)/4294967296;};}
function mkc(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function R(g,c,x,y,w,h){g.fillStyle=c;g.fillRect(x,y,w,h);}
function px(g,c,x,y){g.fillStyle=c;g.fillRect(x,y,1,1);}
function pdisc(g,c,cx,cy,r){g.fillStyle=c;for(var dy=-r;dy<=r;dy++){var w=Math.floor(Math.sqrt(r*r-dy*dy));if(w<1)continue;g.fillRect(cx-w,cy+dy,w*2,1);} }
// ------------------------------------------------------------------ pixel font 5x7

function warn(where,e){errCount++;if(errCount<40){try{console.warn('[deadground] recovered from '+where+' error:',e&&(e.message||e));}catch(_){}} }
// ------------------------------------------------------------------ audio
var Sound=(function(){
var C=null,master=null,NB=null,echoIn=null,started=false,musTimer=0,stepN=0,nextT=0,bpm=84;
var eng={on:false};
function init(){
 if(C)return;
 try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;C=new AC();}catch(e){return;}
 try{
 master=C.createGain();master.gain.value=0.5;master.connect(C.destination);
 NB=C.createBuffer(1,Math.floor(C.sampleRate*2),C.sampleRate);
 var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 echoIn=C.createGain();echoIn.gain.value=0.4;
 var dl=C.createDelay(0.5);dl.delayTime.value=0.21;
 var fb=C.createGain();fb.gain.value=0.38;
 var lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1900;
 echoIn.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(lp);lp.connect(master);
 startEngine();
 started=true;
 var h=document.getElementById('hint');
 if(h){h.textContent='SOUND ON';setTimeout(function(){try{h.style.opacity='0';}catch(e){}},1400);}
 }catch(e){C=null;}
}
function ok(){return C&&started&&C.state!=='closed';}
function nz(dur,type,freq,q,gain,dest){
 if(!ok())return;var t=C.currentTime;
 var s=C.createBufferSource();s.buffer=NB;s.loop=true;
 s.playbackRate.value=0.8+Math.random()*0.4;
 var f=C.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1000;if(q)f.Q.value=q;
 var gn=C.createGain();gn.gain.setValueAtTime(gain||0.3,t);
 gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(gn);gn.connect(dest||master);
 s.start(t);s.stop(t+dur+0.02);return{gn:gn,f:f};
}
function tone(type,f0,f1,dur,gain,dest,when){
 if(!ok())return;var t=(when||C.currentTime);
 var o=C.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);
 if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
 var gn=C.createGain();gn.gain.setValueAtTime(0.0001,t);
 gn.gain.exponentialRampToValueAtTime(gain,t+0.008);
 gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(gn);gn.connect(dest||master);o.start(t);o.stop(t+dur+0.02);
}
function startEngine(){
 eng.o=C.createOscillator();eng.o.type='sawtooth';eng.o.frequency.value=40;
 eng.o2=C.createOscillator();eng.o2.type='sine';eng.o2.frequency.value=27;
 eng.f=C.createBiquadFilter();eng.f.type='lowpass';eng.f.frequency.value=260;eng.f.Q.value=2;
 eng.g=C.createGain();eng.g.gain.value=0.0;
 eng.o.connect(eng.f);eng.o2.connect(eng.f);eng.f.connect(eng.g);eng.g.connect(master);
 eng.o.start();eng.o2.start();
 eng.tnz=C.createBufferSource();eng.tnz.buffer=NB;eng.tnz.loop=true;
 eng.tf=C.createBiquadFilter();eng.tf.type='bandpass';eng.tf.frequency.value=780;eng.tf.Q.value=2.6;
 eng.tg=C.createGain();eng.tg.gain.value=0;
 eng.lfo=C.createOscillator();eng.lfo.type='square';eng.lfo.frequency.value=4;
 eng.lg=C.createGain();eng.lg.gain.value=0.05;
 eng.lfo.connect(eng.lg);eng.lg.connect(eng.tg.gain);
 eng.tnz.connect(eng.tf);eng.tf.connect(eng.tg);eng.tg.connect(master);
 eng.tnz.start();eng.lfo.start();
}
function engineSet(throttle,speed,alive){
 if(!ok())return;var t=C.currentTime;
 var tgt=alive?(0.028+throttle*0.05):0;
 eng.g.gain.setTargetAtTime(tgt,t,0.1);
 eng.o.frequency.setTargetAtTime(38+throttle*24+speed*0.10,t,0.15);
 eng.o2.frequency.setTargetAtTime(24+throttle*8,t,0.2);
 eng.lfo.frequency.setTargetAtTime(2.2+speed*0.05,t,0.1);
 eng.tg.gain.setTargetAtTime(alive?Math.min(0.075,speed*0.0011+throttle*0.014):0,t,0.12);
}
function whine(on){
 if(!ok())return;var t=C.currentTime;
 if(on&&!eng.w){eng.w=C.createOscillator();eng.w.type='square';eng.w.frequency.value=540;
  eng.wf=C.createBiquadFilter();eng.wf.type='bandpass';eng.wf.frequency.value=1100;eng.wf.Q.value=6;
  eng.wg=C.createGain();eng.wg.gain.value=0;eng.w.connect(eng.wf);eng.wf.connect(eng.wg);eng.wg.connect(master);eng.w.start();}
 if(eng.w)eng.wg.gain.setTargetAtTime(on?0.014:0,t,0.06);
}
// ---- music: sparse cold drum + low brass
var bassSeq=[55.0,43.65,49.0,43.65];
function schedule(){
 if(!ok())return;var t=C.currentTime;
 while(nextT<t+0.4){
  var s=stepN%32,bar=(stepN/32|0);
  var spb=60/bpm/2; // eighth notes
  if(s===0||s===10||s===16||s===26) kick(nextT);
  if(s===8||s===24) snare(nextT);
  if(s%4===2) tick(nextT);
  if(s===0){brass(nextT,bassSeq[bar%4]);}
  nextT+=spb;stepN++;
 }
}
function kick(t){tone('sine',120,40,0.22,0.20,master,t);}
function snare(t){nzAt(t,0.14,'bandpass',1500,1.2,0.10);tone('triangle',190,120,0.1,0.05,master,t);}
function tick(t){nzAt(t,0.03,'highpass',6000,0.7,0.02);}
function nzAt(t,dur,type,freq,q,gain){
 if(!ok())return;var s=C.createBufferSource();s.buffer=NB;s.loop=true;
 var f=C.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
 var gn=C.createGain();gn.gain.setValueAtTime(gain,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(gn);gn.connect(master);s.start(t);s.stop(t+dur+0.02);
}
function brass(t,f0){
 if(!ok())return;
 var fs=[f0,f0*1.5,f0*2.02];
 for(var i=0;i<3;i++){
  var o=C.createOscillator();o.type='sawtooth';o.frequency.value=fs[i]*(1+(i-1)*0.004);
  var f=C.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(180,t);
  f.frequency.linearRampToValueAtTime(330,t+1.4);
  var g=C.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.020,t+1.5);g.gain.linearRampToValueAtTime(0.0001,t+3.4);
  o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+3.6);
 }
}
function startMusic(){if(!ok())return;nextT=C.currentTime+0.1;stepN=0;if(!musTimer)musTimer=setInterval(function(){try{schedule();}catch(e){}},60);}
var api={
 init:function(){init();if(ok())startMusic();if(C&&C.state==='suspended'){try{C.resume();}catch(e){}}},
 engineSet:engineSet, whine:whine,
 shot:function(){if(!ok())return;var t=C.currentTime;
  nz(0.5,'lowpass',520,0,0.85);nz(0.18,'highpass',1400,0,0.4);
  tone('sine',85,28,0.42,0.7);
  if(echoIn){var s=C.createBufferSource();s.buffer=NB;s.loop=true;
   var f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=800;
   var g=C.createGain();g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
   s.connect(f);f.connect(g);g.connect(echoIn);s.start(t);s.stop(t+0.3);}},
 mg:function(){if(!ok())return;nz(0.05,'bandpass',1700+Math.random()*700,1.5,0.30);tone('square',150+Math.random()*60,60,0.03,0.06);},
 clunk:function(){if(!ok())return;nz(0.07,'bandpass',420,4,0.4);tone('square',170,90,0.06,0.12);},
 ric:function(){if(!ok())return;var t=C.currentTime;tone('sine',2400,900,0.30,0.25);if(echoIn)tone('sine',2400,900,0.28,0.20,echoIn,t);},
 hit:function(){if(!ok())return;nz(0.12,'bandpass',600,2,0.5);tone('sine',110,40,0.15,0.3);},
 boom:function(big){if(!ok())return;var t=C.currentTime;
  nz(big?0.9:0.45,'lowpass',big?340:520,0,big?0.9:0.6);
  tone('sine',big?95:70,big?24:32,big?0.6:0.35,big?0.75:0.45);
  if(big&&echoIn){nz(0.5,'lowpass',300,0,0.5,echoIn);}},
 collapse:function(){if(!ok())return;nz(0.55,'bandpass',260,1.4,0.55);nz(0.35,'lowpass',140,0,0.4);
  for(var i=0;i<4;i++)nz(0.06+Math.random()*0.08,'bandpass',500+Math.random()*800,3,0.2);},
 whoosh:function(){if(!ok())return;var r=nz(0.55,'bandpass',500,1.5,0.35);
  try{r.f.frequency.setValueAtTime(500,C.currentTime);r.f.frequency.exponentialRampToValueAtTime(1900,C.currentTime+0.5);}catch(e){}},
 whistle:function(dur){if(!ok())return;var t=C.currentTime;
  var o=C.createOscillator();o.type='triangle';o.frequency.setValueAtTime(1500,t);
  o.frequency.exponentialRampToValueAtTime(320,t+dur);
  var g=C.createGain();g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.09,t+0.1);g.gain.setValueAtTime(0.09,t+dur-0.1);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);},
 ice:function(){if(!ok())return;nz(0.06,'bandpass',1100,5,0.4);
  setTimeout(function(){try{nz(0.09,'bandpass',750,4,0.35);}catch(e){}},70);
  setTimeout(function(){try{nz(0.13,'lowpass',300,0,0.4);}catch(e){}},160);},
 splash:function(){if(!ok())return;nz(0.5,'bandpass',500,1,0.4);},
 pickup:function(){if(!ok())return;tone('square',520,0,0.07,0.12);setTimeout(function(){try{tone('square',780,0,0.09,0.12);}catch(e){}},80);},
 flare:function(){if(!ok())return;tone('square',440,0,0.15,0.08);setTimeout(function(){try{tone('square',660,880,0.4,0.09);}catch(e){}},140);},
 over:function(){if(!ok())return;tone('sawtooth',110,28,1.6,0.25);tone('sawtooth',73,20,1.8,0.2);},
 fanfare:function(){if(!ok())return;var n=[220,262,330,440];for(var i=0;i<4;i++)(function(i){setTimeout(function(){try{tone('square',n[i],0,0.25,0.10);}catch(e){}},i*160);})(i);}
};
return api;
})();

// ------------------------------------------------------------------ sprite stacks
// Each object = list of flat pixel-art slices. A slice is drawn rotated by
// (heading-cameraAngle) and shifted up 1px per slice -> pseudo-3D stack.
var ART={},stCache={},stackCount=0;
function art(name,w,h,st,fns){ART[name]={w:w,h:h,st:st,s:fns};}
function stack(name,ang){
 var a=ART[name];if(!a)return null;
 var i=Math.round((wrapA(ang)+PI)/TAU*a.st)%a.st;
 var k=name+'|'+i,c=stCache[k];
 if(!c){
  var m=8,n=a.s.length;
  c={c:mkc(a.w+m*2,a.h+m*2+n+4)};
  var g=c.c.getContext('2d');g.imageSmoothingEnabled=false;
  c.cx=c.c.width/2;c.cy=c.c.height/2-1;
  var A=-PI+i*TAU/a.st;
  for(var s=0;s<n;s++){
   g.save();g.translate(c.cx,c.cy-s);g.rotate(A);
   try{a.s[s](g);}catch(e){warn('art',e);}
   g.restore();
  }
  if(stackCount<4200){stCache[k]=c;stackCount++;}
 }
 return c;
}
function drawStack(name,x,y,ang){
 var s=stack(name,ang);if(!s)return;
 ctx.drawImage(s.c,Math.round(x-s.cx*Z),Math.round(y-s.cy*Z),s.c.width*Z,s.c.height*Z);
}
// pre-rendered soft shadow blobs
function blob(r,a){
 var c=mkc(r*2+2,r*2+2),g=c.getContext('2d');
 for(var dy=-r;dy<=r;dy++){var t=dy/r;var w=Math.sqrt(Math.max(0,1-t*t))*r;
  g.fillStyle='rgba(4,7,12,'+(a*(1-Math.abs(t)*0.55)).toFixed(3)+')';
  g.fillRect(Math.round(1+r-w),Math.round(1+r+dy),Math.round(w*2)||1,1);}
 return c;
}
var SHADOW={};
function mkShadow(n,r,a){SHADOW[n]=blob(r,a);}
// ------------------------------------------------------------------ player tank
art('phull',22,16,36,[
 function(g){ // tracks (bottom slice)
  R(g,P.trk,-9,-7,18,3);R(g,P.trk,-9,4,18,3);
  for(var x=-8;x<8;x+=3){R(g,P.trkL,x,-6,2,1);R(g,P.trkL,x,5,2,1);}
  R(g,'#93a4b8',-9,-7,4,1);R(g,'#93a4b8',5,6,4,1);R(g,'#93a4b8',-2,6,3,1);
 },
 function(g){ // lower hull
  R(g,P.hullD,-8,-5,16,10);
  R(g,P.hull,5,-4,3,8);R(g,P.hullD,7,-3,1,6);
  R(g,'#2c332d',-9,-5,2,1);R(g,'#2c332d',-9,4,2,1);
 },
 function(g){ // upper hull + snow + headlights

function houseArt(hw,hh){

  for(var i=0;i<w*h/40;i++){var x=(-w/2+3+((rr()*(w-6))|0))|0,y=(-h/2+3+((rr()*(h-6))|0))|0;
   px(g,rr()<0.5?'#2c2932':'#1b191f',x,y);}}
 function wall(g,holes){
  var t=3,x,y;
  R(g,'#3f4652',-w/2,-h/2,w,t);R(g,'#3f4652',-w/2,h/2-t,w,t);
  R(g,'#3f4652',-w/2,-h/2,t,h);R(g,'#3f4652',w/2-t,-h/2,t,h);
  px(g,'#000',0,0);
  for(var i=0;i<holes;i++){var a=i/holes*TAU+0.7;
   var cx=Math.cos(a),cy=Math.sin(a);
   if(Math.abs(cx)>Math.abs(cy)){R(g,'#12151c',cx>0?w/2-t:-w/2,Math.round(Math.sin(a)*h*0.3)-1,t,2);}
   else{R(g,'#12151c',Math.round(Math.cos(a)*w*0.3)-1,cy>0?h/2-t:-h/2,2,t);}}
 }
 function wallTop(g){
  R(g,'#59626f',-w/2,-h/2,w,2);R(g,'#59626f',-w/2,h/2-2,w,2);
  R(g,'#525b68',-w/2,-h/2,2,h);R(g,'#525b68',w/2-2,-h/2,2,h);
  var rr=mulberry32(hw*13+hh*5);
  for(var i=0;i<w/3;i++){px(g,P.snow,(-w/2+((rr()*w)|0))|0,(-h/2+((rr()<0.5?0:h-1))));}
 }
 function roof(g){
  var rr=mulberry32(hw*3+hh*11);
  R(g,'#453b31',-w/2+1,-h/2+1,w-2,h-2);

function glowCanvas(r,col,mid){
 var c=mkc(r*2+2,r*2+2),g=c.getContext('2d');
 for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++){
  var d=Math.sqrt(dx*dx+dy*dy)/r;if(d>1)continue;
  var a=(1-d)*(1-d)*(1-d);
  g.fillStyle='rgba('+col+','+(a*(mid||1)).toFixed(3)+')';
  g.fillRect(r+1+dx,r+1+dy,1,1);}
 return c;
}

function card(title,tcol,lines){
 ctx.fillStyle='rgba(5,8,13,0.62)';ctx.fillRect(0,0,BW,BH);
 txt(ctx,title,BW/2-txtW(title,4)/2,58,tcol,4,1);
 for(var i=0;i<lines.length;i++)
  txt(ctx,lines[i],BW/2-txtW(lines[i],1)/2|0,92+i*10,'#cdd8e4',1,1);
}
function anyPress(){for(var k in keys)if(keys[k]&&k.indexOf('_press_')===0)return true;
 if(mouse.clickL||mouse.clickR)return true;return false;}
// title scene
var TSCENE=null;
function buildTitle(){
 var g=mkc(460,340),c=g.getContext('2d');c.imageSmoothingEnabled=false;
 var rr=mulberry32(4242);
 c.fillStyle='#232a35';c.fillRect(0,0,460,340);
 for(var yy=0;yy<340;yy+=6)for(var xx=0;xx<460;xx+=6){var v=rr();
  if(v<0.18){c.fillStyle='rgba(160,178,200,0.10)';c.fillRect(xx,yy,6,6);}
  else if(v<0.28){c.fillStyle='rgba(12,16,22,0.22)';c.fillRect(xx,yy,6,6);}}
 c.fillStyle='#2b3140';c.fillRect(0,190,460,74);
 for(var t=0;t<40;t++){c.fillStyle=rr()<0.5?'rgba(16,20,27,0.35)':'rgba(148,166,190,0.09)';
  c.fillRect(((rr()*460)|0),190+((rr()*74)|0),2,1);}
 c.fillStyle='rgba(160,180,205,0.16)';c.fillRect(0,188,460,2);c.fillRect(0,264,460,2);
 paintCrater(c,320,120,5);paintCrater(c,120,290,6);
 for(t=0;t<26;t++){c.fillStyle='rgba(38,33,26,0.4)';c.fillRect((rr()*460)|0,(194+rr()*66)|0,2,2);}
 var ents=[
  {k:'h58x42',x:105,y:96,sh:'big'},
  {k:'h46x34',x:352,y:80,sh:'big'},
  {k:'h34x26',x:408,y:300,sh:'big'},
  {k:'wtower',x:30,y:100,sh:'big'},
  {k:'tree',x:250,y:60,sh:'tiny'},{k:'tree',x:430,y:180,sh:'tiny'},
  {k:'tree',x:200,y:320,sh:'tiny'},
  {k:'car',x:398,y:230,sh:'small'},
  {k:'sandbag',x:62,y:240,sh:'small'},{k:'sandbag',x:290,y:300,sh:'small'},
  {k:'barrier',x:168,y:160,sh:'small'},{k:'trap',x:240,y:296,sh:'small'},
  {k:'lamp',x:338,y:186,sh:'tiny'},{k:'lamp',x:96,y:272,sh:'tiny'},
  {k:'wall16D',x:340,y:330,sh:'small'},
  {k:'drum',x:62,y:296,sh:'tiny'}
 ];
 TSCENE={g:g,ents:ents,t:0,hd:0,td:0};
}
function drawTitle(dt){
 var T=TSCENE;T.t+=dt;T.hd+=dt*0.30;T.td=angLerp(T.td,T.hd*1.7+Math.sin(T.t*0.7)*0.8,Math.min(1,dt*1.5));
 var ox=BW/2-230,oy=BH*0.62-215;
 ctx.fillStyle='#10161f';ctx.fillRect(0,0,BW,BH);
 ctx.drawImage(T.g,ox|0,oy|0);
 var all=[];
 for(var i=0;i<T.ents.length;i++){var e=T.ents[i];all.push([e.y,e]);}
 all.sort(function(a,b){return a[0]-b[0];});
 for(i=0;i<all.length;i++){var e=all[i][1];
  var sx=ox+e.x,sy=oy+e.y;
  if(e.sh&&SHADOW[e.sh]){var g=SHADOW[e.sh];ctx.globalAlpha=0.8;ctx.imageSmoothingEnabled=true;
   ctx.drawImage(g,(sx-g.width/2)|0,(sy-g.height*0.55)|0);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;}
  var nm=e.k;
  if(e.k==='drum'){drawStack('drum',sx,sy,0);glowAt2(GLOW.fire,sx,sy-3,0.85);}
  else if(e.k==='lamp'){drawStack('lamp',sx,sy,0);glowAt2(GLOW.warm,sx,sy,0.55);}
  else drawStack(nm,sx,sy,e.k==='tree'?e.x*0.37:0);
 }
 // hero tank center of street, drawn 2x for a chunky poster look
 var hx=BW/2,hy=oy+216;
 var g2=SHADOW.big;ctx.globalAlpha=0.85;ctx.imageSmoothingEnabled=true;
 ctx.save();ctx.translate(hx,hy);ctx.scale(1.6,1.3);ctx.drawImage(g2,-g2.width/2,-g2.height*0.55);ctx.restore();ctx.globalAlpha=1;
 ctx.save();ctx.translate(hx,hy);ctx.rotate(T.hd);ctx.scale(2,2);ctx.globalCompositeOperation='lighter';
 ctx.drawImage(CONE,0,-CONE.height/2);ctx.restore();ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=false;
 drawStackScaled('phull',hx,hy,T.hd,2);
 var ta=T.td;
 drawStackScaled('ptune',hx,hy-3,ta,2);
 drawStackShiftScaled('pbarrel',hx,hy-6,ta,Math.cos(ta)*1,Math.sin(ta)*1,2);
 drawSnow();
 ctx.imageSmoothingEnabled=true;ctx.drawImage(VIG,0,0);ctx.imageSmoothingEnabled=false;
 // title text
 var tt='DEAD GROUND';
 txt(ctx,tt,(BW-txtW(tt,4))/2|0,24,'#e8eef6',4,1);
 txt(ctx,'- A WINTER PUSH THROUGH FOUR SECTORS -',(BW-txtW('- A WINTER PUSH THROUGH FOUR SECTORS -',1))/2|0,56,'#9db0c6',1,1);
 var l1='W/S DRIVE   A/D TURN   Q/E LOOK AROUND';
 var l2='MOUSE AIM TURRET   LMB FIRE MAIN GUN   RMB/SPACE MG';
 var l3='FLANK ENEMY ARMOR - FRONTS BOUNCE SHELLS   R RETRIES';
 txt(ctx,l1,(BW-txtW(l1))/2|0,BH-40,'#7e90a6',1,1);
 txt(ctx,l2,(BW-txtW(l2))/2|0,BH-31,'#7e90a6',1,1);
 txt(ctx,l3,(BW-txtW(l3))/2|0,BH-22,'#7e90a6',1,1);
 if(Math.sin(T.t*3.5)>-0.3)
  txt(ctx,'CLICK OR PRESS ANY KEY',(BW-txtW('CLICK OR PRESS ANY KEY',2))/2,72,'#ffd9a0',2,1);
}
function drawStackShiftScaled(name,x,y,ang,ox,oy,sc){
 var st=stack(name,ang);if(!st)return;
 ctx.save();ctx.translate(x+ox,y+oy);ctx.scale(sc,sc);
 ctx.drawImage(st.c,-st.cx,-st.cy);ctx.restore();
}
function glowAt2(g,x,y,a){ctx.save();ctx.globalCompositeOperation='lighter';
 ctx.globalAlpha=a;ctx.imageSmoothingEnabled=true;ctx.drawImage(g,(x-g.width/2)|0,(y-g.height/2)|0);ctx.imageSmoothingEnabled=false;ctx.restore();}
// ------------------------------------------------------------------ sector flow
function buildMini(S){
 var m=mkc(52,52),g=m.getContext('2d'),k=52/S.W;
 g.fillStyle='#0d131c';g.fillRect(0,0,52,52);
 g.fillStyle='#1c2532';
 for(var i=0;i<=S.cols;i++)g.fillRect(i*S.CS*k,0,Math.max(1,S.RD*k),52);
 for(var j=0;j<=S.rows;j++)g.fillRect(0,j*S.CS*k,52,Math.max(1,S.RD*k));
 if(S.canal){g.fillStyle='#2e4a66';g.fillRect(0,S.cy0*k,52,(S.cy1-S.cy0)*k);
  g.fillStyle='#5a5046';g.fillRect(S.bridgeC*k-1,S.cy0*k-1,3,(S.cy1-S.cy0)*k+2);}
 g.fillStyle='#39424f';
 for(var q=0;q<S.ents.length;q++){var e=S.ents[q];
  if(e.kind==='house')g.fillRect(MX2(e.x*k-e.w*k/2),MX2(e.y*k-e.h*k/2),Math.max(2,e.w*k)|0,Math.max(2,e.h*k)|0);}
 S.mini=m;
}
function MX2(v){return Math.max(0,v|0);}
function startSector(n){
 var S=genSector(n);
 ensureIce(S);
 // clear spawn/extract surroundings of hazards
 var keep=[];
 for(var i=0;i<S.ents.length;i++){var e=S.ents[i];
  if((e.kind==='mine'||e.kind==='trap')&&
     (dist2(e.x,e.y,S.spawnX,S.spawnY)<130*130||dist2(e.x,e.y,S.extX,S.extY)<110*110))continue;
  keep.push(e);}
 S.ents=keep;
 buildMini(S);
 G.S=S;G.P=newPlayer(S);G.shells=[];G.parts=[];G.warns=[];G.msgs=[];
 G.batsLeft=S.bats.length;G.extract=false;G.state='play';G.qe=0;
 G.camA=G.P.hd;G.camX=S.spawnX;G.camY=S.spawnY;
 rebuildGrids();
 msg('SECTOR '+n+' - '+S.name);
 msg('DESTROY '+G.batsLeft+' GUN BATTERIES');
 if(S.canal)msg('WATCH THE ICE');
}
function startGame(){G.runT=0;G.kills=0;startSector(1);}
// ------------------------------------------------------------------ update
function update(dt){
 G.t+=dt;
 updateSnow(dt);
 if(G.shake>0)G.shake=Math.max(0,G.shake-dt*16);
 if(G.state==='title'){
  if(anyPress()){Sound.init();startGame();}
  return;
 }
 var P=G.P,S=G.S;
 if(G.state==='play')G.runT+=dt;
 var active=(G.state==='play');
 // camera
 if(P){
  if(active){G.qe=clamp(G.qe+(keys['e']?2.4*dt:keys['q']?-2.4*dt:0),-2.3,2.3);
   if(!keys['q']&&!keys['e'])G.qe*=Math.max(0,1-dt*0.5);}
  var tgt=P.hd+G.qe+0.35*wrapA(P.td-P.hd);
  G.camA=angLerp(G.camA,tgt,1-Math.exp(-3.0*dt));
  var lc=Math.sqrt(dt)*6;
  G.camX+=(P.x+Math.cos(G.camA)*10-G.camX)*Math.min(1,dt*7);
  G.camY+=(P.y+Math.sin(G.camA)*10-G.camY)*Math.min(1,dt*7);
 }
 rebuildGrids();
 if(P){G.P.hitWall=false;updatePlayer(dt,active);}
 updateEnemies(dt);
 updateShells(dt);
 updateParts(dt);
 for(var i=G.msgs.length-1;i>=0;i--){G.msgs[i].life-=dt;if(G.msgs[i].life<=0)G.msgs.splice(i,1);}
 if(G.state==='dying'){G.overT-=dt;if(G.overT<=0)G.state='over';}
 if(G.state==='clear'){G.clearT-=dt;
  if(G.clearT<=0){if(G.S.n<4)startSector(G.S.n+1);else G.state='debrief';}}
 if(G.state==='over'&&keys['_press_r'])startSector(G.S.n);
 if(G.state==='debrief'&&keys['_press_r'])startGame();
 // sector clear check
 if(G.state==='play'&&G.extract&&G.P&&!G.P.dead&&dist2(G.P.x,G.P.y,G.S.extX,G.S.extY)<20*20){
  G.state='clear';G.clearT=3.2;Sound.fanfare();
 }
}
// ------------------------------------------------------------------ render
function render(){
 var shx=0,shy=0;
 if(G.shake>0.2){var a=Math.random()*TAU;shx=Math.cos(a)*G.shake;shy=Math.sin(a)*G.shake*0.6;}
 ctx.imageSmoothingEnabled=false;
 ctx.setTransform(SCX,0,0,SCY,Math.round(shx*SCX),Math.round(shy*SCY));
 if(G.state==='title'||!G.S){drawTitle(lastDt);ctx.setTransform(SCX,0,0,SCY,0,0);return;}
 drawGround();
 drawWarns();
 drawGlows();
 // entities sorted by camera-space depth
 var P=G.P,S=G.S;
 var vis=[];
 for(var i=0;i<S.ents.length;i++){var e=S.ents[i];
  if(!e.alive)continue;
  var s=w2s(e.x,e.y);
  if(s[0]<-160||s[0]>BW+160||s[1]<-170||s[1]>BH+170)continue;
  var dx=e.x-G.camX,dy=e.y-G.camY;
  var ry=-dx*Math.cos(G.camA)-dy*Math.sin(G.camA);
  vis.push([ry,e,s]);}
 vis.sort(function(a,b){return a[0]-b[0];});
 for(i=0;i<vis.length;i++){var e2=vis[i][1];
  if(e2.kind==='player')continue;
  entShadow(e2);drawEnt(e2);}
 // shells
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(i=0;i<G.shells.length;i++){var sh=G.shells[i];var s2=w2s(sh.x,sh.y);
  var zc=sh.z;
  var zz=zc*Z;
  if(sh.kind==='bullet'){ctx.fillStyle='#ffe9b0';ctx.fillRect(s2[0]|0,(s2[1]-zz)|0,2,2);}
  else if(sh.kind==='rocket'){ctx.fillStyle='#ffb24a';ctx.fillRect((s2[0]-2)|0,(s2[1]-zz)|0,4,3);
   ctx.fillStyle='#fff0c0';ctx.fillRect((s2[0]-1)|0,(s2[1]-zz+1)|0,2,1);}
  else{ctx.fillStyle=sh.team===0?'#fff2c8':'#ffb08a';ctx.fillRect((s2[0]-2)|0,(s2[1]-zz)|0,3,3);}}
 ctx.restore();
 drawPlayer();
 drawParts();
 ctx.setTransform(SCX,0,0,SCY,0,0);
 drawSnow();
 ctx.imageSmoothingEnabled=true;ctx.drawImage(VIG,0,0);ctx.imageSmoothingEnabled=false;
 drawHUD();
 if(G.state==='clear')card('SECTOR '+G.S.n+' CLEAR','#7dffb4',
  ['TIME '+fmtT(G.runT)+'   KILLS '+G.kills,'ADVANCING TO NEXT SECTOR...']);
 if(G.state==='over')card('GAME OVER','#d84a3a',
  ['HULL DESTROYED IN '+G.S.name,'PRESS R TO RETRY THE SECTOR']);
 if(G.state==='debrief')card('FINAL DEBRIEF','#ffd9a0',
  ['ALL FOUR SECTORS CLEARED','TOTAL TIME  '+fmtT(G.runT)+'      KILLS  '+G.kills,'PRESS R TO PLAY AGAIN']);
}
// ------------------------------------------------------------------ boot
mkShadow('big',16,0.42);mkShadow('mid',12,0.40);mkShadow('small',9,0.38);mkShadow('tiny',5,0.34);
initSnow();buildTitle();
var lastDt=0.016,fpsAvg=60;
function frame(t){
 var dt=(t-lastFrame)/1000;if(!isFinite(dt)||dt<=0)dt=0.016;
 if((window.devicePixelRatio||1)!==_dprUsed)resize();
 if(dt>0.05)dt=0.05;if(G.FROZEN)dt=0;lastFrame=t;lastDt=dt;DG._dtsum+=dt;DG._dtn++;
 fpsAvg=fpsAvg*0.96+(1/Math.max(dt,0.001))*0.04;
 try{update(dt);}catch(e){warn('update',e);}
 try{render();}catch(e){warn('render',e);}
 try{if(DG._box)DG.boxes();}catch(e){}
  /* scene renders directly onto the display canvas at native resolution */
 for(var k in keys)if(k.indexOf('_press_')===0)delete keys[k];
 mouse.clickL=false;mouse.clickR=false;
 requestAnimationFrame(frame);
}
var lastFrame=0;
requestAnimationFrame(frame);
// dev/test hooks
window.DG={_dtsum:0,_dtn:0,
 go:function(n){startSector(n);},
 st:function(){return G.state;},
 fps:function(){return Math.round(fpsAvg);},
 pos:function(x,y,h){if(!G.P)return;G.P.x=x;G.P.y=y;if(h!==undefined){G.P.hd=h;G.camA=h;}},
 aimAt:function(x,y){if(!G.P)return;G.P.td=Math.atan2(y-G.P.y,x-G.P.x);},
 aimNearest:function(k){var e=DG.nearest(k);if(e)DG.aimAt(e.x,e.y);return e;},
 nearest:function(kind){var best=null,bd=1e18;for(var i=0;i<G.S.ents.length;i++){var e=G.S.ents[i];
  if(e.kind!==kind||!e.alive)continue;var d=dist2(G.P.x,G.P.y,e.x,e.y);
  if(d<bd){bd=d;best=e;}}return best;},
 fire:function(){mouse.left=true;setTimeout(function(){mouse.left=false;},60);},
 dtsum:function(){var v=DG._dtsum/Math.max(1,DG._dtn);DG._dtsum=0;DG._dtn=0;return v;},
 inp:function(){return {left:mouse.left,clickL:mouse.clickL,st:G.state,rel:G.P&&G.P.reload,sh:G.P&&G.P.shells};},
 setHp:function(v){G.P.hp=v;},
 hurt:function(v){hurtP(v);},
 kill:function(ent){destroyEnt(ent);},
 parts:function(){return G.parts.filter(function(p){return p.type==="fire"||p.type==="flash"||p.type==="spark";}).map(function(p){return {t:p.type,x:Math.round(p.x),y:Math.round(p.y),z:Math.round(p.z||0),l:+(p.life||0).toFixed(2)};}).slice(0,40);},
 killBatt:function(){var b=DG.nearest('battery');if(b){hurt(b,999);return true;}return false;},
 openExtract:function(){if(!G.extract){G.extract=true;addEnt(G.S,'flare',G.S.extX,G.S.extY,{});Sound.flare();}},
 goExtract:function(){G.P.x=G.S.extX-6;G.P.y=G.S.extY;},
 spawnNear:function(kind,x,y){var e=addEnt(G.S,kind,G.P.x+(x||0),G.P.y+(y||0),{hp:(kind==='heavy'?70:34)});
  for(var n=0;n<80;n++){var hit=false;
   for(var q=0;q<G.S.blockers.length;q++){var b=G.S.blockers[q];
    if(b.d&&b.d.solid&&Math.abs(b.x-e.x)<b.w/2+e.r+2&&Math.abs(b.y-e.y)<b.h/2+e.r+2){hit=true;break;}}
   if(!hit)break;e.y+=6;}
  e.cd=1e9;return e;},
 warn:function(x,y){G.warns.push({x:x,y:y,t:1.0});},
 freeze:function(v){G.FROZEN=!!v;},
 st:function(n){var t=stack(n,0);return t?{w:t.c.width,h:t.c.height}:null;},
 stURL:function(n){var t=stack(n,0);return t?t.c.toDataURL():null;},
 boxes:function(){var S=G.S;ctx.save();ctx.lineWidth=1;ctx.strokeStyle='#f33';ctx.font='6px monospace';
 for(var i=0;i<S.ents.length;i++){var e=S.ents[i];if(!e.alive)continue;
  var s=w2s(e.x,e.y);if(s[0]<-30||s[0]>BW+30||s[1]<-40||s[1]>BH+40)continue;
  var w=(e.w||16)*Z,h=(e.h||16)*Z*0.78;
  ctx.strokeRect((s[0]-w/2)|0,(s[1]-h/2)|0,w|0,h|0);ctx.fillStyle='#f66';ctx.fillText(e.kind+'#'+i,(s[0]-w/2)|0,(s[1]-h/2-2)|0);}
 ctx.restore();},
 gcrop:function(x,y,r){var c=mkc(r*2,r*2);var g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(G.S.ground,x-r,y-r,r*2,r*2,0,0,r*2,r*2);return c.toDataURL();},
 houseList:function(){return G.S.ents.filter(function(e){return e.kind==='house';}).slice(0,6).map(function(e){return e.sz+'@'+Math.round(e.x)+','+Math.round(e.y);});},
 dbgT:function(k){var e=DG.nearest(k);G.S._dbgT=e;G.S._dbgM=1e18;return !!e;},
 sector:function(){return G.S.n;},
 cy:function(){return [G.S.cy0,G.S.cy1,G.S.bridgeC];},
 ice:function(){return G.S.ice?{cols:G.S.ice.cols,rows:G.S.ice.rows}:null;},
 icehp:function(x,y){var c=iceCell(G.S,x,y);return c===null?[-2,-2]:[Math.round(G.S.ice.hp[c]),G.S.ice.brk[c]];},
 ents:function(){return G.S.ents;},
 P:function(){return G.P;},
 state:function(){return G.state;},
 camA:function(){return G.camA;},
 scr:function(x,y){return w2s(x,y);},
 shells:function(){return G.shells.map(function(s){return {x:s.x,y:s.y,vx:s.vx,vy:s.vy,life:s.life,kind:s.kind};});},
 blockersAt:function(x,y){return G.S.blockers.filter(function(b){return Math.abs(b.x-x)<60&&Math.abs(b.y-y)<60;}).map(function(b){return b.kind+'@'+Math.round(b.x)+','+Math.round(b.y)+' '+b.w+'x'+b.h;});},
 partsN:function(){return G.parts.length;},
 hits:function(){var P=G.P;return {px:P.x,py:P.y,td:P.td};},
 lastHit:function(){return G.lastHit;}
};
})();
</script>
