<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Playing Match-3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, COLS, ROWS, CELL, PAD, BOARD_X, BOARD_Y;
const GEM_TYPES = 7;
const COLORS = [
  '#ff4466', '#44bbff', '#44ff88', '#ffaa22', '#cc44ff', '#ff66aa', '#66ddff'
];
const GLOW_COLORS = [
  '#ff7799', '#77ddff', '#77ffaa', '#ffcc55', '#dd77ff', '#ff99cc', '#99eeff'
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  COLS = 8;
  ROWS = 10;
  CELL = Math.min(Math.floor((W - 40) / COLS), Math.floor((H - 100) / ROWS), 70);
  PAD = 2;
  BOARD_X = Math.floor((W - COLS * CELL) / 2);
  BOARD_Y = Math.floor((H - ROWS * CELL) / 2) + 20;
}
resize();
window.addEventListener('resize', resize);

let board = [];
let animQueue = [];
let state = 'IDLE';
let score = 0;
let combo = 0;
let comboTimer = 0;
let particles = [];
let sparkleParticles = [];
let scorePopups = [];
let lastMoveTime = 0;
let swapAnim = null;
let popAnims = [];
let fallAnims = [];
let refillAnims = [];
let idleTimer = 0;
let boardShake = 0;

function randomGem() {
  return Math.floor(Math.random() * GEM_TYPES);
}

function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let t;
      do {
        t = randomGem();
      } while (
        (c >= 2 && board[r][c-1] === t && board[r][c-2] === t) ||
        (r >= 2 && board[r-1][c] === t && board[r-2][c] === t)
      );
      board[r][c] = t;
    }
  }
}

function findValidMove() {
  let moves = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      // Try swap right
      if (c + 1 < COLS) {
        if (wouldMatch(r, c, r, c+1)) moves.push({r1:r,c1:c,r2:r,c2:c+1});
      }
      // Try swap down
      if (r + 1 < ROWS) {
        if (wouldMatch(r, c, r+1, c)) moves.push({r1:r,c1:c,r2:r+1,c2:c});
      }
    }
  }
  if (moves.length === 0) {
    // Board is stuck, reshuffle
    initBoard();
    return null;
  }
  return moves[Math.floor(Math.random() * moves.length)];
}

function wouldMatch(r1, c1, r2, c2) {
  // Temporarily swap
  let temp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = temp;
  let matches = findAllMatches();
  // Swap back
  temp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = temp;
  return matches.length > 0;
}

function findAllMatches() {
  let matched = new Set();
  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      let t = board[r][c];
      if (t < 0) continue;
      if (board[r][c+1] === t && board[r][c+2] === t) {
        let end = c + 2;
        while (end + 1 < COLS && board[r][end+1] === t) end++;
        for (let i = c; i <= end; i++) matched.add(r * COLS + i);
      }
    }
  }
  // Vertical
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      let t = board[r][c];
      if (t < 0) continue;
      if (board[r+1][c] === t && board[r+2][c] === t) {
        let end = r + 2;
        while (end + 1 < ROWS && board[end+1][c] === t) end++;
        for (let i = r; i <= end; i++) matched.add(i * COLS + c);
      }
    }
  }
  return [...matched].map(v => ({r: Math.floor(v / COLS), c: v % COLS}));
}

function startSwap(move) {
  state = 'SWAPPING';
  swapAnim = {
    r1: move.r1, c1: move.c1,
    r2: move.r2, c2: move.c2,
    t: 0,
    duration: 0.25
  };
  // Actually swap in board
  let temp = board[move.r1][move.c1];
  board[move.r1][move.c1] = board[move.r2][move.c2];
  board[move.r2][move.c2] = temp;
}

function startPop(matches) {
  state = 'POPPING';
  combo++;
  let points = matches.length * 10 * combo;
  score += points;

  // Score popup
  let cx = 0, cy = 0;
  for (let m of matches) { cx += m.c; cy += m.r; }
  cx /= matches.length; cy /= matches.length;
  scorePopups.push({
    x: BOARD_X + cx * CELL + CELL/2,
    y: BOARD_Y + cy * CELL + CELL/2,
    text: '+' + points,
    combo: combo,
    t: 0,
    duration: 1.2
  });

  // Sparkle burst for combos
  if (combo > 1) {
    for (let i = 0; i < combo * 8; i++) {
      sparkleParticles.push({
        x: BOARD_X + cx * CELL + CELL/2,
        y: BOARD_Y + cy * CELL + CELL/2,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 1,
        decay: 0.015 + Math.random() * 0.02,
        size: 2 + Math.random() * 4,
        color: GLOW_COLORS[Math.floor(Math.random() * GLOW_COLORS.length)]
      });
    }
  }

  popAnims = [];
  for (let m of matches) {
    popAnims.push({
      r: m.r, c: m.c,
      t: 0,
      duration: 0.3,
      type: board[m.r][m.c]
    });
    // Particles
    let px = BOARD_X + m.c * CELL + CELL/2;
    let py = BOARD_Y + m.r * CELL + CELL/2;
    for (let i = 0; i < 12; i++) {
      let angle = (Math.PI * 2 / 12) * i + Math.random() * 0.3;
      let speed = 2 + Math.random() * 4;
      particles.push({
        x: px, y: py,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        size: 3 + Math.random() * 4,
        color: COLORS[board[m.r][m.c]]
      });
    }
    board[m.r][m.c] = -1;
  }
  boardShake = combo > 1 ? Math.min(combo * 2, 10) : 0;
}

function applyGravity() {
  state = 'FALLING';
  fallAnims = [];
  refillAnims = [];

  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] >= 0) {
        if (r !== writeRow) {
          board[writeRow][c] = board[r][c];
          board[r][c] = -1;
          fallAnims.push({
            r: writeRow, c: c,
            startY: BOARD_Y + r * CELL,
            endY: BOARD_Y + writeRow * CELL,
            t: 0,
            duration: 0.3 + (writeRow - r) * 0.04
          });
        }
        writeRow--;
      }
    }
    // Refill
    while (writeRow >= 0) {
      let t = randomGem();
      board[writeRow][c] = t;
      refillAnims.push({
        r: writeRow, c: c,
        startY: BOARD_Y - CELL * (writeRow + 1),
        endY: BOARD_Y + writeRow * CELL,
        t: 0,
        duration: 0.3 + (ROWS - writeRow) * 0.04,
        delay: (ROWS - writeRow) * 0.03
      });
      writeRow--;
    }
  }
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { let s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); }
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
}
function easeInQuad(t) { return t * t; }

function drawGem(x, y, type, size, alpha, scale) {
  if (type < 0 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  let cx = x + size / 2;
  let cy = y + size / 2;
  let s = (size / 2 - PAD) * (scale || 1);

  // Glow
  ctx.shadowColor = GLOW_COLORS[type];
  ctx.shadowBlur = 12;

  // Gem body - rounded diamond
  ctx.beginPath();
  let r = s * 0.15;
  ctx.moveTo(cx, cy - s);
  ctx.lineTo(cx + s, cy);
  ctx.lineTo(cx, cy + s);
  ctx.lineTo(cx - s, cy);
  ctx.closePath();

  let grad = ctx.createRadialGradient(cx - s*0.2, cy - s*0.2, 0, cx, cy, s);
  grad.addColorStop(0, lighten(COLORS[type], 60));
  grad.addColorStop(0.5, COLORS[type]);
  grad.addColorStop(1, darken(COLORS[type], 40));
  ctx.fillStyle = grad;
  ctx.fill();

  // Highlight
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.ellipse(cx - s*0.2, cy - s*0.3, s*0.25, s*0.15, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fill();

  // Inner shine
  ctx.beginPath();
  ctx.ellipse(cx + s*0.1, cy + s*0.2, s*0.12, s*0.08, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fill();

  ctx.restore();
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}

function darken(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
  return `rgb(${r},${g},${b})`;
}

function drawBoard() {
  // Background
  ctx.fillStyle = '#0d0d24';
  ctx.fillRect(0, 0, W, H);

  // Board background
  let bx = BOARD_X - 4, by = BOARD_Y - 4;
  let bw = COLS * CELL + 8, bh = ROWS * CELL + 8;
  ctx.fillStyle = '#12122a';
  ctx.strokeStyle = '#2a2a5a';
  ctx.lineWidth = 2;
  roundRect(ctx, bx, by, bw, bh, 12);
  ctx.fill();
  ctx.stroke();

  // Grid cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let x = BOARD_X + c * CELL;
      let y = BOARD_Y + r * CELL;
      ctx.fillStyle = (r + c) % 2 === 0 ? '#16163a' : '#1a1a42';
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawUI() {
  // Score
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Score label
  ctx.font = 'bold 16px "Segoe UI", Arial, sans-serif';
  ctx.fillStyle = '#6666aa';
  ctx.fillText('SCORE', W / 2, 28);

  // Score value
  ctx.font = 'bold 36px "Segoe UI", Arial, sans-serif';
  let grad = ctx.createLinearGradient(W/2 - 80, 0, W/2 + 80, 0);
  grad.addColorStop(0, '#ffaa44');
  grad.addColorStop(0.5, '#ffdd66');
  grad.addColorStop(1, '#ffaa44');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#ffaa44';
  ctx.shadowBlur = 15;
  ctx.fillText(score.toLocaleString(), W / 2, 62);
  ctx.shadowBlur = 0;

  // Combo
  if (combo > 1 && comboTimer > 0) {
    let comboAlpha = Math.min(1, comboTimer);
    let comboScale = 1 + Math.sin(Date.now() * 0.01) * 0.05;
    ctx.globalAlpha = comboAlpha;
    ctx.font = `bold ${24 * comboScale}px "Segoe UI", Arial, sans-serif`;
    ctx.fillStyle = GLOW_COLORS[combo % GLOW_COLORS.length];
    ctx.shadowColor = GLOW_COLORS[combo % GLOW_COLORS.length];
    ctx.shadowBlur = 20;
    ctx.fillText(`${combo}x COMBO!`, W / 2, 95);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function drawParticles() {
  for (let p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  for (let p of sparkleParticles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    // Star shape
    let s = p.size * p.life;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      let a = (Math.PI / 2) * i;
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(a) * s, p.y + Math.sin(a) * s);
    }
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(p.x, p.y, s * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawScorePopups() {
  for (let sp of scorePopups) {
    ctx.save();
    let progress = sp.t / sp.duration;
    let alpha = progress < 0.3 ? progress / 0.3 : 1 - ((progress - 0.3) / 0.7);
    alpha = Math.max(0, alpha);
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    let yOff = -progress * 60;
    let scale = progress < 0.1 ? progress / 0.1 : 1;

    ctx.font = `bold ${20 * scale}px "Segoe UI", Arial, sans-serif`;
    ctx.fillStyle = sp.combo > 1 ? GLOW_COLORS[sp.combo % GLOW_COLORS.length] : '#ffffff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 10;
    ctx.fillText(sp.text, sp.x, sp.y + yOff);

    if (sp.combo > 1) {
      ctx.font = `bold ${14 * scale}px "Segoe UI", Arial, sans-serif`;
      ctx.fillText(`${sp.combo}x`, sp.x, sp.y + yOff + 20);
    }
    ctx.restore();
  }
}

function update(dt) {
  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = sparkleParticles.length - 1; i >= 0; i--) {
    let p = sparkleParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= p.decay;
    if (p.life <= 0) sparkleParticles.splice(i, 1);
  }

  // Update score popups
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    scorePopups[i].t += dt;
    if (scorePopups[i].t >= scorePopups[i].duration) scorePopups.splice(i, 1);
  }

  // Board shake
  if (boardShake > 0) boardShake *= 0.9;
  if (boardShake < 0.1) boardShake = 0;

  // Combo timer
  if (comboTimer > 0) comboTimer -= dt * 0.5;

  switch (state) {
    case 'IDLE':
      idleTimer += dt;
      if (idleTimer >= 0.8) {
        idleTimer = 0;
        let move = findValidMove();
        if (move) {
          startSwap(move);
        }
      }
      break;

    case 'SWAPPING':
      if (swapAnim) {
        swapAnim.t += dt;
        if (swapAnim.t >= swapAnim.duration) {
          swapAnim = null;
          let matches = findAllMatches();
          if (matches.length > 0) {
            startPop(matches);
          } else {
            // Invalid move (shouldn't happen), try again
            state = 'IDLE';
            idleTimer = 0;
          }
        }
      }
      break;

    case 'POPPING':
      let allDone = true;
      for (let pa of popAnims) {
        pa.t += dt;
        if (pa.t < pa.duration) allDone = false;
      }
      if (allDone) {
        popAnims = [];
        applyGravity();
      }
      break;

    case 'FALLING':
      let fallDone = true;
      for (let fa of fallAnims) {
        if (fa.delay > 0) { fa.delay -= dt; fallDone = false; continue; }
        fa.t += dt;
        if (fa.t < fa.duration) fallDone = false;
      }
      for (let ra of refillAnims) {
        if (ra.delay > 0) { ra.delay -= dt; fallDone = false; continue; }
        ra.t += dt;
        if (ra.t < ra.duration) fallDone = false;
      }
      if (fallDone) {
        fallAnims = [];
        refillAnims = [];
        let matches = findAllMatches();
        if (matches.length > 0) {
          comboTimer = 2;
          startPop(matches);
        } else {
          combo = 0;
          state = 'IDLE';
          idleTimer = 0;
        }
      }
      break;
  }
}

function render() {
  drawBoard();

  let shakeX = boardShake ? (Math.random() - 0.5) * boardShake : 0;
  let shakeY = boardShake ? (Math.random() - 0.5) * boardShake : 0;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Draw gems
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let type = board[r][c];
      if (type < 0) continue;

      let x = BOARD_X + c * CELL;
      let y = BOARD_Y + r * CELL;
      let alpha = 1, scale = 1;

      // Check if this gem is being swapped
      if (swapAnim) {
        let swapProgress = easeOutCubic(Math.min(1, swapAnim.t / swapAnim.duration));
        if (r === swapAnim.r1 && c === swapAnim.c1) {
          let dx = (swapAnim.c2 - swapAnim.c1) * CELL * swapProgress;
          let dy = (swapAnim.r2 - swapAnim.r1) * CELL * swapProgress;
          x += dx;
          y += dy;
          continue;
        }
        if (r === swapAnim.r2 && c === swapAnim.c2) {
          let dx = (swapAnim.c1 - swapAnim.c2) * CELL * swapProgress;
          let dy = (swapAnim.r1 - swapAnim.r2) * CELL * swapProgress;
          x += dx;
          y += dy;
          continue;
        }
      }

      // Check if falling
      for (let fa of fallAnims) {
        if (fa.r === r && fa.c === c) {
          if (fa.delay > 0) continue;
          let p = easeOutCubic(Math.min(1, fa.t / fa.duration));
          y = fa.startY + (fa.endY - fa.startY) * p;
        }
      }

      // Check if refilling
      for (let ra of refillAnims) {
        if (ra.r === r && ra.c === c) {
          if (ra.delay > 0) continue;
          let p = easeOutBack(Math.min(1, ra.t / ra.duration));
          y = ra.startY + (ra.endY - ra.startY) * p;
        }
      }

      // Check if popping
      for (let pa of popAnims) {
        if (pa.r === r && pa.c === c) {
          let p = pa.t / pa.duration;
          if (p < 0.3) {
            scale = 1 + p / 0.3 * 0.3;
            alpha = 1;
          } else {
            scale = 1.3 - (p - 0.3) / 0.7 * 1.3;
            alpha = 1 - (p - 0.3) / 0.7;
          }
          if (scale <= 0) scale = 0;
          if (alpha <= 0) { alpha = 0; continue; }
        }
      }

      drawGem(x, y, type, CELL, alpha, scale);
    }
  }

  ctx.restore();

  drawParticles();
  drawScorePopups();
  drawUI();
}

let lastTime = performance.now();
function gameLoop(time) {
  let dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

initBoard();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
