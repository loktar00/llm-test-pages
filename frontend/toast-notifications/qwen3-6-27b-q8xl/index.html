<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast Notification Playground</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --success: #10b981;
    --success-bg: #065f46;
    --success-light: #d1fae5;
    --error: #ef4444;
    --error-bg: #991b1b;
    --error-light: #fee2e2;
    --info: #3b82f6;
    --info-bg: #1e40af;
    --info-light: #dbeafe;
    --warning: #f59e0b;
    --warning-bg: #92400e;
    --warning-light: #fef3c7;
    --toast-width: 380px;
    --toast-height: 72px;
    --toast-gap: 12px;
    --toast-duration: 5s;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .playground {
    text-align: center;
  }

  .playground h1 {
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #e2e8f0, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .playground p {
    color: #64748b;
    font-size: 1rem;
    margin-bottom: 2.5rem;
  }

  .button-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.2s ease,
                filter 0.2s ease;
    outline: none;
    letter-spacing: 0.01em;
  }

  .btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
  }

  .btn:active {
    transform: translateY(0) scale(0.97);
  }

  .btn-success {
    background: var(--success);
    color: #fff;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
  }
  .btn-success:hover { box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

  .btn-error {
    background: var(--error);
    color: #fff;
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
  }
  .btn-error:hover { box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5); }

  .btn-info {
    background: var(--info);
    color: #fff;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
  }
  .btn-info:hover { box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }

  .btn-warning {
    background: var(--warning);
    color: #fff;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
  }
  .btn-warning:hover { box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5); }

  .btn-icon {
    width: 18px;
    height: 18px;
    display: inline-block;
    flex-shrink: 0;
  }

  /* Toast Container */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column-reverse;
    gap: var(--toast-gap);
    z-index: 9999;
    pointer-events: none;
  }

  /* Toast */
  .toast {
    position: relative;
    width: var(--toast-width);
    min-height: var(--toast-height);
    border-radius: 14px;
    padding: 16px 16px 16px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
    transform: translateX(120%) scale(0.9);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.35s ease,
                box-shadow 0.2s ease;
    overflow: hidden;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .toast.visible {
    transform: translateX(0) scale(1);
    opacity: 1;
  }

  .toast.removing {
    transform: translateX(120%) scale(0.9);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(0.55, 0, 1, 0.45),
                opacity 0.3s ease;
  }

  .toast:hover {
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.25);
  }

  /* Toast backgrounds */
  .toast-success {
    background: linear-gradient(135deg, rgba(6, 95, 70, 0.95), rgba(4, 73, 54, 0.98));
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .toast-error {
    background: linear-gradient(135deg, rgba(153, 27, 27, 0.95), rgba(127, 29, 29, 0.98));
    border: 1px solid rgba(239, 68, 68, 0.25);
  }
  .toast-info {
    background: linear-gradient(135deg, rgba(30, 64, 175, 0.95), rgba(23, 51, 132, 0.98));
    border: 1px solid rgba(59, 130, 246, 0.25);
  }
  .toast-warning {
    background: linear-gradient(135deg, rgba(146, 64, 14, 0.95), rgba(120, 53, 15, 0.98));
    border: 1px solid rgba(245, 158, 11, 0.25);
  }

  /* CSS Icons */
  .toast-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  /* Success: Checkmark */
  .toast-success .toast-icon {
    background: rgba(16, 185, 129, 0.2);
  }
  .toast-success .toast-icon::before,
  .toast-success .toast-icon::after {
    content: '';
    position: absolute;
    background: var(--success);
    border-radius: 2px;
  }
  .toast-success .toast-icon::before {
    width: 12px;
    height: 4px;
    transform: rotate(45deg) translateX(-1px);
    top: 15px;
    left: 7px;
  }
  .toast-success .toast-icon::after {
    width: 20px;
    height: 4px;
    transform: rotate(-45deg) translateX(-1px);
    top: 15px;
    left: 7px;
  }

  /* Error: X */
  .toast-error .toast-icon {
    background: rgba(239, 68, 68, 0.2);
  }
  .toast-error .toast-icon::before,
  .toast-error .toast-icon::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 3px;
    background: var(--error);
    border-radius: 2px;
    top: 50%;
    left: 50%;
  }
  .toast-error .toast-icon::before {
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .toast-error .toast-icon::after {
    transform: translate(-50%, -50%) rotate(-45deg);
  }

  /* Info: i */
  .toast-info .toast-icon {
    background: rgba(59, 130, 246, 0.2);
  }
  .toast-info .toast-icon::before {
    content: '';
    position: absolute;
    width: 3px;
    height: 14px;
    background: var(--info);
    border-radius: 2px;
    top: 9px;
    left: 50%;
    transform: translateX(-50%);
  }
  .toast-info .toast-icon::after {
    content: '';
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--info);
    border-radius: 50%;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Warning: Triangle with ! */
  .toast-warning .toast-icon {
    background: rgba(245, 158, 11, 0.2);
  }
  .toast-warning .toast-icon::before {
    content: '';
    position: absolute;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 18px solid var(--warning);
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    filter: drop-shadow(0 0 0 transparent);
  }
  .toast-warning .toast-icon::after {
    content: '';
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--warning-bg);
    border-radius: 50%;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Toast content */
  .toast-content {
    flex: 1;
    min-width: 0;
  }

  .toast-title {
    font-size: 0.875rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 2px;
    letter-spacing: 0.01em;
  }

  .toast-message {
    font-size: 0.8125rem;
    color: rgba(255,255,255,0.65);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Close button */
  .toast-close {
    width: 28px;
    height: 28px;
    border: none;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s ease, transform 0.15s ease;
    position: relative;
  }

  .toast-close:hover {
    background: rgba(255,255,255,0.18);
    transform: scale(1.1);
  }

  .toast-close::before,
  .toast-close::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 2px;
    background: rgba(255,255,255,0.5);
    border-radius: 1px;
  }
  .toast-close::before { transform: rotate(45deg); }
  .toast-close::after { transform: rotate(-45deg); }

  /* Progress bar */
  .toast-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    border-radius: 0 0 14px 14px;
    transition: none;
  }

  .toast-success .toast-progress { background: var(--success); }
  .toast-error .toast-progress { background: var(--error); }
  .toast-info .toast-progress { background: var(--info); }
  .toast-warning .toast-progress { background: var(--warning); }

  .toast-progress.paused {
    transition: width 0.1s ease;
  }

  /* Background decoration */
  .bg-glow {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.07;
    pointer-events: none;
  }
  .bg-glow-1 {
    top: -100px;
    left: -100px;
    background: var(--info);
  }
  .bg-glow-2 {
    bottom: -100px;
    right: -100px;
    background: var(--warning);
  }
  .bg-glow-3 {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--success);
    opacity: 0.04;
  }

  /* Counter badge */
  .toast-counter {
    position: fixed;
    bottom: 28px;
    right: 420px;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(100, 116, 139, 0.3);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.8125rem;
    color: #94a3b8;
    backdrop-filter: blur(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .toast-counter.hidden {
    opacity: 0;
    transform: translateX(10px);
  }
  .toast-counter strong {
    color: #e2e8f0;
    font-weight: 700;
  }

  @media (max-width: 480px) {
    :root { --toast-width: calc(100vw - 48px); }
    .playground h1 { font-size: 1.5rem; }
    .button-row { gap: 8px; }
    .btn { padding: 10px 16px; font-size: 0.8125rem; }
    .toast-counter { display: none; }
  }
</style>
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<div class="playground">
  <h1>Toast Playground</h1>
  <p>Click the buttons below to trigger notifications</p>
  <div class="button-row">
    <button class="btn btn-success" onclick="showToast('success')">
      <span class="btn-icon" style="position:relative;display:inline-flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 9.5L7.5 13L14 5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Success
    </button>
    <button class="btn btn-error" onclick="showToast('error')">
      <span class="btn-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 5L13 13M13 5L5 13" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg>
      </span>
      Error
    </button>
    <button class="btn btn-info" onclick="showToast('info')">
      <span class="btn-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="white" stroke-width="1.8"/><path d="M9 8V14" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="5.5" r="1" fill="white"/></svg>
      </span>
      Info
    </button>
    <button class="btn btn-warning" onclick="showToast('warning')">
      <span class="btn-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 4L16 15H2L9 4Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 7.5V11" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="13" r="0.8" fill="white"/></svg>
      </span>
      Warning
    </button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div class="toast-counter hidden" id="toastCounter"><strong id="counterNum">0</strong> toast(s)</div>

<script>
(function() {
  const container = document.getElementById('toastContainer');
  const counter = document.getElementById('toastCounter');
  const counterNum = document.getElementById('counterNum');
  const TOAST_DURATION = 5000;
  const TOAST_GAP = 12;
  let activeToasts = [];
  let idCounter = 0;

  const messages = {
    success: [
      { title: 'Operation Complete', msg: 'Your changes have been saved successfully.' },
      { title: 'Payment Processed', msg: 'Transaction completed without errors.' },
      { title: 'Upload Finished', msg: 'All files uploaded to the server.' },
      { title: 'Account Created', msg: 'Your new account is ready to use.' },
      { title: 'Backup Complete', msg: 'System backup finished at 2.4 GB.' }
    ],
    error: [
      { title: 'Connection Failed', msg: 'Unable to reach the authentication server.' },
      { title: 'File Not Found', msg: 'The requested resource does not exist.' },
      { title: 'Permission Denied', msg: 'You lack the required access level.' },
      { title: 'Sync Conflict', msg: 'Unable to merge changes automatically.' },
      { title: 'Timeout Error', msg: 'The request exceeded the time limit.' }
    ],
    info: [
      { title: 'System Update', msg: 'Version 4.2.1 is available for download.' },
      { title: 'New Feature', msg: 'Dark mode is now available in settings.' },
      { title: 'Maintenance', msg: 'Scheduled downtime on Sunday at 3 AM.' },
      { title: 'Reminder', msg: 'Your trial expires in 5 days.' },
      { title: 'Notice', msg: 'Terms of service have been updated.' }
    ],
    warning: [
      { title: 'Low Storage', msg: 'Only 200 MB remaining on your device.' },
      { title: 'Weak Password', msg: 'Consider using a stronger password.' },
      { title: 'Session Expiring', msg: 'You will be logged out in 5 minutes.' },
      { title: 'Deprecated API', msg: 'This endpoint will be removed in v6.' },
      { title: 'Rate Limit', msg: 'You are approaching the API limit.' }
    ]
  };

  function updateCounter() {
    const count = activeToasts.length;
    counterNum.textContent = count;
    if (count > 0) {
      counter.classList.remove('hidden');
    } else {
      counter.classList.add('hidden');
    }
  }

  function showToast(type) {
    const id = ++idCounter;
    const msgSet = messages[type];
    const { title, msg } = msgSet[Math.floor(Math.random() * msgSet.length)];

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.dataset.id = id;

    toast.innerHTML = `
      <div class="toast-icon"></div>
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-message">${msg}</div>
      </div>
      <button class="toast-close" aria-label="Close"></button>
      <div class="toast-progress"></div>
    `;

    container.appendChild(toast);

    const progress = toast.querySelector('.toast-progress');
    const closeBtn = toast.querySelector('.toast-close');

    const entry = {
      id,
      el: toast,
      progressEl: progress,
      remaining: TOAST_DURATION,
      paused: false,
      lastTick: null,
      rafId: null,
      removeTimeout: null
    };

    activeToasts.push(entry);
    updateCounter();

    // Trigger enter animation
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        toast.classList.add('visible');
      });
    });

    // Close button
    closeBtn.addEventListener('click', () => dismissToast(id));

    // Hover pause
    toast.addEventListener('mouseenter', () => {
      entry.paused = true;
      progress.classList.add('paused');
    });
    toast.addEventListener('mouseleave', () => {
      entry.paused = false;
      progress.classList.remove('paused');
      entry.lastTick = performance.now();
    });

    // Start countdown
    entry.lastTick = performance.now();
    startCountdown(entry);
  }

  function startCountdown(entry) {
    function tick(now) {
      if (!entry.remaining || entry.remaining <= 0) return;

      if (!entry.paused) {
        const delta = now - entry.lastTick;
        entry.remaining -= delta;

        const pct = Math.max(0, entry.remaining / TOAST_DURATION);
        entry.progressEl.style.width = (pct * 100) + '%';

        if (entry.remaining <= 0) {
          dismissToast(entry.id);
          return;
        }
      } else {
        // Update lastTick so we don't jump
        entry.lastTick = now;
      }

      entry.lastTick = now;
      entry.rafId = requestAnimationFrame(tick);
    }

    entry.rafId = requestAnimationFrame(tick);
  }

  function dismissToast(id) {
    const idx = activeToasts.findIndex(t => t.id === id);
    if (idx === -1) return;

    const entry = activeToasts[idx];

    // Cancel countdown
    if (entry.rafId) cancelAnimationFrame(entry.rafId);

    // Animate out
    entry.el.classList.remove('visible');
    entry.el.classList.add('removing');

    // Remove from array immediately so counter updates
    activeToasts.splice(idx, 1);
    updateCounter();

    // After animation, remove from DOM
    const removeDelay = 350;
    entry.removeTimeout = setTimeout(() => {
      if (entry.el.parentNode) {
        entry.el.parentNode.removeChild(entry.el);
      }
    }, removeDelay);
  }

  // Expose globally
  window.showToast = showToast;
})();
</script>

</body>
</html>
