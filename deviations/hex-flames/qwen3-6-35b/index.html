<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagonal Fire Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="fireCanvas"></canvas>
    <script>
        // --- Configuration ---
        const CELL_SIZE = 12; // Radius of the hexagon
        const FLAME_HEIGHT = 60; // Rows of simulation
        const SPARK_CHANCE = 0.015; // Chance to spawn a spark
        const SPARK_LIFETIME = 40; // Frames a spark lives
        const WIND_STRENGTH = 0.4; // How much wind shifts heat
        
        // --- Setup Canvas ---
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let width, height;
        let cols, rows;
        let grid = [];
        let sparks = [];
        
        // Time variables for wind oscillation
        let time = 0;

        // --- Resize Handler ---
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Calculate grid dimensions
            // Horizontal distance between centers = 1.5 * size
            // Vertical distance between centers = sqrt(3) * size
            const hexWidth = 1.5 * CELL_SIZE;
            const hexHeight = Math.sqrt(3) * CELL_SIZE;
            
            cols = Math.ceil(width / hexWidth) + 2;
            rows = Math.ceil(height / hexHeight) + 2;
            
            initGrid();
        }

        // --- Hexagon Math & Grid Initialization ---
        function initGrid() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push({
                        temp: 0,
                        r: r,
                        c: c
                    });
                }
                grid.push(row);
            }
        }

        // Get neighbors based on odd-q vertical layout
        function getNeighbors(r, c) {
            // Offsets depend on whether row is even or odd
            const parity = r & 1; // 0 for even, 1 for odd
            
            // Common neighbors (Left, Right)
            let neighbors = [
                {r: r, c: c - 1}, // West
                {r: r, c: c + 1}  // East
            ];

            // Top and Bottom neighbors shift depending on parity
            if (parity) {
                // Odd row
                neighbors.push(
                    {r: r - 1, c: c},     // Top Left
                    {r: r - 1, c: c + 1}, // Top Right
                    {r: r + 1, c: c},     // Bottom Left
                    {r: r + 1, c: c + 1}  // Bottom Right
                );
            } else {
                // Even row
                neighbors.push(
                    {r: r - 1, c: c - 1}, // Top Left
                    {r: r - 1, c: c},     // Top Right
                    {r: r + 1, c: c - 1}, // Bottom Left
                    {r: r + 1, c: c}      // Bottom Right
                );
            }
            
            return neighbors;
        }

        // --- Core Physics ---
        function updatePhysics() {
            time += 0.05;

            // Calculate Wind Bias (Sine wave oscillation)
            // 0.5 is max lean, -0.5 is min lean
            const windBias = Math.sin(time) * WIND_STRENGTH;

            // Create next state buffer to avoid modifying grid while reading
            let nextGrid = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push({ temp: grid[r][c].temp });
                }
                nextGrid.push(row);
            }

            // Process from bottom up (simulating heat rising)
            for (let r = rows - 1; r >= 0; r--) {
                for (let c = 0; c < cols; c++) {
                    let currentTemp = grid[r][c].temp;
                    
                    // If cell is hot, it transfers heat up
                    if (currentTemp > 0) {
                        let neighbors = getNeighbors(r, c);
                        
                        for (let n of neighbors) {
                            if (n.r >= 0 && n.r < rows && n.c >= 0 && n.c < cols) {
                                let nTemp = grid[n.r][n.c].temp;
                                
                                // Heat propagation logic
                                // If neighbor is cooler, it absorbs heat
                                if (nTemp < currentTemp) {
                                    let transfer = (currentTemp - nTemp) * 0.15; // Heat transfer rate
                                    
                                    // Apply wind bias to x-movement of heat
                                    // If wind is pushing right, bias 'c' index of destination
                                    let windEffect = 0;
                                    if (Math.random() < 0.05) { // Only apply wind occasionally to neighbors
                                        windEffect = windBias;
                                    }

                                    // Clamp temperature
                                    nextGrid[n.r][n.c].temp = Math.min(1.0, nTemp + transfer);
                                }
                            }
                        }
                    }

                    // Decay heat (cooling down)
                    // Base decay
                    let decay = 0.02;
                    
                    // If at the top, cool down fast (escape into atmosphere)
                    if (r === rows - 1) decay = 0.08;
                    
                    // If at the bottom, generate infinite heat to sustain fire
                    if (r === rows - 1) {
                        nextGrid[r][c].temp = 1.0;
                    } else {
                        nextGrid[r][c].temp = Math.max(0, nextGrid[r][c].temp - decay);
                    }
                }
            }

            grid = nextGrid;
        }

        // --- Particle System ---
        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Upward velocity with slight random spread
                this.vx = (Math.random() - 0.5) * 1 + (Math.sin(time) * WIND_STRENGTH); 
                this.vy = -(Math.random() * 2 + 1.5); 
                this.life = SPARK_LIFETIME;
                this.maxLife = SPARK_LIFETIME;
                this.size = Math.random() * 2 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                // Gravity/Swirl effect
                this.vy -= 0.02; // Accelerate upwards slightly
                this.vx += Math.sin(time) * 0.01; // Wind influence
            }

            draw(ctx) {
                let alpha = this.life / this.maxLife;
                ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function updateSparks() {
            // Spawn sparks from the top few rows of the grid
            if (Math.random() < SPARK_CHANCE) {
                let r = rows - Math.floor(Math.random() * 10);
                let c = Math.floor(Math.random() * cols);
                
                if (grid[r][c].temp > 0.6) { // Only spawn from hot spots
                    let pos = hexToPixel(r, c);
                    sparks.push(new Spark(pos.x, pos.y));
                }
            }

            for (let i = sparks.length - 1; i >= 0; i--) {
                sparks[i].update();
                if (sparks[i].life <= 0) {
                    sparks.splice(i, 1);
                }
            }
        }

        // --- Rendering ---
        function hexToPixel(r, c) {
            const hexWidth = 1.5 * CELL_SIZE;
            const hexHeight = Math.sqrt(3) * CELL_SIZE;
            
            let x = c * hexWidth;
            // Offset odd rows
            if (r & 1) {
                x += hexWidth / 2;
            }
            let y = r * hexHeight;
            
            // Center the whole fire in the middle of the screen horizontally
            const offsetX = (width - (cols * hexWidth)) / 2;
            const offsetY = height - (rows * hexHeight) + 50;

            return {
                x: x + offsetX + CELL_SIZE, // + radius to center
                y: y + offsetY + CELL_SIZE
            };
        }

        function getColor(temp) {
            // Temperature is 0.0 to 1.0
            // Palette: Black -> Dark Red -> Red -> Orange -> Yellow -> White
            
            let r, g, b;
            
            if (temp < 0.2) {
                // Dark Red to Red
                r = Math.floor(temp * 5 * 100); 
                g = 0;
                b = 0;
            } else if (temp < 0.4) {
                // Red to Orange
                let t = (temp - 0.2) * 5;
                r = 100 + Math.floor(t * 155);
                g = Math.floor(t * 50);
                b = 0;
            } else if (temp < 0.7) {
                // Orange to Yellow
                let t = (temp - 0.4) * 3.33;
                r = 255;
                g = 50 + Math.floor(t * 140);
                b = 0;
            } else {
                // Yellow to White
                let t = (temp - 0.7) * 3.33;
                r = 255;
                g = 255 - Math.floor(t * 20);
                b = Math.floor(t * 200);
            }
            
            return `rgb(${r},${g},${b})`;
        }

        function drawHex(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle_deg = 60 * i - 30;
                const angle_rad = Math.PI / 180 * angle_deg;
                const px = x + size * Math.cos(angle_rad);
                const py = y + size * Math.sin(angle_rad);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
        }

        function render() {
            // Clear screen with a very dark color
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);
            
            // Additive blending for glowing effect
            ctx.globalCompositeOperation = 'lighter';

            // Draw Grid
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let temp = grid[r][c].temp;
                    if (temp > 0.01) {
                        let pos = hexToPixel(r, c);
                        
                        // Flicker effect
                        let flicker = 1.0 + (Math.random() - 0.5) * 0.1;
                        let effectiveSize = CELL_SIZE * 0.9 * flicker;
                        
                        let color = getColor(temp);
                        drawHex(ctx, pos.x, pos.y, effectiveSize, color);
                    }
                }
            }

            // Draw Sparks
            for (let spark of sparks) {
                spark.draw(ctx);
            }

            // Reset blending
            ctx.globalCompositeOperation = 'source-over';
        }

        // --- Main Loop ---
        function loop() {
            updatePhysics();
            updateSparks();
            render();
            requestAnimationFrame(loop);
        }

        // --- Start ---
        window.addEventListener('resize', resize);
        resize();
        loop();

    </script>
</body>
</html>
