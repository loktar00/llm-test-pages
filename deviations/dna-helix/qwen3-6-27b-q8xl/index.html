<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Double Helix</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NUM_PAIRS = 120;
const HELIX_RADIUS = 120;
const VERTICAL_SPACING = 14;
const TWIST_RATE = 0.35;
const FOCAL_LENGTH = 800;

const BASE_COLORS = {
  'A-T': { r: 0, g: 255, b: 100, glow: '#00ff64' },
  'T-A': { r: 0, g: 255, b: 100, glow: '#00ff64' },
  'C-G': { r: 255, g: 50, b: 80, glow: '#ff3250' },
  'G-C': { r: 80, g: 150, b: 255, glow: '#5096ff' }
};
const BASE_TYPES = ['A-T', 'T-A', 'C-G', 'G-C'];

let basePairs = [];
for (let i = 0; i < NUM_PAIRS; i++) {
  basePairs.push({
    type: BASE_TYPES[Math.floor(Math.random() * 4)],
    theta: i * TWIST_RATE,
    y: (i - NUM_PAIRS / 2) * VERTICAL_SPACING
  });
}

let rotationAngle = 0;
let time = 0;

// Replication state
let replication = {
  active: false,
  phase: 'idle', // idle, unzipping, rebuilding, done
  startIdx: 0,
  endIdx: 0,
  progress: 0,
  unzipProgress: 0,
  rebuildProgress: 0,
  timer: 0,
  delay: 0,
  newTypes: []
};

function startReplication() {
  const sectionSize = 12 + Math.floor(Math.random() * 10);
  const startIdx = Math.floor(Math.random() * (NUM_PAIRS - sectionSize));
  const endIdx = startIdx + sectionSize;

  replication.active = true;
  replication.phase = 'unzipping';
  replication.startIdx = startIdx;
  replication.endIdx = endIdx;
  replication.unzipProgress = 0;
  replication.rebuildProgress = 0;
  replication.newTypes = [];
  for (let i = startIdx; i < endIdx; i++) {
    replication.newTypes.push(BASE_TYPES[Math.floor(Math.random() * 4)]);
  }
}

function project(x, y, z) {
  const scale = FOCAL_LENGTH / (FOCAL_LENGTH + z);
  return {
    sx: x * scale + W / 2,
    sy: y * scale + H / 2,
    scale: scale,
    z: z
  };
}

function getHelixPoint(theta, y, strandOffset) {
  const t = theta + strandOffset;
  return {
    x: HELIX_RADIUS * Math.cos(t),
    y: y,
    z: HELIX_RADIUS * Math.sin(t)
  };
}

function applyRotation(p, angle) {
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  return {
    x: p.x * cosA - p.z * sinA,
    y: p.y,
    z: p.x * sinA + p.z * cosA
  };
}

function drawGlowCircle(sx, sy, radius, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = radius * 3;
  ctx.beginPath();
  ctx.arc(sx, sy, radius, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawGlowLine(x1, y1, x2, y2, color, alpha, lineWidth) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawStrandPoint(sx, sy, scale, depthAlpha, color) {
  const r = Math.max(1.5, 3.5 * scale);
  drawGlowCircle(sx, sy, r, color, depthAlpha * 0.9);
}

function draw() {
  ctx.fillStyle = 'rgba(5, 5, 18, 1)';
  ctx.fillRect(0, 0, W, H);

  // Draw subtle background stars
  ctx.save();
  for (let i = 0; i < 80; i++) {
    const sx = ((i * 7919 + 13) % W);
    const sy = ((i * 6271 + 37) % H);
    const brightness = 0.1 + 0.15 * Math.sin(time * 0.5 + i);
    ctx.globalAlpha = brightness;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(sx, sy, 0.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  rotationAngle = time * 0.3;

  // Collect all drawable elements with z-depth for sorting
  let elements = [];

  const helixCenterY = 0;

  for (let i = 0; i < NUM_PAIRS; i++) {
    const bp = basePairs[i];
    const theta = bp.theta;
    const y = bp.y + helixCenterY;

    let inReplication = replication.active && i >= replication.startIdx && i < replication.endIdx;
    let unzipFactor = 0;
    let visible = 1;
    let newType = bp.type;

    if (inReplication) {
      if (replication.phase === 'unzipping') {
        const idx = i - replication.startIdx;
        const total = replication.endIdx - replication.startIdx;
        const wave = Math.max(0, Math.min(1, (replication.unzipProgress * 1.5 - idx / total * 0.5)));
        unzipFactor = Math.min(1, wave);
        visible = 1 - unzipFactor;
      } else if (replication.phase === 'rebuilding') {
        const idx = i - replication.startIdx;
        const total = replication.endIdx - replication.startIdx;
        const wave = Math.max(0, Math.min(1, (replication.rebuildProgress * 1.5 - idx / total * 0.5)));
        visible = wave;
        unzipFactor = 1 - wave * 0.3;
        newType = replication.newTypes[idx];
      } else if (replication.phase === 'done') {
        visible = 1;
        unzipFactor = 0;
        newType = replication.newTypes[i - replication.startIdx];
      }
    }

    const sep = 1 + unzipFactor * 1.6;

    const p1 = getHelixPoint(theta, y, 0);
    const p2 = getHelixPoint(theta, y, Math.PI);

    const rp1 = applyRotation(p1, rotationAngle);
    const rp2 = applyRotation(p2, rotationAngle);

    // Apply separation for unzipping
    const sepX = (rp2.x - rp1.x) * unzipFactor * 0.3;
    const sepZ = (rp2.z - rp1.z) * unzipFactor * 0.3;

    rp1.x -= sepX * 0.5;
    rp1.z -= sepZ * 0.5;
    rp2.x += sepX * 0.5;
    rp2.z += sepZ * 0.5;

    const proj1 = project(rp1.x, rp1.y, rp1.z);
    const proj2 = project(rp2.x, rp2.y, rp2.z);

    const avgZ = (rp1.z + rp2.z) / 2;
    const depthFactor = 1 - (avgZ + HELIX_RADIUS) / (2 * HELIX_RADIUS);
    const depthAlpha = Math.max(0.15, Math.min(1, 0.3 + depthFactor * 0.7));

    const colorInfo = BASE_COLORS[newType];
    const hexColor = `rgb(${colorInfo.r},${colorInfo.g},${colorInfo.b})`;

    // Base pair rung
    if (visible > 0.01) {
      elements.push({
        type: 'rung',
        x1: proj1.sx, y1: proj1.sy,
        x2: proj2.sx, y2: proj2.sy,
        color: hexColor,
        alpha: depthAlpha * visible,
        z: avgZ,
        scale: (proj1.scale + proj2.scale) / 2
      });
    }

    // Strand points
    elements.push({
      type: 'point',
      sx: proj1.sx, sy: proj1.sy,
      scale: proj1.scale,
      depthAlpha: depthAlpha,
      color: '#a0c4ff',
      z: rp1.z
    });

    elements.push({
      type: 'point',
      sx: proj2.sx, sy: proj2.sy,
      scale: proj2.scale,
      depthAlpha: depthAlpha,
      color: '#a0c4ff',
      z: rp2.z
    });

    // Update base pair type if replication is done
    if (replication.phase === 'done' && inReplication) {
      bp.type = newType;
    }
  }

  // Sort by z (back to front)
  elements.sort((a, b) => a.z - b.z);

  // Draw strand connections (subtle lines between consecutive points on each strand)
  for (let strand = 0; strand < 2; strand++) {
    ctx.save();
    for (let i = 0; i < NUM_PAIRS - 1; i++) {
      const bp = basePairs[i];
      const bp2 = basePairs[i + 1];
      const theta = bp.theta;
      const theta2 = bp2.theta;
      const y = bp.y + helixCenterY;
      const y2 = bp2.y + helixCenterY;

      const p1 = getHelixPoint(theta, y, strand * Math.PI);
      const p2 = getHelixPoint(theta2, y2, strand * Math.PI);

      const rp1 = applyRotation(p1, rotationAngle);
      const rp2 = applyRotation(p2, rotationAngle);

      const proj1 = project(rp1.x, rp1.y, rp1.z);
      const proj2 = project(rp2.x, rp2.y, rp2.z);

      const avgZ = (rp1.z + rp2.z) / 2;
      const depthFactor = 1 - (avgZ + HELIX_RADIUS) / (2 * HELIX_RADIUS);
      const depthAlpha = Math.max(0.08, Math.min(0.4, 0.1 + depthFactor * 0.3));

      ctx.globalAlpha = depthAlpha;
      ctx.strokeStyle = '#6080cc';
      ctx.lineWidth = 1.5 * proj1.scale;
      ctx.beginPath();
      ctx.moveTo(proj1.sx, proj1.sy);
      ctx.lineTo(proj2.sx, proj2.sy);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Draw all elements
  for (const el of elements) {
    if (el.type === 'point') {
      drawStrandPoint(el.sx, el.sy, el.scale, el.depthAlpha, el.color);
    } else if (el.type === 'rung') {
      drawGlowLine(el.x1, el.y1, el.x2, el.y2, el.color, el.alpha, Math.max(1, 2.5 * el.scale));
    }
  }

  // Draw replication indicator
  if (replication.active && (replication.phase === 'unzipping' || replication.phase === 'rebuilding')) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#ffcc00';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    const phaseText = replication.phase === 'unzipping' ? '⧫ REPLICATION: UNZIPPING ⧫' : '⧫ REPLICATION: REBUILDING ⧫';
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 15;
    ctx.fillText(phaseText, W / 2, 30);
    ctx.restore();
  }
}

function updateReplication(dt) {
  if (!replication.active) {
    replication.timer += dt;
    if (replication.timer > replication.delay) {
      replication.timer = 0;
      replication.delay = 4 + Math.random() * 6;
      startReplication();
    }
    return;
  }

  if (replication.phase === 'unzipping') {
    replication.unzipProgress += dt * 0.8;
    if (replication.unzipProgress >= 1) {
      replication.phase = 'rebuilding';
      replication.rebuildProgress = 0;
    }
  } else if (replication.phase === 'rebuilding') {
    replication.rebuildProgress += dt * 0.5;
    if (replication.rebuildProgress >= 1) {
      replication.phase = 'done';
      // Update actual base pair types
      for (let i = replication.startIdx; i < replication.endIdx; i++) {
        basePairs[i].type = replication.newTypes[i - replication.startIdx];
      }
      setTimeout(() => {
        replication.active = false;
        replication.phase = 'idle';
        replication.timer = 0;
        replication.delay = 5 + Math.random() * 7;
      }, 500);
    }
  }
}

let lastTime = performance.now();
replication.delay = 3 + Math.random() * 3;

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  time += dt;

  updateReplication(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
