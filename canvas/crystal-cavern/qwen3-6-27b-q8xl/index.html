<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Cavern</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Utility
const rand = (a, b) => Math.random() * (b - a) + a;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const TAU = Math.PI * 2;

// Color palettes for crystals
const crystalPalettes = [
  [100, 200, 255], // ice blue
  [200, 130, 255], // amethyst
  [100, 255, 200], // emerald
  [255, 180, 100], // amber
  [255, 100, 150], // rose
  [150, 255, 150], // lime
  [255, 220, 100], // gold
  [100, 150, 255], // sapphire
];

// Cave walls (top and bottom irregular surfaces)
let caveTop = [];
let caveBottom = [];
function generateCaveWalls() {
  caveTop = [];
  caveBottom = [];
  const segs = 80;
  for (let i = 0; i <= segs; i++) {
    const x = (i / segs) * W;
    caveTop.push({ x, y: rand(20, 80) + Math.sin(i * 0.3) * 25 });
    caveBottom.push({ x, y: H - rand(20, 80) - Math.sin(i * 0.25) * 20 });
  }
}
generateCaveWalls();
window.addEventListener('resize', generateCaveWalls);

// Light source
const light = { x: W / 2, y: H / 2, angle: 0, speed: 0.0003, radius: 350 };

// Crystals
class Crystal {
  constructor(x, y, fromCeiling) {
    this.x = x;
    this.y = y;
    this.fromCeiling = fromCeiling;
    this.age = 0;
    this.growthRate = rand(0.3, 0.8);
    this.palette = crystalPalettes[Math.floor(rand(0, crystalPalettes.length))];
    this.branches = [];
    this.maxDepth = Math.floor(rand(2, 5));
    this.alive = true;
    this.growing = true;
    this.growTime = rand(200, 600);
    this.shimmerPhase = rand(0, TAU);
    this.width = rand(3, 8);

    // Initial branch
    const dir = fromCeiling ? Math.PI / 2 : -Math.PI / 2;
    this.branches.push({
      x: x, y: y,
      angle: dir + rand(-0.3, 0.3),
      length: 0,
      maxLength: rand(30, 120),
      depth: 0,
      children: [],
      width: this.width,
      facets: []
    });
  }

  grow() {
    if (!this.growing) return;
    this.age++;
    if (this.age > this.growTime) {
      this.growing = false;
      return;
    }

    const t = this.age / this.growTime;
    const ease = t * t * (3 - 2 * t);

    this.growBranches(this.branches, ease);
  }

  growBranches(brs, t) {
    for (const b of brs) {
      if (b.length < b.maxLength) {
        b.length = Math.min(b.maxLength, b.length + this.growthRate * (1 + Math.sin(b.depth) * 0.3));
        this.generateFacets(b);
      }
      if (b.children.length === 0 && b.length > b.maxLength * 0.6 && b.depth < this.maxDepth && Math.random() < 0.008) {
        const numChildren = Math.floor(rand(1, 3));
        for (let i = 0; i < numChildren; i++) {
          const angleOffset = rand(-0.8, 0.8);
          const childDir = b.angle + angleOffset;
          const tipX = b.x + Math.cos(childDir) * b.length;
          const tipY = b.y + Math.sin(childDir) * b.length;
          b.children.push({
            x: tipX, y: tipY,
            angle: childDir,
            length: 0,
            maxLength: b.maxLength * rand(0.5, 0.8),
            depth: b.depth + 1,
            children: [],
            width: b.width * rand(0.5, 0.8),
            facets: []
          });
        }
      }
      this.growBranches(b.children, t);
    }
  }

  generateFacets(b) {
    if (b.length < 5) return;
    const tipX = b.x + Math.cos(b.angle) * b.length;
    const tipY = b.y + Math.sin(b.angle) * b.length;
    const perpAngle = b.angle + Math.PI / 2;
    const hw = b.width * 0.5;

    b.facets = [
      // Side facets
      {
        points: [
          { x: b.x + Math.cos(perpAngle) * hw * 0.5, y: b.y + Math.sin(perpAngle) * hw * 0.5 },
          { x: tipX + Math.cos(perpAngle) * hw, y: tipY + Math.sin(perpAngle) * hw },
          { x: tipX - Math.cos(perpAngle) * hw * 0.2, y: tipY - Math.sin(perpAngle) * hw * 0.2 }
        ],
        normal: perpAngle,
        shade: rand(0.3, 0.7)
      },
      {
        points: [
          { x: b.x - Math.cos(perpAngle) * hw * 0.5, y: b.y - Math.sin(perpAngle) * hw * 0.5 },
          { x: tipX - Math.cos(perpAngle) * hw, y: tipY - Math.sin(perpAngle) * hw },
          { x: tipX + Math.cos(perpAngle) * hw * 0.2, y: tipY + Math.sin(perpAngle) * hw * 0.2 }
        ],
        normal: perpAngle + Math.PI,
        shade: rand(0.3, 0.7)
      },
      // Top facet
      {
        points: [
          { x: b.x, y: b.y },
          { x: tipX + Math.cos(perpAngle) * hw * 0.5, y: tipY + Math.sin(perpAngle) * hw * 0.5 },
          { x: tipX - Math.cos(perpAngle) * hw * 0.5, y: tipY - Math.sin(perpAngle) * hw * 0.5 }
        ],
        normal: b.angle + Math.PI,
        shade: rand(0.5, 0.9)
      }
    ];
  }

  draw(ctx, time) {
    if (!this.alive) return;
    this.drawBranches(ctx, this.branches, time);
  }

  drawBranches(ctx, brs, time) {
    for (const b of brs) {
      if (b.length < 2) continue;
      const shimmer = 0.7 + 0.3 * Math.sin(time * 0.002 + this.shimmerPhase);
      const [r, g, b_] = this.palette;

      for (const facet of b.facets) {
        const pts = facet.points;
        if (pts.length < 3) continue;

        // Light interaction
        const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
        const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
        const toLight = Math.atan2(light.y - cy, light.x - cx);
        const lightAngle = Math.atan2(Math.sin(toLight - facet.normal), Math.cos(toLight - facet.normal));
        const brightness = Math.max(0.15, Math.cos(lightAngle) * 0.5 + 0.5) * shimmer * facet.shade;

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();

        const alpha = 0.6 + brightness * 0.4;
        ctx.fillStyle = `rgba(${Math.floor(r * brightness)},${Math.floor(g * brightness)},${Math.floor(b_ * brightness)},${alpha})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${Math.min(255, r + 60)},${Math.min(255, g + 60)},${Math.min(255, b_ + 60)},0.3)`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }

      // Draw branch line
      const tipX = b.x + Math.cos(b.angle) * b.length;
      const tipY = b.y + Math.sin(b.angle) * b.length;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(tipX, tipY);
      ctx.strokeStyle = `rgba(${r},${g},${b_},0.15)`;
      ctx.lineWidth = b.width;
      ctx.stroke();

      this.drawBranches(ctx, b.children, time);
    }
  }

  getArea() {
    let area = 0;
    const countBranches = (brs) => {
      for (const b of brs) {
        area += b.length * b.width;
        countBranches(b.children);
      }
    };
    countBranches(this.branches);
    return area;
  }

  getAllTips() {
    const tips = [];
    const collect = (brs) => {
      for (const b of brs) {
        if (b.length > b.maxLength * 0.8) {
          tips.push({
            x: b.x + Math.cos(b.angle) * b.length,
            y: b.y + Math.sin(b.angle) * b.length
          });
        }
        collect(b.children);
      }
    };
    collect(this.branchs || this.branches);
    return tips;
  }
}

// Shards
class Shard {
  constructor(x, y, color, size) {
    this.x = x;
    this.y = y;
    this.vx = rand(-3, 3);
    this.vy = rand(-2, 2);
    this.rotation = rand(0, TAU);
    this.rotSpeed = rand(-0.1, 0.1);
    this.color = color;
    this.size = size;
    this.life = 1;
    this.decay = rand(0.003, 0.008);
    this.points = [];
    const n = Math.floor(rand(3, 5));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      const r = rand(size * 0.5, size);
      this.points.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
  }

  update() {
    this.vy += 0.15;
    this.x += this.vx;
    this.y += this.vy;
    this.rotation += this.rotSpeed;
    this.life -= this.decay;
    this.vx *= 0.99;
    return this.life > 0;
  }

  draw(ctx) {
    if (this.life <= 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);
    for (let i = 1; i < this.points.length; i++) {
      ctx.lineTo(this.points[i].x, this.points[i].y);
    }
    ctx.closePath();
    const [r, g, b_] = this.color;
    ctx.fillStyle = `rgba(${r},${g},${b_},${this.life * 0.8})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(${Math.min(255, r + 80)},${Math.min(255, g + 80)},${Math.min(255, b_ + 80)},${this.life * 0.5})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

// Drips
class Drip {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vy = rand(0.5, 1.5);
    this.vx = rand(-0.2, 0.2);
    this.size = rand(1.5, 3);
    this.trail = [];
    this.alive = true;
  }

  update() {
    this.vy += 0.08;
    this.y += this.vy;
    this.x += this.vx;
    this.trail.push({ x: this.x, y: this.y, life: 1 });
    if (this.trail.length > 15) this.trail.shift();
    for (const t of this.trail) t.life -= 0.07;

    // Check if hit bottom
    for (const cb of caveBottom) {
      if (Math.abs(this.x - cb.x) < 10 && this.y >= cb.y - 5) {
        this.alive = false;
        ripples.push(new Ripple(this.x, cb.y));
        return false;
      }
    }
    if (this.y > H + 20) return false;
    return true;
  }

  draw(ctx) {
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      if (t.life <= 0) continue;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * t.life * 0.5, 0, TAU);
      ctx.fillStyle = `rgba(150,200,255,${t.life * 0.3})`;
      ctx.fill();
    }
    // Drop
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, TAU);
    ctx.fillStyle = 'rgba(180,220,255,0.8)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.3, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();
  }
}

// Ripples
class Ripple {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = 0;
    this.maxRadius = rand(15, 40);
    this.life = 1;
    this.rings = [];
    for (let i = 0; i < 3; i++) {
      this.rings.push({ offset: i * 8, phase: i * 0.5 });
    }
  }

  update() {
    this.radius += 0.5;
    this.life = Math.max(0, 1 - this.radius / this.maxRadius);
    return this.life > 0;
  }

  draw(ctx) {
    for (const ring of this.rings) {
      const r = this.radius - ring.offset;
      if (r <= 0) continue;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, TAU);
      ctx.strokeStyle = `rgba(150,200,255,${this.life * 0.3})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

// Caustic patches
const caustics = [];
class Caustic {
  constructor() {
    this.x = rand(0, W);
    this.y = rand(H * 0.1, H * 0.9);
    this.radius = rand(20, 80);
    this.color = crystalPalettes[Math.floor(rand(0, crystalPalettes.length))];
    this.phase = rand(0, TAU);
    this.speed = rand(0.001, 0.003);
  }

  draw(ctx, time) {
    const alpha = 0.03 + 0.03 * Math.sin(time * this.speed + this.phase);
    const [r, g, b_] = this.color;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
    grad.addColorStop(0, `rgba(${r},${g},${b_},${alpha * 2})`);
    grad.addColorStop(1, `rgba(${r},${g},${b_},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
  }
}

// State
let crystals = [];
let shards = [];
let drips = [];
let ripples = [];
let tremorActive = false;
let tremorTimer = 0;
let fillLevel = 0;
const FILL_THRESHOLD = 0.35;
let time = 0;
let nextCrystalTimer = 0;
let nextDripTimer = 0;

// Initialize some caustics
for (let i = 0; i < 15; i++) caustics.push(new Caustic());

function spawnCrystal() {
  const fromCeiling = Math.random() < 0.5;
  let x;
  if (fromCeiling) {
    const idx = Math.floor(rand(0, caveTop.length - 1));
    x = caveTop[idx].x;
    const y = caveTop[idx].y;
    crystals.push(new Crystal(x, y, true));
  } else {
    const idx = Math.floor(rand(0, caveBottom.length - 1));
    x = caveBottom[idx].x;
    const y = caveBottom[idx].y;
    crystals.push(new Crystal(x, y, false));
  }
}

function shatterOldest() {
  tremorActive = true;
  tremorTimer = 120;

  // Sort by age, shatter oldest 40%
  crystals.sort((a, b) => a.age - b.age);
  const toShatter = Math.floor(crystals.length * 0.4);
  for (let i = 0; i < toShatter && i < crystals.length; i++) {
    const c = crystals[i];
    c.alive = false;
    // Create shards from each branch
    const collectBranches = (brs) => {
      for (const b of brs) {
        if (b.length > 10) {
          const tipX = b.x + Math.cos(b.angle) * b.length;
          const tipY = b.y + Math.sin(b.angle) * b.length;
          for (let s = 0; s < 3; s++) {
            shards.push(new Shard(
              lerp(b.x, tipX, rand(0, 1)),
              lerp(b.y, tipY, rand(0, 1)),
              c.palette,
              rand(3, b.width * 2)
            ));
          }
        }
        collectBranches(b.children);
      }
    };
    collectBranches(c.branches);
  }
  crystals = crystals.filter(c => c.alive);
}

function drawCaveBackground(ctx) {
  // Dark gradient background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a0a12');
  bgGrad.addColorStop(0.5, '#0d0d18');
  bgGrad.addColorStop(1, '#080810');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Cave top
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (const p of caveTop) ctx.lineTo(p.x, p.y);
  ctx.lineTo(W, 0);
  ctx.closePath();
  const topGrad = ctx.createLinearGradient(0, 0, 0, 100);
  topGrad.addColorStop(0, '#1a1a25');
  topGrad.addColorStop(1, '#0d0d18');
  ctx.fillStyle = topGrad;
  ctx.fill();

  // Cave bottom
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (const p of caveBottom) ctx.lineTo(p.x, p.y);
  ctx.lineTo(W, H);
  ctx.closePath();
  const botGrad = ctx.createLinearGradient(0, H - 100, 0, H);
  botGrad.addColorStop(0, '#0d0d18');
  botGrad.addColorStop(1, '#1a1a25');
  ctx.fillStyle = botGrad;
  ctx.fill();

  // Rock texture lines
  ctx.strokeStyle = 'rgba(40,40,60,0.3)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < caveTop.length - 1; i++) {
    ctx.beginPath();
    ctx.moveTo(caveTop[i].x, caveTop[i].y);
    ctx.lineTo(caveTop[i + 1].x, caveTop[i + 1].y);
    ctx.stroke();
  }
  for (let i = 0; i < caveBottom.length - 1; i++) {
    ctx.beginPath();
    ctx.moveTo(caveBottom[i].x, caveBottom[i].y);
    ctx.lineTo(caveBottom[i + 1].x, caveBottom[i + 1].y);
    ctx.stroke();
  }
}

function drawLight(ctx) {
  // Main light glow
  const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, light.radius);
  grad.addColorStop(0, 'rgba(255,250,230,0.15)');
  grad.addColorStop(0.3, 'rgba(255,240,200,0.05)');
  grad.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Light source dot
  ctx.beginPath();
  ctx.arc(light.x, light.y, 4, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,240,0.9)';
  ctx.fill();

  // Lens flare
  ctx.beginPath();
  ctx.arc(light.x, light.y, 12, 0, TAU);
  const flareGrad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, 12);
  flareGrad.addColorStop(0, 'rgba(255,255,255,0.4)');
  flareGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = flareGrad;
  ctx.fill();
}

function drawCausticsOnWalls(ctx, time) {
  // Caustic patches projected on cave walls
  for (const c of caustics) {
    c.draw(ctx, time);
  }

  // Refraction caustics from crystals near light
  for (const crystal of crystals) {
    if (!crystal.alive) continue;
    const d = dist(light.x, light.y, crystal.x, crystal.y);
    if (d < 200) {
      const [r, g, b_] = crystal.palette;
      const shimmer = 0.5 + 0.5 * Math.sin(time * 0.003 + crystal.shimmerPhase);
      // Project caustic onto opposite wall
      const projX = crystal.fromCeiling ? crystal.x + rand(-30, 30) : crystal.x + rand(-30, 30);
      const projY = crystal.fromCeiling ? H - rand(30, 80) : rand(30, 80);
      const grad = ctx.createRadialGradient(projX, projY, 0, projX, projY, rand(20, 50));
      grad.addColorStop(0, `rgba(${r},${g},${b_},${shimmer * 0.06})`);
      grad.addColorStop(1, `rgba(${r},${g},${b_},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(projX - 60, projY - 60, 120, 120);
    }
  }
}

function drawPool(ctx) {
  // Water pool at bottom
  const poolY = H - 15;
  const grad = ctx.createLinearGradient(0, poolY - 10, 0, H);
  grad.addColorStop(0, 'rgba(20,40,60,0)');
  grad.addColorStop(0.3, 'rgba(20,40,60,0.3)');
  grad.addColorStop(1, 'rgba(15,30,50,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, poolY - 10, W, H - poolY + 10);

  // Subtle water shimmer
  for (let i = 0; i < 20; i++) {
    const x = (Math.sin(time * 0.001 + i * 1.7) * 0.5 + 0.5) * W;
    const y = poolY + rand(0, H - poolY);
    const a = 0.02 + 0.02 * Math.sin(time * 0.002 + i);
    ctx.beginPath();
    ctx.arc(x, y, rand(1, 3), 0, TAU);
    ctx.fillStyle = `rgba(100,180,255,${a})`;
    ctx.fill();
  }
}

function update() {
  time++;

  // Update light position (slow orbit)
  light.angle += light.speed;
  light.x = W * 0.5 + Math.cos(light.angle) * W * 0.35;
  light.y = H * 0.5 + Math.sin(light.angle * 0.7) * H * 0.3;

  // Spawn crystals
  nextCrystalTimer++;
  if (nextCrystalTimer > rand(60, 150) && crystals.length < 60) {
    spawnCrystal();
    nextCrystalTimer = 0;
  }

  // Grow crystals
  for (const c of crystals) {
    if (c.alive) c.grow();
  }

  // Calculate fill level
  let totalArea = 0;
  for (const c of crystals) {
    if (c.alive) totalArea += c.getArea();
  }
  fillLevel = totalArea / (W * H);

  // Check threshold - shatter
  if (fillLevel > FILL_THRESHOLD && !tremorActive) {
    shatterOldest();
  }

  // Tremor
  if (tremorActive) {
    tremorTimer--;
    if (tremorTimer <= 0) tremorActive = false;
  }

  // Update shards
  shards = shards.filter(s => s.update());

  // Spawn drips
  nextDripTimer++;
  if (nextDripTimer > rand(80, 200)) {
    // Find a crystal tip near ceiling to drip from
    for (const c of crystals) {
      if (!c.alive || !c.fromCeiling) continue;
      const tips = [];
      const collectTips = (brs) => {
        for (const b of brs) {
          if (b.length > b.maxLength * 0.9) {
            tips.push({
              x: b.x + Math.cos(b.angle) * b.length,
              y: b.y + Math.sin(b.angle) * b.length
            });
          }
          collectTips(b.children);
        }
      };
      collectTips(c.branches);
      if (tips.length > 0) {
        const tip = tips[Math.floor(rand(0, tips.length))];
        drips.push(new Drip(tip.x, tip.y));
      }
      break;
    }
    // Also drip from ceiling randomly
    if (Math.random() < 0.3) {
      const idx = Math.floor(rand(0, caveTop.length - 1));
      drips.push(new Drip(caveTop[idx].x + rand(-5, 5), caveTop[idx].y));
    }
    nextDripTimer = 0;
  }

  // Update drips
  drips = drips.filter(d => d.update());

  // Update ripples
  ripples = ripples.filter(r => r.update());

  // Update caustics position
  for (const c of caustics) {
    c.x += Math.sin(time * 0.001 + c.phase) * 0.2;
    c.y += Math.cos(time * 0.0008 + c.phase * 1.3) * 0.15;
  }
}

function draw() {
  ctx.save();

  // Tremor shake
  if (tremorActive) {
    const shake = tremorTimer / 120;
    ctx.translate(rand(-shake * 8, shake * 8), rand(-shake * 8, shake * 8));
  }

  drawCaveBackground(ctx);
  drawPool(ctx);
  drawCausticsOnWalls(ctx, time);

  // Draw crystals
  for (const c of crystals) {
    if (c.alive) c.draw(ctx, time);
  }

  // Draw shards
  for (const s of shards) s.draw(ctx);

  // Draw drips
  for (const d of drips) d.draw(ctx);

  // Draw ripples
  for (const r of ripples) r.draw(ctx);

  drawLight(ctx);

  // Vignette
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.75);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Start with a few crystals
for (let i = 0; i < 5; i++) {
  spawnCrystal();
}

loop();
</script>
