<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Hero</title>
    <style>
        :root {
            --bg-color: #030014;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-primary: #8b5cf6;
            --accent-secondary: #ec4899;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --nav-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Background Blobs --- */
        .ambient-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            will-change: transform;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-primary) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            animation: drift-1 20s infinite alternate ease-in-out;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-secondary) 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            animation: drift-2 25s infinite alternate ease-in-out;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: drift-3 18s infinite alternate ease-in-out;
        }

        @keyframes drift-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        @keyframes drift-2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-80px, -60px) scale(0.9); }
        }

        @keyframes drift-3 {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-40%, -60%) scale(1.2); }
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            background: rgba(3, 0, 20, 0.6);
        }

        .nav-inner {
            width: 100%;
            max-width: 1200px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            text-decoration: none;
        }

        /* Pure CSS Logo Mark */
        .logo-mark {
            width: 24px;
            height: 24px;
            background: conic-gradient(from 180deg at 50% 50%, var(--accent-primary), var(--accent-secondary), var(--accent-primary));
            border-radius: 6px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-mark::after {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--bg-color);
            border-radius: 50%;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        /* --- Hero Section --- */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
        }

        .hero-content {
            max-width: 800px;
            z-index: 10;
        }

        /* Headline Animation */
        .headline-wrapper {
            overflow: hidden;
            display: inline-block;
            margin-bottom: 24px;
        }

        .headline {
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: white;
            transform: translateY(100%);
            animation: reveal-mask 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, var(--accent-primary) 50%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* Gradient sweep effect */
            background-size: 200% 200%;
            animation: gradient-sweep 5s ease infinite;
        }

        @keyframes reveal-mask {
            0% { transform: translateY(110%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes gradient-sweep {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subheadline {
            font-size: clamp(1.1rem, 2vw, 1.25rem);
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 48px;
            opacity: 0;
            animation: fade-up 0.8s ease-out 0.3s forwards;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Buttons --- */
        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fade-up 0.8s ease-out 0.5s forwards;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .btn-secondary {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Primary CTA with Shimmer Border */
        .btn-primary {
            background: transparent;
            color: white;
            border: none;
            /* The background layer for the gradient border */
            background-image: linear-gradient(var(--bg-color), var(--bg-color)), 
                              linear-gradient(110deg, transparent 0%, var(--accent-primary) 40%, var(--accent-secondary) 50%, var(--accent-primary) 60%, transparent 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            /* Transparent border to reveal the gradient background */
            border: 2px solid transparent;
            background-size: 100% 100%, 300% 100%;
            background-position: 0 0, 0 0;
            transition: background-position 0.6s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            background-position: 0 0, 100% 0; /* Shift the gradient */
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(139, 92, 246, 0.5);
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .blob {
                opacity: 0.4; /* Reduce intensity on mobile */
            }
        }
    </style>
</head>
<body>

    <!-- Background Blobs -->
    <div class="ambient-light">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="nav-inner">
            <a href="#" class="logo">
                <div class="logo-mark"></div>
                <span>Lumina</span>
            </a>
            <div class="nav-links">
                <a href="#">Features</a>
                <a href="#">Solutions</a>
                <a href="#">Pricing</a>
                <a href="#">Docs</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="headline-wrapper">
                <h1 class="headline">
                    Scale your vision with <br />
                    <span class="gradient-text">Intelligent Automation</span>
                </h1>
            </div>
            
            <p class="subheadline">
                Deploy enterprise-grade infrastructure in seconds. Our AI-driven platform optimizes your workflow, reduces latency, and scales infinitely with your growth.
            </p>

            <div class="cta-group">
                <a href="#" class="btn btn-primary">Start Building Free</a>
                <a href="#" class="btn btn-secondary">View Documentation</a>
            </div>
        </div>
    </section>

</body>
</html>
