<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volcano Island</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- State ---
let time = 0;
const dayNightPeriod = 60; // seconds
const cyclePeriod = 45; // full volcano cycle in seconds
let lavaBombs = [];
let ashParticles = [];
let steamParticles = [];
let lavaFlows = [];
let birds = [];
let palmTrees = [];
let extendedShoreline = 0; // pixels added to right
let rumbleIntensity = 0;
let craterGlow = 0;

// Initialize birds
function initBirds() {
  birds = [];
  for (let i = 0; i < 8; i++) {
    birds.push({
      x: Math.random() * W,
      y: 50 + Math.random() * 150,
      speed: 1.5 + Math.random() * 2,
      wingPhase: Math.random() * Math.PI * 2,
      fleeing: false,
      targetX: 0,
      size: 4 + Math.random() * 4
    });
  }
}

// Initialize palm trees
function initPalms() {
  palmTrees = [];
  const numTrees = 5;
  for (let i = 0; i < numTrees; i++) {
    palmTrees.push({
      x: W * 0.1 + (W * 0.25) * (i / (numTrees - 1)),
      height: 80 + Math.random() * 60,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.5 + Math.random() * 0.5,
      lean: (Math.random() - 0.5) * 0.3
    });
  }
}

initBirds();
initPalms();

// --- Helpers ---
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function randRange(min, max) { return min + Math.random() * (max - min); }

// --- Volcano Cycle ---
function getVolcanoPhase(t) {
  const cycleTime = (t % cyclePeriod) / cyclePeriod; // 0 to 1
  if (cycleTime < 0.3) return { phase: 'rumble', progress: cycleTime / 0.3 };
  if (cycleTime < 0.5) return { phase: 'ash', progress: (cycleTime - 0.3) / 0.2 };
  if (cycleTime < 0.7) return { phase: 'erupt', progress: (cycleTime - 0.5) / 0.2 };
  return { phase: 'cool', progress: (cycleTime - 0.7) / 0.3 };
}

// --- Drawing Functions ---

function drawSky(dayFactor) {
  // dayFactor: 0 = night, 1 = day
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  
  if (dayFactor > 0.5) {
    const t = (dayFactor - 0.5) * 2;
    const r = lerp(20, 135, t);
    const g = lerp(20, 206, t);
    const b = lerp(60, 235, t);
    grad.addColorStop(0, `rgb(${r},${g},${b})`);
    grad.addColorStop(1, `rgb(${lerp(40,180,t)},${lerp(50,220,t)},${lerp(80,240,t)})`);
  } else {
    const t = dayFactor * 2;
    const r = lerp(10, 20, t);
    const g = lerp(10, 20, t);
    const b = lerp(30, 60, t);
    grad.addColorStop(0, `rgb(${r},${g},${b})`);
    grad.addColorStop(1, `rgb(${lerp(20,40,t)},${lerp(20,50,t)},${lerp(40,80,t)})`);
  }
  
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.65);

  // Stars at night
  if (dayFactor < 0.4) {
    const alpha = 1 - dayFactor / 0.4;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    for (let i = 0; i < 50; i++) {
      const sx = (Math.sin(i * 127.1 + 311.7) * 0.5 + 0.5) * W;
      const sy = (Math.sin(i * 269.5 + 183.3) * 0.5 + 0.5) * H * 0.5;
      const size = (Math.sin(i * 31.7) * 0.5 + 0.5) * 2 + 0.5;
      ctx.beginPath();
      ctx.arc(sx, sy, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Sun/Moon
  const celestialY = H * 0.1 + H * 0.3 * (1 - dayFactor);
  const celestialX = W * 0.8;
  if (dayFactor > 0.3) {
    // Sun
    const sunAlpha = Math.min(1, (dayFactor - 0.3) / 0.3);
    ctx.fillStyle = `rgba(255,220,50,${sunAlpha})`;
    ctx.beginPath();
    ctx.arc(celestialX, celestialY, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,200,50,${sunAlpha * 0.3})`;
    ctx.beginPath();
    ctx.arc(celestialX, celestialY, 50, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Moon
    const moonAlpha = Math.max(0, 1 - dayFactor / 0.3);
    ctx.fillStyle = `rgba(220,220,240,${moonAlpha})`;
    ctx.beginPath();
    ctx.arc(celestialX - W * 0.3, celestialY * 0.8, 20, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawSea(dayFactor, steamParticles) {
  const seaY = H * 0.65;
  const grad = ctx.createLinearGradient(0, seaY, 0, H);
  
  if (dayFactor > 0.5) {
    const t = (dayFactor - 0.5) * 2;
    grad.addColorStop(0, `rgb(${lerp(30,40,t)},${lerp(40,80,t)},${lerp(80,140,t)})`);
    grad.addColorStop(1, `rgb(${lerp(10,20,t)},${lerp(20,50,t)},${lerp(50,100,t)})`);
  } else {
    const t = dayFactor * 2;
    grad.addColorStop(0, `rgb(${lerp(10,30,t)},${lerp(15,40,t)},${lerp(30,80,t)})`);
    grad.addColorStop(1, `rgb(${lerp(5,10,t)},${lerp(8,20,t)},${lerp(15,50,t)})`);
  }
  
  ctx.fillStyle = grad;
  ctx.fillRect(0, seaY, W, H - seaY);

  // Waves
  ctx.strokeStyle = `rgba(255,255,255,${0.1 + dayFactor * 0.15})`;
  ctx.lineWidth = 1.5;
  for (let row = 0; row < 5; row++) {
    ctx.beginPath();
    const baseY = seaY + 20 + row * 25;
    for (let x = 0; x <= W; x += 5) {
      const y = baseY + Math.sin(x * 0.02 + time * 1.5 + row) * 3 + Math.sin(x * 0.05 + time * 2) * 1.5;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Draw steam particles
  for (const steam of steamParticles) {
    ctx.fillStyle = `rgba(255,255,255,${steam.alpha})`;
    ctx.beginPath();
    ctx.arc(steam.x, steam.y, steam.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawIsland(dayFactor, extendedShoreline) {
  const seaY = H * 0.65;
  const baseX = W * 0.15;
  const peakX = W * 0.42;
  const peakY = H * 0.18;
  const rightShore = W * 0.7 + extendedShoreline;
  
  // Main island body
  ctx.beginPath();
  ctx.moveTo(baseX - 30, seaY + 20);
  ctx.quadraticCurveTo(baseX, seaY - 10, peakX - 40, peakY + 80);
  ctx.lineTo(peakX - 15, peakY);
  ctx.lineTo(peakX + 15, peakY);
  ctx.lineTo(peakX + 40, peakY + 80);
  ctx.quadraticCurveTo(rightShore + 20, seaY - 10, rightShore + 40, seaY + 20);
  ctx.lineTo(baseX - 30, seaY + 20);
  ctx.closePath();
  
  // Island gradient
  const islandGrad = ctx.createLinearGradient(peakX, peakY, peakX, seaY);
  if (dayFactor > 0.5) {
    const t = (dayFactor - 0.5) * 2;
    islandGrad.addColorStop(0, `rgb(${lerp(40,80,t)},${lerp(35,65,t)},${lerp(30,50,t)})`);
    islandGrad.addColorStop(0.5, `rgb(${lerp(50,90,t)},${lerp(45,75,t)},${lerp(35,55,t)})`);
    islandGrad.addColorStop(1, `rgb(${lerp(60,100,t)},${lerp(55,85,t)},${lerp(40,60,t)})`);
  } else {
    const t = dayFactor * 2;
    islandGrad.addColorStop(0, `rgb(${lerp(20,40,t)},${lerp(18,35,t)},${lerp(15,30,t)})`);
    islandGrad.addColorStop(0.5, `rgb(${lerp(25,50,t)},${lerp(22,45,t)},${lerp(18,35,t)})`);
    islandGrad.addColorStop(1, `rgb(${lerp(30,60,t)},${lerp(28,55,t)},${lerp(20,40,t)})`);
  }
  ctx.fillStyle = islandGrad;
  ctx.fill();
  
  // Beach sand
  ctx.beginPath();
  ctx.moveTo(baseX - 10, seaY + 5);
  ctx.quadraticCurveTo(baseX + 50, seaY - 15, rightShore - 30, seaY - 10);
  ctx.quadraticCurveTo(rightShore + 10, seaY + 5, rightShore + 30, seaY + 15);
  ctx.lineTo(baseX - 30, seaY + 20);
  ctx.closePath();
  ctx.fillStyle = `rgb(${lerp(50,180,dayFactor)},${lerp(45,170,dayFactor)},${lerp(35,120,dayFactor)})`;
  ctx.fill();
}

function drawCrater(dayFactor, phase, progress, rumbleIntensity, craterGlow) {
  const peakX = W * 0.42;
  const peakY = H * 0.18;
  const craterW = 30;
  const craterH = 12;
  
  // Crater opening
  ctx.beginPath();
  ctx.ellipse(peakX, peakY, craterW, craterH, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1008';
  ctx.fill();
  
  // Inner glow during eruption
  if (phase === 'erupt' || phase === 'ash') {
    const glowIntensity = phase === 'erupt' ? 0.8 + 0.2 * Math.sin(time * 10) : 0.3 + 0.2 * Math.sin(time * 5);
    const glowGrad = ctx.createRadialGradient(peakX, peakY, 0, peakX, peakY, craterW * 2);
    glowGrad.addColorStop(0, `rgba(255,100,20,${glowIntensity})`);
    glowGrad.addColorStop(0.5, `rgba(255,50,10,${glowIntensity * 0.5})`);
    glowGrad.addColorStop(1, 'rgba(255,20,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(peakX, peakY, craterW * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Rumble shake effect
  if (rumbleIntensity > 0) {
    ctx.save();
    ctx.translate(
      (Math.random() - 0.5) * rumbleIntensity * 3,
      (Math.random() - 0.5) * rumbleIntensity * 2
    );
    ctx.restore();
  }
}

function drawLavaBombs() {
  for (const bomb of lavaBombs) {
    // Trail
    ctx.strokeStyle = `rgba(255,${80 + bomb.life * 60},0,${bomb.alpha * 0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bomb.x, bomb.y);
    ctx.lineTo(bomb.x - bomb.vx * 3, bomb.y - bomb.vy * 3);
    ctx.stroke();
    
    // Bomb
    ctx.fillStyle = `rgba(255,${100 + bomb.life * 80},0,${bomb.alpha})`;
    ctx.beginPath();
    ctx.arc(bomb.x, bomb.y, bomb.size, 0, Math.PI * 2);
    ctx.fill();
    
    // Glow
    ctx.fillStyle = `rgba(255,200,50,${bomb.alpha * 0.4})`;
    ctx.beginPath();
    ctx.arc(bomb.x, bomb.y, bomb.size * 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawAshParticles() {
  for (const ash of ashParticles) {
    ctx.fillStyle = `rgba(80,70,60,${ash.alpha})`;
    ctx.beginPath();
    ctx.arc(ash.x, ash.y, ash.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawLavaFlows(dayFactor) {
  for (const flow of lavaFlows) {
    ctx.beginPath();
    ctx.moveTo(flow.points[0].x, flow.points[0].y);
    for (let i = 1; i < flow.points.length; i++) {
      ctx.lineTo(flow.points[i].x, flow.points[i].y);
    }
    
    const glowAmount = flow.life;
    const r = lerp(60, 255, glowAmount);
    const g = lerp(30, 100, glowAmount);
    const b = lerp(10, 0, glowAmount);
    
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = flow.width;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // Glow effect
    ctx.strokeStyle = `rgba(255,${80 + glowAmount * 100},0,${glowAmount * 0.4})`;
    ctx.lineWidth = flow.width + 6;
    ctx.stroke();
    
    // Crust overlay
    if (flow.life < 0.5) {
      ctx.strokeStyle = `rgba(40,20,10,${1 - flow.life * 2})`;
      ctx.lineWidth = flow.width * 0.8;
      ctx.stroke();
    }
  }
}

function drawPalmTrees(dayFactor) {
  const seaY = H * 0.65;
  
  for (const palm of palmTrees) {
    const swayOffset = Math.sin(time * palm.swaySpeed + palm.sway) * 8;
    const trunkBaseX = palm.x;
    const trunkBaseY = seaY - 5;
    const trunkTopX = palm.x + palm.lean * palm.height + swayOffset;
    const trunkTopY = trunkBaseY - palm.height;
    
    // Trunk
    ctx.beginPath();
    ctx.moveTo(trunkBaseX - 4, trunkBaseY);
    ctx.quadraticCurveTo(
      (trunkBaseX + trunkTopX) / 2 - 2,
      (trunkBaseY + trunkTopY) / 2,
      trunkTopX - 2, trunkTopY
    );
    ctx.lineTo(trunkTopX + 2, trunkTopY);
    ctx.quadraticCurveTo(
      (trunkBaseX + trunkTopX) / 2 + 2,
      (trunkBaseY + trunkTopY) / 2,
      trunkBaseX + 4, trunkBaseY
    );
    ctx.closePath();
    
    const trunkColor = dayFactor > 0.5 
      ? `rgb(${lerp(80,140,dayFactor)},${lerp(60,100,dayFactor)},${lerp(30,50,dayFactor)})`
      : `rgb(${lerp(40,80,dayFactor)},${lerp(30,60,dayFactor)},${lerp(15,30,dayFactor)})`;
    ctx.fillStyle = trunkColor;
    ctx.fill();
    
    // Leaves
    const numLeaves = 6;
    for (let i = 0; i < numLeaves; i++) {
      const angle = (i / numLeaves) * Math.PI * 2 + Math.sin(time * 0.8 + i) * 0.1;
      const leafLen = 35 + Math.sin(i * 2.3) * 10;
      const leafEndX = trunkTopX + Math.cos(angle) * leafLen + swayOffset * 0.5;
      const leafEndY = trunkTopY + Math.sin(angle) * leafLen * 0.6 + 10;
      
      ctx.beginPath();
      ctx.moveTo(trunkTopX, trunkTopY);
      ctx.quadraticCurveTo(
        (trunkTopX + leafEndX) / 2 + Math.sin(angle + 1) * 10,
        (trunkTopY + leafEndY) / 2 - 10,
        leafEndX, leafEndY
      );
      ctx.quadraticCurveTo(
        (trunkTopX + leafEndX) / 2 - Math.sin(angle + 1) * 10,
        (trunkTopY + leafEndY) / 2 - 5,
        trunkTopX, trunkTopY
      );
      ctx.closePath();
      
      const leafGreen = dayFactor > 0.5
        ? `rgb(${lerp(20,60,dayFactor)},${lerp(80,140,dayFactor)},${lerp(10,40,dayFactor)})`
        : `rgb(${lerp(10,20,dayFactor)},${lerp(40,80,dayFactor)},${lerp(5,20,dayFactor)})`;
      ctx.fillStyle = leafGreen;
      ctx.fill();
    }
  }
}

function drawBirds() {
  for (const bird of birds) {
    const wingY = Math.sin(time * 8 + bird.wingPhase) * bird.size * 0.8;
    
    ctx.strokeStyle = `rgba(40,40,40,0.8)`;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    
    // Left wing
    ctx.beginPath();
    ctx.moveTo(bird.x, bird.y);
    ctx.quadraticCurveTo(
      bird.x - bird.size, bird.y + wingY * 0.5,
      bird.x - bird.size * 1.5, bird.y + wingY
    );
    ctx.stroke();
    
    // Right wing
    ctx.beginPath();
    ctx.moveTo(bird.x, bird.y);
    ctx.quadraticCurveTo(
      bird.x + bird.size, bird.y + wingY * 0.5,
      bird.x + bird.size * 1.5, bird.y + wingY
    );
    ctx.stroke();
  }
}

// --- Update Functions ---

function updateBirds(phase) {
  const peakX = W * 0.42;
  
  for (const bird of birds) {
    if (phase === 'erupt' || phase === 'ash') {
      bird.fleeing = true;
      // Flee away from volcano
      const dir = bird.x < peakX ? -1 : 1;
      bird.targetX = bird.x + dir * 500;
      bird.x += dir * bird.speed * 3;
      bird.y += Math.sin(time * 3 + bird.wingPhase) * 2;
    } else {
      bird.fleeing = false;
      // Return and wander
      bird.x += Math.sin(time * 0.5 + bird.wingPhase) * bird.speed;
      bird.y += Math.cos(time * 0.3 + bird.wingPhase) * 0.5;
    }
    
    // Wrap or reset
    if (bird.x > W + 50) bird.x = -50;
    if (bird.x < -50) bird.x = W + 50;
    bird.y = clamp(bird.y, 30, H * 0.5);
  }
}

function spawnLavaBomb(phase) {
  if (phase !== 'erupt') return;
  
  if (Math.random() < 0.15) {
    const peakX = W * 0.42;
    const peakY = H * 0.18;
    const seaY = H * 0.65;
    
    lavaBombs.push({
      x: peakX + (Math.random() - 0.5) * 10,
      y: peakY - 10,
      vx: (Math.random() - 0.5) * 8,
      vy: -6 - Math.random() * 5,
      size: 3 + Math.random() * 4,
      life: 1,
      alpha: 1,
      gravity: 0.15,
      landed: false
    });
  }
}

function updateLavaBombs() {
  const seaY = H * 0.65;
  
  for (let i = lavaBombs.length - 1; i >= 0; i--) {
    const bomb = lavaBombs[i];
    
    if (!bomb.landed) {
      bomb.vy += bomb.gravity;
      bomb.x += bomb.vx;
      bomb.y += bomb.vy;
      
      // Check if landed in sea
      if (bomb.y >= seaY) {
        bomb.landed = true;
        bomb.life = 0.5;
        
        // Spawn steam
        for (let j = 0; j < 8; j++) {
          steamParticles.push({
            x: bomb.x + (Math.random() - 0.5) * 10,
            y: seaY,
            vx: (Math.random() - 0.5) * 3,
            vy: -1 - Math.random() * 2,
            size: 5 + Math.random() * 8,
            alpha: 0.8,
            decay: 0.015
          });
        }
      }
    } else {
      bomb.life -= 0.02;
      bomb.alpha = bomb.life * 2;
    }
    
    if (bomb.life <= 0) {
      lavaBombs.splice(i, 1);
    }
  }
}

function spawnAsh(phase, progress) {
  if (phase !== 'ash' && phase !== 'erupt') return;
  
  const rate = phase === 'erupt' ? 0.4 : 0.15;
  if (Math.random() < rate) {
    const peakX = W * 0.42;
    const peakY = H * 0.18;
    
    ashParticles.push({
      x: peakX + (Math.random() - 0.5) * 20,
      y: peakY - 5,
      vx: (Math.random() - 0.5) * 2,
      vy: -2 - Math.random() * 3,
      size: 1 + Math.random() * 3,
      alpha: 0.6 + Math.random() * 0.4,
      decay: 0.003 + Math.random() * 0.005
    });
  }
}

function updateAshParticles() {
  for (let i = ashParticles.length - 1; i >= 0; i--) {
    const ash = ashParticles[i];
    ash.vy += 0.01; // slight gravity
    ash.vx += (Math.random() - 0.5) * 0.1;
    ash.x += ash.vx;
    ash.y += ash.vy;
    ash.alpha -= ash.decay;
    
    if (ash.alpha <= 0) {
      ashParticles.splice(i, 1);
    }
  }
}

function updateSteamParticles() {
  for (let i = steamParticles.length - 1; i >= 0; i--) {
    const steam = steamParticles[i];
    steam.x += steam.vx;
    steam.y += steam.vy;
    steam.vy -= 0.02;
    steam.vx *= 0.99;
    steam.size += 0.1;
    steam.alpha -= steam.decay;
    
    if (steam.alpha <= 0) {
      steamParticles.splice(i, 1);
    }
  }
}

function spawnLavaFlows(phase, progress) {
  if (phase !== 'erupt') return;
  
  if (Math.random() < 0.05 && lavaFlows.length < 3) {
    const peakX = W * 0.42;
    const peakY = H * 0.18;
    
    lavaFlows.push({
      points: [{ x: peakX, y: peakY + 15 }],
      currentX: peakX,
      currentY: peakY + 15,
      vx: (Math.random() - 0.5) * 2,
      vy: 0.5 + Math.random() * 0.5,
      life: 1,
      width: 4 + Math.random() * 3,
      maxPoints: 40 + Math.random() * 30
    });
  }
}

function updateLavaFlows() {
  const seaY = H * 0.65;
  
  for (let i = lavaFlows.length - 1; i >= 0; i--) {
    const flow = lavaFlows[i];
    
    if (flow.points.length < flow.maxPoints) {
      flow.currentX += flow.vx + (Math.random() - 0.5) * 0.5;
      flow.currentY += flow.vy;
      flow.vx *= 0.99;
      
      flow.points.push({ x: flow.currentX, y: flow.currentY });
      
      if (flow.currentY >= seaY) {
        extendedShoreline = Math.max(extendedShoreline, flow.currentX - W * 0.7);
      }
    } else {
      flow.life -= 0.005;
    }
    
    if (flow.life <= 0) {
      lavaFlows.splice(i, 1);
    }
  }
}

function updateRumble(phase, progress) {
  if (phase === 'rumble') {
    rumbleIntensity = progress * 0.5;
  } else if (phase === 'ash') {
    rumbleIntensity = 0.3 + progress * 0.3;
  } else if (phase === 'erupt') {
    rumbleIntensity = 0.8 + Math.sin(time * 8) * 0.2;
  } else {
    rumbleIntensity *= 0.95;
  }
}

function updateCraterGlow(phase) {
  if (phase === 'erupt') {
    craterGlow = lerp(craterGlow, 1, 0.1);
  } else if (phase === 'ash') {
    craterGlow = lerp(craterGlow, 0.5, 0.05);
  } else {
    craterGlow = lerp(craterGlow, 0, 0.05);
  }
}

function resetCycle() {
  // Gradually reset extended shoreline
  extendedShoreline *= 0.98;
  if (extendedShoreline < 1) extendedShoreline = 0;
}

// --- Main Loop ---

function update() {
  const phaseInfo = getVolcanoPhase(time);
  const { phase, progress } = phaseInfo;
  
  updateRumble(phase, progress);
  updateCraterGlow(phase);
  spawnLavaBomb(phase);
  updateLavaBombs();
  spawnAsh(phase, progress);
  updateAshParticles();
  updateSteamParticles();
  spawnLavaFlows(phase, progress);
  updateLavaFlows();
  updateBirds(phase);
  
  if (phase === 'cool') {
    resetCycle();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  const dayFactor = 0.5 + 0.5 * Math.sin((time / dayNightPeriod) * Math.PI * 2 - Math.PI / 2);
  const phaseInfo = getVolcanoPhase(time);
  const { phase, progress } = phaseInfo;
  
  drawSky(dayFactor);
  drawSea(dayFactor, steamParticles);
  drawIsland(dayFactor, extendedShoreline);
  drawLavaFlows(dayFactor);
  drawPalmTrees(dayFactor);
  drawBirds();
  drawAshParticles();
  drawLavaBombs();
  drawCrater(dayFactor, phase, progress, rumbleIntensity, craterGlow);
  
  // Vignette
  const vignetteGrad = ctx.createRadialGradient(W/2, H/2, W * 0.3, W/2, H/2, W * 0.8);
  vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, W, H);
}

function loop() {
  time += 1/60;
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
