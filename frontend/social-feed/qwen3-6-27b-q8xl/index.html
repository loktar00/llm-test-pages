<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Feed</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1c1e21;
    --text-secondary: #65676b;
    --border: #e4e6eb;
    --blue: #1877f2;
    --red: #e74c3c;
    --green: #42b72a;
    --shadow: 0 1px 2px rgba(0,0,0,0.1);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.15);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 16px;
  }

  .feed {
    width: 100%;
    max-width: 580px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Composer ── */
  .composer {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
  }

  .composer-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .composer-input {
    flex: 1;
    background: var(--bg);
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }

  .composer-input:hover { background: #e4e6eb; }

  .composer-divider {
    height: 1px;
    background: var(--border);
    margin: 12px 0;
  }

  .composer-actions {
    display: flex;
    justify-content: space-around;
  }

  .composer-action {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.2s;
    border: none;
    background: none;
  }

  .composer-action:hover { background: var(--bg); }
  .composer-action svg { width: 20px; height: 20px; }

  /* ── Post Card ── */
  .post {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-header {
    display: flex;
    align-items: center;
    padding: 14px 16px 0;
    gap: 10px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    position: relative;
  }

  .avatar::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 12px;
    height: 12px;
    background: var(--green);
    border-radius: 50%;
    border: 2px solid var(--card);
  }

  .post-meta { flex: 1; }

  .post-author {
    font-weight: 700;
    font-size: 15px;
    line-height: 1.3;
  }

  .post-author:hover { text-decoration: underline; cursor: pointer; }

  .post-time {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.3;
  }

  .post-menu {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
    background: none;
    color: var(--text-secondary);
  }

  .post-menu:hover { background: var(--bg); }

  .post-text {
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-image {
    width: 100%;
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .post-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }

  .post-image:hover::after {
    background: rgba(255,255,255,0.05);
  }

  .post-stats {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .post-stats-left {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .post-stats-left:hover { text-decoration: underline; }

  .reaction-icons {
    display: flex;
  }

  .reaction-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    margin-right: -4px;
    border: 2px solid var(--card);
    position: relative;
  }

  .post-actions-bar {
    display: flex;
    border-top: 1px solid var(--border);
    margin: 0 16px;
    padding: 4px 0;
  }

  .action-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 0;
    border: none;
    background: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: visible;
  }

  .action-btn:hover { background: var(--bg); }
  .action-btn svg { width: 20px; height: 20px; transition: all 0.2s; }

  .action-btn.liked {
    color: var(--red);
  }

  .action-btn.liked svg {
    fill: var(--red);
    transform: scale(1.15);
  }

  .action-btn.liked .like-count {
    color: var(--red);
  }

  /* ── Particles ── */
  .particle-container {
    position: absolute;
    top: 50%;
    left: 50%;
    pointer-events: none;
    z-index: 10;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: particleBurst 0.6s ease-out forwards;
  }

  @keyframes particleBurst {
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(var(--tx), var(--ty)) scale(0);
    }
  }

  /* ── Like count bump ── */
  .like-count {
    transition: transform 0.15s ease;
    display: inline-block;
  }

  .like-count.bump {
    animation: countBump 0.3s ease;
  }

  @keyframes countBump {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* ── New Posts Pill ── */
  .new-posts-pill {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--blue);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(24, 119, 242, 0.4);
    border: none;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
  }

  .new-posts-pill.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .new-posts-pill:hover {
    box-shadow: 0 6px 28px rgba(24, 119, 242, 0.5);
    transform: translateX(-50%) translateY(-2px);
  }

  .new-posts-pill:active {
    transform: translateX(-50%) translateY(0) scale(0.97);
  }

  .pill-arrow {
    display: inline-block;
    animation: bounceArrow 1s ease infinite;
  }

  @keyframes bounceArrow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #aaa; }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    body { padding: 8px; }
    .feed { gap: 10px; }
    .composer-action span { display: none; }
  }
</style>
</head>
<body>

<div class="feed" id="feed">
  <!-- Composer -->
  <div class="composer">
    <div class="composer-top">
      <div class="avatar" style="background: linear-gradient(135deg, #667eea, #764ba2);">Y</div>
      <input class="composer-input" placeholder="What's on your mind?" readonly />
    </div>
    <div class="composer-divider"></div>
    <div class="composer-actions">
      <button class="composer-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="#42b72a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <span>Photo</span>
      </button>
      <button class="composer-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f7b928" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Tag</span>
      </button>
      <button class="composer-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f5533d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <span>Feeling</span>
      </button>
    </div>
  </div>

  <!-- Posts will be injected here -->
</div>

<!-- New Posts Pill -->
<button class="new-posts-pill" id="newPostsPill">
  <span class="pill-arrow">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </span>
  New posts
</button>

<script>
const postsData = [
  {
    author: "Maya Chen",
    initials: "MC",
    gradient: "linear-gradient(135deg, #f093fb, #f5576c)",
    time: new Date(Date.now() - 2 * 60000),
    text: "Just shipped the new design system after months of work. So proud of this team! 🎉",
    hasImage: false,
    likes: 142,
    comments: 23,
    shares: 5
  },
  {
    author: "Alex Rivera",
    initials: "AR",
    gradient: "linear-gradient(135deg, #4facfe, #00f2fe)",
    time: new Date(Date.now() - 15 * 60000),
    text: "The view from my morning hike today was absolutely breathtaking. Nature never disappoints. 🏔️",
    hasImage: true,
    imageGradient: "linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%)",
    imageEmoji: "🏔️",
    likes: 89,
    comments: 12,
    shares: 3
  },
  {
    author: "Jordan Park",
    initials: "JP",
    gradient: "linear-gradient(135deg, #a18cd1, #fbc2eb)",
    time: new Date(Date.now() - 45 * 60000),
    text: "Hot take: the best code is the code you don't write. Simplicity wins every time.",
    hasImage: false,
    likes: 312,
    comments: 67,
    shares: 45
  },
  {
    author: "Sam Okafor",
    initials: "SO",
    gradient: "linear-gradient(135deg, #ffecd2, #fcb69f)",
    time: new Date(Date.now() - 2 * 3600000),
    text: "Coffee shop coding session hits different on a rainy Sunday ☕🌧️\n\nCurrently building something I can't wait to share with you all. Stay tuned!",
    hasImage: true,
    imageGradient: "linear-gradient(135deg, #2c3e50 0%, #3498db 50%, #2ecc71 100%)",
    imageEmoji: "☕",
    likes: 56,
    comments: 8,
    shares: 1
  },
  {
    author: "Luna Nakamura",
    initials: "LN",
    gradient: "linear-gradient(135deg, #89f7fe, #66a6ff)",
    time: new Date(Date.now() - 5 * 3600000),
    text: "Spent the weekend restoring a 1970s film camera. There's something magical about analog photography — the anticipation, the imperfection, the soul in every frame. 📸",
    hasImage: true,
    imageGradient: "linear-gradient(135deg, #f5af19 0%, #f12711 100%)",
    imageEmoji: "📸",
    likes: 234,
    comments: 31,
    shares: 12
  },
  {
    author: "Dev Patel",
    initials: "DP",
    gradient: "linear-gradient(135deg, #fddb92, #d1fdff)",
    time: new Date(Date.now() - 8 * 3600000),
    text: "Just adopted a rescue cat named Pixel. She's already claimed the keyboard as her personal bed. Productivity is about to take a hit, but my heart is full. 🐱",
    hasImage: false,
    likes: 478,
    comments: 89,
    shares: 22
  }
];

function timeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 60) return 'just now';
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + 'm';
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + 'h';
  const days = Math.floor(hours / 24);
  return days + 'd';
}

function formatCount(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return n.toString();
}

function createPostHTML(post, index) {
  const isLiked = false;
  const imageHTML = post.hasImage ? `
    <div class="post-image" style="background: ${post.imageGradient};">
      ${post.imageEmoji || ''}
    </div>
  ` : '';

  return `
    <div class="post" style="animation-delay: ${index * 0.08}s" data-index="${index}">
      <div class="post-header">
        <div class="avatar" style="background: ${post.gradient};">${post.initials}</div>
        <div class="post-meta">
          <div class="post-author">${post.author}</div>
          <div class="post-time">${timeAgo(post.time)} · 🌐</div>
        </div>
        <button class="post-menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </div>
      <div class="post-text">${post.text}</div>
      ${imageHTML}
      <div class="post-stats">
        <div class="post-stats-left">
          <div class="reaction-icons">
            <div class="reaction-icon" style="background: #e74c3c; color: #fff;">👍</div>
            <div class="reaction-icon" style="background: #f39c12; color: #fff;">😂</div>
          </div>
          <span class="like-count-display">${formatCount(post.likes)}</span>
        </div>
        <span>${post.comments} comments · ${post.shares} shares</span>
      </div>
      <div class="post-actions-bar">
        <button class="action-btn like-btn" data-likes="${post.likes}" data-index="${index}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span class="like-count">Like</span>
        </button>
        <button class="action-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Comment</span>
        </button>
        <button class="action-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
          <span>Share</span>
        </button>
      </div>
    </div>
  `;
}

// Render posts
const feed = document.getElementById('feed');
postsData.forEach((post, i) => {
  feed.insertAdjacentHTML('beforeend', createPostHTML(post, i));
});

// Like button with particles
document.querySelectorAll('.like-btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const isLiked = this.classList.contains('liked');
    const likesEl = this.querySelector('.like-count');
    const countDisplay = this.closest('.post').querySelector('.like-count-display');
    let currentLikes = parseInt(this.dataset.likes);

    if (!isLiked) {
      this.classList.add('liked');
      currentLikes++;
      this.dataset.likes = currentLikes;

      // Bump animation
      likesEl.classList.remove('bump');
      void likesEl.offsetWidth; // force reflow
      likesEl.classList.add('bump');

      // Update counts
      likesEl.textContent = 'Liked';
      countDisplay.textContent = formatCount(currentLikes);

      // Create particles
      createParticles(this);
    } else {
      this.classList.remove('liked');
      currentLikes--;
      this.dataset.likes = currentLikes;
      likesEl.textContent = 'Like';
      countDisplay.textContent = formatCount(currentLikes);
    }
  });
});

function createParticles(btn) {
  const container = document.createElement('div');
  container.className = 'particle-container';
  btn.appendChild(container);

  const colors = ['#e74c3c', '#f39c12', '#e67e22', '#ff6b6b', '#ffd93d', '#ff8a5c'];
  const particleCount = 10;

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    const angle = (360 / particleCount) * i + (Math.random() * 20 - 10);
    const distance = 20 + Math.random() * 25;
    const tx = Math.cos(angle * Math.PI / 180) * distance;
    const ty = Math.sin(angle * Math.PI / 180) * distance;
    particle.style.setProperty('--tx', tx + 'px');
    particle.style.setProperty('--ty', ty + 'px');
    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
    particle.style.width = (4 + Math.random() * 4) + 'px';
    particle.style.height = particle.style.width;
    container.appendChild(particle);
  }

  setTimeout(() => container.remove(), 700);
}

// New Posts Pill
const pill = document.getElementById('newPostsPill');
let pillVisible = false;

setTimeout(() => {
  pill.classList.add('visible');
  pillVisible = true;
}, 4000);

pill.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  pill.classList.remove('visible');
  pillVisible = false;

  // Show again after scrolling
  setTimeout(() => {
    if (!pillVisible) {
      pill.classList.add('visible');
      pillVisible = true;
    }
  }, 8000);
});

// Also show pill on scroll down
let scrollTimeout;
window.addEventListener('scroll', () => {
  if (window.scrollY > 600 && !pillVisible) {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      pill.classList.add('visible');
      pillVisible = true;
    }, 1000);
  }
});
</script>
</body>
</html>
