<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0}body{overflow:hidden;background:#000}canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

const stars=[];
for(let i=0;i<400;i++){
  stars.push({x:Math.random()*2000,y:Math.random()*800,r:Math.random()*1.4+.3,
    b:Math.random()*.6+.4,ph:Math.random()*Math.PI*2});
}

const meteors=[];
const bolides=[];
let waveTime=0,waveIntensity=0,waveDuration=0,waveCooldown=0,nextBolide=false,skyFlash=0;

function startWave(){waveDuration=3000+Math.random()*5000;waveIntensity=0;nextBolide=true}
function updateWave(dt){
  if(waveCooldown>0){
    waveCooldown-=dt;
    if(waveIntensity<1)waveIntensity+=dt/1200;
    if(waveIntensity>=1&&waveCooldown<=0)startWave();
    if(waveCooldown<=0)startWave();
  }else{
    waveIntensity-=dt/2500;
    if(waveIntensity<=0){waveIntensity=0;waveCooldown=3000+Math.random()*6000}
  }
}

function spawnMeteor(){
  const angle=Math.PI*.12+Math.random()*Math.PI*.32;
  const speed=350+Math.random()*700;
  meteors.push({
    x:Math.random()*W*1.4-W*.15,y:-20-Math.random()*H*.25,
    vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
    life:1,decay:.003+Math.random()*.006,
    len:60+Math.random()*200,
    hue:Math.random()>.75?200+Math.random()*40:Math.random()>.5?30+Math.random()*25:0,
    sat:Math.random()>.7?60:20,light:70+Math.random()*25
  });
}

function spawnBolide(){
  const angle=Math.PI*.08+Math.random()*Math.PI*.3;
  const speed=450+Math.random()*500;
  bolides.push({
    x:Math.random()*W-W*.1,y:-40-Math.random()*H*.2,
    vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
    life:1,decay:.0015+Math.random()*.0025,
    smokeLife:1,smokeDecay:.0006+Math.random()*.0004,
    w:3+Math.random()*4,sw:18+Math.random()*20,
    hue:30+Math.random()*20
  });
  skyFlash=.7+Math.random()*.35;
}

function drawRidge(){
  ctx.fillStyle='#08080e';
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*.84);
  for(let i=0;i<=60;i++){
    const x=(i/60)*W;
    const m=Math.sin(i*.25)*H*.06+Math.sin(i*.6+1)*H*.035+Math.sin(i*.12+2)*H*.07;
    ctx.lineTo(x,H*.82+m);
  }
  ctx.lineTo(W,H*.86);ctx.lineTo(W,H);ctx.closePath();ctx.fill();

  ctx.fillStyle='#050510';
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*.89);
  for(let i=0;i<=60;i++){
    const x=(i/60)*W;
    const m=Math.sin(i*.45+3)*H*.025+Math.sin(i*.18+1)*H*.045;
    ctx.lineTo(x,H*.87+m);
  }
  ctx.lineTo(W,H*.91);ctx.lineTo(W,H);ctx.closePath();ctx.fill();

  // Trees on ridge
  ctx.fillStyle='#030308';
  for(let i=0;i<40;i++){
    const tx=(i/40)*W+Math.sin(i*7)*20;
    const baseY=H*.87+Math.sin(i*.45+3)*H*.025+Math.sin(i*.18+1)*H*.045;
    const th=15+Math.sin(i*3)*8;
    ctx.beginPath();
    ctx.moveTo(tx,baseY);
    ctx.lineTo(tx-4,baseY-th);
    ctx.lineTo(tx-1,baseY-th-6);
    ctx.lineTo(tx,baseY-th-10);
    ctx.lineTo(tx+1,baseY-th-6);
    ctx.lineTo(tx+4,baseY-th);
    ctx.closePath();ctx.fill();
  }
}

function drawStars(){
  for(const s of stars){
    const sx=(s.x/2000)*W,sy=(s.y/800)*H;
    if(sx<-5||sx>W+5||sy<-5||sy>H+5)continue;
    const tw=s.b*(.6+.4*Math.sin(Date.now()*.0008+s.ph));
    ctx.fillStyle=`rgba(240,240,255,${tw})`;
    ctx.beginPath();ctx.arc(sx,sy,s.r,0,Math.PI*2);ctx.fill();
  }
}

function drawMeteors(){
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i];
    m.x+=m.vx*.016;m.y+=m.vy*.016;m.life-=m.decay;
    if(m.life<=0||m.y>H*.92||m.x>W+300||m.x<-300){meteors.splice(i,1);continue}
    const t=m.len/500;
    const tx=m.x-m.vx*.016*t,ty=m.y-m.vy*.016*t;
    const grad=ctx.createLinearGradient(tx,ty,m.x,m.y);
    grad.addColorStop(0,`hsla(${m.hue},${m.sat}%,${m.light}%,0)`);
    grad.addColorStop(.6,`hsla(${m.hue},${m.sat}%,${m.light}%,${m.life*.25})`);
    grad.addColorStop(1,`hsla(${m.hue},${m.sat}%,95%,${m.life})`);
    ctx.strokeStyle=grad;ctx.lineWidth=1.5+Math.random()*.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${m.life})`;
    ctx.beginPath();ctx.arc(m.x,m.y,1.5,0,Math.PI*2);ctx.fill();
  }
}

function drawBolides(){
  for(let i=bolides.length-1;i>=0;i--){
    const b=bolides[i];
    b.x+=b.vx*.016;b.y+=b.vy*.016;b.life-=b.decay;b.smokeLife-=b.smokeDecay;
    if(b.life<=0&&b.smokeLife<=0){bolides.splice(i,1);continue}
    if(b.smokeLife>0){
      const tx=b.x-b.vx*.016*35,ty=b.y-b.vy*.016*35;
      const sg=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.sw);
      sg.addColorStop(0,`rgba(190,200,220,${b.smokeLife*.35})`);
      sg.addColorStop(.4,`rgba(140,150,170,${b.smokeLife*.15})`);
      sg.addColorStop(1,`rgba(80,90,110,0)`);
      ctx.fillStyle=sg;
      ctx.beginPath();
      ctx.ellipse(b.x,b.y,b.sw,b.sw*.35,Math.atan2(b.vy,b.vx),0,Math.PI*2);
      ctx.fill();
      const sg2=ctx.createLinearGradient(tx,ty,b.x,b.y);
      sg2.addColorStop(0,`rgba(170,180,200,0)`);
      sg2.addColorStop(1,`rgba(190,200,220,${b.smokeLife*.25})`);
      ctx.strokeStyle=sg2;ctx.lineWidth=b.sw*.7;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    if(b.life>0){
      const tl=150,tx=b.x-b.vx*.016*tl/500,ty=b.y-b.vy*.016*tl/500;
      const grad=ctx.createLinearGradient(tx,ty,b.x,b.y);
      grad.addColorStop(0,`hsla(${b.hue},40%,90%,0)`);
      grad.addColorStop(.4,`hsla(${b.hue},50%,90%,${b.life*.5})`);
      grad.addColorStop(1,`hsla(${b.hue},20%,100%,${b.life})`);
      ctx.strokeStyle=grad;ctx.lineWidth=b.w;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b.x,b.y);ctx.stroke();
      const glow=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,18);
      glow.addColorStop(0,`rgba(255,255,255,${b.life})`);
      glow.addColorStop(.2,`hsla(${b.hue},40%,90%,${b.life*.5})`);
      glow.addColorStop(1,`hsla(${b.hue},30%,80%,0)`);
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(b.x,b.y,18,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawSkyFlash(){
  if(skyFlash>0){
    ctx.fillStyle=`rgba(180,190,220,${skyFlash*.25})`;
    ctx.fillRect(0,0,W,H);
    skyFlash*=.94;if(skyFlash<.005)skyFlash=0;
  }
}

let lastT=performance.now();
function frame(now){
  const dt=Math.min(now-lastT,50);lastT=now;
  waveTime+=dt;updateWave(dt);
  const rate=waveIntensity*10;
  if(Math.random()<rate*dt/1000)spawnMeteor();
  if(nextBolide&&waveIntensity>.75){spawnBolide();nextBolide=false}
  ctx.fillStyle='rgba(4,4,14,0.1)';ctx.fillRect(0,0,W,H);
  drawSkyFlash();drawBolides();drawMeteors();drawRidge();drawStars();
  requestAnimationFrame(frame);
}
ctx.fillStyle='#04040e';ctx.fillRect(0,0,W,H);
requestAnimationFrame(frame);
</script>
</body>
</html>
