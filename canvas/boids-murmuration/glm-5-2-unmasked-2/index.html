<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boids Murmuration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, horizon = 0;
let bg = null;

function resize() {
  W = canvas.width = Math.floor(window.innerWidth * window.devicePixelRatio);
  H = canvas.height = Math.floor(window.innerHeight * window.devicePixelRatio);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  horizon = Math.floor(H * 0.72);
  buildBackground();
}

// Pre-rendered dusk landscape with layered hills + trees
function buildBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#0e0a1a');
  g.addColorStop(0.10, '#1a1228');
  g.addColorStop(0.25, '#3a1f3e');
  g.addColorStop(0.42, '#7c2a45');
  g.addColorStop(0.55, '#c25240');
  g.addColorStop(0.66, '#e08436');
  g.addColorStop(0.74, '#9a4a38');
  g.addColorStop(0.82, '#3a1828');
  g.addColorStop(1.00, '#070310');

  bg = document.createElement('canvas');
  bg.width = W;
  bg.height = H;
  const bctx = bg.getContext('2d');
  bctx.fillStyle = g;
  bctx.fillRect(0, 0, W, H);

  // Atmospheric glow band along the horizon
  const glow = bctx.createLinearGradient(0, H * 0.55, 0, H * 0.85);
  glow.addColorStop(0, 'rgba(255, 180, 90, 0)');
  glow.addColorStop(0.5, 'rgba(255, 160, 70, 0.22)');
  glow.addColorStop(1, 'rgba(255, 140, 50, 0)');
  bctx.fillStyle = glow;
  bctx.fillRect(0, H * 0.55, W, H * 0.30);

  // Sun haze
  const sunX = W * 0.72;
  const sunY = horizon - 8;
  const sg = bctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, W * 0.55);
  sg.addColorStop(0, 'rgba(255, 200, 120, 0.30)');
  sg.addColorStop(0.25, 'rgba(255, 160, 80, 0.12)');
  sg.addColorStop(1, 'rgba(255, 140, 50, 0)');
  bctx.fillStyle = sg;
  bctx.fillRect(0, 0, W, H);

  // Far hills
  bctx.fillStyle = '#1a0c1c';
  bctx.beginPath();
  bctx.moveTo(0, horizon + 2);
  for (let x = 0; x <= W; x += 4) {
    const y = horizon + 8 + Math.sin(x * 0.0055) * 6 + Math.sin(x * 0.013) * 3 + Math.sin(x * 0.0023 + 1) * 5;
    bctx.lineTo(x, y);
  }
  bctx.lineTo(W, H);
  bctx.lineTo(0, H);
  bctx.fill();

  // Middle hills
  bctx.fillStyle = '#0c0712';
  bctx.beginPath();
  bctx.moveTo(0, horizon + 35);
  for (let x = 0; x <= W; x += 4) {
    const y = horizon + 35 + Math.sin(x * 0.008 + 1.5) * 14 + Math.sin(x * 0.017 + 3) * 6 + Math.sin(x * 0.0033) * 9;
    bctx.lineTo(x, y);
  }
  bctx.lineTo(W, H);
  bctx.lineTo(0, H);
  bctx.fill();

  // Near ground
  bctx.fillStyle = '#060309';
  bctx.beginPath();
  bctx.moveTo(0, H * 0.82);
  for (let x = 0; x <= W; x += 4) {
    const y = H * 0.82 + Math.sin(x * 0.011) * 8 + Math.sin(x * 0.025 + 2) * 4;
    bctx.lineTo(x, y);
  }
  bctx.lineTo(W, H);
  bctx.lineTo(0, H);
  bctx.fill();

  // Distant trees on middle ridge
  bctx.fillStyle = '#080510';
  for (let i = 0; i < 90; i++) {
    const x = (i / 90) * W + (Math.random() - 0.5) * 12;
    const baseY = horizon + 33 + Math.sin(x * 0.008 + 1.5) * 14 + Math.sin(x * 0.017 + 3) * 6;
    const h = 6 + Math.random() * 14;
    drawConifer(bctx, x, baseY, h);
  }

  // Foreground trees
  bctx.fillStyle = '#040208';
  for (let i = 0; i < 14; i++) {
    const x = Math.random() * W;
    const baseY = H * 0.82 + Math.sin(x * 0.011) * 8 + Math.sin(x * 0.025 + 2) * 4;
    const h = 60 + Math.random() * 130;
    drawConifer(bctx, x, baseY, h);
  }
}

function drawConifer(c, x, baseY, h) {
  const w = h * 0.42;
  c.beginPath();
  c.moveTo(x, baseY - h);
  c.lineTo(x - w * 0.35, baseY - h * 0.72);
  c.lineTo(x - w * 0.22, baseY - h * 0.72);
  c.lineTo(x - w * 0.55, baseY - h * 0.45);
  c.lineTo(x - w * 0.32, baseY - h * 0.45);
  c.lineTo(x - w * 0.72, baseY - h * 0.22);
  c.lineTo(x - w * 0.42, baseY - h * 0.22);
  c.lineTo(x - w * 0.85, baseY);
  c.lineTo(x + w * 0.85, baseY);
  c.lineTo(x + w * 0.42, baseY - h * 0.22);
  c.lineTo(x + w * 0.72, baseY - h * 0.22);
  c.lineTo(x + w * 0.32, baseY - h * 0.45);
  c.lineTo(x + w * 0.55, baseY - h * 0.45);
  c.lineTo(x + w * 0.22, baseY - h * 0.72);
  c.lineTo(x + w * 0.35, baseY - h * 0.72);
  c.closePath();
  c.fill();
}

window.addEventListener('resize', resize);
resize();

// Boids
const NUM = Math.min(700, Math.max(400, Math.floor((W * H) / 9000)));
const boids = [];
const SQRT2 = Math.sqrt(2);
const visionR = 38 * SQRT2;
const personalR = 12 * SQRT2;

for (let i = 0; i < NUM; i++) {
  boids.push({
    x: Math.random() * W,
    y: Math.random() * horizon * 0.95,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1.5,
  });
}

// Predator
let predator = { x: -9999, y: -9999, life: 0, maxLife: 0, vx: 0, vy: 0, active: false };
function spawnPredator() {
  const side = Math.random();
  if (side < 0.5) {
    predator.x = -60;
    predator.vx = 0.4 + Math.random() * 0.3;
  } else {
    predator.x = W + 60;
    predator.vx = -(0.4 + Math.random() * 0.3);
  }
  predator.y = horizon * 0.18 + Math.random() * horizon * 0.45;
  predator.vy = (Math.random() - 0.5) * 0.25;
  predator.life = 0;
  predator.maxLife = 360 + Math.random() * 360;
  predator.active = true;
}

function schedulePredator() {
  setTimeout(() => {
    if (predator.active) { schedulePredator(); return; }
    spawnPredator();
    schedulePredator();
  }, 5000 + Math.random() * 13000);
}
setTimeout(spawnPredator, 2500);
schedulePredator();

    const cy = Math.floor(b.y / CELL);
    const k = key(cx, cy);
    let cell = grid.get(k);
    if (!cell) { cell = []; grid.set(k, cell); }
    cell.push(i);

  const visDist = visionR * visionR;

  const predRangeSq = predRange * predRange;

    const cy = Math.floor(b.y / CELL);

    let ax = 0, ay = 0, ac = 0;
