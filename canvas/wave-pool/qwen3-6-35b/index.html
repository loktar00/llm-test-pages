<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Wave Interference Tank</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            image-rendering: pixelated; /* Crisp grid look */
        }
    </style>
</head>
<body>
    <canvas id="tank"></canvas>
    <script>
        // Configuration
        const CONFIG = {
            width: 640,
            height: 360,
            scale: 2, // UI Scale
            damping: 0.985, // Energy loss per frame
            waveSpeed: 0.25, // Propagation speed
            numSources: 3,
            colorPalette: [
                0x001133, // Deep dark blue (trough)
                0x004488, // Mid blue
                0x66AAFF, // Light blue
                0xFFFFFF, // White (crest)
                0xDDFFFF  // Sparkle white
            ]
        };

        // Setup Canvas
        const canvas = document.getElementById('tank');
        const ctx = canvas.getContext('2d', { alpha: false });
        canvas.width = CONFIG.width;
        canvas.height = CONFIG.height;
        canvas.style.width = (CONFIG.width * CONFIG.scale) + 'px';
        canvas.style.height = (CONFIG.height * CONFIG.scale) + 'px';

        // State Variables
        let buf1, buf2, obstacles;
        let sources = [];
        let frameCount = 0;
        
        // Image Data for rendering
        const imgData = ctx.createImageData(CONFIG.width, CONFIG.height);
        const data = imgData.data;

        // --- Initialization ---

        function init() {
            // Initialize buffers using Float32 for precision (or Int16 for speed, Float is safer for interference)
            // We use typed arrays for the wave simulation
            const size = CONFIG.width * CONFIG.height;
            buf1 = new Float32Array(size);
            buf2 = new Float32Array(size);
            
            // Initialize obstacles (0 = water, 1 = wall)
            obstacles = new Uint8Array(size);
            
            // Create Walls
            for(let y = 0; y < CONFIG.height; y++) {
                obstacles[y * CONFIG.width] = 1;      // Left
                obstacles[(y * CONFIG.width) + CONFIG.width - 1] = 1; // Right
            }
            for(let x = 0; x < CONFIG.width; x++) {
                obstacles[x] = 1;             // Top
                obstacles[(CONFIG.height - 1) * CONFIG.width + x] = 1; // Bottom
            }

            // Create Barriers with Slits (Diffraction)
            createBarriers();

            // Initialize Sources
            for(let i=0; i<CONFIG.numSources; i++) {
                sources.push(new Source());
            }

            loop();
        }

        function createBarriers() {
            const barrierWidth = 4;
            const slitWidth = 6;
            const startX = Math.floor(CONFIG.width * 0.6);
            const centerY = Math.floor(CONFIG.height / 2);
            
            // Barrier 1: Top, Slit 1, Middle
            for(let x = startX; x < startX + 10; x++) {
                for(let y = 0; y < centerY - slitWidth/2; y++) {
                    if (y > centerY - slitWidth/2 - barrierWidth && y < centerY - slitWidth/2) continue; // Gap
                    obstacles[y * CONFIG.width + x] = 1;
                }
            }
            
            // Barrier 2: Bottom, Slit 2, Middle
            for(let x = startX; x < startX + 10; x++) {
                for(let y = centerY + slitWidth/2; y < CONFIG.height; y++) {
                    if (y < centerY + slitWidth/2 + barrierWidth && y > centerY + slitWidth/2) continue; // Gap
                    obstacles[y * CONFIG.width + x] = 1;
                }
            }

            // Middle Bridge (optional, to make it a clear double slit experiment)
            // Actually, standard double slit usually has a wall with two holes.
            // Let's refine: One solid wall with two holes.
            
            // Reset
            obstacles.fill(0);
            // Re-add borders
            for(let y = 0; y < CONFIG.height; y++) {
                obstacles[y * CONFIG.width] = 1;
                obstacles[(y * CONFIG.width) + CONFIG.width - 1] = 1;
            }
            for(let x = 0; x < CONFIG.width; x++) {
                obstacles[x] = 1;
                obstacles[(CONFIG.height - 1) * CONFIG.width + x] = 1;
            }

            const wallX = Math.floor(CONFIG.width * 0.5);
            const slit1Y = centerY - 15;
            const slit2Y = centerY + 15;

            for(let x = wallX; x < wallX + 5; x++) {
                for(let y = 0; y < CONFIG.height; y++) {
                    let inSlit = (y > slit1Y - 3 && y < slit1Y + 3) || 
                                 (y > slit2Y - 3 && y < slit2Y + 3);
                    if(!inSlit) {
                        obstacles[y * CONFIG.width + x] = 1;
                    }
                }
            }
        }

        class Source {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * (CONFIG.width * 0.4) + 20;
                this.y = Math.random() * (CONFIG.height - 40) + 20;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.frequency = 0.05 + Math.random() * 0.05;
                this.amplitude = 2.0 + Math.random() * 1.5;
                this.phase = Math.random() * Math.PI * 2;
            }

            update() {
                // Move
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls (soft)
                if (this.x < 20 || this.x > CONFIG.width - 20) this.vx *= -1;
                if (this.y < 20 || this.y > CONFIG.height - 20) this.vy *= -1;

                // Randomly change frequency occasionally
                if (Math.random() < 0.005) {
                    this.frequency = 0.03 + Math.random() * 0.08;
                }
            }

            emit(buf) {
                this.phase += this.frequency;
                const val = Math.sin(this.phase) * this.amplitude;
                
                // Gaussian-ish distribution for point source
                const r2 = 3;
                for(let dy = -3; dy <= 3; dy++) {
                    for(let dx = -3; dx <= 3; dx++) {
                        const idx = (this.y + dy) * CONFIG.width + (this.x + dx);
                        if (idx >= 0 && idx < buf.length) {
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            const falloff = Math.max(0, 1 - dist/3.5);
                            buf[idx] += val * falloff;
                        }
                    }
                }
            }
        }

        // --- Simulation Loop ---

        function updatePhysics() {
            // 1. Emit Sources
            for(let s of sources) {
                s.update();
                s.emit(buf2); // Emit into the buffer we are about to become the "current" one
            }

            // 2. Wave Equation Step
            // New[i] = (2*Old[i] - Prev[i] + c^2 * Laplacian) * damping
            // Laplacian = sum(neighbors) - 4*center
            
            const w = CONFIG.width;
            const h = CONFIG.height;
            const c2 = CONFIG.waveSpeed; 
            const damp = CONFIG.damping;

            // We iterate through the buffer, but we need to handle the obstacle logic
            // We will read from buf1 and write to buf2. 
            // Since sources wrote to buf2 already, we need to be careful.
            // Actually, standard approach:
            // Calculate new wave values into a temp buffer or buf2 (overwriting source injection if careful).
            // Let's restructure slightly:
            // 1. Clear buf2.
            // 2. Calculate Wave Propagation from buf1 into buf2.
            // 3. Add Source contributions to buf2.
            
            // This is safer.
            
            const len = w * h;
            
            // Pre-calculate offsets to avoid multiplication in inner loop
            const up = -w;
            const down = w;
            const left = -1;
            const right = 1;

            for (let y = 1; y < h - 1; y++) {
                const rowOffset = y * w;
                for (let x = 1; x < w - 1; x++) {
                    const idx = rowOffset + x;
                    
                    if (obstacles[idx]) {
                        buf2[idx] = 0; // Walls stay flat
                        continue;
                    }

                    // Wave propagation
                    // Using the 5-point stencil Laplacian
                    const laplacian = buf1[idx + up] + 
                                      buf1[idx + down] + 
                                      buf1[idx + left] + 
                                      buf1[idx + right] - 
                                      (4.0 * buf1[idx]);

                    // Formula: new = 2*current - prev + (speed * laplacian)
                    // We are calculating into buf2, reading from buf1
                    // But wait, we are swapping buffers. 
                    // Let's say buf1 is "current", buf2 is "previous" (in next frame).
                    // The equation is usually: f(t+1) = 2f(t) - f(t-1) + c^2 * del2 f(t)
                    
                    buf2[idx] = (2.0 * buf1[idx] - buf2[idx] + (c2 * laplacian)) * damp;
                }
            }

            // Swap buffers
            let temp = buf1;
            buf1 = buf2;
            buf2 = temp;
        }

        // --- Rendering ---

        function render() {
            const w = CONFIG.width;
            const h = CONFIG.height;
            const len = w * h;

            for (let i = 0; i < len; i++) {
                let val = buf1[i];
                let r, g, b;

                if (obstacles[i]) {
                    // Render Obstacles
                    r = 30; g = 30; b = 40;
                } else {
                    // Render Water
                    // Normalize roughly between -2 and 2
                    // val * 0.5 roughly maps -4..4 to -2..2
                    
                    if (val > 1.5) {
                        // Crests: Sparkle white
                        r = 255;
                        g = 255;
                        b = 255;
                        // Add some sparkle logic based on magnitude
                        if (Math.random() > 0.8) { // Occasional sparkle
                            r = 255; g = 255; b = 255;
                        }
                    } else if (val < -1.5) {
                        // Troughs: Dark Blue
                        r = 0; g = 10; b = 30;
                    } else {
                        // Interpolation
                        // Map val from [-1.5, 1.5] to [0, 1]
                        let t = (val + 1.5) / 3.0;
                        t = Math.max(0, Math.min(1, t));

                        // Color Lerp logic (simplified for speed)
                        // Palette: DarkBlue (0), BlueMid (0.5), White (1)
                        if (t < 0.5) {
                            // Dark Blue to Mid Blue
                            let p = t * 2; // 0 to 1
                            r = p * 0; // 0 -> 0
                            g = 17 + p * 55; // 17 -> 72
                            b = 51 + p * 85; // 51 -> 136
                        } else {
                            // Mid Blue to White
                            let p = (t - 0.5) * 2; // 0 to 1
                            r = p * 255; // 0 -> 255
                            g = 72 + p * 183;
                            b = 136 + p * 119;
                        }
                    }
                }

                const idx = i * 4;
                data[idx] = r;
                data[idx + 1] = g;
                data[idx + 2] = b;
                data[idx + 3] = 255; // Alpha
            }

            ctx.putImageData(imgData, 0, 0);
        }

        function loop() {
            frameCount++;
            updatePhysics();
            render();
            requestAnimationFrame(loop);
        }

        // Start
        init();

    </script>
</body>
</html>
