<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perpetual Pinball</title>
<style>
html,body{margin:0;height:100;background:#07050a;overflow:hidden;font-family:ui-monospace,monospace;color:#e8eaff}
#c{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:1}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font:600 12px/14 ui-monospace;letter-spacing:6px;pointer-events:none}
#top b{color:#00f5d4;letter-spacing:1px;font-size:14px}
#top .r{color:#ff0a6e}
#top .l{color:#00f5d4}
#top .g{color:#fff000}
#top .c{color:#b0b4ff}
#bot{position:fixed;bottom:8px;left:8px;right:8px;font:10px/14 ui-monospace;letter-spacing:3px;color:#4a4978;pointer-events:none;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <span class="c">SCORE <b id="score" style="color:#b0b4ff">000</b></span>
  <span class="c">BALL <b id="balln" class="c">∞</b></span>
  <span class="c">BEST <b id="best" class="g">000</b></span>
</div>
<div id="bot">PERPETUAL PINBALL · AUTONOMOUS · NO PLAYER REQUIRED</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
let W=0,H=0,TBL=0,TBY=0,TBR=0,TBY=0,TBH=0,FL=0,FLY=0,FLH=0,SCL=1;
const DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){
  W=C.clientWidth=window.innerWidth;H=C.clientHeight=window.innerHeight;
  C.width=Math.floor(W*DPR);C.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const tb=Math.min(W,H)*0.04;
  TBL=Math.max(50,W*(0.42);
  TBL=Math.max(W*0.42,W*0.42);
  TBL=W*0.42;
}
</script>
</body>
</html>
