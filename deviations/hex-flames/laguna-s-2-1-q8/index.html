<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hexagonal Fire Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="fireCanvas"></canvas>
<script>
    const canvas = document.getElementById('fireCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    // Hex grid parameters
    const hexRadius = Math.max(8, Math.min(width, height) / 40);
    const hexWidth = Math.sqrt(3) * hexRadius;
    const hexHeight = 2 * hexRadius;

    // Number of columns and rows
    const cols = Math.ceil(width / hexWidth) + 2;
    const rows = Math.ceil(height / (hexHeight * 0.75)) + 2;

    // Temperature grid
    let temperatures = new Array(rows);
    for (let y = 0; y < rows; y++) {
        temperatures[y] = new Float32Array(cols);
    }

    // Sparks list
    const sparks = [];

    // Wind bias parameter (-1 to 1)
    let windBias = 0;

    // Palette generation: red -> orange -> yellow -> white
    function getHeatColor(temp) {
        if (temp <= 0) return '#000000';
        const t = Math.min(1, temp / 100);
        let r, g, b;
        if (t < 0.25) {
            r = 1;
            g = t * 4;
            b = 0;
        } else if (t < 0.5) {
            r = 1;
            g = 1;
            b = (t - 0.25) * 4;
        } else if (t < 0.75) {
            r = 1;
            g = 1 - (t - 0.5) * 4;
            b = 1;
        } else {
            r = 1 - (t - 0.75) * 4;
            g = 1 - (t - 0.75) * 4;
            b = 1;
        }
        return `rgb(${Math.round(r*255)}, ${Math.round(g*255)}, ${Math.round(b*255)})`;
    }

    // Hex corner positions
    function getHexCorners(cx, cy, r) {
        const corners = [];
        for (let i = 0; i < 6; i++) {
            const angle = (i * 60 - 30) * Math.PI / 180;
            corners.push({
                x: cx + r * Math.cos(angle),
                y: cy + r * Math.sin(angle)
            });
        }
        return corners;
    }

    // Render a single hexagon
    function drawHex(cx, cy, r, color) {
        const corners = getHexCorners(cx, cy, r);
        ctx.beginPath();
        ctx.moveTo(corners[0].x, corners[0].y);
        for (let i = 1; i < 6; i++) {
            ctx.lineTo(corners[i].x, corners[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
    }

    // Main simulation loop
    function updateAndRender() {
        ctx.clearRect(0, 0, width, height);

        // Apply wind bias oscillation
        windBias = Math.sin(performance.now() / 3000) * 0.2;

        // Update temperatures using hex neighbor propagation
        const newTemps = new Array(rows);
        for (let y = 0; y < rows; y++) {
            newTemps[y] = new Float32Array(cols);
        }

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                let sum = 0, count = 0;
                // Get neighbors based on hex offset pattern
                // For odd rows shifted half width
                const isOddRow = y % 2 !== 0;
                const offsets = [
                    [-1, 0], [1, 0],
                    [0, -1], [0, 1],
                    isOddRow ? [1, -1] : [-1, -1],
                    isOddRow ? [1, 1] : [-1, 1]
                ];

                for (const [dx, dy] of offsets) {
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                        sum += temperatures[ny][nx];
                        count++;
                    }
                }

                // Base heat at bottom row
                if (y === rows - 1) {
                    sum += 100 + Math.random() * 50;
                    count++;
                }

                // Cooling factor with random flicker
                const avg = sum / Math.max(count, 1);
                const cooling = 0.98 + Math.random() * 0.02;
                newTemps[y][x] = Math.max(0, avg * cooling);

                // Occasional sparks detachment from high temp cells
                if (temperatures[y][x] > 90 && Math.random() < 0.02) {
                    sparks.push({
                        x: x * hexWidth + (y % 2) * hexWidth / 2,
                        y: y * hexHeight * 0.75,
                        vx: (Math.random() - 0.5) * 2 + windBias,
                        vy: -Math.random() * 2 - 1,
                        life: 1
                    });
                }
            }
        }

        temperatures = newTemps;

        // Render hex grid
        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const cx = x * hexWidth + (y % 2) * hexWidth / 2 - hexWidth / 2;
                const cy = y * hexHeight * 0.75;

                if (cx > -hexWidth && cx < width + hexWidth && cy > -hexHeight && cy < height + hexHeight) {
                    const temp = temperatures[y][x];
                    if (temp > 1) {
                        drawHex(cx, cy, hexRadius, getHeatColor(temp));
                    }
                }
            }
        }

        // Update and render sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
            const s = sparks[i];
            s.x += s.vx;
            s.y += s.vy;
            s.life -= 0.01;
            s.vy -= 0.1; // Gravity reversal (float upward)

            if (s.life <= 0 || s.y < 0 || s.x < 0 || s.x > width) {
                sparks.splice(i, 1);
                continue;
            }

            const sparkTemp = s.life * 100;
            drawHex(s.x, s.y, hexRadius * 0.3, getHeatColor(sparkTemp));
        }

        requestAnimationFrame(updateAndRender);
    }

    requestAnimationFrame(updateAndRender);
</script>
</body>
</html>
