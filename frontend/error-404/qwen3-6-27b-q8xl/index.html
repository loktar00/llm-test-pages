<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost in Space</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --navy-deep:#0a0e27;
    --navy-mid:#111640;
    --moon-fill:#e8e4d8;
    --moon-shadow:#c8c0a8;
    --glow-color:rgba(180,200,255,0.45);
    --accent:#7b8cff;
    --accent-bright:#a8b4ff;
    --btn-bg:#2a2f5e;
    --btn-hover:#3d4480;
  }

  html,body{
    height:100%;
    overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 40%,var(--navy-mid) 0%,var(--navy-deep) 70%);
    color:#fff;
  }

  /* ── stars ── */
  .stars-layer{
    position:fixed;inset:0;pointer-events:none;z-index:0;
  }
  .star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation:twinkle var(--dur) ease-in-out infinite alternate;
    animation-delay:var(--delay);
  }
  @keyframes twinkle{
    0%{opacity:var(--min-o);transform:scale(1)}
    100%{opacity:1;transform:scale(var(--sc))}
  }

  /* ── main layout ── */
  .scene{
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    height:100%;
    padding:2rem;
    text-align:center;
  }

  /* ── 404 headline ── */
  .headline{
    display:flex;align-items:center;justify-content:center;
    gap:0.02em;
    font-size:clamp(6rem,20vw,16rem);
    font-weight:900;
    line-height:1;
    letter-spacing:-0.04em;
    color:rgba(255,255,255,0.92);
    text-shadow:
      0 0 20px var(--glow-color),
      0 0 60px rgba(120,140,255,0.18);
    animation:breathe 4s ease-in-out infinite alternate;
    user-select:none;
  }
  @keyframes breathe{
    0%{
      text-shadow:
        0 0 18px rgba(180,200,255,0.30),
        0 0 50px rgba(120,140,255,0.12);
    }
    100%{
      text-shadow:
        0 0 30px rgba(180,200,255,0.55),
        0 0 80px rgba(120,140,255,0.25),
        0 0 120px rgba(120,140,255,0.08);
    }
  }

  .digit{display:inline-block}

  /* ── moon (the zero) ── */
  .moon-wrap{
    position:relative;
    width:0.85em;height:0.85em;
    display:inline-flex;align-items:center;justify-content:center;
    vertical-align:middle;
  }
  .moon{
    width:80%;height:80%;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 35%,#f5f2ea 0%,transparent 50%),
      radial-gradient(circle at 55% 50%,var(--moon-fill) 0%,var(--moon-shadow) 100%);
    box-shadow:
      inset -12px -8px 20px rgba(0,0,0,0.25),
      inset 4px 4px 12px rgba(255,255,255,0.15),
      0 0 40px rgba(200,200,230,0.15);
    position:relative;
    overflow:hidden;
  }
  /* craters */
  .moon::before,.moon::after{
    content:'';position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(0,0,0,0.10) 0%,transparent 70%);
  }
  .moon::before{width:28%;height:28%;top:22%;left:25%}
  .moon::after{width:18%;height:18%;top:55%;left:55%}

  .crater{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(0,0,0,0.08) 0%,transparent 70%);
  }
  .crater:nth-child(1){width:12%;height:12%;top:68%;left:28%}
  .crater:nth-child(2){width:15%;height:15%;top:15%;left:60%}
  .crater:nth-child(3){width:10%;height:10%;top:45%;left:18%}

  /* ── orbit + satellite ── */
  .orbit{
    position:absolute;
    width:140%;height:140%;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    animation:spin 6s linear infinite;
    pointer-events:none;
  }
  .orbit-ring{
    position:absolute;inset:0;
    border:1px solid rgba(180,200,255,0.08);
    border-radius:50%;
  }
  .satellite{
    position:absolute;
    top:-5px;left:50%;
    transform:translateX(-50%);
    width:10px;height:10px;
  }
  .satellite::before{
    content:'';position:absolute;
    width:100%;height:100%;
    background:var(--accent-bright);
    border-radius:2px;
    box-shadow:0 0 6px var(--accent),0 0 14px rgba(120,140,255,0.4);
    animation:sat-pulse 1.5s ease-in-out infinite alternate;
  }
  /* solar panels */
  .satellite::after{
    content:'';position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:22px;height:6px;
    background:linear-gradient(90deg,rgba(80,100,200,0.5),rgba(100,130,255,0.7),rgba(80,100,200,0.5));
    border-radius:1px;
  }
  @keyframes spin{
    from{transform:translate(-50%,-50%) rotate(0deg)}
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }
  @keyframes sat-pulse{
    0%{opacity:0.7;transform:scale(0.9)}
    100%{opacity:1;transform:scale(1.1)}
  }

  /* ── subtitle ── */
  .subtitle{
    margin-top:1.8rem;
    font-size:clamp(1rem,2.5vw,1.45rem);
    font-weight:400;
    color:rgba(200,210,240,0.65);
    letter-spacing:0.02em;
    line-height:1.5;
  }
  .subtitle em{
    font-style:normal;
    color:rgba(200,210,240,0.85);
  }

  /* ── button ── */
  .home-btn{
    margin-top:2.6rem;
    position:relative;
    display:inline-flex;align-items:center;gap:0.5rem;
    padding:0.85rem 2.2rem;
    font-size:1rem;
    font-weight:600;
    font-family:inherit;
    color:#fff;
    background:var(--btn-bg);
    border:1px solid rgba(120,140,255,0.15);
    border-radius:60px;
    cursor:pointer;
    text-decoration:none;
    transition:background 0.3s,box-shadow 0.3s,border-color 0.3s;
    overflow:hidden;
    letter-spacing:0.02em;
  }
  .home-btn:hover{
    background:var(--btn-hover);
    border-color:rgba(120,140,255,0.35);
    box-shadow:0 4px 30px rgba(100,120,255,0.18);
  }
  .home-btn:active{transform:scale(0.97)}

  /* glint */
  .home-btn .glint{
    position:absolute;
    top:0;left:-75%;
    width:50%;height:100%;
    background:linear-gradient(
      105deg,
      transparent 20%,
      rgba(255,255,255,0.18) 50%,
      transparent 80%
    );
    transform:skewX(-20deg);
    transition:none;
    pointer-events:none;
  }
  .home-btn:hover .glint{
    animation:glint-sweep 0.7s ease forwards;
  }
  @keyframes glint-sweep{
    0%{left:-75%}
    100%{left:125%}
  }

  .home-btn .arrow{
    display:inline-block;
    transition:transform 0.3s;
  }
  .home-btn:hover .arrow{
    transform:translateX(3px);
  }

  /* ── floating particles ── */
  .particle{
    position:fixed;
    border-radius:50%;
    background:rgba(160,175,255,0.12);
    pointer-events:none;
    z-index:0;
    animation:float-up var(--dur) linear infinite;
    animation-delay:var(--delay);
  }
  @keyframes float-up{
    0%{transform:translateY(0) scale(1);opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    100%{transform:translateY(-110vh) scale(0.5);opacity:0}
  }
</style>
</head>
<body>

<div class="stars-layer" id="stars"></div>

<div class="scene">
  <h1 class="headline">
    <span class="digit">4</span>
    <span class="moon-wrap">
      <span class="moon">
        <span class="crater"></span>
        <span class="crater"></span>
        <span class="crater"></span>
      </span>
      <span class="orbit">
        <span class="orbit-ring"></span>
        <span class="satellite"></span>
      </span>
    </span>
    <span class="digit">4</span>
  </h1>

  <p class="subtitle">
    Looks like you've drifted past the last known star.<br>
    <em>This page doesn't exist — or it's hiding in another galaxy.</em>
  </p>

  <a href="/" class="home-btn">
    <span class="glint"></span>
    Take me home <span class="arrow">→</span>
  </a>
</div>

<script>
(function(){
  const container=document.getElementById('stars');
  const STAR_COUNT=180;

  for(let i=0;i<STAR_COUNT;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=Math.random()*2.5+0.5;
    const x=Math.random()*100;
    const y=Math.random()*100;
    const dur=Math.random()*3+2;
    const delay=Math.random()*4;
    const minO=Math.random()*0.3+0.15;
    const sc=Math.random()*0.6+1;
    s.style.cssText=`
      width:${size}px;height:${size}px;
      left:${x}%;top:${y}%;
      --dur:${dur}s;--delay:${delay}s;
      --min-o:${minO};--sc:${sc};
    `;
    container.appendChild(s);
  }

  // floating particles
  const body=document.body;
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=Math.random()*4+2;
    const left=Math.random()*100;
    const dur=Math.random()*20+15;
    const delay=Math.random()*15;
    p.style.cssText=`
      width:${size}px;height:${size}px;
      left:${left}%;bottom:-10px;
      --dur:${dur}s;--delay:${delay}s;
    `;
    body.appendChild(p);
  }
})();
</script>
</body>
</html>
