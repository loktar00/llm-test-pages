<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
<title>SaaS Platform</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root {
    --bg: #06060e;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
    --text: #f0f0f5;
    --text-muted: #8888a0;
    --accent: #6366f1;
    --accent-2: #a855f7;
    --accent-3: #ec4899;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Background Blobs --- */
  .blob-container {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    mix-blend-mode: screen;
  }
  .blob-1 {
    width: 50vw; height: 50vw;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    top: -10%; left: -10%;
    animation: float-1 25s infinite ease-in-out;
  }
  .blob-2 {
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, var(--accent-3) 0%, transparent 70%);
    bottom: -5%; right: -5%;
    animation: float-2 30s infinite ease-in-out;
  }
  .blob-3 {
    width: 35vw; height: 35vw;
    background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
    top: 40%; left: 40%;
    animation: float-3 35s infinite ease-in-out;
  }

  @keyframes float-1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(15vw, 10vh) scale(1.1); }
    66% { transform: translate(-10vw, 20vh) scale(0.9); }
  }
  @keyframes float-2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(-15vw, -10vh) scale(1.1); }
    66% { transform: translate(10vw, -20vh) scale(0.9); }
  }
  @keyframes float-3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(10vw, -15vh) scale(1.15); }
  }

  /* --- Navbar --- */
  nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 1200px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 16px;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
  }
  /* Pure CSS Logo Mark */
  .logo-mark {
    width: 28px;
    height: 28px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-mark svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke: var(--text);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .nav-links {
    display: flex;
    gap: 32px;
  }
  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--text); }

  .nav-actions {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .btn-nav {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid transparent;
  }
  .btn-ghost:hover {
    color: var(--text);
    background: rgba(255,255,255,0.05);
  }
  .btn-solid {
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
  }
  .btn-solid:hover {
    background: #e0e0e8;
  }

  /* --- Hero Section --- */
  .hero {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 120px 24px 80px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 100px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.2);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 24px;
    opacity: 0;
    animation: fade-up 0.8s ease forwards 0.2s;
  }
  .hero-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  .headline {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    max-width: 900px;
    overflow: hidden; /* For masking */
  }
  .headline-mask {
    display: inline-block;
    clip-path: inset(0 100% 0 0); /* Start hidden */
    animation: reveal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.4s;
  }
  .gradient-text {
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--accent-3) 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradient-sweep 6s ease infinite;
  }
  @keyframes gradient-sweep {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subheadline {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: var(--text-muted);
    max-width: 600px;
    line-height: 1.6;
    margin-bottom: 48px;
    opacity: 0;
    animation: fade-up 0.8s ease forwards 0.8s;
  }

  .cta-group {
    display: flex;
    gap: 16px;
    opacity: 0;
    animation: fade-up 0.8s ease forwards 1s;
  }

  .btn {
    position: relative;
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 160px;
  }
  .btn:hover {
    transform: translateY(-2px);
  }
  .btn-primary {
    background: var(--text);
    color: var(--bg);
    border: none;
  }
  .btn-primary:hover {
    box-shadow: 0 10px 30px rgba(255,255,255,0.15);
  }
  
  .btn-secondary {
    background: transparent;
    color: var(--text);
    /* Gradient border trick */
    position: relative;
    z-index: 1;
  }
  .btn-secondary::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--accent), var(--accent-3), var(--accent-2), var(--accent));
    background-size: 300% 100%;
    z-index: -1;
    opacity: 0.5;
    transition: opacity 0.3s;
  }
  .btn-secondary::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(6, 6, 14, 0.9); /* Match bg */
    z-index: -1;
  }
  .btn-secondary:hover::before {
    opacity: 1;
    animation: shimmer 2s linear infinite;
  }
  .btn-secondary:hover {
    color: #fff;
  }

  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  /* --- Animations --- */
  @keyframes reveal {
    to { clip-path: inset(0 0% 0 0); }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* --- Mobile Adjustments --- */
  @media (max-width: 768px) {
    nav { display: none; } /* Simplified for demo */
    .nav-links { display: none; }
    .headline { font-size: 2.5rem; }
    .cta-group { flex-direction: column; width: 100%; max-width: 300px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

  <!-- Background Blobs -->
  <div class="blob-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Navigation -->
  <nav>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>Nebula</span>
    </div>
    <div class="nav-links">
      <a href="#">Products</a>
      <a href="#">Solutions</a>
      <a href="#">Docs</a>
      <a href="#">Pricing</a>
    </div>
    <div class="nav-actions">
      <a href="#" class="btn-nav btn-ghost">Login</a>
      <a href="#" class="btn-nav btn-solid">Start</a>
    </div>
  </nav>

  <!-- Hero Content -->
  <main class="hero">
    <div class="hero-badge">New Release v2.0</div>
    
    <h1 class="headline">
      <span class="headline-mask">
        Build. Deploy. <span class="gradient-text">Scale.</span>
      </span>
    </h1>
    
    <p class="subheadline">
      The next-generation platform for serverless functions, 
      edge computing, and global distribution. 
      Designed for speed, security, and scale.
    </p>
    
    <div class="cta-group">
      <a href="#" class="btn btn-primary">Get Started</a>
      <a href="#" class="btn btn-secondary">View Documentation</a>
    </div>
  </main>

  <script>
    // Optional: Subtle parallax on mouse move for blobs
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      
      const blobs = document.querySelectorAll('.blob');
      blobs.forEach((blob, i) => {
        const speed = (i + 1) * 0.5;
        blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
      });
    });
  </script>
</body>
</html>
