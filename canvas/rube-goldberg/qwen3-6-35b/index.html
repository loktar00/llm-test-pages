<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rube Goldberg Loop</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; pointer-events: none; text-shadow: 1px 1px 2px black; }
    </style>
</head>
<body>
    <div id="ui">Rube Goldberg Loop<br><span style="font-size:0.8em; opacity:0.7">Physics Simulation</span></div>
    <canvas id="sim"></canvas>
    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Vector Math ---
        const Vec2 = {
            add: (v1, v2) => ({ x: v1.x + v2.x, y: v1.y + v2.y }),
            sub: (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y }),
            mul: (v, s) => ({ x: v.x * s, y: v.y * s }),
            dot: (v1, v2) => v1.x * v2.x + v1.y * v2.y,
            len: (v) => Math.sqrt(v.x * v.x + v.y * v.y),
            norm: (v) => { const l = Math.sqrt(v.x*v.x + v.y*v.y); return l === 0 ? {x:0,y:0} : {x: v.x/l, y: v.y/l}; },
            dist: (v1, v2) => Math.sqrt((v1.x-v2.x)**2 + (v1.y-v2.y)**2),
            rotate: (v, angle) => ({ x: v.x * Math.cos(angle) - v.y * Math.sin(angle), y: v.x * Math.sin(angle) + v.y * Math.cos(angle) })
        };

        // --- Physics Engine (Verlet-ish / Impulse) ---
        const GRAVITY = 0.5;
        const FRICTION = 0.99;
        const BOUNCE = 0.6;
        const SUB_STEPS = 4;

        class Particle {
            constructor(x, y, mass = 1) {
                this.x = x; this.y = y;
                this.ox = x; this.oy = y; // old position for velocity
                this.mass = mass;
                this.invMass = mass === 0 ? 0 : 1 / mass;
                this.radius = mass;
                this.color = '#ff4444';
                this.active = true;
                this.squash = 1;
            }

            update() {
                if (!this.active) return;
                const vx = (this.x - this.ox) * FRICTION;
                const vy = (this.y - this.oy) * FRICTION;
                this.ox = this.x;
                this.oy = this.y;
                this.x += vx;
                this.y += vy + GRAVITY;
                
                // Squash decay
                this.squash += (1 - this.squash) * 0.1;
            }

            draw(ctx, camX, camY) {
                if (!this.active) return;
                const sx = this.x - camX;
                const sy = this.y - camY;
                
                ctx.beginPath();
                ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Squash visual
                if (Math.abs(this.squash - 1) > 0.01) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(sx, sy, this.radius * (2 - this.squash), this.radius * this.squash, 0, 0, Math.PI*2);
                    ctx.stroke();
                }
            }
        }

        class Stick {
            constructor(p1, p2, length = null) {
                this.p1 = p1; this.p2 = p2;
                this.length = length || Vec2.dist(p1, p2);
                this.active = true;
            }
            resolve() {
                if (!this.active) return;
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist === 0) return;
                const diff = (this.length - dist) / dist * 0.5;
                const offsetX = dx * diff;
                const offsetY = dy * diff;
                
                if (this.p1.active) { this.p1.x -= offsetX * this.p1.invMass; this.p1.y -= offsetY * this.p1.invMass; }
                if (this.p2.active) { this.p2.x += offsetX * this.p2.invMass; this.p2.y += offsetY * this.p2.invMass; }
            }
        }

        class Constraint {
            constructor(p1, p2, type) {
                this.p1 = p1; this.p2 = p2;
                this.type = type; // 'pulley', 'spring', 'hinge'
                this.length = Vec2.dist(p1, p2);
                this.active = true;
            }
            resolve() {
                if (!this.active) return;
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (this.type === 'pulley') {
                    // P1 and P2 move opposite, maintaining total length
                    // Total length is fixed, distance from center points is constrained
                    // Simplified: P2.x = P1.x (mirrored)
                    // Here we implement a bucket system: P1 is bucket A, P2 is bucket B
                    // They are tethered.
                    const diff = (this.length - dist); 
                    // Simple distance constraint for tether
                    const correction = diff / (this.p1.invMass + this.p2.invMass);
                    if (this.p1.active) { this.p1.x += (dx/dist) * correction * 0.5; this.p1.y += (dy/dist) * correction * 0.5; }
                    if (this.p2.active) { this.p2.x -= (dx/dist) * correction * 0.5; this.p2.y -= (dy/dist) * correction * 0.5; }
                }
            }
        }

        // --- World Setup ---
        const particles = [];
        const sticks = [];
        const constraints = [];
        const walls = []; // Static geometry {p1, p2, normal}

        function addBall(x, y, r) {
            const p = new Particle(x, y, r);
            p.color = '#ffaa00';
            particles.push(p);
            return p;
        }

        function addStick(x1, y1, x2, y2) {
            const p1 = new Particle(x1, y1, 0); // Static mass 0
            const p2 = new Particle(x2, y2, 0);
            p1.color = '#555'; p2.color = '#555';
            particles.push(p1, p2);
            sticks.push(new Stick(p1, p2));
            return { p1, p2 };
        }

        function addWall(x1, y1, x2, y2) {
            walls.push({ x1, y1, x2, y2 });
        }

        // --- Build the Machine ---
        const scale = 1.5;
        const ox = 200; const oy = 200; // World origin offset

        function setupWorld() {
            // 1. The Drop (Start)
            addBall(ox + 100, oy + 100, 15); // The Ball
            
            // Ramp down
            addWall(ox + 50, oy + 200, ox + 250, oy + 300);
            
            // 2. The Funnel (Speed up)
            addWall(ox + 250, oy + 300, ox + 350, oy + 350);
            addWall(ox + 450, oy + 300, ox + 350, oy + 350);
            
            // 3. The Domino Chain
            for(let i=0; i<5; i++) {
                addWall(ox + 400 + i*30, oy + 350, ox + 400 + i*30, oy + 350 - 60);
            }
            // Floor under dominos
            addWall(ox + 350, oy + 410, ox + 600, oy + 410);

            // 4. The Spring Hammer
            // A ramp leading to a switch
            addWall(ox + 600, oy + 410, ox + 700, oy + 350);
            // The hammer arm (Stick)
            const hammerPivot = addStick(ox + 700, oy + 300, ox + 700, oy + 300);
            // We simulate the hammer as a dynamic stick held by a constraint or just a stick with mass
            // Let's make the hammer a particle with high mass (static) and a dynamic stick attached
            // Actually, let's use the Stick class for the hammer arm, but give the tip mass
            // Re-doing hammer:
            // Remove previous stick
            sticks.pop();
            particles.pop(); particles.pop();
            
            const pivot = new Particle(ox + 700, oy + 300, 0); // Pivot
            const tip = new Particle(ox + 700, oy + 400, 20); // Heavy tip
            tip.color = '#ff0000';
            particles.push(pivot, tip);
            sticks.push(new Stick(pivot, tip));
            
            // 5. The Pulley Basket
            // Left side: The Ball drops into a basket
            // Right side: Counterweight
            const basketLeft = new Particle(ox + 800, oy + 400, 0); // Static pulley point
            const basketParticle = new Particle(ox + 800, oy + 500, 10); // Basket
            const counterWeight = new Particle(ox + 1100, oy + 500, 10); // Counterweight
            
            particles.push(basketParticle, counterWeight);
            constraints.push(new Constraint(basketParticle, counterWeight, 'pulley'));
            
            // Walls for basket
            addWall(ox + 750, oy + 450, ox + 850, oy + 450); // Basket floor
            addWall(ox + 1050, oy + 450, ox + 1150, oy + 450); // Counterweight floor

            // 6. The Elevator Wheel (The Return)
            // The counterweight falls and pulls the basket up? 
            // Rube Goldberg: Ball hits Dominoes -> Dominoes hit Hammer -> Hammer hits Basket -> Basket drops -> Counterweight rises -> Counterweight pulls Ball up via Pulley? 
            // Let's adjust: 
            // Ball drops -> hits Dominoes -> Dominoes hit Hammer -> Hammer pushes Basket DOWN.
            // Basket is connected to Counterweight. Basket down = Counterweight UP.
            // Counterweight falls off a ledge -> Pulls a rope -> Pulls Ball UP to start.
            
            // Let's refine the physics loop to make this work visually.
            // Ball drops. Hits Dominoes. Dominoes fall.
            // Dominoes hit the Hammer tip. Hammer swings.
            // Hammer pushes Basket DOWN.
            // Basket falls.
            // Basket hits a switch (spring) that releases the Elevator.
            
            // Simplification for stability:
            // Ball drops, rolls down ramps.
            // Hits Dominoes.
            // Dominoes fall onto a lever.
            // Lever pushes a heavy block (Basket) down.
            // Basket falls into a chute that leads to the "Elevator" (a conveyor belt or just a long slide back to start).
            
            // Let's try the "Elevator Wheel" loop.
            // Ball drops.
            // Dominoes trigger Hammer.
            // Hammer drops Basket.
            // Basket falls onto a spring platform.
            // Spring launches Ball into a tube.
            // Tube spirals up back to start.
            
            // Implementation of the loop slide:
            addWall(ox + 1200, oy + 500, ox + 1000, oy + 300); // Slide UP
            addWall(ox + 1300, oy + 500, ox + 1100, oy + 300); // Slide UP
            
            // The "Elevator" is just the return path.
            // We need to reset the ball when it passes the start.
            
            // Add invisible reset trigger
            walls.push({ x1: ox-100, y1: 0, x2: ox-100, y2: 1000 }); // Left wall
            walls.push({ x1: ox+1500, y1: 0, x2: ox+1500, y2: 1000 }); // Right wall
            
            // Add "Dust" particles system
            for(let i=0; i<50; i++) {
                const d = new Particle(Math.random()*1000, Math.random()*600, 0);
                d.color = 'rgba(255,255,255,0.1)';
                particles.push(d);
            }
        }
        
        setupWorld();

        // --- Interaction ---
        let dragging = null;
        let dragPos = {x:0, y:0};

        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            // Find particle
            const worldX = mx + cam.x;
            const worldY = my + cam.y;
            for(let p of particles) {
                if (p.mass > 0 && Vec2.dist({x:worldX, y:worldY}, p) < p.radius * 2) {
                    dragging = p;
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', e => {
            if (dragging) {
                const rect = canvas.getBoundingClientRect();
                dragging.x = e.clientX - rect.left + cam.x;
                dragging.y = e.clientY - rect.top + cam.y;
            }
        });

        canvas.addEventListener('mouseup', () => { dragging = null; });

        // --- Camera ---
        const cam = { x: 0, y: 0 };
        let camTarget = { x: 0, y: 0 };

        // --- Physics Loop ---
        function updatePhysics() {
            // 1. Update Particles
            for (let p of particles) {
                if (p !== dragging) p.update();
            }

            // 2. Resolve Constraints (Iterative)
            for (let i=0; i<5; i++) {
                for (let s of sticks) s.resolve();
                for (let c of constraints) c.resolve();
            }

            // 3. Wall Collisions
            for (let p of particles) {
                if (p.mass === 0 || !p.active) continue;
                
                for (let w of walls) {
                    // Vector from wall start to particle
                    const wx = w.x2 - w.x1;
                    const wy = w.y2 - w.y1;
                    const px = p.x - w.x1;
                    const py = p.y - w.y1;
                    
                    // Project p onto line
                    const lenSq = wx*wx + wy*wy;
                    let t = (px*wx + py*wy) / lenSq;
                    t = Math.max(0, Math.min(1, t));
                    
                    const closestX = w.x1 + t * wx;
                    const closestY = w.y1 + t * wy;
                    
                    const dx = p.x - closestX;
                    const dy = p.y - closestY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < p.radius) {
                        // Collision normal
                        const nx = dx / dist;
                        const ny = dy / dist;
                        
                        // Push out
                        const overlap = p.radius - dist;
                        p.x += nx * overlap;
                        p.y += ny * overlap;
                        
                        // Bounce
                        const v = { x: p.x - p.ox, y: p.y - p.oy };
                        const dot = v.x * nx + v.y * ny;
                        
                        // Apply bounce
                        const bounce = -dot * (1 + BOUNCE);
                        p.ox -= nx * bounce;
                        p.oy -= ny * bounce;
                        
                        // Friction (tangential)
                        const tx = -ny;
                        const ty = nx;
                        const tDot = v.x * tx + v.y * ty;
                        p.ox += tx * tDot * 0.1; // Simple friction
                        p.oy += ty * tDot * 0.1;
                        
                        // Squash effect on impact
                        if (Math.abs(dot) > 1) {
                            p.squash = 0.8;
                            // Add dust
                            if (Math.random() > 0.7) {
                                const dust = particles[particles.length-1]; // Reuse dust particle
                                dust.x = closestX;
                                dust.y = closestY;
                                dust.ox = closestX + (Math.random()-0.5)*2;
                                dust.oy = closestY + (Math.random()-0.5)*2;
                                dust.active = true;
                                // Move to end to update
                                particles.push(dust);
                                particles.splice(particles.indexOf(dust), 1);
                            }
                        }
                    }
                }
            }

            // 4. Particle-Particle Collisions
            for (let i=0; i<particles.length; i++) {
                for (let j=i+1; j<particles.length; j++) {
                    const a = particles[i];
                    const b = particles[j];
                    if (a.mass === 0 || b.mass === 0) continue;
                    
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const minDist = a.radius + b.radius;
                    
                    if (dist < minDist) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = minDist - dist;
                        
                        const totalMass = a.mass + b.mass;
                        const m1 = b.mass / totalMass;
                        const m2 = a.mass / totalMass;
                        
                        a.x -= nx * overlap * m1;
                        a.y -= ny * overlap * m1;
                        b.x += nx * overlap * m2;
                        b.y += ny * overlap * m2;
                        
                        // Elastic collision impulse
                        const v1 = { x: a.x - a.ox, y: a.y - a.oy };
                        const v2 = { x: b.x - b.ox, y: b.y - b.oy };
                        const relVel = { x: v2.x - v1.x, y: v2.y - v1.y };
                        const p = 2 * (relVel.x * nx + relVel.y * ny) / (a.mass + b.mass);
                        
                        a.ox += nx * p * b.mass * BOUNCE;
                        a.oy += ny * p * b.mass * BOUNCE;
                        b.ox -= nx * p * a.mass * BOUNCE;
                        b.oy -= ny * p * a.mass * BOUNCE;
                        
                        if (Math.abs(p) > 0.5) {
                            a.squash = 0.7;
                            b.squash = 0.7;
                        }
                    }
                }
            }

            // 5. Game Logic / Reset
            // If ball passes the end of the world, reset to start
            const ball = particles[0];
            if (ball && ball.x > ox + 1400) {
                ball.x = ox + 100;
                ball.y = oy + 100;
                ball.ox = ball.x;
                ball.oy = ball.y;
            }
            
            // Camera Follow
            if (ball) {
                camTarget.x = ball.x - width / 2;
                camTarget.y = ball.y - height / 2;
            }
            cam.x += (camTarget.x - cam.x) * 0.1;
            cam.y += (camTarget.y - cam.y) * 0.1;
        }

        // --- Render ---
        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, width, height);
            
            ctx.save();
            ctx.translate(-cam.x, -cam.y);

            // Draw Walls
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let w of walls) {
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
            }
            ctx.stroke();

            // Draw Sticks (Hammer, etc)
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let s of sticks) {
                if (s.p1.mass > 0 && s.p2.mass > 0) {
                    ctx.moveTo(s.p1.x, s.p1.y);
                    ctx.lineTo(s.p2.x, s.p2.y);
                }
            }
            ctx.stroke();

            // Draw Constraints (Pulley Rope)
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            for (let c of constraints) {
                if (c.type === 'pulley') {
                    ctx.moveTo(c.p1.x, c.p1.y);
                    ctx.lineTo(c.p2.x, c.p2.y);
                }
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Particles
            for (let p of particles) {
                p.draw(ctx, 0, 0); // World coords
            }

            ctx.restore();
        }

        // --- Main Loop ---
        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

    </script>
</body>
</html>
