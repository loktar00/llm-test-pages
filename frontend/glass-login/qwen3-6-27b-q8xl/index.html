<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Login</title>
    <style>
        :root {
            --bg-gradient-1: #0f0c29;
            --bg-gradient-2: #302b63;
            --bg-gradient-3: #24243e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent-color: #a78bfa;
            --accent-glow: rgba(167, 139, 250, 0.5);
            --error-color: #ff6b6b;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            /* Dark Jewel Tones Gradient Background */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000, #4a148c);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glass Card */
        .login-card {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Form Elements */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-field {
            width: 100%;
            padding: 12px 10px;
            font-size: 1rem;
            color: var(--text-main);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--glass-border);
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-bottom-color: var(--accent-color);
        }

        /* Floating Label */
        .input-label {
            position: absolute;
            top: 12px;
            left: 10px;
            font-size: 1rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: 0.3s ease all;
        }

        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: -15px;
            font-size: 0.8rem;
            color: var(--accent-color);
        }

        /* Focus Glow Bar */
        .input-highlight {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-color);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .input-field:focus ~ .input-highlight {
            width: 100%;
        }

        /* Invalid State Shake */
        .input-field.invalid {
            border-bottom-color: var(--error-color);
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .input-field.invalid ~ .input-label {
            color: var(--error-color);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Action Row (Forgot Password) */
        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .forgot-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .forgot-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .forgot-link:hover {
            color: var(--text-main);
        }

        .forgot-link:hover::after {
            width: 100%;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.8), rgba(100, 60, 200, 0.9));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Shine Effect on Button */
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transition: all 0.6s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-card {
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Welcome</h2>
            <p>Sign in to continue</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder=" " required autocomplete="off">
                <label for="username" class="input-label">Username</label>
                <span class="input-highlight"></span>
            </div>

            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder=" " required>
                <label for="password" class="input-label">Password</label>
                <span class="input-highlight"></span>
            </div>

            <div class="action-row">
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const inputs = document.querySelectorAll('.input-field');

            // Remove invalid class on input
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('invalid');
                });
            });

            // Form Submission Logic
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let isValid = true;

                inputs.forEach(input => {
                    if (!input.value.trim()) {
                        isValid = false;
                        input.classList.add('invalid');
                        
                        // Remove class after animation to allow re-triggering
                        setTimeout(() => {
                            input.classList.remove('invalid');
                        }, 500);
                    }
                });

                if (isValid) {
                    // Simulate success action
                    const btn = document.querySelector('.submit-btn');
                    const originalText = btn.innerText;
                    btn.innerText = 'Authenticating...';
                    btn.style.opacity = '0.8';
                    
                    setTimeout(() => {
                        btn.innerText = 'Success';
                        btn.style.background = '#4ade80'; // Green success
                        setTimeout(() => {
                            btn.innerText = originalText;
                            btn.style.background = '';
                            btn.style.opacity = '1';
                            form.reset();
                        }, 1500);
                    }, 1000);
                }
            });
        });
    </script>
</body>
</html>
