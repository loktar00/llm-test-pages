<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranquil Koi Pond</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #001e0f;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="pond"></canvas>
<script>
/**
 * KOI POND SIMULATION
 * Pure HTML5 Canvas implementation
 */

const canvas = document.getElementById('pond');
const ctx = canvas.getContext('2d');

let width, height;
let time = 0;

// Configuration
const NUM_KOI = 8;
const NUM_PADS = 12;
const RIPPLE_LIFETIME = 120; // frames

// State
let koi = [];
let pads = [];
let ripples = [];
let dragonflies = [];

// --- UTILITIES ---

const random = (min, max) => Math.random() * (max - min) + min;
const dist = (x1, y1, x2, y2) => Math.sqrt((x1-x2)**2 + (y1-y2)**2);

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    initPond();
}

// --- CLASSES ---

class Ripple {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 1;
        this.maxRadius = 60;
        this.life = RIPPLE_LIFETIME;
        this.active = true;
    }

    update() {
        this.radius += 0.8;
        this.life--;
        if (this.life <= 0 || this.radius > this.maxRadius) {
            this.active = false;
        }
    }

    draw(ctx) {
        const alpha = Math.max(0, (this.life / RIPPLE_LIFETIME) * 0.4);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

class Koi {
    constructor() {
        this.x = random(100, width - 100);
        this.y = random(100, height - 100);
        this.angle = random(0, Math.PI * 2);
        this.speed = random(0.5, 1.5);
        this.turnSpeed = 0.02;
        
        // Visuals
        this.size = random(20, 35);
        this.color = this.generateColor();
        this.pattern = this.generatePattern();
        
        // Smoothing
        this.velocity = { x: Math.cos(this.angle) * this.speed, y: Math.sin(this.angle) * this.speed };
        this.targetX = this.x;
        this.targetY = this.y;
        this.changeTimer = 0;
        
        // Physics
        this.wobble = random(0, 100);
    }

    generateColor() {
        const colors = [
            { base: [255, 100, 0], spot: [255, 255, 255] }, // Orange/White
            { base: [255, 255, 255], spot: [100, 20, 0] },  // White/Black
            { base: [200, 50, 50], spot: [255, 200, 100] }, // Red/Gold
            { base: [50, 60, 50], spot: [255, 240, 200] },  // Black/White
        ];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    generatePattern() {
        // 3 types: Striped, Blotchy, or None
        const type = Math.random();
        if (type > 0.6) return 'blotch';
        if (type > 0.3) return 'stripe';
        return 'plain';
    }

    think() {
        this.changeTimer--;
        if (this.changeTimer <= 0) {
            // Pick a new random spot to swim to
            this.targetX = random(50, width - 50);
            this.targetY = random(50, height - 50);
            this.changeTimer = random(100, 400);
            
            // Occasionally nibble
            if (Math.random() < 0.3) {
                ripples.push(new Ripple(this.targetX, this.targetY));
            }
        }
    }

    update() {
        this.think();

        // Steering
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const targetAngle = Math.atan2(dy, dx);
        
        // Smooth rotation
        let angleDiff = targetAngle - this.angle;
        // Normalize angle
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        
        this.angle += angleDiff * this.turnSpeed;

        // Position update with slight sine wave wobble for tail effect
        this.wobble += 0.1;
        const wobbleOffset = Math.sin(this.wobble) * 0.2;
        
        this.velocity.x = Math.cos(this.angle + wobbleOffset) * this.speed;
        this.velocity.y = Math.sin(this.angle + wobbleOffset) * this.speed;

        this.x += this.velocity.x;
        this.y += this.velocity.y;

        // Bounce off walls softly
        if (this.x < 0 || this.x > width) {
            this.angle = Math.PI - this.angle;
            this.x = Math.max(0, Math.min(width, this.x));
        }
        if (this.y < 0 || this.y > height) {
            this.angle = -this.angle;
            this.y = Math.max(0, Math.min(height, this.y));
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Shadow (drawn first to be under water surface)
        // (Handled in global draw loop for layering, but specific offset)
        
        // --- Tail ---
        ctx.save();
        ctx.translate(-this.size * 0.8, 0);
        const tailWag = Math.sin(time * 0.2 + this.wobble) * 0.3;
        ctx.rotate(tailWag);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-this.size * 0.6, -this.size * 0.4);
        ctx.quadraticCurveTo(-this.size * 0.3, 0, -this.size * 0.6, this.size * 0.4);
        ctx.fillStyle = this.color.base;
        ctx.fill();
        ctx.restore();

        // --- Body ---
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.4, 0, 0, Math.PI * 2);
        ctx.fillStyle = this.color.base;
        ctx.fill();

        // --- Pattern ---
        if (this.pattern === 'stripe') {
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size * 0.5, this.size * 0.45, 0, 0, Math.PI * 2);
            ctx.fillStyle = this.color.spot;
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(-this.size*0.5, 0, this.size*0.4, this.size*0.3, 0, 0, Math.PI*2);
            ctx.fill();
        } else if (this.pattern === 'blotch') {
            // Draw random spots on top
            const spots = 3;
            for(let i=0; i<spots; i++) {
                ctx.beginPath();
                const sx = random(-this.size*0.5, this.size*0.5);
                const sy = random(-this.size*0.2, this.size*0.2);
                const sr = random(3, 8);
                ctx.arc(sx, sy, sr, 0, Math.PI*2);
                ctx.fillStyle = this.color.spot;
                ctx.fill();
            }
        }

        // Eye
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(this.size * 0.7, -this.size * 0.1, 1.5, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
}

class LilyPad {
    constructor() {
        this.x = random(50, width - 50);
        this.y = random(50, height - 50);
        this.rot = random(0, Math.PI * 2);
        this.size = random(30, 50);
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        
        // Shadow
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 5;
        ctx.shadowOffsetY = 5;

        // Pad
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(this.size, 0);
        ctx.arc(0, 0, this.size, 0.2, Math.PI * 1.8);
        ctx.lineTo(0, 0);
        ctx.fillStyle = '#2d5a27';
        ctx.fill();
        
        // Veins
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(this.size * 0.8, 0);
        ctx.moveTo(0,0);
        ctx.lineTo(0, this.size * 0.8);
        ctx.stroke();

        ctx.restore();
    }
}

class Dragonfly {
    constructor() {
        this.active = false;
        this.timer = random(500, 1000); // Wait time
        this.life = 0;
    }

    update() {
        if (!this.active) {
            this.timer--;
            if (this.timer <= 0) {
                this.active = true;
                this.x = random(0, width);
                this.y = random(0, height);
                this.life = random(100, 300);
                this.angle = random(0, Math.PI * 2);
            }
        } else {
            this.life--;
            // Hover movement
            this.x += Math.sin(time * 0.1) * 2;
            this.y += Math.cos(time * 0.1) * 1;
            
            if (this.life <= 0) {
                this.active = false;
                this.timer = random(500, 1500);
            }
        }
    }

    draw(ctx) {
        if (!this.active) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        // Face movement direction roughly
        ctx.rotate(Math.sin(time * 0.05) + this.angle); 

        // Wings (fluttering)
        const wingFlutter = Math.sin(time * 0.8) * 0.5;
        ctx.fillStyle = 'rgba(200, 240, 255, 0.8)';
        
        // Left Wing
        ctx.beginPath();
        ctx.ellipse(0, -2, 12, 3, wingFlutter, 0, Math.PI*2);
        ctx.fill();
        // Right Wing
        ctx.beginPath();
        ctx.ellipse(0, 2, 12, 3, -wingFlutter, 0, Math.PI*2);
        ctx.fill();

        // Body
        ctx.fillStyle = '#003333';
        ctx.fillRect(-10, -1, 20, 2);
        
        // Head
        ctx.fillStyle = '#005555';
        ctx.beginPath();
        ctx.arc(10, 0, 2, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
}

// --- RENDERERS ---

function drawBackground() {
    // Deep water base
    const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width * 0.8);
    gradient.addColorStop(0, '#1e3c32');
    gradient.addColorStop(1, '#0f1f1b');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
}

function drawCaustics() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.05;
    
    // Simulated caustics using moving sine waves
    ctx.beginPath();
    for (let y = 0; y < height; y += 40) {
        ctx.moveTo(0, y);
        for (let x = 0; x < width; x += 10) {
            const dy = Math.sin(x * 0.02 + time * 0.05 + y * 0.01) * 20 + 
                       Math.cos(x * 0.01 - time * 0.02) * 10;
            ctx.lineTo(x, y + dy);
        }
    }
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

function drawShadows() {
    ctx.save();
    ctx.filter = 'blur(4px)';
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    
    // Shadows for Koi
    koi.forEach(k => {
        ctx.beginPath();
        ctx.ellipse(k.x + 5, k.y + 5, k.size, k.size * 0.4, k.angle, 0, Math.PI*2);
        ctx.fill();
    });

    // Shadows for Pads
    pads.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x + 5, p.y + 5, p.size, 0, Math.PI*2);
        ctx.fill();
    });
    
    ctx.restore();
}

// --- INITIALIZATION ---

function initPond() {
    koi = [];
    for(let i=0; i<NUM_KOI; i++) koi.push(new Koi());
    
    pads = [];
    for(let i=0; i<NUM_PADS; i++) pads.push(new LilyPad());

    dragonflies = [];
    for(let i=0; i<3; i++) dragonflies.push(new Dragonfly());
}

// --- MAIN LOOP ---

function animate() {
    time++;
    
    // 1. Background
    drawBackground();
    
    // 2. Caustics (Layer 1)
    drawCaustics();
    
    // 3. Shadows
    drawShadows();
    
    // 4. Ripples (Interacting/Overlapping handled by standard drawing)
    ripples = ripples.filter(r => r.active);
    ripples.forEach(r => {
        r.update();
        r.draw(ctx);
    });
    // Random ambient ripple
    if (Math.random() < 0.01) {
        ripples.push(new Ripple(random(0, width), random(0, height)));
    }

    // 5. Lily Pads
    pads.forEach(p => p.draw(ctx));

    // 6. Koi
    // Sort by Y for pseudo-depth (though they are 2D, helps with pad overlap if desired)
    // Actually, let's just draw them.
    koi.forEach(k => {
        k.update();
        k.draw(ctx);
    });

    // 7. Dragonflies (Top layer)
    dragonflies.forEach(df => {
        df.update();
        df.draw(ctx);
    });

    requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
animate();

</script>
</body>
</html>
