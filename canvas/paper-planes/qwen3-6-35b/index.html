<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Planes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Constants ---
const GRAVITY = 180;
const LIFT_COEFF = 0.00012;
const DRAG_COEFF = 0.00008;
const THERMAL_X_RATIO = 0.5;
const THERMAL_RADIUS = 120;
const THERMAL_STRENGTH = 120;
const NUM_PLANES = 10;
const NUM_DUST = 200;
const NUM_SUNBEAMS = 5;

// --- Dust Motes ---
class DustMote {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H * 0.3 + Math.random() * H * 0.6;
    this.size = 0.5 + Math.random() * 2;
    this.speedX = (Math.random() - 0.5) * 8;
    this.speedY = -5 - Math.random() * 15;
    this.opacity = 0.1 + Math.random() * 0.4;
    this.life = 3 + Math.random() * 8;
    this.maxLife = this.life;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(dt) {
    this.phase += dt * 0.5;
    this.x += (this.speedX + Math.sin(this.phase) * 10) * dt;
    this.y += this.speedY * dt;
    this.life -= dt;
    if (this.life <= 0 || this.y < -10 || this.x < -10 || this.x > W + 10) this.reset(false);
  }
  draw(ctx) {
    let alpha = this.opacity * Math.min(1, this.life / 1) * Math.min(1, (this.maxLife - this.life) / 1);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 240, 200, ${alpha})`;
    ctx.fill();
  }
}

const dustMotes = [];
for (let i = 0; i < NUM_DUST; i++) dustMotes.push(new DustMote());

// --- Sunbeams ---
class Sunbeam {
  constructor() {
    this.x = W * (0.3 + Math.random() * 0.4);
    this.width = 60 + Math.random() * 100;
    this.opacity = 0.02 + Math.random() * 0.04;
    this.drift = (Math.random() - 0.5) * 5;
  }
  update(dt) { this.x += this.drift * dt; }
  draw(ctx) {
    let grad = ctx.createLinearGradient(this.x - this.width / 2, 0, this.x + this.width / 2, 0);
    grad.addColorStop(0, 'rgba(255, 220, 150, 0)');
    grad.addColorStop(0.3, `rgba(255, 220, 150, ${this.opacity})`);
    grad.addColorStop(0.5, `rgba(255, 230, 170, ${this.opacity * 1.5})`);
    grad.addColorStop(0.7, `rgba(255, 220, 150, ${this.opacity})`);
    grad.addColorStop(1, 'rgba(255, 220, 150, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(this.x - this.width / 2, 0, this.width, H);
  }
}

const sunbeams = [];
for (let i = 0; i < NUM_SUNBEAMS; i++) sunbeams.push(new Sunbeam());

// --- Balconies ---
function getBalconies() {
  const balconies = [];
  const count = 6;
  for (let i = 0; i < count; i++) {
    let side = i % 2 === 0 ? 'left' : 'right';
    let y = H * 0.15 + (i / count) * H * 0.5;
    let x = side === 'left' ? W * 0.04 + Math.random() * W * 0.06 : W * 0.9 - Math.random() * W * 0.06;
    balconies.push({ x, y, side, width: 40 + Math.random() * 20 });
  }
  return balconies;
}

let balconies = getBalconies();

// --- Paper Airplane ---
class PaperPlane {
  constructor(balcony, index) {
    this.balcony = balcony;
    this.index = index;
    this.reset();
  }

  reset() {
    let b = this.balcony;
    this.x = b.x + (b.side === 'left' ? b.width * 0.5 : -b.width * 0.5);
    this.y = b.y - 15;
    this.vx = (b.side === 'left' ? 1 : -1) * (40 + Math.random() * 30);
    this.vy = -10 - Math.random() * 20;
    this.angle = Math.atan2(this.vy, this.vx);
    this.bank = 0;
    this.targetBank = (Math.random() - 0.5) * 0.4;
    this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    this.state = 'LAUNCHING'; // LAUNCHING, GLIDING, THERMAL, LANDING, FOLDING, RELANCHING
    this.foldTimer = 0;
    this.relaunchTimer = 0;
    this.foldFlash = 0;
    this.trail = [];
    this.wingPhase = Math.random() * Math.PI * 2;
    this.size = 8 + Math.random() * 4;
    this.color = this.randomPaperColor();
    this.thermalCaught = false;
    this.glideTimer = 0;
    this.targetAngle = this.angle;
    this.turnRate = 0;
  }

  randomPaperColor() {
    const colors = [
      { r: 255, g: 250, b: 240 },
      { r: 240, g: 235, b: 220 },
      { r: 255, g: 245, b: 230 },
      { r: 230, g: 230, b: 240 },
      { r: 245, g: 240, b: 225 },
    ];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  update(dt) {
    this.wingPhase += dt * 3;
    this.glideTimer += dt;

    if (this.state === 'FOLDING') {
      this.foldTimer += dt;
      this.foldFlash = Math.max(0, 1 - this.foldTimer * 2);
      if (this.foldTimer > 1.5) {
        this.state = 'RELANCHING';
        this.relaunchTimer = 0;
      }
      return;
    }

    if (this.state === 'RELANCHING') {
      this.relaunchTimer += dt;
      let b = this.balcony;
      let targetX = b.x + (b.side === 'left' ? b.width * 0.5 : -b.width * 0.5);
      let targetY = b.y - 15;
      let lerp = Math.min(1, this.relaunchTimer * 0.5);
      this.x += (targetX - this.x) * lerp * dt * 3;
      this.y += (targetY - this.y) * lerp * dt * 3;
      if (this.relaunchTimer > 2) {
        this.vx = (b.side === 'left' ? 1 : -1) * (40 + Math.random() * 30);
        this.vy = -10 - Math.random() * 20;
        this.angle = Math.atan2(this.vy, this.vx);
        this.state = 'LAUNCHING';
        this.foldTimer = 0;
        this.foldFlash = 0;
      }
      return;
    }

    // Aerodynamics
    let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed < 1) speed = 1;

    let cosA = Math.cos(this.angle);
    let sinA = Math.sin(this.angle);

    // Drag
    let dragForce = DRAG_COEFF * speed * speed;
    let dragVx = -dragForce * cosA;
    let dragVy = -dragForce * sinA;

    // Lift (perpendicular to velocity, upward relative to plane)
    let liftForce = LIFT_COEFF * speed * speed;
    let liftVx = -liftForce * sinA;
    let liftVy = liftForce * cosA;

    // Gravity
    let gravVy = GRAVITY;

    // Thermal
    let thermalCenterX = W * THERMAL_X_RATIO;
    let thermalDist = Math.abs(this.x - thermalCenterX);
    let thermalFactor = Math.max(0, 1 - thermalDist / THERMAL_RADIUS);
    thermalFactor *= thermalFactor;

    let thermalVy = -THERMAL_STRENGTH * thermalFactor;
    let thermalTurn = thermalFactor * 2;

    // Apply forces
    this.vx += (dragVx + liftVx) * dt;
    this.vy += (dragVy + liftVy + gravVy + thermalVy) * dt;

    // Thermal turning
    if (thermalFactor > 0.2) {
      this.targetBank = Math.sign(this.vx) * 0.6;
      this.turnRate = thermalTurn * thermalFactor * Math.sign(this.vx);
    } else {
      this.turnRate *= 0.95;
    }

    // Gentle random turning
    if (this.glideTimer > 2 && !this.thermalCaught) {
      this.targetBank += (Math.random() - 0.5) * 0.01;
      this.targetBank = Math.max(-0.5, Math.min(0.5, this.targetBank));
    }

    // Bank interpolation
    this.bank += (this.targetBank - this.bank) * dt * 2;

    // Update angle based on velocity
    let newAngle = Math.atan2(this.vy, this.vx);
    let angleDiff = newAngle - this.angle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    this.angle += angleDiff * dt * 3;

    // Bank affects heading
    this.angle += this.bank * dt * 0.5;

    // Update position
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);

    // Trail
    this.trail.push({ x: this.x, y: this.y, age: 0 });
    if (this.trail.length > 30) this.trail.shift();
    this.trail.forEach(t => t.age += dt);

    // State management
    let floorY = H * 0.88;

    // Check thermal catch
    if (thermalFactor > 0.3 && this.speed > 20) {
      this.thermalCaught = true;
      this.state = 'THERMAL';
    }

    if (this.state === 'THERMAL') {
      if (this.vy > -10 || this.y < H * 0.1 || thermalFactor < 0.1) {
        this.state = 'GLIDING';
        this.thermalCaught = false;
        this.glideTimer = 0;
      }
    }

    if (this.state === 'GLIDING' || this.state === 'LAUNCHING') {
      // Check if landing
      if (this.y > floorY - 20 && this.vy > 0 && this.speed < 100) {
        this.state = 'LANDING';
      }
      // Wall bouncing
      if (this.x < 20 || this.x > W - 20) {
        this.vx *= -0.5;
        this.x = Math.max(20, Math.min(W - 20, this.x));
      }
      // Ceiling
      if (this.y < 10) {
        this.vy = Math.abs(this.vy) * 0.5;
        this.y = 10;
      }
    }

    if (this.state === 'LANDING') {
      this.vy = Math.min(this.vy, 30);
      this.vx *= 0.98;
      if (this.y >= floorY - 5) {
        this.y = floorY - 5;
        this.state = 'FOLDING';
        this.foldTimer = 0;
        this.foldFlash = 1;
      }
    }
  }

  draw(ctx) {
    // Trail
    if (this.trail.length > 1) {
      for (let i = 1; i < this.trail.length; i++) {
        let t = this.trail[i];
        let alpha = (1 - t.age * 0.5) * 0.15;
        if (alpha <= 0) continue;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 1, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 200, 200, ${alpha})`;
        ctx.fill();
      }
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle + this.bank * 0.3);

    let s = this.size;
    let wingFlap = Math.sin(this.wingPhase) * 2;

    // Shadow
    ctx.restore();
    ctx.save();
    let shadowOffset = (H * 0.88 - this.y) * 0.15;
    ctx.translate(this.x + shadowOffset * 0.3, H * 0.88);
    ctx.rotate(this.angle);
    ctx.scale(1 + shadowOffset * 0.002, 0.3);
    ctx.globalAlpha = 0.15;
    this.drawPlaneShape(ctx, s, wingFlap);
    ctx.globalAlpha = 1;
    ctx.restore();

    // Plane
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle + this.bank * 0.3);

    // Fold flash
    if (this.foldFlash > 0) {
      ctx.beginPath();
      ctx.arc(0, 0, s * 3 * this.foldFlash, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 220, ${this.foldFlash * 0.5})`;
      ctx.fill();
    }

    // Scale down during fold
    if (this.state === 'FOLDING') {
      let scale = Math.max(0.1, 1 - this.foldTimer * 0.5);
      ctx.scale(scale, scale);
    }

    this.drawPlaneShape(ctx, s, wingFlap);
    ctx.restore();
  }

  drawPlaneShape(ctx, s, wingFlap) {
    let c = this.color;
    // Left wing
    ctx.beginPath();
    ctx.moveTo(s * 0.1, 0);
    ctx.lineTo(-s * 0.8, -s * 0.5 + wingFlap);
    ctx.lineTo(-s * 0.5, 0);
    ctx.closePath();
    ctx.fillStyle = `rgba(${c.r - 15}, ${c.g - 15}, ${c.b - 15}, 0.9)`;
    ctx.fill();

    // Right wing
    ctx.beginPath();
    ctx.moveTo(s * 0.1, 0);
    ctx.lineTo(-s * 0.8, s * 0.5 - wingFlap);
    ctx.lineTo(-s * 0.5, 0);
    ctx.closePath();
    ctx.fillStyle = `rgba(${c.r - 5}, ${c.g - 5}, ${c.b - 5}, 0.85)`;
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.moveTo(s * 0.3, 0);
    ctx.lineTo(-s * 0.6, -s * 0.15);
    ctx.lineTo(-s * 0.8, 0);
    ctx.lineTo(-s * 0.6, s * 0.15);
    ctx.closePath();
    ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, 0.95)`;
    ctx.fill();

    // Wing highlights
    ctx.beginPath();
    ctx.moveTo(s * 0.05, -s * 0.05);
    ctx.lineTo(-s * 0.5, -s * 0.35 + wingFlap);
    ctx.lineTo(-s * 0.35, -s * 0.05);
    ctx.closePath();
    ctx.fillStyle = `rgba(255, 255, 255, 0.3)`;
    ctx.fill();
  }
}

// --- Planes ---
let planes = [];
function initPlanes() {
  planes = [];
  let bList = getBalconies();
  for (let i = 0; i < NUM_PLANES; i++) {
    let b = bList[i % bList.length];
    let p = new PaperPlane(b, i);
    // Stagger initial positions
    p.x += (Math.random() - 0.5) * 200;
    p.y += (Math.random() - 0.5) * 100;
    p.glideTimer = Math.random() * 5;
    planes.push(p);
  }
}
initPlanes();

// --- Drawing the atrium ---
function drawAtrium(ctx, time) {
  // Background gradient
  let bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#1a1510');
  bgGrad.addColorStop(0.3, '#2a2018');
  bgGrad.addColorStop(0.7, '#1e1812');
  bgGrad.addColorStop(1, '#15100a');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Floor
  let floorY = H * 0.88;
  let floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
  floorGrad.addColorStop(0, '#3a2a1a');
  floorGrad.addColorStop(0.3, '#2a1e12');
  floorGrad.addColorStop(1, '#1a120a');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, floorY, W, H - floorY);

  // Floor lines (perspective)
  ctx.strokeStyle = 'rgba(60, 45, 30, 0.3)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 15; i++) {
    let y = floorY + i * (H - floorY) / 15;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Left wall
  let wallGrad = ctx.createLinearGradient(0, 0, W * 0.08, 0);
  wallGrad.addColorStop(0, '#1a1510');
  wallGrad.addColorStop(1, 'rgba(26, 21, 16, 0)');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 0, W * 0.08, H);

  // Right wall
  let wallGrad2 = ctx.createLinearGradient(W, 0, W * 0.92, 0);
  wallGrad2.addColorStop(0, '#1a1510');
  wallGrad2.addColorStop(1, 'rgba(26, 21, 16, 0)');
  ctx.fillStyle = wallGrad2;
  ctx.fillRect(W * 0.92, 0, W * 0.08, H);

  // Balconies
  balconies.forEach(b => {
    ctx.save();
    // Balcony platform
    ctx.fillStyle = '#2a2018';
    ctx.fillRect(b.side === 'left' ? b.x - b.width * 0.5 : b.x - b.width * 0.5, b.y - 3, b.width, 6);

    // Railing
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x - b.width * 0.5, b.y - 3);
    ctx.lineTo(b.x - b.width * 0.5, b.y - 20);
    ctx.moveTo(b.x + b.width * 0.5, b.y - 3);
    ctx.lineTo(b.x + b.width * 0.5, b.y - 20);
    ctx.moveTo(b.x - b.width * 0.5, b.y - 20);
    ctx.lineTo(b.x + b.width * 0.5, b.y - 20);
    ctx.stroke();

    // Railing posts
    for (let i = 0; i < 3; i++) {
      let rx = b.x - b.width * 0.5 + (i / 2) * b.width;
      ctx.beginPath();
      ctx.moveTo(rx, b.y - 3);
      ctx.lineTo(rx, b.y - 20);
      ctx.stroke();
    }
    ctx.restore();
  });

  // Architectural columns
  for (let i = 0; i < 4; i++) {
    let cx = W * (0.15 + i * 0.25);
    let colGrad = ctx.createLinearGradient(cx - 8, 0, cx + 8, 0);
    colGrad.addColorStop(0, 'rgba(40, 30, 20, 0.5)');
    colGrad.addColorStop(0.5, 'rgba(50, 38, 25, 0.6)');
    colGrad.addColorStop(1, 'rgba(40, 30, 20, 0.5)');
    ctx.fillStyle = colGrad;
    ctx.fillRect(cx - 6, H * 0.1, 12, H * 0.78);
  }

  // Thermal indicator (subtle)
  let thermalCenterX = W * THERMAL_X_RATIO;
  let thermalPulse = Math.sin(time * 0.5) * 0.5 + 0.5;
  let thermalGrad = ctx.createRadialGradient(thermalCenterX, H * 0.5, 0, thermalCenterX, H * 0.5, THERMAL_RADIUS);
  thermalGrad.addColorStop(0, `rgba(255, 200, 100, ${0.01 + thermalPulse * 0.015})`);
  thermalGrad.addColorStop(1, 'rgba(255, 200, 100, 0)');
  ctx.fillStyle = thermalGrad;
  ctx.fillRect(thermalCenterX - THERMAL_RADIUS, 0, THERMAL_RADIUS * 2, H);
}

// --- Main loop ---
let lastTime = 0;
let time = 0;

function animate(timestamp) {
  let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  time += dt;

  // Update sunbeams
  sunbeams.forEach(b => b.update(dt));

  // Update dust
  dustMotes.forEach(d => d.update(dt));

  // Update planes
  planes.forEach(p => p.update(dt));

  // Check if planes need relaunch from balconies
  planes.forEach(p => {
    if (p.state === 'FOLDING' && p.foldTimer > 1.5) {
      // Will relaunch from balcony
    }
  });

  // Draw
  ctx.clearRect(0, 0, W, H);

  drawAtrium(ctx, time);

  // Sunbeams (behind planes)
  sunbeams.forEach(b => b.draw(ctx));

  // Dust motes in sunbeams
  dustMotes.forEach(d => d.draw(ctx));

  // Draw shadows first
  ctx.save();
  planes.forEach(p => {
    let shadowOffset = (H * 0.88 - p.y) * 0.15;
    let shadowAlpha = Math.max(0.05, 0.2 - (p.y / H) * 0.15);
    ctx.globalAlpha = shadowAlpha;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(p.x + shadowOffset * 0.3, H * 0.88, p.size * 1.2, p.size * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // Planes
  planes.forEach(p => p.draw(ctx));

  // Vignette
  let vigGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.8);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  // Warm overlay
  ctx.fillStyle = 'rgba(255, 200, 100, 0.02)';
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// Handle resize
window.addEventListener('resize', () => {
  resize();
  balconies = getBalconies();
  planes.forEach((p, i) => {
    if (i < balconies.length) {
      p.balcony = balconies[i % balconies.length];
    }
  });
});
</script>
</body>
</html>
