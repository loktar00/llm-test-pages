<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transit Growth - Animated Metro Map</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
        body, html { width: 100%; height: 100%; }
        canvas { display: block; }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Segoe UI', sans-serif;
            color: #333;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="transitCanvas"></canvas>
    <div id="info">Generating new transit network... <span id="progress"></span></div>

    <script>
        const canvas = document.getElementById('transitCanvas');
        const ctx = canvas.getContext('2d');
        const infoDiv = document.getElementById('info');
        const progressSpan = document.getElementById('progress');

        let width, height;
        let animationId;

        // Color palette for lines
        const LINE_COLORS = [
            '#E83F47', '#0099CC', '#7AC843', '#F9A621',
            '#B449D3', '#FF7F50', '#20B2AA', '#9370DB',
            '#FF69B4', '#00CED1'
        ];

        // City state
        let currentCity = {};
        let citiesGenerated = 0;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            window.addEventListener('resize', handleResize);
            
            // High-quality rendering
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            generateCity();
            animate();
        }

        function handleResize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function generateCity() {
            const numLines = 8 + Math.floor(Math.random() * 3); // 8-10 lines
            const lines = [];
            
            // Generate interconnected lines
            const centralStation = { x: width/2, y: height/2 };
            const usedPositions = new Set();
            
            for (let i = 0; i < numLines; i++) {
                const color = LINE_COLORS[i % LINE_COLORS.length];
                const direction = (i / numLines) * Math.PI * 2;
                const stations = [];
                
                // Start from center or connect to existing
                let startX, startY;
                if (i === 0) {
                    startX = centralStation.x;
                    startY = centralStation.y;
                } else {
                    // Connect to a random existing station
                    const refLine = lines[Math.floor(Math.random() * lines.length)];
                    const refStation = refLine.stations[Math.floor(Math.random() * refLine.stations.length)];
                    startX = refStation.x;
                    startY = refStation.y;
                }
                
                let currentX = startX;
                let currentY = startY;
                stations.push({ x: currentX, y: currentY, isInterchange: i > 0 });
                
                // Generate path
                const numStations = 6 + Math.floor(Math.random() * 5); // 6-10 stations
                const basePath = [];
                
                for (let j = 0; j < numStations; j++) {
                    const segAngle = direction + (Math.random() - 0.5) * 0.5;
                    const distance = 60 + Math.random() * 40;
                    const gridSize = 50;
                    
                    let nextX = currentX + Math.cos(segAngle) * distance;
                    let nextY = currentY + Math.sin(segAngle) * distance;
                    
                    // Snap to grid
                    nextX = Math.round(nextX / gridSize) * gridSize;
                    nextY = Math.round(nextY / gridSize) * gridSize;
                    
                    // Keep within bounds
                    nextX = Math.max(gridSize, Math.min(width - gridSize, nextX));
                    nextY = Math.max(gridSize, Math.min(height - gridSize, nextY));
                    
                    const key = `${nextX},${nextY}`;
                    if (usedPositions.has(key)) {
                        // Adjust to avoid overlap
                        nextX += gridSize * (Math.random() > 0.5 ? 1 : -1);
                        nextY += gridSize * (Math.random() > 0.5 ? 1 : -1);
                        nextX = Math.max(gridSize, Math.min(width - gridSize, nextX));
                        nextY = Math.max(gridSize, Math.min(height - gridSize, nextY));
                    }
                    
                    usedPositions.add(key);
                    stations.push({ 
                        x: nextX, 
                        y: nextY, 
                        isInterchange: usedPositions.size > numLines * 3 && Math.random() > 0.7 
                    });
                    
                    currentX = nextX;
                    currentY = nextY;
                }
                
                // Build path with segments
                const segments = [];
                for (let j = 0; j < stations.length - 1; j++) {
                    const start = stations[j];
                    const end = stations[j + 1];
                    
                    // Create rounded corners
                    const segLength = Math.sqrt((end.x - start.x)**2 + (end.y - start.y)**2);
                    const cornerDist = Math.min(20, segLength * 0.3);
                    
                    segments.push({
                        startX: start.x,
                        startY: start.y,
                        endX: end.x,
                        endY: end.y,
                        control1X: start.x + (end.x - start.x) * 0.3,
                        control1Y: start.y + (end.y - start.y) * 0.3,
                        control2X: start.x + (end.x - start.x) * 0.7,
                        control2Y: start.y + (end.y - start.y) * 0.7,
                        cornerDist: cornerDist,
                        complete: false,
                        completion: 0
                    });
                }
                
                lines.push({ color, stations, segments, complete: false });
            }
            
            // Identify interchanges (shared positions between lines)
            const interchangePositions = new Map();
            lines.forEach((line, lineIdx) => {
                line.stations.forEach(station => {
                    const key = `${station.x},${station.y}`;
                    if (!interchangePositions.has(key)) {
                        interchangePositions.set(key, []);
                    }
                    interchangePositions.get(key).push(lineIdx);
                });
            });
            
            // Mark stations as interchanges if they're used by multiple lines
            lines.forEach(line => {
                line.stations.forEach(station => {
                    const key = `${station.x},${station.y}`;
                    const linesAtPos = interchangePositions.get(key);
                    station.isInterchange = linesAtPos.length > 1;
                    station.lineCount = linesAtPos.length;
                });
            });
            
            // Add trains to completed lines
            lines.forEach(line => {
                line.trains = [];
            });
            
            currentCity = { lines, complete: false };
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw background
            ctx.fillStyle = '#f8f8f8';
            ctx.fillRect(0, 0, width, height);
            
            if (!currentCity.lines) return;
            
            // Update and draw lines
            let allComplete = true;
            let linesDone = 0;
            
            currentCity.lines.forEach((line, lineIdx) => {
                if (!line.complete) {
                    // Animate segment completion
                    let segmentsComplete = 0;
                    line.segments.forEach(seg => {
                        if (!seg.complete) {
                            seg.completion += 0.02;
                            if (seg.completion >= 1) {
                                seg.completion = 1;
                                seg.complete = true;
                            }
                        }
                        if (seg.complete) segmentsComplete++;
                    });
                    
                    if (segmentsComplete === line.segments.length) {
                        line.complete = true;
                        // Add trains when line completes
                        line.trains.push({
                            segmentIndex: 0,
                            position: 0,
                            direction: 1
                        });
                    } else {
                        allComplete = false;
                    }
                } else {
                    linesDone++;
                }
                
                // Draw the line
                drawLine(line, lineIdx);
            });
            
            // Update and draw trains
            currentCity.lines.forEach(line => {
                if (line.complete) {
                    line.trains.forEach(train => {
                        if (train.segmentIndex < line.segments.length) {
                            train.position += 0.005 * train.direction;
                            if (train.position > 1) {
                                train.position = 0;
                                train.segmentIndex = (train.segmentIndex + 1) % line.segments.length;
                                if (Math.random() > 0.7) {
                                    train.direction *= -1;
                                }
                            } else if (train.position < 0) {
                                train.position = 1;
                                train.segmentIndex = (train.segmentIndex - 1 + line.segments.length) % line.segments.length;
                            }
                        }
                        drawTrain(train, line);
                    });
                }
            });
            
            // Update info text
            progressSpan.textContent = `${linesDone}/${currentCity.lines.length} lines`;
            
            if (allComplete && currentCity.lines.length > 0) {
                // All lines complete - fade out after delay
                setTimeout(() => {
                    fadeOutAndRegenerate();
                }, 3000);
                currentCity.lines = []; // Prevent re-triggering
            }
            
            animationId = requestAnimationFrame(animate);
        }

        function drawLine(line, lineIdx) {
            // Draw line segments
            ctx.strokeStyle = line.color;
            ctx.lineWidth = 4;
            
            line.segments.forEach(seg => {
                if (seg.complete || seg.completion > 0) {
                    ctx.beginPath();
                    const t = seg.completion;
                    
                    // Draw the path with rounded corners
                    const startX = seg.startX + (seg.control1X - seg.startX) * t;
                    const startY = seg.startY + (seg.control1Y - seg.startY) * t;
                    const endX = seg.startX + (seg.endX - seg.startX) * t;
                    const endY = seg.startY + (seg.endY - seg.startY) * t;
                    
                    ctx.moveTo(seg.startX, seg.startY);
                    ctx.quadraticCurveTo(
                        seg.control1X, seg.control1Y,
                        seg.startX + (seg.endX - seg.startX) * t,
                        seg.startY + (seg.endY - seg.startY) * t
                    );
                    ctx.stroke();
                }
            });
            
            // Draw stations
            line.stations.forEach(station => {
                if (station.isInterchange) {
                    // Draw interchange as circle
                    ctx.fillStyle = line.color;
                    ctx.beginPath();
                    ctx.arc(station.x, station.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Draw connecting lines in different colors
                    const lineCount = station.lineCount || 1;
                    const radius = 6 + lineCount;
                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(station.x, station.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    // Draw regular station as tick
                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = 3;
                    const angle = Math.atan2(
                        station.y - (station.y - 30),
                        station.x - (station.x - 30)
                    );
                    // Just draw a simple tick mark
                    ctx.beginPath();
                    ctx.moveTo(station.x - 8, station.y - 8);
                    ctx.lineTo(station.x + 8, station.y + 8);
                    ctx.stroke();
                }
            });
        }

        function drawTrain(train, line) {
            if (train.segmentIndex >= line.segments.length) return;
            
            const seg = line.segments[train.segmentIndex];
            if (!seg) return;
            
            const t = train.position;
            const x = seg.startX + (seg.endX - seg.startX) * t;
            const y = seg.startY + (seg.endY - seg.startY) * t;
            
            // Draw train
            ctx.fillStyle = line.color;
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw a glow effect
            ctx.shadowBlur = 10;
            ctx.shadowColor = line.color;
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function fadeOutAndRegenerate() {
            let opacity = 1;
            const fadeInterval = setInterval(() => {
                opacity -= 0.02;
                ctx.globalAlpha = opacity;
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#f8f8f8';
                ctx.fillRect(0, 0, width, height);
                ctx.globalAlpha = opacity;
                
                if (currentCity && currentCity.lines) {
                    currentCity.lines.forEach((line, i) => drawLine(line, i));
                }
                
                ctx.globalAlpha = 1;
                
                if (opacity <= 0) {
                    clearInterval(fadeInterval);
                    ctx.clearRect(0, 0, width, height);
                    currentCity = {};
                    citiesGenerated++;
                    infoDiv.textContent = `Generating new transit network... (Generated: ${citiesGenerated})`;
                    generateCity();
                }
            }, 50);
        }

        // Initialize when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
