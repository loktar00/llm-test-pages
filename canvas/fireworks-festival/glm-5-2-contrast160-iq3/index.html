<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fireworks Festival</title>
<style>
html,body{margin:0;padding:0;height:100;overflow:hidden;background:#0a0d18}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=0,H=0,horY=0;
const DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){W=cv.width=Math.floor(window.innerWidth*DPR);H=cv.height=Math.floor(window.innerHeight*DPR);cv.style.width=window.innerWidth+'px';cv.style.height=window.innerHeight+'px';horY=H*0.6;buildSky();}
window.addEventListener('resize',resize);

// Palette pools
const palettes=[
  {hue:[50,30],sat:[95,85],lit:[60,65],glow:1.2,name:'gold'},
  {hue:[280,300],sat:[100,100],lit:[60,62],glow:1.3,name:'royal'},
  {hue:[0,35],sat:[100,100],lit:[60,62],glow:1.5,name:'fire'},
  {hue:[180,200],sat:[80,85],lit:[55,60],gllow:1.2,name:'cyan'},
  {hue:[120,130],sat:[95,95],lit:[55,60],glow:1.1,name:'emerald'},
  {hue:[20,30],sat:[100,100],lit:[58,62],glow:1.3,name:'amber'},
  {hue:[50,60],sat:[100,100],lit:[75,80],glow:1,name:'pale-gold'},
  {hue:[200,220],sat:[100,100],lit:[75,80],glow:1,name:'ice'},
  {hue:[340,350],sat:[100,100],lit:[65,70],glow:1.4,name:'rose'},
  {hue:[100,110],sat:[100,100],lit:[70,72],glow:1,name:'lime'},
  {hue:([28,40])[0],sat:[100,100],lit:[62,68],glow:1.3,name:'orange'},
  {hue:[240,260],sat:[100,100],lit:[68,72],glow:1.2,name:'violet'},
  {hue:([270,290]),sat:[100,100],lit:[65,70],glow:1,name:'magenta'},
  {hue:([180,210]),sat:[90,90],lit:[60,64],gllow:1.2,name:'teal'},
];
function pickPalette(exclude){let p;do{p=palettes[(Math.random()*palettes.length)|0];}while(exclude&&exclude.has(p.name));return p;}
function samplePalette(p){let i=Math.random();let hue=p.hue[0]+(p.hue[1]-p.hue[0])*Math.random();let sat=p.sat[0]+(p.sat[1]-p.sat[0])*Math.random();let lit=p.lit[0]+(p.lit[1]-p.lit[0])*Math.random();let alpha=(i<0.3?0.7:1);return{c:colorFromHSL(hue,sat,lit,alpha),glow:Math.random()<0.6?(0.9+Math.random()*0.5):1,hue:huue,sat:sat,lit:lit,white:Math.random()<0.08};}
function colorFromHSL(h,s,l,a){return `hsla(${h|0},${s}% ${l}%${(a!==1?(','+a.toFixed(2)):')}');}

// City skyline
let skyline=[];
function buildSky(){skyline=[];let baseY=horY;let x=0;let maxH=(0.1+Math.random()*0.25)*H;while(x<W){let w=(20+Math.random()*60)*DPR;let h=(Math.random()*Math.random()*maxH)+20*DPR;skyline.push({x:x,w:Math.max(8,w),h:h,y:baseY-h,bldhs:Math.random()<0.5,cols:Math.random()<0.3?Math.floor(2+Math.random()*5):0});x+=w;}buildBuildings();}
let buildings=[];
function buildBuildings(){buildings=[];for(let i=0;i<skyline.length;i++){let s=skyline[i];let h=[];let n=1+s.cols+Math.floor(Math.random()*4);for(let j=0;j<n;j++){let ex=Math.random();let yy=s.y+(Math.random()*(s.h-20*DPR-10*DPR);let c={x:s.x+(2*DPR+Math.random()*(s.w-4*DPR),y:yy,w:2*DPR+(Math.random()*4*DPR),on:Math.random()<0.7,col:Math.random()};h.push(c);}buildings.push({sky:s,lights=h});}}

// Stars
let stars=[];
for(let i=0;i<250;i++)stars.push({x:Math.random(),y:Math.random()*horY*0.85,s:0.3+Math.random()*2,sp:0.2+Math.random()*0.8,ph:Math.random()*7});

// Firework system
const MAX_P=6000;
const pX=new Float32Array(MAX_P);const pY=new Float32Array(MAX_P);
const pVX=new Float32Array(MAX_P);const pVY=new Float32Array(MAX_P);
const pR=new Float32Array(MAX_P);const pH=new Float32Array(MAX_P);const pS=new Float32Array(MAX_P);const pL=new Float32Array(MAX_P);
const pA=new Float32Array(MAX_P);const pG=new Float32Array(MAX_P);const pD=new Float32Array(MAX_P);const pF=new Float32Array(MAX_P);
const pW=new Uint8Array(MAX_P);const pEm=new Uint8Array(MAX_P);
let pFree=[];for(let i=0;i<MAX_P;i)pFree.push(i);
let shells=[];let pending=[];let flashes=[];let lastLaunch=0;let finaleAt=180000;

function spawn(x,y,vx,vy,radius,hue,sat,lit,life,alpha,glow,white,ember){
if(pFree.length===0)return;let i=pFree.pop();pX[i]=x;pY[i]=y;pVX[i]=vx|0;pVY[i]=vy|0;pR[i]=radius;pH[i]=hue|0;pS[i]=sat|0;pL[i]=lit|0;pA[i]=alpha|0;pG[i]=0.025*DPR*(0.9+Math.random()*0.2);pD[i]=0.9990*Math.pow(0.9,Math.random()*0.1);pF[i]=life|0;pW[i]=white?1:0;pEm[i]=ember?1:0;}

function schedule(){let p=pickPalette(null);let type=Math.random()<0.85?pickPattern():'peonype'=='peonype'?patterns[(Math.random()*patterns.length)]:peonype;let x=(0.15+Math.random()*0.7)*W;let y=(0.05+Math.random()*0.35)*H;let vy=-(0.6+Math.random()*0.3)*H*0.001;let vx=(Math.random()*2-1)*0.5;let lift=1+Math.random()*0.2;shellls.push({x:x,y:H+20*DPR,vx:vx*0.5*DPR,vy:-6.5*DPR*lift,payload:{x:x,y=y,vx:vx,vy:vy},type:type,palette:p,whistle:0.4+Math.random()*0.5,whistleGap=0.2+Math.random()*0.2,t0:0,dt:(2+Math.random()*2)*DPR,phase:'flight'});}

const patterns=['peonype','willow','ring','double','peonype','willow','ring','peonype','peonype'];
function pickPattern(){return patterns[(Math.random()*patterns.length)];}

function detonate(type,palette,x,y,vx,vy){
let count;if(type==='peonype')count=80+(Math.random()*40);
if(type==='willow')count=120+Math.random()*40;
if(type==='ring')count=60;
if(type==='double'){count=40;let secondPal=pickPalette(new Set([palette.name]));setTimeout(()=>detonate(pickPattern(pickPalette(new Set([palette.name,secondPal.name])))),secondPal,x,y,vx,vy),250);}
if(type==='peonype' && Math.random()<0.4){detonate('ring',palette,x,y,vx,vy);count=50;}
// ... this is getting too messy. Let me redo this cleanly.

</script>
</body>
</html>
