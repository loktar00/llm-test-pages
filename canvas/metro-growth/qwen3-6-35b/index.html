<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit Growth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const SEGMENT_LENGTH = 50;
const MAX_LINES = 9;
const MIN_LINES = 8;
const TRAIN_COUNT_PER_LINE = 3;

const COLORS = [
    '#e74c3c', '#3498db', '#2ecc71', '#f39c12',
    '#9b59b6', '#1abc9c', '#e67e22', '#2980b9',
    '#c0392b', '#16a085', '#d35400', '#8e44ad',
    '#27ae60', '#f1c40f', '#e84393', '#00cec9'
];

const DIRECTIONS = [
    { dx: 0, dy: -1 },   // N
    { dx: 1, dy: -1 },   // NE
    { dx: 1, dy: 0 },    // E
    { dx: 1, dy: 1 },    // SE
    { dx: 0, dy: 1 },    // S
    { dx: -1, dy: 1 },   // SW
    { dx: -1, dy: 0 },   // W
    { dx: -1, dy: -1 }   // NW
];

// Grid for overlap checking
const GRID_SIZE = 10;
let grid = {};

function gridKey(x, y) {
    const gx = Math.floor(x / GRID_SIZE);
    const gy = Math.floor(y / GRID_SIZE);
    return gx + ',' + gy;
}

function markGrid(x1, y1, x2, y2) {
    const k1 = gridKey(x1, y1);
    const k2 = gridKey(x2, y2);
    if (!grid[k1]) grid[k1] = [];
    if (!grid[k2]) grid[k2] = [];
    grid[k1].push({ x1, y1, x2, y2 });
    grid[k2].push({ x1, y1, x2, y2 });
}

function checkOverlap(x1, y1, x2, y2) {
    const k1 = gridKey(x1, y1);
    const k2 = gridKey(x2, y2);
    const segments = [...(grid[k1] || []), ...(grid[k2] || [])];
    let maxDist = Infinity;
    for (const seg of segments) {
        const d = distToSegment({ x: x2, y: y2 }, seg);
        if (d < maxDist) maxDist = d;
    }
    return maxDist;
}

function distToSegment(p, seg) {
    const dx = seg.x2 - seg.x1;
    const dy = seg.y2 - seg.y1;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.hypot(p.x - seg.x1, p.y - seg.y1);
    let t = ((p.x - seg.x1) * dx + (p.y - seg.y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (seg.x1 + t * dx), p.y - (seg.y1 + t * dy));
}

class Station {
    constructor(x, y, isInterchange = false) {
        this.x = x;
        this.y = y;
        this.isInterchange = isInterchange;
    }
}

class MetroLine {
    constructor(index, color) {
        this.index = index;
        this.color = color;
        this.stations = [];
        this.segments = [];
        this.complete = false;
        this.drawProgress = 0;
        this.drawSpeed = 0.03 + Math.random() * 0.02;
        this.trains = [];
        this.trainSpawned = false;
        this.growthPaused = false;
    }

    addSegment(x1, y1, x2, y2) {
        this.segments.push({ x1, y1, x2, y2 });
        this.stations.push(new Station(x2, y2));
    }

    update() {
        if (this.drawProgress < 1) {
            this.drawProgress = Math.min(1, this.drawProgress + this.drawSpeed);
        }
        if (this.drawProgress >= 1 && !this.complete) {
            this.complete = true;
            if (!this.trainSpawned) {
                this.spawnTrains();
                this.trainSpawned = true;
            }
        }
        for (const train of this.trains) {
            train.update();
        }
    }

    spawnTrains() {
        const count = TRAIN_COUNT_PER_LINE + Math.floor(Math.random() * 2);
        for (let i = 0; i < count; i++) {
            const train = new Train(this, i / count);
            this.trains.push(train);
        }
    }

    draw(ctx) {
        if (this.segments.length === 0) return;

        const totalSegments = this.segments.length;
        const segmentsToDraw = Math.floor(this.drawProgress * totalSegments);
        const partial = (this.drawProgress * totalSegments) - segmentsToDraw;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Draw completed segments
        for (let i = 0; i < segmentsToDraw; i++) {
            const seg = this.segments[i];
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(seg.x2, seg.y2);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // Draw partial segment
        if (segmentsToDraw < totalSegments && partial > 0) {
            const seg = this.segments[segmentsToDraw];
            const px = seg.x1 + (seg.x2 - seg.x1) * partial;
            const py = seg.y1 + (seg.y2 - seg.y1) * partial;
            ctx.beginPath();
            ctx.moveTo(seg.x1, seg.y1);
            ctx.lineTo(px, py);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // Draw rounded bends at joints
        for (let i = 1; i < Math.min(segmentsToDraw + 1, this.segments.length); i++) {
            const prev = this.segments[i - 1];
            const curr = this.segments[i];
            // Draw small arc at the joint
            const midX = (prev.x2 + curr.x1) / 2;
            const midY = (prev.y2 + curr.y1) / 2;
            const angle = Math.atan2(curr.x1 - prev.x2, curr.y1 - prev.y2);
            ctx.beginPath();
            ctx.arc(prev.x2, prev.y2, 3, angle - 0.3, angle + 0.3);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // Draw stations
        for (let i = 0; i < Math.min(segmentsToDraw + 1, this.stations.length); i++) {
            const station = this.stations[i];
            if (station.isInterchange) {
                ctx.beginPath();
                ctx.arc(station.x, station.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#1a1a2e';
                ctx.fill();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                // Tick marks
                const seg = this.segments[i];
                if (seg) {
                    const angle = Math.atan2(seg.y2 - seg.y1, seg.x2 - seg.x1);
                    const perpAngle = angle + Math.PI / 2;
                    const len = 5;
                    ctx.beginPath();
                    ctx.moveTo(station.x + Math.cos(perpAngle) * len, station.y + Math.sin(perpAngle) * len);
                    ctx.lineTo(station.x - Math.cos(perpAngle) * len, station.y - Math.sin(perpAngle) * len);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        // Draw first station (origin)
        if (segmentsToDraw > 0 && this.stations.length > 0) {
            const first = this.stations[0];
            if (!first.isInterchange) {
                const seg = this.segments[0];
                const angle = Math.atan2(seg.y2 - seg.y1, seg.x2 - seg.x1);
                const perpAngle = angle + Math.PI / 2;
                const len = 5;
                ctx.beginPath();
                ctx.moveTo(first.x + Math.cos(perpAngle) * len, first.y + Math.sin(perpAngle) * len);
                ctx.lineTo(first.x - Math.cos(perpAngle) * len, first.y - Math.sin(perpAngle) * len);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Draw trains
        for (const train of this.trains) {
            train.draw(ctx);
        }
    }
}

class Train {
    constructor(line, startT) {
        this.line = line;
        this.t = startT;
        this.speed = 0.001 + Math.random() * 0.001;
        this.direction = 1;
        this.length = 0.04;
    }

    update() {
        this.t += this.speed * this.direction;
        if (this.t >= 1) {
            this.t = 1;
            this.direction = -1;
        } else if (this.t <= 0) {
            this.t = 0;
            this.direction = 1;
        }
    }

    getPosition() {
        const totalLen = this.getTotalLength();
        let targetDist = this.t * totalLen;
        let accumulated = 0;
        for (const seg of this.line.segments) {
            const segLen = Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1);
            if (accumulated + segLen >= targetDist) {
                const localT = (targetDist - accumulated) / segLen;
                return {
                    x: seg.x1 + (seg.x2 - seg.x1) * localT,
                    y: seg.y1 + (seg.y2 - seg.y1) * localT
                };
            }
            accumulated += segLen;
        }
        return { x: this.line.stations[this.line.stations.length - 1].x, y: this.line.stations[this.line.stations.length - 1].y };
    }

    getTotalLength() {
        let total = 0;
        for (const seg of this.line.segments) {
            total += Math.hypot(seg.x2 - seg.x1, seg.y2 - seg.y1);
        }
        return total;
    }

    draw(ctx) {
        const pos = this.getPosition();
        const segIdx = this.getSegmentIndex();
        const seg = this.line.segments[segIdx];
        if (!seg) return;
        const angle = Math.atan2(seg.y2 - seg.y1, seg.x2 - seg.x1);

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(angle);

        // Train body
        const w = 14;
        const h = 6;
        ctx.fillStyle = this.line.color;
        ctx.beginPath();
        ctx.roundRect(-w / 2, -h / 2, w, h, 2);
        ctx.fill();

        // Windows
        ctx.fillStyle = '#fff';
        ctx.fillRect(-w / 2 + 2, -h / 2 + 1, 3, h - 2);
        ctx.fillRect(-2, -h / 2 + 1, 3, h - 2);
        ctx.fillRect(w / 2 - 5, -h / 2 + 1, 3, h - 2);

        // Headlight
        ctx.fillStyle = '#ffeaa7';
        ctx.beginPath();
        ctx.arc(w / 2 - 1, 0, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    getSegmentIndex() {
        const totalLen = this.getTotalLength();
        let targetDist = this.t * totalLen;
        let accumulated = 0;
        for (let i = 0; i < this.line.segments.length; i++) {
            const segLen = Math.hypot(this.line.segments[i].x2 - this.line.segments[i].x1, this.line.segments[i].y2 - this.line.segments[i].y1);
            if (accumulated + segLen >= targetDist) return i;
            accumulated += segLen;
        }
        return this.line.segments.length - 1;
    }
}

function dist(a, b) {
    return Math.hypot(b.x - a.x, b.y - a.y);
}

function generateCity() {
    const lines = [];
    const usedSegments = [];
    const center = { x: W / 2, y: H / 2 };
    const targetCount = MIN_LINES + Math.floor(Math.random() * (MAX_LINES - MIN_LINES + 1));

    // Generate starting points for each line
    const startPoints = [];
    for (let i = 0; i < targetCount; i++) {
        const angle = (Math.PI * 2 * i) / targetCount + (Math.random() - 0.5) * 0.5;
        const dist = 30 + Math.random() * 60;
        startPoints.push({
            x: center.x + Math.cos(angle) * dist,
            y: center.y + Math.sin(angle) * dist
        });
    }

    for (let li = 0; li < targetCount; li++) {
        const line = new MetroLine(li, COLORS[li % COLORS.length]);
        line.stations.push(new Station(startPoints[li].x, startPoints[li].y));
        lines.push(line);
    }

    // Grow lines
    const maxIterations = 200;
    for (let iter = 0; iter < maxIterations; iter++) {
        let anyGrew = false;
        for (let li = 0; li < lines.length; li++) {
            const line = lines[li];
            if (line.segments.length >= 15 + Math.floor(Math.random() * 10)) continue;
            if (line.segments.length === 0) continue;

            const lastStation = line.stations[line.stations.length - 1];
            const prevStation = line.stations.length > 1 ? line.stations[line.stations.length - 2] : null;

            let bestDir = null;
            let bestScore = -Infinity;

            for (const dir of DIRECTIONS) {
                // Don't go back
                if (prevStation) {
                    const backDir = { dx: -prevStation.x2 + lastStation.x, dy: -prevStation.y + lastStation.y };
                    if (dir.dx === -backDir.dx * 0.1 && dir.dy === -backDir.dy * 0.1) continue;
                    // Check if going roughly back
                    const dot = dir.dx * (prevStation.x - lastStation.x) + dir.dy * (prevStation.y - lastStation.y);
                    if (dot > 0) continue;
                }

                const nx = lastStation.x + dir.dx * SEGMENT_LENGTH;
                const ny = lastStation.y + dir.dy * SEGMENT_LENGTH;

                // Keep within bounds
                if (nx < 30 || nx > W - 30 || ny < 30 || ny > H - 30) continue;

                // Check overlap
                const overlapDist = checkOverlap(lastStation.x, lastStation.y, nx, ny);
                const overlapPenalty = overlapDist < 15 ? (15 - overlapDist) * 5 : 0;

                // Prefer outward direction
                const outwardAngle = Math.atan2(lastStation.y - center.y, lastStation.x - center.x);
                const dirAngle = Math.atan2(dir.dy, dir.dx);
                let angleDiff = Math.abs(outwardAngle - dirAngle);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                const outwardBonus = (1 - angleDiff / Math.PI) * 3;

                // Prefer not too short lines
                const lengthBonus = line.segments.length < 5 ? 2 : 0;

                const score = -overlapPenalty + outwardBonus + lengthBonus + Math.random() * 2;

                if (score > bestScore) {
                    bestScore = score;
                    bestDir = dir;
                }
            }

            if (bestDir && bestScore > -20) {
                const nx = lastStation.x + bestDir.dx * SEGMENT_LENGTH;
                const ny = lastStation.y + bestDir.dy * SEGMENT_LENGTH;
                line.addSegment(lastStation.x, lastStation.y, nx, ny);
                markGrid(lastStation.x, lastStation.y, nx, ny);
                anyGrew = true;
            }
        }
        if (!anyGrew) break;
    }

    // Check for interchanges (lines that pass near each other)
    const interchangeThreshold = 12;
    for (let i = 0; i < lines.length; i++) {
        for (let j = i + 1; j < lines.length; j++) {
            for (const s1 of lines[i].stations) {
                for (const s2 of lines[j].stations) {
                    if (dist(s1, s2) < interchangeThreshold) {
                        s1.isInterchange = true;
                        s2.isInterchange = true;
                    }
                }
            }
            // Also check segments
            for (const seg1 of lines[i].segments) {
                for (const seg2 of lines[j].segments) {
                    if (segmentsIntersect(seg1, seg2)) {
                        // Mark nearby stations
                        for (const s1 of lines[i].stations) {
                            if (dist(s1, { x: (seg1.x1 + seg1.x2) / 2, y: (seg1.y1 + seg1.y2) / 2 }) < interchangeThreshold * 2) {
                                s1.isInterchange = true;
                            }
                        }
                        for (const s2 of lines[j].stations) {
                            if (dist(s2, { x: (seg2.x1 + seg2.x2) / 2, y: (seg2.y1 + seg2.y2) / 2 }) < interchangeThreshold * 2) {
                                s2.isInterchange = true;
                            }
                        }
                    }
                }
            }
        }
    }

    return lines;
}

function segmentsIntersect(seg1, seg2) {
    const d1x = seg1.x2 - seg1.x1;
    const d1y = seg1.y2 - seg1.y1;
    const d2x = seg2.x2 - seg2.x1;
    const d2y = seg2.y2 - seg2.y1;
    const denom = d1x * d2y - d1y * d2x;
    if (Math.abs(denom) < 0.001) return false;
    const t = ((seg2.x1 - seg1.x1) * d2y - (seg2.y1 - seg1.y1) * d2x) / denom;
    const u = ((seg2.x1 - seg1.x1) * d1y - (seg2.y1 - seg1.y1) * d1x) / denom;
    return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

let currentLines = [];
let phase = 'growing'; // growing, complete, fading, transitioning
let phaseTimer = 0;
let fadeAlpha = 0;
let transitionProgress = 0;

function reset() {
    grid = {};
    currentLines = generateCity();
    phase = 'growing';
    phaseTimer = 0;
    fadeAlpha = 0;
    transitionProgress = 0;
}

reset();

function drawBackground() {
    // Subtle grid pattern
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Subtle dots
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    const spacing = 40;
    for (let x = spacing; x < W; x += spacing) {
        for (let y = spacing; y < H; y += spacing) {
            ctx.beginPath();
            ctx.arc(x, y, 1, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawTitle() {
    if (phase === 'fading' || phase === 'transitioning') return;
    const allComplete = currentLines.every(l => l.complete);
    if (allComplete) return;

    const anyDrawing = currentLines.some(l => l.drawProgress > 0 && l.drawProgress < 1);
    if (!anyDrawing && currentLines.length > 0) return;

    ctx.fillStyle = `rgba(255,255,255,0.08)`;
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TRANSIT GROWTH', W / 2, 30);
}

function animate() {
    phaseTimer++;

    drawBackground();

    // Update and draw lines
    for (const line of currentLines) {
        line.update();
    }

    // Draw all lines
    for (const line of currentLines) {
        line.draw(ctx);
    }

    // Check if all lines are complete
    const allComplete = currentLines.every(l => l.complete);
    if (allComplete && phase === 'growing') {
        phase = 'complete';
        phaseTimer = 0;
    }

    if (phase === 'complete') {
        // Wait a moment, then fade
        if (phaseTimer > 120) {
            phase = 'fading';
            phaseTimer = 0;
        }
    }

    if (phase === 'fading') {
        fadeAlpha = Math.min(1, phaseTimer / 60);
        if (fadeAlpha >= 1) {
            phase = 'transitioning';
            phaseTimer = 0;
        }
    }

    if (phase === 'transitioning') {
        // Draw fade overlay
        ctx.fillStyle = `rgba(26, 26, 46, ${fadeAlpha})`;
        ctx.fillRect(0, 0, W, H);

        if (phaseTimer > 40) {
            reset();
        }
    }

    if (phase === 'fading') {
        ctx.fillStyle = `rgba(26, 26, 46, ${fadeAlpha})`;
        ctx.fillRect(0, 0, W, H);
    }

    drawTitle();

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
