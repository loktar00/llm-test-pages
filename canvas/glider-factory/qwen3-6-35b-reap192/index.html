<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Life Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        // Configuration
        const CELL_SIZE = 4;
        const DEAD_COLOR = '#050505';
        const FRESH_COLOR = '#00ffff'; // Cyan
        const OLD_COLOR = '#ff0055';   // Deep Red/Pink
        const SWEEP_COLOR = '#ffffff'; // Flash
        const SWEEP_SPEED = 40;        // Pixels per frame
        const DEACTIVATE_THRESHOLD = 0.0005; // 0.05% activity
        const MAX_AGE = 60; // Frames until max color

        let width, height;
        let cols, rows;
        let grid, ageGrid; // Using Uint8Array for performance
        let sweepX = 0;
        let isSweeping = false;
        let lastTime = 0;
        let totalCells
