<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Onboarding Wizard</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #a5b4fc;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --radius: 24px;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system-font, system-ui, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- Card Container --- */
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.02);
            padding: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* --- Progress Bar --- */
        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e2e8f0;
            transition: background var(--transition), transform var(--transition);
            position: relative;
            z-index: 2;
        }

        .step-dot.active {
            background: var(--primary);
            transform: scale(1.3);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .step-dot.completed {
            background: var(--success);
        }

        .progress-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #e2e8f0;
            transform: translateY(-50%);
            z-index: 1;
        }

        .progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width var(--transition);
        }

        /* --- Wizard Steps Wrapper --- */
        .steps-wrapper {
            position: relative;
            height: 240px; /* Fixed height to prevent layout shifts */
            overflow: hidden;
        }

        .step {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition), opacity var(--transition);
            opacity: 0;
            pointer-events: none;
        }

        .step.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        /* Slide Directions */
        .step.slide-out-left { transform: translateX(-100%); opacity: 0; }
        .step.slide-out-right { transform: translateX(100%); opacity: 0; }
        .step.slide-in-left { transform: translateX(-100%); }
        .step.slide-in-right { transform: translateX(100%); }

        /* --- Illustrations (Pure CSS) --- */
        .illustration {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Step 1: Profile */
        .shape-user {
            width: 60px;
            height: 60px;
            background: var(--primary-light);
            border-radius: 50%;
            position: relative;
        }
        .shape-user::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: var(--primary-light);
            border-radius: 40px 40px 0 0;
        }
        /* Floating animation for illustration */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .illustration { animation: float 4s ease-in-out infinite; }

        /* Step 2: Security */
        .shape-lock {
            width: 50px;
            height: 40px;
            background: var(--primary);
            border-radius: 6px;
            position: relative;
            z-index: 2;
        }
        .shape-lock::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 10px;
            width: 30px;
            height: 30px;
            border: 6px solid var(--primary);
            border-radius: 50%;
            border-bottom: none;
            z-index: 1;
        }
        .shape-lock::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 20px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;;
        }

        /* Step 3: Preferences */
        .shape-settings {
            width: 50px;
            height: 50px;
            background: #fff;
            border: 4px solid var(--text-muted);
            border-radius: 12px;
            position: relative;
            animation: spin 10s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .shape-settings::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            background: var(--primary);
            border-radius: 50%;
        }

        /* --- Forms --- */
        .form-group {
            width: 100%;
            margin-top: 10px;
        }
        
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"], input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s;
            outline: none;
            background: #f8fafc;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: #fff;
        }

        /* Toggle Switch for Step 3 */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- Footer / Buttons --- */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.95rem;
        }

        .btn-back {
            background: transparent;
            color: var(--text-muted);
        }
        .btn-back:hover { color: var(--text-main); background: #f1f5f9; }
        .btn-back.hidden { visibility: hidden; pointer-events: none; }

        .btn-next {
            background: var(--primary);
            color: white;
            margin-left: auto;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        /* --- Success State --- */
        .success-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        
        .success-view.active { display: flex; }
        .wizard-content { display: flex; flex-direction: column; height: 100%; }
        .wizard-content.hidden { display: none; }

        /* SVG Checkmark */
        .checkmark-circle {
            stroke: var(--success);
            stroke-width: 2;
            fill: transparent;
            width: 80px;
            height: 80px;
            animation: scale-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .checkmark-check {
            fill: none;
            stroke: var(--success);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            animation: draw-check 0.4s ease forwards 0.4s;
        }

        @keyframes scale-in {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes draw-check {
            0% { stroke-dashoffset: 30; opacity: 0; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }

        .success-title {
            margin-top: 20px;
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
        }
        .success-msg {
            color: var(--text-muted);
            margin-top: 8px;
        }

    </style>
</head>
<body>

    <div class="card">
        <!-- Progress Header -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-line"><div class="progress-fill" id="progressFill"></div></div>
            <div class="step-dot active" data-step="0"></div>
            <div class="step-dot" data-step="1"></div>
            <div class="step-dot" data-step="2"></div>
            <div class="step-dot" data-step="3"></div>
        </div>

        <!-- Wizard Content -->
        <div class="steps-wrapper wizard-content" id="wizardContent">
            
            <!-- Step 1: Profile -->
            <div class="step active" id="step-0">
                <div class="illustration">
                    <div class="shape-user"></div>
                </div>
                <h2>Create Profile</h2>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="e.g. explorer" autocomplete="off">
                </div>
            </div>

            <!-- Step 2: Security -->
            <div class="step slide-out-right" id="step-1">
                <div class="illustration">
                    <div class="shape-lock"></div>
                </div>
                <h2>Secure Account</h2>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
            </div>

            <!-- Step 3: Preferences -->
            <div class="step slide-out-right" id="step-2">
                <div class="illustration">
                    <div class="shape-settings"></div>
                </div>
                <h2>Preferences</h2>
                <div class="toggle-row">
                    <span>Notifications</span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span>Dark Mode</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Step 4: Review -->
            <div class="step slide-out-right" id="step-3">
                <div class="illustration" style="animation: none;">
                    <div style="width: 80px; height: 50px; background: #f1f5f9; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; border: 2px solid #cbd5e1;">
                        <div style="width: 60px; height: 4px; background: #cbd5e1; border-radius: 2px; margin-bottom: 6px;"></div>
                        <div style="width: 40px; height: 4px; background: #cbd5e1; border-radius: 2px;"></div>
                    </div>
                </div>
                <h2>Review</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-top: 10px;">
                    Ready to start your adventure.
                </p>
            </div>
        </div>

        <!-- Success View (Hidden initially) -->
        <div class="success-view" id="successView">
            <svg class="checkmark" viewBox="0 0 52 52">
                <circle class="checkmark-circle" cx="26" cy="26" r="25" />
                <path class="checkmark-check" d="M14.1 27.2l7.1 7.1 16.6-16.6" />
            </svg>
            <h2 class="success-title">Setup Complete!</h2>
            <p class="success-msg">Redirecting to dashboard...</p>
        </div>

        <!-- Footer Controls -->
        <div class="footer" id="footerControls">
            <button class="btn btn-back hidden" id="btnBack">Back</button>
            <button class="btn btn-next" id="btnNext">Next</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const totalSteps = 4;
            let currentStep = 0;
            
            const steps = document.querySelectorAll('.step');
            const dots = document.querySelectorAll('.step-dot');
            const progressFill = document.getElementById('progressFill');
            const btnNext = document.getElementById('btnNext');
            const btnBack = document.getElementById('btnBack');
            const wizardContent = document.getElementById('wizardContent');
            const successView = document.getElementById('successView');
            const footerControls = document.getElementById('footerControls');
            const progressContainer = document.getElementById('progressContainer');

            function updateProgress() {
                // Update dots
                dots.forEach((dot, index) => {
                    if (index < currentStep) {
                        dot.classList.add('completed');
                        dot.classList.remove('active');
                    } else if (index === currentStep) {
                        dot.classList.add('active');
                        dot.classList.remove('completed');
                    } else {
                        dot.classList.remove('active', 'completed');
                    }
                });

                // Update Line
                const percentage = (currentStep / (totalSteps - 1)) * 100;
                progressFill.style.width = `${percentage}%`;
            }

            function updateButtons() {
                if (currentStep === 0) {
                    btnBack.classList.add('hidden');
                } else {
                    btnBack.classList.remove('hidden');
                }

                if (currentStep === totalSteps - 1) {
                    btnNext.textContent = 'Finish';
                } else {
                    btnNext.textContent = 'Next';
                }
            }

            function goToStep(direction) {
                const currentEl = steps[currentStep];
                let nextIndex = currentStep + direction;

                if (nextIndex < 0 || nextIndex >= totalSteps) return;

                const nextEl = steps[nextIndex];

                // Determine slide classes based on direction
                if (direction > 0) {
                    currentEl.classList.remove('active');
                    currentEl.classList.add('slide-out-left');
                    
                    nextEl.classList.remove('slide-out-right', 'slide-out-left');
                    nextEl.classList.add('active', 'slide-in-left');
                } else {
                    currentEl.classList.remove('active');
                    currentEl.classList.add('slide-out-right');
                    
                    nextEl.classList.remove('slide-out-right', 'slide-out-left');
                    nextEl.classList.add('active', 'slide-in-right');
                }

                currentStep = nextIndex;
                updateProgress();
                updateButtons();

                // Cleanup classes after transition to keep DOM clean
                setTimeout(() => {
                    currentEl.classList.remove('slide-out-left', 'slide-out-right');
                }, 400);
            }

            function finishWizard() {
                // Hide wizard content
                wizardContent.classList.add('hidden');
                progressContainer.style.opacity = '0';
                footerControls.style.opacity = '0';
                
                // Show success
                successView.classList.add('active');
            }

            btnNext.addEventListener('click', () => {
                if (currentStep < totalSteps - 1) {
                    goToStep(1);
                } else {
                    finishWizard();
                }
            });

            btnBack.addEventListener('click', () => {
                goToStep(-1);
            });

            // Initialize
            updateProgress();
            updateButtons();
        });
    </script>
</body>
</html>
