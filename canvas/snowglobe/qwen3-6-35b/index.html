<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Globe Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510; /* Dark night background */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="globeCanvas"></canvas>

        let width, height, centerX, centerY, globeRadius;
        const NUM_SNOW = 600;
        const SHAKE_INTERVAL = 20000; // 20 seconds
        const SHAKE_DURATION = 2000;
        
        // State
        let time = 0;
        let shakeStartTime = 0;
        let isShaking = false;
        let snowParticles = [];

        const cx = 0, cy = 0; // Set in resize

        // Resize Handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            globeRadius = Math.min(width, height) * 0.35;
