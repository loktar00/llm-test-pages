   if(this.fallVy<0&this.y<G-30){this.y=G-30;this.fallVy*=-0.2;}
   if(this.falling>5){this.alive=false;}
   return;
  }
  this.cooldown-=dt*60;
  if(this.state==='walk'){
   const tx=this.getTargetX();
   if(tx!==null&abs(this.x-tx)<5){this.state='attack';}
   else {this.x+=this.dir*this.speed*60*dt;}
  }
  if(this.state==='attack'){
   if(this.cooldown<=0){this.fire();this.cooldown=this.cooldown0+rand(0,30);}
  }
 }
 getTargetX(){
  if(this.team==='attack'){
   if(this.role==='melee')return W*0.6;
   return W*0.5;
  }
  return null;
 }
 fire(){
  if(this.role==='archer'){archers.push(new Arrow(this.x,this.y-30,this.dir,this.team));}
  else if(this.role==='catapult'){catapults.push(new Stone(this.x,this.y-15,this.dir));}
 }
 hit(){this.falling=1;this.fallVy=-500;this.fallVx=-this.dir*400;this.hp-=50;
   if(this.hp<=0){this.alive=false;this.falling=2;}}
 draw(){
  ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.dir,1);
  // body silhouette
  const f=this.animT*0.018;
  const walkBob=Math.sin(f*4)*1.5;
  const attackL=this.state==='attack'&Math.sin(f*8)>0.5?1:0;
  ctx.translate(0,-walkBob);
  // body
  ctx.fillStyle=(this.team==='attack')?C.attacker1:C.defender1;
  // simple silhouette
  ctx.beginPath();
  ctx.moveTo(-8,12);
  ctx.lineTo(-8,-15);
  ctx.lineTo(-5,-15);
  ctx.lineTo(-5,-12);
  ctx.lineTo(5,-12);
  ctx.lineTo(5,-15);
  ctx.lineTo(8,-15);
  ctx.lineTo(8,12);
  ctx.fill();
  // arms
  ctx.fillStyle=(this.team==='attack')?C.attacker2:C.defender2;
  ctx.fillRect(-8,-15,16,3);
  // role marker
  if(this.role==='archer'){
   // bow
   ctx.fillStyle=(this.team==='attack')?C.attckerHi:C.defenderHi;
   ctx.beginPath();ctx.arc(8,-15,6,0,Math.PI*2);ctx.stroke();
   ctx.beginPath();ctx.arc(8,-15,6,-0.6,Math.PI+0.6);ctx.stroke();
   ctx.lineWidth=2;ctx.strokeStyle=(this.team==='attack')?C.attacker1:C.defender1;
   ctx.beginPath();ctx.arc(8,-15,7,-0.6,Math.PI+0.6);ctx.stroke();
   ctx.lineWidth=1;
   // arrow
   if(this.state==='attack'){
   ctx.strokeStyle=(this.team==='attack')?C.attacker1:C.defender1;
   ctx.beginPath();ctx.moveTo(8,-15);ctx.lineTo(15,-15);ctx.stroke();
   }
  } else if(this.role==='catapult'){
   ctx.fillStyle=(this.team==='attack')?C.attckerHi:C.defenderHi;
   ctx.fillRect(-10,-12,10,4);
  } else if(this.role==='melee'){
   ctx.fillStyle=(this.team==='attack')?C.attckerHi:C.defenderHi;
   ctx.fillRect(8,-15,10,3);
  }
  ctx.restore();
 }
 silhouette(){}
}

class SiegeTower{
 constructor(){this.x=W*0.15;this.dir=1;this.y=G-30;this.speed=0.06;this.state='walk';this.hp=100;this.cw=50;this.ch=-120;this.animT=0;this.targetX=W*0.6;this.alive=true;}
 update(dt){this.animT+=dt*60;this.x+=this.dir*this.speed*60*dt;if(this.x>this.targetX){this.x=this.targetX;this.state='attack';}
  if(this.state==='attack'){this.animT+=dt*60*2;}
 }
 draw(){ctx.save();ctx.translate(this.x,this.y);
  // base platform
  ctx.fillStyle=C.attacker1;ctx.fillRect(-30,12,60,5);
  // wheels
  ctx.fillStyle=C.attcker2;ctx.beginPath();ctx.arc(-30,12,8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(30,12,8,0,Math.PI*2);ctx.fill();
  // tower body
  ctx.fillStyle=C.attcker1;
  ctx.fillRect(-25,-120,50,120);
  // panel detail
  ctx.fillStyle=C.attker2;ctx.fillRect(-25,-120,50,2);
  ctx.fillStyle=C.attckerHi;ctx.fillRect(-25,-120,5,120);
  ctx.fillRect(-25,-120,50,2);
  // archers inside
  ctx.fillStyle='#151515';
  ctx.beginPath();ctx.arc(0,-110,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#15151c';ctx.beginPath();ctx.arc(0,-110,5,0,Math.PI*2);ctx.fill();
  // shield front
  ctx.fillStyle=C.attkerHi;ctx.fillRect(-25,-20,50,4);
  // flag
  ctx.fillStyle=C.attckerHi;ctx.fillRect(-25,-125,5,5);

 }
}

class BatteringRam{
 constructor(){this.x=W*0.15+30;this.dir=1;this.y=G-30;this.speed=0.05;this.state='walk';this.hp=100;this.animT=0;this.targetX=W*0.6-30;this.alive=true;}
 update(dt){this.animT+=dt*60;this.x+=this.dir*this.speed*60*dt;if(this.x>this.targetX){this.x=this.targetX;this.state='attack';}
  if(this.state==='attack'){this.animT+=dt*60*2;}
 }
 draw(){
  ctx.save();ctx.translate(this.x,this.y);
  // base platform
  ctx.fillStyle=C.attker1;ctx.fillRect(-30,12,60,5);
  // wheels
  ctx.fillStyle=C.attcker2;ctx.beginPath();ctx.arc(-30,12,8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(30,12,8,0,Math.PI*2).ctx.fill();
  // ram body
  ctx.fillStyle=C.attcker1;ctx.fillRect(-25,-10,50,20);
  ctx.fillStyle=C.attcker2;ctx.fillRect(-25,-10,50,2);

class Arrow{
 constructor(sx,sy,dir,team){this.sx=sx;this.sy=sy;this.dir=dir;this.team=team;this.x=sx;this.y=sy;this.t=0;this.maxT=2.2;
   const tx=(team==='attack')?W*0.65:W*0.35;
   const ty=G-30;
   this.sx0=sx;this.sy0=sy;
   this.tx=tx;this.ty=ty;
   this.peak=Math.abs(tx-sx)*0.4+50;
   this.x=sx;this.y=sy;
   this.alive=true;
   this.targetUnit=null;
  }
 update(dt){
  this.t+=dt;
  if(this.t>=this.maxT){this.alive=false;this.resolve();return;}
  const t=this.t/this.maxT;
  this.x=lerp(this.sx0,this.tx,t);
  this.y=lerp(this.sy0,this.ty,t)-Math.sin(t*Math.PI)*this.peak;
 }
 resolve(){
  // find nearby units
  const myTeam=this.team;
  const targets=units.filter(u=>u.team!==myTeam&u.alive&Math.abs(u.x-this.tx)<20);
  if(targets.length>0){
   const u=targets[Math.floor(Math.random()*targets.length)];
   u.hit();
   spawnParticles(u.x,u.y-30,5,'#0c0c0e');
   world.shakeT=0.1;world.shakeAmount=2;
  }
 }
 draw(){
  if(!this.alive)return;
  ctx.save();
  ctx.translate(this.x,this.y);
  ctx.rotate(this.dir*Math.atan2(-this.peak*0.5,this.dir*200)*0.000+this.dir*0.1);
  ctx.fillStyle=C.arrow;
  ctx.beginPath();
  ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.lineTo(0,2);ctx.lineTo(0,-2);ctx.fill();
  // arc trail
  ctx.strokeStyle='rgba(255,255,255,0.2)';
  ctx.beginPath();
  for(let i=0;i<1;i++){
   const t=this.t/this.maxT-i*0.01;
   if(t<0)break;
   ctx.lineTo(lerp(this.sx0,this.tx,t)-this.x,lerp(this.sy0,this.ty,t)-this.y-Math.sin(t*Math.PI)*this.peak);
  }
  ctx.stroke();
  ctx.restore();
 }
}

class Stone{
 constructor(sx,sy,dir){this.sx=sx;this.sy=sy;this.dir=dir;
  this.sx0=sx;this.sy0=sy;
  this.tx=(dir===1)?(W*0.6+rand(-50,50)):W-rand(60,200);
  this.ty=G-30;
  this.peak=Math.abs(this.tx-sx)*0.5+50;
  this.t=0;this.maxT=2.5;
  this.x=sx;this.y=sy;
  this.rot=0;this.rotV=rand(-10,10);
  this.alive=true;
  this.targetX=this.tx;
 }
 update(dt){
  this.t+=dt;
  this.rot+=this.rotV*dt;
  if(this.t>=this.maxT){this.alive=false;this.resolve();return;}
  const t=this.t/this.maxT;
  this.x=lerp(this.sx0,this.tx,t);
  this.y=lerp(this.sy0,this.ty,t)-Math.sin(t*Math.PI)*this.peak;
 }
 resolve(){
  // hit wall or defender
  const hitWall=this.tx>W*0.4&this.tx<W*0.6;
  if(hitWall){
   const seg=wall.segments.find(s=>this.tx>=s.x&&this.tx<s.x+s.width);
   if(seg){seg.hp-=0.6;seg.repairFlash=1;spawnParticles(this.x,this.y,20,C.spark);world.shakeT=0.5;world.shakeAmount=8;}
  }
  spawnParticles(this.x,this.y,8,C.stone);
 }
 draw(){
  if(!this.alive)return;
  ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
  ctx.fillStyle=C.stone;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.wall1;ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }
}

function spawnParticles(x,y,n,color){
 for(let i=0;i<n;i++){
  particles.push({
   x:x+rand(-5,5),y=y+rand(-5,5),
   vx:rand(-200,200),vy:rand(-200,200),
   t:0,maxT=rand(0.5,1.5),
   color:color||C.spark,
   size:rand(1,3),
  });
 }
}

class OilDrop{
 constructor(x,y){this.x=x;this.y=y;this.vx=rand(-30,30);this.vy=-rand(200,400);
  this.t=0;this.maxT=rand(1,2);this.size=rand(3,8);this.alive=true;}
 update(dt){this.t+=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=200*dt;
   if(this.t>=this.maxT){this.alive=false;return;}
  if(this.y>G-30){this.alive=false;this.resolve();}}
 resolve(){
  spawnParticles(this.x,this.y,10,C.spark);
  // hit attackers
  units.forEach(u=>{if(u.team==='attack'&u.alive&Math.abs(u.x-this.x)<30){u.hit();}});
  }
 draw(){
  ctx.save();ctx.translate(this.x,this.y);
  ctx.fillStyle=C.oil;
  ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.oilGlow;
  ctx.beginPath();ctx.arc(0,0,this.size*0.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
 }
}

// Phase transitions
function transitionPhase(label){
 world.phaseLabel=label;
 world.phaseLabelT=0.4;
 world.state='transition';
 world.phaseTimer=1.5;
 world.timeScale=0;
}

function clearField(){
 units.length=0;
 towers.length=0;
 rams.length=0;
 catapults.length=0;
 archers.length=0;
 projectiles.length=0;
 particles.length=0;
 oilDrops.length=0;
}

function startNewAssault(){
 world.assault++;
 spawnAttackers();
 initWall();
 world.repelMeter=1.0;
 world.state='play';
 world.phaseLabel='ASSAULT ' + world.assault;
 world.phaseLabelT=0.6;
 world.phaseTimer=0;
 world.timeScale=1;
}

// main loop
let lastTime=0;
function loop(t){
 const dt=Math.min(0.05,(t-lastTime)/1000);
 lastTime=t;
 // update
 if(world.phaseLabelT>0){world.phaseLabelT-=dt;}
 if(world.phaseTimer>0){world.phaseTimer-=dt;if(world.phaseTimer<=0){startNewAssault();}}
 // shake
 if(world.shakeT>0){world.shakeT-=dt;}
 // update entities
 units.forEach(u=>u.update(dt));
 towers.forEach(t=>t.update(dt));
 rams.forEach(r=>r.update(dt));
 catapults.forEach(c=>c.update(dt));
 archers.forEach(a=>a.update(dt));
 projectiles.forEach(p=>p.update(dt));
 particles.forEach(p=>p.update(dt));
 oilDrops.forEach(o=>o.update(dt));
 // cleanup
 for(let i=units.length-1;i>=0;i--){if(units[i].alive===false){units.splice(i,1);continue;}}
 for(let i=projectiles.length-1;i>=0;i--){if(projectiles[i].alive===false){projectiles.splice(i,1);continue;}}
 for(let i=particles.length-1;i>=0;i--){if(particles[i].t>=particles[i].maxT){particles.splice(i,1);continue;}}
 for(let i=oilDrops.length-1;i>=0;i--){if(oilDrops[i].alive===false){oilDrops.splice(i,1);continue;}}
 // check breach
 const breachCount=wall.segments.filter(s=>s.hp<=0).length;
 const breachRatio=breachCount/wall.segments.length;
 if(breachRatio>=0.2&world.state==='play'){
  world.breachCount++;
  document.getElementById('bre').textContent=world.breachCount;
  transitionPhase('BREACHED');
 }
 // check repel
 if(world.repelMeter<=0&world.state==='play'){
  world.repelledCount++;
  document.getElementById('rep').textContent=world.repelledCount;
  transitionPhase('REPELLED');
 }
 // draw
 draw();
 requestAnimationFrame(loop);
}

function draw(){
 ctx.save();
 // shake
 if(world.shakeT>0){
  ctx.translate(rand(-world.shakeAmount,world.shakeAmount),rand(-world.shakeAmount,world.shakeAmount));
 }
 // bg
 drawBg();
 // ground
 drawGround();
 // wall
 drawWall();
 // towers
 towers.forEach(t=>t.draw());
 // rams
 rams.forEach(r=>r.draw());
 // units
 units.forEach(u=>u.draw());
 // catapults
 catapults.forEach(c=>c.draw());
 // archers (units already)
 // projectiles
 archers.forEach(a=>a.draw());
 projectiles.forEach(p=>p.draw());
 // oil drops
 oilDrops.forEach(o=>o.draw());
 // particles
 particles.forEach(p=>p.draw());
 // phase label
 if(world.phaseLabelT>0){
  ctx.fillStyle='rgba(20,8,15,'+clamp(world.phaseLabelT*1.5,0,1)+')';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,'+clamp(world.phaseLabelT*2,0,1)+')';
  ctx.font='700 '+(Math.floor(W*0.04))+'px "Segoe UI",sans-serif';
  ctx.textAlign='center';
  ctx.fillText(world.phaseLabel,W/2,H/2);
  ctx.font='600 '+(Math.floor(W*0.02))+'px "Segoe UI",sans-serif';
  ctx.fillStyle='rgba(220,200,160,'+clamp(world.phaseLabelT*2,0,1)+')';
  ctx.fillText('field cleared · castle repairs · assault renewed',W/2,H/2+30);
  }
 ctx.restore();
}

function drawBg(){
 // sky gradient
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,C.sky1);g.addColorStop(1,C.sky2);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // haze
 const hg=ctx.createLinearGradient(0,0,0,H);
 hg.addColorStop(0,C.haze1);hg.addColorStop(1,C.haze2);
 ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);
 // sun
 ctx.fillStyle=C.sun;
 ctx.beginPath();ctx.arc(W*0.5,H*0.4,W*0.6,0,Math.PI*2);ctx.fill();
}

function drawGround(){
 const g=ctx.createLinearGradient(0,G,0,H);
 g.addColorStop(0,C.gound1);g.addColorStop(1,C.gound2);
 ctx.fillStyle=g;ctx.fillRect(0,G,W,H-G);
 // ground line
 ctx.fillStyle='rgba(255,255,255,0.1)';
 ctx.fillRect(0,G,W,1);
}

function drawWall(){
 // base wall
 const topY=G-wall.height;
 ctx.fillStyle=C.wall1;ctx.fillRect(0,topY,W,wall.height);
 // segments
 for(let i=0;i<wall.segments.length;i++){
  const s=wall.segments[i];
  const segTopY=topY+( (1-s.hp)*wall.height*0.5);
  // brick pattern
  ctx.fillStyle=C.wall2;ctx.fillRect(s.x+4,topY+4,s.width-8,wall.height-8);
  // edge
  ctx.fillStyle=C.wallEdge;ctx.fillRect(s.x,topY,s.width,2);
  ctx.fillRect(s.x,topY+2,s.width,4);
  ctx.fillStyle=C.wall1;ctx.fillRect(s.x,topY+6,s.width,2);
 }
 // top decorative
 ctx.fillStyle=C.wall2;ctx.fillRect(0,topY-6,W,8);
 // damage cracks
 for(let i=0;i<wall.segments.length;i++){
  const s=wall.segments[i];
  if(s.hp<1){
   ctx.strokeStyle='rgba(0,0,0,'+(0.5*(1-s.hp))+')';
   ctx.lineWidth=2;
   const seed=s.crackSeed;
   for(let j=0;j<5;j++){
    const sx=s.x+(seed%30+j*17)%s.width;
    const sy=topY+(j*713)%wall.height;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+5,sy+5);ctx.stroke();
   }
  }
 }
 // repair flash
 for(let i=0;i<wall.segments.length;i++){
  const s=wall.segments[i];
  if(s.repairFlash>0){
   s.repairFlash-=0.1;
   ctx.fillStyle='rgba(255,255,255,'+s.repairFlash*0.5+')';
   ctx.fillRect(s.x,topY,s.width,wall.height);
  }
 }
}

requestAnimationFrame(loop);
</script>
