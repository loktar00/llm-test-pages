<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dripping Paint Art</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
  }
  window.addEventListener('resize', resize);
  resize();

  const W = () => canvas.width;
  const H = () => canvas.height;

  // Grid for thickness map (downsampled)
  const GRID = 4; // cells per pixel factor
  let gw, gh;
  let thicknessMap;
  let colorMap;

  function initMaps() {
    gw = Math.ceil(W() / GRID);
    gh = Math.ceil(H() / GRID);
    thicknessMap = new Float32Array(gw * gh);
    colorMap = new Array(gw * gh).fill(null).map(() => ({ r: 0, g: 0, b: 0 }));
  }

  initMaps();

  const COLORS = [
    [220, 20, 60],
    [20, 140, 220],
    [240, 200, 20],
    [30, 180, 70],
    [138, 40, 220],
    [255, 105, 180],
  ];

  const particles = [];
  let coverage = 0;
  const COVERAGE_THRESHOLD = 0.65;

  function spawnDrop() {
    const x = Math.random() * W();
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    particles.push({
      x: x,
      y: -5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: 0.2 + Math.random() * 0.6,
      w: 0.8 + Math.random() * 1.4,
      color: color,
      life: 1,
      dead: false
    });
  }

  function gridGet(x, y, map) {
    const gx = Math.floor(x / GRID);
    const gy = Math.floor(y / GRID);
    if (gx < 0 || gy < 0 || gx >= gw || gy >= gh) return null;
    return map[gy * gw + gx];
  }

  function gridAdd(x, y, amount, color) {
    const gx = Math.floor(x / GRID);
    const gy = Math.floor(y / GRID);
    if (gx < 0 || gy < 0 || gx >= gw || gy >= gh) return;
    const idx = gy * gw + gx;
    thicknessMap[idx] += amount;

    if (thicknessMap[idx] > 0.001) {
      if (colorMap[idx].r === 0 && colorMap[idx].g === 0 && colorMap[idx].b === 0) {
        colorMap[idx].r = color[0];
        colorMap[idx].g = color[1];
        colorMap[idx].b = color[2];
      } else {
        const t = 0.5;
        colorMap[idx].r = Math.round(colorMap[idx].r * (1 - t) + color[0] * t);
        colorMap[idx].g = Math.round(colorMap[idx].g * (1 - t) + color[1] * t);
        colorMap[idx].b = Math.round(colorMap[idx].b * (1 - t) + color[2] * t);
      }
    }
  }

  function updateParticles() {
    for (let p of particles) {
      if (p.dead) continue;

      const th = gridGet(p.x, p.y, thicknessMap) || 0;
      const speed = 0.3 + p.vy * (0.4 + Math.min(th * 1.2, 2));
      const gravity = 0.06 + th * 0.02;

      p.vy += gravity;
      p.vx += (Math.random() - 0.5) * 0.03;

      const nx = p.x + p.vx;
      const ny = p.y + p.vy * speed * 0.2;

      p.x = nx;
      p.y = ny;

      // Deposit paint
      gridAdd(p.x, p.y, p.w * 0.0004, p.color);
      gridAdd(p.x - p.vx, p.y - p.vy, p.w * 0.0002, p.color);

      // Branching
      if (Math.random() < 0.004 * (1 + th) && p.y > 10) {
        const child = {
          x: p.x,
          y: p.y,
          vx: (Math.random() - 0.5) * 0.4,
          vy: 0.1,
          w: p.w * 0.7,
          color: p.color,
          life: 1,
          dead: false
        };
        particles.push(child);
      }

      // Die if off-screen or too small or too slow at bottom
      if (p.y > H() + 20 || p.w < 0.05 || (p.y > H() - 5 && Math.abs(p.vy) < 0.05)) {
        p.dead = true;
      }
    }

    // Occasionally spawn new drops
    if (Math.random() < 0.3) spawnDrop();
  }

  function dryPaint() {
    for (let i = 0; i < thicknessMap.length; i++) {
      if (thicknessMap[i] > 0.001) {
        thicknessMap[i] *= 0.993; // slow evaporation
        // darken color over time
        if (colorMap[i]) {
          const factor = Math.max(0.4, Math.min(1.0, 1.3 - thicknessMap[i] * 20));
          colorMap[i].r = Math.round(colorMap[i].r * factor);
          colorMap[i].g = Math.round(colorMap[i].g * factor);
          colorMap[i].b = Math.round(colorMap[i].b * factor);
        }
      }
    }
  }

  function render() {
    const img = ctx.createImageData(W(), H());
    const data = img.data;

    let totalThickness = 0;

    for (let gy = 0; gy < gh; gy++) {
      for (let gx = 0; gx < gw; gx++) {
        const idx = gy * gw + gx;
        const px = gx * GRID;
        const py = gy * GRID;
        const th = thicknessMap[idx];

        if (th > 0.0005) {
          const c = colorMap[idx];
          const val = Math.min(255, th * 60);
          const r = Math.min(255, (c.r / 255) * val);
          const g = Math.min(255, (c.g / 255) * val);
          const b = Math.min(255, (c.b / 255) * val);

          totalThickness += th;

          const size = Math.ceil(GRID);
          for (let dy = 0; dy < size; dy++) {
            for (let dx = 0; dx < size; dx++) {
              const xx = px + dx;
              const yy = py + dy;
              if (xx >= W() || yy >= H()) continue;
              const di = (yy * W() + xx) * 4;
              data[di] = r;
              data[di + 1] = g;
              data[di + 2] = b;
              data[di + 3] = 255;
            }
          }
        }
      }
    }

    totalThickness /= (gw * gh);
    coverage = Math.min(1.0, totalThickness * (1.0 / 0.05));

    ctx.putImageData(img, 0, 0);
  }

  function reset() {
    thicknessMap.fill(0);
    for (let c of colorMap) {
      c.r = 0; c.g = 0; c.b = 0;
    }
    particles.length = 0;
    coverage = 0;
  }

  let whiteout = 0;

  function loop() {
    requestAnimationFrame(loop);

    if (whiteout > 0) {
      whiteout -= 0.004;
      ctx.fillStyle = `rgba(255,255,255,${whiteout})`;
      ctx.fillRect(0, 0, W(), H());
    }

    updateParticles();
    dryPaint();

    if (coverage > COVERAGE_THRESHOLD && whiteout === 0) {
      whiteout = 1;
    }

    render();

    if (whiteout <= 0 && coverage === 0 && particles.length === 0) {
      // Restart
      reset();
    }
  }

  // Start
  for (let i = 0; i < 15; i++) spawnDrop();
  loop();
})();
</script>
</body>
</html>
