<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit | Parallax Experience</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sky-top: #1e293b;
            --sky-bottom: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Mountain Colors */
            --layer-1: #1e293b; /* Back */
            --layer-2: #334155; /* Mid */
            --layer-3: #475569; /* Front */
            --layer-4: #0f172a; /* Foreground */
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Layout Structure */
        main {
            width: 100%;
            position: relative;
        }

        /* Scene 1: The Viewport (Pinned Section) */
        .viewport {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Starfield */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.6;
        }

        /* Parallax Layers Container */
        .parallax-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120%; /* Wider than screen to allow horizontal movement */
            height: 100%;
            will-change: transform;
        }

        .mountain {
            position: absolute;
            bottom: -5%;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 80vh 80vh; /* Triangle height 80vh */
            border-color: transparent transparent var(--color) transparent;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(0px);
        }
        
        /* Layer Specifics */
        /* Layer 1: Distant Moon/Sun and far mountains */
        .layer-1 { z-index: 1; }
        .layer-1 .celestial {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #fcd34d, #d97706);
            box-shadow: 0 0 60px rgba(252, 211, 77, 0.3);
        }
        .layer-1 .mountain {
            border-bottom-width: 60vh;
            border-left-width: 70vw;
            border-right-width: 70vw;
            opacity: 0.6;
            filter: blur(2px);
        }

        /* Layer 2: Mid mountains */
        .layer-2 { z-index: 2; }
        .layer-2 .mountain {
            border-bottom-width: 55vh;
            border-left-width: 60vw;
            border-right-width: 60vw;
        }

        /* Layer 3: Foreground mountains */
        .layer-3 { z-index: 3; }
        .layer-3 .mountain {
            border-bottom-width: 40vh;
            border-left-width: 50vw;
            border-right-width: 50vw;
        }

        /* Layer 4: Immediate foreground silhouette */
        .layer-4 { z-index: 4; }
        .layer-4 .mountain {
            border-bottom-width: 25vh;
            border-left-width: 40vw;
            border-right-width: 40vw;
            bottom: -10%;
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 2rem;
            /* Fixed height allows it to scroll out naturally if pinning fails, 
               but sticky handles the visual pinning */
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 1.5rem;
            background: linear-gradient(to bottom, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.4s;
        }

        /* Scene 2: Content Break (Space to scroll) */
        .spacer {
            height: 50vh;
            background: var(--bg-color);
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spacer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Scene 3: CTA */
        .cta-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, var(--bg-color), #020617);
            position: relative;
            z-index: 20;
            padding: 4rem 2rem;
        }

        .cta-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.6s ease-out, opacity 0.6s ease-out;
        }

        .cta-section.visible .cta-card {
            transform: translateY(0);
            opacity: 1;
        }

        .cta-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .cta-desc {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #fff;
            color: #0f172a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* Animations */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scroll Down Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
            animation: bounce 2s infinite;
        }
        
        .mouse {
            width: 24px;
            height: 40px;
            border: 2px solid white;
            border-radius: 12px;
            position: relative;
        }
        
        .wheel {
            width: 4px;
            height: 8px;
            background: white;
            border-radius: 2px;
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            animation: scrollWheel 1.5s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
            60% {transform: translateX(-50%) translateY(-5px);}
        }

        @keyframes scrollWheel {
            0% { opacity: 1; top: 6px; }
            100% { opacity: 0; top: 20px; }
        }

    </style>
</head>
<body>

    <main>
        <!-- Scene 1: Hero with Parallax -->
        <section class="viewport" id="hero">
            <!-- Stars -->
            <div class="stars"></div>

            <!-- Parallax Layers -->
            <div class="parallax-container">
                <!-- Layer 1: Celestial + Far Mountains (Slowest) -->
                <div class="layer layer-1" data-speed="0.1">
                    <div class="celestial"></div>
                    <div class="mountain" style="border-color: transparent transparent #253146 transparent; left: 20%;"></div>
                    <div class="mountain" style="border-color: transparent transparent #253146 transparent; left: 70%; border-left-width: 80vw; border-right-width: 80vw; border-bottom-width: 50vh;"></div>
                </div>

                <!-- Layer 2: Mid Mountains -->
                <div class="layer layer-2" data-speed="0.3">
                    <div class="mountain" style="border-color: transparent transparent #364558 transparent; left: 10%;"></div>
                    <div class="mountain" style="border-color: transparent transparent #364558 transparent; left: 60%;"></div>
                </div>

                <!-- Layer 3: Foreground Mountains -->
                <div class="layer layer-3" data-speed="0.5">
                    <div class="mountain" style="border-color: transparent transparent #475569 transparent; left: 30%;"></div>
                    <div class="mountain" style="border-color: transparent transparent #475569 transparent; left: 80%;"></div>
                </div>

                <!-- Layer 4: Immediate Silhouette (Fastest) -->
                <div class="layer layer-4" data-speed="0.8">
                    <div class="mountain" style="border-color: transparent transparent #0f172a transparent; left: 0%; border-bottom-width: 35vh;"></div>
                    <div class="mountain" style="border-color: transparent transparent #0f172a transparent; left: 40%; border-bottom-width: 45vh;"></div>
                    <div class="mountain" style="border-color: transparent transparent #0f172a transparent; left: 90%; border-bottom-width: 30vh;"></div>
                </div>
            </div>

            <!-- Pinned Content -->
            <div class="hero-content">
                <h1>Ascend</h1>
                <p class="subtitle">Experience the serenity of the heights.<br>Depth is not chaos.</p>
            </div>

            <div class="scroll-indicator">
                <div class="mouse">
                    <div class="wheel"></div>
                </div>
            </div>
        </section>

        <!-- Spacer to allow the pin effect to be felt -->
        <div class="spacer">
            <p>Scroll to continue</p>
        </div>

        <!-- Scene 3: CTA -->
        <section class="cta-section" id="cta">
            <div class="cta-card">
                <h2 class="cta-title">Ready to climb?</h2>
                <p class="cta-desc">Join thousands of explorers discovering new horizons. The journey begins with a single step.</p>
                <a href="#" class="btn">Start Journey</a>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const layers = document.querySelectorAll('.layer');
            const heroContent = document.querySelector('.hero-content');
            const ctaSection = document.getElementById('cta');
            const hero = document.getElementById('hero');

            // Utility for rAF loop
            let ticking = false;

            function updateParallax() {
                // Get scroll position relative to the hero section
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                
                // 1. Parallax Mountains
                layers.forEach(layer => {
                    const speed = parseFloat(layer.getAttribute('data-speed'));
                    // Move layer vertically based on scroll speed
                    // We shift the Y position down as we scroll
                    const yPos = scrollY * speed;
                    
                    // We also want a slight horizontal drift for realism
                    const xPos = Math.sin(scrollY * 0.002) * 20; 

                    layer.style.transform = `translate(-50%, ${yPos}px) translateX(${xPos}px)`;
                });

                // 2. Sticky/Pin Effect
                // Calculate how far we've scrolled past the top of the hero
                // The hero is 100vh. We want the content to stay centered for a bit, then fade out.
                
                const contentHeight = heroContent.offsetHeight;
                // Fade out happens between 0vh and 20vh of scroll
                const fadeStart = 0;
                const fadeEnd = windowHeight * 0.4; // Start fading after 40% scroll
                
                let opacity = 1;
                let scale = 1;

                if (scrollY > fadeStart && scrollY < fadeEnd) {
                    const progress = (scrollY - fadeStart) / (fadeEnd - fadeStart);
                    opacity = 1 - progress;
                    scale = 1 - (progress * 0.1); // Slight zoom out
                } else if (scrollY >= fadeEnd) {
                    opacity = 0;
                    scale = 0.9;
                }

                // Apply styles directly to the pinned content
                // Note: We use CSS 'sticky' or 'fixed' logic manually here to ensure 
                // it releases cleanly without jump if we wanted complex pinning, 
                // but for this single file, fading opacity is the cleanest 'release'.
                
                if (scrollY < windowHeight) {
                    heroContent.style.opacity = opacity;
                    heroContent.style.transform = `scale(${scale})`;
                } else {
                    heroContent.style.opacity = 0;
                }

                ticking = false;
            }

            // Intersection Observer for CTA Animation
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.3 });

            if(ctaSection) {
                observer.observe(ctaSection);
            }

            // Scroll Event Listener
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        updateParallax();
                    });
                    ticking = true;
                }
            });

            // Initial call
            updateParallax();
        });
    </script>
</body>
</html>
