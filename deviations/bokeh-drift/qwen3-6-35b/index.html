<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bokeh Field</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COLORS = [
  { r: 255, g: 200, b: 100 },  // warm amber
  { r: 255, g: 170, b: 60 },   // golden
  { r: 255, g: 230, b: 180 },  // warm white
  { r: 255, g: 140, b: 50 },   // deep orange
  { r: 255, g: 220, b: 150 },  // pale gold
  { r: 200, g: 180, b: 255 },  // lavender accent
  { r: 100, g: 220, b: 255 },  // cyan accent
  { r: 255, g: 120, b: 200 },  // magenta accent
  { r: 150, g: 255, b: 200 },  // teal accent
  { r: 255, g: 255, b: 240 },  // near white
  { r: 255, g: 100, b: 80 },   // warm red accent
  { r: 180, g: 160, b: 255 },  // purple accent
];

const FOCUS_CYCLE_DURATION = 10;
const NUM_PARTICLES = 80;

class BokehParticle {
  constructor(layer) {
    this.layer = layer;
    this.depth = layer;
    this.reset(true);
  }

  reset(initial) {
    this.x = initial ? Math.random() * W * 1.5 - W * 0.25 : -Math.random() * 200 - 50;
    this.y = Math.random() * H;
    this.baseSize = this.layer === 1 ? 8 + Math.random() * 25 :
                    this.layer === 2 ? 4 + Math.random() * 12 :
                                       1.5 + Math.random() * 5;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.baseSpeed = this.layer === 1 ? (0.3 + Math.random() * 0.6) :
                     this.layer === 2 ? (0.12 + Math.random() * 0.25) :
                                        (0.04 + Math.random() * 0.12);
    this.speedY = (Math.random() - 0.5) * (this.layer === 1 ? 0.15 : this.layer === 2 ? 0.06 : 0.02);
    this.phase = Math.random() * Math.PI * 2;
    this.bobAmplitude = this.layer === 1 ? 15 + Math.random() * 25 :
                        this.layer === 2 ? 5 + Math.random() * 15 :
                                           2 + Math.random() * 8;
    this.bobSpeed = 0.3 + Math.random() * 0.5;
    this.alpha = this.layer === 1 ? 0.5 + Math.random() * 0.3 :
                 this.layer === 2 ? 0.3 + Math.random() * 0.3 :
                                    0.15 + Math.random() * 0.2;
    this.sides = 5 + Math.floor(Math.random() * 3);
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.005;
    this.glowSize = this.baseSize * (1.5 + Math.random() * 1.5);
  }

  update(time, focusProgress, focusLayer) {
    this.x += this.baseSpeed;
    this.y += this.speedY + Math.sin(time * this.bobSpeed + this.phase) * this.bobAmplitude * 0.01;
    this.rotation += this.rotSpeed;

    if (this.x > W + 200) this.reset(false);
    if (this.y < -100) this.y = H + 100;
    if (this.y > H + 100) this.y = -100;

    const dist = Math.abs(this.layer - focusLayer);
    const focusSharpness = dist === 0 ? focusProgress : Math.max(0, 1 - focusProgress * 2);
    this.currentSharpness = focusSharpness;
    this.currentSize = this.baseSize * (1 - focusSharpness * 0.2);
    this.currentAlpha = this.alpha * (0.3 + focusSharpness * 0.7);
    this.currentGlowSize = this.glowSize * (1 + focusSharpness * 0.3);
  }
}

const particles = [];
for (let i = 0; i < NUM_PARTICLES; i++) {
  const layer = Math.random() < 0.45 ? 1 : Math.random() < 0.7 ? 2 : 3;
  particles.push(new BokehParticle(layer));
}

// Background city lights
const cityLights = [];
for (let i = 0; i < 120; i++) {
  cityLights.push({
    x: Math.random() * W * 2 - W * 0.5,
    y: H * 0.4 + Math.random() * H * 0.6,
    size: 0.5 + Math.random() * 1.5,
    alpha: 0.1 + Math.random() * 0.3,
    color: COLORS[Math.floor(Math.random() * 6)],
    twinkleSpeed: 0.5 + Math.random() * 2,
    phase: Math.random() * Math.PI * 2,
  });
}

function drawHexagon(cx, cy, radius, sides, rotation) {
  ctx.beginPath();
  for (let i = 0; i <= sides; i++) {
    const angle = (i / sides) * Math.PI * 2 + rotation;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawSoftDisc(x, y, radius, alpha, color, glowRadius) {
  const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
  grad.addColorStop(0, `rgba(${color.r},${color.g},${color.b},${alpha})`);
  grad.addColorStop(0.3, `rgba(${color.r},${color.g},${color.b},${alpha * 0.6})`);
  grad.addColorStop(0.7, `rgba(${color.r},${color.g},${color.b},${alpha * 0.15})`);
  grad.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();

  if (glowRadius > radius) {
    const glow = ctx.createRadialGradient(x, y, radius * 0.5, x, y, glowRadius);
    glow.addColorStop(0, `rgba(${color.r},${color.g},${color.b},${alpha * 0.15})`);
    glow.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFocusedDisc(x, y, radius, alpha, color, glowRadius, sides, rotation) {
  // Outer glow
  const glow = ctx.createRadialGradient(x, y, radius * 0.3, x, y, glowRadius);
  glow.addColorStop(0, `rgba(${color.r},${color.g},${color.b},${alpha * 0.3})`);
  glow.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
  ctx.fill();

  // Polygon aperture shape
  drawHexagon(x, y, radius, sides, rotation);
  ctx.fillStyle = `rgba(${color.r},${color.g},${color.b},${alpha * 0.7})`;
  ctx.fill();

  // Brighter inner polygon
  drawHexagon(x, y, radius * 0.55, sides, rotation);
  ctx.fillStyle = `rgba(${Math.min(255, color.r + 40)},${Math.min(255, color.g + 40)},${Math.min(255, color.b + 40)},${alpha * 0.9})`;
  ctx.fill();

  // Core bright point
  const coreGrad = ctx.createRadialGradient(x, y, 0, x, y, radius * 0.35);
  coreGrad.addColorStop(0, `rgba(255,255,255,${alpha * 0.8})`);
  coreGrad.addColorStop(0.5, `rgba(${color.r},${color.g},${color.b},${alpha * 0.4})`);
  coreGrad.addColorStop(1, `rgba(${color.r},${color.g},${color.b},0)`);
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(x, y, radius * 0.35, 0, Math.PI * 2);
  ctx.fill();

  // Edge highlight
  drawHexagon(x, y, radius, sides, rotation);
  ctx.strokeStyle = `rgba(${Math.min(255, color.r + 80)},${Math.min(255, color.g + 80)},${Math.min(255, color.b + 80)},${alpha * 0.5})`;
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawBackground(time) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#050810');
  grad.addColorStop(0.3, '#0a0f1a');
  grad.addColorStop(0.6, '#0f1220');
  grad.addColorStop(1, '#080c14');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle city glow at horizon
  const horizonGlow = ctx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, W * 0.6);
  horizonGlow.addColorStop(0, 'rgba(40, 30, 20, 0.15)');
  horizonGlow.addColorStop(0.5, 'rgba(20, 15, 25, 0.08)');
  horizonGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = horizonGlow;
  ctx.fillRect(0, 0, W, H);

  // City lights
  for (const light of cityLights) {
    const twinkle = 0.5 + 0.5 * Math.sin(time * light.twinkleSpeed + light.phase);
    const a = light.alpha * twinkle;
    ctx.fillStyle = `rgba(${light.color.r},${light.color.g},${light.color.b},${a})`;
    ctx.beginPath();
    ctx.arc(light.x, light.y, light.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

let startTime = performance.now();

function animate(now) {
  const time = (now - startTime) / 1000;

  // Focus cycle: 0-3.33 depth 1, 3.33-6.66 depth 2, 6.66-10 depth 3
  const cycleTime = time % FOCUS_CYCLE_DURATION;
  const cyclePhase = cycleTime / FOCUS_CYCLE_DURATION;

  let focusLayer, focusProgress;
  if (cyclePhase < 0.333) {
    focusLayer = 1;
    focusProgress = cyclePhase / 0.333;
  } else if (cyclePhase < 0.666) {
    focusLayer = 2;
    focusProgress = (cyclePhase - 0.333) / 0.333;
  } else {
    focusLayer = 3;
    focusProgress = (cyclePhase - 0.666) / 0.334;
  }

  // Smooth easing
  focusProgress = focusProgress * focusProgress * (3 - 2 * focusProgress);

  drawBackground(time);

  // Sort by layer for proper depth ordering
  const sorted = [...particles].sort((a, b) => a.layer - b.layer);

  for (const p of sorted) {
    p.update(time, focusProgress, focusLayer);

    if (p.currentSharpness > 0.5) {
      const sharpness = (p.currentSharpness - 0.5) * 2;
      const softAlpha = p.currentAlpha * (1 - sharpness);
      const focusedAlpha = p.currentAlpha * sharpness;

      if (softAlpha > 0.01) {
        drawSoftDisc(p.x, p.y, p.currentSize * 1.3, softAlpha * 0.5, p.color, p.currentGlowSize * 1.2);
      }
      if (focusedAlpha > 0.01) {
        drawFocusedDisc(p.x, p.y, p.currentSize, focusedAlpha, p.color, p.currentGlowSize * 1.5, p.sides, p.rotation);
      }
    } else {
      const softness = 1 - p.currentSharpness * 2;
      const size = p.currentSize * (1 + softness * 0.5);
      const glow = p.currentGlowSize * (1 + softness);
      drawSoftDisc(p.x, p.y, size, p.currentAlpha, p.color, glow);
    }
  }

  // Subtle vignette
  const vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
