<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=device-width">
<title>Cozy Night Desk</title>
<style>
  :root {
    --bg: #0f111a;
    --desk: #2a2320;
    --wall: #12141c;
    --moon: #fffbe6;
    --steam: rgba(255, 255, 255, 0.25);
    --screen-glow: #4a90d9;
    --screen-bg: #1a2a3a;
    --cat: #222;
    --cat-light: #444;
    --lamp: #ffb347;
    --lamp-off: #444;
    --light: rgba(255, 179, 71, 0.15);
    --transition: 0.8s;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    font-family: sans-serif;
    overflow: hidden;
    transition: background var(--transition);
  }

  .scene {
    position: relative;
    width: 800px;
    height: 600px;
    background: var(--wall);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    overflow: hidden;
    transition: background var(--transition);
  }

  /* --- Window & Outside --- */
  .window-frame {
    position: absolute;
    top: 40px;
    right: 60px;
    width: 160px;
    height: 200px;
    background: #050510;
    border: 8px solid #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
  }
  .moon {
    position: absolute;
    top: 30px;
    left: 30px;
    width: 40px;
    height: 40px;
    background: var(--moon);
    border-radius: 50%;
    box-shadow: 0 0 15px #fffbe6;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.7;
  }
  .star:nth-child(2) { top: 20px; left: 80px; }
  .star:nth-child(3) { top: 50px; left: 120px; width: 3px; height: 3px; }
  .star:nth-child(4) { top: 80px; left: 40px; }
  .star:nth-child(5) { top: 100px; left: 100px; }
  .window-sill {
    position: absolute;
    top: 240px;
    right: 40px;
    width: 200px;
    height: 10px;
    background: #1a1a1a;
    border-radius: 2px;
  }

  /* --- Desk --- */
  .desk {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 180px;
    background: var(--desk);
    border-top: 4px solid #3a302a;
    transition: background var(--transition);
  }
  .desk-leg-left {
    position: absolute;
    bottom: -60px;
    left: 50px;
    width: 20px;
    height: 60px;
    background: #1e1a18;
  }
  .desk-leg-right {
    position: absolute;
    bottom: -60px;
    right: 50px;
    width: 20px;
    height: 60px;
    background: #1e1a18;
  }

  /* --- Laptop --- */
  .laptop {
    position: absolute;
    bottom: 140px;
    left: 150px;
    width: 280px;
    height: 180px;
  }
  .screen {
    position: absolute;
    top: 0;
    left: 10px;
    width: 260px;
    height: 170px;
    background: var(--screen-bg);
    border: 4px solid #111;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 20px var(--screen-glow);
    animation: glow 3s infinite alternate ease-in-out;
  }
  .screen-content {
    padding: 10px;
    color: #8ab4f8;
    font-size: 10px;
    font-family: monospace;
    line-height: 1.4;
    opacity: 0.8;
  }
  .keyboard {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 280px;
    height: 15px;
    background: #111;
    border-radius: 0 0 4px 4px;
    border-top: 2px solid #333;
  }
  .keyboard-lines {
    display: flex;
    justify-content: space-around;
    padding-top: 2px;
  }
  .key {
    width: 20px;
    height: 2px;
    background: #333;
    border-radius: 1px;
  }

  /* --- Mug & Steam --- */
  .mug {
    position: absolute;
    bottom: 145px;
    right: 200px;
    width: 50px;
    height: 60px;
    background: #e74c3c;
    border-radius: 0 0 8px 8px;
    box-shadow: inset -5px 0 10px rgba(0,0,0,0.2);
  }
  .mug-handle {
    position: absolute;
    top: 15px;
    right: -12px;
    width: 15px;
    height: 25px;
    border: 4px solid #e74c3c;
    border-left: none;
    border-radius: 0 10px 10px 0;
  }
  .mug-coffee {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 40px;
    height: 5px;
    background: #5a2828;
    border-radius: 2px;
  }
  .steam-container {
    position: absolute;
    top: -30px;
    left: 15px;
    width: 20px;
    height: 30px;
  }
  .wisp {
    position: absolute;
    bottom: 0;
    width: 6px;
    height: 6px;
    background: var(--steam);
    border-radius: 50%;
    animation: rise 3s infinite ease-in;
    opacity: 0;
  }
  .wisp:nth-child(1) { left: 0; animation-delay: 0s; }
  .wisp:nth-child(2) { left: 8px; animation-delay: 1s; }
  .wisp:nth-child(3) { left: 16px; animation-delay: 2s; }

  /* --- Cat --- */
  .cat-body {
    position: absolute;
    bottom: 140px;
    left: 520px;
    width: 100px;
    height: 60px;
    background: var(--cat);
    border-radius: 50px 50px 10px 10px;
    transition: background var(--transition);
  }
  .cat-head {
    position: absolute;
    top: -20px;
    left: -10px;
    width: 50px;
    height: 40px;
    background: var(--cat);
    border-radius: 50%;
    transition: background var(--transition);
  }
  .ear {
    position: absolute;
    top: -10px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 15px solid var(--cat);
    transition: border-bottom var(--transition);
  }
  .ear.left { left: 5px; }
  .ear.right { right: 5px; }
  .tail {
    position: absolute;
    bottom: 10px;
    right: -30px;
    width: 60px;
    height: 10px;
    background: var(--cat);
    border-radius: 10px;
    transform-origin: left center;
    animation: sway 3s infinite ease-in-out;
    transition: background var(--transition);
  }
  .cat-eye {
    position: absolute;
    top: 15px;
    width: 4px;
    height: 4px;
    background: #ffeb3b;
    border-radius: 50%;
    box-shadow: 0 0 5px #ffeb3b;
  }
  .cat-eye.left { left: 10px; }
  .cat-eye.right { right: 10px; }

  /* --- Lamp --- */
  .lamp-base {
    position: absolute;
    bottom: 170px;
    left: 680px;
    width: 40px;
    height: 10px;
    background: #555;
    border-radius: 4px;
  }
  .lamp-pole {
    position: absolute;
    bottom: 180px;
    left: 695px;
    width: 10px;
    height: 80px;
    background: #777;
  }
  .lamp-shade {
    position: absolute;
    bottom: 260px;
    left: 660px;
    width: 80px;
    height: 40px;
    background: #d4a06a;
    border-radius: 40px 40px 0 0;
    cursor: pointer;
    transition: background 0.3s;
    z-index: 10;
  }
  .lamp-shade:hover {
    background: #e8b87a;
  }
  .bulb {
    position: absolute;
    bottom: 240px;
    left: 695px;
    width: 10px;
    height: 20px;
    background: var(--lamp-off);
    border-radius: 5px;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .light-beam {
    position: absolute;
    bottom: 200px;
    left: 650px;
    width: 160px;
    height: 300px;
    background: var(--light);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
    z-index: 5;
  }

  /* --- Book --- */
  .book {
    position: absolute;
    bottom: 175px;
    left: 400px;
    width: 60px;
    height: 10px;
    background: #8e44ad;
    border-radius: 2px;
  }
  .book-spine {
    position: absolute;
    bottom: 175px;
    left: 395px;
    width: 5px;
    height: 10px;
    background: #6c3483;
  }

  /* --- Animations --- */
  @keyframes sway {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    50% { opacity: 0.6; }
    100% { transform: translateY(-40px) scale(2); opacity: 0; }
  }
  @keyframes glow {
    0% { box-shadow: 0 0 10px var(--screen-glow); opacity: 0.8; }
    100% { box-shadow: 0 0 30px var(--screen-glow); opacity: 1; }
  }

  /* --- Interaction Classes --- */
  body.warm .scene { background: #1a1814; }
  body.warm .desk { background: #3a302a; }
  body.warm .cat-body, body.warm .cat-head, body.warm .ear, body.warm .tail { background: #555; }
  body.warm .bulb { background: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
  body.warm .light-beam { opacity: 0.6; background: rgba(255, 200, 50, 0.2); }
</style>
</head>
<body>

<div class="scene">
  <!-- Window -->
  <div class="window-frame">
    <div class="moon"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>
  <div class="window-sill"></div>

  <!-- Desk -->
  <div class="desk">
    <div class="desk-leg-left"></div>
    <div class="desk-leg-right"></div>
  </div>

  <!-- Laptop -->
  <div class="laptop">
    <div class="screen">
      <div class="screen-content">
        &gt; cozy_mode(true)<br>
        &gt; load_music("lofi")<br>
        &gt; brew_coffee()<br>
        &gt; purr()
      </div>
    </div>
    <div class="keyboard">
      <div class="keyboard-lines">
        <div class="key"></div><div class="key"></div><div class="key"></div>
        <div class="key"></div><div class="key"></div><div class="key"></div>
        <div class="key"></div><div class="key"></div><div class="key"></div>
      </div>
    </div>
  </div>

  <!-- Mug -->
  <div class="mug">
    <div class="mug-coffee"></div>
    <div class="mug-handle"></div>
    <div class="steam-container">
      <div class="wisp"></div>
      <div class="wisp"></div>
      <div class="wisp"></div>
    </div>
  </div>

  <!-- Cat -->
  <div class="cat-body">
    <div class="cat-head">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="cat-eye left"></div>
      <div class="cat-eye right"></div>
    </div>
    <div class="tail"></div>
  </div>

  <!-- Lamp -->
  <div class="lamp-base"></div>
  <div class="lamp-pole"></div>
  <div class="lamp-shade" id="lampToggle"></div>
  <div class="bulb" id="bulb"></div>
  <div class="light-beam"></div>

  <!-- Book -->
  <div class="book"></div>
  <div class="book-spine"></div>
</div>

<script>
  const body = document.body;
  const lamp = document.getElementById('lampToggle');
  lamp.addEventListener('click', () => {
    body.classList.toggle('warm');
  });
</script>

</body>
</html>
