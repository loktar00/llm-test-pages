<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Data Table</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f6fb;
      color: #2d3748;
      padding: 2rem;
    }

    .table-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      max-width: 1200px;
      margin: 0 auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: linear(90deg, #7b46ff, #2563eb);
      color: white;
      text-align: left;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    th {
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th:first-child {
      width: 40px;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover .arrow {
      opacity: 0.7;
    }

    .arrow {
      display: inline-block;
      margin-left: 6px;
      font-size: 0.7rem;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .arrow.up {
      transform: rotate(-90deg);
    }

    .arrow.down {
      transform: rotate(90deg);
    }

    .arrow.inactive {
      opacity: 0.3;
    }

    tbody tr {
      border-bottom: 1px solid #e2e8f0;
      transition: background 0.2s ease, transform 0.25s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f0f7ff;
    }

    td {
      padding: 0.9rem 1rem;
      vertical-align: middle;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .status {
      display: inline-block;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status.active {
      background: #dcfce7;
      color: #166534;
    }

    .status.inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.pending {
      background: #fef9c3;
      color: #854d0e;
    }

    .status.suspended {
      background: #e0e7ff;
      color: #3730a3;
    }

    .footer {
      padding: 1rem 1.5rem;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .pagination-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pagination-pills button {
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      border: none;
      background: #e2e8f0;
      color: #2d3748;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pagination-pills button:hover {
      background: #cbd5e1;
    }

    .pagination-pills button.active {
      background: #7b46ff;
      color: white;
    }

    .rows-info {
      font-size: 0.85rem;
      color: #64748b;
    }

    /* Hide less important columns on small screens */
    @media (max-width: 768px) {
      th:nth-child(5),
      td:nth-child(5) {
        display: none;
      }
    }

    @media (max-width: 600px) {
      th:nth-child(4),
      td:nth-child(4) {
        display: none;
      }
    }

    @media (max-width: 480px) {
      th:nth-child(3),
      td:nth-child(3) {
        display: none;
      }
    }

    .checkbox-cell {
      display: flex;
      justify-content: center;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="table-container">
    <table id="userTable">
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll"/></th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Joined</th>
          <th>Status</th>
          <th class="sortable" data-key="name">Name <span class="arrow inactive">▲</span></th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Rows populated dynamically -->
      </tbody>
      <tfoot>
        <tr>
          <td colspan="7">
            <div class="footer">
              <span class="rows-info">1-10 of 25 users</span>
              <div class="pagination-pills">
                <button>&laquo;</button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button>&raquo;</button>
              </div>
            </div>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    const users = [
      { id: 1, name: "Alice Johnson", email: "alice@example.com", role: "Admin", joined: "2021-03-15", status: "active" },
      { id: 2, name: "Bob Smith", email: "bob@example.com", role: "Editor", joined: "2020-11-22", status: "inactive" },
      { id: 3, name: "Charlie Brown", email: "charlie@example.com", role: "User", joined: "2022-01-05", status: "pending" },
      { id: 4, name: "Diana Prince", email: "diana@example.com", role: "Moderator", joined: "2019-07-30", status: "suspended" },
      { id: 5, name: "Ethan Hunt", email: "ethan@example.com", role: "Editor", joined: "2021-09-12", status: "active" },
      { id: 6, name: "Fiona Gallagher", email: "fiona@example.com", role: "User", joined: "2023-02-18", status: "active" },
      { id: 7, name: "George Costanza", email: "george@example.com", role: "User", joined: "2020-04-01", status: "inactive" },
      { id: 8, name: "Hannah Abbott", email: "hannah@example.com", role: "Admin", joined: "2022-06-25", status: "active" },
      { id: 9, name: "Ivan Drago", email: "ivan@example.com", role: "Editor", joined: "2018-12-10", status: "suspended" },
      { id: 10, name: "Julia Roberts", email: "julia@example.com", role: "User", joined: "2023-05-03", status: "pending" },
      { id: 11, name: "Kevin Hart", email: "kevin@example.com", role: "User", joined: "2021-08-19", status: "active" },
      { id: 12, name: "Lara Croft", email: "lara@example.com", role: "Moderator", joined: "2019-10-08", status: "active" },
      { id: 13, name: "Michael Scott", email: "michael@example.com", role: "Editor", joined: "2020-02-29", status: "inactive" },
      { id: 14, name: "Nina Simone", email: "nina@example.com", role: "Admin", joined: "2022-03-31", status: "active" }
    ];

    const tbody = document.getElementById("tableBody");
    const selectAllCheckbox = document.getElementById("selectAll");

    function getAvatarInitials(name) {
      return name.split(" ").map(n => n[0]).join("").slice(0, 2);
    }

    function getColorFromName(name) {
      const colors = ["#EF4444", "#F59E0B", "#2563EB", "#059669", "#7B3FE8", "#DB2777"];
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash += name.charCodeAt(i);
      }
      return colors[hash % colors.length];
    }

    function renderTable(data) {
      tbody.innerHTML = "";
      data.forEach(user => {
        const tr = document.createElement("tr");
        const initials = getAvatarInitials(user.name);
        const bgColor = getColorFromName(user.name);
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.addEventListener("change", updateSelectAllState);

        tr.innerHTML = `
          <td class="checkbox-cell"></td>
          <td><div class="avatar" style="background:${bgColor}">${initials}</div> ${user.name}</td>
          <td>${user.email}</td>
          <td>${user.role}</td>
          <td>${user.joined}</td>
          <td><span class="status ${user.status}">${user.status}</span></td>
        `;
        tr.querySelector("td:first-child").appendChild(checkbox);
        tbody.appendChild(tr);
      });
    }

    function updateSelectAllState() {
      const checkboxes = tbody.querySelectorAll("input[type='checkbox']");
      const checked = Array.from(checkboxes).filter(c => c.checked);
      selectAllCheckbox.indeterminate = checked.length > 0 && checked.length < checkboxes.length;
      selectAllCheckbox.checked = checked.length === checkboxes.length;
    }

    selectAllCheckbox.addEventListener("change", () => {
      const checkboxes = tbody.querySelectorAll("input[type='checkbox']");
      checkboxes.forEach(cb => cb.checked = selectAllCheckbox.checked);
    });

    let sortDirection = { asc: true };

    document.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        const sortedUsers = [...users].sort((a, b) => {
          const valA = a[key].toLowerCase();
          const valB = b[key].toLowerCase();
          return sortDirection.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });

        // FLIP animation
        const allTr = tbody.querySelectorAll("tr");
        const positionsBefore = [];
        allTr.forEach(tr => {
          positionsBefore.push(tr.getBoundingClientRect().top);
        });

        renderTable(sortedUsers);

        requestAnimationFrame(() => {
          const allTrAfter = tbody.querySelectorAll("tr");
          allTrAfter.forEach((tr, i) => {
            const pos = tr.getBoundingClientRect().top;
            tr.style.transition = "transform 0s";
            tr.style.transform = `translateY(${positionsBefore[i] - pos}px)`;
          });
          requestAnimationFrame(() => {
            allTrAfter.forEach(tr => {
              tr.style.transition = "transform 0.3s ease";
              tr.style.transform = "translateY(0)";
            });
          });
        });

        sortDirection.asc = !sortDirection.asc;

        // Update arrow
        document.querySelectorAll(".arrow").forEach(a => a.classList.add("inactive"));
        const arrow = th.querySelector(".arrow");
        arrow.classList.remove("inactive");
        arrow.classList.toggle("up", sortDirection.asc);
        arrow.classList.toggle("down", !sortDirection.asc);
      });
    });

    // Initial render
    renderTable(users);
  </script>
</body>
</html>
