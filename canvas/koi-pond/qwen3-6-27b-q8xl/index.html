<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koi Pond</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a2a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Utility ---
const PI = Math.PI, TAU = PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);

// --- Color Palettes ---
const KOI_COLORS = [
  { body: '#fff5ee', blotch: '#e63946' },   // Kohaku
  { body: '#fff5ee', blotch: '#1a1a1a' },    // Showa-ish
  { body: '#fff5ee', blotch: '#f4a261' },    // Sanke-ish
  { body: '#ffd700', blotch: '#e63946' },    // Ogon
  { body: '#fff8dc', blotch: '#2d3436' },    // Bekko
  { body: '#fff5ee', blotch: '#e63946', secondary: '#1a1a1a' }, // Asagi-ish
  { body: '#fff5ee', blotch: '#f4a261', secondary: '#1a1a1a' }, // Taisho
];

// --- Ripple System ---
class Ripple {
  constructor(x, y, maxR = 80) {
    this.x = x; this.y = y;
    this.r = 2; this.maxR = maxR;
    this.alpha = 0.6; this.speed = rand(0.5, 1.2);
  }
  update() {
    this.r += this.speed;
    this.alpha = 0.6 * (1 - this.r / this.maxR);
    return this.r < this.maxR;
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, TAU);
    ctx.strokeStyle = `rgba(200, 230, 255, ${this.alpha})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Secondary ring
    if (this.r > 10) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 0.6, 0, TAU);
      ctx.strokeStyle = `rgba(200, 230, 255, ${this.alpha * 0.4})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

const ripples = [];

// --- Caustics ---
class CausticPoint {
  constructor() { this.reset(); }
  reset() {
    this.x = rand(0, W); this.y = rand(0, H);
    this.vx = rand(-0.15, 0.15); this.vy = rand(-0.15, 0.15);
    this.size = rand(20, 60); this.alpha = rand(0.02, 0.06);
    this.phase = rand(0, TAU);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.phase += 0.02;
    if (this.x < -100 || this.x > W + 100 || this.y < -100 || this.y > H + 100) this.reset();
  }
  draw(ctx) {
    const a = this.alpha * (0.7 + 0.3 * Math.sin(this.phase));
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    g.addColorStop(0, `rgba(180, 220, 255, ${a})`);
    g.addColorStop(1, `rgba(180, 220, 255, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
  }
}

const caustics = Array.from({ length: 40 }, () => new CausticPoint());

// --- Lily Pad ---
class LilyPad {
  constructor() {
    this.x = rand(50, W - 50); this.y = rand(50, H - 50);
    this.size = rand(25, 55);
    this.rotation = rand(0, TAU);
    this.wobblePhase = rand(0, TAU);
    this.wobbleSpeed = rand(0.003, 0.008);
    this.notchAngle = rand(0, TAU);
    this.notchDepth = rand(0.2, 0.4);
    this.shadowSize = this.size * 1.3;
  }
  draw(ctx, time) {
    const wobble = Math.sin(time * this.wobbleSpeed + this.wobblePhase) * 0.03;
    const r = this.rotation + wobble;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(r);
    // Shadow
    ctx.beginPath();
    ctx.ellipse(3, 4, this.shadowSize, this.shadowSize * 0.85, 0, 0, TAU);
    ctx.fillStyle = 'rgba(0, 20, 10, 0.2)';
    ctx.fill();
    // Pad
    ctx.beginPath();
    const startA = this.notchAngle;
    const endA = this.notchAngle + TAU * this.notchDepth;
    ctx.arc(0, 0, this.size, startA, endA);
    ctx.ellipse(0, 0, this.size * 0.85, this.size * 0.8, 0, endA, startA);
    ctx.closePath();
    const grd = ctx.createRadialGradient(-this.size * 0.3, -this.size * 0.3, 0, 0, 0, this.size);
    grd.addColorStop(0, '#5a8a4a');
    grd.addColorStop(0.5, '#3d6b35');
    grd.addColorStop(1, '#2d5a25');
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = '#2a4a20';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Veins
    ctx.strokeStyle = 'rgba(40, 80, 30, 0.3)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * this.size * 0.8, Math.sin(a) * this.size * 0.8);
      ctx.stroke();
    }
    ctx.restore();
  }
}

const lilyPads = Array.from({ length: rand(6, 12) | 0 }, () => new LilyPad());

// --- Koi Fish ---
class Koi {
  constructor() {
    this.x = rand(100, W - 100);
    this.y = rand(100, H - 100);
    this.angle = rand(0, TAU);
    this.targetAngle = this.angle;
    this.speed = rand(0.6, 1.4);
    this.targetSpeed = this.speed;
    this.size = rand(28, 48);
    this.tailPhase = rand(0, TAU);
    this.tailSpeed = rand(0.08, 0.14);
    this.colorSet = KOI_COLORS[(Math.random() * KOI_COLORS.length) | 0];
    this.blotches = this.generateBlotches();
    this.wanderTimer = 0;
    this.wanderInterval = rand(100, 300);
    this.bodySegments = 12;
    this.nibbleTimer = 0;
    this.nibbleCooldown = rand(200, 600);
    this.isNibbling = false;
    this.gillPhase = rand(0, TAU);
  }

  generateBlotches() {
    const blotches = [];
    const count = rand(3, 7) | 0;
    for (let i = 0; i < count; i++) {
      blotches.push({
        cx: rand(-0.3, 0.5),
        cy: rand(-0.35, 0.35),
        rx: rand(0.08, 0.22),
        ry: rand(0.1, 0.25),
        angle: rand(0, TAU),
      });
    }
    return blotches;
  }

  update(time) {
    // Wander behavior
    this.wanderTimer++;
    if (this.wanderTimer > this.wanderInterval) {
      this.wanderTimer = 0;
      this.wanderInterval = rand(100, 300);
      this.targetAngle += rand(-1.2, 1.2);
      this.targetSpeed = rand(0.4, 1.6);
      // Occasional nibble
      if (Math.random() < 0.15) {
        this.isNibbling = true;
        this.nibbleTimer = 0;
        this.targetSpeed = 0.1;
      }
    }

    if (this.isNibbling) {
      this.nibbleTimer++;
      this.targetAngle += Math.sin(this.nibbleTimer * 0.1) * 0.05;
      if (this.nibbleTimer > this.nibbleCooldown * 0.3) {
        this.isNibbling = false;
        this.targetSpeed = rand(0.6, 1.4);
      }
    }

    // Smooth angle interpolation
    let da = this.targetAngle - this.angle;
    while (da > PI) da -= TAU;
    while (da < -PI) da += TAU;
    this.angle += da * 0.025;

    this.speed = lerp(this.speed, this.targetSpeed, 0.03);

    // Boundary avoidance
    const margin = 80;
    if (this.x < margin) this.targetAngle = 0;
    if (this.x > W - margin) this.targetAngle = PI;
    if (this.y < margin) this.targetAngle = PI / 2;
    if (this.y > H - margin) this.targetAngle = -PI / 2;

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;

    this.tailPhase += this.tailSpeed * (0.5 + this.speed);
    this.gillPhase += 0.05;
  }

  drawBody(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    const s = this.size;
    const tailWag = Math.sin(this.tailPhase) * 0.25;

    // Shadow
    ctx.save();
    ctx.translate(4, 5);
    ctx.globalAlpha = 0.15;
    this.drawSilhouette(ctx, s, 0);
    ctx.restore();

    // Body
    this.drawSilhouette(ctx, s, tailWag);
    ctx.fillStyle = this.colorSet.body;
    ctx.fill();

    // Blotches
    for (const b of this.blotches) {
      ctx.save();
      ctx.translate(b.cx * s, b.cy * s);
      ctx.rotate(b.angle);
      ctx.beginPath();
      ctx.ellipse(0, 0, b.rx * s, b.ry * s, 0, 0, TAU);
      ctx.fillStyle = this.colorSet.blotch;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Secondary color blotches (if any)
    if (this.colorSet.secondary) {
      for (let i = 0; i < 2; i++) {
        ctx.save();
        ctx.translate(rand(-0.1, 0.3) * s, rand(-0.3, 0.3) * s);
        ctx.beginPath();
        ctx.ellipse(0, 0, 0.06 * s, 0.08 * s, rand(0, TAU), 0, TAU);
        ctx.fillStyle = this.colorSet.secondary;
        ctx.globalAlpha = 0.7;
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    // Outline
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    this.drawSilhouette(ctx, s, tailWag);
    ctx.stroke();

    // Gill slit
    ctx.beginPath();
    ctx.moveTo(0.05 * s, -0.12 * s);
    ctx.quadraticCurveTo(0.1 * s, 0, 0.05 * s, 0.12 * s);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Gill movement
    const gillOpen = Math.sin(this.gillPhase) * 0.02 * s;
    ctx.beginPath();
    ctx.moveTo(0.08 * s, -0.1 * s + gillOpen);
    ctx.lineTo(0.08 * s, 0.1 * s - gillOpen);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Eye
    ctx.beginPath();
    ctx.arc(0.38 * s, -0.08 * s, 0.04 * s, 0, TAU);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.38 * s + 0.01 * s, -0.09 * s, 0.015 * s, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // Mouth (slightly open when nibbling)
    const mouthOpen = this.isNibbling ? Math.sin(this.nibbleTimer * 0.3) * 0.03 * s : 0;
    ctx.beginPath();
    ctx.ellipse(0.48 * s, 0, 0.03 * s, 0.015 * s + mouthOpen, 0, 0, TAU);
    ctx.fillStyle = '#c0392b';
    ctx.fill();

    // Fins
    // Pectoral fins
    ctx.save();
    ctx.translate(0.15 * s, -0.22 * s);
    ctx.rotate(-0.3 + Math.sin(this.tailPhase * 1.3) * 0.15);
    ctx.beginPath();
    ctx.ellipse(0, -0.08 * s, 0.06 * s, 0.12 * s, -0.3, 0, TAU);
    ctx.fillStyle = this.colorSet.body;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(0.15 * s, 0.22 * s);
    ctx.rotate(0.3 - Math.sin(this.tailPhase * 1.3) * 0.15);
    ctx.beginPath();
    ctx.ellipse(0, 0.08 * s, 0.06 * s, 0.12 * s, 0.3, 0, TAU);
    ctx.fillStyle = this.colorSet.body;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;

    // Dorsal fin
    ctx.save();
    ctx.translate(0.05 * s, -0.35 * s);
    ctx.rotate(-0.1 + Math.sin(this.tailPhase * 0.8) * 0.05);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(0.1 * s, -0.15 * s, 0.2 * s, 0);
    ctx.quadraticCurveTo(0.1 * s, -0.05 * s, 0, 0);
    ctx.fillStyle = this.colorSet.body;
    ctx.globalAlpha = 0.6;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  drawSilhouette(ctx, s, tailWag) {
    ctx.beginPath();
    // Head
    ctx.moveTo(0.5 * s, 0);
    // Top side
    ctx.bezierCurveTo(0.45 * s, -0.22 * s, 0.2 * s, -0.35 * s, -0.15 * s, -0.32 * s);
    // Tail top
    ctx.bezierCurveTo(-0.35 * s, -0.28 * s, -0.5 * s, -0.15 * s + tailWag * s, -0.65 * s, tailWag * 0.5 * s);
    // Tail bottom
    ctx.bezierCurveTo(-0.5 * s, 0.15 * s + tailWag * s, -0.35 * s, 0.28 * s, -0.15 * s, 0.32 * s);
    // Bottom side
    ctx.bezierCurveTo(0.2 * s, 0.35 * s, 0.45 * s, 0.22 * s, 0.5 * s, 0);
    ctx.closePath();
  }
}

const koi = Array.from({ length: rand(6, 9) | 0 }, () => new Koi());

// --- Dragonfly ---
class Dragonfly {
  constructor() {
    this.reset();
    this.state = 'flying'; // flying, landing, landed, takingoff
    this.timer = 0;
    this.stateDuration = 0;
  }
  reset() {
    this.x = rand(-50, W + 50);
    this.y = rand(-50, H + 50);
    this.vx = rand(-2, 2);
    this.vy = rand(-2, 2);
    this.angle = Math.atan2(this.vy, this.vx);
    this.wingPhase = rand(0, TAU);
    this.wingSpeed = 0.3;
    this.size = rand(6, 10);
    this.targetX = rand(100, W - 100);
    this.targetY = rand(100, H - 100);
    this.landedDuration = rand(120, 400);
    this.landedTimer = 0;
  }
  update() {
    this.wingPhase += this.wingSpeed;
    this.timer++;

    if (this.state === 'flying') {
      const a = angle(this.x, this.y, this.targetX, this.targetY);
      let da = a - this.angle;
      while (da > PI) da -= TAU;
      while (da < -PI) da += TAU;
      this.angle += da * 0.05;
      this.vx = Math.cos(this.angle) * rand(1, 2.5);
      this.vy = Math.sin(this.angle) * rand(1, 2.5);
      this.x += this.vx;
      this.y += this.vy;
      if (dist(this.x, this.y, this.targetX, this.targetY) < 20) {
        this.state = 'landing';
        this.timer = 0;
      }
    } else if (this.state === 'landing') {
      this.vx *= 0.95;
      this.vy *= 0.95;
      this.x += this.vx;
      this.y += this.vy;
      if (this.timer > 30) {
        this.state = 'landed';
        this.timer = 0;
        this.landedTimer = 0;
        // Create small ripple
        ripples.push(new Ripple(this.x, this.y, 30));
      }
    } else if (this.state === 'landed') {
      this.landedTimer++;
      this.x += Math.sin(this.landedTimer * 0.02) * 0.1;
      this.y += Math.cos(this.landedTimer * 0.03) * 0.1;
      if (this.landedTimer > this.landedDuration) {
        this.state = 'takingoff';
        this.timer = 0;
      }
    } else if (this.state === 'takingoff') {
      this.vx *= 1.05;
      this.vy *= 1.05;
      const a = rand(0, TAU);
      this.vx += Math.cos(a) * 0.1;
      this.vy += Math.sin(a) * 0.1;
      this.angle = Math.atan2(this.vy, this.vx);
      this.x += this.vx;
      this.y += this.vy;
      if (this.timer > 40 || this.x < -100 || this.x > W + 100 || this.y < -100 || this.y > H + 100) {
        this.reset();
      }
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    const wingFlap = Math.sin(this.wingPhase) * (this.state === 'landed' ? 0.1 : 0.6);
    const s = this.size;

    // Wings
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#aaddff';
    // Upper wings
    ctx.save();
    ctx.rotate(wingFlap);
    ctx.beginPath();
    ctx.ellipse(-0.2 * s, -0.5 * s, 0.6 * s, 0.15 * s, -0.3, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.rotate(-wingFlap);
    ctx.beginPath();
    ctx.ellipse(-0.2 * s, 0.5 * s, 0.6 * s, 0.15 * s, 0.3, 0, TAU);
    ctx.fill();
    ctx.restore();
    // Lower wings
    ctx.save();
    ctx.rotate(wingFlap * 0.8);
    ctx.beginPath();
    ctx.ellipse(0.1 * s, -0.4 * s, 0.5 * s, 0.12 * s, -0.2, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.rotate(-wingFlap * 0.8);
    ctx.beginPath();
    ctx.ellipse(0.1 * s, 0.4 * s, 0.5 * s, 0.12 * s, 0.2, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    // Body
    ctx.fillStyle = '#2d6a4f';
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.8 * s, 0.08 * s, 0, 0, TAU);
    ctx.fill();

    // Head
    ctx.beginPath();
    ctx.arc(0.8 * s, 0, 0.12 * s, 0, TAU);
    ctx.fillStyle = '#1b4332';
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.arc(0.85 * s, -0.08 * s, 0.05 * s, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.85 * s, 0.08 * s, 0.05 * s, 0, TAU);
    ctx.fill();

    ctx.restore();
  }
}

const dragonflies = Array.from({ length: 3 }, () => {
  const d = new Dragonfly();
  d.state = 'flying';
  return d;
});

// --- Water Surface Base ---
function drawWaterBase(time) {
  // Gradient background
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d2137');
  g.addColorStop(0.5, '#0f2b45');
  g.addColorStop(1, '#0a1e30');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// --- Mouse/Touch Interaction ---
let mouseX = -1000, mouseY = -1000;
let mouseDown = false;
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('touchmove', e => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; e.preventDefault(); }, { passive: false });
canvas.addEventListener('mousedown', () => { mouseDown = true; });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('touchstart', () => { mouseDown = true; });
canvas.addEventListener('touchend', () => { mouseDown = false; });

// --- Main Loop ---
let time = 0;
function loop() {
  time++;
  ctx.clearRect(0, 0, W, H);

  // Water base
  drawWaterBase(time);

  // Caustics
  for (const c of caustics) {
    c.update();
    c.draw(ctx);
  }

  // Mouse ripple
  if (mouseDown && mouseX > 0) {
    if (time % 5 === 0) {
      ripples.push(new Ripple(mouseX + rand(-5, 5), mouseY + rand(-5, 5), 60));
    }
  }

  // Occasional random ripples
  if (Math.random() < 0.01) {
    ripples.push(new Ripple(rand(50, W - 50), rand(50, H - 50), rand(40, 100)));
  }

  // Update and draw ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    if (!ripples[i].update()) {
      ripples.splice(i, 1);
    } else {
      ripples[i].draw(ctx);
    }
  }

  // Sort entities by Y for depth
  const entities = [];
  for (const lp of lilyPads) entities.push({ type: 'pad', obj: lp, y: lp.y });
  for (const k of koi) entities.push({ type: 'koi', obj: k, y: k.y });
  for (const d of dragonflies) entities.push({ type: 'dfly', obj: d, y: d.y });
  entities.sort((a, b) => a.y - b.y);

  // Update
  for (const k of koi) k.update(time);
  for (const d of dragonflies) d.update();

  // Draw
  for (const e of entities) {
    if (e.type === 'pad') e.obj.draw(ctx, time);
    else if (e.type === 'koi') e.obj.drawBody(ctx);
    else if (e.type === 'dfly') e.obj.draw(ctx);
  }

  // Subtle vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
