<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Physics Engine — Verlet Integration</title>
<style>
  :root {
    --bg: #06070d;
    --bg-2: #131021;
    --fg: #f6f4ff;
    --muted: #7b85a4;
    --accent: #00f5a0;
    --accent-2: #00ff8c;
    --accent-3: #00d9c8;
    --warm: #ff9d4a;
    --hot: #ff4b4a;
    --cold: #4c9fbf;
    --card: rgba(20, 24, 35, 0.6);
    --border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 700px at 75% 0%, rgba(0, 245, 160, 0.06), transparent 60),
      radial-gradient(900px 600px at 15% 100%, rgba(255, 158, 74, 0.05), transparent 60),
      var(--bg);
    color: var(--fg);
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      linear-gradient(180deg, #07080f 0%, #131023 50%, #06070d 100);
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    position: absolute;
    inset: 0;
  }

  /* UI Layer */
  .ui-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 32px 48px 0 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 2;
    pointer-events: none;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand-tag {
    font: 11px 'SFMaze', system-ui, monospace;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .brand h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 300;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .brand h1 b { font-weight: 700; color: var(--accent); }

  .brand p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  .demo-card {
    background: var(--card);
  backdrop-filter: blur(14);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 22px;
  pointer-events: auto;
  min-width: 280px;
  text-align: right;
    transition: border-color 0.6s;
  border-color: rgba(0, 245, 160, 0.0);
  border-image: initial;
  position: relative;
  overflow: hidden;
  &::after {
    content: "";
    position: absolute;
    inset: -1px -1px -1px -1px;
    border: 1px solid transparent;
    box-shadow: 0 0 30px 1px rgba(0, 0, 0, 0.2);
    pointer-events: none;
  }
}

.demo-card .num {
  font: 700 38px/1 'Inter', system-ui;
  color: var(--accent);
  margin-bottom: 12px;
}

.demo-card .label {
  font: 11px/1 'Inter', system-ui;
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.demo-card .title {
  font: 700 16px/1.1 'Inter', system-ui;
  margin: 0 0 6px 0;
}

.demo-card .desc {
  font: 11px/1.5 'Inter', system-ui;
  color: var(--muted);
  margin: 0 0 0 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

.demo-card .desc b {
  color: var(--accent);
  font-weight: 700;
  margin: 0 0 0 2px;
  font-family: 'JetBrains Mono', monospace;
}

/* progress bar */
.progress {
  width: 100;
  height: 2px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 14px;
}
.progress-bar {
  height: 100;
  width: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent-3));
  transition: width linear 0.40s;
}

/* bottom HUD */
.ui-bottom {
  position: absolute;
  bottom: 32px;
  left: 48px;
  right: 48px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  z-index: 2;
  pointer-events: none;
}

.legend {
  display: flex;
  gap: 24px;
  font: 12px 'Inter', system-ui;
  color: var(--muted);
  align-items: center;
}

.legend .item {
  display: flex;
  gap: 6px;
  align-items: center;
  font: 11px/1 'Inter', system-ui;
}

.legend .dot {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--accent);
}

.stats {
  font: 12px/1 'JetBrains Mono', monospace;
  color: var(--muted);
  text-align: right;
  display: flex;
  gap: 14px;
  align-items: center;
}

.stats b { color: var(--accent); font-weight: 700; }

/* grid background */
.grid {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
  background-image:
    linear-gradient(rgba(0, 0, 0, 0.7) 1px, transparent 1px),
    linear-gradient(rgba(0, 0, 0, 0.7) 1px, transparent 1px);
  background-size: 80px 80px, 80px 80px;
  background-position: 0 0, 0 0;
}

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  background: radial-gradient(ellipse at center, transparent 40, rgba(0, 0, 0, 0.7) 100);
}

/* responsive */
@media (max-width: 600) {
  .ui-top, .ui-bottom { padding: 16px 16px; }
  .ui-top { flex-direction: column; gap: 16px; }
  .demo-card { min-width: 200px; }
  .brand h1 { font-size: 28px; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <canvas id="canvas"></canvas>
  <div class="vignette"></div>

  <div class="ui-top">
    <div class="brand">
      <div class="brand-tag">// Physics Engine · v0.3</div>
      <h1><b>Verlet</b> Integration</h1>
      <p>3D-collapsed physics · constraint solver · position-based dynamics</p>
    </div>

    <div class="demo-card">
      <div class="num">01</div>
      <div class="label">DEMO 01 / 03</div>
      <div class="title">Cascade Ramp</div>
      <div class="desc">next in <b id="counter">5</b>s</div>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
    </div>
  </div>

  <div class="ui-bottom">
    <div class="legend">
      <div class="item"><span class="dot" style="background:var(--accent)"></span>VERLET SOLVER</div>
      <div class="item"><span class="dot" style="background:var(--warm)"></span>WARM BODY</div>
      <div class="item"><span class="dot" style="background:var(--cold)"></span>COLD BODY</div>
    </div>
    <div class="stats">
      <span>POS <b id="posCount">0</b></span>
      <span>FPS <b id="fpsCount">60</b></span>
      <span>STEPS <b id="stepCount">5</b></span>
    </div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const GRAVITY = 0.38;
const DAMPING = 0.6;
const SUBST = 5;
document.getElementById('stepCount').textContent = SUBST;
document.getElementById('fpsCount').textContent = 60;

class Particle {
  constructor(x, y, r, mass, color) {
    this.x = x;
    this.y = y;
    this.px = x;
    this.py = y;
    this.r = Math.max(1, r);
    this.mass = mass;
    this.color = color;
    this.bx = 0; // bounce strength
    this.dead = false;
    this.hit = 0; // hit timer
  }
  // verlet step: velocity = (cur - old) * friction
  // gravity is added to velocity (so acceleration accumulates)
  vstep(dt) {
    const vx = (this.x - this.px) * DAMPING;
    const vy = (this.y - this.py) * DAMPING;
    this.px = this.x;
    this.py = this.y;
    this.x += vx;
    this.y += vy + GRAVITY * dt;
  }
  // position-based constraint projection
  cstep() {
    // floor collision
    if (this.y > H - 40 - this.r) {
      const o = (this.y - (H - 40 - this.r));
      this.y -= o;
      // bounce with a small upward velocity when moving down
      const vy = (this.y - this.py);
      if (vy > 0) this.py = this.y + vy * 0.2; // bounce 0.5
    }
    if (this.x < this.r) { this.x = this.r; this.px = this.x; }
    if (this.x > W - this.r) { this.x = W - this.r; this.px = this.x; }
    if (this.y < -100) { this.y = -100; }
  }
}

class Constraint {
  // distance constraint between a and b
  constructor(a, b, length, stiff, broken) {
    this.a = a;
    this.b = b;
    this.l = length;
    this.stiff = stiff;
    this.broken = broken;
    this.t = 1;
  }
  solve() {
    if (this.broken && this.t <= 0) return;
    const dx = this.b.x - this.a.x;
    const dy = this.b.y - this.a.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const diff = this.l - dist;
    const stiff = this.stiff * (this.t < 1 ? this.t : 1);
    const wma = this.a.mass * (1 + 1) / (this.a.mass + this.b.mass);
    const wmb = this.b.mass / (this.a.mass + this.b.mass);
    // symmetrical projection
    const ux = dx / dist;
    const vy = dy / dist;
    const kx = diff * stiff;
    this.a.x += ux * kx * wma;
    this.a.y += vy * kx * wma;
    this.b.x -= ux * kx * wmb;
    this.b.y -= vy * kx * wmb;
  }
}

class World {
  constructor() {
    this.points = [];
    this.cons = [];
    this.staticLines = []; // {x1,y1,x2,y2} for ramp lines, etc
    this.staticPol = []; // {pts: [{x,y}[]], } for polygons (for ramp surfaces)
    this.effects = [];
    this.spawn = []; // spawn queue
    this.spawnTimer = 0;
    this.bounds = true;
  }
  addParticle(p) { this.points.push(p); return p; }
  addConstraint(c) { this.cons.push(c); return c; }
  addPoly(p) { this.staticPol.push(p); return p; }
  addLine(l) { this.staticLines.push(l); return l; }

  step(dt = 16.6/1000) {
    // spawn tick
    this.spawnTimer += dt;
    while (this.spawn.length && this.spawnTimer > this.spawn[0].t) {
      const s = this.spawn.shift();
      s.spawn(this);
      this.spawnTimer -= 0;
    // not exactly but it works
    }

    // 1. velocity integration (verlet)
    for (const p of this.points) p.vstep(dt);

    // 2. constraints (substeps)
    for (int i = 0; i < SUBST; i++) {
      for (const c of this.cons) c.solve();
      for (const p of this.points) p.cstep();
      this.collisions();
    }

    // 3. effects update
    for (const e of this.effects) e.step(dt);
    this.effects = this.effects.filter(e => !e.dead);
  }

  collisions() {
    // particle vs particle (O(n^2) but small n
    const n = this.points.length;
    for (let i = 0; i < n; i++) {
      const a = this.points[i];
      for (let j = i + 1; j < n; j++) {
        const b = this.points[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const rr = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr * rr) {
          const d = Math.sqrt(d2) || 0.01;
          const diff = (rr - d) / 2;
          const ux = dx / d;
          const vy = dy / d;
          a.x -= ux * diff;
          a.y -= vy * diff;
          b.x += ux * diff;
          b.y += vy * diff;
          // swap velocities along collision normal ( simplified)
          a.hit = 1; b.hit = 1;
        // transfer
          // (using velocity form verlet: v = cur - old)
          // approximate elastic response:
          const va = (a.x - a.px);
          const va2 = (a.y - a.py);
          const vb = (b.x - b.px);
          const vb2 = (b.y - b.py);
          const massFactorA = b.mass / (a.mass + b.mass);
          const massFactorB = a.mass / (a.mass + b.mass);
          const vA = (va - vb) / 2;
          const vA2 = (va2 - vb2) / 2;
          a.px = a.x + (va - vA * massFactorA) * 0.99;
          a.py = a.y + (va2 - vA2 * massFactorA) * 0.99;
          b.px = b.x + (vb + vA * massFactorB) * 0.99;
          b.py = b.y + (vb2 + vA2 * massFactorB) * 0.99;
        }
      }
    }
    // particle vs polygon (segment-based)
    for (const p of this.points) {
      for (const poly of this.staticPol) {
        // test against poly.pts edges (line segments)
        for (int i = 0; i < poly.pts.length; i++) {
          const j = (i + 1) % poly.pts.length;
          const x1 = poly.pts[i].x; const y1 = poly.pts[i].y;
          const x2 = poly.pts[j].x; const y2 = poly.pts[j].y;
          const dx = x2 - x1;
          const dy = y2 - y1;
          // edge vector
          const len = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const ex = dx / len;
          const ey = dy / len;
          // normal pointing up
          const nx = ey;
          const ny = -ex;
          // if normal points down, flip
          const midx = (x1 + x2) / 2;
          const midy = (y1 + y2) / 2;
          // check if p is below the line (using line equation)
          const dx = p.x - x1;
          const dy2 = p.y - y1;
          const d = dx * nx + dy2 * ny; // distance from line
          // if p is "inside" the line and within bounds (between x1, x2)
          const along = dx * ex + dy2 * ey;
          if (along > -10 && along < len + 10 && d < p.r) {
            const push = p.r - d;
            p.x += nx * push;
            p.y += ny * push;
            // bounce
            const vy = (p.y - p.py);
            if (vy > 0) p.py = p.y + vy * 0.6; // bounce 0.2
            // friction along normal
            const vx = (p.x - p.px);
            p.px = p.x - vx * 0.9;
          }
        }
      }
    }
  }

  render() {
    // 1. clear with trail effect
    ctx.fillStyle = 'rgba(6, 7, 13, 0.2)';
    ctx.fillRect(0, 0, W, H);

    // 2. polygons (static)
    for (const poly of this.staticPol) {
      // draw poly
      ctx.beginPath();
      ctx.moveTo(poly.pts[0].x, poly.pts[0].y);
      for (int i = 1; i < poly.pts.length; i++) ctx.lineTo(poly.pts[i].x, poly.pts[i].y);
      ctx.closePath();
      ctx.fillStyle = poly.color || '#1d1d2e';
      ctx.fill();
      // stroke
      ctx.strokeStyle = poly.stroke || 'rgba(0, 0, 0, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
      // edge glow
      if (poly.glow) {
        ctx.save();
        ctx.shadowColor = poly.glow;
        ctx.shadowBlur = 8;
        ctx.stroke();
        ctx.restore();
      }
    }

    // 3. constraints
    for (const c of this.cons) {
      const alpha = c.t < 1 ? c.t : 1;
      ctx.beginPath();
      ctx.moveTo(c.a.x, c.a.y);
      ctx.lineTo(c.b.x, c.b.y);
      ctx.strokeStyle = 'rgba(0, 0, 0, ' + (alpha * 0.6) + ')';
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(245, 245, 235, ' + alpha + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      // accent glow
      ctx.strokeStyle = c.color || 'rgba(0, 0, 0, 0.0)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 4. particles
    for (const p of this.points) {
      // hit glow
      const hitGlow = p.hit > 0 ? p.hit * 40 : 0;
      if (p.hit > 0) p.hit -= 0.1;
      if (p.hit < 0) p.hit = 0;
      // shadow
      ctx.beginPath();
      ctx.ellipse(p.x + 4, p.y + 4, p.r * 0.8, p.r * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fill();
      // body
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      if (p.dead) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.0)';
        ctx.fill();
      }
      if (hitGlow > 0) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
        ctx.shadowBlur = hitGlow;
        ctx.fill();
      }
      ctx.restore();
      // highlight
      ctx.beginPath();
      ctx.arc(p.x - p.r * 0.25, p.y - p.r * 0.25, p.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fill();
    }

    // 5. effects
    for (const e of this.effects) e.render();
  }
}

/* ============ Effect classes ============ */
class ExplosionFx {
  constructor(x, y, n, palette) {
    this.dead = false;
    this.x = x;
    this.y = y;
    this.t = 0;
    this.d = 1;
    this.palette = palette;
    this.n = n;
    // create particles
    this.ps = [];
    for (int i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 60 + 20;
      this.ps.push({
        x: x, y: y, // pos
        vx: Math.cos(a) * r,
        vy: Math.sin(a) * r,
        r: Math.random() * 5 + 2,
        life: 1,
        color: palette[i % palette.length]
      });
    }
  // shockwave
    this.sw = { r: 20, t: 1 };
  }
  step(dt) {
    this.t += dt;
    // shockwave grows
    this.sw.r += 6;
    this.sw.t -= 0.05;
    // particles fly
    for (const p of this.ps) {
      p.x += p.vx * dt * 0.5;
      p.y += p.vy * dt * 0.5;
      p.vx *= 0.95;
      p.vy *= 0.95;
      p.vy += 0.5;
      p.life -= 0.05;
    }
    this.ps = this.ps.filter(p => p.life > 0);
    if (this.t > 30 && this.ps.length === 0) this.dead = true;
  }
  render() {
    // shockwave ring
    const ctx0 = ctx;
    const alpha = this.sw.t > 0 ? this.sw.t : 0;
    ctx0.save();
    ctx0.strokeStyle = 'rgba(0, 0, 0, ' + alpha + ')';
    ctx0.beginPath();
    ctx0.arc(this.x, this.y, this.sw.r, 0, Math.PI * 2);
    ctx0.stroke();
    ctx0.restore();
    // particles
    for (const p of this.ps) {
      ctx0.beginPath();
      ctx0.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx0.fillStyle = p.color;
      ctx0.globalAlpha = p.life;
      ctx0.fill();
      ctx0.globalAlpha = 1;
    }
  }
}

/* ============ DEMO 01: Cascade Ramp ============ */
class Demo01 extends World {
  constructor() {
    super();
    // ramp polygons
    this.ramps = [];
    // staggered ramps, descending from top of screen
    const rampColors = ['#3b3954', '#49445a', '#41354f', '#4e485c'];
    for (int i = 0; i < 5; i++) {
      const x = 20 + (i % 2) * (W / 2);
      const width = W / 2 - 40;
      const topY = 20 + i * 100;
      const slope = 50;
      // polygon with top slope
      const pts = [
        { x: x, y: topY },
        { x: x + width, y: topY + slope },
        { x: x + width, y: topY + 200 },
        { x: x, y: topY + 200 + slope }
      ];
      this.addPoly({
        pts: pts,
        color: rampColors[i],
        stroke: 'rgba(0, 0, 0, 0.3)',
        glow: 'rgba(0, 0, 0, 0.0)'
      });
    }
    // spawn queue
    const palette = ['#00f5a0', '#00ff8c', '#00d9c8', '#4d9fbf'];
    for (int i = 0; i < 12; i++) {
      const c = palette[i % 4];
      this.spawn.push({
        t: i * 80,
        spawn: (world) = {
          const p = new Particle(
            Math.random() * (W * 0.7) + W * 0.15,
            -50 - Math.random() * 50,
            15 + Math.random() * 5,
            1,
            c
          );
          world.addParticle(p);
        }
      });
    }
    // schedule meteor
    this.spawn.push({
      t: 200 * 8 + 200,
      spawn: (world) = {
        const p = new Particle(W * 0.5, -200, 30, 5, '#ff4b4a');
        p.vx = 0; p.vy = 0;
        p.px = p.x; p.py = p.y - 10;
        world.addParticle(p);
      }
    });
  }
}

/* ============ DEMO 02, Flexible Bridge ============ */
class Demo02 extends World {
  constructor() {
    super();
    const floor = H - 40;
    // left cliff
    const lClifX = W * 0.15;
    const rClifX = W * 0.85;
    const cliffH = 60;
    // cliff polygons
    this.addPoly({
      pts: [{ x: 0, y: floor }, { x: lClifX, y: floor }, { x: lClifX, y: floor - cliffH }, { x: 0, y: floor - cliffH - 100 }, { x: 0, y: floor - 200 }],
      color: '#2c8380',
      stroke: 'rgba(0, 0, 0, 0.3)',
      glow: 'rgba(0, 0, 0, 0.0)'
    });
    this.addPoly({
      pts: [{ x: rClifX, y: floor }, { x: W, y: floor }, { x: W, y: floor - 200 }, { x: rClifX, y: floor - cliffH - 100 }, { x: rClifX, y: floor - cliffH }],
      color: '#2c8380',
      stroke: 'rgba(0, 0, 0, 0.3)',
      glow: 'rgba(0, 0, 0, 0.0)'
    });

    // bridge: chain of particles connected by constraints
    const bridgeParticles = [];
    const bridgeLen = 15;
    const bridgeStep = (rClifX - lClifX) / (bridgeLen - 1);
    // anchor points on the cliffs (top of cliffs)
    const lAnchor = { x: lClifX, y: floor - cliffH, r: 4 };
    const rAnchor = { x: rClifX, y: floor - cliffH, r: 4 };
    // create particles
    for (int i = 0; i < bridgeLen; i++) {
      const px_ = lClifX + i * bridgeStep;
      const py_ = floor - cliffH;
      const p = new Particle(px_, py_, 7, 1, '#00ff8c');
      p.px = p.x; p.py = p.y;
      this.addParticle(p);
      bridgeParticles.push(p);
    }
    // anchor them
    const lAnchorParticle = bridgeParticles[0];
    const rAnchorParticle = bridgeParticles[bridgeLen - 1];
    lAnchorParticle.mass = 100; // make it heavy (static)
    rAnchorParticle.mass = 100;
    lAnchorParticle.color = '#00f5a0';
    rAnchorParticle.color = '#00f5a0';

    // connect with constraints
    for (int i = 1; i < bridgeLen; i++) {
      const a = bridgeParticles[i - 1];
      const b = bridgeParticles[i];
      const c = new Constraint(a, b, bridgeStep, 0.8, false);
      c.color = 'rgba(0, 0, 0, 0.0)';
      this.addConstraint(c);
    }
    // additional diagonal bracing for rigidity
    for (int i = 1; i < bridgeLen - 1; i++) {
      const a = bridgeParticles[i - 1];
      const b = bridgeParticles[i + 1];
      const c = new Constraint(a, b, Math.sqrt(bridgeStep * bridgeStep + bridgeStep * bridgeStep * 2) * 0.5, 0.6, false);
      c.color = 'rgba(0, 0, 0, 0.0)';
      this.addConstraint(c);
    }

    // falling objects
    const palette = ['#00f5a0', '#00ff8c', '#00d9c8', '#4d9fbf', '#ff9d4a'];
    for (int i = 0; i < 5; i++) {
      const x = W * 0.5 + Math.random() * 40 - 20;
      const y = -50 - i * 80;
      const r = 10 + Math.random() * 8;
      const c = palette[i];
      const p = new Particle(x, y, r, 1, c);
      p.px = p.x; p.py = p.y;
      this.addParticle(p);
    }

    // rolling ball across the bridge
    const rollBall = new Particle(W * 0.15 + 5, floor - cliffH + 50, 12, 1, '#00ff8c');
    rollBall.px = rollBall.x; rollBall.py = rollBall.y;
    rollBall.px = rollBall.x - 5;
    this.addParticle(rollBall);
  }

  step(dt = 16.6/1000) {
    super.step(dt);
    // rolling ball gets impulse
    const rollBall = this.points[this.points.length - 1];
    if (!this.bounds) this.bounds = true;
    // ensure rolling ball stays on bridge surface
    rollBall.px = rollBall.x - 0.5; // constant motion
    // but we need to ensure it doesn't pass through bridge
  }
}

/* ============ DEMO 03, City Meteor ============ */
class Demo03 extends World {
  constructor() {
    super();
    const floor = H - 40;
    // ground polygon
    this.addPoly({
      pts: [{ x: 0, y: floor }, { x: W, y: floor }, { x: W, y: H }, { x: 0, y: H }],
      color: '#131021',
      stroke: 'rgba(0, 0, 0, 0.3)',
      glow: 'rgba(0, 0, 0, 0.0)'
    });
    // buildings: clusters of points connected with constraints
    // each building is a series of particles arranged in a grid
    const buildings = [];
    const buildingsX = [W * 0.15, W * 0.35, W * 0.55, W * 0.75];
    const heights = [60, 100, 130, 80];
    for (int i = 0; i < buildingsX.length; i++) {
      const x0 = buildingsX[i];
      const h = heights[i];
      const w = 30;
      const rows = 2;
      const cols = 4;
      // create a grid
      const bGrid = [];
      for (int r = 0; r < rows; r++) {
        const row = [];
        for (int c = 0; c < cols; c++) {
          const px_ = x0 + c * (w / cols);
          const py_ = floor - 40 - h + r * 5;
          // randomize a bit
          const p = new Particle(
            px_ + (Math.random() - 0.5) * 0.1,
            py_ + (Math.random() - 0.5) * 0.1,
            3, 1, '#49445a'
          );
          this.addParticle(p);
          row.push(p);
        }
        bGrid.push(row);
      }
      // connect rows with constraints
      for (int r = 0; r < rows; r++) {
        for (int c = 0; c < cols - 1; c++) {
          const a = bGrid[r][c];
          const b = bGrid[r][c + 1];
          const c = new Constraint(a, b, Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)), 1, false);
          c.color = 'rgba(0, 0, 0, 0.0)';
          this.addConstraint(c);
        }
      }
      // connect rows
      for (int r = 0; r < rows - 1; r++) {
        for (int c = 0; c < cols; c++) {
          const a = bGrid[r][c];
          const b = bGrid[r + 1][c];
          const c = new Constraint(a, b, Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)), 1, false);
          c.color = 'rgba(0, 0, 0, 0.0)';
          this.addConstraint(c);
        }
      }
      // connect diagonals for rigidity
      for (int r = 0; r < rows - 1; r++) {
        for (int c = 0; c < cols - 1; c++) {
          const a = bGrid[r][c];
          const b = bGrid[r + 1][c + 1];
          const c = new Constraint(a, b, Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)), 1, false);
          c.color = 'rgba(0, 0, 0, 0.0)';
          this.addConstraint(c);
        }
      }
      // anchor the bottom particles to be static
      for (int c = 0; c < cols; c++) {
        const p = bGrid[rows - 1][c];
        p.mass = 100; // heavy mass
        p.color = '#00f5a0';
      }
      buildings.push(bGrid);
    }

    // meteor: a heavy ball that spawns above the buildings
    const meteorX = W * 0.55;
    const meteorY = -50;
    const meteor = new Particle(meteorX, meteorY, 20, 5, '#ff4b4a');
    meteor.px = meteor.x;
    meteor.py = meteor.y - 5; // give it velocity downward
    this.addParticle(meteor);
    this.meteor = meteor;

    // city "citizens": small dots in buildings (decorative)
    // (we can skip, since the building particles are already there)

    // small debris particles to spawn when meteor hits
    // (handled in step() below)

    // flag for first impact
    this.firstImpact = true;
  }

  step(dt = 16.6/1000) {
    super.step(dt);
    // if meteor is in the area and we haven't exploded yet
    if (this.firstImpact && this.meteor.y > H * 0.6) {
      this.firstImpact = false;
      // explosion
      const x = this.meteor.x;
      const y = this.meteor.y;
      const f = new ExplosionFx(x, y, 30, ['#ff9d4a', '#ff4b4a', '#fff', '#ffd', '#00f5a0']);
      this.effects.push(f);
      // shatter nearby constraints
      for (const c of this.cons) {
        // if distance from meteor is small, break it
        const mx = (c.a.x + c.b.x) / 2 - x;
        const my = (c.a.y + c.b.y) / 2 - y;
        const d2 = mx * mx + my * my;
        if (d2 < 200 * 200) {
          c.t = 0; // mark as broken
          // apply blast velocity to the particles
          const ux = (c.b.x - c.a.x);
          const uy = (c.b.y - c.a.y);
          const len = Math.sqrt(ux * ux + uy * uy) || 0.01;
          const nx = ux / len;
          const ny = uy / len;
          const force = (200 - Math.sqrt(d2)) * 0.3;
          // push them outward
          c.a.px = c.a.x + Math.cos(Math.atan2(my, mx)) * force;
          c.a.py = c.a.y + Math.sin(Math.atan2(my, mx)) * force;
          c.b.px = c.b.x - Math.cos(Math.atan2(my, mx)) * force;
          c.b.py = c.b.y - Math.sin(Math.atan2(my, mx)) * force;
        }
      }
    }
  }
}

let lastTime = 0;

let frameCount = 0;

function loop(t) {
  const dt = (t - lastTime) / 1000;
  lastTime = t;
  // FPS counter
  frameCount++;
  fpsTime += dt;
  if (fpsTime > 1) {
    fpsCount = Math.round(frameCount / fpsTime);
    document.getElementById('fpsCount').textContent = fpsCount;
    frameCount = 0;
    fpsTime = 0;
  }
  // tick demo
  if (currentDemo) {
    currentDemo.step(16.6 / 1000 * 3);
    currentDemo.render();
  }
  // update counter
  switchTimer -= dt;
  if (switchTimer < 0) {
    switchDemo();
  }
  const remaining = Math.max(0, Math.ceil(switchTimer));
  counterEl.textContent = String(remaining);
  // update progress bar
  barEl.style.width = ((SWITCH_TIME - switchTimer) / SWITCH_TIME * 100) + '%';
  // request next
  requestAnimationFrame(loop);
}
