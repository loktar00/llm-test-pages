<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Boids Murmuration</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        const boidCount = 500;
        const boids = [];
        const PREDATOR_RADIUS = 250;
        const PREDATOR_SPEED = 3.0;
        const PREDATOR_AGITATION = 3.0;
        const FLOCK_FORCE = 0.05;
        const ALIGN_FORCE = 0.04;
        const SEPARATION_FORCE = 0.08;
        const MAX_SPEED = 4.0;
        const MIN_SPEED = 1.5;
        const PERCEPTION_RADIUS = 50;
        const SEPARATION_RADIUS = 25;
        
        let predator = {
            x: -1000,
            y: -1000,
            vx: 0,
            vy: 0,
            active: false,
            timer: 0
        };
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        class Boid {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.7;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = 1.5 + Math.random();
            }
            
            update() {
                let sepX = 0, sepY = 0;
                let aliX = 0, aliY = 0;
                let cohX = 0, cohY = 0;
                let sepCount = 0, aliCount = 0, cohCount = 0;
                
                for (let i = 0; i < boids.length; i++) {
                    const other = boids[i];
                    if (other === this) continue;
                    
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const distSq = dx * dx + dy * dy;
                    
                    if (distSq < PERCEPTION_RADIUS * PERCEPTION_RADIUS) {
                        const dist = Math.sqrt(distSq);
                        
                        if (dist < SEPARATION_RADIUS) {
                            sepX -= dx / dist;
                            sepY -= dy / dist;
                            sepCount++;
                        }
                        
                        aliX += other.vx;
                        aliY += other.vy;
                        aliCount++;
                        
                        cohX += other.x;
                        cohY += other.y;
                        cohCount++;
                    }
                }
                
                if (sepCount > 0) {
                    this.vx += sepX * SEPARATION_FORCE;
                    this.vy += sepY * SEPARATION_FORCE;
                }
                
                if (aliCount > 0) {
                    this.vx += (aliX / aliCount - this.vx) * ALIGN_FORCE;
                    this.vy += (aliY / aliCount - this.vy) * ALIGN_FORCE;
                }
                
                if (cohCount > 0) {
                    this.vx += ((cohX / cohCount) - this.x) * FLOCK_FORCE;
                    this.vy += ((cohY / cohCount) - this.y) * FLOCK_FORCE;
                }
                
                if (predator.active) {
                    const dx = this.x - predator.x;
                    const dy = this.y - predator.y;
                    const distSq = dx * dx + dy * dy;
                    
                    if (distSq < PREDATOR_RADIUS * PREDATOR_RADIUS) {
                        const dist = Math.sqrt(distSq);
                        const force = (1 - dist / PREDATOR_RADIUS) * PREDATOR_AGITATION;
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }
                
                let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > MAX_SPEED) {
                    this.vx = (this.vx / speed) * MAX_SPEED;
                    this.vy = (this.vy / speed) * MAX_SPEED;
                } else if (speed < MIN_SPEED) {
                    this.vx = (this.vx / speed) * MIN_SPEED;
                    this.vy = (this.vy / speed) * MIN_SPEED;
                }
                
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            
            draw() {
                const darkness = 0.7 + Math.random() * 0.3;
                ctx.fillStyle = `rgba(10, 10, 15, ${darkness})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        for (let i = 0; i < boidCount; i++) {
            boids.push(new Boid());
        }
        
        function updatePredator() {
            if (!predator.active) {
                predator.timer--;
                if (predator.timer <= 0) {
                    predator.active = true;
                    const side = Math.floor(Math.random() * 4);
                    if (side === 0) {
                        predator.x = -PREDATOR_RADIUS;
                        predator.y = Math.random() * height;
                        predator.vx = PREDATOR_SPEED;
                    } else if (side === 1) {
                        predator.x = width + PREDATOR_RADIUS;
                        predator.y = Math.random() * height;
                        predator.vx = -PREDATOR_SPEED;
                    } else if (side === 2) {
                        predator.x = Math.random() * width;
                        predator.y = -PREDATOR_RADIUS;
                        predator.vy = PREDATOR_SPEED;
                    } else {
                        predator.x = Math.random() * width;
                        predator.y = height + PREDATOR_RADIUS;
                        predator.vy = -PREDATOR_SPEED;
                    }
                }
                return;
            }
            
            predator.x += predator.vx;
            predator.y += predator.vy;
            
            if (predator.x < -PREDATOR_RADIUS * 2 || predator.x > width + PREDATOR_RADIUS * 2 ||
                predator.y < -PREDATOR_RADIUS * 2 || predator.y > height + PREDATOR_RADIUS * 2) {
                predator.active = false;
                predator.timer = 200 + Math.random() * 400;
            }
        }
        
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(0.4, '#16213e');
            gradient.addColorStop(0.7, '#0f3460');
            gradient.addColorStop(1, '#0a0a15');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }
        
        function drawSilhouette() {
            ctx.fillStyle = '#050508';
            ctx.beginPath();
            ctx.moveTo(0, height);
            
            const segments = 20;
            const segWidth = width / segments;
            
            for (let i = 0; i <= segments; i++) {
                const x = i * segWidth;
                const baseHeight = height * 0.85;
                const noise = Math.sin(i * 0.5) * 30 + Math.sin(i * 1.2) * 15 + Math.sin(i * 2.5) * 8;
                const tree = Math.random() > 0.9 ? Math.random() * 40 + 20 : 0;
                ctx.lineTo(x, baseHeight + noise - tree);
            }
            
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();
        }
        
        function animate() {
            drawBackground();
            drawSilhouette();
            
            updatePredator();
            
            for (const boid of boids) {
                boid.update();
                boid.draw();
            }
            
            requestAnimationFrame(animate);
        }
        
        predator.timer = 100;
        animate();
    </script>
</body>
</html>
