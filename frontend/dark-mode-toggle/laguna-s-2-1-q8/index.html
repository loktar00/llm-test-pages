<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Theme Toggle Landing</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --card-bg: #f5f5f5;
    --shadow: rgba(0, 0, 0, 0.1);
    --accent: #4f46e5;
    --toggle-bg: #e0e0e0;
    --sun-ray: #1a1a1a;
    --moon-crescent: #ffffff;
  }

  [data-theme="dark"] {
    --bg: #0f0f10;
    --text: #e0e0e0;
    --card-bg: #1c1c1e;
    --shadow: rgba(0, 0, 0, 0.4);
    --accent: #818cf8;
    --toggle-bg: #3a3a3c;
    --sun-ray: #e0e0e0;
    --moon-crescent: #0f0f10;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.6s ease, color 0.6s ease;
    overflow: hidden;
    padding: 2rem;
  }

  .container {
    max-width: 760px;
    width: 100%;
    text-align: center;
  }

  .card {
    background: var(--card-bg);
    border-radius: 1.5rem;
    padding: 3rem 2.5rem;
    box-shadow: 0 20px 60px var(--shadow);
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }

  h1 {
    font-size: 2.6rem;
    margin-bottom: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  p {
    font-size: 1.1rem;
    Opacity: 0.8;
    line-height: 1.7;
    margin-bottom: 2rem;
  }

  .toggle-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-top: 2rem;
  }

  .toggle {
    position: relative;
    width: 60px;
    height: 34px;
    background: var(--toggle-bg);
    border-radius: 34px;
    cursor: pointer;
    transition: background 0.5s ease;
    outline: none;
    display: flex;
    align-items: center;
    padding: 4px;
  }

  .toggle::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 4px;
    width: 26px;
    height: 26px;
    background: white;
    border-radius: 50%;
    transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), background 0.5s ease;
    z-index: 2;
  }

  [data-theme="dark"] .toggle::before {
    transform: translateX(26px);
  }

  .toggle .icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 36px;
    height: 36px;
    display: block;
  }

  .icon.sun,
  .icon.moon {
    transition: opacity 0.5s ease;
  }

  .icon.sun {
    opacity: 1;
  }

  [data-theme="dark"] .icon.sun {
    opacity: 0;
  }

  .icon.moon {
    opacity: 0;
  }

  [data-theme="dark"] .icon.moon {
    opacity: 1;
  }

  .sun-ray {
    position: absolute;
    background: var(--sun-ray);
    transform-origin: center;
    border-radius: 2px;
    transition: all 0.6s ease;
  }

  [data-theme="dark"] .sun-ray {
    opacity: 0;
    transform: scale(0.5) rotate(0deg);
  }

  .moon-crater {
    position: absolute;
    background: var(--moon-crescent);
    border-radius: 50%;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .moon-crater.sm {
    width: 5px;
    height: 5px;
    top: 10px;
    left: 8px;
    opacity: 0;
    transform: scale(0);
  }

  [data-theme="dark"] .moon-crater.sm {
    opacity: 0.4;
    transform: scale(1);
  }

  .moon-crater.md {
    width: 8px;
    height: 8px;
    top: 22px;
    right: 10px;
    opacity: 0;
    transform: scale(0);
  }

  [data-theme="dark"] .moon-crater.md {
    opacity: 0.3;
    transform: scale(1);
  }

  .label {
    font-size: 1rem;
    color: var(--text);
    Opacity: 0.6;
    transition: opacity 0.3s ease;
  }

  .toggle:hover .label {
    Opacity: 1;
  }

  @media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .card { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Morphing Theme Toggle</h1>
      <p>This landing page features a beautifully animated sun-to-moon transition with smooth palette cross-fades. The theme preference is saved in your browser and respects your system's color scheme.</p>
      <div class="toggle-wrapper">
        <span class="label">Light</span>
        <div class="toggle" id="themeToggle">
          <div class="icon sun">
            <div class="sun-ray" style="width: 2px; height: 10px; top: -12px; left: 50%; transform: translateX(-50%) rotate(0deg);"></div>
            <div class="sun-ray" style="width: 2px; height: 10px; top: 50%; left: -12px; transform: translateY(-50%) rotate(0deg);"></div>
            <div class="sun-ray" style="width: 2px; height: 10px; top: 50%; right: -12px; transform: translateY(-50%) rotate(0deg);"></div>
            <div class="sun-ray" style="width: 2px; height: 10px; bottom: -12px; left: 50%; transform: translateX(-50%) rotate(0deg);"></div>
            <div class="sun-ray" style="width: 2px; height: 8px; top: 4px; left: 4px; transform: rotate(45deg);"></div>
            <div class="sun-ray" style="width: 2px; height: 8px; top: 4px; right: 4px; transform: rotate(-45deg);"></div>
            <div class="sun-ray" style="width: 2px; height: 8px; bottom: 4px; left: 4px; transform: rotate(-45deg);"></div>
            <div class="sun-ray" style="width: 2px; height: 8px; bottom: 4px; right: 4px; transform: rotate(45deg);"></div>
          </div>
          <div class="icon moon">
            <div class="moon-crater sm"></div>
            <div class="moon-crater md"></div>
          </div>
        </div>
        <span class="label">Dark</span>
      </div>
    </div>
  </div>

<script>
  const toggle = document.getElementById('themeToggle');
  const html = document.documentElement;

  function setTheme(theme) {
    html.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }

  function getPreferredTheme() {
    const stored = localStorage.getItem('theme');
    if (stored === 'light' || stored === 'dark') return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  toggle.addEventListener('click', () => {
    const current = html.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
  });

  const theme = getPreferredTheme();
  html.setAttribute('data-theme', theme);
</script>
</body>
</html>
