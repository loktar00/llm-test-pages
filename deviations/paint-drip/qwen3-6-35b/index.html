<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dripping Paint Art</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let drips = [];
        let particles = [];
        
        // Configuration
        const PALETTE = [
            '#FF4136', // Red
            '#FF851B', // Orange
            '#FFDC00', // Yellow
            '#2ECC40', // Green
            '#0074D9', // Blue
            '#B10DC9', // Purple
            '#F012BE', // Pink
            '#7FDBFF'  // Cyan
        ];

        class Drip {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20; // Start above screen
                this.vx = (Math.random() - 0.5) * 0.5; // Slight drift
                this.vy = Math.random() * 1 + 0.5; // Initial speed
                this.radius = Math.random() * 15 + 10; // Fat drops
                
                // Thickness represents the "mass" of the paint
                this.thickness = this.radius; 
                
                this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
                this.dryness = 0; // 0 = wet, 1 = dry
                this.drySpeed = Math.random() * 0.002 + 0.0005;
                
                // Drip state
                this.isDripping = true;
                this.minThickness = 3; // Stop dripping when thin
                this.stopped = false;
            }

            update() {
                if (this.stopped) return;

                // Physics: Gravity vs Resistance (thicker paint moves slower? No, usually heavy things fall faster, 
                // but viscous thick paint falls slower. Let's go with viscous.)
                // Actually, for visual satisfaction, let's have them accelerate initially then slow down as they thin out.
                
                this.vy += 0.02; // Gravity acceleration
                
                // Thickness loss (paint leaves trail)
                this.thickness -= 0.03;

                // Stopping conditions
                if (this.thickness <= this.minThickness) {
                    this.stopped = true;
                    // Transition to particle system for pooling
                    this.spawnPoolParticles();
                }

                this.x += this.vx;
                this.y += this.vy;

                // Dryness accumulation
                // Dries faster when stopped and when thicker
                this.dryness += this.drySpeed * (1 + this.thickness/10);
                if (this.dryness > 1) this.dryness = 1;

                // Reset if fell off screen
                if (this.y > height + 50) {
                    this.reset();
                }
            }

            spawnPoolParticles() {
                // When a drip stops, it "splats" into static particles
                const numParticles = Math.floor(this.thickness * 2);
                for (let i = 0; i < numParticles; i++) {
                    const p = new Particle(this.x, this.y, this.color, this.thickness);
                    particles.push(p);
                }
                this.dryness = 1; // Instantly dry upon "splashing"
            }

            draw(ctx) {
                if (this.dryness >= 1) return; // Handled by particles

                ctx.fillStyle = this.color;
                ctx.beginPath();
                // Draw a teardrop shape
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                // Taper the bottom
                ctx.moveTo(this.x - this.radius, this.y);
                ctx.quadraticCurveTo(this.x - this.radius, this.y + this.radius * 1.5, this.x, this.y + this.radius * 2);
                ctx.quadraticCurveTo(this.x + this.radius, this.y + this.radius * 1.5, this.x + this.radius, this.y);
                
                ctx.fill();
                
                // Simple lighting/shading for wet look
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(this.x - this.radius*0.3, this.y - this.radius*0.3, this.radius*0.2, 0, Math.PI*2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color, size) {
                this.x = x + (Math.random() - 0.5) * size;
                this.y = y + (Math.random() - 0.5) * size;
                this.color = color;
                this.size = Math.random() * size * 0.5 + 1;
                this.dryness = 0;
                this.drySpeed = Math.random() * 0.005 + 0.002; // Particles dry faster
            }

            update() {
                this.dryness += this.drySpeed;
                if (this.dryness > 1) this.dryness = 1;
            }

            draw(ctx) {
                // Opacity depends on wetness. 
                // Wet paint is opaque and glossy. Dry paint gets darker (opacity/color darkening).
                const opacity = 1;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = opacity;
                
                // Add slight blur to simulate liquid spreading
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Wet gloss
                if (this.dryness < 0.5) {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x - this.size*0.2, this.y - this.size*0.2, this.size*0.3, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Create initial drips
            drips = [];
            for(let i=0; i<15; i++) {
                drips.push(new Drip());
                // Spread them out vertically initially
                drips[i].y = Math.random() * height;
            }
        }

        function checkCoverage() {
            // We sample pixels to check coverage
            // To be performant, we don't check every pixel every frame.
            // We check a subset of pixels.
            
            const samples = 2000;
            let coveredPixels = 0;

            // Optimization: Check a grid of points
            for (let i = 0; i < samples; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                
                // Get pixel data
                // This is expensive, so we limit samples
                const p = ctx.getImageData(x, y, 1, 1).data;
                const [r, g, b] = p;
                
                // If pixel is not white (alpha is handled by not clearing rect), it's painted
                // Since we don't clearRect, the background is whatever was last drawn or black.
                // Actually, we need to track the "wetness" or "coverage" of the white canvas.
                // If the pixel is non-white (and not the black background), it's painted.
                // However, since we draw ON TOP, checking if pixel is white is the key.
                
                if (r > 240 && g > 240 && b > 240) {
                    // White pixel, not covered
                } else {
                    coveredPixels++;
                }
            }

            const coverageRatio = coveredPixels / samples;
            
            if (coverageRatio > 0.65) { // Threshold
                fadeToWhite(coverageRatio);
            }
        }

        let fading = false;
        let fadeValue = 0;

        function fadeToWhite(ratio) {
            if (fading) return;
            fading = true;
            
            // Gentle fade out logic
            const fadeInterval = setInterval(() => {
                fadeValue += 0.05;
                
                // Draw white overlay
                ctx.fillStyle = `rgba(255, 255, 255, ${fadeValue})`;
                ctx.fillRect(0, 0, width, height);
                
                // Update particles to "dry" visually as white fades in
                // (They don't change state, just obscured)
                
                if (fadeValue >= 1) {
                    clearInterval(fadeInterval);
                    // Reset
                    ctx.clearRect(0, 0, width, height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, width, height);
                    
                    // Reset Drips
                    drips.forEach(d => d.reset());
                    particles = [];
                    
                    fading = false;
                    fadeValue = 0;
                }
            }, 50);
        }

        function darkenDriedPaint() {
            // This is computationally expensive to do on the whole canvas every frame.
            // Instead, we rely on the Particle class darkening itself as it dries.
            // We will simulate the "global darkening" effect by drawing a very dark overlay 
            // on top of old paint? No, that ruins the white fade.
            // The requirement "drying is a visible gradual darkening" is best handled per-particle.
            // We iterate particles and darken their fillStyle.
        }

        function animate() {
            // Background is white. We draw on top.
            
            // Update and draw Drips
            drips.forEach(d => {
                d.update();
                d.draw(ctx);
            });

            // Update and draw Particles
            particles.forEach(p => {
                p.update();
                
                // Darken logic for drying particles
                if (p.dryness > 0.1) {
                    // Parse hex color to darken it
                    const hex = p.color;
                    const r = parseInt(hex.substring(1, 3), 16);
                    const g = parseInt(hex.substring(3, 5), 16);
                    const b = parseInt(hex.substring(5, 7), 16);
                    
                    const darkFactor = 0.5 + (0.5 * (1 - p.dryness)); // Starts at 1 (normal), goes to 0.5 (dark)
                    
                    // We need to draw the darkened color.
                    // Since we already drew the wet version, we draw over it.
                    // However, drawing over white background with the dark color will look wrong if we don't composite correctly.
                    // Better approach: In Particle.draw, just calculate the darkened color.
                }
                
                // Redraw particle with dryness applied
                // Note: This redraws on top of the wet version. 
                // If the particle hasn't moved much, it blends.
                // But since we are on a white canvas, drawing a semi-transparent dark color on top of the bright wet color 
                // will darken it correctly.
                
                const hex = p.color;
                const r = parseInt(hex.substring(1, 3), 16);
                const g = parseInt(hex.substring(3, 5), 16);
                const b = parseInt(hex.substring(5, 7), 16);
                
                const darkenAmt = 0.4 * p.dryness; // How dark it gets
                const dr = Math.floor(r * (1 - darkenAmt));
                const dg = Math.floor(g * (1 - darkenAmt));
                const db = Math.floor(b * (1 - darkenAmt));
                
                ctx.fillStyle = `rgb(${dr},${dg},${db})`;
                ctx.globalAlpha = 0.8; // Slight transparency to blend
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Check coverage periodically (every 10 frames or so)
            if (frameCount % 10 === 0) {
                checkCoverage();
            }

            frameCount++;
            requestAnimationFrame(animate);
        }

        let frameCount = 0;

        window.addEventListener('resize', init);
        init();
        animate();

    </script>
</body>
</html>
