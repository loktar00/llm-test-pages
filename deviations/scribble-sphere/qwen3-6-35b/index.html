<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const RADIUS = 180;
const NUM_POINTS = 12000;
const FOV = 550;
const points = [];

// Generate a dense scribble path covering the sphere
(function generate() {
    let x = 0, y = -RADIUS, z = 0;
    points.push([x, y, z]);
    for (let i = 1; i < NUM_POINTS; i++) {
        // Tangent random walk on sphere
        let dx, dy, dz;
        do {
            dx = Math.random() * 2 - 1;
            dy = Math.random() * 2 - 1;
            dz = Math.random() * 2 - 1;
        } while (dx === 0 && dy === 0 && dz === 0);
        let dl = Math.sqrt(dx*dx + dy*dy + dz*dz);
        dx /= dl; dy /= dl; dz /= dl;
        // Project to tangent
        let dot = x*dx + y*dy + z*dz;
        dx -= dot*x; dy -= dot*y; dz -= dot*z;
        let tl = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (tl < 1e-6) { dx = 1; tl = 1; }
        dx /= tl; dy /= tl; dz /= tl;
        const step = RADIUS * (0.04 + Math.random() * 0.06);
        let nx = x + dx*step, ny = y + dy*step, nz = z + dz*step;
        let nl = Math.sqrt(nx*nx + ny*ny + nz*nz);
        nx = nx/nl*RADIUS; ny = ny/nl*RADIUS; nz = nz/nl*RADIUS;
        points.push([nx, ny, nz]);
        x = nx; y = ny; z = nz;
    }
})();

let ax = 0, ay = 0, az = 0;
let visible = 0;
const maxVis = NUM_POINTS - 1;
let phase = 'grow';
let growRate = 20;
let holdT = 0, pauseT = 0;

function rot(p, a, b, c) {
    let [x,y,z] = p;
    let co=Math.cos(a), si=Math.sin(a);
    let y1=y*co-z*si, z1=y*si+z*co; y=y1; z=z1;
    co=Math.cos(b); si=Math.sin(b);
    let x2=x*co+z*si, z2=-x*si+z*co; x=x2; z=z2;
    co=Math.cos(c); si=Math.sin(c);
    let x3=x*co-y*si, y3=x*si+y*co; x=x3; y=y3;
    return [x,y,z];
}

(function frame() {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0,0,W,H);

    ax += 0.004; ay += 0.006; az += 0.002;

    if (phase==='grow') {
        visible += growRate;
        if (visible >= maxVis) { visible = maxVis; phase='hold'; holdT = 80; }
    } else if (phase==='hold') {
        holdT--;
        if (holdT<=0) phase='shrink';
    } else if (phase==='shrink') {
        visible -= growRate * 1.8;
        if (visible <= 0) { visible = 0; phase='pause'; pauseT = 25; }
    } else {
        pauseT--;
        if (pauseT<=0) phase='grow';
    }

    const cx = W/2, cy = H/2;
    const vis = Math.min(Math.floor(visible), maxVis);

    // Batch draw by depth layer for better visual effect
    // Draw back layers first, front on top
    for (let i = 0; i < vis; i++) {
        const p1 = points[i], p2 = points[i+1];
        const r1 = rot(p1, ax, ay, az);
        const r2 = rot(p2, ax, ay, az);

        const d1 = r1[2] + RADIUS + 200;
        const d2 = r2[2] + RADIUS + 200;
        const s1 = FOV / d1;
        const s2 = FOV / d2;

        const x1 = cx + r1[0]*s1, y1 = cy + r1[1]*s1;
        const x2 = cx + r2[0]*s2, y2 = cy + r2[1]*s2;

        const depth = (r1[2] + RADIUS) / (2*RADIUS);
        const alpha = 0.15 + 0.85 * depth;
        const w = 0.4 + 2.2 * depth;

        // Color shifts from deep blue (back) to cyan-white (front)
        const h = 210 + 50 * (1 - depth);
        const s = 50 + 50 * depth;
        const l = 30 + 55 * depth;

        ctx.strokeStyle = `hsla(${h},${s}%,${l}%,${alpha})`;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
