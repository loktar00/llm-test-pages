<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Messaging Panel</title>
    <style>
        :root {
            --bg-app: #f0f2f5;
            --bg-panel: #ffffff;
            --bg-list: #f8f9fa;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --text-main: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --bubble-in: #f3f4f6;
            --bubble-out: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system-font, -apple-system-font, sans-serif;
        }

        body {
            background-color: var(--bg-app);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Container */
        .app-container {
            width: 900px;
            height: 650px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            display: flex;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Left Sidebar */
        .sidebar {
            width: 320px;
            background: var(--bg-list);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.2s ease;
            position: relative;
        }

        .contact-item:hover {
            background: #eef1f5;
        }

        .contact-item.active {
            background: #e0e7ff;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #cbd5e1;
            margin-right: 12px;
            position: relative;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .presence-dot {
            width: 12px;
            height: 12px;
            background: #10b981;
            border: 2px solid var(--bg-list);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            transition: border-color 0.2s;
        }

        .contact-item:hover .presence-dot {
            border-color: #eef1f5;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .contact-preview {
            font-size: 0.875rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            min-width: 20px;
            text-align: center;
            display: none;
        }

        .unread-badge.show {
            display: block;
        }

        /* Right Conversation Area */
        .conversation {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
        }

        .conv-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            z-index: 10;
        }

        .conv-header .avatar {
            width: 40px;
            height: 40px;
            margin-right: 12px;
        }

        .conv-header .presence-dot {
            border-color: var(--bg-panel);
        }

        .conv-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .conv-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .messages-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Day Dividers */
        .day-divider {
            align-self: center;
            background: #f1f5f9;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin: 8px 0;
            text-transform: uppercase;
        }

        /* Bubbles */
        .message-row {
            display: flex;
            margin-bottom: 4px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.9);
        }

        .message-row.incoming {
            justify-content: flex-start;
        }

        .message-row.outgoing {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 10px 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .incoming .bubble {
            background: var(--bubble-in);
            color: var(--text-main);
            border-radius: 18px 18px 18px 4px;
        }

        .outgoing .bubble {
            background: var(--bubble-out);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .timestamp {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }

        .incoming .timestamp {
            text-align: left;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: var(--bubble-in);
            border-radius: 18px 18px 18px 4px;
            width: fit-content;
            margin-bottom: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .typing-indicator.visible {
            opacity: 1;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            margin: 0 2px;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* Composer */
        .composer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-box {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: #f9fafb;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.36, 1.2), background 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .send-btn:hover {
            transform: scale(1.1);
            background: var(--primary-dark);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: translateX(2px); /* Visual centering adjustment */
        }

        /* Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">Messages</div>
        <div class="contact-list" id="contactList">
            <!-- Contacts injected here -->
        </div>
    </div>

    <!-- Conversation Area -->
    <div class="conversation">
        <div class="conv-header" id="convHeader">
            <div class="avatar" style="background-image: url('https://images.unsplash.com/photo-1516005352032-28d93b9c835c?auto=format&fit=crop&w=100&h=100');">
                <div class="presence-dot"></div>
            </div>
            <div>
                <div class="conv-name" id="convName">Select a Contact</div>
                <div class="conv-status" id="convStatus">...</div>
            </div>
        </div>

        <div class="messages-wrapper" id="messagesWrapper">
            <!-- Messages injected here -->
        </div>

        <div class="composer">
            <input type="text" class="input-box" id="msgInput" placeholder="Type a message..." disabled>
            <button class="send-btn" id="sendBtn" disabled>
                <svg viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 22 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    // Data Structure
    const contacts = [
        {
            id: 1,
            name: "Alice",
            avatar: "https://images.unsplash.com/photo-1516005352032-28d93b9c835c?auto=format&fit=crop&w=100&h=100",
            status: "Online",
            unread: 2,
            messages: [
                { id: 1, text: "Hey! Justified the HTML5 semantic elements.", sender: 'me', time: '10:00 AM', date: 'Today' },
                { id: 2, text: "Builder be busy making these The.", sender: 'them', time: '10:02 AM', date: 'Today' },
                { id: 3, text: "Renders perfectly on your device.", sender: 'me', time: '10:05 AM', date: 'Today' },
                { id: 4, text: "Meeting scheduled for 2 PM.", sender: 'them', time: '09:30 AM', date: 'Yesterday' },
                { id: 5, text: "Good morning!", sender: 'me', time: '09:00 AM', date: 'Yesterday' }
            ]
        },
        {
            id: 2,
            name: "Bob",
            avatar: "https://images.unsplash.com/photo-1516005352032-28d93b9c835c?auto=format&fit=crop&w=100&h=100", // Placeholder reuse
            status: "Busy",
            unread: 0,
            messages: [
                { id: 1, text: "Got a 98% on this build.", sender: 'me', time: '2:00 PM', date: 'Today' },
                { id: 2, text: "Deploying to production...", sender: 'them', time: '2:05 PM', date: 'Today' }
            ]
        },
        {
            id: 3,
            name: "Charlie",
            avatar: "https://images.unsplash.com/photo-1516005352032-28d93b9c835c?auto=format&fit=crop&w=100&h=100",
            status: "Offline",
            unread: 5,
            messages: [
                { id: 1, text: "Coffee break time.", sender: 'them', time: '1:00 PM', date: 'Today' }
            ]
        }
    ];

    // State
    let activeContactId = 1;
    const typingTimeout = { current: null };

    // DOM Elements
    const contactListEl = document.getElementById('contactList');
    const messagesWrapperEl = document.getElementById('messagesWrapper');
    const convNameEl = document.getElementById('convName');
    const convStatusEl = document.getElementById('convStatus');
    const msgInputEl = document.getElementById('msgInput');
    const sendBtnEl = document.getElementById('sendBtn');

    // Initialize
    function init() {
        renderContacts();
        selectContact(contacts[0].id);
    }

    // Render Sidebar
    function renderContacts() {
        contactListEl.innerHTML = '';
        contacts.forEach(c => {
            const el = document.createElement('div');
            el.className = `contact-item ${c.id === activeContactId ? 'active' : ''}`;
            el.onclick = () => selectContact(c.id);

            // Unread Badge logic
            const badgeClass = c.unread > 0 ? 'unread-badge show' : 'unread-badge';
            
            // Avatar Color Logic (Random for demo)
            const hue = Math.floor(Math.random() * 360);
            const avatarStyle = `background-image: url('${c.avatar}'); background-color: hsl(${hue}, 60%, 80%);`;

            el.innerHTML = `
                <div class="avatar" style="${avatarStyle}">
                    <div class="presence-dot" style="background-color: ${c.status === 'Online' ? '#10b981' : (c.status === 'Busy' ? '#f59e0b' : '#9ca3af')}"></div>
                </div>
                <div class="contact-info">
                    <div class="contact-name">
                        ${c.name}
                        <span class="${badgeClass}">${c.unread}</span>
                    </div>
                    <div class="contact-preview">
                        ${c.messages.length > 0 ? c.messages[c.messages.length - 1].text : 'No messages'}
                    </div>
                </div>
            `;
            contactListEl.appendChild(el);
        });
    }

    // Select Contact Logic
    function selectContact(id) {
        activeContactId = id;
        const contact = contacts.find(c => c.id === id);
        
        // Reset unread
        contact.unread = 0;
        
        // Update UI
        renderContacts();
        convNameEl.innerText = contact.name;
        convStatusEl.innerText = contact.status;
        
        // Enable Input
        msgInputEl.disabled = false;
        sendBtnEl.disabled = false;
        msgInputEl.focus();

        // Render Messages
        renderMessages(contact.messages);
    }

    // Render Messages with Day Dividers
    function renderMessages(msgs) {
        messagesWrapperEl.innerHTML = '';
        
        let lastDate = null;
        
        msgs.forEach(msg => {
            // Day Divider
            if (msg.date !== lastDate) {
                const divider = document.createElement('div');
                divider.className = 'day-divider';
                divider.innerText = msg.date;
                messagesWrapperEl.appendChild(divider);
                lastDate = msg.date;
            }

            // Bubble
            const row = document.createElement('div');
            row.className = `message-row ${msg.sender === 'me' ? 'outgoing' : 'incoming'}`;
            
            // Stagger animation delay based on index
            row.style.animationDelay = `${msgs.indexOf(msg) * 0.05}s`;

            row.innerHTML = `
                <div class="bubble">
                    ${msg.text}
                    <div class="timestamp">${msg.time}</div>
                </div>
            `;
            messagesWrapperEl.appendChild(row);
        });
    }

    // Send Message Logic
    function sendMessage() {
        const text = msgInputEl.value.trim();
        if (!text) return;

        const contact = contacts.find(c => c.id === activeContactId);
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        // Add Message
        const newMsg = {
            id: Date.now(),
            text: text,
            sender: 'me',
            time: timeString,
            date: 'Today'
        };

        contact.messages.push(newMsg);
        msgInputEl.value = '';
        
        // Re-render to show the new bubble with animation
        renderMessages(contact.messages);
        scrollToBottom();

        // Trigger Typing Indicator
        triggerTyping(contact);
    }

    // Typing Indicator Logic
    function triggerTyping(contact) {
        // Remove existing typing if exists
        const existing = document.querySelector('.typing-indicator');
        if (existing) existing.remove();

        // Create Typing Indicator
        const typingEl = document.createElement('div');
        typingEl.className = 'typing-indicator visible';
        typingEl.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;

        // Append to the message wrapper (flex logic handles placement)
        // We need to put it inside the wrapper but we need to handle divider logic if it was dynamic, 
        // for simplicity in this demo, we just append it. 
        // Ideally, it should be after the last message.
        messagesWrapperEl.appendChild(typingEl);
        scrollToBottom();

        // Simulate Reply
        clearTimeout(typingTimeout.current);
        typingTimeout.current = setTimeout(() => {
            // Remove typing
            typingEl.remove();
            
            // Add Reply
            const replies = [
                "Thanks for the reply.", 
                "I'm a reply.", 
                "Let's chat.", 
                "System update complete."
            ];
            const randomReply = replies[Math.floor(Math.random() * replies.length)];
            
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            contact.messages.push({
                id: Date.now() + 1,
                text: randomReply,
                sender: 'them',
                time: timeString,
                date: 'Today'
            });

            renderMessages(contact.messages);
            scrollToBottom();

        }, 2000);
    }

    function scrollToBottom() {
        setTimeout(() => {
            messagesWrapperEl.scrollTop = messagesWrapperEl.scrollHeight;
        }, 100);
    }

    // Event Listeners
    sendBtnEl.addEventListener('click', sendMessage);
    msgInputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Start
    init();

</script>
</body>
</html>
