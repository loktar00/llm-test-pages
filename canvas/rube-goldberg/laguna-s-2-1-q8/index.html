<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rube Goldberg Loop</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body { background: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Resize canvas to full window
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Physics helpers ---
const TWO_PI = Math.PI * 2;

class Vector {
    constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
    }
    set(x, y) { this.x = x; this.y = y; return this; }
    copy() { return new Vector(this.x, this.y); }
    add(v) { this.x += v.x; this.y += v.y; return this; }
    sub(v) { this.x -= v.x; this.y -= v.y; return this; }
    mult(s) { this.x *= s; this.y *= s; return this; }
    div(s) { this.x /= s; this.y /= s; return this; }
    mag() { return Math.hypot(this.x, this.y); }
    normalize() { 
        const m = this.mag() || 1;
        return new Vector(this.x/m, this.y/m); 
    }
}

// --- Game state ---
let gravity = new Vector(0, 0.6);
let cameraX = 0;
let ball;
let ramps = [];
let dominos = [];
let pulley;
let hammer;
let funnel;
let elevator;

// --- Entities ---

// Ball
class Ball {
    constructor(x, y) {
        this.pos = new Vector(x, y);
        this.vel = new Vector(0, 0);
        this.acc = new Vector(0, 0);
        this.r = 12;
        this.falling = true;
    }
    update() {
        if (this.falling) {
            this.acc.add(gravity);
        }
        this.vel.add(this.acc);
        this.pos.add(this.vel);
        this.acc.set(0, 0);
        // Wrap around screen for continuous loop
        if (this.pos.y > canvas.height + 500) {
            this.pos.set(startX, startY - 50);
            this.vel.set(0, 0);
        }
    }
    applyForce(f) {
        this.acc.add(f);
    }
}

// Ramp
class Ramp {
    constructor(x, y, w, h, angle) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.angle = angle;
    }
    draw(ctx, camX) {
        ctx.save();
        ctx.translate(this.x - camX, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(0, 0, this.w, this.h);
        ctx.restore();
    }
}

// Domino
class Domino {
    constructor(x, y) {
        this.pos = new Vector(x, y);
        this.angle = 0;
        this.fallen = false;
        this.w = 10;
        this.h = 60;
    }
    update() {
        if (!this.fallen && this.angle > 0.1) {
            this.fallen = true;
        }
        if (this.fallen && Math.abs(this.angle) < 0.01) {
            this.angle = 0;
        }
        // Apply gravity torque when tilted
        if (this.angle > 0.01 || this.angle < -0.01) {
            this.angle += this.angle * 0.05;
        }
    }
    draw(ctx, camX) {
        ctx.save();
        ctx.translate(this.pos.x - camX, this.pos.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#8B0000';
        ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        ctx.restore();
    }
}

// Pulley Basket
class Pulley {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.basketY = y + 50;
        this.targetY = y + 50;
        this.speed = 0;
        this.accel = 0;
    }
    update(ball) {
        // Trigger when ball gets near
        const distToBall = Math.hypot(ball.pos.x - (this.x - cameraX), ball.pos.y - this.basketY);
        if (distToBall < 100) {
            this.targetY = this.y - 50;
        } else {
            this.targetY = this.y + 50;
        }
        
        // Smooth movement
        const diff = this.targetY - this.basketY;
        this.accel = diff * 0.02;
        this.speed += this.accel;
        this.speed *= 0.9;
        this.basketY += this.speed;
    }
    draw(ctx, camX) {
        // Pulley wheel
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y, 20, 0, TWO_PI);
        ctx.fill();
        
        // Rope and basket
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.x - camX, this.y);
        ctx.lineTo(this.x - camX, this.basketY);
        ctx.stroke();
        
        // Basket
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(this.x - camX - 25, this.basketY, 50, 30);
    }
}

// Spring Hammer
class Hammer {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.angle = Math.PI / 4;
        this.vel = 0;
    }
    trigger(ball) {
        const dx = ball.pos.x - (this.x - cameraX);
        const dy = ball.pos.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 80 && this.angle > -Math.PI / 4) {
            this.vel -= 0.3;
        }
    }
    update() {
        this.vel += 0.01; // gravity-like restoring force
        this.angle += this.vel;
        if (this.angle > Math.PI / 4) {
            this.angle = Math.PI / 4;
            this.vel *= -0.7;
        }
    }
    draw(ctx, camX) {
        ctx.save();
        ctx.translate(this.x - camX, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#C0C0C0';
        ctx.fillRect(0, -5, 80, 10);
        ctx.restore();
    }
}

// Funnel
class Funnel {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 40;
    }
    applyForce(ball) {
        const dx = ball.pos.x - (this.x - cameraX);
        const dy = ball.pos.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < this.radius + ball.r) {
            const fx = -dx * 0.1;
            const fy = -dy * 0.1;
            ball.applyForce(new Vector(fx, fy));
        }
    }
    draw(ctx, camX) {
        ctx.fillStyle = '#444';
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y, this.radius, Math.PI, TWO_PI);
        ctx.fill();
    }
}

// Elevator Wheel
class Elevator {
    constructor(x, y, radius) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.angle = 0;
        this.ballOnWheel = false;
    }
    update(ball) {
        const dx = ball.pos.x - (this.x - cameraX);
        const dy = ball.pos.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < this.radius + ball.r + 5) {
            const angleToBall = Math.atan2(dy, dx);
            const targetAngle = angleToBall + Math.PI;
            // Move ball towards rim
            ball.pos.set(
                this.x - cameraX + Math.cos(targetAngle) * (this.radius + ball.r),
                this.y + Math.sin(targetAngle) * (this.radius + ball.r)
            );
            ball.vel.set(0, 0);
            this.ballOnWheel = true;
        } else {
            this.ballOnWheel = false;
        }
        this.angle += 0.02;
    }
    draw(ctx, camX) {
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y, this.radius, 0, TWO_PI);
        ctx.stroke();
        
        // Spokes
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * TWO_PI + this.angle;
            ctx.beginPath();
            ctx.moveTo(this.x - camX, this.y);
            ctx.lineTo(this.x - camX + Math.cos(a) * this.radius, this.y + Math.sin(a) * this.radius);
            ctx.stroke();
        }
    }
}

// Initialize objects
function init() {
    const startX = 1000;
    const startY = 200;
    
    ball = new Ball(startX, startY);
    
    ramps = [
        new Ramp(800, 150, 300, 20, -0.3),
        new Ramp(1100, 300, 200, 20, 0.2),
        new Ramp(1400, 400, 200, 20, 0.1),
        new Ramp(1700, 450, 200, 20, 0.05),
        new Ramp(2000, 500, 200, 20, 0.1)
    ];
    
    dominos = [];
    for (let i = 0; i < 15; i++) {
        dominos.push(new Domino(1200 + i * 40, 380));
    }
    
    pulley = new Pulley(1600, 400);
    hammer = new Hammer(1900, 480);
    funnel = new Funnel(2300, 500);
    elevator = new Elevator(2700, 300, 60);
    
    window.startX = startX;
    window.startY = startY;
}

init();

// Main loop
function loop() {
    // Clear
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Update ball
    ball.update();
    
    // Collision with ramps
    for (let ramp of ramps) {
        // Simplified collision check
        const closestX = Math.max(ramp.x, Math.min(ball.pos.x + cameraX, ramp.x + ramp.w));
        const closestY = Math.max(ramp.y, Math.min(ball.pos.y, ramp.y + ramp.h));
        const distX = ball.pos.x + cameraX - closestX;
        const distY = ball.pos.y - closestY;
        const dist = Math.hypot(distX, distY);
        
        if (dist < ball.r) {
            const nx = distX / dist || 0;
            const ny = distY / dist || 0;
            ball.pos.x = closestX - cameraX + nx * ball.r;
            ball.pos.y = closestY + ny * ball.r;
            
            const dot = ball.vel.x * nx + ball.vel.y * ny;
            ball.vel.x -= 2 * dot * nx;
            ball.vel.y -= 2 * dot * ny;
            
            ball.vel.mult(0.9);
        }
    }
    
    // Domino collision
    for (let d of dominos) {
        d.update();
        const dx = ball.pos.x + cameraX - d.pos.x;
        const dy = ball.pos.y - d.pos.y;
        const dist = Math.hypot(dx, dy);
        if (dist < ball.r + d.w / 2 && !d.fallen) {
            d.angle += 0.1;
        }
    }
    
    // Pulley interaction
    pulley.update(ball);
    
    // Hammer trigger
    hammer.trigger(ball);
    hammer.update();
    
    // Funnel force
    funnel.applyForce(ball);
    
    // Elevator interaction
    elevator.update(ball);
    
    // Camera follows ball slightly offset
    cameraX = ball.pos.x - canvas.width / 3;
    
    // Draw everything
    for (let ramp of ramps) {
        ramp.draw(ctx, cameraX);
    }
    
    for (let d of dominos) {
        d.draw(ctx, cameraX);
    }
    
    pulley.draw(ctx, cameraX);
    hammer.draw(ctx, cameraX);
    funnel.draw(ctx, cameraX);
    elevator.draw(ctx, cameraX);
    
    // Draw ball with squash stretch
    ctx.save();
    const scale = 1 + (ball.vel.mag() / 30) * 0.2;
    ctx.translate(ball.pos.x, ball.pos.y);
    ctx.scale(scale, 1 / scale);
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(0, 0, ball.r, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
    
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
