<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doom Melt</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Scene Generators ---

function sceneCyberpunk(ctx, w, h) {
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0a0015');
  grad.addColorStop(0.4, '#1a0030');
  grad.addColorStop(0.7, '#300050');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Stars
  for (let i = 0; i < 100; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.8})`;
    ctx.fillRect(Math.random() * w, Math.random() * h * 0.4, 1, 1);
  }

  // Buildings
  for (let x = 0; x < w; x += 15 + Math.random() * 20) {
    const bw = 10 + Math.random() * 30;
    const bh = 50 + Math.random() * h * 0.5;
    const by = h - bh;
    const hue = 200 + Math.random() * 60;
    ctx.fillStyle = `hsl(${hue}, 30%, ${10 + Math.random() * 15}%)`;
    ctx.fillRect(x, by, bw, bh);

    // Windows
    for (let wy = by + 5; wy < h - 5; wy += 8) {
      for (let wx = x + 2; wx < x + bw - 2; wx += 6) {
        if (Math.random() > 0.3) {
          ctx.fillStyle = Math.random() > 0.5 ? '#ffcc00' : '#00ffff';
          ctx.globalAlpha = 0.3 + Math.random() * 0.7;
          ctx.fillRect(wx, wy, 3, 4);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // Ground grid
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.4;
  for (let y = h * 0.8; y < h; y += 10) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  for (let x = 0; x < w; x += 20) {
    ctx.beginPath();
    ctx.moveTo(x, h * 0.8);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function sceneCave(ctx, w, h) {
  ctx.fillStyle = '#1a0a00';
  ctx.fillRect(0, 0, w, h);

  // Flowing lava
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(0, h * 0.6 + i * 20);
    for (let x = 0; x <= w; x += 10) {
      ctx.lineTo(x, h * 0.6 + i * 20 + Math.sin(x * 0.01 + i) * 30);
    }
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, h * 0.5, 0, h);
    grad.addColorStop(0, '#ff4400');
    grad.addColorStop(0.5, '#cc2200');
    grad.addColorStop(1, '#220000');
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.7;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Stalactites
  for (let x = 0; x < w; x += 30 + Math.random() * 40) {
    const len = 20 + Math.random() * 100;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + 10, len);
    ctx.lineTo(x - 10, len);
    ctx.closePath();
    ctx.fillStyle = '#2a1a10';
    ctx.fill();
  }

  // Glow
  const glow = ctx.createRadialGradient(w / 2, h * 0.7, 10, w / 2, h * 0.7, h);
  glow.addColorStop(0, 'rgba(255, 100, 0, 0.3)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
}

function sceneMatrix(ctx, w, h) {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, w, h);

  ctx.font = '14px monospace';
  for (let x = 0; x < w; x += 14) {
    const len = 5 + Math.floor(Math.random() * 20);
    for (let y = 0; y < len * 14; y += 14) {
      const char = String.fromCharCode(0x30A0 + Math.random() * 96);
      const brightness = Math.random();
      ctx.fillStyle = `rgb(0, ${Math.floor(150 + brightness * 105)}, 0)`;
      ctx.globalAlpha = 0.3 + Math.random() * 0.7;
      ctx.fillText(char, x, y);
    }
  }
  ctx.globalAlpha = 1;
}

const generators = [sceneCyberpunk, sceneCave, sceneMatrix];

// --- Melt System ---

let backBuffer, frontBuffer;
let colData = [];
let sceneIndex = 0;
let state = 'render'; // 'render', 'hold', 'melt'
let timer = 0;
let holdDuration = 120; // frames to hold

function initBuffers() {
  backBuffer = document.createElement('canvas');
  frontBuffer = document.createElement('canvas');
  backBuffer.width = frontBuffer.width = W;
  backBuffer.height = frontBuffer.height = H;
}
initBuffers();
window.addEventListener('resize', () => { resize(); initBuffers(); resetMelt(); });

function resetMelt() {
  colData = [];
  for (let x = 0; x < W; x++) {
    colData.push({
      offset: 0,
      speed: 2 + Math.random() * 4,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleAmp: 1 + Math.random() * 3,
      delay: Math.random() * 60,
      active: false
    });
  }
}

function drawScene(ctx, w, h, index) {
  generators[index % generators.length](ctx, w, h);
}

function resetState() {
  // Swap: back becomes front, generate new back
  const temp = backBuffer;
  backBuffer = frontBuffer;
  frontBuffer = temp;

  drawScene(backBuffer.getContext('2d'), W, H, sceneIndex++);

  resetMelt();
  state = 'hold';
  timer = 0;
}

resetState();

function loop() {
  ctx.clearRect(0, 0, W, H);

  if (state === 'hold') {
    // Draw the current front scene
    ctx.drawImage(backBuffer, 0, 0);
    timer++;
    if (timer > holdDuration) {
      state = 'melt';
      timer = 0;
    }
  } else if (state === 'melt') {
    timer++;

    // Draw front buffer as base (the scene being revealed)
    ctx.drawImage(frontBuffer, 0, 0);

    // Draw columns from back buffer with melt effect
    for (let x = 0; x < W; x++) {
      const col = colData[x];
      if (timer > col.delay) {
        col.offset += col.speed;
        const wobble = Math.sin(timer * 0.1 + col.wobblePhase) * col.wobbleAmp;

        if (col.offset < H) {
          // Draw the melted portion
          ctx.drawImage(
            backBuffer,
            x, 0, 1, Math.floor(col.offset),
            x + wobble, col.offset, 1, Math.floor(col.offset)
          );
        } else {
          // Column fully melted, draw nothing (front scene shows)
        }
      } else {
        // Not yet melted, draw normally
        ctx.drawImage(backBuffer, x, 0, 1, H, x, 0, 1, H);
      }
    }

    // Check if all columns are done
    const allDone = colData.every(c => c.offset >= H);
    if (allDone) {
      resetState();
    }
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
