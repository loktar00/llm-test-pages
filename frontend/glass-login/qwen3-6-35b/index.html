<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Login</title>
    <style>
        /* --- Reset & Base --- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* --- Animated Background --- */
        .bg-gradient {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                #0f0c29, 
                #302b63, 
                #24243e,
                #0f172a,
                #000000
            );
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            z-index: 1;
        }

        /* Decorative orbs for depth */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 2;
            animation: floatOrb 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #7b4397;
            top: 20%;
            left: 20%;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #dc2430;
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: #13777b;
            top: 40%;
            right: 30%;
            animation-delay: -10s;
        }

        /* --- Glass Card --- */
        .card {
            position: relative;
            z-index: 10;
            width: 380px;
            padding: 40px;
            border-radius: 20px;
            
            /* Glassmorphism */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); /* Safari support */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .card-header h2 {
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .card-header p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* --- Form Elements --- */
        .input-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            padding: 16px 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-bottom-color: #a855f7; /* Purple accent */
        }

        /* Floating Label */
        .input-label {
            position: absolute;
            top: 16px;
            left: 12px;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            font-size: 1rem;
        }

        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: -10px;
            left: 0;
            font-size: 0.75rem;
            color: #d8b4fe;
            font-weight: 600;
        }

        /* Shake Animation for Invalid State */
        .shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            border-bottom-color: #ef4444 !important;
        }
        
        .shake ~ .input-label {
            color: #ef4444;
        }

        /* --- Buttons & Links --- */
        .btn-submit {
            position: relative;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #7b4397, #dc2430);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px rgba(220, 36, 48, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Shine Sweep Effect */
        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: 0.5s;
        }

        .btn-submit:hover::after {
            left: 100%;
            transition: 0.7s ease-in-out;
        }

        .forgot-link {
            text-align: right;
            margin-top: -8px;
        }

        .forgot-link a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .forgot-link a:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* --- Keyframes --- */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -30px); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Glass Card -->
    <div class="card">
        <div class="card-header">
            <h2>Welcome Back</h2>
            <p>Please enter your details.</p>
        </div>

        <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="input-group">
                <input type="email" id="email" class="input-field" placeholder=" " required>
                <label for="email" class="input-label">Email Address</label>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder=" " required>
                <label for="password" class="input-label">Password</label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit">Sign In</button>

            <!-- Microlink -->
            <div class="forgot-link">
                <a href="#">Forgot password?</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const inputs = document.querySelectorAll('.input-field');

            // Remove shake class on input
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('shake');
                });
            });

            // Handle Form Submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let isValid = true;

                // Simple validation check
                inputs.forEach(input => {
                    if (!input.value.trim()) {
                        isValid = false;
                        triggerShake(input);
                    }
                });

                // If valid (mock logic), you would redirect here
                if (isValid) {
                    const btn = document.querySelector('.btn-submit');
                    const originalText = btn.innerText;
                    btn.innerText = 'Success';
                    btn.style.background = '#10b981'; // Green
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = ''; // Reset
                    }, 2000);
                }
            });

            function triggerShake(element) {
                element.classList.remove('shake');
                // Force reflow to restart animation
                void element.offsetWidth; 
                element.classList.add('shake');
            }
        });
    </script>
</body>
</html>
