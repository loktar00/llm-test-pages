<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Campfire</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <script>
        /**
         * NIGHT CAMPSITE SIMULATION
         * A self-contained procedural scene generation.
         */

        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let time = 0;

        // Configuration
        const CONFIG = {
            starCount: 200,
            emberCount: 80,
            flameCount: 150,
            grassBlades: 400,
            meteorInterval: 300 // frames
        };

        // State
        let stars = [];
        let meteors = [];
        let flames = [];
        let embers = [];
        let grass = [];
        let logs = [];
        let stones = [];
        let trees = [];

        // --- UTILS ---
        const rand = (min, max) => Math.random() * (max - min) + min;
        const lerp = (a, b, t) => a + (b - a) * t;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            initScene();
        }

        // --- CLASSES ---

        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.6; // Top 60%
                this.size = Math.random() * 1.5;
                this.alpha = Math.random();
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
            }

            draw() {
                const flicker = Math.sin(time * this.twinkleSpeed) * 0.5 + 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * flicker})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Meteor {
            constructor() {
                this.x = Math.random() * width;
                this.y = 0;
                this.vx = -rand(2, 5);
                this.vy = rand(2, 5);
                this.len = rand(50, 150);
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y > height || this.x < 0) this.active = false;
            }

            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx));
                
                const grad = ctx.createLinearGradient(0, 0, -this.len, 0);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-this.len, 0);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Log {
            constructor(angle, length) {
                this.angle = angle;
                this.length = length;
                this.thickness = rand(15, 25);
                this.charProgress = 0; // 0 = fresh, 1 = collapsed
                this.vx = 0;
                this.vy = 0;
                this.vr = 0;
                this.collapsing = false;
            }

            update() {
                if (this.collapsing) {
                    this.charProgress += 0.002;
                    this.vx *= 0.95;
                    this.vy += 0.2; // gravity
                    this.vr *= 0.95;

                    // Move origin point relative to fire center
                    this.angle += this.vr * 0.01;
                    
                    // Apply collapse velocity
                    const rad = this.angle;
                    this.x = centerX + Math.cos(rad) * (this.length/2);
                    this.y = centerY - 50 + Math.sin(rad) * (this.length/2) + this.vy;
                    
                    if (this.charProgress > 1.5) {
                        return false; // Reset needed
                    }
                }
                return true; // Still alive
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Color interpolation: Brown -> Black/Grey
                const r = lerp(100, 20, this.charProgress);
                const g = lerp(60, 20, this.charProgress);
                const b = lerp(30, 20, this.charProgress);
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                
                // Draw Log Shape (rounded rect)
                ctx.beginPath();
                ctx.roundRect(-this.length/2, -this.thickness/2, this.length, this.thickness, 5);
                ctx.fill();
                
                // Texture detail
                ctx.strokeStyle = `rgba(0,0,0,${this.charProgress})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-this.length/4, 0);
                ctx.lineTo(this.length/4, 0);
                ctx.stroke();

                ctx.restore();
            }

            collapse() {
                this.collapsing = true;
                this.vy = rand(0, 2);
                this.vx = rand(-2, 2);
                this.vr = rand(-0.1, 0.1);
            }
        }

        class Ember {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = centerX + rand(-20, 20);
                this.y = centerY - 60;
                this.vx = rand(-0.5, 0.5);
                this.vy = rand(-2, -5); // Upwards
                this.life = 1.0;
                this.decay = rand(0.005, 0.02);
                this.size = rand(1, 3);
                this.spiral = rand(0, Math.PI * 2);
            }

            update() {
                this.spiral += 0.1;
                this.x += this.vx + Math.sin(this.spiral) * 0.5;
                this.y += this.vy;
                this.life -= this.decay;
                this.vy *= 0.99; // Air resistance

                if (this.life <= 0 || this.y < 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, ${Math.floor(150 * this.life)}, 0, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Flame {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = centerX + rand(-15, 15);
                this.y = centerY - 50;
                this.life = 1;
                this.decay = rand(0.01, 0.03);
                this.maxHeight = rand(30, 80);
                this.width = rand(5, 15);
            }

            update() {
                this.life -= this.decay;
                this.x += (Math.sin(time * 0.1 + this.x) * 0.5);
                this.y -= 2; // Rise speed
                
                if (this.life <= 0) {
                    this.reset();
                }
            }

            draw() {
                // Gradient for flame body
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.width * 2);
                gradient.addColorStop(0, `rgba(255, 255, 200, ${this.life})`); // White hot core
                gradient.addColorStop(0.4, `rgba(255, 150, 0, ${this.life * 0.8})`); // Orange
                gradient.addColorStop(1, `rgba(100, 50, 0, 0)`); // Fade out

                ctx.fillStyle = gradient;
                
                ctx.beginPath();
                // Draw a teardrop shape dynamically
                const h = this.life * this.maxHeight;
                const w = this.width * this.life;
                ctx.ellipse(this.x, this.y - h/2, w, h/2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class GrassBlade {
            constructor() {
                this.x = rand(0, width);
                this.y = height;
                this.height = rand(20, 60);
                this.phase = Math.random() * Math.PI * 2;
                this.speed = rand(0.02, 0.05);
            }

            draw() {
                // Calculate distance from fire to determine lighting
                const dx = this.x - centerX;
                const dy = this.y - centerY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // Firelight intensity based on distance
                const intensity = Math.max(0, 1 - (dist / (width * 0.4)));
                
                // Color mix: Dark green -> Firelight orange
                const r = lerp(20, 255, intensity * 0.8);
                const g = lerp(40, 100, intensity * 0.8);
                const b = lerp(20, 0, intensity * 0.8);

                const wind = Math.sin(time * this.speed + this.phase) * 10;
                
                ctx.strokeStyle = `rgb(${r},${g},${b})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(this.x + wind, this.y - this.height/2, this.x + wind * 1.5, this.y - this.height);
                ctx.stroke();
            }
        }

        // --- INITIALIZATION ---

        function initScene() {
            // Stars
            stars = [];
            for (let i = 0; i < CONFIG.starCount; i++) stars.push(new Star());

            // Embers
            embers = [];
            for (let i = 0; i < CONFIG.emberCount; i++) embers.push(new Ember());

            // Flames
            flames = [];
            for (let i = 0; i < CONFIG.flameCount; i++) flames.push(new Flame());

            // Grass
            grass = [];
            for (let i = 0; i < CONFIG.grassBlades; i++) grass.push(new GrassBlade());

            // Logs
            logs = [];
            const logCount = 5;
            for (let i = 0; i < logCount; i++) {
                const angle = (Math.PI / (logCount - 1)) * i + Math.PI / 2; // Semi-circle bottom
                logs.push(new Log(angle, rand(80, 120)));
            }

            // Stones (Ring around fire)
            stones = [];
            for (let i = 0; i < 12; i++) {
                const angle = (Math.PI * 2 / 12) * i;
                const radius = 60;
                stones.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY - 30 + Math.sin(angle) * radius * 0.5, // Perspective compression
                    size: rand(10, 20),
                    color: `rgb(${rand(50, 80)}, ${rand(50, 70)}, ${rand(60, 90)})`
                });
            }

            // Trees (Background shadows)
            trees = [];
            // Left Tree
            trees.push({
                x: width * 0.1,
                y: height * 0.8,
                height: height * 0.8,
                width: 60,
                sway: 0.001
            });
            // Right Tree
            trees.push({
                x: width * 0.9,
                y: height * 0.8,
                height: height * 0.7,
                width: 50,
                sway: 0.002
            });
        }

        // --- RENDER FUNCTIONS ---

        function drawSky() {
            // Night Sky Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#020215'); // Deep space blue
            grad.addColorStop(0.6, '#1a1a2e'); // Horizon dark blue
            grad.addColorStop(1, '#000000'); // Ground
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            stars.forEach(s => s.draw());
            meteors.forEach(m => { m.update(); m.draw(); });
        }

        function drawGround() {
            // Simple ground
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 80, width * 0.8, 200, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawFireLight() {
            // Global firelight effect
            const flicker = Math.sin(time * 0.1) * 5 + Math.sin(time * 0.13) * 5 + Math.sin(time * 0.17) * 5;
            const radius = 200 + flicker;
            
            const grad = ctx.createRadialGradient(centerX, centerY - 40, 10, centerX, centerY, radius);
            grad.addColorStop(0, 'rgba(255, 100, 20, 0.15)'); // Core glow
            grad.addColorStop(0.5, 'rgba(255, 50, 0, 0.05)'); // Mid glow
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Fade
            
            ctx.globalCompositeOperation = 'screen'; // Additive blending
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawTrees() {
            // Draw trees as silhouettes with firelight rim
            trees.forEach(tree => {
                ctx.save();
                ctx.translate(tree.x, tree.y);
                
                // Shadow/Body
                ctx.fillStyle = '#030308';
                ctx.beginPath();
                ctx.moveTo(-tree.width/2, 0);
                ctx.lineTo(-tree.width/2 + 10, -tree.height);
                // Rough top
                ctx.lineTo(0, -tree.height - 20);
                ctx.lineTo(tree.width/2 - 10, -tree.height);
                ctx.lineTo(tree.width/2, 0);
                ctx.fill();

                // Firelight rim (Edge highlight)
                // Move towards center, sway slightly
                const sway = Math.sin(time * 0.01) * 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255, 100, 0, 0.8)';
                ctx.strokeStyle = 'rgba(255, 80, 0, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.restore();
            });
        }

        function drawStones() {
            stones.forEach(stone => {
                ctx.fillStyle = stone.color;
                ctx.beginPath();
                ctx.arc(stone.x, stone.y, stone.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Firelight highlight on stones
                ctx.fillStyle = 'rgba(255, 100, 0, 0.1)';
                ctx.beginPath();
                ctx.arc(stone.x, stone.y, stone.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawLogs() {
            // Handle log respawn logic
            logs = logs.filter(log => {
                const alive = log.update();
                if (!alive) {
                    // Respawn
                    log.charProgress = 0;
                    log.x = centerX;
                    log.y = centerY - 50;
                    log.vx = 0;
                    log.vy = 0;
                    log.vr = 0;
                    log.collapsing = false;
                    // Randomize angle for variety
                    log.angle = (Math.random() * Math.PI) + Math.PI * 0.5; 
                }
                return true; // Filter logic is handled inside update usually, keeping for structure
            });

            logs.forEach(log => log.draw());
        }

        function drawParticles() {
            flames.forEach(f => { f.update(); f.draw(); });
            embers.forEach(e => { e.update(); e.draw(); });
        }

        function drawGrass() {
            grass.forEach(g => g.draw());
        }

        // --- MAIN LOOP ---

        function loop() {
            time++;

            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky & Stars
            drawSky();

            // 2. Background Trees
            drawTrees();

            // 3. Ground Base
            drawGround();

            // 4. Stones
            drawStones();

            // 5. Logs (Base layer of fire)
            drawLogs();

            // 6. Firelight Glow (Global)
            drawFireLight();

            // 7. Flames (Particles)
            drawParticles();

            // 8. Foreground Grass (Twitching)
            drawGrass();

            // Random Meteor
            if (Math.random() * 1000 < 1 / (CONFIG.meteorInterval / 60)) { // adjust rate
                meteors.push(new Meteor());
            }
            meteors = meteors.filter(m => m.active);

            requestAnimationFrame(loop);
        }

        // --- EVENTS ---

        window.addEventListener('resize', resize);
        
        // Start
        resize();
        loop();

    </script>
</body>
</html>
