<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Weaving Art</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07071a;overflow:hidden;font-family:Georgia,serif}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();
window.addEventListener('resize',resize);

/* ��─ Palette ��─ */
function hsl(h,s,l){return'hsl('+h+','+s+'%,'+l+'%'}
function hsla(h,s,l,a){return hsl(h,s,l)+'/'+a+')'}
function rand(lo,hi){return lo+Math.random()*(hi-lo)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

function generatePalette(){
  var baseHue=Math.random()*360;
  var scheme=pick(['analogous','triadic','split','monochromatic','complementary']);
  var shades=[];
  switch(scheme){
    case'analogous':
      for(var i=0;i<4;i++)shades.push({h:(baseHue+i*30-15)%360,s:rand(40,70),l:rand(28,58)});break;
    case'triadic':
      for(var i=0;i<3;i++)shades.push({h:(baseHue+i*120)%360,s:rand(40,70),l:rand(28,58)});
      shades.push({h:baseHue,s:rand(15,30),l:rand(60,80)});break;
    case'split':
      shades.push({h:baseHue,s:rand(50,70),l:rand(35,55)});
      shades.push({h:(baseHue+150)%360,s:rand(40,65),l:rand(35,55)});
      shades.push({h:(baseHue+210)%360,s:rand(40,65),l:rand(35,55)});
      shades.push({h:baseHue,s:rand(15,30),l:rand(60,80)});break;
    case'monochromatic':
      for(var i=0;i<4;i++)shades.push({h:baseHue,s:rand(25,55),l:rand(22+i*14,58-i*8)});break;
    case'complementary':
      for(var i=0;i<2;i++)shades.push({h:(baseHue+i*180)%360,s:rand(45,70),l:rand(30,55)});
      shades.push({h:baseHue,s:rand(20,40),l:rand(62,78)});
      shades.push({h:(baseHue+180)%360,s:rand(15,30),l:rand(65,82)});break;
  }
  return shades.map(function(c){return hsl(c.h,c.s,c.l)});
}
function baseColor(pal){
  var c=pick(pal);
  return c.replace('hsl(','hsla(').replace(')',',1)');
}
function shadowColor(pal){
  var c=pick(pal);
  var m=c.match(/hsl\((\d+\.?\d*), (\d+\.?\d*)%, (\d+\.?\d*)%\)/);
  if(!m)return'#000';
  var l=Math.max(0,parseInt(m[3])-18);
  return hsla(+m[1],+m[2],l,1);
}
function highlightColor(pal){
  var c=pick(pal);
  var m=c.match(/hsl\((\d+\.?\d*), (\d+\.?\d*)%, (\d+\.?\d*)%\)/);
  if(!m)return'#fff';
  var l=Math.min(100,parseInt(m[3])+18);
  return hsla(+m[1],+m[2],l,1);
}

/* ��─ Patterns ��─ */
function genPattern(type,w){
  var p=[];
  switch(type){
    case'stripes':{
      var bw=3+Math.floor(Math.random()*5);
      var pal=w.palette;
      for(var i=0;i<w;i++){
        p[i]={color:pick(pal),shadow:shadowColor(pal),highlight:highlightColor(pal)};
        p[i].phase=Math.floor(i/bw);
      }break;}
    case'diamonds':{
      var pal=w.palette;
      var sizes=[3,4,5,6];
      var sz=pick(sizes);
      var numD=2+Math.floor(Math.random()*3);
      var groups=[];
      for(var g=0;g<numD;g++){
        var colors=[];
        var used=[];
        for(var j=0;j<3;j++){
          var ci,attempts=0;
          do{ci=Math.floor(Math.random()*pal.length);attempts++}
          while(used.indexOf(ci)>=0&&attempts<20);
          used.push(ci);
          colors.push(pal[ci]);
        }
        groups.push({colors:colors});
      }
      for(var i=0;i<w;i++){
        var cx=i%sz;
        var d=Math.abs(cx-sz/2);
        var gi=Math.floor(d/(sz/(numD*1.5+0.5)));
        gi=Math.min(gi,groups.length-1);
        var col=pick(groups[gi].colors);
        var m=col.match(/hsl\((\d+\.?\d*), (\d+\.?\d*)%, (\d+\.?\d*)%\)/);
        p[i]={color:col,shadow:m?hsla(+m[1],+m[2],Math.max(0,parseInt(m[3])-18),1):'#222',highlight:m?hsla(+m[1],+m[2],Math.min(100,parseInt(m[3])+18),1):'#eee'};
        p[i].phase=0;
      }break;}
    case'chevron':{
      var pal=w.palette;
      var ch=2+Math.floor(Math.random()*4);
      for(var i=0;i<w;i++){
        var half=Math.ceil(w/2);
        var peak=(i%w<half)?i%(ch*2):(w-1-i)%(ch*2);
        var phase=Math.floor(peak/ch);
        p[i]={color:pick(pal),shadow:shadowColor(pal),highlight:highlightColor(pal),phase:phase};
      }break;}
  }
  return p;
}

/* ��─ Tapestry ��─ */
var THREAD_H=5,SHUTTLE_SPEED=2.5;
var WARP_DONE_PCT=0.35;

function createTapestry(){
  var pal=generatePalette();
  var types=['stripes','diamonds','chevron'];
  var type=pick(types);
  var cols=Math.max(25,Math.ceil(W/(THREAD_H*2.5)));
  var rows=Math.max(30,Math.ceil(H/(THREAD_H*2.5)));
  var pattern=genPattern(type,cols);
  var warpCol=[];
  for(var i=0;i<cols;i++)warpCol[i]=pick(pal);
  var warpP=[];
  for(var i=0;i<cols;i++){
    var m=warpCol[i].match(/hsl\((\d+\.?\d*), (\d+\.?\d*)%, (\d+\.?\d*)%\)/);
    warpP[i]={
      color:warpCol[i],
      shadow:m?hsla(+m[1],+m[2],Math.max(0,parseInt(m[3])-15),1):'#111',
      highlight:m?hsla(+m[1],+m[2],Math.min(100,parseInt(m[3])+15),1):'#fff'
    };
  }
  return{
    cols:cols,rows:rows,
    pattern:pattern,
    warpCol:warpCol,
    warpP:warpP,
    palette:pal,
    type:type,
    warpPhase:0,
    weftPhase:-1,
    shuttleX:0,
    shuttleDir:1,
    state:'warp',
    phasePixels:0,
    totalPhasePixels:0,
    warpComplete:false,
    totalWeft:0,
    scrollOffset:0,
    scrollTarget:0,
    scrollDone:false,
    born:Date.now()
  };
}

/* ��─ Rendering ��─ */
var tapestry=null;
var nextTapestry=null;
var nextBorn=0;
var globalTime=0;

function drawWeave(t){
  var t0=t;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(0,-t.scrollOffset);

  /* ��─ Warp threads ��─ */
  var warpVis=Math.min(1,t.warpPhase);
  if(warpVis>0){
    ctx.save();
    ctx.globalAlpha=warpVis;
    for(var c=0;c<t.cols;c++){
      var x=c*THREAD_H+THREAD_H/2;
      var p=t.warpP[c];
      var drawH=t.warpPhase*t.rows*THREAD_H;
      if(drawH<0.5)continue;
      var drawR=Math.max(1,Math.floor(drawH/THREAD_H));

      ctx.shadowColor='rgba(0,0,0,0.4)';
      ctx.shadowBlur=2;
      ctx.shadowOffsetX=0.5;
      ctx.shadowOffsetY=1;
      ctx.fillStyle=p.shadow;
      ctx.fillRect(x-0.5,0,1,drawR*THREAD_H);
      ctx.shadowColor='transparent';
      ctx.fillStyle=p.color;
      ctx.fillRect(x-0.35,0,0.7,drawR*THREAD_H);
      ctx.fillStyle=p.highlight;
      ctx.fillRect(x-0.3,0,0.4,drawR*THREAD_H);
    }
    ctx.restore();
  }

  /* ��─ Weft bands ��─ */
  if(t.warpPhase>=0.98){
    var weftStartY=Math.max(0,(t.warpPhase-0.98)*t.rows*THREAD_H);
    var weftEndY=t.weftPhase>=0?weftStartY+t.rows*THREAD_H:weftStartY;
    
    /* Completed rows */
    if(t.weftPhase>=0){
      ctx.save();
      ctx.beginPath();
      ctx.rect(0,0,W,t.rows*THREAD_H);
      ctx.clip();
      
      for(var r=0;r<t.rows;r++){
        var rowY=r*THREAD_H;
        if(rowY+t.scrollOffset>H+THREAD_H)break;
        if(rowY+t.scrollOffset<-THREAD_H)continue;
        
        var aboveWarp=Math.min(1,Math.max(0,(weftStartY-r*THREAD_H)/(THREAD_H*2)));
        if(aboveWarp<=0)continue;
        
        ctx.save();
        ctx.globalAlpha=aboveWarp;
        
        var px=t.pattern[t.cols-1-r>=0?t.cols-1-r:r];
        var col=px.color;
        var shadow=px.shadow;
        var highlight=px.highlight;
        
        /* Weft thread body */
        ctx.shadowColor='rgba(0,0,0,0.3)';
        ctx.shadowBlur=1.5;
        ctx.shadowOffsetX=0;
        ctx.shadowOffsetY=0.5;
        ctx.fillStyle=shadow;
        ctx.fillRect(0,rowY-0.5,W,1);
        ctx.shadowColor='transparent';
        ctx.fillStyle=col;
        ctx.fillRect(0,rowY-0.35,W,0.7);
        ctx.fillStyle=highlight;
        ctx.fillRect(0,rowY-0.3,W,0.35);
        
        ctx.restore();
      }
      ctx.restore();
    }
    
    /* Active shuttle row */
    if(t.weftPhase>=0){
      var activeRow=t.rows-1-t.weftPhase;
      var rowY=activeRow*THREAD_H;
      if(rowY>=0&&rowY<H+t.scrollOffset+THREAD_H*2){
        drawShuttleRow(t,rowY);
      }
    }
  }
  
  ctx.restore();
  
  /* ��─ Vignette ��─ */
  var grd=ctx.createRadialGradient(W/2,H/2+t.scrollOffset*0.3,W*0.15,W/2,H/2+t.scrollOffset*0.3,W*0.7);
  grd.addColorStop(0,'rgba(0,0,0,0)');
  grd.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);
}

function drawShuttleRow(t,rowY){
  var sx=t.shuttleX;
  var activeRow=t.rows-1-t.weftPhase;
  var px=t.pattern[t.cols-1-activeRow>=0?t.cols-1-activeRow:0];
  var col=px.color;
  var shadow=px.shadow;
  var highlight=px.highlight;
  
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,W,t.rows*THREAD_H);
  ctx.clip();
  
  /* Underneath weft for columns already passed by shuttle */
  for(var c=0;c<t.cols;c++){
    if(c*THREAD_H<=sx+THREAD_H*0.5){
      var cx=c*THREAD_H+THREAD_H/2;
      ctx.fillStyle=shadow;
      ctx.fillRect(cx-0.5,rowY-0.5,1,1);
      ctx.fillStyle=col;
      ctx.fillRect(cx-0.35,rowY-0.35,0.7,0.7);
      ctx.fillStyle=highlight;
      ctx.fillRect(cx-0.3,rowY-0.3,0.35,0.6);
    }
  }
  
  /* Shuttle */
  ctx.shadowColor='rgba(0,0,0,0.5)';
  ctx.shadowBlur=6;
  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=2;
  
  var sw=14,sh=8;
  var shaftLen=10;
  
  /* Shaft from left */
  ctx.fillStyle='#4a3520';
  ctx.fillRect(0,rowY-sh/2-0.5,Math.max(0,sx-sw/2-shaftLen),1);
  
  /* Shuttle body */
  var grad=ctx.createLinearGradient(sx,rowY-sh/2,sx,rowY+sh/2);
  grad.addColorStop(0,'#5a4a35');
  grad.addColorStop(0.3,'#7a6545');
  grad.addColorStop(0.7,'#6a5535');
  grad.addColorStop(1,'#4a3a25');
  ctx.fillStyle=grad;
  
  ctx.beginPath();
  ctx.moveTo(sx-sw/2,rowY);
  ctx.lineTo(sx-sw/2+3,rowY-sh/2);
  ctx.lineTo(sx+sw/2-3,rowY-sh/2);
  ctx.lineTo(sx+sw/2,rowY);
  ctx.lineTo(sx+sw/2-3,rowY+sh/2);
  ctx.lineTo(sx-sw/2+3,rowY+sh/2);
  ctx.closePath();
  ctx.fill();
  
  ctx.strokeStyle='#3a2a15';
  ctx.lineWidth=0.5;
  ctx.stroke();
  
  /* Thread tension */
  ctx.shadowColor='transparent';
  var tc=t.palette[t.palette.length-1];
  ctx.strokeStyle=tc;
  ctx.lineWidth=0.6;
  ctx.beginPath();
  ctx.moveTo(sx+sw/2,rowY);
  ctx.lineTo(Math.min(W,sx+sw/2+30),rowY);
  ctx.stroke();
  
  ctx.restore();
}

/* ��─ Update ��─ */
var warpSpeed=0.6;
var frameCount=0;

function update(){
  frameCount++;
  if(!tapestry)return;
  var t=tapestry;
  
  if(t.state==='warp'){
    t.phasePixels+=warpSpeed;
    t.warpPhase=Math.min(1,t.phasePixels/(t.rows*THREAD_H));
    if(t.warpPhase>=1){
      t.state='weft';
      t.warpComplete=true;
      t.weftPhase=0;
      t.shuttleX=0;
      t.shuttleDir=1;
      t.phasePixels=0;
      t.totalWeft=0;
    }
  }else if(t.state==='weft'){
    t.shuttleX+=SHUTTLE_SPEED*t.shuttleDir;
    
    if(t.shuttleDir>0&&t.shuttleX>=t.cols*THREAD_H){
      t.shuttleDir=-1;
      t.weftPhase++;
      t.totalWeft++;
      t.phasePixels=0;
      
      if(t.weftPhase>=t.rows){
        t.state='complete';
        t.scrollTarget=t.rows*THREAD_H;
        t.scrollOffset=0;
      }
    }else if(t.shuttleDir<0&&t.shuttleX<=0){
      t.shuttleDir=1;
      t.phasePixels=0;
    }
    
    t.phasePixels+=SHUTTLE_SPEED;
  }else if(t.state==='complete'){
    t.scrollOffset+=2.5;
    if(t.scrollOffset>=t.scrollTarget){
      t.scrollDone=true;
      if(Date.now()-nextBorn>600){
        tapestry=nextTapestry;
        nextTapestry=null;
        nextBorn=0;
      }
    }
  }
}

/* ��─ Next tapestry generation ��─ */
function generateNext(){
  if(nextTapestry)return;
  nextTapestry=createTapestry();
  nextBorn=Date.now();
}

/* ��─ Main loop ��─ */
function loop(){
  globalTime++;
  
  if(!tapestry){
    tapestry=createTapestry();
    generateNext();
  }
  
  if(nextTapestry&&!tapestry.scrollDone){
    generateNext();
  }
  
  update();
  drawWeave(tapestry);
  
  requestAnimationFrame(loop);
}

loop();

})();
</script>
</body>
</html>
