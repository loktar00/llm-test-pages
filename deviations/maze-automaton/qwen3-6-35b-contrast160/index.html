<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mazectric Evolving Automaton</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width = window.innerWidth;
  const H = canvas.height = window.innerHeight;
  const S = 4;
  const COLS = Math.ceil(W / S);
  const ROWS = Math.ceil(H / S);
  const TOTAL = COLS * ROWS;
  const IMG = ctx.createImageData(COLS, ROWS);
  const D = IMG.data;

  // Grid cells: 0=empty, 1=growing, 2=stabilized, 3=dead
  const grid = new Uint8Array(TOTAL);
  // Pheromone: 0=none, 1=backtrack, 2=forwardtrack
  const phero = new Uint8Array(TOTAL);
  // Pheromone intensity
  const pheroI = new Float32Array(TOTAL);

  // Seeds
  const seeds = [];
  const MAX_SEEDS = 7;
  const SEED_INTERVAL = 600;
  let globalTick = 0;

  function idx(x, y) { return y * COLS + x; }

  function inBounds(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS; }

  // Count neighbors with a state
  function countNeighbors(x, y, state, exclude) {
    let count = 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (!inBounds(nx, ny)) continue;
        const ni = idx(nx, ny);
        if (ni === exclude) continue;
        if (grid[ni] === state) count++;
      }
    }
    return count;
  }

  // CA Growth Step
  function evolveGrowth() {
    const next = new Uint8Array(TOTAL);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const i = idx(x, y);
        const s = grid[i];
        if (s === 0) {
          // Empty: birth if exactly 2 growing neighbors
          if (countNeighbors(x, y, 1, -1) === 2) {
            next[i] = 1;
          } else {
            next[i] = 0;
          }
        } else if (s === 1) {
          // Growing: survive if 2-4 growing neighbors
          const cnt = countNeighbors(x, y, 1, i);
          if (cnt >= 2 && cnt <= 4) {
            next[i] = 1;
          } else {
            next[i] = 2; // Stabilize
          }
        } else if (s === 2) {
          // Stabilized: die if isolated (0-1 neighbor)
          const cnt = countNeighbors(x, y, 2, i);
          if (cnt <= 1) {
            next[i] = 3; // Dead
          } else {
            next[i] = 2;
          }
        } else {
          next[i] = 3;
        }
      }
    }
    for (let i = 0; i < TOTAL; i++) grid[i] = next[i];
  }

  // Seed a cluster
  function addSeed() {
    if (seeds.length >= MAX_SEEDS) return;
    const cx = Math.floor(Math.random() * COLS);
    const cy = Math.floor(Math.random() * ROWS);
    const r = 1 + Math.floor(Math.random() * 2);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy <= r * r + 1) {
          const nx = cx + dx, ny = cy + dy;
          if (inBounds(nx, ny) && grid[idx(nx, ny)] === 0) {
            grid[idx(nx, ny)] = 1;
          }
        }
      }
    }
    seeds.push({ x: cx, y: cy, time: globalTick });
  }

  // Ants
  const ants = [];
  const MAX_ANTS = 40;

  function isWalkable(x, y) {
    if (!inBounds(x, y)) return false;
    const s = grid[idx(x, y)];
    return s === 0 || s === 1; // Only empty and growing cells
  }

  function spawnAnt() {
    // Find a random walkable cell
    let attempts = 0;
    while (attempts < 100) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      if (isWalkable(x, y)) {
        const i = idx(x, y);
        ants.push({
          x, y,
          dir: Math.floor(Math.random() * 4),
          trail: [],
          backtracking: true,
          backTrackLen: 0,
          alive: true
        });
        phero[i] = 1;
        pheroI[i] = 0.8;
        return;
      }
      attempts++;
    }
  }

  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

  function updateAnts() {
    // Spawn new ants periodically
    if (ants.length < MAX_ANTS && Math.random() < 0.02) {
      spawnAnt();
    }

    for (let a = ants.length - 1; a >= 0; a--) {
      const ant = ants[a];
      if (!ant.alive) continue;

      // Backtracking: follow pheromone trail
      if (ant.backtracking) {
        if (ant.trail.length === 0) {
          ant.backtracking = false;
          ant.dir = Math.floor(Math.random() * 4);
          continue;
        }
        // Find nearest trail cell in 3-cell radius
        let bestDist = 999, bestIdx = -1;
        for (let r = 0; r <= 3; r++) {
          for (let dx = -r; dx <= r; dx++) {
            for (let dy = -r; dy <= r; dy++) {
              if (Math.abs(dx) + Math.abs(dy) > r) continue;
              const tx = ant.x + dx, ty = ant.y + dy;
              if (!inBounds(tx, ty)) continue;
              const ti = idx(tx, ty);
              if (phero[ti] === 1) {
                const d = Math.abs(dx) + Math.abs(dy);
                if (d < bestDist) {
                  bestDist = d;
                  bestIdx = ti;
                }
              }
            }
          }
        }
        if (bestIdx >= 0) {
          const tx = (bestIdx % COLS);
          const ty = (bestIdx / COLS) | 0;
          const dx = tx - ant.x, dy = ty - ant.y;
          if (dx !== 0 || dy !== 0) {
            ant.dir = dx > 0 ? 0 : dx < 0 ? 2 : dy > 0 ? 1 : 3;
          }
        } else {
          ant.backtracking = false;
          ant.dir = Math.floor(Math.random() * 4);
        }
      }

      // Move
      const [ddx, ddy] = DIRS[ant.dir];
      const nx = ant.x + ddx, ny = ant.y + ddy;

      if (isWalkable(nx, ny)) {
        ant.trail.push({ x: ant.x, y: ant.y });
        if (ant.trail.length > 80) ant.trail.shift();
        ant.x = nx;
        ant.y = ny;
        const ni = idx(nx, ny);
        phero[ni] = 2;
        pheroI[ni] = 1.0;
        ant.backTrackLen = ant.trail.length;

        // Random turn occasionally
        if (Math.random() < 0.15) {
          ant.dir = (ant.dir + (Math.random() < 0.5 ? 1 : 3)) % 4;
        }
      } else {
        // Hit wall or boundary: try other directions
        let found = false;
        for (let t = 1; t <= 4; t++) {
          const td = (ant.dir + t) % 4;
          const [tdx, tdy] = DIRS[td];
          const tnx = ant.x + tdx, tny = ant.y + tdy;
          if (isWalkable(tnx, tny)) {
            ant.dir = td;
            found = true;
            break;
          }
        }
        if (!found) {
          ant.alive = false;
        }
      }

      // Remove old trail pheromone
      if (ant.trail.length > 0) {
        const old = ant.trail.shift();
        const oi = idx(old.x, old.y);
        if (phero[oi] === 1) {
          pheroI[oi] *= 0.9;
          if (pheroI[oi] < 0.05) {
            phero[oi] = 0;
            pheroI[oi] = 0;
          }
        }
      }
    }

    // Remove dead ants
    for (let i = ants.length - 1; i >= 0; i--) {
      if (!ants[i].alive) ants.splice(i, 1);
    }
  }

  // Decay pheromone
  function decayPhero() {
    for (let i = 0; i < TOTAL; i++) {
      if (phero[i] > 0) {
        pheroI[i] *= 0.985;
        if (pheroI[i] < 0.02) {
          phero[i] = 0;
          pheroI[i] = 0;
        }
      }
    }
  }

  // Render
  function render() {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const i = idx(x, y);
        const p = i * 4;
        let r = 0, g = 0, b = 0;

        const s = grid[i];
        if (s === 0) {
          // Empty: very dark
          r = 2; g = 2; b = 5;
        } else if (s === 1) {
          // Growing: cyan glow
          r = 10; g = 200; b = 255;
        } else if (s === 2) {
          // Stabilized: deep blue
          r = 15; g = 20; b = 80;
        } else {
          // Dead: dark purple
          r = 8; g = 5; b = 15;
        }

        // Add pheromone glow
        if (phero[i] > 0) {
          const intensity = pheroI[i];
          if (phero[i] === 1) {
            // Backtrack: warm orange
            r += 255 * intensity * 0.9;
            g += 120 * intensity * 0.7;
            b += 30 * intensity * 0.3;
          } else {
            // Forwardtrack: bright yellow-white
            r += 255 * intensity * 0.95;
            g += 255 * intensity * 0.9;
            b += 100 * intensity * 0.6;
          }
        }

        D[p] = Math.min(255, r);
        D[p + 1] = Math.min(255, g);
        D[p + 2] = Math.min(255, b);
        D[p + 3] = 255;
      }
    }
    ctx.putImageData(IMG, 0, 0);
  }

  // Main loop
  let frame = 0;
  function loop() {
    frame++;
    globalTick++;

    // Evolve growth every 3 frames
    if (frame % 3 === 0) {
      evolveGrowth();
    }

    // Add new seeds periodically
    if (globalTick % SEED_INTERVAL === 0) {
      addSeed();
    }

    // Update ants
    updateAnts();

    // Decay pheromone
    decayPhero();

    // Render
    render();

    requestAnimationFrame(loop);
  }

  // Initial seeds
  for (let i = 0; i < 3; i++) {
    addSeed();
  }

  // Handle resize
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // Note: resizing doesn't reinitialize grid, 
    // but that would be a visual glitch. 
    // For simplicity, we let it run as the canvas grows.
  });

  loop();
})();
</script>
</body>
</html>
