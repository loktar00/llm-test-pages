<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #0e0e10;
    --surface: #18181b;
    --surface-2: #1f1f23;
    --skeleton-base: #2a2a2e;
    --skeleton-shimmer: #3a3a40;
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --text-tertiary: #71717a;
    --accent: #8b5cf6;
    --accent-glow: rgba(139, 92, 246, 0.15);
    --border: rgba(255,255,255,0.06);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .feed-header {
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .feed-header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .reload-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .reload-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
    transform: rotate(180deg);
  }

  .reload-btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.3s ease;
  }

  .feed-container {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Card wrapper (holds both skeleton & content at same size) ── */
  .card-slot {
    position: relative;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
    overflow: hidden;
  }

  /* ── Skeleton ── */
  .skeleton {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    position: absolute;
    inset: 0;
    padding: 20px;
  }

  .sk-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sk-avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    background: var(--skeleton-base);
    position: relative;
    overflow: hidden;
  }

  .sk-meta {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sk-name {
    height: 12px;
    border-radius: 6px;
    background: var(--skeleton-base);
    width: 60%;
    position: relative;
    overflow: hidden;
  }

  .sk-time {
    height: 8px;
    border-radius: 4px;
    background: var(--skeleton-base);
    width: 35%;
    position: relative;
    overflow: hidden;
  }

  .sk-title {
    height: 16px;
    border-radius: 8px;
    background: var(--skeleton-base);
    width: 85%;
    position: relative;
    overflow: hidden;
  }

  .sk-desc {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sk-line {
    height: 10px;
    border-radius: 5px;
    background: var(--skeleton-base);
    position: relative;
    overflow: hidden;
  }

  .sk-line:nth-child(1) { width: 100%; }
  .sk-line:nth-child(2) { width: 92%; }
  .sk-line:nth-child(3) { width: 78%; }

  .sk-footer {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-top: 4px;
  }

  .sk-action {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sk-action-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--skeleton-base);
    position: relative;
    overflow: hidden;
  }

  .sk-action-text {
    height: 10px;
    border-radius: 5px;
    background: var(--skeleton-base);
    width: 32px;
    position: relative;
    overflow: hidden;
  }

  /* ── Shimmer animation ── */
  .shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      105deg,
      transparent 20%,
      var(--skeleton-shimmer) 50%,
      transparent 80%
    );
    background-size: 200% 100%;
    animation: shimmer-diag 1.6s ease-in-out infinite;
  }

  @keyframes shimmer-diag {
    0% {
      background-position: 141% 0;
    }
    100% {
      background-position: -41% 0;
    }
  }

  /* ── Content (hidden initially) ── */
  .card-content {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    position: absolute;
    inset: 0;
    padding: 20px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-content.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .content-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: white;
  }

  .avatar.a1 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
  .avatar.a2 { background: linear-gradient(135deg, #06b6d4, #0891b2); }
  .avatar.a3 { background: linear-gradient(135deg, #f59e0b, #d97706); }

  .meta {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .meta-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
  }

  .meta-time {
    font-size: 12px;
    color: var(--text-tertiary);
    line-height: 1.3;
  }

  .meta-more {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: color 0.2s;
  }

  .meta-more:hover { color: var(--text-secondary); }

  .content-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.45;
    letter-spacing: -0.2px;
  }

  .content-body {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.65;
  }

  .content-footer {
    display: flex;
    align-items: center;
    gap: 20px;
    padding-top: 4px;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-tertiary);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background: var(--surface-2);
    color: var(--text-secondary);
  }

  .action-btn svg {
    width: 16px;
    height: 16px;
  }

  .action-btn.liked {
    color: #ef4444;
  }

  /* ── Stagger delays ── */
  .card-slot:nth-child(1) .card-content { transition-delay: 0s; }
  .card-slot:nth-child(2) .card-content { transition-delay: 0.12s; }
  .card-slot:nth-child(3) .card-content { transition-delay: 0.24s; }

  .card-slot:nth-child(1) .skeleton .shimmer { animation-delay: 0s; }
  .card-slot:nth-child(2) .skeleton .shimmer { animation-delay: 0.1s; }
  .card-slot:nth-child(3) .skeleton .shimmer { animation-delay: 0.2s; }

  /* ── Loading state for skeleton fade ── */
  .skeleton {
    transition: opacity 0.35s ease;
  }

  .skeleton.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ── Subtle entrance for the whole feed ── */
  .feed-container {
    animation: feed-enter 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  @keyframes feed-enter {
    from {
      opacity: 0;
      transform: translateY(16px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }
</style>
</head>
<body>

<div class="feed-header">
  <h1>Feed</h1>
  <button class="reload-btn" id="reloadBtn" aria-label="Reload feed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
  </button>
</div>

<div class="feed-container" id="feedContainer">
  <!-- Cards injected by JS -->
</div>

<script>
const cards = [
  {
    avatar: 'A',
    avatarClass: 'a1',
    name: 'Aria Chen',
    time: '2 hours ago',
    title: 'The Art of Invisible Design',
    body: 'Great design disappears. When users don\'t notice the interface, it means the experience flows naturally — every interaction feels intuitive and every decision feels obvious.',
    likes: 284,
    comments: 42,
    shares: 18
  },
  {
    avatar: 'M',
    avatarClass: 'a2',
    name: 'Marcus Webb',
    time: '5 hours ago',
    title: 'Why We Should Build Slower',
    body: 'Speed isn\'t always the goal. Sometimes the most impactful products come from deliberate pacing — thoughtful typography, generous whitespace, and the courage to leave things out.',
    likes: 512,
    comments: 87,
    shares: 63
  },
  {
    avatar: 'J',
    avatarClass: 'a3',
    name: 'Juno Park',
    time: '8 hours ago',
    title: 'Design Systems That Scale',
    body: 'A design system isn\'t a library — it\'s a language. The best ones evolve organically with the teams that use them, adapting to new patterns while maintaining a consistent voice.',
    likes: 196,
    comments: 31,
    shares: 24
  }
];

function createCardHTML(card, index) {
  return `
    <div class="card-slot">
      <div class="skeleton" id="skeleton-${index}">
        <div class="sk-row">
          <div class="sk-avatar"><div class="shimmer"></div></div>
          <div class="sk-meta">
            <div class="sk-name"><div class="shimmer"></div></div>
            <div class="sk-time"><div class="shimmer"></div></div>
          </div>
        </div>
        <div class="sk-title"><div class="shimmer"></div></div>
        <div class="sk-desc">
          <div class="sk-line"><div class="shimmer"></div></div>
          <div class="sk-line"><div class="shimmer"></div></div>
          <div class="sk-line"><div class="shimmer"></div></div>
        </div>
        <div class="sk-footer">
          <div class="sk-action">
            <div class="sk-action-icon"><div class="shimmer"></div></div>
            <div class="sk-action-text"><div class="shimmer"></div></div>
          </div>
          <div class="sk-action">
            <div class="sk-action-icon"><div class="shimmer"></div></div>
            <div class="sk-action-text"><div class="shimmer"></div></div>
          </div>
          <div class="sk-action">
            <div class="sk-action-icon"><div class="shimmer"></div></div>
            <div class="sk-action-text"><div class="shimmer"></div></div>
          </div>
        </div>
      </div>
      <div class="card-content" id="content-${index}">
        <div class="content-header">
          <div class="avatar ${card.avatarClass}">${card.avatar}</div>
          <div class="meta">
            <span class="meta-name">${card.name}</span>
            <span class="meta-time">${card.time}</span>
          </div>
          <button class="meta-more">·</button>
        </div>
        <div class="content-title">${card.title}</div>
        <div class="content-body">${card.body}</div>
        <div class="content-footer">
          <button class="action-btn" onclick="this.classList.toggle('liked')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            ${card.likes}
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            ${card.comments}
          </button>
          <button class="action-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
              <polyline points="16 6 12 2 8 6"></polyline>
              <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
            ${card.shares}
          </button>
        </div>
      </div>
    </div>
  `;
}

function renderFeed() {
  const container = document.getElementById('feedContainer');
  container.innerHTML = cards.map((c, i) => createCardHTML(c, i)).join('');

  // Start: skeletons visible, content hidden
  // After 2s: fade skeletons out, reveal content
  setTimeout(() => {
    cards.forEach((_, i) => {
      const skeleton = document.getElementById(`skeleton-${i}`);
      const content = document.getElementById(`content-${i}`);
      if (skeleton) skeleton.classList.add('hidden');
      if (content) content.classList.add('visible');
    });
  }, 2000);
}

document.getElementById('reloadBtn').addEventListener('click', () => {
  const container = document.getElementById('feedContainer');
  container.style.animation = 'none';
  container.offsetHeight; // force reflow
  container.style.animation = '';
  renderFeed();
});

// Initial render
renderFeed();
</script>
</body>
</html>
