<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Run</title>
<style>
* { margin: 0; padding: 0; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Set up canvas to full window size
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    
    // Marble class
    class Marble {
        constructor() {
            this.reset();
            this.trail = [];
        }
        
        reset() {
            this.x = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
            this.y = -50;
            this.vx = 0;
            this.vy = 0;
            this.radius = 8 + Math.random() * 4;
            this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
            this.trail = [];
        }
        
        update() {
            // Gravity
            this.vy += 0.3;
            
            // Update position
            this.x += this.vx;
            this.y += this.vy;
            
            // Add to trail
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 10) this.trail.shift();
            
            // Reset if fallen off bottom
            if (this.y > canvas.height + 100) {
                this.reset();
            }
        }
        
        draw() {
            // Motion blur trail
            ctx.lineCap = 'round';
            for (let i = 1; i < this.trail.length; i++) {
                const t = i / this.trail.length;
                ctx.strokeStyle = this.color.replace(')', `, ${t * 0.5})`).replace('hsl', 'hsla');
                ctx.lineWidth = this.radius * t * 0.5;
                ctx.beginPath();
                ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
                ctx.stroke();
            }
            
            // Main marble
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Highlight
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(this.x - this.radius/3, this.y - this.radius/3, this.radius/3, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Course element classes
    class Ramp {
        constructor(x, y, length, angle) {
            this.x = x;
            this.y = y;
            this.length = length;
            this.angle = angle;
        }
        
        getEnd() {
            return {
                x: this.x + Math.cos(this.angle) * this.length,
                y: this.y + Math.sin(this.angle) * this.length
            };
        }
        
        draw() {
            const end = this.getEnd();
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
        }
    }
    
    class Funnel {
        constructor(x, y, radius) {
            this.x = x;
            this.y = y;
            this.radius = radius;
        }
        
        draw() {
            ctx.strokeStyle = '#CD853F';
            ctx.lineWidth = 4;
            for (let i = 0; i < 3; i++) {
                const r = this.radius - i * 15;
                if (r <= 0) break;
                ctx.beginPath();
                ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    }
    
    class Spinner {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.angle = 0;
            this.speed = 0.05 + Math.random() * 0.1;
        }
        
        update() {
            this.angle += this.speed;
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.strokeStyle = '#FF6347';
            ctx.lineWidth = 3;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(i * Math.PI/2) * 40, Math.sin(i * Math.PI/2) * 40);
                ctx.stroke();
            }
            ctx.restore();
        }
    }
    
    class Bumper {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 12;
        }
        
        draw() {
            ctx.fillStyle = '#32CD32';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#228B22';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }
    
    // Game state
    let marbles = [];
    let courseElements = [];
    let cameraY = 0;
    let lastRebuild = 0;
    
    // Initialize marbles
    for (let i = 0; i < 20; i++) {
        setTimeout(() => {
            marbles.push(new Marble());
        }, i * 300);
    }
    
    // Generate initial course
    function generateCourse() {
        courseElements = [];
        let y = 0;
        let x = canvas.width / 2;
        
        while (y < canvas.height * 4) {
            const elementType = Math.floor(Math.random() * 4);
            
            switch(elementType) {
                case 0: // Ramp
                    const length = 80 + Math.random() * 100;
                    const angle = (Math.random() - 0.5) * 0.5;
                    courseElements.push(new Ramp(x, y, length, angle));
                    x += Math.cos(angle) * length;
                    y += Math.sin(angle) * length + 20;
                    break;
                    
                case 1: // Funnel
                    courseElements.push(new Funnel(x, y, 50));
                    y += 100;
                    break;
                    
                case 2: // Spinner
                    courseElements.push(new Spinner(x, y));
                    y += 100;
                    break;
                    
                case 3: // Bumper
                    courseElements.push(new Bumper(x, y));
                    y += 60;
                    break;
            }
        }
    }
    
    generateCourse();
    
    // Rebuild course periodically
    function checkCourseRebuild() {
        const now = Date.now();
        if (now - lastRebuild > 30000) {
            generateCourse();
            lastRebuild = now;
        }
    }
    
    // Find center of marbles for camera following
    function getMarblesCenter() {
        if (marbles.length === 0) return {x: canvas.width/2, y: canvas.height/2};
        
        let sumX = 0, sumY = 0;
        let count = 0;
        
        for (let marble of marbles) {
            if (marble.y > -50 && marble.y < canvas.height + 100) {
                sumX += marble.x;
                sumY += marble.y;
                count++;
            }
        }
        
        if (count === 0) return {x: canvas.width/2, y: canvas.height/2};
        return {x: sumX/count, y: sumY/count};
    }
    
    // Animation loop
    function animate() {
        // Update camera to follow marbles
        const center = getMarblesCenter();
        cameraY = center.y - canvas.height * 0.3;
        
        // Clear canvas
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw background grid
        ctx.strokeStyle = '#16213e';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 50) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 50) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
        
        // Update and draw course elements
        for (let element of courseElements) {
            const drawY = element.y - cameraY;
            
            if (typeof element.update === 'function') {
                element.update();
            }
            
            // Only draw elements in view
            if (drawY > -200 && drawY < canvas.height + 200) {
                ctx.save();
                ctx.translate(0, -cameraY);
                element.draw();
                ctx.restore();
            }
        }
        
        // Update and draw marbles
        for (let marble of marbles) {
            marble.update();
            marble.draw();
        }
        
        // Check for course rebuild
        checkCourseRebuild();
        
        requestAnimationFrame(animate);
    }
    
    animate();
})();
</script>
</body>
</html>
