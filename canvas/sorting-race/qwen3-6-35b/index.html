<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Sorting Race</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="raceCanvas"></canvas>
    <script>
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        const SORTS = ['Bubble Sort', 'Insertion Sort', 'Merge Sort', 'Quick Sort'];
        const COLORS = [
            '#FF0055', // Red/Pink
            '#00FF99', // Green
            '#00CCFF', // Blue
            '#FFCC00'  // Yellow
        ];
        
        let width, height;
        let sorters = [];
        let globalOperationCount = 0;
        let isResting = false;
        let restingTimer = 0;
        
        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initRace();
        }
        window.addEventListener('resize', resize);

        class Sorter {
            constructor(id, name, color) {
                this.id = id;
                this.name = name;
                this.color = color;
                this.array = [];
                this.steps = [];
                this.currentStep = 0;
                this.operations = 0;
                this.finished = false;
                this.rank = 0;
                this.setupArray(100); // Default size
            }

            setupArray(count) {
                this.array = Array.from({ length: count }, () => Math.random());
                // Reset state
                this.currentStep = 0;
                this.operations = 0;
                this.finished = false;
                this.steps = [];
                this.generateSteps();
            }

            // Generate all steps for the algorithm to simulate "instant" logic but slow animation
            generateSteps() {
                // Deep copy for generation
                const arr = [...this.array];

                if (this.id === 0) { // Bubble
                    for (let i = 0; i < arr.length; i++) {
                        for (let j = 0; j < arr.length - i - 1; j++) {
                            this.steps.push({ type: 'compare', i: j, j: j + 1 });
                            if (arr[j] > arr[j + 1]) {
                                this.steps.push({ type: 'swap', i: j, j: j + 1, valA: arr[j], valB: arr[j+1] });
                                [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
                            }
                        }
                    }
                } else if (this.id === 1) { // Insertion
                    for (let i = 1; i < arr.length; i++) {
                        let key = arr[i];
                        let j = i - 1;
                        this.steps.push({ type: 'insertion_start', keyIndex: i, val: key });
                        while (j >= 0 && arr[j] > key) {
                            this.steps.push({ type: 'compare', i: j, j: j+1 });
                            this.steps.push({ type: 'move', dest: j + 1, val: arr[j] });
                            arr[j + 1] = arr[j];
                            j = j - 1;
                        }
                        this.steps.push({ type: 'compare', i: j, j: j+1 }); // Final fail compare
                        this.steps.push({ type: 'place', index: j + 1, val: key });
                    }
                } else if (this.id === 2) { // Merge
                    const helper = (arr, l, r, steps) => {
                        if (l >= r) return;
                        const mid = Math.floor((l + r) / 2);
                        helper(arr, l, mid, steps);
                        helper(arr, mid + 1, r, steps);
                        merge(arr, l, mid, r, steps);
                    };
                    const merge = (arr, l, mid, r, steps) => {
                        let temp = [];
                        let p1 = l, p2 = mid + 1;
                        while (p1 <= mid && p2 <= r) {
                            steps.push({ type: 'compare', i: p1, j: p2 });
                            if (arr[p1] < arr[p2]) {
                                temp.push(arr[p1++]);
                            } else {
                                temp.push(arr[p2++]);
                            }
                        }
                        while (p1 <= mid) {
                             steps.push({ type: 'compare', i: p1, j: r + 1 }); // Virtual comparison
                             temp.push(arr[p1++]);
                        }
                        while (p2 <= r) {
                             steps.push({ type: 'compare', i: mid + 1, j: p2 });
                             temp.push(arr[p2++]);
                        }
                        for (let i = l; i <= r; i++) {
                            steps.push({ type: 'merge_write', index: i, val: temp[i - l] });
                            arr[i] = temp[i - l];
                        }
                    };
                    helper(arr, 0, arr.length - 1, this.steps);
                } else if (this.id === 3) { // Quick
                    const helper = (arr, low, high, steps) => {
                        if (low < high) {
                            let pi = partition(arr, low, high, steps);
                            helper(arr, low, pi - 1, steps);
                            helper(arr, pi + 1, high, steps);
                        }
                    };
                    const partition = (arr, low, high, steps) => {
                        let pivot = arr[high];
                        let i = (low - 1);
                        for (let j = low; j <= high - 1; j++) {
                            steps.push({ type: 'compare', i: j, j: high, pivotIndex: high });
                            if (arr[j] < pivot) {
                                i++;
                                steps.push({ type: 'swap', i: i, j: j, valA: arr[i], valB: arr[j] });
                                [arr[i], arr[j]] = [arr[j], arr[i]];
                            }
                        }
                        steps.push({ type: 'swap', i: i + 1, j: high, valA: arr[i+1], valB: pivot });
                        [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
                        return (i + 1);
                    };
                    helper(arr, 0, arr.length - 1, this.steps);
                }
                // Add a final 'done' marker
                this.steps.push({ type: 'finish' });
            }

            update(speed) {
                if (this.finished) return;

                // Run multiple steps per frame based on speed to make it faster
                const stepsPerFrame = Math.ceil(speed);
                for (let k = 0; k < stepsPerFrame; k++) {
                    if (this.currentStep >= this.steps.length) {
                        this.finished = true;
                        return;
                    }
                    
                    const step = this.steps[this.currentStep];
                    
                    if (step.type === 'swap') {
                        this.array[step.i] = step.valB;
                        this.array[step.j] = step.valA;
                    } else if (step.type === 'move') {
                        // Only visual move in array state, logic is purely visual here for simplicity
                        // The logic was captured in step generation
                    } else if (step.type === 'place') {
                        this.array[step.index] = step.val;
                    } else if (step.type === 'merge_write') {
                        this.array[step.index] = step.val;
                    }

                    this.operations++;
                    this.currentStep++;
                }

                if (this.currentStep >= this.steps.length) {
                    this.finished = true;
                }
            }

            draw(x, y, w, h) {
                const barWidth = w / this.array.length;
                
                // Draw Bars
                for (let i = 0; i < this.array.length; i++) {
                    const val = this.array[i];
                    const barH = val * h;
                    
                    // Base color logic
                    let r, g, b;
                    if (this.id === 0) { r=255; g=0; b=85; }
                    else if (this.id === 1) { r=0; g=255; b=153; }
                    else if (this.id === 2) { r=0; g=204; b=255; }
                    else { r=255; g=204; b=0; }

                    // Find active step state
                    const step = this.steps[this.currentStep];
                    let highlight = 0; // 0: normal, 1: compare, 2: swap/move
                    
                    if (!this.finished && step) {
                        if (step.type === 'compare') {
                            if (i === step.i || i === step.j) highlight = 1;
                        } else if (step.type === 'swap') {
                            if (i === step.i || i === step.j) highlight = 2;
                        } else if (step.type === 'move') {
                            if (i === step.dest) highlight = 2;
                        } else if (step.type === 'place') {
                            if (i === step.index) highlight = 2;
                        } else if (step.type === 'merge_write') {
                            if (i === step.index) highlight = 2;
                        } else if (step.type === 'insertion_start') {
                             if (i === step.keyIndex) highlight = 1;
                        } else if (step.type === 'compare' && step.pivotIndex !== undefined) {
                             if (i === step.pivotIndex) highlight = 0; // Pivot stays default but maybe dim?
                        }
                    }

                    // Draw
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    
                    if (highlight === 1) {
                        ctx.fillStyle = 'white'; // Compare color
                    } else if (highlight === 2) {
                        ctx.fillStyle = '#FFF'; // Swap/Move color
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'white';
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    // Draw bar from bottom
                    const xPos = x + i * barWidth;
                    ctx.fillRect(xPos, y + h - barH, barWidth - 1, barH);
                    ctx.shadowBlur = 0; // Reset
                }
            }
        }

        function initRace() {
            sorters = SORTS.map((name, i) => new Sorter(i, name, COLORS[i]));
            isResting = false;
            startNewRound();
        }

        function startNewRound() {
            // Randomize array size between 50 and 200 based on screen width
            const count = Math.floor(width / 4); // roughly 1 per pixel width
            const actualCount = Math.max(50, Math.min(300, count));
            
            sorters.forEach(s => s.setupArray(actualCount));
            globalOperationCount = 0;
        }

        function update() {
            let allFinished = true;
            sorters.forEach(s => {
                if (!s.finished) {
                    allFinished = false;
                    s.update(2); // Speed multiplier
                }
            });

            if (allFinished && !isResting) {
                isResting = true;
                restingTimer = 200; // Frames to wait
                
                // Determine ranks
                // Since they start simultaneously, finish order is determined by operation count/time
                // But here we just check who is done. To make it fair, we need to know who finished 1st, 2nd...
                // Since we animate step-by-step, we can just track finish event.
            }

            if (isResting) {
                restingTimer--;
                if (restingTimer <= 0) {
                    startNewRound();
                }
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);

            if (isResting && restingTimer <= 0) {
                // Just before reshuffle, draw a big message
                ctx.fillStyle = 'white';
                ctx.font = '30px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("RESHUFFLING...", width / 2, height / 2);
                
                sorters.forEach(s => s.draw(width * 0.1, height * 0.2, width * 0.8, height * 0.6));
                return;
            }

            const panelWidth = width / 4;
            const panelHeight = height * 0.75;
            const startY = height * 0.15;

            sorters.forEach((s, i) => {
                const x = i * panelWidth;
                
                // Panel Background
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, startY - 40, panelWidth - 4, panelHeight + 60);

                // Header
                ctx.fillStyle = s.color;
                ctx.font = 'bold 16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(s.name, x + panelWidth / 2, startY - 15);

                // Draw Bars
                s.draw(x, startY, panelWidth, panelHeight);

                // Stats
                ctx.fillStyle = '#FFF';
                ctx.font = '12px Courier New';
                ctx.textAlign = 'right';
                ctx.fillText(`Ops: ${s.operations}`, x + panelWidth - 10, startY + panelHeight + 20);

                // Status
                ctx.textAlign = 'left';
                if (s.finished) {
                    ctx.fillStyle = '#0f0';
                    ctx.fillText('DONE', x + 10, startY + panelHeight + 20);
                } else {
                    ctx.fillStyle = '#555';
                    ctx.fillText('...', x + 10, startY + panelHeight + 20);
                }
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resize();
        loop();

    </script>
</body>
</html>
