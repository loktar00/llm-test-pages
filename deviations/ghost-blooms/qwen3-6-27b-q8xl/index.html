<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral Mist</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        // Configuration
        const PARTICLE_COUNT = 120;
        const NOISE_SCALE = 0.003;
        const SPEED = 1.5;
        const FOG_DECAY = 0.005; // How fast the background clears
        const COLORS = {
            cool: [
                [100, 200, 255], // Cyan
                [150, 100, 255], // Purple
                [200, 255, 255], // White Blue
                [50, 150, 255]   // Deep Blue
            ],
            warm: [
                [255, 100, 100], // Red
                [255, 200, 100]  // Orange
            ]
        };

        // Simple 2D Noise Implementation (Value Noise)
        const noise = (function() {
            const perm = new Uint8Array(512);
            const p = new Uint8Array(256);
            for(let i=0; i<256; i++) p[i] = i;
            for(let i=0; i<256; i++) {
                let r = i + Math.floor(Math.random() * (256 - i));
                let t = p[i]; p[i] = p[r]; p[r] = t;
            }
            for(let i=0; i<512; i++) perm[i] = p[i & 255];

            function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            function lerp(t, a, b) { return a + t * (b - a); }
            function grad(hash, x, y) {
                const h = hash & 15;
                const u = h < 8 ? x : y;
                const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }

            return function(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = fade(x);
                const v = fade(y);
                const A = perm[X] + Y, B = perm[X + 1] + Y;
                return lerp(v, lerp(u, grad(perm[A], x, y), grad(perm[B], x - 1, y)),
                               lerp(u, grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1)));
            };
        })();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 1.0;
                this.decay = 0.002 + Math.random() * 0.005;
                this.size = 2 + Math.random() * 4;
                
                // Initial random velocity
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * SPEED;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }

            update() {
                // Curl Noise Logic
                // To create a curl field, we take the gradient of a scalar noise field
                // and rotate it 90 degrees (swap x/y and negate one).
                // Field = (dN/dy, -dN/dx) or similar.
                
                const eps = 0.01;
                const nx = this.x * NOISE_SCALE;
                const ny = this.y * NOISE_SCALE;

                const n00 = noise(nx, ny);
                const n10 = noise(nx + eps, ny);
                const n01 = noise(nx, ny + eps);

                // Gradient
                const dx = (n10 - n00) / eps;
                const dy = (n01 - n00) / eps;

                // Curl (Rotate gradient 90 degrees)
                const curlX = dy; 
                const curlY = -dx;

                // Apply curl to velocity
                this.vx += curlX * 0.5;
                this.vy += curlY * 0.5;

                // Damping to keep them from accelerating infinitely
                this.vx *= 0.95;
                this.vy *= 0.95;

                this.x += this.vx;
                this.y += this.vy;

                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.beginPath();
                // Soft radial gradient for mist look
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                gradient.addColorStop(0, `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${this.life * 0.8})`);
                gradient.addColorStop(1, `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let particles = [];
        let lastExplosion = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createExplosion(x, y) {
            const count = PARTICLE_COUNT;
            for (let i = 0; i < count; i++) {
                // Determine color: 90% cool, 10% warm anomaly
                let color;
                if (Math.random() < 0.1) {
                    color = COLORS.warm[Math.floor(Math.random() * COLORS.warm.length)];
                } else {
                    color = COLORS.cool[Math.floor(Math.random() * COLORS.cool.length)];
                }
                particles.push(new Particle(x, y, color));
            }
        }

        function animate(timestamp) {
            // 1. Draw the "Memory" layer
            // Instead of clearing the screen, we draw a semi-transparent black rectangle.
            // This creates trails and makes old explosions look like lingering fog.
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = `rgba(0, 0, 0, ${FOG_DECAY})`;
            ctx.fillRect(0, 0, width, height);

            // 2. Additive blending for glowing effect
            ctx.globalCompositeOperation = 'lighter';

            // 3. Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 4. Auto-generate explosions occasionally
            if (timestamp - lastExplosion > 2000 + Math.random() * 3000) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                createExplosion(x, y);
                lastExplosion = timestamp;
            }

            requestAnimationFrame(animate);
        }

        // Interaction
        window.addEventListener('resize', resize);
        window.addEventListener('mousedown', (e) => {
            createExplosion(e.clientX, e.clientY);
            lastExplosion = performance.now();
        });
        
        // Touch support
        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                createExplosion(e.touches[i].clientX, e.touches[i].clientY);
            }
            lastExplosion = performance.now();
        });

        // Init
        resize();
        // Start with one burst in the center
        createExplosion(width/2, height/2);
        requestAnimationFrame(animate);

    </script>
</body>
</html>
