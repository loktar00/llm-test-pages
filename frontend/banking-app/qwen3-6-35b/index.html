<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Banking App</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --phone-frame: #111827;
            --app-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --card-radius: 24px;
            --anim-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e5e7eb;
            padding: 20px;
        }

        /* Phone Frame */
        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: var(--phone-frame);
            border-radius: 50px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 4px #333;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Notch */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: var(--phone-frame);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }

        /* App Content */
        .app-screen {
            flex: 1;
            background-color: var(--app-bg);
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header & Balance */
        .header {
            padding: 60px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info h2 {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .user-info h1 {
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 700;
        }

        .eye-toggle {
            cursor: pointer;
            padding: 8px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .eye-toggle:active {
            background: #e5e7eb;
        }

        .eye-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
        }

        .balance-container {
            padding: 0 24px 24px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .currency-symbol {
            font-size: 28px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .balance-amount {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -1px;
            transition: color 0.3s;
        }

        .currency-symbol.masked, .balance-amount.masked {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* Cards Section */
        .cards-section {
            position: relative;
            padding-top: 10px;
        }

        .cards-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 10px 24px;
            gap: 20px;
            scrollbar-width: none; /* Firefox */
        }
        .cards-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .card {
            min-width: 300px;
            height: 180px;
            border-radius: var(--card-radius);
            scroll-snap-align: center;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        
        .card:active {
            transform: scale(0.98);
        }

        .card-gradient-1 { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
        .card-gradient-2 { background: linear-gradient(135deg, #ec4899, #f43f5e); }
        .card-gradient-3 { background: linear-gradient(135deg, #3b82f6, #06b6d4); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-chip {
            width: 40px;
            height: 30px;
            background: linear-gradient(135deg, #fcd34d, #fbbf24);
            border-radius: 6px;
            opacity: 0.9;
        }

        .card-brand {
            font-weight: 700;
            font-style: italic;
            font-size: 18px;
        }

        .card-number {
            font-size: 20px;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            margin-top: 10px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            opacity: 0.9;
        }

        .card-label {
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 2px;
            opacity: 0.7;
        }

        /* Dots Indicator */
        .card-indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e5e7eb;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: var(--accent-purple);
            width: 20px;
            border-radius: 10px;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            margin-bottom: 30px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .action-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }

        .action-item:active .action-icon {
            transform: scale(0.9);
            background-color: #e5e7eb;
        }

        .action-icon svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: var(--text-primary);
            fill: none;
        }

        .action-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Transactions */
        .transactions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .see-all {
            font-size: 14px;
            color: var(--accent-purple);
            font-weight: 600;
            text-decoration: none;
        }

        .transaction-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 100px; /* Extra padding for scroll */
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .t-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
        }

        /* Category Colors */
        .cat-food { background: #fff1f2; color: #e11d48; }
        .cat-shopping { background: #eff6ff; color: #2563eb; }
        .cat-transport { background: #f0fdf4; color: #16a34a; }
        .cat-entertainment { background: #fdf4ff; color: #d946ef; }
        .cat-income { background: #ecfdf5; color: #059669; }

        .t-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .t-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .t-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .t-amount {
            font-size: 16px;
            font-weight: 700;
            text-align: right;
        }

        .t-amount.positive { color: var(--success-green); }
        .t-amount.negative { color: var(--text-primary); }
        .masked-amount { letter-spacing: 2px; color: #d1d5db; }

        /* Transaction Detail Overlay */
        .detail-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0.95);
            backdrop-filter: blur(5px);
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 60px 24px 40px;
        }

        .detail-overlay.open {
            transform: translateY(0);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .detail-main {
            text-align: center;
            margin-bottom: 40px;
        }

        .detail-amount {
            font-size: 42px;
            font-weight: 800;
            margin: 16px 0;
            color: var(--text-primary);
        }

        .detail-date {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .detail-card {
            background-color: #f9fafb;
            padding: 20px;
            border-radius: 16px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Home Indicator */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background-color: #000;
            border-radius: 10px;
            opacity: 0.2;
            z-index: 100;
        }

    </style>
</head>
