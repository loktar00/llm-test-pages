<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendulum Wave</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08080e}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
const onResize=()=>{W=C.width=innerWidth;H=C.height=innerHeight};
onResize();addEventListener('resize',onResize);

const N=24,CYCLE=60,BASE=24,AMP=0.5;
const TRAIL=90,SW=14;
const trails=Array.from({length:N},()=>[]);
const seismo=Array.from({length:N},()=>[]);
let t0=performance.now(),flash=0,lastFlash=0;

function freq(i){return(BASE+i)/CYCLE}
function ang(i,t){return AMP*Math.cos(2*Math.PI*freq(i)*t)}
function bob(i,t,px,py,L){const a=ang(i,t);return{x:px+L*Math.sin(a),y:py+L*Math.cos(a),a}}
function hue(i){return(200+i/N*160)%360}
function col(i,a){return`hsla(${hue(i)},75%,60%,${a!=null?a:1})`}

function draw(t){
  const topZ=H*0.52;
  const py=topZ*0.12;
  const mL=topZ*0.78;
  const sp=W/(N+1);

  const periods=Array.from({length:N},(_,i)=>CYCLE/(BASE+i));
  const pMin=periods[0],pMax=periods[N-1];
  const vL=periods.map(p=>mL*(0.35+0.65*((p-pMin)/(pMax-pMin))));

  X.fillStyle='#08080e';
  X.fillRect(0,0,W,H);

  X.strokeStyle='rgba(40,40,70,0.05)';
  X.lineWidth=1;
  for(let x=0;x<W;x+=50){X.beginPath();X.moveTo(x,0);X.lineTo(x,topZ);X.stroke()}
  for(let y=0;y<topZ;y+=50){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}

  X.fillStyle='rgba(70,70,110,0.25)';
  X.fillRect(sp*0.5,py-2,sp*(N+1)-sp,3);

  for(let i=0;i<N;i++){
    const px=sp*(i+1);
    const b=bob(i,t,px,py,vL[i]);

    trails[i].push({x:b.x,y:b.y});
    if(trails[i].length>TRAIL)trails[i].shift();

    for(let j=1;j<trails[i].length;j++){
      const a=j/trails[i].length*0.3;
      X.beginPath();
      X.moveTo(trails[i][j-1].x,trails[i][j-1].y);
      X.lineTo(trails[i][j].x,trails[i][j].y);
      X.strokeStyle=col(i,a);
      X.lineWidth=1.5;
      X.stroke();
    }

    X.beginPath();
    X.moveTo(px,py);
    X.lineTo(b.x,b.y);
    X.strokeStyle='rgba(170,170,200,0.18)';
    X.lineWidth=1;
    X.stroke();

    X.beginPath();
    X.arc(px,py,2,0,Math.PI*2);
    X.fillStyle='rgba(140,140,170,0.35)';
    X.fill();

    X.beginPath();
    X.arc(b.x,b.y,4.5,0,Math.PI*2);
    X.fillStyle=col(i);
    X.shadowColor=col(i,0.7);
    X.shadowBlur=12;
    X.fill();
    X.shadowBlur=0;
  }

  const sTop=topZ+10;
  const sH=H-sTop-10;
  const rowH=sH/N;

  X.fillStyle='rgba(6,6,12,0.92)';
  X.fillRect(0,sTop,W,sH);
  X.strokeStyle='rgba(60,60,100,0.12)';
  X.lineWidth=1;
  X.strokeRect(0,sTop,W,sH);

  X.beginPath();
  X.moveTo(0,topZ);
  X.lineTo(W,topZ);
  X.strokeStyle='rgba(80,80,130,0.18)';
  X.stroke();

  for(let i=0;i<N;i++){
    const a=ang(i,t);
    const xn=a/AMP;

    seismo[i].push({t,x:xn});
    while(seismo[i].length>0&&seismo[i][0].t<t-SW)seismo[i].shift();
    if(seismo[i].length>SW*120)seismo[i].splice(0,seismo[i].length-SW*60);

    const baseY=sTop+rowH*(i+0.5);
    const amp=rowH*0.38;

    X.beginPath();
    X.moveTo(0,baseY);
    X.lineTo(W,baseY);
    X.strokeStyle='rgba(45,45,75,0.07)';
    X.lineWidth=1;
    X.stroke();

    if(seismo[i].length>1){
      X.beginPath();
      for(let j=0;j<seismo[i].length;j++){
        const d=seismo[i][j];
        const px=((d.t-(t-SW))/SW)*W;
        const py=baseY+d.x*amp;
        if(j===0)X.moveTo(px,py);
        else X.lineTo(px,py);
      }
      X.strokeStyle=col(i,0.45);
      X.lineWidth=1;
      X.stroke();
    }

    const tip=seismo[i][seismo[i].length-1];
    const curX=((t-(t-SW))/SW)*W;
    X.beginPath();
    X.arc(curX,baseY+tip.x*amp,2,0,Math.PI*2);
    X.fillStyle=col(i,0.7);
    X.fill();
  }

  X.fillStyle='rgba(110,110,160,0.22)';
  X.font='9px monospace';
  for(let s=0;s<=SW;s+=3){
    const px=(s/SW)*W;
    X.fillText(-SW+s+'s',px+2,sTop+sH-3);
    X.beginPath();
    X.moveTo(px,sTop);
    X.lineTo(px,sTop+sH);
    X.strokeStyle='rgba(55,55,90,0.05)';
    X.stroke();
  }

  const ct=t%CYCLE;
  if((ct<0.25||ct>CYCLE-0.25)&&t-lastFlash>0.3){flash=1;lastFlash=t}
  if(flash>0){
    X.fillStyle=`rgba(180,190,240,${flash*0.07})`;
    X.fillRect(0,0,W,H);
    X.fillStyle=`rgba(255,255,255,${flash*0.12})`;
    X.font='bold 13px monospace';
    X.textAlign='center';
    X.fillText('◆ ALIGNMENT ◆',W/2,topZ+14);
    X.textAlign='start';
    flash*=0.93;
    if(flash<0.005)flash=0;
  }

  X.fillStyle='rgba(120,120,170,0.3)';
  X.font='11px monospace';
  X.fillText(`PENDULUM WAVE  ${N} pendulums  ${CYCLE}s cycle  t=${t.toFixed(1)}s`,10,topZ+14);
}

(function loop(){
  const now=performance.now();
  const t=(now-t0)/1000;
  draw(t);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
