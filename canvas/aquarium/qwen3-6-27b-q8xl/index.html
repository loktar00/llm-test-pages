<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquarium</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="a"></canvas>
<script>
const canvas = document.getElementById('a');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const GRAVEL_H = H * 0.12;
const WATER_TOP = 0;

// Utility
function rand(a, b) { return Math.random() * (b - a) + a; }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

// Time
let t = 0;

// ===== CAUSTICS =====
function drawCaustics() {
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.globalCompositeOperation = 'lighter';
  const cols = 12, rows = 8;
  const cw = W / cols, ch = H / rows;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const x = i * cw + cw / 2;
      const y = j * ch + ch / 2;
      const v = Math.sin(t * 0.8 + i * 1.3 + j * 0.7) *
                Math.cos(t * 0.6 + i * 0.9 - j * 1.1) *
                Math.sin(t * 0.4 + i * 0.5 + j * 1.5);
      if (v > 0.2) {
        const r = cw * 0.8 * v;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, `rgba(180,220,255,${v * 0.5})`);
        grad.addColorStop(1, 'rgba(180,220,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }
  }
  ctx.restore();
}

// ===== BACKGROUND =====
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a3d5c');
  grad.addColorStop(0.3, '#0c4a6e');
  grad.addColorStop(0.7, '#0d5478');
  grad.addColorStop(1, '#0a3d5c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// ===== GRAVEL =====
const gravelStones = [];
function initGravel() {
  gravelStones.length = 0;
  for (let i = 0; i < 300; i++) {
    gravelStones.push({
      x: rand(0, W),
      y: H - GRAVEL_H + rand(0, GRAVEL_H),
      r: rand(2, 8),
      color: `hsl(${randInt(20, 40)}, ${randInt(15, 35)}%, ${randInt(25, 45)}%)`
    });
  }
}
initGravel();

function drawGravel() {
  // Base
  const gGrad = ctx.createLinearGradient(0, H - GRAVEL_H, 0, H);
  gGrad.addColorStop(0, '#5a4a32');
  gGrad.addColorStop(1, '#3a2a18');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, H - GRAVEL_H, W, GRAVEL_H);

  for (const s of gravelStones) {
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r, s.r * 0.6, 0, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.fill();
  }
}

// ===== PLANTS =====
const plants = [];
function initPlants() {
  plants.length = 0;
  const count = Math.floor(W / 80);
  for (let i = 0; i < count; i++) {
    plants.push({
      x: rand(W * 0.05, W * 0.95),
      baseY: H - GRAVEL_H + rand(-5, 5),
      segments: randInt(6, 12),
      segLen: rand(15, 30),
      phase: rand(0, Math.PI * 2),
      speed: rand(0.8, 1.5),
      hue: randInt(90, 160),
      width: rand(3, 8)
    });
  }
}
initPlants();

function drawPlant(p) {
  ctx.save();
  ctx.strokeStyle = `hsl(${p.hue}, 50%, 25%)`;
  ctx.lineWidth = p.width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  let x = p.x, y = p.baseY;
  ctx.moveTo(x, y);
  for (let i = 0; i < p.segments; i++) {
    const sway = Math.sin(t * p.speed + p.phase + i * 0.5) * (8 + i * 2);
    x += sway * 0.3;
    y -= p.segLen;
    ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Leaves
  ctx.fillStyle = `hsl(${p.hue}, 55%, 30%)`;
  for (let i = 2; i < p.segments; i += 2) {
    const sway = Math.sin(t * p.speed + p.phase + i * 0.5) * (8 + i * 2);
    const lx = p.x + sway * 0.3 * (i / p.segments) * 2;
    const ly = p.baseY - i * p.segLen;
    const leafW = rand(4, 10);
    ctx.beginPath();
    ctx.ellipse(lx + rand(-3, 3), ly, leafW, leafW * 0.4, sway * 0.05, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ===== BUBBLES =====
const bubbles = [];
function spawnBubble() {
  bubbles.push({
    x: rand(W * 0.15, W * 0.85),
    y: H - GRAVEL_H + rand(-10, 0),
    r: rand(2, 7),
    speed: rand(0.5, 1.8),
    wobblePhase: rand(0, Math.PI * 2),
    wobbleAmp: rand(1, 3),
    wobbleSpeed: rand(2, 4),
    alpha: rand(0.3, 0.7)
  });
}

function updateBubbles() {
  if (Math.random() < 0.08) spawnBubble();
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.speed;
    b.x += Math.sin(t * b.wobbleSpeed + b.wobblePhase) * b.wobbleAmp * 0.3;
    if (b.y < -20) bubbles.splice(i, 1);
  }
}

function drawBubbles() {
  for (const b of bubbles) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(180,220,255,${b.alpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = `rgba(200,235,255,${b.alpha * 0.3})`;
    ctx.fill();
    // Highlight
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${b.alpha * 0.6})`;
    ctx.fill();
  }
}

// ===== HERMIT CRAB =====
const crab = {
  x: W * 0.5,
  y: H - GRAVEL_H + 5,
  targetX: W * 0.5,
  speed: 0.3,
  shellHue: randInt(15, 35),
  legPhase: 0,
  direction: 1,
  timer: 0
};

function updateCrab() {
  crab.timer++;
  if (crab.timer > rand(200, 600)) {
    crab.targetX = rand(W * 0.1, W * 0.9);
    crab.timer = 0;
  }
  const dx = crab.targetX - crab.x;
  if (Math.abs(dx) > 1) {
    crab.direction = dx > 0 ? 1 : -1;
    crab.x += crab.direction * crab.speed;
    crab.legPhase += 0.15;
  } else {
    crab.legPhase += 0.02;
  }
  crab.x = clamp(crab.x, 20, W - 20);
}

function drawCrab() {
  const cx = crab.x, cy = crab.y;
  const d = crab.direction;
  const lp = crab.legPhase;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(d, 1);

  // Legs
  ctx.strokeStyle = '#c47a4a';
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const legAngle = Math.sin(lp + i * 0.8) * 0.3;
    ctx.beginPath();
    ctx.moveTo(-2 + i * 3, 2);
    ctx.lineTo(-4 + i * 3, 8 + Math.sin(lp + i) * 2);
    ctx.lineTo(-6 + i * 3, 10);
    ctx.stroke();
    // Other side
    ctx.beginPath();
    ctx.moveTo(-2 + i * 3, 2);
    ctx.lineTo(-4 + i * 3, -2 + Math.sin(lp + i + 1) * 2);
    ctx.lineTo(-6 + i * 3, -4);
    ctx.stroke();
  }

  // Body
  ctx.fillStyle = '#b8683a';
  ctx.beginPath();
  ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shell
  ctx.fillStyle = `hsl(${crab.shellHue}, 55%, 40%)`;
  ctx.beginPath();
  ctx.ellipse(-2, -3, 9, 7, -0.2, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = `hsl(${crab.shellHue}, 50%, 30%)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Shell spiral
  ctx.beginPath();
  ctx.arc(-3, -5, 3, 0, Math.PI * 2);
  ctx.strokeStyle = `hsl(${crab.shellHue}, 45%, 35%)`;
  ctx.stroke();

  // Eyes
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(8, -3, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(8, 1, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Eye stalks
  ctx.strokeStyle = '#b8683a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(7, -2);
  ctx.lineTo(9, -4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(7, 2);
  ctx.lineTo(9, 3);
  ctx.stroke();

  // Claws
  ctx.fillStyle = '#c47a4a';
  ctx.beginPath();
  ctx.ellipse(12, -4, 4, 2.5, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(12, 4, 4, 2.5, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ===== FISH =====
const SPECIES = {
  clownfish: {
    name: 'Clownfish',
    bodyColor: '#ff6b2b',
    stripeColor: '#fff',
    finColor: '#ff8c4a',
    size: 1,
    speed: 1.2,
    bodyShape: 'oval',
    count: 4
  },
  bluetang: {
    name: 'Blue Tang',
    bodyColor: '#1a6bcc',
    stripeColor: '#0a2a5a',
    finColor: '#2a7ddd',
    size: 1.3,
    speed: 1.0,
    bodyShape: 'tang',
    count: 3
  },
  angelfish: {
    name: 'Angelfish',
    bodyColor: '#f0c040',
    stripeColor: '#2a2a2a',
    finColor: '#e0b030',
    size: 1.5,
    speed: 0.7,
    bodyShape: 'tall',
    count: 3
  },
  tetra: {
    name: 'Tetra',
    bodyColor: '#e04060',
    stripeColor: '#c02040',
    finColor: '#ff6080',
    size: 0.5,
    speed: 1.8,
    bodyShape: 'small',
    count: 5
  },
  pufferfish: {
    name: 'Pufferfish',
    bodyColor: '#c8a848',
    stripeColor: '#8a7030',
    finColor: '#b89838',
    size: 0.9,
    speed: 0.5,
    bodyShape: 'round',
    count: 2
  }
};

const fish = [];

function createFish(species) {
  const s = SPECIES[species];
  return {
    species,
    x: rand(W * 0.1, W * 0.9),
    y: rand(H * 0.15, H * 0.65),
    vx: rand(-1, 1) * s.speed,
    vy: rand(-0.5, 0.5) * s.speed,
    size: s.size * rand(0.85, 1.15),
    speed: s.speed,
    wanderAngle: rand(0, Math.PI * 2),
    wanderTimer: 0,
    wanderInterval: randInt(60, 180),
    dartTimer: 0,
    dartCooldown: randInt(300, 900),
    isDarting: false,
    dartVx: 0,
    dartVy: 0,
    tailPhase: rand(0, Math.PI * 2),
    tailSpeed: rand(3, 6),
    bobPhase: rand(0, Math.PI * 2),
    bobAmp: species === 'pufferfish' ? 3 : 1,
    facing: 1
  };
}

function initFish() {
  fish.length = 0;
  for (const [key, s] of Object.entries(SPECIES)) {
    for (let i = 0; i < s.count; i++) {
      fish.push(createFish(key));
    }
  }
}
initFish();

function updateFish() {
  for (const f of fish) {
    const s = SPECIES[f.species];

    // Dart cooldown
    f.dartCooldown--;
    if (f.dartCooldown <= 0 && !f.isDarting && Math.random() < 0.005) {
      f.isDarting = true;
      f.dartTimer = randInt(15, 30);
      const angle = rand(0, Math.PI * 2);
      const dartSpeed = f.speed * rand(4, 7);
      f.dartVx = Math.cos(angle) * dartSpeed;
      f.dartVy = Math.sin(angle) * dartSpeed;
      f.dartCooldown = randInt(400, 1000);
    }

    if (f.isDarting) {
      f.x += f.dartVx;
      f.y += f.dartVy;
      f.dartVx *= 0.92;
      f.dartVy *= 0.92;
      f.dartTimer--;
      if (f.dartTimer <= 0) {
        f.isDarting = false;
        f.vx = f.dartVx * 0.3;
        f.vy = f.dartVy * 0.3;
      }
    } else {
      // Wander
      f.wanderTimer++;
      if (f.wanderTimer > f.wanderInterval) {
        f.wanderAngle += rand(-1.5, 1.5);
        f.wanderTimer = 0;
        f.wanderInterval = randInt(60, 180);
      }

      const wanderForce = 0.03;
      f.vx += Math.cos(f.wanderAngle) * wanderForce;
      f.vy += Math.sin(f.wanderAngle) * wanderForce;

      // Wall avoidance
      const margin = 60;
      const avoidForce = 0.15;
      if (f.x < margin) f.vx += avoidForce * (1 - f.x / margin);
      if (f.x > W - margin) f.vx -= avoidForce * (1 - (W - f.x) / margin);
      if (f.y < margin) f.vy += avoidForce * (1 - f.y / margin);
      if (f.y > H - GRAVEL_H - margin) f.vy -= avoidForce * (1 - (H - GRAVEL_H - f.y) / margin);

      // Speed limit
      const maxSpd = f.speed * 2.5;
      const spd = Math.hypot(f.vx, f.vy);
      if (spd > maxSpd) {
        f.vx = (f.vx / spd) * maxSpd;
        f.vy = (f.vy / spd) * maxSpd;
      }

      // Damping
      f.vx *= 0.995;
      f.vy *= 0.995;

      f.x += f.vx;
      f.y += f.vy;
    }

    // Gentle bob
    f.y += Math.sin(t * 0.5 + f.bobPhase) * f.bobAmp * 0.02;

    // Clamp
    f.x = clamp(f.x, 10, W - 10);
    f.y = clamp(f.y, 10, H - GRAVEL_H - 10);

    // Facing
    if (Math.abs(f.vx) > 0.1) f.facing = f.vx > 0 ? 1 : -1;

    // Tail
    f.tailPhase += f.tailSpeed * 0.05;
  }
}

function drawFishBody(f) {
  const s = SPECIES[f.species];
  const sz = f.size * 18;
  const x = f.x, y = f.y;
  const dir = f.facing;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);

  const tailSwing = Math.sin(f.tailPhase) * 0.3;

  // Tail fin
  ctx.fillStyle = s.finColor;
  ctx.beginPath();
  if (f.species === 'angelfish') {
    ctx.moveTo(-sz * 0.7, 0);
    ctx.quadraticCurveTo(-sz * 1.2, -sz * 0.5 + tailSwing * sz, -sz * 1.4, -sz * 0.3);
    ctx.quadraticCurveTo(-sz * 1.1, tailSwing * sz * 0.5, -sz * 1.4, sz * 0.3);
    ctx.quadraticCurveTo(-sz * 1.2, sz * 0.5 + tailSwing * sz, -sz * 0.7, 0);
  } else if (f.species === 'pufferfish') {
    ctx.moveTo(-sz * 0.6, 0);
    ctx.quadraticCurveTo(-sz * 0.9, -sz * 0.25 + tailSwing * sz * 0.5, -sz * 1.0, -sz * 0.15);
    ctx.quadraticCurveTo(-sz * 0.85, tailSwing * sz * 0.3, -sz * 1.0, sz * 0.15);
    ctx.quadraticCurveTo(-sz * 0.9, sz * 0.25 + tailSwing * sz * 0.5, -sz * 0.6, 0);
  } else {
    ctx.moveTo(-sz * 0.8, 0);
    ctx.quadraticCurveTo(-sz * 1.2, -sz * 0.4 + tailSwing * sz, -sz * 1.5, -sz * 0.2);
    ctx.quadraticCurveTo(-sz * 1.1, tailSwing * sz * 0.5, -sz * 1.5, sz * 0.2);
    ctx.quadraticCurveTo(-sz * 1.2, sz * 0.4 + tailSwing * sz, -sz * 0.8, 0);
  }
  ctx.fill();

  // Body
  ctx.fillStyle = s.bodyColor;
  ctx.beginPath();
  if (f.species === 'angelfish') {
    // Tall, diamond-like
    ctx.moveTo(sz * 0.9, 0);
    ctx.quadraticCurveTo(sz * 0.5, -sz * 0.8, -sz * 0.3, -sz * 0.7);
    ctx.quadraticCurveTo(-sz * 0.7, -sz * 0.3, -sz * 0.7, 0);
    ctx.quadraticCurveTo(-sz * 0.7, sz * 0.3, -sz * 0.3, sz * 0.7);
    ctx.quadraticCurveTo(sz * 0.5, sz * 0.8, sz * 0.9, 0);
  } else if (f.species === 'pufferfish') {
    // Round
    ctx.ellipse(0, 0, sz * 0.8, sz * 0.7, 0, 0, Math.PI * 2);
  } else if (f.species === 'tetra') {
    // Small, sleek
    ctx.moveTo(sz * 0.8, 0);
    ctx.quadraticCurveTo(sz * 0.4, -sz * 0.35, -sz * 0.5, -sz * 0.25);
    ctx.quadraticCurveTo(-sz * 0.8, -sz * 0.1, -sz * 0.8, 0);
    ctx.quadraticCurveTo(-sz * 0.8, sz * 0.1, -sz * 0.5, sz * 0.25);
    ctx.quadraticCurveTo(sz * 0.4, sz * 0.35, sz * 0.8, 0);
  } else if (f.species === 'bluetang') {
    // Tang shape - laterally compressed with notch
    ctx.moveTo(sz * 0.9, 0);
    ctx.quadraticCurveTo(sz * 0.5, -sz * 0.5, -sz * 0.4, -sz * 0.45);
    ctx.quadraticCurveTo(-sz * 0.7, -sz * 0.2, -sz * 0.8, 0);
    ctx.quadraticCurveTo(-sz * 0.7, sz * 0.2, -sz * 0.4, sz * 0.45);
    ctx.quadraticCurveTo(sz * 0.5, sz * 0.5, sz * 0.9, 0);
  } else {
    // Clownfish - oval
    ctx.ellipse(0, 0, sz * 0.85, sz * 0.45, 0, 0, Math.PI * 2);
  }
  ctx.fill();

  // Stripes
  ctx.fillStyle = s.stripeColor;
  if (f.species === 'clownfish') {
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.ellipse(i * sz * 0.3, 0, sz * 0.06, sz * 0.42, 0.1 * i, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (f.species === 'bluetang') {
    ctx.beginPath();
    ctx.ellipse(sz * 0.1, 0, sz * 0.08, sz * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    // Yellow tail area
    ctx.fillStyle = '#f0c030';
    ctx.beginPath();
    ctx.moveTo(-sz * 0.5, -sz * 0.15);
    ctx.quadraticCurveTo(-sz * 0.7, 0, -sz * 0.5, sz * 0.15);
    ctx.fill();
  } else if (f.species === 'angelfish') {
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * sz * 0.2, -sz * 0.65);
      ctx.lineTo(i * sz * 0.2, sz * 0.65);
      ctx.lineWidth = sz * 0.06;
      ctx.strokeStyle = s.stripeColor;
      ctx.stroke();
    }
  } else if (f.species === 'tetra') {
    // Red stripe
    ctx.fillStyle = '#ff2040';
    ctx.beginPath();
    ctx.ellipse(0, 0, sz * 0.6, sz * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.species === 'pufferfish') {
    // Spots
    ctx.fillStyle = '#6a5820';
    const spots = [[0.2, 0.2], [-0.2, -0.15], [0.1, -0.25], [-0.15, 0.2], [0.35, 0]];
    for (const [sx, sy] of spots) {
      ctx.beginPath();
      ctx.arc(sx * sz, sy * sz, sz * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Dorsal fin
  ctx.fillStyle = s.finColor;
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  if (f.species === 'angelfish') {
    ctx.moveTo(sz * 0.3, -sz * 0.7);
    ctx.quadraticCurveTo(0, -sz * 1.3, -sz * 0.4, -sz * 0.65);
  } else if (f.species === 'pufferfish') {
    ctx.moveTo(sz * 0.1, -sz * 0.65);
    ctx.quadraticCurveTo(-sz * 0.1, -sz * 0.9, -sz * 0.3, -sz * 0.6);
  } else {
    ctx.moveTo(sz * 0.2, -sz * 0.4);
    ctx.quadraticCurveTo(0, -sz * 0.75, -sz * 0.3, -sz * 0.35);
  }
  ctx.fill();

  // Ventral fin
  ctx.beginPath();
  if (f.species === 'angelfish') {
    ctx.moveTo(sz * 0.1, sz * 0.6);
    ctx.quadraticCurveTo(-sz * 0.1, sz * 1.0, -sz * 0.3, sz * 0.55);
  } else if (f.species === 'pufferfish') {
    ctx.moveTo(sz * 0.1, sz * 0.6);
    ctx.quadraticCurveTo(-sz * 0.1, sz * 0.85, -sz * 0.3, sz * 0.55);
  } else {
    ctx.moveTo(sz * 0.1, sz * 0.35);
    ctx.quadraticCurveTo(-sz * 0.1, sz * 0.6, -sz * 0.3, sz * 0.3);
  }
  ctx.fill();
  ctx.globalAlpha = 1;

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(sz * 0.5, -sz * 0.08, sz * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(sz * 0.53, -sz * 0.08, sz * 0.07, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(sz * 0.55, -sz * 0.12, sz * 0.025, 0, Math.PI * 2);
  ctx.fill();

  // Mouth
  ctx.strokeStyle = s.stripeColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(sz * 0.75, sz * 0.02, sz * 0.06, -0.5, 0.5);
  ctx.stroke();

  ctx.restore();
}

// ===== LIGHT RAYS =====
function drawLightRays() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 5; i++) {
    const x = W * 0.2 + i * W * 0.15;
    const sway = Math.sin(t * 0.3 + i * 1.2) * 30;
    const grad = ctx.createLinearGradient(x + sway, 0, x + sway + 40, H);
    grad.addColorStop(0, 'rgba(200,230,255,0.3)');
    grad.addColorStop(0.5, 'rgba(200,230,255,0.1)');
    grad.addColorStop(1, 'rgba(200,230,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x + sway - 15, 0);
    ctx.lineTo(x + sway + 55, H);
    ctx.lineTo(x + sway + 25, H);
    ctx.lineTo(x + sway - 35, 0);
    ctx.fill();
  }
  ctx.restore();
}

// ===== WATER SURFACE =====
function drawWaterSurface() {
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let x = 0; x <= W; x += 5) {
    const y = Math.sin(t * 1.2 + x * 0.015) * 3 + Math.sin(t * 0.7 + x * 0.025) * 2;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, 15);
  ctx.lineTo(0, 15);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, -5, 0, 15);
  grad.addColorStop(0, 'rgba(150,200,255,0.4)');
  grad.addColorStop(1, 'rgba(150,200,255,0)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

// ===== MAIN LOOP =====
function frame() {
  t += 0.016;

  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawCaustics();
  drawLightRays();

  // Plants behind fish
  for (const p of plants) drawPlant(p);

  drawGravel();

  // Update & draw crab
  updateCrab();
  drawCrab();

  // Bubbles
  updateBubbles();
  drawBubbles();

  // Fish
  updateFish();
  // Sort by y for depth
  const sortedFish = [...fish].sort((a, b) => a.y - b.y);
  for (const f of sortedFish) {
    drawFishBody(f);
  }

  drawWaterSurface();

  requestAnimationFrame(frame);
}

frame();
</script>
