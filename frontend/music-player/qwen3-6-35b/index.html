<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --bg: #0e0e12;
    --card-bg: #16161d;
    --text: #f0eef6;
    --text-dim: #7a7888;
    --accent: #a78bfa;
    --accent2: #f472b6;
    --accent3: #38bdf8;
    --ring-size: 72px;
    --ring-stroke: 3px;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  .card {
    width: 380px;
    border-radius: 28px;
    padding: 32px;
    position: relative;
    transition: background 1.5s ease;
    background: linear-gradient(160deg, rgba(167,139,250,0.08) 0%, rgba(22,22,29,0.95) 50%, rgba(244,114,182,0.06) 100%);
    box-shadow:
      0 4px 60px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.04),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    background: radial-gradient(ellipse at 30% 0%, rgba(167,139,250,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(244,114,182,0.08) 0%, transparent 50%);
    pointer-events: none;
    transition: opacity 1.5s ease;
  }

  /* ── Album Art ── */
  .artwork {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    transition: transform 0.6s cubic-bezier(0.22,1,0.36,1), box-shadow 0.6s ease;
  }

  .artwork:hover {
    transform: scale(1.015);
    box-shadow: 0 12px 50px rgba(0,0,0,0.5);
  }

  .art-bg {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, #6c3baa 0%, #a78bfa 25%, #f472b6 50%, #fb923c 75%, #38bdf8 100%);
  }

  .art-shapes {
    position: absolute;
    inset: 0;
  }

  .art-shapes::before {
    content: '';
    position: absolute;
    width: 65%;
    height: 65%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 100%);
    border-radius: 20%;
    backdrop-filter: blur(2px);
  }

  .art-shapes::after {
    content: '';
    position: absolute;
    width: 120%;
    height: 120%;
    top: -10%;
    left: -10%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 40%),
      radial-gradient(circle at 70% 70%, rgba(0,0,0,0.2) 0%, transparent 50%),
      conic-gradient(from 45deg at 50% 50%, transparent 0deg, rgba(255,255,255,0.05) 60deg, transparent 120deg);
  }

  .art-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(1px);
  }

  .art-orb:nth-child(1) {
    width: 45%;
    height: 45%;
    top: 10%;
    right: -5%;
    background: radial-gradient(circle, rgba(244,114,182,0.6) 0%, transparent 70%);
    animation: orbFloat1 8s ease-in-out infinite;
  }

  .art-orb:nth-child(2) {
    width: 55%;
    height: 55%;
    bottom: -10%;
    left: -5%;
    background: radial-gradient(circle, rgba(56,189,248,0.4) 0%, transparent 70%);
    animation: orbFloat2 10s ease-in-out infinite;
  }

  .art-orb:nth-child(3) {
    width: 30%;
    height: 30%;
    top: 40%;
    left: 35%;
    background: radial-gradient(circle, rgba(251,146,60,0.5) 0%, transparent 70%);
    animation: orbFloat3 7s ease-in-out infinite;
  }

  .art-line {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transform-origin: left center;
  }

  .art-line:nth-child(4) {
    width: 80%;
    top: 35%;
    left: 10%;
    transform: rotate(-8deg);
  }

  .art-line:nth-child(5) {
    width: 60%;
    top: 60%;
    right: 5%;
    left: auto;
    transform: rotate(12deg);
  }

  .art-line:nth-child(6) {
    width: 40%;
    bottom: 20%;
    left: 20%;
    transform: rotate(-3deg);
    background: linear-gradient(90deg, transparent, rgba(167,139,250,0.3), transparent);
  }

  @keyframes orbFloat1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-15px, 12px); }
  }

  @keyframes orbFloat2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(18px, -10px); }
  }

  @keyframes orbFloat3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-8px, 15px) scale(1.1); }
  }

  /* ── Track Info ── */
  .track-info {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .track-title {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #fff 0%, #d4d0e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .track-artist {
    font-size: 0.875rem;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .skip-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    color: var(--text-dim);
  }

  .skip-btn:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text);
    transform: scale(1.08);
  }

  .skip-btn:active {
    transform: scale(0.95);
  }

  .skip-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  /* ── Play Button + Progress Ring ── */
  .play-wrapper {
    position: relative;
    width: var(--ring-size);
    height: var(--ring-size);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .progress-ring {
    position: absolute;
    inset: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    transform: rotate(-90deg);
  }

  .progress-ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: var(--ring-stroke);
  }

  .progress-ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: var(--ring-stroke);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.1s linear;
    filter: drop-shadow(0 0 6px rgba(167,139,250,0.4));
  }

  .play-btn {
    width: var(--ring-size);
    height: var(--ring-size);
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s ease;
    box-shadow: 0 4px 20px rgba(167,139,250,0.35);
  }

  .play-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 30px rgba(167,139,250,0.5);
  }

  .play-btn:active {
    transform: scale(0.96);
  }

  .play-icon, .pause-icon {
    position: absolute;
    transition: all 0.35s cubic-bezier(0.22,1,0.36,1);
  }

  .play-icon {
    opacity: 1;
    transform: scale(1) translateX(0);
  }

  .pause-icon {
    opacity: 0;
    transform: scale(0.5) translateX(0);
  }

  .is-playing .play-icon {
    opacity: 0;
    transform: scale(0.5) translateX(-8px);
  }

  .is-playing .pause-icon {
    opacity: 1;
    transform: scale(1) translateX(0);
  }

  .play-icon svg, .pause-icon svg {
    width: 22px;
    height: 22px;
    fill: white;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
  }

  .pause-icon svg {
    display: flex;
    gap: 4px;
  }

  .pause-icon svg rect {
    width: 5px;
    rx: 1.5px;
  }

  /* ── Time ── */
  .time-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }

  .time-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    font-weight: 500;
  }

  /* ── Volume ── */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
    position: relative;
    z-index: 1;
  }

  .volume-icon {
    color: var(--text-dim);
    flex-shrink: 0;
    transition: color 0.2s;
  }

  .volume-icon svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
    outline: none;
    cursor: pointer;
    position: relative;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,0.4), 0 0 0 2px rgba(167,139,250,0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .volume-slider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    box-shadow: 0 1px 10px rgba(0,0,0,0.5), 0 0 0 3px rgba(167,139,250,0.4);
  }

  .volume-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: white;
    cursor: pointer;
    border: none;
    box-shadow: 0 1px 6px rgba(0,0,0,0.4), 0 0 0 2px rgba(167,139,250,0.3);
  }

  .volume-slider::-moz-range-track {
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.08);
  }

  .volume-value {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    min-width: 30px;
    text-align: right;
    font-weight: 500;
  }

  /* ── Ambient glow ── */
  .ambient-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    transition: background 2s ease, opacity 2s ease;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
    top: -40px;
    left: -40px;
  }

  .ambient-glow-2 {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.1;
    pointer-events: none;
    z-index: 0;
    transition: background 2s ease;
    background: radial-gradient(circle, var(--accent2) 0%, transparent 70%);
    bottom: -30px;
    right: -30px;
  }

  /* ── Pulse animation when playing ── */
  @keyframes pulse {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.25; }
  }

  .is-playing .ambient-glow {
    animation: pulse 3s ease-in-out infinite;
  }

  .is-playing .ambient-glow-2 {
    animation: pulse 4s ease-in-out infinite 0.5s;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>

  <div class="artwork">
    <div class="art-bg"></div>
    <div class="art-shapes"></div>
    <div class="art-orb"></div>
    <div class="art-orb"></div>
    <div class="art-orb"></div>
    <div class="art-line"></div>
    <div class="art-line"></div>
    <div class="art-line"></div>
  </div>

  <div class="track-info">
    <div class="track-title">Midnight Gradient</div>
    <div class="track-artist">Synthwave Collective</div>
  </div>

  <div class="controls">
    <button class="skip-btn" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>

    <div class="play-wrapper" id="playWrapper">
      <svg class="progress-ring" viewBox="0 0 84 84">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#f472b6"/>
          </linearGradient>
        </defs>
        <circle class="progress-ring-bg" cx="42" cy="42" r="38"/>
        <circle class="progress-ring-fill" id="progressRing" cx="42" cy="42" r="38"/>
      </svg>
      <button class="play-btn" id="playBtn" aria-label="Play">
        <span class="play-icon">
          <svg viewBox="0 0 24 24"><path d="M8 5.14v14.72a1 1 0 0 0 1.5.86l11-7.36a1 1 0 0 0 0-1.72l-11-7.36A1 1 0 0 0 8 5.14z"/></svg>
        </span>
        <span class="pause-icon">
          <svg viewBox="0 0 24 24">
            <rect x="6" y="4" width="5" height="16" rx="1.5"/>
            <rect x="13" y="4" width="5" height="16" rx="1.5"/>
          </svg>
        </span>
      </button>
    </div>

    <button class="skip-btn" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>

  <div class="time-row">
    <span class="time-label" id="currentTime">0:00</span>
    <span class="time-label" id="totalTime">3:42</span>
  </div>

  <div class="volume-row">
    <span class="volume-icon">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="72">
    <span class="volume-value" id="volumeValue">72%</span>
  </div>
</div>

<script>
  const playBtn = document.getElementById('playBtn');
  const playWrapper = document.getElementById('playWrapper');
  const progressRing = document.getElementById('progressRing');
  const currentTimeEl = document.getElementById('currentTime');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeValue = document.getElementById('volumeValue');
  const card = document.getElementById('card');

  const totalSeconds = 222; // 3:42
  const circumference = 2 * Math.PI * 38; // ~238.76

  progressRing.style.strokeDasharray = circumference;
  progressRing.style.strokeDashoffset = circumference;

  let isPlaying = false;
  let currentSeconds = 0;
  let animFrame = null;
  let lastTimestamp = null;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function setProgress(fraction) {
    const offset = circumference * (1 - fraction);
    progressRing.style.strokeDashoffset = offset;
  }

  function animate(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    currentSeconds += delta;
    if (currentSeconds >= totalSeconds) {
      currentSeconds = 0;
    }

    const fraction = currentSeconds / totalSeconds;
    setProgress(fraction);
    currentTimeEl.textContent = formatTime(currentSeconds);

    animFrame = requestAnimationFrame(animate);
  }

  function togglePlay() {
    isPlaying = !isPlaying;

    if (isPlaying) {
      playWrapper.classList.add('is-playing');
      card.classList.add('is-playing');
      lastTimestamp = null;
      animFrame = requestAnimationFrame(animate);
    } else {
      playWrapper.classList.remove('is-playing');
      card.classList.remove('is-playing');
      if (animFrame) cancelAnimationFrame(animFrame);
    }
  }

  playBtn.addEventListener('click', togglePlay);

  volumeSlider.addEventListener('input', () => {
    volumeValue.textContent = volumeSlider.value + '%';
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentSeconds = 0;
    setProgress(0);
    currentTimeEl.textContent = '0:00';
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentSeconds = 0;
    setProgress(0);
    currentTimeEl.textContent = '0:00';
  });
</script>
</body>
</html>
