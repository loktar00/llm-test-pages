<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --glass-bg: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --glass-shadow: rgba(0,0,0,0.25);
    --text-primary: rgba(255,255,255,0.95);
    --text-secondary: rgba(255,255,255,0.55);
    --accent: #a78bfa;
    --accent-glow: rgba(167,139,250,0.4);
    --error: #f87171;
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.1);
    --input-focus: rgba(167,139,250,0.5);
  }

  @font-face {
    font-family: 'System';
    src: local('Inter'), local('Segoe UI'), local('-apple-system'), local('Helvetica Neue');
  }

  body {
    font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Animated Gradient Background ── */
  .bg {
    position: fixed;
    inset: 0;
    background: linear-gradient(
      135deg,
      #0f0c29 0%,
      #1a0a2e 15%,
      #2d1b69 30%,
      #1e1145 45%,
      #0f0c29 60%,
      #1a0a2e 75%,
      #2d1b69 90%,
      #1e1145 100%
    );
    background-size: 400% 400%;
    animation: gradientDrift 20s ease infinite;
    z-index: -2;
  }

  @keyframes gradientDrift {
    0%   { background-position: 0% 50%; }
    25%  { background-position: 100% 50%; }
    50%  { background-position: 100% 100%; }
    75%  { background-position: 0% 100%; }
    100% { background-position: 0% 50%; }
  }

  /* Ambient orbs */
  .bg::before,
  .bg::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    animation: orbFloat 15s ease-in-out infinite alternate;
  }

  .bg::before {
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, #7c3aed, transparent 70%);
    top: -15%;
    left: -10%;
    animation-duration: 18s;
  }

  .bg::after {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #2563eb, transparent 70%);
    bottom: -20%;
    right: -10%;
    animation-duration: 22s;
    animation-delay: -5s;
  }

  @keyframes orbFloat {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(60px, -40px) scale(1.1); }
    100% { transform: translate(-30px, 50px) scale(0.95); }
  }

  /* ── Glass Card ── */
  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: 48px 40px;
    margin: 20px;
    border-radius: 24px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 8px 32px var(--glass-shadow),
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 0 80px rgba(167,139,250,0.06);
    animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /* Border glow */
  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 25px;
    padding: 1px;
    background: linear-gradient(
      160deg,
      rgba(255,255,255,0.15),
      rgba(255,255,255,0.03) 40%,
      rgba(167,139,250,0.08) 70%,
      rgba(255,255,255,0.05)
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  @keyframes cardEntry {
    from {
      opacity: 0;
      transform: translateY(30px) scale(0.96);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Fallback for no backdrop-filter */
  @supports not (backdrop-filter: blur(24px)) {
    .card {
      background: rgba(15, 12, 41, 0.85);
    }
  }

  /* ── Typography ── */
  .card h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    text-align: center;
  }

  .card .subtitle {
    font-size: 0.875rem;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 36px;
    font-weight: 400;
  }

  /* ── Form Fields ── */
  .field {
    position: relative;
    margin-bottom: 24px;
  }

  .field input {
    width: 100%;
    padding: 16px 16px 8px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    -webkit-appearance: none;
  }

  .field input:focus {
    border-color: var(--input-focus);
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.12);
  }

  .field input::placeholder {
    color: transparent;
  }

  /* Floating label */
  .field label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.95rem;
    color: var(--text-secondary);
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    transform-origin: left center;
  }

  .field input:focus ~ label,
  .field input:not(:placeholder-shown) ~ label {
    top: 10px;
    transform: translateY(0) scale(0.75);
    color: var(--accent);
  }

  /* Invalid state */
  .field input.invalid {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(248,113,113,0.12);
  }

  .field.invalid label {
    color: var(--error);
  }

  /* Shake animation */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 50%, 90% { transform: translateX(-4px); }
    30%, 70% { transform: translateX(4px); }
  }

  .field.shake {
    animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }

  .field.shake input {
    animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }

  /* ── Submit Button ── */
  .btn {
    position: relative;
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.2s ease;
    letter-spacing: 0.01em;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124,58,237,0.35);
    filter: brightness(1.08);
  }

  .btn:active {
    transform: translateY(0) scale(0.985);
  }

  /* Shine sweep */
  .btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      105deg,
      transparent 20%,
      rgba(255,255,255,0.2) 50%,
      transparent 80%
    );
    transition: left 0.5s ease;
  }

  .btn:hover::after {
    left: 125%;
  }

  /* ── Forgot Password ── */
  .forgot {
    display: block;
    text-align: right;
    margin-top: 20px;
    margin-bottom: 0;
  }

  .forgot a {
    font-size: 0.8rem;
    color: var(--text-secondary);
    text-decoration: none;
    position: relative;
    transition: color 0.25s ease;
    letter-spacing: 0.01em;
  }

  .forgot a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .forgot a:hover {
    color: var(--accent);
  }

  .forgot a:hover::after {
    width: 100%;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    margin: 28px 0;
    gap: 12px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  .divider span {
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  /* ── Social Buttons ── */
  .socials {
    display: flex;
    gap: 12px;
  }

  .social-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
  }

  .social-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-1px);
  }

  .social-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--text-secondary);
    transition: fill 0.25s ease;
  }

  .social-btn:hover svg {
    fill: var(--text-primary);
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    transition: opacity 0.2s ease;
  }

  .footer a:hover {
    opacity: 0.8;
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .card {
      padding: 36px 24px;
      border-radius: 20px;
    }
    .card h1 {
      font-size: 1.5rem;
    }
  }

  /* ── Selection ── */
  ::selection {
    background: rgba(167,139,250,0.3);
    color: #fff;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
</head>
<body>

<div class="bg"></div>

<div class="card" role="main">
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to continue to your account</p>

  <form id="loginForm" novalidate>
    <div class="field" id="emailField">
      <input type="email" id="email" placeholder="Email address" autocomplete="email" required>
      <label for="email">Email address</label>
    </div>

    <div class="field" id="passwordField">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <label for="password">Password</label>
    </div>

    <button type="submit" class="btn">Sign in</button>

    <div class="forgot">
      <a href="#" onclick="event.preventDefault()">Forgot password?</a>
    </div>
  </form>

  <div class="divider"><span>or</span></div>

  <div class="socials">
    <button class="social-btn" aria-label="Sign in with Google">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    </button>
    <button class="social-btn" aria-label="Sign in with Apple">
      <svg viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
    </button>
    <button class="social-btn" aria-label="Sign in with GitHub">
      <svg viewBox="0 0 24 24"><path d="M12 1C5.37 1 0 6.37 0 13c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 13c0-6.63-5.37-12-12-12z"/></svg>
    </button>
  </div>

  <p class="footer">Don't have an account? <a href="#" onclick="event.preventDefault()">Create one</a></p>
</div>

<script>
  const form = document.getElementById('loginForm');
  const emailField = document.getElementById('emailField');
  const passwordField = document.getElementById('passwordField');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  function shakeField(field) {
    field.classList.remove('shake');
    void field.offsetWidth;
    field.classList.add('shake');
  }

  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function clearState(field) {
    field.classList.remove('invalid', 'shake');
    field.querySelector('input').classList.remove('invalid');
  }

  emailInput.addEventListener('input', () => clearState(emailField));
  passwordInput.addEventListener('input', () => clearState(passwordField));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    if (!emailInput.value.trim() || !validateEmail(emailInput.value)) {
      shakeField(emailField);
      emailInput.classList.add('invalid');
      emailField.classList.add('invalid');
      valid = false;
    }

    if (!passwordInput.value || passwordInput.value.length < 1) {
      shakeField(passwordField);
      passwordInput.classList.add('invalid');
      passwordField.classList.add('invalid');
      valid = false;
    }

    if (valid) {
      const btn = form.querySelector('.btn');
      btn.textContent = 'Signing in…';
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.8';
      setTimeout(() => {
        btn.textContent = 'Sign in';
        btn.style.pointerEvents = '';
        btn.style.opacity = '';
      }, 2000);
    }
  });
</script>

</body>
</html>
