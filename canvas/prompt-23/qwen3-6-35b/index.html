<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Speed Tunnel Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        /**
         * HIGH SPEED TUNNEL SCREENSAVER
         * Pure Vanilla JS - No Libraries
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimization: alpha false for base clear

        let width, height, cx, cy;
        
        // Configuration
        const CONFIG = {
            fov: 300,             // Field of view / Perspective depth
            baseSpeed: 20,        // Base forward velocity
            speedVariance: 15,    // Max additional speed
            tunnelRadius: 250,    // Base radius of the tunnel
            ringCount: 60,        // How many rings are currently visible
            ringSpacing: 30,      // Distance between rings in world Z
            colors: [
                '#00f3ff', // Cyan
                '#bc13fe', // Purple
                '#ff0055', // Magenta
                '#00ff88', // Neon Green
                '#ffaa00'  // Orange
            ],
            starCount: 400        // Background stars
        };

        // State
        let rings = [];
        let stars = [];
        let time = 0;
        let currentSpeed = CONFIG.baseSpeed;
        let globalOffset = 0; // For camera sway
        let hueShift = 0;

        // --- Initialization ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
            
            // Update FOV based on screen size for consistent perspective
            CONFIG.fov = Math.min(width, height) * 0.8;
        }

        function init() {
            resize();
            
            // Initialize Stars (Background)
            for (let i = 0; i < CONFIG.starCount; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * width * 4,
                    y: (Math.random() - 0.5) * height * 4,
                    z: Math.random() * 2000
                });
            }

            // Initialize Rings
            // We create a buffer of rings spaced out along the Z axis.
            // The array order will represent depth (0 is furthest, last is closest).
            // However, for easier recycling logic (FIFO), we'll manage z positions manually.
            
            for (let i = 0; i < CONFIG.ringCount; i++) {
                rings.push({
                    z: i * CONFIG.ringSpacing,
                    radius: 0,
                    wobble: Math.random() * Math.PI * 2,
                    segments: 6 + Math.floor(Math.random() * 8), // Polygons
                    shapeVar: 0.5 + Math.random() * 1.5, // Irregularity
                    colorIndex: Math.floor(Math.random() * CONFIG.colors.length)
                });
            }

            requestAnimationFrame(loop);
        }

        // --- Math Helpers ---

        function project(x, y, z) {
            // Standard perspective projection
            // We add a small offset to Z to avoid division by zero or negative near plane
            const scale = CONFIG.fov / (CONFIG.fov + z + 1);
            return {
                x: cx + x * scale,
                y: cy + y * scale,
                scale: scale
            };
        }

        function getGlobalSpeed(t) {
            // Create a wave of speed: calm -> fast -> calm -> fast
            // Using sine waves to modulate speed
            const t1 = Math.sin(t * 0.0003) * CONFIG.speedVariance;
            const t2 = Math.sin(t * 0.0007) * (CONFIG.speedVariance * 0.5);
            return CONFIG.baseSpeed + t1 + t2;
        }

        // --- Logic ---

        function update(dt) {
            time += dt;
            
            // 1. Update Speed
            currentSpeed = getGlobalSpeed(time);
            globalOffset += currentSpeed;

            // 2. Move Stars
            stars.forEach(star => {
                star.z -= currentSpeed * 0.5; // Stars move slower
                if (star.z < 1) {
                    star.z = 2000;
                    star.x = (Math.random() - 0.5) * width * 4;
                    star.y = (Math.random() - 0.5) * height * 4;
                }
            });

            // 3. Move Rings
            // We move rings towards the camera (decreasing Z)
            for (let i = 0; i < rings.length; i++) {
                let ring = rings[i];
                ring.z -= currentSpeed;

                // Reset ring if it passes the camera (Z < 0)
                if (ring.z < -CONFIG.fov) {
                    // Move to the furthest point
                    const maxZ = (CONFIG.ringCount - 1) * CONFIG.ringSpacing;
                    ring.z = maxZ;
                    
                    // Randomize properties for variety
                    ring.colorIndex = Math.floor(Math.random() * CONFIG.colors.length);
                    ring.segments = 4 + Math.floor(Math.random() * 6); // Squares to Hexagons
                    ring.wobble = Math.random() * Math.PI * 2;
                    
                    // Introduce "Tunnel Breaks" or "Open Sections"
                    // Sometimes rings are wide or missing segments
                    if (Math.random() > 0.95) {
                        ring.shapeVar = 3.0 + Math.random() * 2; // Very irregular
                    } else {
                        ring.shapeVar = 0.8 + Math.random() * 0.6; // Normal
                    }
                }

                // Add procedural drift to the ring's vertical position
                // This creates the "winding road" effect
                const drift = Math.sin(time * 0.001 + i * 0.1) * 50;
                ring.yOffset = drift; 
            }
            
            // Hue shift for atmosphere
            hueShift = Math.sin(time * 0.0002) * 30;
        }

        function draw() {
            // 1. Clear Background (Deep Space Color)
            // Use a very dark purple/black
            ctx.fillStyle = '#05000a';
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Stars (Background)
            // We use simple lines or dots for stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            
            // Optimization: Only draw stars that are visible (simple check)
            // To make stars streak, we could draw lines, but dots are cleaner for "distant" feel
            for (let i = 0; i < stars.length; i+=2) { // Skip half for performance
                const s = stars[i];
                const p = project(s.x, s.y, s.z);
                if (p.scale > 0) {
                    const size = Math.max(0.5, 2 * p.scale);
                    ctx.globalAlpha = Math.min(1, p.scale * 1.5);
                    ctx.fillRect(p.x, p.y, size, size);
                }
            }
            ctx.globalAlpha = 1;

            // 3. Draw Tunnel Rings
            // Sort rings by Z (Painter's Algorithm: Far to Near)
            // Note: In our logic, we push rings back to maxZ when they pass. 
            // So the array is not sorted. We must sort for rendering.
            
            // Optimization: Instead of full sort, we can just iterate. 
            // But sorting is safer for "tunnel" effect. 
            // Given 60 rings, sort is cheap enough.
            rings.sort((a, b) => b.z - a.z);

            // Enable additive blending for glowing effect
            ctx.globalCompositeOperation = 'lighter';

            for (let i = 0; i < rings.length; i++) {
                const ring = rings[i];
                
                // Skip if behind camera (though logic prevents this, good for safety)
                if (ring.z < -100) continue;

                // 1. Calculate Projection Parameters
                const p = project(0, 0, ring.z); // Center point projection
                if (p.scale <= 0) continue;

                // 2. Calculate Shape (Polygon)
                // We generate a polygon based on the ring's properties
                // Radius expands based on perspective scale
                // We add "wobble" to make it organic
                
                const baseRadius = CONFIG.tunnelRadius * p.scale;
                const points = [];
                
                // Calculate camera sway influence
                // The tunnel bends relative to the center screen
                const swayX = Math.sin(time * 0.0005) * 200 * p.scale;
                const swayY = Math.cos(time * 0.0007) * 100 * p.scale;
                
                // Tunnel Breaks / Openings
                // If shapeVar is high, we create a crescent or broken ring shape
                const isBroken = ring.shapeVar > 2.0;
                
                for (let j = 0; j < ring.segments; j++) {
                    const angle = (Math.PI * 2 / ring.segments) * j;
                    
                    // Add noise/perlin-ish movement
                    const noise = Math.sin(angle * 3 + time * 0.01 + ring.wobble) * (10 * p.scale);
                    
                    // If broken, shrink the radius significantly on one side
                    let rMod = 1;
                    if (isBroken) {
                        // Map angle to 0-1, if > 0.6 shrink
                        const norm = (j / ring.segments);
                        if (norm > 0.4 && norm < 0.9) {
                            rMod = 0.1; // Gap
                        }
                    }

                    const r = (baseRadius + noise) * rMod;
                    
                    // Rotate the whole ring slightly over time for twist effect
                    const twist = Math.sin(time * 0.0001) * 0.2;
                    const finalAngle = angle + twist;

                    points.push({
                        x: Math.cos(finalAngle) * r,
                        y: Math.sin(finalAngle) * r
                    });
                }

                // 3. Draw the Ring
                // Translate context to projected center
                ctx.save();
                ctx.translate(p.x, p.y + ring.yOffset * p.scale); // Apply sway

                // Style
                const color = CONFIG.colors[ring.colorIndex];
                // Add color shift based on depth (further = darker/different)
                const alpha = Math.min(1, (ring.z / 500) + 0.2); // Fade in from distance
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 2 * p.scale; // Line thickness scales with depth
                ctx.globalAlpha = alpha;
                
                // Glow effect using shadow (expensive, so only for closer rings or simplified)
                if (ring.z < 800) {
                    ctx.shadowBlur = 10 * p.scale;
                    ctx.shadowColor = color;
                } else {
                    ctx.shadowBlur = 0;
                }

                // Draw Polygon
                ctx.beginPath();
                if (points.length > 0) {
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let j = 1; j < points.length; j++) {
                        ctx.lineTo(points[j].x, points[j].y);
                    }
                    ctx.closePath();
                }
                ctx.stroke();

                // Inner Glow / Core for near rings
                if (ring.z < 300 && !isBroken) {
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.1 * alpha;
                    ctx.fill();
                }

                ctx.restore();
            }

            // 4. Draw Speed Lines (Foreground)
            // These are simple lines radiating from center to simulate fast forward motion
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const lineCount = 20;
            for(let k=0; k<lineCount; k++) {
                const angle = Math.random() * Math.PI * 2;
                const innerR = CONFIG.fov * 0.5; // Start near vanishing point
                const outerR = Math.max(width, height); // End at edge
                
                const x1 = cx + Math.cos(angle) * 10; // Near center
                const y1 = cy + Math.sin(angle) * 10;
                
                // Add some randomness to make it look like passing geometry
                const spread = 50;
                const x2 = cx + Math.cos(angle) * outerR + (Math.random()-0.5)*spread;
                const y2 = cy + Math.sin(angle) * outerR + (Math.random()-0.5)*spread;
                
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
            }
            ctx.stroke();

            // 5. Reset Composite Operation
            ctx.globalCompositeOperation = 'source-over';
            
            // 6. Vignette (CSS overlay is better, but we can do a soft radial gradient)
            // Let's add a subtle "pulse" to the center light
            const pulse = Math.sin(time * 0.005) * 0.1 + 0.2;
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, height/2);
            grad.addColorStop(0, `rgba(0, 0, 0, ${pulse})`);
            grad.addColorStop(0.5, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.8)');
            
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,width,height);
        }

        // --- Main Loop ---

        let lastTime = 0;
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(loop);
        }

        // Start
        window.addEventListener('resize', resize);
        init();

    </script>
</body>
</html>
