<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Sheepdog Trial</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #2e3b28; /* Dark green field border */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
        }
        .status { font-weight: bold; color: #ffcc00; }
        .info { font-size: 0.8em; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="status" id="statusText">Course 1: Start</div>
        <div class="info">Sheep: <span id="sheepCount">0</span></div>
