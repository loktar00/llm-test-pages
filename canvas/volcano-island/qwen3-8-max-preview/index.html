<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volcano Island — Live Field Station</title>
<style>
  :root{
    --ink:#f4ead9; --dim:rgba(244,234,217,.55); --acc:#ff7a35; --acc2:#ffc24d;
    --panel:rgba(12,10,14,.68); --line:rgba(255,150,90,.26);
    --display:'Avenir Next Condensed','Futura','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    --mono:'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,'Courier New',monospace;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0d1c}
  body{font-family:var(--mono);color:var(--ink)}
  #scene{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(120% 92% at 50% 42%, transparent 55%, rgba(4,4,12,.42) 100%)}
  .fade{position:fixed;left:0;right:0;height:110px;pointer-events:none;z-index:4}
  .fade.t{top:0;background:linear-gradient(rgba(5,4,10,.42),transparent)}
  .fade.b{bottom:0;background:linear-gradient(transparent,rgba(5,4,10,.48))}
  .hud{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);
    padding:12px 16px;border-radius:5px;backdrop-filter:blur(5px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none}
  .hud::before{content:"";position:absolute;top:-1px;left:-1px;width:13px;height:13px;
    border-top:2px solid var(--acc);border-left:2px solid var(--acc)}
  .hud button{pointer-events:auto}
  .title{top:18px;left:18px;max-width:min(430px,74vw)}
  .live{font-size:9px;letter-spacing:.32em;color:var(--dim);display:flex;align-items:center;gap:7px}
  .live i{width:7px;height:7px;border-radius:50%;background:#ff4d2e;box-shadow:0 0 10px #ff4d2e;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.22}}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,42px);
    letter-spacing:.12em;line-height:1;margin:7px 0 5px;text-shadow:0 2px 18px rgba(0,0,0,.55)}
  h1 em{font-style:normal;color:var(--acc)}
  .sub{font-size:9px;letter-spacing:.22em;color:var(--dim)}
  .clock{top:18px;right:18px;display:flex;align-items:center;gap:12px}
  .clock canvas{width:56px;height:56px}
  .ct{display:flex;flex-direction:column;gap:3px}
  .ct b{font-size:15px;letter-spacing:.12em}
  .ct span{font-size:9px;letter-spacing:.26em;color:var(--dim)}
  .seismo{bottom:18px;left:18px}
  .srow{display:flex;justify-content:space-between;gap:18px;font-size:9px;
    letter-spacing:.24em;color:var(--dim);margin-bottom:7px}
  .srow b{color:var(--acc2)}
  .seismo canvas{width:260px;height:56px;display:block}
  .phase{bottom:18px;left:50%;transform:translateX(-50%);text-align:center;max-width:94vw}
  #chips{list-style:none;display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
  #chips button{appearance:none;background:none;border:none;border-bottom:2px solid transparent;
    color:rgba(244,234,217,.42);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
    padding:6px 9px 7px;cursor:pointer;transition:color .25s,transform .25s,border-color .25s}
  #chips button:hover{color:var(--ink);transform:translateY(-1px)}
  #chips button.on{color:var(--acc2);border-bottom-color:var(--acc);text-shadow:0 0 12px rgba(255,140,60,.7)}
  .track{height:3px;background:rgba(255,255,255,.09);margin:8px auto 9px;width:min(430px,72vw);overflow:hidden}
  .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3d1f,#ffb23d)}
  #pdesc{font-family:var(--serif);font-style:italic;font-size:11.5px;letter-spacing:.04em;color:var(--dim)}
  .ctrl{bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .btn{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink);
    background:rgba(255,122,53,.08);border:1px solid rgba(255,150,90,.4);
    padding:7px 12px;border-radius:3px;cursor:pointer;transition:all .2s}
  .btn:hover{background:rgba(255,122,53,.22);border-color:var(--acc);box-shadow:0 0 14px rgba(255,110,40,.25)}
  .btn:active{transform:translateY(1px)}
  .btn.act{background:var(--acc);color:#1a0d06;font-weight:700}
  .hint{font-size:8.5px;letter-spacing:.24em;color:rgba(244,234,217,.4)}
  #paused{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:6;
    font-size:11px;letter-spacing:.4em;color:var(--acc2);border:1px solid var(--acc);
    padding:8px 14px 8px 20px;background:rgba(20,10,6,.82);display:none;animation:blink 1.2s infinite}
  body.paused #paused{display:block}
  @media(max-width:960px){.seismo,.sub,.hint,#pdesc{display:none}.ct span:last-child{display:none}}
  @media(max-width:620px){.ctrl{display:none}h1{font-size:22px}.title{padding:9px 12px}.phase{padding:8px 10px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vig"></div><div class="fade t"></div><div class="fade b"></div>

<header class="hud title">
  <p class="live"><i></i>LIVE · PACIFIC FIELD STATION V-03</p>
  <h1>VOLCANO <em>ISLAND</em></h1>
  <p class="sub">MT. KAHU · 1 247 M · FULL ERUPTIVE CYCLE 60 S · DAY-NIGHT 60 S</p>
</header>

<div class="hud clock">
  <canvas id="dial" width="112" height="112"></canvas>
  <div class="ct"><b id="ctime">T+00:00</b><span id="cperiod">DAWN</span><span>CYCLE · 60 S</span></div>
</div>

<div class="hud seismo">
  <div class="srow"><span>SEISMOGRAPH · STN V-03</span><b id="mag">MAG 0.3</b></div>
  <canvas id="seis" width="520" height="112"></canvas>
</div>

<div class="hud phase">
  <ol id="chips">
    <li><button data-p="0">01 QUIET</button></li>
    <li><button data-p="1">02 RUMBLE</button></li>
    <li><button data-p="2">03 ASH PLUME</button></li>
    <li><button data-p="3">04 ERUPTION</button></li>
    <li><button data-p="4">05 LAVA FLOW</button></li>
    <li><button data-p="5">06 COOLDOWN</button></li>
  </ol>
  <div class="track"><i id="pbar"></i></div>
  <p id="pdesc"></p>
</div>

<div class="hud ctrl">
  <button id="sndBtn" class="btn">SOUND · OFF</button>
  <button id="pauseBtn" class="btn">PAUSE · SPACE</button>
  <p class="hint">CLICK THE VOLCANO TO PROVOKE IT</p>
</div>

<div id="paused">‖ PAUSED</div>

<script>
(()=>{ 'use strict';
const TAU=Math.PI*2;
const rand=(a=1,b)=>b===void 0?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hx=s=>{const n=parseInt(s.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

const cv=document.getElementById('scene'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;

/* ---------- world geometry ---------- */
let seaY,peakX,peakY,crHW,crD,x0,x1,beachY,shoreX,deltaMax;
let sil=[],mPath=null,flowPts=[],speckles=[],stars=[],clouds=[],islet={};
const palms=[];

function groundAt(x){const p=sil;if(!p.length)return 0;
 if(x<=p[0][0])return p[0][1];if(x>=p[p.length-1][0])return p[p.length-1][1];
 for(let i=0;i<p.length-1;i++){if(x<=p[i+1][0]){const k=(x-p[i][0])/((p[i+1][0]-p[i][0])||1);return lerp(p[i][1],p[i+1][1],k);}}
 return seaY;}
const isLand=x=>x>x0&&x<shoreX;

function buildWorld(){
 seaY=H*0.68; x0=W*0.105; x1=W*0.90; peakX=W*0.40; peakY=H*0.185;
 crHW=Math.max(30,W*0.034); crD=H*0.038; beachY=seaY-H*0.013; shoreX=W*0.862; deltaMax=W*0.052;
 sil=[
  [x0-W*0.07,seaY+H*0.12],[x0,seaY+3],
  [W*0.165,H*0.565],[W*0.245,H*0.44],[W*0.318,H*0.295],
  [peakX-crHW,peakY],[peakX-crHW*0.42,peakY+crD],[peakX+crHW*0.42,peakY+crD],[peakX+crHW,peakY],
  [W*0.505,H*0.34],[W*0.585,H*0.46],[W*0.66,H*0.56],[W*0.708,beachY],
  [W*0.80,beachY],[shoreX,beachY],[x1,seaY+H*0.07]
 ];
 mPath=new Path2D();mPath.moveTo(sil[0][0],sil[0][1]);
 for(let i=1;i<sil.length;i++)mPath.lineTo(sil[i][0],sil[i][1]);mPath.closePath();
 flowPts=[];
 for(let x=peakX+crHW*0.25;x<=shoreX+6;x+=7)flowPts.push({x,y:groundAt(x)-2,ox:rand(-4,4),oy:rand(-3,2),rr:rand(3.5,7)});
 speckles=[];
 for(let i=0;i<150;i++){const x=rand(x0+10,shoreX-6),gy=groundAt(x);
  speckles.push({x,y:rand(gy+8,seaY+30),r:rand(1,3),a:rand(.05,.16)});}
 stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random(),y:Math.random()*0.55,r:rand(.5,1.4),tw:rand(TAU),sp:rand(.8,2.6)});
 clouds=[];for(let i=0;i<6;i++){const puffs=[];const n=4+(Math.random()*3|0);
  for(let j=0;j<n;j++)puffs.push([rand(-70,70),rand(-16,10),rand(28,58)]);
  clouds.push({x:rand(W),y:rand(H*0.05,H*0.30),s:rand(.7,1.5),v:rand(5,14),puffs});}
 islet={x:W*0.075,w:W*0.11,h:H*0.05};
 palms.length=0;
 for(const[px,h,lean]of[[.735,.115,1],[.775,.148,-1],[.818,.10,1]])
  palms.push({x:W*px,h:H*h,lean,ph:rand(TAU),fr:7+(Math.random()*2|0)});
 for(const b of birds){if(b.x<-500){b.x=birdCX()+Math.cos(b.a)*b.rx*W;b.y=b.cy*H;}}
}
const birdCX=()=>W*0.56;
const birds=[];for(let i=0;i<7;i++)birds.push({a:rand(TAU),sp:rand(.22,.4)*(Math.random()<.5?-1:1),
 rx:rand(.15,.26),ry:rand(.045,.085),cy:rand(.22,.33),fl:rand(TAU),fs:rand(7,10),st:'orbit',x:-999,y:-999,vx:0,vy:0});

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);buildWorld();P.length=0;B.length=0;R.length=0;}
addEventListener('resize',resize);

/* ---------- sprites ---------- */
function sprite(fn){const c=document.createElement('canvas');c.width=c.height=64;fn(c.getContext('2d'));return c;}
const SPR={
 steam:sprite(g=>{const r=g.createRadialGradient(32,32,2,32,32,30);
  r.addColorStop(0,'rgba(255,255,255,.85)');r.addColorStop(.55,'rgba(255,255,255,.32)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);}),
 ash:sprite(g=>{const r=g.createRadialGradient(32,32,2,32,32,30);
  r.addColorStop(0,'rgba(72,62,66,.9)');r.addColorStop(.6,'rgba(72,62,66,.4)');r.addColorStop(1,'rgba(72,62,66,0)');g.fillStyle=r;g.fillRect(0,0,64,64);}),
 smoke:sprite(g=>{const r=g.createRadialGradient(32,32,2,32,32,30);
  r.addColorStop(0,'rgba(52,46,52,.85)');r.addColorStop(.6,'rgba(52,46,52,.35)');r.addColorStop(1,'rgba(52,46,52,0)');g.fillStyle=r;g.fillRect(0,0,64,64);}),
 glow:sprite(g=>{const r=g.createRadialGradient(32,32,1,32,32,31);
  r.addColorStop(0,'rgba(255,236,170,1)');r.addColorStop(.25,'rgba(255,150,50,.75)');r.addColorStop(1,'rgba(255,80,10,0)');g.fillStyle=r;g.fillRect(0,0,64,64);}),
};

/* ---------- sky ---------- */
const SKY=[
 [0.00,'#31407c','#d9825f','#f7c877'],[0.07,'#4f8fc7','#a6d3e3','#fdeec6'],
 [0.25,'#2f97d9','#8fd4ec','#e9f7f0'],[0.40,'#4f86bd','#e0a06e','#ffd98f'],
 [0.50,'#474077','#d96a4f','#ffb36b'],[0.58,'#232a55','#5f4a76','#c97b55'],
 [0.68,'#0b1030','#1a2450','#2c3a66'],[0.90,'#0b1030','#17214a','#27335e'],
 [1.00,'#31407c','#d9825f','#f7c877'],
].map(([t,a,b,c])=>[t,hx(a),hx(b),hx(c)]);
function skyAt(tt){for(let i=0;i<SKY.length-1;i++){const A=SKY[i],B=SKY[i+1];
 if(tt>=A[0]&&tt<=B[0]){const k=(tt-A[0])/((B[0]-A[0])||1);return[mix(A[1],B[1],k),mix(A[2],B[2],k),mix(A[3],B[3],k)];}}
 return[SKY[0][1],SKY[0][2],SKY[0][3]];}

/* ---------- phases ---------- */
const PHASES=[
 {id:'quiet', dur:13,desc:'Steam wisps drift off the crater — the island breathes easy.'},
 {id:'rumble',dur:6, desc:'Low tremors roll through the basalt. Palms shiver; gulls look up.'},
 {id:'plume', dur:6, desc:'A dark ash column punches into the trade winds.'},
 {id:'erupt', dur:11,desc:'Incandescent bombs arc over the surf. The sea answers with steam.'},
 {id:'flow',  dur:15,desc:'Molten lava crawls seaward, crusting black as it builds new shore.'},
 {id:'cool',  dur:9, desc:'Fresh rock coals to black. Waves nibble the new land away.'},
];
let phaseIdx=0,phaseT=0,t=0,paused=false;
let glow=.15,glowSpike=0,shake=0,shakeSpike=0,tremor=0;
let bombTimer=0,boltTimer=2,bolts=[],skyFlash=0;
let flowProg=0,flowAlpha=0,crustClock=0,dLen=0,dHeat=0,birdsReturnAt=0;
let wispAcc=0,ashAcc=0,steamAcc=0,wind=12;
const P=[],B=[],R=[],FX=[];

const chipsEls=[...document.querySelectorAll('#chips button')];
const pdesc=document.getElementById('pdesc'),pbar=document.getElementById('pbar');
chipsEls.forEach(el=>el.addEventListener('click',()=>setPhase(+el.dataset.p)));

function setPhase(i){phaseIdx=i;phaseT=0;const id=PHASES[i].id;
 chipsEls.forEach((el,j)=>el.classList.toggle('on',j===i));
 pdesc.textContent=PHASES[i].desc;
 if(id==='quiet'){flowAlpha=0;flowProg=0;dLen=0;dHeat=0;crustClock=0;}
 if(id==='erupt'){birdsFlee();bombTimer=.25;boltTimer=rand(.5,1.5);}
 if(id==='flow'){flowProg=0;crustClock=0;flowAlpha=1;dLen=0;dHeat=1;birdsReturnAt=t+5;}
}

/* ---------- birds ---------- */
function birdsFlee(){const cx=birdCX();for(const b of birds){if(b.st==='away')continue;
 b.st='flee';b.vx=(b.x<cx?-1:1)*rand(240,340);b.vy=-rand(50,130);b.fs=15;}}
function birdsReturn(){for(const b of birds){const side=Math.random()<.5?-1:1;
 b.x=side<0?-60:W+60;b.y=rand(H*.15,H*.35);b.st='return';b.fs=11;}}
function updBirds(dt){const cx=birdCX();
 for(const b of birds){b.fl+=b.fs*dt;
  if(b.st==='orbit'){b.a+=b.sp*dt;
   const tx=cx+Math.cos(b.a)*b.rx*W,ty=b.cy*H+Math.sin(b.a*2)*b.ry*H,k=Math.min(1,dt*3);
   b.x+=(tx-b.x)*k;b.y+=(ty-b.y)*k;}
  else if(b.st==='flee'){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy-=10*dt;
   if(b.x<-80||b.x>W+80||b.y<-80)b.st='away';}
  else if(b.st==='return'){b.a+=b.sp*dt;
   const tx=cx+Math.cos(b.a)*b.rx*W,ty=b.cy*H+Math.sin(b.a*2)*b.ry*H;
   const dx=tx-b.x,dy=ty-b.y;
   b.vx+=(dx*2.5-b.vx)*Math.min(1,dt*1.8);b.vy+=(dy*2.5-b.vy)*Math.min(1,dt*1.8);
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(dx*dx+dy*dy<900)b.st='orbit';}}}
function drawBirds(dayF){ctx.strokeStyle=dayF>.45?css([28,34,44],.92):css([168,180,205],.85);
 ctx.lineWidth=1.8;ctx.lineCap='round';
 for(const b of birds){if(b.st==='away')continue;const s=7,w=Math.sin(b.fl)*s*.8;
  ctx.beginPath();ctx.moveTo(b.x-s,b.y);ctx.quadraticCurveTo(b.x-s*.35,b.y-w,b.x,b.y);
  ctx.quadraticCurveTo(b.x+s*.35,b.y-w,b.x+s,b.y);ctx.stroke();}}

/* ---------- particles ---------- */
function puff(type,x,y,vx,vy,r,life,ex){if(P.length>750)P.splice(0,40);
 P.push(Object.assign({type,x,y,vx,vy,r,life,age:0,heat:0},ex||{}));}
const GRAV=()=>H*1.05;
function updP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.age+=dt;
 if(p.age>=p.life){P.splice(i,1);continue;}
 switch(p.type){
  case'steam':p.vy-=14*dt;p.vx+=wind*.5*dt;p.r+=9*dt;break;
  case'ash':p.vy-=6*dt;if(p.vy<-46)p.vy=-46;p.vx+=(wind-p.vx)*.4*dt;p.r+=13*dt;break;
  case'smoke':p.vy-=10*dt;p.vx+=wind*.4*dt;p.r+=7*dt;break;
  case'dust':p.vy+=30*dt;p.vx*=Math.exp(-1.5*dt);p.r+=6*dt;break;
  case'spark':p.vy+=GRAV()*.5*dt;p.r*=Math.exp(-.8*dt);break;
  case'spray':p.vy+=GRAV()*.85*dt;break;
  case'ember':p.vx=0;p.vy=-2;break;
  case'ashfall':p.vx=wind*.3+Math.sin(t+p.y*.01)*6;p.vy=22;break;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;}}
function drawP(){for(const p of P){const k=p.age/p.life;
 if(p.type==='steam'){ctx.globalAlpha=(1-k)*.5;ctx.drawImage(SPR.steam,p.x-p.r,p.y-p.r,p.r*2,p.r*2);}
 else if(p.type==='ash'||p.type==='smoke'){
  if(p.heat>.05){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-k)*.35*p.heat;
   const gr=p.r*1.6;ctx.drawImage(SPR.glow,p.x-gr,p.y-gr,gr*2,gr*2);ctx.globalCompositeOperation='source-over';}
  else if(p.type==='ash'&&glow>.3){const d=Math.hypot(p.x-peakX,p.y-peakY),prox=clamp(1-d/(H*.24),0,1);
   if(prox>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-k)*.3*glow*prox;
    const gr=p.r*1.4;ctx.drawImage(SPR.glow,p.x-gr,p.y-gr,gr*2,gr*2);ctx.globalCompositeOperation='source-over';}}
  ctx.globalAlpha=(1-k)*(p.type==='ash'?.62:.5);
  ctx.drawImage(p.type==='ash'?SPR.ash:SPR.smoke,p.x-p.r,p.y-p.r,p.r*2,p.r*2);}
 else if(p.type==='dust'){ctx.globalAlpha=(1-k)*.4;ctx.drawImage(SPR.smoke,p.x-p.r,p.y-p.r,p.r*2,p.r*2);}
 else if(p.type==='spark'||p.type==='ember'){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-k);
  const gr=p.r*3;ctx.drawImage(SPR.glow,p.x-gr,p.y-gr,gr*2,gr*2);ctx.globalCompositeOperation='source-over';}
 else if(p.type==='spray'){ctx.globalAlpha=(1-k)*.85;ctx.fillStyle='#d7eaf4';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
 else if(p.type==='ashfall'){ctx.globalAlpha=(1-k)*.4;ctx.fillStyle='#3a3438';ctx.fillRect(p.x,p.y,2,2);}}
 ctx.globalAlpha=1;}

/* ---------- bombs ---------- */
function spawnBomb(){const px=peakX+rand(-crHW*.3,crHW*.3),py=peakY+crD*.4;
 const dir=Math.random()<.42?-1:1,pw=rand(.75,1.15);
 B.push({x:px,y:py,vx:dir*rand(W*.05,W*.15)*pw+rand(-18,18),vy:-rand(H*.5,H*.88)*pw,
  r:rand(3,6.5),bounces:0,heat:1,dead:false});
 glowSpike=Math.min(1.4,glowSpike+.5);shakeSpike=Math.min(8,shakeSpike+3.2);boom();
 for(let i=0;i<6;i++)puff('spark',px,py,rand(-90,90),rand(-160,-20),rand(1.5,3),rand(.3,.6));}
function splash(x){for(let i=0;i<14;i++)puff('spray',x+rand(-4,4),seaY-2,rand(-70,70),-rand(70,240),rand(1.5,3),rand(.5,1));

 if(id==='rumble'){const e=phaseT/ph.dur;gT=.3+.25*Math.sin(t*7)*e;tr=.25+.5*e*(.6+.4*Math.sin(t*9));}

 if(id==='cool'){gT=.16;tr=.05;}
 glow+=(gT-glow)*Math.min(1,dt*2.5);glowSpike=Math.max(0,glowSpike-dt*1.8);
 tremor=tr+glowSpike*.3;
 shake+=((id==='rumble'?2.2:id==='erupt'?3:0)-shake)*Math.min(1,dt*4);
 shakeSpike=Math.max(0,shakeSpike-dt*9);
 skyFlash=Math.max(0,skyFlash-dt*2.4);

  puff('steam',peakX+rand(-6,6),peakY+crD*.3,rand(-4,4)+wind*.3,-rand(18,30),rand(4,7),rand(2.5,4));}
 if(id==='plume'||id==='erupt'){const rate=id==='erupt'?70:42;ashAcc+=rate*dt;
  while(ashAcc>1){ashAcc--;
   puff('ash',peakX+rand(-crHW*.5,crHW*.5),peakY+rand(-4,6),rand(-14,14)+wind*.4,-rand(60,130),rand(7,13),rand(3.2,5.5));}
  if(Math.random()<dt*3)puff('ashfall',peakX+rand(-W*.12,W*.18),peakY-rand(30,140),0,20,1.5,rand(4,7));}
 if(id==='erupt'){bombTimer-=dt;
  if(bombTimer<=0){bombTimer=rand(.28,.7);

  boltTimer-=dt;if(boltTimer<=0){boltTimer=rand(.7,2.2);makeBolt();}}
 if(id==='flow'){flowProg=Math.min(1,phaseT/(ph.dur*.55));crustClock=Math.max(0,phaseT-2.5);
  if(flowProg>=1)dLen=Math.min(deltaMax,dLen+dt*deltaMax/(ph.dur*.45));

 if(id==='cool'){crustClock+=dt;

  flowAlpha=phaseT>ph.dur*.55?Math.max(0,1-(phaseT-ph.dur*.55)/(ph.dur*.45)):1;
  if(dLen>2&&Math.random()<dt*6)puff('steam',shoreX+dLen,seaY-3,rand(-6,6),-rand(20,40),rand(4,7),rand(1,1.8));}

 for(let i=R.length-1;i>=0;i--){const r=R[i];r.r+=70*dt;r.a-=dt*.6;if(r.a<=0)R.splice(i,1);}

  const cX=p.x+p.lean*p.h*.1+sway*p.h*.18,cY=by-p.h*.55;
  ctx.strokeStyle=css(trunk);ctx.lineCap='round';
  ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x,by);ctx.quadraticCurveTo(cX,cY,topX,topY);ctx.stroke();
  ctx.strokeStyle=css(leaf);ctx.lineWidth=3.2;
  for(let i=0;i<p.fr;i++){const ang=-Math.PI*.12-(Math.PI*.78)*(i/(p.fr-1));
   const fl2=ang+sway*.6+Math.sin(t*1.7+i+p.ph)*.05;
   const len=p.h*.52*(0.85+0.15*Math.sin(i*2.3));
   const ex=topX+Math.cos(fl2)*len,ey=topY+Math.sin(fl2)*len+len*.38;
   const mx=topX+Math.cos(fl2)*len*.55,my=topY+Math.sin(fl2)*len*.55-len*.08;
   ctx.beginPath();ctx.moveTo(topX,topY);ctx.quadraticCurveTo(mx,my,ex,ey);ctx.stroke();}
  ctx.fillStyle=css(coco);ctx.beginPath();
  ctx.arc(topX+3,topY+4,2.6,0,TAU);ctx.arc(topX-4,topY+5,2.4,0,TAU);ctx.fill();}}

/* ---------- HUD ---------- */
const ctime=document.getElementById('ctime'),cperiod=document.getElementById('cperiod'),
 magEl=document.getElementById('mag');
const dial=document.getElementById('dial'),dg=dial.getContext('2d');
const seis=document.getElementById('seis'),sg=seis.getContext('2d');
const sbuf=new Array(260).fill(0);let magUpd=0;
function hud(dt){
 const dayT=(t%60)/60,dayF=clamp(.12+Math.sin(dayT*TAU)*1.3,0,1);
 pbar.style.width=(phaseT/PHASES[phaseIdx].dur*100)+'%';
 const sec=Math.floor(dayT*60);
 ctime.textContent='T+00:'+String(sec).padStart(2,'0');
 cperiod.textContent=dayT<.08?'DAWN':dayT<.42?'DAY':dayT<.58?'DUSK':'NIGHT';
 dg.setTransform(2,0,0,2,0,0);dg.clearRect(0,0,56,56);
 dg.strokeStyle='rgba(255,255,255,.14)';dg.lineWidth=3;
 dg.beginPath();dg.arc(28,28,22,0,TAU);dg.stroke();
 dg.strokeStyle=dayF>.05?'#ffb257':'#8fa0e0';
 dg.beginPath();dg.arc(28,28,22,-Math.PI/2,-Math.PI/2+dayT*TAU);dg.stroke();
 const an=-Math.PI/2+dayT*TAU;
 dg.fillStyle=dayF>.05?'#ffd76a':'#dfe6ff';
 dg.beginPath();dg.arc(28+Math.cos(an)*22,28+Math.sin(an)*22,4,0,TAU);dg.fill();
 const sample=clamp(tremor*(Math.sin(t*43)*.55+Math.sin(t*11.3)*.45)+(Math.random()-.5)*.07,-1,1);
 sbuf.push(sample);sbuf.shift();
 sg.setTransform(2,0,0,2,0,0);sg.clearRect(0,0,260,56);
 sg.strokeStyle='rgba(255,255,255,.07)';sg.lineWidth=1;
 for(let x=0;x<=260;x+=26){sg.beginPath();sg.moveTo(x,0);sg.lineTo(x,56);sg.stroke();}
 sg.strokeStyle='rgba(255,150,90,.25)';sg.beginPath();sg.moveTo(0,28);sg.lineTo(260,28);sg.stroke();
 sg.beginPath();
 for(let i=0;i<260;i++){const y=28-sbuf[i]*22;i?sg.lineTo(i,y):sg.moveTo(i,y);}
 sg.strokeStyle='rgba(255,122,53,.28)';sg.lineWidth=4;sg.stroke();
 sg.strokeStyle='#ff9a5c';sg.lineWidth=1.4;sg.stroke();
 magUpd-=dt;if(magUpd<=0){magUpd=.12;
  magEl.textContent='MAG '+(tremor*4.1+rand(.05,.2)).toFixed(1);}}

/* ---------- audio ---------- */
let audioOn=false,AC=null,masterG=null,rumbleG=null;
function ensureAudio(){if(AC)return;
 try{AC=new (window.AudioContext||window.webkitAudioContext)();
  masterG=AC.createGain();masterG.gain.value=.7;masterG.connect(AC.destination);
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.2;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=120;
  rumbleG=AC.createGain();rumbleG.gain.value=0;
  src.connect(lp);lp.connect(rumbleG);rumbleG.connect(masterG);src.start();}catch(e){}}
function setRumble(v){if(rumbleG&&AC)try{rumbleG.gain.setTargetAtTime(v*.75,AC.currentTime,.12);}catch(e){}}
function hiss(vol,fq,dur){if(!audioOn||!AC)return;
 try{const n=AC.sampleRate*dur|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=.8;
  const gn=AC.createGain();gn.gain.value=vol;
  s.connect(f);f.connect(gn);gn.connect(masterG);s.start();}catch(e){}}
function boom(){if(!audioOn||!AC)return;
 try{const o=AC.createOscillator(),gn=AC.createGain();o.type='sine';
  o.frequency.setValueAtTime(90,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(28,AC.currentTime+.5);
  gn.gain.setValueAtTime(.5,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.55);
  o.connect(gn);gn.connect(masterG);o.start();o.stop(AC.currentTime+.6);}catch(e){}}

/* ---------- controls ---------- */
const sndBtn=document.getElementById('sndBtn'),pauseBtn=document.getElementById('pauseBtn');
function toggleSound(){audioOn=!audioOn;
 if(audioOn){ensureAudio();if(AC)AC.resume();if(masterG)masterG.gain.value=.7;}
 else if(masterG)masterG.gain.value=0;
 sndBtn.textContent=audioOn?'SOUND · ON':'SOUND · OFF';
 sndBtn.classList.toggle('act',audioOn);}
function togglePause(){paused=!paused;document.body.classList.toggle('paused',paused);}
sndBtn.addEventListener('click',toggleSound);
pauseBtn.addEventListener('click',togglePause);
addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();togglePause();}
 else if(e.key==='s'||e.key==='S')toggleSound();});
addEventListener('pointermove',e=>{parTX=(e.clientX/W-.5)*2;parTY=(e.clientY/H-.5)*2;});
cv.addEventListener('pointerdown',e=>{const x=e.clientX,y=e.clientY;
 FX.push({x,y,r:5,a:.65});
 if(x>x0&&x<x1&&y>groundAt(x)-60&&y<seaY+40){
  const id=PHASES[phaseIdx].id;
  if(id==='quiet'||id==='cool')setPhase(1);
  else{for(let i=0;i<2;i++)spawnBomb();glowSpike=1;}}});

/* ---------- go ---------- */
resize();setPhase(0);
let last=performance.now();
function frame(now){requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
 if(!paused)update(dt);
 render();hud(dt);}
requestAnimationFrame(frame);
})();
</script>
