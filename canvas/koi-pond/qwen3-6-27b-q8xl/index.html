<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koi Pond</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a2a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="pond"></canvas>
<script>
const canvas = document.getElementById('pond');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Utility
function rand(a, b) { return Math.random() * (b - a) + a; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function angleDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }

// Caustics
const causticLayers = [];
for (let i = 0; i < 4; i++) {
  causticLayers.push({
    freq: rand(0.002, 0.008),
    speed: rand(0.3, 1.2),
    angle: rand(0, Math.PI * 2),
    amp: rand(0.15, 0.35)
  });
}

function drawCaustics(time) {
  const imgData = ctx.getImageData(0, 0, W, H);
  // We'll draw caustics as a subtle overlay instead for performance
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.globalCompositeOperation = 'overlay';
  for (let layer of causticLayers) {
    for (let x = 0; x < W; x += 12) {
      for (let y = 0; y < H; y += 12) {
        let v = Math.sin(x * layer.freq * Math.cos(layer.angle) + y * layer.freq * Math.sin(layer.angle) + time * layer.speed);
        v += Math.sin(x * layer.freq * 1.3 * Math.sin(layer.angle) - y * layer.freq * Math.cos(layer.angle) + time * layer.speed * 0.7);
        v *= layer.amp;
        if (v > 0.2) {
          ctx.fillStyle = `rgba(180,220,255,${v * 0.3})`;
          ctx.fillRect(x, y, 12, 12);
        }
      }
    }
  }
  ctx.restore();
}

// Simplified caustics using radial gradients for performance
function drawCausticsFast(time) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  for (let i = 0; i < 15; i++) {
    const cx = (Math.sin(time * 0.2 + i * 2.1) * 0.5 + 0.5) * W;
    const cy = (Math.cos(time * 0.15 + i * 1.7) * 0.5 + 0.5) * H;
    const r = rand(40, 120);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    const alpha = 0.03 + Math.sin(time * 0.5 + i) * 0.02;
    grad.addColorStop(0, `rgba(140,200,240,${alpha})`);
    grad.addColorStop(1, 'rgba(140,200,240,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  ctx.restore();
}

// Ripples
const ripples = [];
function addRipple(x, y, maxR = 60) {
  ripples.push({ x, y, r: 2, maxR, alpha: 0.6, speed: rand(0.3, 0.8) });
}

function updateRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += r.speed * dt * 60;
    r.alpha -= 0.003 * dt * 60;
    if (r.alpha <= 0 || r.r > r.maxR) ripples.splice(i, 1);
  }
}

function drawRipples() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const r of ripples) {
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(180,220,255,${r.alpha})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Secondary ring
    if (r.r > 10) {
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(180,220,255,${r.alpha * 0.4})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Lily pads
const lilyPads = [];
function initLilyPads() {
  lilyPads.length = 0;
  const count = Math.floor(rand(8, 14));
  for (let i = 0; i < count; i++) {
    lilyPads.push({
      x: rand(80, W - 80),
      y: rand(80, H - 80),
      r: rand(25, 50),
      rotation: rand(0, Math.PI * 2),
      gapAngle: rand(0.3, 0.8),
      gapDir: rand(0, Math.PI * 2),
      color: `rgba(${rand(40, 80)},${rand(120, 170)},${rand(30, 60)},${rand(0.6, 0.85)})`,
      veinAlpha: rand(0.15, 0.3),
      bobPhase: rand(0, Math.PI * 2),
      bobAmp: rand(0.5, 2)
    });
  }
}

function drawLilyPad(lp, time) {
  const bx = Math.sin(time * 0.3 + lp.bobPhase) * lp.bobAmp;
  const by = Math.cos(time * 0.25 + lp.bobPhase) * lp.bobAmp;
  const cx = lp.x + bx;
  const cy = lp.y + by;

  // Shadow
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx + 3, cy + 4, lp.r * 0.95, lp.r * 0.7, lp.rotation, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,20,10,0.25)';
  ctx.fill();
  ctx.restore();

  // Pad body with gap
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(lp.rotation);
  ctx.beginPath();
  ctx.ellipse(0, 0, lp.r, lp.r * 0.75, 0, lp.gapDir, lp.gapDir + Math.PI * 2 - lp.gapAngle);
  ctx.closePath();
  ctx.fillStyle = lp.color;
  ctx.fill();

  // Veins
  ctx.strokeStyle = `rgba(30,80,20,${lp.veinAlpha})`;
  ctx.lineWidth = 0.8;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
    if (a > lp.gapDir - 0.1 && a < lp.gapDir + lp.gapAngle + 0.1) continue;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * lp.r * 0.85, Math.sin(a) * lp.r * 0.6);
    ctx.stroke();
  }
  ctx.restore();
}

// Koi fish
const koiPatterns = [
  { name: 'Kohaku', body: '#fff', spots: ['#e84020', '#e84020', '#fff'], spotCount: 4 },
  { name: 'Sanke', body: '#fff', spots: ['#e84020', '#1a1a2e', '#fff'], spotCount: 5 },
  { name: 'Showa', body: '#1a1a2e', spots: ['#e84020', '#fff', '#e84020'], spotCount: 4 },
  { name: 'Ogon', body: '#f0c040', spots: ['#e8a020', '#f0c040', '#e8a020'], spotCount: 3 },
  { name: 'Bekko', body: '#fff', spots: ['#1a1a2e', '#1a1a2e', '#fff'], spotCount: 3 },
  { name: 'Tancho', body: '#fff', spots: ['#e84020', '#fff', '#fff'], spotCount: 2 },
  { name: 'Shusui', body: '#1a1a2e', spots: ['#e84020', '#e84020', '#1a1a2e'], spotCount: 4 },
  { name: 'Asagi', body: '#a0c8d8', spots: ['#2a5a7a', '#a0c8d8', '#2a5a7a'], spotCount: 4 },
  { name: 'Utsuri', body: '#1a1a2e', spots: ['#f0c040', '#f0c040', '#1a1a2e'], spotCount: 3 }
];

const koi = [];
function initKoi() {
  koi.length = 0;
  const count = Math.floor(rand(6, 10));
  const usedPatterns = new Set();
  for (let i = 0; i < count; i++) {
    let pi;
    do { pi = Math.floor(rand(0, koiPatterns.length)); } while (usedPatterns.has(pi) && usedPatterns.size < koiPatterns.length);
    usedPatterns.add(pi);
    const pat = koiPatterns[pi];
    const angle = rand(0, Math.PI * 2);
    const speed = rand(0.6, 1.4);
    const k = {
      x: rand(100, W - 100),
      y: rand(100, H - 100),
      angle: angle,
      targetAngle: angle,
      speed: speed,
      bodyLen: rand(55, 85),
      bodyWidth: rand(14, 22),
      pattern: pat,
      segments: [],
      segmentCount: Math.floor(rand(12, 18)),
      tailPhase: 0,
      tailSpeed: rand(3, 6),
      nibbleTimer: rand(2, 8),
      nibbleInterval: rand(4, 12),
      waypoints: [],
      wpIndex: 0,
      turnSpeed: rand(0.4, 1.2),
      finPhase: rand(0, Math.PI * 2),
      finAmp: rand(0.15, 0.35)
    };
    // Init segments
    for (let s = 0; s < k.segmentCount; s++) {
      k.segments.push({ x: k.x, y: k.y });
    }
    // Generate waypoints
    generateWaypoints(k);
    koi.push(k);
  }
}

function generateWaypoints(k) {
  k.waypoints = [];
  for (let i = 0; i < 6; i++) {
    const margin = 120;
    k.waypoints.push({
      x: rand(margin, W - margin),
      y: rand(margin, H - margin)
    });
  }
}

function updateKoi(k, dt, time) {
  // Move toward waypoint
  const wp = k.waypoints[k.wpIndex];
  const dx = wp.x - k.x;
  const dy = wp.y - k.y;
  const d = Math.hypot(dx, dy);
  const desiredAngle = Math.atan2(dy, dx);

  if (d < 60) {
    k.wpIndex = (k.wpIndex + 1) % k.waypoints.length;
    if (k.wpIndex === 0) generateWaypoints(k);
    return;
  }

  const diff = angleDiff(k.angle, desiredAngle);
  k.angle += diff * k.turnSpeed * dt * 2;

  // Speed variation
  const currentSpeed = k.speed * (0.8 + Math.sin(time * 0.5 + k.finPhase) * 0.2);
  k.x += Math.cos(k.angle) * currentSpeed * dt * 60;
  k.y += Math.sin(k.angle) * currentSpeed * dt * 60;

  // Update segments (inverse kinematics chain)
  k.segments[0].x = k.x;
  k.segments[0].y = k.y;
  const segLen = k.bodyLen / k.segmentCount;
  for (let s = 1; s < k.segmentCount; s++) {
    const prev = k.segments[s - 1];
    const seg = k.segments[s];
    const sx = seg.x - prev.x;
    const sy = seg.y - prev.y;
    const sd = Math.hypot(sx, sy);
    if (sd > segLen) {
      const ratio = segLen / sd;
      seg.x = prev.x + sx * ratio;
      seg.y = prev.y + sy * ratio;
    }
  }

  // Tail animation
  k.tailPhase += k.tailSpeed * dt;

  // Nibble behavior
  k.nibbleTimer -= dt;
  if (k.nibbleTimer <= 0) {
    addRipple(k.x + Math.cos(k.angle) * k.bodyLen * 0.5, k.y + Math.sin(k.angle) * k.bodyLen * 0.5, rand(20, 50));
    k.nibbleTimer = k.nibbleInterval * rand(0.5, 1.5);
  }
}

function drawKoi(k, time) {
  const segs = k.segments;
  const n = segs.length;

  // Draw shadow
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  ctx.moveTo(segs[0].x + 3, segs[0].y + 4);
  for (let i = 1; i < n; i++) {
    const t = i / (n - 1);
    const w = k.bodyWidth * (1 - t * t) * 0.7;
    const perpX = -Math.sin(k.angle) * w;
    const perpY = Math.cos(k.angle) * w;
    ctx.lineTo(segs[i].x + 3 + perpX, segs[i].y + 4 + perpY);
  }
  for (let i = n - 1; i >= 0; i--) {
    const t = i / (n - 1);
    const w = k.bodyWidth * (1 - t * t) * 0.7;
    const perpX = Math.sin(k.angle) * w;
    const perpY = -Math.cos(k.angle) * w;
    ctx.lineTo(segs[i].x + 3 + perpX, segs[i].y + 4 + perpY);
  }
  ctx.closePath();
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  // Draw body
  ctx.save();
  // Build body path
  const bodyPath = new Path2D();
  // Head side
  bodyPath.moveTo(segs[0].x, segs[0].y);
  for (let i = 1; i < n; i++) {
    const t = i / (n - 1);
    const w = k.bodyWidth * (1 - t * t);
    const tailWag = Math.sin(k.tailPhase + i * 0.4) * k.finAmp * t * t * k.bodyWidth;
    const perpX = -Math.sin(k.angle) * (w + tailWag);
    const perpY = Math.cos(k.angle) * (w + tailWag);
    bodyPath.lineTo(segs[i].x + perpX, segs[i].y + perpY);
  }
  // Tail
  const tailSeg = segs[n - 1];
  const tailWagEnd = Math.sin(k.tailPhase + (n - 1) * 0.4) * k.finAmp * k.bodyWidth;
  const tailSpread = k.bodyWidth * 0.6;
  const perpX1 = -Math.sin(k.angle) * (tailWagEnd + tailSpread);
  const perpY1 = Math.cos(k.angle) * (tailWagEnd + tailSpread);
  const perpX2 = Math.sin(k.angle) * (tailWagEnd + tailSpread);
  const perpY2 = -Math.cos(k.angle) * (tailWagEnd + tailSpread);
  bodyPath.lineTo(tailSeg.x + perpX1, tailSeg.y + perpY1);
  bodyPath.lineTo(tailSeg.x - Math.cos(k.angle) * 12, tailSeg.y - Math.sin(k.angle) * 12);
  bodyPath.lineTo(tailSeg.x + perpX2, tailSeg.y + perpY2);
  // Return along other side
  for (let i = n - 2; i >= 0; i--) {
    const t = i / (n - 1);
    const w = k.bodyWidth * (1 - t * t);
    const tailWag = Math.sin(k.tailPhase + i * 0.4) * k.finAmp * t * t * k.bodyWidth;
    const perpX = Math.sin(k.angle) * (w + tailWag);
    const perpY = -Math.cos(k.angle) * (w + tailWag);
    bodyPath.lineTo(segs[i].x + perpX, segs[i].y + perpY);
  }
  bodyPath.closePath();

  // Fill body with gradient
  const grad = ctx.createLinearGradient(
    segs[0].x - Math.cos(k.angle) * k.bodyLen,
    segs[0].y - Math.sin(k.angle) * k.bodyLen,
    segs[0].x + Math.cos(k.angle) * k.bodyLen,
    segs[0].y + Math.sin(k.angle) * k.bodyLen
  );
  grad.addColorStop(0, k.pattern.spots[0]);
  grad.addColorStop(0.5, k.pattern.body);
  grad.addColorStop(1, k.pattern.spots[2] || k.pattern.spots[0]);
  ctx.fillStyle = grad;
  ctx.fill(bodyPath);

  // Draw spots
  const spotCount = k.pattern.spotCount;
  for (let s = 0; s < spotCount; s++) {
    const st = 0.15 + (s / spotCount) * 0.6;
    const si = Math.floor(st * (n - 1));
    const seg = segs[Math.min(si, n - 2)];
    const nextSeg = segs[Math.min(si + 1, n - 1)];
    const spotX = lerp(seg.x, nextSeg.x, 0.5);
    const spotY = lerp(seg.y, nextSeg.y, 0.5);
    const spotR = k.bodyWidth * (0.3 + Math.sin(s * 2.5) * 0.15);
    const spotColor = k.pattern.spots[s % k.pattern.spots.length];

    ctx.beginPath();
    ctx.ellipse(spotX, spotY, spotR * 1.3, spotR * 0.9, k.angle + Math.sin(s) * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = spotColor;
    ctx.fill();
  }

  // Tail fin
  const tailSeg2 = segs[n - 1];
  const tw = Math.sin(k.tailPhase) * k.finAmp * k.bodyWidth;
  ctx.beginPath();
  ctx.moveTo(tailSeg2.x, tailSeg2.y);
  ctx.quadraticCurveTo(
    tailSeg2.x - Math.cos(k.angle) * 15 + Math.sin(k.angle) * tw,
    tailSeg2.y - Math.sin(k.angle) * 15 - Math.cos(k.angle) * tw,
    tailSeg2.x - Math.cos(k.angle) * 22 + Math.sin(k.angle) * (tw + k.bodyWidth * 0.5),
    tailSeg2.y - Math.sin(k.angle) * 22 - Math.cos(k.angle) * (tw + k.bodyWidth * 0.5)
  );
  ctx.quadraticCurveTo(
    tailSeg2.x - Math.cos(k.angle) * 10,
    tailSeg2.y - Math.sin(k.angle) * 10,
    tailSeg2.x - Math.cos(k.angle) * 22 - Math.sin(k.angle) * (tw + k.bodyWidth * 0.5),
    tailSeg2.y - Math.sin(k.angle) * 22 + Math.cos(k.angle) * (tw + k.bodyWidth * 0.5)
  );
  ctx.quadraticCurveTo(
    tailSeg2.x - Math.cos(k.angle) * 15 - Math.sin(k.angle) * tw,
    tailSeg2.y - Math.sin(k.angle) * 15 + Math.cos(k.angle) * tw,
    tailSeg2.x, tailSeg2.y
  );
  ctx.fillStyle = `rgba(${parseInt(k.pattern.spots[0].slice(1,3),16)||200},${parseInt(k.pattern.spots[0].slice(3,5),16)||100},${parseInt(k.pattern.spots[0].slice(5,7),16)||50},0.5)`;
  ctx.fill();

  // Side fins
  const finSegIdx = Math.floor(n * 0.3);
  const finSeg = segs[finSegIdx];
  const finWag = Math.sin(time * 3 + k.finPhase) * k.finAmp;
  for (let side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(finSeg.x, finSeg.y);
    ctx.quadraticCurveTo(
      finSeg.x + Math.sin(k.angle + side * Math.PI / 2) * k.bodyWidth * 0.8 + Math.cos(k.angle) * finWag * side,
      finSeg.y - Math.cos(k.angle + side * Math.PI / 2) * k.bodyWidth * 0.8 + Math.sin(k.angle) * finWag * side,
      finSeg.x + Math.sin(k.angle + side * Math.PI / 2) * k.bodyWidth * 1.5 + Math.cos(k.angle) * finWag * side * 1.5,
      finSeg.y - Math.cos(k.angle + side * Math.PI / 2) * k.bodyWidth * 1.5 + Math.sin(k.angle) * finWag * side * 1.5
    );
    ctx.quadraticCurveTo(
      finSeg.x + Math.sin(k.angle) * side * k.bodyWidth * 0.3,
      finSeg.y - Math.cos(k.angle) * side * k.bodyWidth * 0.3,
      finSeg.x, finSeg.y
    );
    ctx.fillStyle = `rgba(255,255,255,0.25)`;
    ctx.fill();
  }

  // Eye
  const eyeX = segs[0].x + Math.cos(k.angle) * k.bodyWidth * 0.3;
  const eyeY = segs[0].y + Math.sin(k.angle) * k.bodyWidth * 0.3;
  const eyeR = k.bodyWidth * 0.18;
  ctx.beginPath();
  ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(eyeX + Math.cos(k.angle) * eyeR * 0.3, eyeY + Math.sin(k.angle) * eyeR * 0.3, eyeR * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.ellipse(
    segs[0].x + Math.cos(k.angle) * k.bodyWidth * 0.1,
    segs[0].y + Math.sin(k.angle) * k.bodyWidth * 0.1,
    k.bodyWidth * 0.55, k.bodyWidth * 0.4,
    k.angle, 0, Math.PI * 2
  );
  ctx.fillStyle = k.pattern.spots[0];
  ctx.globalAlpha = 0.6;
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

// Dragonflies
const dragonflies = [];
function spawnDragonfly() {
  if (dragonflies.length >= 3) return;
  const side = Math.floor(rand(0, 4));
  let x, y;
  switch (side) {
    case 0: x = rand(0, W); y = -20; break;
    case 1: x = W + 20; y = rand(0, H); break;
    case 2: x = rand(0, W); y = H + 20; break;
    case 3: x = -20; y = rand(0, H); break;
  }
  const targetX = rand(100, W - 100);
  const targetY = rand(100, H - 100);
  dragonflies.push({
    x, y,
    targetX, targetY,
    state: 'flying', // flying, landing, landed, leaving
    landTimer: rand(2, 6),
    leaveTimer: 0,
    angle: Math.atan2(targetY - y, targetX - x),
    wingPhase: rand(0, Math.PI * 2),
    color: `hsl(${rand(100, 200)}, ${rand(40, 80)}%, ${rand(30, 60)}%)`,
    size: rand(4, 7),
    speed: rand(1, 2.5)
  });
}

function updateDragonfly(df, dt, time) {
  df.wingPhase += dt * 30;

  if (df.state === 'flying') {
    const dx = df.targetX - df.x;
    const dy = df.targetY - df.y;
    const d = Math.hypot(dx, dy);
    if (d > 10) {
      const targetAngle = Math.atan2(dy, dx);
      const diff = angleDiff(df.angle, targetAngle);
      df.angle += diff * dt * 3;
      df.x += Math.cos(df.angle) * df.speed * dt * 60;
      df.y += Math.sin(df.angle) * df.speed * dt * 60;
    } else {
      df.state = 'landing';
      df.landTimer = rand(1.5, 4);
    }
  } else if (df.state === 'landing') {
    df.landTimer -= dt;
    if (df.landTimer <= 0) {
      df.state = 'landed';
      df.leaveTimer = rand(2, 5);
    }
  } else if (df.state === 'landed') {
    df.leaveTimer -= dt;
    if (df.leaveTimer <= 0) {
      df.state = 'leaving';
      const side = Math.floor(rand(0, 4));
      switch (side) {
        case 0: df.targetX = rand(0, W); df.targetY = -50; break;
        case 1: df.targetX = W + 50; df.targetY = rand(0, H); break;
        case 2: df.targetX = rand(0, W); df.targetY = H + 50; break;
        case 3: df.targetX = -50; df.targetY = rand(0, H); break;
      }
    }
  } else if (df.state === 'leaving') {
    const dx = df.targetX - df.x;
    const dy = df.targetY - df.y;
    const d = Math.hypot(dx, dy);
    if (d > 5) {
      const targetAngle = Math.atan2(dy, dx);
      const diff = angleDiff(df.angle, targetAngle);
      df.angle += diff * dt * 3;
      df.x += Math.cos(df.angle) * df.speed * dt * 60;
      df.y += Math.sin(df.angle) * df.speed * dt * 60;
    } else {
      return false; // remove
    }
  }
  return true;
}

function drawDragonfly(df, time) {
  ctx.save();
  ctx.translate(df.x, df.y);
  ctx.rotate(df.angle);

  const wingFlap = Math.sin(df.wingPhase) * 0.6;
  const s = df.size;

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.translate(2, 3);
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 2, s * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  // Wings
  ctx.globalAlpha = 0.6;
  for (let side = -1; side <= 1; side += 2) {
    ctx.save();
    ctx.rotate(wingFlap * side);
    ctx.beginPath();
    ctx.ellipse(s * 0.5, side * s * 0.3, s * 2.5, s * 0.6, side * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,230,255,0.4)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,200,230,0.3)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();
  }

  // Body
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 2, s * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = df.color;
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.arc(s * 1.8, 0, s * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = df.color;
  ctx.fill();

  // Eyes
  ctx.beginPath();
  ctx.arc(s * 2, -s * 0.15, s * 0.2, 0, Math.PI * 2);
  ctx.arc(s * 2, s * 0.15, s * 0.2, 0, Math.PI * 2);
  ctx.fillStyle = '#222';
  ctx.fill();

  ctx.restore();
}

// Water surface texture
function drawWaterBase(time) {
  // Base water color
  const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  grad.addColorStop(0, '#1a4a3a');
  grad.addColorStop(0.5, '#143a2a');
  grad.addColorStop(1, '#0a2a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle animated water texture
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 30; i++) {
    const x = (Math.sin(time * 0.1 + i * 1.3) * 0.5 + 0.5) * W;
    const y = (Math.cos(time * 0.08 + i * 0.9) * 0.5 + 0.5) * H;
    const r = rand(50, 150);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(100,180,140,0.5)');
    g.addColorStop(1, 'rgba(100,180,140,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.restore();
}

// Subtle light reflections
function drawLightReflections(time) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 5; i++) {
    const x = W * 0.2 + Math.sin(time * 0.1 + i * 2) * W * 0.3;
    const y = H * 0.3 + Math.cos(time * 0.08 + i * 1.5) * H * 0.2;
    const r = 80 + Math.sin(time * 0.3 + i) * 30;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,240,0.8)');
    g.addColorStop(1, 'rgba(255,255,240,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Pond edge / stones
function drawPondEdge() {
  ctx.save();
  // Draw some stones along edges
  const stones = [
    { x: 30, y: 50, r: 18 }, { x: 60, y: 30, r: 12 }, { x: 20, y: 100, r: 15 },
    { x: W - 40, y: 80, r: 16 }, { x: W - 20, y: 130, r: 14 },
    { x: 50, y: H - 40, r: 17 }, { x: W - 60, y: H - 30, r: 13 },
    { x: W - 30, y: H - 70, r: 11 }, { x: 100, y: H - 20, r: 14 },
    { x: W - 100, y: 40, r: 10 }, { x: 80, y: 150, r: 12 }
  ];
  for (const s of stones) {
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r, s.r * 0.7, rand(0, 1), 0, Math.PI * 2);
    ctx.fillStyle = '#3a3a3a';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(s.x - 1, s.y - 1, s.r * 0.8, s.r * 0.5, rand(0, 1), 0, Math.PI * 2);
    ctx.fillStyle = '#4a4a4a';
    ctx.fill();
  }
  ctx.restore();
}

// Floating debris / leaves
const debris = [];
function initDebris() {
  for (let i = 0; i < 12; i++) {
    debris.push({
      x: rand(50, W - 50),
      y: rand(50, H - 50),
      vx: rand(-0.1, 0.1),
      vy: rand(-0.1, 0.1),
      rotation: rand(0, Math.PI * 2),
      rotSpeed: rand(-0.01, 0.01),
      size: rand(3, 8),
      color: `hsl(${rand(80, 140)}, ${rand(30, 60)}%, ${rand(25, 45)}%)`
    });
  }
}

function updateDebris(dt) {
  for (const d of debris) {
    d.x += d.vx * dt * 60;
    d.y += d.vy * dt * 60;
    d.rotation += d.rotSpeed * dt * 60;
    if (d.x < 0) d.x = W;
    if (d.x > W) d.x = 0;
    if (d.y < 0) d.y = H;
    if (d.y > H) d.y = 0;
  }
}

function drawDebris() {
  for (const d of debris) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rotation);
    ctx.beginPath();
    ctx.ellipse(0, 0, d.size, d.size * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = d.color;
    ctx.globalAlpha = 0.5;
    ctx.fill();
    ctx.restore();
  }
}

// Main loop
let lastTime = 0;
let dragonflyTimer = 0;

function init() {
  initLilyPads();
  initKoi();
  initDebris();
}

function animate(timestamp) {
  const time = timestamp / 1000;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Clear and draw water
  drawWaterBase(time);
  drawCausticsFast(time);
  drawLightReflections(time);

  // Draw pond edge
  drawPondEdge();

  // Update and draw debris
  updateDebris(dt);
  drawDebris();

  // Draw lily pads (behind fish that are "under" them)
  // Sort lily pads by y for depth
  const sortedPads = [...lilyPads].sort((a, b) => a.y - b.y);
  for (const lp of sortedPads) {
    drawLilyPad(lp, time);
  }

  // Update and draw koi
  // Sort koi by y for depth ordering
  const sortedKoi = [...koi].sort((a, b) => a.y - b.y);
  for (const k of sortedKoi) {
    updateKoi(k, dt, time);
  }
  for (const k of sortedKoi) {
    drawKoi(k, time);
  }

  // Dragonflies
  dragonflyTimer -= dt;
  if (dragonflyTimer <= 0) {
    spawnDragonfly();
    dragonflyTimer = rand(4, 10);
  }
  for (let i = dragonflies.length - 1; i >= 0; i--) {
    const alive = updateDragonfly(dragonflies[i], dt, time);
    if (!alive) {
      dragonflies.splice(i, 1);
      continue;
    }
    drawDragonfly(dragonflies[i], time);
  }

  // Ripples
  updateRipples(dt);
  drawRipples();

  // Subtle vignette
  ctx.save();
  const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  requestAnimationFrame(animate);
}

init();
requestAnimationFrame(animate);
</script>
