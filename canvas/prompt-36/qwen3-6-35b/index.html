<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Lifecycle Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="cycle-indicator">Cycle: <span id="cycle-text">Nature</span></div>
        <div id="pop-indicator">Population: <span id="pop-text">0</span></div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        // --- Configuration ---
        const CONFIG = {
            tileWidth: 40,
            tileHeight: 20, // For isometric 2:1 ratio
            gridW: 40,
            gridH: 40,
            colors: {
                grass: '#2d4a22',
                grassDark: '#243b1c',
                road: '#444444',
                roadLine: '#555555',
                ruins: '#5a5a5a',
                water: '#1a2b3c',
                building: {
                    residential: '#3498db',
                    commercial: '#f1c40f',
                    industrial: '#e74c3c',
                    center: '#ecf0f1'
                },
                tree: '#2ecc71',
                treeDark: '#27ae60',
                smoke: 'rgba(100, 100, 100, 0.3)'
            },
            phases: {
                NATURE: 0,
                GROWTH: 1,
                PEAK: 2,
                DECAY: 3,
                RUIN: 4
            },
            phaseDurations: {
                NATURE: 400,
                GROWTH: 1200,
                PEAK: 1500,
                DECAY: 1000,
                RUIN: 800
            }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cycleText = document.getElementById('cycle-text');
        const popText = document.getElementById('pop-text');

        // --- State ---
        let width, height, offsetX, offsetY;
        let grid = [];
        let cars = [];
        let particles = [];
        let currentPhase = CONFIG.phases.NATURE;
        let frameCount = 0;
        let phaseTimer = 0;
        let targetPhase = CONFIG.phases.NATURE;
        
        // --- Classes ---
        
        class Tile {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.type = 'grass'; // grass, road, water, tree
                this.building = null;
                this.level = 0;
                this.state = 'empty'; // empty, building, ruined, overgrown
                this.age = 0;
                this.ruinLevel = 0; // 0 to 1
                this.hasRoad = false;
            }

            draw() {
                // Isometric Math
                const isoX = (this.x - this.y) * CONFIG.tileWidth / 2;
                const isoY = (this.x + this.y) * CONFIG.tileHeight / 2;
                
                const screenX = isoX + offsetX;
                const screenY = isoY + offsetY;

                // Skip if off screen (basic optimization)
                if (screenX < -CONFIG.tileWidth || screenX > width + CONFIG.tileWidth ||
                    screenY < -CONFIG.tileHeight * 2 || screenY > height + CONFIG.tileHeight) return;

                // 1. Draw Base Tile (Ground)
                ctx.beginPath();
                ctx.moveTo(screenX, screenY);
                ctx.lineTo(screenX + CONFIG.tileWidth / 2, screenY + CONFIG.tileHeight / 2);
                ctx.lineTo(screenX, screenY + CONFIG.tileHeight);
                ctx.lineTo(screenX - CONFIG.tileWidth / 2, screenY + CONFIG.tileHeight / 2);
                ctx.closePath();

                // Grass Pattern
                ctx.fillStyle = (this.x + this.y) % 2 === 0 ? CONFIG.colors.grass : CONFIG.colors.grassDark;
                ctx.fill();

                // 2. Draw Ruins (if applicable)
                if (this.state === 'ruined' && this.ruinLevel > 0.2) {
                    const h = 10 * this.ruinLevel;
                    drawBlock(screenX, screenY, h, CONFIG.colors.ruins);
                }

                // 3. Draw Building
                if (this.building && this.state !== 'ruined') {
                    let h = this.building.height;
                    if (this.state === 'building') h *= (this.building.progress);
                    
                    const color = this.building.color;
                    drawBlock(screenX, screenY, h, color);
                }

                // 4. Draw Trees
                if (this.type === 'tree' && this.state !== 'ruined') {
                    const treeH = 30;
                    drawTree(screenX, screenY + CONFIG.tileHeight / 2, treeH);
                }

                // 5. Draw Road Markings
                if (this.type === 'road') {
                    ctx.fillStyle = CONFIG.colors.road;
                    ctx.fill();
                    // Simple road lines
                    if ((this.x + this.y) % 4 === 0) {
                        ctx.fillStyle = CONFIG.colors.roadLine;
                        ctx.beginPath();
                        ctx.moveTo(screenX, screenY + CONFIG.tileHeight / 2);
                        ctx.lineTo(screenX + CONFIG.tileWidth / 2, screenY + CONFIG.tileHeight);
                        ctx.lineTo(screenX, screenY + CONFIG.tileHeight * 1.5);
                        ctx.lineTo(screenX - CONFIG.tileWidth / 2, screenY + CONFIG.tileHeight / 2);
                        ctx.fill();
                    }
                }
            }
        }

        class Car {
            constructor() {
                this.path = [];
                this.stepIndex = 0;
                this.speed = 0.05 + Math.random() * 0.05;
                this.progress = 0;
                this.color = `hsl(${Math.random() * 360}, 70%, 70%)`;
            }

            findPath() {
                // Simple pathfinding: Random walk along roads
                // Reset to a random road start
                let startX = Math.floor(Math.random() * CONFIG.gridW);
                let startY = Math.floor(Math.random() * CONFIG.gridH);
                
                // Find a road tile
                while(!grid[startX][startY].type === 'road' && startX < CONFIG.gridW) {
                    startX = Math.floor(Math.random() * CONFIG.gridW);
                    startY = Math.floor(Math.random() * CONFIG.gridH);
                }

                // Create a simple zigzag path
                this.path = [{x: startX, y: startY}];
                let cx = startX;
                let cy = startY;
                
                for(let i=0; i<15; i++) {
                    const dirs = [];
                    if(cx < CONFIG.gridW-1 && grid[cx+1][cy].type === 'road') dirs.push({x:1, y:0});
                    if(cx > 0 && grid[cx-1][cy].type === 'road') dirs.push({x:-1, y:0});
                    if(cy < CONFIG.gridH-1 && grid[cx][cy+1].type === 'road') dirs.push({x:0, y:1});
                    if(cy > 0 && grid[cx][cy-1].type === 'road') dirs.push({x:0, y:-1});
                    
                    if(dirs.length > 0) {
                        const d = dirs[Math.floor(Math.random() * dirs.length)];
                        cx += d.x;
                        cy += d.y;
                        this.path.push({x: cx, y: cy});
                    } else {
                        break;
                    }
                }
            }

            update() {
                this.progress += this.speed;
                if (this.path.length < 2) this.findPath();
                
                if (this.progress >= 1) {
                    this.progress = 0;
                    this.stepIndex++;
                    if (this.stepIndex >= this.path.length - 1) {
                        this.findPath();
                        this.stepIndex = 0;
                    }
                }
            }

            draw() {
                if (this.path.length < 2) return;
                
                const p1 = this.path[this.stepIndex];
                const p2 = this.path[this.stepIndex + 1];
                
                // Interpolate
                const ix = (p1.x + (p2.x - p1.x) * this.progress);
                const iy = (p1.y + (p2.y - p1.y) * this.progress);

                const isoX = (ix - iy) * CONFIG.tileWidth / 2;
                const isoY = (ix + iy) * CONFIG.tileHeight / 2;
                
                const screenX = isoX + offsetX;
                const screenY = isoY + offsetY + 5; // slightly above ground

                ctx.fillStyle = this.color;
                ctx.fillRect(screenX - 2, screenY - 2, 4, 4);
            }
        }

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.z = 0;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.vz = 0.2 + Math.random() * 0.3;
                this.life = 1.0;
                this.type = type; // 'smoke', 'leaves'
                this.color = type === 'smoke' ? CONFIG.colors.smoke : CONFIG.colors.tree;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.z += this.vz;
                this.life -= 0.01;
                if(this.type === 'smoke') this.vz -= 0.005; // slow rise
            }

            draw() {
                if (this.life <= 0) return;
                const isoX = (this.x - this.y) * CONFIG.tileWidth / 2;
                const isoY = (this.x + this.y) * CONFIG.tileHeight / 2;
                
                const screenX = isoX + offsetX;
                const screenY = isoY + offsetY - this.z * 20;

                ctx.globalAlpha = this.life * 0.5;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(screenX, screenY, 3 + this.z * 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // --- Helpers ---

        function drawBlock(x, y, h, color) {
            if (h <= 0) return;
            
            const hw = CONFIG.tileWidth / 2;
            const hh = CONFIG.tileHeight / 2;

            // Top Face
            ctx.fillStyle = lighten(color, 20);
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + hw, y + hh - h);
            ctx.lineTo(x, y + CONFIG.tileHeight - h);
            ctx.lineTo(x - hw, y + hh - h);
            ctx.closePath();
            ctx.fill();

            // Left Face
            ctx.fillStyle = darken(color, 20);
            ctx.beginPath();
            ctx.moveTo(x - hw, y + hh - h);
            ctx.lineTo(x, y + CONFIG.tileHeight - h);
            ctx.lineTo(x, y + CONFIG.tileHeight);
            ctx.lineTo(x - hw, y + hh);
            ctx.closePath();
            ctx.fill();

            // Right Face
            ctx.fillStyle = darken(color, 40);
            ctx.beginPath();
            ctx.moveTo(x + hw, y + hh - h);
            ctx.lineTo(x, y + CONFIG.tileHeight - h);
            ctx.lineTo(x, y + CONFIG.tileHeight);
            ctx.lineTo(x + hw, y + hh);
            ctx.closePath();
            ctx.fill();
        }

        function drawTree(x, y, h) {
            ctx.fillStyle = '#5d4037'; // Trunk
            ctx.fillRect(x - 2, y - h/2, 4, h/2);
            
            ctx.fillStyle = CONFIG.colors.tree;
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + 10, y - h/2);
            ctx.lineTo(x - 10, y - h/2);
            ctx.closePath();
            ctx.fill();
        }

        function lighten(color, percent) {
            // Very basic hex lighten, fallback to color
            // In a real app, use RGB conversion
            return color; 
        }
        function darken(color, percent) {
            return color;
        }

        // --- Simulation Logic ---

        function initGrid() {
            grid = [];
            for (let x = 0; x < CONFIG.gridW; x++) {
                grid[x] = [];
                for (let y = 0; y < CONFIG.gridH; y++) {
                    grid[x][y] = new Tile(x, y);
                }
            }

            // Create a central road
            const midX = Math.floor(CONFIG.gridW / 2);
            for (let x = 0; x < CONFIG.gridW; x++) {
                grid[x][midX].type = 'road';
                grid[x][midX].hasRoad = true;
                
                // Center Building
                if (x === midX) {
                    grid[x][midX].building = {
                        height: 60,
                        color: CONFIG.colors.building.center,
                        progress: 1
                    };
                }
            }

            // Create some initial trees
            for (let i = 0; i < 100; i++) {
                const rx = Math.floor(Math.random() * CONFIG.gridW);
                const ry = Math.floor(Math.random() * CONFIG.gridH);
                if (grid[rx][ry].type !== 'road') {
                    grid[rx][ry].type = 'tree';
                }
            }
        }

        function getRoadNeighbors(tile) {
            const neighbors = [];
            const dirs = [
                {x:1, y:0}, {x:-1, y:0}, {x:0, y:1}, {x:0, y:-1}
            ];
            dirs.forEach(d => {
                const nx = tile.x + d.x;
                const ny = tile.y + d.y;
                if (nx >= 0 && nx < CONFIG.gridW && ny >= 0 && ny < CONFIG.gridH) {
                    if (grid[nx][ny].type === 'road') neighbors.push(grid[nx][ny]);
                }
            });
            return neighbors;
        }

        function simulateGrowth() {
            // Iterate randomly for performance
            for(let i=0; i<50; i++) {
                const rx = Math.floor(Math.random() * CONFIG.gridW);
                const ry = Math.floor(Math.random() * CONFIG.gridH);
                const tile = grid[rx][ry];

                // Chance to remove tree for road
                if (tile.type === 'tree' && Math.random() < 0.02) {
                    tile.type = 'grass';
                    // Extend road from center if close enough
                    const dist = Math.abs(rx - Math.floor(CONFIG.gridW/2));
                    if (dist < 15 && Math.random() < 0.1) {
                        tile.type = 'road';
                    }
                }

                // Build on grass if adjacent to road
                if (tile.type === 'grass' && tile.state === 'empty') {
                    const roadNeighbors = getRoadNeighbors(tile);
                    if (roadNeighbors.length > 0) {
                        if (Math.random() < 0.1) {
                            // Start building
                            tile.state = 'building';
                            tile.building = {
                                height: 20 + Math.random() * 40,
                                color: Math.random() > 0.5 ? CONFIG.colors.building.residential : CONFIG.colors.building.commercial,
                                progress: 0
                            };
                        }
                    }
                }

                // Grow buildings
                if (tile.state === 'building') {
                    tile.building.progress += 0.01;
                    if (tile.building.progress >= 1) {
                        tile.state = 'occupied';
                        // Chance to spawn car
                        if (Math.random() < 0.2) cars.push(new Car());
                        // Spawn smoke
                        if (tile.building.color === CONFIG.colors.building.industrial) {
                            particles.push(new Particle(tile.x, tile.y, 'smoke'));
                        }
                    }
                }
            }
            
            // Spawn more cars during growth
            if (cars.length < 20 && Math.random() < 0.05) cars.push(new Car());
        }

        function simulateDecay() {
            // Randomly ruin buildings
            for (let x = 0; x < CONFIG.gridW; x++) {
                for (let y = 0; y < CONFIG.gridH; y++) {
                    const tile = grid[x][y];
                    if (tile.state === 'occupied' && Math.random() < 0.005) {
                        tile.state = 'ruined';
                        // Add smoke
                        for(let k=0; k<5; k++) particles.push(new Particle(tile.x, tile.y, 'smoke'));
                    }
                }
            }

            // Overgrowth
            for (let x = 0; x < CONFIG.gridW; x++) {
                for (let y = 0; y < CONFIG.gridH; y++) {
                    const tile = grid[x][y];
                    if (tile.type === 'grass' && tile.state === 'ruined' && Math.random() < 0.01) {
                        tile.type = 'tree';
                    }
                }
            }
        }

        function resetWorld() {
            // Fade out cars
            cars = [];
            // Reset Grid
            initGrid();
            // Ensure trees come back
            for(let i=0; i<50; i++) {
                const rx = Math.floor(Math.random() * CONFIG.gridW);
                const ry = Math.floor(Math.random() * CONFIG.gridH);
                grid[rx][ry].type = 'tree';
            }
        }

        function updatePhase() {
            phaseTimer++;
            const duration = CONFIG.phaseDurations[currentPhase];

            // UI Update
            let pop = 0;
            grid.forEach(row => row.forEach(t => { if(t.state==='occupied') pop++; }));
            popText.innerText = pop;
            
            if (phaseTimer > duration) {
                currentPhase++;
                if (currentPhase > CONFIG.phases.RUIN) {
                    currentPhase = CONFIG.phases.NATURE;
                    resetWorld();
                }
                phaseTimer = 0;

                // Update UI Text
                const names = ["Nature", "Growth", "Peak", "Decay", "Ruin"];
                cycleText.innerText = names[currentPhase];
            }

            // Phase specific logic
            switch(currentPhase) {
                case CONFIG.phases.GROWTH:
                    simulateGrowth();
                    break;
                case CONFIG.phases.PEAK:
                    // Maintain status quo, maybe small growth
                    simulateGrowth();
                    break;
                case CONFIG.phases.DECAY:
                    simulateDecay();
                    break;
                case CONFIG.phases.RUIN:
                    // Nature takes over aggressively
                    for(let i=0; i<5; i++) {
                        const rx = Math.floor(Math.random() * CONFIG.gridW);
                        const ry = Math.floor(Math.random() * CONFIG.gridH);
                        if(grid[rx][ry].type !== 'tree') grid[rx][ry].type = 'tree';
                    }
                    break;
            }
        }

        // --- Main Loop ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Center offset
            offsetX = width / 2;
            offsetY = height / 2 - (CONFIG.gridH * CONFIG.tileHeight) / 2 + 50;
        }

        function loop() {
            // Clear
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);

            updatePhase();

            // Update Cars
            cars.forEach(car => car.update());

            // Update Particles
            particles.forEach(p
