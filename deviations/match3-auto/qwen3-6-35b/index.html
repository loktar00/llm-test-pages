<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Playing Match-3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cellSize, offsetX, offsetY, cols, rows;
const COLS = 8, ROWS = 8;
const GEM_TYPES = 7;
const COLORS = ['#ff4466','#44aaff','#44ff88','#ffdd44','#cc44ff','#ff8844','#44ffdd'];
const GEM_SHAPES = ['circle','diamond','square','triangle','star','hexagon','pentagon'];

let board = [];
let gems = [];
let particles = [];
let sparkles = [];
let score = 0;
let scoreDisplay = 0;
let combo = 0;
let phase = 'IDLE';
let phaseTimer = 0;
let swapState = null;
let matchCells = [];
let popGems = [];
let fallingGems = [];
let refillGems = [];
let animating = false;
let lastTime = 0;
let delayTimer = 0;
const DELAY = 1.0;
let boardGlow = 0;
let shakeX = 0, shakeY = 0;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const maxW = W * 0.85;
    const maxH = H * 0.85;
    cellSize = Math.min(maxW / COLS, maxH / ROWS);
    offsetX = (W - cellSize * COLS) / 2;
    offsetY = (H - cellSize * ROWS) / 2;
}
window.addEventListener('resize', resize);
resize();

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function randFloat(a, b) { return Math.random() * (b - a) + a; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeOutBack(t) { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeOutElastic(t) { if(t===0||t===1) return t; return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI)/3)+1; }

function createGem(type, col, row, fromTop) {
    return {
        type, col, row,
        x: col, y: row,
        animX: col, animY: fromTop ? -2 + Math.random() : row,
        targetX: col, targetY: row,
        alpha: 1, scale: 1,
        popping: false, popT: 0,
        falling: false, fallSpeed: 0,
        refilling: false,
        alive: true,
        glow: 0,
        sparkleTimer: 0
    };
}

function initBoard() {
    board = [];
    gems = [];
    for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
            let type;
            do {
                type = randInt(0, GEM_TYPES - 1);
            } while (
                (c >= 2 && board[r][c-1] === type && board[r][c-2] === type) ||
                (r >= 2 && board[r-1][c] === type && board[r-2][c] === type)
            );
            board[r][c] = type;
            const g = createGem(type, c, r, false);
            gems.push(g);
        }
    }
}

function findValidSwap() {
    const candidates = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            // Try swap right
            if (c < COLS - 1) {
                board[r][c] ^= board[r][c+1];
                board[r][c+1] ^= board[r][c];
                board[r][c] ^= board[r][c+1];
                if (findMatchesAt(r, c) || findMatchesAt(r, c+1)) {
                    candidates.push({r1:r,c1:c,r2:r,c2:c+1});
                }
                board[r][c] ^= board[r][c+1];
                board[r][c+1] ^= board[r][c];
                board[r][c] ^= board[r][c+1];
            }
            // Try swap down
            if (r < ROWS - 1) {
                board[r][c] ^= board[r+1][c];
                board[r+1][c] ^= board[r][c];
                board[r][c] ^= board[r+1][c];
                if (findMatchesAt(r, c) || findMatchesAt(r+1, c)) {
                    candidates.push({r1:r,c1:c,r2:r+1,c2:c});
                }
                board[r][c] ^= board[r+1][c];
                board[r+1][c] ^= board[r][c];
                board[r][c] ^= board[r+1][c];
            }
        }
    }
    if (candidates.length === 0) return null;
    return candidates[randInt(0, candidates.length - 1)];
}

function findMatchesAt(r, c) {
    const type = board[r][c];
    if (type === -1) return false;
    // Horizontal
    let hc = 1;
    for (let dc = 1; c+dc < COLS && board[r][c+dc] === type; dc++) hc++;
    for (let dc = 1; c-dc >= 0 && board[r][c-dc] === type; dc++) hc++;
    if (hc >= 3) return true;
    // Vertical
    let vc = 1;
    for (let dr = 1; r+dr < ROWS && board[r+dr][c] === type; dr++) vc++;
    for (let dr = 1; r-dr >= 0 && board[r-dr][c] === type; dr++) vc++;
    if (vc >= 3) return true;
    return false;
}

function findAllMatches() {
    const matched = new Set();
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
            if (board[r][c] === -1) continue;
            let type = board[r][c];
            let len = 1;
            while (c+len < COLS && board[r][c+len] === type) len++;
            if (len >= 3) {
                for (let i = 0; i < len; i++) matched.add(r * COLS + c + i);
            }
        }
    }
    // Vertical
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
            if (board[r][c] === -1) continue;
            let type = board[r][c];
            let len = 1;
            while (r+len < ROWS && board[r+len][c] === type) len++;
            if (len >= 3) {
                for (let i = 0; i < len; i++) matched.add((r+i) * COLS + c);
            }
        }
    }
    return [...matched].map(idx => ({col: idx % COLS, row: Math.floor(idx / COLS)}));
}

function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = randFloat(0, Math.PI * 2);
        const spd = randFloat(speed * 0.5, speed);
        particles.push({
            x: x + randFloat(-5, 5),
            y: y + randFloat(-5, 5),
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - randFloat(1, 3),
            life: 1,
            decay: randFloat(0.015, 0.035),
            size: randFloat(3, 8),
            color,
            type: 'circle'
        });
    }
}

function spawnSparkles(x, y, count) {
    for (let i = 0; i < count; i++) {
        const angle = randFloat(0, Math.PI * 2);
        const spd = randFloat(2, 6);
        sparkles.push({
            x: x + randFloat(-10, 10),
            y: y + randFloat(-10, 10),
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - randFloat(2, 5),
            life: 1,
            decay: randFloat(0.008, 0.02),
            size: randFloat(2, 5),
            rotation: randFloat(0, Math.PI * 2),
            rotSpeed: randFloat(-0.1, 0.1)
        });
    }
}

function gemPixelPos(g) {
    return {
        x: offsetX + g.animX * cellSize + cellSize / 2,
        y: offsetY + g.animY * cellSize + cellSize / 2
    };
}

function drawGem(g) {
    const {x, y} = gemPixelPos(g);
    const s = cellSize * 0.38 * g.scale;
    const color = COLORS[g.type];

    ctx.save();
    ctx.globalAlpha = g.alpha;
    ctx.translate(x, y);

    // Glow
    if (g.glow > 0) {
        const grad = ctx.createRadialGradient(0, 0, s * 0.3, 0, 0, s * 2);
        grad.addColorStop(0, color + '88');
        grad.addColorStop(1, color + '00');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, s * 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(2, 3, s * 0.9, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Gem body
    const grad = ctx.createRadialGradient(-s*0.3, -s*0.3, 0, 0, 0, s);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, color);
    grad.addColorStop(1, darkenColor(color, 0.5));
    ctx.fillStyle = grad;

    ctx.beginPath();
    const shape = g.type % GEM_SHAPES.length;
    switch(shape) {
        case 0: // circle
            ctx.arc(0, 0, s, 0, Math.PI * 2);
            break;
        case 1: // diamond
            ctx.moveTo(0, -s);
            ctx.lineTo(s * 0.7, 0);
            ctx.lineTo(0, s);
            ctx.lineTo(-s * 0.7, 0);
            break;
        case 2: // square
            ctx.rect(-s * 0.75, -s * 0.75, s * 1.5, s * 1.5);
            break;
        case 3: // triangle
            ctx.moveTo(0, -s);
            ctx.lineTo(s * 0.85, s * 0.6);
            ctx.lineTo(-s * 0.85, s * 0.6);
            break;
        case 4: // star
            for (let i = 0; i < 5; i++) {
                const a1 = (i * 72 - 90) * Math.PI / 180;
                const a2 = ((i * 72) + 36 - 90) * Math.PI / 180;
                if (i === 0) ctx.moveTo(Math.cos(a1) * s, Math.sin(a1) * s);
                else ctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
                ctx.lineTo(Math.cos(a2) * s * 0.4, Math.sin(a2) * s * 0.4);
            }
            ctx.closePath();
            break;
        case 5: // hexagon
            for (let i = 0; i < 6; i++) {
                const a = (i * 60 - 90) * Math.PI / 180;
                if (i === 0) ctx.moveTo(Math.cos(a) * s, Math.sin(a) * s);
                else ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
            }
            break;
        case 6: // pentagon
            for (let i = 0; i < 5; i++) {
                const a = (i * 72 - 90) * Math.PI / 180;
                if (i === 0) ctx.moveTo(Math.cos(a) * s, Math.sin(a) * s);
                else ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
            }
            break;
    }
    ctx.fill();

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-s * 0.25, -s * 0.3, s * 0.25, s * 0.15, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

function darkenColor(hex, factor) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
}

function drawBoard() {
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Board background
    ctx.fillStyle = '#12122a';
    ctx.strokeStyle = '#2a2a4a';
    ctx.lineWidth = 2;
    const bw = cellSize * COLS;
    const bh = cellSize * ROWS;
    const r = 8;
    ctx.beginPath();
    ctx.roundRect(offsetX - 4, offsetY - 4, bw + 8, bh + 8, r);
    ctx.fill();
    ctx.stroke();

    // Grid cells
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x = offsetX + c * cellSize;
            const y = offsetY + r * cellSize;
            ctx.fillStyle = (r + c) % 2 === 0 ? '#1a1a35' : '#161630';
            ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
        }
    }

    // Board glow
    if (boardGlow > 0) {
        ctx.fillStyle = `rgba(100,100,255,${boardGlow * 0.1})`;
        ctx.beginPath();
        ctx.roundRect(offsetX - 4, offsetY - 4, bw + 8, bh + 8, r);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawSparkles() {
    for (const s of sparkles) {
        ctx.save();
        ctx.globalAlpha = s.life;
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        // Draw a small star sparkle
        for (let i = 0; i < 4; i++) {
            const a = (i * 90) * Math.PI / 180;
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * s.size, Math.sin(a) * s.size);
        }
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }
}

function drawScore() {
    scoreDisplay = lerp(scoreDisplay, score, 0.08);
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.floor(cellSize * 0.5)}px 'Segoe UI', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    const sx = W / 2;
    const sy = offsetY - 50;

    // Score background
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(sx - 120, sy - 10, 240, 50, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(100,100,255,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.fillText(`SCORE: ${Math.floor(scoreDisplay)}`, sx, sy);

    if (combo > 1) {
        ctx.font = `bold ${Math.floor(cellSize * 0.35)}px 'Segoe UI', Arial, sans-serif`;
        ctx.fillStyle = `hsl(${combo * 40}, 100%, 70%)`;
        ctx.fillText(`COMBO x${combo}!`, sx, sy + 38);
    }
    ctx.restore();
}

function update(dt) {
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.05;
        s.vx *= 0.99;
        s.rotation += s.rotSpeed;
        s.life -= s.decay;
        if (s.life <= 0) sparkles.splice(i, 1);
    }

    boardGlow *= 0.95;
    shakeX *= 0.9;
    shakeY *= 0.9;

    if (phase === 'IDLE') {
        delayTimer += dt;
        if (delayTimer >= DELAY) {
            delayTimer = 0;
            combo = 0;
            phase = 'SWAPPING';
            swapState = findValidSwap();
            if (!swapState) {
                // Board is stuck, reshuffle
                initBoard();
                phase = 'IDLE';
            }
        }
    } else if (phase === 'SWAPPING') {
        const {r1, c1, r2, c2} = swapState;
        // Find gems
        const g1 = gems.find(g => g.col === c1 && g.row === r1 && g.alive);
        const g2 = gems.find(g => g.col === c2 && g.row === r2 && g.alive);
        if (g1 && g2) {
            g1.targetX = c2;
            g1.targetY = r2;
            g2.targetX = c1;
            g2.targetY = r1;
            g1.animX = c1; g1.animY = r1;
            g2.animX = c2; g2.animY = r2;
        }
        // Swap in board
        board[r1][c1] ^= board[r2][c2];
        board[r2][c2] ^= board[r1][c1];
        board[r1][c2] ^= board[r2][c1];

        // Actually swap properly
        const temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;

        // Update gem positions
        if (g1) { g1.col = c2; g1.row = r2; }
        if (g2) { g2.col = c1; g2.row = r1; }

        phaseTimer += dt;
        if (phaseTimer >= 0.25) {
            phaseTimer = 0;
            phase = 'DETECTING';
            matchCells = findAllMatches();
            if (matchCells.length === 0) {
                phase = 'IDLE';
            }
        }
    } else if (phase === 'DETECTING') {
        if (matchCells.length > 0) {
            phase = 'POPPING';
            phaseTimer = 0;
            popGems = [];
            for (const mc of matchCells) {
                const g = gems.find(g => g.col === mc.col && g.row === mc.row && g.alive);
                if (g) {
                    g.popping = true;
                    g.popT = 0;
                    popGems.push(g);
                }
            }
            boardGlow = Math.min(matchCells.length * 0.15, 1);
        } else {
            phase = 'IDLE';
        }
    } else if (phase === 'POPPING') {
        phaseTimer += dt;
        let allDone = true;
        for (const g of popGems) {
            if (g.popT < 1) {
                g.popT = Math.min(1, g.popT + dt * 4);
                allDone = false;
            }
        }
        if (allDone) {
            // Remove gems
            for (const g of popGems) {
                const {x, y} = gemPixelPos(g);
                const color = COLORS[g.type];
                const burstCount = Math.min(8 + combo * 3, 20);
                spawnParticles(x, y, color, burstCount, 3 + combo);
                if (combo > 1) {
                    spawnSparkles(x, y, combo * 4);
                }
                g.alive = false;
            }
            // Score
            const points = matchCells.length * 10 * combo;
            score += points;

            // Remove matched from board
            for (const mc of matchCells) {
                board[mc.row][mc.col] = -1;
            }

            phase = 'FALLING';
            phaseTimer = 0;
            fallingGems = [];
            refillGems = [];

            // Calculate gravity
            for (let c = 0; c < COLS; c++) {
                let emptySlots = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c] === -1) {
                        emptySlots++;
                    } else if (emptySlots > 0) {
                        const g = gems.find(g => g.col === c && g.row === r && g.alive);
                        if (g) {
                            g.targetY = r + emptySlots;
                            g.animY = r;
                            g.falling = true;
                            g.fallSpeed = 0;
                            fallingGems.push(g);
                            board[r + emptySlots][c] = board[r][c];
                            board[r][c] = -1;
                        }
                    }
                }
                // Refill
                for (let i = 0; i < emptySlots; i++) {
                    const type = randInt(0, GEM_TYPES - 1);
                    const g = createGem(type, c, emptySlots - 1 - i, true);
                    g.targetY = emptySlots - 1 - i;
                    g.animY = -2 - (emptySlots - 1 - i);
                    g.refilling = true;
                    refillGems.push(g);
                    board[i][c] = type;
                    gems.push(g);
                }
            }
        }
    } else if (phase === 'FALLING') {
        let allDone = true;
        for (const g of fallingGems) {
            if (g.animY < g.targetY) {
                g.fallSpeed += dt * 15;
                g.animY += g.fallSpeed * dt;
                if (g.animY >= g.targetY) {
                    g.animY = g.targetY;
                    g.falling = false;
                    g.fallSpeed = 0;
                    // Bounce
                    if (g.animY !== g.targetY) {
                        // landed
                    }
                }
                allDone = false;
            }
        }
        for (const g of refillGems) {
            if (g.animY < g.targetY) {
                g.fallSpeed += dt * 12;
                g.animY += g.fallSpeed * dt;
                if (g.animY >= g.targetY) {
                    g.animY = g.targetY;
                    g.refilling = false;
                    g.fallSpeed = 0;
                }
                allDone = false;
            }
        }

        // Smooth swap animation
        for (const g of gems) {
            if (g.alive && !g.popping) {
                if (g.animX !== g.targetX) {
                    g.animX = lerp(g.animX, g.targetX, 0.15);
                    allDone = false;
                }
                if (!g.falling && !g.refilling && g.animY !== g.targetY) {
                    g.animY = lerp(g.animY, g.targetY, 0.15);
                    allDone = false;
                }
            }
        }

        if (allDone) {
            // Snap to grid
            for (const g of gems) {
                if (g.alive) {
                    g.animX = Math.round(g.targetX);
                    g.animY = Math.round(g.targetY);
                }
            }
            phase = 'COMBO_CHECK';
            phaseTimer = 0;
        }
    } else if (phase === 'COMBO_CHECK') {
        phaseTimer += dt;
        if (phaseTimer >= 0.3) {
            matchCells = findAllMatches();
            if (matchCells.length > 0) {
                combo++;
                phase = 'POPPING';
                phaseTimer = 0;
                popGems = [];
                for (const mc of matchCells) {
                    const g = gems.find(g => g.col === mc.col && g.row === mc.row && g.alive);
                    if (g) {
                        g.popping = true;
                        g.popT = 0;
                        popGems.push(g);
                    }
                }
                boardGlow = Math.min(matchCells.length * 0.15, 1);
                shakeX = randFloat(-combo, combo);
                shakeY = randFloat(-combo, combo);
            } else {
                phase = 'IDLE';
                delayTimer = 0;
            }
        }
    }

    // Update gem animations
    for (const g of gems) {
        if (g.alive && !g.popping) {
            // Smooth horizontal movement
            g.animX = lerp(g.animX, g.targetX, 0.18);
            // Smooth vertical movement for non-falling
            if (!g.falling && !g.refilling) {
                g.animY = lerp(g.animY, g.targetY, 0.18);
            }
            // Glow pulse for matched gems
            if (g.glow > 0) {
                g.glow -= dt * 2;
            }
        }
        // Pop animation
        if (g.popping) {
            g.popT = Math.min(1, g.popT + dt * 5);
            g.scale = 1 - g.popT * 0.8;
            g.alpha = 1 - g.popT;
        }
    }
}

function render() {
    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawBoard();

    // Draw gems sorted by row for depth
    const sortedGems = gems.filter(g => g.alive).sort((a, b) => a.row - b.row);
    for (const g of sortedGems) {
        drawGem(g);
    }

    drawParticles();
    drawSparkles();
    drawScore();

    ctx.restore();
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

initBoard();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
