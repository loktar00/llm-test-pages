<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Fireworks Festival · Night River</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04070f}
  body{font-family:ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif}
  canvas{position:fixed;inset:0;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(130% 100% at 50% 38%, transparent 55%, rgba(1,3,9,.55) 100%)}
  .marque{position:fixed;top:26px;left:30px;z-index:3;pointer-events:none;user-select:none;
    opacity:0;animation:marquein 2.2s cubic-bezier(.2,.7,.2,1) .3s forwards}
  .marque .kicker{font-size:10px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,206,138,.85)}
  .marque h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:400;
    font-size:clamp(22px,3.4vw,34px);line-height:1.05;color:#f2ead6;margin:6px 0 5px;
    text-shadow:0 1px 14px rgba(0,0,0,.65)}
  .marque h1 em{font-style:italic;color:#ffd98a}
  .marque .rule{width:52px;height:1px;margin:2px 0 6px;
    background:linear-gradient(90deg,rgba(255,206,138,.8),rgba(255,206,138,0))}
  .marque .sub{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(158,182,214,.6)}
  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:3;pointer-events:none;
    font-size:10px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;white-space:nowrap;
    color:rgba(255,220,168,.75);text-shadow:0 1px 8px rgba(0,0,0,.8);
    opacity:0;animation:hintin 1.4s ease 2.6s forwards;transition:opacity .8s ease}
  .hint.gone{opacity:0!important}
  @keyframes marquein{from{opacity:0;transform:translateY(10px)}to{opacity:.92;transform:none}}
  @keyframes hintin{from{opacity:0}to{opacity:.85}}
  @media (prefers-reduced-motion:reduce){.marque{animation:none;opacity:.92}.hint{animation:none;opacity:.85}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<header class="marque" aria-hidden="true">
  <div class="kicker">Grand Pyrotechnic Display</div>
  <h1>Fireworks <em>Festival</em></h1>
  <div class="rule"></div>
  <div class="sub">night river &middot; endless</div>
</header>
<div class="hint" id="hint">tap anywhere &middot; enable sound</div>
<script>
(()=>{ 'use strict';
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>(a+Math.random()*(b-a+1))|0;
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

const PAL={
  gold:['#ffd98a','#ffc45e','#fff2c9','#ffb347'],
  crimson:['#ff6b6b','#ff2e63','#ff9eb3','#ff4d6d'],
  jade:['#5ef2c8','#2fd0ff','#c8fff0','#7bd8ff'],
  violet:['#c9a6ff','#8f6bff','#efe0ff','#b388ff'],
  silver:['#eef4ff','#cfe0ff','#ffffff','#bcd2ff'],
  coral:['#ffb37a','#ff7a45','#ffd9b3','#ff9457']
};
const RGB={}; for(const k in PAL) RGB[k]=PAL[k].map(hexRGB);
const PEONY=['crimson','jade','violet','coral','silver','gold'];
const RINGP=['jade','silver','violet','gold'];
const PAIRS=[['crimson','gold'],['jade','crimson'],['violet','gold'],['silver','coral'],['gold','jade'],['coral','silver']];
const TRAIL=[[255,214,150],[255,178,102],[255,236,196]];

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const sky=document.createElement('canvas'), sk=sky.getContext('2d');
const cityC=document.createElement('canvas'), cc=cityC.getContext('2d');

let W=0,H=0,DPR=1,horizonY=0,riverH=0,SLICE=3,cityTop=0,MAXP=3000;
let stars=[],flickers=[],beacons=[],ripples=[],clouds=[],wl=[];
let parts=[],shells=[],delays=[],queue=[],wlights=[],meteors=[];
let time=0,last=performance.now(),nextLaunch=2.8,nextMeteor=rand(8,18);
let finaleEnd=-1,nextFinale=rand(95,130),grandFired=false;
let wind=0,glowPulse=0;

/* ================= audio (synth only, starts on first gesture) ================= */
let AC=null,master=null,noiseBuf=null; const whistles=new Set();
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.55;
    const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,(AC.sampleRate*1.2)|0,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
const audioOK=()=>AC&&AC.state==='running';
function startWhistle(s){
  if(!audioOK()||whistles.size>5)return;
  const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type='sine'; const f0=rand(430,650); o.frequency.value=f0;
  lfo.type='sine'; lfo.frequency.value=rand(5,9); lg.gain.value=14;
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.linearRampToValueAtTime(0.03,AC.currentTime+0.15);
  o.connect(g); g.connect(master); o.start(); lfo.start();
  s.w={o,g,lfo,f0}; whistles.add(s);
}
function stopWhistle(s){
  if(!s.w)return; whistles.delete(s);
  const {o,g,lfo}=s.w, t=AC.currentTime;
  try{
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(g.gain.value,0.0001),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    o.stop(t+0.12); lfo.stop(t+0.12);
  }catch(e){}
  s.w=null;
}
function boom(x,scale,sharp){
  if(!audioOK())return;
  const t0=AC.currentTime+rand(0.01,0.07);
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.value=clamp(950/scale,260,1500); f.Q.value=0.7;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(clamp(0.34/Math.sqrt(scale),0.08,0.5),t0+0.025);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+rand(0.5,0.95));
  let node=g;
  if(AC.createStereoPanner){
    const p=AC.createStereoPanner(); p.pan.value=clamp((x/W)*1.6-0.8,-1,1);
    g.connect(p); node=p;
  }
  src.connect(f); f.connect(g); node.connect(master);
  src.start(t0); src.stop(t0+1.1);
  const o=AC.createOscillator(),og=AC.createGain(); o.type='sine';
  o.frequency.setValueAtTime(160,t0); o.frequency.exponentialRampToValueAtTime(42,t0+0.3);
  og.gain.setValueAtTime(0.0001,t0);
  og.gain.exponentialRampToValueAtTime(0.22,t0+0.02);
  og.gain.exponentialRampToValueAtTime(0.0001,t0+0.38);
  o.connect(og); og.connect(master); o.start(t0); o.stop(t0+0.45);
  if(sharp)crackle(6);
}
function crackle(n){
  if(!audioOK())return;
  for(let i=0;i<n;i++){
    const t0=AC.currentTime+rand(0.05,0.75);
    const src=AC.createBufferSource(); src.buffer=noiseBuf;
    const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=2400;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(rand(0.02,0.06),t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.05);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0+0.08);
  }
}
const hint=document.getElementById('hint');
function wake(){ initAudio(); if(hint)hint.classList.add('gone'); }
['pointerdown','keydown','touchstart'].forEach(e=>window.addEventListener(e,wake,{passive:true}));
if(!('AudioContext' in window)&&!('webkitAudioContext' in window)&&hint)hint.style.display='none';

/* ================= skyline & scene ================= */
function buildCity(){
  cc.setTransform(DPR,0,0,DPR,0,0);
  cc.clearRect(0,0,W,H);
  cityTop=horizonY;
  // far bank
  let x=-20;
  while(x<W+20){
    const w=rand(26,70),h=rand(H*0.04,H*0.13);
    cc.fillStyle='rgba(24,36,60,0.9)';
    cc.fillRect(x,horizonY-h,w,h);
    if(Math.random()<0.25)cc.fillRect(x+w*0.4,horizonY-h-6,2,6);
    cityTop=Math.min(cityTop,horizonY-h-8);
    x+=w+rand(2,14);
  }
  // near skyline
  x=-10;
  while(x<W+10){
    const w=rand(34,92), h=rand(H*0.05,H*0.24), top=horizonY-h;
    cc.fillStyle=`rgb(${irand(9,14)},${irand(13,19)},${irand(24,33)})`;
    cc.fillRect(x,top,w,h);
    cc.fillStyle='rgba(255,255,255,0.045)'; cc.fillRect(x,top,w,1);
    const cw=5,ch=6;
    for(let wy=top+6; wy<horizonY-6; wy+=ch+4){
      for(let wx=x+4; wx<x+w-6; wx+=cw+4){
        if(Math.random()<0.30){
          const warm=Math.random()<0.72;
          cc.fillStyle=warm?`rgba(255,208,140,${rand(0.25,0.85)})`:`rgba(168,208,255,${rand(0.2,0.6)})`;
          cc.fillRect(wx,wy,cw,ch);
          if(Math.random()<0.05)flickers.push({x:wx,y:wy,w:cw,h:ch,
            c:warm?'255,214,150':'190,220,255',ph:rand(0,TAU),sp:rand(0.6,2.6),a:rand(0.3,0.8)});
        }
      }
    }
    const roll=Math.random();
    if(roll<0.18&&h>H*0.12){
      const ax=x+w*rand(0.3,0.7), ah=rand(14,34);
      cc.fillStyle='rgb(18,24,38)'; cc.fillRect(ax-1,top-ah,2,ah);
      beacons.push({x:ax,y:top-ah-2,ph:rand(0,TAU),sp:rand(0.8,1.6)});
      cityTop=Math.min(cityTop,top-ah-4);
    }else if(roll<0.32){
      const tw=Math.min(14,w*0.35), th=rand(9,14), tx=x+w*rand(0.2,0.6);
      cc.fillStyle='rgb(12,16,27)';
      cc.fillRect(tx,top-th,tw,th);
      cc.beginPath();cc.moveTo(tx-1,top-th);cc.lineTo(tx+tw/2,top-th-6);cc.lineTo(tx+tw+1,top-th);cc.closePath();cc.fill();
      cityTop=Math.min(cityTop,top-th-8);
    }else if(roll<0.5){
      const w2=w*rand(0.4,0.6), h2=rand(10,26);
      cc.fillStyle='rgb(11,15,26)'; cc.fillRect(x+(w-w2)/2,top-h2,w2,h2);
      if(Math.random()<0.5){
        const ax=x+w/2; cc.fillRect(ax-1,top-h2-10,2,10);
        beacons.push({x:ax,y:top-h2-12,ph:rand(0,TAU),sp:rand(0.7,1.4)});
      }
      cityTop=Math.min(cityTop,top-h2-14);
    }
    x+=w+rand(3,18);
  }
  const g=cc.createLinearGradient(0,horizonY-14,0,horizonY);
  g.addColorStop(0,'rgba(255,166,92,0)'); g.addColorStop(1,'rgba(255,166,92,0.10)');
  cc.fillStyle=g; cc.fillRect(0,horizonY-14,W,14);
}

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1, (W*H>1.4e6)?1.5:2);
  for(const c of [cv,sky,cityC]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); }
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horizonY=Math.round(H*0.63); riverH=H-horizonY;
  SLICE=Math.max(2,Math.round(riverH/110));
  MAXP=Math.round(clamp(W*H/380,1400,4200));
  stars=[]; const ns=Math.round(W*H/9000);
  for(let i=0;i<ns;i++)stars.push({x:Math.random()*W,y:Math.random()*horizonY*0.94,
    r:rand(0.4,1.3),a:rand(0.25,0.9),sp:rand(0.4,2.2),ph:rand(0,TAU)});
  flickers=[]; beacons=[]; buildCity();
  ripples=[]; for(let i=0;i<7;i++)ripples.push({y:rand(0.06,0.95),
    sp:rand(6,22)*(Math.random()<0.5?-1:1),ph:rand(0,TAU),a:rand(0.02,0.05)});
  clouds=[]; for(let i=0;i<4;i++){ const s=rand(180,420);
    clouds.push({x:rand(-100,W),y:rand(H*0.05,H*0.3),w:s,h:s*rand(0.16,0.3),
      v:rand(3,9)*(Math.random()<0.5?-1:1),a:rand(0.04,0.09)});
  }
  wl=[]; const n=Math.max(3,Math.round(W/340));
  for(let i=0;i<n;i++){
    wl.push({x:W*(i+0.5)/n+rand(-30,30),y:horizonY+rand(6,26),
      c:Math.random()<0.7?[255,186,120]:[150,220,255]});
  }
  parts.length=Math.min(parts.length,MAXP);
}

/* ================= particles ================= */
function addP(x,y,vx,vy,decay,grav,drag,size,col,o){
  if(parts.length>=MAXP)return;
  o=o||{};
  parts.push({x,y,px:x,py:y,vx,vy,decay,grav,drag,size,col,life:1,
    flick:!!o.flick,glit:!!o.glit,
    emberAt:o.emberAt==null?0.55:o.emberAt,wk:o.wk==null?1:o.wk});
}
function flash(x,y,pal,r){
  const c=RGB[pal][0];
  parts.push({x,y,px:x,py:y,vx:0,vy:0,decay:5.5,grav:0,drag:1,size:r,col:c,
    life:1,flick:false,glit:false,emberAt:-1,wk:0,flash:true});
}
function spawnPeony(x,y,pal,sc,dim){
  const cols=RGB[pal], n=Math.round((dim?95:130)*sc);
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), sp=(4.1*sc)*(0.3+0.7*Math.sqrt(Math.random()))*rand(0.85,1.1);
    addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp*0.94,rand(0.45,0.72),rand(0.042,0.058),0.9855,
      dim?1.35:1.6,pick(cols),{flick:true});
  }
}
function spawnWillow(x,y,sc){
  const n=Math.round(85*sc);
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), sp=(2.5*sc)*(0.4+0.6*Math.sqrt(Math.random()));
    addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp*0.9,rand(0.24,0.34),0.05,0.958,1.7,
      RGB.gold[irand(0,2)],{flick:true,emberAt:0.4,wk:1.7});
  }
}
function spawnRing(x,y,pal,sc){
  const n=Math.round(78*sc), cols=RGB[pal];
  let nx=rand(-0.85,0.85),ny=rand(-0.85,0.85),nz=rand(0.3,1);
  const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
  const ul=Math.hypot(nz,ny)||1;
  const ux=0, uy=nz/ul, uz=-ny/ul;
  const rx=ny*uz-nz*uy, ry=nz*ux-nx*uz, rz=nx*uy-ny*ux;
  const rot=rand(0,TAU), cr=Math.cos(rot), sr=Math.sin(rot);
  for(let i=0;i<n;i++){
    const th=i/n*TAU+rand(-0.02,0.02);
    let dx=ux*Math.cos(th)+rx*Math.sin(th);
    let dy=uy*Math.cos(th)+ry*Math.sin(th);
    const dx2=dx*cr-dy*sr, dy2=dx*sr+dy*cr; dx=dx2; dy=dy2;
    const sp=3.9*sc*rand(0.97,1.04);
    addP(x,y,dx*sp,dy*sp,rand(0.5,0.66),0.048,0.984,1.55,pick(cols),{flick:true});
  }
}
function secondary(d){
  flash(d.x,d.y,d.pal,54*d.sc);
  const n=Math.round(70*d.sc), cols=RGB[d.pal];
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), sp=(2.6*d.sc)*(0.35+0.65*Math.sqrt(Math.random()));
    addP(d.x,d.y,Math.cos(a)*sp,Math.sin(a)*sp*0.92,rand(0.5,0.75),0.05,0.984,1.5,pick(cols),{flick:true});
  }
  const m=Math.round(24*d.sc);
  for(let i=0;i<m;i++){
    const a=rand(0,TAU), sp=rand(0.4,2.2)*d.sc;
    addP(d.x,d.y,Math.cos(a)*sp,Math.sin(a)*sp,rand(0.3,0.45),0.045,0.99,1.3,
      RGB.silver[irand(0,3)],{glit:true,emberAt:0});
  }
  boom(d.x,d.sc,true);
}

/* ================= shells ================= */
function pickType(){
  const r=Math.random();
  return r<0.40?'peony':r<0.62?'ring':r<0.82?'double':'willow';
}
function launch(o){
  o=o||{};
  const x=o.x!=null?o.x:rand(W*0.08,W*0.92);
  const ty=o.ty!=null?o.ty:rand(H*0.13,H*0.40);
  const g=0.052*rand(0.92,1.08);
  const vy=-Math.sqrt(2*g*(horizonY+4-ty));
  const type=o.type||pickType();
  let pal,palB=null;
  if(type==='willow')pal='gold';
  else if(type==='ring')pal=pick(RINGP);
  else pal=pick(PEONY);
  if(type==='double'){ const pr=pick(PAIRS); pal=pr[0]; palB=pr[1]; }
  const s={x,y:horizonY+4,vx:rand(-0.35,0.35),vy,g,type,pal,palB,
    scale:o.big?1.5:1,vy0:vy,acc:0,w:null};
  shells.push(s);
  if(Math.random()<0.6)startWhistle(s);
}
function burst(s){
  const sc=s.scale;
  glowPulse=Math.min(1,glowPulse+0.3*sc);
  const P=s.pal;
  if(s.type==='peony'){ flash(s.x,s.y,P,60*sc); spawnPeony(s.x,s.y,P,sc,false); }
  else if(s.type==='willow'){ flash(s.x,s.y,'gold',44*sc); spawnWillow(s.x,s.y,sc); }
  else if(s.type==='ring'){ flash(s.x,s.y,P,50*sc); spawnRing(s.x,s.y,P,sc); }
  else{
    flash(s.x,s.y,P,70*sc); spawnPeony(s.x,s.y,P,sc*0.92,true);
    delays.push({t:time+rand(0.24,0.45),x:s.x+rand(-4,4),y:s.y+rand(-4,4),
      pal:s.palB||'gold',sc:sc*0.8});
  }
  boom(s.x,sc*(s.type==='double'?1.25:1),s.type==='double');
}
function updateShells(dt){
  const f60=dt*60;
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i];
    s.vy+=s.g*f60; s.x+=s.vx*f60; s.y+=s.vy*f60;
    s.acc+=dt*140;
    const n=Math.min(6,Math.floor(s.acc)); s.acc-=n;
    for(let k=0;k<n;k++){
      addP(s.x+rand(-1,1),s.y+rand(0,3),
        s.vx*0.3+rand(-0.35,0.35),-s.vy*0.06+rand(-0.1,0.3),
        rand(2.2,3.4),0.05,0.96,1.15,TRAIL[irand(0,2)],{emberAt:0.8});
    }
    if(Math.random()<0.3)
      addP(s.x,s.y,s.vx*0.2+rand(-0.5,0.5),rand(-0.2,0.4),rand(3,4),0.03,0.97,1.6,
        [255,255,240],{emberAt:0});
    if(s.w&&audioOK()){
      const pr=clamp(1-s.vy/s.vy0,0,1);
      s.w.o.frequency.setTargetAtTime(s.w.f0+pr*920,AC.currentTime,0.03);
    }
    if(s.vy>=-0.6){ if(s.w)stopWhistle(s); burst(s); shells.splice(i,1); }
    else if(s.y<-30){ if(s.w)stopWhistle(s); shells.splice(i,1); }
  }
}
function updateParts(dt){
  const f60=dt*60;
  let wsum=0;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=p.decay*dt;
    if(p.life<=0){ parts[i]=parts[parts.length-1]; parts.pop(); continue; }
    p.px=p.x; p.py=p.y;
    const dr=Math.pow(p.drag,f60);
    p.vx=p.vx*dr+wind*p.wk*0.014*f60;
    p.vy=p.vy*dr+p.grav*f60;
    p.x+=p.vx*f60; p.y+=p.vy*f60;
    wsum+=p.life;
  }
  return parts.length?wsum/parts.length:0;
}

/* ================= rendering ================= */
function renderSky(){
  sk.globalCompositeOperation='destination-out';
  sk.fillStyle='rgba(0,0,0,0.27)';
  sk.fillRect(0,0,W,H);
  sk.globalCompositeOperation='lighter';
  sk.lineCap='round';
  for(const p of parts){
    if(p.flash){
      const a=p.life*0.5;
      sk.globalAlpha=a*0.35;
      sk.fillStyle=`rgb(${p.col[0]},${p.col[1]},${p.col[2]})`;
      sk.beginPath();sk.arc(p.x,p.y,p.size*(1.7-p.life*0.7),0,TAU);sk.fill();
      sk.globalAlpha=a;
      sk.fillStyle='rgba(255,255,255,0.9)';
      sk.beginPath();sk.arc(p.x,p.y,p.size*0.35,0,TAU);sk.fill();
      continue;
    }
    let e=(p.emberAt>0&&p.life<p.emberAt)?(p.emberAt-p.life)/p.emberAt:0;
    if(e>1)e=1;
    const r=(p.col[0]+(255-p.col[0])*e)|0,
          g=(p.col[1]+(64-p.col[1])*e)|0,
          b=(p.col[2]+(18-p.col[2])*e)|0;
    let a=Math.pow(p.life,0.85);
    if(p.glit){ if(Math.random()<0.45)continue; a=Math.min(1,p.life*1.4); }
    else if(p.flick&&p.life<0.4)a*=0.45+0.55*Math.random();
    sk.globalAlpha=a;
    sk.strokeStyle=`rgb(${r},${g},${b})`;
    sk.lineWidth=p.size*(0.55+0.45*p.life);
    sk.beginPath();sk.moveTo(p.px,p.py);sk.lineTo(p.x+0.01,p.y+0.01);sk.stroke();
  }
  sk.globalAlpha=1;
  for(const s of shells){
    sk.fillStyle='rgba(255,196,130,0.28)';
    sk.beginPath();sk.arc(s.x,s.y,6,0,TAU);sk.fill();
    sk.fillStyle='rgba(255,246,220,0.95)';
    sk.beginPath();sk.arc(s.x,s.y,2,0,TAU);sk.fill();
  }
  sk.globalCompositeOperation='source-over';
}

function render(){
  // night sky
  let g=ctx.createLinearGradient(0,0,0,horizonY);
  g.addColorStop(0,'#040812');g.addColorStop(0.55,'#081226');g.addColorStop(1,'#101d38');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,horizonY+1);
  // stars
  ctx.fillStyle='#dfe9ff';
  for(const s of stars){
    ctx.globalAlpha=s.a*(0.55+0.45*Math.sin(time*s.sp+s.ph));
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  // meteors
  for(const m of meteors){
    ctx.globalAlpha=m.life*0.8;
    ctx.strokeStyle='rgba(210,230,255,0.9)'; ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*6,m.y-m.vy*6);ctx.stroke();
  }
  ctx.globalAlpha=1;
  // moon
  const mx=W*0.76,my=H*0.15,mr=Math.min(26,H*0.035);
  let mg=ctx.createRadialGradient(mx,my,mr*0.4,mx,my,mr*5);
  mg.addColorStop(0,'rgba(226,236,255,0.32)');mg.addColorStop(1,'rgba(226,236,255,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr*5,0,TAU);ctx.fill();
  ctx.fillStyle='#e9effb';ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(148,168,200,0.16)';
  ctx.beginPath();ctx.arc(mx-mr*0.3,my-mr*0.15,mr*0.22,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(mx+mr*0.25,my+mr*0.3,mr*0.15,0,TAU);ctx.fill();
  // drifting haze
  for(const cl of clouds){
    ctx.save();ctx.translate(cl.x,cl.y);ctx.scale(1,cl.h/cl.w);
    const cg=ctx.createRadialGradient(0,0,0,0,0,cl.w/2);
    cg.addColorStop(0,`rgba(120,140,180,${cl.a})`);cg.addColorStop(1,'rgba(120,140,180,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,cl.w/2,0,TAU);ctx.fill();
    ctx.restore();
  }
  // city light dome (pulses with the show)
  const gg=ctx.createRadialGradient(W/2,horizonY,10,W/2,horizonY,W*0.55);
  gg.addColorStop(0,`rgba(255,168,96,${0.10+glowPulse*0.10})`);
  gg.addColorStop(1,'rgba(255,168,96,0)');
  ctx.fillStyle=gg;ctx.fillRect(0,0,W,horizonY);
  // fireworks layer + skyline
  ctx.drawImage(sky,0,0,sky.width,sky.height,0,0,W,H);
  ctx.drawImage(cityC,0,0,cityC.width,cityC.height,0,0,W,H);
  for(const f of flickers){
    const a=f.a*(0.5+0.5*Math.sin(time*f.sp+f.ph));
    ctx.fillStyle=`rgba(${f.c},${a.toFixed(3)})`;
    ctx.fillRect(f.x,f.y,f.w,f.h);
  }
  for(const b of beacons){
    const s=Math.sin(time*b.sp+b.ph), a=s>0.55?(s-0.55)/0.45:0;
    if(a>0){
      ctx.fillStyle=`rgba(255,70,80,${(a*0.9).toFixed(3)})`;
      ctx.beginPath();ctx.arc(b.x,b.y,2,0,TAU);ctx.fill();
      ctx.fillStyle=`rgba(255,70,80,${(a*0.25).toFixed(3)})`;
      ctx.beginPath();ctx.arc(b.x,b.y,5,0,TAU);ctx.fill();
    }
  }
  // river base
  let wg=ctx.createLinearGradient(0,horizonY,0,H);
  wg.addColorStop(0,'#0b1830');wg.addColorStop(0.5,'#060d1c');wg.addColorStop(1,'#02050b');
  ctx.fillStyle=wg;ctx.fillRect(0,horizonY,W,riverH);
  // shimmering sliced reflection
  const comp=0.92, aw=0.9+0.1*Math.sin(time*2.1+1);
  for(let d=0,i=0;d<riverH;d+=SLICE,i++){
    const sy=horizonY-(d+SLICE)*comp;
    if(sy<0)break;
    const wob=Math.sin(time*1.9+i*0.31)*(0.5+d*0.012)+Math.sin(time*0.8+i*0.115+2)*1.1;
    const depth=1-d/riverH;
    ctx.globalAlpha=0.5*depth*aw;
    ctx.drawImage(sky,0,Math.max(0,sy)*DPR,sky.width,SLICE*DPR,wob,horizonY+d,W,SLICE);
    if(sy<cityTop+40){
      ctx.globalAlpha=0.42*depth*aw;
      ctx.drawImage(cityC,0,sy*DPR,cityC.width,SLICE*DPR,wob*0.75,horizonY+d,W,SLICE);
    }
  }
  ctx.globalAlpha=1;
  let tg=ctx.createLinearGradient(0,horizonY,0,H);
  tg.addColorStop(0,'rgba(8,15,30,0.12)');tg.addColorStop(1,'rgba(2,5,11,0.72)');
  ctx.fillStyle=tg;ctx.fillRect(0,horizonY,W,riverH);
  ctx.fillStyle='rgba(150,190,230,0.10)';ctx.fillRect(0,horizonY,W,1);
  // ripple lines
  ctx.lineWidth=1;
  for(const rp of ripples){
    const y=horizonY+rp.y*riverH;
    ctx.strokeStyle=`rgba(150,190,235,${rp.a})`;
    ctx.beginPath();
    for(let x=0;x<=W;x+=26){
      const yy=y+Math.sin(x*0.02+time*1.1+rp.ph)*1.6;
      x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  // moonlight path
  const pw=mr*2.4;
  for(let k=0;k<16;k++){
    const dd=Math.pow(Math.random(),0.7)*riverH;
    const ww=pw*(0.25+dd/riverH*1.5)*rand(0.25,1);
    ctx.fillStyle=`rgba(220,232,255,${rand(0.02,0.10)*(1-dd/riverH*0.6)})`;
    ctx.fillRect(mx+rand(-ww,ww)*0.5-ww*0.25,horizonY+dd,ww*0.5,1.5);
  }
  // glints cast by active bursts
  for(const L of wlights){
    const k=Math.ceil(3+6*L.i);
    for(let j=0;j<k;j++){
      const dd=Math.pow(Math.random(),0.8)*riverH*0.85;
      const ww=rand(2,5)+dd*0.045;
      ctx.globalAlpha=rand(0.05,0.4)*L.i*(1-dd/riverH*0.7);
      ctx.fillStyle=`rgb(${L.col[0]},${L.col[1]},${L.col[2]})`;
      ctx.fillRect(L.x+rand(-1,1)*ww*1.4-ww/2,horizonY+dd,ww,1.4);
    }
  }
  ctx.globalAlpha=1;
  // mooring lights on the near water
  for(const L of wl){
    const fl=0.75+0.25*Math.sin(time*3+L.x);
    ctx.fillStyle=`rgba(${L.c[0]},${L.c[1]},${L.c[2]},${0.85*fl})`;
    ctx.fillRect(L.x-1,L.y-1,2,2);
    ctx.fillStyle=`rgba(${L.c[0]},${L.c[1]},${L.c[2]},${0.18*fl})`;
    ctx.fillRect(L.x-3,L.y-3,6,6);
    ctx.globalAlpha=0.22*fl;
    for(let d=0;d<26;d+=3){
      const wob=Math.sin(time*2+d*0.7+L.x)*(0.5+d*0.08);
      ctx.fillRect(L.x+wob-1,L.y+2+d,2,2);
    }
    ctx.globalAlpha=1;
  }
}

/* ================= main loop ================= */
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.05)dt=0.05; if(dt<=0)return;
  time+=dt;
  wind=Math.sin(time*0.05)*0.35+Math.sin(time*0.017+2.3)*0.22;
  glowPulse*=Math.pow(0.5,dt*1.6);

  // finale conductor
  if(finaleEnd<0&&time>=nextFinale){ finaleEnd=time+7.5; grandFired=false; }
  if(finaleEnd>0){
    if(time>=nextLaunch){ launch({big:Math.random()<0.18}); nextLaunch=time+rand(0.08,0.22); }
    if(!grandFired&&time>=finaleEnd-1.1){
      grandFired=true;
      for(let i=0;i<3;i++)queue.push({t:time+i*0.28,type:'double',big:true,
        x:rand(W*0.25,W*0.75),ty:rand(H*0.12,H*0.24)});
      queue.push({t:time+0.5,type:'ring',big:true,x:rand(W*0.3,W*0.7)});
    }
    if(time>=finaleEnd){ finaleEnd=-1; nextFinale=time+rand(120,180); nextLaunch=time+rand(1,2); }
  }else if(time>=nextLaunch){
    launch();
    const r=Math.random();
    if(r<0.22)queue.push({t:time+rand(0.12,0.3)});
    else if(r<0.34){ queue.push({t:time+0.15}); queue.push({t:time+0.3}); }
    nextLaunch=time+rand(0.55,2.1);
  }
  while(queue.length&&queue[0].t<=time)launch(queue.shift());

  // occasional meteor
  if(time>=nextMeteor){
    nextMeteor=time+rand(14,34);
    const dir=Math.random()<0.5?1:-1;
    meteors.push({x:dir>0?rand(0,W*0.4):rand(W*0.6,W),y:rand(H*0.03,H*0.2),
      vx:dir*rand(7,11),vy:rand(1.5,3.5),life:1});
  }
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i]; m.x+=m.vx; m.y+=m.vy; m.life-=dt*1.3;
    if(m.life<=0)meteors.splice(i,1);
  }
  for(let i=delays.length-1;i>=0;i--){
    if(delays[i].t<=time){ secondary(delays[i]); delays.splice(i,1); }
  }

  updateShells(dt);
  const glow=updateParts(dt);
  glowPulse=Math.min(1,glowPulse+glow*0.05);

  // keep a handful of live lights for water glints
  wlights.length=0;
  for(const s of shells)wlights.push({x:s.x,col:[255,215,160],i:0.55});
  let taken=0;
  for(let i=parts.length-1;i>=0&&taken<8;i--){
    const p=parts[i];
    if(!p.flash&&!p.glit&&p.life>0.55&&p.size>1.2){ wlights.push({x:p.x,col:p.col,i:p.life*0.8}); taken++; }
  }

  renderSky();
  render();
}

resize();
window.addEventListener('resize',resize);
queue.push({t:0.7},{t:1.35,type:'ring'},{t:2.0,type:'double'});
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
})();
</script>
