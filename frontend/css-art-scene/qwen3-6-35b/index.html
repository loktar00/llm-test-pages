<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Desk at Night</title>
<style>
  @import url('data:text/css,');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:Georgia,serif;}

  .scene{
    width:100vw;height:100vh;
    background:linear-gradient(180deg,#0a0e1a 0%,#111833 40%,#1a1f3a 100%);
    position:relative;
    transition:background 1s ease;
  }

  .scene.warm{
    background:linear-gradient(180deg,#1a1510 0%,#2a2018 40%,#3a2e20 100%);
  }

  /* === WALL TEXTURE === */
  .wall{
    position:absolute;top:0;left:0;width:100%;height:65%;
    background:
      repeating-linear-gradient(90deg,transparent,transparent 120px,rgba(255,255,255,.01) 120px,rgba(255,255,255,.01) 121px),
      repeating-linear-gradient(0deg,transparent,transparent 80px,rgba(255,255,255,.008) 80px,rgba(255,255,255,.008) 81px);
  }

  /* === WINDOW === */
  .window-frame{
    position:absolute;top:6%;left:8%;
    width:220px;height:280px;
    border:12px solid #2a2a35;
    border-radius:4px;
    background:linear-gradient(180deg,#0d1b3e 0%,#162040 60%,#1a2850 100%);
    box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 4px 20px rgba(0,0,0,.6);
    z-index:2;
  }
  .window-frame::before{
    content:'';position:absolute;top:50%;left:0;width:100%;height:8px;
    background:#2a2a35;transform:translateY(-50%);
    box-shadow:0 0 5px rgba(0,0,0,.3);
  }
  .window-frame::after{
    content:'';position:absolute;left:50%;top:0;height:100%;width:8px;
    background:#2a2a35;transform:translateX(-50%);
    box-shadow:0 0 5px rgba(0,0,0,.3);
  }

  .moon{
    position:absolute;top:20px;right:30px;
    width:40px;height:40px;
    background:radial-gradient(circle at 35% 35%,#fffde8,#f5e6a3,#d4c070);
    border-radius:50%;
    box-shadow:0 0 20px rgba(255,253,200,.4),0 0 60px rgba(255,253,200,.15);
  }
  .moon-crater{
    position:absolute;border-radius:50%;background:rgba(180,160,100,.3);
  }
  .moon-crater:nth-child(1){width:8px;height:8px;top:8px;left:10px;}
  .moon-crater:nth-child(2){width:5px;height:5px;top:20px;left:22px;}
  .moon-crater:nth-child(3){width:6px;height:6px;top:12px;left:24px;}

  .star{
    position:absolute;width:3px;height:3px;
    background:#fff;border-radius:50%;
    box-shadow:0 0 4px rgba(255,255,255,.6);
  }
  .star:nth-child(4){top:30px;left:20px;opacity:.8;}
  .star:nth-child(5){top:50px;left:50px;opacity:.5;width:2px;height:2px;}
  .star:nth-child(6){top:15px;left:80px;opacity:.7;}
  .star:nth-child(7){top:70px;left:100px;opacity:.4;width:2px;height:2px;}
  .star:nth-child(8){top:45px;left:160px;opacity:.6;}
  .star:nth-child(9){top:90px;left:40px;opacity:.3;width:2px;height:2px;}
  .star:nth-child(10){top:60px;left:130px;opacity:.5;}

  .window-sill{
    position:absolute;top:69%;left:5%;
    width:240px;height:14px;
    background:linear-gradient(180deg,#3a3530,#2a2520);
    border-radius:2px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    z-index:3;
  }

  /* === DESK === */
  .desk{
    position:absolute;bottom:0;left:0;width:100%;height:38%;
    background:linear-gradient(180deg,#4a3728 0%,#3d2e20 30%,#352818 100%);
    border-top:6px solid #5a4535;
    box-shadow:0 -5px 30px rgba(0,0,0,.4);
    z-index:10;
  }
  .desk::before{
    content:'';position:absolute;top:0;left:0;width:100%;height:100%;
    background:
      repeating-linear-gradient(90deg,transparent,transparent 200px,rgba(0,0,0,.03) 200px,rgba(0,0,0,.03) 201px);
  }
  .desk-edge{
    position:absolute;bottom:0;left:0;width:100%;height:20px;
    background:linear-gradient(180deg,#352818,#2a1e14);
  }

  /* === LAPTOP === */
  .laptop{
    position:absolute;bottom:32%;left:50%;transform:translateX(-50%);
    z-index:15;
  }
  .laptop-screen{
    width:260px;height:170px;
    background:#1a1a2e;
    border:3px solid #2a2a3a;
    border-radius:8px 8px 0 0;
    box-shadow:0 0 40px rgba(100,140,255,.15),inset 0 0 30px rgba(0,0,0,.3);
    position:relative;
    overflow:hidden;
  }
  .screen-content{
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:linear-gradient(135deg,#0d1b3e 0%,#162040 50%,#1a2850 100%);
    animation:screenGlow 3s ease-in-out infinite;
  }
  .screen-content::before{
    content:'';position:absolute;top:10%;left:10%;width:80%;height:5px;
    background:linear-gradient(90deg,rgba(100,180,255,.6),rgba(100,180,255,.2));
    border-radius:2px;
    box-shadow:0 0 10px rgba(100,180,255,.3);
  }
  .screen-content::after{
    content:'';position:absolute;top:22%;left:10%;width:60%;height:4px;
    background:linear-gradient(90deg,rgba(100,200,150,.5),rgba(100,200,150,.1));
    border-radius:2px;
  }
  .screen-line{
    position:absolute;left:10%;width:70%;height:3px;
    background:rgba(100,160,255,.25);border-radius:2px;
  }
  .screen-line:nth-child(2){top:35%;width:55%;}
  .screen-line:nth-child(3){top:45%;width:75%;}
  .screen-line:nth-child(4){top:55%;width:40%;}
  .screen-line:nth-child(5){top:65%;width:65%;}
  .screen-line:nth-child(6){top:75%;width:50%;}
  .screen-line:nth-child(7){top:85%;width:30%;}

  .laptop-bezel{
    position:absolute;bottom:-3px;left:-6px;
    width:272px;height:12px;
    background:#2a2a3a;border-radius:0 0 3px 3px;
  }
  .laptop-base{
    width:300px;height:14px;
    background:linear-gradient(180deg,#3a3a4a,#2a2a3a);
    border-radius:0 0 6px 6px;
    position:relative;
    box-shadow:0 4px 15px rgba(0,0,0,.5);
  }
  .laptop-base::before{
    content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);
    width:60px;height:4px;
    background:#1a1a2a;border-radius:2px;
  }
  .laptop-trackpad{
    position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:50px;height:6px;
    background:#333345;border-radius:2px;
  }
  .laptop-keyboard{
    position:absolute;top:-10px;left:15px;right:15px;height:10px;
    background:repeating-linear-gradient(90deg,
      #2a2a3a 0px,#2a2a3a 3px,#3a3a4a 3px,#3a3a4a 4px);
    border-radius:2px;
  }

  @keyframes screenGlow{
    0%,100%{box-shadow:0 0 30px rgba(100,140,255,.1),inset 0 0 20px rgba(100,140,255,.05);}
    50%{box-shadow:0 0 50px rgba(100,140,255,.2),inset 0 0 40px rgba(100,140,255,.1);}
  }

  /* === COFFEE MUG === */
  .mug{
    position:absolute;bottom:34%;right:28%;
    width:50px;height:55px;
    background:linear-gradient(135deg,#e8d5c0,#d4c0a8);
    border-radius:4px 4px 8px 8px;
    box-shadow:2px 3px 10px rgba(0,0,0,.4);
    z-index:16;
  }
  .mug-handle{
    position:absolute;right:-16px;top:10px;
    width:18px;height:28px;
    border:4px solid #d4c0a8;
    border-left:none;
    border-radius:0 12px 12px 0;
  }
  .mug-rim{
    position:absolute;top:-4px;left:-3px;
    width:56px;height:8px;
    background:linear-gradient(180deg,#f0e0cc,#d4c0a8);
    border-radius:4px;
  }
  .coffee-liquid{
    position:absolute;top:2px;left:3px;right:3px;height:12px;
    background:radial-gradient(ellipse,#3a1f0a,#2a1508);
    border-radius:50%;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.3);
  }
  .coaster{
    position:absolute;bottom:-6px;left:-8px;
    width:66px;height:8px;
    background:radial-gradient(ellipse,#5a4a3a,#4a3a2a);
    border-radius:50%;
    box-shadow:0 2px 5px rgba(0,0,0,.3);
  }

  /* === STEAM === */
  .steam-container{
    position:absolute;top:-40px;left:50%;transform:translateX(-50%);
    width:30px;height:50px;z-index:20;
  }
  .steam{
    position:absolute;bottom:0;
    width:8px;height:20px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    filter:blur(4px);
    animation:steamRise 3s ease-in-out infinite;
  }
  .steam:nth-child(1){left:5px;animation-delay:0s;height:25px;}
  .steam:nth-child(2){left:14px;animation-delay:1s;height:22px;}
  .steam:nth-child(3){left:8px;animation-delay:2s;height:18px;}
  .steam:nth-child(4){left:18px;animation-delay:.5s;height:28px;}
  .steam:nth-child(5){left:3px;animation-delay:1.5s;height:20px;}

  @keyframes steamRise{
    0%{transform:translateY(0) scaleX(1);opacity:0;}
    15%{opacity:.15;}
    50%{transform:translateY(-25px) scaleX(1.8);opacity:.08;}
    100%{transform:translateY(-50px) scaleX(2.5);opacity:0;}
  }

  /* === CAT === */
  .cat{
    position:absolute;bottom:30%;right:10%;
    z-index:14;
  }
  .cat-body{
    width:70px;height:50px;
    background:linear-gradient(180deg,#2a2a2a,#1a1a1a);
    border-radius:35px 35px 20px 20px;
    box-shadow:3px 3px 10px rgba(0,0,0,.5);
    position:relative;
  }
  .cat-head{
    position:absolute;top:-25px;left:5px;
    width:45px;height:40px;
    background:linear-gradient(180deg,#2a2a2a,#1e1e1e);
    border-radius:50% 50% 45% 45%;
    box-shadow:2px 2px 8px rgba(0,0,0,.4);
  }
  .cat-ear{
    position:absolute;top:-10px;
    width:0;height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:14px solid #2a2a2a;
  }
  .cat-ear::after{
    content:'';position:absolute;top:4px;left:-4px;
    width:0;height:0;
    border-left:4px solid transparent;
    border-right:4px solid transparent;
    border-bottom:8px solid #3a2a2a;
  }
  .cat-ear.left{left:2px;transform:rotate(-10deg);}
  .cat-ear.right{right:2px;transform:rotate(10deg);}
  .cat-eye{
    position:absolute;top:14px;
    width:10px;height:6px;
    background:radial-gradient(circle,#c8e630,#a0c020);
    border-radius:50%;
    box-shadow:0 0 6px rgba(200,230,48,.4);
  }
  .cat-eye.left{left:9px;}
  .cat-eye.right{right:9px;}
  .cat-eye::after{
    content:'';position:absolute;top:1px;left:50%;transform:translateX(-50%);
    width:2px;height:4px;
    background:#1a1a1a;border-radius:1px;
  }
  .cat-nose{
    position:absolute;top:20px;left:50%;transform:translateX(-50%);
    width:6px;height:4px;
    background:#3a2a2a;border-radius:50%;
  }
  .cat-mouth{
    position:absolute;top:23px;left:50%;transform:translateX(-50%);
    width:12px;height:4px;
    border-bottom:2px solid #3a2a2a;
    border-radius:0 0 50% 50%;
  }
  .cat-tail{
    position:absolute;right:-30px;top:10px;
    width:40px;height:10px;
    background:linear-gradient(90deg,#2a2a2a,#1e1e1e);
    border-radius:0 10px 10px 0;
    transform-origin:left center;
    animation:tailSway 2.5s ease-in-out infinite;
  }
  .cat-tail::after{
    content:'';position:absolute;right:-5px;top:-3px;
    width:14px;height:14px;
    background:linear-gradient(135deg,#2a2a2a,#1a1a1a);
    border-radius:50%;
  }

  @keyframes tailSway{
    0%,100%{transform:rotate(-15deg);}
    50%{transform:rotate(15deg);}
  }

  /* === LAMP === */
  .lamp{
    position:absolute;bottom:34%;left:18%;
    z-index:18;
    cursor:pointer;
  }
  .lamp-base{
    width:40px;height:8px;
    background:linear-gradient(180deg,#8a7a60,#6a5a40);
    border-radius:50%;
    box-shadow:0 2px 5px rgba(0,0,0,.4);
  }
  .lamp-pole{
    width:6px;height:80px;
    background:linear-gradient(90deg,#7a6a50,#9a8a6a,#7a6a50);
    margin:0 auto;
    box-shadow:2px 0 5px rgba(0,0,0,.2);
  }
  .lamp-shade{
    width:70px;height:45px;
    background:linear-gradient(180deg,#d4a050,#c08830);
    border-radius:35px 35px 5px 5px;
    margin:0 auto;
    position:relative;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
  }
  .lamp-shade::after{
    content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:50px;height:6px;
    background:#b07820;border-radius:3px;
  }
  .lamp-light{
    position:absolute;bottom:-120px;left:50%;transform:translateX(-50%);
    width:0;height:0;
    border-left:80px solid transparent;
    border-right:80px solid transparent;
    border-top:120px solid rgba(255,200,100,.08);
    pointer-events:none;
    transition:border-top-color 1s ease;
  }
  .scene.warm .lamp-light{
    border-top-color:rgba(255,180,80,.15);
  }
  .lamp-bulb{
    position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
    width:20px;height:10px;
    background:radial-gradient(ellipse,#fff8e0,#ffd080);
    border-radius:0 0 50% 50%;
    box-shadow:0 0 15px rgba(255,200,100,.3);
    transition:box-shadow 1s ease;
  }
  .scene.warm .lamp-bulb{
    box-shadow:0 0 30px rgba(255,200,100,.6);
  }
  .lamp:hover .lamp-shade{
    filter:brightness(1.1);
  }

  /* === BOOKS === */
  .books{
    position:absolute;bottom:34%;left:30%;
    z-index:14;
  }
  .book{
    position:absolute;
    width:55px;height:10px;
    border-radius:2px;
    box-shadow:1px 1px 4px rgba(0,0,0,.3);
  }
  .book:nth-child(1){
    bottom:0;left:0;
    background:linear-gradient(180deg,#8b2020,#6a1515);
    height:12px;
  }
  .book:nth-child(2){
    bottom:10px;left:2px;
    background:linear-gradient(180deg,#204080,#153060);
    height:11px;
  }
  .book:nth-child(3){
    bottom:21px;left:1px;
    background:linear-gradient(180deg,#206040,#154a30);
    height:10px;
  }
  .book-spine{
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(255,255,255,.05) 8px,rgba(255,255,255,.05) 9px);
    border-radius:2px;
  }

  /* === PENCIL === */
  .pencil{
    position:absolute;bottom:33%;left:42%;
    width:80px;height:5px;
    background:linear-gradient(180deg,#e8c030,#d4a820);
    transform:rotate(-25deg);
    border-radius:1px;
    z-index:14;
    box-shadow:1px 1px 3px rgba(0,0,0,.3);
  }
  .pencil::before{
    content:'';position:absolute;left:-8px;top:-1px;
    width:10px;height:7px;
    background:linear-gradient(180deg,#f0d0a0,#e0c090);
    clip-path:polygon(100% 0,100% 100%,0 50%);
  }
  .pencil::after{
    content:'';position:absolute;left:-14px;top:0;
    width:8px;height:5px;
    background:#c04040;
    clip-path:polygon(100% 0,100% 100%,0 50%);
  }

  /* === MOUSE === */
  .mouse{
    position:absolute;bottom:33%;left:45%;
    width:20px;height:30px;
    background:linear-gradient(180deg,#3a3a4a,#2a2a3a);
    border-radius:10px 10px 8px 8px;
    z-index:15;
    box-shadow:2px 2px 6px rgba(0,0,0,.4);
  }
  .mouse::before{
    content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);
    width:2px;height:8px;
    background:#4a4a5a;border-radius:1px;
  }
  .mouse-wire{
    position:absolute;top:-20px;left:50%;transform:translateX(-50%);
    width:2px;height:20px;
    background:#2a2a3a;
    border-radius:1px;
  }

  /* === SMALL PLANT === */
  .plant-pot{
    position:absolute;bottom:34%;left:5%;
    width:35px;height:30px;
    background:linear-gradient(180deg,#c06030,#a04820);
    border-radius:3px 3px 5px 5px;
    z-index:14;
    box-shadow:2px 2px 6px rgba(0,0,0,.4);
  }
  .plant-pot::before{
    content:'';position:absolute;top:-4px;left:-3px;
    width:41px;height:6px;
    background:linear-gradient(180deg,#d07040,#b05830);
    border-radius:3px;
  }
  .plant-leaf{
    position:absolute;
    width:12px;height:20px;
    background:linear-gradient(180deg,#3a8030,#2a6020);
    border-radius:50% 50% 50% 0;
    transform-origin:bottom center;
  }
  .plant-leaf:nth-child(1){bottom:28px;left:10px;transform:rotate(-20deg);}
  .plant-leaf:nth-child(2){bottom:30px;left:14px;transform:rotate(10deg);}
  .plant-leaf:nth-child(3){bottom:26px;left:16px;transform:rotate(30deg);}
  .plant-leaf:nth-child(4){bottom:32px;left:12px;transform:rotate(-5deg);height:24px;}

  /* === PHONE === */
  .phone{
    position:absolute;bottom:33%;left:38%;
    width:18px;height:32px;
    background:linear-gradient(180deg,#1a1a2a,#0a0a1a);
    border-radius:4px;
    z-index:15;
    box-shadow:1px 1px 4px rgba(0,0,0,.4);
    transform:rotate(10deg);
  }
  .phone-screen{
    position:absolute;top:3px;left:2px;right:2px;bottom:3px;
    background:linear-gradient(180deg,#2a2a4a,#1a1a3a);
    border-radius:2px;
  }

  /* === AMBIENT LIGHT OVERLAY === */
  .ambient-light{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:100;
    transition:background 1s ease;
  }
  .scene:not(.warm) .ambient-light{
    background:radial-gradient(ellipse at 25% 40%,rgba(255,180,80,.04) 0%,transparent 50%),
               radial-gradient(ellipse at 50% 40%,rgba(100,140,255,.03) 0%,transparent 40%);
  }
  .scene.warm .ambient-light{
    background:radial-gradient(ellipse at 25% 40%,rgba(255,180,80,.12) 0%,transparent 50%),
               radial-gradient(ellipse at 50% 40%,rgba(255,200,100,.06) 0%,transparent 40%);
  }

  /* === CLOCK === */
  .clock{
    position:absolute;top:10%;right:12%;
    width:60px;height:60px;
    background:radial-gradient(circle,#f5f0e0,#e0d8c0);
    border:4px solid #4a3a2a;
    border-radius:50%;
    box-shadow:2px 2px 10px rgba(0,0,0,.4);
    z-index:5;
  }
  .clock::before{
    content:'';position:absolute;top:50%;left:50%;
    width:4px;height:4px;
    background:#3a2a1a;border-radius:50%;
    transform:translate(-50%,-50%);z-index:2;
  }
  .clock-hand{
    position:absolute;bottom:50%;left:50%;
    transform-origin:bottom center;
    border-radius:2px;
  }
  .clock-hour{
    width:3px;height:16px;
    background:#3a2a1a;
    transform:translateX(-50%) rotate(60deg);
  }
  .clock-minute{
    width:2px;height:22px;
    background:#3a2a1a;
    transform:translateX(-50%) rotate(-30deg);
  }
  .clock-tick{
    position:absolute;width:2px;height:6px;
    background:#5a4a3a;
    top:4px;left:50%;transform-origin:1px 26px;
  }

  /* === SHADOWS === */
  .shadow{
    position:absolute;
    background:rgba(0,0,0,.15);
    border-radius:50%;
    filter:blur(3px);
    z-index:11;
  }
  .shadow-laptop{
    bottom:30%;left:50%;transform:translateX(-50%);
    width:280px;height:8px;
  }
  .shadow-mug{
    bottom:32%;right:28%;
    width:55px;height:6px;
  }
  .shadow-cat{
    bottom:28%;right:8%;
    width:80px;height:10px;
  }
  .shadow-lamp{
    bottom:32%;left:18%;
    width:45px;height:6px;
  }

  /* === CURSOR HINT === */
  .lamp-hint{
    position:absolute;bottom:36%;left:17%;
    font-size:9px;color:rgba(255,255,255,.2);
    letter-spacing:1px;text-transform:uppercase;
    z-index:20;pointer-events:none;
    transition:opacity .5s;
  }
  .lamp:hover ~ .lamp-hint{
    opacity:0;
  }

  /* === DOORMAT === */
  .doormat{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:120px;height:12px;
    background:linear-gradient(180deg,#5a4a3a,#4a3a2a);
    border-radius:2px;
    z-index:9;
    opacity:.5;
  }

  /* === RUG === */
  .rug{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:300px;height:25px;
    background:linear-gradient(180deg,#6a3a30,#5a2a20);
    border-radius:50%;
    z-index:8;
    opacity:.3;
  }

  /* === SCREEN REFLECTION ON DESK === */
  .desk-reflection{
    position:absolute;bottom:36%;left:50%;transform:translateX(-50%);
    width:200px;height:15px;
    background:radial-gradient(ellipse,rgba(100,140,255,.06),transparent);
    z-index:12;
    animation:deskGlow 3s ease-in-out infinite;
  }
  @keyframes deskGlow{
    0%,100%{opacity:.6;}
    50%{opacity:1;}
  }

  /* === WALL PICTURE FRAME === */
  .picture-frame{
    position:absolute;top:15%;right:28%;
    width:50px;height:40px;
    background:linear-gradient(180deg,#5a4a3a,#4a3a2a);
    border:3px solid #6a5a4a;
    border-radius:2px;
    z-index:5;
    box-shadow:1px 2px 6px rgba(0,0,0,.3);
  }
  .picture-inner{
    position:absolute;top:4px;left:4px;right:4px;bottom:4px;
    background:linear-gradient(135deg,#2a4a6a,#1a3a5a);
    border-radius:1px;
  }
  .picture-inner::after{
    content:'';position:absolute;bottom:4px;left:4px;
    width:20px;height:12px;
    background:linear-gradient(180deg,#3a6a4a,#2a5a3a);
    border-radius:50% 50% 0 0;
  }

  /* === CABLE === */
  .cable{
    position:absolute;bottom:35%;left:48%;
    width:25px;height:3px;
    background:#2a2a3a;
    border-radius:2px;
    transform:rotate(5deg);
    z-index:13;
  }
</style>
</head>
<body>

<div class="scene" id="scene">

    <div class="clock-tick" style="transform:translateX(-50%) rotate(300deg)"></div>

    <div class="star"></div>

    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

  <!-- Plant -->
  <div class="plant-pot">
    <div class="plant-leaf"></div>
    <div class="plant-leaf"></div>
    <div class="plant-leaf"></div>
    <div class="plant-leaf"></div>
  </div>

  <!-- Lamp -->
  <div class="lamp" id="lamp" onclick="toggleLight()">

    <div class="lamp-pole"></div>

  <!-- Books -->

<script>
  function toggleLight(){
    const scene=document.getElementById('scene');
    const hint=document.getElementById('hint');
    scene.classList.toggle('warm');
    if(scene.classList.contains('warm')){
      hint.textContent='click to dim';
    }else{
      hint.textContent='click lamp';
    }
  }
</script>
