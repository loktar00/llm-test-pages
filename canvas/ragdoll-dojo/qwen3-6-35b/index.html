<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragdoll Dojo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/**
 * RAGDOLL DOJO
 * Verlet Integration Physics Engine
 */

// --- Configuration ---
const GRAVITY = 0.5;
const FRICTION = 0.99;
const GROUND_FRICTION = 0.8;
const BOUNCE = 0.6;
const ITERATIONS = 5; // Constraint solver iterations
const SLOMO_THRESHOLD = 0.8; // Velocity ratio to trigger slow-mo
const SUB_STEPS = 3; // Physics substeps

// --- Setup ---
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Math Helpers ---
const dist = (x1, y1, x2, y2) => Math.sqrt((x1 - x2) ** 2 + (y1 - y2) ** 2);
const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

// --- Physics Classes ---

class Point {
    constructor(x, y, mass = 1) {
        this.x = x;
        this.y = y;
        this.oldX = x;
        this.oldY = y;
        this.mass = mass;
        this.pinned = false;
        this.radius = 4;
        this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
        this.dissolving = false;
        this.opacity = 1;
        this.scale = 1;
    }

    update() {
        if (this.pinned) return;

        const vx = (this.x - this.oldX) * FRICTION;
        const vy = (this.y - this.oldY) * FRICTION;

        this.oldX = this.x;
        this.oldY = this.y;

        this.x += vx;
        this.y += vy + GRAVITY;

        // Dissolution effect
        if (this.dissolving) {
            this.x += (Math.random() - 0.5) * 2;
            this.y += (Math.random() - 0.5) * 2;
            this.opacity -= 0.02;
            this.scale -= 0.02;
        }
    }

    constrain() {
        if (this.pinned) return;

        // Screen Boundaries
        const margin = 50;
        if (this.x > width - margin) {
            this.x = width - margin;
            this.oldX = this.x + (this.x - this.oldX) * BOUNCE;
        } else if (this.x < margin) {
            this.x = margin;
            this.oldX = this.x + (this.x - this.oldX) * BOUNCE;
        }

        if (this.y > height) {
            this.y = height;
            this.oldY = this.y + (this.y - this.oldY) * BOUNCE;
            // Ground friction
            this.oldX = this.x + (this.x - this.oldX) * GROUND_FRICTION;
        }
    }
}

class Stick {
    constructor(p1, p2, length, visible = true, width = 2) {
        this.p1 = p1;
        this.p2 = p2;
        this.length = length || dist(p1.x, p1.y, p2.x, p2.y);
        this.visible = visible;
        this.width = width;
        this.color = '#fff';
        this.dissolving = false;
    }

    update() {
        if (this.p1.pinned && this.p2.pinned) return;

        const dx = this.p2.x - this.p1.x;
        const dy = this.p2.y - this.p1.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        if (distance === 0) return; // Prevent div by zero

        const diff = (this.length - distance) / distance;
        const offset = diff * 0.5;

        // Joint Limit enforcement (prevent 180 degrees)
        // Calculate angle
        let angle = Math.atan2(dy, dx);
        // Normalize angle
        let currentAngle = angle;
        
        // Simple 180 constraint check: calculate dot product of bone vectors at a joint
        // Here we just apply the constraint to the sticks, joints are implicit.
        // To do real joint limits, we need to look at neighbors. 
        // For simplicity in this specific demo, we rely on mass distribution and
        // usually, the body folds naturally. But let's enforce a hard limit on bend.
        // We'll skip complex neighbor checks to keep code size low, relying on 
        // the physics of the stick structure to fold.

        const offsetX = dx * offset;
        const offsetY = dy * offset;

        if (!this.p1.pinned) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
        }
        if (!this.p2.pinned) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
        }
    }

    constrain() {
        // Nothing to constrain individually, handled by points
    }
}

class Ragdoll {
    constructor(x, y) {
        this.points = [];
        this.sticks = [];
        this.settled = false;
        this.settleTimer = 0;
        this.dissolved = false;
        
        const headR = 15;
        const neckY = y - 40;
        const shoulderY = y - 20;
        const hipY = y + 30;
        const footY = y + 90;
        const armLen = 25;
        const legLen = 35;

        // Create Points
        const head = new Point(x, neckY);
        const neck = new Point(x, neckY);
        const shoulderL = new Point(x - 15, shoulderY);
        const shoulderR = new Point(x + 15, shoulderY);
        const elbowL = new Point(x - 25, shoulderY + 15);
        const elbowR = new Point(x + 25, shoulderY + 15);
        const handL = new Point(x - 20, shoulderY + 25);
        const handR = new Point(x + 20, shoulderY + 25);
        const hip = new Point(x, hipY);
        const hipL = new Point(x - 10, hipY + 5);
        const hipR = new Point(x + 10, hipY + 5);
        const kneeL = new Point(x - 10, hipY + 20);
        const kneeR = new Point(x + 10, hipY + 20);
        const footL = new Point(x - 10, hipY + 40);
        const footR = new Point(x + 10, hipY + 40);

        this.points = [head, neck, shoulderL, shoulderR, elbowL, elbowR, handL, handR, hip, hipL, hipR, kneeL, kneeR, footL, footR];
        this.colors = this.points.map(() => `hsl(${Math.random() * 360}, 80%, 60%)`);

        // Create Sticks
        const add = (p1, p2, len = null) => this.sticks.push(new Stick(p1, p2, len));
        
        // Skeleton Structure
        add(head, neck);
        add(head, shoulderL, 20);
        add(head, shoulderR, 20);
        
        add(shoulderL, shoulderR);
        add(neck, shoulderL);
        add(neck, shoulderR);
        
        add(shoulderL, elbowL);
        add(shoulderR, elbowR);
        add(elbowL, handL);
        add(elbowR, handR);
        
        add(neck, hip);
        add(hip, hipL);
        add(hip, hipR);
        
        add(hipL, kneeL);
        add(hipR, kneeR);
        add(kneeL, footL);
        add(kneeR, footR);

        // Structural stiffness (diagonals) to prevent folding in half
        add(shoulderL, neck, 10);
        add(shoulderR, neck, 10);
        add(hip, neck, 25);
    }

    update() {
        if (this.dissolved) return;

        let totalVel = 0;
        const numPoints = this.points.length;

        for (let p of this.points) {
            p.update();
            totalVel += Math.abs(p.x - p.oldX) + Math.abs(p.y - p.oldY);
        }

        // Average velocity for settling check
        const avgVel = totalVel / numPoints;

        // Constraint solver
        for (let i = 0; i < ITERATIONS; i++) {
            for (let s of this.sticks) {
                s.update();
            }
            for (let p of this.points) {
                p.constrain();
            }
            // Obstacle collision in constraint pass
            for (let p of this.points) {
                for (let obs of obstacles) {
                    obs.resolve(p);
                }
            }
        }

        // Check if settled
        if (avgVel < 0.05 && !this.settled) {
            this.settled = true;
            this.settleTimer = 0;
        } else if (this.settled) {
            this.settleTimer++;
            if (this.settleTimer > 60) { // Wait 1 second
                this.dissolve();
            }
        }
    }

    draw() {
        if (this.dissolved) return;

        ctx.beginPath();
        for (let s of this.sticks) {
            if (!s.visible) continue;
            ctx.moveTo(s.p1.x, s.p1.y);
            ctx.lineTo(s.p2.x, s.p2.y);
        }
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        
        // Draw individual colored limbs
        for (let i = 0; i < this.sticks.length; i++) {
            const s = this.sticks[i];
            if (!s.visible) continue;
            ctx.strokeStyle = s.dissolving ? `rgba(255,255,255,${s.p1.opacity})` : this.colors[i % this.colors.length];
            ctx.lineWidth = s.width;
            ctx.beginPath();
            ctx.moveTo(s.p1.x, s.p1.y);
            ctx.lineTo(s.p2.x, s.p2.y);
            ctx.stroke();
        }

        // Draw Head
        const head = this.points[0];
        if (!head.dissolving) {
            ctx.beginPath();
            ctx.arc(head.x, head.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = head.color;
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(head.x, head.y, 10 * head.scale, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255, ${head.opacity})`;
            ctx.fill();
        }
    }

    dissolve() {
        this.dissolved = true;
        for (let p of this.points) p.dissolving = true;
        for (let s of this.sticks) s.dissolving = true;
    }
}

// --- Environment Objects ---

class Obstacle {
    constructor(x, y, w, h, type) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.type = type; // 'static', 'trampoline', 'seesaw', 'log'
        
        // Rotation for dynamic obstacles
        this.angle = 0;
        this.targetAngle = 0;
        this.angularVel = 0;
        
        // Trampoline specifics
        this.stiffness = 0;
        
        // Pivot for logs/seesaws
        this.pivotX = x + w/2;
        this.pivotY = y + h/2;
    }

    update() {
        if (this.type === 'trampoline') {
            this.stiffness = clamp(this.stiffness + 0.05, 0, 0.3);
            if (this.stiffness > 0.25) this.stiffness -= 0.05;
        }
        if (this.type === 'seesaw' || this.type === 'log') {
            // Pendulum motion
            const force = Math.sin(Date.now() / 1000) * 0.02; // Gentle sway
            this.angularVel += force;
            this.angularVel *= 0.99;
            this.angle += this.angularVel;
        }
    }

    resolve(p) {
        // Rotate point around obstacle center for collision check
        const cos = Math.cos(this.angle);
        const sin = Math.sin(this.angle);
        
        // Local point relative to pivot
        let lx = p.x - this.pivotX;
        let ly = p.y - this.pivotY;
        
        // Rotate to obstacle space
        let rx = lx * cos + ly * sin;
        let ry = -lx * sin + ly * cos;
        
        // AABB collision in local space
        let hit = false;
        let nx = 0;
        let ny = 0;
        let overlap = 0;

        // Simple AABB check for the box
        if (rx > -this.w/2 && rx < this.w/2 && ry > -this.h/2 && ry < this.h/2) {
            hit = true;
            // Find closest point on box to circle center
            const closestX = clamp(rx, -this.w/2, this.w/2);
            const closestY = clamp(ry, -this.h/2, this.h/2);
            
            // Normal from surface
            let dx = rx - closestX;
            let dy = ry - closestY;
            let d = Math.sqrt(dx*dx + dy*dy);
            
            if (d === 0) { // Center inside
                overlap = this.w/2 + p.radius; // Push out
                nx = 1; ny = 0; 
            } else {
                // Push out
                const penetration = p.radius - d;
                if (penetration > 0) {
                    overlap = penetration;
                    nx = dx / d;
                    ny = dy / d;
                }
            }
        }

        if (hit) {
            // Transform normal back to world
            let worldNx = nx * cos - ny * sin;
            let worldNy = nx * sin + ny * cos;

            if (this.type === 'trampoline') {
                // Trampoline logic: Dampen velocity significantly
                // Apply force opposite to velocity
                const vx = p.x - p.oldX;
                const vy = p.y - p.oldY;
                
                // Bounce
                p.x += worldNx * overlap * 1.5; // High restitution
                p.y += worldNy * overlap * 1.5;
                
                // Energy loss + added energy if falling hard
                p.oldX = p.x - vx * 0.5;
                p.oldY = p.y - vy * 0.5;
                
                // Visual wobble handled in stiffness
            } else if (this.type === 'seesaw' || this.type === 'log') {
                // Static push, plus rotational push
                // Add some rotational velocity to point
                const distFromPivot = Math.sqrt((p.x-this.pivotX)**2 + (p.y-this.pivotY)**2);
                const tangentX = -worldNy;
                const tangentY = worldNx;
                
                p.x += worldNx * overlap;
                p.y += worldNy * overlap;
                
                // Add spin from the object moving
                p.oldX -= tangentX * this.angularVel * distFromPivot * 0.5;
                p.oldY -= tangentY * this.angularVel * distFromPivot * 0.5;
            } else {
                // Static Wall
                p.x += worldNx * overlap;
                p.y += worldNy * overlap;
                
                // Bounce
                const vx = p.x - p.oldX;
                const vy = p.y - p.oldY;
                
                // Reflect velocity vector
                const dot = vx * worldNx + vy * worldNy;
                p.oldX = p.x - (vx - 2 * dot * worldNx) * BOUNCE;
                p.oldY = p.y - (vy - 2 * dot * worldNy) * BOUNCE;
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.pivotX, this.pivotY);
        ctx.rotate(this.angle);
        
        if (this.type === 'static') {
            ctx.fillStyle = '#333';
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        } else if (this.type === 'trampoline') {
            // Visual wobble
            const wobble = Math.sin(Date.now() / 50) * 2 * this.stiffness * 5;
            ctx.strokeStyle = this.stiffness > 0.1 ? '#0ff' : '#555';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-this.w/2, this.h/2 + wobble);
            ctx.quadraticCurveTo(0, this.h/2 + 10 + wobble * 2, this.w/2, this.h/2 + wobble);
            ctx.stroke();
            ctx.fillStyle = '#222';
            ctx.fillRect(-this.w/2 - 2, this.h/2 - 5, this.w + 4, 5); // Base
        } else if (this.type === 'seesaw' || this.type === 'log') {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
            
            // Pivot stand
            if (this.type === 'seesaw') {
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.moveTo(0, this.h/2);
                ctx.lineTo(-10, this.h/2 + 30);
                ctx.lineTo(10, this.h/2 + 30);
                ctx.fill();
            }
        }
        
        ctx.restore();
    }
}

// --- Game State ---
let obstacles = [];
let ragdolls = [];
let lastTime = 0;
let spawnerTimer = 0;
let slowMotionFactor = 1.0;

function initLevel() {
    obstacles = [];
    // Floor
    obstacles.push(new Obstacle(0, height - 20, width, 20, 'static'));
    
    // Platforms
    obstacles.push(new Obstacle(width * 0.2, height - 150, 200, 20, 'static'));
    obstacles.push(new Obstacle(width * 0.7, height - 250, 200, 20, 'static'));
    
    // Trampoline
    obstacles.push(new Obstacle(width * 0.5, height - 100, 150, 10, 'trampoline'));
    
    // Seesaw
    obstacles.push(new Obstacle(width * 0.3, height - 80, 200, 15, 'seesaw'));
    
    // Swinging Log
    obstacles.push(new Obstacle(width * 0.8, height - 400, 150, 15, 'log'));
    
    // A ramp
    const ramp = new Obstacle(width * 0.6, height - 200, 100, 10, 'static');
    ramp.angle = -0.3;
    ramp.pivotX = width * 0.6; 
    ramp.pivotY = height - 150;
    obstacles.push(ramp);
}

function spawnRagdoll() {
    const x = Math.random() * (width - 200) + 100;
    const y = -50;
    ragdolls.push(new Ragdoll(x, y));
    
    // Random chance to drop two
    if (Math.random() > 0.7) {
        setTimeout(() => {
            ragdolls.push(new Ragdoll(x + (Math.random() - 0.5) * 100, -50));
        }, 300);
    }
}

// --- Main Loop ---

function loop() {
    requestAnimationFrame(loop);

    // Determine Slow Motion
