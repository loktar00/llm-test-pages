<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Sea Hydrothermal Vent</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #00050a;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="deepCanvas"></canvas>
    <script>
        const canvas = document.getElementById('deepCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Helper functions
        const random = (min, max) => Math.random() * (max - min) + min;
        const map = (val, inMin, inMax, outMin, outMax) => {
            return outMin + (outMax - outMin) * ((val - inMin) / (inMax - inMin));
        };

        // --- CLASSES ---

        class Particle {
            constructor(type) {
                this.type = type; // 'smoke' or 'snow'
                this.reset();
            }

            reset() {
                if (this.type === 'smoke') {
                    // Vent smoke origin
                    this.x = width / 2 + random(-20, 20);
                    this.y = height + 10;
                    this.vx = random(-0.2, 0.2);
                    this.vy = random(-1.5, -3.5);
                    this.size = random(5, 25);
                    this.life = random(100, 300);
                    this.maxLife = this.life;
                    this.color = `rgba(40, 45, 50, ${random(0.1, 0.4)})`;
                } else {
                    // Marine snow
                    this.x = random(0, width);
                    this.y = random(-10, -50);
                    this.vx = random(-0.2, 0.2);
                    this.vy = random(0.2, 0.8);
                    this.size = random(0.5, 2.5);
                    this.life = random(200, 600);
                    this.maxLife = this.life;
                    this.color = 'rgba(200, 240, 255, 0.6)';
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.type === 'smoke') {
                    this.size += 0.1;
                    this.vx += random(-0.01, 0.01); // Chaotic drift
                    if (this.life <= 0) this.reset();
                } else {
                    if (this.life <= 0 || this.y > height + 10) this.reset();
                }
            }

            draw() {
                const alpha = map(this.life, 0, this.maxLife, 0, this.type === 'smoke' ? 0.1 : 0.6);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class TubeWorm {
            constructor(x) {
                this.baseX = x;
                this.baseY = height;
                this.height = random(100, 250);
                this.segments = 8;
                this.segmentHeight = this.height / this.segments;
                this.offset = random(0, 100);
                this.color = `rgb(${random(150, 220)}, 50, 50)`; // Reddish
            }

            update() {
                this.offset += 0.02;
            }

            draw() {
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                let currentX = this.baseX;
                let currentY = this.baseY;
                ctx.moveTo(currentX, currentY);

                for (let i = 1; i <= this.segments; i++) {
                    const sway = Math.sin(this.offset + i * 0.5) * (i * 2);
                    currentX = this.baseX + sway;
                    currentY = this.baseY - (i * this.segmentHeight);
                    
                    // Thicker at bottom
                    ctx.lineWidth = map(i, 0, this.segments, 8, 3);
                    ctx.lineTo(currentX, currentY);
                }
                ctx.stroke();

                // Tips (Gills)
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(currentX, currentY, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Shrimp {
            constructor() {
                this.x = width / 2 + random(-100, 100);
                this.y = height - random(50, 300);
                this.vx = random(-1, 1);
                this.vy = random(-0.5, 0.5);
                this.angle = 0;
                this.turnTimer = random(0, 100);
            }

            update() {
                this.turnTimer--;
                if (this.turnTimer <= 0) {
                    this.vx += random(-0.5, 0.5);
                    this.vy += random(-0.2, 0.2);
                    this.turnTimer = random(20, 60);
                }

                // Constrain to vent area
                const centerX = width / 2;
                const dx = this.x - centerX;
                if (Math.abs(dx) > 300) this.vx *= -1;
                if (this.y > height) this.vy *= -1;
                if (this.y < height - 400) this.vy *= -1;

                this.x += this.vx;
                this.y += this.vy;
                this.angle = Math.atan2(this.vy, this.vx);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Glowing body
                ctx.fillStyle = '#aaddff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#aaddff';
                
                // Simple shrimp shape
                ctx.beginPath();
                ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Siphonophore {
            constructor() {
                this.x = -200;
                this.y = random(100, height / 2);
                this.speed = random(0.5, 1.5);
                this.blobs = [];
                const count = random(8, 15);
                for(let i=0; i<count; i++) {
                    this.blobs.push({
                        ox: i * 15,
                        size: random(5, 12),
                        color: `hsl(${random(180, 280)}, 70%, 60%)`
                    });
                }
                this.driftY = 0;
            }

            update() {
                this.x += this.speed;
                this.driftY += 0.05;
            }

            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(100, 200, 255, 0.6)';
                
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                
                for (let i = 0; i < this.blobs.length; i++) {
                    const b = this.blobs[i];
                    const pulse = Math.sin(this.driftY + i * 0.2) * 2;
                    
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.ellipse(this.x - b.ox, this.y + Math.sin(this.driftY + i*0.5)*5, b.size + pulse, b.size/2 + pulse, 0, 0, Math.PI*2);
                    ctx.fill();
                }
                
                // Connecting strand
                ctx.strokeStyle = 'rgba(200,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.blobs.length * 15, this.y);
                ctx.stroke();

                ctx.shadowBlur = 0;
            }
        }

        // --- SETUP ---

        const particles = [];
        const worms = [];
        const shrimps = [];
        const siphonophores = [];

        // Init Smoke
        for (let i = 0; i < 150; i++) particles.push(new Particle('smoke'));
        // Init Snow
        for (let i = 0; i < 100; i++) particles.push(new Particle('snow'));
        
        // Init Worms
        for (let i = 0; i < 25; i++) {
            worms.push(new TubeWorm(width/2 + random(-60, 60)));
        }

        // Init Shrimps
        for (let i = 0; i < 40; i++) {
            shrimps.push(new Shrimp());
        }

        // Init Siphonophores
        siphonophores.push(new Siphonophore());

        // --- DRAWING ---

        function drawVent() {
            // Main Chimney
            const cx = width / 2;
            const grad = ctx.createLinearGradient(cx, height, cx, height - 300);
            grad.addColorStop(0, '#0a0a0a');
            grad.addColorStop(1, '#222');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(cx - 60, height);
            ctx.quadraticCurveTo(cx - 40, height - 100, cx - 30, height - 250);
            ctx.lineTo(cx + 30, height - 250);
            ctx.quadraticCurveTo(cx + 40, height - 100, cx + 60, height);
            ctx.fill();

            // Glowing Rim
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff4400';
            ctx.fillStyle = '#331100';
            ctx.fillRect(cx - 35, height - 255, 70, 10);
            ctx.shadowBlur = 0;
        }

        function drawROV(time) {
            // ROV Movement: Swaying back and forth over the vent
            const baseX = width / 2;
            const sway = Math.sin(time * 0.001) * 150;
            const hover = Math.sin(time * 0.002) * 20;
            
            const rovX = baseX + sway;
            const rovY = height * 0.35 + hover;

            // Draw Body
            ctx.fillStyle = '#111';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            
            // Main chassis
            ctx.beginPath();
            ctx.roundRect(rovX - 40, rovY - 30, 80, 60, 10);
            ctx.fill();
            ctx.stroke();

            // Arms
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(rovX - 30, rovY + 10);
            ctx.lineTo(rovX - 60, rovY + 40);
            ctx.moveTo(rovX + 30, rovY + 10);
            ctx.lineTo(rovX + 60, rovY + 40);
            ctx.stroke();

            // Cameras/Sensors
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(rovX, rovY + 20, 10, 0, Math.PI * 2);
            ctx.fill();

            // --- LIGHTS ---
            // Light source origin
            const lightSourceX = rovX;
            const lightSourceY = rovY + 20;

            // Create gradient for light cone
            // The light spreads out downwards and slightly outwards
            const lightWidthAtBottom = 600;
            const lightLength = height;

            ctx.save();
            ctx.globalCompositeOperation = 'screen'; // Additive blending for glow
            
            // Left Light
            const gradL = ctx.createLinearGradient(lightSourceX, lightSourceY, lightSourceX - 100, height);
            gradL.addColorStop(0, 'rgba(255, 255, 200, 0.4)');
            gradL.addColorStop(0.2, 'rgba(255, 255, 200, 0.1)');
            gradL.addColorStop(1, 'rgba(255, 255, 200, 0)');

            ctx.fillStyle = gradL;
            ctx.beginPath();
            ctx.moveTo(lightSourceX, lightSourceY + 5);
            ctx.lineTo(lightSourceX - 100, height);
            ctx.lineTo(lightSourceX + 100, height);
            ctx.fill();

            // Right Light
            const gradR = ctx.createLinearGradient(lightSourceX, lightSourceY, lightSourceX + 100, height);
            gradR.addColorStop(0, 'rgba(255, 255, 200, 0.4)');
            gradR.addColorStop(0.2, 'rgba(255, 255, 200, 0.1)');
            gradR.addColorStop(1, 'rgba(255, 255, 200, 0)');

            ctx.fillStyle = gradR;
            ctx.beginPath();
            ctx.moveTo(lightSourceX, lightSourceY + 5);
            ctx.lineTo(lightSourceX - 100, height);
            ctx.lineTo(lightSourceX + 100, height);
            ctx.fill();

            // Light Lens Glow
            ctx.fillStyle = '#ffffcc';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffcc';
            ctx.beginPath();
            ctx.arc(lightSourceX - 15, lightSourceY + 20, 3, 0, Math.PI * 2);
            ctx.arc(lightSourceX + 15, lightSourceY + 20, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBackground() {
            // Deep Blue Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#000510');
            grad.addColorStop(0.5, '#000815');
            grad.addColorStop(1, '#000305');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawFloor() {
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height - 50);
            ctx.quadraticCurveTo(width/2, height - 20, width, height - 50);
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // --- MAIN LOOP ---

        function animate(time) {
            drawBackground();
            
            // Draw Floor
            drawFloor();

            // Draw Vent
            drawVent();

            // Draw Worms (Behind Smoke)
            worms.forEach(w => { w.update(); w.draw(); });

            // Draw Particles (Smoke & Snow)
            // Need to separate draw calls for proper layering if needed, 
            // but here they are objects in same array. 
            // Actually, let's iterate the array.
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Draw Shrimps
            shrimps.forEach(s => {
                s.update();
                s.draw();
            });

            // Draw ROV (Lights are additive, drawn last usually or in middle of lights)
            drawROV(time);

            // Siphonophores
            siphonophores.forEach(s => {
                s.update();
                if (s.x > width + 200) {
                    s.x = -200;
                    s.y = random(50, height/2);
                }
                s.draw();
            });

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

    </script>
</body>
</html>
