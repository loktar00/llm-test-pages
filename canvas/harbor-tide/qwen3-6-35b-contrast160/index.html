<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width-width, width=device-width">
<title>Harbor at Dusk</title>
<style>
*{margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

let W,H,scale;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  scale=Math.min(W,H)/800;
}
resize();
window.addEventListener('resize',resize);

// --- Utility ---
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t}

// --- Sky Colors ---
const skyPhases=[
  {t:0,  top:[25,35,80],   mid:[180,110,60],  bot:[240,170,90],  hor:[255,210,130]},
  {t:.15,top:[15,20,50],   mid:[100,45,45],   bot:[180,85,55],   hor:[220,130,80]},
  {t:.35,top:[8,10,35],    mid:[50,25,40],    bot:[100,50,50],   hor:[160,90,65]},
  {t:.55,top:[3,4,20],     mid:[20,15,30],    bot:[50,30,35],    hor:[80,50,45]},
  {t:.75,top:[2,2,12],     mid:[10,10,20],    bot:[25,20,30],    hor:[40,30,35]},
  {t:1,  top:[2,2,12],     mid:[10,10,20],    bot:[25,20,30],    hor:[40,30,35]}
];

function getSkyColors(){
  const t=(performance.now()*.000002)%1;
  for(let i=0;i<skyPhases.length-1;i++){
    if(t>=skyPhases[i].t && t<=skyPhases[i+1].t){
      const p=(t-skyPhases[i].t)/(skyPhases[i+1].t-skyPhases[i].t);
      const a=skyPhases[i],b=skyPhases[i+1];
      const l=v=>lerp(v[0],v[1],p);
      return{
        top:[l(a.top),l(a.top),l(a.top)],
        mid:[l(a.mid),l(a.mid),l(a.mid)],
        bot:[l(a.bot),l(a.bot),l(a.bot)],
        hor:[l(a.hor),l(a.hor),l(a.hor)]
      };
    }
  }
  return{top:[2,2,12],mid:[10,10,20],bot:[25,20,30],hor:[40,30,35]};
}

function rgb(c){return`rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`}
function rgba(c,a){return`rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`}

// --- Stars ---
const stars=[];
for(let i=0;i<200;i++){
  stars.push({x:rand(0,1),y:rand(0,.45),s:rand(.5,2),b:rand(.3,1),sp:rand(.5,2)});
}

// --- Water ---
const waterLine=.62;
const waves=[];
for(let i=0;i<15;i++){
  waves.push({
    amp:rand(1,3)*scale,
    freq:rand(.005,.02),
    spd:rand(.3,.8)*scale,
    ph:rand(0,Math.PI*2)
  });
}

function getWaterColor(){
  const c=getSkyColors();
  const l=v=>lerp(v[0],v[0]*.3,1);
  return{
    top:[lerp(c.bot[0],c.bot[0]*.4,.5),lerp(c.bot[1],c.bot[1]*.4,.5),lerp(c.bot[2],c.bot[2]*.4,.5)],
    bot:[lerp(c.top[0],c.top[0]*.15,.5),lerp(c.top[1],c.top[1]*.15,.5),lerp(c.top[2],c.top[2]*.15,.5)]
  };
}

// --- Boats ---
const boats=[
  {x:.22,y:0,scale:.75,type:'sail',anchorX:.22,anchorY:.62,tilt:0},
  {x:.38,y:0,scale:.9,type:'ketch',anchorX:.38,anchorY:.62,tilt:0},
  {x:.55,y:0,scale:.6,type:'sloop',anchorX:.55,anchorY:.62,tilt:0},
  {x:.78,y:0,scale:.85,type:'sail',anchorX:.78,anchorY:.62,tilt:0}
];

// --- Lighthouse ---
const lighthouse={x:.08,y:.62};

// --- Ferry ---
const ferry={x:-.15,timer:0,speed:.00008};

// --- Gulls ---
const gulls=[];
for(let i=0;i<12;i++){
  gulls.push({
    x:rand(.1,.9),y:rand(.05,.35),
    vx:rand(-.3,.3),vy:rand(-.1,.1),
    wing:rand(0,Math.PI*2),wingSpd:rand(2,5),
    size:rand(3,6)*scale,
    state:'fly', // fly, land, sit
    targetX:0,targetY:0,
    postX:0,postY:0,
    sitTimer:rand(2,8)
  });
}

// --- Posts for gulls ---
const posts=[
  {x:.18,y:.62},{x:.32,y:.62},{x:.72,y:.62},{x:.88,y:.62}
];

// --- Sun ---
function getSunPos(){
  const t=(performance.now()*.000002)%1;
  const sunY=lerp(.55,.88,easeInOut(clamp(t*2,0,1)));
  const sunX=.5+t*.3;
  return{x:sunX*W,y:sunY*H};
}

// --- Draw Functions ---

function drawSky(){
  const c=getSkyColors();
  const grd=ctx.createLinearGradient(0,0,0,H*waterLine);
  grd.addColorStop(0,rgb(c.top));
  grd.addColorStop(.4,rgb(c.mid));
  grd.addColorStop(.75,rgb(c.bot));
  grd.addColorStop(1,rgb(c.hor));
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);
}

function drawStars(){
  const t=(performance.now()*.000002)%1;
  const alpha=clamp((t-.5)*3,0,1);
  if(alpha<=0)return;
  stars.forEach(s=>{
    const twinkle=.5+.5*Math.sin(performance.now()*.001*s.sp+s.x*100);
    ctx.fillStyle=`rgba(255,255,255,${alpha*twinkle*s.b*.7})`;
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.s*scale,0,Math.PI*2);
    ctx.fill();
  });
}

function drawSun(){
  const t=(performance.now()*.000002)%1;
  const sunY=lerp(.55,.88,easeInOut(clamp(t*2,0,1)));
  const sunX=.5+t*.3;
  const sx=sunX*W,sy=sunY*H;
  const sr=25*scale;

  // Glow
  const glow=ctx.createRadialGradient(sx,sy,sr*.5,sx,sy,sr*6);
  glow.addColorStop(0,`rgba(255,200,100,${clamp(1-t*1.5,0,.6)})`);
  glow.addColorStop(.3,`rgba(255,150,50,${clamp(.5-t*.5,0,.3)})`);
  glow.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

  // Sun disc
  ctx.beginPath();
  ctx.arc(sx,sy,sr,0,Math.PI*2);
  const sunGrd=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
  sunGrd.addColorStop(0,'#fff8e0');
  sunGrd.addColorStop(.7,'#ffcc44');
  sunGrd.addColorStop(1,'#ff8800');
  ctx.fillStyle=sunGrd;
  ctx.fill();
}

function drawClouds(){
  const t=(performance.now()*.000002)%1;
  const cols=getSkyColors();
  ctx.save();
  for(let i=0;i<5;i++){
    const cx=((i*W*.25+performance.now()*.002*(i+1)*.3)%((W+400)))-200;
    const cy=H*(.1+i*.05)+Math.sin(performance.now()*.0003+i)*10*scale;
    const cw=150+rand(i,200)*scale;
    const ch=20+rand(i,30)*scale;
    ctx.fillStyle=rgba(cols.hor,.15+i*.03);
    ctx.beginPath();
    ctx.ellipse(cx,cy,cw,ch,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx-cw*.3,cy+ch*.3,cw*.6,ch*.5,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx+cw*.4,cy+ch*.2,cw*.5,ch*.4,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawWater(){
  const c=getWaterColor();
  const wl=H*waterLine;

  // Base water gradient
  const grd=ctx.createLinearGradient(0,wl,0,H);
  grd.addColorStop(0,rgb(c.top));
  grd.addColorStop(1,rgb(c.bot));
  ctx.fillStyle=grd;
  ctx.fillRect(0,wl,W,H-wl);

  // Waves
  const t=performance.now()*.001;
  ctx.lineWidth=1.5*scale;
  for(let w=0;w<waves.length;w++){
    const wave=waves[w];
    const alpha=.05+w*.02;
    const lightness=lerp(60,30,w/waves.length);
    ctx.strokeStyle=`hsla(210,30%,${lightness}%,${alpha})`;
    ctx.beginPath();
    for(let x=0;x<W;x+=2){
      const y=wl+20+w*12+Math.sin(x*wave.freq+t*wave.spd+wave.ph)*wave.amp;
      if(x===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  // Specular glints (light path on water)
  const sunPos=getSunPos();
  const sunY=sunPos.y;
  const sunX=sunPos.x;
  const lightAlpha=clamp(1-(sunY/H-.5)*2,0,.4);
  
  if(lightAlpha>0){
    ctx.save();
    for(let i=0;i<30;i++){
      const gx=sunX+rand(-80,80)*scale;
      const gy=wl+rand(10,H-wl)*.6;
      const gw=rand(10,40)*scale;
      const gh=rand(1,2)*scale;
      ctx.fillStyle=`rgba(255,220,150,${lightAlpha*rand(.1,.4)})`;
      ctx.fillRect(gx,gy,gw,gh);
    }
    ctx.restore();
  }

  // Reflections (wobbly)
  drawReflections(wl,sunPos);
}

function drawReflections(wl,sunPos){
  ctx.save();
  ctx.globalAlpha=.15;
  ctx.translate(0,wl*2);
  ctx.scale(1,-1);

  // Water reflection of sky
  const c=getSkyColors();
  const reflGrd=ctx.createLinearGradient(0,0,0,wl);
  reflGrd.addColorStop(0,rgb(c.hor));
  reflGrd.addColorStop(1,rgb(c.top));
  ctx.fillStyle=reflGrd;
  ctx.fillRect(0,0,W,wl);

  // Sun reflection
  const sunY=sunPos.y;
  const sunX=sunPos.x;
  const sunAlpha=clamp(1-(sunY/H-.5)*2,0,.5);
  if(sunAlpha>0){
    ctx.fillStyle=`rgba(255,200,100,${sunAlpha})`;
    ctx.beginPath();
    ctx.ellipse(sunX,wl*.5,30*scale,80*scale,0,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // Wobble lines over reflections
  const t=performance.now()*.001;
  ctx.strokeStyle=`rgba(255,255,255,0.03)`;
  ctx.lineWidth=1;
  for(let i=0;i<10;i++){
    ctx.beginPath();
    const y=wl+10+i*15;
    for(let x=0;x<W;x+=5){
      const wy=y+Math.sin(x*.01+t+i)*2*scale;
      if(x===0)ctx.moveTo(x,wy);
      else ctx.lineTo(x,wy);
    }
    ctx.stroke();
  }
}

function drawBoat(boat,time){
  const t=time*.001;
  const bob=Math.sin(t*boat.anchorX*5)*3*scale;
  const tilt=Math.sin(t*boat.anchorX*3+1)*.08;
  
  const bx=boat.anchorX*W;
  const by=H*boat.anchorY+bob;
  const s=boat.scale*scale;
  
  ctx.save();
  ctx.translate(bx,by);
  ctx.rotate(tilt);
  ctx.scale(s,s);

  // Hull
  ctx.beginPath();
  ctx.moveTo(-25,0);
  ctx.quadraticCurveTo(-20,15,0,18);
  ctx.quadraticCurveTo(20,15,25,0);
  ctx.lineTo(20,-5);
  ctx.lineTo(-20,-5);
  ctx.closePath();
  const hullGrd=ctx.createLinearGradient(-25,0,-25,18);
  hullGrd.addColorStop(0,'#5a3a2a');
  hullGrd.addColorStop(1,'#3a2518');
  ctx.fillStyle=hullGrd;
  ctx.fill();
  ctx.strokeStyle='#2a1a10';
  ctx.lineWidth=1;
  ctx.stroke();

  // Mast
  ctx.beginPath();
  ctx.moveTo(0,-5);
  ctx.lineTo(0,-50);
  ctx.strokeStyle='#4a3a2a';
  ctx.lineWidth=2;
  ctx.stroke();

  // Sail
  if(boat.type==='sail'||boat.type==='sloop'){
    ctx.beginPath();
    ctx.moveTo(0,-48);
    ctx.quadraticCurveTo(15+Math.sin(t*2)*2,-25,0,-8);
    ctx.closePath();
    ctx.fillStyle='rgba(240,230,210,.85)';
    ctx.fill();
  }

  // Mast top flag
  ctx.beginPath();
  ctx.moveTo(0,-50);
  ctx.lineTo(8,-47);
  ctx.lineTo(0,-44);
  ctx.fillStyle='#cc3333';
  ctx.fill();

  ctx.restore();
}

function drawLighthouse(time){
  const t=time*.001;
  const lx=lighthouse.x*W;
  const ly=lighthouse.y*H;
  const s=scale;

  // Tower
  ctx.beginPath();
  ctx.moveTo(lx-8*s,ly);
  ctx.lineTo(lx-4*s,ly-60*s);
  ctx.lineTo(lx+4*s,ly-60*s);
  ctx.lineTo(lx+8*s,ly);
  ctx.closePath();
  const lhGrd=ctx.createLinearGradient(lx-8*s,0,lx+8*s,0);
  lhGrd.addColorStop(0,'#888');
  lhGrd.addColorStop(.5,'#ccc');
  lhGrd.addColorStop(1,'#666');
  ctx.fillStyle=lhGrd;
  ctx.fill();

  // Red stripes
  for(let i=0;i<3;i++){
    const sy=ly-50*s+i*18*s;
    ctx.beginPath();
    ctx.moveTo(lx-7*s,sy);
    ctx.lineTo(lx+7*s,sy);
    ctx.lineTo(lx+6*s,sy+7*s);
    ctx.lineTo(lx-6*s,sy+7*s);
    ctx.closePath();
    ctx.fillStyle='#cc2222';
    ctx.fill();
  }

  // Lantern room
  ctx.fillStyle='#222';
  ctx.fillRect(lx-5*s,ly-65*s,10*s,8*s);
  ctx.fillStyle='#ffcc44';
  ctx.fillRect(lx-4*s,ly-64*s,8*s,6*s);

  // Roof
  ctx.beginPath();
  ctx.moveTo(lx-6*s,ly-65*s);
  ctx.lineTo(lx,ly-72*s);
  ctx.lineTo(lx+6*s,ly-65*s);
  ctx.closePath();
  ctx.fillStyle='#333';
  ctx.fill();

  // Beam sweep
  const beamAngle=t*.5;
  const beamLen=300*s;
  const beamWidth=.15;

  ctx.save();
  ctx.translate(lx,ly-62*s);
  ctx.rotate(beamAngle);

  // Volumetric glow
  const beamGrd=ctx.createRadialGradient(0,0,0,0,0,beamLen);
  beamGrd.addColorStop(0,'rgba(255,255,200,.3)');
  beamGrd.addColorStop(.3,'rgba(255,255,150,.15)');
  beamGrd.addColorStop(.7,'rgba(255,255,100,.05)');
  beamGrd.addColorStop(1,'rgba(255,255,50,0)');

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,beamLen,-beamWidth,beamWidth);
  ctx.closePath();
  ctx.fillStyle=beamGrd;
  ctx.fill();

  // Bright core
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,beamLen*.5,-.03,.03);
  ctx.closePath();
  ctx.fillStyle='rgba(255,255,240,.2)';
  ctx.fill();

  ctx.restore();

  // Lantern glow
  const glowGrd=ctx.createRadialGradient(lx,ly-61*s,0,lx,ly-61*s,20*s);
  glowGrd.addColorStop(0,'rgba(255,200,50,.8)');
  glowGrd.addColorStop(.5,'rgba(255,150,20,.3)');
  glowGrd.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=glowGrd;
  ctx.beginPath();
  ctx.arc(lx,ly-61*s,20*s,0,Math.PI*2);
  ctx.fill();
}

function drawFerry(time){
  const t=time*.001;
  ferry.timer+=ferry.speed;
  if(ferry.timer>1)ferry.timer=0;
  
  const fx=ferry.timer*W*1.3-W*.15;
  const fy=H*.68;
  const fs=scale;

  // Wake
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(fx-10*fs,fy+5*fs);
  ctx.quadraticCurveTo(fx-60*fs,fy+10*fs,fx-120*fs,fy+20*fs);
  ctx.quadraticCurveTo(fx-80*fs,fy+5*fs,fx-10*fs,fy+3*fs);
  ctx.fillStyle='rgba(255,255,255,.08)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(fx-10*fs,fy-2*fs);
  ctx.quadraticCurveTo(fx-50*fs,fy-5*fs,fx-100*fs,fy-10*fs);
  ctx.quadraticCurveTo(fx-70*fs,fy-3*fs,fx-10*fs,fy-1*fs);
  ctx.fillStyle='rgba(255,255,255,.06)';
  ctx.fill();
  ctx.restore();

  // Ferry body
  ctx.fillStyle='#445566';
  ctx.fillRect(fx-15*fs,fy-8*fs,30*fs,10*fs);
  ctx.fillStyle='#556677';
  ctx.fillRect(fx-12*fs,fy-14*fs,24*fs,6*fs);
  ctx.fillStyle='#88aacc';
  ctx.fillRect(fx-10*fs,fy-13*fs,20*fs,4*fs);

  // Windows
  ctx.fillStyle='#ffdd88';
  for(let i=0;i<4;i++){
    ctx.fillRect(fx-8*fs+i*6*fs,fy-12*fs,3*fs,2*fs);
  }
}

function drawPosts(){
  const s=scale;
  posts.forEach(p=>{
    const px=p.x*W;
    const py=p.y*H;
    ctx.fillStyle='#3a3a3a';
    ctx.fillRect(px-2*s,py-25*s,4*s,25*s);
    ctx.beginPath();
    ctx.arc(px,py-25*s,3*s,0,Math.PI*2);
    ctx.fillStyle='#555';
    ctx.fill();
  });
}

function drawGulls(time){
  const t=time*.001;
  gulls.forEach(g=>{
    const gx=g.x*W;
    const gy=g.y*H;
    const wing=Math.sin(t*g.wingSpd+g.wing)*.3;

    ctx.save();
    ctx.translate(gx,gy);
    ctx.scale(g.size,g.size);

    // Body
    ctx.beginPath();
    ctx.ellipse(0,0,.8,.4,0,0,Math.PI*2);
    ctx.fillStyle='rgba(240,240,240,.9)';
    ctx.fill();

    // Wings
    ctx.beginPath();
    ctx.moveTo(-.2,0);
    ctx.quadraticCurveTo(-1.5,-.5+wing,-2.5,wing);
    ctx.quadraticCurveTo(-1.5,wing*.5,-.2,.1);
    ctx.fillStyle='rgba(220,220,220,.8)';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(.2,0);
    ctx.quadraticCurveTo(1.5,-.5+wing,2.5,wing);
    ctx.quadraticCurveTo(1.5,wing*.5,.2,.1);
    ctx.fillStyle='rgba(220,220,220,.8)';
    ctx.fill();

    // Head
    ctx.beginPath();
    ctx.arc(.6,0,.25,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.fill();

    // Beak
    ctx.beginPath();
    ctx.moveTo(.85,0);
    ctx.lineTo(1.1,.05);
    ctx.lineTo(.85,.1);
    ctx.fillStyle='#ffaa44';
    ctx.fill();

    ctx.restore();
  });
}

function drawDock(){
  const s=scale;
  // Main dock
  ctx.fillStyle='#5a4a3a';
  ctx.fillRect(W*.15,H*.615,W*.7,H*.015);
  
  // Dock pilings
  for(let i=0;i<8;i++){
    const px=W*.16+i*W*.1;
    ctx.fillStyle='#4a3a2a';
    ctx.fillRect(px-2*s,H*.615,4*s,H*.02);
  }

  // Dock edge
  ctx.fillStyle='#6a5a4a';
  ctx.fillRect(W*.15,H*.615,W*.7,2*s);
}

// --- Main Loop ---
function draw(){
  const t=performance.now();
  ctx.clearRect(0,0,W,H);

  drawSky();
  drawStars();
  drawSun();
  drawClouds();
  drawWater();
  drawDock();
  drawLighthouse(t);

  // Draw boats
  boats.forEach(b=>drawBoat(b,t));

  drawFerry(t);
  drawPosts();
  drawGulls(t);

  // Vignette
  const vigGrd=ctx.createRadialGradient(W/2,H/2,W*.25,W/2,H/2,W*.75);
  vigGrd.addColorStop(0,'rgba(0,0,0,0)');
  vigGrd.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=vigGrd;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
})();
</script>
</body>
</html>
