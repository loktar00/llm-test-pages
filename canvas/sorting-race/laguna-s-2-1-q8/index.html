<!DOCTYPE html>
<html>
<head>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#111}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=canvas.width=window.innerWidth;
let H=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight});

const ALGS=[
  {name:'Bubble Sort',color:'#ff6b6b',fn:bubbleSort},
  {name:'Insertion Sort',color:'#4ecdc4',fn:insertionSort},
  {name:'Merge Sort',color:'#ffe66d',fn:mergeSort},
  {name:'Quicksort',color:'#a8e6cf',fn:quickSort}
];

let N=60;
let barW=0;
let panels=[];
let animQueue=[];
let currentRun=[];
let standings=[];
let showStandingTime=0;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function makeData(n){
  return shuffle(Array.from({length:n},(_,i)=>i+1));
}

function* bubbleSort(A,emit){
  let n=A.length;
  for(let i=0;i<n-1;i++){
    for(let j=0;j<n-1-i;j++){
      emit({type:'compare',i:j,i2:j+1});
      if(A[j]>A[j+1]){
        emit({type:'swap',i:j,i2:j+1});
        [A[j],A[j+1]]=[A[j+1],A[j]];
      }
    }
  }
}

function* insertionSort(A,emit){
  for(let i=1;i<A.length;i++){
    let key=A[i];
    let j=i-1;
    while(j>=0){
      emit({type:'compare',i:j,i2:j+1});
      if(A[j]>key){
        emit({type:'swap',i:j,i2:j+1});
        A[j+1]=A[j];
        j--;
      } else break;
    }
    A[j+1]=key;
  }
}

function* mergeSort(A,emit){
  function* ms(arr,s,e){
    if(e-s<=0) return;
    if(e-s===1){
      if(arr[s]>arr[e]){
        emit({type:'swap',i:s,i2:e});
        [arr[s],arr[e]]=[arr[e],arr[s]];
      }
      return;
    }
    const m=(s+e)>>1;
    yield* ms(arr,s,m);
    yield* ms(arr,m+1,e);
    yield* merge(arr,s,m,e);
  }
  function* merge(arr,s,m,e){
    let L=arr.slice(s,m+1);
    let R=arr.slice(m+1,e+1);
    let i=0,j=0,k=s;
    while(i<L.length&&j<R.length){
      emit({type:'compare',i:s+i,i2:m+1+j});
      if(L[i]<=R[j]){
        if(arr[k]!==L[i]) emit({type:'swap',i:k,i2:s+i});
        arr[k]=L[i++];
      } else {
        if(arr[k]!==R[j]) emit({type:'swap',i:k,i2:m+1+j});
        arr[k]=R[j++];
      }
      k++;
    }
    while(i<L.length){
      if(arr[k]!==L[i]) emit({type:'swap',i:k,i2:s+i});
      arr[k]=L[i++];k++;
    }
    while(j<R.length){
      if(arr[k]!==R[j]) emit({type:'swap',i:k,i2:m+1+j});
      arr[k]=R[j++];k++;
    }
  }
  yield* ms(A,0,A.length-1);
}

function* quickSort(A,emit){
  function* qs(arr,s,e){
    if(s>=e) return;
    let p=arr[e];
    let i=s-1;
    for(let j=s;j<e;j++){
      emit({type:'compare',i:j,i2:e});
      if(arr[j]<=p){
        i++;
        if(i!=j) emit({type:'swap',i:i,i2:j});
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
    }
    [arr[i+1],arr[e]]=[arr[e],arr[i+1]];
    emit({type:'swap',i:i+1,i2:e});
    yield* qs(arr,s,i);
    yield* qs(arr,i+2,e);
  }
  yield* qs(A,0,A.length-1);
}

function startNewRace(){
  barW=W/4/N;
  panels=[];
  animQueue=[];
  currentRun=[];
  standings=[];
  const palette=[
    [`hsl(0,70%,60%)`,`hsl(0,70%,45%)`,`hsl(0,70%,85%)`,`hsl(0,40%,30%)`],
    [`hsl(150,70%,60%)`,`hsl(150,70%,45%)`,`hsl(150,70%,85%)`,`hsl(150,40%,30%)`],
    [`hsl(40,70%,60%)`,`hsl(40,70%,45%)`,`hsl(40,70%,85%)`,`hsl(40,40%,30%)`],
    [`hsl(200,70%,60%)`,`hsl(200,70%,45%)`,`hsl(200,70%,85%)`,`hsl(200,40%,30%)`]
  ];
  ALGS.forEach((alg,idx)=>{
    const data=makeData(N);
    const panel={
      alg,idx,data,ops:0,
      highlight:[],cursor:0,
      done:false,finished:false,
      palette:palette[idx],
      gen:null
    };
    panel.gen=alg.fn([...data],(e)=>{
      panel.ops++;
      animQueue.push({p:panel,e});
    });
    panels.push(panel);
  });
  showStandingTime=0;
}

startNewRace();

function stepAlgorithms(){
  panels.forEach(p=>{
    if(!p.finished){
      const res=p.gen.next();
      if(res.done){
        p.finished=true;
        standings.push(p);
      }
    }
  });
}

function animate(){
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,W,H);

  if(standings.length<4){
    panels.forEach(p=>p.cursor=(p.cursor+1)%N);
    for(let i=0;i<4;i++){if(!panels[i].finished)stepAlgorithms();}
    stepAnimations();
  } else {
    showStandingTime+=16;
    drawStandings();
    if(showStandingTime>2500){
      N=Math.min(120,Math.max(30,N+10));
      startNewRace();
      return;
    }
  }

  drawPanels();
  requestAnimationFrame(animate);
}

function stepAnimations(){
  let count=0;
  while(animQueue.length&&count<4){
    const item=animQueue.shift();
    const p=item.p;
    if(item.e.type==='compare'){
      p.highlight=[item.e.i,item.e.i2];
    } else if(item.e.type==='swap'){
      [p.data[item.e.i],p.data[item.e.i2]]=[p.data[item.e.i2],p.data[item.e.i]];
      p.highlight=[item.e.i,item.e.i2];
    }
    count++;
  }
}

function drawPanels(){
  const panelH=H/4;
  panels.forEach((p,y)=>{
    const py=y*panelH;
    ctx.fillStyle=`#22${String(y*3).padStart(2,'0')}`;
    ctx.fillRect(0,py,W,panelH);
    ctx.strokeStyle='#444';
    ctx.strokeRect(0,py,W,panelH);
    ctx.fillStyle='#fff';
    ctx.font='14px sans-serif';
    ctx.fillText(p.alg.name,10,py+20);
    ctx.fillStyle=`${p.palette[0]}`;
    ctx.fillText(`Operations: ${p.ops}`,10,py+40);
    ctx.fillStyle=p.finished?'#888':p.alg.color;
    ctx.fillText(p.finished?'FINISHED':'RUNNING',W-100,py+20);
    const bh=(panelH-50)/N;
    const gap=1;
    ctx.save();
    ctx.translate(0,py+50);
    p.data.forEach((v,i)=>{
      const x=i*barW;
      const h=(v/N)*Math.min(H/2-50,panelH-50);
      ctx.fillStyle=p.highlight.includes(i)?p.palette[2]:(i===p.cursor?p.palette[1]:p.palette[0]);
      ctx.fillRect(x+gap,W*0.6,h,bh-2);
      ctx.strokeStyle=p.alg.color;
      ctx.strokeRect(x+gap,W*0.6,h,bh-2);
    });
    ctx.restore();
  });
}

function drawStandings(){
  ctx.fillStyle='rgba(0,0,0,0.8)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  ctx.font='48px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('FINISH!',W/2,H/2-60);
  standings.forEach((p,i)=>{
    ctx.fillStyle=p.alg.color;
    ctx.font=`${36-i*4}px sans-serif`;
    ctx.fillText(`${i+1}. ${p.alg.name} (${p.ops} ops)`,W/2,H/2+20+i*45);
  });
  ctx.textAlign='left';
}

animate();
</script>
</body>
</html>
