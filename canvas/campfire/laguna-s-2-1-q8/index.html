<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campfire Night</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.body.appendChild(canvas);

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const W = canvas.width, H = canvas.height;
const cx = W / 2, cy = H * 0.7;

// Stars
let stars = [];
for (let i = 0; i < 400; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, r: Math.random() * 1.2, a: Math.random() * 0.6 + 0.4 });
}

// Meteors
let meteors = [];
function spawnMeteor() {
    if (Math.random() < 0.02) {
        meteors.push({ x: Math.random() * W, y: -10, len: Math.random() * 40 + 10, vx: (Math.random() - 0.5) * 4 - 2, vy: Math.random() * 3 + 2, life: 1 });
    }
}

// Grass twitch
let grassTwitch = [];
for (let i = 0; i < 200; i++) {
    grassTwitch.push({ x: Math.random() * W, y: H * 0.85 + Math.random() * H * 0.1, s: Math.random() * 3 + 1, t: Math.random() * Math.PI * 2 });
}

// Flame particles
let flames = [];
function spawnFlames() {
    for (let i = 0; i < 10; i++) {
        flames.push({
            x: cx + (Math.random() - 0.5) * 60,
            y: cy,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 4 - 2,
            r: Math.random() * 6 + 2,
            life: 1,
            maxLife: 30 + Math.random() * 20
        });
    }
}

// Embers
let embers = [];
function spawnEmbers() {
    if (Math.random() < 0.5) {
        embers.push({
            x: cx + (Math.random() - 0.5) * 80,
            y: cy,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2 - 1,
            r: Math.random() * 2 + 0.5,
            life: 1
        });
    }
}

// Logs
let logs = [];
function spawnLog() {
    logs.push({
        x: cx + (Math.random() - 0.5) * 80,
        y: cy + 20,
        length: Math.random() * 40 + 30,
        width: 8,
        angle: (Math.random() - 0.5) * 0.2,
        burn: 0,
        maxBurn: 300 + Math.random() * 200,
        falling: false,
        fallenY: cy + 30
    });
}
spawnLog();
spawnLog();

// Stones
let stones = [];
for (let i = 0; i < 16; i++) {
    let angle = (i / 16) * Math.PI * 2;
    let r = 60 + Math.sin(i) * 5;
    stones.push({ x: cx + Math.cos(angle) * r, y: cy + 20 + Math.sin(i * 0.5) * 3, r: 8 + Math.random() * 6 });
}

// Trees
let trees = [
    { x: cx - 180, y: cy + 10, h: 120, w: 20, shadowPhase: 0 },
    { x: cx + 200, y: cy + 10, h: 140, w: 22, shadowPhase: 0 }
];

// Time
let time = 0;
let wind = 0;

function animate() {
    time++;
    wind += 0.02;
    
    // Update meteors
    spawnMeteor();
    meteors = meteors.filter(m => {
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.02;
        return m.life > 0 && m.y < H;
    });

    // Update flames
    spawnFlames();
    flames = flames.filter(f => {
        f.x += f.vx + Math.sin(time * 0.1 + f.x) * 0.5;
        f.y += f.vy;
        f.life -= 1 / f.maxLife;
        f.r *= 0.97;
        return f.life > 0;
    });

    // Update embers
    spawnEmbers();
    embers = embers.filter(e => {
        e.x += e.vx + Math.sin(time * 0.05 + e.y) * 0.2;
        e.y += e.vy;
        e.life -= 1 / (60 + Math.random() * 40);
        return e.life > 0 && e.y > 0;
    });

    // Update logs
    logs.forEach(log => {
        log.burn++;
        if (log.burn > log.maxBurn && !log.falling) {
            log.falling = true;
        }
        if (log.falling) {
            log.fallenY += 2;
            if (log.fallenY > cy + 80) {
                let idx = logs.indexOf(log);
                logs.splice(idx, 1);
                spawnLog();
            }
        }
    });

    // Update trees
    trees.forEach(t => {
        t.shadowPhase += 0.1;
    });

    // Update grass
    grassTwitch.forEach(g => {
        g.t += 0.05;
    });

    // Draw everything
    draw();

    requestAnimationFrame(animate);
}

function draw() {
    // Sky gradient
    let skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
    skyGrad.addColorStop(0, '#0a0a2a');
    skyGrad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
        ctx.globalAlpha = s.a + Math.sin(time * 0.05 + s.x) * 0.1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Meteors
    ctx.strokeStyle = '#fff';
    ctx.lineCap = 'round';
    meteors.forEach(m => {
        ctx.globalAlpha = m.life;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.len * Math.cos(Math.atan2(m.vy, m.vx)), m.y - m.len * Math.sin(Math.atan2(m.vy, m.vx)));
        ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Ground gradient
    let groundGrad = ctx.createLinearGradient(0, cy + 20, 0, H);
    groundGrad.addColorStop(0, '#2a5a2a');
    groundGrad.addColorStop(1, '#1a3a1a');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, cy + 20, W, H - cy - 20);

    // Grass twitch
    ctx.strokeStyle = '#3a6a3a';
    ctx.lineWidth = 1;
    grassTwitch.forEach(g => {
        let sway = Math.sin(g.t + g.x * 0.02) * g.s * 0.5;
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x + sway, g.y + 8);
        ctx.stroke();
    });

    // Heat distortion effect (simulated with wavy lines)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = `rgba(255, 255, 200, ${0.3 - i * 0.1})`;
        ctx.lineWidth = 20 + i * 30;
        ctx.beginPath();
        for (let x = 0; x < W; x += 10) {
            let y = cy + Math.sin((x + time * 2 + i * 10) * 0.03) * 3;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
    ctx.restore();

    // Flame particles
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    flames.forEach(f => {
        let hue = 20 + Math.random() * 30;
        let grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        grad.addColorStop(0, `hsl(${hue}, 100%, 60%)`);
        grad.addColorStop(0.5, `hsl(${hue + 20}, 100%, 40%)`);
        grad.addColorStop(1, `hsl(${hue + 40}, 100%, 20%)`);
        ctx.fillStyle = grad;
        ctx.globalAlpha = f.life * 0.8;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();

    // Ember glow
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    embers.forEach(e => {
        let grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 2);
        grad.addColorStop(0, '#ff9900');
        grad.addColorStop(1, '#662200');
        ctx.fillStyle = grad;
        ctx.globalAlpha = e.life;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();

    // Logs
    logs.forEach(log => {
        ctx.save();
        ctx.translate(log.x, log.falling ? log.fallenY : log.y);
        ctx.rotate(log.angle);
        
        if (log.burn < log.maxBurn) {
            let burnRatio = log.burn / log.maxBurn;
            let logGrad = ctx.createLinearGradient(-log.length / 2, 0, log.length / 2, 0);
            logGrad.addColorStop(0, `#553311`);
            logGrad.addColorStop(1, `#442200`);
            ctx.fillStyle = logGrad;
            ctx.globalAlpha = 1 - burnRatio * 0.6;
            ctx.fillRect(-log.length / 2, -log.width / 2, log.length * (1 - burnRatio * 0.3), log.width);
            
            // Charred end
            ctx.fillStyle = '#221100';
            ctx.globalAlpha = burnRatio;
            ctx.fillRect(log.length / 2 * (1 - burnRatio), -log.width / 2, log.length * burnRatio, log.width);
        }
        ctx.restore();
    });

    // Stones
    ctx.fillStyle = '#555';
    stones.forEach(s => {
        let grad = ctx.createRadialGradient(s.x - s.r / 3, s.y - s.r / 3, 1, s.x, s.y, s.r);
        grad.addColorStop(0, '#777');
        grad.addColorStop(1, '#444');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });

    // Tree trunks with jittering shadows
    trees.forEach(t => {
        let jitter = Math.sin(time * 0.3 + t.shadowPhase) * 2;
        let shadowJitter = Math.sin(time * 0.5 + t.shadowPhase * 2) * 3;
        
        // Trunk
        ctx.fillStyle = '#332211';
        ctx.save();
        ctx.translate(t.x + jitter, t.y);
        ctx.fillRect(-t.w / 2, 0, t.w, t.h);
        
        // Branches
        ctx.fillRect(-t.w / 2 - 15, t.h * 0.4, 20, 6);
        ctx.fillRect(t.w / 2 - 5, t.h * 0.6, 20, 5);
        ctx.restore();
        
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.save();
        ctx.translate(t.x + shadowJitter, t.y + t.h + 5);
        ctx.scale(1.2, 0.3);
        ctx.beginPath();
        ctx.arc(0, 0, t.w / 2 + 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // Firelight on grass (flickering highlights)
    let fireIntensity = flames.length / 100;
    ctx.fillStyle = `rgba(255, 150, 50, ${fireIntensity})`;
    for (let i = 0; i < 30; i++) {
        let gx = cx + (Math.random() - 0.5) * 200;
        let gy = cy + 20 + Math.random() * (H - cy - 20);
        ctx.globalAlpha = fireIntensity * (0.2 + Math.sin(time * 0.3 + gx) * 0.1);
        ctx.fillRect(gx, gy, 3, 8);
    }
    ctx.globalAlpha = 1;

    // Occasional sparks flying outward from fire
    if (Math.random() < 0.3) {
        let sparkX = cx + (Math.random() - 0.5) * 100;
        let sparkY = cy - Math.random() * 60;
        ctx.strokeStyle = '#ffaa00';
        ctx.globalAlpha = 0.6;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sparkX, sparkY);
        ctx.lineTo(sparkX + (Math.random() - 0.5) * 20, sparkY - Math.random() * 20);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
}

animate();
</script>
</body>
</html>
