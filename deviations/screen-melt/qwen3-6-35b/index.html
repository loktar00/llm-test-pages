<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Screen Melt</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); regenerateAll(); });

// --- Scene Generators ---

function drawSkyline(scene, w, h) {
  // Night sky gradient
  let g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a0015');
  g.addColorStop(0.4, '#1a0030');
  g.addColorStop(0.7, '#2d1b4e');
  g.addColorStop(1, '#0d0d1a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // Stars
  for (let i = 0; i < 200; i++) {
    let sx = Math.random() * w;
    let sy = Math.random() * h * 0.5;
    let sr = Math.random() * 1.5;
    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.7})`;
    ctx.fillRect(sx, sy, sr, sr);
  }

  // Moon
  ctx.beginPath();
  ctx.arc(w * 0.75, h * 0.15, 30, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe8b0';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(w * 0.75 + 8, h * 0.15 - 3, 26, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0015';
  ctx.fill();

  // Buildings
  let buildings = [];
  let x = 0;
  while (x < w) {
    let bw = 20 + Math.random() * 60;
    let bh = 80 + Math.random() * (h * 0.5);
    let by = h - bh;
    let hue = 200 + Math.random() * 60;
    buildings.push({ x: x, y: by, w: bw, h: bh, hue: hue });
    x += bw + Math.random() * 15;
  }

  for (let b of buildings) {
    let g2 = ctx.createLinearGradient(b.x, b.y, b.x, h);
    g2.addColorStop(0, `hsl(${b.hue}, 30%, 15%)`);
    g2.addColorStop(1, `hsl(${b.hue}, 20%, 8%)`);
    ctx.fillStyle = g2;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    // Windows
    for (let wy = b.y + 8; wy < h - 10; wy += 12) {
      for (let wx = b.x + 4; wx < b.x + b.w - 4; wx += 10) {
        if (Math.random() > 0.4) {
          let bright = Math.random();
          if (bright > 0.7) ctx.fillStyle = '#ffe4a0';
          else if (bright > 0.4) ctx.fillStyle = '#a0c4ff';
          else ctx.fillStyle = '#ff8060';
          ctx.fillRect(wx, wy, 5, 7);
        }
      }
    }

    // Roof accent
    ctx.fillStyle = `hsl(${b.hue}, 80%, 60%)`;
    ctx.fillRect(b.x, b.y, b.w, 3);
  }

  // Ground
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, h - 15, w, 15);
}

function drawAlienTerrain(scene, w, h) {
  // Alien sky
  let g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#001a0a');
  g.addColorStop(0.3, '#003320');
  g.addColorStop(0.6, '#004430');
  g.addColorStop(1, '#002215');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // Nebula clouds
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    let cx = Math.random() * w;
    let cy = h * 0.1 + Math.random() * h * 0.3;
    let rx = 100 + Math.random() * 200;
    let ry = 30 + Math.random() * 60;
    ctx.ellipse(cx, cy, rx, ry, Math.random(), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, ${100 + Math.random() * 100}, ${50 + Math.random() * 50}, 0.3)`;
    ctx.fill();
  }

  // Stars
  for (let i = 0; i < 150; i++) {
    ctx.fillStyle = `rgba(200,255,220,${Math.random()})`;
    ctx.fillRect(Math.random() * w, Math.random() * h * 0.6, 1.5, 1.5);
  }

  // Distant mountains
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 3) {
    let y = h * 0.45 + Math.sin(x * 0.005) * 60 + Math.sin(x * 0.013) * 30 + Math.sin(x * 0.027) * 15;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = '#003322';
  ctx.fill();

  // Mid mountains
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 3) {
    let y = h * 0.55 + Math.sin(x * 0.008 + 1) * 50 + Math.sin(x * 0.02 + 2) * 25;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = '#004430';
  ctx.fill();

  // Foreground terrain
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 2) {
    let y = h * 0.7 + Math.sin(x * 0.01 + 3) * 40 + Math.sin(x * 0.03) * 20 + Math.sin(x * 0.07) * 8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = '#005535';
  ctx.fill();

  // Glowing alien plants
  for (let i = 0; i < 30; i++) {
    let px = Math.random() * w;
    let py = h * 0.65 + Math.random() * h * 0.3;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.quadraticCurveTo(px + (Math.random() - 0.5) * 20, py - 20 - Math.random() * 30, px + (Math.random() - 0.5) * 10, py - 30 - Math.random() * 40);
    ctx.strokeStyle = `rgba(0, ${150 + Math.random() * 105}, 50, 0.8)`;
    ctx.lineWidth = 2;
    ctx.stroke();
    // Glow tip
    ctx.beginPath();
    ctx.arc(px + (Math.random() - 0.5) * 10, py - 30 - Math.random() * 40, 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(100, 255, 150, ${0.5 + Math.random() * 0.5})`;
    ctx.fill();
  }
}

function drawAbstractPattern(scene, w, h) {
  // Dark background
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, w, h);

  // Grid of glowing shapes
  let cols = Math.ceil(w / 40) + 1;
  let rows = Math.ceil(h / 40) + 1;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let cx = c * 40 + 20;
      let cy = r * 40 + 20;
      let type = Math.floor((r * cols + c + Math.sin(r * 0.5) * 3) % 5);
      let hue = (r * 30 + c * 20) % 360;

      ctx.save();
      ctx.translate(cx, cy);

      if (type === 0) {
        // Diamond
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.lineTo(15, 0);
        ctx.lineTo(0, 15);
        ctx.lineTo(-15, 0);
        ctx.closePath();
        ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.7)`;
        ctx.fill();
        ctx.strokeStyle = `hsla(${hue}, 90%, 70%, 0.9)`;
        ctx.lineWidth = 1;
        ctx.stroke();
      } else if (type === 1) {
        // Hexagon
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          let a = (Math.PI / 3) * i - Math.PI / 6;
          ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
        }
        ctx.closePath();
        ctx.fillStyle = `hsla(${hue + 60}, 70%, 40%, 0.6)`;
        ctx.fill();
        ctx.strokeStyle = `hsla(${hue + 60}, 80%, 65%, 0.8)`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else if (type === 2) {
        // Circle with ring
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue + 120}, 60%, 35%, 0.5)`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${hue + 120}, 80%, 60%, 0.8)`;
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (type === 3) {
        // Triangle
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(13, 8);
        ctx.lineTo(-13, 8);
        ctx.closePath();
        ctx.fillStyle = `hsla(${hue + 180}, 70%, 45%, 0.6)`;
        ctx.fill();
        ctx.strokeStyle = `hsla(${hue + 180}, 80%, 65%, 0.8)`;
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        // Cross
        ctx.fillStyle = `hsla(${hue + 240}, 70%, 50%, 0.7)`;
        ctx.fillRect(-3, -12, 6, 24);
        ctx.fillRect(-12, -3, 24, 6);
      }

      ctx.restore();
    }
  }

  // Overlay connecting lines
  ctx.strokeStyle = 'rgba(100, 150, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      if (Math.random() > 0.5) {
        ctx.beginPath();
        ctx.moveTo(c * 40 + 20, r * 40 + 20);
        ctx.lineTo((c + 1) * 40 + 20, (r + 1) * 40 + 20);
        ctx.stroke();
      }
    }
  }
}

function drawOceanSunset(scene, w, h) {
  // Sky
  let g = ctx.createLinearGradient(0, 0, 0, h * 0.55);
  g.addColorStop(0, '#1a0530');
  g.addColorStop(0.3, '#4a1050');
  g.addColorStop(0.5, '#c03030');
  g.addColorStop(0.7, '#e08030');
  g.addColorStop(1, '#ffcc44');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h * 0.55);

  // Sun
  let sunY = h * 0.4;
  let sunG = ctx.createRadialGradient(w * 0.5, sunY, 5, w * 0.5, sunY, 80);
  sunG.addColorStop(0, 'rgba(255,255,200,1)');
  sunG.addColorStop(0.3, 'rgba(255,200,100,0.8)');
  sunG.addColorStop(1, 'rgba(255,100,50,0)');
  ctx.fillStyle = sunG;
  ctx.fillRect(w * 0.5 - 100, sunY - 100, 200, 200);

  ctx.beginPath();
  ctx.arc(w * 0.5, sunY, 25, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8e0';
  ctx.fill();

  // Sun reflection on water
  let waterY = h * 0.55;
  let wg = ctx.createLinearGradient(0, waterY, 0, h);
  wg.addColorStop(0, '#cc4422');
  wg.addColorStop(0.2, '#883344');
  wg.addColorStop(0.5, '#221144');
  wg.addColorStop(1, '#0a0a20');
  ctx.fillStyle = wg;
  ctx.fillRect(0, waterY, w, h - waterY);

  // Water reflection column
  for (let ry = waterY; ry < h; ry += 2) {
    let spread = (ry - waterY) * 0.3;
    let alpha = 1 - (ry - waterY) / (h - waterY);
    ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.3})`;
    ctx.fillRect(w * 0.5 - spread * 0.4, ry, spread * 0.8, 1);
  }

  // Waves
  for (let i = 0; i < 40; i++) {
    let wy = waterY + 10 + Math.random() * (h - waterY - 20);
    let wx = Math.random() * w;
    let ww = 20 + Math.random() * 60;
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.quadraticCurveTo(wx + ww * 0.5, wy - 2 - Math.random() * 3, wx + ww, wy);
    let alpha = 0.1 + Math.random() * 0.2;
    ctx.strokeStyle = `rgba(255, 180, 100, ${alpha})`;
    ctx.lineWidth = 1 + Math.random();
    ctx.stroke();
  }

  // Clouds
  for (let i = 0; i < 6; i++) {
    let cx = Math.random() * w;
    let cy = h * 0.1 + Math.random() * h * 0.25;
    for (let j = 0; j < 5; j++) {
      ctx.beginPath();
      ctx.ellipse(cx + j * 20 - 40, cy + Math.random() * 10, 30 + Math.random() * 20, 8 + Math.random() * 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 100, 80, ${0.1 + Math.random() * 0.15})`;
      ctx.fill();
    }
  }
}

const sceneGenerators = [drawSkyline, drawAlienTerrain, drawAbstractPattern, drawOceanSunset];

// --- Scene Management ---

let sceneCanvases = [];
let currentSceneIndex = 0;
let scenesGenerated = 0;
const MAX_SCENES = 6;

function generateScene(index) {
  let offscreen = document.createElement('canvas');
  offscreen.width = W;
  offscreen.height = H;
  let octx = offscreen.getContext('2d');
  // Save and restore to not affect main ctx
  let gen = sceneGenerators[index % sceneGenerators.length];
  gen(octx, W, H);
  return offscreen;
}

function regenerateAll() {
  sceneCanvases = [];
  scenesGenerated = 0;
  currentSceneIndex = Math.floor(Math.random() * sceneGenerators.length);
  for (let i = 0; i < MAX_SCENES; i++) {
    sceneCanvases.push(generateScene(currentSceneIndex + i));
  }
  scenesGenerated = MAX_SCENES;
}

function ensureScenes() {
  while (scenesGenerated < MAX_SCENES + 2) {
    let idx = currentSceneIndex + scenesGenerated;
    sceneCanvases.push(generateScene(idx));
    scenesGenerated++;
  }
}

// --- Melt State ---

let meltColumns = [];
let meltStartTime = 0;
let holdTime = 3000; // ms to hold each scene
let meltDuration = 3500; // ms for full melt
let lastTime = 0;
let currentSceneForMelt = 0;
let nextSceneForMelt = 1;
let meltPhase = 'hold'; // 'hold', 'melt', 'switch'
let switchTimer = 0;

function initMeltColumns() {
  meltColumns = [];
  let numCols = Math.ceil(W / 1.5); // ~1.5px per column for smoothness
  for (let i = 0; i < numCols; i++) {
    meltColumns.push({
      progress: 0,
      delay: Math.random() * 0.35, // stagger 0-35%
      speed: 0.6 + Math.random() * 0.8, // speed variation
      wobbleAmp: 1.5 + Math.random() * 3,
      wobbleFreq: 3 + Math.random() * 5,
      dripPhase: Math.random() * Math.PI * 2,
      dripWidth: 3 + Math.random() * 5 // width of drip
    });
  }
}

function resetMelt() {
  currentSceneForMelt = currentSceneIndex;
  nextSceneForMelt = currentSceneIndex + 1;
  meltPhase = 'hold';
  switchTimer = 0;
  for (let col of meltColumns) {
    col.progress = 0;
  }
}

// --- Drip shape function ---
// Returns the distortion for a given position within the melt zone
function dripDistortion(localY, col) {
  // localY: 0 at top of melt zone, 1 at bottom
  // Creates bulbous dripping effect
  let t = localY;
  // Main drip shape: a sine wave that creates thick drips
  let drip = Math.sin(t * Math.PI * col.wobbleFreq + col.dripPhase);
  // The drip is wider at the bottom of each "drop"
  let shape = Math.pow(Math.max(0, drip), 1.5);
  return shape * col.wobbleAmp;
}

function getMeltFrontY(col, time) {
  let elapsed = time - meltStartTime;
  let adjustedDelay = col.delay * meltDuration;
  let meltElapsed = elapsed - adjustedDelay;
  if (meltElapsed < 0) return -1;
  let progress = Math.min(1, meltElapsed / (meltDuration * (0.7 + col.speed * 0.3)));
  return progress * H;
}

// --- Rendering ---

function render(time) {
  let dt = time - lastTime;
  lastTime = time;

  // Update hold/melt phases
  switchTimer += dt;

  if (meltPhase === 'hold') {
    if (switchTimer > holdTime) {
      meltPhase = 'melt';
      meltStartTime = time;
      // Reset columns
      for (let col of meltColumns) {
        col.progress = 0;
      }
    }
  } else if (meltPhase === 'melt') {
    let elapsed = time - meltStartTime;
    let allDone = true;
    for (let col of meltColumns) {
      let fy = getMeltFrontY(col, time);
      col.progress = fy / H;
      if (fy < H) allDone = false;
    }
    if (allDone || elapsed > meltDuration * 1.5) {
      meltPhase = 'switch';
      switchTimer = 0;
    }
  } else if (meltPhase === 'switch') {
    if (switchTimer > 500) {
      // Advance to next scene
      currentSceneIndex++;
      ensureScenes();
      currentSceneForMelt = currentSceneIndex;
      nextSceneForMelt = currentSceneIndex + 1;
      meltStartTime = time;
      meltPhase = 'hold';
      switchTimer = 0;
      // Reset columns with new random values
      for (let col of meltColumns) {
        col.delay = Math.random() * 0.35;
        col.speed = 0.6 + Math.random() * 0.8;
        col.wobbleAmp = 1.5 + Math.random() * 3;
        col.wobbleFreq = 3 + Math.random() * 5;
        col.dripPhase = Math.random() * Math.PI * 2;
        col.dripWidth = 3 + Math.random() * 5;
        col.progress = 0;
      }
    }
  }

  // --- Draw ---
  let sceneN = sceneCanvases[currentSceneForMelt];
  let sceneN1 = sceneCanvases[nextSceneForMelt];

  if (!sceneN || !sceneN1) return;

  let nCtx = sceneN.getContext('2d');
  let n1Ctx = sceneN1.getContext('2d');

  // Get image data for both scenes
  let imgData = nCtx.getImageData(0, 0, W, H);
  let imgData1 = n1Ctx.getImageData(0, 0, W, H);
  let src = imgData.data;
  let src1 = imgData1.data;
  let outData = ctx.createImageData(W, H);
  let out = outData.data;

  let numCols = meltColumns.length;
  let colWidth = W / numCols;

  for (let col = 0; col < numCols; col++) {
    let colX = Math.floor(col * colWidth);
    let colEnd = Math.floor((col + 1) * colWidth);
    let meltCol = meltColumns[col];

    let frontY = getMeltFrontY(meltCol, lastTime);

    for (let x = colX; x < colEnd && x < W; x++) {
      for (let y = 0; y < H; y++) {
        let idx = (y * W + x) * 4;

        if (frontY < 0) {
          // Not yet melted: show current scene
          out[idx] = src[idx];
          out[idx + 1] = src[idx + 1];
          out[idx + 2] = src[idx + 2];
          out[idx + 3] = src[idx + 3];
        } else if (y < frontY - 30) {
          // Above melt: show next scene
          out[idx] = src1[idx];
          out[idx + 1] = src1[idx + 1];
          out[idx + 2] = src1[idx + 2];
          out[idx + 3] = src1[idx + 3];
        } else if (y > frontY + 80) {
          // Below melt: show current scene
          out[idx] = src[idx];
          out[idx + 1] = src[idx + 1];
          out[idx + 2] = src[idx + 2];
          out[idx + 3] = src[idx + 3];
        } else {
          // In melt zone: distorted current scene
          let localY = (y - frontY) / 80; // 0 to 1 within melt zone
          let distortion = dripDistortion(localY, meltCol);

          // Read from current scene with horizontal distortion
          let readX = x + Math.sin(localY * 12 + meltCol.dripPhase) * distortion;
          readX = Math.max(0, Math.min(W - 1, readX));
          let readIdx = (y * W + Math.floor(readX)) * 4;

          // Add vertical stretching effect in melt zone
          let stretchFactor = 1 + Math.sin(localY * Math.PI) * 0.15;
          let readY = Math.floor(y / stretchFactor);
          readY = Math.max(0, Math.min(H - 1, readY));
          let readIdx2 = (readY * W + Math.floor(readX)) * 4;

          // Blend with next scene at the boundary for smoothness
          let blendY = Math.min(1, Math.max(0, (frontY - y) / 30));
          let blend = blendY * blendY * (3 - 2 * blendY); // smoothstep

          out[idx] = src[readIdx2] * (1 - blend) + src1[idx] * blend;
          out[idx + 1] = src[readIdx2 + 1] * (1 - blend) + src1[idx + 1] * blend;
          out[idx + 2] = src[readIdx2 + 2] * (1 - blend) + src1[idx + 2] * blend;
          out[idx + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(outData, 0, 0);

  // Draw drip highlights (thin bright lines at drip tips)
  ctx.globalCompositeOperation = 'lighter';
  for (let col = 0; col < numCols; col++) {
    let meltCol = meltColumns[col];
    let frontY = getMeltFrontY(meltCol, lastTime);
    if (frontY > 0 && frontY < H) {
      // Drip tip highlight
      let tipWobble = Math.sin(frontY * 0.05 + meltCol.dripPhase) * meltCol.wobbleAmp;
      let gx = col * colWidth + tipWobble;
      let glow = ctx.createLinearGradient(gx - 3, frontY, gx + 3, frontY);
      glow.addColorStop(0, 'rgba(255,255,255,0)');
      glow.addColorStop(0.5, `rgba(255,255,255,${0.15 + Math.random() * 0.1})`);
      glow.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(gx - 4, frontY - 1, 8, 2);
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(render);
}

// --- Init ---

regenerateAll();
initMeltColumns();
lastTime = performance.now();
requestAnimationFrame(render);
</script>
</body>
</html>
