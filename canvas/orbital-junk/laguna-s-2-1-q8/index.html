<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Junk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="orbitalCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('orbitalCanvas');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  const ROTATION_SPEED = 0.00005;
  const EARTH_RADIUS = 40;
  const EARTH_X = 100;
  const EARTH_Y = 100;
  const FRAME_RATE = 60;
  let debrisList = [];
  let fragmentCounter = 0;

  class Debris {
    constructor(x, y, vx, vy, orbitRadius, orbitSpeed, size, color = '#aaa') {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.orbitRadius = orbitRadius;
      this.orbitSpeed = orbitSpeed;
      this.size = size;
      this.color = color;
      this.orbitAngle = 0;
    }

    update() {
      this.orbitAngle += this.orbitSpeed;
      this.x = EARTH_X + Math.cos(this.orbitAngle) * this.orbitRadius;
      this.y = EARTH_Y + Math.sin(this.orbitAngle) * this.orbitRadius;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
  }

  function init() {
    debrisList = [];
    fragmentCounter = 0;

    // Create multiple orbital rings at different radii and speeds
    const orbitRings = [
      { radius: 80, count: 20, speed: 0.0015 },
      { radius: 120, count: 25, speed: 0.0012 },
      { radius: 160, count: 30, speed: 0.0010 },
      { radius: 200, count: 35, speed: 0.0008 },
      { radius: 240, count: 40, speed: 0.0006 },
      { radius: 280, count: 30, speed: 0.0005 },
    ];

    orbitRings.forEach(ring => {
      for (let i = 0; i < ring.count; i++) {
        const angle = (i / ring.count) * Math.PI * 2;
        const x = EARTH_X + Math.cos(angle) * ring.radius;
        const y = EARTH_Y + Math.sin(angle) * ring.radius;
        const size = Math.random() * 1.5 + 0.5;
        const color = `hsl(${Math.random() * 60 + 30}, 80%, 70%)`;
        debrisList.push(new Debris(x, y, 0, 0, ring.radius, ring.speed, size, color));
      }
    });
  }

  let lastCollisionTime = 0;

  function spawnCollision() {
    if (debrisList.length < 2 || performance.now() - lastCollisionTime < 3000) return;

    const index1 = Math.floor(Math.random() * debrisList.length);
    let index2 = Math.floor(Math.random() * debrisList.length);
    while (index2 === index1) {
      index2 = Math.floor(Math.random() * debrisList.length);
    }

    const d1 = debrisList[index1];
    const d2 = debrisList[index2];

    if (Math.hypot(d1.x - d2.x, d1.y - d2.y) < d1.size + d2.size + 5) {
      // Remove originals
      debrisList.splice(index1, 1);
      const newIndex2 = debrisList.indexOf(d2);
      if (newIndex2 !== -1) debrisList.splice(newIndex2, 1);

      // Spawn explosion cloud fragments
      const px = (d1.x + d2.x) / 2;
      const py = (d1.y + d2.y) / 2;
      const pr = (d1.orbitRadius + d2.orbitRadius) / 2;

      for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.002 + 0.0005;
        const dx = px + (Math.cos(angle) * Math.random() * 10);
        const dy = py + (Math.sin(angle) * Math.random() * 10);
        const size = Math.random() * 1 + 0.3;
        const color = `hsl(${Math.random() * 60 + 10}, 90%, 65%)`;
        debrisList.push(new Debris(dx, dy, 0, 0, pr + (Math.random() - 0.5) * 20, (Math.random() * 0.001) + 0.0005, size, color));
      }

      lastCollisionTime = performance.now();
    }
  }

  let drone = { x: 0, y: 0, target: null, speed: 0.5 };

  function updateDrone() {
    if (!drone.target || debrisList.length === 0) {
      drone.target = debrisList[Math.floor(Math.random() * debrisList.length)];
    }

    if (drone.target) {
      const dx = drone.target.x - drone.x;
      const dy = drone.target.y - drone.y;
      const dist = Math.hypot(dx, dy);

      if (dist < 5) {
        // Delete nearby debris
        debrisList = debrisList.filter(d => !(Math.hypot(d.x - drone.x, d.y - drone.y) < 30));
        drone.target = null;
      } else {
        drone.x += (dx / dist) * drone.speed;
        drone.y += (dy / dist) * drone.speed;
      }
    }
  }

  function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, width, height);

    // Draw Earth
    ctx.beginPath();
    ctx.arc(EARTH_X, EARTH_Y, EARTH_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#1a73e8';
    ctx.shadowColor = '#1a73e8';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw orbit guides
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.5;
    [80, 120, 160, 200, 240, 280].forEach(r => {
      ctx.beginPath();
      ctx.arc(EARTH_X, EARTH_Y, r, 0, Math.PI * 2);
      ctx.stroke();
    });

    // Spawn occasional collisions
    if (Math.random() < 0.02) {
      spawnCollision();
    }

    // Update and draw all debris
    debrisList.forEach(d => {
      d.update();
      d.draw();
    });

    // Update and draw drone
    updateDrone();
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.arc(drone.x, drone.y, 3, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  init();
  animate();
})();
</script>
</body>
</html>
