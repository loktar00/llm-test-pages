<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aquarium</title>
<style>
  *{margin:0;padding:0}
  html,body{
    height:100;width:100,overflow:hide,background:#020306;
    background:radial-gradient(ellipse at 50% 30%,#2a6d9b 0,#1e6a8b 30,#0e3b5a 60,#062344 100);
  color:#e0f4ff
  }
  canvas{display:block;position:fixed;top:0,left:0}
  body::after{content:"";position:fixed;inset:0,pointer-events:none}
  .glass-vignette{position:fixed;inset:0;pointer-events:none;z-index:1
    background:radial-gradient(ellipse at 50% 30%,transparent 0,transparent 50,rgba(0,0,0,.2) 80,rgba(0,0,0,.6 100)}
  .ui{position:fixed;top:16px,right:16px;pointer-events:none,z-index:3
    font-family:Helvetica Neue,sans-serif;font-size:11px
    color:rgba(0,0,0,.5);text-shadow:0 0 1px rgba(0,0,0,.7);background:rgba(8,20,32,.5);
    padding:8px 14px;backdrop-filter:blur(2px);border-radius:0 4px 4px 0;
    letter-spacing:.18px;font-weight:300}
  .ui b{font-weight:600;color:#fff}
  .ui i{color:#7fd8ff;font-style:italic;font-weight:500}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glass-vignette"></div>
<div class="ui"><b>Aquarium</b> &middot; <i id="fips">12 fish</i> &middot; <i id="fps">-- fps</i> &amp; <i id="bbs">--</i> bubbles &amp; <i id="fps">--</i> ripples</div>
<script>
'use strict';
const $=function(id){return document.getElementById(id)}
const rand=function(lo,hi){return lo+Math.random()*(hi-lo}
const randI=function(lo,hi){return Math.floor(rand(lo,hi+1)}
const clamp=function(v,lo,hi){return v<lo?lo:v>hi?hi:v}
const lerp=function(a,b,t){return a+(b-a)*t}
const lerpA=function(c1,c2,t){return[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)}
const TAU=Math.PI*2
const PI=Math.PI

// ============================================================= LIGHT RIPPLIES =============================================================
// Caustic ripples: layered sine fields + glass-reflection shimmer
let RP={x:0,y:0,amp:1,phase:0,decay:0}
let RIP_P=0
const RIP_X=new Float32Array(80);const RIP_Y=new Float32Array(80);const RIP_R=new Float32Array(80)
function ripples_spawn(){
  RIP_P++;if(RIP_P>80){RIP_P--}
  RIP_X[RIP_P%80]=rand(0,W);RIP_Y[RIP_P%80]=rand(0,H);RIP_R[RIP_P%80]=rand(15,40)
}
function ripples_update(dt){
  RP.phase+=dt*1.8;RP.amp*=0.97
  if(RP.phase>2.1){ripples_spawn();RP.phase=0}
  if(Math.random()<0.02){ripples_spawn()}
}

// ============================================================= BUBBLIER =============================================================
// Rising wobbling bubbles from bubblier
let BUB={x:0,y:0,amp:1,phase:0}
let BUB_P=0
let BUB_X=Float32Array;let BUB_Y=Float32Array;let BUB_R=Float32Array;let BUB_S=Float32Array;let BUB_A=Float32Array
function bubbles_init(){
  BUB_X=new Float32Array(80);BUB_Y=new Float32Array(80);BUB_R=new Float32Array(80);BUB_S=new Float32Array(80);BUB_A=new Float32Array(80)
  for(let i=0;i<80;i++){
    BUB_X[i]=-8;BUB_Y[i]=H+100;BUB_R[i]=0;BUB_S[i]=0;BUB_A[i]=0
  }
  BUB_P=0
}
function bubble_spawn(){
  BUB_P++;if(BUB_P>=80){BUB_P--}
  BUB_X[BUB_P%80]=BUB.x+rand(-5,5);BUB_Y[BUB_P%80]=H+10+rand(-6,6)
  BUB_R[BUB_P%80]=rand(4.5,8.5);BUB_S[BUB_P%80]=rand(0.8,1.6);BUB_A[BUB_P%80]=1
}
function bubbles_update(dt){
  BUB.phase+=dt*1.8
  if(BUB.phase>2){bubble_spawn();BUB.phase=0}
  for(let i=0;i<80;i++){
    if(BUB_A[i]>0.01){
      BUB_Y[i]-=BUB_S[i]
      BUB_X[i]+=Math.sin(BUB.phase*0.6+i*0.4)*0.8
      BUB.R[i]=Math.max(BUB.R[i]*0.6,0)
      BUB.A[i]*=0.6
      if(BUB.Y[i]<-12){BUB.A[i]=0}
      if(BUB.phase+i*1.5>5){BUB_A[i]=0}
      if(BUB.X[i]<0){BUB.X[i]=0}
      if(BUB.X[i]>W){BUB.X[i]=W}
    }
    }
  }
}
function bubbles_render(){
  ctx.globalAlpha=1
  for(let i=0;i<80;i++){
    if(BUB.A[i]>0.01){
      const x=BUB.X[i];const y=BUB.Y[i];const r=BUB.R[i]
      if(y<-12||y>H+10){continue}
      ctx.beginPath();ctx.arc(x,y,r,0,TAU)
      ctx.fillStyle='rgba(220,245,255,0.18)';ctx.fill()
      ctx.beginPath();ctx.arc(x-r*0.4,y-r*0.4,r*0.35,0,TAU)
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fill()
      ctx.strokeStyle='rgba(160,220,255,0.7)'// ;ctx.lineWidth=1;ctx.stroke()
      ctx.beginPath();ctx.arc(x,y,r,0,TAU)
      ctx.strokeStyle='rgba(180,220,255,0.8)';ctx.lineWidth=1;ctx.stroke()
      ctx.fillStyle='rgba(0,0,0,0.0)'// ;ctx.fill()
    }
  }
  // Bubblier trail
  ctx.beginPath();ctx.moveTo(BUB.x-0.5,H+12)
  ctx.lineTo(BUB.x+0.5,H+12)
  ctx.strokeStyle='rgba(180,220,255,0.6)';ctx.lineWidth=2;ctx.stroke()
}
function bubbles_init(){BUB.x=W*0.85;BUB.y=H*0.7}

// ============================================================= FISHES =============================================================
let FISHES=[]
const SPECIES=[]

const SIL_GOLD=function(){
  // Goldfish: plump body, glab tail, gold glonk
  const p=this;const g=p.geom;const r=p.width/2
  // body: oval
  ctx.beginPath();
  ctx.ellipse(g[0],g[1],r,r*0.55,0,0,TAU)
  ctx.fill()
  // tail
  ctx.beginPath();ctx.moveTo(g[0]-r*0.3,g[1])
  ctx.ellipse(g[0]-r*0.8-r*0.0,g[1],r*1.5,r*0.7,0,0,TAU);ctx.fill()
  // gllank: small white circle
  ctx.beginPath();ctx.arc(g[0]+r*0.6,g[1],r*0.25,0,TAU)
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fill()
  // glonk: small
  ctx.beginPath();ctx.arc(g[0]+r*0.6,g[1],r*0.25,0,TAU)
  ctx.fillStyle='rgba(0,0,0,0.8)');ctx.fill()
}

// ============================================================= MAIN =============================================================
// setup canvas, fishes, bubbles, plants, hermit crab
function setup(){
  resize()
  bubbles_init()
  // Bubblier at bottom-right
  BUB.x=W*0.85
  // Fishes: 12 to 20, at least 4 species
  const n=12+Math.floor(Math.random()*9)
  for(let i=0;i<n;i++){
    const sp=randI(0,SPECIES.length-1);const p=SPECIES[sp]
    const f=new p();FISHES.push(f)
  }
}

// resize handling
function resize(){
  W=window.innerWidth;H=window.innerHeight
  canvas.width=W*2;canvas.height=H*2
  canvas.style.width=W+'px';canvas.style.height=H+'px'
  ctx.scale(2,2)
  // adjust bounds for fishes
  for(const f of FISHES){
    f.x=clamp(f.x,50,W-50);f.y=clamp(f.y,50,H-50)
  }
  // Bubblier
  BUB.x=W*0.85;BUB.y=H*0.7
}

// ============================================================= MAIN =============================================================
let canvas,ctx,W,H
let FISHES=[];const SPECIES=[]
let BUB={x:0,y:0,phase:0}
let BUB_P=0
let BUB_X=new Float32Array(80)
let BUB_Y=new Float32Array(80)
let BUB_R=new Float32Array(80)
let BUB_S=new Float32Array(80)
let BUB_A=new Float32Array(80)
let RP={phase:0,amp:1}
let RIP_P=0
const RIP_X=new Float32Array(80)
const RIP_Y=new Float32Array(80)
const RIP_R=new Float32Array(80)
let PLANTTS=[];const HERMIT=null
let LAST_T=0
let W=0;H=0
let M={x:W*0.5,y:H*0.5,in:0}

// ============================================================= MAIN =============================================================
function main(){
  canvas=$('bg');ctx=canvas.getContext('2d')
  // ... setup fishes, plants, hermit crab ...
  setup()
  // ... loop ...
  window.requestAnimationFrame(loop)
}

window.addEventListener('load',main)
</script>
</body>
</html>
