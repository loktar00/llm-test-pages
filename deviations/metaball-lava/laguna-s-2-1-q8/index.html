<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Metaball Lava Lamp</title>
<style>
    * {
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width, height, dpr;

function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.scale(dpr, dpr);
}
window.addEventListener("resize", resize);
resize();

const NUM = 10;
const blobs = [];

for (let i = 0; i < NUM; i++) {
    blobs.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.3) * 0.6 + 0.3,
        speed: 0.4 + Math.random() * 0.3,
        r: 30 + Math.random() * 30,
        heat: Math.random(),
        targetHeat: Math.random(),
    });
}

function update() {
    for (const b of blobs) {
        // Heat cycles: warm at base, cool at top
        b.targetHeat = b.y / height;
        b.heat += (b.targetHeat - b.heat) * 0.02;

        // Vertical movement influenced by heat
        b.vy = (0.3 + (1 - b.heat) * 0.5) * b.speed;

        b.x += b.vx * b.speed;
        b.y += b.vy * b.speed;

        // Wrap around
        if (b.x < -b.r) b.x = width + b.r;
        if (b.x > width + b.r) b.x = -b.r;
        if (b.y < -b.r) b.y = height + b.r;
        if (b.y > height + b.r) b.y = -b.r;

        // Horizontal wobble
        b.vx += (Math.random() - 0.5) * 0.01;
        b.vx *= 0.98;
    }
}

// Field resolution
let resX = Math.floor(width / 6);
let resY = Math.floor(height / 6);
let field = new Uint8Array(resX * resY);
let imageData = ctx.createImageData(resX, resY);

function render() {
    // Update field
    for (let i = 0; i < field.length; i++) field[i] = 0;

    for (const b of blobs) {
        const bx = Math.floor(b.x / (width / resX));
        const by = Math.floor(b.y / (height / resY));
        const radius = b.r / (width / resX);

        for (let dy = -radius - 2; dy <= radius + 2; dy++) {
            for (let dx = -radius - 2; dx <= radius + 2; dx++) {
                const px = bx + dx;
                const py = by + dy;
                if (px < 0 || px >= resX || py < 0 || py >= resY) continue;
                const distSq = dx * dx + dy * dy;
                if (distSq > (radius + 1) * (radius + 1)) continue;
                const val = (1 - distSq / (radius * radius)) * 255;
                const idx = py * resX + px;
                field[idx] += val > field[idx] ? val : 0;
            }
        }
    }

    // Draw thresholded field
    for (let i = 0; i < field.length; i++) {
        const val = field[i] > 128 ? 255 : 0;
        imageData.data[i * 4] = val;     // R
        imageData.data[i * 4 + 1] = val; // G
        imageData.data[i * 4 + 2] = val; // B
        imageData.data[i * 4 + 3] = val; // A
    }

    const blobCanvas = document.createElement("canvas");
    blobCanvas.width = resX;
    blobCanvas.height = resY;
    const blobCtx = blobCanvas.getContext("2d");
    blobCtx.putImageData(imageData, 0, 0);

    ctx.clearRect(0, 0, width, height);

    // Color grading: glass lamp effect
    ctx.fillStyle = "#0a001f";
    ctx.fillRect(0, 0, width, height);

    // Draw upscale metaballs with color based on heat
    ctx.filter = "blur(2px)";
    ctx.drawImage(blobCanvas, 0, 0, width, height);
    ctx.filter = "none";

    for (const b of blobs) {
        const t = b.heat;
        const hue = t < 0.5
            ? 20 + t * 40   // Cool -> orange
            : 40 + t * 30;  // Warm -> red
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 90%, 50%, 0.7)`;
        ctx.shadowBlur = b.r * 2;
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
        ctx.fill();
    }

    ctx.shadowBlur = 0;
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
