<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Perpetual Pinball</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        color: #0ff;
        font-family: 'Courier New', monospace;
    }
    canvas {
        display: block;
        background: radial-gradient(circle at center, #001122 0%, #000 100%);
    }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Physics constants
    const BALL_RADIUS = 12;
    const GRAVITY = 0.5;
    const DRAG = 0.99;
    const RESTITUTION = 0.85;
    const FLIPPER_POWER = 22;
    const LAUNCH_POWER = -750;

    // Table layout
    const T = {
        width: canvas.width,
        height: canvas.height,
        // Playfield bounds
        left: 60,
        right: canvas.width - 60,
        top: 60,
        bottom: canvas.height - 100,
        // Flipper positions
        flipperY: canvas.height - 120,
        leftFlipperX: 140,
        rightFlipperX: canvas.width - 140,
    };

    let score = 0;
    let balls = 0;
    let popups = [];

    // Ball object
    const ball = {
        x: canvas.width / 2,
        y: canvas.height - 200,
        vx: 0,
        vy: 0,
        active: false
    };

    // Flippers
    const flippers = [
        {
            x: T.leftFlipperX,
            y: T.flipperY,
            angle: -0.3,
            targetAngle: -0.3,
            length: 70,
            width: 14,
            active: false
        },
        {
            x: T.rightFlipperX,
            y: T.flipperY,
            angle: 0.3,
            targetAngle: 0.3,
            length: 70,
            width: 14,
            active: false
        }
    ];

    // Bumpers
    const bumpers = [
        { x: canvas.width * 0.3, y: canvas.height * 0.4, r: 24, color: '#f00', flash: 0 },
        { x: canvas.width * 0.7, y: canvas.height * 0.4, r: 24, color: '#0f0', flash: 0 },
        { x: canvas.width * 0.5, y: canvas.height * 0.55, r: 24, color: '#00f', flash: 0 },
        { x: canvas.width * 0.2, y: canvas.height * 0.6, r: 18, color: '#f00', flash: 0 },
        { x: canvas.width * 0.8, y: canvas.height * 0.6, r: 18, color: '#0f0', flash: 0 },
    ];

    // Spinner
    const spinner = {
        x: canvas.width * 0.5,
        y: canvas.height * 0.3,
        angle: 0,
        active: false,
        cooldown: 0
    };

    // Ramps (simple rectangles for collision)
    const ramps = [
        { x: canvas.width * 0.15, y: canvas.height * 0.35, w: 60, h: 10 },
        { x: canvas.width * 0.79, y: canvas.height * 0.35, w: 60, h: 10 }
    ];

    // Slingshots
    const slingshots = [
        { x: canvas.width * 0.08, y: canvas.height * 0.7, w: 40, h: 50, flipped: false },
        { x: canvas.width * 0.92, y: canvas.height * 0.7, w: 40, h: 50, flipped: true }
    ];

    function launchBall() {
        ball.x = canvas.width / 2;
        ball.y = T.bottom - 100;
        ball.vx = (Math.random() - 0.5) * 200;
        ball.vy = LAUNCH_POWER / 15;
        ball.active = true;
        balls++;
    }

    function resetBall() {
        ball.active = false;
        setTimeout(launchBall, 1500);
    }

    function distanceToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const length = Math.sqrt(dx * dx + dy * dy);
        if (length === 0) return { dist: Infinity, nx: 0, ny: 0 };
        const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (length * length)));
        const closestX = x1 + t * dx;
        const closestY = y1 + t * dy;
        const distX = px - closestX;
        const distY = py - closestY;
        const dist = Math.sqrt(distX * distX + distY * distY);
        return { dist, nx: distX / dist, ny: distY / dist, cx: closestX, cy: closestY };
    }

    function updateFlippers() {
        const decision = Math.random();
        // Left flipper reacts to ball on left side
        if (ball.x < canvas.width / 2 && ball.y > T.flipperY - 40 && ball.active) {
            flippers[0].active = decision > 0.15;
        } else {
            flippers[0].active = decision < 0.05; // occasional twitch
        }

        if (ball.x > canvas.width / 2 && ball.y > T.flipperY - 40 && ball.active) {
            flippers[1].active = decision > 0.15;
        } else {
            flippers[1].active = decision < 0.05;
        }

        flippers.forEach(f => {
            f.targetAngle = f.active ?
                (f.x < canvas.width / 2 ? -0.7 : 0.7) :
                (f.x < canvas.width / 2 ? -0.3 : 0.3);
            f.angle += (f.targetAngle - f.angle) * 0.3;
        });
    }

    function applyFlipperImpulse() {
        if (!ball.active) return;

        flippers.forEach(f => {
            const cos = Math.cos(f.angle);
            const sin = Math.sin(f.angle);
            const x1 = f.x - cos * f.length / 2;
            const y1 = f.y - sin * f.length / 2;
            const x2 = f.x + cos * f.length / 2;
            const y2 = f.y + sin * f.length / 2;

            // Perpendicular for width
            const px = -sin * f.width / 2;
            const py = cos * f.width / 2;

            const x1a = x1 + px, y1a = y1 + py;
            const x2a = x2 + px, y2a = y2 + py;
            const x1b = x1 - px, y1b = y1 - py;
            const x2b = x2 - px, y2b = y2 - py;

            // Check both edges of flipper
            const seg1 = distanceToSegment(ball.x, ball.y, x1a, y1a, x2a, y2a);
            const seg2 = distanceToSegment(ball.x, ball.y, x1b, y1b, x2b, y2b);
            const seg3 = distanceToSegment(ball.x, ball.y, x1, y1, x2, y2);

            const closest = [seg1, seg2, seg3].reduce((a, b) => a.dist < b.dist ? a : b);

            if (closest.dist < BALL_RADIUS && f.active) {
                const nx = closest.nx;
                const ny = closest.ny;
                const d = closest.dist;

                // Push ball out
                ball.x += nx * (BALL_RADIUS - d);
                ball.y += ny * (BALL_RADIUS - d);

                // Reflect velocity
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) {
                    ball.vx -= (1 + RESTITUTION) * dot * nx;
                    ball.vy -= (1 + RESTITUTION) * dot * ny;
                }

                // Add flipper impulse
                ball.vx += nx * FLIPPER_POWER * (f.active ? 1 : 0.5);
                ball.vy += ny * FLIPPER_POWER * (f.active ? 1 : 0.5);
            }
        });
    }

    function updateBall() {
        if (!ball.active) return;

        ball.vy += GRAVITY;
        ball.vx *= DRAG;
        ball.vy *= DRAG;

        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions
        if (ball.x < T.left + BALL_RADIUS) {
            ball.x = T.left + BALL_RADIUS;
            ball.vx *= -RESTITUTION;
        }
        if (ball.x > T.right - BALL_RADIUS) {
            ball.x = T.right - BALL_RADIUS;
            ball.vx *= -RESTITUTION;
        }
        if (ball.y < T.top + BALL_RADIUS) {
            ball.y = T.top + BALL_RADIUS;
            ball.vy *= -RESTITUTION;
        }

        // Drain
        if (ball.y > T.bottom + 40) {
            if (ball.x > T.leftFlipperX - 50 && ball.x < T.leftFlipperX + 50) {
                // Left flipper saves
                ball.y = T.flipperY;
                ball.vy = -500;
            } else if (ball.x > T.rightFlipperX - 50 && ball.x < T.rightFlipperX + 50) {
                ball.y = T.flipperY;
                ball.vy = -500;
            } else {
                resetBall();
            }
        }

        // Bumpers
        bumpers.forEach(b => {
            const dx = ball.x - b.x;
            const dy = ball.y - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < b.r + BALL_RADIUS) {
                const nx = dx / dist;
                const ny = dy / dist;
                const overlap = b.r + BALL_RADIUS - dist;
                ball.x += nx * overlap;
                ball.y += ny * overlap;
                const dot = ball.vx * nx + ball.vy * ny;
                if (dot < 0) {
                    ball.vx -= (1 + RESTITUTION) * dot * nx;
                    ball.vy -= (1 + RESTITUTION) * dot * ny;
                }
                b.flash = 0.5;
                score += 50;
                popups.push({ x: b.x, y: b.y, text: "+50", life: 1.0 });
            }
        });

        // Spinner
        if (spinner.cooldown > 0) spinner.cooldown -= 1 / 60;
        const sdx = ball.x - spinner.x;
        const sdy = ball.y - spinner.y;
        const sdist = Math.sqrt(sdx * sdx + sdy * sdy);
        if (sdist < 30 + BALL_RADIUS && spinner.cooldown <= 0) {
            spinner.active = true;
            spinner.cooldown = 0.3;
            spinner.angle += 0.5;
            score += 100;
            popups.push({ x: spinner.x, y: spinner.y, text: "+100", life: 1.0 });
        }
        if (spinner.active) spinner.active = false;

        // Ramps
        ramps.forEach(r => {
            if (ball.x > r.x && ball.x < r.x + r.w &&
                ball.y > r.y && ball.y < r.y + r.h + BALL_RADIUS) {
                ball.y = r.y;
                ball.vy = -600;
                score += 200;
                popups.push({ x: r.x + r.w / 2, y: r.y, text: "+200", life: 1.0 });
            }
        });

        // Slingshots
        slingshots.forEach(s => {
            if (ball.x > s.x && ball.x < s.x + s.w &&
                ball.y > s.y && ball.y < s.y + s.h) {
                const dir = s.flipped ? -1 : 1;
                ball.vx += 500 * dir;
                ball.vy -= 400;
                score += 30;
                popups.push({ x: s.x + s.w / 2, y: s.y + s.h / 2, text: "+30", life: 0.8 });
                s.active = true;
            }
        });

        // Top bumper zone bounce
        if (ball.y < T.top + 20 && ball.vy < 0) {
            ball.vy *= -0.5;
        }
    }

    function update() {
        updateFlippers();
        updateBall();
        applyFlipperImpulse();

        bumpers.forEach(b => b.flash = Math.max(0, b.flash - 0.02));

        // Update popups
        popups.forEach(p => p.life -= 1 / 60);
        popups = popups.filter(p => p.life > 0);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw playfield border
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(T.left, T.top, T.right - T.left, T.bottom - T.top);
        ctx.setLineDash([]);

        // Draw bumpers
        bumpers.forEach(b => {
            const intensity = 0.5 + b.flash * 0.5;
            ctx.fillStyle = b.color;
            ctx.globalAlpha = intensity;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.stroke();
        });

        // Draw spinner
        ctx.save();
        ctx.translate(spinner.x, spinner.y);
        ctx.rotate(spinner.angle);
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.moveTo(0, -35);
        ctx.lineTo(0, 35);
        ctx.lineTo(8, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // Draw ramps
        ctx.fillStyle = '#0aa';
        ctx.globalAlpha = 0.6;
        ramps.forEach(r => {
            ctx.fillRect(r.x, r.y, r.w, r.h);
        });
        ctx.globalAlpha = 1;

        // Draw slingshots
        ctx.fillStyle = '#a00';
        ctx.globalAlpha = 0.8;
        slingshots.forEach(s => {
            ctx.fillRect(s.x, s.y, s.w, s.h);
        });
        ctx.globalAlpha = 1;

        // Draw flippers
        ctx.fillStyle = '#f88';
        flippers.forEach(f => {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.angle);
            ctx.fillRect(-f.length / 2, -f.width / 2, f.length, f.width);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(-f.length / 2, -f.width / 2, f.length, f.width);
            ctx.restore();
        });

        // Draw ball
        if (ball.active) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Draw popups
        ctx.fillStyle = '#0ff';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        popups.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillText(p.text, p.x, p.y);
        });
        ctx.globalAlpha = 1;

        // Draw score
        ctx.fillStyle = '#0ff';
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCORE: ' + score, 20, 40);
        ctx.font = 'bold 20px monospace';
        ctx.fillText('BALL: ' + (ball.active ? balls : balls + 1), 20, 75);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    launchBall();
    loop();
})();
</script>
</body>
</html>
