<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Farm Dawn</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000}body{display:flex;justify-content:center;align-items:center;height:100vh}canvas{width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;});

// Time
let startTime = null;

// Wind model parameters
const wind = {
    baseSpeed: 4,
    gustStrength: 6,
    gustFrequency: 0.08,
    gustOffset: 0,
    turbulence: 0.3,
    direction: Math.PI / 9, // radians off east
    directionVariation: 0.02
};

// Terrain
const terrainHeight = h * 0.3;
const hillWaveLength = w * 0.7;
const hillAmplitude = h * 0.06;

// Turbines - positioned across the landscape
const numTurbines = 12;
const turbines = [];
for(let i = 0; i < numTurbines; i++) {
    const t = i / (numTurbines - 1);
    turbines.push({
        x: w * 0.1 + t * (w * 0.8),
        y: 0, // will be set based on terrain
        height: 120 + Math.random() * 80,
        bladeLength: 40 + Math.random() * 20,
        baseBladeSpeed: 0.5,
        bladeRotation: 0,
        windResponse: Math.random() * 0.5 + 0.5
    });
}

// Update turbine positions based on terrain
function updateTurbinePositions() {
    for(const t of turbines) {
        t.y = terrainHeight + hillAmplitude * Math.cos((t.x / hillWaveLength) * Math.PI * 2);
    }
}

// Wheat field waves
const wheat = {
    waveLength: 40,
    waveAmplitude: 25,
    waveSpeed: 2,
    wavePhase: 0,
    density: 4
};

// Clouds
const numClouds = 6;
const clouds = [];
for(let i = 0; i < numClouds; i++) {
    clouds.push({
        x: Math.random() * w * 1.5 - w * 0.25,
        y: h * 0.15 + Math.random() * h * 0.2,
        size: 80 + Math.random() * 120,
        speed: 5 + Math.random() * 15,
        shape: []
    });
    // Generate cloud shapes
    const puffs = 5 + Math.floor(Math.random() * 3);
    for(let j = 0; j < puffs; j++) {
        clouds[i].shape.push({
            x: (Math.random() - 0.5) * 0.8,
            y: (Math.random() - 0.5) * 0.4,
            r: 0.3 + Math.random() * 0.4
        });
    }
}

// Truck
const truck = {
    x: -100,
    y: 0,
    speed: 30,
    active: false,
    lastSpawn: 0,
    spawnInterval: 30 // seconds between possible spawns
};

// Dust particles
const dust = [];
for(let i = 0; i < 100; i++) {
    dust.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, size: 0 });
}

// Animation loop
function animate(timestamp) {
    if(!startTime) startTime = timestamp;
    const time = (timestamp - startTime) / 1000;
    
    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    
    // Update wind model
    wind.gustOffset += 0.05;
    const windSpeed = wind.baseSpeed + 
        Math.sin(time * wind.gustFrequency + wind.gustOffset) * wind.gustStrength +
        Math.sin(time * 0.03) * wind.turbulence;
    
    // Sun position (90 second cycle = 15 seconds for quarter cycle)
    const sunCycle = (time % 90) / 90;
    const sunAngle = sunCycle * Math.PI * 2 - Math.PI / 2; // Start below horizon
    const sunX = w * 0.5 + Math.cos(sunAngle) * w * 0.6;
    const sunY = terrainHeight + Math.sin(sunAngle) * h * 0.7;
    const sunElevation = Math.sin(sunAngle);
    const isDay = sunElevation > -0.1;
    
    // Sky color based on time
    const dayProgress = Math.max(0, Math.min(1, (sunElevation + 0.2) / 1.2));
    const skyColor = lerpColor('#0a192f', '#87CEEB', dayProgress);
    ctx.fillStyle = skyColor;
    ctx.fillRect(0, 0, w, h);
    
    // Draw sun
    if(sunElevation > -0.3) {
        const sunRadius = 20 + 30 * dayProgress;
        const gradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius * 2);
        gradient.addColorStop(0, '#FFD700');
        gradient.addColorStop(0.5, '#FFA500');
        gradient.addColorStop(1, 'rgba(255, 165, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Draw clouds
    for(const cloud of clouds) {
        cloud.x += cloud.speed * (0.5 + windSpeed * 0.1) * (isDay ? 1 : 0.5);
        if(cloud.x > w + cloud.size) cloud.x = -cloud.size * 2;
        if(cloud.x < -cloud.size * 2) cloud.x = w + cloud.size;
        
        drawCloud(cloud, dayProgress);
    }
    
    // Update wheat waves
    wheat.wavePhase += windSpeed * 0.02;
    
    // Draw terrain/hill
    drawTerrain(windSpeed, sunX, sunY, sunElevation);
    
    // Draw wheat field
    drawWheatField(windSpeed);
    
    // Update and draw turbines
    for(const turbine of turbines) {
        const effectiveWind = windSpeed * turbine.windResponse;
        turbine.bladeRotation += effectiveWind * 0.02;
        
        // Determine if it's dusk for warning lights
        const isDusk = sunElevation < 0.2 && sunElevation > -0.1;
        
        drawTurbine(turbine, isDusk);
    }
    
    // Draw truck
    updateTruck(time, windSpeed);
    drawTruck(windSpeed);
    
    // Draw dust
    updateDust(windSpeed);
    drawDust();
    
    requestAnimationFrame(animate);
}

function drawTerrain(windSpeed, sunX, sunY, sunElevation) {
    ctx.beginPath();
    ctx.moveTo(0, h);
    
    // Hill profile
    for(let x = 0; x <= w; x += 10) {
        const hillFactor = hillAmplitude * Math.cos((x / hillWaveLength) * Math.PI * 2);
        const y = terrainHeight + hillFactor + Math.sin(x * 0.02 + windSpeed * 0.5) * 3;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h);
    
    // Terrain color based on lighting
    const lightDir = { x: sunX - w * 0.5, y: sunY - terrainHeight };
    const lightLen = Math.sqrt(lightDir.x ** 2 + lightDir.y ** 2) || 1;
    const lightNorm = { x: lightDir.x / lightLen, y: lightDir.y / lightLen };
    
    const baseGreen = [34, 139, 34];
    const shadowAmount = Math.max(0, -lightNorm.y) * 0.5;
    const lightAmount = Math.max(0, lightNorm.y) * 0.3;
    
    ctx.fillStyle = `rgb(${Math.floor(baseGreen[0] * (1 - shadowAmount + lightAmount))}, 
                        ${Math.floor(baseGreen[1] * (1 - shadowAmount * 0.5 + lightAmount * 0.3))} , 
                        ${Math.floor(baseGreen[2] * (1 - shadowAmount * 0.7))})`;
    ctx.fill();
    
    // Terrain edge
    ctx.strokeStyle = '#228B22';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawWheatField(windSpeed) {
    const wheatYStart = terrainHeight + hillAmplitude * 2;
    const wheatYEnd = h;
    
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    
    for(let x = 0; x < w; x += wheat.density) {
        const hillFactor = hillAmplitude * Math.cos((x / hillWaveLength) * Math.PI * 2);
        const baseY = terrainHeight + hillFactor + hillAmplitude;
        
        if(baseY > wheatYStart) {
            // Wheat stalk wave effect
            const wave = Math.sin((x * 0.1) + wheat.wavePhase) * wheat.waveAmplitude * (windSpeed / 10);
            const tilt = wave / 20;
            
            ctx.save();
            ctx.translate(x, baseY);
            ctx.rotate(tilt);
            
            // Draw wheat stalk
            const grassHeight = 15 + Math.sin(x * 0.05) * 3;
            ctx.strokeStyle = '#90EE90';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(wheat.waveAmplitude * 0.1 + tilt * 10, -grassHeight);
            ctx.stroke();
            
            // Wheat head
            ctx.fillStyle = '#FFFACD';
            ctx.beginPath();
            ctx.ellipse(wheat.waveAmplitude * 0.1 + tilt * 10, -grassHeight - 2, 3, 1.5, tilt, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // Traveling wave visualization
            if(Math.abs(wave) > wheat.waveAmplitude * 0.8) {
                ctx.fillStyle = 'rgba(255, 255, 200, 0.2)';
                ctx.fillRect(x - 0.5, baseY + 5, 1, 2);
            }
        }
    }
    
    ctx.restore();
}

function drawTurbine(turbine, isDusk) {
    const bladeRot = turbine.bladeRotation;
    const baseX = turbine.x;
    const baseY = turbine.y;
    
    ctx.save();
    
    // Turbine tower
    const towerHeight = turbine.height;
    const towerWidth = 4;
    
    // Tower shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(baseX - towerWidth/2 + 3, baseY + 2, towerWidth, towerHeight);
    
    // Tower
    const towerGradient = ctx.createLinearGradient(baseX - towerWidth/2, baseY, baseX + towerWidth/2, baseY);
    towerGradient.addColorStop(0, '#555');
    towerGradient.addColorStop(0.5, '#888');
    towerGradient.addColorStop(1, '#555');
    ctx.fillStyle = towerGradient;
    ctx.fillRect(baseX - towerWidth/2, baseY, towerWidth, towerHeight);
    
    // Nacelle
    const nacelleX = baseX;
    const nacelleY = baseY - towerHeight;
    const nacelleWidth = 20;
    const nacelleHeight = 12;
    
    ctx.fillStyle = '#4a90a4';
    ctx.fillRect(nacelleX - nacelleWidth/2, nacelleY - nacelleHeight/2, nacelleWidth, nacelleHeight);
    
    // Rotor hub
    const hubX = nacelleX;
    const hubY = nacelleY;
    const bladeLen = turbine.bladeLength;
    
    // Blades
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    
    for(let i = 0; i < 3; i++) {
        const angle = bladeRot + i * (Math.PI * 2 / 3);
        const endX = hubX + Math.cos(angle) * bladeLen;
        const endY = hubY + Math.sin(angle) * bladeLen;
        
        // Blade
        ctx.fillStyle = '#444';
        ctx.beginPath();
        ctx.moveTo(hubX, hubY);
        ctx.quadraticCurveTo(
            hubX + Math.cos(angle) * bladeLen * 0.3, 
            hubY + Math.sin(angle) * bladeLen * 0.3 + 2,
            endX, endY
        );
        ctx.lineTo(hubX, hubY);
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(hubX, hubY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
    }
    
    // Hub
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(hubX, hubY, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Aircraft warning light (blinks at dusk/dawn/night)
    if(isDusk) {
        const blinkPhase = (Date.now() / 1000) % 2;
        const isLit = blinkPhase < 1;
        if(isLit) {
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(hubX, hubY - nacelleHeight/2, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Glow
            const gradient = ctx.createRadialGradient(hubX, hubY - nacelleHeight/2, 0, hubX, hubY - nacelleHeight/2, 8);
            gradient.addColorStop(0, 'rgba(255, 0, 0, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(hubX, hubY - nacelleHeight/2, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    ctx.restore();
}

function updateTruck(time, windSpeed) {
    if(!truck.active && time - truck.lastSpawn > truck.spawnInterval + Math.random() * 10) {
        if(Math.random() < 0.3) {
            truck.active = true;
            truck.x = -100;
            truck.lastSpawn = time;
        }
    }
    
    if(truck.active) {
        truck.x += truck.speed + windSpeed * 0.3;
        if(truck.x > w + 100) {
            truck.active = false;
        }
    }
}

function drawTruck(windSpeed) {
    if(!truck.active) return;
    
    // Find terrain height at truck position
    const truckY = terrainHeight + hillAmplitude * Math.cos((truck.x / hillWaveLength) * Math.PI * 2);
    truck.y = truckY + 5;
    
    ctx.save();
    
    // Truck body
    ctx.fillStyle = '#cc3333';
    ctx.fillRect(truck.x, truck.y, 40, 15);
    ctx.fillRect(truck.x + 10, truck.y - 10, 25, 10);
    
    // Wheels
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(truck.x + 8, truck.y + 15, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(truck.x + 32, truck.y + 15, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Dust trail
    for(let i = 0; i < 5; i++) {
        if(Math.random() < 0.3) {
            dust.push({
                x: truck.x - i * 10,
                y: truck.y + 15,
                vx: -(windSpeed * 0.5 + Math.random() * 2),
                vy: Math.random() * 2 - 1,
                life: 30,
                size: 2 + Math.random() * 3
            });
        }
    }
    
    ctx.restore();
}

function updateDust(windSpeed) {
    for(let i = dust.length - 1; i >= 0; i--) {
        const p = dust[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx -= windSpeed * 0.02;
        p.life--;
        
        if(p.life <= 0 || p.x < 0 || p.y > h) {
            dust.splice(i, 1);
        }
    }
}

function drawDust() {
    ctx.fillStyle = '#A0522D';
    for(const p of dust) {
        const alpha = Math.max(0, p.life / 30);
        ctx.globalAlpha = alpha * 0.7;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawCloud(cloud, dayProgress) {
    const alpha = Math.min(1, dayProgress * 1.5) * 0.8;
    ctx.save();
    ctx.globalAlpha = alpha;
    
    const cloudGradient = ctx.createRadialGradient(
        cloud.x, cloud.y, 0,
        cloud.x, cloud.y, cloud.size
    );
    cloudGradient.addColorStop(0, '#FFFFFF');
    cloudGradient.addColorStop(1, '#FFFFFF');
    
    ctx.fillStyle = cloudGradient;
    
    // Draw puffs
    for(const puff of cloud.shape) {
        const px = cloud.x + puff.x * cloud.size;
        const py = cloud.y + puff.y * cloud.size;
        const pr = puff.r * cloud.size;
        
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
}

function lerpColor(a, b, t) {
    const ah = parseInt(a.slice(1), 16);
    const bh = parseInt(b.slice(1), 16);
    const ar = ah >> 16, ag = (ah >> 8) & 0xFF, ab = ah & 0xFF;
    const br = bh >> 16, bg = (bh >> 8) & 0xFF, bb = bh & 0xFF;
    const rr = Math.round(ar + (br - ar) * t);
    const gg = Math.round(ag + (bg - ag) * t);
    const bb2 = Math.round(ab + (bb - ab) * t);
    return `rgb(${rr}, ${gg}, ${bb2})`;
}

// Initialize
updateTurbinePositions();
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
