<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghostly Explosions</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body { background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height, particles = [], fogParticles = [];
    const maxFog = 300;

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        window.addEventListener('resize', init);
        requestAnimationFrame(animate);
    }

    function createExplosion(x, y) {
        const count = 80 + Math.random() * 40;
        const hue = Math.random() > 0.9 ? 30 + Math.random() * 30 : 180 + Math.random() * 60;
        
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 1.5 + 0.5;
            const life = 100 + Math.random() * 60;
            
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed + (Math.random() - 0.5) * 0.3,
                vy: Math.sin(angle) * speed + (Math.random() - 0.5) * 0.3,
                ax: 0,
                ay: 0,
                size: Math.random() * 3 + 1,
                life: life,
                maxLife: life,
                hue: hue,
                turbulence: Math.random() * 0.02 + 0.01,
                time: 0
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.time++;
            
            if (p.time > p.life) {
                // Create fog particle when wisp fades
                if (fogParticles.length < maxFog) {
                    fogParticles.push({
                        x: p.x,
                        y: p.y,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        life: 200 + Math.random() * 100,
                        maxLife: 300,
                        size: p.size * 0.6
                    });
                }
                particles.splice(i, 1);
                continue;
            }
            
            // Curl-like motion using Perlin noise simulation
            const noiseX = Math.sin(p.time * 0.1 + p.y * 0.02) * p.turbulence;
            const noiseY = Math.cos(p.time * 0.1 + p.x * 0.02) * p.turbulence;
            
            p.vx += noiseX;
            p.vy += noiseY;
            
            // Dampen velocity over time
            p.vx *= 0.97;
            p.vy *= 0.97;
            
            p.x += p.vx;
            p.y += p.vy;
        }
    }

    function updateFog() {
        for (let i = fogParticles.length - 1; i >= 0; i--) {
            const f = fogParticles[i];
            f.life--;
            
            if (f.life <= 0) {
                fogParticles.splice(i, 1);
                continue;
            }
            
            f.x += f.vx;
            f.y += f.vy;
        }
    }

    function animate() {
        // Create fading trail effect
        ctx.fillStyle = 'rgba(0, 0, 20, 0.12)';
        ctx.fillRect(0, 0, width, height);
        
        updateParticles();
        updateFog();
        
        // Draw fog layer first (background)
        for (const f of fogParticles) {
            const alpha = Math.max(0, f.life / f.maxLife) * 0.25;
            const size = f.size;
            
            const grad = ctx.createRadialGradient(
                f.x, f.y, 0,
                f.x, f.y, size * 3
            );
            grad.addColorStop(0, `rgba(20, 40, 80, ${alpha})`);
            grad.addColorStop(1, 'rgba(0, 20, 40, 0)');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(f.x, f.y, size * 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Draw particles (foreground)
        for (const p of particles) {
            const alpha = Math.max(0, p.life - p.time) / p.maxLife;
            const size = p.size + Math.sin(p.time * 0.1) * 0.5;
            
            const coreGrad = ctx.createRadialGradient(
                p.x, p.y, 0,
                p.x, p.y, size * 2
            );
            
            coreGrad.addColorStop(0, `hsla(${p.hue}, 80%, 70%, ${alpha * 0.8})`);
            coreGrad.addColorStop(0.5, `hsla(${p.hue}, 70%, 50%, ${alpha * 0.4})`);
            coreGrad.addColorStop(1, `hsla(${p.hue}, 60%, 30%, 0)`);
            
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Glow
            ctx.shadowBlur = 10;
            ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, ${alpha * 0.3})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        requestAnimationFrame(animate);
    }

    // Initialize and start
    init();
    
    // Auto-create periodic explosions
    setInterval(() => {
        const x = Math.random() * width;
        const y = Math.random() * (height * 0.7);
        createExplosion(x, y);
    }, 800);

    // Click/tap to create explosion
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        createExplosion(x, y);
    });
})();
</script>
</body>
</html>
