<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Generating Dungeon</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            /* Ensure crisp pixel art look if we wanted, but we want smooth circles */
        }
    </style>
</head>
<body>
    <canvas id="dungeon"></canvas>
    <script>
        // --- Configuration ---
        const TILE_SIZE = 20;
        const COLS = 40;
        const ROWS = 25;
        const TICK_RATE = 30; // ms per generation step
        const EXPLORE_SPEED = 5; // ticks between explorer moves
        
        // --- Setup ---
        const canvas = document.getElementById('dungeon');
        const ctx = canvas.getContext('2d');
        
        canvas.width = COLS * TILE_SIZE;
        canvas.height = ROWS * TILE_SIZE;

        // --- State ---
        let map = [];
        let flickerOffsets = [];
        let explorer = { x: 0, y: 0, targetX: 0, targetY: 0, visited: new Set() };
        let generationQueue = [];
        let isTransitioning = false;
        let transitionAlpha = 0;
        let direction = 1; // 1 for fade out, -1 for fade in

        // --- Utilities ---
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getDistance(x1, y1, x2, y2) {
            return Math.abs(x1 - x2) + Math.abs(y1 - y2);
        }

        // --- Map Generation ---
        function initMap() {
            map = [];
            flickerOffsets = [];
            for (let y = 0; y < ROWS; y++) {
                let row = [];
                let flickers = [];
                for (let x = 0; x < COLS; x++) {
                    row.push({ type: 0, lit: false, lightRadius: 0 }); // 0 = wall, 1 = floor
                    flickers.push(0);
                }
                map.push(row);
                flickerOffsets.push(flickers);
            }
            
            // Generate initial room
            generateRooms();
            
            // Reset Explorer
            explorer.x = COLS / 2;
            explorer.y = ROWS / 2;
            explorer.visited.clear();
            explorer.visited.add(`${explorer.x},${explorer.y}`);
            pickNewTarget();
            
            // Start Queue
            generationQueue = [];
        }

        function generateRooms() {
            // 1. Carve main room
            const rw = randInt(4, 7);
            const rh = randInt(4, 7);
            const rx = randInt(2, COLS - 2 - rw);
            const ry = randInt(2, ROWS - 2 - rh);

            for (let y = ry; y < ry + rh; y++) {
                for (let x = rx; x < rx + rw; x++) {
                    map[y][x].type = 1;
                }
            }

            // Add to queue for lighting up
            // We add tiles to a queue to be "lit" procedurally
            for (let y = ry; y < ry + rh; y++) {
                for (let x = rx; x < rx + rw; x++) {
                    generationQueue.push({ x, y, type: 'carve', delay: 0 });
                }
            }

            // 2. Create Hallways to existing floors (or just edges if empty)
            const floors = [];
            for(let y=0; y<ROWS; y++) {
                for(let x=0; x<COLS; x++) {
                    if(map[y][x].type === 1) floors.push({x, y});
                }
            }

            // Connect new room to random existing floor
            if (floors.length > 0) {
                const target = floors[randInt(0, floors.length - 1)];
                const start = { x: rx + Math.floor(rw/2), y: ry + Math.floor(rh/2) };
                
                let cx = start.x;
                let cy = start.y;

                while (cx !== target.x || cy !== target.y) {
                    if (cx < target.x) cx++;
                    else if (cx > target.x) cx--;
                    else if (cy < target.y) cy++;
                    else if (cy > target.y) cy--;

                    if (cy >= 0 && cy < ROWS && cx >= 0 && cx < COLS) {
                        map[cy][cx].type = 1;
                        generationQueue.push({ x: cx, y: cy, type: 'carve', delay: 0 });
                    }
                }
            }
        }

        function updateGeneration() {
            if (generationQueue.length === 0) return;

            // Process a chunk of the queue
            const chunkSize = 5; 
            for (let i = 0; i < chunkSize; i++) {
                if (generationQueue.length === 0) break;
                const item = generationQueue.shift();
                map[item.y][item.x].type = 1; // Carve
            }

            // Check if we should add a new room
            const totalFloors = map.flat().filter(c => c.type === 1).length;
            if (totalFloors > (COLS * ROWS) * 0.85) {
                // Map is mostly full, trigger transition
                isTransitioning = true;
                transitionAlpha = 0;
                direction = 1; // Fade out
            } else if (generationQueue.length === 0) {
                // Carve done, spawn a new room
                generateRooms();
            }
        }

        // --- Lighting System ---
        function updateLighting() {
            // Spread light from "active" tiles to neighbors
            // This creates a cascading torch light effect
            
            // We process every 2nd tile or so to simulate slow spread
            if (Math.random() > 0.5) return; 

            const changed = [];

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const tile = map[y][x];
                    
                    // If tile is already fully lit, it acts as a source
                    if (tile.lit && tile.lightRadius > 0) {
                        const neighbors = [
                            {x: x+1, y: y}, {x: x-1, y: y},
                            {x: x, y: y+1}, {x: x, y: y-1}
                        ];
                        
                        for (let n of neighbors) {
                            if (n.x >= 0 && n.x < COLS && n.y >= 0 && n.y < ROWS) {
                                if (map[n.y][n.x].type === 1 && !map[n.y][n.x].lit) {
                                    // Chance to ignite
                                    if (Math.random() < 0.1) {
                                        map[n.y][n.x].lit = true;
                                        changed.push(n);
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // If we found new lit tiles, update their flicker
            changed.forEach(pos => {
                flickerOffsets[pos.y][pos.x] = Math.random() * 100;
            });

            // Update existing flickers
            for(let y=0; y<ROWS; y++) {
                for(let x=0; x<COLS; x++) {
                    if(flickerOffsets[y][x] > 0) {
                        flickerOffsets[y][x] -= 0.5;
                        if(flickerOffsets[y][x] < 0) flickerOffsets[y][x] = 0;
                    }
                }
            }
        }

        // --- Explorer Logic ---
        function updateExplorer() {
            // Only move occasionally
            if (Math.random() * EXPLORE_SPEED > 1) return;

            // Find valid neighbors (unvisited preferred)
            const neighbors = [
                {x: explorer.x+1, y: explorer.y}, {x: explorer.x-1, y: explorer.y},
                {x: explorer.x, y: explorer.y+1}, {x: explorer.x, y: explorer.y-1}
            ];

            const validNeighbors = neighbors.filter(n => 
                n.x >= 0 && n.x < COLS && n.y >= 0 && n.y < ROWS && 
                map[n.y][n.x].type === 1
            );

            if (validNeighbors.length === 0) return;

            // Separate visited and unvisited
            const unvisited = validNeighbors.filter(n => !explorer.visited.has(`${n.x},${n.y}`));
            const candidates = unvisited.length > 0 ? unvisited : validNeighbors;

            // Randomly pick a target from candidates
            const target = candidates[randInt(0, candidates.length - 1)];
            
            // Move
            explorer.x = target.x;
            explorer.y = target.y;
            explorer.visited.add(`${explorer.x},${explorer.y}`);
        }

        // --- Rendering ---
        function draw() {
            // Clear
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Map
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const tile = map[y][x];
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    if (tile.type === 1) {
                        // Draw Floor
                        ctx.fillStyle = '#2a2a2a';
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        
                        // Draw Wall Border (subtle)
                        ctx.strokeStyle = '#1a1a1a';
                        ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

                        // Draw Torch/Fog
                        if (tile.lit) {
                            // Calculate distance from explorer for proximity lighting
                            const dist = getDistance(explorer.x, explorer.y, x, y);
                            let alpha = 0.6; // Base torch glow
                            
                            // Add flicker
                            const f = flickerOffsets[y][x];
                            if (f > 0) {
                                alpha += (Math.random() * 0.1 - 0.05) * f; 
                            }

                            // Create glow gradient
                            const centerX = px + TILE_SIZE/2;
                            const centerY = py + TILE_SIZE/2;
                            const radius = TILE_SIZE * 2.5; // Light range

                            const gradient = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, radius);
                            
                            // Color stops: Warm Orange -> Transparent
                            gradient.addColorStop(0, `rgba(255, 160, 50, ${alpha})`);
                            gradient.addColorStop(0.4, `rgba(255, 100, 20, ${alpha * 0.4})`);
                            gradient.addColorStop(1, 'rgba(255, 100, 20, 0)');

                            ctx.fillStyle = gradient;
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Torch core dot
                            ctx.fillStyle = '#ffccaa';
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, 2, 0, Math.PI*2);
                            ctx.fill();
                        } else {
                            // Unlit corridor (dark stone)
                            ctx.fillStyle = '#111';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        }
                    } else {
                        // Wall
                        ctx.fillStyle = '#080808';
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // Draw Explorer
            const ePx = explorer.x * TILE_SIZE + TILE_SIZE/2;
            const ePy = explorer.y * TILE_SIZE + TILE_SIZE/2;
            
            ctx.fillStyle = '#00ffff'; // Cyan dot
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';
            ctx.beginPath();
            ctx.arc(ePx, ePy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Transition Overlay
            if (isTransitioning) {
                transitionAlpha += 0.02 * direction;
                if (direction === 1 && transitionAlpha >= 1) {
                    // Fade out complete, generate new map
                    initMap();
                    direction = -1; // Start fading back in
                    transitionAlpha = 1;
                } else if (direction === -1 && transitionAlpha <= 0) {
                    // Fade in complete
                    isTransitioning = false;
                    transitionAlpha = 0;
                }
                
                ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // --- Main Loop ---
        function loop() {
            if (!isTransitioning) {
                updateGeneration();
                updateLighting();
                updateExplorer();
            }
            draw();
            setTimeout(loop, TICK_RATE);
        }

        // Start
        initMap();
        loop();

    </script>
</body>
</html>
