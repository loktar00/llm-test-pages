<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Orbital Junk</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{w=canvas.width=innerWidth;h=canvas.height=innerHeight});

// Earth parameters
const earthRadius = 30;
const earthX = 80;
const earthY = 80;

// Physics
const G = 6.674e-11;
const EARTH_MASS = 5.972e24;
const TIME_SCALE = 200000;
let gravityOn = true;

// Orbital rings
const ringCount = 8;
const rings = [];
const satRadius = 2;
let debris = [];
let particles = [];
let cleanupDrone = null;
let lastCollision = 0;
let lastDroneSpawn = 0;

class Satellite {
  constructor(ring, angle) {
    this.ring = ring;
    this.orbitRadius = ring.orbitRadius;
    this.angle = angle;
    this.speed = Math.sqrt(G * EARTH_MASS / this.orbitRadius) * TIME_SCALE;
    this.size = 1.5 + Math.random() * 1.5;
    this.color = ring.color;
    this.trail = 0;
  }
  update(dt) {
    const dir = this.angle < Math.PI ? -1 : 1;
    this.angle += dir * (this.speed / this.orbitRadius) * dt * 0.001 * 0.3;
    if (this.angle > Math.PI * 2) this.angle -= Math.PI * 2;
    if (this.angle < 0) this.angle += Math.PI * 2;
    this.x = earthX + Math.cos(this.angle) * this.orbitRadius;
    this.y = earthY + Math.sin(this.angle) * this.orbitRadius;
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, vx, vy, size, color, life) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.size = size;
    this.color = color;
    this.life = life;
  }
  update(dt) {
    this.vx += (Math.random() - 0.5) * 0.2;
    this.vy += (Math.random() - 0.5) * 0.2;
    this.x += this.vx * dt * 0.06;
    this.y += this.vy * dt * 0.06;
    this.life -= dt * 0.001;
    this.size *= 0.96;
  }
  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Drone {
  constructor() {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.target = null;
  }
  update(dt) {
    if (!this.target || particles.length === 0) {
      let minDist = Infinity;
      for (const p of particles) {
        const d = Math.hypot(p.x - this.x, p.y - this.y);
        if (d < minDist && p.life > 0.1) { minDist = d; this.target = p; }
      }
    }
    if (this.target) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      this.vx += (dx / dist) * 0.02;
      this.vy += (dy / dist) * 0.02;
      const speed = Math.hypot(this.vx, this.vy);
      if (speed > 1.2) { this.vx *= 1.2 / speed; this.vy *= 1.2 / speed; }
      this.x += this.vx * dt * 0.06;
      this.y += this.vy * dt * 0.06;
      if (dist < 15) {
        this.target.life = 0;
        this.target = null;
      }
    } else {
      this.x += this.vx * dt * 0.06;
      this.y += this.vy * dt * 0.06;
    }
    if (this.x < -20 || this.x > w + 20 || this.y < -20 || this.y > h + 20) {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.vx = (Math.random() - 0.5) * 0.4;
      this.vy = (Math.random() - 0.5) * 0.4;
    }
  }
  draw(ctx) {
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.vx * 5, this.y + this.vy * 5);
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function init() {
  for (let i = 0; i < ringCount; i++) {
    rings.push({
      orbitRadius: 60 + i * 28,
      color: `hsl(${200 + i * 20}, 80%, 60%)`,
      satellites: []
    });
  }
  for (const ring of rings) {
    const count = 12 + ring.ringIndex * 8;
    for (let j = 0; j < count; j++) {
      const angle = (j / count) * Math.PI * 2;
      ring.satellites.push(new Satellite(ring, angle));
    }
  }
  for (let i = 0; i < 60; i++) {
    debris.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      size: Math.random() * 1.2 + 0.3,
      color: `hsl(${Math.random() * 40 + 20}, 80%, 60%)`
    });
  }
  cleanupDrone = new Drone();
}

function collide(dt) {
  const now = Date.now();
  if (now - lastCollision < 3000) return;
  if (debris.length < 5) return;
  // collide two random debris
  const a = debris[Math.floor(Math.random() * debris.length)];
  const b = debris[Math.floor(Math.random() * debris.length)];
  if (Math.hypot(a.x - b.x, a.y - b.y) < 30) {
    lastCollision = now;
    const midX = (a.x + b.x) / 2;
    const midY = (a.y + b.y) / 2;
    // remove originals
    debris = debris.filter(d => d !== a && d !== b);
    for (let i = 0; i < 25; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 1.5 + 0.5;
      particles.push(new Particle(
        midX, midY,
        Math.cos(angle) * speed, Math.sin(angle) * speed,
        Math.random() * 1.2 + 0.3,
        `hsl(${Math.random() * 40 + 20}, 80%, 60%)`,
        1.0
      ));
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, w, h);
  const dt = 16; // ~60fps
  
  // Draw orbit lines
  ctx.strokeStyle = 'rgba(100,200,255,0.1)';
  ctx.lineWidth = 0.6;
  for (const ring of rings) {
    ctx.beginPath();
    ctx.arc(earthX, earthY, ring.orbitRadius, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Earth
  ctx.fillStyle = '#1a7';
  ctx.beginPath();
  ctx.arc(earthX, earthY, earthRadius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3d9';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Update and draw satellites
  for (const ring of rings) {
    for (const sat of ring.satellites) {
      sat.update(dt);
      sat.draw(ctx);
    }
  }
  
  // Update and draw debris
  ctx.fillStyle = '#c87';
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.x += d.vx * dt * 0.06;
    d.y += d.vy * dt * 0.06;
    // wrap
    if (d.x < -5 || d.x > w + 5 || d.y < -5 || d.y > h + 5) {
      debris.splice(i, 1);
    }
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Update and draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update(dt);
    p.draw(ctx);
    if (p.life <= 0 || p.x < -10 || p.x > w + 10 || p.y < -10 || p.y > h + 10) {
      particles.splice(i, 1);
      // Occasionally add to debris
      if (p.life <= 0 && Math.random() < 0.3) {
        debris.push({
          x: p.x, y: p.y,
          vx: p.vx * 0.3, vy: p.vy * 0.3,
          size: p.size,
          color: p.color
        });
      }
    }
  }
  
        // Collision check
  collide(dt);
  
  // Spawn drone occasionally
  const now = Date.now();
  if (now - lastDroneSpawn > 8000 && !cleanupDrone) {
    cleanupDrone = new Drone();
    lastDroneSpawn = now;
  }
  
  // Update drone
  if (cleanupDrone) {
    cleanupDrone.update(dt);
    cleanupDrone.draw(ctx);
    // despawn after a while
    if (now - lastDroneSpawn > 12000) {
      cleanupDrone = null;
    }
  }
  
  requestAnimationFrame(animate);
}

init();
animate();
})();
</script>
</body>
</html>
