<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px;
        }

        .calculator {
            width: 360px;
            background: #e0e0e0;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 
                15px 15px 30px #bebebe,
                -15px -15px 30px #ffffff;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .display {
            width: 100%;
            height: 80px;
            background: #e0e0e0;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            box-shadow: 
                inset 8px 8px 12px #bebebe,
                inset -8px -8px 12px #ffffff;
            overflow: hidden;
        }

        .display-input {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            font-size: 2rem;
            text-align: right;
            color: #333;
            font-weight: 600;
            resize: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: inherit;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .key {
            width: 100%;
            height: 70px;
            border-radius: 18px;
            border: none;
            font-size: 1.4rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 
                8px 8px 15px #bebebe,
                -8px -8px 15px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        .key:hover {
            filter: brightness(1.03);
        }

        .key:active {
            transform: scale(0.97);
            box-shadow: 
                inset 4px 4px 8px #bebebe,
                inset -4px -4px 8px #ffffff;
        }

        .key.operator {
            color: #fff;
            background: #ff6b6b;
            box-shadow: 
                8px 8px 15px #cc5555,
                -8px -8px 15px #ff8080;
        }

        .key.operator:active {
            transform: scale(0.97);
            box-shadow: 
                inset 4px 4px 8px #cc5555,
                inset -4px -4px 8px #ff8080;
        }

        .key.equals {
            color: #fff;
            background: #4ecca3;
            box-shadow: 
                8px 8px 15px #3a9983,
                -8px -8px 15px #5fd5b1;
        }

        .key.equals:active {
            transform: scale(0.97);
            box-shadow: 
                inset 4px 4px 8px #3a9983,
                inset -4px -4px 8px #5fd5b1;
        }

        .key.zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" class="display-input" id="display" readonly>
        </div>
        <div class="keys">
            <button class="key" data-action="clear">C</button>
            <button class="key" data-action="backspace">⌫</button>
            <button class="key operator" data-action="operator">%</button>
            <button class="key operator" data-action="operator">÷</button>
            
            <button class="key" data-action="number">7</button>
            <button class="key" data-action="number">8</button>
            <button class="key" data-action="number">9</button>
            <button class="key operator" data-action="operator">×</button>
            
            <button class="key" data-action="number">4</button>
            <button class="key" data-action="number">5</button>
            <button class="key" data-action="number">6</button>
            <button class="key operator" data-action="operator">-</button>
            
            <button class="key" data-action="number">1</button>
            <button class="key" data-action="number">2</button>
            <button class="key" data-action="number">3</button>
            <button class="key operator" data-action="operator">+</button>
            
            <button class="key zero" data-action="number">0</button>
            <button class="key" data-action="dot">.</button>
            <button class="key equals" data-action="equals">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let resetScreen = false;

        function updateDisplay() {
            display.value = currentInput;
            // Auto-shrink long numbers
            if (currentInput.length > 12) {
                display.style.fontSize = '1.4rem';
            } else {
                display.style.fontSize = '2rem';
            }
        }

        function appendNumber(number) {
            if (currentInput === '0' || resetScreen) {
                currentInput = number;
                resetScreen = false;
            } else {
                currentInput += number;
            }
        }

        function appendDot() {
            if (resetScreen) {
                currentInput = '0.';
                resetScreen = false;
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
        }

        function chooseOperation(op) {
            if (operation !== null) calculate();
            previousInput = currentInput;
            operation = op;
            resetScreen = true;
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    result = current === 0 ? 'Error' : prev / current;
                    break;
                case '%':
                    result = prev % current;
                    break;
                default:
                    return;
            }

            currentInput = String(result);
            operation = null;
            previousInput = '';
            resetScreen = true;
        }

        function clear() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            resetScreen = false;
        }

        function backspace() {
            if (resetScreen) {
                currentInput = '0';
                resetScreen = false;
            } else if (currentInput.length === 1) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
        }

        function handleKey(event) {
            const key = event.key;
            if (key >= '0' && key <= '9') {
                appendNumber(key);
            } else if (key === '.') {
                appendDot();
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                const opMap = { '+': '+', '-': '-', '*': '×', '/': '÷' };
                chooseOperation(opMap[key]);
            } else if (key === 'Enter' || key === '=') {
                calculate();
            } else if (key === 'Escape') {
                clear();
            } else if (key === 'Backspace') {
                backspace();
            } else if (key === '%') {
                chooseOperation('%');
            }
            updateDisplay();
        }

        function simulateClick(button) {
            button.classList.add('clicked');
            setTimeout(() => button.classList.remove('clicked'), 150);
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('key')) {
                simulateClick(e.target);
            }
        });

        document.querySelectorAll('.key').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                const value = button.textContent.trim();

                if (action === 'number') {
                    appendNumber(value);
                } else if (action === 'dot') {
                    appendDot();
                } else if (action === 'operator') {
                    const opMap = {
                        '+': '+',
                        '-': '-',
                        '×': '×',
                        '÷': '÷',
                        '%': '%'
                    };
                    chooseOperation(opMap[value]);
                } else if (action === 'equals') {
                    calculate();
                } else if (action === 'clear') {
                    clear();
                } else if (action === 'backspace') {
                    backspace();
                }

                updateDisplay();
            });
        });

        document.addEventListener('keydown', handleKey);

        // Initialize the display
        updateDisplay();
    </script>
</body>
</html>
