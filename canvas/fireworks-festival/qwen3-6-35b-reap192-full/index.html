<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Fireworks Night</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let horizon;
    let stars = [];
    
    // Configuration
    const colors = [
        '#FF4136', '#FF851B', '#FFDC00', '#2ECC40', '#0074D9', 
        '#B10DC9', '#F012BE', '#7FDBFF', '#AAAAAA', '#FFFFFF'
    ];

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        horizon = height * 0.65; // Sky takes up top 65%
        generateStars();
        generateSkyline();
    }
    window.addEventListener('resize', resize);

    // --- Classes ---

    class Star {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * horizon;
            this.size = Math.random() * 1.5;
            this.alpha = Math.random();
            this.twinkleSpeed = 0.02 + Math.random() * 0.05;
        }
        update() {
            this.alpha += this.twinkleSpeed;
            if (this.alpha > 1 || this.alpha < 0.2) this.twinkleSpeed *= -1;
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Particle {
        constructor(x, y, color, velocity, type) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.velocity = velocity;
            this.alpha = 1;
            this.type = type; // 'trail', 'spark', 'star'
            this.decay = type === 'trail' ? 0.03 : 0.01 + Math.random() * 0.015;
            this.gravity = 0.05;
            this.drag = 0.96;
        }

        update() {
            this.velocity.x *= this.drag;
            this.velocity.y *= this.drag;
            this.velocity.y += this.gravity;
            this.x += this.velocity.x;
            this.y += this.velocity.y;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            
            if (this.type === 'trail') {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Sparkle effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class Rocket {
        constructor(x, y, targetY, color) {
            this.x = x;
            this.y = y;
            this.targetY = targetY;
            this.color = color;
            this.velocity = { x: (Math.random() - 0.5) * 2, y: -(Math.random() * 3 + 12) };
            this.alpha = 1;
            this.trail = [];
            this.exploded = false;
            this.flicker = 0;
        }

        update() {
            this.x += this.velocity.x;
            this.y += this.velocity.y;
            this.velocity.y += 0.02; // Gravity on launch
            
            // Whistling trail effect
            this.flicker = Math.random() * 2;
            this.trail.push({ x: this.x + (Math.random()-0.5)*4, y: this.y + (Math.random()-0.5)*4, alpha: 0.6 });
            
            // Limit trail size
            if (this.trail.length > 10) this.trail.shift();

            // Explode check
            if (this.velocity.y >= -1 || this.y <= this.targetY) {
                this.explode();
                this.exploded = true;
            }
        }

        draw() {
            // Draw Trail
            ctx.save();
            for (let i = 0; i < this.trail.length; i++) {
                const t = this.trail[i];
                t.alpha -= 0.05;
                if(t.alpha > 0) {
                    ctx.globalAlpha = t.alpha;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();

            // Draw Head
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = '#FFF';
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        explode() {
            createExplosion(this.x, this.y, this.color);
        }
    }

    // --- State ---
    let rockets = [];
    let particles = [];
    let skyline = [];
    let lastLaunchTime = 0;
    let finaleActive = false;
    let finaleTimer = 0;
    let finaleInterval = 15000; // 15 seconds for demo speed (normally 300000ms = 5 mins)

    // --- Generators ---

    function generateStars() {
        stars = [];
        for(let i=0; i<100; i++) stars.push(new Star());
    }

    function generateSkyline() {
        skyline = [];
        let currentX = 0;
        while (currentX < width + 100) {
            const w = 30 + Math.random() * 80;
            const h = 50 + Math.random() * (height * 0.25);
            skyline.push({ x: currentX, w: w, h: h });
            currentX += w - (Math.random() * 15); // Overlap slightly
        }
    }

    function createExplosion(x, y, baseColor) {
        const type = Math.floor(Math.random() * 4);
        const count = 80 + Math.random() * 50;
        
        // Generate palette for this burst
        const palette = [];
        if (Math.random() > 0.5) {
            // Monochromatic with white center
            palette.push(baseColor);
            palette.push('#FFFFFF');
        } else {
            // Random distinct colors
            for(let i=0; i<3; i++) palette.push(colors[Math.floor(Math.random() * colors.length)]);
        }

        for (let i = 0; i < count; i++) {
            let angle = (Math.PI * 2 / count) * i;
            let speed = Math.random() * 4 + 1;
            
            // Pattern Logic
            if (type === 0) { 
                // Peony: Standard sphere
                speed = Math.random() * 4 + 1; 
            } else if (type === 1) {
                // Willow: Fast center, slow outer, high gravity
                angle = Math.random() * Math.PI * 2;
                speed = Math.random() * 0.5 + 0.5; // mostly center
                if (Math.random() > 0.7) speed = 6; // long tails
                speed = Math.random() * 5 + 1;
            } else if (type === 2) {
                // Ring: Constant speed
                speed = 4 + Math.random(); 
            } else if (type === 3) {
                // Double Break: Two shells
                if (i < count/2) {
                    angle = Math.random() * Math.PI * 2;
                    speed = 2 + Math.random() * 2;
                } else {
                    angle = Math.random() * Math.PI * 2;
                    speed = 6 + Math.random() * 3;
                }
            }

            // Override gravity for willows to make them droopy
            const p = new Particle(x, y, palette[Math.floor(Math.random() * palette.length)], {
                x: Math.cos(angle) * speed,
                y: Math.sin(angle) * speed
            }, 'spark');

            if (type === 1) {
                p.decay = 0.005; // Lasts longer
                p.gravity = 0.1; // Falls faster
            } else if (type === 3 && i < count/2) {
                p.decay = 0.02; // Inner ring fades fast
            }

            particles.push(p);
        }
    }

    function launchRocket() {
        const x = Math.random() * (width - 100) + 50;
        const targetY = Math.random() * (horizon * 0.6) + 50;
        const color = colors[Math.floor(Math.random() * colors.length)];
        rockets.push(new Rocket(x, height, targetY, color));
    }

    // --- Render Functions ---

    function drawSky() {
        const grad = ctx.createLinearGradient(0, 0, 0, horizon);
        grad.addColorStop(0, '#000000');
        grad.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, horizon);
    }

    function drawRiver() {
        const grad = ctx.createLinearGradient(0, horizon, 0, height);
        grad.addColorStop(0, '#0f0f1a');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, horizon, width, height - horizon);
    }

    function drawSkyline() {
        ctx.fillStyle = '#050505';
        skyline.forEach(b => {
            ctx.fillRect(b.x, horizon - b.h, b.w, b.h);
            
            // Windows
            ctx.fillStyle = Math.random() > 0.98 ? 'rgba(255,255,200,0.8)' : 'rgba(255,255,200,0.1)'; // Flicker
            for(let wy = horizon - b.h + 10; wy < horizon; wy += 15) {
                for(let wx = b.x + 5; wx < b.x + b.w - 5; wx += 10) {
                    if (Math.random() > 0.8) {
                         ctx.fillRect(wx, wy, 4, 8);
                    }
                }
            }
            ctx.fillStyle = '#050505'; // Reset for building body
        });
    }

    function drawReflection() {
        ctx.save();
        ctx.translate(0, horizon * 2);
        ctx.scale(1, -1);
        
        // Clip to river area
        ctx.beginPath();
        ctx.rect(0, horizon, width, height - horizon);
        ctx.clip();

        // Draw Skyline Reflection
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#000';
        skyline.forEach(b => {
            ctx.fillRect(b.x, horizon - b.h, b.w, b.h);
        });

        // Draw Particles Reflection
        particles.forEach(p => {
            if (p.y > horizon) { // Only draw if inside river
                 ctx.save();
                 ctx.globalAlpha = Math.max(0, p.alpha) * 0.5;
                 ctx.fillStyle = p.color;
                 ctx.beginPath();
                 ctx.arc(p.x, p.y, p.type === 'trail' ? 2 : 1.5, 0, Math.PI * 2);
                 ctx.fill();
                 ctx.restore();
            }
        });

        // Draw Rocket Reflections (ghostly)
        ctx.globalAlpha = 0.2;
        rockets.forEach(r => {
            ctx.fillStyle = r.color;
            ctx.beginPath();
            ctx.arc(r.x, r.y, 2, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();

        // Draw water distortion/shimmer on top
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, horizon, width, height - horizon);
        ctx.clip();
        
        // Simple sine wave shimmer lines
        ctx.strokeStyle = 'rgba(100, 150, 255, 0.05)';
        ctx.lineWidth = 2;
        const time = Date.now() * 0.002;
        for(let y = horizon + 20; y < height; y += 40) {
            ctx.beginPath();
            for(let x = 0; x < width; x += 10) {
                const yOffset = Math.sin(x * 0.01 + time) * 5 + Math.sin(x * 0.05 + time * 2) * 2;
                if (x===0) ctx.moveTo(x, y + yOffset);
                else ctx.lineTo(x, y + yOffset);
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    // --- Main Loop ---

    function loop() {
        ctx.clearRect(0, 0, width, height);

        drawSky();
        
        // Stars
        stars.forEach(s => { s.update(); s.draw(); });

        drawRiver();
        drawSkyline();

        // Logic: Launching
        const now = Date.now();
        
        // Finale Logic
        if (now - finaleTimer > finaleInterval) {
            finaleActive = true;
            finaleTimer = now;
        }

        if (finaleActive) {
            if (Math.random() > 0.8) launchRocket(); // Fast launching
            if (Math.random() < 0.05) finaleActive = false; // Finale lasts a bit
        } else {
            // Normal random launch
            if (Math.random() < 0.03) launchRocket();
        }

        // Update & Draw Rockets
        for (let i = rockets.length - 1; i >= 0; i--) {
            const r = rockets[i];
            r.update();
            r.draw();
            if (r.exploded) rockets.splice(i, 1);
        }

        // Update & Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            if (p.alpha <= 0) particles.splice(i, 1);
        }

        drawReflection();

        requestAnimationFrame(loop);
    }

    // Start
    resize();
    loop();

</script>
</body>
</html>
