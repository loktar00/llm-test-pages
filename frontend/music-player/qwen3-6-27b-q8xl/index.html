<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --art-1: #6c3ce0;
    --art-2: #e040a0;
    --art-3: #f0a030;
    --art-4: #20c0a0;
    --bg-tint: rgba(108, 60, 224, 0.08);
    --card-bg: rgba(255,255,255,0.06);
    --text-primary: #f0eef6;
    --text-secondary: rgba(240,238,246,0.55);
    --accent: #e040a0;
    --accent-glow: rgba(224,64,160,0.35);
    --ring-bg: rgba(255,255,255,0.08);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(145deg, #0e0a1a 0%, #1a1030 40%, #150e28 70%, #0e0a1a 100%);
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 500px at 30% 20%, rgba(108,60,224,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 70% 70%, rgba(224,64,160,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 50% 50%, rgba(240,160,48,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .player-card {
    position: relative;
    z-index: 1;
    width: 380px;
    background: var(--card-bg);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 32px 28px 28px;
    box-shadow:
      0 4px 24px rgba(0,0,0,0.3),
      0 0 80px rgba(108,60,224,0.06),
      inset 0 1px 0 rgba(255,255,255,0.05);
    color: var(--text-primary);
    user-select: none;
  }

  /* ── Album Art ── */
  .art-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 28px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.35),
      0 0 60px rgba(108,60,224,0.12);
  }

  .art-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    pointer-events: none;
  }

  .album-art {
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 25% 75%, rgba(32,192,160,0.7) 0%, transparent 50%),
      radial-gradient(circle at 75% 25%, rgba(240,160,48,0.8) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(224,64,160,0.6) 0%, transparent 55%),
      radial-gradient(circle at 20% 20%, rgba(108,60,224,0.9) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(108,60,224,0.7) 0%, transparent 45%),
      linear-gradient(135deg, #1a0a3e 0%, #2d1060 25%, #4a1070 40%, #e040a0 65%, #f0a030 85%, #20c0a0 100%);
    animation: artShift 12s ease-in-out infinite alternate;
    position: relative;
  }

  .album-art::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      conic-gradient(from 45deg at 50% 50%,
        transparent 0deg,
        rgba(255,255,255,0.03) 60deg,
        transparent 120deg,
        rgba(255,255,255,0.02) 180deg,
        transparent 240deg,
        rgba(255,255,255,0.04) 300deg,
        transparent 360deg);
  }

  .album-art::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 35% 65%, rgba(255,255,255,0.06) 0%, transparent 100%);
  }

  @keyframes artShift {
    0% { filter: hue-rotate(0deg) saturate(1); }
    50% { filter: hue-rotate(15deg) saturate(1.15); }
    100% { filter: hue-rotate(-10deg) saturate(1.1); }
  }

  /* ── Track Info ── */
  .track-info {
    text-align: center;
    margin-bottom: 24px;
  }

  .track-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .track-artist {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* ── Progress Bar ── */
  .progress-section {
    margin-bottom: 24px;
  }

  .progress-bar-track {
    width: 100%;
    height: 4px;
    background: var(--ring-bg);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--art-1), var(--art-2));
    border-radius: 4px;
    transition: width 0.3s linear;
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -4px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .progress-bar-track:hover .progress-bar-fill::after {
    opacity: 1;
  }

  .time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 24px;
  }

  .btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.9);
  }

  .btn-skip {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }

  .btn-skip:hover {
    background: rgba(255,255,255,0.1);
  }

  .btn-skip svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  /* ── Play Button with Ring ── */
  .play-btn-wrapper {
    position: relative;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .progress-ring-svg {
    position: absolute;
    inset: 0;
    width: 72px;
    height: 72px;
    transform: rotate(-90deg);
  }

  .progress-ring-bg {
    fill: none;
    stroke: var(--ring-bg);
    stroke-width: 3;
  }

  .progress-ring-fill {
    fill: none;
    stroke: url(#ringGradient);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 188.5;
    stroke-dashoffset: 188.5;
    transition: stroke-dashoffset 0.3s linear;
    filter: drop-shadow(0 0 6px var(--accent-glow));
  }

  .btn-play {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--art-1), var(--art-2));
    box-shadow: 0 4px 20px var(--accent-glow), 0 0 40px rgba(224,64,160,0.15);
    position: relative;
    z-index: 1;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
  }

  .btn-play:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 28px var(--accent-glow), 0 0 50px rgba(224,64,160,0.2);
  }

  .btn-play:active {
    transform: scale(0.95);
  }

  .play-icon, .pause-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  .play-icon {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .pause-icon {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
  }

  .btn-play.playing .play-icon {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
  }

  .btn-play.playing .pause-icon {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .play-icon svg {
    width: 22px;
    height: 22px;
    fill: #fff;
    margin-left: 2px;
  }

  .pause-icon svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  /* ── Volume ── */
  .volume-section {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
  }

  .volume-icon {
    flex-shrink: 0;
    color: var(--text-secondary);
    transition: color 0.2s;
  }

  .volume-icon svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .volume-slider-track {
    flex: 1;
    height: 4px;
    background: var(--ring-bg);
    border-radius: 4px;
    position: relative;
    cursor: pointer;
  }

  .volume-slider-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 70%;
    background: linear-gradient(90deg, var(--art-1), var(--art-2));
    border-radius: 4px;
    pointer-events: none;
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: transparent;
    position: absolute;
    top: 0;
    left: 0;
    margin: 0;
    cursor: pointer;
    z-index: 2;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px var(--accent-glow), 0 2px 6px rgba(0,0,0,0.3);
    cursor: pointer;
    margin-top: -5px;
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
  }

  .volume-slider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    box-shadow: 0 0 12px var(--accent-glow), 0 2px 10px rgba(0,0,0,0.4);
  }

  .volume-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 0 8px var(--accent-glow), 0 2px 6px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
  }

  .volume-slider::-moz-range-thumb:hover {
    box-shadow: 0 0 12px var(--accent-glow), 0 2px 10px rgba(0,0,0,0.4);
  }

  .volume-slider::-moz-range-track {
    background: transparent;
    border: none;
  }

  /* ── Subtle floating particles ── */
  .particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: rgba(224,64,160,0.3);
    border-radius: 50%;
    pointer-events: none;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }
</style>
</head>
<body>

<div class="player-card">
  <!-- Album Art -->
  <div class="art-wrapper">
    <div class="album-art"></div>
  </div>

  <!-- Track Info -->
  <div class="track-info">
    <div class="track-title">Midnight Aurora</div>
    <div class="track-artist">Stellar Drift</div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-section">
    <div class="progress-bar-track" id="progressTrack">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="totalTime">3:24</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-skip" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>

    <div class="play-btn-wrapper">
      <svg class="progress-ring-svg" viewBox="0 0 72 72">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6c3ce0"/>
            <stop offset="100%" stop-color="#e040a0"/>
          </linearGradient>
        </defs>
        <circle class="progress-ring-bg" cx="36" cy="36" r="30"/>
        <circle class="progress-ring-fill" id="ringFill" cx="36" cy="36" r="30"/>
      </svg>
      <button class="btn btn-play" id="playBtn" aria-label="Play">
        <span class="play-icon">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </span>
        <span class="pause-icon">
          <svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </span>
      </button>
    </div>

    <button class="btn btn-skip" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>

  <!-- Volume -->
  <div class="volume-section">
    <div class="volume-icon">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>
    <div class="volume-slider-track">
      <div class="volume-slider-fill" id="volumeFill"></div>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
    </div>
  </div>
</div>

<script>
  const TRACK_DURATION = 204; // 3:24 in seconds
  const ringFill = document.getElementById('ringFill');
  const progressFill = document.getElementById('progressFill');
  const currentTimeEl = document.getElementById('currentTime');
  const playBtn = document.getElementById('playBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeFill = document.getElementById('volumeFill');
  const progressTrack = document.getElementById('progressTrack');

  const circumference = 2 * Math.PI * 30; // ~188.5
  ringFill.style.strokeDasharray = circumference;

  let isPlaying = false;
  let currentTime = 0;
  let animFrame = null;
  let lastTimestamp = null;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateUI() {
    const pct = (currentTime / TRACK_DURATION) * 100;
    progressFill.style.width = pct + '%';
    const offset = circumference - (currentTime / TRACK_DURATION) * circumference;
    ringFill.style.strokeDashoffset = offset;
    currentTimeEl.textContent = formatTime(currentTime);
  }

  function tick(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;
    currentTime += delta;
    if (currentTime >= TRACK_DURATION) {
      currentTime = 0;
    }
    updateUI();
    animFrame = requestAnimationFrame(tick);
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    playBtn.classList.toggle('playing', isPlaying);
    if (isPlaying) {
      lastTimestamp = null;
      animFrame = requestAnimationFrame(tick);
    } else {
      if (animFrame) cancelAnimationFrame(animFrame);
    }
  }

  playBtn.addEventListener('click', togglePlay);

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentTime = Math.max(0, currentTime - 10);
    if (!isPlaying) updateUI();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentTime = Math.min(TRACK_DURATION, currentTime + 10);
    if (!isPlaying) updateUI();
  });

  progressTrack.addEventListener('click', (e) => {
    const rect = progressTrack.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    currentTime = pct * TRACK_DURATION;
    updateUI();
  });

  volumeSlider.addEventListener('input', (e) => {
    const v = e.target.value;
    volumeFill.style.width = v + '%';
  });
  volumeFill.style.width = volumeSlider.value + '%';

  // Floating particles
  function createParticles() {
    const colors = ['rgba(108,60,224,0.3)', 'rgba(224,64,160,0.25)', 'rgba(240,160,48,0.2)', 'rgba(32,192,160,0.2)'];
    for (let i = 0; i < 15; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 2.5) + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(p);
    }
  }
  createParticles();

  updateUI();
</script>
</body>
</html>
