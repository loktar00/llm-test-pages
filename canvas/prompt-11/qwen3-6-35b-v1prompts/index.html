<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Isometric Heightmap</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e; /* Dark background to frame the canvas */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="terrainCanvas"></canvas>

    <script>
        // Configuration
        const SIZE = 256;
        const HEIGHT_SCALE = 140; // Vertical exaggeration
        const SCALE_FACTOR = 1; // Zoom level (1px per heightmap unit roughly)
        
        // Color Palette
        const COLORS = {
            deepWater:    '#002b36', // 0.00 - 0.30
            shallowWater: '#2e8bc0', // 0.30 - 0.38
            beach:        '#f4e4bc', // 0.38 - 0.43
            grass:        '#53784b', // 0.43 - 0.60
            hills:        '#8c7b6c', // 0.60 - 0
