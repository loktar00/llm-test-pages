<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Seasons Screensaver</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const SEASON_DURATION = 10000;
const SEASONS = ['spring', 'summer', 'fall', 'winter'];

let startTime = performance.now();
let raindrops = [];
let snowflakes = [];
let stars = [];
let fireflies = [];
let leaves = [];
let bats = [];
let flowers = [];
let grassBlades = [];
let trees = [];
let squirrels = [];

function initParticles() {
    stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push({ x: Math.random() * 2000, y: Math.random() * 600, size: Math.random() * 2 + 0.5, twinkle: Math.random() * Math.PI * 2 });
    }
    fireflies = [];
    for (let i = 0; i < 40; i++) {
        fireflies.push({ x: Math.random() * 1600, y: Math.random() * 400 + 100, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 0.8, phase: Math.random() * Math.PI * 2, brightness: Math.random() });
    }
    for (let i = 0; i < 80; i++) {
        raindrops.push({ x: Math.random() * 2000, y: Math.random() * 1000, speed: Math.random() * 8 + 8, length: Math.random() * 15 + 10 });
    }
    for (let i = 0; i < 150; i++) {
        snowflakes.push({ x: Math.random() * 2000, y: Math.random() * 1000, size: Math.random() * 4 + 1, speedY: Math.random() * 1.5 + 0.5, speedX: (Math.random() - 0.5) * 0.8, rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.05 });
    }
    for (let i = 0; i < 50; i++) {
        leaves.push({ x: Math.random() * 1600, y: Math.random() * -200 - 100, size: Math.random() * 6 + 3, rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.04, vx: (Math.random() - 0.5) * 1.5, vy: Math.random() * 1.5 + 0.5, color: ['#c44b1e', '#d4812a', '#e8a830', '#b8321a', '#a0522d'][Math.floor(Math.random() * 5)] });
    }
    for (let i = 0; i < 25; i++) {
        flowers.push({ x: Math.random() * 1600, y: H - 80 - Math.random() * 60, color: ['#ff6b8a', '#ff9a56', '#ffa56e', '#ff6eb4', '#f7b731', '#fc5c65'][Math.floor(Math.random() * 6)], size: Math.random() * 6 + 4, stemH: Math.random() * 20 + 15 });
    }
    for (let i = 0; i < 300; i++) {
        grassBlades.push({ x: Math.random() * 2000, y: H - 60 - Math.random() * 40, height: Math.random() * 30 + 15, color: '', angle: (Math.random() - 0.5) * 0.3 });
    }
    for (let i = 0; i < 8; i++) {
        bats.push({ x: Math.random() * 2000, y: Math.random() * 300 + 50, vx: (Math.random() - 0.5) * 3, vy: Math.sin(Math.random() * Math.PI * 2) * 0.5, wingPhase: Math.random() * Math.PI * 2 });
    }
}

function createTrees() {
    trees = [];
    const positions = [0.08, 0.18, 0.28, 0.42, 0.55, 0.65, 0.75, 0.88, 0.95, 0.15, 0.35, 0.5, 0.72];
    positions.forEach((p, i) => {
        const x = p * W;
        const y = H - 60 - Math.random() * 30;
        const scale = 0.6 + Math.random() * 0.8;
        trees.push({ x, y, scale, branchCount: 4 + Math.floor(Math.random() * 4), type: Math.random() > 0.3 ? 'oak' : 'pine' });
    });
}

initParticles();
createTrees();

function getSeason(time) {
    const cycleTime = time % (SEASON_DURATION * 4);
    const seasonIndex = Math.floor(cycleTime / SEASON_DURATION);
    const seasonTime = cycleTime - seasonIndex * SEASON_DURATION;
    return { index: seasonIndex, time: seasonTime, name: SEASONS[seasonIndex] };
}

function getDayPhase(seasonTime) {
    return seasonTime / SEASON_DURATION; // 0-1
}

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
}

function drawSky(season, phase, t) {
    let topColor, bottomColor;
    const sunProgress = phase < 0.5 ? phase / 0.5 : 1;
    const isDay = phase < 0.5;
    const dayProgress = isDay ? phase / 0.5 : (phase - 0.5) / 0.5;

    if (season === 'spring') {
        if (isDay) {
            topColor = lerpColor([135, 180, 220], [100, 150, 200], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([200, 220, 240], [180, 200, 230], Math.sin(dayProgress * Math.PI));
        } else {
            topColor = lerpColor([15, 20, 50], [25, 35, 70], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([40, 50, 80], [60, 70, 100], Math.sin(dayProgress * Math.PI));
        }
    } else if (season === 'summer') {
        if (isDay) {
            topColor = lerpColor([70, 150, 230], [100, 170, 240], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([180, 220, 250], [200, 230, 255], Math.sin(dayProgress * Math.PI));
        } else {
            topColor = lerpColor([8, 12, 35], [15, 20, 50], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([20, 30, 60], [30, 40, 70], Math.sin(dayProgress * Math.PI));
        }
    } else if (season === 'fall') {
        if (isDay) {
            topColor = lerpColor([160, 140, 120], [180, 160, 130], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([210, 180, 140], [220, 190, 150], Math.sin(dayProgress * Math.PI));
        } else {
            topColor = lerpColor([10, 15, 40], [20, 25, 55], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([30, 35, 60], [40, 45, 70], Math.sin(dayProgress * Math.PI));
        }
    } else { // winter
        if (isDay) {
            topColor = lerpColor([170, 185, 200], [190, 200, 215], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([220, 225, 235], [235, 240, 245], Math.sin(dayProgress * Math.PI));
        } else {
            topColor = lerpColor([10, 15, 35], [18, 22, 50], Math.sin(dayProgress * Math.PI));
            bottomColor = lerpColor([30, 35, 55], [40, 45, 65], Math.sin(dayProgress * Math.PI));
        }
    }

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `rgb(${topColor[0]|0},${topColor[1]|0},${topColor[2]|0})`);
    grad.addColorStop(1, `rgb(${bottomColor[0]|0},${bottomColor[1]|0},${bottomColor[2]|0})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
}

function drawSun(phase, t) {
    if (phase >= 0.5) return;
    const p = phase / 0.5;
    const sx = lerp(0, W * 0.95, p);
    const sy = H - 50 - Math.sin(p * Math.PI) * (H * 0.7);

    ctx.save();
    // Glow
    const glowGrad = ctx.createRadialGradient(sx, sy, 10, sx, sy, 80);
    glowGrad.addColorStop(0, 'rgba(255,220,100,0.6)');
    glowGrad.addColorStop(0.5, 'rgba(255,200,80,0.2)');
    glowGrad.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(sx - 100, sy - 100, 200, 200);

    // Sun body
    const sunGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 30);
    sunGrad.addColorStop(0, '#FFF8DC');
    sunGrad.addColorStop(0.7, '#FFD700');
    sunGrad.addColorStop(1, '#FFA500');
    ctx.beginPath();
    ctx.arc(sx, sy, 30, 0, Math.PI * 2);
    ctx.fillStyle = sunGrad;
    ctx.fill();

    // Rays
    ctx.strokeStyle = 'rgba(255,215,0,0.4)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2 + t * 0.5;
        ctx.beginPath();
        ctx.moveTo(sx + Math.cos(angle) * 35, sy + Math.sin(angle) * 35);
        ctx.lineTo(sx + Math.cos(angle) * 50, sy + Math.sin(angle) * 50);
        ctx.stroke();
    }
    ctx.restore();
}

function drawMoon(phase, t) {
    if (phase < 0.5) return;
    const p = (phase - 0.5) / 0.5;
    const mx = lerp(0, W * 0.95, p);
    const my = H - 50 - Math.sin(p * Math.PI) * (H * 0.65);

    ctx.save();
    // Glow
    const glowGrad = ctx.createRadialGradient(mx, my, 5, mx, my, 60);
    glowGrad.addColorStop(0, 'rgba(200,220,255,0.4)');
    glowGrad.addColorStop(0.5, 'rgba(180,200,240,0.15)');
    glowGrad.addColorStop(1, 'rgba(150,180,220,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(mx - 80, my - 80, 160, 160);

    // Moon body
    const moonGrad = ctx.createRadialGradient(mx - 5, my - 5, 0, mx, my, 25);
    moonGrad.addColorStop(0, '#FFFDE8');
    moonGrad.addColorStop(1, '#E8E0C8');
    ctx.beginPath();
    ctx.arc(mx, my, 25, 0, Math.PI * 2);
    ctx.fillStyle = moonGrad;
    ctx.fill();

    // Crescent shadow
    ctx.beginPath();
    ctx.arc(mx + 10, my - 3, 20, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${phase > 0.75 ? 20 : 100}, ${phase > 0.75 ? 25 : 130}, ${phase > 0.75 ? 50 : 180}, 0.7)`;
    ctx.fill();

    // Stars
    stars.forEach(s => {
        const sx = s.x % W;
        const brightness = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 3 + s.twinkle));
        ctx.beginPath();
        ctx.arc(sx, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${brightness * (phase > 0.7 ? 1 : 0.3)})`;
        ctx.fill();
    });
    ctx.restore();
}

function drawGround(season, phase) {
    const isDay = phase < 0.5;
    let groundColor;
    if (season === 'spring') groundColor = isDay ? [80, 160, 60] : [30, 60, 30];
    else if (season === 'summer') groundColor = isDay ? [50, 120, 40] : [20, 50, 20];
    else if (season === 'fall') groundColor = isDay ? [160, 130, 60] : [60, 50, 25];
    else groundColor = isDay ? [220, 225, 230] : [140, 150, 170];

    const groundY = H - 70;
    const grad = ctx.createLinearGradient(0, groundY, 0, H);
    grad.addColorStop(0, `rgb(${groundColor[0]},${groundColor[1]},${groundColor[2]})`);
    const darkC = groundColor.map(c => c * 0.6);
    grad.addColorStop(1, `rgb(${darkC[0]|0},${darkC[1]|0},${darkC[2]|0})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY, W, H - groundY);

    // Hills
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (let x = 0; x <= W; x += 5) {
        const y = groundY + Math.sin(x * 0.005) * 15 + Math.sin(x * 0.01 + 1) * 8;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = `rgb(${groundColor[0]+10},${groundColor[1]+10},${groundColor[2]+10})`;
    ctx.fill();
}

function drawGrass(season, phase, t) {
    const isDay = phase < 0.5;
    let grassColor;
    if (season === 'spring') grassColor = isDay ? [60, 170, 50] : [25, 70, 25];
    else if (season === 'summer') grassColor = isDay ? [40, 110, 30] : [15, 45, 15];
    else if (season === 'fall') grassColor = isDay ? [170, 140, 50] : [65, 55, 20];
    else grassColor = isDay ? [200, 210, 215] : [130, 140, 155];

    const wind = Math.sin(t * 2) * 0.15;

    grassBlades.forEach(g => {
        const gx = g.x % W;
        const sway = Math.sin(t * 3 + gx * 0.01) * 8 + wind * 20;
        ctx.beginPath();
        ctx.moveTo(gx, g.y);
        ctx.quadraticCurveTo(gx + sway * 0.5, g.y - g.height * 0.5, gx + sway, g.y - g.height);
        ctx.strokeStyle = `rgb(${grassColor[0]},${grassColor[1]},${grassColor[2]})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    });
}

function drawTree(tree, season, phase, t) {
    const isDay = phase < 0.5;
    const { x, y, scale, branchCount, type } = tree;
    const trunkH = 120 * scale;
    const trunkW = 12 *
