<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Risotto</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #e17055;
            --accent-light: #fab1a0;
            --bg: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border: #e6e9ef;
            --success: #00b894;
            --font-display: 'Georgia', serif;
            --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --shadow: 0 20px 40px -10px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            font-family: var(--font-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Layout & Card Structure */
        .recipe-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* Hero Header & CSS Illustration */
        .hero {
            height: 260px;
            background: #fff;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        /* The CSS Art: Risotto Bowl */
        .bowl-outer {
            width: 180px;
            height: 180px;
            background: #dfe6e9;
            border-radius: 50%;
            position: relative;
            box-shadow: 
                inset 0 -10px 20px rgba(0,0,0,0.1),
                0 15px 30px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 6s ease-in-out infinite;
        }

        .bowl-inner {
            width: 150px;
            height: 150px;
            background: #ffeaa7; /* Rice color */
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 10px 20px rgba(160, 120, 60, 0.2);
            overflow: hidden;
        }

        /* Texture for rice */
        .bowl-inner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#fdcb6e 15%, transparent 16%),
                              radial-gradient(#fdcb6e 15%, transparent 16%);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            opacity: 0.4;
        }

        /* Garnish */
        .garnish {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .leaf {
            position: absolute;
            background: #55efc4;
            width: 20px;
            height: 30px;
            border-radius: 50% 0 50% 0;
            transform-origin: bottom right;
        }
        .leaf:nth-child(1) { top: 40px; left: 60px; transform: rotate(15deg); background: #00b894; }
        .leaf:nth-child(2) { top: 80px; left: 90px; transform: rotate(-45deg); }
        .crumb {
            position: absolute;
            width: 6px; height: 6px;
            background: #e17055;
            border-radius: 50%;
        }
        .crumb:nth-child(3) { top: 50px; left: 80px; }
        .crumb:nth-child(4) { top: 70px; left: 60px; }
        .crumb:nth-child(5) { top: 90px; left: 70px; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Content Container */
        .content {
            padding: 2rem;
        }

        /* Title & Meta */
        h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .meta-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .chip {
            background: #f1f2f6;
            padding: 0.35rem 0.8rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip svg { width: 14px; height: 14px; fill: var(--text-muted); }

        /* Servings Stepper */
        .servings-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .stepper-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
            color: var(--text-main);
        }
        .stepper-btn:hover { border-color: var(--accent); color: var(--accent); }
        .stepper-btn:active { transform: scale(0.9); }
        .servings-display {
            font-weight: 700;
            min-width: 80px;
            text-align: center;
        }

        /* Ingredients List */
        .section-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .ingredients-list {
            list-style: none;
            margin-bottom: 2.5rem;
        }

        .ingredient-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: color 0.3s;
        }
        .ingredient-item:last-child { border-bottom: none; }

        /* Custom Checkbox */
        .checkbox-wrapper {
            position: relative;
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .checkbox-wrapper input {
            opacity: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            cursor: pointer;
            z-index: 2;
        }
        .checkmark {
            position: absolute;
            top: 0; left: 0;
            height: 20px;
            width: 20px;
            background-color: #fff;
            border: 2px solid #dfe6e9;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .checkbox-wrapper input:checked ~ .checkmark {
            background-color: var(--success);
            border-color: var(--success);
        }
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .checkbox-wrapper input:checked ~ .checkmark:after {
            display: block;
        }

        /* Strikethrough Animation */
        .ing-text {
            transition: color 0.3s, text-decoration 0.3s;
            color: var(--text-main);
        }
        .ingredient-item.checked .ing-text {
            color: #b2bec3;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }
        .ingredient-item.checked {
            opacity: 0.7;
        }

        /* Instructions */
        .instructions-list {
            list-style: none;
            position: relative;
        }
        .step-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .step-item.completed {
            opacity: 1;
        }

        .step-num {
            width: 32px;
            height: 32px;
            background: #f1f2f6;
            color: var(--text-muted);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        
        .step-item.completed .step-num {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 10px rgba(225, 112, 85, 0.3);
        }

        .step-text {
            padding-top: 5px;
        }

        /* Print Styles */
        @media print {
            body { background: white; padding: 0; display: block; }
            .recipe-card { box-shadow: none; max-width: 100%; border: none; }
            .hero { height: 150px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .servings-control, .stepper-btn { display: none; }
            .ingredient-item { border-bottom: 1px solid #ccc; }
            .checkbox-wrapper { display: none; }
            .step-item { opacity: 1; }
            /* Force show text even if logic hides it */
            .ing-text { color: black; text-decoration: none; }
            h1 { font-size: 24pt; }
            .section-title { font-size: 14pt; }
        }

        /* Utilities */
        .highlight { color: var(--accent); font-weight: 600; }

    </style>
</head>
<body>

    <article class="recipe-card">
        <header class="hero">
            <div class="bowl-outer">
                <div class="bowl-inner">
                    <div class="garnish">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                        <div class="crumb"></div>
                        <div class="crumb"></div>
                        <div class="crumb"></div>
                    </div>
                </div>
            </div>
        </header>

        <div class="content">
            <h1>Creamy Mushroom Risotto</h1>
            
            <div class="meta-row">
                <div class="chip">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    45 min
                </div>
                <div class="chip">
                    <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
                    Medium
                </div>
            </div>

            <div class="servings-control">
                <button class="stepper-btn" onclick="updateServings(-1)">−</button>
                <div class="servings-display">
                    <span id="servings-val">2</span> Servings
                </div>
                <button class="stepper-btn" onclick="updateServings(1)">+</button>
            </div>

            <h2 class="section-title">Ingredients</h2>
            <ul class="ingredients-list" id="ingredients-list">
                <!-- Populated by JS -->
            </ul>

            <h2 class="section-title">Instructions</h2>
            <ol class="instructions-list" id="instructions-list">
                <!-- Populated by JS -->
            </ol>
        </div>
    </article>

    <script>
        // Data Structure
        const recipeData = {
            baseServings: 2,
            currentServings: 2,
            ingredients: [
                { amount: 1.5, unit: "cups", name: "Arborio rice" },
                { amount: 6, unit: "cups", name: "Vegetable broth, warm" },
                { amount: 8, unit: "oz", name: "Cremini mushrooms, sliced" },
                { amount: 1, unit: "medium", name: "Yellow onion, diced" },
                { amount: 2, unit: "cloves", name: "Garlic, minced" },
                { amount: 0.5, unit: "cup", name: "Dry white wine" },
                { amount: 0.25, unit: "cup", name: "Parmesan cheese, grated" },
                { amount: 2, unit: "tbsp", name: "Butter" },
                { amount: 1, unit: "tbsp", name: "Olive oil" }
            ],
            steps: [
                "Sauté the <span class='highlight'>onions</span> and <span class='highlight'>mushrooms</span> in butter and oil until soft. Remove from pan.",
                "Toast the <span class='highlight'>rice</span> in the pan for 2 minutes. Deglaze with <span class='highlight'>wine</span>.",
                "Add broth one ladle at a time, stirring constantly until absorbed before adding more.",
                "Cook until rice is tender but al dente (about 18 mins). Stir in mushrooms and <span class='highlight'>parmesan</span>.",
                "Serve immediately with extra cheese on top."
            ]
        };

        const ingredientsListEl = document.getElementById('ingredients-list');
        const instructionsListEl = document.getElementById('instructions-list');
        const servingsValEl = document.getElementById('servings-val');

        // Helper: Format number nicely (e.g. 1.5 -> 1 1/2, 2 -> 2)
        function formatNumber(num) {
            if (Number.isInteger(num)) return num;
            // Simple fraction logic for cooking
            const decimals = Math.round(num * 100) / 100;
            if (Math.abs(decimals - 0.25) < 0.01) return "¼";
            if (Math.abs(decimals - 0.33) < 0.01) return "⅓";
            if (Math.abs(decimals - 0.5) < 0.01) return "½";
            if (Math.abs(decimals - 0.66) < 0.01) return "⅔";
            if (Math.abs(decimals - 0.75) < 0.01) return "¾";
            return num; // fallback
        }

        // Render Ingredients
        function renderIngredients() {
            ingredientsListEl.innerHTML = '';
            const ratio = recipeData.currentServings / recipeData.baseServings;

            recipeData.ingredients.forEach((ing, index) => {
                const scaledAmount = ing.amount * ratio;
                
                const li = document.createElement('li');
                li.className = 'ingredient-item';
                li.innerHTML = `
                    <label class="checkbox-wrapper">
                        <input type="checkbox" onchange="toggleIngredient(this, ${index})">
                        <span class="checkmark"></span>
                    </label>
                    <span class="ing-text">${formatNumber(scaledAmount)} ${ing.unit} ${ing.name}</span>
                `;
                ingredientsListEl.appendChild(li);
            });
        }

        // Render Instructions
        function renderSteps() {
            instructionsListEl.innerHTML = '';
            recipeData.steps.forEach((stepText, index) => {
                const li = document.createElement('li');
                li.className = 'step-item';
                li.id = `step-${index}`;
                li.innerHTML = `
                    <div class="step-num">${index + 1}</div>
                    <div class="step-text">${stepText}</div>
                `;
                instructionsListEl.appendChild(li);
            });
        }

        // Logic: Toggle Ingredient
        window.toggleIngredient = function(checkbox, index) {
            const parent = checkbox.closest('.ingredient-item');
            if (checkbox.checked) {
                parent.classList.add('checked');
            } else {
                parent.classList.remove('checked');
            }
        };

        // Logic: Toggle Step (Simulated by clicking the number)
        // Note: In a real app, users might check a box. Here we make the step number clickable to show the "filling" effect.
        renderSteps();
        document.querySelectorAll('.step-num').forEach((num, idx) => {
            num.addEventListener('click', () => {
                const stepEl = document.getElementById(`step-${idx}`);
                stepEl.classList.toggle('completed');
            });
        });

        // Logic: Servings Stepper
        window.updateServings = function(change) {
            const newVal = recipeData.currentServings + change;
            if (newVal >= 1 && newVal <= 12) {
                recipeData.currentServings = newVal;
                servingsValEl.textContent = newVal;
                renderIngredients(); // Re-render to update quantities
            }
        };

        // Initial Load
        renderIngredients();

    </script>
</body>
</html>
