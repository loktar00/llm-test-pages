<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Camera Bokeh Field</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body, html { width: 100%; height: 100%; background: #0a0a1a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="bokeh"></canvas>
<script>
(() => {
  const canvas = document.getElementById('bokeh');
  const ctx = canvas.getContext('2d');
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  });

  const layers = [
    { depth: 0.2, count: 60, baseRadius: 12, speed: 0.4, warmth: 0.9, hueBase: 30 },
    { depth: 0.5, count: 50, baseRadius: 22, speed: 0.25, warmth: 0.8, hueBase: 40 },
    { depth: 0.8, count: 40, baseRadius: 36, speed: 0.12, warmth: 0.7, hueBase: 20 }
  ];

  const discs = [];

  layers.forEach((layer, li) => {
    for (let i = 0; i < layer.count; i++) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const sizeFactor = 0.6 + Math.random() * 0.8;
      discs.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (0.3 + Math.random() * 0.7) * layer.speed * side,
        vy: (0.1 + Math.random() * 0.2) * layer.speed * (Math.random() < 0.5 ? -1 : 1),
        radius: layer.baseRadius * sizeFactor,
        layer: li,
        pulse: Math.random() * Math.PI * 2,
        sides: 5 + Math.floor(Math.random() * 3),
        sparkle: Math.random() * 0.5 + 0.5
      });
    }
  });

  let focusTime = 0;
  const focusDuration = 10000; // 10 seconds

  function getColor(t) {
    // Warm night-city palette
    const r = 220 + Math.sin(t) * 20;
    const g = 140 + Math.cos(t * 1.3) * 20;
    const b = 80 + Math.sin(t * 0.7) * 15;
    return `rgb(${r},${g},${b})`;
  }

  function blend(c1, c2, t) {
    t = Math.max(0, Math.min(1, t));
    const r = c1[0] * (1 - t) + c2[0] * t;
    const g = c1[1] * (1 - t) + c2[1] * t;
    const b = c1[2] * (1 - t) + c2[2] * t;
    return [r, g, b];
  }

  const palette = [
    [255, 120, 60],   // warm orange
    [255, 200, 80],   // golden
    [180, 220, 255],  // cool accent
    [255, 140, 180],  // pink accent
    [160, 255, 180]   // teal accent
  ];

  function animate(time) {
    focusTime += 16;
    if (focusTime > focusDuration) focusTime = 0;

    const cyclePos = focusTime / focusDuration;
    const focusIndex = Math.floor(cyclePos * layers.length);
    const focusProgress = (cyclePos * layers.length) - focusIndex;

    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, w, h);

    discs.forEach(disc => {
      const layer = layers[disc.layer];

      // Drift
      disc.x += disc.vx;
      disc.y += disc.vy;

      if (disc.x < -disc.radius * 2) disc.x = w + disc.radius * 2;
      if (disc.x > w + disc.radius * 2) disc.x = -disc.radius * 2;
      if (disc.y < -disc.radius * 2) disc.y = h + disc.radius * 2;
      if (disc.y > h + disc.radius * 2) disc.y = -disc.radius * 2;

      // Focus calculation
      const focusDistance = Math.abs(disc.layer - (focusIndex + focusProgress)) / layers.length;
      const focusFactor = Math.max(0, 1 - focusDistance * 4);

      // Size & softness based on focus
      const scale = focusFactor * 2.2 + 0.3;
      const currentRadius = disc.radius * scale;

      // Sharpen into polygon when in focus
      const sharpness = focusFactor ** 4;
      const sides = Math.round(disc.sides + 2 * sharpness);

      // Glow intensity
      const glow = 0.3 + focusFactor * 0.7;

      // Pick color with accent blending
      const baseColor = palette[(disc.layer + Math.floor(time / 1000)) % palette.length];
      const altColor = palette[(disc.layer + 1) % palette.length];
      const colorBlend = Math.sin(time * 0.0005 + disc.pulse) * 0.5 + 0.5;
      const mixed = blend(baseColor, altColor, colorBlend);

      ctx.save();
      ctx.translate(disc.x, disc.y);
      ctx.rotate(disc.pulse + time * 0.0002);

      if (sharpness > 0.7 && currentRadius > 6) {
        // Polygonal aperture shape
        const pts = [];
        for (let i = 0; i < sides; i++) {
          const angle = (i / sides) * Math.PI * 2;
          const r1 = currentRadius;
          const r2 = currentRadius * (0.8 + Math.sin(time * 0.001 + i) * 0.05);
          pts.push([
            Math.cos(angle) * r1,
            Math.sin(angle) * r1
          ]);
          if (i % 2 === 0 && r2 !== r1) {
            const midAngle = angle + Math.PI / sides;
            pts.push([
              Math.cos(midAngle) * r2,
              Math.sin(midAngle) * r2
            ]);
          }
        }

        const grad = ctx.createRadialGradient(
          0, 0, currentRadius * 0.1,
          0, 0, currentRadius * 1.2
        );
        grad.addColorStop(0, `rgba(${mixed[0]},${mixed[1]},${mixed[2]},${glow})`);
        grad.addColorStop(1, `rgba(${mixed[0]},${mixed[1]},${mixed[2]},0)`);
        ctx.fillStyle = grad;

        ctx.beginPath();
        if (pts.length > 0) {
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) {
            ctx.lineTo(pts[i][0], pts[i][1]);
          }
        }
        ctx.closePath();
        ctx.fill();
      } else {
        // Soft circular bokeh with blur
        const blurRadius = currentRadius * (1 - focusFactor) * 0.5 + 4;
        ctx.filter = `blur(${blurRadius}px)`;
        const grad = ctx.createRadialGradient(
          0, 0, 0,
          0, 0, currentRadius
        );
        grad.addColorStop(0, `rgba(${mixed[0]},${mixed[1]},${mixed[2]},${glow})`);
        grad.addColorStop(1, `rgba(${mixed[0]},${mixed[1]},${mixed[2]},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.filter = 'none';
      }

      ctx.restore();
    });

    requestAnimationFrame(animate);
  }

  animate(0);
})();
</script>
</body>
</html>
