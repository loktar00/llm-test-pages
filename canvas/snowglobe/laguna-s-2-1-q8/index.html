<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Snow Globe</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
(() => {
  const canvas = document.getElementById('g');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  const resize = () => {
    dpr = window.devicePixelRatio || 1;
    W = canvas.width = window.innerWidth * dpr;
    H = canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
  };
  window.addEventListener('resize', resize);
  resize();

  const globeR = Math.min(W, H) * 0.42;
  const centerX = W / 2;
  const baseY = H * 0.78;
  const topY = baseY - globeR * 2;

  // Pine tree
  function drawPine(ctx, x, y, scale, lit) {
    const h = 60 * scale;
    const w = 30 * scale;
    ctx.fillStyle = lit ? '#2e8b57' : '#228b22';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - w, y + h * 0.6);
    ctx.lineTo(x + w, y + h * 0.6);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = lit ? '#006400' : '#006400';
    for (let i = 0; i < 4; i++) {
      const ty = y + h * 0.2 + i * h * 0.18;
      ctx.beginPath();
      ctx.moveTo(x, ty);
      ctx.lineTo(x - w * (1 - i * 0.15), ty + h * 0.2);
      ctx.lineTo(x + w * (1 - i * 0.15), ty + h * 0.2);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = '#8b4513';
    ctx.fillRect(x - w * 0.2, y + h * 0.6, w * 0.4, h * 0.4);
  }

  // Cabin
  function drawCabin(ctx, x, y, scale, lit) {
    const w = 40 * scale;
    const h = 35 * scale;
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(x, y, w, h);

    // Roof
    ctx.fillStyle = '#5d2906';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w / 2, y - h * 0.4);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fill();

    // Window
    if (lit) {
      ctx.fillStyle = '#ffff99';
      ctx.fillRect(x + w * 0.15, y + h * 0.2, w * 0.25, h * 0.25);
      ctx.fillRect(x + w * 0.6, y + h * 0.2, w * 0.25, h * 0.25);
    } else {
      ctx.fillStyle = '#333';
      ctx.fillRect(x + w * 0.15, y + h * 0.2, w * 0.25, h * 0.25);
      ctx.fillRect(x + w * 0.6, y + h * 0.2, w * 0.25, h * 0.25);
    }
  }

  // Scene layout
  const scene = [];
  function buildScene() {
    scene.length = 0;
    const r = globeR * 0.9;
    const cx = centerX;
    const cy = (topY + baseY) / 2;
    const treeCount = 8;
    const cabinCount = 4;
    for (let i = 0; i < treeCount; i++) {
      const angle = (i / treeCount) * Math.PI;
      const radius = r * 0.7;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius * 0.5;
      scene.push({ type: 'tree', x, y, scale: 0.7 + Math.random() * 0.3 });
    }
    for (let i = 0; i < cabinCount; i++) {
      const angle = ((i + 0.5) / cabinCount) * Math.PI;
      const radius = r * 0.85;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius * 0.4 + globeR * 0.3;
      scene.push({ type: 'cabin', x, y, scale: 0.7 + Math.random() * 0.3 });
    }
  }
  buildScene();

  // Snow particles
  const snow = [];
  const particleCount = 1200;
  for (let i = 0; i < particleCount; i++) {
    snow.push({
      x: Math.random(),
      y: Math.random(),
      vx: 0,
      vy: 0,
      r: 1 + Math.random() * 2,
      settled: false,
      ox: 0, oy: 0
    });
  }

  let shakeTimer = 0;
  let isShaking = false;
  let shakeTime = 0;

  function shakeGlobe() {
    isShaking = true;
    shakeTime = 0;
    for (const p of snow) {
      p.settled = false;
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 3;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
    }
  }

  // Lighting timer
  let flickerTimer = 0;

  function insideSphere(x, y) {
    const cx = centerX;
    const cy = (topY + baseY) / 2;
    const dx = x - cx;
    const dy = y - cy;
    return dx * dx + dy * dy <= globeR * globeR;
  }

  function animate() {
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, W, H);

    // Clear with black
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Sky / environment reflection gradient inside globe
    const grad = ctx.createRadialGradient(centerX, topY + globeR * 0.5, globeR * 0.1, centerX, baseY, globeR);
    grad.addColorStop(0, '#2a52be');
    grad.addColorStop(1, '#0a2a66');
    ctx.fillStyle = grad;
    ctx.save();
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillRect(centerX - globeR, topY, globeR * 2, globeR * 2);
    ctx.restore();

    // Draw glass sphere
    ctx.save();
    ctx.translate(centerX, 0);
    ctx.scale(1, 1);
    ctx.beginPath();
    ctx.arc(0, topY + globeR, globeR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.restore();

    // Draw scene items (trees and cabins)
    for (const item of scene) {
      const lit = Math.random() > 0.5; // flicker
      if (item.type === 'tree') drawPine(ctx, item.x, item.y, item.scale, lit);
      else drawCabin(ctx, item.x, item.y, item.scale, lit);
    }

    // Update shake timer
    shakeTimer += 1 / 60;
    if (shakeTimer >= 20 && !isShaking) {
      shakeGlobe();
      shakeTimer = 0;
    }

    if (isShaking) {
      shakeTime += 1 / 60;
      if (shakeTime >= 2.5) {
        isShaking = false;
      }
    }

    // Update and draw snow
    const gravity = 0.3;
    const globeCX = centerX;
    const globeCY = (topY + baseY) / 2;

    for (const p of snow) {
      if (p.settled) continue;

      if (isShaking) {
        // Swirling motion during shake
        const swirlAngle = shakeTime * 4;
        const radius = 5 + Math.sin(shakeTime) * 3;
        p.vx += Math.cos(swirlAngle) * 0.1;
        p.vy += Math.sin(swirlAngle) * 0.1;
      } else {
        // Apply gravity toward bottom-center
        p.vx += (p.x - (centerX + Math.sin(shakeTimer) * 2)) * 0.0005;
        p.vy += gravity;
      }

      p.vx *= 0.95;
      p.vy *= 0.95;

      p.x += p.vx;
      p.y += p.vy;

      // Refract / wrap around glass edge
      const dx = p.x - globeCX;
      const dy = p.y - globeCY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > globeR - p.r) {
        // Reflect inward slightly
        const nx = dx / dist;
        const ny = dy / dist;
        const dot = p.vx * nx + p.vy * ny;
        if (dot > 0) {
          p.vx -= dot * nx * 1.2;
          p.vy -= dot * ny * 1.2;
        }
        // Keep inside
        p.x = globeCX + nx * (globeR - p.r);
        p.y = globeCY + ny * (globeR - p.r);
      }

      // Settle if near bottom
      if (!isShaking && p.vy < 0.5 && p.y > baseY - globeR * 0.6) {
        const settleSpeed = Math.abs(p.vx) + Math.abs(p.vy);
        if (settleSpeed < 2.5) {
          // Raycast down to find surface
          let foundY = baseY;
          for (const item of scene) {
            if (Math.abs(p.x - item.x) < 30 * item.scale) {
              foundY = Math.min(foundY, item.y + 10 * item.scale);
            }
          }
          p.y = foundY - p.r;
          p.vx *= 0.5;
          p.vy *= 0.5;
          if (Math.abs(p.vx) < 0.1) {
            p.settled = true;
          }
        }
      }
    }

    // Draw snow
    ctx.fillStyle = '#ffffff';
    for (const p of snow) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  animate();
})();
</script>
</body>
</html>
