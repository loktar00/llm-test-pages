<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        :root {
            --bg-deep: #0b0d17;
            --bg-surface: #151930;
            --text-main: #ffffff;
            --text-muted: #8d99ae;
            --accent-glow: #fdfd96;
            --accent-blue: #4cc9f0;
            --moon-color: #e0e1dd;
            --crater-color: #c4c5c2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 50%, #1b1e35 0%, #0b0d17 100%);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Starry Background --- */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 4px white; }
        }

        /* --- Main Layout --- */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- Typography & Visuals --- */
        .headline-wrapper {
            font-size: clamp(6rem, 20vw, 14rem);
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            position: relative;
            user-select: none;
        }

        .digit {
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transition: text-shadow 0.3s ease;
        }

        /* Soft breathing glow */
        .headline-wrapper:hover .digit {
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.4), 0 0 80px rgba(76, 201, 240, 0.2);
        }

        .digit.animate-glow {
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.1); color: var(--text-main); }
            50% { text-shadow: 0 0 35px rgba(255, 255, 255, 0.3), 0 0 60px rgba(255, 253, 150, 0.2); color: #fff; }
        }

        /* --- The Moon Zero --- */
        .zero-wrapper {
            position: relative;
            width: 0.85em;
            height: 0.85em;
            border-radius: 50%;
            background: var(--moon-color);
            box-shadow: inset -20px -20px 40px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.1);
            overflow: hidden; /* Clip the satellite if it goes outside */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 5px; /* Spacing between 4 and Moon */
        }

        /* Moon Craters */
        .crater {
            position: absolute;
            background: var(--crater-color);
            border-radius: 50%;
            opacity: 0.4;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }
        .c1 { width: 30%; height: 30%; top: 20%; left: 20%; }
        .c2 { width: 15%; height: 15%; top: 60%; left: 60%; }
        .c3 { width: 20%; height: 20%; top: 50%; left: 15%; }
        .c4 { width: 10%; height: 10%; top: 25%; left: 70%; }

        /* --- Orbit System --- */
        .orbit-system {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160%; /* Make orbit bigger than the moon */
            height: 160%;
            transform: translate(-50%, -50%);
            animation: orbit 10s linear infinite;
            pointer-events: none;
        }

        @keyframes orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .satellite {
            position: absolute;
            top: 0;
            left: 50%;
            width: 10px;
            height: 10px;
            background: var(--accent-blue);
            border-radius: 2px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--accent-blue);
        }

        /* Counter-rotate satellite so it stays upright */
        .satellite-inner {
            width: 100%;
            height: 100%;
            position: relative;
            animation: counter-orbit 10s linear infinite;
        }

        @keyframes counter-orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Satellite antenna */
        .satellite-inner::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            width: 1px;
            height: 6px;
            background: #ccc;
            transform: translateX(-50%);
        }
        .satellite-inner::after {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            width: 3px;
            height: 3px;
            background: red;
            border-radius: 50%;
            transform: translateX(-50%);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* --- Text Content --- */
        .message {
            margin-bottom: 3rem;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Button --- */
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Glint Effect */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
            transition: left 0.7s ease-in-out;
        }

    </style>
</head>
<body>

    <!-- Starry Background Generated via JS -->
    <div class="stars-container" id="stars"></div>

    <div class="container">
        <div class="headline-wrapper">
            <span class="digit">4</span>
            <div class="zero-wrapper">
                <!-- Moon texture -->
                <div class="crater c1"></div>
                <div class="crater c2"></div>
                <div class="crater c3"></div>
                <div class="crater c4"></div>
                
                <!-- Orbit Animation -->
                <div class="orbit-system">
                    <div class="satellite">
                        <div class="satellite-inner"></div>
                    </div>
                </div>
            </div>
            <span class="digit">4</span>
        </div>

        <div class="message">
            <h2>Oops!</h2>
            <p>Page not found</p>
        </div>

        <a href="/" class="btn">Take me home</a>
    </div>

    <script>
        // Generate random stars
        const starContainer = document.getElementById('stars');
        const starCount = 150;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // Random position
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            
            // Random size (tiny to medium)
            const size = Math.random() * 2.5 + 1;
            
            // Random animation duration
            const duration = Math.random() * 3 + 2; // 2s to 5s
            
            // Random delay
            const delay = Math.random() * 5;

            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--duration', `${duration}s`);
            star.style.setProperty('--delay', `${delay}s`);

            starContainer.appendChild(star);
        }
    </script>
</body>
</html>
