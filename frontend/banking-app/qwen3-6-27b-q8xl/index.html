<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Banking UI</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --bg-body: #E5E7EB;
            --bg-app: #F9FAFB;
            --text-main: #111827;
            --text-sub: #6B7280;
            --success: #10B981;
            --danger: #EF4444;
            --card-radius: 24px;
            --phone-width: 375px;
            --phone-height: 812px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Phone Frame */
        .phone-frame {
            width: var(--phone-width);
            height: var(--phone-height);
            background: #000;
            border-radius: 45px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .phone-screen {
            background: var(--bg-app);
            width: 100%;
            height: 100%;
            border-radius: 35px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar Mock */
        .status-bar {
            height: 44px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            z-index: 10;
        }

        /* Scrollable Content */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for bottom nav */
            scrollbar-width: none; /* Firefox */
        }
        .app-content::-webkit-scrollbar { display: none; }

        /* Header & Balance */
        .header {
            padding: 10px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-greeting h2 {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 500;
        }
        .user-greeting h1 {
            font-size: 20px;
            color: var(--text-main);
            margin-top: 2px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #E0E7FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: bold;
        }

        .balance-section {
            text-align: center;
            padding: 10px 0 30px;
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -1px;
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: color 0.3s;
        }

        .eye-toggle {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: var(--text-sub);
        }

        /* Cards Section */
        .cards-wrapper {
            padding: 10px 0 20px 24px;
            position: relative;
        }

        .cards-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-right: 24px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .cards-scroll::-webkit-scrollbar { display: none; }

        .card {
            flex: 0 0 280px;
            height: 170px;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            scroll-snap-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-1 { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); }
        .card-2 { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); }
        .card-3 { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }

        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            opacity: 0.9;
        }

        .card-chip {
            width: 30px;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.4);
        }

        .card-number {
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-holder {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .card-balance {
            font-weight: 600;
            font-size: 16px;
        }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 15px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #D1D5DB;
            transition: all 0.3s ease;
        }
        .dot.active {
            background: var(--primary);
            width: 18px;
            border-radius: 4px;
        }

        /* Quick Actions */
        .actions-row {
            display: flex;
            justify-content: space-around;
            padding: 10px 24px;
            margin-bottom: 20px;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: none;
            background: none;
            cursor: pointer;
        }

        .action-icon {
            width: 56px;
            height: 56px;
            border-radius: 20px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-btn:active .action-icon {
            transform: scale(0.95);
        }

        .action-icon svg {
            width: 24px;
            height: 24px;
            stroke: var(--primary);
        }

        .action-label {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* Transactions */
        .transactions-section {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            min-height: 300px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .see-all {
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 16px;
            transition: background 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .transaction-item:hover {
            background: #F9FAFB;
        }

        .transaction-item.expanded {
            background: #F3F4F6;
            border-color: #E5E7EB;
        }

        .t-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .t-icon svg {
            width: 22px;
            height: 22px;
        }

        /* Category Colors */
        .cat-shopping { background: #FEF3C7; color: #D97706; }
        .cat-food { background: #FEE2E2; color: #DC2626; }
        .cat-tech { background: #DBEAFE; color: #2563EB; }
        .cat-income { background: #D1FAE5; color: #059669; }

        .t-details {
            flex: 1;
        }

        .t-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .t-date {
            font-size: 12px;
            color: var(--text-sub);
        }

        .t-amount {
            font-size: 15px;
            font-weight: 700;
        }

        .amount-plus { color: var(--success); }
        .amount-minus { color: var(--text-main); }

        /* Expanded Details */
        .t-expanded-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease;
            opacity: 0;
            margin-top: 0;
        }

        .transaction-item.expanded .t-expanded-content {
            max-height: 100px;
            opacity: 1;
            margin-top: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .detail-val {
            font-weight: 500;
            color: var(--text-main);
        }

        /* Bottom Nav Mock */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #F3F4F6;
            padding-bottom: 20px; /* Safe area */
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #9CA3AF;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-screen">
            <!-- Status Bar -->
            <div class="status-bar">
                <span>9:41</span>
                <div style="display: flex; gap: 6px;">
                    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M1 11V1h16v10H1z"/></svg>
                    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M14 0H2C0.9 0 0 0.9 0 2v8c0 1.1 0.9 2 2 2h12c1.1 0 2-0.9 2-2V2c0-1.1-0.9-2-2-2zm-2 10H4V2h8v8z"/></svg>
                </div>
            </div>

            <div class="app-content">
                <!-- Header -->
                <div class="header">
                    <div class="user-greeting">
                        <h2>Good Morning,</h2>
                        <h1>Alex Johnson</h1>
                    </div>
                    <div class="avatar">AJ</div>
                </div>

                <!-- Balance -->
                <div class="balance-section">
                    <div class="balance-label">Total Balance</div>
                    <div class="balance-amount" id="balanceDisplay">
                        $12,450.00
                        <button class="eye-toggle" id="eyeToggle" aria-label="Toggle visibility">
                            <!-- Eye Icon -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <!-- Cards -->
                <div class="cards-wrapper">
                    <div class="cards-scroll" id="cardsScroll">
                        <!-- Card 1 -->
                        <div class="card card-1">
                            <div class="card-top">
                                <span>Platinum</span>
                                <div class="card-chip"></div>
                            </div>
                            <div class="card-number">**** **** **** 4290</div>
                            <div class="card-bottom">
                                <div class="card-holder">Alex Johnson</div>
                                <div class="card-balance">$8,200.00</div>
                            </div>
                        </div>
                        <!-- Card 2 -->
                        <div class="card card-2">
                            <div class="card-top">
                                <span>Savings</span>
                                <div class="card-chip"></div>
                            </div>
                            <div class="card-number">**** **** **** 8821</div>
                            <div class="card-bottom">
                                <div class="card-holder">Alex Johnson</div>
                                <div class="card-balance">$4,250.00</div>
                            </div>
                        </div>
                        <!-- Card 3 -->
                        <div class="card card-3">
                            <div class="card-top">
                                <span>Credit</span>
                                <div class="card-chip"></div>
                            </div>
                            <div class="card-number">**** **** **** 1102</div>
                            <div class="card-bottom">
                                <div class="card-holder">Alex Johnson</div>
                                <div class="card-balance">$0.00</div>
                            </div>
                        </div>
                    </div>
                    <!-- Indicators -->
                    <div class="dots-container" id="dotsContainer">
                        <div class="dot active"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="actions-row">
                    <button class="action-btn">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </div>
                        <span class="action-label">Add Cash</span>
                    </button>
                    <button class="action-btn">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <span class="action-label">Transfer</span>
                    </button>
                    <button class="action-btn">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                        </div>
                        <span class="action-label">Pay</span>
                    </button>
                    <button class="action-btn">
                        <div class="action-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        </div>
                        <span class="action-label">More</span>
                    </button>
                </div>

                <!-- Transactions -->
                <div class="transactions-section">
                    <div class="section-header">
                        <span class="section-title">Recent Transactions</span>
                        <a href="#" class="see-all">See All</a>
                    </div>
                    
                    <div class="transaction-list" id="transactionList">
                        <!-- Items injected via JS -->
                    </div>
                </div>
            </div>

            <!-- Bottom Nav -->
            <div class="bottom-nav">
                <div class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data
        const transactions = [
            {
                id: 1,
                name: 'Apple Store',
                date: 'Today, 10:42 AM',
                amount: -999.00,
                type: 'debit',
                category: 'tech',
                details: { status: 'Completed', card: '•••• 4290', merchant: 'Apple Retail' }
            },
            {
                id: 2,
                name: 'Freelance Payment',
                date: 'Yesterday',
                amount: 1250.00,
                type: 'credit',
                category: 'income',
                details: { status: 'Received', card: 'Bank Transfer', merchant: 'Design Studio Inc.' }
            },
            {
                id: 3,
                name: 'Uber Eats',
                date: 'Oct 24, 8:30 PM',
                amount: -24.50,
                type: 'debit',
                category: 'food',
                details: { status: 'Completed', card: '•••• 4290', merchant: 'Uber Technologies' }
            },
            {
                id: 4,
                name: 'Zara',
                date: 'Oct 22, 2:15 PM',
                amount: -145.00,
                type: 'debit',
                category: 'shopping',
                details: { status: 'Pending', card: '•••• 8821', merchant: 'Zara Store' }
            }
        ];

        // Icons
        const icons = {
            tech: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
            income: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`,
            food: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>`,
            shopping: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>`
        };

        // Render Transactions
        const listContainer = document.getElementById('transactionList');

        transactions.forEach(t => {
            const isPlus = t.amount > 0;
            const formattedAmount = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(t.amount);
            
            const item = document.createElement('div');
            item.className = 'transaction-item';
            item.innerHTML = `
                <div class="t-icon cat-${t.category}">
                    ${icons[t.category]}
                </div>
                <div class="t-details">
                    <div class="t-name">${t.name}</div>
                    <div class="t-date">${t.date}</div>
                    <div class="t-expanded-content">
                        <div class="detail-row"><span>Status:</span> <span class="detail-val">${t.details.status}</span></div>
                        <div class="detail-row"><span>Merchant:</span> <span class="detail-val">${t.details.merchant}</span></div>
                    </div>
                </div>
                <div class="t-amount ${isPlus ? 'amount-plus' : 'amount-minus'}">
                    ${isPlus ? '+' : ''}${formattedAmount}
                </div>
            `;

            // Expand Logic
            item.addEventListener('click', () => {
                const isExpanded = item.classList.contains('expanded');
                // Close all others
                document.querySelectorAll('.transaction-item').forEach(el => el.classList.remove('expanded'));
                
                if (!isExpanded) {
                    item.classList.add('expanded');
                }
            });

            listContainer.appendChild(item);
        });

        // Balance Toggle Logic
        const eyeBtn = document.getElementById('eyeToggle');
        const balanceDisplay = document.getElementById('balanceDisplay');
        let isMasked = false;
        const originalText = "$12,450.00";

        eyeBtn.addEventListener('click', () => {
            isMasked = !isMasked;
            if (isMasked) {
                // Save text, replace with dots
                balanceDisplay.dataset.real = originalText;
                // Keep button in place
                const btnSvg = eyeBtn.innerHTML;
                balanceDisplay.innerHTML = "••••••••";
                // Re-append button
                const newBtn = document.createElement('button');
                newBtn.className = 'eye-toggle';
                newBtn.innerHTML = btnSvg;
                newBtn.onclick = eyeBtn.onclick; // copy listener
                balanceDisplay.appendChild(newBtn);
            } else {
                // Restore
                balanceDisplay.innerHTML = originalText;
                const newBtn = document.createElement('button');
                newBtn.className = 'eye-toggle';
                newBtn.innerHTML = eyeBtn.innerHTML;
                newBtn.onclick = eyeBtn.onclick;
                balanceDisplay.appendChild(newBtn);
            }
        });

        // Scroll Snap Logic
        const scrollContainer = document.getElementById('cardsScroll');
        const dots = document.querySelectorAll('.dot');
        const cards = document.querySelectorAll('.card');

        scrollContainer.addEventListener('scroll', () => {
            const scrollLeft = scrollContainer.scrollLeft;
            const cardWidth = cards[0].offsetWidth + 16; // width + gap
            const index = Math.round(scrollLeft / cardWidth);

            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        });

    </script>
</body>
</html>
