<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Grid</title>
    <style>
        :root {
            --bg: #0f0f11;
            --surface: #1a1a1d;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #6c5ce7;
            --radius: 12px;
            --transition-speed: 0.4s;
            --ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 4rem 2rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* --- Filter Section --- */
        .filter-wrapper {
            position: relative;
            display: inline-flex;
            background: var(--surface);
            padding: 6px;
            border-radius: 50px;
            margin-bottom: 3rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: color 0.3s ease;
            outline: none;
        }

        .filter-btn.active {
            color: var(--text-main);
        }

        .slider {
            position: absolute;
            top: 6px;
            left: 6px;
            height: calc(100% - 12px);
            background-color: var(--accent);
            border-radius: 40px;
            z-index: 1;
            transition: transform 0.4s var(--ease), width 0.4s var(--ease);
            box-shadow: 0 2px 10px rgba(108, 92, 231, 0.4);
        }

        /* --- Grid Section --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            perspective: 1000px;
        }

        /* --- Card Styles --- */
        .card {
            position: relative;
            aspect-ratio: 4/3;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            opacity: 1;
            transform: scale(1);
            transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
            will-change: transform, opacity;
        }

        .card.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        /* Gradient Backgrounds */
        .card-bg {
            position: absolute;
            inset: 0;
            transition: transform 0.6s var(--ease);
        }

        .card:hover .card-bg {
            transform: scale(1.1);
        }

        /* Overlay */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .card-content {
            transform: translateY(20px);
            transition: transform 0.5s var(--ease);
        }

        .card:hover .card-content {
            transform: translateY(0);
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ccc;
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease 0.1s; /* Slight delay */
        }

        .card:hover .card-category {
            opacity: 1;
            transform: translateY(0);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            color: #fff;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s ease 0.15s; /* Slight delay */
        }

        .card:hover .card-title {
            opacity: 1;
            transform: translateY(0);
        }

        /* Unique Gradients for visual variety */
        .g-1 { background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
        .g-2 { background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%); }
        .g-3 { background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); }
        .g-4 { background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%); }
        .g-5 { background: linear-gradient(to top, #30cfd0 0%, #330867 100%); }
        .g-6 { background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%); }
        .g-7 { background: linear-gradient(to top, #d9afd9 0%, #97d9e1 100%); }
        .g-8 { background: linear-gradient(to right, #667eea 0%, #764ba2 100%); }
        .g-9 { background: linear-gradient(to top, #c471f5 0%, #fa71cd 100%); }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- Filter Navigation -->
        <div class="filter-wrapper" id="filterContainer">
            <div class="slider" id="slider"></div>
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="web">Web</button>
            <button class="filter-btn" data-filter="brand">Brand</button>
            <button class="filter-btn" data-filter="motion">Motion</button>
        </div>

        <!-- Project Grid -->
        <div class="grid" id="grid">
            <!-- Items injected via JS for cleaner code, but could be static HTML -->
        </div>

    </div>

    <script>
        // Data for the portfolio items
        const projects = [
            { title: "Lumina Dashboard", category: "Web", gradient: "g-1" },
            { title: "Apex Identity", category: "Brand", gradient: "g-2" },
            { title: "Flow UI Kit", category: "Motion", gradient: "g-3" },
            { title: "Nebula Commerce", category: "Web", gradient: "g-4" },
            { title: "Echo Sounds", category: "Brand", gradient: "g-5" },
            { title: "Kinetic Type", category: "Motion", gradient: "g-6" },
            { title: "Solaris App", category: "Web", gradient: "g-7" },
            { title: "Vortex Rebrand", category: "Brand", gradient: "g-8" },
            { title: "Micro-Interactions", category: "Motion", gradient: "g-9" }
        ];

        const grid = document.getElementById('grid');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const slider = document.getElementById('slider');

        // Initialize Grid
        function initGrid() {
            projects.forEach((project, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.category = project.category.toLowerCase();
                
                // Staggered load animation
                card.style.transitionDelay = `${index * 50}ms`;

                card.innerHTML = `
                    <div class="card-bg ${project.gradient}"></div>
                    <div class="card-overlay">
                        <div class="card-content">
                            <div class="card-category">${project.category}</div>
                            <h3 class="card-title">${project.title}</h3>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // Set initial slider position to first button
            updateSlider(filterBtns[0]);
        }

        // Slider Movement Logic
        function updateSlider(btn) {
            const btnRect = btn.getBoundingClientRect();
            const containerRect = btn.parentElement.getBoundingClientRect();
            
            const left = btnRect.left - containerRect.left;
            
            slider.style.width = `${btnRect.width}px`;
            slider.style.transform = `translateX(${left}px)`;
        }

        // Filtering Logic
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // 1. Handle Active State & Slider
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                updateSlider(e.target);

                // 2. Filter Cards
                const filterValue = e.target.dataset.filter;
                const cards = document.querySelectorAll('.card');

                cards.forEach(card => {
                    const category = card.dataset.category;
                    
                    if (filterValue === 'all' || category === filterValue) {
                        // Show
                        card.classList.remove('hidden');
                    } else {
                        // Hide
                        card.classList.add('hidden');
                    }
                });
            });
        });

        // Run
        initGrid();

        // Handle Window Resize to keep slider accurate
        window.addEventListener('resize', () => {
            const activeBtn = document.querySelector('.filter-btn.active');
            if(activeBtn) updateSlider(activeBtn);
        });

    </script>
</body>
</html>
