<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheepdog Trials</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Wear map
const WCELL = 12;
let wearMap, wearCols, wearRows;
function initWearMap() {
  wearCols = Math.ceil(W / WCELL) + 2;
  wearRows = Math.ceil(H / WCELL) + 2;
  wearMap = new Float32Array(wearCols * wearRows);
}
initWearMap();
window.addEventListener('resize', initWearMap);

function updateWear(x, y, amount) {
  const gx = Math.floor(x / WCELL);
  const gy = Math.floor(y / WCELL);
  if (gx >= 0 && gx < wearCols && gy >= 0 && gy < wearRows) {
    wearMap[gy * wearCols + gx] = Math.min(1, wearMap[gy * wearCols + gx] + amount);
  }
}

// Utility
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

// Sheep
const NUM_SHEEP = randInt(35, 50);
let sheep = [];

function createSheep(x, y) {
  return {
    x, y,
    vx: rand(-1, 1), vy: rand(-1, 1),
    angle: rand(0, Math.PI * 2),
    radius: 6 + rand(0, 3),
    panicTimer: 0,
    penned: false,
    wobble: rand(0, Math.PI * 2),
    speed: 0
  };
}

function initSheep() {
  sheep = [];
  for (let i = 0; i < NUM_SHEEP; i++) {
    sheep.push(createSheep(rand(W * 0.15, W * 0.35), rand(H * 0.3, H * 0.7)));
  }
}

// Gates and pen
let gates = [];
let pen = null;
let currentGateIndex = 0;
let celebrationTimer = 0;
let celebrationParticles = [];

function generateCourse() {
  gates = [];
  currentGateIndex = 0;
  celebrationTimer = 0;
  celebrationParticles = [];

  const margin = 60;
  const gateGap = 80 + rand(0, 40);
  const numGates = randInt(3, 5);

  // Start area: left side
  let prevX = W * 0.2;
  let prevY = H * 0.5;

  for (let i = 0; i < numGates; i++) {
    const t = (i + 1) / (numGates + 1);
    const gx = lerp(W * 0.2, W * 0.85, t);
    const gy = H * 0.2 + Math.sin(t * Math.PI * 2 + i) * H * 0.25;

    const angle = Math.atan2(gy - prevY, gx - prevX) + Math.PI / 2;
    const halfGap = gateGap / 2;

    gates.push({
      x1: gx + Math.cos(angle) * halfGap,
      y1: gy + Math.sin(angle) * halfGap,
      x2: gx - Math.cos(angle) * halfGap,
      y2: gy - Math.sin(angle) * halfGap,
      cx: gx, cy: gy,
      gap: gateGap,
      angle: Math.atan2(gy - prevY, gx - prevX),
      passed: false
    });

    prevX = gx;
    prevY = gy;
  }

  // Pen at the end
  const penX = W * 0.9;
  const penY = H * 0.5;
  const penW = 100 + rand(0, 40);
  const penH = 140 + rand(0, 60);
  pen = { x: penX, y: penY, w: penW, h: penH };

  // Place sheep near start
  initSheep();
}

// Dog
let dog = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  angle: 0,
  state: 'approach',
  targetX: 0, targetY: 0,
  circleAngle: 0,
  tailWag: 0,
  earTwitch: 0
};

function initDog() {
  dog.x = W * 0.1;
  dog.y = H * 0.5;
  dog.vx = 0; dog.vy = 0;
  dog.state = 'approach';
}

// Flocking
function getFlockCenter() {
  let cx = 0, cy = 0, count = 0;
  for (const s of sheep) {
    if (!s.penned) { cx += s.x; cy += s.y; count++; }
  }
  return count > 0 ? { x: cx / count, y: cy / count } : { x: W / 2, y: H / 2 };
}

function updateSheep(dt) {
  const center = getFlockCenter();
  const dogDist = dist(dog, center);

  for (const s of sheep) {
    if (s.penned) {
      // Wander in pen
      s.vx += rand(-0.3, 0.3);
      s.vy += rand(-0.3, 0.3);
      s.vx *= 0.95;
      s.vy *= 0.95;
      s.x += s.vx;
      s.y += s.vy;
      // Keep in pen
      s.x = clamp(s.x, pen.x - pen.w / 2 + s.radius, pen.x + pen.w / 2 - s.radius);
      s.y = clamp(s.y, pen.y - pen.h / 2 + s.radius, pen.y + pen.h / 2 - s.radius);
      continue;
    }

    let fx = 0, fy = 0;

    // Flocking forces
    let cohX = 0, cohY = 0, cohCount = 0;
    let sepX = 0, sepY = 0;
    let aliVx = 0, aliVy = 0, aliCount = 0;

    for (const o of sheep) {
      if (o === s || o.penned) continue;
      const d = dist(s, o);
      if (d < 150) {
        cohX += o.x; cohY += o.y; cohCount++;
        aliVx += o.vx; aliVy += o.vy; aliCount++;
        if (d < 25) {
          const push = (25 - d) / 25;
          sepX += (s.x - o.x) / d * push;
          sepY += (s.y - o.y) / d * push;
        }
      }
    }

    if (cohCount > 0) {
      cohX /= cohCount; cohY /= cohCount;
      fx += (cohX - s.x) * 0.003;
      fy += (cohY - s.y) * 0.003;
    }

    if (aliCount > 0) {
      aliVx /= aliCount; aliVy /= aliCount;
      fx += (aliVx - s.vx) * 0.02;
      fy += (aliVy - s.vy) * 0.02;
    }

    fx += sepX * 0.5;
    fy += sepY * 0.5;

    // Fear of dog
    const dDist = dist(s, dog);
    const fearRadius = 120;
    if (dDist < fearRadius) {
      const fearStrength = (1 - dDist / fearRadius) * 2.5;
      const awayAngle = Math.atan2(s.y - dog.y, s.x - dog.x);
      fx += Math.cos(awayAngle) * fearStrength;
      fy += Math.sin(awayAngle) * fearStrength;
      s.panicTimer = Math.max(s.panicTimer, fearStrength * 10);
    }

    // Straggler panic
    const distToCenter = dist(s, center);
    if (distToCenter > 150 && dDist < 200) {
      s.panicTimer = Math.max(s.panicTimer, 30);
    }

    // Gate attraction
    if (currentGateIndex < gates.length) {
      const gate = gates[currentGateIndex];
      const gDist = dist(s, gate);
      if (gDist < 250) {
        fx += (gate.cx - s.x) * 0.002;
        fy += (gate.cy - s.y) * 0.002;
      }
    }

    // Pen attraction
    if (currentGateIndex >= gates.length && pen) {
      const pDist = dist(s, pen);
      fx += (pen.x - s.x) * 0.005;
      fy += (pen.y - s.y) * 0.005;
    }

    // Jostle
    s.wobble += 0.1;
    fx += Math.sin(s.wobble * 1.3 + s.x * 0.01) * 0.05;
    fy += Math.cos(s.wobble * 1.7 + s.y * 0.01) * 0.05;

    // Apply panic
    const panicMult = 1 + Math.max(0, s.panicTimer / 30) * 1.5;
    s.panicTimer = Math.max(0, s.panicTimer - dt * 60);

    s.vx += fx * panicMult;
    s.vy += fy * panicMult;

    const maxSpeed = 2.5 + Math.max(0, s.panicTimer / 30) * 3;
    const speed = Math.hypot(s.vx, s.vy);
    if (speed > maxSpeed) {
      s.vx = s.vx / speed * maxSpeed;
      s.vy = s.vy / speed * maxSpeed;
    }

    s.vx *= 0.92;
    s.vy *= 0.92;

    s.x += s.vx;
    s.y += s.vy;

    // Boundaries
    const b = 20;
    if (s.x < b) { s.x = b; s.vx *= -0.5; }
    if (s.x > W - b) { s.x = W - b; s.vx *= -0.5; }
    if (s.y < b) { s.y = b; s.vy *= -0.5; }
    if (s.y > H - b) { s.y = H - b; s.vy *= -0.5; }

    s.angle = Math.atan2(s.vy, s.vx);
    s.speed = speed;

    // Update wear
    updateWear(s.x, s.y, 0.002);

    // Check if passed through current gate
    if (currentGateIndex < gates.length) {
      const gate = gates[currentGateIndex];
      const gateDir = gate.angle;
      const perpX = Math.cos(gateDir + Math.PI / 2);
      const perpY = Math.sin(gateDir + Math.PI / 2);
      const proj = (s.x - gate.cx) * perpX + (s.y - gate.cy) * perpY;
      const along = (s.x - gate.cx) * Math.cos(gateDir) + (s.y - gate.cy) * Math.sin(gateDir);
      if (Math.abs(proj) < gate.gap / 2 && along > 10) {
        // Check if sheep was before gate and is now after
        if (!s._gatePassed) {
          s._gatePassed = true;
        }
      } else {
        s._gatePassed = false;
      }
    }

    // Check if penned
    if (pen && currentGateIndex >= gates.length) {
      if (s.x > pen.x - pen.w / 2 && s.x < pen.x + pen.w / 2 &&
          s.y > pen.y - pen.h / 2 && s.y < pen.y + pen.h / 2) {
        s.penned = true;
      }
    }
  }

  // Check gate progression
  if (currentGateIndex < gates.length) {
    let allPassed = true;
    for (const s of sheep) {
      if (!s.penned && !s._gatePassed) { allPassed = false; break; }
    }
    if (allPassed) {
      currentGateIndex++;
      for (const s of sheep) s._gatePassed = false;
    }
  }

  // Check all penned
  if (currentGateIndex >= gates.length) {
    let allPenned = true;
    for (const s of sheep) {
      if (!s.penned) { allPenned = false; break; }
    }
    if (allPenned && celebrationTimer === 0) {
      celebrationTimer = 180;
      // Spawn celebration particles
      for (let i = 0; i < 60; i++) {
        celebrationParticles.push({
          x: pen.x + rand(-50, 50),
          y: pen.y + rand(-50, 50),
          vx: rand(-3, 3), vy: rand(-5, -1),
          life: rand(60, 120),
          color: ['#FFD700', '#FF6B6B', '#4ECDC4', '#FFE66D', '#FF8C42'][randInt(0, 4)],
          size: rand(2, 5)
        });
      }
    }
  }
}

// Dog AI
function updateDog(dt) {
  const center = getFlockCenter();
  const remainingSheep = sheep.filter(s => !s.penned);
  const activeCount = remainingSheep.length;

  if (celebrationTimer > 0) {
    // Dog celebrates
    dog.tailWag += 0.3;
    dog.x = lerp(dog.x, pen.x - 80, 0.02);
    dog.y = lerp(dog.y, pen.y, 0.02);
    dog.angle = Math.atan2(pen.y - dog.y, pen.x - dog.x);
    return;
  }

  let targetX, targetY;
  const dogSpeed = 3.5;

  if (currentGateIndex < gates.length) {
    const gate = gates[currentGateIndex];
    const gateDir = gate.angle;

    // Dog should position behind the flock relative to the gate direction
    // to push sheep toward the gate
    const behindX = center.x - Math.cos(gateDir) * 100;
    const behindY = center.y - Math.sin(gateDir) * 100;

    // Check if flock is spread out
    let spread = 0;
    for (const s of remainingSheep) {
      spread += dist(s, center);
    }
    spread /= Math.max(1, activeCount);

    if (spread > 120) {
      // Circle to tighten flock
      dog.circleAngle += 0.03;
      const circleRadius = 80;
      targetX = center.x + Math.cos(dog.circleAngle) * circleRadius;
      targetY = center.y + Math.sin(dog.circleAngle) * circleRadius;
      dog.state = 'circle';
    } else {
      // Press: position behind flock and move toward it
      const pressDist = 60;
      targetX = center.x - Math.cos(gateDir) * pressDist;
      targetY = center.y - Math.sin(gateDir) * pressDist;
      dog.state = 'press';

      // Add slight lateral movement to push
      const time = Date.now() * 0.001;
      targetX += Math.cos(time * 1.5) * 30;
      targetY += Math.sin(time * 1.5) * 30;
    }

    // Check for stragglers
    let straggler = null;
    let maxDist = 0;
    for (const s of remainingSheep) {
      const d = dist(s, center);
      if (d > maxDist) { maxDist = d; straggler = s; }
    }

    if (straggler && maxDist > 180) {
      // Split: go toward straggler to herd it back
      const midX = (straggler.x + center.x) / 2;
      const midY = (straggler.y + center.y) / 2;
      targetX = midX - Math.cos(gateDir) * 40;
      targetY = midY - Math.sin(gateDir) * 40;
      dog.state = 'split';
    }
  } else {
    // Drive into pen
    if (pen && activeCount > 0) {
      const penDir = Math.atan2(pen.y - center.y, pen.x - center.x);
      targetX = center.x - Math.cos(penDir) * 80;
      targetY = center.y - Math.sin(penDir) * 80;
      dog.state = 'drive';

      // Herd stragglers
      let straggler = null;
      let maxDist = 0;
      for (const s of remainingSheep) {
        const d = dist(s, center);
        if (d > maxDist) { maxDist = d; straggler = s; }
      }
      if (straggler && maxDist > 100) {
        targetX = straggler.x - Math.cos(penDir) * 50;
        targetY = straggler.y - Math.sin(penDir) * 50;
      }
    }
  }

  // Move toward target
  const dx = targetX - dog.x;
  const dy = targetY - dog.y;
  const d = Math.hypot(dx, dy);

  if (d > 5) {
    const moveSpeed = Math.min(dogSpeed, d * 0.08);
    dog.vx += (dx / d) * moveSpeed * 0.15;
    dog.vy += (dy / d) * moveSpeed * 0.15;
  }

  dog.vx *= 0.88;
  dog.vy *= 0.88;
  dog.x += dog.vx;
  dog.y += dog.vy;

  // Boundaries
  dog.x = clamp(dog.x, 30, W - 30);
  dog.y = clamp(dog.y, 30, H - 30);

  dog.angle = Math.atan2(dog.vy, dog.vx);
  dog.tailWag += 0.15 + Math.hypot(dog.vx, dog.vy) * 0.05;
  dog.earTwitch += 0.05;

  updateWear(dog.x, dog.y, 0.001);
}

// Drawing
function drawGrass() {
  // Base grass
  ctx.fillStyle = '#3a7d32';
  ctx.fillRect(0, 0, W, H);

  // Wear map
  for (let gy = 0; gy < wearRows; gy++) {
    for (let gx = 0; gx < wearCols; gx++) {
      const wear = wearMap[gy * wearCols + gx];
      if (wear > 0.01) {
        const px = gx * WCELL;
        const py = gy * WCELL;
        const r = Math.floor(lerp(58, 139, wear));
        const g = Math.floor(lerp(125, 119, wear));
        const b = Math.floor(lerp(50, 80, wear));
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(px, py, WCELL, WCELL);
      }
    }
  }

  // Grass texture dots
  ctx.fillStyle = '#4a9d42';
  for (let i = 0; i < 300; i++) {
    const x = (i * 137.5) % W;
    const y = (i * 97.3) % H;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.fillStyle = '#2d6b28';
  for (let i = 0; i < 200; i++) {
    const x = (i * 211.7 + 50) % W;
    const y = (i * 163.1 + 30) % H;
    ctx.fillRect(x, y, 3, 3);
  }
}

function drawGates() {
  for (let i = 0; i < gates.length; i++) {
    const g = gates[i];
    const isActive = i === currentGateIndex;
    const isPassed = i < currentGateIndex;

    // Gate posts
    ctx.fillStyle = isPassed ? '#888' : isActive ? '#FFD700' : '#aaa';
    ctx.beginPath();
    ctx.arc(g.x1, g.y1, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(g.x2, g.y2, 5, 0, Math.PI * 2);
    ctx.fill();

    // Gate line
    ctx.strokeStyle = isPassed ? 'rgba(136,136,136,0.4)' : isActive ? 'rgba(255,215,0,0.6)' : 'rgba(170,170,170,0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(g.x1, g.y1);
    ctx.lineTo(g.x2, g.y2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Active gate glow
    if (isActive) {
      ctx.strokeStyle = 'rgba(255,215,0,0.15)';
      ctx.lineWidth = 30;
      ctx.beginPath();
      ctx.moveTo(g.x1, g.y1);
      ctx.lineTo(g.x2, g.y2);
      ctx.stroke();
    }
  }
}

function drawPen() {
  if (!pen) return;
  const allDone = currentGateIndex >= gates.length;

  ctx.strokeStyle = allDone ? '#FFD700' : '#888';
  ctx.lineWidth = 3;
  ctx.strokeRect(pen.x - pen.w / 2, pen.y - pen.h / 2, pen.w, pen.h);

  // Fill
  ctx.fillStyle = allDone ? 'rgba(255,215,0,0.1)' : 'rgba(100,100,100,0.1)';
  ctx.fillRect(pen.x - pen.w / 2, pen.y - pen.h / 2, pen.w, pen.h);

  // Pen label
  if (allDone) {
    ctx.fillStyle = 'rgba(255,215,0,0.3)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PEN', pen.x, pen.y + 5);
  }
}

function drawSheep(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.angle);

  const r = s.radius;
  const panic = Math.max(0, s.panicTimer / 30);

  // Body
  ctx.fillStyle = s.penned ? '#e8e8e0' : `rgb(${240 + panic * 15},${240 - panic * 20},${235 - panic * 20})`;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.4, r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wool texture
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.2, -r * 0.2, r * 0.5, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = s.penned ? '#d0d0c8' : '#f0f0e8';
  ctx.beginPath();
  ctx.ellipse(r * 1.1, 0, r * 0.5, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(r * 1.3, -r * 0.15, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(r * 1.3, r * 0.15, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Panic eyes
  if (panic > 0.5) {
    ctx.strokeStyle = '#f00';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(r * 1.3, -r * 0.15, 2.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(r * 1.3, r * 0.15, 2.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Legs (subtle)
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1.5;
  const legPhase = s.wobble * 2;
  const legOffset = s.speed > 0.3 ? Math.sin(legPhase) * 3 : 0;
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, r * 0.6);
  ctx.lineTo(-r * 0.5 + legOffset, r * 1.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(r * 0.3, r * 0.6);
  ctx.lineTo(r * 0.3 - legOffset, r * 1.2);
  ctx.stroke();

  ctx.restore();
}

function drawDog() {
  ctx.save();
  ctx.translate(dog.x, dog.y);
  ctx.rotate(dog.angle);

  const speed = Math.hypot(dog.vx, dog.vy);
  const r = 8;

  // Body
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 1.6, r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  // White markings
  ctx.fillStyle = '#f5f5f0';
  ctx.beginPath();
  ctx.ellipse(r * 0.2, 0, r * 0.6, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(r * 1.4, 0, r * 0.7, r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // White blaze
  ctx.fillStyle = '#f5f5f0';
  ctx.beginPath();
  ctx.ellipse(r * 1.5, 0, r * 0.3, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(r * 1.6, -r * 0.2, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(r * 1.6, r * 0.2, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(r * 1.7, -r * 0.2, 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(r * 1.7, r * 0.2, 1, 0, Math.PI * 2);
  ctx.fill();

  // Nose
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(r * 1.9, 0, 2, 1.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ears
  const earTwitch = Math.sin(dog.earTwitch * 3) * 0.1;
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(r * 1.0, -r * 0.7, 3, 5, -0.3 + earTwitch, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(r * 1.0, r * 0.7, 3, 5, 0.3 - earTwitch, 0, Math.PI * 2);
  ctx.fill();

  // Tail
  const tailWag = Math.sin(dog.tailWag) * 0.5;
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-r * 1.4, 0);
  ctx.quadraticCurveTo(-r * 2, -r * 0.5 + tailWag * 8, -r * 2.2, -r * 0.8 + tailWag * 12);
  ctx.stroke();

  // Legs
  const legPhase = dog.tailWag * 2;
  const legOff = speed > 0.3 ? Math.sin(legPhase) * 4 : 0;
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-r * 0.6, r * 0.7);
  ctx.lineTo(-r * 0.6 + legOff, r * 1.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(r * 0.5, r * 0.7);
  ctx.lineTo(r * 0.5 - legOff, r * 1.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-r * 0.6, -r * 0.7);
  ctx.lineTo(-r * 0.6 - legOff, -r * 1.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(r * 0.5, -r * 0.7);
  ctx.lineTo(r * 0.5 + legOff, -r * 1.4);
  ctx.stroke();

  ctx.restore();

  // State indicator
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(dog.state.toUpperCase(), dog.x, dog.y - 18);
}

function drawCelebration() {
  if (celebrationTimer <= 0) return;

  // Update particles
  for (let i = celebrationParticles.length - 1; i >= 0; i--) {
    const p = celebrationParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life--;
    if (p.life <= 0) {
      celebrationParticles.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = p.life / 120;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Text
  const alpha = Math.min(1, celebrationTimer / 60);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🎉 PENNED! 🎉', W / 2, H / 2 - 40);
  ctx.font = '18px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(`All ${NUM_SHEEP} sheep herded successfully!`, W / 2, H / 2);
  ctx.globalAlpha = 1;
}

function drawStartArea() {
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(W * 0.05, H * 0.15, W * 0.2, H * 0.7);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.strokeRect(W * 0.05, H * 0.15, W * 0.2, H * 0.7);
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('START', W * 0.15, H * 0.12);
}

function drawUI() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(10, 10, 180, 50);
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Sheep: ${sheep.filter(s => !s.penned).length}/${NUM_SHEEP}`, 20, 28);
  ctx.fillText(`Gate: ${Math.min(currentGateIndex + 1, gates.length)}/${gates.length}`, 20, 46);
  ctx.fillText(`Dog: ${dog.state}`, 100, 28);
}

// Main loop
let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;

  // Celebration countdown
  if (celebrationTimer > 0) {
    celebrationTimer -= dt;
    if (celebrationTimer <= 0) {
      // Reset
      initWearMap();
      generateCourse();
      initDog();
    }
  }

  updateSheep(dt);
  updateDog(dt);

  // Draw
  drawGrass();
  drawStartArea();
  drawGates();
  drawPen();

  // Draw sheep sorted by y for depth
  const sortedSheep = [...sheep].sort((a, b) => a.y - b.y);
  for (const s of sortedSheep) {
    drawSheep(s);
  }

  drawDog();
  drawCelebration();
  drawUI();

  requestAnimationFrame(gameLoop);
}

// Init
generateCourse();
initDog();
requestAnimationFrame(gameLoop);
</script>
