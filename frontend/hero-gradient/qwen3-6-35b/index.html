<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Hero Section</title>
    <style>
        :root {
            --bg-color: #050508;
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: 12px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 100;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            opacity: 0;
            animation: fadeDown 1s ease-out 0.5s forwards;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
        }

        /* Pure CSS Logo Mark */
        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--primary-gradient);
            border-radius: 8px;
            position: relative;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .logo-mark::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 2px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-cta {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-cta:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- Hero Section --- */
        .hero {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            overflow: hidden;
            padding: 100px 20px 60px;
        }

        /* --- Blobs --- */
        .blob-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation-timing-function: cubic-bezier(0.445, 0.05, 0.55, 0.95);
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: #4f46e5;
            top: -10%;
            left: -10%;
            animation-name: drift1;
            animation-duration: 25s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #db2777;
            bottom: -10%;
            right: -5%;
            animation-name: drift2;
            animation-duration: 30s;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: #7c3aed;
            top: 40%;
            left: 40%;
            animation-name: drift3;
            animation-duration: 20s;
        }

        /* --- Content --- */
        .content-wrapper {
            text-align: center;
            max-width: 900px;
            z-index: 10;
        }

        .headline {
            font-size: clamp(3rem, 6vw, 5rem);
            line-height: 1.1;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.03em;
            /* Mask Reveal Setup */
            mask-image: linear-gradient(to right, black 0%, black 100%);
            -webkit-mask-image: linear-gradient(to right, black 0%, black 100%);
            mask-size: 0% 100%;
            mask-repeat: no-repeat;
            -webkit-mask-size: 0% 100%;
            -webkit-mask-repeat: no-repeat;
            animation: maskReveal 1.2s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        .gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% 200%;
            animation: gradientSweep 6s ease infinite;
        }

        .subheadline {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            color: var(--text-muted);
            margin-bottom: 48px;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards 0.8s; /* Delayed start */
        }

        /* --- Buttons --- */
        .cta-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s ease forwards 1s; /* Delayed start */
        }

        .btn {
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border: 1px solid transparent;
            position: relative;
            z-index: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Shimmer Effect for Primary Button */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(99, 102, 241, 0.4),
                transparent
            );
            transform: skewX(-20deg);
            transition: none;
            z-index: -1;
        }

        .btn-primary:hover::after {
            animation: shimmer 1.5s infinite;
        }

        /* --- Keyframes --- */
        @keyframes drift1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.1); }
        }

        @keyframes drift2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-80px, -60px) scale(1.15); }
        }

        @keyframes drift3 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -80px) scale(0.9); }
        }

        @keyframes maskReveal {
            0% { mask-size: 0% 100%; -webkit-mask-size: 0% 100%; }
            100% { mask-size: 100% 100%; -webkit-mask-size: 100% 100%; }
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            to { opacity: 1; }
        }

        @keyframes gradientSweep {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .blob-1 { width: 300px; height: 300px; }
            .blob-2 { width: 300px; height: 300px; }
            .blob-3 { width: 250px; height: 250px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <div class="logo-mark"></div>
            <span>Lumina</span>
        </div>
        <div class="nav-links">
            <a href="#">Product</a>
            <a href="#">Solutions</a>
            <a href="#">Pricing</a>
            <a href="#">Resources</a>
        </div>
        <button class="nav-cta">Sign In</button>
    </nav>

    <main class="hero">
        <div class="blob-container">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <div class="content-wrapper">
            <h1 class="headline">
                Scale your infrastructure <br>
                with <span class="gradient-text">Intelligent Velocity</span>
            </h1>
            <p class="subheadline">
                Deploy globally in seconds. Our AI-driven orchestration engine optimizes performance automatically, reducing latency by 40% and costs by half.
            </p>
            <div class="cta-group">
                <a href="#" class="btn btn-primary">Start Building Free</a>
                <a href="#" class="btn btn-secondary">View Documentation</a>
            </div>
        </div>
    </main>

    </script>
</body>
</html>
