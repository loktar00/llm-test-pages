<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Next-Gen Platform</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --bg: #0a0a0f;
    --text: #f0f0f5;
    --text-muted: #8a8a9a;
    --accent-1: #6c5ce7;
    --accent-2: #00cec9;
    --accent-3: #fd79a8;
    --glass-bg: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.08);
  }

  html { font-size: 16px; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ��─ NAV BAR ��─ */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2.5rem;
    height: 64px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: navFadeIn 1s ease 0.2s both;
  }

  @keyframes navFadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    text-decoration: none;
    color: var(--text);
  }

  /* Pure CSS logo mark — geometric hexagon with inner triangle */
  .logo-mark {
    width: 32px;
    height: 32px;
    position: relative;
    flex-shrink: 0;
  }

  .logo-mark::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    border-radius: 2px;
  }

  .logo-mark::after {
    content: '';
    position: absolute;
    inset: 6px;
    background: var(--bg);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }

  .logo-text {
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: color 0.3s ease;
  }

  .nav-links a:hover { color: var(--text); }

  .nav-cta {
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    background: rgba(108,92,231,0.15);
    color: var(--accent-1);
    border: 1px solid rgba(108,92,231,0.3);
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  .nav-cta:hover {
    background: rgba(108,92,231,0.25);
    border-color: rgba(108,92,231,0.5);
  }

  /* ��─ HERO SECTION ��─ */
  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 8rem 2rem 4rem;
    text-align: center;
    overflow: hidden;
  }

  /* ��─ BLOBS ��─ */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    will-change: transform;
    pointer-events: none;
  }

  .blob-1 {
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--accent-1), transparent 70%);
    top: -10%;
    left: -8%;
    animation: drift1 22s ease-in-out infinite;
  }

  .blob-2 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    bottom: -5%;
    right: -6%;
    animation: drift2 26s ease-in-out infinite;
  }

  .blob-3 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, var(--accent-3), transparent 70%);
    top: 30%;
    right: 15%;
    animation: drift3 18s ease-in-out infinite;
  }

  .blob-4 {
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, #a29bfe, transparent 70%);
    top: 15%;
    left: 20%;
    animation: drift4 30s ease-in-out infinite;
    opacity: 0.3;
  }

  .blob-5 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #81ecec, transparent 70%);
    bottom: 20%;
    left: 10%;
    animation: drift5 24s ease-in-out infinite;
    opacity: 0.35;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25%      { transform: translate(40px, 30px) scale(1.05); }
    50%      { transform: translate(20px, 60px) scale(0.95); }
    75%      { transform: translate(-20px, 20px) scale(1.02); }
  }

  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25%      { transform: translate(-35px, -25px) scale(1.03); }
    50%      { transform: translate(-50px, -10px) scale(0.97); }
    75%      { transform: translate(-15px, -40px) scale(1.04); }
  }

  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(30px, -35px) scale(1.06); }
    66%      { transform: translate(-25px, 20px) scale(0.94); }
  }

  @keyframes drift4 {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25%      { transform: translate(25px, -20px) rotate(5deg) scale(1.04); }
    50%      { transform: translate(-15px, 30px) rotate(-3deg) scale(0.96); }
    75%      { transform: translate(10px, 10px) rotate(2deg) scale(1.02); }
  }

  @keyframes drift5 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(-30px, 25px) scale(1.05); }
    66%      { transform: translate(20px, -15px) scale(0.97); }
  }

  /* ��─ HERO CONTENT ��─ */
  .hero-content {
    position: relative;
    z-index: 10;
    max-width: 820px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 1rem;
    border-radius: 100px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-2);
    background: rgba(0,206,201,0.08);
    border: 1px solid rgba(0,206,201,0.2);
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.5s both;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-2);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.8); }
  }

  /* ��─ HEADLINE WITH MASKED REVEAL ��─ */
  .headline-wrapper {
    overflow: hidden;
    margin-bottom: 0.25rem;
  }

  .headline {
    font-size: clamp(2.5rem, 6vw, 4.25rem);
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.035em;
    color: var(--text);
    opacity: 0;
    transform: translateY(100%);
    animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
  }

  @keyframes revealUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .headline .gradient-text {
    background: linear-gradient(
      105deg,
      var(--accent-1) 0%,
      var(--accent-1) 20%,
      var(--accent-2) 40%,
      var(--accent-3) 60%,
      var(--accent-1) 80%,
      var(--accent-2) 100%
    );
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textSweep 6s linear infinite 1.5s;
  }

  @keyframes textSweep {
    to { background-position: -200% center; }
  }

  /* ��─ SUBHEADLINE ��─ */
  .subheadline {
    font-size: clamp(1.05rem, 2vw, 1.25rem);
    line-height: 1.65;
    color: var(--text-muted);
    max-width: 600px;
    margin: 1.5rem auto 0;
    opacity: 0;
    animation: fadeUp 0.8s ease 1s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ��─ CTA BUTTONS ��─ */
  .cta-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-top: 2.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.3s both;
    flex-wrap: wrap;
  }

  /* Primary CTA with gradient border shimmer */
  .btn-primary {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.9rem 2.25rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-1), #8b5cf6);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 14px;
    background: conic-gradient(
      from var(--shimmer-angle, 0deg),
      var(--accent-1),
      var(--accent-2),
      var(--accent-3),
      var(--accent-1),
      var(--accent-2),
      var(--accent-1)
    );
    z-index: -1;
    opacity: 0;
    transition: opacity 0.4s ease;
    animation: none;
  }

  .btn-primary:hover::before {
    opacity: 1;
    animation: shimmerSpin 2.5s linear infinite;
  }

  @property --shimmer-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes shimmerSpin {
    to { --shimmer-angle: 360deg; }
  }

  /* Fallback shimmer for browsers without @property */
  .btn-primary:hover::before {
    background: conic-gradient(
      from 0deg,
      var(--accent-1),
      var(--accent-2),
      var(--accent-3),
      var(--accent-1),
      var(--accent-2),
      var(--accent-1)
    );
    animation: fallbackShimmer 2.5s linear infinite;
  }

  @keyframes fallbackShimmer {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-1), #8b5cf6);
    z-index: -1;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(108,92,231,0.35);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  /* Secondary CTA */
  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }

  .btn-secondary:active {
    transform: translateY(0);
  }

  .btn-arrow {
    display: inline-block;
    transition: transform 0.3s ease;
  }

  .btn-secondary:hover .btn-arrow {
    transform: translateX(3px);
  }

  /* ��─ SOCIAL PROOF ��─ */
  .social-proof {
    margin-top: 3.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    opacity: 0;
    animation: fadeUp 0.8s ease 1.6s both;
  }

  .avatar-stack {
    display: flex;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--bg);
    margin-left: -10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: #fff;
  }

  .avatar:first-child { margin-left: 0; }
  .avatar-1 { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
  .avatar-2 { background: linear-gradient(135deg, #00cec9, #81ecec); }
  .avatar-3 {
