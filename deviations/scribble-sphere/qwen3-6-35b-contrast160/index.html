<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>3D Scribble Ball</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050508;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    // --- Configuration ---
    const SPHERE_RADIUS = 180;
    const BASE_LINE_WIDTH = 2.5;
    const MAX_LINE_WIDTH = 6;
    const SEGMENT_LENGTH = 1.2; // Distance between points along the curve
    const MAX_SEGMENTS = 6000; // Total capacity of the buffer
    const REBUILD_TIME = 400; // Time to rebuild (frames)
    const GROW_TIME = 1200; // Time to grow (frames)
    
    // --- State ---
    let width, height, cx, cy, focalLength;
    let points = []; // Array of {x, y, z}
    let currentLen = 0; // Current number of points
    let phase = 'grow'; // 'grow', 'hold', 'rebuild'
    let phaseTimer = 0;
    
    // --- Math Helpers ---
    function rotateX(p, a) {
        const c = Math.cos(a), s = Math.sin(a);
        return { x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c };
    }
    
    function rotateY(p, a) {
        const c = Math.cos(a), s = Math.sin(a);
        return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
    }
    
    // --- Resize Handler ---
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        cx = width / 2;
        cy = height / 2;
        focalLength = Math.min(width, height) * 0.9;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Initialization ---
    // Start with a random point on the sphere surface
    function getInitialPoint() {
        const phi = Math.random() * 2 * Math.PI;
        const theta = Math.acos(2 * Math.random() - 1);
        return {
            x: SPHERE_RADIUS * Math.sin(theta) * Math.cos(phi),
            y: SPHERE_RADIUS * Math.sin(theta) * Math.sin(phi),
            z: SPHERE_RADIUS * Math.cos(theta)
        };
    }
    
    points.push(getInitialPoint());
    currentLen = 1;

    // --- Main Loop ---
    function loop() {
        // 1. Update Phase
        phaseTimer++;
        
        if (phase === 'grow') {
            if (phaseTimer >= GROW_TIME) {
                phase = 'hold';
                phaseTimer = 0;
            }
        } else if (phase === 'hold') {
            if (phaseTimer >= 120) { // Hold for a bit
                phase = 'rebuild';
                phaseTimer = 0;
            }
        } else if (phase === 'rebuild') {
            if (phaseTimer >= REBUILD_TIME) {
                phase = 'grow';
                phaseTimer = 0;
                // Reset points for the next draw
                points = [getInitialPoint()];
                currentLen = 1;
            }
        }

        // 2. Generate New Point
        let last = points[points.length - 1];
        
        // Random walk direction
        let dir = {
            x: (Math.random() - 0.5) * 2,
            y: (Math.random() - 0.5) * 2,
            z: (Math.random() - 0.5) * 2
        };
        
        // Normalize direction
        const len = Math.sqrt(dir.x*dir.x + dir.y*dir.y + dir.z*dir.z);
        dir.x /= len;
        dir.y /= len;
        dir.z /= len;
        
        // Move along direction
        let next = {
            x: last.x + dir.x * SEGMENT_LENGTH,
            y: last.y + dir.y * SEGMENT_LENGTH,
            z: last.z + dir.z * SEGMENT_LENGTH
        };
        
        // Project back to sphere surface (normalize and scale)
        const dist = Math.sqrt(next.x*next.x + next.y*next.y + next.z*next.z);
        next.x = (next.x / dist) * SPHERE_RADIUS;
        next.y = (next.y / dist) * SPHERE_RADIUS;
        next.z = (next.z / dist) * SPHERE_RADIUS;
        
        points.push(next);
        
        // Manage array size to prevent infinite growth
        if (points.length > MAX_SEGMENTS) {
            points.shift();
        }
        currentLen = points.length;

        // 3. Clear Screen
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, width, height);

        // 4. Render
        // Global rotation speeds
        const rotSpeedX = 0.004;
        const rotSpeedY = 0.007;
        const rotSpeedZ = 0.002;
        
        // Accumulated rotation angles for smooth continuous spin
        // We use a small delta rotation each frame applied to the point relative to center
        // To optimize: We don't rotate every point. We rotate the camera/view slightly or just the points
        // Since points are static in the sphere, we rotate them for projection.
        
        // Actually, for "rotating in space", we rotate the points around the origin
        // We do this incrementally to avoid precision issues over time? Not needed for 6000 points, 
        // but we need to rotate them.
        
        // Let's use a rotation matrix approach or simple Euler angles
        // To keep the ball spinning continuously, we apply incremental rotation to the points
        // However, since points are generated fresh on rebuild, we need to persist rotation?
        // Actually, "rotating in space" implies the visual rotation.
        // We can just rotate the view or the points.
        
        // Let's use a simple Euler rotation applied to points for projection
        // We need to apply this rotation to the points array every frame.
        // This is O(N) but N=6000 is cheap.
        
        const angleX = rotSpeedX;
        const angleY = rotSpeedY;
        const angleZ = rotSpeedZ;

        // Precompute cos/sin for rotation
        const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
        const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
        const cosZ = Math.cos(angleZ), sinZ = Math.sin(angleZ);

        // Draw loop
        // We need to draw segments. points[i] to points[i+1]
        // To handle depth sorting (painter's algorithm) or just simple projection?
        // Since it is a scribble ball, depth sorting is necessary for correct occlusion.
        // But simple projection with depth-based alpha/width is often looks "good enough" for scribbles.
        // However, if we want "believable" 3D, we must sort.
        
        // Optimization: Sort indices based on Z
        // We map points to {idx, z}
        
        const projected = new Array(currentLen);
        
        for (let i = 0; i < currentLen; i++) {
            let p = points[i];
            
            // Rotate X
            let y1 = p.y * cosX - p.z * sinX;
            let z1 = p.y * sinX + p.z * cosX;
            let x1 = p.x;
            
            // Rotate Y
            let z2 = -x1 * sinY + z1 * cosY;
            let x2 = x1 * cosY + z1 * sinY;
            let y2 = y1;
            
            // Rotate Z
            let x3 = x2 * cosZ - y2 * sinZ;
            let y3 = x2 * sinZ + y2 * cosZ;
            let z3 = z2;
            
            // Perspective Projection
            // z3 is -SPHERE_RADIUS to +SPHERE_RADIUS.
            // Move camera back so z3 + cameraDist > 0 always
            const cameraDist = 600;
            const zProj = z3 + cameraDist;
            const scale = focalLength / zProj;
            
            const sx = cx + x3 * scale;
            const sy = cy + y3 * scale;
            
            projected[i] = {
                x: sx,
                y: sy,
                z: z3, // Keep original Z for depth cueing
                scale: scale
            };
        }
        
        // Sort by Z (Painter's Algorithm: Draw furthest first)
        // We need to connect i to i+1. We must sort the indices based on Z
        const indices = new Array(currentLen);
        for(let i=0; i<currentLen; i++) indices[i] = i;
        
        // Only sort if phase is rebuild or hold to keep it spinning properly?
        // Actually, we must sort every frame to handle the rotation correctly.
        // Performance note: 6000 sorts is fast enough in JS.
        indices.sort((a, b) => projected[b].z - projected[a].z);

        ctx.lineWidth = 1;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Draw segments
        for (let i = 0; i < indices.length - 1; i++) {
            const idxA = indices[i];
            const idxB = indices[i+1];
            
            const pA = projected[idxA];
            const pB = projected[idxB];
            
            // Depth Cueing
            // Map Z (-R to R) to 0 to 1 roughly
            // Closer (higher Z) is brighter and thicker
            const depthNorm = (pA.z + SPHERE_RADIUS) / (2 * SPHERE_RADIUS); // 0 (far) to 1 (near)
            
            // Opacity/Alpha
            const alpha = 0.15 + (depthNorm * 0.85);
            
            // Line Weight
            const lw = BASE_LINE_WIDTH * pA.scale * (0.5 + depthNorm * 0.5);
            
            // Color: Blue-ish Cyan
            // Brighter when near
            const r = Math.floor(50 + depthNorm * 100);
            const g = Math.floor(150 + depthNorm * 105);
            const b = Math.floor(255);
            
            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.lineWidth = lw;
            
            ctx.beginPath();
            ctx.moveTo(pA.x, pA.y);
            ctx.lineTo(pB.x, pB.y);
            ctx.stroke();
        }

        requestAnimationFrame(loop);
    }

    loop();

})();
</script>
</body>
</html>
