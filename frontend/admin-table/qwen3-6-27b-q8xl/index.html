<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Data Table</title>
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --row-hover: #f9fafb;
            
            /* Status Colors */
            --status-active-bg: #d1fae5;
            --status-active-text: #065f46;
            --status-pending-bg: #fef3c7;
            --status-pending-text: #92400e;
            --status-inactive-bg: #f3f4f6;
            --status-inactive-text: #374151;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container */
        .table-container {
            background: var(--bg-surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 1000px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }

        /* Header & Toolbar */
        .toolbar {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        .toolbar-actions { display: flex; gap: 1rem; }
        .btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        .btn:hover { border-color: #d1d5db; color: var(--text-primary); }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { background: var(--primary-hover); }

        /* Table Wrapper for Sticky Header */
        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px; /* Force scroll on very small screens */
        }

        /* Sticky Header */
        thead th {
            position: sticky;
            top: 0;
            background: var(--bg-surface);
            z-index: 10;
            padding: 0.75rem 1.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            user-select: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        thead th:hover { background-color: var(--row-hover); color: var(--text-primary); }

        /* Rows */
        tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.15s ease;
            /* FLIP Animation Target */
            transform-origin: center;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background-color: var(--row-hover); }

        td {
            padding: 1rem 1.25rem;
            font-size: 0.875rem;
            color: var(--text-primary);
            vertical-align: middle;
        }

        /* Column Specifics */
        .col-check { width: 40px; }
        .col-avatar { width: 60px; }
        .col-role { color: var(--text-secondary); }
        .col-date { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

        /* Avatar */
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e0e7ff;
            color: #3730a3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
        }
        /* Dynamic avatar colors via nth-child handled in JS or simple CSS classes */
        .avatar.c1 { background: #fce7f3; color: #be185d; }
        .avatar.c2 { background: #dbeafe; color: #1e40af; }
        .avatar.c3 { background: #d1fae5; color: #065f46; }
        .avatar.c4 { background: #ffedd5; color: #9a3412; }

        /* Status Chips */
        .chip {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .chip.active { background: var(--status-active-bg); color: var(--status-active-text); }
        .chip.pending { background: var(--status-pending-bg); color: var(--status-pending-text); }
        .chip.inactive { background: var(--status-inactive-bg); color: var(--status-inactive-text); }

        /* Checkbox */
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        /* Sort Arrows */
        .sort-icon {
            display: inline-block;
            margin-left: 6px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            font-size: 0.7rem;
        }
        th.sorted .sort-icon { opacity: 1; color: var(--primary); }
        th.sort-asc .sort-icon { transform: rotate(180deg); }
        th.sort-desc .sort-icon { transform: rotate(0deg); }

        /* Footer */
        .table-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
        }

        .pagination-info { font-size: 0.875rem; color: var(--text-secondary); }
        
        .pagination-pills { display: flex; gap: 4px; }
        .page-pill {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .page-pill:hover { background: var(--row-hover); color: var(--text-primary); }
        .page-pill.active { background: var(--primary); color: white; }
        .page-pill.disabled { opacity: 0.5; cursor: default; pointer-events: none; }

        /* Responsive */
        @media (max-width: 768px) {
            .col-role, .col-date { display: none; } /* Collapse columns */
            .table-container { height: auto; min-height: 80vh; }
            .toolbar { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .table-wrapper { overflow-x: auto; }
        }
    </style>
</head>
<body>

<div class="table-container">
    <div class="toolbar">
        <h1>Users</h1>
        <div class="toolbar-actions">
            <button class="btn">Filter</button>
            <button class="btn btn-primary">Add User</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="adminTable">
            <thead>
                <tr>
                    <th class="col-check">
                        <input type="checkbox" id="selectAll">
                    </th>
                    <th class="col-avatar"></th>
                    <th data-sort="name">Name <span class="sort-icon">▼</span></th>
                    <th data-sort="email">Email <span class="sort-icon">▼</span></th>
                    <th data-sort="status">Status <span class="sort-icon">▼</span></th>
                    <th data-sort="role" class="col-role">Role <span class="sort-icon">▼</span></th>
                    <th data-sort="date" class="col-date">Joined <span class="sort-icon">▼</span></th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>

    <div class="table-footer">
        <div class="pagination-info">Showing 1-10 of 24 results</div>
        <div class="pagination-pills">
            <div class="page-pill disabled">←</div>
            <div class="page-pill active">1</div>
            <div class="page-pill">2</div>
            <div class="page-pill">3</div>
            <div class="page-pill">→</div>
        </div>
    </div>
</div>

<script>
    // --- Data Generation ---
    const firstNames = ["Alex", "Jordan", "Taylor", "Casey", "Morgan", "Riley", "Jamie", "Quinn", "Avery", "Peyton", "Reese", "Rowan", "Sage", "Skyler", "Dakota"];
    const lastNames = ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez", "Hernandez", "Lopez", "Gonzalez"];
    const roles = ["Admin", "Editor", "Viewer", "Manager", "Developer"];
    const statuses = ["Active", "Pending", "Inactive"];
    
    function generateData(count) {
        const data = [];
        for (let i = 0; i < count; i++) {
            const fn = firstNames[Math.floor(Math.random() * firstNames.length)];
            const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
            const status = statuses[Math.floor(Math.random() * statuses.length)];
            const role = roles[Math.floor(Math.random() * roles.length)];
            
            data.push({
                id: i,
                name: `${fn} ${ln}`,
                initials: `${fn[0]}${ln[0]}`,
                email: `${fn.toLowerCase()}.${ln.toLowerCase()}@example.com`,
                status: status,
                role: role,
                date: new Date(Date.now() - Math.floor(Math.random() * 10000000000)).toLocaleDateString()
            });
        }
        return data;
    }

    const users = generateData(15);
    let currentSort = { key: 'date', dir: 'desc' };

    // --- Rendering ---
    const tableBody = document.getElementById('tableBody');
    const selectAllCheckbox = document.getElementById('selectAll');

    function renderTable(data, animate = false) {
        tableBody.innerHTML = '';
        
        data.forEach((user, index) => {
            const tr = document.createElement('tr');
            // Add ID for FLIP tracking
            tr.id = `row-${user.id}`;
            
            // Determine Avatar Color Class
            const avatarClass = `c${(index % 4) + 1}`;
            const statusClass = user.status.toLowerCase();

            tr.innerHTML = `
                <td class="col-check">
                    <input type="checkbox" class="row-checkbox">
                </td>
                <td class="col-avatar">
                    <div class="avatar ${avatarClass}">${user.initials}</div>
                </td>
                <td>
                    <div style="font-weight: 500;">${user.name}</div>
                </td>
                <td>${user.email}</td>
                <td><span class="chip ${statusClass}">${user.status}</span></td>
                <td class="col-role">${user.role}</td>
                <td class="col-date">${user.date}</td>
            `;
            tableBody.appendChild(tr);
        });

        updateIndeterminateState();
    }

    // --- Sorting with FLIP ---
    document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
            const key = th.getAttribute('data-sort');
            
            // Toggle Direction
            if (currentSort.key === key) {
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.key = key;
                currentSort.dir = 'asc';
            }

            // Update UI Icons
            document.querySelectorAll('th').forEach(t => {
                t.classList.remove('sorted', 'sort-asc', 'sort-desc');
            });
            th.classList.add('sorted', currentSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');

            // Sort Data
            const sortedData = [...users].sort((a, b) => {
                let valA = a[key];
                let valB = b[key];
                
                if (currentSort.dir === 'asc') return valA > valB ? 1 : -1;
                return valA < valB ? 1 : -1;
            });

            // FLIP Animation Implementation
            const rows = Array.from(tableBody.children);
            const newRows = sortedData.map(d => document.getElementById(`row-${d.id}`));
            
            // If rows don't exist yet (first render), just render
            if (!rows.length || !newRows[0]) {
                renderTable(sortedData);
                return;
            }

            // 1. First: Record initial positions
            const firstPositions = newRows.map(row => row.getBoundingClientRect());

            // 2. Invert: Reorder DOM
            // We actually just appendChild them in new order to the tbody
            sortedData.forEach(d => {
                const row = document.getElementById(`row-${d.id}`);
                tableBody.appendChild(row);
            });

            // 3. Play: Animate to new positions
            newRows.forEach((row, i) => {
                const last = row.getBoundingClientRect();
                const first = firstPositions[i];
                
                const deltaY = last.top - first.top;
                
                if (deltaY !== 0) {
                    row.style.transition = 'none';
                    row.style.transform = `translateY(-${deltaY}px)`;
                    
                    // Force Reflow
                    row.offsetHeight;
                    
                    row.style.transition = 'transform 0.4s cubic-bezier(0.2, 0, 0.2, 1)';
                    row.style.transform = '';
                }
            });
        });
    });

    // --- Checkbox Logic ---
    function updateIndeterminateState() {
        const checkboxes = document.querySelectorAll('.row-checkbox');
        const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
        
        selectAllCheckbox.checked = checkedCount === checkboxes.length && checkboxes.length > 0;
        selectAllCheckbox.indeterminate = checkedCount > 0 && checkedCount < checkboxes.length;
    }

    selectAllCheckbox.addEventListener('change', (e) => {
        const state = e.target.checked;
        document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = state);
    });

    document.addEventListener('change', (e) => {
        if (e.target.classList.contains('row-checkbox')) {
            updateIndeterminateState();
        }
    });

    // --- Initial Render ---
    // Default sort to Date Descending
    currentSort = { key: 'date', dir: 'desc' };
    const initialSorted = [...users].sort((a, b) => a.date < b.date ? 1 : -1);
    renderTable(initialSorted);
    
    // Set initial active state on header
    const dateHeader = document.querySelector('th[data-sort="date"]');
    dateHeader.classList.add('sorted', 'sort-desc');

</script>
</body>
</html>
