<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neumorphic Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e0e5ec;
      font-family: 'Segoe UI', sans-serif;
      perspective: 1200px;
    }

    .calculator {
      width: 340px;
      background: #e0e5ec;
      border-radius: 30px;
      padding: 20px;
      box-shadow:
        8px 8px 15px rgba(0,0,0,0.1),
        -8px -8px 15px rgba(255,255,255,0.6),
        inset 4px 4px 6px rgba(0,0,0,0.08),
        inset -4px -4px 6px rgba(255,255,255,0.5);
    }

    .display {
      width: 100%;
      height: 70px;
      background: #e0e5ec;
      border-radius: 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 12px 18px;
      overflow: hidden;
      box-shadow:
        inset 2px 2px 4px rgba(0,0,0,0.1),
        inset -2px -2px 4px rgba(255,255,255,0.6);
    }

    .display span {
      font-size: 2rem;
      color: #2d3142;
      white-space: nowrap;
      transition: font-size 0.3s ease;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2d3142;
      background: #e0e5ec;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      height: 60px;
      box-shadow:
        6px 6px 10px rgba(0,0,0,0.1),
        -6px -6px 10px rgba(255,255,255,0.6);
      transition: all 0.15s ease;
    }

    button:hover {
      box-shadow:
        4px 4px 8px rgba(0,0,0,0.12),
        -4px -4px 8px rgba(255,255,255,0.7);
    }

    button:active {
      transform: scale(0.96);
      box-shadow:
        inset 2px 2px 4px rgba(0,0,0,0.1),
        inset -2px -2px 4px rgba(255,255,255,0.6),
        2px 2px 4px rgba(0,0,0,0.1),
        -2px -2px 4px rgba(255,255,255,0.6);
    }

    button.equal {
      background: #2563eb;
      color: #fff;
      box-shadow:
        6px 6px 10px rgba(0,0,0,0.2),
        -6px -6px 10px rgba(37,99,235,0.4);
    }

    button.equal:hover {
      box-shadow:
        4px 4px 8px rgba(0,0,0,0.25),
        -4px -4px 8px rgba(37,99,235,0.5);
    }

    button.equal:active {
      transform: scale(0.96);
      box-shadow:
        inset 2px 2px 4px rgba(0,0,0,0.2),
        inset -2px -2px 4px rgba(255,255,255,0.2),
        2px 2px 4px rgba(0,0,0,0.2),
        -2px -2px 4px rgba(37,99,235,0.5);
    }

    button.operator {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <span id="screen">0</span>
    </div>
    <div class="keys">
      <button onclick="clearScreen()">C</button>
      <button onclick="append('/')" class="operator">÷</button>
      <button onclick="append('*')" class="operator">×</button>
      <button onclick="backspace()">⌫</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('-')" class="operator">−</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('+')" class="operator">+</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="equals()" class="equal">=</button>

      <button onclick="append('0')" style="grid-column: span 2;">0</button>
      <button onclick="append('.')">.</button>
    </div>
  </div>

  <script>
    const screen = document.getElementById('screen');
    let expression = '';

    function updateDisplay(value) {
      screen.textContent = value;
      adjustFontSize(value);
    }

    function adjustFontSize(value) {
      let size = 2;
      while (screen.scrollWidth > screen.offsetWidth && size > 0.8) {
        size -= 0.1;
        screen.style.fontSize = size + 'rem';
      }
    }

    function append(char) {
      if (expression === 'Error' || /[+*/-]/.test(expression.slice(-1)) && /[+\-*/]/.test(char)) {
        if (expression === 'Error') expression = '';
      }
      expression += char;
      updateDisplay(expression);
    }

    function clearScreen() {
      expression = '';
      updateDisplay('0');
      screen.style.fontSize = '2rem';
    }

    function backspace() {
      if (expression === 'Error') {
        expression = '';
        updateDisplay('0');
      } else {
        expression = expression.slice(0, -1) || '0';
        updateDisplay(expression || '0');
      }
      screen.style.fontSize = '2rem';
    }

    function equals() {
      try {
        expression = String(eval(expression));
      } catch (e) {
        expression = 'Error';
      }
      updateDisplay(expression || '0');
    }

    document.addEventListener('keydown', (e) => {
      const validChars = '0123456789.+-*/';
      const operators = { '+': '+', '-': '-', '*': '*', '/': '/' };

      if (validChars.includes(e.key)) {
        if (/[+*/-]/.test(e.key)) {
          if (/[+*/-]/.test(expression.slice(-1))) {
            expression = expression.slice(0, -1);
          }
          expression += operators[e.key];
        } else {
          expression += e.key;
        }
        updateDisplay(expression);
      } else if (e.key === 'Enter' || e.key === '=') {
        equals();
      } else if (e.key === 'Backspace') {
        backspace();
      } else if (e.key === 'Escape') {
        clearScreen();
      } else if (e.key === 'Delete') {
        clearScreen();
      }
    });
  </script>
</body>
</html>
