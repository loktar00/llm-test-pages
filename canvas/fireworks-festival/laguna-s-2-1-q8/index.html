<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fireworks Festival</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', ()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight});

const PI = Math.PI, TAU = PI*2;
const rand = (a,b)=>Math.random()*(b-a)+a;
const rint = (n)=>Math.floor(Math.random()*n);

// City skyline (simple silhouette)
const buildings = [];
for(let x=0; x<W; x+=rand(30,80)){
  buildings.push({
    x, width:rand(20,70),
    h:rand(H*0.3,H*0.7),
    windows:rint(20)
  });
}

function drawCity(){
  ctx.fillStyle='#0a0a1a';
  ctx.fillRect(0,H*0.6,W,H*0.4);
  ctx.fillStyle='#000';
  buildings.forEach(b=>{
    ctx.fillRect(b.x,H-b.h,b.width,b.h);
    // windows
    ctx.fillStyle='#fff68844';
    for(let i=0;i<b.windows;i++){
      let wx=b.x+rand(2,b.width-2);
      let wy=H-b.h+rand(5,b.h-5);
      ctx.fillRect(wx,wy,2,4);
    }
    ctx.fillStyle='#000';
  });
}

// Particle system
class Particle{
  constructor(x,y,vx,vy,color,life=1){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.color=color;this.life=life;this.life2=life;
    this.gravity=rand(0.05,0.15);
    this.drag=rand(0.92,0.97);
    this.size=rand(1,3);
  }
  update(dt){
    this.vx*=this.drag;
    this.vy = this.vy*this.drag + this.gravity;
    this.x+=this.vx;
    this.y+=this.vy;
    this.life -= dt*0.0005;
    this.size = Math.max(0.2,this.size*0.98);
  }
  draw(ctx){
    if(this.life<=0)return;
    ctx.globalAlpha = this.life;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,TAU);
    ctx.fill();
  }
}

class Firework{
  constructor(x,y,type,pal){
    this.x=x;this.y=y;
    this.type=type;
    this.pal=pal;
    this.exploded=false;
    this.particles=[];
    const speed=rand(2,5);
    const angle = -PI/2 + rand(-0.3,0.3); // mostly upward
    this.vx=Math.cos(angle)*speed;
    this.vy=Math.sin(angle)*speed;
    this.trail=[];
    this.life=1;
  }
  update(dt){
    if(!this.exploded){
      this.trail.push({x:this.x,y:this.y});
      if(this.trail.length>12)this.trail.shift();
      this.x+=this.vx;
      this.vy+=0.05+rand(0,0.02); // slight wind variation
      this.vx*=0.98;
      this.y+=this.vy;
      if(this.vy>=0 && this.y<=H*0.7) { // explode at peak or below threshold
        this.explode();
      }
    }else{
      this.particles.forEach(p=>p.update(dt));
      this.particles = this.particles.filter(p=>p.life>0);
      if(this.particles.length===0)this.dead=true;
    }
  }
  explode(){
    this.exploded=true;
    const cx=this.x,cy=this.y;
    const count=this.type==='ring'?40:this.type==='willow'?50:this.type==='peony'?80:60;
    const speed=this.type==='ring'?3:rand(2,6);
    for(let i=0;i<count;i++){
      let a = (TAU/count)*i + rand(-0.1,0.1);
      if(this.type==='ring'){
        a += (i%2==0?0:rand(0.05,0.1)); // slight offset
      }
      let s = speed* rand(0.8,1.2);
      let vx,vy;
      if(this.type==='ring'){
        vx=Math.cos(a)*s;
        vy=Math.sin(a)*s + rand(-0.5,0.5); // flat ring
      }else if(this.type==='willow'){
        let down = Math.sin(a)*0.8+0.2; // mostly down
        vx=Math.cos(a)*s*0.4;
        vy=Math.sin(a)*s*0.6 + rand(0.5,1.5);
        if(down<0)vx*=0.3;
      }else if(this.type==='peony'){
        vx=Math.cos(a)*s;
        vy=Math.sin(a)*s;
      }else{ // crackle/double
        vx=Math.cos(a)*s;
        vy=Math.sin(a)*s;
      }
      let color = this.pal[rint(this.pal.length)];
      let p = new Particle(cx,cy,vx,vy,color,rand(0.8,1.2));
      this.particles.push(p);
    }
    // double break
    if(this.type==='double'){
      setTimeout(()=>this.secondExplode(),300);
    }
  }
  secondExplode(){
    const cx=this.x,cy=this.y;
    for(let i=0;i<40;i++){
      let a=TAU/40*i + rand(-0.1,0.1);
      let s=rand(2,5);
      let vx=Math.cos(a)*s;
      let vy=Math.sin(a)*s;
      let color=this.pal[rint(this.pal.length)];
      this.particles.push(new Particle(cx,cy,vx,vy,color,rand(0.6,1)));
    }
  }
  draw(ctx){
    if(!this.exploded){
      // whistling trail
      for(let i=0;i<this.trail.length;i++){
        let t=this.trail[i];
        let alpha=i/this.trail.length*0.6;
        ctx.globalAlpha=alpha;
        ctx.fillStyle='#fff8';
        ctx.beginPath();
        ctx.arc(t.x,t.y,1-i/this.trail.length,0,TAU);
        ctx.fill();
      }
      // main shell
      ctx.globalAlpha=1;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(this.x,this.y,3,0,TAU);
      ctx.fill();
    }else{
      this.particles.forEach(p=>p.draw(ctx));
    }
  }
}

const palettes = {
  warm:['#ff6b35','#ffd23f','#ff9e6d','#ff4757'],
  cool:['#6a0572','#9c27b0','#4fc3f7','#00b0ff'],
  night:['#bb86fc','#7c4dff','#18ffff','#ff00ff'],
  classic:['#ff0000','#ffff00','#00ff00','#00ffff'],
  sunset:['#ff6b6b','#ffa94d','#ffd43b','#ff6b3544']
};

const types=['peony','willow','ring','double'];
const fireworks = [];
let lastSpawn=0;
let lastFinale=0;
let inFinale=false;
let finaleTimer=0;
let dt=0;
const now=()=>performance.now();
let last=now();

function launch(x,y,type,pal){
  fireworks.push(new Firework(x,y,type,pal));
}

function spawnRandom(){
  let x=W*0.2+Math.random()*W*0.6;
  let y=H*0.6+Math.random()*H*0.2;
  let t=types[rint(types.length)];
  let p=Object.values(palettes)[rint(Object.keys(palettes).length)];
  fireworks.push(new Firework(x,y,t,p));
}

function spawnFinale(){
  inFinale=true;
  finaleTimer=3000;
  const n=30;
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      if(!inFinale)return;
      let x=rand(W*0.1,W*0.9);
      let y=rand(H*0.5,H*0.7);
      let t=types[rint(types.length)];
      let p=Object.values(palettes)[rint(Object.keys(palettes).length)];
      fireworks.push(new Firework(x,y,t,p));
    },i*80);
  }
  setTimeout(()=>{inFinale=false},finaleTimer);
  lastFinale=now();
}

// River reflection shimmer via off-screen
const reflectionCanvas = document.createElement('canvas');
reflectionCanvas.width=W;
reflectionCanvas.height=H*0.4;
const rctx = reflectionCanvas.getContext('2d');

function drawReflection(){
  rctx.clearRect(0,0,W,H*0.4);
  // Draw flipped city + fireworks onto reflection canvas
  rctx.save();
  rctx.translate(0,H*0.4);
  rctx.scale(1,-0.9); // slight vertical squash
  drawCity(); // city base
  rctx.restore();
  rctx.save();
  rctx.translate(0,H*0.4);
  rctx.scale(1,-0.9);
  // draw firework sparks reflected
  ctx.save();
  ctx.globalAlpha=0.3;
  fireworks.forEach(fw=>{
    if(fw.exploded){
      fw.particles.forEach(p=>{
        ctx.globalAlpha=0.3*p.life;
        ctx.fillStyle=p.color;
        ctx.beginPath();
        ctx.arc(p.x,H*0.6-(p.y-H*0.6),p.size,0,TAU);
        ctx.fill();
      });
    }
  });
  ctx.restore();
}

// Shimmer effect overlay
let shimmerTime=0;

function animate(){
  let t=now();
  dt=t-last;
  last=t;

  // Update
  if(!inFinale && t-lastSpawn>rand(800,2000)){
    spawnRandom();
    lastSpawn=t;
  }
  if(t-lastFinale>rand(15000,30000) && !inFinale){
    spawnFinale();
  }
  if(inFinale){
    finaleTimer-=dt;
    if(finaleTimer<=0)inFinale=false;
  }

  fireworks.forEach(fw=>fw.update(dt));
  fireworks.filter(fw=>fw.dead).forEach((_,i)=>{/* remove */});
  // remove dead
  for(let i=fireworks.length-1;i>=0;i--){
    if(fireworks[i].dead)fireworks.splice(i,1);
    if(fireworks.length>200)fireworks.splice(i,1);
  }

  // Render scene
  ctx.clearRect(0,0,W,H);

  // Sky gradient
  let grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#000428');
  grd.addColorStop(1,'#000');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H*0.65);

  // City
  drawCity();

  // Fireworks
  ctx.save();
  fireworks.forEach(fw=>fw.draw(ctx));
  ctx.restore();

  // River water
  ctx.fillStyle='#001a2e88';
  ctx.fillRect(0,H*0.62,W,H*0.38);

  // River reflection (shimmer by animating vertical wave)
  shimmerTime+=dt*0.002;
  drawReflection();
  // Apply wave distortion via drawing slices
  ctx.save();
  const sliceCount=40;
  const sliceHeight=(H*0.38)/sliceCount;
  for(let i=0;i<sliceCount;i++){
    let wave=Math.sin(i*0.5+shimmerTime)*2;
    let sx=0;
    let sy=i*sliceHeight;
    ctx.drawImage(reflectionCanvas,sx,sy,W,sliceHeight,sx,sy+wave,W,sliceHeight);
  }
  ctx.globalAlpha=0.05;
  ctx.fillStyle='#fff';
  ctx.fillRect(0,H*0.62,W,H*0.38);
  ctx.restore();

  // Moon glow
  ctx.globalAlpha=0.3;
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(W*0.2,H*0.2,80,0,TAU);
  ctx.fill();

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
