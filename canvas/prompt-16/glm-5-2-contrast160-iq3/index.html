<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Small Battle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100;overflow:hidden}
body{
  background:#1f1810;
  font-family:system,system-ui,Segoe,Roboto,Helvetica,Arial,sans-serif;
  color:#ece0c4;
}
canvas{display:block;cursor:crosshair}
#wrap{position:fixed;inset:0}
#ui{position:fixed;top:16;right:16;text-align:right;pointer-events:none;user-select:select-none}
.ttl{font-size:13px;font-weight:800;letter-spacing:2.5px;opacity:.7;margin-bottom:10px}
.barRow{display:flex;align-items:center;justify-content:end;gap:10;margin:5 0 10 0}
.blc{width:38;height:14;border-radius:4;flex:none}
.blc.r{background:linear-gradient(135deg,#dc2824,#921616)}
.blc.b{background:linear-gradient(135deg,#2e8ac7,#0c3b6c)}
.barWrap{width:170;height:14;background:rgba(40,30,20,.65);border:1 solid rgba(0,0,0,.55);display:flex;align-items:center}
.barFill{height:100;height:14;transition:width .08 linear}
.barFill.r{background:linear-gradient(90deg,#f0654f,#c81f18)}
.barFill.b{background:linear-gradient(90deg,#4a9fd6,#265c8c)}
.tnum{font-size:12;font-weight:700;color:#e8dcbb;margin-left:14 0 0 14;opacity:0.85;min-width:30;text-align:right}
.hint{position:fixed;bottom:14;left:14;font-size:12;opacity:.45;pointer-events:none;letter-spacing:0.5px}
.hint b{color:#e8a84b;opacity:9}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui">
  <div class="ttl">TINY TANK BATTLE</div>
  <div class="barRow">
    <span class="blc r"></span>
    <div class="barWrap"><div id="br" class="barFill r" style="width:50%"></div></div>
    <div class="tnum"><span id="trn">5</span></div>
  </div>
  <div class="barRow">
    <span class="blc b"></span>
    <div class="barWrap"><div id="bb" class="barFill b" style="width:50%"></div></div>
    <div class="tnum"><span id="tbn">5</span></div>
  </div>
</div>
<div class="hint">battle never ends · <b>drag</b> to scout · <b>tap</b> to rally</div>
<script>
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W,H;

let terrain=null,tctx=null;
function initTerrain(w,h){
  terrain=document.createElement('canvas');
  terrain.width=w;terrain.height=h;
  tctx=terrain.getContext('2d');
  drawBaseTerrain();
  scatterStains();
}
function drawBaseTerrain(){
  const g=tctx.createLinearGradient(0,0,0,tctx.canvas.height);
  g.addColorStop(0,'#2d2520');
  g.addColorStop(1,'#332822');
  tctx.fillStyle=g;
  tctx.fillRect(0,0,tctx.canvas.width,tctx.canvas.height);
  const sw=tctx.canvas.width/2;
  tctx.fillStyle='rgba(40,32,28,0.7)';
  tctx.fillRect(0,0,sw,tctx.canvas.height);
  tctx.fillStyle='rgba(20,18,16,0.6)';
  tctx.fillRect(sw,0,tctx.canvas.width-sw,tctx.canvas.height);
  const ig=tctx.createLinearGradient(0,0,W,0);
  ig.addColorStop(0,'rgba(220,40,36,0.08)');
  ig.addColorStop(0.49,'rgba(0,0,0,0)');
  ig.addColorStop(0.51,'rgba(0,0,0,0)');
  ig.addColorStop(1,'rgba(46,173,207,0.08');
  tctx.fillStyle=ig;
  tctx.fillRect(0,0,W,H);
}
function scatterStains(){
  const blobs=['rgba(40,32,26,0.6)','rgba(60,48,38,0.4)','rgba(38,30,24,0.5)'];
  const dots=['rgba(212,200,170,0.06)','rgba(180,165,140,0.08)'];
  for(let i=0;i<280;i++){
    const x=Math.random()*W, y=Math.random()*H;
    const r=Math.pow(Math.random(),2)*20+2;
    const blob=blobs[(int(x*0.7)%blobs.length+0)%blobs.length];
    tctx.fillStyle=blob;
    tctx.beginPath();
    tctx.arc(x,y,r,0,Math.PI*2);
    tctx.fill();
  }
  for(let i=0;i<700;i++){
    const x=Math.random()*W, y=Math.random()*H;
    const d=dots[int(x)%dots.length];
    tctx.fillStyle=d;
    tctx.fillRect(x,y,Math.random()*3+1,Math.random()*3+1);
  }
}
function int(v){return Math.floor(v);}

const RED={gl:'#f04b5a',gl2:'#a01c28',body:'#c81f18',body2:'#7a0c10',trk:'#5a0c16',trk2:'#3a0810',br:'#ff3f33',tk:'#1a1008',tn:'#ff9f3a',tn2:'#c8541c'};
const BLU={gl:'#5ab0d8',gl2:'#1c4f8c',body:'#265c8c',body2:'#0c3b6c',trk:'#0c3b6c',trk2:'#08213b',br:'#4aa4d6',tk:'#1a1a14',tn:'#1fbfff',tn2:'#1c6acf'};
function sidesOf(s){return s==='red'?RED:BLU;}

const cfg={
  red:{tank:5,sld:6,bz:2,side:'red',spawn:{x:50,y:0.5}},
  blue:{tank:5,sld:6,bz:2,side:'blue',spawn:{x:W-50,y:0.5}}
};

function setupConfig(){
  cfg.red.tank=cfg.blue.tank=5;
  cfg.red.sld=cfg.blue.sld=6;
  cfg.red.bz=cfg.blue.bz=2;
  cfg.red.spawn={x:50,y=0.5};
  cfg.blue.spawn={x:W-50,y:0.5};
}

const state={units=[],bullets=[],fx=[],respawn:{red:0,blue:0}};

class Bullet{
  constructor(x,y,vx,vy,sd,kind,from){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.sd=sd;this.kind=kind;this.from=from;
    this.life=120;this.r=kind==='shell'?2:(kind==='bazooka'?5:1.5);
    this.damage=kind==='shell'?80:(kind==='bazooka'?200:18);
    this.explR=kind==='shell':32:42:10;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.life--;}
  draw(ctx){
    ctx.fillStyle='#fffbe0';
    ctx.beginPath();ctx.arc(this.x,this.y,this.r*2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=this.sd==='red'?RED.br:BLU.br;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
  }
  hit(){
    addFx(this.x,this.y,this.explR,this.sd);
    stampCrater(this.x,this.y,this.explR);
  }
}

class Tank{
  constructor(x,y,sd){
    this.kind='tank';this.sd=sd;this.cf=sidesOf(sd);
    this.x=x;this.y=y;this.heading=Math.random()*2*Math.PI;
    this.aim=Math.random()*2*Math.PI;
    this.targetAim=this.aim;
    this.r=12;this.speed=0.45;this.fireCD=80+Math.random()*20;
    this.hp=100;this.maxhp=100;this.alive=true;
    this.lastTrack=0;this.target=null;
    this.bazooka=false;this.kn=20;
    this.cooldown=120;
  }
  update(){
    if(!this.alive)return;
    this.findTarget();
    const tx=this.target?.x||null, ty=this.target?.y||null;
    if(tx!==null){
      const dx=tx-this.x, dy=ty-this.y, d=Math.hypot(dx,dy);
      this.targetAim=Math.atan2(dy,dx);
      const range=120;
      if(d>range){
        const tA=Math.atan2(dy,dx);
        let dA=tA-this.heading;
        while(dA>Math.PI)dA-=2*Math.PI;
        while(dA<-Math.PI)dA+=2*Math.PI;
        if(Math.abs(dA)>0.4){this.heading+=Math.sign(dA)*0.02;}
        this.x+=Math.cos(this.heading)*this.speed;
        this.y+=Math.sin(this.heading)*this.speed;
      }
      else{
        const tA=Math.atan2(dy,dx);
        let dA=tA-this.heading;
        while(dA>Math.PI)dA-=2*Math.PI;
        while(dA<-Math.PI)dA+=2*Math.PI;
        if(Math.abs(dA)>0.4){this.heading+=Math.sign(dA)*0.02;}
      this.x+=Math.cos(this.heading)*this.speed*0.2;
      this.y+=Math.sin(this.heading)*this.speed*0.2;
      }
      this.cooldown--;
      if(this.cooldown<=0){
        const fx=cos(aim)*12;
        const fy=sin(aim)*12;
        this.fireShell(fx,fy);
        this.cooldown=120;
      }
      this.fireCD--;
      if(this.fireCD<=0){
        const ax=cos(aim)*12, ay=sin(aim)*12;
        const sd=this.sd;
        const from=this;
        state.bullets.push(new Bullet(this.x+ax,this.y+ay,ax,ay,sd,'shell',from));
        this.fireCD=120;
      }
    this.lastTrack--;
    if(this.lastTrack<=0){
      stampTrack(this.x,this.y,this.heading,this.sd);
      this.lastTrack=6;
    }
  }
  findTarget(){
    let best=null, bestD=Infinity;
    const range=200;
    for(const u in state.units){
      if(u.sd===this.sd||!u.alive)continue;
      const dx=u.x-this.x, dy=u.y-this.y;
      const d=Math.hypot(dx,dy);
      if(d<bestD && d<range){bestD=d;best=u;}
    }
    this.target=best;
  }
  fireShell(){
    const bx=this.x+Math.cos(this.aim)*this.r;
    const by=this.y+Math.sin(this.aim)*this.r;
    const sd=this.sd;
    const from=this;
    state.bullets.push(new Bullet(bx,by,Math.cos(this.aim)*5,Math.sin(this.aim)*5,sd,'shell',from));
    this.fireCD=120+Math.random()*40;
    for(let i=0;i<3;i++){
      state.fx.push(new Particle(bx,by,Math.random()*2-1,Math.random()*2-1,this.cf.br,3,20));
    }
  }
  hit(d){
    this.hp-=d;
    if(this.hp<=0&&this.alive){
      this.alive=false;
      stampWreck(this.x,this.y,this.heading,this.sd);
      addFx(this.x,this.y,40,this.sd,'big');
      state.respawn[this.sd]+=1;
    }
  }
  draw(ctx){
    if(!this.alive)return;
    const c=this.cf;
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.heading);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(0,5,this.r+2,this.r*0.8-2,0,0,Math.PI*2);
    ctx.fill();
    // tracks
    ctx.fillStyle=c.trk2;
    ctx.fillRect(-this.r*0.7,-this.r*0.7-2,4,2);
    ctx.fillRect(-this.r*0.7,this.r*0.5-2,4,2);
    // body
    ctx.fillStyle=c.body;
    ctx.beginPath();
    ctx.roundRect(-this.r*0.7,-this.r*0.7,this.r*1.4,this.r*1.4,2);
    ctx.fill();
    ctx.fillStyle=c.body2;
    ctx.beginPath();
    ctx.roundRect(-this.r*0.7,-this.r*0.7+2,this.r*1.4,3,1);
    ctx.fill();
    // top
    ctx.fillStyle=c.trk;
    ctx.beginPath();
    ctx.roundRect(-this.r*0.5+1,-this.r*0.5+1,this.r*1.0-2,this.r*1.0-2,2);
    ctx.fill();
    // hatch detail
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(-this.r*0.4,-this.r*0.3,this.r*0.8,2);
    // restore for turret
    ctx.restore();
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.aim);
    // turret base
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(0,5,this.r*0.7,this.r*0.55,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=c.trk;
    ctx.beginPath();
    ctx.arc(0,0,this.r*0.7,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(0,0,this.r*0.6,0,Math.PI*2);
    ctx.fill();
    // barrel
    ctx.fillStyle=c.body2;
    ctx.fillRect(0,-3,this.r*1.3,2.5);
    ctx.fillStyle=c.trk2;
    ctx.fillRect(this.r*1.2,-3,1,2.5);
    ctx.restore();
    // glow under tank for team
    ctx.save();
    ctx.globalAlpha=0.15;
    ctx.fillStyle=c.br;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r+4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    // HP bar
    const hpw=24, hph=3;
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(this.x-hpw/2,this.y-this.r-10,hpw,hph);
    ctx.fillStyle=c.br;
    ctx.fillRect(this.x-hpw/2,this.y-this.r-10,hpw*(this.hp/this.maxhp),hph);
  }
}
function cos(a){return Math.cos(a)}
function sin(a){return Math.sin(a)}

class Soldier{
  constructor(x,y,sd,bz){
    this.kind='soldier';this.sd=sd;this.cf=sidesOf(sd);
    this.x=x;this.y=y;this.heading=Math.random()*2*Math.PI;
    this.r=5;this.speed=2.0;this.fireCD=50+Math.random()*30;
    this.hp=40;this.maxhp=40;this.alive=true;
    this.bazooka=bz||false;this.kn=20;
    this.target=null;this.cooldown=120;this.wobble=Math.random()*Math.PI;
    this.target=null;
  }
  update(){
    if(!this.alive)return;
    this.wobble+=0.05;
    this.findTarget();
    if(this.target){
      const dx=this.target.x-this.x;
      const dy=this.target.y-this.y;
      const d=Math.hypot(dx,dy);
      const range=this.bazooka?140:60;
      if(d>range){
        const tA=Math.atan2(dy,dx);
        let dA=tA-this.heading;
        while(dA>Math.PI)dA-=2*Math.PI;
        while(dA<-Math.PI)dA+=2*Math.PI;
        if(Math.abs(dA)>0.3){this.heading+=Math.sign(dA)*0.06;}
        this.x+=Math.cos(this.heading)*this.speed;
        this.y+=Math.sin(this.heading)*this.speed;
        this.wobble+=0.03;
      }else{
        // stop moving, shoot
        this.cooldown--;
        if(this.cooldown<=0){
          const ax=Math.cos(this.heading)*8;
          const ay=Math.sin(this.heading)*8;
          const sd=this.sd;
          const from=this;
          const kind=this.bazooka?'bazooka':'bullet';
          state.bullets.push(new Bullet(this.x+Math.cos(this.heading)*6,this.y+Math.sin(this.heading)*6,ax,ay,sd,kind,from));
          this.cooldown=this.bazooka?60:30;
          // muzzle flash
          state.fx.push(new Particle(this.x+Math.cos(this.heading)*8,this.y+Math.sin(this.heading)*8,0,0,'#fffbe0',4,5));
        }
      }
    }else{
      this.x+=Math.cos(this.heading)*this.speed*0.5;
      this.y+=Math.sin(this.heading)*this.speed*0.5;
    this.wobble+=0.03;
    }
    // separation
    for(const u in state.units){
      if(u===this||!u.alive)continue;
      const dx=this.x-u.x;
      const dy=this.y-u.y;
      const d=Math.hypot(dx,dy);
      const minD=this.r+u.r+4;
      if(d<minD && d>0.001){
        const push=(minD-d)*0.1;
        this.x+=(dx/d)*push;
        this.y+=(dy/d)*push;
      }
    }
    // bounds
    this.x=clamp(this.x,5,W-5);
    this.y=clamp(this.y,5,H-5);
    // check hits
    for(const u in state.units){
      if(u.sd===this.sd||!u.alive)continue;
      const dx=u.x-this.x;
      const dy=u.y-this.y;
      const d=Math.hypot(dx,dy);
      const range=this.bazooka?140:60;
      if(d<range){
        const tA=Math.atan2(dy,dx);
        let dA=tA-this.heading;
        while(dA>Math.PI)dA-=2*Math.PI;
        while(dA<-Math.PI)dA+=2*Math.PI;
        if(Math.abs(dA)>0.3){this.heading+=Math.sign(dA)*0.06;}
        this.wobble+=0.03;
      }
    }
  }
  findTarget(){
    let best=null, bestD=Infinity;
    const range=200;
    for(const u in state.units){
      if(u.sd===this.sd||!u.alive)continue;
      const dx=u.x-this.x;
      const dy=u.y-this.y;
      const d=Math.hypot(dx,dy);
      if(d<bestD && d<range){bestD=d;best=u;}
    }
    this.target=best;
  }
  draw(ctx){
    if(!this.alive)return;
    const c=this.cf;
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.heading);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(0,4,this.r+2,this.r*0.6,0,0,Math.PI*2);
    ctx.fill();
    // body
    ctx.fillStyle=c.body;
    ctx.beginPath();
    ctx.arc(0,0,this.r,0,Math.PI*2);
    ctx.fill();
    // body darker
    ctx.fillStyle=c.body2;
    ctx.beginPath();
    ctx.arc(0,this.r*0.5,this.r*0.7,0,Math.PI*2);
    ctx.fill();
    // helmet/face direction
    ctx.fillStyle=c.gl;
    ctx.beginPath();
    ctx.arc(this.r*0.5,0,this.r*0.3,0,Math.PI*2);
    ctx.fill();
    // bazooka indicator
    if(this.bazooka){
      ctx.strokeStyle=c.br;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(0,0,this.r+2,0,Math.PI*2);
      ctx.stroke();
      ctx.fillStyle=c.br;
      ctx.fillRect(this.r,-1,this.r*0.6,2);
    }else{
      // little rifle
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(this.r*0.7,-1,2,2);
    }
    ctx.restore();
    // HP bar
    const hpw=10, hph=2;
    if(this.hp<this.maxhp){
      ctx.fillStyle='rgba(0,0,0,0.7)';
      ctx.fillRect(this.x-hpw/2,this.y-this.r-6,hpw,hph);
      ctx.fillStyle=c.br;
      ctx.fillRect(this.x-hpw/2,this.y-this.r-6,hpw*(this.hp/this.maxhp),hph);
    }
  }
  hit(d){
    this.hp-=d;
    if(this.hp<=0&&this.alive){
      this.alive=false;
      stampBody(this.x,this.y,this.heading,this.sd);
      addFx(this.x,this.y,15,this.sd,'small');
      state.respawn[this.sd]+=1;
    }
  }
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v)}}

class Cover{
  constructor(x,y,w,h){
    this.x=x;this.y=y;this.w=w;this.h=h;
    this.hp=100;this.maxhp=100;this.alive=true;
    this.respawn=120;
  }
  update(){
    if(!this.alive){
      this.respawn--;
      if(this.respawn<=0){
        this.alive=true;
        this.hp=this.maxhp;
        this.respawn=120;
        // stamp cover on terrain
        stampCover(this.x,this.y,this.w,this.h);
      }
      return;
    }
    // separation with units
    for(const u in state.units){
      if(!u.alive)continue;
      const dx=u.x-this.x;
      const dy=u.y-this.y;
      const w=this.w*0.5+u.r;
      const h=this.h*0.5+u.r;
      if(Math.abs(dx)<w && Math.abs(dy)<h){
        const px=dx<0?-1:1;
        const py=dy<0?-1:1;
        if(Math.abs(dx)/w > Math.abs(dy)/h){
          u.x+=px*(w-M.abs(dx));
        }else{
          u.y+=py*(h-M.abs(dy));
        }
      }
    }
  }
  draw(ctx){
    if(!this.alive)return;
    const c=this.sd===undefined?'rgba(180,170,150,0.9)':'rgba(180,170,150,0.9)';
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.translate(2,2);
    ctx.fillRect(this.x-this.w/2,this.y-this.h/2,this.w,this.h);
    ctx.translate(-2,-2);
    ctx.fillStyle='rgba(180,170,150,0.9)';
    ctx.fillRect(this.x-this.w/2,this.y-this.h/2,this.w,this.h);
    ctx.fillStyle='rgba(120,110,90,0.5)';
    ctx.fillRect(this.x-this.w/2,this.y-this.h/2,this.w,3);
    ctx.fillStyle='rgba(120,110,90,0.5)';
    ctx.fillRect(this.x-this.w/2,this.y+this.h/2-3,this.w,3);
    ctx.fillStyle='rgba(120,110,90,0.5)';
    ctx.fillRect(this.x-this.w/2+3,this.y-this.h/2+3,this.w-6,2);
    ctx.fillRect(this.x-this.w/2+3,this.y+this.h/2-5,this.w-6,2);
    ctx.restore();
    // HP bar
    const hpw=20, hph=3;
    if(this.hp<this.maxhp){
      ctx.fillStyle='rgba(0,0,0,0.7)';
      ctx.fillRect(this.x-hpw/2,this.y-this.h/2-5,hpw,hph);
      ctx.fillStyle='#bdbf8c';
      ctx.fillRect(this.x-hpw/2,this.y-this.h/2-5,hpw*(this.hp/this.maxhp),hph);
    }
  }
  hit(d){
    this.hp-=d;
    if(this.hp<=0&&this.alive){
      this.alive=false;
      this.respawn=120;
      stampCoverDestroyed(this.x,this.y,this.w,this.h);
      addFx(this.x,this.y,20,'cover');
    }
  }
}
function stampCover(x,y,w,h){
  tctx.save();
  tctx.fillStyle='rgba(180,170,150,0.85)';
  tctx.fillRect(x-w/2,y-h/2,w,h);
  tctx.fillStyle='rgba(120,110,90,0.6)';
  tctx.fillRect(x-w/2+3,y-h/2+3,w-6,3);
  tctx.fillRect(x-w/2+3,y+h/2-3,w-6,3);
  // shadow
  tctx.fillStyle='rgba(0,0,0,0.4)';
  tctx.fillRect(x-w/2+2,y-h/2+2,w,h);
  tctx.restore();
}
function stampCoverDestroyed(x,y,w,h){
  tctx.save();
  tctx.globalAlpha=1;
  tctx.fillStyle='rgba(20,15,10,0.7)';
  tctx.beginPath();
  tctx.arc(x,y,Math.max(w,h)*0.6,0,Math.PI*2);
  tctx.fill();
  // dirt
  for(let i=0;i<20;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*Math.max(w,h);
    const cx=x+Math.cos(a)*r;
    const cy=y+Math.sin(a)*r;
    tctx.fillStyle='rgba(60,40,28,0.6)';
    tctx.fillRect(cx,cy,2,2);
  }
  tctx.restore();
}

class Particle{
  constructor(x,y,vx,vy,col,r,life){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.col=col;this.r=r;this.life=life;this.maxlife=life;
    this.gravity=0;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.vy+=this.gravity;
    this.vx*=0.9;
    this.vy*=0.9;
    this.life--;
  }
  draw(ctx){
    const a=this.life/this.maxlife;
    ctx.globalAlpha=Math.max(0,Math.min(1,a));
    ctx.fillStyle=this.col;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r*a,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

function addFx(x,y,r,sd,kind){
  const c=sidesOf(sd||'cover');
  const cR=sd==='cover'?180:60;
  const cG=sd==='cover'?40:20;
  const cB=sd==='cover'?20:30;
  // dirt puff
  for(let i=0;i<5+ ( (kind==='big'?10:5);i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*2+(kind==='big'?3:1);
    state.fx.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,'#8a6042',4,30+(Math.random()*10));
  }
  // scorch
  for(let i=0;i<(kind==='big'?20:8);i++){
    const a=Math.random()*Math.PI*2;
    const sp=Math.random()*4+1;
    state.fx.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,kind==='big'?c.body:'#3a2818',5,40);
  }
  // flash
  for(let i=0;i<3+( (kind==='big'?6:2);i++){
    state.fx.push(new Particle(x,y,(Math.random()*2-1)*3,(Math.random()*2-1)*3,'#fffbe0',6,5));
  }
  // team-colored sparks
  if(sd!=='cover'){
    for(let i=0;i<4;i++){
      const a=Math.random()*Math.PI*2;
      const sp=Math.random()*5+2;
      state.fx.push(new Particle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,c.br,2,30));
    }
  }
}

function stampCrater(x,y,r){
  tctx.save();
  // scorch ring
  const g=tctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(20,15,10,0.85');
  g.addColorStop(0.6,'rgba(40,30,22,0.6)');
  g.addColorStop(1,'rgba(60,42,28,0)');
  tctx.fillStyle=g;
  tctx.beginPath();
  tctx.arc(x,y,r,0,Math.PI*2);
  tctx.fill();
  // inner crater
  tctx.fillStyle='rgba(15,10,5,0.7)';
  tctx.beginPath();
  tctx.arc(x,y,r*0.6,0,Math.PI*2);
  tctx.fill();
  // dirt ring
  tctx.strokeStyle='rgba(60,42,28,0.5)';
  tctx.lineWidth=2;
  tctx.beginPath();
  tctx.arc(x,y,r*0.7,0,Math.PI*2);
  tctx.stroke();
  // debris
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2;
    const rr=Math.random()*r;
    const cx=x+Math.cos(a)*rr;
    const cy=y+Math.sin(a)*rr;
    tctx.fillStyle='rgba(20,15,10,0.5)';
    tctx.fillRect(cx,cy,1,1);
  }
  tctx.restore();
}
function stampWreck(x,y,heading,sd){
  tctx.save();
  tctx.translate(x,y);
  tctx.rotate(heading);
  // scorch
  const g=tctx.createRadialGradient(0,0,5,0,0,25);
  g.addColorStop(0,'rgba(15,10,5,0.8)');
  g.addColorStop(1,'rgba(15,10,5,0)');
  tctx.fillStyle=g;
  tctx.beginPath();
  tctx.arc(0,0,25,0,Math.PI*2);
  tctx.fill();
  // dark wreck silhouette
  tctx.fillStyle='rgba(20,15,10,0.85)';
  tctx.beginPath();
  tctx.roundRect(-12,-12,24,24,3);
  tctx.fill();
  // outline
  tctx.strokeStyle='rgba(60,42,28,0.8)';
  tctx.lineWidth=1;
  tctx.beginPath();
  tctx.roundRect(-12,-12,24,24,3);
  tctx.stroke();
  // tracks visible
  tctx.fillStyle='rgba(30,25,20,0.9)';
  tctx.fillRect(-12,-15,24,1.5);
  tctx.fillRect(-12,15,24,1.5);
  // some scorch dots
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2;
    const rr=Math.random()*20+3;
    const cx=Math.cos(a)*rr;
    const cy=Math.sin(a)*rr;
    tctx.fillStyle='rgba(20,15,10,'+ ( ( 0.4+Math.random()*0.3)+ ')';
    tctx.fillRect(cx,cy,1,1);
  }
  tctx.restore();
}
function stampBody(x,y,heading,sd){
  tctx.save();
  tctx.translate(x,y);
  tctx.rotate(heading);
  // tiny shadow
  tctx.fillStyle='rgba(15,10,5,0.6)';
  tctx.beginPath();
  tctx.ellipse(0,5,7,5,0,0,Math.PI*2);
  tctx.fill();
  // body outline
  tctx.fillStyle='rgba(20,15,10,0.85)';
  tctx.beginPath();
  tctx.arc(0,0,5,0,Math.PI*2);
  tctx.fill();
  // direction marker
  tctx.fillStyle='rgba(40,30,22,0.7)';
  tctx.fillRect(4,-1,4,2);
  // blood/dirt
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*5+5;
    const cx=Math.cos(a)*r;
    const cy=Math.sin(a)*r;
    tctx.fillStyle='rgba(20,15,10,'+ ( ( 0.4+Math.random()*0.3)+ ')';
    tctx.fillRect(cx,cy,1,1);
  }
  tctx.restore();
}
function stampTrack(x,y,heading,sd){
  tctx.save();
  tctx.translate(x,y);
  tctx.rotate(heading);

  tctx.globalAlpha=0.15;

// spawn units
function spawnTank(sd){
  const cfgv=cfg[sd];
  const x=cfgv.spawn.x + (Math.random()*-40+20);
  const y=cfgv.spawn.y*H + (Math.random()*H*0.6-H*0.3);
  const t=new Tank(x,y,sd);
  state.units.push(t);
  return t;
}
function spawnSoldier(sd,bz){
  const cfgv=cfg[sd];
  const x=cfgv.spawn.x + (Math.random()*-40+20);
  const y=cfgv.spawn.y*H + (Math.random()*H*0.6-H*0.3);
  const s=new Soldier(x,y,sd,bz);
  state.units.push(s);
  return s;
}

// covers
function spawnCover(x,y){
  const w=20+Math.random()*15;
  const h=20+Math.random()*15;
  const c=new Cover(x,y,w,h);
  state.units.push(c);
  stampCover(x,y,w,h);
  return c;
}
function covers(){
  // cover positions
  const cx=[W*0.2,W*0.3,W*0.5,W*0.5,W*0.7,W*0.8];
  const cy=[H*0.25,H*0.75,H*0.35,H*0.65,H*0.5,H*0.5];
  for(let i=0;i<6;i++){
    spawnCover(cx[i]+(Math.random()*-20+10),cy[i]+(Math.random()*-20+10));
  }
}

// initial setup
function setup(){
  // red side
  for(let i=0;i<cfg.red.tank;i++)spawnTank('red');
  for(let i=0;i<cfg.red.sld;i++)spawnSoldier('red',false);
  for(let i=0;i<cfg.red.bz;i++)spawnSoldier('red',true);
  // blue
  for(let i=0;i<cfg.blue.tank;i++)spawnTank('blue');
  for(let i<0;i<cfg.blue.sld;i++)spawnSoldier('red',false);
  for(let i<0;i<cfg.blue.bz;i++)spawnSoldier('red',true);
  covers();
}

// main loop
function loop(){
  ctx.fillStyle='#1f1810';
  ctx.fillRect(0,0,W,H);
  // draw terrain
  ctx.drawImage(terrain,0,0);
  // update bullets
  for(const b in state.bullets){
    b.update();
    if(b.x<-10||b.x>W+10||b.y<-10||b.y>H+10){
      b.life=0;
    }
    // check collisions
    for(const u in state.units){
      if(!u.alive)continue;
      if(u===b.from)continue;
      const dx=u.x-b.x;
      const dy=u.y-b.y;
      const d=Math.hypot(dx,dy);
      if(d<u.r+b.r){
        u.hit(b.damage);
        b.life=0;
        b.hit();
        break;
      }
    }
    if(b.life<=0){
      // remove later
    }
  }
  // filter bullets
  state.bullets=state.bullets.filter(b=>b.life>0 && b.x>-10 && b.x<W+10 && b.y>-10 && b.y<H+10);
  // update units
  for(const u in state.units){
    u.update();
  }
  // respawn
  for(const sd in ['red','blue']){
    if(state.respawn[sd]>0){
      state.respawn[sd]--;
      if(state.respawn[sd]<=0){
        // spawn
        const cfgv=cfg[sd];
        const r=Math.random();
        if(r<0.4){
          const t=new Tank(cfgv.spawn.x + (Math.random()*-40+20), cfgv.spawn.y*H + (Math.random()*H*0.6-H*0.3),sd);
          state.units.push(t);
        }else if(r<0.7){
          const s=new Soldier(cfgv.spawn.x + (Math.random()*-40+20), cfgv.spawn.y*H + (Math.random()*H*0.6-H*0.3),sd,false);
          state.units.push(s);
        }else{
          const s=new Soldier(cfgv.spawn.x + (Math.random()*-40+20), cfgv.spawn.y*H + (Math.random()*H*0.6-H*0.3),sd,true);
          state.units.push(s);
        }
      }
    }
  }
  // draw
  for(const b in state.bullets){
    b.draw(ctx);
  }
  // shadows under tanks first
  // then tanks/sldiers
  for(const u in state.units){
    if(u.kind==='cover'){
      u.draw(ctx);
    }
  }
  // draw units
  for(const u in state.units){
    if(u.kind!=='cover'){
      u.draw(ctx);
    }
  }
  // draw fx
  for(const p in state.fx){
    p.update();
    p.draw(ctx);
  }
  state.fx=state.fx.filter(p=>p.life>0);
  // clean dead covers
  state.units=state.units.filter(u=>(u.kind=='cover'?u.alive?true:false:true));
  // actually covers are respawn-enabled, keep them
  state.units=state.units.filter(u=>u.alive!==false?true:true);
  // hmm let's restructure - covers respawn themselves so keep them
  // HUD
  updateHUD();
  requestAnimationFrame(loop);
}

function updateHUD(){
  let r=0,rt=0;
  let b=0,bt=0;
  for(const u in state.units){
    if(u.kind==='cover')continue;
    if(!u.alive)continue;
    if(u.sd==='red'){r++;if(u.kind==='tank')rt++;}
    if(u.sd==='blue'){b++;if(u.kind==='tank')bt++;}
  }
  document.getElementById('br').style.width=(r>0?Math.max(5,r*5+5):5)+'%';
  document.getElementById('bb').style.width=(b>0?Math.max(5,b*5+5):5)+'%';
  document.getElementById('trn').textContent=rt;
  document.getElementById('tbn').textContent=bt;
}
window.addEventListener('load',()=>{resize();setup();loop()});

function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
  if(!terrain){
    initTerrain(W,H);
  }else{
    const nw=terrain.width,nh=terrain.height;
    terrain.width=W;
    terrain.height=H;
    tctx.drawImage(terrain,0,0);
    // draw new base if bigger
    if(W>nw||H>nh){
      const g=tctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#2d2520');
      g.addColorStop(1,'#332822');
      tctx.fillStyle=g;
      tctx.fillRect(0,0,W,H);
    }
  }
  setupConfig();
}
window.addEventListener('resize',resize);
resize();
