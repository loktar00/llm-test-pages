<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e27;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      perspective: 1000px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 2rem;
    }

    .headline {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      animation: breatheGlow 3s ease-in-out infinite;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .moon-zero {
      position: relative;
      display: inline-block;
      width: 1em;
      height: 1em;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e6e6e6, #888);
      box-shadow: 
        inset 0 0 10px rgba(255,255,255,0.6),
        0 0 30px rgba(255,255,255,0.3);
      margin: 0 0.1em;
      overflow: visible;
    }

    .satellite {
      position: absolute;
      top: -10px;
      left: 50%;
      width: 24px;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(255,255,255,0.7);
      animation: orbit 12s linear infinite;
    }

    .satellite::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ffcc00;
      border-radius: 50%;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 10px #ffcc00;
    }

    .orbit-path {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140%;
      height: 140%;
      border: 1px dashed rgba(255,255,255,0.1);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(15deg);
      z-index: -1;
    }

    @keyframes orbit {
      0% {
        transform: translate(-50%, -150%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -150%) rotate(360deg);
      }
    }

    @keyframes breatheGlow {
      0%, 100% {
        text-shadow: 
          0 0 10px rgba(255,255,255,0.2),
          0 0 30px rgba(173, 216, 230, 0.3),
          0 0 60px rgba(173, 216, 230, 0.2);
      }
      50% {
        text-shadow: 
          0 0 10px rgba(255,255,255,0.2),
          0 0 40px rgba(173, 216, 230, 0.5),
          0 0 80px rgba(173, 216, 230, 0.4);
      }
    }

    .tagline {
      margin: 1.5rem 0 2.5rem;
      font-size: 1.25rem;
      color: #b0c4de;
      font-style: italic;
    }

    .home-button {
      display: inline-block;
      padding: 0.85em 2.2em;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4a6cf7, #3a5ce8);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
      box-shadow: 0 8px 25px rgba(74, 108, 247, 0.4);
    }

    .home-button:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .home-button::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.4),
        transparent
      );
      transform: rotate(25deg);
      transition: 0.6s;
    }

    .home-button:hover::after {
      transform: translateX(100%) rotate(25deg);
    }

    .home-button span {
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .headline {
        font-size: 5rem;
      }
      .tagline {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="container">
    <h1 class="headline">
      4<span class="moon-zero">
        <div class="orbit-path"></div>
        <div class="satellite"></div>
      </span>4
    </h1>
    <p class="tagline">Looks like you’ve drifted into deep space.</p>
    <a href="/" class="home-button"><span>Take me home</span></a>
  </div>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const stars = [];
    const count = 300;

    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinkleDir: Math.random() > 0.5 ? 1 : -1,
        opacity: Math.random() * 0.5 + 0.5
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) {
        star.opacity += star.twinkleSpeed * star.twinkleDir;
        if (star.opacity <= 0.3 || star.opacity >= 1) {
          star.twinkleDir *= -1;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
