<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Kestrel · Members</title>
<style>
  :root{
    --bg:#0b1418;
    --panel:#132028;
    --panel-2:#0f1a21;
    --line:rgba(163,199,209,.09);
    --line-2:rgba(163,199,209,.17);
    --ink:#e7f1f2;
    --mut:#8aa0a8;
    --dim:#5d7079;
    --amber:#f4b64a;
    --amber-ink:#221503;
    --teal:#39c4c9;
    --green:#43d99a;
    --red:#f0716a;
    --slate:#7f95ad;
    --mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Avenir Next','Avenir','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scrollbar-gutter:stable}
  body{
    background:radial-gradient(120% 90% at 50% -10%, #11222c 0%, var(--bg) 58%) fixed;
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(244,182,74,.32)}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- ambient layers ---------- */
  .glow{
    position:fixed;inset:-22%;z-index:-2;pointer-events:none;
    background:
      radial-gradient(44% 32% at 80% 6%, rgba(244,182,74,.11), transparent 70%),
      radial-gradient(42% 42% at 6% 28%, rgba(38,148,156,.17), transparent 70%),
      radial-gradient(38% 30% at 62% 98%, rgba(24,98,120,.15), transparent 70%);
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{to{transform:translate3d(2.5%,-2%,0) scale(1.06)}}
  .grid-bg{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(rgba(151,197,209,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(151,197,209,.05) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(78% 62% at 50% 10%, #000 0%, transparent 100%);
            mask-image:radial-gradient(78% 62% at 50% 10%, #000 0%, transparent 100%);
  }

  .shell{max-width:1120px;margin:0 auto;padding:0 26px 64px}

  /* ---------- top bar ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 0 6px;gap:14px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{
    width:31px;height:31px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,#f8c766,#d98f27);color:#241503;
    box-shadow:0 6px 16px -6px rgba(244,182,74,.6), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .brand-name{font:700 13px var(--mono);letter-spacing:.24em;color:var(--ink)}
  .brand-sub{font:500 12.5px var(--sans);color:var(--dim);padding-left:12px;border-left:1px solid var(--line-2);white-space:nowrap}
  .top-right{display:flex;align-items:center;gap:12px}
  .env{
    display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
    font:700 10.5px var(--mono);letter-spacing:.16em;color:var(--green);
    background:rgba(67,217,154,.09);border:1px solid rgba(67,217,154,.32);
  }
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(67,217,154,.55);animation:pulse 2.2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(67,217,154,0)}100%{box-shadow:0 0 0 0 rgba(67,217,154,0)}}
  .iconbtn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);
    background:rgba(255,255,255,.04);color:var(--mut);cursor:pointer;
    display:grid;place-items:center;position:relative;transition:.18s;
  }
  .iconbtn:hover{color:var(--ink);background:rgba(255,255,255,.09);transform:translateY(-1px)}
  .iconbtn .ndot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 7px var(--amber)}
  .me{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    font:700 11px var(--sans);color:var(--amber-ink);
    background:linear-gradient(145deg,#f8c766,#dd9a2e);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 3px 8px rgba(0,0,0,.4);
    cursor:pointer;transition:.18s;
  }
  .me:hover{transform:scale(1.07)}

  /* ---------- page head ---------- */
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:30px 0 18px;flex-wrap:wrap}
  .title-row{display:flex;align-items:center;gap:13px}
  h1{font:800 clamp(30px,4.5vw,40px)/1.04 var(--sans);letter-spacing:-.025em}
  .count-chip{
    transform:translateY(3px);padding:4px 10px;border-radius:999px;
    font:700 12px var(--mono);color:var(--teal);
    background:rgba(57,196,201,.1);border:1px solid rgba(57,196,201,.32);
  }
  .sub{color:var(--mut);font-size:13.5px;margin-top:8px}
  #sync{font:500 12px var(--mono);color:var(--dim)}
  .head-actions{display:flex;gap:10px;align-items:center}
  .search{
    display:flex;align-items:center;gap:9px;height:38px;width:250px;padding:0 13px;
    background:rgba(255,255,255,.045);border:1px solid var(--line-2);border-radius:11px;
    color:var(--dim);transition:.25s var(--ease);
  }
  .search:focus-within{width:300px;border-color:rgba(244,182,74,.55);box-shadow:0 0 0 3px rgba(244,182,74,.14);color:var(--amber)}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:500 13px var(--sans)}
  .search input::placeholder{color:var(--dim)}

  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;
    border:1px solid transparent;font:600 13px var(--sans);letter-spacing:.01em;cursor:pointer;transition:.18s;
  }
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
  .btn.primary{
    background:linear-gradient(180deg,#f8c766,#eda92f);color:var(--amber-ink);
    box-shadow:0 6px 18px -6px rgba(244,182,74,.55), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px -6px rgba(244,182,74,.6), inset 0 1px 0 rgba(255,255,255,.45)}
  .btn.primary:active{transform:translateY(0)}
  .btn.ghost{background:rgba(255,255,255,.04);border-color:var(--line-2);color:var(--ink)}
  .btn.ghost:hover{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.08)}
  .btn.danger{background:rgba(240,113,106,.12);border-color:rgba(240,113,106,.42);color:#ff9d97}
  .btn.danger:hover{background:rgba(240,113,106,.24)}

  /* ---------- bulk bar ---------- */
  .bulkbar{
    max-height:0;opacity:0;transform:translateY(-8px);overflow:hidden;
    transition:max-height .35s var(--ease), opacity .3s, transform .35s var(--ease);
  }
  .bulkbar.open{max-height:90px;opacity:1;transform:none;margin-bottom:14px}
  .bulk-in{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:10px 14px;border-radius:12px;
    background:rgba(244,182,74,.08);border:1px solid rgba(244,182,74,.3);
  }
  .bulk-in .sel-label{font-size:13px;color:var(--mut)}
  .bulk-in .sel-label b{color:var(--amber);font-family:var(--mono)}
  .bulk-actions{display:flex;gap:8px;align-items:center}
  .bulk-x{width:28px;height:28px;padding:0}

  /* ---------- card & table ---------- */
  .card{
    position:relative;overflow:hidden;border-radius:16px;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line);
    box-shadow:0 34px 70px -34px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;z-index:6;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(244,182,74,.55) 18%,rgba(57,196,201,.5) 55%,transparent 85%);
  }
  .scroller{overflow:auto;max-height:min(62vh,560px);position:relative;scrollbar-width:thin;scrollbar-color:rgba(163,199,209,.25) transparent}
  .scroller::-webkit-scrollbar{width:10px;height:10px}
  .scroller::-webkit-scrollbar-thumb{background:rgba(163,199,209,.2);border-radius:99px;border:3px solid var(--panel)}
  .sentinel{height:1px;margin-bottom:-1px}

  table.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  .col-check{width:46px}.col-act{width:52px}.col-role{width:112px}
  .col-status{width:132px}.col-last{width:114px}.col-usage{width:142px}

  thead th{
    position:sticky;top:0;z-index:3;background:var(--panel);
    padding:13px 14px;border-bottom:1px solid var(--line-2);
    font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.14em;color:var(--mut);
    text-align:left;white-space:nowrap;transition:box-shadow .25s;
  }
  #scroller.stuck thead th{box-shadow:0 14px 20px -16px rgba(0,0,0,.95);border-bottom-color:rgba(163,199,209,.24)}
  th.num{text-align:right}

  .sortbtn{
    display:inline-flex;align-items:center;gap:6px;padding:2px 0;border:0;background:none;cursor:pointer;
    font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;transition:color .2s;
  }
  .sortbtn:hover{color:var(--ink)}
  .num .sortbtn{width:100%;justify-content:flex-end}
  .arrow{display:inline-flex;opacity:0;transform:translateY(1px);transition:opacity .2s, transform .45s cubic-bezier(.34,1.56,.64,1)}
  th:hover .arrow{opacity:.45}
  .sortbtn.on{color:var(--amber)}
  .sortbtn.on .arrow{opacity:1}
  .sortbtn.on.desc .arrow{transform:rotate(180deg)}

  tbody td{
    padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;
    vertical-align:middle;transition:background .18s;overflow:hidden;
  }
  tbody tr:last-child td{border-bottom:0}
  tbody{user-select:none}
  tbody tr:hover td{background:rgba(122,180,196,.055)}
  tbody tr.selected td{background:rgba(244,182,74,.07)}
  tbody tr.selected td:first-child{box-shadow:inset 2px 0 0 var(--amber)}
  tr.enter{animation:rowIn .45s var(--ease) both}
  @keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  tr.exit{animation:rowOut .28s ease both}
  @keyframes rowOut{to{opacity:0;transform:translateX(20px)}}

  /* checkbox */
  input[type=checkbox]{
    appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.28);border-radius:5px;background:transparent;
    position:relative;transition:.18s;vertical-align:middle;
  }
  input[type=checkbox]:hover{border-color:var(--amber)}
  input[type=checkbox]:checked,input[type=checkbox]:indeterminate{background:var(--amber);border-color:var(--amber)}
  input[type=checkbox]:checked::after{
    content:'';position:absolute;left:4px;top:1.5px;width:5px;height:8px;
    border-right:2px solid var(--amber-ink);border-bottom:2px solid var(--amber-ink);
    transform:rotate(45deg);animation:chk .2s var(--ease);
  }
  input[type=checkbox]:indeterminate::after{
    content:'';position:absolute;left:3px;top:6px;width:8px;height:2px;border-radius:2px;
    background:var(--amber-ink);animation:chk .2s var(--ease);
  }
  @keyframes chk{from{transform:scale(.4) rotate(45deg);opacity:0}}
  input[type=checkbox]:indeterminate::after{animation-name:chkd}
  @keyframes chkd{from{transform:scale(.4);opacity:0}}

  /* user cell */
  .usercell{display:flex;align-items:center;gap:12px;min-width:0}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:700;letter-spacing:.03em;
    background:linear-gradient(145deg,hsl(var(--h) 48% 46%),hsl(var(--h) 56% 31%));
    color:hsl(var(--h) 90% 94%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 2px 6px rgba(0,0,0,.35);
    transition:box-shadow .2s, transform .2s;
  }
  tr:hover .avatar{
    transform:scale(1.05);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 2px var(--panel-2), 0 0 0 4px hsl(var(--h) 60% 55% / .55);
  }
  .umeta{min-width:0;display:flex;flex-direction:column;gap:2px}
  .uname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .umail{font:400 11.5px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .roletag{
    display:inline-block;padding:3px 9px;border-radius:7px;
    font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);
    border:1px solid var(--line);background:rgba(255,255,255,.03);
  }

  /* status chips */
  .chip{
    --c:var(--slate);
    display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;border-radius:999px;
    font-size:12px;font-weight:600;white-space:nowrap;transition:transform .15s;
    color:color-mix(in srgb, var(--c) 78%, white);
    background:color-mix(in srgb, var(--c) 13%, transparent);
    border:1px solid color-mix(in srgb, var(--c) 34%, transparent);
  }
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px color-mix(in srgb, var(--c) 75%, transparent)}
  .chip:hover{transform:translateY(-1px)}
  .chip.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
  .st-active{--c:var(--green)}   .st-active i{animation:breathe 2.6s infinite}
  .st-pending{--c:var(--amber)}
  .st-suspended{--c:var(--red)}
  .st-offline{--c:var(--slate)}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}

  .mono{font-family:var(--mono)}
  .col-last{font-size:12px;color:var(--mut)}

  .usage{display:flex;align-items:center;justify-content:flex-end;gap:10px}
  .bar{width:60px;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;flex:none}
  .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2aa8ad,#4fd8c8);transform-origin:left;animation:barIn .9s var(--ease) .25s both}
  .bar i.hot{background:linear-gradient(90deg,#d99a2b,#f6c667)}
  @keyframes barIn{from{transform:scaleX(0)}}
  .upct{font-size:12px;color:var(--mut);min-width:34px;text-align:right}

  .kebab{
    width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--dim);
    cursor:pointer;display:grid;place-items:center;opacity:0;transition:.2s;
  }
  tr:hover .kebab,.kebab:focus-visible{opacity:1}
  .kebab:hover{background:rgba(255,255,255,.09);color:var(--ink);transform:rotate(90deg)}
  @media (hover:none){.kebab{opacity:.55}}

  .emptybox{padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--mut);font-size:13.5px}
  .emptybox svg{color:var(--dim);opacity:.7}
  .emptybox b{color:var(--ink)}

  /* footer */
  .tfoot{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:13px 18px;border-top:1px solid var(--line);background:rgba(9,16,20,.55);
  }
  .showing{font-size:12.5px;color:var(--mut)}
  .showing b{color:var(--ink);font-family:var(--mono);font-weight:600}
  .showing .dim{color:var(--dim)}
  .selnote{color:var(--amber);font-family:var(--mono);font-size:12px}
  .pager{display:flex;gap:6px}
  .pill{
    min-width:34px;height:32px;padding:0 10px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line-2);background:transparent;color:var(--mut);
    font:600 12.5px var(--mono);display:grid;place-items:center;transition:.18s;
  }
  .pill:hover:not(:disabled):not(.active){color:var(--ink);border-color:rgba(244,182,74,.55);transform:translateY(-1px)}
  .pill.active{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);box-shadow:0 5px 16px -5px rgba(244,182,74,.6)}
  .pill:disabled{opacity:.3;cursor:default}

  .foot-note{margin-top:16px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

  /* menu */
  .menu{
    position:fixed;z-index:60;min-width:186px;padding:6px;border-radius:12px;
    background:#17262f;border:1px solid var(--line-2);
    box-shadow:0 20px 44px -12px rgba(0,0,0,.65);
    opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;
    transition:.18s var(--ease);
  }
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .menu button{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;border-radius:8px;
    background:none;color:var(--ink);font:600 13px var(--sans);cursor:pointer;text-align:left;transition:.15s;
  }
  .menu button:hover{background:rgba(255,255,255,.08)}
  .menu button svg{color:var(--dim);flex:none}
  .menu button.warn{color:#ff9d97}
  .menu button.warn svg{color:#ff9d97}
  .menu button.warn:hover{background:rgba(240,113,106,.14)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:5px 8px}

  /* toasts */
  .toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{
    display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:11px;
    background:#182831;border:1px solid var(--line-2);color:var(--ink);font:600 12.5px var(--sans);
    box-shadow:0 16px 36px -10px rgba(0,0,0,.7);
    opacity:0;transform:translateY(12px) scale(.95);transition:.3s var(--ease);
  }
  .toast::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);flex:none}
  .toast.show{opacity:1;transform:none}

  /* ---------- responsive collapse ---------- */
  @media (max-width:980px){ .col-usage{display:none} }
  @media (max-width:820px){ .col-role{display:none} .brand-sub{display:none} }
  @media (max-width:640px){
    .col-last{display:none}
    .pagehead{flex-direction:column;align-items:stretch}
    .head-actions{width:100%}
    .search,.search:focus-within{flex:1;width:auto}
    thead th,tbody td{padding:10px}
    .tfoot{justify-content:center}
    .env span.txt{display:none}
  }
  @media (max-width:440px){ .umail{display:none} .col-status{width:104px} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="grid-bg" aria-hidden="true"></div>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 1l7 7-7 7-7-7z" fill="currentColor"/><circle cx="8" cy="8" r="2.1" fill="#241503"/></svg>
      </span>
      <span class="brand-name">KESTREL</span>
      <span class="brand-sub">Operations Console</span>
    </div>
    <div class="top-right">
      <span class="env"><i class="pulse"></i><span class="txt">PROD</span></span>
      <button class="iconbtn" id="bellBtn" aria-label="Notifications">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a4 4 0 00-4 4v3L2.5 11h11L12 9V6a4 4 0 00-4-4z"/><path d="M6.6 13.5a1.5 1.5 0 002.8 0"/></svg>
        <span class="ndot"></span>
      </button>
      <span class="me" title="Amara Okafor">AO</span>
    </div>
  </header>

  <section class="pagehead">
    <div>
      <div class="title-row">
        <h1>Members</h1>
        <span class="count-chip" id="totalCount">21</span>
      </div>
      <p class="sub">Manage access across the Kestrel workspace &nbsp;·&nbsp; <span id="sync">synced just now</span></p>
    </div>
    <div class="head-actions">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <input id="q" type="search" placeholder="Filter by name, email, role…" aria-label="Filter members">
      </label>
      <button class="btn primary" id="inviteBtn">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        Invite member
      </button>
    </div>
  </section>

  <div class="bulkbar" id="bulkbar">
    <div class="bulk-in">
      <span class="sel-label" id="selCount"><b>0</b> selected</span>
      <span class="bulk-actions">
        <button class="btn ghost sm" id="bulkExport">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13h11"/></svg>
          Export
        </button>
        <button class="btn ghost sm" id="bulkSuspend">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3v10M11 3v10"/></svg>
          Suspend
        </button>
        <button class="btn danger sm" id="bulkRemove">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.6 7v4M9.4 7v4"/></svg>
          Remove
        </button>
        <button class="btn ghost sm bulk-x" id="bulkClear" aria-label="Clear selection">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
        </button>
      </span>
    </div>
  </div>

  <section class="card">
    <div class="scroller" id="scroller">
      <div class="sentinel" id="sentinel" aria-hidden="true"></div>
      <table class="tbl">
        <caption class="sr-only">Workspace members with role, status, last activity and usage</caption>
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="checkAll" aria-label="Select all members on this page"></th>
            <th class="col-user" aria-sort="none"><button type="button" class="sortbtn" data-key="name">Member <span class="arrow"><svg width="10" height="7" viewBox="0 0 10 7" fill="none"><path d="M1.5 5.5L5 2l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></th>
            <th class="col-role" aria-sort="none"><button type="button" class="sortbtn" data-key="role">Role <span class="arrow"><svg width="10" height="7" viewBox="0 0 10 7" fill="none"><path d="M1.5 5.5L5 2l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></th>
            <th class="col-status" aria-sort="none"><button type="button" class="sortbtn" data-key="status">Status <span class="arrow"><svg width="10" height="7" viewBox="0 0 10 7" fill="none"><path d="M1.5 5.5L5 2l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></th>
            <th class="col-last num" aria-sort="none"><button type="button" class="sortbtn" data-key="last">Last active <span class="arrow"><svg width="10" height="7" viewBox="0 0 10 7" fill="none"><path d="M1.5 5.5L5 2l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></th>
            <th class="col-usage num" aria-sort="none"><button type="button" class="sortbtn" data-key="usage">Usage <span class="arrow"><svg width="10" height="7" viewBox="0 0 10 7" fill="none"><path d="M1.5 5.5L5 2l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></th>
            <th class="col-act"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <footer class="tfoot">
      <div class="showing" id="showing"></div>
      <nav class="pager" id="pager" aria-label="Pagination"></nav>
    </footer>
  </section>

  <p class="foot-note">Kestrel Ops Console · v2.4.1 · <span id="seatNote">21</span> seats in use</p>
</div>

<div class="menu" id="menu" role="menu" aria-hidden="true">
  <button type="button" data-act="view" role="menuitem">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
    View profile
  </button>
  <button type="button" data-act="copy" role="menuitem">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/></svg>
    Copy email
  </button>
  <hr>
  <button type="button" data-act="toggle" role="menuitem">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M3.8 3.8l8.4 8.4"/></svg>
    <span id="menuToggleLabel">Suspend member</span>
  </button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);

  const ICON = {
    kebab: '<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="2.5" r="1.4"/><circle cx="7" cy="7" r="1.4"/><circle cx="7" cy="11.5" r="1.4"/></svg>',
    chevL: '<svg width="7" height="11" viewBox="0 0 7 11" fill="none"><path d="M6 1L1.5 5.5L6 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chevR: '<svg width="7" height="11" viewBox="0 0 7 11" fill="none"><path d="M1 1l4.5 4.5L1 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    inbox: '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>'
  };

  let users = [
    {id:1,  name:'Amara Okafor',    email:'amara.okafor@kestrel.io',    role:'Owner',   status:'active',    last:4,     usage:92},
    {id:2,  name:'Jonas Lindqvist', email:'jonas.lindqvist@kestrel.io', role:'Admin',   status:'active',    last:12,    usage:78},
    {id:3,  name:'Priya Raghavan',  email:'priya.raghavan@kestrel.io',  role:'Editor',  status:'pending',   last:180,   usage:41},
    {id:4,  name:'Theo Marchand',   email:'theo.marchand@kestrel.io',   role:'Viewer',  status:'offline',   last:8640,  usage:12},
    {id:5,  name:'Nadia Petrov',    email:'nadia.petrov@kestrel.io',    role:'Admin',   status:'active',    last:26,    usage:88},
    {id:6,  name:'Marcus Bell',     email:'marcus.bell@kestrel.io',     role:'Editor',  status:'suspended', last:20160, usage:63},
    {id:7,  name:'Yuki Tanaka',     email:'yuki.tanaka@kestrel.io',     role:'Analyst', status:'active',    last:60,    usage:71},
    {id:8,  name:'Sofia Reyes',     email:'sofia.reyes@kestrel.io',     role:'Editor',  status:'active',    last:38,    usage:55},
    {id:9,  name:'Dmitri Volkov',   email:'dmitri.volkov@kestrel.io',   role:'Viewer',  status:'pending',   last:2880,  usage:9},
    {id:10, name:'Hana Kobayashi',  email:'hana.kobayashi@kestrel.io',  role:'Analyst', status:'active',    last:300,   usage:66},
    {id:11, name:'Owen Gallagher',  email:'owen.gallagher@kestrel.io',  role:'Editor',  status:'offline',   last:12960, usage:34},
    {id:12, name:'Leila Haddad',    email:'leila.haddad@kestrel.io',    role:'Admin',   status:'active',    last:8,     usage:95},
    {id:13, name:'Felix Braun',     email:'felix.braun@kestrel.io',     role:'Viewer',  status:'pending',   last:1440,  usage:18},
    {id:14, name:'Ingrid Solberg',  email:'ingrid.solberg@kestrel.io',  role:'Analyst', status:'active',    last:44,    usage:60},
    {id:15, name:'Rafael Duarte',   email:'rafael.duarte@kestrel.io',   role:'Editor',  status:'suspended', last:30240, usage:47},
    {id:16, name:'Mei-Ling Chen',   email:'meiling.chen@kestrel.io',    role:'Admin',   status:'active',    last:15,    usage:83},
    {id:17, name:'Samuel Adeyemi',  email:'samuel.adeyemi@kestrel.io',  role:'Analyst', status:'active',    last:120,   usage:74},
    {id:18, name:'Clara Fontaine',  email:'clara.fontaine@kestrel.io',  role:'Viewer',  status:'offline',   last:15840, usage:8},
    {id:19, name:'Ravi Menon',      email:'ravi.menon@kestrel.io',      role:'Editor',  status:'active',    last:31,    usage:69},
    {id:20, name:'Zofia Kowalska',  email:'zofia.kowalska@kestrel.io',  role:'Viewer',  status:'pending',   last:300,   usage:22},
    {id:21, name:'Ethan Walsh',     email:'ethan.walsh@kestrel.io',     role:'Analyst', status:'active',    last:58,    usage:51}
  ];

  const STATUS = {
    active:    {label:'Active',    rank:0},
    pending:   {label:'Pending',   rank:1},
    suspended: {label:'Suspended', rank:2},
    offline:   {label:'Offline',   rank:3}
  };
  const PAGE = 7;
  const state = { key:'last', dir:1, page:1, q:'', selected:new Set() };
  let lastSync = Date.now();

  const tbody = $('#tbody'), scroller = $('#scroller'), checkAll = $('#checkAll'), menu = $('#menu');
  const rowCache = new Map();
  let menuUser = null;

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hueOf = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; };
  const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const byId = id => users.find(u => u.id === id);
  const fmtLast = m => {
    if (m < 2) return 'just now';
    if (m < 60) return m + 'm ago';
    if (m < 1440) return Math.round(m / 60) + 'h ago';
    const d = Math.round(m / 1440);
    return d < 30 ? d + 'd ago' : Math.round(d / 30) + 'mo ago';
  };
  const chipHTML = u => `<span class="chip st-${u.status}"><i></i>${STATUS[u.status].label}</span>`;

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    $('#toasts').append(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); }, 2400);
  }

  /* ---------- row factory ---------- */
  function makeRow(u) {
    const tr = document.createElement('tr');
    tr.dataset.id = u.id;
    const h = hueOf(u.name);
    tr.innerHTML = `
      <td class="col-check"><input class="rowcheck" type="checkbox" aria-label="Select ${esc(u.name)}"></td>
      <td class="col-user">
        <div class="usercell">
          <span class="avatar" style="--h:${h}">${initials(u.name)}</span>
          <span class="umeta">
            <span class="uname">${esc(u.name)}</span>
            <span class="umail">${esc(u.email)}</span>
          </span>
        </div>
      </td>
      <td class="col-role"><span class="roletag">${esc(u.role)}</span></td>
      <td class="col-status">${chipHTML(u)}</td>
      <td class="col-last num mono">${fmtLast(u.last)}</td>
      <td class="col-usage num">
        <div class="usage">
          <span class="bar"><i class="${u.usage >= 85 ? 'hot' : ''}" style="width:${u.usage}%"></i></span>
          <span class="upct mono">${u.usage}%</span>
        </div>
      </td>
      <td class="col-act"><button type="button" class="kebab" aria-haspopup="menu" aria-label="Actions for ${esc(u.name)}">${ICON.kebab}</button></td>`;
    tr.querySelector('.rowcheck').addEventListener('change', e => setSel(u.id, e.target.checked));
    tr.querySelector('.kebab').addEventListener('click', e => { e.stopPropagation(); openMenu(e.currentTarget, u.id); });
    tr.addEventListener('click', e => {
      if (e.target.closest('input,button,a')) return;
      toggleSel(u.id);
    });
    return tr;
  }
  const rowEl = u => { let el = rowCache.get(u.id); if (!el) { el = makeRow(u); rowCache.set(u.id, el); } return el; };

  function emptyRow() {
    const tr = document.createElement('tr');
    tr.className = 'empty';
    tr.innerHTML = `<td colspan="7"><div class="emptybox">${ICON.inbox}
      <p>No members match <b>“${esc(state.q)}”</b></p>
      <button type="button" class="btn ghost sm" data-clear>Clear filter</button></div></td>`;
    tr.querySelector('[data-clear]').addEventListener('click', () => {
      $('#q').value = ''; state.q = ''; state.page = 1; render();
    });
    return tr;
  }

  /* ---------- data pipeline ---------- */
  function sorted() {
    const q = state.q.trim().toLowerCase();
    const list = users.filter(u => !q || (u.name + ' ' + u.email + ' ' + u.role).toLowerCase().includes(q));
    const { key, dir } = state;
    list.sort((a, b) => {
      let r;
      if (key === 'status') r = STATUS[a.status].rank - STATUS[b.status].rank;
      else if (key === 'last' || key === 'usage') r = a[key] - b[key];
      else r = String(a[key]).localeCompare(String(b[key]));
      if (r === 0) r = a.name.localeCompare(b.name);
      return r * dir;
    });
    return list;
  }
  const visibleIds = () => [...tbody.querySelectorAll('tr[data-id]')].map(tr => +tr.dataset.id);

  /* ---------- render with FLIP settle ---------- */
  function render(flip = true) {
    const list = sorted();
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    state.page = Math.min(Math.max(1, state.page), pages);
    const start = (state.page - 1) * PAGE;
    const slice = list.slice(start, start + PAGE);

    // FIRST
    const first = new Map();
    if (flip) for (const el of tbody.children) first.set(el, el.getBoundingClientRect().top);

    // reorder / mount
    slice.forEach(u => tbody.appendChild(rowEl(u)));
    while (tbody.children.length > slice.length) tbody.lastElementChild.remove();
    const oldEmpty = tbody.querySelector('tr.empty');
    if (oldEmpty) oldEmpty.remove();
    if (!slice.length) tbody.appendChild(emptyRow());

    // LAST + INVERT + PLAY
    if (flip) {
      [...tbody.children].forEach((el, i) => {
        if (el.classList.contains('empty')) return;
        const f = first.get(el);
        if (f != null) {
          const dy = f - el.getBoundingClientRect().top;
          if (Math.abs(dy) > 2) {
            el.style.transition = 'none';
            el.style.transform = `translateY(${dy}px)`;
            el.getBoundingClientRect(); // force reflow
            el.style.transition = `transform .5s cubic-bezier(.22,1,.36,1) ${i * 14}ms`;
            el.style.transform = '';
            el.addEventListener('transitionend', () => { el.style.transition = ''; }, { once: true });
          }
        } else {
          el.classList.remove('enter');
          void el.offsetWidth;
          el.style.animationDelay = (i * 35) + 'ms';
          el.classList.add('enter');
        }
      });
    }

    syncSelectionUI();
    renderPager(pages);
    updateShowing();
    updateSortUI();
    $('#totalCount').textContent = users.length;
    $('#seatNote').textContent = users.length;
  }

  function renderPager(pages) {
    const nav = $('#pager');
    nav.innerHTML = '';
    const p = state.page;
    const mk = (label, page, opts = {}) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pill' + (opts.active ? ' active' : '');
      b.innerHTML = label;
      b.disabled = !!opts.disabled;
      b.setAttribute('aria-label', opts.aria || ('Page ' + page));
      if (opts.active) b.setAttribute('aria-current', 'page');
      if (!opts.disabled) b.addEventListener('click', () => { state.page = page; render(); });
      return b;
    };
    nav.append(mk(ICON.chevL, p - 1, { disabled: p === 1, aria: 'Previous page' }));
    for (let i = 1; i <= pages; i++) nav.append(mk(String(i), i, { active: i === p, aria: `Page ${i}` }));
    nav.append(mk(ICON.chevR, p + 1, { disabled: p === pages, aria: 'Next page' }));
  }

  function updateShowing() {
    const n = sorted().length, total = users.length;
    const start = n ? (state.page - 1) * PAGE + 1 : 0;
    const end = Math.min(state.page * PAGE, n);
    const filtered = state.q.trim() && n !== total;
    $('#showing').innerHTML =
      `Showing <b>${start}–${end}</b> of <b>${total}</b>` +
      (filtered ? ` <span class="dim">· ${n} match${n === 1 ? '' : 'es'}</span>` : '') +
      (state.selected.size ? ` <span class="dim">·</span> <span class="selnote">${state.selected.size} selected</span>` : '');
  }

  function updateSortUI() {
    document.querySelectorAll('.sortbtn').forEach(b => {
      const active = b.dataset.key === state.key;
      const th = b.closest('th');
      th.setAttribute('aria-sort', active ? (state.dir === 1 ? 'ascending' : 'descending') : 'none');
      b.classList.toggle('on', active);
      b.classList.toggle('desc', active && state.dir === -1);
    });
  }

  /* ---------- selection ---------- */
  function setSel(id, on) {
    on ? state.selected.add(id) : state.selected.delete(id);
    syncSelectionUI();
  }
  const toggleSel = id => setSel(id, !state.selected.has(id));

  function syncSelectionUI() {
    for (const [id, el] of rowCache) {
      const on = state.selected.has(id);
      el.classList.toggle('selected', on);
      const cb = el.querySelector('.rowcheck');
      if (cb.checked !== on) cb.checked = on;
    }
    const vis = visibleIds();
    const selVis = vis.filter(id => state.selected.has(id)).length;
    checkAll.checked = vis.length > 0 && selVis === vis.length;
    checkAll.indeterminate = selVis > 0 && selVis < vis.length;
    const n = state.selected.size;
    $('#bulkbar').classList.toggle('open', n > 0);
    $('#selCount').innerHTML = `<b>${n}</b> member${n === 1 ? '' : 's'} selected`;
    updateShowing();
  }

  checkAll.addEventListener('change', e => {
    visibleIds().forEach(id => e.target.checked ? state.selected.add(id) : state.selected.delete(id));
    syncSelectionUI();
  });

  /* ---------- sorting ---------- */
  document.querySelectorAll('.sortbtn').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.key;
    if (state.key === k) state.dir *= -1;
    else { state.key = k; state.dir = (k === 'usage') ? -1 : 1; }
    render();
  }));

  /* ---------- search ---------- */
  let qT;
  $('#q').addEventListener('input', e => {
    clearTimeout(qT);
    qT = setTimeout(() => { state.q = e.target.value; state.page = 1; render(); }, 120);
  });

  /* ---------- status mutation ---------- */
  function popChip(id) {
    const u = byId(id), el = rowCache.get(id);
    if (!u || !el) return;
    const td = el.querySelector('.col-status');
    td.innerHTML = chipHTML(u);
    td.querySelector('.chip').classList.add('pop');
  }

  /* ---------- bulk actions ---------- */
  $('#bulkClear').addEventListener('click', () => { state.selected.clear(); syncSelectionUI(); });
  $('#bulkExport').addEventListener('click', () => {
    toast(`Exported ${state.selected.size} member${state.selected.size === 1 ? '' : 's'} to CSV`);
  });
  $('#bulkSuspend').addEventListener('click', () => {
    let n = 0;
    state.selected.forEach(id => {
      const u = byId(id);
      if (u && u.status !== 'suspended') { u.status = 'suspended'; popChip(id); n++; }
    });
    lastSync = Date.now();
    render();
    toast(n ? `${n} member${n === 1 ? '' : 's'} suspended` : 'Already suspended');
  });
  $('#bulkRemove').addEventListener('click', () => {
    const ids = [...state.selected];
    const els = [...tbody.children].filter(el => ids.includes(+el.dataset.id));
    els.forEach((el, i) => { el.style.animationDelay = (i * 25) + 'ms'; el.classList.add('exit'); });
    setTimeout(() => {
      users = users.filter(u => !state.selected.has(u.id));
      state.selected.clear();
      lastSync = Date.now();
      render();
      toast(`${ids.length} member${ids.length === 1 ? '' : 's'} removed`);
    }, 320);
  });

  /* ---------- row kebab menu ---------- */
  function openMenu(btn, id) {
    menuUser = id;
    const u = byId(id);
    if (!u) return;
    $('#menuToggleLabel').textContent = u.status === 'suspended' ? 'Reactivate member' : 'Suspend member';
    const r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 6) + 'px';
    menu.style.left = Math.max(10, Math.min(r.right - 186, innerWidth - 198)) + 'px';
    menu.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(() => menu.classList.add('open'));
  }
  function closeMenu() {
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
    menuUser = null;
  }
  document.addEventListener('click', e => {
    if (menu.classList.contains('open') && !e.target.closest('.menu') && !e.target.closest('.kebab')) closeMenu();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  scroller.addEventListener('scroll', closeMenu, { passive: true });
  window.addEventListener('resize', closeMenu);

  menu.addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn || menuUser == null) return;
    const u = byId(menuUser);
    if (!u) return closeMenu();
    const act = btn.dataset.act;
    if (act === 'view') toast(`Opening ${u.name}'s profile…`);
    if (act === 'copy') {
      if (navigator.clipboard) navigator.clipboard.writeText(u.email).then(() => toast('Email copied to clipboard'));
      else toast(u.email);
    }
    if (act === 'toggle') {
      u.status = u.status === 'suspended' ? 'active' : 'suspended';
      lastSync = Date.now();
      popChip(u.id);
      closeMenu();
      render();
      toast(`${u.name} ${u.status === 'suspended' ? 'suspended' : 'reactivated'}`);
      return;
    }
    closeMenu();
  });

  /* ---------- misc chrome ---------- */
  $('#inviteBtn').addEventListener('click', () => toast('Invite link copied to clipboard'));
  $('#bellBtn').addEventListener('click', () => toast("You're all caught up"));

  // sticky-header shadow
  new IntersectionObserver(
    ([e]) => scroller.classList.toggle('stuck', !e.isIntersecting),
    { root: scroller, threshold: 0 }
  ).observe($('#sentinel'));

  // ambient sync ticker
  setInterval(() => {
    const s = Math.floor((Date.now() - lastSync) / 1000);
    $('#sync').textContent = s < 3 ? 'synced just now' : `synced ${s}s ago`;
  }, 1000);

  /* ---------- go ---------- */
  render(true);
})();
</script>
</body>
</html>
