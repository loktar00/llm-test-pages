<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Bokeh Field</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="bokehCanvas"></canvas>

    <script>
        const canvas = document.getElementById('bokehCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const NUM_PARTICLES = 150;
        const LAYERS = 3; // Deep, Mid, Near

        // Configuration
        const CYCLE_DURATION = 10000; // 10 seconds
        let startTime = Date.now();
        
        // Palette
        const PALETTE = [
            { h: 40, s: 90, l: 60, r: 255, g: 220, b: 100 },   // Warm Gold
            { h: 20, s: 80, l: 50, r: 255, g: 160, b: 60 },    // Deep Orange
            { h: 0,   s: 80, l: 60, r: 255, g: 100, b: 100 },   // Soft Red (Traffic lights)
            { h: 200, s: 80, l: 60, r: 100, g: 150, b: 255 },   // Cool Blue (Windows)
            { h: 280, s: 70, l: 60, r: 200, g: 100, b: 255 },   // Neon Purple
            { h: 360, s: 0, l: 100, r: 255, g: 255, b: 255 }    // White
        ];

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                // Assign a layer (0 = far, 1 = mid, 2 = near)
                this.layer = Math.floor(Math.random() * LAYERS);
                
                // Radius based on layer and randomness
                // Far: 5-15, Mid: 15-35, Near: 35-80
                const baseR = [10, 25, 50][this.layer];
                const variance = [5, 10, 30][this.layer];
                this.radius = baseR + Math.random() * variance;

                // Position
                this.x = Math.random() * width;
                this.y = Math.random() * height;

                // Drift Speed (Parallax effect)
                // Near moves faster
                this.vx = (0.2 + Math.random() * 0.5) * (this.layer + 1);

                // Color selection
                const colorDef = PALETTE[Math.floor(Math.random() * PALETTE.length)];
                this.r = colorDef.r;
                this.g = colorDef.g;
                this.b = colorDef.b;
                
                // Aperture Type: 0 = Soft Circle, 1 = Polygonal (Hexagon/Star)
                // This determines what it looks like when in focus
                this.shapeType = Math.random() > 0.3 ? 0 : 1; 
                
                // Random seed for polygon vertices
                this.numSides = 6;
                this.angle = Math.random() * Math.PI;
                
                // Opacity
                this.alpha = 0.6 + Math.random() * 0.4;
            }

            update(time) {
                // Move horizontally
                this.x += this.vx;
                if (this.x > width + this.radius * 2) {
                    this.x = -this.radius * 2;
                }
            }

            draw(ctx, focusLevel, currentFocusLayer) {
                // Calculate "defocus" strength
                // Focus level is 0.0 to 1.0 cycling
                // We want a specific layer to be sharp.
                
                let distanceToFocus = 0;
                
                if (currentFocusLayer === 0) {
                    // Focusing on far layer
                    distanceToFocus = (this.layer === 0) ? 0 : (this.layer * 0.5) + 0.5;
                } else if (currentFocusLayer === 1) {
                    // Focusing on mid layer
                    distanceToFocus = (this.layer === 1) ? 0 : Math.abs(this.layer - 1) * 0.5 + 0.3;
                } else {
                    // Focusing on near layer
                    distanceToFocus = (this.layer === 2) ? 0 : ((this.layer - 2) * -0.5) + 0.5;
                }

                // Soften edges based on distance to focus
                // If distanceToFocus is high, it's very blurry.
                // We use this to interpolate between a soft circle and a sharp polygon.
                
                // Thresholds
                const blurThreshold = 0.3; 
                const sharpThreshold = 0.05;
                
                let sharpness = 0;
                if (distanceToFocus < sharpThreshold) {
                    sharpness = 1.0; // Fully in focus
                } else if (distanceToFocus < blurThreshold) {
                    // Interpolate between sharp and blurred
                    sharpness = (blurThreshold - distanceToFocus) / (blurThreshold - sharpThreshold);
                } else {
                    sharpness = 0.0; // Fully out of focus
                }

                // Draw the Bokeh Disc
                ctx.beginPath();
                
                // Dynamic Radius: Slight breathing effect
                const r = this.radius;

                // Draw Method
                if (sharpness > 0.5) {
                    // POLYGONAL APERTURE (Sharp)
                    // We draw a polygon with sharp edges
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle + (time * 0.0001)); // Slow rotation
                    
                    ctx.beginPath();
                    const sides = this.shapeType === 1 ? 6 : 4; // Hexagon or Diamond
                    const innerR = r * 0.85;
                    const outerR = r;

                    for (let i = 0; i < sides; i++) {
                        const theta = (i / sides) * Math.PI * 2;
                        const px = Math.cos(theta) * outerR;
                        const py = Math.sin(theta) * outerR;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                        
                        // Add "blades" effect
                        const midTheta = theta + (Math.PI / sides);
                        const mx = Math.cos(midTheta) * innerR;
                        const my = Math.sin(midTheta) * innerR;
                        ctx.lineTo(mx, my);
                    }
                    ctx.closePath();
                    
                    // Fill with solid color
                    ctx.fillStyle = `rgba(${this.r}, ${this.g}, ${this.b}, ${this.alpha})`;
                    ctx.fill();

                    // Add a glow/bloom
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = `rgba(${this.r}, ${this.g}, ${this.b}, 1)`;
                    ctx.stroke();
                    ctx.shadowBlur = 0; // Reset

                } else {
                    // SOFT CIRCLE (Out of focus)
                    ctx.translate(this.x, this.y);
                    
                    // Create radial gradient for softness
                    // The blurrier it is, the more transparent the center becomes
                    const alphaFade = 0.3 + (sharpness * 0.4);
                    
                    const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
                    grad.addColorStop(0, `rgba(${this.r}, ${this.g}, ${this.b}, ${alphaFade})`);
                    grad.addColorStop(0.5, `rgba(${this.r}, ${this.g}, ${this.b}, ${alphaFade * 0.5})`);
                    grad.addColorStop(1, `rgba(${this.r}, ${this.g}, ${this.b}, 0)`);

                    ctx.fillStyle = grad;
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function init() {
            resize();
            window.addEventListener('resize', resize);
            
            // Create particles
            for (let i = 0; i < NUM_PARTICLES; i++) {
                particles.push(new Particle());
            }
            
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function animate() {
            const now = Date.now();
            const elapsed = now - startTime;
            
            // Clear screen with a very slight fade for trails? 
            // No, clean clear for crisp bokeh
            ctx.clearRect(0, 0, width, height);
            
            // Background Gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#0a0a12'); // Dark Blue/Black top
            bgGrad.addColorStop(1, '#1a1005'); // Dark Warm bottom
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Calculate Focus State
            // Cycle 0 -> 1 -> 0 over 10 seconds
            const cyclePos = (elapsed % CYCLE_DURATION) / CYCLE_DURATION;
            
            // Smooth sine wave for focus level (0 to 1)
            // Math.sin gives -1 to 1, we normalize
            const rawFocus = Math.sin(cyclePos * Math.PI * 2);
            const focusLevel = (rawFocus + 1) / 2; // 0 to 1

            // Determine which layer is currently in focus based on level
            // 0.0 - 0.33 -> Layer 0 (Far)
            // 0.33 - 0.66 -> Layer 1 (Mid)
            // 0.66 - 1.0 -> Layer 2 (Near)
            let currentFocusLayer = 0;
            if (focusLevel > 0.33 && focusLevel <= 0.66) currentFocusLayer = 1;
            if (focusLevel > 0.66) currentFocusLayer = 2;
            
            // Also keep a "focus strength" factor. 
            // Even if we are targeting Layer 1, Layer 0 and 2 are still blurry.
            // But Layer 1 is sharpest.
            
            // We need to pass a generic "Focus Value" to the particle.
            // The particle calculates its own sharpness relative to the target layer.
            // However, to make the transition smoother, we can blend the focus strength.
            
            // To make it feel like a "pull", we use the rawFocus value but mapped to distance.
            // Actually, the logic inside `draw` handles the distance to focus layer.
            // We just need to ensure that when focusLevel is exactly at the target layer transition, 
            // the sharpness peaks.
            
            // Let's refine the "distanceToFocus" calculation in draw to use `rawFocus` directly?
            // No, discrete layers work best for the "Cinema Lens" feel.
            
            // Update and Draw
            // Sort particles? No, overdraw is fine for this style.
            
            // Draw Order:
            // We draw everything in random order (or layer order)
            // To simulate depth of field properly, we usually draw back to front.
            // However, since we are drawing overlapping circles, the order of the array is fine.
            
            particles.forEach(p => {
                p.update();
                // Pass the calculated focus state
                p.draw(ctx, focusLevel, currentFocusLayer);
            });

            requestAnimationFrame(animate);
        }

        init();

    </script>
</body>
</html>
