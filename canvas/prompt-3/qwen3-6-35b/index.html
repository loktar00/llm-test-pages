<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stable N-Body Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4deeea;
        }
        p {
            font-size: 14px;
            margin: 0;
            color: #aaa;
        }
        #timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #4deeea;
            width: 0%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h1 id="sim-title">Solar System</h1>
        <p>3-Second Cycle Simulation</p>
    </div>
    <div id="timer-bar"></div>
    <canvas id="simCanvas"></canvas>

<script>
/**
 * Configuration and Constants
 */
const G = 0.5; // Gravitational Constant (scaled for visual simulation)
const TRAIL_LENGTH = 150;
const TRANSITION_SPEED = 3; // Seconds per simulation

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const titleEl = document.getElementById('sim-title');
const timerBar = document.getElementById('timer-bar');

let width, height, centerX, centerY;
let stars = [];
let bodies = [];
let currentSimIndex = 0;
let simStartTime = 0;
let animationId;

// Resize handling
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width / 2;
    centerY = height / 2;
    generateStars();
}
window.addEventListener('resize', resize);

// Utility: Random range
const random = (min, max) => Math.random() * (max - min) + min;

// Utility: Distance
const getDist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);

/**
 * Classes
 */
class Star {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5;
        this.alpha = Math.random();
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
    }

    draw(time) {
        const a = this.alpha + Math.sin(time * this.twinkleSpeed) * 0.3;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, a))})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Body {
    constructor(x, y, vx, vy, mass, color, radius) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.mass = mass;
        this.color = color;
        this.radius = radius;
        this.trail = [];
        this.lastTime = Date.now();
    }

    update(allBodies) {
        let fx = 0;
        let fy = 0;

        for (let other of allBodies) {
            if (other === this) continue;

            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const distSq = dx * dx + dy * dy;
            const dist = Math.sqrt(distSq);

            // Softening parameter to prevent infinite forces at collision
            const softening = 5; 
            
            const force = (G * this.mass * other.mass) / (distSq + softening);
            
            // Vector components
            fx += (force * dx) / dist;
            fy += (force * dy) / dist;
        }

        // F = ma -> a = F/m
        this.vx += fx / this.mass;
        this.vy += fy / this.mass;
        
        this.x += this.vx;
        this.y += this.vy;

        // Trail Logic (Frame-rate independent-ish)
        const now = Date.now();
        // We add points based on distance moved to keep trail smooth regardless of FPS
        // But strictly for visual simplicity in this demo, we just push every update
        if (this.trail.length === 0 || getDist(this.x, this.y, this.trail[this.trail.length-1].x, this.trail[this.trail.length-1].y) > 2) {
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > TRAIL_LENGTH) {
                this.trail.shift();
            }
        }
    }

    draw() {
        // Draw Trail
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0].x, this.trail[0].y);
            for (let i = 1; i < this.trail.length; i++) {
                ctx.lineTo(this.trail[i].x, this.trail[i].y);
            }
            // Gradient trail
            const gradient = ctx.createLinearGradient(
                this.trail[0].x, this.trail[0].y, 
                this.x, this.y
            );
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, this.color);
            
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Draw Body
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        
        // Glow effect
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

/**
 * Simulation Scenarios
 * All scaled to fit nicely on screen and maintain ~3s orbit periods visually
 */
const simulations = [
    // 1. Solar System (Sun + 3 Planets)
    {
        name: "Solar System",
        setup: () => {
            const b = [];
            // Sun
            b.push(new Body(0, 0, 0, 0, 800, '#FFD700', 12));
            // Mercury-ish
            b.push(new Body(50, 0, 0, 3.8, 5, '#A9A9A9', 3));
            // Earth-ish
            b.push(new Body(120, 0, 0, 2.4, 10, '#00BFFF', 4));
            // Mars-ish
            b.push(new Body(190, 0, 0, 1.9, 8, '#FF6347', 3.5));
            return b;
        }
    },
    // 2. Sun, Earth, Moon
    {
        name: "Earth-Moon System",
        setup: () => {
            const b = [];
            // Sun (Heavy, stationary center)
            b.push(new Body(0, 0, 0, 0, 2000, '#FFD700', 15));
            
            // Earth (Orbiting Sun)
            // V_sun approx 2.2 at dist 150
            const earthDist = 150;
            const earthV = Math.sqrt(G * 2000 / earthDist); // approx 2.58
            const earth = new Body(earthDist, 0, 0, earthV, 50, '#00BFFF', 6);
            b.push(earth);

            // Moon (Orbiting Earth)
            // We need Moon velocity = EarthVelocity + MoonOrbitalVelocity
            const moonDist = 18; // relative to earth
            const moonOrbitalV = Math.sqrt(G * 50 / moonDist); // approx 1.8
            // Vector addition: Moon is at Earth's position, moving same direction as Earth + local orbit
            const moon = new Body(earthDist + moonDist, 0, 0, earthV + moonOrbitalV, 2, '#CCCCCC', 2);
            b.push(moon);

            return b;
        }
    },
    // 3. Figure 8 Three-Body
    {
        name: "Figure 8 Orbit",
        setup: () => {
            const b = [];
            const mass = 200;
            // Initial Conditions for Figure 8
            // Found via numerical integration, scaled for our G and Canvas size
            const posScale = 100;
            const velScale = 2;
            
            const v1x = 0.93240737 * velScale;
            const v1y = 0.86473146 * velScale;
            
            // Body 1
            b.push(new Body(posScale * -0.97000436, posScale * 0.24308753, v1x, v1y, mass, '#4deeea', 5));
            // Body 2
            b.push(new Body(posScale * 0.97000436, posScale * -0.24308753, v1x, v1y, mass, '#ff00ff', 5));
            // Body 3 (Center)
            b.push(new Body(0, 0, -2 * v1x, -2 * v1y, mass, '#00ff00', 5));

            return b;
        }
    }
];

/**
 * Main Loop
 */
function init() {
    resize();
    loadSimulation(0);
    simStartTime = Date.now();
    animate();
}

function loadSimulation(index) {
    currentSimIndex = index;
    titleEl.innerText = simulations[index].name;
    bodies = simulations[index].setup();
    simStartTime = Date.now();
}

function generateStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push(new Star());
    }
}

function animate() {
    // Clear Canvas
    ctx.fillStyle = 'rgba(0, 0, 0, 1)'; // Black background
    ctx.fillRect(0, 0, width, height);

    // Draw Stars
    const time = Date.now();
    stars.forEach(star => star.draw(time));

    // Physics Update
    // We do sub-stepping for better stability
    const subSteps = 4;
    for (let s = 0; s < subSteps; s++) {
        bodies.forEach(body => body.update(bodies));
    }

    // Draw Bodies
    bodies.forEach(body => body.draw());

    // Timer Logic (3 second cycle)
    const elapsed = (Date.now() - simStartTime) / 1000;
    const progress = (elapsed % TRANSITION_SPEED) / TRANSITION_SPEED;
    
    // Update UI Bar
    timerBar.style.width = `${progress * 100}%`;

    // Check for switch
    if (elapsed >= TRANSITION_SPEED) {
        const nextIndex = (currentSimIndex + 1) % simulations.length;
        loadSimulation(nextIndex);
    }

    animationId = requestAnimationFrame(animate);
}

// Start
init();

</script>
</body>
</html>
