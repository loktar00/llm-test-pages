<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidepool — Sprint 24 Board</title>
<style>
  :root{
    --bg:#0b1315;
    --line:rgba(233,244,241,.07);
    --text:#e9f2ef;
    --muted:#8ba7a2;
    --faint:#67827e;
    --amber:#ffb454;
    --coral:#ff6358;
    --mint:#63e2b7;
    --sky:#57b8ff;
    --mono:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;
    --sans:'Avenir Next',Avenir,'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--text);
    background:
      radial-gradient(rgba(233,244,241,.035) 1px, transparent 1.4px) 0 0 / 23px 23px,
      var(--bg);
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{ /* drifting ambient glows */
    content:'';position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 480px at 82% -8%, rgba(64,214,190,.075), transparent 62%),
      radial-gradient(760px 520px at -6% 108%, rgba(255,150,80,.065), transparent 60%),
      radial-gradient(600px 400px at 55% 120%, rgba(87,184,255,.045), transparent 60%);
    animation:drift 28s ease-in-out infinite alternate;
  }
  body::after{ /* signature spectrum hairline */
    content:'';position:fixed;top:0;left:0;right:0;height:3px;z-index:5;
    background:linear-gradient(90deg,var(--amber),var(--coral) 34%,var(--mint) 68%,var(--sky));
    opacity:.9;
  }
  @keyframes drift{from{transform:translate3d(2%,-1.5%,0)}to{transform:translate3d(-2%,2%,0)}}
  ::selection{background:rgba(255,180,84,.35)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,[contenteditable="true"]:focus-visible{outline:2px solid rgba(255,180,84,.7);outline-offset:2px;border-radius:6px}

  /* ---------- header ---------- */
  .top{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:20px 28px 15px;
    border-bottom:1px solid var(--line);
    background:rgba(11,19,21,.55);
    backdrop-filter:blur(9px);
    animation:fadeDown .55s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:40px;height:40px;border-radius:12px;flex:none;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--amber),var(--coral) 58%,#ff8f7a);
    box-shadow:0 6px 18px -6px rgba(255,120,80,.55), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .3s cubic-bezier(.2,.8,.3,1.4);
  }
  .brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
  .logo svg{width:21px;height:21px}
  .eyebrow{
    font-family:var(--mono);font-size:9.5px;font-weight:700;
    letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px;margin-bottom:4px;
  }
  .e-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
  .wk{
    letter-spacing:.14em;color:#cfe3df;background:rgba(233,244,241,.06);
    border:1px solid var(--line);border-radius:99px;padding:2px 8px 1px;
  }
  h1{font-size:clamp(20px,2.3vw,27px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
  h1 .hl{
    color:var(--amber);
    background:linear-gradient(transparent 64%, rgba(255,180,84,.22) 0);
    padding:0 2px;
  }
  .head-right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .vr{width:1px;height:30px;background:var(--line)}
  .team{display:flex;padding-left:7px}
  .team .avatar{width:29px;height:29px;font-size:9.5px;margin-left:-8px;cursor:default}
  .team .avatar:hover{transform:translateY(-4px) scale(1.1);z-index:2}
  .progress{text-align:right}
  .p-label{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .p-num{font-family:var(--mono);font-size:13px;font-weight:700;color:#d9e8e4;margin-bottom:5px}
  .p-num b{color:var(--mint)}
  .bar{width:132px;height:5px;border-radius:99px;background:rgba(233,244,241,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3fd6a8,var(--mint));box-shadow:0 0 10px rgba(99,226,183,.6);transition:width .7s cubic-bezier(.2,.7,.3,1)}
  .clockbox{text-align:right;min-width:86px}
  .clock{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;color:#d9e8e4;font-variant-numeric:tabular-nums}
  .cdate{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:3px}

  /* ---------- board ---------- */
  #board{
    flex:1;min-height:0;
    display:flex;gap:16px;align-items:stretch;
    padding:20px 28px 12px;
    overflow-x:auto;overflow-y:hidden;
  }
  #board::-webkit-scrollbar{height:10px}
  #board::-webkit-scrollbar-thumb{background:rgba(233,244,241,.1);border-radius:99px}
  #board::-webkit-scrollbar-thumb:hover{background:rgba(233,244,241,.2)}

  .col{
    flex:1 0 282px;max-width:352px;min-height:0;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(233,244,241,.05), rgba(233,244,241,.014));
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 10px 30px -18px rgba(0,0,0,.7);
    transition:border-color .25s, background .25s;
    animation:colIn .55s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:calc(var(--i) * 85ms);
  }
  @keyframes colIn{from{opacity:0;transform:translateY(18px)}}
  .col.drag-over{
    border-color:rgba(233,244,241,.2);
    border-color:color-mix(in srgb, var(--c) 45%, transparent);
    background:linear-gradient(180deg, rgba(233,244,241,.07), rgba(233,244,241,.02));
  }
  .col-head{position:relative;display:flex;align-items:center;gap:9px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
  .col-head::after{
    content:'';position:absolute;left:14px;bottom:-1.5px;width:34px;height:2.5px;border-radius:2px;
    background:var(--c);box-shadow:0 0 10px var(--c);
    transition:width .3s cubic-bezier(.2,.7,.3,1);
  }
  .col.drag-over .col-head::after{width:64px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);flex:none}
  .col-title{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#d7e5e1}
  .count{
    font-family:var(--mono);font-size:10px;font-weight:700;
    padding:2px 8px 1px;border-radius:99px;min-width:24px;text-align:center;
    color:#c6d8d3;background:rgba(233,244,241,.07);border:1px solid var(--line);
    color:color-mix(in srgb, var(--c) 75%, white 25%);
    background:color-mix(in srgb, var(--c) 13%, transparent);
    border-color:color-mix(in srgb, var(--c) 28%, transparent);
    transition:transform .25s;
  }
  .col:hover .count{transform:scale(1.08)}
  .col-menu{margin-left:auto;color:var(--faint);font-size:14px;letter-spacing:2px;line-height:1;padding:2px 5px;border-radius:6px;opacity:.55;transition:.2s}
  .col-menu:hover{opacity:1;color:var(--text);background:rgba(233,244,241,.07)}

  .cards{
    flex:1;min-height:70px;overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;
    padding:13px 10px 10px 13px;
    scrollbar-width:thin;scrollbar-color:rgba(233,244,241,.18) transparent;
  }
  .cards::-webkit-scrollbar{width:9px}
  .cards::-webkit-scrollbar-track{background:transparent}
  .cards::-webkit-scrollbar-thumb{
    background:rgba(233,244,241,.1);border-radius:99px;
    border:2px solid transparent;background-clip:padding-box;
  }
  .cards::-webkit-scrollbar-thumb:hover{background:rgba(233,244,241,.26);background-clip:padding-box}

  /* ---------- cards ---------- */
  .card{
    position:relative;
    background:linear-gradient(180deg,#18272b,#142024);
    border:1px solid rgba(233,244,241,.07);
    border-left:3px solid rgba(233,244,241,.2);
    border-left-color:color-mix(in srgb, var(--pc) 70%, transparent);
    border-radius:11px;
    padding:11px 12px 10px;
    cursor:grab;user-select:none;
    will-change:transform;
    box-shadow:0 2px 8px -3px rgba(0,0,0,.55);
    transition:transform .3s cubic-bezier(.2,.8,.3,1.1), box-shadow .3s, border-color .3s, opacity .25s;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
    animation-delay:var(--d,0ms);
  }
  @keyframes rise{from{opacity:0;transform:translateY(13px) scale(.98)}}
  .card:hover{
    z-index:3;
    border-color:rgba(233,244,241,.13);
    box-shadow:0 16px 30px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(233,244,241,.04);
  }
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4;transform:rotate(2.5deg) scale(1.02);box-shadow:none}
  .card.dropped{animation:settle .35s cubic-bezier(.2,.7,.3,1.3)}
  @keyframes settle{from{transform:scale(1.035)}}

  .card.urgent{
    border-color:rgba(255,99,88,.42);
    border-left-color:var(--coral);
    background:linear-gradient(180deg, rgba(255,99,88,.11), rgba(255,99,88,.02)), #152125;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both var(--d,0ms), urgentPulse 2.6s ease-in-out 1.2s infinite;
  }
  @keyframes urgentPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,99,88,0), 0 3px 10px -4px rgba(0,0,0,.6)}
    50%{box-shadow:0 0 0 7px rgba(255,99,88,.09), 0 0 26px -2px rgba(255,99,88,.3)}
  }

  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .prio{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    padding:3px 7px 2px;border-radius:5px;
    color:#d5e6e2;background:rgba(233,244,241,.07);border:1px solid rgba(233,244,241,.13);
    color:color-mix(in srgb, var(--pc) 68%, white 32%);
    background:color-mix(in srgb, var(--pc) 15%, transparent);
    border-color:color-mix(in srgb, var(--pc) 32%, transparent);
  }
  .pdot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .card-id{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:rgba(139,167,162,.75)}
  .card-del{opacity:0;font-size:11px;line-height:1;color:var(--faint);padding:3px 5px;border-radius:5px;transition:.2s}
  .card:hover .card-del{opacity:.75}
  .card-del:hover{color:var(--coral);background:rgba(255,99,88,.12);opacity:1 !important}

  .ttl{font-size:14px;line-height:1.38;font-weight:600;letter-spacing:-.005em;margin-bottom:9px;border-radius:4px}
  .ttl[contenteditable="true"]{user-select:text;outline:1px dashed rgba(255,180,84,.65);outline-offset:3px}

  .labels{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
  .lab{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;
    padding:2.5px 8px 2px;border-radius:99px;
    color:#c9dbd6;background:rgba(233,244,241,.06);border:1px solid rgba(233,244,241,.1);
    color:color-mix(in srgb, var(--lc) 76%, white 24%);
    background:color-mix(in srgb, var(--lc) 12%, transparent);
    border-color:color-mix(in srgb, var(--lc) 26%, transparent);
  }
  .lab::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--lc);flex:none}

  .card-bot{display:flex;align-items:center;gap:8px}
  .due{
    display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.03em;
    color:var(--muted);padding:3px 8px;border-radius:6px;
    background:rgba(233,244,241,.05);border:1px solid rgba(233,244,241,.07);
  }
  .due svg{width:11px;height:11px;flex:none}
  .due.today{color:#ffd08e;background:rgba(255,180,84,.13);border-color:rgba(255,180,84,.32)}
  .due.late{color:#ff9d94;background:rgba(255,99,88,.11);border-color:rgba(255,99,88,.32)}
  .avatars{margin-left:auto;display:flex}
  .avatar{
    width:23px;height:23px;border-radius:50%;flex:none;
    display:grid;place-items:center;
    font-size:8px;font-weight:800;letter-spacing:.02em;color:#0a1518;
    background:linear-gradient(135deg,var(--a0),var(--a1));
    border:2px solid #142024;margin-left:-7px;
    box-shadow:0 2px 5px rgba(0,0,0,.45);
    transition:transform .22s cubic-bezier(.2,.8,.3,1.3), margin .22s;
  }
  .avatar:first-child{margin-left:0}
  .avatars:hover .avatar{margin-left:2px}
  .avatars:hover .avatar:first-child{margin-left:0}
  .avatar:hover{transform:translateY(-3px) scale(1.12);z-index:2}

  .col[data-col="done"] .card{opacity:.8}
  .col[data-col="done"] .card:hover{opacity:1}
  .col[data-col="done"] .ttl{color:#b9cdc8}
  .col[data-col="done"] .card-id::before{content:'✓ ';color:var(--mint);font-weight:700}

  /* ghost add affordance */
  .add-card{
    margin:2px 12px 12px;padding:9px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12px;font-weight:600;color:var(--muted);
    border:1.5px dashed rgba(233,244,241,.15);
    opacity:.6;transition:.25s;
  }
  .add-card .plus{font-size:15px;line-height:0;transition:transform .3s cubic-bezier(.2,.8,.3,1.4)}
  .add-card:hover{
    opacity:1;color:#e2efeb;
    border-color:rgba(233,244,241,.35);
    border-color:color-mix(in srgb, var(--c) 55%, transparent);
    background:rgba(233,244,241,.04);
    background:color-mix(in srgb, var(--c) 8%, transparent);
  }
  .add-card:hover .plus{transform:rotate(90deg) scale(1.15)}

  /* ---------- status bar ---------- */
  .status{
    display:flex;align-items:center;gap:14px;
    padding:10px 28px 14px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);
    animation:fadeIn .8s .4s both;
  }
  @keyframes fadeIn{from{opacity:0}}
  .sync{display:inline-flex;align-items:center;gap:7px;color:#9fc4ba}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 9px var(--mint)}50%{opacity:.45;box-shadow:0 0 2px var(--mint)}}
  .hints{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  kbd{
    font-family:var(--mono);font-size:9px;color:#a9c1bc;
    padding:2px 6px 1px;border-radius:4px;
    border:1px solid var(--line);border-bottom-width:2px;
    background:rgba(233,244,241,.05);
  }

  @media (max-width:860px){
    .clockbox,.vr{display:none}
    #board{padding:16px 16px 10px;gap:12px}
    .top{padding:16px 16px 12px}
    .status{padding:9px 16px 12px}
    .col{flex-basis:262px}
  }
  @media (max-width:560px){.progress{display:none}.hints{display:none}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="#0b1315"/></svg>
    </div>
    <div>
      <div class="eyebrow"><span class="e-dot"></span>Tidepool · Product Engineering <span class="wk">WK 10</span></div>
      <h1>Sprint 24 — <span class="hl">Payments revamp</span></h1>
    </div>
  </div>
  <div class="head-right">
    <div class="team" id="team" title="Team"></div>
    <div class="vr"></div>
    <div class="progress">
      <div class="p-label">Shipped</div>
      <div class="p-num"><b id="progNum">0</b> / <span id="progTotal">0</span></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <div class="vr"></div>
    <div class="clockbox">
      <div class="clock" id="clockTime">--:--:--</div>
      <div class="cdate" id="clockDate">···</div>
    </div>
  </div>
</header>

<main id="board" aria-label="Kanban board"></main>

<footer class="status">
  <span class="sync"><i></i>Live · synced just now</span>
  <span class="hints">
    <kbd>drag</kbd> to move &nbsp;·&nbsp; <kbd>double-click</kbd> to edit &nbsp;·&nbsp; <kbd>+</kbd> to add a card
  </span>
</footer>

<script>
(function(){
  'use strict';

  const PEOPLE = {
    MK:{n:'Mira Kade',   c:['#ff8a5c','#ff5d73']},
    JR:{n:'Jonah Reyes', c:['#4fd6c0','#4aa8ff']},
    LN:{n:'Lena Nord',   c:['#b7e26b','#3fd6a8']},
    DK:{n:'Dev Kaur',    c:['#6cc7ff','#7a9cff']},
    AT:{n:'Ava Tanaka',  c:['#ffd166','#ff9f6b']}
  };
  const LABELS = {
    Frontend:'#6cc7ff', Backend:'#ffab6b', Design:'#e0a6ff', Infra:'#63e2b7',
    Research:'#ffe08a', Copy:'#ff9ecb', Bug:'#ff7a6e', Data:'#9fb4ff'
  };
  const PRIO = {
    urgent:{t:'Urgent', c:'#ff6358'},
    high:  {t:'High',   c:'#ffb454'},
    medium:{t:'Medium', c:'#57b8ff'},
    low:   {t:'Low',    c:'#79d29b'}
  };
  const COLS = [
    ['backlog','Backlog','#a3b7d3'],
    ['progress','In progress','#ffb454'],
    ['review','Review','#6cc7ff'],
    ['done','Done','#63e2b7']
  ];
  const DATA = {
    backlog:[
      {id:'TSK-128', t:'Draft onboarding email sequence',        labels:['Copy'],              p:'low',    due:9,  who:['AT']},
      {id:'TSK-131', t:'Instrument funnel analytics events',     labels:['Data','Frontend'],   p:'medium', due:12, who:['JR']},
      {id:'TSK-134', t:'Spike: edge caching for media CDN',      labels:['Infra'],             p:'medium', due:16, who:['DK']},
      {id:'TSK-136', t:'Explore SSO via Okta & SAML',            labels:['Research','Infra'],  p:'low',    due:19, who:['AT','DK']},
      {id:'TSK-139', t:'Refresh empty-state illustrations',      labels:['Design'],            p:'low',    due:23, who:['LN']}
    ],
    progress:[
      {id:'TSK-117', t:'Fix payment webhook retry storm',        labels:['Bug','Backend'],     p:'urgent', due:0,  who:['MK','JR']},
      {id:'TSK-119', t:'Rebuild settings in new design system',  labels:['Frontend','Design'], p:'high',   due:2,  who:['LN']},
      {id:'TSK-121', t:'Migrate background jobs to queue v2',    labels:['Backend','Infra'],   p:'high',   due:3,  who:['DK','MK']},
      {id:'TSK-124', t:'Customer interviews — churn cohort',     labels:['Research'],          p:'medium', due:5,  who:['AT']}
    ],
    review:[
      {id:'TSK-108', t:'Rate limiter for the public API',        labels:['Backend'],           p:'high',   due:1,  who:['DK']},
      {id:'TSK-110', t:'Dark-mode contrast audit · WCAG AA',     labels:['Design'],            p:'medium', due:1,  who:['LN','MK']},
      {id:'TSK-112', t:'Docs: pagination & cursor guide',        labels:['Copy'],              p:'low',    due:2,  who:['JR']},
      {id:'TSK-114', t:'A11y pass on modals & focus traps',      labels:['Frontend'],          p:'medium', due:4,  who:['MK']}
    ],
    done:[
      {id:'TSK-096', t:'Upgrade Postgres 14 → 16',               labels:['Infra'],             p:'medium', due:-3, who:['DK']},
      {id:'TSK-099', t:'Ship invoice PDF export',                labels:['Backend'],           p:'high',   due:-2, who:['JR','MK']},
      {id:'TSK-102', t:'New marketing hero section',             labels:['Frontend','Design'], p:'medium', due:-1, who:['LN']},
      {id:'TSK-104', t:'Triage 40+ stale GitHub issues',         labels:['Bug'],               p:'low',    due:-1, who:['AT','JR']}
    ]
  };

  const board = document.getElementById('board');
  const CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
  let seq = 140, dragged = null;

  function dueInfo(off){
    if(off === 0) return {txt:'Today', cls:'today'};
    const d = new Date(); d.setDate(d.getDate() + off);
    return {txt:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}), cls: off < 0 ? 'late' : ''};
  }
  function avatarHTML(k){
    const p = PEOPLE[k];
    return `<span class="avatar" style="--a0:${p.c[0]};--a1:${p.c[1]}" title="${p.n}">${k}</span>`;
  }

  function makeCard(d, delay){
    const el = document.createElement('article');
    const due = dueInfo(d.due);
    el.className = 'card' + (d.p === 'urgent' ? ' urgent' : '');
    el.draggable = true;
    el.style.setProperty('--pc', PRIO[d.p].c);
    el.style.setProperty('--d', delay + 'ms');
    el.innerHTML = `
      <div class="card-top">
        <span class="prio">${d.p === 'urgent' ? '<i class="pdot"></i>' : ''}${PRIO[d.p].t}</span>
        <span class="card-id">${d.id}</span>
        <button class="card-del" title="Delete card" aria-label="Delete card">✕</button>
      </div>
      <h3 class="ttl">${d.t}</h3>
      ${d.labels.length ? `<div class="labels">${d.labels.map(l=>`<span class="lab" style="--lc:${LABELS[l]}">${l}</span>`).join('')}</div>` : ''}
      <div class="card-bot">
        <span class="due ${due.cls}">${CAL}<span>${due.txt}</span></span>
        <span class="avatars">${d.who.map(avatarHTML).join('')}</span>
      </div>`;

    /* tilt + lift on hover */
    el.addEventListener('pointermove', e => {
      if(e.pointerType === 'touch' || el.classList.contains('dragging')) return;
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5;
      const py = (e.clientY - r.top) / r.height - .5;
      el.style.transition = 'transform .08s linear, box-shadow .3s, border-color .3s';
      el.style.transform = `perspective(760px) rotateX(${(-py*5).toFixed(2)}deg) rotateY(${(px*6.5).toFixed(2)}deg) translateY(-5px) scale(1.013)`;
    });
    el.addEventListener('pointerleave', () => { el.style.transition = ''; el.style.transform = ''; });

    /* drag & drop */
    el.addEventListener('dragstart', e => {
      dragged = el;
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', d.id); }catch(_){}
      requestAnimationFrame(() => el.classList.add('dragging'));
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      el.classList.add('dropped');
      setTimeout(() => el.classList.remove('dropped'), 380);
      dragged = null;
      document.querySelectorAll('.col.drag-over').forEach(c => c.classList.remove('drag-over'));
      refresh();
    });

    /* delete */
    el.querySelector('.card-del').addEventListener('click', e => {
      e.stopPropagation();
      el.style.opacity = '0';
      el.style.transform = 'scale(.88)';
      setTimeout(() => { el.remove(); refresh(); }, 230);
    });

    /* inline edit */
    const ttl = el.querySelector('.ttl');
    ttl.addEventListener('dblclick', () => startEdit(el, ttl));
    return el;
  }

  function startEdit(card, ttl){
    card.draggable = false;
    ttl.contentEditable = 'true';
    ttl.focus();
    const r = document.createRange(); r.selectNodeContents(ttl);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    const done = () => {
      ttl.contentEditable = 'false';
      card.draggable = true;
      if(!ttl.textContent.trim()) ttl.textContent = 'Untitled task';
      ttl.removeEventListener('blur', done);
    };
    ttl.addEventListener('blur', done);
    ttl.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); ttl.blur(); }
    });
  }

  function getAfterElement(list, y){
    return [...list.querySelectorAll('.card:not(.dragging)')].reduce((closest, el) => {
      const b = el.getBoundingClientRect();
      const off = y - b.top - b.height / 2;
      return (off < 0 && off > closest.off) ? {off, el} : closest;
    }, {off:-Infinity, el:null}).el;
  }

  /* build columns */
  COLS.forEach(([key, name, color], i) => {
    const col = document.createElement('section');
    col.className = 'col';
    col.dataset.col = key;
    col.style.setProperty('--c', color);
    col.style.setProperty('--i', i);
    col.innerHTML = `
      <header class="col-head">
        <span class="dot"></span>
        <h2 class="col-title">${name}</h2>
        <span class="count">0</span>
        <button class="col-menu" title="Column options">⋯</button>
      </header>
      <div class="cards"></div>
      <button class="add-card"><span class="plus">+</span>Add card</button>`;

    const list = col.querySelector('.cards');
    DATA[key].forEach((d, j) => list.appendChild(makeCard(d, i * 90 + j * 60 + 120)));

    /* drag targets */
    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
      if(dragged) list.insertBefore(dragged, getAfterElement(list, e.clientY));
    });
    col.addEventListener('dragleave', e => {
      if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('drag-over'); });

    /* ghost add */
    col.querySelector('.add-card').addEventListener('click', () => {
      const keys = Object.keys(PEOPLE);
      const d = {
        id:'TSK-' + (seq++),
        t:'New task',
        labels:[],
        p:'medium',
        due:7,
        who:[keys[Math.floor(Math.random() * keys.length)]]
      };
      const el = makeCard(d, 0);
      list.appendChild(el);
      el.scrollIntoView({block:'nearest', behavior:'smooth'});
      refresh();
      startEdit(el, el.querySelector('.ttl'));
    });

    board.appendChild(col);
  });

  /* team stack */
  const team = document.getElementById('team');
  Object.keys(PEOPLE).forEach(k => team.insertAdjacentHTML('beforeend', avatarHTML(k)));

  /* counts + progress */
  function refresh(){
    let total = 0, done = 0;
    document.querySelectorAll('.col').forEach(col => {
      const n = col.querySelectorAll('.card').length;
      col.querySelector('.count').textContent = n;
      total += n;
      if(col.dataset.col === 'done') done = n;
    });
    document.getElementById('progNum').textContent = done;
    document.getElementById('progTotal').textContent = total;
    document.getElementById('progBar').style.width = (total ? (done / total * 100) : 0) + '%';
  }
  refresh();

  /* live clock */
  const tEl = document.getElementById('clockTime'), dEl = document.getElementById('clockDate');
  const pad = n => String(n).padStart(2, '0');
  function tick(){
    const n = new Date();
    tEl.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
    dEl.textContent = n.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}).toUpperCase();
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
