<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheepdog Trials</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #2a5e1a; }
  canvas { display: block; }
  #ui {
    position: absolute; top: 10px; left: 10px; color: #fff;
    font-family: 'Segoe UI', sans-serif; font-size: 14px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #ui h2 { font-size: 18px; margin-bottom: 4px; color: #cde6c0; }
  #ui div { margin: 2px 0; }
  #celebration {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-family: 'Segoe UI', sans-serif; font-size: 48px; color: #ffd700;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.9); pointer-events: none;
    opacity: 0; transition: opacity 0.5s;
  }
  #celebration.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h2>🐕 Sheepdog Trials</h2>
  <div id="stats"></div>
</div>
<div id="celebration">🎉 All Sheep Penned! 🎉</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const celebEl = document.getElementById('celebration');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Noise function for grass texture ---
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) & 0x7fffffff;
}
function noise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy) / 0x7fffffff;
  const b = hash(ix + 1, iy) / 0x7fffffff;
  const c = hash(ix, iy + 1) / 0x7fffffff;
  const d = hash(ix + 1, iy + 1) / 0x7fffffff;
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}

// --- Worn paths ---
const paths = [];
function addPath(x1, y1, x2, y2) {
  paths.push({ x1, y1, x2, y2 });
}

// --- Gate ---
class Gate {
  constructor(x1, y1, x2, y2) {
    this.x1 = x1; this.y1 = y1;
    this.x2 = x2; this.y2 = y2;
    this.passed = false;
    this.w = 3;
    this.color = '#8B4513';
  }
  draw() {
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.w;
    ctx.beginPath();
    ctx.moveTo(this.x1, this.y1);
    ctx.lineTo(this.x2, this.y2);
    ctx.stroke();
    // Gate markers
    ctx.fillStyle = '#FFD700';
    [this.x1, this.x2].forEach((x, i) => {
      const y = i === 0 ? this.y1 : this.y2;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  isBetween(p) {
    const minx = Math.min(this.x1, this.x2);
    const maxx = Math.max(this.x1, this.x2);
    const miny = Math.min(this.y1, this.y2);
    const maxy = Math.max(this.y1, this.y2);
    return p.x >= minx - 15 && p.x <= maxx + 15 && p.y >= miny - 15 && p.y <= maxy + 15;
  }
  hasPassed(side, p) {
    if (side === 'left') return p.x < Math.min(this.x1, this.x2) - 5;
    if (side === 'right') return p.x > Math.max(this.x1, this.x2) + 5;
    if (side === 'top') return p.y < Math.min(this.y1, this.y2) - 5;
    if (side === 'bottom') return p.y > Math.max(this.y1, this.y2) + 5;
    return false;
  }
}

// --- Pen ---
class Pen {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.color = '#654321';
  }
  draw() {
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 4;
    ctx.strokeRect(this.x, this.y, this.w, this.h);
    // Cross-hatch pattern
    ctx.strokeStyle = 'rgba(101,67,33,0.3)';
    ctx.lineWidth = 1;
    for (let i = this.x; i < this.x + this.w; i += 10) {
      ctx.beginPath();
      ctx.moveTo(i, this.y);
      ctx.lineTo(i, this.y + this.h);
      ctx.stroke();
    }
    for (let i = this.y; i < this.y + this.h; i += 10) {
      ctx.beginPath();
      ctx.moveTo(this.x, i);
      ctx.lineTo(this.x + this.w, i);
      ctx.stroke();
    }
  }
  contains(p) {
    return p.x > this.x && p.x < this.x + this.w && p.y > this.y && p.y < this.y + this.h;
  }
}

// --- Sheep ---
class Sheep {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.maxSpeed = 1.8;
    this.maxForce = 0.08;
    this.fearFactor = 0; // 0-1, how scared
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.size = 6 + Math.random() * 3;
    this.jostleOffset = { x: 0, y: 0 };
    this.jostleTimer = Math.random() * 100;
  }

  update(sheep, dog, gates, pen) {
    let sep = this.separate(sheep);
    let ali = this.align(sheep);
    let coh = this.cohere(sheep);
    let fear = this.fearResponse(dog);
    let gateAvoid = this.avoidGates(gates);
    let wander = this.wander();

    sep.x *= 2.5; sep.y *= 2.5;
    ali.x *= 1.0; ali.y *= 1.0;
    coh.x *= 1.0; coh.y *= 1.0;
    fear.x *= 4.0; fear.y *= 4.0;
    gateAvoid.x *= 3.0; gateAvoid.y *= 3.0;
    wander.x *= 0.3; wander.y *= 0.3;

    let ax = sep.x + ali.x + coh.x + fear.x + gateAvoid.x + wander.x;
    let ay = sep.y + ali.y + coh.y + fear.y + gateAvoid.y + wander.y;

    // Limit acceleration
    let aMag = Math.sqrt(ax * ax + ay * ay);
    if (aMag > this.maxForce * (1 + this.fearFactor * 3)) {
      let scale = (this.maxForce * (1 + this.fearFactor * 3)) / aMag;
      ax *= scale; ay *= scale;
    }

    this.vx += ax;
    this.vy += ay;

    // Panic sprint when very scared
    let panicSpeed = this.maxSpeed * (1 + this.fearFactor * 2.5);
    let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > panicSpeed) {
      this.vx = (this.vx / speed) * panicSpeed;
      this.vy = (this.vy / speed) * panicSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Boundary: bounce
    if (this.x < 10) { this.x = 10; this.vx *= -0.5; }
    if (this.x > W - 10) { this.x = W - 10; this.vx *= -0.5; }
    if (this.y < 10) { this.y = 10; this.vy *= -0.5; }
    if (this.y > H - 10) { this.y = H - 10; this.vy *= -0.5; }

    // Jostle animation
    this.jostleTimer += 0.1;
    if (this.jostleTimer > 20) {
      this.jostleTimer = 0;
      this.jostleOffset.x = (Math.random() - 0.5) * 2;
      this.jostleOffset.y = (Math.random() - 0.5) * 2;
    }

    // Decay fear
    this.fearFactor *= 0.96;
  }

  separate(sheep) {
    let steer = { x: 0, y: 0 };
    let count = 0;
    let desiredSep = this.size * 3;
    for (let other of sheep) {
      if (other === this) continue;
      let d = Math.sqrt((this.x - other.x) ** 2 + (this.y - other.y) ** 2);
      if (d < desiredSep && d > 0) {
        steer.x += (this.x - other.x) / (d * d);
        steer.y += (this.y - other.y) / (d * d);
        count++;
      }
    }
    if (count > 0) {
      steer.x /= count; steer.y /= count;
      let mag = Math.sqrt(steer.x ** 2 + steer.y ** 2);
      if (mag > 0) {
        steer.x = (steer.x / mag) * this.maxSpeed - this.vx;
        steer.y = (steer.y / mag) * this.maxSpeed - this.vy;
      }
    }
    return steer;
  }

  align(sheep) {
    let neighborDist = 50;
    let sumVx = 0, sumVy = 0, count = 0;
    for (let other of sheep) {
      if (other === this) continue;
      let d = Math.sqrt((this.x - other.x) ** 2 + (this.y - other.y) ** 2);
      if (d < neighborDist) {
        sumVx += other.vx; sumVy += other.vy;
        count++;
      }
    }
    if (count > 0) {
      sumVx /= count; sumVy /= count;
      let mag = Math.sqrt(sumVx ** 2 + sumVy ** 2);
      if (mag > 0) {
        sumVx = (sumVx / mag) * this.maxSpeed;
        sumVy = (sumVy / mag) * this.maxSpeed;
      }
      return { x: sumVx - this.vx, y: sumVy - this.vy };
    }
    return { x: 0, y: 0 };
  }

  cohere(sheep) {
    let neighborDist = 60;
    let sumX = 0, sumY = 0, count = 0;
    for (let other of sheep) {
      if (other === this) continue;
      let d = Math.sqrt((this.x - other.x) ** 2 + (this.y - other.y) ** 2);
      if (d < neighborDist) {
        sumX += other.x; sumY += other.y;
        count++;
      }
    }
    if (count > 0) {
      sumX /= count; sumY /= count;
      let dx = sumX - this.x, dy = sumY - this.y;
      let mag = Math.sqrt(dx * dx + dy * dy);
      if (mag > 0) {
        dx = (dx / mag) * this.maxSpeed;
        dy = (dy / mag) * this.maxSpeed;
      }
      return { x: dx - this.vx, y: dy - this.vy };
    }
    return { x: 0, y: 0 };
  }

  fearResponse(dog) {
    let dx = this.x - dog.x;
    let dy = this.y - dog.y;
    let dist = Math.sqrt(dx * dx + dy * dy);
    let fearRadius = 120;
    if (dist < fearRadius && dist > 0) {
      this.fearFactor = Math.max(this.fearFactor, 1 - dist / fearRadius);
      let strength = (1 - dist / fearRadius);
      return { x: (dx / dist) * strength * 2, y: (dy / dist) * strength * 2 };
    }
    return { x: 0, y: 0 };
  }

  avoidGates(gates) {
    let steer = { x: 0, y: 0 };
    for (let gate of gates) {
      let dx = this.x - (gate.x1 + gate.x2) / 2;
      let dy = this.y - (gate.y1 + gate.y2) / 2;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 60 && dist > 0) {
        // Sheep go through gates, don't avoid them — but add slight guidance
        let angle = Math.atan2(gate.y2 - gate.y1, gate.x2 - gate.x1);
        let perpAngle = angle + Math.PI / 2;
        let dot = dx * Math.cos(perpAngle) + dy * Math.sin(perpAngle);
        if (Math.abs(dot) < 15 && dist < 30) {
          // Align with gate direction
          steer.x += Math.cos(angle) * 0.5;
          steer.y += Math.sin(angle) * 0.5;
        }
      }
    }
    return steer;
  }

  wander() {
    this.wanderAngle += (Math.random() - 0.5) * 0.5;
    return { x: Math.cos(this.wanderAngle) * 0.5, y: Math.sin(this.wanderAngle) * 0.5 };
  }

  draw() {
    let sx = this.x + this.jostleOffset.x;
    let sy = this.y + this.jostleOffset.y;
    let angle = Math.atan2(this.vy, this.vx);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(sx + 2, sy + 3, this.size * 0.9, this.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = this.fearFactor > 0.3 ? '#f5f0e0' : '#f0ead6';
    ctx.beginPath();
    ctx.ellipse(sx, sy, this.size, this.size * 0.7, angle, 0, Math.PI * 2);
    ctx.fill();

    // Head
    let headX = sx + Math.cos(angle) * this.size * 0.7;
    let headY = sy + Math.sin(angle) * this.size * 0.7;
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.arc(headX, headY, this.size * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Legs (tiny lines)
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 1;
    let legLen = this.size * 0.4;
    let legPhase = (Date.now() / 100 + this.x * 0.1) % (Math.PI * 2);
    for (let i = -1; i <= 1; i += 2) {
      let lx = sx + Math.cos(angle + Math.PI / 2) * i * this.size * 0.3;
      let ly = sy + Math.sin(angle + Math.PI / 2) * i * this.size * 0.3;
      let legOffset = Math.sin(legPhase + i) * 2;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + Math.cos(angle + Math.PI / 2 + i * 0.3) * legLen + legOffset,
                 ly + Math.sin(angle + Math.PI / 2 + i * 0.3) * legLen + legOffset);
      ctx.stroke();
    }

    // Panic eyes
    if (this.fearFactor > 0.5) {
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(headX - 1, headY - 1, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- Dog ---
class Dog {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.maxSpeed = 3.5;
    this.maxForce = 0.15;
    this.state = 'fetch'; // fetch, flank, drive, circle
    this.targetAngle = 0;
    this.flankSide = 1; // 1 or -1
    this.circleAngle = 0;
    this.size = 8;
    this.tailWag = 0;
  }

  update(sheep, gates, pen) {
    let flockCenter = this.getFlockCenter(sheep);
    let steer = { x: 0, y: 0 };

    // Determine which gate to aim for
    let nextGate = null;
    for (let gate of gates) {
      if (!gate.passed) { nextGate = gate; break; }
    }

    if (this.state === 'fetch') {
      // Move toward flock from a distance
      let dx = flockCenter.x - this.x;
      let dy = flockCenter.y - this.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 150) {
        steer.x = (dx / dist) * this.maxSpeed - this.vx;
        steer.y = (dy / dist) * this.maxSpeed - this.vy;
      } else {
        this.state = 'flank';
        this.flankSide = Math.random() > 0.5 ? 1 : -1;
      }
    } else if (this.state === 'flank') {
      // Move to flank position
      let dx = flockCenter.x - this.x;
      let dy = flockCenter.y - this.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      let angle = Math.atan2(dy, dx);
      let flankAngle = angle + this.flankSide * Math.PI / 2;
      let flankDist = 100;
      let tx = flockCenter.x + Math.cos(flankAngle) * flankDist;
      let ty = flockCenter.y + Math.sin(flankAngle) * flankDist;
      let fdx = tx - this.x, fdy = ty - this.y;
      let fdist = Math.sqrt(fdx * fdx + fdy * fdy);
      if (fdist > 10) {
        steer.x = (fdx / fdist) * this.maxSpeed - this.vx;
        steer.y = (fdy / fdist) * this.maxSpeed - this.vy;
      } else {
        this.state = 'circle';
        this.circleAngle = Math.atan2(flockCenter.y - this.y, flockCenter.x - this.x);
      }
    } else if (this.state === 'circle') {
      // Circle the flock to apply pressure
      this.circleAngle += 0.04;
      let circleDist = 90;
      let tx = flockCenter.x + Math.cos(this.circleAngle) * circleDist;
      let ty = flockCenter.y + Math.sin(this.circleAngle) * circleDist;
      let fdx = tx - this.x, fdy = ty - this.y;
      let fdist = Math.sqrt(fdx * fdx + fdy * fdy);
      if (fdist > 0) {
        steer.x = (fdx / fdist) * this.maxSpeed - this.vx;
        steer.y = (fdy / fdist) * this.maxSpeed - this.vy;
      }

      // After circling, drive toward pen
      let timeInCircle = (Date.now() % 8000) / 8000;
      if (timeInCircle > 0.7) {
        this.state = 'drive';
      }
    } else if (this.state === 'drive') {
      // Drive flock toward next gate or pen
      let targetX = flockCenter.x, targetY = flockCenter.y;

      if (nextGate) {
        // Aim through the gate
        let gx = (nextGate.x1 + nextGate.x2) / 2;
        let gy = (nextGate.y1 + nextGate.y2) / 2;
        // Position behind flock relative to gate
        let behindX = flockCenter.x - (gx - flockCenter.x) * 0.5;
        let behindY = flockCenter.y - (gy - flockCenter.y) * 0.5;
        targetX = behindX; targetY = behindY;
      } else {
        // No more gates, aim for pen
        let penCx = pen.x + pen.w / 2;
        let penCy = pen.y + pen.h / 2;
        let behindX = flockCenter.x - (penCx - flockCenter.x) * 0.3;
        let behindY = flockCenter.y - (penCy - flockCenter.y) * 0.3;
        targetX = behindX; targetY = behindY;
      }

      let fdx = targetX - this.x;
      let fdy = targetY - this.y;
      let fdist = Math.sqrt(fdx * fdx + fdy * fdy);
      if (fdist > 10) {
        steer.x = (fdx / fdist) * this.maxSpeed * 1.2 - this.vx;
        steer.y = (fdy / fdist) * this.maxSpeed * 1.2 - this.vy;
      }

      // Check if should go back to flank
      let distToFlock = Math.sqrt(
        (this.x - flockCenter.x) ** 2 + (this.y - flockCenter.y) ** 2
      );
      if (distToFlock < 60) {
        this.state = 'flank';
        this.flankSide *= -1;
      }
    }

    // Limit steering
    let sMag = Math.sqrt(steer.x ** 2 + steer.y ** 2);
    if (sMag > this.maxForce) {
      steer.x = (steer.x / sMag) * this.maxForce;
      steer.y = (steer.y / sMag) * this.maxForce;
    }

    this.vx += steer.x;
    this.vy += steer.y;

    let speed = Math.sqrt(this.vx ** 2 + this.vy ** 2);
    if (speed > this.maxSpeed) {
      this.vx = (this.vx / speed) * this.maxSpeed;
      this.vy = (this.vy / speed) * this.maxSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;

    // Boundary
    this.x = Math.max(15, Math.min(W - 15, this.x));
    this.y = Math.max(15, Math.min(H - 15, this.y));

    // Tail wag
    this.tailWag += 0.3;
  }

  getFlockCenter(sheep) {
    let cx = 0, cy = 0;
    for (let s of sheep) { cx += s.x; cy += s.y; }
    return { x: cx / sheep.length, y: cy / sheep.length };
  }

  draw() {
    let angle = Math.atan2(this.vy, this.vx);
    let sx = this.x, sy = this.y;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(sx + 2, sy + 3, this.size * 1.1, this.size * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(sx, sy, this.size * 1.2, this.size * 0.7, angle, 0, Math.PI * 2);
    ctx.fill();

    // White chest
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.ellipse(sx + Math.cos(angle) * this.size * 0.4, sy + Math.sin(angle) * this.size * 0.4,
                this.size * 0.5, this.size * 0.4, angle, 0, Math.PI * 2);
    ctx.fill();

    // Head
    let headX = sx + Math.cos(angle) * this.size * 1.1;
    let headY = sy + Math.sin(angle) * this.size * 1.1;
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(headX, headY, this.size * 0.45, 0, Math.PI * 2);
    ctx.fill();

    // Ears
    for (let i = -1; i <= 1; i += 2) {
      let ex = headX + Math.cos(angle + Math.PI / 2) * i * this.size * 0.3;
      let ey = headY + Math.sin(angle + Math.PI / 2) * i * this.size * 0.3;
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.ellipse(ex, ey, this.size * 0.2, this.size * 0.35, angle, 0, Math.PI * 2);
      ctx.fill();
    }

    // Eyes
    ctx.fillStyle = '#FFD700';
    for (let i = -1; i <= 1; i += 2) {
      let ex = headX + Math.cos(angle + Math.PI / 2) * i * this.size * 0.15;
      let ey = headY + Math.sin(angle + Math.PI / 2) * i * this.size * 0.15;
      ctx.beginPath();
      ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Tail
    let tailX = sx - Math.cos(angle) * this.size * 1.1;
    let tailY = sy - Math.sin(angle) * this.size * 1.1;
    let tailWagX = tailX + Math.cos(angle + Math.PI / 2) * Math.sin(this.tailWag) * 4;
    let tailWagY = tailY + Math.sin(angle + Math.PI / 2) * Math.sin(this.tailWag) * 4;
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.quadraticCurveTo(tailX + Math.cos(angle) * -5, tailY + Math.sin(angle) * -5,
                         tailWagX, tailWagY);
    ctx.stroke();

    // Legs
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1.5;
    let legPhase = (Date.now() / 50) % (Math.PI * 2);
    for (let i = -1; i <= 1; i += 2) {
      let lx = sx + Math.cos(angle + Math.PI / 2) * i * this.size * 0.35;
      let ly = sy + Math.sin(angle + Math.PI / 2) * i * this.size * 0.35;
      let legOffset = Math.sin(legPhase + i) * 3;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + Math.cos(angle + Math.PI / 2 + i * 0.2) * this.size * 0.6 + legOffset,
                 ly + Math.sin(angle + Math.PI / 2 + i * 0.2) * this.size * 0.6 + legOffset);
      ctx.stroke();
    }
  }
}

// --- Game State ---
let sheep = [];
let dog = null;
let gates = [];
let pen = null;
let coursePhase = 0;
let celebrationTimer = 0;
let frameCount = 0;

function generateCourse() {
  gates = [];
  sheep = [];
  paths.length = 0;

  let margin = 80;
  let cx = W / 2, cy = H / 2;

  // Generate pen in a corner
  let penW = 120, penH = 100;
  let penX = W - margin - penW;
  let penY = margin;
  pen = new Pen(penX, penY, penW, penH);

  // Generate 3-5 gates in a zigzag pattern
  let numGates = 3 + Math.floor(Math.random() * 3);
  let gateSpacingX = (W - 2 * margin - penW) / (numGates + 1);

  let prevGateX = margin;
  let prevGateY = cy;

  for (let i = 0; i < numGates; i++) {
    let gx = margin + gateSpacingX * (i + 1);
    let gy = margin + Math.random() * (H - 2 * margin);

    // Gate is a short vertical-ish line
    let gateLen = 60 + Math.random() * 40;
    let gateAngle = Math.PI / 2 + (Math.random() - 0.5) * 0.5;

    let x1 = gx - Math.cos(gateAngle) * gateLen / 2;
    let y1 = gy - Math.sin(gateAngle) * gateLen / 2;
    let x2 = gx + Math.cos(gateAngle) * gateLen / 2;
    let y2 = gy + Math.sin(gateAngle) * gateLen / 2;

    gates.push(new Gate(x1, y1, x2, y2));
    addPath(prevGateX, prevGateY, gx, gy);
    prevGateX = gx;
    prevGateY = gy;
  }

  // Path from last gate to pen
  addPath(prevGateX, prevGateY, pen.x, pen.y);

  // Spawn sheep in a cluster away from pen
  let spawnX = margin + 50;
  let spawnY = cy + (Math.random() - 0.5) * 200;
  let numSheep = 30 + Math.floor(Math.random() * 21);
  for (let i = 0; i < numSheep; i++) {
    sheep.push(new Sheep(
      spawnX + (Math.random() - 0.5) * 80,
      spawnY + (Math.random() - 0.5) * 80
    ));
  }

  // Spawn dog away from sheep
  dog = new Dog(W - 100, H - 100);
  dog.state = 'fetch';

  coursePhase = 0;
  celebrationTimer = 0;
  celebEl.classList.remove('show');
}

function drawGrass() {
  // Base grass color
  ctx.fillStyle = '#4a8c34';
  ctx.fillRect(0, 0, W, H);

  // Grass texture
  let tileSize = 8;
  let cols = Math.ceil(W / tileSize);
  let rows = Math.ceil(H / tileSize);
  for (let x = 0; x < cols; x++) {
    for (let y = 0; y < rows; y++) {
      let n = noise(x * 0.15, y * 0.15);
      let g = Math.floor(80 + n * 60);
      let r = Math.floor(40 + n * 30);
      let b = Math.floor(20 + n * 20);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }
  }

  // Draw worn paths
  for (let path of paths) {
    ctx.strokeStyle = 'rgba(139,119,80,0.4)';
    ctx.lineWidth = 30;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(path.x1, path.y1);
    ctx.lineTo(path.x2, path.y2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(160,140,100,0.3)';
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.moveTo(path.x1, path.y1);
    ctx.lineTo(path.x2, path.y2);
    ctx.stroke();
  }
}

function drawSheepTracks() {
  // Subtle tracks from sheep movement
  ctx.fillStyle = 'rgba(120,100,70,0.05)';
  for (let s of sheep) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function checkGatePasses() {
  for (let gate of gates) {
    if (gate.passed) continue;
    // Check if majority of sheep have passed through this gate
    let passedCount = 0;
    let total = sheep.length;
    let gateCx = (gate.x1 + gate.x2) / 2;
    let gateCy = (gate.y1 + gate.y2) / 2;
    let gateAngle = Math.atan2(gate.y2 - gate.y1, gate.x2 - gate.x1);
    let forward = Math.cos(gateAngle);

    for (let s of sheep) {
      let dx = s.x - gateCx;
      let dy = s.y - gateCy;
      let proj = dx * forward + dy * Math.sin(gateAngle + Math.PI / 2);
      // Check if sheep is past the gate in the forward direction
      if (proj > 20) passedCount++;
    }

    if (passedCount > total * 0.7) {
      gate.passed = true;
    }
  }
}

function checkPenCompletion() {
  let inPen = 0;
  for (let s of sheep) {
    if (pen.contains(s)) inPen++;
  }
  if (inPen >= sheep.length * 0.95) {
    // All sheep penned!
    if (celebrationTimer === 0) {
      celebrationTimer = 180; // 3 seconds at 60fps
      celebEl.classList.add('show');
    }
  }
  return inPen;
}

function update() {
  frameCount++;

  if (celebrationTimer > 0) {
    celebrationTimer--;
    if (celebrationTimer <= 0) {
      generateCourse();
    }
    return;
  }

  // Update sheep
  for (let s of sheep) {
    s.update(sheep, dog, gates, pen);
  }

  // Update dog
  dog.update(sheep, gates, pen);

  // Check gates
  checkGatePasses();

  // Check pen
  checkPenCompletion();

  // Update stats
  let penned = 0;
  for (let s of sheep) {
    if (pen.contains(s)) penned++;
  }
  let gatesPassed = gates.filter(g => g.passed).length;
  statsEl.innerHTML = `
    <div>🐑 Sheep: ${penned}/${sheep.length} penned</div>
    <div>🚪 Gates: ${gatesPassed}/${gates.length} cleared</div>
    <div>🐕 Dog: ${dog.state.toUpperCase()}</div>
  `;
}

function draw() {
  drawGrass();

  // Draw pen
  pen.draw();

  // Draw gates
  for (let gate of gates) {
    gate.draw();
    if (gate.passed) {
      ctx.fillStyle = 'rgba(0,255,0,0.3)';
      ctx.font = '12px sans-serif';
      ctx.fillText('✓', (gate.x1 + gate.x2) / 2 - 3, (gate.y1 + gate.y2) / 2 - 10);
    }
  }

  // Draw sheep tracks
  drawSheepTracks();

  // Draw sheep
  for (let s of sheep) {
    s.draw();
  }

  // Draw dog
  dog.draw();

  // Draw flock center indicator (subtle)
  let fc = dog.getFlockCenter(sheep);
  ctx.strokeStyle = 'rgba(255,255,0,0.1)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.arc(fc.x, fc.y, 40, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// --- Start ---
generateCourse();
gameLoop();
</script>
