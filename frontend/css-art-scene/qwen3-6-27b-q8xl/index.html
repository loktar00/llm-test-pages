<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Desk at Night</title>
<style>
:root {
  --bg-wall: #1a1c23;
  --bg-floor: #121418;
  --desk-surface: #3e2723;
  --desk-front: #2d1a16;
  --lamp-arm: #2c2c2c;
  --lamp-shade: #e0c097;
  --lamp-glow: rgba(255, 200, 100, 0.0);
  --mug-color: #d7ccc8;
  --coffee-color: #3e2723;
  --cat-fur: #2c2c2c;
  --cat-belly: #e0e0e0;
  --screen-bg: #0f172a;
  --screen-glow: rgba(100, 200, 255, 0.15);
  --moon-color: #fffde7;
  --steam-color: rgba(255, 255, 255, 0.4);
  --window-frame: #263238;
  --transition-speed: 0.6s;
}

body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: var(--bg-wall);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
  transition: background var(--transition-speed);
}

/* --- Scene Container --- */
.scene {
  position: relative;
  width: 800px;
  height: 600px;
  background: linear-gradient(to bottom, var(--bg-wall) 70%, var(--bg-floor) 70%);
  box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
  overflow: hidden;
}

/* --- Lighting Overlay --- */
.lighting-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: radial-gradient(circle at 300px 100px, var(--lamp-glow) 0%, rgba(0,0,0,0) 60%);
  transition: background var(--transition-speed);
  z-index: 10;
  mix-blend-mode: screen;
}

/* --- Window --- */
.window {
  position: absolute;
  top: 50px;
  left: 50px;
  width: 180px;
  height: 240px;
  background: #0d1b2a;
  border: 12px solid var(--window-frame);
  border-radius: 4px;
  box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
  overflow: hidden;
  z-index: 1;
}

.moon {
  position: absolute;
  top: 30px;
  right: 40px;
  width: 40px;
  height: 40px;
  background: var(--moon-color);
  border-radius: 50%;
  box-shadow: 0 0 20px var(--moon-color);
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
}

.star:nth-child(2) { top: 60px; left: 30px; width: 3px; height: 3px; }
.star:nth-child(3) { top: 120px; left: 80px; width: 2px; height: 2px; }
.star:nth-child(4) { top: 90px; left: 140px; width: 4px; height: 4px; }

.window-cross-v {
  position: absolute;
  top: 0;
  left: 50%;
  width: 8px;
  height: 100%;
  background: var(--window-frame);
  transform: translateX(-50%);
}

.window-cross-h {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 8px;
  background: var(--window-frame);
  transform: translateY(-50%);
}

/* --- Desk --- */
.desk {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 200px;
  background: var(--desk-surface);
  border-top: 8px solid #4e342e;
  z-index: 5;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
}

.desk-leg {
  position: absolute;
  bottom: -400px;
  width: 20px;
  height: 400px;
  background: var(--desk-front);
}

.desk-leg.left { left: 50px; }
.desk-leg.right { right: 50px; }

/* --- Laptop --- */
.laptop {
  position: absolute;
  bottom: 160px;
  left: 300px;
  width: 240px;
  height: 160px;
  z-index: 6;
  transform: perspective(600px) rotateX(5deg);
}

.laptop-screen {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #111;
  border-radius: 8px 8px 0 0;
  border: 4px solid #333;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  box-shadow: 0 0 30px var(--screen-glow);
  animation: screen-flicker 4s infinite alternate;
}

.laptop-display {
  width: 90%;
  height: 90%;
  background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
  border-radius: 2px;
  position: relative;
}

.code-line {
  height: 4px;
  background: rgba(255,255,255,0.3);
  margin-bottom: 6px;
  border-radius: 2px;
}
.code-line:nth-child(1) { width: 60%; }
.code-line:nth-child(2) { width: 80%; }
.code-line:nth-child(3) { width: 40%; }
.code-line:nth-child(4) { width: 70%; }

.laptop-base {
  position: absolute;
  bottom: -15px;
  left: -10px;
  width: 260px;
  height: 15px;
  background: #ccc;
  border-radius: 4px 4px 8px 8px;
  transform: skewX(-40deg);
  transform-origin: bottom left;
  box-shadow: 5px 5px 10px rgba(0,0,0,0.5);
}

/* --- Mug --- */
.mug {
  position: absolute;
  bottom: 165px;
  left: 180px;
  width: 60px;
  height: 70px;
  background: var(--mug-color);
  border-radius: 0 0 20px 20px;
  z-index: 7;
  box-shadow: 5px 5px 10px rgba(0,0,0,0.4);
}

.mug-handle {
  position: absolute;
  right: -15px;
  top: 15px;
  width: 20px;
  height: 30px;
  border: 6px solid var(--mug-color);
  border-left: none;
  border-radius: 0 10px 10px 0;
}

.coffee {
  position: absolute;
  top: 5px;
  left: 5px;
  right: 5px;
  height: 10px;
  background: var(--coffee-color);
  border-radius: 50%;
}

/* --- Steam --- */
.steam-container {
  position: absolute;
  top: -40px;
  left: 10px;
  width: 40px;
  height: 40px;
  z-index: 8;
}

.steam {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 8px;
  height: 20px;
  background: var(--steam-color);
  border-radius: 10px;
  opacity: 0;
  filter: blur(4px);
  animation: rise 3s infinite ease-out;
}

.steam:nth-child(1) { left: 20%; animation-delay: 0s; }
.steam:nth-child(2) { left: 60%; animation-delay: 1s; }
.steam:nth-child(3) { left: 40%; animation-delay: 2s; }

/* --- Cat --- */
.cat {
  position: absolute;
  bottom: 160px;
  right: 120px;
  z-index: 8;
}

.cat-body {
  width: 100px;
  height: 60px;
  background: var(--cat-fur);
  border-radius: 40px 40px 20px 20px;
  position: relative;
  box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
}

.cat-head {
  position: absolute;
  top: -25px;
  left: -15px;
  width: 60px;
  height: 50px;
  background: var(--cat-fur);
  border-radius: 50% 50% 40% 40%;
  z-index: 9;
}

.cat-ear {
  position: absolute;
  top: -10px;
  width: 0;
  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-bottom: 20px solid var(--cat-fur);
}

.cat-ear.left { left: 5px; transform: rotate(-15deg); }
.cat-ear.right { right: 5px; transform: rotate(15deg); }

.cat-tail {
  position: absolute;
  bottom: 5px;
  right: -30px;
  width: 80px;
  height: 20px;
  background: var(--cat-fur);
  border-radius: 10px 20px 20px 10px;
  transform-origin: left center;
  animation: tail-sway 3s infinite ease-in-out;
}

/* --- Lamp --- */
.lamp {
  position: absolute;
  bottom: 160px;
  left: 60px;
  z-index: 9;
  cursor: pointer;
}

.lamp-base {
  width: 50px;
  height: 10px;
  background: #333;
  border-radius: 5px;
}

.lamp-arm {
  position: absolute;
  bottom: 5px;
  left: 20px;
  width: 8px;
  height: 180px;
  background: var(--lamp-arm);
  transform-origin: bottom center;
  transform: rotate(-25deg);
  border-radius: 4px;
}

.lamp-shade {
  position: absolute;
  top: -40px;
  left: -25px;
  width: 60px;
  height: 50px;
  background: var(--lamp-shade);
  border-radius: 5px 5px 30px 30px;
  transform: rotate(25deg);
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
  transition: box-shadow var(--transition-speed), background var(--transition-speed);
}

.lamp-bulb {
  position: absolute;
  bottom: 5px;
  left: 15px;
  width: 30px;
  height: 15px;
  background: #555;
  border-radius: 0 0 15px 15px;
  transition: background var(--transition-speed), box-shadow var(--transition-speed);
}

/* --- Active States (Lamp On) --- */
body.lamp-on {
  --bg-wall: #2c2724;
  --bg-floor: #231e1b;
  --lamp-glow: rgba(255, 200, 100, 0.4);
}

body.lamp-on .lamp-shade {
  background: #fff0c2;
  box-shadow: 0 0 40px rgba(255, 200, 100, 0.6);
}

body.lamp-on .lamp-bulb {
  background: #fff;
  box-shadow: 0 0 20px #fff;
}

body.lamp-on .desk {
  background: #5d4037;
}

/* --- Animations --- */
@keyframes rise {
  0% { transform: translateY(0) scaleX(1); opacity: 0; }
  50% { opacity: 0.6; }
  100% { transform: translateY(-40px) scaleX(1.5); opacity: 0; }
}

@keyframes tail-sway {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(15deg); }
  100% { transform: rotate(0deg); }
}

@keyframes screen-flicker {
  0% { box-shadow: 0 0 20px var(--screen-glow); }
  50% { box-shadow: 0 0 35px var(--screen-glow); }
  100% { box-shadow: 0 0 25px var(--screen-glow); }
}

/* --- Interaction Hint --- */
.hint {
  position: absolute;
  bottom: 20px;
  right: 20px;
  color: rgba(255,255,255,0.3);
  font-size: 12px;
  pointer-events: none;
}

</style>
</head>
<body>

<div class="scene">
  <!-- Lighting Overlay -->
  <div class="lighting-overlay"></div>

  <!-- Window -->
  <div class="window">
    <div class="moon"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="window-cross-v"></div>
    <div class="window-cross-h"></div>
  </div>

  <!-- Desk Surface -->
  <div class="desk">
    <div class="desk-leg left"></div>
    <div class="desk-leg right"></div>
  </div>

  <!-- Lamp -->
  <div class="lamp" id="lamp">
    <div class="lamp-base"></div>
    <div class="lamp-arm"></div>
    <div class="lamp-bulb"></div>
    <div class="lamp-shade"></div>
  </div>

  <!-- Laptop -->
  <div class="laptop">
    <div class="laptop-screen">
      <div class="laptop-display">
        <div class="code-line"></div>
        <div class="code-line"></div>
        <div class="code-line"></div>
        <div class="code-line"></div>
      </div>
    </div>
    <div class="laptop-base"></div>
  </div>

  <!-- Mug -->
  <div class="mug">
    <div class="mug-handle"></div>
    <div class="coffee"></div>
    <div class="steam-container">
      <div class="steam"></div>
      <div class="steam"></div>
      <div class="steam"></div>
    </div>
  </div>

  <!-- Cat -->
  <div class="cat">
    <div class="cat-head">
      <div class="cat-ear left"></div>
      <div class="cat-ear right"></div>
    </div>
    <div class="cat-body"></div>
    <div class="cat-tail"></div>
  </div>

  <div class="hint">Click the lamp</div>
</div>

<script>
  const lamp = document.getElementById('lamp');
  const body = document.body;

  lamp.addEventListener('click', () => {
    body.classList.toggle('lamp-on');
  });
</script>

</body>
</html>
