<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gems of the Cascade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%height:100%overflow:hidden;background:#0d0a1a;font:14px/1.4 system-ui,Helvetica}
canvas{display:block;width:100%height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,C,R,tile,offX,offY;
const COLS=8,ROWS=8;
const GEMN=6;
const GEMC=['#ff3e8b','#ff8d3e','#ffd05a','#3eeea0','#3ec2ff','#bf5cff'];
const GEMDARK=['#b01560','#a05500','#aa8055','#005c4a','#005c8c','#4c008c'];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;
tile=Math.max(40,Math.min(W/R,80/10));offX=(W-C*tile)/2;offY=(H-R*tile)/2-20;
C=COLS;R=ROWS;
let ts=Math.min((W-40)/C,(H-40)/R);
tile=Math.max(42,Math.round(ts));
offX=Math.floor((W-C*tile)/2);
offY=Math.floor((H-R*tile)/2+30);
}
resize();
addEventListener('resize',resize);

const GEMS=[];
let nextId=0;
function mkGem(c,r,type){
return{id:nextId++,
c:c,r:r,type:type,
px:c*tile,py=r*tile,
tx:c*tile,ty=r*tile,
alive:true,alpha:1,scale:0.0,
pop:false,popT=0};
}
function initBoard(){
for(let c=0;c<C;c++){Gems[c]=[];}
for(let c=0;c<C;c++){
for(let r=0;r<R;r++){
let g=mkGem(c,r,Math.floor(Math.random()*GEMN));
g.scale=0;
g.py=(R-1-r)*tile+(R+1)*tile;
Gems[c][r]=g;
}
}
// avoid initial matches
let tries=0;
while(findAllMatches().length>0&&tries<1000){
findAllMatches().forEach(m=>{
m.forEach(({c,r})=>{if(Gems[c]&&Gems[c][r]){Gems[c][r].type=(Gems[c][r].type+Math.floor(Math.random()*(GEMN-1)+1))%GEMN;}})
});
tries++;
}
}
function findMatches(){initBoard();return [];}
function findAllMatches(){
let matches=[];
// horizontal
for(let r=0;r<R;r++){
let run=[{c:0,r:0,type:0}];
for(let c=0;c<C+1;c++){
let g=(c<C)?Gems[c][r]:null;
let t=g?g.type:-1;
if(c===0){run=[{c:c,r=r,type=t,solid=!!g}};}
else if(t!==run[run.length-1].type||t===-1){matches.push(...expandRun(run));run=[{c:c,r=r,type=t,solid=!!g}};}
else run.push({c:c,r:r,type:t});
}
}
let s=[];
for(let r=0;r<R;r++){
let start=0;
for(let c=1;c<=C;c++){
let prev=Gems[c-1][r];
let next=(c<C)?Gems[c][r]:null;
let pt=prev&&prev.type;
let nt=next?next.type:-99;
if(pt!==nt){
if(c-1-start>=3)for(let k=start;k<c;k++)s.push(Gems[k][r].id);
start=c;
}
}
if(C-start>=3)for(let k=start;k<C;k++)s.push(Gems[k][r].id);
}
let sV=[];
for(let c=0;c<C;c++){
let start=0;
for(let r=1;r<=R;r++){
let prev=Gems[c][r-1];
let next=(r<R)?Gems[c][r]:null;
let pt=prev&&prev.type;
let nt=next?next.type:-99;
if(pt!==nt){
if(r-1-start>=3)for(let k=start;k<r;k++)s.push(Gems[c][k].id);
start=r;
}
}
if(R-start>=3)for(let k=start;k<R;k++)s.push(Gems[c][k].id);
}
return s;
}
// simpler match finder
function findMatchesSimple(){
let s=new Set();
for(let r=0;r<R;r++){
let sRun=1;
for(let c=1;c<C;c++){
if(Gems[c][r].type===Gems[c-1][r].type)sRun++;
else sRun=1;
if(sRun>=3){for(let k=0;k<3;k++)s.add(Gems[c-k][r].id);}
}
}
for(let c=0;c<C;c++){
let sRun=1;
for(let r=1;r<R;r++){
if(Gems[c][r].type===Gems[c][r-1].type)sRun++;
else sRun=1;
if(sRun>=3){for(let k=0;k<3;k++)s.add(Gems[c][r-k].id);}
}
}
}
return s;
}
</script>
</body>
</html>
