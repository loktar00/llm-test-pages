<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --sky-deep: #0a0e1a;
    --sky-mid: #1a1f3a;
    --sky-light: #2d2b55;
    --mountain-far: #1e1a3a;
    --mountain-mid: #2a2245;
    --mountain-near: #18102e;
    --mountain-front: #0f0a1e;
    --accent: #f4a261;
    --accent-glow: #e76f51;
    --text-primary: #f0e6d3;
    --text-secondary: #a89b8c;
    --section-height: 120vh;
  }

  html {
    scroll-behavior: smooth;
    overflow-x: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--sky-deep);
    color: var(--text-primary);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Stars ── */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: var(--o1); transform: scale(1); }
    100% { opacity: var(--o2); transform: scale(1.3); }
  }

  /* ── Parallax Container ── */
  .parallax-scene {
    position: relative;
    height: var(--section-height);
    overflow: hidden;
  }

  .parallax-layer {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    will-change: transform;
    transition: none;
  }

  .mountain-svg {
    display: block;
    width: 120%;
    margin-left: -10%;
  }

  /* ── Scene 1: Hero Mountains ── */
  #scene-hero {
    z-index: 1;
  }

  .sky-gradient {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      180deg,
      var(--sky-deep) 0%,
      #15102e 30%,
      #2a1f4a 55%,
      #3d2050 70%,
      #5a2d4a 85%,
      #8b4535 95%,
      #c47a4a 100%
    );
    z-index: 0;
  }

  .moon {
    position: absolute;
    top: 12%;
    right: 18%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e7, #f0d48a);
    box-shadow: 0 0 60px 20px rgba(240,212,138,0.15), 0 0 120px 60px rgba(240,212,138,0.05);
    z-index: 1;
  }

  /* ── Scene 2: Pinned Headline ── */
  #scene-headline {
    z-index: 2;
    height: 300vh;
  }

  .headline-pin {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  .headline-pin h1 {
    font-size: clamp(2.5rem, 7vw, 6rem);
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    animation: revealText 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  .headline-pin .subtitle {
    font-size: clamp(1rem, 2vw, 1.35rem);
    font-weight: 300;
    color: var(--text-secondary);
    margin-top: 1.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(20px);
    animation: revealText 1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
  }

  .headline-pin .scroll-hint {
    position: absolute;
    bottom: 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    opacity: 0;
    animation: revealText 1s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
  }

  .scroll-hint span {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .scroll-hint .arrow {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--text-secondary), transparent);
    animation: pulseArrow 2s ease-in-out infinite;
  }

  @keyframes pulseArrow {
    0%, 100% { opacity: 0.3; transform: scaleY(1); }
    50% { opacity: 0.8; transform: scaleY(1.2); }
  }

  @keyframes revealText {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Scene 3: CTA ── */
  #scene-cta {
    z-index: 3;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cta-content {
    text-align: center;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .cta-content.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .cta-content h2 {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 200;
    letter-spacing: -0.01em;
    margin-bottom: 1.25rem;
  }

  .cta-content p {
    font-size: clamp(1rem, 1.5vw, 1.2rem);
    color: var(--text-secondary);
    max-width: 480px;
    margin: 0 auto 2.5rem;
    line-height: 1.7;
    font-weight: 300;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 2.5rem;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--sky-deep);
    background: var(--accent);
    border: none;
    border-radius: 60px;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s ease;
    text-decoration: none;
  }

  .cta-btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 12px 40px rgba(244,162,97,0.35);
  }

  .cta-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .cta-btn svg {
    transition: transform 0.3s ease;
  }
  .cta-btn:hover svg {
    transform: translateX(3px);
  }

  .cta-footer {
    position: absolute;
    bottom: 2rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
    opacity: 0.4;
    letter-spacing: 0.1em;
  }

  /* ── Divider Lines ── */
  .divider {
    width: 1px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, var(--text-secondary), transparent);
    opacity: 0.2;
    margin: 0 auto;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .moon { width: 50px; height: 50px; right: 12%; top: 10%; }
  }
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- ════════════════════════════════════════ -->
<!-- SCENE 1: Hero with Parallax Mountains   -->
<!-- ════════════════════════════════════════ -->
<section id="scene-hero" class="parallax-scene">
  <div class="sky-gradient"></div>
  <div class="moon"></div>

  <!-- Layer 1: Far mountains (slowest) -->
  <div class="parallax-layer" data-speed="0.15" id="layer-far">
    <svg class="mountain-svg" viewBox="0 0 1600 400" preserveAspectRatio="none" style="height:45vh">
      <defs>
        <linearGradient id="farGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2a2250"/>
          <stop offset="100%" stop-color="#1e1a3a"/>
        </linearGradient>
      </defs>
      <path d="M0,400 L0,280 Q100,200 200,250 Q300,180 400,220 Q500,150 600,200 Q700,120 800,180 Q900,100 1000,160 Q1100,130 1200,190 Q1300,140 1400,200 Q1500,170 1600,230 L1600,400 Z" fill="url(#farGrad)" opacity="0.7"/>
    </svg>
  </div>

  <!-- Layer 2: Mid mountains -->
  <div class="parallax-layer" data-speed="0.35" id="layer-mid">
    <svg class="mountain-svg" viewBox="0 0 1600 400" preserveAspectRatio="none" style="height:55vh">
      <defs>
        <linearGradient id="midGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a2a5c"/>
          <stop offset="100%" stop-color="#2a2245"/>
        </linearGradient>
      </defs>
      <path d="M0,400 L0,300 Q80,260 160,290 Q240,220 350,260 Q420,180 520,240 Q600,160 700,210 Q780,140 880,200 Q960,150 1060,210 Q1140,170 1240,230 Q1320,190 1420,250 Q1500,210 1600,270 L1600,400 Z" fill="url(#midGrad)" opacity="0.85"/>
    </svg>
  </div>

  <!-- Layer 3: Near mountains (fastest) -->
  <div class="parallax-layer" data-speed="0.6" id="layer-near">
    <svg class="mountain-svg" viewBox="0 0 1600 400" preserveAspectRatio="none" style="height:65vh">
      <defs>
        <linearGradient id="nearGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#251845"/>
          <stop offset="100%" stop-color="#18102e"/>
        </linearGradient>
      </defs>
      <path d="M0,400 L0,320 Q120,270 220,310 Q320,240 440,280 Q540,200 660,260 Q760,180 860,240 Q960,190 1080,250 Q1180,210 1280,270 Q1380,230 1480,280 L1600,300 L1600,400 Z" fill="url(#nearGrad)"/>
    </svg>
  </div>

  <!-- Layer 4: Front silhouette -->
  <div class="parallax-layer" data-speed="0.85" id="layer-front">
    <svg class="mountain-svg" viewBox="0 0 1600 400" preserveAspectRatio="none" style="height:35vh">
      <path d="M0,400 L0,360 Q200,320 400,350 Q600,300 800,340 Q1000,310 1200,345 Q1400,320 1600,355 L1600,400 Z" fill="#0f0a1e"/>
    </svg>
  </div>
</section>

<!-- ════════════════════════════════════════ -->
<!-- SCENE 2: Pinned Headline                -->
<!-- ════════════════════════════════════════ -->
<section id="scene-headline">
  <div class="headline-pin">
    <h1>Beyond the<br>Horizon</h1>
    <p class="subtitle">Where silence meets the sky</p>
    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="arrow"></div>
    </div>
  </div>
</section>

<!-- ════════════════════════════════════════ -->
<!-- SCENE 3: CTA                            -->
<!-- ════════════════════════════════════════ -->
<section id="scene-cta" class="parallax-scene">
  <div class="sky-gradient" style="background: linear-gradient(180deg, #0a0e1a 0%, #12102a 50%, #1a1535 100%)"></div>

  <!-- CTA mountain layers -->
  <div class="parallax-layer" data-speed="0.1" id="layer-cta-far">
    <svg class="mountain-svg" viewBox="0 0 1600 400" preserveAspectRatio="none" style="height:40vh; opacity:0.4">
      <path d="M0,400 L0,300 Q200,250 400,290 Q600,230 800,280 Q1000,240 1200,290 Q1400,260 1600,300 L1600,400 Z" fill="#1e1a3a"/>
    </svg>
  </div>
  <div class="parallax-layer" data-speed="0.25" id="layer-cta-mid">
    <svg class="mountain-svg" viewBox="0 0 1600 400" preserveAspectRatio="none" style="height:30vh; opacity:0.5">
      <path d="M0,400 L0,340 Q300,300 600,330 Q900,290 1200,330 Q1400,310 1600,340 L1600,400 Z" fill="#2a2245"/>
    </svg>
  </div>
  <div class="parallax-layer" data-speed="0.4" id="layer-cta-near">
    <svg class="mountain-svg" viewBox="0 0 1600 400" preserveAspectRatio="none" style="height:20vh; opacity:0.7">
      <path d="M0,400 L0,370 Q400,340 800,365 Q1200,340 1600,370 L1600,400 Z" fill="#18102e"/>
    </svg>
  </div>

  <div class="cta-content" id="ctaContent">
    <h2>Begin Your Journey</h2>
    <p>Step into a world where every horizon reveals something new. The path ahead is yours to discover.</p>
    <a href="#" class="cta-btn">
      Explore Now
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
  <div class="cta-footer">© 2025 Horizon</div>
</section>

<script>
(function() {
  'use strict';

  // ── Generate Stars ──
  const starsContainer = document.getElementById('stars');
  const starCount = 120;
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 0.5;
    star.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      top: ${Math.random() * 60}%;
      left: ${Math.random() * 100}%;
      --o1: ${Math.random() * 0.3 + 0.1};
      --o2: ${Math.random() * 0.5 + 0.5};
      --dur: ${Math.random() * 3 + 2}s;
      animation-delay: ${Math.random() * 5}s;
    `;
    starsContainer.appendChild(star);
  }

  // ── Parallax Engine ──
  const layers = document.querySelectorAll('.parallax-layer');
  let ticking = false;

  function updateParallax() {
    const scrollY = window.pageYOffset;
    const vh = window.innerHeight;

    layers.forEach(layer => {
      const speed = parseFloat(layer.dataset.speed) || 0;
      const parent = layer.closest('section');
      if (!parent) return;

      const parentTop = parent.offsetTop;
      const parentHeight = parent.offsetHeight;
      const visibleInRange = scrollY + vh;

      // Only animate if this section is somewhat visible
      if (scrollY + vh > parentTop && scrollY < parentTop + parentHeight) {
        const progress = (scrollY - parentTop) / (parentHeight - vh);
        const clampedProgress = Math.max(0, Math.min(1, progress));
        const offset = clampedProgress * speed * vh * 0.8;
        layer.style.transform = `translate3d(0, -${offset}px, 0)`;
      }
    });

    ticking = false;
  }

  // ── CTA Reveal ──
  const ctaContent = document.getElementById('ctaContent');
  const ctaSection = document.getElementById('scene-cta');

  function checkCTA() {
    const rect = ctaSection.getBoundingClientRect();
    const vh = window.innerHeight;
    if (rect.top < vh * 0.75) {
      ctaContent.classList.add('visible');
    } else {
      ctaContent.classList.remove('visible');
    }
  }

  // ── Scroll Handler ──
  function onScroll() {
    if (!ticking) {
      requestAnimationFrame(() => {
        updateParallax();
        checkCTA();
      });
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });

  // ── Initial Call ──
  updateParallax();
  checkCTA();

  // ── Handle Resize ──
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      updateParallax();
      checkCTA();
    }, 150);
  });

})();
</script>
</body>
</html>
