<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids Murmuration</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0d0c10;
}
canvas {
    display: block;
}
</style>
</head>
<body>
<canvas id="boids"></canvas>
<script>
(() => {
    const canvas = document.getElementById('boids');
    const ctx = canvas.getContext('2d');
    
    let width, height, dpr;
    const boids = [];
    const numBoids = 600;
    let predator = null;

    function init() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#040306';

        for (let i = 0; i < numBoids; i++) {
            boids.push({
                x: Math.random() * width,
                y: Math.random() * (height * 0.7),
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.3,
                size: 1.2 + Math.random() * 0.8
            });
        }

        window.addEventListener('resize', () => {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
        });

        setInterval(spawnPredator, 8000 + Math.random() * 12000);
        requestAnimationFrame(update);
    }

    function spawnPredator() {
        if (Math.random() < 0.7) {
            predator = {
                x: Math.random() * width,
                y: Math.random() * (height * 0.6),
                radius: 40 + Math.random() * 30,
                life: 120 + Math.random() * 60
            };
        }
    }

    function update() {
        ctx.fillStyle = '#040306';
        ctx.fillRect(0, 0, width, height);

        // Draw landscape silhouette
        ctx.fillStyle = '#020204';
        ctx.beginPath();
        ctx.moveTo(0, height * 0.75);
        for (let x = 0; x < width; x += 20) {
            const hillY = height * 0.75 + Math.sin(x * 0.01 + frameCount * 0.002) * 8;
            ctx.lineTo(x, hillY);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // Update predator
        if (predator) {
            predator.life--;
            if (predator.life <= 0) predator = null;
        }

        // Update boids
        for (const b of boids) {
            // Edges
            if (b.x < 0) b.x = width;
            else if (b.x > width) b.x = 0;
            if (b.y < 0) b.y = height;
            else if (b.y > height) b.y = 0;

            let ax = 0, ay = 0;
            let neighborCount = 0;
            let sepX = 0, sepY = 0;
            let alignX = 0, alignY = 0;
            let cohX = 0, cohY = 0;

            for (const other of boids) {
                if (other === b) continue;
                const dx = other.x - b.x;
                const dy = other.y - b.y;
                const distSq = dx * dx + dy * dy;

                // Wrap distance
                let rdx = dx;
                let rdy = dy;
                if (Math.abs(rdx) > width / 2) rdx = -Math.sign(rdx) * (width - Math.abs(rdx));
                if (Math.abs(rdy) > height / 2) rdy = -Math.sign(rdy) * (height - Math.abs(rdy));

                const realDist = Math.sqrt(rdx * rdx + rdy * rdy);

                // Separation
                if (realDist < 18 && realDist > 0.01) {
                    const force = (18 - realDist) / 18;
                    sepX -= (rdx / realDist) * force;
                    sepY -= (rdy / realDist) * force;
                }

                // Alignment & Cohesion
                if (realDist < 45) {
                    alignX += other.vx;
                    alignY += other.vy;
                    cohX += other.x;
                    cohY += other.y;
                    neighborCount++;
                }
            }

            // Predator avoidance
            if (predator) {
                const pdx = b.x - predator.x;
                const pdy = b.y - predator.y;
                const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                if (pdist < predator.radius) {
                    const force = (predator.radius - pdist) / predator.radius;
                    ax += (pdx / pdist) * force * 2.5;
                    ay += (pdy / pdist) * force * 2.5;
                }
            }

            if (neighborCount > 0) {
                ax += (alignX / neighborCount - b.vx) * 0.05;
                ay += (alignY / neighborCount - b.vy) * 0.05;
                ax += (cohX / neighborCount - b.x) * 0.001;
                ay += (cohY / neighborCount - b.y) * 0.001;
            }

            ax += sepX * 0.02;
            ay += sepY * 0.02;

            // Apply forces
            b.vx += ax;
            b.vy += ay;
            const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
            const maxSpeed = 1.8;
            if (speed > maxSpeed) {
                b.vx = (b.vx / speed) * maxSpeed;
                b.vy = (b.vy / speed) * maxSpeed;
            }

            b.x += b.vx;
            b.y += b.vy;

            // Draw
            drawBoid(b);
        }

        frameCount++;
        requestAnimationFrame(update);
    }

    let frameCount = 0;

    function drawBoid(b) {
        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        const angle = Math.atan2(b.vy, b.vx);
        const shade = 20 + Math.min(speed * 8, 60);
        ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
        ctx.beginPath();
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(angle);
        ctx.moveTo(0, -b.size);
        ctx.lineTo(-b.size * 0.5, b.size);
        ctx.lineTo(b.size * 0.5, b.size);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    init();
})();
</script>
</body>
</html>
