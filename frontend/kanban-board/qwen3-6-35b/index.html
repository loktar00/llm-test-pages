<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Kanban Board</title>
    <style>
        :root {
            --bg-app: #0f172a;
            --bg-column: #1e293b;
            --bg-card: #334155;
            --bg-card-hover: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #a78bfa;
            --accent-green: #4ade80;
            --accent-orange: #fb923c;
            --accent-red: #f87171;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lift: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: var(--font-family);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        header {
            margin-bottom: 2rem;
            padding-left: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            height: 100%;
            overflow-x: auto;
            padding-bottom: 1rem;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .column {
            background-color: var(--bg-column);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            min-width: 280px;
            max-width: 350px;
            height: 100%;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .column-header {
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .column-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            background: rgba(255,255,255,0.1);
            padding: 0.15rem 0.5rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .column-body {
            padding: 1rem;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        /* Cards */
        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 1rem;
            box-shadow: var(--shadow-card);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: grab;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover {
            transform: rotate(-1.5deg) translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-lift);
            background-color: var(--bg-card-hover);
            z-index: 10;
        }

        .card:active {
            cursor: grabbing;
            transform: scale(0.98);
        }

        /* Urgent Pulse Animation */
        .card.urgent {
            border: 1px solid rgba(248, 113, 113, 0.4);
        }

        .card.urgent::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(248, 113, 113, 0.15), transparent 70%);
            opacity: 0;
            animation: pulse-urgent 3s infinite;
            pointer-events: none;
        }

        @keyframes pulse-urgent {
            0% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            display: inline-block;
        }

        .label.design { background: rgba(167, 139, 250, 0.2); color: var(--accent-purple); }
        .label.dev { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
        .label.ux { background: rgba(74, 222, 128, 0.2); color: var(--accent-green); }
        .label.bug { background: rgba(248, 113, 113, 0.2); color: var(--accent-red); }

        .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .avatars {
            display: flex;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #475569;
            border: 2px solid var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-left: -8px;
            transition: transform 0.2s ease;
        }

        .avatar:first-child { margin-left: 0; }
        .card:hover .avatar { margin-left: -4px; } /* Slight spread on hover */

        .due-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .due-date.overdue {
            color: var(--accent-red);
        }

        /* Add Card Affordance */
        .add-card-btn {
            margin: 0 1rem 1rem 1rem;
            padding: 0.75rem;
            background: transparent;
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .add-card-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
        }

        .add-card-btn svg {
            width: 16px;
            height: 16px;
        }

    </style>
</head>
<body>

    <header>
        <h1>Project Alpha</h1>
        <div style="display: flex; gap: 10px;">
            <div style="width: 32px; height: 32px; background: #475569; border-radius: 50%;"></div>
        </div>
    </header>

    <div class="board">
        <!-- Column 1: Backlog -->
        <div class="column">
            <div class="column-header">
                <span class="column-title">Backlog <span class="count-badge" id="count-backlog">0</span></span>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
            </div>
            <div class="column-body" id="col-backlog">
                <!-- Cards injected via JS -->
            </div>
            <button class="add-card-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
                Add Card
            </button>
        </div>

        <!-- Column 2: In Progress -->
        <div class="column">
            <div class="column-header">
                <span class="column-title">In Progress <span class="count-badge" id="count-progress">0</span></span>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
            </div>
            <div class="column-body" id="col-progress">
                <!-- Cards injected via JS -->
            </div>
            <button class="add-card-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
                Add Card
            </button>
        </div>

        <!-- Column 3: Review -->
        <div class="column">
            <div class="column-header">
                <span class="column-title">Review <span class="count-badge" id="count-review">0</span></span>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            <div class="column-body" id="col-review">
                <!-- Cards injected via JS -->
            </div>
            <button class="add-card-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
                Add Card
            </button>
        </div>

        <!-- Column 4: Done -->
        <div class="column">
            <div class="column-header">
                <span class="column-title">Done <span class="count-badge" id="count-done">0</span></span>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <div class="column-body" id="col-done">
                <!-- Cards injected via JS -->
            </div>
            <button class="add-card-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
                Add Card
            </button>
        </div>
    </div>

    <script>
        const tasks = [
            // Backlog
            { title: "Research competitors", status: "backlog", label: "ux", labelText: "UX Research", avatars: ["JD", "AS"], date: "Oct 24", urgent: false },
            { title: "Define user personas", status: "backlog", label: "design", labelText: "Design", avatars: ["MK"], date: "Oct 28", urgent: false },
            { title: "Setup CI/CD Pipeline", status: "backlog", label: "dev", labelText: "DevOps", avatars: ["TR", "JD", "AS"], date: "Nov 01", urgent: false },
            { title: "Q4 Marketing Strategy", status: "backlog", label: "design", labelText: "Marketing", avatars: ["AS"], date: "Nov 15", urgent: false },

            // In Progress
            { title: "Fix login redirect bug", status: "progress", label: "bug", labelText: "Bug", avatars: ["TR"], date: "Oct 22", urgent: true },
            { title: "Implement Dark Mode", status: "progress", label: "dev", labelText: "Frontend", avatars: ["JD", "MK"], date: "Oct 25", urgent: false },
            { title: "Update API endpoints", status: "progress", label: "dev", labelText: "Backend", avatars: ["TR"], date: "Oct 26", urgent: false },
            { title: "Design System Tokens", status: "progress", label: "design", labelText: "System", avatars: ["MK"], date: "Oct 30", urgent: false },

            // Review
            { title: "Review Landing Page", status: "review", label: "ux", labelText: "UX", avatars: ["AS", "JD"], date: "Oct 20", urgent: false },
            { title: "Database Schema V2", status: "review", label: "dev", labelText: "Backend", avatars: ["TR"], date: "Oct 21", urgent: false },
            { title: "Mobile Responsiveness", status: "review", label: "dev", labelText: "Frontend", avatars: ["JD"], date: "Oct 23", urgent: false },

            // Done
            { title: "Project Setup", status: "done", label: "dev", labelText: "DevOps", avatars: ["TR", "JD"], date: "Sep 30", urgent: false },
            { title: "Initial Wireframes", status: "done", label: "ux", labelText: "UX", avatars: ["MK", "AS"], date: "Oct 05", urgent: false },
            { title: "Client Meeting Notes", status: "done", label: "design", labelText: "PM", avatars: ["AS"], date: "Oct 10", urgent: false },
        ];

        function createCardHTML(task) {
            const avatarHTML = task.avatars.map((initials, i) => 
                `<div class="avatar" style="z-index: ${task.avatars.length - i}">${initials}</div>`
            ).join('');
            
            const isOverdue = new Date(task.date) < new Date() && task.status !== 'done';
            const urgentClass = task.urgent ? 'urgent' : '';

            return `
                <div class="card ${urgentClass}">
                    <div class="card-header">
                        <span class="label ${task.label}">${task.labelText}</span>
                    </div>
                    <div class="card-title">${task.title}</div>
                    <div class="card-footer">
                        <div class="avatars">
                            ${avatarHTML}
                        </div>
                        <div class="due-date ${isOverdue ? 'overdue' : ''}">
                            ${task.date}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBoard() {
            const columns = {
                backlog: document.getElementById('col-backlog'),
                progress: document.getElementById('col-progress'),
                review: document.getElementById('col-review'),
                done: document.getElementById('col-done')
            };

            // Clear columns
            Object.values(columns).forEach(col => col.innerHTML = '');

            // Counters
            const counts = { backlog: 0, progress: 0, review: 0, done: 0 };

            tasks.forEach(task => {
                if (columns[task.status]) {
                    columns[task.status].innerHTML += createCardHTML(task);
                    counts[task.status]++;
                }
            });

            // Update badges
            document.getElementById('count-backlog').textContent = counts.backlog;
            document.getElementById('count-progress').textContent = counts.progress;
            document.getElementById('count-review').textContent = counts.review;
            document.getElementById('count-done').textContent = counts.done;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderBoard);

    </script>
</body>
</html>
