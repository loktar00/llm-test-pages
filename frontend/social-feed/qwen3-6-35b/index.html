<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #050505;
            --text-secondary: #65676b;
            --accent-color: #1877f2;
            --hover-bg: #e4e6eb;
            --border-color: #ced0d4;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.2);
            --anim-speed: 0.2s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding-top: 40px;
            min-height: 100vh;
        }

        .feed-container {
            width: 100%;
            max-width: 500px;
            padding-bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Composer Card --- */
        .composer {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .composer-input {
            flex-grow: 1;
            border: none;
            background: var(--bg-color);
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            transition: background 0.2s;
        }

        .composer-input:focus {
            background: #e4e6eb;
        }

        /* --- Post Card --- */
        .post {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-weight: 600;
            font-size: 15px;
        }

        .timestamp {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-content {
            padding: 4px 16px 16px;
            font-size: 15px;
            line-height: 1.4;
        }

        .post-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            background-color: #eee;
        }

        /* --- Action Row --- */
        .action-row {
            border-top: 1px solid var(--border-color);
            padding: 4px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .action-btn {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            transition: background 0.1s;
            user-select: none;
        }

        .action-btn:hover {
            background-color: var(--hover-bg);
        }

        .action-btn.liked {
            color: #e0245e;
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* --- Like Animation Logic --- */
        .action-btn.bump {
            animation: bump 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        /* --- Floating New Posts Pill --- */
        .pill-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 100;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        }

        .pill-container.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .new-posts-pill {
            background: var(--card-bg);
            color: var(--accent-color);
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .new-posts-pill:hover {
            background-color: #f7f8fa;
        }

        .chevron-down {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

    </style>
</head>
<body>

<div class="feed-container" id="feed">
    <!-- Composer -->
    <div class="composer">
        <div class="avatar" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">Y</div>
        <input type="text" class="composer-input" placeholder="What's on your mind?">
    </div>
    
    <!-- Posts will be injected here -->
</div>

<!-- Floating Pill -->
<div class="pill-container" id="newPostsPill">
    <div class="new-posts-pill" id="scrollBtn">
        <span>2 New Posts</span>
        <svg class="chevron-down" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </div>
</div>

<script>
    // --- Data & Utils ---
    const gradients = [
        'linear-gradient(120deg, #f6d365 0%, #fda085 100%)',
        'linear-gradient(to right, #43e97b 0%, #38f9d7 100%)',
        'linear-gradient(to top, #a18cd1 0%, #fbc2eb 100%)',
        'linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)'
    ];

    const samplePosts = [
        { name: 'Alex Rivera', handle: '@arivera', time: '2m', text: 'Just finished the new design system! ���', hasImage: true },
        { name: 'Sarah Chen', handle: '@schen_dev', time: '15m', text: 'Coding in the rain is actually quite peaceful.', hasImage: false },
        { name: 'Marcus Johnson', handle: '@mj_photo', time: '1h', text: 'Golden hour never disappoints.', hasImage: true },
        { name: 'Emily Davis', handle: '@emilyd', time: '3h', text: 'Any recommendations for a good pasta recipe? ���', hasImage: false },
        { name: 'David Kim', handle: '@dkim', time: '5h', text: 'New setup, who dis?', hasImage: true },
        { name: 'Jessica Wu', handle: '@jwu_ui', time: '1d', text: 'Less is more. Minimalism isn\'t about having less, it\'s about making room for more of what matters.', hasImage: false }
    ];

    // --- DOM Elements ---
    const feed = document.getElementById('feed');
    const pill = document.getElementById('newPostsPill');
    const scrollBtn = document.getElementById('scrollBtn');

    // --- Functions ---

    function createAvatarGradient(index) {
        const hue = (index * 137.5) % 360; // Golden angle approximation
        return `linear-gradient(135deg, hsl(${hue}, 70%, 60%), hsl(${(hue + 40) % 360}, 70%, 50%))`;
    }

    function createPostHTML(data, index) {
        const avatarColor = createAvatarGradient(index + 10);
        const imageStyle = data.hasImage ? `background: ${gradients[index % gradients.length]};` : '';
        const imageClass = data.hasImage ? 'post-image' : '';
        
        return `
        <div class="post" data-index="${index}">
            <div class="post-header">
                <div class="avatar" style="background: ${avatarColor};">${data.name.charAt(0)}</div>
                <div class="user-info">
                    <span class="username">${data.name}</span>
                    <span class="timestamp">${data.time}</span>
                </div>
            </div>
            <div class="post-content">${data.text}</div>
            ${imageStyle ? `<div class="${imageClass}" style="${imageStyle}"></div>` : ''}
            <div class="action-row">
                <button class="action-btn like-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span class="count">${Math.floor(Math.random() * 900) + 10}</span>
                </button>
                <button class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
                    <span>42</span>
                </button>
                <button class="action-btn">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                    <span>12</span>
                </button>
            </div>
        </div>
        `;
    }

    function createBurstEffect(btn) {
        const rect = btn.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        
        const count = 12;
        const colors = ['#1877f2', '#e0245e', '#42b72a', '#f7b731'];

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            document.body.appendChild(p);

            // Random angle and distance
            const angle = Math.random() * Math.PI * 2;
            const velocity = 30 + Math.random() * 50;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            p.style.backgroundColor = color;
            p.style.left = `${centerX}px`;
            p.style.top = `${centerY}px`;
            
            // Animation
            p.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
            ], {
                duration: 600 + Math.random() * 200,
                easing: 'cubic-bezier(0, .9, .57, 1)',
                fill: 'forwards'
            }).onfinish = () => p.remove();
        }
    }

    function addPost() {
        // Simulate fetching a new post
        const newIndex = samplePosts.length + Math.floor(Math.random() * 100);
        const post = samplePosts[Math.floor(Math.random() * samplePosts.length)];
        const newPostData = { ...post, time: 'Just now', name: 'New User ' + (newIndex % 10) };
        
        const html = createPostHTML(newPostData, newIndex);
        
        // Insert at top
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        const postNode = tempDiv.firstElementChild;
        
        feed.insertBefore(postNode, feed.children[1]); // Skip composer
    }

    function handleScrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
        pill.classList.remove('visible');
    }

    // --- Initialization ---

    // Initial Posts
    samplePosts.forEach((p, i) => {
        feed.insertAdjacentHTML('beforeend', createPostHTML(p, i));
    });

    // Event Delegation for Likes
    feed.addEventListener('click', (e) => {
        const btn = e.target.closest('.like-btn');
        if (!btn) return;

        const countSpan = btn.querySelector('.count');
        let count = parseInt(countSpan.innerText);

        // Toggle State
        if (btn.classList.contains('liked')) {
            btn.classList.remove('liked', 'bump');
            countSpan.innerText = count - 1;
        } else {
            btn.classList.add('liked', 'bump');
            countSpan.innerText = count + 1;
            
            // Animation reset for reuse
            setTimeout(() => btn.classList.remove('bump'), 300);
            
            createBurstEffect(btn);
        }
    });

    // Floating Pill Logic
    setTimeout(() => {
        addPost(); // Add one new post immediately
        setTimeout(() => {
            addPost(); // Add another
            pill.classList.add('visible');
        }, 800);
    }, 3000);

    scrollBtn.addEventListener('click', handleScrollToTop);

</script>
</body>
</html>
