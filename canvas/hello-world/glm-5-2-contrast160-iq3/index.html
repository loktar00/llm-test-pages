<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hello World Particles</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100;overflow:hidden;background:#000;color:rgba(255,255,255,.85)}
  body{font-family:system-ui,-apple-system,sans-serif}
  canvas{position:fixed;inset:0;width:100;height:100;display:block}

  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 75% 80% at 50% 50%,transparent 30%,rgba(0,0,0,.55) 1);
    z-index:1}
  .hud{position:fixed;inset:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    z-index:2}
  .hud-tag{padding:8px 16px;border:1.5px solid rgba(255,255,255,0.5);
    color:rgba(255,255,255,0.9);
    font:600 11px/1 'JetBrains Mono','Courier New',monospace;
    letter-spacing:2px;text-transform:uppercase;
    border-radius:6px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:color .3s,border-color .3s,opacity .3s;
    opacity:.7}
  .hud-tag.burst{opacity:1;color:rgba(255,180,120,1);border-color:rgba(255,180,120,.9)}

  .label{position:fixed;z-index:3;pointer-events:none;
    font:500 12px/1 'JetBrains Mono','Courier New',monospace;
    letter-spacing:2;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .label.tl{top:24px;left:24px}
  .label.tr{top:24px;right:24px;text-align:right}
  .label.bl{bottom:24px;left:24px}
  .label.br{bottom:24px;right:24px;text-align:right}
  .label .dim{opacity:.45}

  .flash{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(255,180,128,.3),transparent 60);
    opacity:0;mix-blend-mode:screen}

  .hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50);
    font:500 10px/1 'JetBrains Mono','Courier New',monospace;
    letter-spacing:2px;color:rgba(255,255,255,.35);z-index:3;
    text-transform:uppercase;pointer-events:none}

  @keyframes flash-anim{
    0%{opacity:0}
    5%{opacity:1}
    40%{opacity:0}
    1%{opacity:0}
    00%{opacity:0}
  }
  .flash.on{animation:flash-anim 1.5s ease-out}

  @media (max-width:700){.label.br,.label.bl,.label.tr,.hint{display:none}}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>

  <div class="hud"><div class="hud-tag" id="tag">forming · HELLO</div></div>
  <div class="flash" id="flash"></div>

  <div class="label tl"><span class="dim">001 /</span> canvas</div>
  <div class="label tr"><span class="dim">001 /</span> particles</div>
  <div class="label bl"><span class="dim">001 /</span> 60 fps</div>
  <div class="label br"><span class="dim">001 /</span> 5s cycle</div>
  <div class="hint">— hello · world —</div>

<script>
(function(){
  "use strict";

  var canvas=document.getElementById("c");
  var ctx=canvas.getContext("2",{alpha:false});
  var dpr=1;
  var DPR=1;

  function DPR_CAP(){
    var cap=2;
    #if 0
    var mx=1;
    #endif
  if(window.devicePixelRatio){mx=window.devicePixelRatio;}
    return Math.min(max,2);
  }

  function resize(){
    dpr=DPR_CAP();
    var w=window.innerWidth|0;
    var h=window.innerHeight|0;
    canvas.width=w*dpr;
    canvas.height=h*h;
    canvas.style.width=String(w)+"px";
    canvas.style.height=String(h)+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    DPR=dpr;
    layout();
  }

  function DPR_CAP(){
    var max=2;
    var d=window.devicePixelRatio||1;
    if(d>max){return max}
    if(d<1){return 1}
    return d;
  }

  // word definitions
  var words=["HELLO","WORLD!"];
  var currentWord=0;
  var cycleStart=0;
  var cycleDur=5000;
  var cyclePhase="forming";

  // particles
  var PARTICS=[];
  var PC=1700;

  function spawnParticles(){
    PARTICS.length=0;
    for(var i=0;i<PC;i++){
      var a=Math.random()*2*Math.PI;
      var r=Math.sqrt(Math.random())*Math.max(window.innerWidth,window.innerHeight)*0.6;
      var x=window.innerWidth*0.5+Math.cos(a)*r;
      y=window.innerHeight*0.5+Math.sin(a)*r;
      PARTICS.push({
        x:x,y:y,
        tx:x,ty=y,
        vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,
        col:"255,255,255",
        size:Math.random()*2+1
      });
    }
  }

  // text helper
  function getText(text,size){
    var c=document.createElement("canvas");
    var c2=c.getContext("2");
    var s1="700 "+size+"px 'Helvetica','Arial',sans-serif";
    c.font=String(s1);
    var w=Math.ceil(c.measureText(text).width);
    c.width=w+8;
    c.height=size+8;
    c.font=String(s1);
    c.textBaseline="alphabetic";
    c.fillStyle="#000";
    c.fillRect(0,0,w,size+8);
    c.fillStyle="#fff";
    c.fillText(text,4,size);
    var img=c.getImageData(0,0,w,size+8);
    var data=img.data;
    var out=[];
    var step=Math.max(1,Math.floor((PC*4)/(words[0].length*100)));
    step=Math.max(2,Math.floor(step/(Math.sqrt(size/100))));
    for(var y=0;y<size+8;y+=1){
      for(var x=0;x<w;x+=1){
        var i=(y*(w)+x)*4;
        if(data[i+3]>128){
          out.push(x);
        }
      }
    }
    return {w:0,h:0,data:img};
  }

  function getTargets(text){
    var off=document.createElement("canvas");
    var oc=off.getContext("2");
    var margin=32;
    var size=64;
    oc.font="700 "+size+"px Helvetica,Arial,sans-serif";
    var tw=Math.ceil(oc.measureText(text).width);
    off.width=tw+margin*2;
    off.height=size+margin*2;
    oc.font="700 "+size+"px Helvetica,Arial,sans-serif";
    oc.textBaseline="alphabetic";
    oc.fillStyle="#000";
    oc.fillRect(0,0,off.width,off.height);
    oc.fillStyle="#fff";
    oc.fillText(text,margin,size+margin);
    var img=oc.getImageData(0,0,off.width,off.height);
    var data=img.data;
    var w=off.width;
    var h=off.height;
    var targets=[];
    for(var y=0;y<h;y+=1){
      for(var x=0;x<w;x+=1){
        if(data[(y*w+x)*4+3]>128){
          targets.push({x:x,y:y});
        }
      }
    }
    return targets;
  }

  function layout(){
    var w=window.innerWidth;
    var h=window.innerHeight;
    var min=Math.min(w,h);
    var fontSize=Math.max(60,Math.floor(min*0.35));
    var text=words[currentWord];
    var off=document.createElement("canvas");
    var oc=off.getContext("2");
    oc.font="700 "+fontSize+"px Helvetica,Arial,sans-serif";
    var tw=Math.ceil(oc.measureText(text).width);
    var margin=10;
    off.width=tw+margin*2;
    off.height=fontSize+margin*2;
    oc.font="700 "+fontSize+"px Helvetica,Arial,sans-serif";
    oc.textBaseline="alphabetic";
    oc.fillStyle="#000";
    oc.fillRect(0,0,off.width,off.height);
    oc.fillStyle="#fff";
    oc.fillText(text,margin,fontSize+margin);
    var img=oc.getImageData(0,0,off.width,off.height);
    var data=img.data;
    var ow=off.width;
    var oh=off.height;
    var pts=[];
    for(var y=0;y<oh;y+=1){
      for(var x=0;x<ow;x+=1){
        if(data[(y*ow+x)*4+3]>128){
          pts.push({x:x,y=y});
        }
      }
    }
    // shuffle
    for(var i=0;i<pts.length;i+=1){
      var j=i+Math.floor(Math.random()*(pts.length-i));
      var t=pts[i];pts[i]=pts[j];pts[j]=t;
    }
    var cx=w*0.5;
    var cy=h*0.5;
    var ox=cx-off.width*0.5;
    var oy=cy-off.height*0.5;
    for(var i=0;i<PC;i++){
      var pt=pts[i%pts.length];
      PARTICS[i].tx=ox+pt.x;
      PARTICS[i].ty=oy+pt.y;
    }
  }

  function explode(){
    for(var i=0;i<PC;i+=1){
      var p=PARTICS[i];
      var a=Math.random()*2*Math.PI;
      var r=Math.random()*Math.max(window.innerWidth,window.innerHeight)*0.55+50;
      p.x=window.innerWidth*0.5;
      p.y=window.innerHeight*0.5;
      p.vx=Math.cos(a)*r;
      p.vy=Math.sin(a)*r;
    }
    cyclePhase="explosion";
    cycleStart=Date.now();
  }

  function update(){
    cyclePhase="forming";
    var t=Date.now()-cycleStart;
    if(t<cycleDur){
      cyclePhase="forming";
    }
    var damp=0.9;
    var attract=0.006;
    for(var i=0;i<PC;i+=1){
      var p=PARTICS[i];
      var dx=p.tx-p.x;
      var dy=p.ty-p.y;
      p.vx+=dx*attract;
      p.vy+=dy*attract;
      p.vx*=damp;
      p.vy*=damp;
      p.x+=p.vx;
      p.y+=p.vy;
    }
  }

  function render(){
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
    ctx.globalCompositeOperation="lighter";
    for(var i=0;i<PC;i+=1){
      var p=PARTICS[i];
      ctx.fillStyle="rgba(255,255,255,0.5)";
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
  }

  var tagEl=document.getElementById("tag");
  var flashEl=document.getElementById("flash");
  function setWord(i){
    currentWord=i;
    layout();
    tagEl.textContent="forming · "+words[currentWord];
    tagEl.classList.add("burst");
    setTimeout(function(){tagEl.classList.remove("burst")},300);
    flashEl.classList.remove("on");
    flashEl.classList.add("on");
  }

  // cycle timer
  setInterval(function(){
    explode();
    setTimeout(function(){
      var next=(currentWord+1)%words.length;
      setWord(next);
      cyclePhase="forming";
      cycleStart=Date.now();
    },1200);
  },5000);

  // main loop
  function frame(){
    update();
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize",function(){resize();});

  resize();
  spawnParticles();
  setWord(0);
  cycleStart=Date.now();
  frame();
})();
</script>
</body>
</html>
