<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dungeon Carver</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: black;
        overflow: hidden;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="dungeon"></canvas>
<script>
(() => {
    const canvas = document.getElementById('dungeon');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const TILE_SIZE = 8;
    const GRID_W = Math.floor(width / TILE_SIZE);
    const GRID_H = Math.floor(height / TILE_SIZE);

    const TILE = {
        WALL: 0,
        FLOOR: 1
    };

    let grid = [];
    for (let y = 0; y < GRID_H; y++) {
        grid[y] = [];
        for (let x = 0; x < GRID_W; x++) {
            grid[y][x] = TILE.WALL;
        }
    }

    let rooms = [];
    let corridors = [];

    function placeRoom() {
        if (rooms.length > 0 && Math.random() < 0.3) return null;

        const rw = 3 + Math.floor(Math.random() * 4);
        const rh = 3 + Math.floor(Math.random() * 3);
        const rx = Math.floor(Math.random() * (GRID_W - rw - 2)) + 1;
        const ry = Math.floor(Math.random() * (GRID_H - rh - 2)) + 1;

        return {x: rx, y: ry, w: rw, h: rh};
    }

    function carveRoom(room) {
        for (let y = room.y; y < room.y + room.h; y++) {
            for (let x = room.x; x < room.x + room.w; x++) {
                grid[y][x] = TILE.FLOOR;
            }
        }
        rooms.push(room);
    }

    function connectRooms(from, to) {
        let fx = from.x + Math.floor(from.w / 2);
        let fy = from.y + Math.floor(from.h / 2);
        let tx = to.x + Math.floor(to.w / 2);
        let ty = to.y + Math.floor(to.h / 2);

        // L-shaped corridor
        let cx = fx, cy = fy;
        const corridor = [];

        while (cx !== tx || cy !== ty) {
            if (cx < tx) cx++;
            else if (cx > tx) cx--;
            else if (cy < ty) cy++;
            else if (cy > ty) cy--;
            grid[cy][cx] = TILE.FLOOR;
            corridor.push({x: cx, y: cy});
        }
        corridors.push(corridor);
    }

    let generationQueue = [];
    let torchLocations = [];
    let explorerPos = null;

    function generateStep() {
        const room = placeRoom();
        if (room && !isOverlapping(room)) {
            carveRoom(room);
            if (rooms.length > 1) {
                connectRooms(rooms[rooms.length - 2], room);
            }
            torchLocations.push({x: room.x + Math.floor(room.w/2), y: room.y + Math.floor(room.h/2)});
        }

        if (generationQueue.length > 0) {
            const task = generationQueue.pop();
            task();
        }
    }

    function isOverlapping(room) {
        for (const r of rooms) {
            if (!(room.x + room.w < r.x || room.x > r.x + r.w ||
                  room.y + room.h < r.y || room.y > r.y + r.h)) {
                return true;
            }
        }
        return false;
    }

    let progress = 0;
    const MAX_STEPS = (GRID_W * GRID_H) / 10;

    function spawnExplorer() {
        if (rooms.length > 0) {
            const room = rooms[0];
            explorerPos = {
                x: room.x + Math.floor(room.w / 2),
                y: room.y + Math.floor(room.h / 2),
                visited: new Set()
            };
        }
    }

    let visitedTiles = new Set();

    function updateExplorer() {
        if (!explorerPos) return;

        const dirs = [
            {dx: 0, dy: -1},
            {dx: 1, dy: 0},
            {dx: 0, dy: 1},
            {dx: -1, dy: 0}
        ];

        let bestDir = null;
        let minVisits = Infinity;

        for (const dir of dirs) {
            const nx = explorerPos.x + dir.dx;
            const ny = explorerPos.y + dir.dy;
            if (nx < 0 || ny < 0 || nx >= GRID_W || ny >= GRID_H) continue;
            if (grid[ny][nx] !== TILE.FLOOR) continue;

            const key = nx + ',' + ny;
            let visits = 1;
            if (explorerPos.visited.has(key)) visits = 2; // Prefer unvisited (lower value)

            if (visits < minVisits || (visits === minVisits && Math.random() < 0.3)) {
                minVisits = visits;
                bestDir = dir;
            }
        }

        if (bestDir) {
            explorerPos.x += bestDir.dx;
            explorerPos.y += bestDir.dy;
            const key = explorerPos.x + ',' + explorerPos.y;
            explorerPos.visited.add(key);
            visitedTiles.add(key);
        }
    }

    function drawTorchLight(x, y) {
        const cx = x * TILE_SIZE + TILE_SIZE / 2;
        const cy = y * TILE_SIZE + TILE_SIZE / 2;
        const radius = 60 + Math.sin(performance.now() / 200 + x + y) * 8;
        
        const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        gradient.addColorStop(0, 'rgba(255, 180, 80, 0.7)');
        gradient.addColorStop(0.6, 'rgba(255, 100, 30, 0.3)');
        gradient.addColorStop(1, 'rgba(255, 50, 10, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
    }

    function render() {
        // Draw grid
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, width, height);

        for (let y = 0; y < GRID_H; y++) {
            for (let x = 0; x < GRID_W; x++) {
                if (grid[y][x] === TILE.FLOOR) {
                    ctx.fillStyle = '#444';
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else {
                    ctx.fillStyle = '#111';
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // Draw torch lights
        for (const torch of torchLocations) {
            drawTorchLight(torch.x, torch.y);
        }

        // Draw explorer
        if (explorerPos) {
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.arc(
                explorerPos.x * TILE_SIZE + TILE_SIZE / 2,
                explorerPos.y * TILE_SIZE + TILE_SIZE / 2,
                2.5, 0, Math.PI * 2
            );
            ctx.fill();
        }

        // Draw progress text
        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        ctx.fillText(`Progress: ${Math.floor((progress / MAX_STEPS) * 100)}%`, 10, 20);
    }

    let fadeState = 0;

    function animate() {
        requestAnimationFrame(animate);

        if (progress < MAX_STEPS) {
            for (let i = 0; i < 3; i++) {
                generateStep();
                progress++;
                if (progress >= MAX_STEPS) break;
            }
        } else {
            if (!explorerPos) {
                spawnExplorer();
            } else {
                for (let i = 0; i < 2; i++) {
                    updateExplorer();
                }
            }

            if (fadeState === 0 && progress >= MAX_STEPS * 1.5) {
                fadeState = 1;
            }

            if (fadeState === 1) {
                fadeState = 2;
            }

            if (fadeState === 2) {
                // Fade effect
                ctx.fillStyle = 'rgba(0,0,0,' + (fadeAlpha) + ')';
                ctx.fillRect(0, 0, width, height);
                fadeAlpha += 0.02;

                if (fadeAlpha >= 1) {
                    // Reset everything
                    grid = [];
                    for (let y = 0; y < GRID_H; y++) {
                        grid[y] = [];
                        for (let x = 0; x < GRID_W; x++) {
                            grid[y][x] = TILE.WALL;
                        }
                    }
                    rooms = [];
                    corridors = [];
                    torchLocations = [];
                    explorerPos = null;
                    progress = 0;
                    fadeState = 0;
                    fadeAlpha = 0;
                    visitedTiles.clear();
                    MAX_STEPS = (GRID_W * GRID_H) / 10;
                    render();
                    return;
                }
            }
        }

        render();
    }

    let fadeAlpha = 0;
    animate();
})();
</script>
</body>
</html>
