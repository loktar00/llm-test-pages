<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0510;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
(function () {
  'use strict';

  // ===== Canvas =====
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 0;

  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildLandscape();
    buildStars();
  }
  window.addEventListener('resize', resize);

  // ===== Color palette (dusk) =====
  const SKY_STOPS = [
    [0.00, '#0a0510'],
    [0.18, '#2d0d2e'],
    [0.35, '#5d1a4e'],
    [0.55, '#9c3050'],
    [0.70, '#d97040'],
    [0.85, '#f5c270'],
    [0.93, '#fff3c0'],
    [1.00, '#fffae0']
  ];

  // ===== Boids =====
  const N = Math.round(550);
  const boids = [];

  const PERCEPTION = 26;
  const SEP_R = 11;
  const ALIGN_R = 22;
  const COH_R = 30;
  const MAX_SPD = 1.45;
  const MIN_SPD = 0.55;
  const PRED_FEAR = 95;
  const PRED_FEAR_SQ = PRED_FEAR * PRED_FEAR;

  let bImg = null;

  function makeBoidSprite() {
    const s = 12;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const cx = c.getContext('2d');
    const g = cx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.45, 'rgba(4,4,4,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = g;
    cx.fillRect(0, 0, s, s);
    bImg = c;
  }
  makeBoidSprite();

  function initBoids() {
    boids.length = 0;
    for (let i = 0; i < N; i++) {
      boids.push({
        x: W * (0.1 + Math.random() * 0.3),
        y: H * (0.5 + Math.random() * 0.3),
        vx: Math.random() * 2 - 1,
        vy: Math.random() * 2 - 1,
        cV: (0.5 + Math.random() * 0.4),
        cA: (0.55 + Math.random() * 0.4),
        cC: (0.45 + Math.random() * 0.4),
        cS: (1.05 + Math.random() * 0.4),
        cF: (1.4 + Math.random() * 0.6)
      });
    }
  }

  // ===== Spatial hash =====
  let CELL = 40;
  let hashW = 0, hashH = 0;
  let hash = [];
  let hashLen = [];

  function initHash() {
    hashW = Math.ceil((W + CELL) / CELL);
    hashH = Math.ceil((H + CELL) / CELL);
    const total = hashW * hashH;
    hash = new Array(total);
    hashLen = new Array(total);
    for (let i = 0; i < total; i++) {
      hash[i] = [0, 0];
      hashLen[i] = 0;
    }
  }

  // ===== Predator =====
  let pred = {
    x: Math.random() * W,
    y: Math.random() * H * 0.4,
    tx: Math.random() * W,
    ty: Math.random() * H * 0.4,
    active: false,
    cooldown: 0,
    life: 0,
    maxLife: 0
  };

  function newPredatorTarget() {
    pred.tx = Math.random() * W;
    pred.ty = Math.random() * H * 0.4 + Math.random() * 0.1;
    pred.maxLife = Math.random() * 6 + 4;
  }

  // ===== Landscape =====
  let hills = [];
  let stars = [];

  function buildLandscape() {
    hills = [];
    let x = -50;
    while (x < W + 100) {
      const y = H * (0.83 + Math.random() * 0.1);
      hills.push({ x: x, y: y });
      x += Math.random() * 60 + 30;
    }
    hills.push({ x: W + 100, y: H * 0.83 });
  }

  function buildStars() {
    stars = [];
    const skyTop = H * 0.06;
    const skyMid = H * 0.5;
    for (let i = 0; i < 120; i++) {
      const y = Math.random() * (H * 0.55);
      stars.push({
        x: Math.random() * W,
        y: y,
        s: Math.random() * 1.2 + 0.4,
        b: Math.random() * 1 + 0.3,
        tw: Math.random() * 6 + Math.random() * 4,
        off: Math.random() * 6
      });
    }
  }

  // ===== Update =====
  function update(dt) {
    if (pred.cooldown > 0) pred.cooldown -= dt;
    if (pred.life > 0 && pred.active) pred.life -= dt;
    if (pred.active && pred.life <= 0) {
      pred.active = false;
      pred.cooldown = Math.random() * 5 + 4;
    }
    if (pred.cooldown <= 0 && pred.life <= 0 && !pred.active) {
      pred.active = true;
      pred.life = Math.random() * 6 + 4;
      pred.maxLife = pred.life;
      newPredatorTarget();
    }
    if (pred.active) {
      const dx = pred.tx - pred.x;
      const dy = pred.ty - pred.y;
      const d = Math.sqrt(dx + dy);
      if (d > 5) {
        const sp = Math.random() * 2 + 70;
        pred.x += dx / d * sp * dt;
        pred.y += dy / d * sp * dt;
      }
      if (d < 8) newPredatorTarget();
    }
    const speedFactor = Math.max(0.1, dt * 60 / 16.67);

    initHash();
    for (let i = 0; i < boids.length; i++) {
      const b = boids[i];
      const cx = Math.floor((b.x - SEP_R) / CELL);
      const cy = Math.floor((b.y - SEP_R) / CELL);
      if (cx < 0 || cx >= hashW || cy < 0 || cy >= hashH) continue;
      const idx = cy * hashW + cx;
      hash[idx].push(b);
    }

    for (let i = 0; i < boids.length; i++) {
      const b = boids[i];
      const cX = Math.floor((b.x - COH_R) / CELL);
      const cY = Math.floor((b.y - COH_R) / CELL);
      if (cX < 0 || cX >= hashW || cY < 0 || cY >= hashH) continue;

      let sepX = 0, sepY = 0, sepCnt = 0;
      let alX = 0, alY = 0, alCnt = 0;
      let cohX = 0, cohY = 0, cohCnt = 0;

      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const nx = cX + ox;
          const ny = cY + oy;
          if (nx < 0 || nx >= hashW || ny < 0 || ny >= hashH) continue;
          const cellIdx = ny * hashW + nx;
          const cell = hash[cellIdx];
          const len = cell.length;
          for (let j = 0; j < len; j++) {
            const o = cell[j];
              const dx = o.x - b.x;
              const dy = o.y - b.y;
              const d2 = dx + dy;
                if (d2 < SEP_R_SQ) {
                  const d = sqrt(d2);
                  const inv = 1 / Math.max(0.1, d);
                  sepX += dx * inv;
                  sepY += dy * inv;
                  sepCnt++;
                }
                if (d2 < ALI_R_SQ && d2 >= SEP_R_SQ) {
                  alX += o.vx;
                  alY += o.vy;
                  alCnt++;
                }
                if (d2 < COH_R_SQ && d2 >= SEP_R_SQ) {
                  cohX += o.x;
                  cohY += o.y;
                  cohCnt++;
                }
              }
          }
        }
      }

      if (sepCnt) { sepX /= sepCnt; sepY /= sepCnt; }
      if (alCnt) { alX /= alCnt; alY /= alCnt; }
      if (cohCnt) { cohX /= cohCnt; cohY /= cohCnt; }

      // Alignment
      let alLen = sqrt(alX + alY);
      if (alLen < 0.0001) alLen = 0.0001;
      const alSpd = Math.max(alLen * MAX_SPD, 0.01);
      alX = alX / alLen * alSpd;
      alY = alY / alLen * alSpd;
      // Cohesion
      const cohdX = b.x - cohX;
      const cohdY = b.y - cohY;
      const cohd = sqrt(cohdX + cohdY);
      if (cohd < 0.0001) cohd = 0.0001;
      const cohSpd = Math.max(cohd * MAX_SPD * 0.5, 0.01);
      const cohDesX = cohdX / cohd * cohSpd;
      const cohDesY = co
