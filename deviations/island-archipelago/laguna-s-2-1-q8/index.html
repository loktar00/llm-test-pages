<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Procedural Archipelago</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="archipelago"></canvas>
<script>
const canvas = document.getElementById("archipelago");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

// Resize handler
window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// --- Noise functions ---
function rand(seed) {
  let x = Math.sin(seed++) * 10000;
  return x - Math.floor(x);
}

function noise2D(x, y, seed) {
  const X = Math.floor(x);
  const Y = Math.floor(y);
  const fx = x - X;
  const fy = y - Y;

  const a = rand((X + Y * 57) + seed);
  const b = rand((X + 1 + Y * 57) + seed);
  const c = rand((X + (Y + 1) * 57) + seed);
  const d = rand((X + 1 + (Y + 1) * 57) + seed);

  const u = fx * fx * (3 - 2 * fx);
  const v = fy * fy * (3 - 2 * fy);

  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}

function fractalNoise(x, y, octaves, persistence, seed) {
  let total = 0;
  let frequency = 1;
  let amplitude = 1;
  let maxValue = 0;

  for (let i = 0; i < octaves; i++) {
    total += noise2D(x * frequency, y * frequency, seed) * amplitude;
    maxValue += amplitude;
    amplitude *= persistence;
    frequency *= 2;
  }

  return total / maxValue;
}

// --- Islands ---
const islands = [];

function createIsland() {
  const island = {
    x: Math.random() * width,
    y: Math.random() * height,
    radius: 50 + Math.random() * 100,
    heightScale: 0.5 + Math.random() * 1.5,
    detailScale: 0.01 + Math.random() * 0.02,
    shapeSeed: Math.floor(Math.random() * 10000),
    foamOffset: Math.random() * Math.PI * 2,
    foamSpeed: 0.5 + Math.random() * 1,
    ships: []
  };

  islands.push(island);

  // Add initial ships
  if (Math.random() > 0.5) {
    island.ships.push({
      angle: Math.random() * Math.PI * 2,
      speed: 0.2 + Math.random() * 0.5,
      wake: []
    });
  }
}

// Initialize islands
for (let i = 0; i < 8; i++) {
  setTimeout(() => createIsland(), i * 800);
}

// --- Rendering ---
let time = 0;

function render() {
  time += 0.016;

  // Clear
  ctx.clearRect(0, 0, width, height);

  // Sky tint cycle
  const dayCycle = (Math.sin(time * 0.02) + 1) / 2;
  const skyR = 20 + dayCycle * 40;
  const skyG = 40 + dayCycle * 60;
  const skyB = 80 + dayCycle * 80;
  ctx.fillStyle = `rgb(${skyR}, ${skyG}, ${skyB})`;
  ctx.fillRect(0, 0, width, height);

  // Draw sea
  const seaLevel = 0.35;
  ctx.fillStyle = `rgb(${Math.floor(20 + dayCycle * 30)}, ${Math.floor(50 + dayCycle * 50)}, ${Math.floor(100 + dayCycle * 60)})`;
  ctx.fillRect(0, 0, width, height);

  // Draw islands
  for (const island of islands) {
    const h = heightmap(island);

    // Draw island layers
    if (h.land) {
      // Mountain core (snow)
      if (h.core > 0.7) {
        ctx.fillStyle = `rgb(240, 240, 255)`;
        drawIslandShape(ctx, island, h, 'core');
      }

      // Grass interior
      ctx.fillStyle = `rgb(${Math.floor(40 + dayCycle * 30)}, ${Math.floor(120 + dayCycle * 40)}, ${Math.floor(60)})`;
      drawIslandShape(ctx, island, h, 'grass');

      // Sand ring
      ctx.fillStyle = `rgb(220, 200, 140)`;
      drawIslandShape(ctx, island, h, 'sand');

      // Foam / shoreline
      drawFoam(ctx, island, h);
    }

    // Update & draw ships
    for (const ship of island.ships) {
      const dist = island.radius * 1.3;
      ship.angle += ship.speed * 0.002;
      const sx = island.x + Math.cos(ship.angle) * dist;
      const sy = island.y + Math.sin(ship.angle) * dist;

      // Wake
      ship.wake.push({x: sx, y: sy, t: time});
      if (ship.wake.length > 20) ship.wake.shift();

      for (let i = 0; i < ship.wake.length; i++) {
        const w = ship.wake[i];
        const life = (time - w.t) / 5;
        if (life < 1) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${1 - life})`;
          ctx.lineWidth = 2 * (1 - life);
          ctx.beginPath();
          ctx.moveTo(w.x, w.y);
          const next = ship.wake[i + 1];
          if (next) ctx.lineTo(next.x, next.y);
          ctx.stroke();
        }
      }

      // Ship
      ctx.fillStyle = "#222";
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(ship.angle);
      ctx.fillRect(-8, -3, 16, 6);
      ctx.restore();
    }
  }

  requestAnimationFrame(render);
}

function heightmap(island) {
  const px = (island.x - width / 2 + width / 2) / (island.radius * 2.5);
  const py = (island.y - height / 2 + height / 2) / (island.radius * 2.5);

  const noiseScale = island.detailScale;
  const detailNoise = fractalNoise(px * noiseScale, py * noiseScale, 4, 0.5, island.shapeSeed);
  const baseNoise = fractalNoise(px * 0.05, py * 0.05, 3, 0.4, island.shapeSeed + 1);

  const combined = detailNoise * 0.7 + baseNoise * 0.3;

  const dist = Math.hypot(px, py);
  const radialFalloff = Math.max(0, 1 - dist * (0.3 + island.heightScale * 0.2));

  const elevation = combined * radialFalloff * island.heightScale;

  return {
    elevation: elevation,
    sand: elevation > 0.2 && elevation <= 0.4,
    grass: elevation > 0.4 && elevation <= 0.7,
    core: elevation > 0.7,
    land: elevation > 0.15,
    foamEdge: elevation > 0.1 && elevation < 0.25
  };
}

function drawIslandShape(ctx, island, h, type) {
  const steps = 60;
  ctx.beginPath();

  for (let a = 0; a < Math.PI * 2; a += (Math.PI * 2) / steps) {
    const r = island.radius * (0.6 + h.elevation * 0.4);
    const px = island.x + Math.cos(a) * r;
    const py = island.y + Math.sin(a) * r;

    if (type === 'core' && h.core) {
      ctx.lineTo(px, py);
    } else if (type === 'grass' && h.grass) {
      ctx.lineTo(px, py);
    } else if (type === 'sand' && h.sand) {
      ctx.lineTo(px, px); // placeholder, replaced below
    }
  }

  if (type === 'sand' && h.sand) {
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 2; a += (Math.PI * 2) / steps) {
      const r = island.radius * (0.7 + h.elevation * 0.35);
      const px = island.x + Math.cos(a) * r;
      const py = island.y + Math.sin(a) * r;
      ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.closePath();
    ctx.fill();
  }
}

function drawFoam(ctx, island, h) {
  if (!h.foamEdge) return;

  const t = time + island.foamOffset;
  const baseAlpha = 0.4 + Math.sin(t * island.foamSpeed) * 0.2;
  const foamThickness = 6 + Math.sin(t * 0.5) * 2;

  ctx.strokeStyle = `rgba(255, 255, 255, ${baseAlpha})`;
  ctx.lineWidth = foamThickness;
  ctx.lineCap = "round";

  const steps = 120;
  ctx.beginPath();

  for (let a = 0; a < Math.PI * 2; a += (Math.PI * 2) / steps) {
    const r = island.radius * (0.8 + h.elevation * 0.3) + Math.sin(a * 3 + t) * 1.5;
    const px = island.x + Math.cos(a) * r;
    const py = island.y + Math.sin(a) * r;

    if (a === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.closePath();
  ctx.stroke();
}

// Start render loop
requestAnimationFrame(render);
</script>
</body>
</html>
