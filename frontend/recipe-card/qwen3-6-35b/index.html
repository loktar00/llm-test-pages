<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crispy Honey Garlic Salmon</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --paper: #FFFFFF;
            --text: #34495E;
            --border: #E0E6ED;
            --shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
            --radius: 24px;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: #E8F0F2;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Card Container --- */
        .card {
            background: var(--paper);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }

        /* --- Hero Section & CSS Art --- */
        .hero {
            height: 260px;
            background: linear-gradient(135deg, #fff0f0 0%, #ffe3e3 100%);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* CSS Salmon Art */
        .plate {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(-15deg);
        }

        .salmon {
            width: 140px;
            height: 80px;
            background: #FF9F43;
            border-radius: 50% 50% 40% 40%;
            position: relative;
            box-shadow: inset -10px -5px 0 rgba(0,0,0,0.1);
        }

        .salmon::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 20px;
            width: 100px;
            height: 40px;
            background: #FF6B6B;
            border-radius: 50%;
        }

        .salmon::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 120px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }

        .garnish {
            position: absolute;
            width: 10px;
            height: 20px;
            background: #6ab04c;
            border-radius: 0 50% 50% 50%;
            z-index: 2;
        }
        .g-1 { top: -10px; right: 20px; transform: rotate(45deg); }
        .g-2 { bottom: 10px; left: -10px; transform: rotate(-45deg); }

        /* --- Content Area --- */
        .content {
            padding: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        /* --- Meta Chips --- */
        .meta-chips {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .chip {
            background: #F1F3F5;
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .chip svg {
            width: 14px;
            height: 14px;
            fill: var(--primary);
        }

        /* --- Servings Stepper --- */
        .stepper-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .stepper-label {
            font-weight: 600;
            color: var(--dark);
        }

        .stepper-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-stepper {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-stepper:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .servings-count {
            font-size: 1.1rem;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* --- Ingredients --- */
        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #95A5A6;
            margin-bottom: 1rem;
        }

        .ingredient-list {
            list-style: none;
            margin-bottom: 2.5rem;
        }

        .ingredient-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #DDE1E7;
            border-radius: 6px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox svg {
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }

        .ingredient-item.checked .checkbox {
            background: var(--secondary);
            border-color: var(--secondary);
        }

        .ingredient-item.checked .checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .ing-text {
            font-size: 0.95rem;
            transition: all 0.3s;
            position: relative;
        }

        /* The strikethrough line animation */
        .ing-text::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 0;
            height: 2px;
            background: #95A5A6;
            transition: width 0.4s ease;
        }

        .ingredient-item.checked .ing-text {
            color: #BDC3C7;
            text-decoration: none; /* We use custom line */
        }

        .ingredient-item.checked .ing-text::after {
            width: 100%;
        }

        /* --- Instructions --- */
        .instructions {
            counter-reset: step;
        }

        .step-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        /* Connecting line for timeline feel */
        .step-item:not(:last-child)::before {
            content: '';
            position: absolute;
            left: 14px;
            top: 32px;
            bottom: -20px;
            width: 2px;
            background: #f0f0f0;
            z-index: 0;
        }

        .step-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: white;
            border: 2px solid #f0f0f0;
            color: #BDC3C7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            z-index: 1;
            transition: all 0.3s;
        }

        .step-item.completed .step-marker {
            background: var(--secondary);
            border-color: var(--secondary);
            color: white;
        }

        .step-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #7f8c8d;
            transition: color 0.3s;
        }

        .step-item.completed .step-text {
            color: var(--text);
            font-weight: 500;
        }

        /* --- Print Styles --- */
        @media print {
            body {
                background: white;
                padding: 0;
                display: block;
            }

            .card {
                box-shadow: none;
                max-width: 100%;
                border: none;
            }

            .hero {
                height: 150px;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .stepper-controls {
                display: none;
            }

            .ingredient-item, .step-item {
                page-break-inside: avoid;
            }

            /* Show all answers/ingredients clearly for print */
            .ingredient-item.checked .ing-text {
                color: black;
            }
            
            .ingredient-item.checked .ing-text::after {
                background: transparent;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Hero Header -->
        <div class="hero">
            <div class="plate">
                <div class="salmon"></div>
                <div class="garnish g-1"></div>
                <div class="garnish g-2"></div>
            </div>
        </div>

        <div class="content">
            <h1>Crispy Honey Garlic Salmon</h1>

            <!-- Meta Chips -->
            <div class="meta-chips">
                <div class="chip">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    20 min
                </div>
                <div class="chip">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    2 Servings
                </div>
                <div class="chip">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 9h-2V7h2v5z"/></svg>
                    Medium
                </div>
            </div>

            <!-- Servings Stepper -->
            <div class="stepper-container">
                <span class="stepper-label">Adjust Servings</span>
                <div class="stepper-controls">
                    <button class="btn-stepper" id="btn-minus" aria-label="Decrease servings">−</button>
                    <span class="servings-count" id="servings-display">2</span>
                    <button class="btn-stepper" id="btn-plus" aria-label="Increase servings">+</button>
                </div>
            </div>

            <!-- Ingredients -->
            <h2>Ingredients</h2>
            <ul class="ingredient-list" id="ingredient-list">
                <!-- Items injected by JS -->
            </ul>

            <!-- Instructions -->
            <h2>Instructions</h2>
            <div class="instructions" id="instruction-list">
                <!-- Steps injected by JS -->
            </div>
        </div>
    </div>

    <script>
        // --- Data ---
        const baseServings = 2;
        let currentServings = 2;
        
        const ingredientsData = [
            { amount: 2, unit: 'fillets', name: 'Atlantic Salmon' },
            { amount: 3, unit: 'tbsp', name: 'Soy Sauce' },
            { amount: 2, unit: 'tbsp', name: 'Honey' },
            { amount: 1, unit: 'tbsp', name: 'Sesame Oil' },
            { amount: 2, unit: 'cloves', name: 'Garlic, minced' },
            { amount: 0.5, unit: 'tsp', name: 'Red Chili Flakes' },
            { amount: 1, unit: 'tbsp', name: 'Lemon Juice' }
        ];

        const instructionsData = [
            "In a small bowl, whisk together soy sauce, honey, sesame oil, minced garlic, chili flakes, and lemon juice to create the glaze.",
            "Pat salmon fillets dry with paper towels and season generously with salt and pepper on both sides.",
            "Heat a large skillet over medium-high heat with a drizzle of oil. Sear salmon skin-side down for 4 minutes until crispy.",
            "Flip the salmon and pour the sauce into the pan. Cook for another 2-3 minutes until the sauce thickens and coats the fish.",
            "Garnish with sesame seeds and green onions. Serve immediately over steamed rice."
        ];

        // --- Helpers ---
        
        // Scales a number: if input is 2 and target is 4, returns 2x. 
        // Handles decimals nicely (e.g., 0.5 * 2 = 1).
        function scaleNumber(val) {
            const ratio = currentServings / baseServings;
            const result = val * ratio;
            
            // If it's a whole number, return int. Else, round to 1 decimal.
            if (Number.isInteger(result)) return result;
            return Math.round(result * 10) / 10;
        }

        // --- Rendering ---

        function renderIngredients() {
            const list = document.getElementById('ingredient-list');
            list.innerHTML = '';

            ingredientsData.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'ingredient-item';
                li.onclick = () => toggleIngredient(li);

                const scaledAmount = scaleNumber(item.amount);
                const text = `${scaledAmount} ${item.unit} ${item.name}`;

                li.innerHTML = `
                    <div class="checkbox">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <span class="ing-text" data-amount="${item.amount}">${text}</span>
                `;
                list.appendChild(li);
            });
        }

        function renderInstructions() {
            const list = document.getElementById('instruction-list');
            list.innerHTML = '';

            instructionsData.forEach((step, index) => {
                const div = document.createElement('div');
                div.className = 'step-item';
                div.onclick = () => toggleStep(div);
                
                div.innerHTML = `
                    <div class="step-marker">${index + 1}</div>
                    <div class="step-text">${step}</div>
                `;
                list.appendChild(div);
            });
        }

        // --- Interactions ---

        function toggleIngredient(el) {
            el.classList.toggle('checked');
        }

        function toggleStep(el) {
            el.classList.toggle('completed');
        }

        function updateStepper() {
            document.getElementById('servings-display').textContent = currentServings;
            
            // Update text in ingredients
            const ingTexts = document.querySelectorAll('.ing-text');
            ingTexts.forEach(span => {
                const baseAmount = parseFloat(span.getAttribute('data-amount'));
                const itemData = ingredientsData.find(i => i.amount === baseAmount); // Fallback lookup if needed, but simpler to just recalc logic
                
                // Actually, we need to rebuild the text properly to handle plurals or formatting if we wanted, 
                // but for this simple request, replacing the number is enough.
                // We need to map back to the original data object to get unit/name.
                // To keep it simple, let's just search the data array by base amount (assuming unique amounts for this demo).
                
                const originalItem = ingredientsData.find(i => Math.abs(i.amount - baseAmount) < 0.001);
                
                const scaled = scaleNumber(originalItem.amount);
                span.textContent = `${scaled} ${originalItem.unit} ${originalItem.name}`;
            });
        }

        document.getElementById('btn-plus').addEventListener('click', () => {
            if (currentServings < 12) {
                currentServings++;
                updateStepper();
            }
        });

        document.getElementById('btn-minus').addEventListener('click', () => {
            if (currentServings > 1) {
                currentServings--;
                updateStepper();
            }
