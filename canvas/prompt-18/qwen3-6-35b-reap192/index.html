<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Auto Combat</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1612; /* Dark rusty background */
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b5a2b;
            color: #e0c090;
            padding: 10px;
            border-radius: 4px;
            pointer-events: auto;
        }
        #controls-hint {
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            line-height: 1.5;
        }
        #weapon-display {
            top: 20px;
            right: 20px;
            text-align: right;
            font-weight: bold;
            font-size: 18px;
        }
        #health-bar-container {
            width: 200px;
            height: 20px;
            background: #333;
            border: 1px solid #555;
            margin-top: 5px;
            transform: skewX(-20deg);
        }
        #health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d32f2f, #ff6f00);
            transition: width 0.1s;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
    <div id="weapon-display" class="hud-panel">
        <div id="weapon-name">PISTOL</div>
        <div id="health-bar-container"><div id="health-fill"></div></div>
    </div>
    <div id="controls-hint" class="hud-panel">
        <strong>CONTROLS</strong><br>
        W/A/S/D - Drive<br>
        MOUSE - Aim<br>
        CLICK/SPACE - Fire
    </div>
</div>

<script>
/**
 * WASTELAND AUTO COMBAT
 * A self-contained simulation.
 */

// --- CONFIGURATION ---
const CONFIG = {
    mapWidth: 3000,
    mapHeight: 3000,
    playerCount: 1,
    aiCount: 10,
    friction: 0.96,
    turnSpeed: 0.06,
    maxSpeed: 12,
    respawnTime: 3000, // ms
    maxParticles: 300,
    cameraSmoothing: 0.08,
    cameraZoom: 0.75,
    stickyTimeLimit: 2000 // ms before AI explodes if stuck
};

// --- WEAPONS DATA ---
const WEAPONS = {
    pistol: { name: "PISTOL", damage: 15, speed: 15, rate: 400, type: 'bullet', spread: 0.05, color: '#ffeb3b', ammo: Infinity },
    machinegun: { name: "M-GUN", damage: 8, speed: 18, rate: 100, type: 'bullet', spread: 0.1, color: '#ff9800', ammo: 100 },
    shotgun: { name: "SHOTGUN", damage: 12, speed: 14, rate: 800, type: 'spread', pellets: 5, spread: 0.4, color: '#ff5722', ammo: 30 },
    rocket: { name: "ROCKET", damage: 60, speed: 8, rate: 1200, type: 'rocket', size: 8, color: '#212121', ammo: 10 },
    cannon: { name: "CANNON", damage: 40, speed: 22, rate: 1500, type: 'shell', size: 5, color: '#795548', ammo: 20 }
};

// --- SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const persistentCanvas = document.createElement('canvas');
const persistentCtx = persistentCanvas.getContext('2d');

let width, height;
let lastTime = 0;
let camera = { x: 0, y: 0, zoom: CONFIG.cameraZoom };
let player = null;
let cars = [];
let projectiles = [];
let particles = [];
let pickups = [];
let debris = [];
let mouse = { x: 0, y: 0, down: false };
let keys = {};

// --- UTILITIES ---
const rand = (min, max) => Math.random() * (max - min) + min;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const clamp = (val, min, max) => Math.min(Math.max(val, min), max);
const checkCollision = (c1, c2) => dist(c1.x, c1.y, c2.x, c2.y) < (c1.radius + c2.radius);

// --- INPUT HANDLERS ---
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});
window.addEventListener('mousedown', () => mouse.down = true);
window.addEventListener('mouseup', () => mouse.down = false);

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    persistentCanvas.width = CONFIG.mapWidth;
    persistentCanvas.height = CONFIG.mapHeight;
    generateWorld();
}

// --- CLASSES ---

class Particle {
    constructor(x, y, color, speed, size, life) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * speed;
        this.vy = (Math.random() - 0.5) * speed;
        this.size = size;
        this.life = life;
        this.maxLife = life;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= dt;
        this.size *= 0.98;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class Projectile {
    constructor(x, y, angle, owner, weapon) {
        this.x = x;
        this.y = y;
        this.owner = owner;
        this.weapon = weapon;
        this.angle = angle + (Math.random() - 0.5) * weapon.spread;
        this.speed = weapon.speed;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.life = 2000; // ms
        this.active = true;
        this.size = weapon.size || 3;
        
        // Mine specific
        if (weapon.type === 'mine') {
            this.vx = 0; 
            this.vy = 0;
            this.life = 8000;
        }
    }

    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= dt;

        // Mine logic
        if (this.weapon.type === 'mine') {
            // Check collision with enemies
            for (let car of cars) {
                if (car !== this.owner && car.health > 0) {
                    if (dist(this.x, this.y, car.x, car.y) < 60) {
                        this.explode();
                        return;
                    }
                }
            }
            if (this.life <= 0) {
                // Mines might pop harmlessly if expired, or just disappear
                this.active = false;
            }
            return;
        }

        // Rocket Smoke
        if (this.weapon.type === 'rocket' && Math.random() > 0.5) {
            particles.push(new Particle(this.x, this.y, '#555', 1, 3, 500));
        }

        // Bounds check
        if (this.x < 0 || this.x > CONFIG.mapWidth || this.y < 0 || this.y > CONFIG.mapHeight) {
            this.active = false;
        }
        
        // Wall collision
        if (this.x < 50 || this.x > CONFIG.mapWidth - 50 || this.y < 50 || this.y > CONFIG.mapHeight - 50) {
             createExplosion(this.x, this.y, 10, '#888');
             this.active = false;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        ctx.fillStyle = this.weapon.color;
        if (this.weapon.type === 'rocket') {
            ctx.fillRect(-this.size * 2, -this.size/2, this.size * 4, this.size);
        } else if (this.weapon.type === 'mine') {
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI*2);
            ctx.fillStyle = '#2e7d2e'; // Green mine
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Blinking light
            if (Math.floor(Date.now() / 200) % 2 === 0) {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(0,0, 2, 0, Math.PI*2);
                ctx.fill();
            }
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    explode() {
        this.active = false;
        createExplosion(this.x, this.y, 40, this.weapon.color);
        // Area Damage
        for (let car of cars) {
            if (car === this.owner) continue;
            const d = dist(this.x, this.y, car.x, car.y);
            if (d < 150) {
                const force = (150 - d) * 0.15;
                const angle = Math.atan2(car.y - this.y, car.x - this.x);
                car.vx += Math.cos(angle) * force;
                car.vy += Math.sin(angle) * force;
                car.takeDamage(this.weapon.damage);
            }
        }
    }
}

class Car {
    constructor(x, y, isPlayer) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.angle = Math.random() * Math.PI * 2;
        this.radius = 18;
        this.isPlayer = isPlayer;
        this.health = 100;
        this.maxHealth = 100;
        this.dead = false;
        this.respawnTimer = 0;
        
        // Appearance
        this.color = isPlayer ? '#3498db' : `hsl(${Math.random()*360}, 60%, 40%)`;
        this.stripeColor = isPlayer ? '#fff' : `hsl(${Math.random()*360}, 50%, 60%)`;
        
        // Weapon
        this.currentWeapon = WEAPONS.pistol;
        this.lastShot = 0;
        
        // AI specifics
        this.targetId = null;
        this.pickupTarget = null;
        this.stuckTimer = 0;
        this.lastPos = {x: x, y: y};
        
        // Turret
        this.turretAngle = 0;
    }

    update(dt) {
        if (this.dead) {
            this.respawnTimer -= dt;
            if (this.respawnTimer <= 0) this.respawn();
            return;
        }

        // Physics
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= CONFIG.friction;
        this.vy *= CONFIG.friction;

        // Cap speed
        const speed = Math.hypot(this.vx, this.vy);
        if (speed > CONFIG.maxSpeed) {
            this.vx = (this.vx / speed) * CONFIG.maxSpeed;
            this.vy = (this.vy / speed) * CONFIG.maxSpeed;
        }

        // Bounds Collision
        if (this.x < 20) { this.x = 20; this.vx *= -0.5; this.takeDamage(1); }
        if (this.x > CONFIG.mapWidth - 20) { this.x = CONFIG.mapWidth - 20; this.vx *= -0.5; this.takeDamage(1); }
        if (this.y < 20) { this.y = 20; this.vy *= -0.5; this.takeDamage(1); }
        if (this.y > CONFIG.mapHeight - 20) { this.y = CONFIG.mapHeight - 20; this.vy *= -0.5; this.takeDamage(1); }

        // Obstacle Collision
        for (let obs of debris) {
            if (obs.type === 'wreck') {
                const dx = this.x - obs.x;
                const dy = this.y - obs.y;
                const d = Math.hypot(dx, dy);
                if (d < this.radius + obs.radius) {
                    const angle = Math.atan2(dy, dx);
                    const overlap = (this.radius + obs.radius) - d;
                    this.x += Math.cos(angle) * overlap;
                    this.y += Math.sin(angle) * overlap;
                    // Bounce
                    this.vx += Math.cos(angle) * 2;
                    this.vy += Math.sin(angle) * 2;
                    this.takeDamage(2);
                    createSparks(this.x, this.y, 3);
                }
            }
        }

        // Tire marks (only if moving fast)
        if (speed > 2) {
            stampTireMarks(this.x, this.y, this.angle);
        }

        // --- AI LOGIC ---
        if (!this.isPlayer) {
            this.runAI(dt);
        } else {
            this.runPlayerControl();
        }

        // Aim Turret
        if (this.isPlayer) {
            // Convert screen mouse to world mouse
            const worldMouseX = (mouse.x - width/2) / camera.zoom + camera.x;
            const worldMouseY = (mouse.y - height/2) / camera.zoom + camera.y;
            this.turretAngle = Math.atan2(worldMouseY - this.y, worldMouseX - this.x);
            
            if (mouse.down || keys['Space']) {
                this.fire();
            }
        }
    }

    runPlayerControl() {
        const accel = 0.4;
        if (keys['KeyW'] || keys['ArrowUp']) {
            this.vx += Math.cos(this.angle) * accel;
            this.vy += Math.sin(this.angle) * accel;
        }
        if (keys['KeyS'] || keys['ArrowDown']) {
            this.vx -= Math.cos(this.angle) * accel * 0.5;
            this.vy -= Math.sin(this.angle) * accel * 0.5;
        }
        if (keys['KeyA'] || keys['ArrowLeft']) this.angle -= CONFIG.turnSpeed;
        if (keys['KeyD'] || keys['ArrowRight']) this.angle += CONFIG.turnSpeed;
    }

    runAI(dt) {
        // 1. Find Target
        let closestDist = 1000;
        this.targetId = null;
        
        // Check cars
        for (let c of cars) {
            if (c === this || c.dead) continue;
            const d = dist(this.x, this.y, c.x, c.y);
            if (d < closestDist) {
                closestDist = d;
                this.targetId = c.id;
            }
        }

        // Check Pickups (Priority if close)
        this.pickupTarget = null;
        for (let p of pickups) {
            const d = dist(this.x, this.y, p.x, p.y);
            if (d < 300) {
                this.pickupTarget = p;
                break; // Take closest
            }
        }

        // 2. Steering
        let targetX = this.x + Math.cos(this.angle) * 100;
        let targetY = this.y + Math.sin(this.angle) * 100;

        if (this.pickupTarget) {
            targetX = this.pickupTarget.x;
            targetY = this.pickupTarget.y;
        } else if (this.targetId) {
            const target = cars.find(c => c.id === this.targetId);
            if (target) {
                targetX = target.x;
                targetY = target.y;
            }
        }

        const desiredAngle = Math.atan2(targetY - this.y, targetX - this.x);
        let diff = desiredAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        
        // Turn towards target
        this.angle += Math.sign(diff) * Math.min(Math.abs(diff), CONFIG.turnSpeed * 1.5);

        // 3. Move
        // If facing target and close enough to shoot, stop or slow down
        if (this.targetId && closestDist < 300) {
            const accel = 0.15;
            this.vx += Math.cos(this.angle) * accel;
            this.vy += Math.sin(this.angle) * accel;
        } else {
            const accel = 0.35;
            this.vx += Math.cos(this.angle) * accel;
            this.vy += Math.sin(this.angle) * accel;
        }

        // 4. Aim Turret at enemy
        if (this.targetId) {
            const target = cars.find(c => c.id === this.targetId);
            if (target) {
                this.turretAngle = Math.atan2(target.y - this.y, target.x - this.x);
            }
        } else {
            this.turretAngle = this.angle; // Look forward
        }

        // 5. Stuck Detection
        const moved = dist(this.x, this.y, this.lastPos.x, this.lastPos.y);
        if (moved < 0.5) {
            this.stuckTimer += dt;
            // Spin to unstuck
            this.angle += 0.05;
        } else {
            this.stuckTimer = 0;
        }

        if (this.stuckTimer > CONFIG.stickyTimeLimit) {
            this.takeDamage(1000); // Explode
        }

        this.lastPos = {x: this.x, y: this.y};

        // 6. Fire
        this.fire();
    }

    fire() {
        const now = Date.now();
        if (now - this.lastShot > this.currentWeapon.rate) {
            // Ammo check (if not pistol)
            // Simplified: infinite ammo for simulation stability or just ignore count
            // this.currentWeapon.ammo--; 
            // if (this.currentWeapon.ammo <= 0) { this.currentWeapon = WEAPONS.pistol; }

            this.lastShot = now;
            
            const wep = this.currentWeapon;

            if (wep.type === 'spread') {
                for(let i=0; i<wep.pellets; i++) {
                    projectiles.push(new Projectile(this.x, this.y, this.turretAngle + (Math.random()-0.5)*wep.spread, this, wep));
                }
            } else {
                // Rocket/Mine offset
                let px = this.x + Math.cos(this.turretAngle) * 20;
                let py = this.y + Math.sin(this.turretAngle) * 20;
                projectiles.push(new Projectile(px, py, this.turretAngle, this, wep));
            }
            
            // Recoil
            this.vx -= Math.cos(this.turretAngle) *
