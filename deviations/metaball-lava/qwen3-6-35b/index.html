<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaball Lava Lamp</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="lavaCanvas"></canvas>
    <script>
        const canvas = document.getElementById('lavaCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // Configuration
        const BLOB_COUNT = 12;
        const SCALE = 0.25; // Render at 1/4 resolution for performance
        const THRESHOLD = 1.0;
        
        // Offscreen buffers
        let fieldCanvas, fieldCtx, fieldData;
        let colorCanvas, colorCtx, colorData;
        
        // State
        let width, height, fieldWidth, fieldHeight;
        let blobs = [];
        let time = 0;

        // Blob Class
        class Blob {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.radius = 40 + Math.random() * 30;
                this.mass = this.radius * this.radius; // Mass proportional to area
                
                // Position
                this.x = Math.random() * width;
                // If initial, random Y. If reset, spawn at bottom or top.
                this.y = initial ? Math.random() * height : (Math.random() > 0.5 ? 0 : height);
                
                // Velocity
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = 0;
                
                // Temperature (0 = cold/dense/slow, 1 = hot/less dense/fast)
                // Base is hot (1.0), Top is cold (0.0)
                this.temp = initial ? Math.random() : (this.y > height / 2 ? 1.0 : 0.0);
            }

            update() {
                // Physics
                // Buoyancy depends on temperature
                // Hot blobs rise (negative vy), Cold blobs sink (positive vy)
                const buoyancy = (this.temp - 0.5) * 0.15; 
                
                // Drag
                const drag = 0.98;

                this.vy += buoyancy;
                this.vy *= drag;
                this.vx *= drag;

                // Add some turbulence
                this.vx += (Math.random() - 0.5) * 0.1;
                
                this.x += this.vx;
                this.y += this.vy;

                // Wall collisions
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.5; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.5; }

                // Heat Cycle
                // Base (bottom) heats up
                if (this.y > height - 80) {
                    this.temp = Math.min(1.0, this.temp + 0.02);
                } 
                // Top cools down
                else if (this.y < 80) {
                    this.temp = Math.max(0.0, this.temp - 0.02);
                } 
                // Natural cooling/heating towards equilibrium based on height
                else {
                    const targetTemp = 1.0 - (this.y / height);
                    this.temp += (targetTemp - this.temp) * 0.01;
                }

                // Reset if stuck or out of bounds (safety)
                if (this.y < -100 || this.y > height + 100) {
                    this.reset();
                }
            }

            draw(ctx) {
                // We don't draw the blob directly, the field does the work.
                // But we need to ensure the field is updated.
            }
        }

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            fieldWidth = Math.ceil(width * SCALE);
            fieldHeight = Math.ceil(height * SCALE);

            // Create offscreen canvas for field calculation
            fieldCanvas = document.createElement('canvas');
            fieldCanvas.width = fieldWidth;
            fieldCanvas.height = fieldHeight;
            fieldCtx = fieldCanvas.getContext('2d');
            fieldData = fieldCtx.createImageData(fieldWidth, fieldHeight);

            // Create offscreen canvas for final color
            colorCanvas = document.createElement('canvas');
            colorCanvas.width = width;
            colorCanvas.height = height;
            colorCtx = colorCanvas.getContext('2d');
            colorData = colorCtx.createImageData(width, height);

            // Initialize Blobs
            blobs = [];
            for (let i = 0; i < BLOB_COUNT; i++) {
                blobs.push(new Blob());
            }
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // Pre-calculate color gradients for performance
        // Cold color: Deep Red/Maroon
        // Hot color: Bright Orange/Yellow
        const coldColor = hexToRgb('#2a0000'); // Very dark red
        const midColor = hexToRgb('#d92603'); // Bright red/orange
        const hotColor = hexToRgb('#ffcc00'); // Yellow/White

        function updateField() {
            // Clear field buffer
            // We use a simple 1D array for the scalar field values
            const pixels = fieldData.data;
            const len = fieldWidth * fieldHeight;
            
            // Reset field to 0
            // We only need to clear the alpha channel or a specific channel if we were storing data
            // But here we will write directly to a temporary array or reuse the buffer
            
            // Let's use a simple Uint16Array for the field to avoid precision issues, 
            // though standard float32 is fine.
            // Actually, let's just write directly to the ImageData alpha channel as the scalar field.
            // Alpha 0 = empty, Alpha 255 = full blob.
            
            // Optimization: Iterate over the coarse grid
            for (let y = 0; y < fieldHeight; y++) {
                for (let x = 0; x < fieldWidth; x++) {
                    const idx = (y * fieldWidth + x) * 4;
                    
                    let sum = 0;
                    
                    // Calculate field value from all blobs
                    for (let i = 0; i < blobs.length; i++) {
                        const b = blobs[i];
                        // Map coarse pixel back to full resolution for accuracy
                        const bx = x / SCALE;
                        const by = y / SCALE;
                        
                        const dx = bx - b.x;
                        const dy = by - b.y;
                        
                        // Distance squared
                        const distSq = dx * dx + dy * dy;
                        
                        // Metaball function: r^2 / dist^2
                        // Using radius scaled to full res
                        const r = b.radius;
                        sum += (r * r) / distSq;
                    }
                    
                    // Thresholding
                    // If sum > 1.0, we are inside a blob.
                    // We store the raw sum in the Alpha channel for coloring later
                    if (sum > THRESHOLD) {
                        // Map sum (1.0 to ~4.0) to 0-255 intensity
                        // The "core" is where sum is high.
                        const intensity = Math.min(255, (sum - THRESHOLD) * 100); 
                        pixels[idx] = 0;   // R
                        pixels[idx+1] = 0; // G
                        pixels[idx+2] = 0; // B
                        pixels[idx+3] = intensity; // A = Field Value
                    } else {
                        pixels[idx+3] = 0; // Transparent
                    }
                }
            }
            
            // Put field data to offscreen canvas
            fieldCtx.putImageData(fieldData, 0, 0);
        }

        function render() {
            // Clear main canvas with background color
            // Glass lamp background
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, height);
            gradient.addColorStop(0, '#1a0505');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Draw the field to the color canvas
            // We use the field canvas (which has the scalar field in Alpha)
            // and composite it onto the color canvas.
            
            // 1. Draw the field onto color canvas
            // We want to map the Alpha value (intensity) to color.
            // We can use a custom shader-like approach with ImageData manipulation.
            
            const srcData = fieldData.data;
            const dstData = colorData.data;
            const len = fieldWidth * fieldHeight;
            
            for (let i = 0; i < len; i++) {
                const srcIdx = i * 4;
                const dstIdx = i * 4; // This is wrong, we need to map coarse to full res
                
                // Actually, let's just iterate the full resolution for coloring
                // But that's slow in JS. 
                // Better approach: Draw the field canvas (scaled up) onto color canvas using 'source-in' or similar?
                // No, we need to map the field value (alpha) to a specific lava color palette.
                
                // Let's iterate the coarse grid and assign colors
                const alpha = srcData[srcIdx + 3];
                
                if (alpha > 0) {
                    // Map alpha (0-255) to Color
                    // Alpha comes from (sum - threshold) * 100.
                    // Higher alpha = denser core = hotter/brighter.
                    
                    let r, g, b;
                    
                    if (alpha < 128) {
                        // Outer edge: Dark Red
                        const t = alpha / 128;
                        r = coldColor.r + (midColor.r - coldColor.r) * t;
                        g = coldColor.g + (midColor.g - coldColor.g) * t;
                        b = coldColor.b + (midColor.b - coldColor.b) * t;
                    } else {
                        // Inner core: Bright Orange/Yellow
                        const t = (alpha - 128) / 128;
                        r = midColor.r + (hotColor.r - midColor.r) * t;
                        g = midColor.g + (hotColor.g - midColor.g) * t;
                        b = midColor.b + (hotColor.b - midColor.b) * t;
                    }
                    
                    // We need to fill the corresponding block of full-res pixels
                    // Since SCALE is 0.25, each field pixel is 4x4 pixels
                    const fx = Math.floor(i % fieldWidth);
                    const fy = Math.floor(i / fieldWidth);
                    
                    const startX = fx * SCALE;
                    const startY = fy * SCALE;
                    
                    for (let dy = 0; dy < SCALE; dy++) {
                        for (let dx = 0; dx < SCALE; dx++) {
                            const fullX = startX + dx;
                            const fullY = startY + dy;
                            const fullIdx = (fullY * width + fullX) * 4;
                            
                            dstData[fullIdx] = r;
                            dstData[fullIdx+1] = g;
                            dstData[fullIdx+2] = b;
                            dstData[fullIdx+3] = 255;
                        }
                    }
                }
            }
            
            colorCtx.putImageData(colorData, 0, 0);
            
            // Draw the resulting image onto the main canvas
            ctx.drawImage(colorCanvas, 0, 0, width, height);
            
            // Add glass reflection/gloss
            ctx.globalCompositeOperation = 'overlay';
            const glassGrad = ctx.createLinearGradient(0, 0, width, height);
            glassGrad.addColorStop(0, 'rgba(255,255,255,0.1)');
            glassGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
            glassGrad.addColorStop(1, 'rgba(255,255,255,0.1)');
            ctx.fillStyle = glassGrad;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
        }

        function loop() {
            // Update blobs
            for (let i = 0; i < blobs.length; i++) {
                blobs[i].update();
            }
            
            // Calculate field
            updateField();
            
            // Render
            render();
            
            time++;
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', init);
        init();
        loop();

    </script>
</body>
</html>
