<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Cavern Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="cave"></canvas>
    <script>
        const canvas = document.getElementById('cave');
        const ctx = canvas.getContext('2d');

        let width, height;
        let crystals = [];
        let drips = [];
        let ripples = [];
        let cameraShake = 0;
        let flashIntensity = 0;

        // Configuration
        const MAX_CRYSTALS = 60;
        const GROWTH_THRESHOLD = 0.6; // When to trigger tremor
        const CRYSTAL_TYPES = [
            { color: '#00ffff', type: 'diamond' },
            { color: '#ff00ff', type: 'ruby' },
            { color: '#00ff00', type: 'emerald' },
            { color: '#ffff00', type: 'topaz' },
            { color: '#ffffff', type: 'quartz' }
        ];

        // Light Source
        const light = { x: 0, y: 0, vx: 2, vy: 1.5, radius: 300 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            light.x = width * 0.3;
            light.y = height * 0.3;
        }

        window.addEventListener('resize', resize);
        resize();

        class Crystal {
            constructor(x, y, angle, depth, parent) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.depth = depth;
                this.parent = parent;
                this.growth = 0;
                this.maxGrowth = 20 + Math.random() * 40;
                this.speed = 0.2 + Math.random() * 0.3;
                this.color = CRYSTAL_TYPES[Math.floor(Math.random() * CRYSTAL_TYPES.length)];
                this.width = (10 - depth * 2) * (0.8 + Math.random() * 0.4);
                this.age = Date.now();
                this.dead = false;
                
                // Facet parameters
                this.turn = (Math.random() - 0.5) * 0.2;
            }

            update() {
                if (this.growth < this.maxGrowth) {
                    this.growth += this.speed;
                    
                    // Branching logic
                    if (this.growth > 10 && Math.random() < 0.02 && this.depth < 3) {
                        this.branch();
                    }
                }
            }

            branch() {
                const newAngle = this.angle + (Math.random() > 0.5 ? 0.6 : -0.6);
                const newX = this.x + Math.cos(this.angle) * this.growth * 0.7;
                const newY = this.y + Math.sin(this.angle) * this.growth * 0.7;
                
                const newCrystal = new Crystal(newX, newY, newAngle, this.depth + 1, this);
                crystals.push(newCrystal);
            }

            draw(ctx, lightX, lightY) {
                const rad = this.angle;
                const len = this.growth;
                const w = this.width;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(rad);

                // Draw Facets
                ctx.beginPath();
                ctx.moveTo(0, -w);
                ctx.lineTo(len, 0);
                ctx.lineTo(0, w);
                ctx.closePath();
                
                // Shading based on light position
                const angleToLight = Math.atan2(lightY - this.y, lightX - this.x);
                const diffAngle = angleToLight - rad;
                const lightFactor = (Math.cos(diffAngle) + 1) / 2; // 0 to 1
                
                const baseColor = this.hexToRgb(this.color.color);
                const r = Math.floor(baseColor.r * (0.3 + 0.7 * lightFactor));
                const g = Math.floor(baseColor.g * (0.3 + 0.7 * lightFactor));
                const b = Math.floor(baseColor.b * (0.3 + 0.7 * lightFactor));

                // Glimmer
                const glimmer = Math.sin(Date.now() * 0.005 + this.x) * 0.2 + 0.8;

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${glimmer})`;
                ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`;
                ctx.lineWidth = 1;
                ctx.fill();
                ctx.stroke();

                // Draw inner shine line
                ctx.beginPath();
                ctx.moveTo(0, -w/3);
                ctx.lineTo(len * 0.8, 0);
                ctx.lineTo(0, w/3);
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 * glimmer})`;
                ctx.stroke();

                ctx.restore();
            }

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 0, g: 0, b: 0 };
            }

            destroy() {
                this.dead = true;
                // Create shards
                for(let i=0; i<3; i++) {
                    drips.push(new FallingShard(this.x, this.y, this.angle, this.color.color));
                }
            }
        }

        class FallingShard {
            constructor(x, y, angle, color) {
                this.x = x;
                this.y = y;
                this.angle = angle + Math.PI / 2 + (Math.random() - 0.5);
                this.speed = Math.random() * 5;
                this.size = Math.random() * 5 + 2;
                this.color = color;
                this.life = 1.0;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.speed += 0.2; // Gravity
                this.life -= 0.01;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillRect(-this.size, -this.size/2, this.size*2, this.size);
                ctx.restore();
            }
        }

        class Drip {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.z = 0; // falling distance
                this.speed = 0;
                this.active = true;
            }

            update() {
                if (this.z < height * 0.6) {
                    this.speed += 0.5;
                    this.z += this.speed;
                } else {
                    this.active = false;
                    createRipple(this.x, this.y);
                }
            }
            
            draw(ctx) {
                if(!this.active) return;
                ctx.fillStyle = "rgba(150, 255, 255, 0.8)";
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.z, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 1;
                this.alpha = 1;
            }

            update() {
                this.radius += 2;
                this.alpha -= 0.02;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.strokeStyle = `rgba(100, 255, 255, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.radius, this.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function createRipple(x, y) {
            ripples.push(new Ripple(x, y));
        }

        function spawnCrystals() {
            if (crystals.length < MAX_CRYSTALS) {
                // Ceiling growth
                if (Math.random() > 0.5) {
                    const x = Math.random() * width;
                    crystals.push(new Crystal(x, 0, Math.PI / 2, 0, null));
                }
                // Floor growth
                if (Math.random() > 0.7) {
                    const x = Math.random() * width;
                    crystals.push(new Crystal(x, height, -Math.PI / 2, 0, null));
                }
                
                // Spawn drips from ceiling crystals
                if (Math.random() < 0.05) {
                    const ceilingCrystals = crystals.filter(c => c.y < 20);
                    if (ceilingCrystals.length > 0) {
                        const c = ceilingCrystals[Math.floor(Math.random() * ceilingCrystals.length)];
                        drips.push(new Drip(c.x, c.y));
                    }
                }
            }
        }

        function triggerTremor() {
            cameraShake = 20;
            flashIntensity = 1.0;
            
            // Shatter oldest crystals
            let shattered = 0;
            crystals.forEach(c => {
                if (c.age < Date.now() - 10000 && shattered < 10) {
                    c.destroy();
                    shattered++;
                }
            });

            // If not enough shattered, just pick random old ones
            if (shattered < 5) {
                 crystals.sort((a,b) => a.age - b.age);
                 for(let i=0; i<5; i++) {
                     crystals[i].destroy();
                 }
            }
        }

        function drawCaveEnvironment() {
            // Background Gradient
            const grad = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, height);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Cave Floor and Ceiling (Abstract shapes)
            ctx.fillStyle = '#08080a';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            for(let i=0; i<=width; i+=50) {
                ctx.lineTo(i, 50 + Math.sin(i * 0.01) * 30);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, height);
            for(let i=0; i<=width; i+=50) {
                ctx.lineTo(i, height - 50 + Math.cos(i * 0.02) * 40);
            }
            ctx.lineTo(width, 0);
            ctx.lineTo(0, 0);
            ctx.fill();
        }

        function drawLightSource() {
            // Animate light
            light.x += light.vx;
            light.y += light.vy;
            
            if (light.x > width - 100 || light.x < 100) light.vx *= -1;
            if (light.y > height - 100 || light.y < 100) light.vy *= -1;

            // Draw light glow
            const gradient = ctx.createRadialGradient(light.x, light.y, 10, light.x, light.y, light.radius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.1, 'rgba(200, 240, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawCaustics() {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            
            // Pseudo-caustics based on crystal positions
            crystals.forEach(c => {
                const angleToLight = Math.atan2(light.y - c.y, light.x - c.x);
                // Refract light "down" or "across"
                const refractX = c.x + Math.cos(angleToLight + 0.5) * 100;
                const refractY = c.y + Math.sin(angleToLight + 0.5) * 100;
                
                // Draw light splash on floor
                const splash = ctx.createRadialGradient(refractX, refractY, 0, refractX, refractY, 50);
                splash.addColorStop(0, c.color.color);
                splash.addColorStop(1, 'transparent');
                
                ctx.fillStyle = splash;
                ctx.globalAlpha = 0.3;
                ctx.fillRect(refractX - 50, refractY - 50, 100, 100);
            });
            
            ctx.restore();
        }

        function loop() {
            // Shake effect
            let shakeX = 0;
            let shakeY = 0;
            if (cameraShake > 0) {
                shakeX = (Math.random() - 0.5) * cameraShake;
                shakeY = (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.9;
                if (cameraShake < 0.5) cameraShake = 0;
            }

            ctx.save();
            ctx.translate(shakeX, shakeY);

            drawCaveEnvironment();
            
            // Caustics
            drawCaustics();

            // Update and Draw Crystals
            spawnCrystals();
            
            // Check threshold
            const fillRatio = crystals.length / MAX_CRYSTALS;
            if (fillRatio > GROWTH_THRESHOLD) {
                triggerTremor();
            }

            crystals = crystals.filter(c => !c.dead);
            crystals.forEach(c => {
                c.update();
                c.draw(ctx, light.x, light.y);
            });

            // Drips and Ripples
            drips = drips.filter(d => d.active);
            drips.forEach(d => {
                d.update();
                d.draw(ctx);
            });

            ripples = ripples.filter(r => r.alpha > 0);
            ripples.forEach(r => {
                r.update();
                r.draw(ctx);
            });

            // Falling shards
            drips.filter(d => !d.active && d instanceof FallingShard); // Hacky filter, just redraw logic
            // We need to separate FallingShards from Drips visually in array or just check type
            // For simplicity in this single file, let's filter the main array for shards
            // Actually, let's just keep them in drips array but check type
            
            // Update shards (they are in the drips array but marked dead logic is different)
            // Let's refine the Drip/Shard separation
            for(let i=drips.length-1; i>=0; i--) {
                if(drips[i] instanceof FallingShard) {
                    drips[i].update();
                    drips[i].draw(ctx);
                    if(drips[i].life <= 0) drips.splice(i, 1);
                }
            }

            // Light Source (draw last for bright overlay)
            drawLightSource();
            
            // Screen Flash
            if (flashIntensity > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity})`;
                ctx.fillRect(0, 0, width, height);
                flashIntensity *= 0.9;
                if(flashIntensity < 0.01) flashIntensity = 0;
            }

            ctx.restore();
            requestAnimationFrame(loop);
        }

        // Start
        loop();

    </script>
</body>
</html>
