<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle Siege</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }
        h1 { margin: 0; font-size: 24px; color: #ffcc00; }
        #status { font-size: 32px; font-weight: bold; margin-top: 10px; display: none; }
        .win { color: #4caf50; }
        .lose { color: #f44336; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>AUTONOMOUS SIEGE</h1>
        <div id="status"></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
/**
 * CASTLE SIEGE ENGINE
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

// Game Constants
const GRAVITY = 0.4;
const GROUND_Y_OFFSET = 50;
let WIDTH, HEIGHT, GROUND_Y;

// Game State
let gameState = 'ATTACKING'; // ATTACKING, BREACHED, REPELLED, RESETTING
let frame = 0;
let entities = [];
let particles = [];
let projectiles = [];
let castle = null;
let attackers = [];
let defenders = [];
let shake = 0;

// Resize Handling
function resize() {
    WIDTH = canvas.width = window.innerWidth;
    HEIGHT = canvas.height = window.innerHeight;
    GROUND_Y = HEIGHT - GROUND_Y_OFFSET;
    if (castle) castle.rebuild();
}
window.addEventListener('resize', resize);
resize();

// --- UTILS ---
function rand(min, max) { return Math.random() * (max - min) + min; }
function checkRectCollide(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

// --- CLASSES ---

class Particle {
    constructor(x, y, color, speed, life) {
        this.x = x;
        this.y = y;
        this.vx = rand(-speed, speed);
        this.vy = rand(-speed, 0);
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = rand(2, 5);
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += GRAVITY * 0.5;
        this.life--;
        if (this.y > GROUND_Y) {
            this.y = GROUND_Y;
            this.vx = 0;
            this.vy = 0;
        }
    }
    draw() {
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

class Projectile {
    constructor(x, y, vx, vy, type, owner) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.type = type; // 'arrow', 'stone'
        this.owner = owner; // 'attackers', 'defenders'
        this.active = true;
        this.rotation = Math.atan2(vy, vx);
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += GRAVITY;
        this.rotation = Math.atan2(this.vy, this.vx);

        // Ground hit
        if (this.y > GROUND_Y) {
            this.active = false;
            if (this.type === 'stone') createExplosion(this.x, GROUND_Y, '#888', 10);
        }

        // Castle Hit Logic
        if (this.type === 'stone' && castle) {
            if (this.x > castle.x && this.x < castle.x + castle.width && this.y > castle.y) {
                castle.takeDamage(this);
                this.active = false;
                createExplosion(this.x, this.y, '#888', 15);
                shake = 10;
                return;
            }
        }

        // Unit Hit Logic
        const targets = this.owner === 'attackers' ? defenders : attackers;
        for (let t of targets) {
            if (t.dead) continue;
            if (this.x > t.x && this.x < t.x + t.w && this.y > t.y && this.y < t.y + t.h) {
                t.takeDamage(1);
                this.active = false;
                createExplosion(this.x, this.y, '#f00', 5);
                return;
            }
        }
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        if (this.type === 'arrow') {
            ctx.fillStyle = '#fff';
            ctx.fillRect(-10, -1, 20, 2);
            ctx.fillStyle = '#aaa';
            ctx.beginPath();
            ctx.moveTo(10, -2);
            ctx.lineTo(14, 0);
            ctx.lineTo(10, 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(0, 0, 6, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }
}

class Entity {
    constructor(x, y, w, h, color, team) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.color = color;
        this.team = team;
        this.dead = false;
        this.hp = 100;
        this.maxHp = 100;
    }
    takeDamage(amt) {
        this.hp -= amt;
        if (this.hp <= 0) {
            this.dead = true;
            createExplosion(this.x + this.w/2, this.y + this.h/2, '#900', 10);
        }
    }
    drawBase() {
        if (this.dead) return;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        // Simple HP bar
        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'red';
            ctx.fillRect(this.x, this.y - 10, this.w, 4);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(this.x, this.y - 10, this.w * (this.hp/this.maxHp), 4);
        }
    }
}

class Archer extends Entity {
    constructor(x, y, team) {
        super(x, y, 20, 40, team === 'attackers' ? '#d32f2f' : '#1976d2', team);
        this.cooldown = 0;
        this.maxCooldown = rand(60, 120);
    }
    update() {
        if (this.cooldown > 0) this.cooldown--;
        if (this.cooldown <= 0 && this.canShoot()) {
            this.shoot();
            this.cooldown = this.maxCooldown;
        }
    }
    canShoot() {
        // Check if target is visible
        if (this.team === 'attackers') {
            // Attackers shoot at castle or defenders
            return castle && (this.x + 400 > castle.x || defenders.length > 0);
        } else {
            // Defenders shoot at attackers
            return attackers.length > 0;
        }
    }
    shoot() {
        let tx, ty;
        if (this.team === 'attackers') {
            tx = castle ? castle.x + castle.width/2 : WIDTH;
            ty = castle ? castle.y + rand(0, 100) : 0;
        } else {
            // Aim at nearest attacker
            let target = attackers.reduce((prev, curr) => 
                Math.abs(curr.x - this.x) < Math.abs(prev.x - this.x) ? curr : prev
            );
            if (target) {
                tx = target.x + target.w/2;
                ty = target.y;
            } else {
                tx = 0; ty = GROUND_Y;
            }
        }

        const dx = tx - this.x;
        const dy = ty - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const power = rand(8, 12);
        const angle = Math.atan2(dy, dx);
        
        // Adjust power based on distance for better accuracy simulation
        const finalPower = Math.min(dist / 15, 15); 

        const vx = Math.cos(angle) * finalPower;
        const vy = Math.sin(angle) * finalPower;

        projectiles.push(new Projectile(this.x + this.w/2, this.y, vx, vy, 'arrow', this.team));
    }
    draw() {
        this.drawBase();
        // Draw Bow
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (this.team === 'attackers') {
            ctx.arc(this.x + this.w, this.y + this.h/2, 10, -Math.PI/2, Math.PI/2);
        } else {
            ctx.arc(this.x, this.y + this.h/2, 10, Math.PI/2, -Math.PI/2);
        }
        ctx.stroke();
    }
}

class Catapult extends Entity {
    constructor(x, y, team) {
        super(x, y, 60, 40, team === 'attackers' ? '#b71c1c' : '#0d47a1', team);
        this.cooldown = 0;
        this.maxCooldown = 300;
    }
    update() {
        if (this.cooldown > 0) this.cooldown--;
        if (this.cooldown <= 0 && this.team === 'attackers') {
            this.shoot();
            this.cooldown = this.maxCooldown;
        }
    }
    shoot() {
        // Lob high arc over castle
        const targetX = castle.x + rand(0, castle.width);
        const targetY = castle.y;
        
        // Physics approximation for arc
        // vx needs to be positive (moving right)
        // vy needs to be negative (moving up)
        
        const dist = targetX - this.x;
        const power = dist / 20; // Rough calc
        const vx = rand(10, 14);
        const vy = -rand(14, 18);

        projectiles.push(new Projectile(this.x + 30, this.y, vx, vy, 'stone', this.team));
    }
    draw() {
        this.drawBase();
        // Draw Arm
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.x + 10, this.y + 10);
        ctx.lineTo(this.x + 50, this.y - 20);
        ctx.stroke();
    }
}

class SiegeTower extends Entity {
    constructor(x) {
        super(x, GROUND_Y - 80, 60, 80, '#5d4037', 'attackers');
        this.speed = 0.5;
    }
    update() {
        if (this.x < castle.x - 5) {
            this.x += this.speed;
        }
        // Check collision with castle base
        if (castle && checkRectCollide(this, {x: castle.x, y: castle.y, w: castle.width, h: castle.h})) {
            castle.takeDamage(0.1); // Constant pressure
        }
    }
    draw() {
        this.drawBase();
        // Ladder
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(this.x + 20, this.y + 20, 20, 60);
    }
}

class BatteringRam extends Entity {
    constructor(x) {
        super(x, GROUND_Y - 20, 80, 20, '#3e2723', 'attackers');
        this.speed = 1.5;
        this.push = 0;
    }
    update() {
        let blocked = false;
        // Move towards castle wall
        if (this.x + this.w < castle.x) {
            this.x += this.speed;
        } else {
            // Hit the wall
            blocked = true;
            this.push = (this.push + 1) % 40; // Animation cycle
            if (this.push === 0) {
                castle.takeDamage(2);
                shake = 5;
                // Create impact particles
                for(let i=0; i<5; i++) particles.push(new Particle(this.x + this.w, this.y + this.h/2, '#888', 2, 20));
            }
        }
    }
    draw() {
        this.drawBase();
        // Ram head
        ctx.fillStyle = '#999';
        const offset = Math.sin(this.push * 0.2) * 5;
        ctx.beginPath();
        ctx.arc(this.x + this.w + offset, this.y + 10, 10, 0, Math.PI*2);
        ctx.fill();
    }
}

class Castle {
    constructor() {
        this.x = WIDTH - 200;
        this.width = 150;
        this.height = 250;
        this.y = GROUND_Y - this.height;
        this.hp = 1000;
        this.maxHp = 1000;
        this.breached = false;
        this.segments = [];
        this.rebuild();
    }

    rebuild() {
        this.x = WIDTH - 200;
        this.y = GROUND_Y - this.height;
        this.segments = [];
        // Create wall segments (visual blocks)
        for(let i=0; i<10; i++) {
            for(let j=0; j<5; j++) {
                this.segments.push({
                    x: this.x + i*15,
                    y: this.y + j*50,
                    w: 15,
                    h: 50,
                    active: true
                });
            }
        }
        // Battlements
        for(let i=0; i<11; i++) {
             this.segments.push({
                x: this.x + i*15 - 2,
                y: this.y - 10,
                w: 10,
                h: 10,
                active: true
            });
        }
        this.hp = this.maxHp;
        this.breached = false;
    }

    takeDamage(amount) {
        if (this.breached) return;
        this.hp -= amount;
        if (this.hp <= 0) {
            this.breached = true;
            endRound(true);
        }
        // Visual damage: remove random segments near hit or bottom
        if (Math.random() < amount/5) {
            // Find a segment to break
            const idx = Math.floor(rand(0, this.segments.length));
            if (this.segments[idx].active) {
                this.segments[idx].active = false;
                // Debris particles
                for(let k=0; k<3; k++) {
                    particles.push(new Particle(this.segments[idx].x, this.segments[idx].y, '#795548', 3, 60));
                }
            }
        }
    }

    draw() {
        ctx.fillStyle = '#795548';
        for (let s of this.segments) {
            if (s.active) {
                ctx.fillRect(s.x, s.y, s.w, s.h);
                // Mortar lines
                ctx.strokeStyle = '#5d4037';
                ctx.strokeRect(s.x, s.y, s.w, s.h);
            }
        }
        
        // Draw Gate (if breached, show hole)
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(this.x + 50, GROUND_Y - 80, 50, 80);
        
        // HP Bar
        ctx.fillStyle = '#333';
        ctx.fillRect(this.x, this.y - 30, this.width, 10);
        ctx.fillStyle = this.hp > 300 ? '#4caf50' : '#f44336';
        ctx.fillRect(this.x, this.y - 30, this.width * (this.hp/this.maxHp), 10);
    }
}

// --- GAME LOGIC ---

function initGame() {
    castle = new Castle();
    resetRound();
    loop();
}

function resetRound() {
    entities = [];
    projectiles = [];
    particles = [];
    gameState = 'ATTACKING';
    statusEl.style.display = 'none';
    
    // Spawn Attackers
    attackers = [];
    defenders = [];

    // Units
    for(let i=0; i<3; i++) attackers.push(new Catapult(rand(50, 150), GROUND_Y - 40));
    for(let i=0; i<5; i++) attackers.push(new Archer(rand(100, 250), GROUND_Y - 40));
    attackers.push(new SiegeTower(50));
    attackers.push(new BatteringRam(50));

    // Defenders
    castle.rebuild();
    for(let i=0; i<4; i++) {
        defenders.push(new Archer(castle.x + 20 + (i*30), castle.y - 10, 'defenders'));
    }
}

function createExplosion(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push(new Particle(x, y, color, 5, rand(20, 40)));
    }
}

function endRound(attackersWin) {
    if (gameState === 'RESETTING') return;
    gameState = 'RESETTING';
    
    const msg = attackersWin ? "WALLS BREACHED!" : "ATTACK REPELLED!";
    const cssClass = attackersWin ? "win" : "lose";
    
    statusEl.innerHTML = `<span class="${cssClass}">${msg}</span><br><small>Preparing next assault...</small>`;
    statusEl.style.display = 'block';

    setTimeout(() => {
        resetRound();
    }, 3000);
}

function loop() {
    requestAnimationFrame(loop);
    frame++;

    // Screen Shake
    let tx = 0, ty = 0;
    if (shake > 0) {
        tx = rand(-shake, shake);
        ty = rand(-shake, shake);
        shake *= 0.9;
        if (shake < 0.5) shake = 0;
    }

    ctx.save();
    ctx.translate(tx, ty);

    // Clear
    ctx.fillStyle = '#87CEEB'; // Sky
    ctx.fillRect(-10, -10, WIDTH+20, HEIGHT+20);
    
    // Sun/Moon
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(WIDTH - 100, 100, 40, 0, Math.PI*2);
    ctx.fill();

    // Ground
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);
    ctx.fillStyle = '#388e3c'; // Grass detail
    ctx.fillRect(0, GROUND_Y, WIDTH, 10);

    // Draw Castle
    castle.draw();

    // Update & Draw Attackers
    for (let i = attackers.length - 1; i >= 0; i--) {
        let u = attackers[i];
        if (gameState === 'ATTACKING') u.update();
        u.draw();
        if (u.dead) {
            attackers.splice(i, 1);
        }
    }

    // Check Repel Condition
    if (gameState === 'ATTACKING' && attackers.length === 0) {
        endRound(false);
    }

    // Update & Draw Defenders
    for (let i = defenders.length - 1; i >= 0; i--) {
        let u = defenders[i];
        if (gameState === 'ATTACKING') u.update();
        u.draw();
        if (u.dead) {
            defenders.splice(i, 1);
        }
    }

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        if (gameState === 'ATTACKING') p.update();
        p.draw();
        if (!p.active) projectiles.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update();
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
    }

    ctx.restore();
}

// Start
initGame();

</script>
</body>
</html>
