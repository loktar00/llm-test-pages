<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Interference Tank</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    });

    // Grid
    const texSize = 512;
    const fieldSize = 512;
    let field = new Float32Array(fieldSize * fieldSize);
    let fieldPrev = new Float32Array(fieldSize * fieldSize);
    let fieldNext = new Float32Array(fieldSize * fieldSize);

    // Damping and wave parameters
    const damping = 0.995;
    const waveSpeed = 0.45;

    // Water height map texture
    const heightMap = ctx.createImageData(texSize, texSize);

    // Interactive elements
    const numSources = 3;
    let sources = [];
    for (let i = 0; i < numSources; i++) {
        sources.push({
            x: Math.random() * fieldSize,
            y: Math.random() * fieldSize,
            freq: 0.05 + Math.random() * 0.05,
            phase: Math.random() * Math.PI * 2,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            amplitude: 15 + Math.random() * 5
        });
    }

    // Barriers with slits
    const barriers = [];
    for (let i = 0; i < 2; i++) {
        barriers.push({
            x: fieldSize * 0.3 + i * fieldSize * 0.4,
            y: fieldSize * 0.5,
            width: 10,
            height: fieldSize * 0.6,
            slitY: fieldSize * 0.5,
            slitHeight: 30
        });
    }

    function isBlocked(x, y) {
        if (x < 0 || x >= fieldSize || y < 0 || y >= fieldSize) return true;
        for (let b of barriers) {
            if (x >= b.x && x < b.x + b.width &&
                y >= b.y && y < b.y + b.height) {
                if (y >= b.slitY - b.slitHeight/2 && y < b.slitY + b.slitHeight/2) {
                    continue;
                }
                return true;
            }
        }
        return false;
    }

    function stepField(time) {
        // Swap buffers
        let temp = field;
        field = fieldPrev;
        fieldPrev = fieldNext;
        fieldNext = temp;

        const invDX = 1; // Simplified neighbor weights
        for (let i = 0; i < fieldSize; i++) {
            for (let j = 0; j < fieldSize; j++) {
                const index = i * fieldSize + j;

                if (isBlocked(i, j)) {
                    fieldNext[index] = 0;
                    continue;
                }

                let sum = 0;
                let count = 0;
                for (let di = -1; di <= 1; di++) {
                    for (let dj = -1; dj <= 1; dj++) {
                        const ni = i + di;
                        const nj = j + dj;
                        if (ni >= 0 && ni < fieldSize && nj >= 0 && nj < fieldSize && !isBlocked(ni, nj)) {
                            sum += field[ni * fieldSize + nj];
                            count++;
                        }
                    }
                }

                const avg = sum / count;
                fieldNext[index] = 2 * field[index] - fieldPrev[index] + waveSpeed * (avg - field[index]) * damping;

                // Apply source oscillations
                for (let s of sources) {
                    const dx = i - s.x;
                    const dy = j - s.y;
                    const dist2 = dx*dx + dy*dy;
                    if (dist2 < 64) {
                        const dist = Math.sqrt(dist2);
                        const influence = 1 - dist / 8;
                        fieldNext[index] += Math.sin(time * s.freq + s.phase) * s.amplitude * influence;
                    }
                }
            }
        }
    }

    function render() {
        // Update heightmap from field
        for (let i = 0; i < texSize; i++) {
            for (let j = 0; j < texSize; j++) {
                const fi = Math.floor(i * fieldSize / texSize);
                const fj = Math.floor(j * fieldSize / texSize);
                const fi2 = Math.min(fi + 1, fieldSize - 1);
                const fj2 = Math.min(fj + 1, fieldSize - 1);
                const tx = (i / texSize) * fieldSize - fi;
                const ty = (j / texSize) * fieldSize - fj;
                
                const v1 = field[Math.min(fi * fieldSize + fj, fieldSize*fieldSize-1)] * (1 - tx) * (1 - ty);
                const v2 = field[Math.min(fi2 * fieldSize + fj, fieldSize*fieldSize-1)] * tx * (1 - ty);
                const v3 = field[Math.min(fi * fieldSize + fj2, fieldSize*fieldSize-1)] * (1 - tx) * ty;
                const v4 = field[Math.min(fi2 * fieldSize + fj2, fieldSize*fieldSize-1)] * tx * ty;
                const val = (v1 + v2 + v3 + v4);

                const pxIndex = (i * texSize + j) * 4;
                const normalized = (val + 128) / 256;
                const c = Math.max(0, Math.min(255, normalized * 256));
                heightMap.data[pxIndex] = 0;
                heightMap.data[pxIndex + 1] = Math.max(0, Math.min(255, c * 0.7));
                heightMap.data[pxIndex + 2] = c;
                heightMap.data[pxIndex + 3] = 255;
            }
        }
        ctx.putImageData(heightMap, 0, 0);
        
        // Draw specular highlights on peaks
        ctx.fillStyle = "#ffffff";
        for (let s of sources) {
            const normVal = (field[Math.floor(s.y) * fieldSize + Math.floor(s.x)] + 128) / 512;
            if (normVal > 0.8) {
                ctx.beginPath();
                ctx.arc(s.x / fieldSize * W, s.y / fieldSize * H, 5, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // Highlight crests
        for (let i = 0; i < fieldSize; i += 8) {
            for (let j = 0; j < fieldSize; j += 8) {
                const val = field[i * fieldSize + j];
                if (val > 40) {
                    ctx.fillStyle = `rgba(255,255,255,${(val - 40) / 40})`;
                    ctx.fillRect(i / fieldSize * W, j / fieldSize * H, 3, 3);
                }
            }
        }
    }

    let lastTime = 0;
    let frameCount = 0;
    function animate(time) {
        if (!lastTime) lastTime = time;
        const delta = time - lastTime;
        lastTime = time;

        stepField(time * 0.002);

        // Update sources
        for (let s of sources) {
            s.x += s.vx;
            s.y += s.vy;
            if (s.x <= 10 || s.x >= fieldSize - 10) s.vx *= -1;
            if (s.y <= 10 || s.y >= fieldSize - 10) s.vy *= -1;
            s.freq += 0.0002 * (Math.random() - 0.5);
            s.freq = Math.max(0.02, Math.min(0.1, s.freq));
        }

        render();
        ctx.fillStyle = "#000";
        ctx.fillRect(0, H - 60, W, 60);
        ctx.fillStyle = "#fff";
        ctx.font = "16px monospace";
        ctx.fillText(`Sources: ${sources.length} | FPS: ${(1000/delta).toFixed(0)}`, 10, H - 40);

        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
