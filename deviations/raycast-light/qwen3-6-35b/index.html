<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Raycast Lighting Demo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">RAYCAST DYNAMIC LIGHTING // 2D ENGINE</div>
    <canvas id="canvas"></canvas>
    <script>
        /**
         * 2D Dynamic Lighting Engine
         * Uses a hybrid approach:
         * 1. Raycasting for hard geometry shadows.
         * 2. Additive blending for glow and softness.
         * 3. Depth layers for atmospheric fog.
         */

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base canvas

        let width, height;
        
        // Configuration
        const config = {
            rayCount: 360, // Number of rays (360 = 1 per degree)
            rayLength: 1500, // Max ray length (larger than screen diagonal)
            ambientLight: 0.03, // Base darkness
            shadowStrength: 0.98, // How opaque the shadow layer is
            wallGlowIntensity: 0.4,
            lightSpeed: 0.0005,
            colors: {
                bg: '#050505',
                wall: '#1a1a1a',
                wallGlow: [200, 200, 200],
                light1: { h: 35, s: 100, l: 50 }, // Warm amber
                light2: { h: 210, s: 80, l: 40 }  // Cool blue
            }
        };

        // State
        let time = 0;
        let walls = [];
        let lights = [];
        
        // Resize Handler
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initWalls();
            initLights();
        }

        class Point {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
        }

        class Wall {
            constructor(x1, y1, x2, y2) {
                this.p1 = new Point(x1, y1);
                this.p2 = new Point(x2, y2);
            }

            draw(ctx, isShadowCanvas = false) {
                ctx.beginPath();
                ctx.moveTo(this.p1.x, this.p1.y);
                ctx.lineTo(this.p2.x, this.p2.y);
                if (isShadowCanvas) {
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#FFFFFF'; // White for raycasting hit detection
                    ctx.stroke();
                } else {
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; // Very faint edge
                    ctx.stroke();
                }
            }
        }

        class LightSource {
            constructor(x, y, colorDef, speedMult, size) {
                this.origin = new Point(x, y);
                this.color = colorDef;
                this.speed = speedMult;
                this.angle = Math.random() * Math.PI * 2;
                this.radius = size;
                this.hueOffset = Math.random() * 360;
            }

            update(dt) {
                this.angle += this.speed * dt;
                // Complex movement patterns
                this.origin.x = width/2 + Math.cos(this.angle * this.speed) * (width * 0.3);
                this.origin.y = height/2 + Math.sin(this.angle * this.speed * 0.7 + 1) * (height * 0.3);
                
                // Slowly shift hue
                this.color.h = (this.color.h + 0.05) % 360;
            }

            drawGlow(ctx) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.beginPath();
                ctx.arc(this.origin.x, this.origin.y, this.radius * 2, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(this.origin.x, this.origin.y, 0, this.origin.x, this.origin.y, this.radius * 2);
                
                const h = this.color.h;
                const s = this.color.s;
                const l = this.color.l;

                grad.addColorStop(0, `hsla(${h}, ${s}%, ${l}%, 1)`);
                grad.addColorStop(0.1, `hsla(${h}, ${s}%, ${l}%, 0.5)`);
                grad.addColorStop(0.5, `hsla(${h}, ${s}%, ${l}%, 0.1)`);
                grad.addColorStop(1, `hsla(${h}, ${s}%, ${l}%, 0)`);
                
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }

            castRays(ctx) {
                const step = (Math.PI * 2) / config.rayCount;
                
                for (let i = 0; i < config.rayCount; i++) {
                    const angle = i * step;
                    const dir = { x: Math.cos(angle), y: Math.sin(angle) };
                    
                    // Raycasting logic: Find closest wall intersection
                    let closestDist = config.rayLength;
                    let closestPoint = null;
                    let hitWall = null;

                    for (const wall of walls) {
                        const intersection = getIntersection(this.origin, dir, wall.p1, wall.p2);
                        if (intersection) {
                            const dist = Math.hypot(intersection.x - this.origin.x, intersection.y - this.origin.y);
                            if (dist < closestDist) {
                                closestDist = dist;
                                closestPoint = intersection;
                                hitWall = wall;
                            }
                        }
                    }

                    if (closestPoint) {
                        // Draw the light beam
                        ctx.beginPath();
                        ctx.moveTo(this.origin.x, this.origin.y);
                        ctx.lineTo(closestPoint.x, closestPoint.y);
                        ctx.strokeStyle = `hsla(${this.color.h}, ${this.color.s}%, ${this.color.l}%, 0.8)`;
                        ctx.lineWidth = Math.random() * 2; // Flicker
                        ctx.stroke();

                        // Glow at hit point
                        ctx.fillStyle = `hsla(${this.color.h}, ${this.color.s}%, 80%, ${config.wallGlowIntensity})`;
                        ctx.fillRect(closestPoint.x - 2, closestPoint.y - 2, 4, 4);
                    }
                }
            }
        }

        // --- Geometry Math ---

        function getIntersection(p1, dir, p2, p3) {
            // Ray defined by P1 and Direction Vector
            // Segment defined by P2 and P3
            
            const x1 = p1.x; const y1 = p1.y;
            const x2 = x1 + dir.x; const y2 = y1 + dir.y; // Point further along ray
            const x3 = p2.x; const y3 = p2.y;
            const x4 = p3.x; const y4 = p3.y;

            const denum = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);

            if (denum === 0) return null; // Parallel

            const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denum;
            const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denum;

            if (t >= 0 && t <= 1 && u >= 0) {
                // Intersection point
                return new Point(x1 + t * (x2 - x1), y1 + t * (y2 - y1));
            }
            return null;
        }

        // --- Initialization ---

        function initWalls() {
            walls = [];
            // Create random polygons
            const numPolygons = 8;
            const numSides = 3; // Triangles
            
            for (let i = 0; i < numPolygons; i++) {
                const cx = Math.random() * width;
                const cy = Math.random() * height;
                const size = 50 + Math.random() * 100;
                const rotation = Math.random() * Math.PI;
                
                // Generate a jagged polygon
                const points = [];
                for (let j = 0; j < numSides; j++) {
                    const angle = (j / numSides) * Math.PI * 2 + rotation;
                    const r = size * (0.8 + Math.random() * 0.4); // Randomize radius
                    points.push(new Point(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r));
                }

                // Connect points to make walls
                for (let j = 0; j < points.length; j++) {
                    const p1 = points[j];
                    const p2 = points[(j + 1) % points.length];
                    walls.push(new Wall(p1.x, p1.y, p2.x, p2.y));
                }
            }
        }

        function initLights() {
            lights = [];
            // Primary Light
            lights.push(new LightSource(width/2, height/2, { ...config.colors.light1 }, 1.0, 100));
            // Secondary Light
            lights.push(new LightSource(width/2, height/2, { ...config.colors.light2 }, -0.7, 60));
        }

        // --- Main Loop ---

        function draw() {
            requestAnimationFrame(draw);
            time = Date.now();

            // 1. Clear Background
            ctx.fillStyle = config.colors.bg;
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Environment (Walls)
            // We draw walls faintly so we can see the edges later, but they are mostly dark
            ctx.lineWidth = 2;
            ctx.strokeStyle = config.colors.wall;
            ctx.beginPath();
            for (const wall of walls) {
                ctx.moveTo(wall.p1.x, wall.p1.y);
                ctx.lineTo(wall.p2.x, wall.p2.y);
            }
            ctx.stroke();

            // 3. Create Shadow Layer
            // We use a separate canvas element logic via offscreen buffer drawing or just clearing a region
            // To keep it simple in one file without offscreen canvas overhead, we clear the center 
            // and use a composite operation.
            
            ctx.save();
            
            // Global Composite: Source-over. We will clear the center and draw black polygons.
            // However, to make the light source visible through the "room" but blocked by walls,
            // we need a specific trick:
            // 1. Clear screen.
            // 2. Draw walls (dark).
            // 3. "Cut out" the light area.
            
            // Let's use the "Clear" composite operation to punch holes.
            // But we need the light color.
            
            // Approach:
            // 1. Draw walls.
            // 2. Create a "Light Mask" on a temporary canvas (or by drawing to main).
            // 3. Composite light color onto mask.
            // 4. Composite mask onto screen.
            
            // Simplified Approach for performance in single file:
            // Draw walls.
            // Set composite to 'destination-out'.
            // Draw shapes (polygons formed by light rays) in white to erase the darkness.
            // Wait, that erases walls too.
            
            // Correct Approach:
            // 1. Draw walls (dark gray).
            // 2. Draw a black rectangle over everything (Shadow Layer).
            // 3. Use 'destination-out' to punch holes in the shadow layer using raycasts.
            // 4. Use 'screen' or 'lighter' to draw the colored light into the holes.

            // Let's try the standard "Lighting Canvas" technique.
            
            // Reset context for geometry
            ctx.restore();

            // --- RENDER SHADOWS ---
            ctx.save();
            
            // We draw the whole screen black first to simulate the dark room
            ctx.fillStyle = `rgba(0, 0, 0, ${config.ambientLight})`;
            ctx.fillRect(0, 0, width, height);

            // Now we "cut" the light out.
            // Since we want colored light, we can't just 'destination-out' because that makes it transparent.
            // Instead, let's draw the light beams as polygons and add them to the scene.
            
            // To make shadows hard, we draw black triangles from light source to walls.
            // But since the background is already dark, we can't draw black.
            
            // REVISED STRATEGY FOR SINGLE CANVAS:
            // 1. Draw Walls (Dark).
            // 2. Create a temporary offscreen canvas (simulated by drawing logic).
            // Actually, let's just draw the shadows as semi-transparent polygons over the room.
            // Then draw the light beams on top.
            
            // Draw Walls
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 3;
            ctx.beginPath();
            walls.forEach(w => {
                ctx.moveTo(w.p1.x, w.p1.y);
                ctx.lineTo(w.p2.x, w.p2.y);
            });
            ctx.stroke();
            
            // Draw Ambient Darkness (Light Shadow Layer)
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = `rgba(5, 5, 5, 0.85)`; 
            ctx.fillRect(0, 0, width, height);

            // Now punch holes with Light Rays
            ctx.globalCompositeOperation = 'destination-out';
            
            for (const light of lights) {
                light.draw(ctx); // This function needs to draw into destination-out
            }
            
            ctx.restore();

            // --- RENDER LIGHT BEAMS & GLOW ---
            ctx.save();
            ctx.globalCompositeOperation = 'screen'; // Blend mode for additive lighting
            
            for (const light of lights) {
                light.update(16); // Assume ~60fps
                light.drawGlow(ctx);
                
                // Draw actual light rays to define shadows visually
                // We need to redraw the rays but this time with color
                // We access the logic inside draw() but we need the points.
                // Let's refactor light.draw to return points or just re-calc (cheap enough).
                
                const step = (Math.PI * 2) / config.rayCount;
                ctx.beginPath();
                
                for (let i = 0; i < config.rayCount; i++) {
                    const angle = i * step;
                    const dir = { x: Math.cos(angle), y: Math.sin(angle) };
                    
                    let closestDist = config.rayLength;
                    let closestPoint = null;

                    for (const wall of walls) {
                        const intersection = getIntersection(light.origin, dir, wall.p1, wall.p2);
                        if (intersection) {
                            const dist = Math.hypot(intersection.x - light.origin.x, intersection.y - light.origin.y);
                            if (dist < closestDist) {
                                closestDist = dist;
                                closestPoint = intersection;
                            }
                        }
                    }

                    if (closestPoint) {
                        // Draw ray
                        ctx.moveTo(light.origin.x, light.origin.y);
                        ctx.lineTo(closestPoint.x, closestPoint.y);
                        
                        // Glow tip
                        ctx.fillStyle = `rgba(255, 255, 255, 0.1)`;
                        ctx.fillRect(closestPoint.x-1, closestPoint.y-1, 2, 2);
                    }
                }
                ctx.strokeStyle = `hsla(${light.color.h}, ${light.color.s}%, ${light.color.l}%, 0.05)`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            ctx.restore();
            
            // --- FINAL GLOW OVERLAYS (Softness) ---
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            for (const light of lights) {
                // Soft bloom
                const h = light.color.h;
                const grad = ctx.createRadialGradient(light.origin.x, light.origin.y, 0, light.origin.x, light.origin.y, 300);
                grad.addColorStop(0, `hsla(${h}, 100%, 80%, 0.15)`);
                grad.addColorStop(0.4, `hsla(${h}, 100%, 50%, 0.05)`);
                grad.addColorStop(1, `hsla(${h}, 100%, 50%, 0)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
            }
            ctx.restore();

            // --- EDGE GLOW POST-PROCESSING ---
            // Simulate edge glow by sampling pixels near light hits (expensive to do per frame manually)
            // Instead, we draw the walls again, but this time with a glow color where light hits.
            // Since we don't store "hit" state easily, we approximate:
            // Draw walls with a very bright stroke but only on the side facing the light? 
            // Too complex for single pass.
            
            // Simple visual trick: Draw walls again with a very faint white stroke.
            // The 'screen' blend mode will make them bright where the light is (because light is additive),
            // and dark where it isn't (because base is black).
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            walls.forEach(w => {
                ctx.moveTo(w.p1.x, w.p1.y);
                ctx.lineTo(w.p2.x, w.p2.y);
            });
            ctx.stroke();
            ctx.restore();
        }

        // Start
        window.addEventListener('resize', resize);
        resize();
        draw();

    </script>
</body>
</html>
