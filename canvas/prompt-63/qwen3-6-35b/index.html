<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkiFree Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; margin: 0 auto; background: #fff; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
/**
 * SkiFree-like Simulation
 * No external assets, pure canvas drawing.
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Configuration ---
const WORLD_WIDTH = 600; // Logical width of the slope
const SKIER_SPEED = 5;
const SKIER_STRAFE = 2;
const OBJECT_SPACING = 40;
const VIEWPORT_HEIGHT = 800;

let width, height, offsetX, offsetY;
let frame = 0;

// --- State ---
let skier = {
    x: WORLD_WIDTH / 2,
    y: 200,
    angle: 0,
    state: 'SKIING', // SKIING, CRASHED, JUMPING
    crashTimer: 0,
    jumpTimer: 0,
    trail: []
};

let objects = [];
let particles = []; // Snow spray
let cameraY = 0;

// --- Assets (Colors & Shapes) ---
const COLORS = {
    snow: '#FFFFFF',
    snowShadow: '#E8E8E8',
    tree: '#2E8B57',
    treeTrunk: '#8B4513',
    rock: '#808080',
    rockHighlight: '#A9A9A9',
    flagPole: '#000000',
    flagRed: '#FF0000',
    flagBlue: '#0000FF',
    skierBody: '#FF0000',
    skierPole: '#000088',
    yeti: '#FFFFFF',
    ufo: '#00FF00',
    alien: '#00FF00'
};

// --- Resize Handling ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    // Center the world
    offsetX = (width - WORLD_WIDTH) / 2;
    offsetY = (height - VIEWPORT_HEIGHT) / 2 + 150; 
}
window.addEventListener('resize', resize);
resize();

// --- Object Management ---
function spawnObject(y) {
    const r = Math.random();
    const type = r < 0.05 ? 'yeti' :
                 r < 0.10 ? 'ufo' :
                 r < 0.15 ? 'ramp' :
                 r < 0.25 ? 'animal' :
                 r < 0.35 ? 'skier' :
                 r < 0.50 ? 'rock' :
                 r < 0.55 ? 'flag' :
                 'tree';

    const x = 50 + Math.random() * (WORLD_WIDTH - 100);
    let obj = { x, y, type, w: 30, h: 40, active: true };

    if (type === 'ramp') { obj.w = 60; obj.h = 10; }
    if (type === 'flag') { obj.w = 10; obj.h = 40; }
    if (type === 'yetis') { obj.active = false; } // Yeti starts off screen
    if (type === 'ufo') { obj.active = false; }
    
    objects.push(obj);
}

function resetRun() {
    objects = [];
    particles = [];
    skier.x = WORLD_WIDTH / 2;
    skier.y = 0;
    skier.trail = [];
    // Initial field
    for (let y = 100; y < VIEWPORT_HEIGHT * 4; y += 30) {
        if (Math.random() > 0.3) spawnObject(y);
    }
    cameraY = 0;
}

// --- Logic ---

function update() {
    frame++;

    // --- Skier Movement ---
    if (skier.state === 'SKIING') {
        skier.y += SKIER_SPEED;
        
        // AI Steering
        let lookAheadX = skier.x;
        let lookAheadY = skier.y - 100;
        let closestThreat = null;
        let minDist = 150;

        objects.forEach(obj => {
            if (!obj.active && obj.type !== 'yeti' && obj.type !== 'ufo') return;
            let dy = obj.y - skier.y;
            if (dy < -100 || dy > 50) return; // Only look ahead

            let dx = Math.abs(obj.x - skier.x);
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < minDist) {
                minDist = dist;
                closestThreat = obj;
            }
        });

        let turn = 0;
        if (closestThreat) {
            turn = (skier.x - closestThreat.x) * 0.05;
        } else {
            // Drift slightly towards center to stay on slope
            turn = (WORLD_WIDTH/2 - skier.x) * 0.0005;
        }

        // Smooth turn
        skier.x += turn;
        // Clamp bounds
        skier.x = Math.max(40, Math.min(WORLD_WIDTH - 40, skier.x));
        
        // Skis angle based on movement
        skier.angle = Math.max(-0.5, Math.min(0.5, turn * 2));

        // Collision with static objects
        objects.forEach(obj => {
            if (!obj.active) return;
            let dx = Math.abs(obj.x - skier.x);
            let dy = Math.abs(obj.y - skier.y);
            
            // Simple AABB/Distance check
            if (dx < 20 && dy < 20) {
                if (obj.type === 'ramp' && skier.jumpTimer === 0) {
                    skier.jumpTimer = 30; // Jump frames
                    obj.active = false; // Reset ramp
                } else if (['tree', 'rock', 'animal', 'skier', 'flag'].includes(obj.type)) {
                    crash();
                }
            }
        });

        // Trail
        if (frame % 3 === 0) {
            skier.trail.push({x: skier.x - 5, y: skier.y});
            skier.trail.push({x: skier.x + 5, y: skier.y});
            if (skier.trail.length > 100) skier.trail.shift();
        }

        // Jump logic
        if (skier.jumpTimer > 0) {
            skier.jumpTimer--;
            if (skier.jumpTimer === 0) skier.state = 'SKIING';
            else skier.state = 'JUMPING';
        }

    } else if (skier.state === 'JUMPING') {
        skier.y += SKIER_SPEED;
        // Simple gravity simulation via visual offset in draw
    } else if (skier.state === 'CRASHED') {
        skier.crashTimer--;
        if (skier.crashTimer <= 0) resetRun();
    }

    // --- Camera Follow ---
    // Target is skier Y + offset
    let targetCamY = skier.y - 200;
    if (skier.crashTimer > 0) targetCamY = skier.y + 100; // Look at crash
    
    // Smooth camera
    cameraY += (targetCamY - cameraY) * 0.1;

    // --- Object Management ---
    // Cleanup
    objects = objects.filter(o => o.y < cameraY + VIEWPORT_HEIGHT + 100);

    // Spawn
    let maxSpawnY = cameraY + VIEWPORT_HEIGHT + 200;
    // Find highest object
    let highestObj = objects.reduce((min, o) => o.y < min ? o.y : min, cameraY + VIEWPORT_HEIGHT);
    
    if (highestObj > 0 && highestObj < maxSpawnY - OBJECT_SPACING) {
        // Fill gap
        let gap = highestObj - cameraY;
        if (gap > OBJECT_SPACING) {
            spawnObject(highestObj - 10);
        } else {
            spawnObject(highestObj);
        }
    }

    // --- Special Entities ---

    // Yeti
    let yeti = objects.find(o => o.type === 'yeti' || o.type === 'yetiActive');
    if (!yeti) {
        // Spawn yeti occasionally near bottom
        if (Math.random() < 0.002) {
            let y = skier.y + VIEWPORT_HEIGHT + 100;
            yeti = { x: skier.x, y: y, type: 'yeti', active: true, speed: 3.5 };
            objects.push(yeti);
        }
    }
    
    if (yeti) {
        yeti.y += yeti.speed; // Run downhill
        yeti.x += Math.sin(frame * 0.1) * 2; // Wiggle
        
        // If yeti passes skier, he slows down and waits
        if (yeti.y > skier.y + 50) {
            yeti.y = skier.y + 50; // Slow down to wait
            yeti.speed = 0;
        }

        // UFO Logic
        let ufo = objects.find(o => o.type === 'ufo');
        if (!ufo && Math.random() < 0.0005) {
            ufo = { x: -50, y: yeti.y - 50, type: 'ufo', active: true, speed: 8 };
            objects.push(ufo);
        }

        if (ufo) {
            ufo.x += ufo.speed;
            ufo.y += SKIER_SPEED; // Move with world
            // If UFO hits Yeti
            if (Math.abs(ufo.x - yeti.x) < 50) {
                // Suck up yeti
                yeti.y = ufo.y; 
                yeti.x = ufo.x;
                if (ufo.x > width + 100) {
                    ufo.active = false; // UFO leaves
                    yeti = null; // Yeti gone for a while
                }
            }
            if (ufo.x > width + 200) ufo.active = false;
        }
    }

    // Aliens (Rare)
    if (Math.random() < 0.0001) {
        objects.push({
            x: Math.random() > 0.5 ? -20 : WORLD_WIDTH + 20,
            y: skier.y,
            type: 'alien',
            active: true,
            vy: 2
        });
    }

    // Other Skiers
    objects.forEach(o => {
        if (o.type === 'skier') {
            o.x += (Math.sin(o.y * 0.1) * 2); // Zig zag
        }
    });

    // --- Particles ---
    if (skier.state === 'SKIING' && frame % 2 === 0) {
        particles.push({
            x: skier.x + (Math.random() * 10 - 5),
            y: skier.y + 20,
            vx: (Math.random() - 0.5),
            vy: Math.random() * 2,
            life: 20
        });
    }
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);
}

function crash() {
    skier.state = 'CRASHED';
    skier.crashTimer = 60; // 1 second at 60fps
    // Explosion particles
    for(let i=0; i<20; i++) {
        particles.push({
            x: skier.x,
            y: skier.y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 40,
            color: '#AAA'
        });
    }
}

// --- Drawing ---

function drawTree(ctx, x, y) {
    ctx.fillStyle = COLORS.treeTrunk;
    ctx.fillRect(x - 2, y, 4, 10);
    ctx.fillStyle = COLORS.tree;
    // Triangle shape
    ctx.beginPath();
    ctx.moveTo(x, y - 30);
    ctx.lineTo(x + 15, y + 10);
    ctx.lineTo(x - 15, y + 10);
    ctx.fill();
    // Snow cap
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.moveTo(x, y - 30);
    ctx.lineTo(x + 5, y - 15);
    ctx.lineTo(x - 5, y - 15);
    ctx.fill();
}

function drawRock(ctx, x, y) {
    ctx.fillStyle = COLORS.rock;
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI, true);
    ctx.fill();
    ctx.fillStyle = COLORS.rockHighlight;
    ctx.beginPath();
    ctx.arc(x - 4, y - 2, 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawFlag(ctx, x, y) {
    ctx.fillStyle = COLORS.flagPole;
    ctx.fillRect(x - 1, y - 20, 2, 40);
    // Alternating colors
    ctx.fillStyle = (Math.floor(y) % 100 < 50) ? COLORS.flagRed : COLORS.flagBlue;
    ctx.fillRect(x + 1, y - 20, 10, 5);
    ctx.fillRect(x + 1, y - 10, 10, 5);
}

function drawRamp(ctx, x, y) {
    ctx.fillStyle = '#000088';
    ctx.beginPath();
    ctx.moveTo(x - 30, y);
    ctx.lineTo(x + 30, y);
    ctx.lineTo(x + 20, y - 10);
    ctx.lineTo(x - 20, y - 10);
    ctx.fill();
}

function drawObject(ctx, obj) {
    // Only draw if on screen
    let screenY = obj.y - cameraY + offsetY;
    if (screenY < -100 || screenY > height + 100) return;

    switch (obj.type) {
        case 'tree': drawTree(ctx, obj.x + offsetX, screenY); break;
        case 'rock': drawRock(ctx, obj.x + offsetX, screenY); break;
        case 'flag': drawFlag(ctx, obj.x + offsetX, screenY); break;
        case 'ramp': drawRamp(ctx, obj.x + offsetX, screenY); break;
        case 'animal': // Rabbit
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.arc(obj.x + offsetX, screenY, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#F00'; ctx.fillRect(obj.x + offsetX + 2, screenY - 8, 2, 2);
            break;
        case 'alien': // Alien
            ctx.fillStyle = COLORS.alien;
            ctx.beginPath();
            ctx.arc(obj.x + offsetX, screenY, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(obj.x + offsetX - 3, screenY - 2, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(obj.x + offsetX + 3, screenY - 2, 2, 0, Math.PI * 2); ctx.fill();
            // Wave
            if (Math.sin(frame * 0.2) > 0) {
                ctx.fillRect(obj.x + offsetX + 8, screenY - 15, 4, 10);
            }
            break;
        case 'yeti':
        case 'yetiActive':
            // Simple Yeti Sprite
            ctx.fillStyle = COLORS.yeti;
            // Body
            ctx.beginPath(); ctx.arc(obj.x + offsetX, screenY, 20, 0, Math.PI*2); ctx.fill();
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(obj.x + offsetX - 7, screenY - 5, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(obj.x + offsetX + 7, screenY - 5, 3, 0, Math.PI*2); ctx.fill();
            // Arms (Thumping)
            let armY = Math.sin(frame * 0.2) * 10;
            ctx.fillStyle = COLORS.yeti;
            ctx.fillRect(obj.x + offsetX - 25, screenY - 10 + armY, 10, 20);
            ctx.fillRect(obj.x + offsetX + 15, screenY - 10 - armY, 10, 20);
            break;
        case 'ufo':
            // UFO
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.ellipse(obj.x + offsetX, screenY + 10, 40, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0F0';
            ctx.beginPath();
            ctx.ellipse(obj.x + offsetX, screenY, 20, 15, 0, Math.PI, 0);
            ctx.fill();
            // Beam
            ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.beginPath();
            ctx.moveTo(obj.x + offsetX - 10, screenY + 10);
            ctx.lineTo(obj.x + offsetX + 10, screenY + 10);
            ctx.lineTo(obj.x + offsetX + 30, screenY + 150);
            ctx.lineTo(obj.x + offsetX - 30, screenY + 150);
            ctx.fill();
            break;
        case 'skier':
            // Other Skier (Simpler)
            drawSkierBody(ctx, obj.x + offsetX, screenY, '#0000FF', 0.3);
            break;
    }
}

function drawSkierBody(ctx, x, y, color, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    
    // Skis
    ctx.fillStyle = '#000';
    ctx.fillRect(-4, 15, 3, 25);
    ctx.fillRect(2, 15, 3, 25);

    // Body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fill();

    // Poles (animated)
    ctx.strokeStyle = COLORS.skierPole;
    ctx.lineWidth = 1;
    let poleAngle = Math.sin(frame * 0.2);
    
    ctx.beginPath();
    ctx.moveTo(-5, 0);
    ctx.lineTo(-15, 20);
    ctx.moveTo(5, 0);
    ctx.lineTo(15, 20);
    ctx.stroke();

    ctx.restore();
}

function draw() {
    // Background
    ctx.fillStyle = COLORS.snow;
    ctx.fillRect(0, 0, width, height);

    // Draw World bounds (sides)
    ctx.fillStyle = COLORS.snowShadow;
    ctx.fillRect(0, 0, offsetX, height);
    ctx.fillRect(offsetX + WORLD_WIDTH, 0, width - (offsetX + WORLD_WIDTH), height);

    // Draw Trail
    ctx.fillStyle = '#DDD';
    skier.trail.forEach(p => {
        let sy = p.y - cameraY + offsetY;
        if (sy > 0 && sy < height) {
            ctx.fillRect(p.x + offsetX, sy, 2, 2);
            ctx.fillRect(p.x + offsetX + 4, sy, 2, 2);
        }
    });

    // Draw Objects
    // Sort by Y so lower objects draw over higher ones
    objects.sort((a, b) => a.y - b.y);
    objects.forEach(drawObject);

    // Draw Particles
    particles.forEach(p => {
        let sy = p.y - cameraY + offsetY;
        ctx.fillStyle = p.color || '#FFF';
        ctx.globalAlpha = p.life / 40;
        ctx.fillRect(p.x + offsetX, sy, 3, 3);
        ctx.globalAlpha = 1.0;
    });

    // Draw Skier
    if (skier.crashTimer <= 0) {
        let sy = skier.y - cameraY + offsetY;
        
        // Shadow if jumping
        if (skier.state === 'JUMPING') {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(skier.x + offsetX, sy + 25, 15, 5, 0,
