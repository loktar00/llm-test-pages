<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Self-Builder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #444;
            font-family: monospace;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #666;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="dungeon"></canvas>
    <div id="ui">
        <div id="status">Generating...</div>
    </div>

    <script>
        const canvas = document.getElementById('dungeon');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        // Configuration
        const TILE_SIZE = 12;
        const COLS = 60;
        const ROWS = 40;
        const CARVE_SPEED = 2; // Tiles per frame
        const EXPLORER_SPEED = 0.15; // Tiles per frame (fractional movement)
        
        canvas.width = COLS * TILE_SIZE;
        canvas.height = ROWS * TILE_SIZE;

        // State
        let grid = [];
        let torches = [];
        let explorer = { x: 0, y: 0, targetX: 0, targetY: 0, path: [], moveProgress: 0 };
        let phase = 'GENERATING'; // GENERATING, WANDERING, TRANSITIONING, IDLING
        let generationQueue = [];
        let frameCount = 0;
        let totalTiles = 0;
        let visibleTiles = 0;

        // Grid Types
        const EMPTY = 0;
        const WALL = 1;
        const FLOOR = 2;

        class Tile {
            constructor(c, r) {
                this.c = c;
                this.r = r;
                this.type = WALL;
                this.carved = false;
                this.hasTorch = false;
                this.torchIntensity = 0;
                this.visited = false;
            }
        }

        // Initialization
        function init() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    row.push(new Tile(c, r));
                }
                grid.push(row);
            }
            
            // Fill border with walls initially
            for (let r = 0; r < ROWS; r++) {
                grid[r][0].type = WALL;
                grid[r][COLS-1].type = WALL;
            }
            for (let c = 0; c < COLS; c++) {
                grid[0][c].type = WALL;
                grid[ROWS-1][c].type = WALL;
            }

            phase = 'GENERATING';
            statusEl.innerText = "Generating Dungeon...";
            statusEl.style.color = "#888";
            
            // Start generation from center
            const startC = Math.floor(COLS / 2);
            const startR = Math.floor(ROWS / 2);
            
            carveTile(startC, startR);
            addTorch(startC, startR);
            
            // Start DFS
            const stack = [{c: startC, r: startR}];
            const dirs = [[0,1], [0,-1], [1,0], [-1,0]]; // Down, Up, Right, Left

            // We process a batch of stack items per frame to control speed
            generationQueue = stack;

            // Start explorer at start pos
            explorer = {
                x: startC,
                y: startR,
                targetX: startC,
                targetY: startR,
                moveProgress: 1.0,
                path: []
            };
        }

        function carveTile(c, r) {
            if (c < 1 || c >= COLS - 1 || r < 1 || r >= ROWS - 1) return;
            if (grid[r][c].type === WALL) {
                grid[r][c].type = FLOOR;
                grid[r][c].carved = true;
                visibleTiles++;
            }
        }

        function addTorch(c, r) {
            // Only add torch if it's a floor and has at least 2 adjacent floors (corner/corridor)
            // or if it's an open area (4 adjacent floors).
            // For this visual, let's just add torches to dead-ends or intersections to reduce clutter.
            let neighbors = 0;
            const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
            dirs.forEach(d => {
                const nr = r + d[1];
                const nc = c + d[0];
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].type === FLOOR) {
                    neighbors++;
                }
            });

            // Add torch to dead ends or intersections
            if (neighbors === 1 || neighbors >= 3) {
                grid[r][c].hasTorch = true;
                torches.push({ x: c, y: r, flickerOffset: Math.random() * 100 });
            }
        }

        function generateStep() {
            if (phase !== 'GENERATING') return;

            if (generationQueue.length === 0) {
                // Check if generation is actually done
                let allCarved = true;
                for(let r=1; r<ROWS-1; r++) {
                    for(let c=1; c<COLS-1; c++) {
                        if (grid[r][c].type === FLOOR) {
                            // Check if we have unvisited neighbors
                            const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                            let hasUnvisited = false;
                            dirs.forEach(d => {
                                const nr = r + d[1];
                                const nc = c + d[0];
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].type === WALL) {
                                    hasUnvisited = true;
                                }
                            });
                            if (!hasUnvisited) {
                                // This floor is surrounded by walls or bounds, but we need to carve walls
                                // Actually, the DFS only adds valid neighbors to queue.
                                // If queue is empty, DFS is done.
                            }
                        }
                    }
                }
                
                // Simple check: if queue is empty, generation is done
                phase = 'WANDERING';
                statusEl.innerText = "Exploring...";
                statusEl.style.color = "#d84";
                assignNextTarget();
                return;
            }

            // Process multiple items per frame for speed
            for (let i = 0; i < CARVE_SPEED; i++) {
                if (generationQueue.length === 0) break;
                
                const current = generationQueue.pop();
                const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                
                // Shuffle directions for organic look
                dirs.sort(() => Math.random() - 0.5);

                for (let d of dirs) {
                    const nc = current.c + d[0];
                    const nr = current.r + d[1];

                    if (nc >= 1 && nc < COLS - 1 && nr >= 1 && nr < ROWS - 1) {
                        if (grid[nr][nc].type === WALL) {
                            carveTile(nc, nr);
                            addTorch(nc, nr);
                            generationQueue.push({c: nc, r: nr});
                            break; // Only carve one branch per step (DFS)
                        }
                    }
                }
            }

            // Check completion
            if (generationQueue.length === 0) {
                // Ensure we didn't miss any isolated rooms (though DFS usually handles connected graphs)
                // Just switch state
                phase = 'WANDERING';
                statusEl.innerText = "Exploring...";
                statusEl.style.color = "#d84";
                assignNextTarget();
            }
        }

        function assignNextTarget() {
            // Find a random floor tile that hasn't been visited by the explorer
            // Prefer unvisited corridors (dead ends)
            
            let candidates = [];
            
            // Scan grid
            for (let r = 1; r < ROWS - 1; r++) {
                for (let c = 1; c < COLS - 1; c++) {
                    if (grid[r][c].type === FLOOR) {
                        let neighbors = 0;
                        const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                        dirs.forEach(d => {
                            const nr = r + d[1];
                            const nc = c + d[0];
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].type === FLOOR) {
                                neighbors++;
                            }
                        });

                        if (!grid[r][c].visited) {
                            candidates.push({c, r, score: neighbors});
                        }
                    }
                }
            }

            if (candidates.length === 0) {
                phase = 'TRANSITIONING';
                statusEl.innerText = "Map Complete. Fading...";
                statusEl.style.color = "#fff";
                return;
            }

            // Sort by score (lower score = more likely to be a dead end/corridor)
            candidates.sort((a, b) => a.score - b.score);

            // Pick from top 10% of candidates to prefer dead ends but add randomness
            const selectionPool = candidates.slice(0, Math.max(1, Math.floor(candidates.length * 0.1)));
            const target = selectionPool[Math.floor(Math.random() * selectionPool.length)];

            // Simple pathfinding (BFS) to find path to target
            const path = findPath(explorer.x, explorer.y, target.c, target.r);
            
            if (path.length > 0) {
                explorer.path = path;
                explorer.targetX = path[path.length - 1].c;
                explorer.targetY = path[path.length - 1].r;
                explorer.moveProgress = 0;
            } else {
                // No path? Should not happen in connected dungeon. Try again.
                assignNextTarget();
            }
        }

        function findPath(sx, sy, ex, ey) {
            let queue = [{c: sx, r: sy, path: []}];
            let visited = new Set();
            visited.add(`${sx},${sy}`);

            while (queue.length > 0) {
                let curr = queue.shift();
                
                if (curr.c === ex && curr.r === ey) {
                    return curr.path;
                }

                const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                for (let d of dirs) {
                    let nc = curr.c + d[0];
                    let nr = curr.r + d[1];
                    
                    if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS && 
                        grid[nr][nc].type === FLOOR && !visited.has(`${nc},${nr}`)) {
                        visited.add(`${nc},${nr}`);
                        let newPath = [...curr.path, {c: nc, r: nr}];
                        queue.push({c: nc, r: nr, path: newPath});
                    }
                }
            }
            return [];
        }

        function updateExplorer() {
            if (phase !== 'WANDERING') return;

            if (explorer.path.length === 0) {
                // Reached target
                grid[Math.round(explorer.y)][Math.round(explorer.x)].visited = true;
                assignNextTarget();
                return;
            }

            // Move towards target
            const target = explorer.path[0];
            const dx = target.c - explorer.x;
            const dy = target.r - explorer.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < EXPLORER_SPEED) {
                // Arrived at node
                explorer.x = target.c;
                explorer.y = target.r;
                explorer.path.shift();
                grid[target.r][target.c].visited = true;
            } else {
                // Move
                explorer.x += (dx / dist) * EXPLORER_SPEED;
                explorer.y += (dy / dist) * EXPLORER_SPEED;
            }
        }

        function draw() {
            // Clear background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = grid[r][c];
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;

                    if (tile.type === WALL) {
                        // Draw stone texture
                        ctx.fillStyle = '#111';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        // Add subtle border
                        ctx.strokeStyle = '#1a1a1a';
                        ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                    } else if (tile.type === FLOOR) {
                        // Draw floor
                        ctx.fillStyle = '#222';
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        
                        // Draw visited overlay
                        if (tile.visited) {
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            // Draw Torches
            const time = Date.now() * 0.005;
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for light

            torches.forEach(t => {
                const tx = t.x * TILE_SIZE + TILE_SIZE/2;
                const ty = t.y * TILE_SIZE + TILE_SIZE/2;
                
                // Flicker effect
                const flicker = Math.sin(time * 10 + t.flickerOffset) * 0.2 + 
                                Math.sin(time * 23 + t.flickerOffset) * 0.1 + 0.8;
                
                const radius = TILE_SIZE * 4 * flicker;
                
                // Create radial gradient
                const gradient = ctx.createRadialGradient(tx, ty, 0, tx, ty, radius);
                gradient.addColorStop(0, 'rgba(255, 160, 50, 0.8)');
                gradient.addColorStop(0.4, 'rgba(255, 100, 20, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(tx, ty, radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw actual torch sprite
                ctx.fillStyle = '#333';
                ctx.fillRect(tx - 2, ty - 2, 4, 4);
                ctx.fillStyle = `rgb(255, ${150 + Math.random()*50}, 0)`;
                ctx.beginPath();
                ctx.arc(tx, ty, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Explorer
            if (phase === 'WANDERING' || phase === 'TRANSITIONING') {
                const ex = explorer.x * TILE_SIZE + TILE_SIZE/2;
                const ey = explorer.y * TILE_SIZE + TILE_SIZE/2;
                
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ex, ey, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Explorer glow
                const glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, TILE_SIZE * 2);
                glow.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(ex, ey, TILE_SIZE * 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalCompositeOperation = 'source-over';

            // Transition Logic
            if (phase === 'TRANSITIONING') {
                ctx.fillStyle = `rgba(5, 5, 5, ${0.02})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                frameCount++;
                if (frameCount > 120) { // Wait 2 seconds
                    init();
                    frameCount = 0;
                }
            }
        }

        function loop() {
            generateStep();
            updateExplorer();
            draw();
            requestAnimationFrame(loop);
        }

        // Start
        init();
        loop();

    </script>
</body>
</html>
