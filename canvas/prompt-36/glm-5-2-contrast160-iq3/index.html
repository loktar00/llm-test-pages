<meta charset="UTF-8">
<title>City Gen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg-top: #0d0e1a;
  --bg-bottom: #161828;
  --accent: #e8a437;
  --accent-cool: #4a8fa6;
  --accent-warm: #e75c3d;
}
* { margin:0; padding:0; box-sizing: border-box; }
html,body {
  height: 100; width: 100;
  background: radial-gradient(ellipse at center 25%, #1d233c 0%, #060818 75%);
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#bg {
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 60% at 50% 30%, rgba(232,164,55,0.8) 0%, transparent 60%),
    radial-gradient(ellipse 100% 40% at 50% 100%, rgba(20,40,80,0.8) 0%, transparent 50%);
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background: 
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1) 0/3px 3px,
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1) 0/3px 3px;
  opacity: .06;
}
#city { position: absolute; inset: 0; display: block; }
#hud {
  position: absolute;
  top: 24px; left: 24px;
  color: rgba(232,164,55,0.85);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(232,164,55,0.4);
  z-index: 2;
  user-select: none;
  pointer-events: none;
  line-height: 1.8;
}
#hud .phase {
  color: rgba(255,255,255,0.95);
  font-weight: 700;
  margin-bottom: 4px;
}
#hud .label { color: rgba(255,255,255,0.5); }
#hud .num { color: rgba(255,255,255,0.85); }
#legend {
  position: absolute;
  bottom: 24px; right: 24px;
  color: rgba(255,255,255,0.6);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-align: right;
  line-height: 1.6;
  z-index: 2;
  user-select: none;
  pointer-events: none;
}
#legend .l { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: middle; }
#legend .row { display: flex; align-items: center; gap: 6px; justify-content: end; }
</style>
</head>

</div>
<div id="legend">
