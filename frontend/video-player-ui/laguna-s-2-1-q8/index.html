<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 800px;
            height: 450px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .video-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            animation: drift 25s infinite linear;
            z-index: 1;
        }

        .video-scene::before,
        .video-scene::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            animation: float 15s infinite ease-in-out;
        }

        .video-scene::before {
            width: 200px;
            height: 200px;
            top: 20%;
            left: 10%;
        }

        .video-scene::after {
            width: 150px;
            height: 150px;
            bottom: 15%;
            right: 10%;
            animation-duration: 18s;
        }

        @keyframes drift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-20px) scale(1.1); opacity: 0.8; }
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(transparent, rgba(15, 15, 26, 0.9));
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s;
            z-index: 2;
        }

        .controls.visible {
            opacity: 1;
            visibility: visible;
        }

        .play-button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            border: none;
            transition: transform 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }

        .play-button:hover {
            transform: scale(1.1);
            background: white;
        }

        .play-button.playing {
            background: rgba(255, 255, 255, 0.3);
        }

        .play-button.playing::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 18px;
            border-left: 3px solid rgba(255, 255, 255, 0.8);
            border-right: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 8px 0 0 rgba(255, 255, 255, 0.8);
        }

        .play-button:not(.playing)::before {
            content: '';
            width: 0;
            height: 0;
            border-left: 8px solid #000;
            border-top: 6px transparent;
            border-bottom: 6px transparent;
        }

        .progress-wrapper {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin: 0 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%;
            background: #fdbb2d;
            transition: width 0.1s linear;
        }

        .buffered-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .seek-preview {
            position: absolute;
            bottom: 100%;
            transform: translateX(-50%);
            background: #fdbb2d;
            color: #000;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            margin-bottom: 10px;
        }

        .seek-preview.visible {
            opacity: 1;
        }

        .controls-bottom {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .volume-control {
            position: relative;
            display: flex;
            align-items: center;
        }

        .volume-button {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .volume-flyout {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }

        .volume-flyout.visible {
            opacity: 1;
            visibility: visible;
        }

        .volume-fill {
            height: 100%;
            border-radius: 3px;
            width: 60%;
            background: white;
        }

        .settings-menu {
            position: absolute;
            bottom: 40px;
            right: 0;
            background: #1e1e2e;
            border-radius: 8px;
            padding: 8px;
            min-width: 150px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .settings-menu.visible {
            opacity: 1;
            visibility: visible;
        }

        .settings-menu button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            color: white;
            border: none;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .settings-menu button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .settings-button {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .time-display {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            min-width: 90px;
        }

        .fullscreen-button {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-scene"></div>
        <div class="controls" id="controls">
            <button class="play-button" id="playButton"></button>
            <div class="progress-wrapper" id="progressWrapper">
                <div class="seek-preview" id="seekPreview">0:30</div>
                <div class="buffered-fill" id="bufferedFill"></div>
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-display" id="timeDisplay">0:00 / 2:30</div>
            <div class="controls-bottom">
                <div class="volume-control" id="volumeControl">
                    <button class="volume-button" id="volumeButton">🔊</button>
                    <div class="volume-flyout" id="volumeFlyout">
                        <div class="volume-fill" id="volumeFill"></div>
                    </div>
                </div>
                <div class="settings-menu" id="settingsMenu">
                    <button data-speed="0.5">0.5× Speed</button>
                    <button data-speed="0.75">0.75× Speed</button>
                    <button data-speed="1" class="active">Normal</button>
                    <button data-speed="1.25">1.25× Speed</button>
                    <button data-speed="1.5">1.5× Speed</button>
                    <button data-speed="2">2× Speed</button>
                </div>
                <button class="settings-button" id="settingsButton">⚙️</button>
                <button class="fullscreen-button" id="fullscreenButton">⛶</button>
            </div>
        </div>
    </div>

    <script>
        class VideoPlayer {
            constructor() {
                this.isPlaying = false;
                this.duration = 150;
                this.currentTime = 0;
                this.bufferedPercent = 0;
                this.volume = 0.6;
                this.playbackRate = 1;
                this.isControlsVisible = true;
                this.hideTimeout = null;
                this.isDragging = false;
                this.isHoveringVolume = false;
                this.isHoveringSettings = false;

                this.initElements();
                this.bindEvents();
                this.updateDisplay();
                this.startFakePlayback();
            }

            initElements() {
                this.controls = document.getElementById('controls');
                this.playButton = document.getElementById('playButton');
                this.progressWrapper = document.getElementById('progressWrapper');
                this.progressFill = document.getElementById('progressFill');
                this.bufferedFill = document.getElementById('bufferedFill');
                this.seekPreview = document.getElementById('seekPreview');
                this.timeDisplay = document.getElementById('timeDisplay');
                this.volumeButton = document.getElementById('volumeButton');
                this.volumeFlyout = document.getElementById('volumeFlyout');
                this.volumeFill = document.getElementById('volumeFill');
                this.volumeControl = document.getElementById('volumeControl');
                this.settingsButton = document.getElementById('settingsButton');
                this.settingsMenu = document.getElementById('settingsMenu');
                this.fullscreenButton = document.getElementById('fullscreenButton');
                this.videoScene = document.querySelector('.video-scene');
            }

            bindEvents() {
                this.playButton.addEventListener('click', () => this.togglePlay());
                this.progressWrapper.addEventListener('mousemove', (e) => this.onSeekHover(e));
                this.progressWrapper.addEventListener('mouseleave', () => this.hideSeekPreview());
                this.progressWrapper.addEventListener('click', (e) => this.seekTo(e));
                this.volumeButton.addEventListener('click', () => this.toggleVolumeMute());
                this.volumeControl.addEventListener('mouseenter', () => this.showVolumeFlyout());
                this.volumeControl.addEventListener('mouseleave', () => this.hideVolumeFlyout());
                this.volumeFlyout.addEventListener('click', (e) => this.setVolumeFromClick(e));
                this.settingsButton.addEventListener('click', () => this.toggleSettings());
                this.settingsMenu.addEventListener('mouseenter', () => this.isHoveringSettings = true);
                this.settingsMenu.addEventListener('mouseleave', () => {
                    this.isHoveringSettings = false;
                    this.settingsMenu.classList.remove('visible');
                });
                document.querySelectorAll('[data-speed]').forEach(btn => {
                    btn.addEventListener('click', () => this.setSpeed(parseFloat(btn.dataset.speed)));
                });
                this.videoContainer = document.querySelector('.video-container');
                this.videoContainer.addEventListener('mousemove', () => this.onMouseMove());
                this.videoContainer.addEventListener('mouseleave', () => this.scheduleHideControls());
                this.fullscreenButton.addEventListener('click', () => this.toggleFullscreen());
            }

            togglePlay() {
                this.isPlaying = !this.isPlaying;
                this.playButton.classList.toggle('playing', this.isPlaying);
                if (this.isPlaying) {
                    this.videoScene.style.animationPlayState = 'running';
                } else {
                    this.videoScene.style.animationPlayState = 'paused';
                }
            }

            startFakePlayback() {
                const interval = setInterval(() => {
                    if (this.isPlaying) {
                        this.currentTime += 0.1 * this.playbackRate;
                        if (this.currentTime >= this.duration) {
                            this.currentTime = this.duration;
                            this.isPlaying = false;
                            this.playButton.classList.remove('playing');
                            this.videoScene.style.animationPlayState = 'paused';
                        }
                    }
                    if (this.bufferedPercent < 100 && !this.isDragging) {
                        this.bufferedPercent = Math.min(100, this.bufferedPercent + Math.random() * 0.3);
                    }
                    this.updateDisplay();
                }, 100);
            }

            updateDisplay() {
                const percent = (this.currentTime / this.duration) * 100;
                this.progressFill.style.width = `${percent}%`;
                this.bufferedFill.style.width = `${this.bufferedPercent}%`;

                const currentMin = Math.floor(this.currentTime / 60);
                const currentSec = Math.floor(this.currentTime % 60).toString().padStart(2, '0');
                const totalMin = Math.floor(this.duration / 60);
                const totalSec = Math.floor(this.duration % 60).toString().padStart(2, '0');
                this.timeDisplay.textContent = `${currentMin}:${currentSec} / ${totalMin}:${totalSec}`;

                const volIcon = this.volume === 0 ? '🔇' : this.volume < 0.3 ? '🔊' : '🔊';
                this.volumeButton.textContent = volIcon;
                this.volumeFill.style.width = `${this.volume * 100}%`;
            }

            onMouseMove() {
                if (this.hideTimeout) clearTimeout(this.hideTimeout);
                this.controls.classList.add('visible');
                this.isControlsVisible = true;
            }

            scheduleHideControls() {
                if (this.hideTimeout) clearTimeout(this.hideTimeout);
                this.hideTimeout = setTimeout(() => {
                    this.controls.classList.remove('visible');
                    this.isControlsVisible = false;
                    this.settingsMenu.classList.remove('visible');
                    this.volumeFlyout.classList.remove('visible');
                }, 3000);
            }

            onSeekHover(e) {
                if (this.isDragging) return;
                const rect = this.progressWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = x / rect.width;
                const time = percent * this.duration;
                const min = Math.floor(time / 60);
                const sec = Math.floor(time % 60).toString().padStart(2, '0');
                this.seekPreview.textContent = `${min}:${sec}`;
                this.seekPreview.style.left = `${x}px`;
                this.seekPreview.classList.add('visible');
            }

            hideSeekPreview() {
                if (!this.isDragging) {
                    this.seekPreview.classList.remove('visible');
                }
            }

            seekTo(e) {
                const rect = this.progressWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = x / rect.width;
                this.currentTime = percent * this.duration;
                this.isDragging = false;
                this.seekPreview.classList.remove('visible');
                this.updateDisplay();
            }

            toggleVolumeMute() {
                this.volume = this.volume === 0 ? 0.6 : 0;
                this.updateDisplay();
            }

            showVolumeFlyout() {
                this.isHoveringVolume = true;
                this.volumeFlyout.classList.add('visible');
            }

            hideVolumeFlyout() {
                this.isHoveringVolume = false;
                setTimeout(() => {
                    if (!this.isHoveringVolume) {
                        this.volumeFlyout.classList.remove('visible');
                    }
                }, 100);
            }

            setVolumeFromClick(e) {
                const rect = this.volumeFlyout.getBoundingClientRect();
                const x = e.clientX - rect.left;
                this.volume = Math.max(0, Math.min(1, x / rect.width));
                this.updateDisplay();
            }

            toggleSettings() {
                if (this.settingsMenu.classList.contains('visible')) {
                    this.settingsMenu.classList.remove('visible');
                } else {
                    this.settingsMenu.classList.add('visible');
                }
            }

            setSpeed(rate) {
                this.playbackRate = rate;
                document.querySelectorAll('[data-speed]').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.speed) === rate);
                });
                this.settingsMenu.classList.remove('visible');
            }

            toggleFullscreen() {
                const container = this.videoContainer;
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => console.log('Fullscreen failed:', err));
                } else {
                    document.exitFullscreen();
                }
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new VideoPlayer();
        });
    </script>
</body>
</html>
