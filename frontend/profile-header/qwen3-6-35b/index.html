<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --text: #f0f0f5;
    --text-muted: #8888a0;
    --accent: #7c5cfc;
    --accent-glow: rgba(124, 92, 252, 0.35);
    --green: #34d399;
    --radius: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .profile-header {
    position: relative;
    max-width: 520px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ── Banner ── */
  .banner {
    position: relative;
    height: 200px;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }

  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 80%, rgba(124, 92, 252, 0.6) 0%, transparent 70%),
      radial-gradient(ellipse 70% 50% at 80% 20%, rgba(236, 72, 153, 0.5) 0%, transparent 65%),
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(251, 146, 60, 0.35) 0%, transparent 60%),
      linear-gradient(135deg, #1a1040 0%, #2d1b69 30%, #4a1942 60%, #1a1040 100%);
    animation: bannerShift 12s ease-in-out infinite alternate;
  }

  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        120deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.015) 40px,
        rgba(255,255,255,0.015) 41px
      );
  }

  @keyframes bannerShift {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    100% { filter: hue-rotate(20deg) brightness(1.1); }
  }

  /* ── Avatar ── */
  .avatar-container {
    position: absolute;
    bottom: -52px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
  }

  .avatar-ring {
    position: relative;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, var(--accent), #ec4899, #fb923c);
    animation: ringRotate 6s linear infinite;
  }

  @keyframes ringRotate {
    0%   { background: linear-gradient(135deg, var(--accent), #ec4899, #fb923c); }
    33%  { background: linear-gradient(160deg, #ec4899, #fb923c, var(--accent)); }
    66%  { background: linear-gradient(200deg, #fb923c, var(--accent), #ec4899); }
    100% { background: linear-gradient(135deg, var(--accent), #ec4899, #fb923c); }
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    position: relative;
    overflow: hidden;
  }

  .avatar-pattern {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(124,92,252,0.15) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(236,72,153,0.1) 0%, transparent 50%);
  }

  .status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    background: var(--green);
    border: 3px solid var(--surface);
    border-radius: 50%;
    z-index: 3;
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
    50%      { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
  }

  /* ── Info ── */
  .info {
    text-align: center;
    padding: 64px 24px 20px;
  }

  .name {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 2px;
  }

  .handle {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-weight: 400;
  }

  .bio {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto 20px;
  }

  /* ── Stats ── */
  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 0 24px;
    margin-bottom: 24px;
  }

  .stat {
    text-align: center;
    min-width: 72px;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--text) 0%, var(--text-muted) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
    font-weight: 500;
  }

  /* ── Follow Button ── */
  .follow-btn-wrapper {
    display: flex;
    justify-content: center;
    padding: 0 24px 28px;
  }

  .follow-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    height: 44px;
    padding: 0 32px;
    border: none;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    overflow: hidden;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.35s ease,
                box-shadow 0.35s ease;
    width: 130px;
    box-shadow: 0 4px 20px var(--accent-glow);
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .follow-btn:hover {
    box-shadow: 0 6px 28px rgba(124, 92, 252, 0.5);
    transform: translateY(-1px);
  }

  .follow-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .follow-btn.following {
    width: 156px;
    background: var(--surface);
    border: 1.5px solid rgba(124, 92, 252, 0.3);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  .follow-btn.following:hover {
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }

  .btn-text {
    transition: opacity 0.2s ease, transform 0.3s ease;
    white-space: nowrap;
  }

  .btn-text.unfollow {
    position: absolute;
    opacity: 0;
    transform: translateY(10px);
  }

  .follow-btn:not(.following) .btn-text.unfollow {
    opacity: 0;
    transform: translateY(10px);
  }

  .follow-btn:not(.following) .btn-text.follow {
    opacity: 1;
    transform: translateY(0);
  }

  .follow-btn.following .btn-text.follow {
    opacity: 0;
    transform: translateY(-10px);
  }

  .follow-btn.following .btn-text.unfollow {
    opacity: 1;
    transform: translateY(0);
  }

  .check-icon {
    position: absolute;
    opacity: 0;
    transform: scale(0) rotate(-45deg);
    transition: opacity 0.3s ease 0.1s, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s;
    font-size: 16px;
  }

  .follow-btn.following .check-icon {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  /* ── Tabs ── */
  .tabs-container {
    border-top: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }

  .tabs {
    display: flex;
    justify-content: space-around;
    list-style: none;
    position: relative;
  }

  .tab {
    flex: 1;
    text-align: center;
  }

  .tab-btn {
    display: block;
    width: 100%;
    padding: 16px 0;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: color 0.3s ease;
    outline: none;
    letter-spacing: 0.01em;
  }

  .tab-btn:hover {
    color: var(--text);
  }

  .tab-btn.active {
    color: var(--text);
  }

  .tab-indicator {
    position: absolute;
    bottom: 0;
    height: 2.5px;
    background: linear-gradient(90deg, var(--accent), #ec4899);
    border-radius: 2px 2px 0 0;
    transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* ── Content area ── */
  .content {
    padding: 24px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .content-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    width: 100%;
  }

  .grid-item {
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--surface);
    transition: transform 0.25s ease, opacity 0.3s ease;
    opacity: 0;
    animation: gridFadeIn 0.5s ease forwards;
  }

  .grid-item:hover {
    transform: scale(0.96);
  }

  @keyframes gridFadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .banner { height: 160px; }
    .avatar-ring { width: 88px; height: 88px; }
    .avatar { font-size: 28px; }
    .stats { gap: 24px; }
    .stat-value { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="profile-header">
  <!-- Banner -->
  <div class="banner"></div>

  <!-- Avatar -->
  <div class="avatar-container">
    <div class="avatar-ring">
      <div class="avatar">
        <div class="avatar-pattern"></div>
        A
      </div>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- Info -->
  <div class="info">
    <h1 class="name">Alex Morgan</h1>
    <p class="handle">@alexmorgan</p>
    <p class="bio">Designer & developer crafting digital experiences. Coffee enthusiast ☕</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-value" data-target="1284">0</div>
      <div class="stat-label">Posts</div>
    </div>
    <div class="stat">
      <div class="stat-value" data-target="48200">0</div>
      <div class="stat-label">Followers</div>
    </div>
    <div class="stat">
      <div class="stat-value" data-target="892">0</div>
      <div class="stat-label">Following</div>
    </div>
  </div>

  <!-- Follow Button -->
  <div class="follow-btn-wrapper">
    <button class="follow-btn" id="followBtn">
      <span class="btn-text follow">Follow</span>
      <span class="btn-text unfollow">Following</span>
      <span class="check-icon">✓</span>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs-container">
    <ul class="tabs">
      <li class="tab">
        <button class="tab-btn active" data-tab="posts">Posts</button>
      </li>
      <li class="tab">
        <button class="tab-btn" data-tab="replies">Replies</button>
      </li>
      <li class="tab">
        <button class="tab-btn" data-tab="media">Media</button>
      </li>
      <li class="tab">
        <button class="tab-btn" data-tab="likes">Likes</button>
      </li>
    </ul>
    <div class="tab-indicator" id="tabIndicator"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="content-grid" id="contentGrid"></div>
  </div>
</div>

<script>
  // ── Count-up animation ──
  function animateCounters() {
    const counters = document.querySelectorAll('.stat-value');
    const duration = 1800;
    const start = performance.now();

    function easeOutExpo(t) {
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

    function update(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutExpo(progress);

      counters.forEach(counter => {
        const target = parseInt(counter.dataset.target, 10);
        const current = Math.round(eased * target);
        counter.textContent = current.toLocaleString();
      });

      if (progress < 1) {
        requestAnimationFrame(update);
      }
    }

    requestAnimationFrame(update);
  }

  // ── Follow button ──
  const followBtn = document.getElementById('followBtn');
  let isFollowing = false;

  followBtn.addEventListener('click', () => {
    isFollowing = !isFollowing;
    followBtn.classList.toggle('following', isFollowing);
  });

  // ── Tab switching ──
  const tabs = document.querySelectorAll('.tab-btn');
  const indicator = document.getElementById('tabIndicator');

  function moveIndicator(tab) {
    const rect = tab.getBoundingClientRect();
    const parentRect = tab.parentElement.parentElement.getBoundingClientRect();
    indicator.style.left = (rect.left - parentRect.left) + 'px';
    indicator.style.width = rect.width + 'px';
  }

  function initIndicator() {
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab) moveIndicator(activeTab);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      moveIndicator(tab);
      regenerateGrid();
    });
  });

  // ── Grid items ──
  function regenerateGrid() {
    const grid = document.getElementById('contentGrid');
    grid.innerHTML = '';
    const colors = [
      'linear-gradient(135deg, #667eea, #764ba2)',
      'linear-gradient(135deg, #f093fb, #f5576c)',
      'linear-gradient(135deg, #4facfe, #00f2fe)',
      'linear-gradient(135deg, #43e97b, #38f9d7)',
      'linear-gradient(135deg, #fa709a, #fee140)',
      'linear-gradient(135deg, #a18cd1, #fbc2eb)',
      'linear-gradient(135deg, #fccb90, #d57eeb)',
      'linear-gradient(135deg, #e0c3fc, #8ec5fc)',
      'linear-gradient(135deg, #f5576c, #ff6f91)',
    ];
    for (let i = 0; i < 9; i++) {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.background = colors[i % colors.length];
      item.style.animationDelay = (i * 0.06) + 's';
      grid.appendChild(item);
    }
  }

  // ── Init ──
  window.addEventListener('DOMContentLoaded', () => {
    animateCounters();
    initIndicator();
    regenerateGrid();
  });

  window.addEventListener('resize', initIndicator);
</script>

</body>
</html>
