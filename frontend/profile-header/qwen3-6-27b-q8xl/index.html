<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f0f0f;
    --surface:#1a1a1a;
    --surface2:#252525;
    --border:#333;
    --text:#e8e8e8;
    --text-muted:#888;
    --accent:#6c5ce7;
    --accent-light:#a29bfe;
    --green:#00d68f;
    --follow-bg:#6c5ce7;
    --follow-hover:#7c6ff7;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px;
  }
  .profile{
    width:100%;
    max-width:640px;
    background:var(--surface);
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--border);
    box-shadow:0 8px 32px rgba(0,0,0,.4);
  }

  /* ── Banner ── */
  .banner{
    position:relative;
    height:200px;
    overflow:hidden;
  }
  .banner::before{
    content:'';
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse 120% 80% at 20% 100%, rgba(108,92,231,.6) 0%, transparent 60%),
      radial-gradient(ellipse 80% 100% at 80% 0%, rgba(0,214,143,.4) 0%, transparent 50%),
      radial-gradient(ellipse 100% 60% at 50% 50%, rgba(162,155,254,.3) 0%, transparent 70%),
      linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
  }
  .banner::after{
    content:'';
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,.015) 40px,
        rgba(255,255,255,.015) 41px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,.01) 40px,
        rgba(255,255,255,.01) 41px
      );
  }
  .banner-shimmer{
    position:absolute;inset:0;
    background:linear-gradient(
      105deg,
      transparent 30%,
      rgba(255,255,255,.04) 45%,
      rgba(255,255,255,.06) 50%,
      rgba(255,255,255,.04) 55%,
      transparent 70%
    );
    animation:shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%,100%{transform:translateX(-100%)}
    50%{transform:translateX(100%)}
  }

  /* ── Avatar ── */
  .avatar-wrapper{
    position:relative;
    margin-top:-52px;
    margin-left:24px;
    z-index:2;
  }
  .avatar-ring{
    width:104px;height:104px;
    border-radius:50%;
    padding:4px;
    background:conic-gradient(from 0deg, var(--accent), var(--green), var(--accent-light), var(--accent));
    box-shadow:0 4px 20px rgba(108,92,231,.3);
  }
  .avatar{
    width:100%;height:100%;
    border-radius:50%;
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:700;
    color:var(--accent-light);
    letter-spacing:-1px;
    overflow:hidden;
    position:relative;
  }
  .avatar::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(108,92,231,.15), rgba(0,214,143,.1));
  }
  .status-dot{
    position:absolute;
    bottom:4px;right:4px;
    width:18px;height:18px;
    background:var(--green);
    border:3px solid var(--surface);
    border-radius:50%;
    box-shadow:0 0 8px rgba(0,214,143,.5);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 8px rgba(0,214,143,.4)}
    50%{box-shadow:0 0 16px rgba(0,214,143,.7)}
  }

  /* ── Info ── */
  .info{
    padding:16px 24px 0;
  }
  .name{
    font-size:22px;font-weight:800;
    letter-spacing:-.3px;
    line-height:1.2;
  }
  .handle{
    font-size:14px;
    color:var(--text-muted);
    margin-top:2px;
    font-weight:500;
  }
  .bio{
    margin-top:12px;
    font-size:14px;
    line-height:1.6;
    color:var(--text-muted);
  }
  .bio span{color:var(--accent-light);font-weight:600}

  /* ── Stats ── */
  .stats{
    display:flex;
    gap:32px;
    padding:20px 24px;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  .stat{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:60px;
  }
  .stat-value{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.5px;
    color:var(--text);
  }
  .stat-label{
    font-size:12px;
    color:var(--text-muted);
    margin-top:2px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  /* ── Follow Button ── */
  .btn-wrap{
    padding:0 24px 20px;
    display:flex;
    justify-content:flex-end;
  }
  .follow-btn{
    position:relative;
    border:none;
    border-radius:50px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    background:var(--follow-bg);
    padding:10px 28px;
    transition:background .3s ease, transform .15s ease, box-shadow .3s ease;
    box-shadow:0 4px 16px rgba(108,92,231,.35);
    outline:none;
    letter-spacing:.2px;
    min-width:120px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    overflow:hidden;
  }
  .follow-btn:hover{
    background:var(--follow-hover);
    transform:translateY(-1px);
    box-shadow:0 6px 24px rgba(108,92,231,.45);
  }
  .follow-btn:active{
    transform:translateY(0) scale(.97);
  }
  .follow-btn.following{
    background:var(--surface2);
    color:var(--text);
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    border:1px solid var(--border);
  }
  .follow-btn.following:hover{
    background:#333;
  }
  .btn-text{
    transition:opacity .2s ease, transform .2s ease;
    display:inline-block;
  }
  .btn-check{
    display:inline-flex;
    align-items:center;
    opacity:0;
    transform:scale(0);
    transition:opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .follow-btn.following .btn-text{
    opacity:0;
    transform:translateY(8px);
    position:absolute;
  }
  .follow-btn.following .btn-check{
    opacity:1;
    transform:scale(1);
    position:relative;
  }
  .check-icon{
    width:16px;height:16px;
    margin-right:2px;
  }

  /* ── Tabs ── */
  .tabs{
    display:flex;
    position:relative;
    border-bottom:1px solid var(--border);
  }
  .tab{
    flex:1;
    padding:14px 0;
    text-align:center;
    font-size:14px;
    font-weight:600;
    color:var(--text-muted);
    cursor:pointer;
    transition:color .25s ease;
    position:relative;
    z-index:1;
    background:none;border:none;
    outline:none;
    letter-spacing:.2px;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .tab-underline{
    position:absolute;
    bottom:0;
    height:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius:3px 3px 0 0;
    transition:left .35s cubic-bezier(.4,0,.2,1), width .35s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 12px rgba(108,92,231,.4);
  }

  /* ── Content placeholder ── */
  .content{
    padding:24px;
    min-height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .content-placeholder{
    color:var(--text-muted);
    font-size:14px;
    font-style:italic;
    opacity:.5;
  }

  /* ── Responsive ── */
  @media(max-width:480px){
    .stats{gap:20px}
    .stat-value{font-size:17px}
    .banner{height:160px}
    .info{padding:12px 16px 0}
    .btn-wrap{padding:0 16px 16px}
    .tabs{padding:0 8px}
    .tab{font-size:13px}
  }
</style>
</head>
<body>

<div class="profile">
  <div class="banner">
    <div class="banner-shimmer"></div>
  </div>

  <div class="avatar-wrapper">
    <div class="avatar-ring">
      <div class="avatar">AK</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="info">
    <div class="name">Alex Kimura</div>
    <div class="handle">@alexkimura · UI/UX Designer</div>
    <div class="bio">Crafting digital experiences at the intersection of <span>design</span> and <span>code</span>. Based in Tokyo 🗼</div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-value" data-target="1247">0</span>
      <span class="stat-label">Posts</span>
    </div>
    <div class="stat">
      <span class="stat-value" data-target="28400">0</span>
      <span class="stat-label">Followers</span>
    </div>
    <div class="stat">
      <span class="stat-value" data-target="892">0</span>
      <span class="stat-label">Following</span>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="follow-btn" id="followBtn">
      <span class="btn-text">Follow</span>
      <span class="btn-check">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Following
      </span>
    </button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-index="0">Posts</button>
    <button class="tab" data-index="1">Replies</button>
    <button class="tab" data-index="2">Media</button>
    <button class="tab" data-index="3">Likes</button>
    <div class="tab-underline" id="tabUnderline"></div>
  </div>

  <div class="content">
    <span class="content-placeholder">Content area</span>
  </div>
</div>

<script>
  // ── Count-up animation ──
  function formatNumber(n) {
    if (n >= 1000) {
      const k = (n / 1000);
      if (n >= 10000) return Math.floor(n).toLocaleString();
      return k.toFixed(k % 1 === 0 ? 0 : 1) + 'K';
    }
    return n;
  }

  function animateCounters() {
    const counters = document.querySelectorAll('.stat-value');
    const duration = 1800;
    const start = performance.now();

    function easeOutExpo(t) {
      return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

    function update(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutExpo(progress);

      counters.forEach(counter => {
        const target = parseInt(counter.dataset.target, 10);
        const current = Math.floor(eased * target);
        counter.textContent = formatNumber(current);
      });

      if (progress < 1) {
        requestAnimationFrame(update);
      } else {
        counters.forEach(counter => {
          const target = parseInt(counter.dataset.target, 10);
          counter.textContent = formatNumber(target);
        });
      }
    }

    requestAnimationFrame(update);
  }

  // ── Follow button toggle ──
  const followBtn = document.getElementById('followBtn');
  let isFollowing = false;

  followBtn.addEventListener('click', () => {
    isFollowing = !isFollowing;
    followBtn.classList.toggle('following', isFollowing);
  });

  // ── Tab underline ──
  const tabsContainer = document.getElementById('tabs');
  const underline = document.getElementById('tabUnderline');
  const tabs = tabsContainer.querySelectorAll('.tab');

  function positionUnderline(tab) {
    const containerRect = tabsContainer.getBoundingClientRect();
    const tabRect = tab.getBoundingClientRect();
    underline.style.left = (tabRect.left - containerRect.left) + 'px';
    underline.style.width = tabRect.width + 'px';
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      positionUnderline(tab);
    });
  });

  // ── Init ──
  window.addEventListener('DOMContentLoaded', () => {
    // Position underline on active tab
    const activeTab = tabsContainer.querySelector('.tab.active');
    if (activeTab) {
      // Small delay to ensure layout is ready
      requestAnimationFrame(() => {
        positionUnderline(activeTab);
      });
    }

    // Start counter animation after a short delay
    setTimeout(animateCounters, 300);
  });

  // Reposition on resize
  window.addEventListener('resize', () => {
    const activeTab = tabsContainer.querySelector('.tab.active');
    if (activeTab) positionUnderline(activeTab);
  });
</script>
</body>
</html>
