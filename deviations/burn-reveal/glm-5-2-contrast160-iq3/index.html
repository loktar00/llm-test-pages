<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ignition</title>
<style>
  html,body{margin:0;height:100;100%;background:#0c080a;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2gl'),gl=ctx.getContext('webgl',{premultiAlpha:false});
const vs=`attribute vec2 p;attribute float t;varying float vT;varying vec2 vP;uniform vec2 u;void main(){gl_Position=vec4(p,1,0);vT=t;vP=p-u;}`;
const fs=`
precision highp float;
varying float vT;
varying vec2 vP;
uniform float uTime;
uniform vec2 uBurn,uNoise;
uniform float uRadius;
uniform float uPattern;
uniform vec2 uRes;
float hash(vec2 p){return fract(sin(dot(p,vec2(12.1,47.7)))*42323.);}
float noise(vec2 p){vec2 i=floor(p),z=fract(p),w=smoothstep(0,1,z.x),s=smoothstep(0,1,z.y);return mix(mix(hash(i),hash(i+vec2(1,0)),w),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),w),s);}
float fbm(vec2 p){float s=0,a=1,f=1;for(int i=0;i<4;i++){s+=f*noise(p*a);a*=2;f*=0.5;}return s;}
vec3 pattern(vec2 p,float t){
  p*=0.009;
  float v1=fbm(p+vec2(t*0.1,t*0.1));
  float v2=fbm(p*2.5-vec2(t*0.3,t*0.25));
  float v3=fbm(p*5-vec2(t*0.5,0);
  vec3 c1=mix(vec3(0.05,0.06,0.08),vec3(0.9,0.35,0.12),v1*0.5+0.5);
  c1=mix(c1,vec3(0.95,0.85,0.15),v2*0.5+0.5);
  vec3 c2=mix(vec3(0.1,0.05,0.15),vec3(0.9,0.2,0.3),v1*0.5+0.5);
  c2=mix(c2,vec3(0.25,0.85,0.45),v2*0.5+0.5);
  vec3 c3=mix(vec3(0,0.05,0.15),vec3(0.85,0.25,0.55),v1*0.5+0.5);
  c3=mix(c3,vec3(0.25,0.85,0.75),v2*0.5+0.5);
  vec3 pal=mix(c1,c2,uPattern);
  pal=mix(pal,c3,max(0,uPattern-0.5)*2.0);
  float stripe=abs(fract(p.y*30.0+sin(p.x*8.0)*0.5)-0.5)*2.0;
  stripe=1.0-pow(stripe,0.5);
  pal*=0.6+stripe*v3*0.6;
  pal*=0.6+v3*0.8;
  return pal;
}
void main(){
  vec2 d=vP*2.0/uRes;
  float dist=length(d)*uRadius;
  vec2 nDir=normalize(d+0.0001)*0.15;
  float n=fbm(vec2(d.x*8.0,d.y*8.0)+uTime*0.5*nDir);
  float burnEdge=dist+0.1-n*0.25;
  float burn=smoothstep(0.0,0.05,burnEdge);
  float edge=smoothstep(-0.05,0.05,burnEdge)*smoothstep(0.05,-0.05,burnEdge);
  vec2 patUV=vP/uRes*2.0*2.0;
  vec3 color=pattern(patUV,uPattern+uTime*0.1);
  vec3 burnColor=vec3(0.02,0.02,0.03);
  vec3 emberColor=vec3(1.5,0.7,0.2)*edge;
  emberColor+=vec3(1.0,1.5,1.0)*pow(edge,2)*0.5;
  emberColor+=vec3(1.5,1.0,0.3)*pow(noise(d*50.0+uTime*10.0),5)*edge*3.0;
  color=mix(burnColor,color,burn);
  color+=emberColor;
  color*=smoothstep(0.0,0.5,burn);
  gl_FragColor=vec4(color,1.0);
}`;
</script>
</body>
</html>
