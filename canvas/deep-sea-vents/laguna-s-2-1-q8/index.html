<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deep Sea Vent Scene</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="ventCanvas"></canvas>
<script>
(() => {
    const canvas = document.getElementById('ventCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    // Scene objects
    const particles = [];
    const worms = [];
    const shrimp = [];
    const snowflake = [];
    const siphonophore = { x: WIDTH * 0.7, y: HEIGHT * 0.3, vx: -0.2, vy: 0.05, glow: 0 };
    const rov = { x: 100, y: 150, targetX: WIDTH - 100, targetY: 200, speed: 0.5 };

    // Vent positions
    const vents = [
        { x: WIDTH * 0.5, y: HEIGHT * 0.75 },
        { x: WIDTH * .4, y: HEIGHT * .8 },
        { x: WIDTH * .35, y: HEIGHT * .78 }
    ];

    // Initialize marine snow
    for (let i = 0; i < 300; i++) {
        snowflake.push({
            x: Math.random() * WIDTH,
            y: Math.random() * HEIGHT,
            r: Math.random() * 1.5 + 0.5,
            vx: Math.random() * 0.2 - 0.1,
            vy: Math.random() * 0.4 + 0.1,
            alpha: Math.random() * 0.6 + 0.2
        });
    }

    // Initialize tube worms
    for (let i = 0; i < 8; i++) {
        worms.push({
            x: vents[0].x + (Math.random() - 0.5) * 120,
            y: vents[0].y + (Math.random() - 0.5) * 60,
            length: Math.random() * 40 + 60,
            waveOffset: Math.random() * Math.PI * 2,
            waveSpeed: 0.02 + Math.random() * 0.01
        });
    }

    // Initialize shrimp
    for (let i = 0; i < 50; i++) {
        shrimp.push({
            x: vents[0].x + (Math.random() - 0.5) * 100,
            y: vents[0].y + (Math.random() - 0.5) * 80,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.3,
            size: Math.random() * 3 + 2,
            side: Math.random() > 0.5 ? 1 : -1
        });
    }

    // Initialize particles
    function emitParticles() {
        for (let i = 0; i < 3; i++) {
            const vent = vents[i % vents.length];
            particles.push({
                x: vent.x,
                y: vent.y,
                vx: (Math.random() - 0.5) * 0.8,
                vy: -(Math.random() * 1.5 + 0.5),
                life: 1,
                size: Math.random() * 2 + 1,
                temp: Math.random() * 0.5 + 0.5
            });
        }
    }

    function update() {
        emitParticles();

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.vx += (Math.random() - 0.5) * 0.1;
            p.vy += 0.02;
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.005;
            p.size *= 0.97;
            if (p.life <= 0 || p.y < 0 || p.x < 0 || p.x > WIDTH) {
                particles.splice(i, 1);
            }
        }

        // Update worms
        for (const w of worms) {
            w.waveOffset += w.waveSpeed;
        }

        // Update shrimp
        for (const s of shrimp) {
            s.x += s.vx;
            s.y += s.vy;
            if (s.x < vents[0].x - 60 || s.x > vents[0].x + 60) s.vx *= -1;
            if (s.y < vents[0].y - 40 || s.y > vents[0].y + 40) s.vy *= -1;
        }

        // Update marine snow
        for (const sf of snowflake) {
            sf.x += sf.vx;
            sf.y += sf.vy;
            if (sf.x < 0) sf.x = WIDTH;
            if (sf.x > WIDTH) sf.x = 0;
            if (sf.y > HEIGHT) {
                sf.y = 0;
                sf.x = Math.random() * WIDTH;
            }
        }

        // Update Siphonophore
        siphonophore.x += siphonophore.vx;
        siphonophore.y += siphonophore.vy;
        siphonophore.glow = (siphonophore.glow + 0.02) % (Math.PI * 2);
        if (siphonophore.x < -50) {
            siphonophore.x = WIDTH + 50;
            siphonophore.y = Math.random() * HEIGHT * 0.6 + HEIGHT * 0.2;
        }

        // Update ROV
        const dx = siphonophore.x - rov.x;
        const dy = siphonophore.y - rov.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 300) {
            rov.targetX = siphonophore.x;
            rov.targetY = siphonophore.y;
        }

        if (!rov.targetX || Math.abs(rov.x - rov.targetX) < 5 && Math.abs(rov.y - rov.targetY) < 5) {
            rov.targetX = Math.random() * (WIDTH - 200) + 100;
            rov.targetY = Math.random() * (HEIGHT / 2) + 50;
        }

        rov.x += (rov.targetX - rov.x) * 0.02;
        rov.y += (rov.targetY - rov.y) * 0.02;

        // Reset ROV direction when going off screen
        if (rov.x < 0 || rov.x > WIDTH || rov.y < 0 || rov.y > HEIGHT) {
            rov.targetX = Math.random() * (WIDTH - 200) + 100;
            rov.targetY = Math.random() * (HEIGHT / 2) + 50;
        }
    }

    function draw() {
        // Dark blue gradient background
        const bgGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        bgGrad.addColorStop(0, '#0a0f2a');
        bgGrad.addColorStop(1, '#02040d');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Draw marine snow
        ctx.fillStyle = '#aaccff';
        for (const sf of snowflake) {
            ctx.globalAlpha = sf.alpha;
            ctx.beginPath();
            ctx.arc(sf.x, sf.y, sf.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Draw vents (black smokers)
        for (const vent of vents) {
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(vent.x, vent.y, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(vent.x + 3, vent.y - 3, 12, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw particles
        for (const p of particles) {
            const alpha = Math.max(p.life, 0);
            ctx.fillStyle = `rgba(100, 200, 255, ${alpha * 0.7})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw tube worms
        for (const w of worms) {
            const sway = Math.sin(w.waveOffset) * 10;
            ctx.strokeStyle = '#3a7d44';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(w.x, w.y);
            ctx.lineTo(w.x + sway, w.y - w.length);
            ctx.stroke();

            // Worm head
            ctx.fillStyle = '#5ac85a';
            ctx.beginPath();
            ctx.arc(w.x, w.y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2e6b2e';
            ctx.beginPath();
            ctx.arc(w.x + 2, w.y - 1, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw shrimp
        for (const s of shrimp) {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.scale(s.side, 1);
            ctx.fillStyle = '#e0c080';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-8, -3);
            ctx.lineTo(-6, 0);
            ctx.lineTo(-8, 3);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#d0b070';
            ctx.beginPath();
            ctx.arc(-3, 0, s.size * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Draw siphonophore
        const glowAmount = (Math.sin(siphonophore.glow) + 1) * 0.3;
        ctx.fillStyle = `rgba(100, 200, 255, ${glowAmount + 0.2})`;
        ctx.beginPath();
        ctx.arc(siphonophore.x, siphonophore.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(100, 200, 255, ${glowAmount + 0.3})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(siphonophore.x, siphonophore.y, 12 + glowAmount * 5, 0, Math.PI * 2);
        ctx.stroke();

        // Draw tentacles
        ctx.strokeStyle = `rgba(150, 220, 255, ${glowAmount + 0.1})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const len = 20 + Math.sin(siphonophore.glow + i) * 5;
            ctx.beginPath();
            ctx.moveTo(siphonophore.x, siphonophore.y);
            ctx.lineTo(siphonophore.x + Math.cos(angle) * len, siphonophore.y + Math.sin(angle) * len);
            ctx.stroke();
        }

        // Draw ROV and lights
        const lightAngle = Math.atan2(rov.targetY - rov.y, rov.targetX - rov.x);
        const lightLength = 150;

        // Light cone
        ctx.fillStyle = 'rgba(255, 255, 200, 0.05)';
        ctx.save();
        ctx.translate(rov.x, rov.y);
        ctx.rotate(lightAngle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(lightLength, -30);
        ctx.lineTo(lightLength, 30);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Light beams
        ctx.strokeStyle = 'rgba(255, 255, 200, 0.1)';
        ctx.lineWidth = 40;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(rov.x, rov.y);
        ctx.lineTo(rov.x + Math.cos(lightAngle) * lightLength, rov.y + Math.sin(lightAngle) * lightLength);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 200, 0.08)';
        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.moveTo(rov.x, rov.y);
        ctx.lineTo(rov.x + Math.cos(lightAngle - 0.1) * lightLength * 0.9, rov.y + Math.sin(lightAngle - 0.1) * lightLength * 0.9);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 200, 0.06)';
        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.moveTo(rov.x, rov.y);
        ctx.lineTo(rov.x + Math.cos(lightAngle + 0.1) * lightLength * 0.9, rov.y + Math.sin(lightAngle + 0.1) * lightLength * 0.9);
        ctx.stroke();

        // ROV body
        ctx.fillStyle = '#4a90e2';
        ctx.beginPath();
        ctx.moveTo(rov.x - 10, rov.y - 8);
        ctx.lineTo(rov.x + 10, rov.y);
        ctx.lineTo(rov.x - 10, rov.y + 8);
        ctx.closePath();
        ctx.fill();

        // ROV lights
        ctx.fillStyle = '#ffffcc';
        ctx.beginPath();
        ctx.arc(rov.x + 5, rov.y - 4, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(rov.x + 5, rov.y + 4, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    loop();
})();
</script>
</body>
</html>
