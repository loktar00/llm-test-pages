<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#0f0f13;
    --surface:#1a1a24;
    --surface2:#232330;
    --text:#e8e8ef;
    --text-dim:#6e6e80;
    --accent:#6c5ce7;
    --accent2:#a29bfe;
    --success:#00cec9;
    --card-w:420px;
    --card-h:265px;
  }

  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem;
    overflow-x:hidden;
  }

  .container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3rem;
    width:100%;
    max-width:900px;
  }

  h1{
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    color:var(--text);
  }
  h1 span{color:var(--accent2)}

  /* ── CARD ── */
  .card-scene{
    perspective:1200px;
    width:var(--card-w);
    height:var(--card-h);
    flex-shrink:0;
  }

  .card{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.4,.2,.2,1);
    animation:float 6s ease-in-out infinite;
  }
  .card.flipped{
    transform:rotateY(180deg);
  }
  .card.flipped .card-front{
    animation:none;
  }

  .card-face{
    position:absolute;
    inset:0;
    border-radius:20px;
    backface-visibility:hidden;
    overflow:hidden;
  }

  /* ── FRONT ── */
  .card-front{
    background:linear-gradient(135deg,#1e1e2e 0%,#2d2b4a 40%,#1e1e2e 100%);
    padding:28px 32px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-shadow:
      0 20px 60px rgba(0,0,0,.45),
      0 0 0 1px rgba(255,255,255,.06),
      inset 0 1px 0 rgba(255,255,255,.08);
  }

  .card-front::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
      105deg,
      transparent 30%,
      rgba(255,255,255,.03) 45%,
      rgba(255,255,255,.07) 50%,
      rgba(255,255,255,.03) 55%,
      transparent 70%
    );
    background-size:250% 100%;
    animation:sheen 8s ease-in-out infinite;
    pointer-events:none;
    z-index:2;
  }

  .card-front::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:20px;
    background:
      radial-gradient(ellipse at 20% 0%,rgba(108,92,231,.25) 0%,transparent 60%),
      radial-gradient(ellipse at 80% 100%,rgba(0,206,201,.15) 0%,transparent 60%);
    pointer-events:none;
    z-index:1;
  }

  .card-front > *{position:relative;z-index:3}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .chip{
    width:48px;height:36px;
    border-radius:6px;
    background:linear-gradient(135deg,#d4a853 0%,#c9952e 50%,#d4a853 100%);
    position:relative;
    overflow:hidden;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
  }
  .chip::before{
    content:'';
    position:absolute;
    inset:4px;
    border:1px solid rgba(0,0,0,.15);
    border-radius:3px;
  }
  .chip::after{
    content:'';
    position:absolute;
    left:50%;top:0;bottom:0;
    width:1px;
    background:rgba(0,0,0,.12);
    transform:translateX(-50%);
  }
  .chip-lines{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:6px 0;
  }
  .chip-lines::before,.chip-lines::after{
    content:'';
    height:1px;
    background:rgba(0,0,0,.1);
    width:100%;
  }

  .brand{
    display:flex;
    gap:-8px;
    align-items:center;
  }
  .brand-circle{
    width:36px;height:36px;
    border-radius:50%;
    opacity:.85;
  }
  .brand-circle:first-child{
    background:#eb001b;
    margin-right:-12px;
    z-index:1;
  }
  .brand-circle:last-child{
    background:#f79e1b;
  }

  .card-number{
    font-size:1.45rem;
    font-weight:500;
    letter-spacing:.18em;
    font-family:'Courier New',monospace;
    color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.3);
    margin:8px 0;
    min-height:2rem;
    word-spacing:.15em;
  }

  .card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }

  .card-label{
    font-size:.55rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:rgba(255,255,255,.4);
    margin-bottom:2px;
  }

  .card-name{
    font-size:.85rem;
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,.9);
    min-width:100px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .card-expiry{
    font-size:.85rem;
    font-weight:500;
    font-family:'Courier New',monospace;
    color:rgba(255,255,255,.9);
    letter-spacing:.08em;
  }

  /* ── BACK ── */
  .card-back{
    background:linear-gradient(135deg,#1e1e2e 0%,#2d2b4a 40%,#1e1e2e 100%);
    transform:rotateY(180deg);
    box-shadow:
      0 20px 60px rgba(0,0,0,.45),
      0 0 0 1px rgba(255,255,255,.06),
      inset 0 1px 0 rgba(255,255,255,.08);
    display:flex;
    flex-direction:column;
  }

  .magstripe{
    width:calc(100% + 64px);
    margin-left:-32px;
    height:48px;
    background:linear-gradient(180deg,#111 0%,#222 50%,#111 100%);
    margin-top:24px;
  }

  .back-content{
    padding:20px 32px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  .cvv-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .cvv-label{
    font-size:.6rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:rgba(255,255,255,.4);
    white-space:nowrap;
  }
  .cvv-strip{
    flex:1;
    height:36px;
    background:linear-gradient(90deg,#ddd 0%,#f5f5f5 3%,#eee 100%);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:14px;
    color:#333;
    font-family:'Courier New',monospace;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.15em;
  }

  .back-bottom{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-top:12px;
  }
  .back-brand{
    display:flex;
    gap:-6px;
    align-items:center;
    opacity:.6;
  }
  .back-brand .brand-circle{width:28px;height:28px}
  .back-brand .brand-circle:first-child{margin-right:-10px}

  /* ── FLOAT ── */
  @keyframes float{
    0%,100%{transform:translateY(0) rotateX(2deg) rotateY(-3deg)}
    50%{transform:translateY(-8px) rotateX(-1deg) rotateY(2deg)}
  }
  .card.flipped{
    animation:none;
    transform:rotateY(180deg);
  }

  @keyframes sheen{
    0%,100%{background-position:200% 0}
    50%{background-position:-50% 0}
  }

  /* ── FORM ── */
  .form-panel{
    background:var(--surface);
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    padding:2.5rem;
    width:100%;
    max-width:440px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
  }

  .form-group{
    margin-bottom:1.5rem;
  }
  .form-group:last-of-type{margin-bottom:2rem}

  .form-label{
    display:block;
    font-size:.7rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--text-dim);
    margin-bottom:.6rem;
  }

  .form-input{
    width:100%;
    padding:.85rem 1rem;
    background:var(--surface2);
    border:1px solid rgba(255,255,255,.06);
    border-radius:12px;
    color:var(--text);
    font-size:.95rem;
    font-family:inherit;
    outline:none;
    transition:border-color .25s,box-shadow .25s;
  }
  .form-input::placeholder{color:var(--text-dim);opacity:.6}
  .form-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(108,92,231,.15);
  }

  .form-row{
    display:flex;
    gap:1rem;
  }
  .form-row .form-group{flex:1}

  .pay-btn{
    width:100%;
    padding:1rem;
    background:linear-gradient(135deg,var(--accent) 0%,#8b5cf6 100%);
    border:none;
    border-radius:12px;
    color:#fff;
    font-size:.95rem;
    font-weight:600;
    font-family:inherit;
    letter-spacing:.04em;
    cursor:pointer;
    transition:transform .2s,box-shadow .2s;
    box-shadow:0 8px 24px rgba(108,92,231,.35);
  }
  .pay-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(108,92,231,.45);
  }
  .pay-btn:active{
    transform:translateY(0);
  }

  .secure{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:1.2rem;
    font-size:.65rem;
    color:var(--text-dim);
    letter-spacing:.04em;
  }
  .secure svg{
    width:12px;height:12px;
    fill:var(--text-dim);
  }

  /* ── RESPONSIVE ── */
  @media(max-width:880px){
    .container{flex-direction:column;gap:2rem}
    :root{--card-w:360px;--card-h:227px}
    .card-front{padding:22px 24px}
    .card-number{font-size:1.2rem}
    .form-panel{padding:2rem}
  }
  @media(max-width:400px){
    :root{--card-w:300px;--card-h:190px}
    .card-front{padding:18px 20px}
    .card-number{font-size:1rem;letter-spacing:.12em}
    .card-name,.card-expiry{font-size:.75rem}
    .form-panel{padding:1.5rem}
  }
</style>
</head>
<body>

<div class="container">
  <h1>Secure <span>Payment</span></h1>

  <div class="card-scene">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-top">
          <div class="chip">
            <div class="chip-lines"></div>
          </div>
          <div class="brand">
            <div class="brand-circle"></div>
            <div class="brand-circle"></div>
          </div>
        </div>
        <div class="card-number" id="dispNumber">&nbsp;</div>
        <div class="card-bottom">
          <div>
            <div class="card-label">Card Holder</div>
            <div class="card-name" id="dispName">&nbsp;</div>
          </div>
          <div>
            <div class="card-label">Expires</div>
            <div class="card-expiry" id="dispExpiry">&nbsp;</div>
          </div>
        </div>
      </div>
      <div class="card-face card-back">
        <div class="magstripe"></div>
        <div class="back-content">
          <div class="cvv-row">
            <span class="cvv-label">CVC</span>
            <div class="cvv-strip" id="dispCvv">&nbsp;</div>
          </div>
          <div class="back-bottom">
            <div class="back-brand">
              <div class="brand-circle"></div>
              <div class="brand-circle"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-group">
      <label class="form-label" for="cardNumber">Card Number</label>
      <input class="form-input" id="cardNumber" type="text" placeholder="1234 5678 9012 3456" maxlength="19" inputmode="numeric" autocomplete="cc-number">
    </div>
    <div class="form-group">
      <label class="form-label" for="cardName">Card Holder</label>
      <input class="form-input" id="cardName" type="text" placeholder="JOHN DOE" autocomplete="cc-name" style="text-transform:uppercase">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="cardExpiry">Expiry</label>
        <input class="form-input" id="cardExpiry" type="text" placeholder="MM / YY" maxlength="7" inputmode="numeric" autocomplete="cc-exp">
      </div>
      <div class="form-group">
        <label class="form-label" for="cardCvv">CVC</label>
        <input class="form-input" id="cardCvv" type="password" placeholder="•••" maxlength="4" inputmode="numeric" autocomplete="cc-csc">
      </div>
    </div>
    <button class="pay-btn" type="button">Pay Now</button>
    <div class="secure">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      Encrypted &amp; secure
    </div>
  </div>
</div>

<script>
  const card = document.getElementById('card');
  const numInput = document.getElementById('cardNumber');
  const nameInput = document.getElementById('cardName');
  const expInput = document.getElementById('cardExpiry');
  const cvvInput = document.getElementById('cardCvv');
  const dispNumber = document.getElementById('dispNumber');
  const dispName = document.getElementById('dispName');
  const dispExpiry = document.getElementById('dispExpiry');
  const dispCvv = document.getElementById('dispCvv');

  // Card number: group in fours
  numInput.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '').substring(0, 16);
    let formatted = v.replace(/(.{4})/g, '$1 ').trim();
    e.target.value = formatted;
    dispNumber.innerHTML = v ? formatted.split('').map(c =>
      c === ' ' ? '&nbsp;' : c
    ).join('') : '&nbsp;';
  });

  // Name
  nameInput.addEventListener('input', e => {
    const v = e.target.value.toUpperCase();
    e.target.value = v.replace(/[^A-Z\s]/g, '');
    dispName.textContent = e.target.value || '\u00A0';
  });

  // Expiry: MM / YY
  expInput.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '').substring(0, 4);
    if (v.length >= 3) {
      v = v.substring(0, 2) + ' / ' + v.substring(2);
    }
    e.target.value = v;
    dispExpiry.textContent = v || '\u00A0';
  });

  // CVC: flip card
  cvvInput.addEventListener('focus', () => card.classList.add('flipped'));
  cvvInput.addEventListener('blur', () => card.classList.remove('flipped'));
  cvvInput.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
    dispCvv.textContent = e.target.value || '\u00A0';
  });

  // Also flip back if user focuses away from CVC to card number
  numInput.addEventListener('focus', () => card.classList.remove('flipped'));
  nameInput.addEventListener('focus', () => card.classList.remove('flipped'));
  expInput.addEventListener('focus', () => card.classList.remove('flipped'));
</script>
</body>
</html>
