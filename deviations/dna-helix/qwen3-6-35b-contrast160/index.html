<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DNA Helix</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Configuration ---
const PAIR_COUNT = 64;
const STRANDS = 2;
const HELIX_RADIUS = 120;
const VERTICAL_SPACING = 18;
const ROTATION_SPEED = 0.006;
const COLORS = [
    { r: 0, g: 255, b: 255 },   // Cyan
    { r: 255, g: 100, b: 255 }, // Magenta
    { r: 100, g: 255, b: 100 }, // Green
    { r: 255, g: 200, b: 50 }    // Gold
];

// --- DNA Strand Data ---
const strands = [];
for (let i = 0; i < PAIR_COUNT; i++) {
    const phase = (i / PAIR_COUNT) * Math.PI * 2 * 4; // 4 full rotations
    strands.push({
        index: i,
        y: (i - PAIR_COUNT / 2) * VERTICAL_SPACING,
        colorIndex: i % 4,
        // Unzip/Rebuild state
        unzipProgress: 0, // 0=normal, 1=fully unzipped/rebuilt
        unzipPhase: 0,    // 0=unzipping, 1=rebuilding
        unzipActive: false,
        unzipLocalIndex: 0 // 0=top, 1=middle, 2=bottom
    });
}

// --- Replication Events ---
const events = [];
let nextEventTime = 3000 + Math.random() * 5000;
let lastTime = performance.now();

function triggerReplication() {
    const event = {
        time: performance.now(),
        duration: 4000, // 4 seconds for complete cycle
        centerIndex: Math.floor(Math.random() * (PAIR_COUNT - 16)) + 8,
        range: 8 + Math.floor(Math.random() * 4)
    };
    events.push(event);
    nextEventTime = performance.now() + 6000 + Math.random() * 8000;
}

function updateEvents() {
    const now = performance.now();
    
    if (now > nextEventTime) {
        triggerReplication();
    }
    
    for (let i = events.length - 1; i >= 0; i--) {
        const event = events[i];
        const elapsed = now - event.time;
        
        if (elapsed > event.duration) {
            // Reset all affected strands
            for (let j = 0; j < PAIR_COUNT; j++) {
                if (Math.abs(j - event.centerIndex) <= event.range) {
                    strands[j].unzipActive = false;
                    strands[j].unzipProgress = 0;
                    strands[j].unzipPhase = 0;
                    strands[j].unzipLocalIndex = 0;
                }
            }
            events.splice(i, 1);
            continue;
        }
        
        const progress = elapsed / event.duration;
        const normalizedCenter = event.centerIndex / PAIR_COUNT;
        
        for (let j = 0; j < PAIR_COUNT; j++) {
            const dist = Math.abs(j - event.centerIndex) / event.range;
            if (dist <= 1) {
                const strand = strands[j];
                if (progress < 0.5) {
                    // Unzipping phase: 0 -> 1
                    const localProgress = (progress - dist * 0.15) / 0.5;
                    if (localProgress > 0 && localProgress < 1) {
                        strand.unzipActive = true;
                        strand.unzipProgress = Math.max(0, Math.min(1, localProgress));
                        strand.unzipPhase = 0;
                        strand.unzipLocalIndex = dist < 0.33 ? 0 : dist < 0.66 ? 1 : 2;
                    }
                } else {
                    // Rebuilding phase: 1 -> 0
                    const localProgress = 1 - ((progress - 0.5) / 0.5);
                    if (localProgress > 0 && localProgress < 1) {
                        strand.unzipActive = true;
                        strand.unzipProgress = Math.max(0, Math.min(1, localProgress));
                        strand.unzipPhase = 1;
                        strand.unzipLocalIndex = dist < 0.33 ? 2 : dist < 0.66 ? 1 : 0;
                    } else if (localProgress <= 0) {
                        strand.unzipActive = false;
                        strand.unzipProgress = 0;
                    }
                }
            }
        }
    }
}

// --- Stars Background ---
const stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({
        x: Math.random() * 2000 - 1000,
        y: Math.random() * 2000 - 1000,
        size: Math.random() * 1.5 + 0.5,
        brightness: Math.random() * 0.5 + 0.3
    });
}

// --- Rendering ---
let rotation = 0;

function getHelixPosition(index, rotOffset) {
    const phase = (index / PAIR_COUNT) * Math.PI * 2 * 4 + rotOffset;
    const x = Math.cos(phase) * HELIX_RADIUS;
    const y = (index - PAIR_COUNT / 2) * VERTICAL_SPACING;
    const z = Math.sin(phase) * HELIX_RADIUS;
    return { x, y, z, phase };
}

function drawStrand(x, y, z, color, alpha, radius) {
    const depthFactor = (z + HELIX_RADIUS) / (2 * HELIX_RADIUS);
    const brightness = 0.3 + depthFactor * 0.7;
    const r = Math.round(color.r * brightness);
    const g = Math.round(color.g * brightness);
    const b = Math.round(color.b * brightness);
    
    ctx.save();
    ctx.globalAlpha = alpha * brightness;
    
    // Glow effect
    ctx.shadowColor = `rgb(${r},${g},${b})`;
    ctx.shadowBlur = 15 * brightness;
    
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.beginPath();
    ctx.arc(x + W / 2, y + H / 2, radius * (0.5 + depthFactor * 0.5), 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawRung(x1, y1, x2, y2, color, alpha, z1, z2) {
    const depthFactor1 = (z1 + HELIX_RADIUS) / (2 * HELIX_RADIUS);
    const depthFactor2 = (z2 + HELIX_RADIUS) / (2 * HELIX_RADIUS);
    const avgDepth = (depthFactor1 + depthFactor2) / 2;
    const brightness = 0.3 + avgDepth * 0.7;
    const r = Math.round(color.r * brightness);
    const g = Math.round(color.g * brightness);
    const b = Math.round(color.b * brightness);
    
    ctx.save();
    ctx.globalAlpha = alpha * brightness;
    
    ctx.shadowColor = `rgb(${r},${g},${b})`;
    ctx.shadowBlur = 10 * brightness;
    
    const gradient = ctx.createLinearGradient(x1 + W / 2, y1 + H / 2, x2 + W / 2, y2 + H / 2);
    gradient.addColorStop(0, `rgb(${r},${g},${b})`);
    gradient.addColorStop(1, `rgb(${Math.round(r * 0.7)},${Math.round(g * 0.7)},${Math.round(b * 0.7)})`);
    
    ctx.strokeStyle = gradient;
    ctx.lineWidth = 2 + avgDepth * 2;
    ctx.lineCap = 'round';
    
    ctx.beginPath();
    ctx.moveTo(x1 + W / 2, y1 + H / 2);
    ctx.lineTo(x2 + W / 2, y2 + H / 2);
    ctx.stroke();
    
    ctx.restore();
}

function render() {
    const now = performance.now();
    const dt = now - lastTime;
    lastTime = now;
    
    rotation += ROTATION_SPEED * dt;
    updateEvents();
    
    // Clear with dark space background
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, W, H);
    
    // Draw stars
    ctx.save();
    for (const star of stars) {
        const flicker = star.brightness + Math.sin(now * 0.001 + star.x) * 0.1;
        ctx.globalAlpha = Math.max(0, Math.min(1, flicker));
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(
            (star.x / 1000) * W + W / 2,
            (star.y / 1000) * H + H / 2,
            star.size, 0, Math.PI * 2
        );
        ctx.fill();
    }
    ctx.restore();
    
    // Collect all renderable elements with their z-depth for proper sorting
    const renderList = [];
    
    for (let i = 0; i < PAIR_COUNT; i++) {
        const strand = strands[i];
        
        // Calculate positions for this pair
        const pos1 = getHelixPosition(i, rotation);
        const pos2 = getHelixPosition(i, rotation + Math.PI);
        
        // Unzip effect: vertical displacement
        let y1 = pos1.y;
        let y2 = pos2.y;
        
        if (strand.unzipActive) {
            const spread = strand.unzipProgress * VERTICAL_SPACING * 3;
            const localIndex = strand.unzipLocalIndex;
            
            // During unzipping: strands separate vertically
            if (strand.unzipPhase === 0) {
                y1 = pos1.y - spread * (0.3 + localIndex * 0.35);
                y2 = pos2.y + spread * (0.3 + localIndex * 0.35);
            } else {
                // During rebuilding: opposite spread
                y1 = pos1.y + spread * (0.3 + localIndex * 0.35);
                y2 = pos2.y - spread * (0.3 + localIndex * 0.35);
            }
        }
        
        // Store depth for sorting
        renderList.push({
            type: 'strand1',
            z: pos1.z,
            x: pos1.x,
            y: y1,
            color: COLORS[strand.colorIndex],
            alpha: 1,
            radius: 5
        });
        
        renderList.push({
            type: 'strand2',
            z: pos2.z,
            x: pos2.x,
            y: y2,
            color: COLORS[strand.colorIndex],
            alpha: 1,
            radius: 5
        });
        
        renderList.push({
            type: 'rung',
            z: (pos1.z + pos2.z) / 2,
            x1: pos1.x,
            y1: y1,
            x2: pos2.x,
            y2: y2,
            z1: pos1.z,
            z2: pos2.z,
            color: COLORS[strand.colorIndex],
            alpha: 1
        });
    }
    
    // Sort by z-depth (back to front)
    renderList.sort((a, b) => a.z - b.z);
    
    // Render all elements
    for (const item of renderList) {
        if (item.type === 'rung') {
            drawRung(item.x1, item.y1, item.x2, item.y2, item.color, item.alpha, item.z1, item.z2);
        } else {
            drawStrand(item.x, item.y, item.z, item.color, item.alpha, item.radius);
        }
    }
    
    requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
