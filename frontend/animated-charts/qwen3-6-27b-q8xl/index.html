<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Chart Showcase</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --grid-line: #e2e8f0;
            --accent-1: #6366f1; /* Indigo */
            --accent-2: #ec4899; /* Pink */
            --accent-3: #10b981; /* Emerald */
            --accent-4: #f59e0b; /* Amber */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            padding: 4rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            position: relative;
        }

        .chart-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .chart-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .chart-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* SVG Styles */
        svg {
            width: 100%;
            height: auto;
            overflow: visible;
            font-family: inherit;
        }

        .axis-line {
            stroke: var(--grid-line);
            stroke-width: 1;
        }

        .grid-line {
            stroke: var(--grid-line);
            stroke-width: 1;
            stroke-dasharray: 4 4;
        }

        .axis-label {
            fill: var(--text-muted);
            font-size: 12px;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translate(-50%, -120%);
            white-space: nowrap;
        }

        #tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -4px;
            border-width: 4px;
            border-style: solid;
            border-color: rgba(30, 41, 59, 0.95) transparent transparent transparent;
        }

        /* Specific Chart Styles */
        
        /* Bar Chart */
        .bar {
            transition: fill 0.2s;
            cursor: pointer;
        }
        .bar:hover {
            opacity: 0.8;
        }

        /* Line Chart */
        .line-path {
            fill: none;
            stroke: var(--accent-1);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .dot {
            fill: white;
            stroke: var(--accent-1);
            stroke-width: 2;
        }

        /* Donut Chart */
        .donut-segment {
            transition: transform 0.2s, opacity 0.2s;
            transform-origin: center;
            cursor: pointer;
        }
        .donut-segment:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
            .chart-card.full-width {
                grid-column: span 2;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Data Visualization</h1>
    <p class="subtitle">Scroll down to trigger animations</p>
</header>

<div class="container">
    
    <!-- Bar Chart -->
    <div class="chart-card" id="bar-chart-card">
        <div class="chart-header">
            <div>
                <div class="chart-title">Quarterly Revenue</div>
                <div class="chart-subtitle">Growth in millions (USD)</div>
            </div>
        </div>
        <div id="bar-chart-container" style="height: 300px;"></div>
    </div>

    <!-- Donut Chart -->
    <div class="chart-card" id="donut-chart-card">
        <div class="chart-header">
            <div>
                <div class="chart-title">Market Share</div>
                <div class="chart-subtitle">Device distribution</div>
            </div>
        </div>
        <div id="donut-chart-container" style="height: 300px; display: flex; justify-content: center; align-items: center;"></div>
    </div>

    <!-- Line Chart -->
    <div class="chart-card full-width" id="line-chart-card">
        <div class="chart-header">
            <div>
                <div class="chart-title">User Activity</div>
                <div class="chart-subtitle">Daily active users over time</div>
            </div>
        </div>
        <div id="line-chart-container" style="height: 350px;"></div>
    </div>

</div>

<div id="tooltip"></div>

<script>
    // --- Configuration & Data ---
    const COLORS = ['#6366f1', '#ec4899', '#10b981', '#f59e0b'];
    
    const barData = [
        { label: 'Q1', value: 45 },
        { label: 'Q2', value: 62 },
        { label: 'Q3', value: 58 },
        { label: 'Q4', value: 85 }
    ];

    const donutData = [
        { label: 'Desktop', value: 45 },
        { label: 'Mobile', value: 35 },
        { label: 'Tablet', value: 15 },
        { label: 'Other', value: 5 }
    ];

    const lineData = [12, 19, 15, 25, 22, 30, 28, 35, 40, 38, 45, 50];
    const lineLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    // --- Utilities ---
    
    // Easing function for smooth animation
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

    // Tooltip Logic
    const tooltip = document.getElementById('tooltip');
    
    function showTooltip(e, content) {
        tooltip.innerHTML = content;
        tooltip.style.opacity = '1';
        
        const rect = tooltip.getBoundingClientRect();
        const x = e.clientX;
        const y = e.clientY;

        // Boundary checks
        let left = x;
        if (left < rect.width / 2) left = rect.width / 2;
        if (left > window.innerWidth - rect.width / 2) left = window.innerWidth - rect.width / 2;

        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${y}px`;
    }

    function hideTooltip() {
        tooltip.style.opacity = '0';
    }

    // --- Chart Builders ---

    // 1. Bar Chart
    function createBarChart(containerId, data) {
        const container = document.getElementById(containerId);
        const width = container.clientWidth;
        const height = container.clientHeight;
        const padding = { top: 20, right: 20, bottom: 30, left: 40 };
        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        container.appendChild(svg);

        const maxVal = Math.max(...data.map(d => d.value)) * 1.1; // 10% headroom

        // Y-Axis Gridlines & Labels
        const ySteps = 5;
        for (let i = 0; i <= ySteps; i++) {
            const yVal = (maxVal / ySteps) * i;
            const yPos = padding.top + chartHeight - (yVal / maxVal) * chartHeight;
            
            // Grid line
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", padding.left);
            line.setAttribute("x2", width - padding.right);
            line.setAttribute("y1", yPos);
            line.setAttribute("y2", yPos);
            line.classList.add("grid-line");
            svg.appendChild(line);

            // Label
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", padding.left - 10);
            text.setAttribute("y", yPos + 4);
            text.setAttribute("text-anchor", "end");
            text.classList.add("axis-label");
            text.textContent = Math.round(yVal);
            svg.appendChild(text);
        }

        // Bars
        const barWidth = chartWidth / data.length * 0.6;
        const gap = (chartWidth / data.length) * 0.4;

        data.forEach((d, i) => {
            const x = padding.left + (i * (chartWidth / data.length)) + (gap / 2);
            const barHeight = (d.value / maxVal) * chartHeight;
            const y = padding.top + chartHeight - barHeight;

            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", x);
            rect.setAttribute("width", barWidth);
            rect.setAttribute("fill", COLORS[i % COLORS.length]);
            rect.classList.add("bar");
            
            // Initial state for animation
            rect.setAttribute("y", padding.top + chartHeight);
            rect.setAttribute("height", 0);
            rect.setAttribute("rx", 4);

            // Interaction
            rect.addEventListener('mousemove', (e) => showTooltip(e, `<strong>${d.label}</strong><br>$${d.value}M`));
            rect.addEventListener('mouseleave', hideTooltip);

            svg.appendChild(rect);

            // Animate
            setTimeout(() => {
                const duration = 1000;
                const start = performance.now();
                
                function animate(time) {
                    const elapsed = time - start;
                    const progress = Math.min(elapsed / duration, 1);
                    const currentHeight = easeOutCubic(progress) * barHeight;
                    
                    rect.setAttribute("height", currentHeight);
                    rect.setAttribute("y", padding.top + chartHeight - currentHeight);

                    if (progress < 1) requestAnimationFrame(animate);
                }
                requestAnimationFrame(animate);
            }, 100); // Slight delay

            // Label
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x + barWidth / 2);
            text.setAttribute("y", height - 10);
            text.setAttribute("text-anchor", "middle");
            text.classList.add("axis-label");
            text.textContent = d.label;
            svg.appendChild(text);
        });
    }

    // 2. Donut Chart
    function createDonutChart(containerId, data) {
        const container = document.getElementById(containerId);
        const size = Math.min(container.clientWidth, container.clientHeight);
        const width = size;
        const height = size;
        
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        container.appendChild(svg);

        const radius = width / 2 * 0.7; // 70% of half width
        const innerRadius = radius * 0.6;
        const total = data.reduce((acc, curr) => acc + curr.value, 0);
        let cumulativePercent = 0;

        // Center Text
        const textGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        textGroup.setAttribute("transform", `translate(${width/2}, ${height/2})`);
        
        const mainText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        mainText.setAttribute("text-anchor", "middle");
        mainText.setAttribute("dy", "0.35em");
        mainText.setAttribute("font-size", "24");
        mainText.setAttribute("font-weight", "bold");
        mainText.setAttribute("fill", "#1e293b");
        mainText.textContent = "0";
        
        const subText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        subText.setAttribute("text-anchor", "middle");
        subText.setAttribute("dy", "1.8em"); // Push down
        subText.setAttribute("font-size", "12");
        subText.setAttribute("fill", "#64748b");
        subText.textContent = "Total Users";

        textGroup.appendChild(mainText);
        textGroup.appendChild(subText);
        svg.appendChild(textGroup);

        // Draw Segments
        data.forEach((d, i) => {
            const percent = d.value / total;
            const startAngle = cumulativePercent * 2 * Math.PI;
            const endAngle = (cumulativePercent + percent) * 2 * Math.PI;
            
            // Calculate path
            const x1 = width / 2 + radius * Math.cos(startAngle - Math.PI / 2);
            const y1 = height / 2 + radius * Math.sin(startAngle - Math.PI / 2);
            const x2 = width / 2 + radius * Math.cos(endAngle - Math.PI / 2);
            const y2 = height / 2 + radius * Math.sin(endAngle - Math.PI / 2);
            
            const ix1 = width / 2 + innerRadius * Math.cos(endAngle - Math.PI / 2);
            const iy1 = height / 2 + innerRadius * Math.sin(endAngle - Math.PI / 2);
            const ix2 = width / 2 + innerRadius * Math.cos(startAngle - Math.PI / 2);
            const iy2 = height / 2 + innerRadius * Math.sin(startAngle - Math.PI / 2);

            const largeArc = percent > 0.5 ? 1 : 0;

            const pathData = [
                `M ${x1} ${y1}`,
                `A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2}`,
                `L ${ix1} ${iy1}`,
                `A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${ix2} ${iy2}`,
                `Z`
            ].join(" ");

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("fill", COLORS[i % COLORS.length]);
            path.classList.add("donut-segment");
            
            // Interaction
            path.addEventListener('mousemove', (e) => showTooltip(e, `<strong>${d.label}</strong><br>${d.value}%`));
            path.addEventListener('mouseleave', hideTooltip);

            // Initial State (invisible/scaled down)
            path.style.transformOrigin = "center";
            path.style.transform = "scale(0)";
            path.style.transition = "transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)";

            svg.appendChild(path);

            // Animate
            setTimeout(() => {
                path.style.transform = "scale(1)";
            }, i * 150);

            cumulativePercent += percent;
        });

        // Count Up Animation
        const duration = 2000;
        const start = performance.now();
        
        function animateCount(time) {
            const elapsed = time - start;
            const progress = Math.min(elapsed / duration, 1);
            const currentVal = Math.round(easeOutCubic(progress) * total);
            mainText.textContent = currentVal + "k";
            
            if (progress < 1) requestAnimationFrame(animateCount);
        }
        requestAnimationFrame(animateCount);
    }

    // 3. Line Chart
    function createLineChart(containerId, data, labels) {
        const container = document.getElementById(containerId);
        const width = container.clientWidth;
        const height = container.clientHeight;
        const padding = { top: 30, right: 30, bottom: 40, left: 50 };
        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        container.appendChild(svg);

        const maxVal = Math.max(...data) * 1.2;
        const minVal = 0;

        // Gridlines
        const ySteps = 4;
        for (let i = 0; i <= ySteps; i++) {
            const yVal = minVal + (maxVal - minVal) * (i / ySteps);
            const yPos = padding.top + chartHeight - ((yVal - minVal) / (maxVal - minVal)) * chartHeight;
            
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", padding.left);
            line.setAttribute("x2", width - padding.right);
            line.setAttribute("y1", yPos);
            line.setAttribute("y2", yPos);
            line.classList.add("grid-line");
            svg.appendChild(line);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", padding.left - 10);
            text.setAttribute("y", yPos + 4);
            text.setAttribute("text-anchor", "end");
            text.classList.add("axis-label");
            text.textContent = Math.round(yVal);
            svg.appendChild(text);
        }

        // X Axis Labels
        data.forEach((d, i) => {
            const x = padding.left + (i / (data.length - 1)) * chartWidth;
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x);
            text.setAttribute("y", height - 15);
            text.setAttribute("text-anchor", "middle");
            text.classList.add("axis-label");
            text.textContent = labels[i];
            svg.appendChild(text);
        });

        // Create Path Data
        let pathD = "";
        const points = [];
        
        data.forEach((d, i) => {
            const x = padding.left + (i / (data.length - 1)) * chartWidth;
            const y = padding.top + chartHeight - ((d - minVal) / (maxVal - minVal)) * chartHeight;
            points.push({x, y, val: d, label: labels[i]});
            pathD += (i === 0 ? "M" : "L") + ` ${x} ${y}`;
        });

        // Draw Line
        const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
        line.setAttribute("d", pathD);
        line.classList.add("line-path");
        
        // Animation Setup
        const length = line.getTotalLength();
        line.style.strokeDasharray = length;
        line.style.strokeDashoffset = length;
        line.style.transition = "stroke-dashoffset 2s ease-in-out";
        
        svg.appendChild(line);

        // Moving Dot
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("r", 5);
        dot.classList.add("dot");
        dot.style.opacity = 0;
        svg.appendChild(dot);

        // Interaction Layer (Invisible wider path for easier hover)
        const interactionLine = document.createElementNS("http://www.w3.org/2000/svg", "path");
        interactionLine.setAttribute("d", pathD);
        interactionLine.setAttribute("fill", "none");
        interactionLine.setAttribute("stroke", "transparent");
        interactionLine.setAttribute("stroke-width", 20);
        interactionLine.style.cursor = "pointer";
        svg.appendChild(interactionLine);

        // Hover Logic
        interactionLine.addEventListener('mousemove', (e) => {
            const rect = svg.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            
            // Find closest point
            let closest = points[0];
            let minDist = Infinity;
            
            points.forEach(p => {
                const dist = Math.abs(p.x - mouseX);
                if (dist < minDist) {
                    minDist = dist;
                    closest = p;
                }
            });

            // Move dot to closest point
            dot.setAttribute("cx", closest.x);
            dot.setAttribute("cy", closest.y);
            
            showTooltip(e, `<strong>${closest.label}</strong><br>${closest.val} Users`);
        });

        interactionLine.addEventListener('mouseleave', () => {
            dot.style.opacity = 0;
            hideTooltip();
        });

        // Trigger Animation
        setTimeout(() => {
            line.style.strokeDashoffset = 0;
            
            // Animate dot along path
            const duration = 2000;
            const startTime = performance.now();
            
            function animateDot(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                if (progress < 1) {
                    const point = line.getPointAtLength(progress * length);
                    dot.setAttribute("cx", point.x);
                    dot.setAttribute("cy", point.y);
                    dot.style.opacity = 1;
                    requestAnimationFrame(animateDot);
                } else {
                    // Keep dot at end briefly then fade? Or just leave it.
                    // Let's leave it at the end.
                }
            }
            requestAnimationFrame(animateDot);
        }, 100);
    }

    // --- Intersection Observer for Scroll Triggers ---
    
    const observerOptions = {
        threshold: 0.3
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                
                // Identify chart type and render
                const id = entry.target.id;
                if (id === 'bar-chart-card' && !entry.target.dataset.rendered) {
                    createBarChart('bar-chart-container', barData);
                    entry.target.dataset.rendered = "true";
                }
                else if (id === 'donut-chart-card' && !entry.target.dataset.rendered) {
                    createDonutChart('donut-chart-container', donutData);
                    entry.target.dataset.rendered = "true";
                }
                else if (id === 'line-chart-card' && !entry.target.dataset.rendered) {
                    createLineChart('line-chart-container', lineData, lineLabels);
                    entry.target.dataset.rendered = "true";
                }
            }
        });
    }, observerOptions);

    document.querySelectorAll('.chart-card').forEach(card => {
        observer.observe(card);
    });

</script>
</body>
</html>
