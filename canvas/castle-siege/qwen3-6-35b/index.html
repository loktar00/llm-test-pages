<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Siege</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Configuration
        const GROUND_Y_OFFSET = 100;
        const CASTLE_WIDTH = 300;
        const WALL_HEIGHT = 250;
        const TOWER_SPEED = 0.6;
        const RAM_SPEED = 1.2;
        const ARCHER_RATE = 60; // Frames between shots
        const CATAPULT_RATE = 140;
        const WALL_HP_PER_BLOCK = 100;
        const BLOCK_SIZE = 40;

        // State
        let wallHealth = 100;
        let wallBlocks = [];
        let attackers = [];
        let projectiles = [];
        let particles = [];
        let frame = 0;
        let gameState = 'siege'; // siege, breach, repair, reset
        let breachTimer = 0;

        // Colors
        const COLORS = {
            sky: '#1a1a2e',
            ground: '#2e2e42',
            castle: '#5d4037',
            wall: '#7f8c8d',
            wallDark: '#586364',
            attacker: '#e74c3c',
            defender: '#3498db',
            tower: '#8d6e63',
            ram: '#6d4c41',
            text: '#ecf0f1'
        };

        function initWall() {
            wallBlocks = [];
            const startX = width / 2 - CASTLE_WIDTH / 2;
            const cols = Math.floor(CASTLE_WIDTH / BLOCK_SIZE);
            const rows = Math.floor(WALL_HEIGHT / BLOCK_SIZE);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    wallBlocks.push({
                        x: startX + c * BLOCK_SIZE,
                        y: height - GROUND_Y_OFFSET - (r + 1) * BLOCK_SIZE,
                        w: BLOCK_SIZE,
                        h: BLOCK_SIZE,
                        hp: WALL_HP_PER_BLOCK,
                        maxHp: WALL_HP_PER_BLOCK,
                        active: true
                    });
                }
            }
        }

        function spawnUnits() {
            attackers = [];
            const startX = 150;
            // Create Ram
            attackers.push(new BatteringRam(startX + 200, height - GROUND_Y_OFFSET - 15));
            // Create Towers
            for (let i = 0; i < 3; i++) {
                attackers.push(new SiegeTower(startX + i * 250 + 50, height - GROUND_Y_OFFSET - 100));
            }
            // Create Archers
            for (let i = 0; i < 5; i++) {
                attackers.push(new Archer(startX + i * 60 + 50, height - GROUND_Y_OFFSET - 20));
            }
            // Create Catapults
            for (let i = 0; i < 2; i++) {
                attackers.push(new Catapult(startX + i * 500 + 100, height - GROUND_Y_OFFSET - 30));
            }
        }

        // --- Classes ---

        class Projectile {
            constructor(x, y, targetX, targetY, type, owner) {
                this.x = x;
                this.y = y;
                this.type = type; // 'arrow', 'stone'
                this.owner = owner; // 'attacker', 'defender'
                this.active = true;
                this.speed = type === 'stone' ? 6 : 10;
                
                // Calculate trajectory
                const dx = targetX - x;
                const dy = targetY - y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;
                
                if (type === 'stone') {
                    this.gravity = 0.2;
                    this.vy = -5 - (Math.random() * 3); // Lob
                    this.targetX = targetX;
                    this.startX = x;
                    this.angle = 0;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.type === 'stone') {
                    this.vy += this.gravity;
                    this.angle += 0.1;
                }

                // Ground collision
                if (this.y > height - GROUND_Y_OFFSET) {
                    this.active = false;
                    createExplosion(this.x, height - GROUND_Y_OFFSET, 5, COLORS.wall);
                }

                // Out of bounds
                if (this.x < -50 || this.x > width + 50) {
                    this.active = false;
                }

                // Wall Collision
                let hitWall = false;
                for (let block of wallBlocks) {
                    if (block.active && 
                        this.x > block.x && this.x < block.x + block.w &&
                        this.y > block.y && this.y < block.y + block.h) {
                        
                        block.hp -= this.type === 'stone' ? 40 : 15;
                        if (block.hp <= 0) {
                            block.active = false;
                            createDebris(block.x, block.y, block.w, block.h);
                        }
                        hitWall = true;
                        break;
                    }
                }

                // Unit Collision (Defenders hit by attackers, Attackers hit by defenders)
                if (this.type === 'arrow') {
                    // Simple hit check against units
                    const enemies = this.owner === 'attacker' ? defenders : attackers;
                    for (let u of enemies) {
                        if (Math.abs(this.x - u.x) < 15 && Math.abs(this.y - (u.y - 20)) < 15) {
                            u.takeDamage(10);
                            this.active = false;
                            return;
                        }
                    }
                }
                
                // Ram collision with wall
                if (this.type === 'ram' && hitWall) {
                    // Handled in Ram class for better control
                }
            }

            draw() {
                ctx.fillStyle = '#000';
                if (this.type === 'arrow') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                    // Trail
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
                    ctx.stroke();
                } else {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.fillRect(-4, -4, 8, 8);
                    ctx.restore();
                }
            }
        }

        class Unit {
            constructor(x, y, team) {
                this.x = x;
                this.y = y;
                this.team = team; // 'attacker' or 'defender'
                this.hp = 100;
                this.dead = false;
                this.state = 'move'; // move, attack, idle
                this.cooldown = 0;
            }

            takeDamage(amount) {
                this.hp -= amount;
                if (this.hp <= 0) {
                    this.dead = true;
                    createDebris(this.x, this.y, 10, 20, COLORS.attacker);
                }
            }

            shoot(targetX, targetY, type) {
                projectiles.push(new Projectile(this.x, this.y - 15, targetX, targetY, type, this.team));
                this.cooldown = ARCHER_RATE;
            }
        }

        class Archer extends Unit {
            constructor(x, y) {
                super(x, y, 'attacker');
                this.range = 600;
            }

            update() {
                if (this.dead) return;
                if (this.cooldown > 0) this.cooldown--;

                // Find target (any defender or wall)
                let target = null;
                let minDist = Infinity;

                // Check defenders
                for (let d of defenders) {
                    if (!d.dead) {
                        const dist = Math.abs(d.x - this.x);
                        if (dist < minDist && dist < 800) {
                            minDist = dist;
                            target = d;
                        }
                    }
                }

                // Check wall if close
                if (minDist > 500) {
                    const wallX = width / 2;
                    if (Math.abs(wallX - this.x) < 600) {
                        target = { x: wallX, y: height - GROUND_Y_OFFSET - 100 };
                    }
                }

                if (target) {
                    if (this.cooldown <= 0) {
                        this.shoot(target.x, target.y, 'arrow');
                    }
                }
            }

            draw() {
                if (this.dead) return;
                ctx.fillStyle = COLORS.attacker;
                // Body
                ctx.fillRect(this.x - 5, this.y - 20, 10, 20);
                // Head
                ctx.beginPath();
                ctx.arc(this.x, this.y - 25, 4, 0, Math.PI * 2);
                ctx.fill();
                // Bow arm
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 15);
                ctx.lineTo(this.x + (this.team === 'attacker' ? 10 : -10), this.y - 10);
                ctx.stroke();
            }
        }

        class Defender extends Unit {
            constructor(x, y) {
                super(x, y, 'defender');
            }

            update() {
                if (this.dead) return;
                if (this.cooldown > 0) this.cooldown--;

                // Shoot at attackers
                let target = null;
                let minDist = Infinity;

                for (let a of attackers) {
                    if (!a.dead) {
                        const dist = Math.abs(a.x - this.x);
                        if (dist < minDist && dist < 700) {
                            minDist = dist;
                            target = a;
                        }
                    }
                }

                if (target) {
                    if (this.cooldown <= 0) {
                        this.shoot(target.x, target.y, 'arrow');
                    }
                }
            }

            draw() {
                if (this.dead) return;
                ctx.fillStyle = COLORS.defender;
                // Body
                ctx.fillRect(this.x - 5, this.y - 20, 10, 20);
                // Head
                ctx.beginPath();
                ctx.arc(this.x, this.y - 25, 4, 0, Math.PI * 2);
                ctx.fill();
                // Helmet
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(this.x - 5, this.y - 30, 10, 5);
            }
        }

        class SiegeTower extends Unit {
            constructor(x, y) {
                super(x, y, 'attacker');
                this.y = y; // Base Y
                this.height = 80;
                this.moving = true;
            }

            update() {
                if (this.dead) return;

                // Move forward
                if (this.x < width / 2 - CASTLE_WIDTH / 2 - 20) {
                    this.x += TOWER_SPEED;
                } else {
                    this.moving = false;
                }

                // Drop archers
                if (frame % 120 === 0) {
                    defenders.push(new Defender(this.x + 10, this.y - 100));
                    defenders[defenders.length-1].team = 'attacker'; // Convert to attacker force
                }
            }

            draw() {
                if (this.dead) return;
                ctx.fillStyle = COLORS.tower;
                // Base
                ctx.fillRect(this.x - 20, this.y - 10, 40, 10);
                // Tower
                ctx.fillRect(this.x - 15, this.y - 90, 30, 80);
                // Top
                ctx.fillRect(this.x - 18, this.y - 95, 36, 5);
                // Windows
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x - 10, this.y - 80, 5, 10);
                ctx.fillRect(this.x + 5, this.y - 80, 5, 10);
                
                // Wheels
                ctx.fillStyle = '#3e2723';
                ctx.beginPath();
                ctx.arc(this.x - 15, this.y, 8, 0, Math.PI*2);
                ctx.arc(this.x + 15, this.y, 8, 0, Math.PI*2);
                ctx.fill();
            }
        }

        class BatteringRam extends Unit {
            constructor(x, y) {
                super(x, y, 'attacker');
                this.y = y;
            }

            update() {
                if (this.dead) return;

                // Move
                if (this.x < width / 2 - CASTLE_WIDTH / 2) {
                    this.x += RAM_SPEED;
                }

                // Ram the wall
                if (this.x >= width / 2 - CASTLE_WIDTH / 2 && this.x < width / 2 - CASTLE_WIDTH / 2 + 20) {
                    if (frame % 30 === 0) {
                        // Damage wall directly
                        for (let block of wallBlocks) {
                            if (block.active && 
                                block.x < width / 2 - CASTLE_WIDTH / 2 + BLOCK_SIZE &&
                                block.x + block.w > width / 2 - CASTLE_WIDTH / 2) {
                                block.hp -= 5;
                                if (block.hp <= 0) {
                                    block.active = false;
                                    createDebris(block.x, block.y, block.w, block.h);
                                }
                                createDebris(this.x, this.y - 20, 5, 5, '#aaa'); // Sparks
                            }
                        }
                    }
                }
            }

            draw() {
                if (this.dead) return;
                ctx.fillStyle = COLORS.ram;
                // Body
                ctx.fillRect(this.x - 5, this.y - 30, 10, 30);
                // Head
                ctx.fillStyle = '#555';
                ctx.fillRect(this.x + (this.x < width/2 ? 0 : -10), this.y - 35, 10, 10);
                // Legs (animated)
                ctx.fillStyle = '#4e342e';
                const offset = Math.sin(frame * 0.2) * 5;
                ctx.fillRect(this.x - 8, this.y - 5 + offset, 4, 5);
                ctx.fillRect(this.x + 4, this.y - 5 - offset, 4, 5);
            }
        }

        class Catapult extends Unit {
            constructor(x, y) {
                super(x, y, 'attacker');
                this.y = y;
                this.lobTimer = 0;
            }

            update() {
                if (this.dead) return;

                if (this.lobTimer <= 0) {
                    // Lob stone at wall
                    const targetX = width / 2;
                    const targetY = height - GROUND_Y_OFFSET - 100;
                    projectiles.push(new Projectile(this.x, this.y - 20, targetX, targetY, 'stone', this.team));
                    this.lobTimer = CATAPULT_RATE;
                } else {
                    this.lobTimer--;
                }
            }

            draw() {
                if (this.dead) return;
                ctx.fillStyle = '#5d4037';
                // Base
                ctx.beginPath();
                ctx.moveTo(this.x - 15, this.y);
                ctx.lineTo(this.x - 10, this.y - 15);
                ctx.lineTo(this.x + 10, this.y - 15);
                ctx.lineTo(this.x + 15, this.y);
                ctx.fill();
                // Arm
                ctx.save();
                ctx.translate(this.x, this.y - 15);
                ctx.rotate(Math.sin(frame * 0.1) * 0.2);
                ctx.fillRect(0, -5, 20, 5);
                // Basket
                ctx.fillRect(18, -10, 5, 10);
                ctx.restore();
            }
        }

        // --- Particle System ---

        function createDebris(x, y, w, h, color = COLORS.wall) {
            const count = 8;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + w/2 + (Math.random() - 0.5) * w,
                    y: y + h/2 + (Math.random() - 0.5) * h,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 5,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function createExplosion(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: -Math.random() * 3,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life -= 0.02;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1.0;
            }
        }

        // --- Game Logic ---

        let defenders = [];

        function resetGame() {
            wallHealth = 100;
            attackers = [];
            defenders = [];
            projectiles = [];
            particles = [];
            gameState = 'siege';
            
            // Build Wall
            initWall();
            
            // Spawn Defenders
            for (let i = 0; i < 8; i++) {
                defenders.push(new Defender(width/2 + (Math.random() - 0.5) * 200, height - GROUND_Y_OFFSET - 20));
            }

            // Spawn Attackers
            spawnUnits();
        }

        function checkWinCondition() {
            // Check if wall is breached
            let wallBreached = false;
            for (let block of wallBlocks) {
                if (!block.active) {
                    wallBreached = true;
                    break;
                }
            }

            // Check if attackers are repelled (all dead)
            const activeAttackers = attackers.filter(a => !a.dead).length;
            
            if (wallBreached || activeAttackers === 0) {
                if (gameState === 'siege') {
                    gameState = 'breach';
                    breachTimer = 120; // 2 seconds before reset
                }
            }

            // Spawn reinforcements if low
            if (gameState === 'siege') {
                if (attackers.length < 3 && Math.random() < 0.01) spawnUnits();
                if (defenders.length < 5 && Math.random() < 0.01) {
                     defenders.push(new Defender(width/2 + (Math.random() - 0.5) * 100, height - GROUND_Y_OFFSET - 20));
                }
            }
        }

        function update() {
            frame++;
