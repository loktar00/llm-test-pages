<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>n-body Stable sim</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100;width:100;overflow:hidden;background:#020518;font-family:system-ui,Helvetica,Verdana,sans-serif}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#ui{position:fixed;bottom:20px;left:20px;color:#fff;font-size:13px;pointer-events:none;font-weight:300;letter-spacing:2px}
#ui .label{color:#9fbad6;font-size:10px;text-transform:uppercase;margin-bottom:6px}
#ui .name{color:#fff;font-size:14px;font-weight:600}
#progress{position:fixed;bottom:20px;right:20px;width:180px;color:#fff;font-size:13;pointer-events:none;text-align:right;font-weight:300}
#progress .label{color:#9fbad6;font-size:10;text-transform:uppercase;margin-bottom:6px}
.bar-bg{width:100;height:2px;background:rgba(255,255,255,0.15);margin-left:auto;transition:width 2s linear}
.bar-fg{height:100%;background:rgba(255,255,255,0.8);transition:width 0.5s linear ease-out}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="label">Stable Simulation</div>
  <div class="name" id="name">Solar System</div>
</div>
<div id="progress">
  <div class="label">Cycle</div>
  <div class="bar-bg"><div class="bar-ff" id="bar" style="width:0%"></div></div>
</div>
<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const nameEl = document.getElementById('name');
const barEl = document.getElementById('bar');

let W=0, H=0, CX=0, CY=0, SCALE=1;
let dpr=1, dprSqrt=1;
let stars=[];
let bodies=[];
let currentScene=0;
let sceneTime=0;
const sceneDuration=3;
const SCENE_NAMES=['Solar System','Sun · Earth · Moon','Figure-Eight'];

function initStars(){
 stars.length=0;
 const count=400;
 for(let i=0;i<count;i++){
  const r=Math.random();
  let radius;
  if(r<0.7) radius=Math.random()*0.5+0.2;
  else if(r<0.95) radius=Math.random()*0.9+0.5;
  else radius=Math.random()*2+1.5;
  stars.push({
   x:Math.random(),
   y:Math.random(),
   radius:radius,
   brightness:Math.random()*0.8+0.2,
   phase:Math.random()*Math.PI*2,
   speed:Math.random()*0.02+0.005
  });
 }
}

function resize(){
 dpr=window.devicePixelRatio||1;
 const w=window.innerWidth, h=window.innerHeight;
 canvas.width=w*dpr;
 canvas.height=h*dpr;
 canvas.style.width=w+'px';
 canvas.style.height=h+'px';
 ctx.setTransform(1,0,0,1,0,0);
 ctx.scale(dpr,dpr);
 W=w; H=h; CX=W/2; CY=H/2;
 const baseScale=Math.min(W,H);
 Scale=Math.pow(baseScale/700, 1.7)*0.55+0.35;
 dprSqrt=Math.sqrt(dpr);
 initStars();
}

function setupScene(index){
 bodies.length=0;
 sceneTime=0;
 if(index===0) setupSolar();
 if(index===1) setupSEM();
 if(index===2) setupFigure8();
 nameEl.textContent=SCENE_NAMES[index];
}

function setupSolar(){
 const sun={
  name:'Sun',
  x:0, y:0, vx:0, vy:0,
  mass:100,
  radius:24,
  color:'#fff8b0',
  glow:'#ffa500',
  trail:[],
  maxTrail:60
 };
 bodies.push(sun);
 const planetData=[
  [40, 0, 0, 2.65, 1.4, '#0080c8', 6],
  [72, 0, 0, 1.86, 0.4, '#ff8c00', 5],
  [102, 0, 0, 1.56, 0.3, '#00ffaa', 4],
  [132, 0, 0, 1.37, 0.7, '#ff5599', 3],
  [160, 0, 0, 1.22, 1, '#aa00ff', 8],
  [180, 0, 0, 1.10, 2, '#ffaa00', 7]
 ];
 for(let i=0;i<planetData.length;i++){
  const d=planetData[i];
  const b={
   name:'Planet '+((i+1)),
   x:d[0], y:0,
   vx:0, vy:d[3]*Math.sqrt(1/d[0])*Math.sqrt(100),
   mass:d[4],
   radius:d[6],
   color:d[5],
   glow:d[5],
   trail:[],
   maxTrail:150
  };
  bodies.push(b);
 }
}

function setupSEM(){
 const sun={
  name:'Sun',
  x:0, y:0, vx:0, vy:0,
  mass:100,
  radius:24,
  color:'#fff8b0',
  glow:'#ffa500',
  trail:[],
  maxTrail:60
 };
 bodies.push(sun);
 const earth={
  name:'Earth',
  x:80, y:0, vx:0, vy:Math.sqrt(100/80)*1.0,
  mass:10,
  radius:10,
  color:'#0088ee',
  glow:'#0088ee',
  trail:[],
  maxTrail:150
 };
 bodies.push(earth);
 const moon={
  name:'Moon',
  x:82.5, y:0,
  vx:0, vy:1.15 + Math.sqrt(10/2.5)*1.0*0.85,
  mass:0.4,
  radius:3,
  color:'#bbbbcc',
  glow:'#bbbbcc',
  trail:[],
  maxTrail:80
 };
 bodies.push(moon);
}

function setupFigure8(){
 bodies.length=0;
 const r=2;
 const omega=Math.sqrt((r*r+36)/8);
 const m=2.45;
 const vx=-0.5;
 const vy=-0.5;
 const positions=[
  {x: r*omega-r, y:0, vx:0, vy:-omega+r},
  {x: -r*omega-r, y:0, vx:0, vy:omega+r},
  {x: 0, y:0, vx:0, vy:0}
 ];
 const colors=['#0080ff','#00ffaa','#00ccff'];
 for(let i=0;i<3;i++){
  const p=positions[i];
  const b={
   name:'B'+(i+1),
   x:p.x*60, y:p.y*60,
   vx:vx*60, vy:vy*60,
   mass:m,
   radius:9,
   color:colors[i],
   glow:colors[i],
   trail:[],
   maxTrail:250
  };
  bodies.push(b);
 }
}

function physics(){
 const n=bodies.length;
 const G=0.05;
 const dt=0.25;
 const sub=4;
 const subdt=dt/sub;
 
 for(let s=0;s<sub;s++){
  const ax=new Array(n);
  const ay=new Array(n);
  for(let i=0;i<n;i++){ax[i]=0;ay[i]=0;}
  
  for(let i=0;i<n;i++){
   for(let j=i+1;j<n;j++){
    const b1=bodies[i], b2=bodies[j];
    const dx=b2.x-b1.x, dy=b2.y-b1.y;
    const dist=Math.sqrt(dx*dx+dy*dy)+0.001;
    const f=G/dist/dist/dist;
    const fx=f*dx, fy=f*dy;
    ax[i]+=fx*b2.mass;
    ay[i]+=fy*b2.mass;
    ax[j]-=fx*b1.mass;
    ay[j]-=fx*b1.mass;
    ay[j]-=fy*b1.mass;
   }
  }
  
  for(let i=0;i<n;i++){
   bodies[i].vx+=ax[i]*subdt;
   bodies[i].vy+=ay[i]*subdt;
   bodies[i].x+=bodies[i].vx*subdt;
   bodies[i].y+=bodies[i].vy*subdt;
   bodies[i].trail.push({x:bodies[i].x, y=bodies[i].y});
   if(bodies[i].trail.length>bodies[i].maxTrail) bodies[i].trail.shift();
  }
 }
}

function drawStars(t){
 const twinkle=0.7+0.3*Math.sin(t*2);
 ctx.save();
 for(let i=0;i<stars.length;i++){
  const s=stars[i];
  const x=s.x*W, y=s.y*H;
  const twink=Math.sin(s.phase+t*s.speed)*0.5+0.5;
  const b=s.brightness*(0.5+0.5*twinkle)*twink;
  const alpha=Math.max(0.5, b);
  ctx.globalAlpha=alpha;
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(x, y, s.radius, 0, Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
 ctx.globalAlpha=1;
}

function drawShootingStar(t){
 if(Math.random()>0.8) return;
 const angle=Math.random()*Math.PI*0.5+Math.PI*0.25;
 const len=80+Math.random()*40;
 const sx=Math.random()*W;
 const sy=Math.random()*H;
 ctx.strokeStyle='rgba(255,255,255,0.6)';
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(sx, sy);
 ctx.lineTo(sx+Math.cos(angle)*len, sy+Math.sin(angle)*len);
 ctx.stroke();
}

function draw(t){
 const f=0.1;
 ctx.fillStyle=`rgba(6, 4, 20, ${f})`;
 ctx.fillRect(0, 0, W, H);
 drawStars(t);
 drawShootingStar(t);
 ctx.save();
 ctx.translate(CX, CY);
 ctx.scale(Scale, Scale);
 ctx.globalCompositeOperation='lighter';
 ctx.lineCap='round';
 ctx.lineJoin='round';
 for(let b=0;b<bodies.length;b++){
  const body=bodies[b];
  const tr=body.trail;
  if(tr.length<2) continue;
  ctx.globalAlpha=0.55;
  ctx.strokeStyle=body.glow;
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(tr[0].x, tr[0].y);
  for(let i=1;i<tr.length;i++) ctx.lineTo(tr[i].x, tr[i].y);
  ctx.stroke();
  ctx.globalAlpha=1;
  ctx.lineWidth=0.5;
  ctx.beginPath();
  ctx.moveTo(tr[0].x, tr[0].y);
  for(let i=1;i<tr.length;i++) ctx.lineTo(tr[i].x, tr[i].y);
  ctx.stroke();
 }
 for(let b=0;b<bodies.length;b++){
  const body=bodies[b];
  ctx.globalAlpha=1;
  ctx.fillStyle=body.glow;
  ctx.beginPath();
  ctx.arc(body.x, body.y, body.radius*2, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=0.4;
  ctx.beginPath();
  ctx.arc(body.x, body.y, body.radius*4, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=body.color;
  ctx.beginPath();
  ctx.arc(body.x, body.y, body.radius, 0, Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
 ctx.globalCompositeOperation='source-over';
}

let lastT=0;
function loop(t){
 const dt=Math.min((t-lastT)/1000, 0.05);
 lastT=t;
 if(dt>0) for(let i=0;i<3;i++) physics();
 draw(t);
 sceneTime+=dt;
 if(sceneTime>=sceneDuration){
  sceneTime=0;
  currentScene=(currentScene+1)%3;
  setupScene(currentScene);
 }
 barEl.style.width=(sceneTime/sceneDuration*100)+'%';
 requestAnimationFrame(loop);
}

resize();
window.addEventListener('resize', resize);
setupScene(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
