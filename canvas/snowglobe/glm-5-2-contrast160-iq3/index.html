<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snow Globe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100;overflow:hidden;background:#050008;font-family:system-serif;-webkit-font-smoothing:antialiased}
#scene{display:block;width:100%}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
'use strict';
(function(){
const canvas=document.getElementById('scene');
let ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
let globeR=0,cx=0,cy=0;
let snow=[];
let settledSnow={};
const trees=[];
const lights=[];
let shakeTime=-1;
let shakeIntensity=0;
let nextShake=20;
let settledSnowCount=0;
let frameCount=0;
let bgGfx=null,bgCanvas=null;
const TURULEN_CACHE={};
const TURULEN_PIT=256;
let turbulenceImg=null;
let turbulenceCanvas=null;

function turbulence(x,y,z){
  return (
    noise3(x,y,z) +
    noise3(2*x+13,2*y+97,2*z+5)*0.5 +
    noise3(4*x+5,4*y+89,4*z+71)*0.25 +
    noise3(8*x+7,8*y+13,8*z+19)*0.125
  ) * 0.75;
}

function noise3(x,y,z){
  x+=10000;y+=10000;z+=10000;
  x=(x|0);y=(y|0);z=(z|0);
  x=(x*1681+y*2531+z*1481)%(TURULEN_PIT);
  y=(y*1481+x*1681+z*2531)%(TURULEN_PIT);
  z=(z*1481+y*2531+x*1681)%(TURULEN_PIT);
  return TURULEN_CACHE[x*1681+y*2531+z*1481%TURULEN_PIT]/TURULEN_PIT-0.5;
}
TURULEN_CACHE[TURULEN_PIT*TURULEN_PIT*TURULEN_PIT-1]=0;

function initNoise(){
  for(let i=0;i<256*256*256;i++){
    TURULEN_CACHE[i]=Math.random()-0.5;
  }
}

function buildTrees(){
  trees.length=0;
  trees.push({x:-150,y:50,trunkH:60,spine:0,phase:0.5});
  trees.push({x:150,y:50,trunkH:60,spine:0,phase:0.5});
  trees.push({x:-50,y:90,trunkH:50,spine:0,phase:0.7});
  trees.push({x:50,y:90,trunkH:50,spine:0,phase:0.7});
  trees.push({x:-220,y:-5,trunkH:70,spine:0,phase:0.3});
  trees.push({x:220,y:-5,trunkH:70,spine:0.3});
  trees.push({x=-80,y:-10,trunkH:40,spine=0,phase:0.8});
  trees.push({x:80,y=-10,trunkH:40,spine:0.8});
  trees.push({x:180,y:60,trunkH:60,spine:0,phase:0.4});
  trees.push({x=-180,y:60,trunkH:60,spine=0.5,phase:0.2});
}

function initLights(){
  lights.length=0;
  lights.push({x:-80,y:-50,w:24,h:6.4,phase:0});
  lights.push({x:-80,y:-50,w:24,h:6.4,phase:0.5});
  lights.push({x:80,y:-50,w:24,h:6.4,phase:0.25});
  lights.push({x:-80,y:25,w:18,h:5,phase:0.7});
  lights.push({x:80,y:25,w:18,h:5,phase:0.15});
  lights.push({x:0,y:-50,w:12,h:5,phase:0.35});
  lights.push({x=-80,y:-80,w:14,h:6,phase:0.85});
  lights.push({x=80,y=-80,w:14,h:6,phase:0.45});
}

const settleThreshold=0.04;
const settleDampThreshold=0.04;
const settleSnowCapacity=2000;

function initSnow(){
  snow.length=0;
  settledSnowCount=0;
  for(let i=0;i<1600;i++){
    addSnowParticle();
  }
}

function addSnowParticle(){
  if(snow.length<1500){
    const angle=Math.random()*2*Math.PI;
    const r=Math.random()*Math.sqrt(Math.random())*0.85*globeR;
    snow.push({
      x:Math.cos(angle)*r,
      y:(Math.random()*2-1)*r*0.4-30,
      vx:(.random()-0.5)*0.2,
      vy:0,
      r:Math.random()*0.6+0.7,
      a:(random()*0.4+0.6),
      settled:false,
      s:0,
      life:0,
    });
  }
}

function init(){
  initNoise();
  buildTrees();
  initLights();
  initSnow();
  setupTurbulence();
}

function setupTurbulence(){
  turbulenceCanvas=document.createElement('canvas');
  turbulenceCanvas.width=128;
  turbulenceCanvas.height=128;
  const tctx=turbulenceCanvas.getContext('2d');
  const img=tctx.createImageData(128,128);
  for(let y=0;y<128;y++){
    for(let x=0;x<128;x++){
      const n=turbulence(x/32,y/32,0.5);
      const v=Math.floor((n*0.5+0.5)*255);
      const idx=(y*128+x)*4;
      img.data[idx]=v;
      img.data[idx+1]=v;
      img.data[idx+2]=v;
      img.data[idx+3]=255;
    }
  }
  tctx.putImageData(img,0,0);
  turbulenceImg=turbulenceCanvas;
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;
  H=window.innerHeight;
  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.scale(DPR,DPR);
  cx=W/2;
  cy=H/2;
  globeR=Math.min(W,H)*0.4;
  rebuildBackground();
}

function rebuildBackground(){
  bgCanvas=document.createElement('canvas');
  bgCanvas.width=W;
  bgCanvas.height=H;
  const bgCtx=bgCanvas.getContext('2d');
  const grad=bgCtx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));
  grad.addColorStop(0,'#1d0e1e');
  grad.addColorStop(0.5,'#0a0610');
  grad.addColorStop(1,'#000');
  bgCtx.fillStyle=grad;
  bgCtx.fillRect(0,0,W,H);
  for(let i=0;i<200;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*Math.sqrt(Math.random())*Math.max(W,H)*0.5;
    const x=W/2+Math.cos(a)*r;
    const y=H/2+Math.sin(a)*r;
    const s=Math.random()*1.8;
    bgCtx.fillStyle=`rgba(255,${200+Math.random()*55|0},${180+Math.random()*30|0},${Math.random()*0.12)`;
    bgCtx.fillRect(x,y,s,s);
  }
  bgGfx=bgCanvas;
}

function updateShake(){
  if(shakeTime>=0){
    shakeTime+=1/60;
    const dur=4;
    if(shakeTime>=dur){
      shakeTime=-1;
      shakeIntensity=0;
      return;
    }
    const t=shakeTime/dur;
    const env=Math.sin(t*Math.PI)*Math.exp(-t*0.5);
    shakeIntensity=env*1;
    const wobble=Math.sin(shakeTime*22)*shakeIntensity*7;
    const wobble2=Math.cos(shakeTime*22)*shakeIntensity*7;
    trees.forEach(tree=>{
      tree.phase+=shakeIntensity*0.2;
    });
  }
  if(frameCount/60>=nextShake){
    nextShake+=20;
    triggerShake();
  }
}

function triggerShake(){
  shakeTime=0;
  shakeIntensity=1;
  snow.forEach(p=>{
    if(p.life<2.5){
      p.life=2.5;
      if(p.s===1){
        p.s=0;
        settledSnowCount--;
        if(setledSnowCount<0)setledSnowCount=0;
      }
    }
  });
  for(let key in settledSnow){
    const arr=settledSnow[key];
    for(let i=0;i<arr.length;i++){
      arr[i].life=2.5;
      arr[i].s=0;
    }
    if(arr.length>setledSnowCapacity*0.5 && Math.random()<0.8){
      settledSnow[key]=arr.filter(s=>s.s!==1);
    }
  }
}

function physicsStep(p,dt){
  if(p.s===1)return;
  
  const gravity=0.22*dt;
  const damping=Math.pow(0.97,dt);
  
  // turbulence
  const n=turbulence(p.x*0.4+frameCount*0.01,p.y*0.4,p.x*0.01);
  const n2=turbulence(p.x*0.6+100,p.y*0.6-50,p.x*0.02+50)*0.5;
  
  p.vx+=n*0.08*shakeIntensity*0.7*0 + shakeIntensity*0.2*(n2);
  p.vy+=gravity;
  
  // viscosity
  p.vx*=damping;
  p.vy*=Math.pow(0.99,dt);
  
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  
  // Glass boundary
  const r=Math.sqrt(p.x*p.x+p.y*p.y);
  if(r>globeR*0.94){
    const nx=p.x/r;
    const ny=p.y/r;
    // refract at glass edge
    const dot=p.vx*nx+p.vy*ny;
    p.vx-=dot*nx*0.6;
    p.vy-=dot*ny*0.6;
    p.vx*=0.6;
    p.vy*=0.6;
    const newR=globeR*0.94-p.r*0.5-0.5;
    p.x=ny*newR;
    p.y=ny*newR;
  }
  
  // ground collision
  const groundY=globeR*0.6 - Math.abs(p.x)*0.2;
  if(p.y>groundY && p.vy>0){
    p.y=groundY;
    p.vy*=-0.2;
    p.vx*=0.5;
  }
  
  // settle on trees/cabin
  trees.forEach(tree=>{
    if(settleOnTree(p,tree))p.s=1;
  });
  if(settleOnCabin(p))p.s=1;
  
  if(p.life>0)p.life-=dt*0.5;
}

function settleOnTree(p,t){
  const treeTop=t.y-t.trunkH-12;
  const treeBottom=t.y-t.trunkH+8;
  if(p.y>treeBottom && p.y<treeTop){
    if(Math.abs(p.x-t.x)<3){
      return true;
    }
  }
  return false;
}

function settleOnCabin(p){
  // roof level
  const ry=-50;
  if(p.y>ry+0 && p.y<ry+8){
    if(Math.abs(p.x)<80){
      return true;
    }
  }
  return false;
}

function renderSnow(){
  // settled snow
  for(let key in settledSnow){
    const arr=settledSnow[key];
    if(arr.length>0){
      const parts=key.split('_');
      const x=parseFloat(parts[0]);
      const y=parseFloat(parts[1]);
      ctx.beginPath();
      for(let i=0;i<arr.length;i++){
        ctx.moveTo(x+arr[i].x+arr[i].r,y+arr[i].y+arr[i].r);
        ctx.arc(x+arr[i].x,y+arr[i].y,arr[i].r,0,Math.PI*2);
      }
      ctx.fillStyle='rgba(245,250,255,0.9)';
      ctx.fill();
    }
  }
  // falling snow
  ctx.beginPath();
  for(let i=0;i<snow.length;i++){
    const p=snow[i];
    ctx.moveTo(p.x+cx+p.r,p.y+cy+p.r);
    ctx.arc(p.x+cx,p.y+cy,p.r,0,Math.PI*2);
  }
  ctx.fillStyle='rgba(236,245,255,0.85)';
  ctx.fill();
}

function renderTrees(){
  trees.forEach(tree=>{
    renderTree(tree);
  });
}

function renderTree(tree){
  ctx.save();
  // sway
  const phase=tree.phase+frameCount*0.01;
  const sway=Math.sin(phase)*0.1*shakeIntensity;
  ctx.translate(tree.x+cx+sway,tree.y+cy);
  
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0,20,10,5,0,0,Math.PI*2);
  ctx.fill();
  
  // trunk
  const trunkGrad=ctx.createLinearGradient(-5,0,5,-tree.trunkH);
  trunkGrad.addColorStop(0,'#3a2518');
  trunkGrad.addColorStop(1,'#5a451a');
  ctx.fillStyle=trunkGrad;
  ctx.beginPath();
  ctx.rect(-2,-tree.trunkH,4,tree.trunkH);
  ctx.fill();
  
  // foliage
  ctx.fillStyle='rgba(20,15,12,0.2)';
  for(let i=0;i<tree.trunkH;i++){
    const y=-tree.trunkH+i*4;
    const w=10+Math.sin(i*0.7+tree.phase)*2+shakeIntensity*4;
    ctx.beginPath();
    ctx.ellipse(0,y,w,8,0,0,Math.PI*2);
    ctx.fill();
  }
  
  // snow on top of foliage
  ctx.fillStyle='rgba(236,245,255,0.8)';
  for(let i=0;i<tree.trunkH;i++){
    const y=-tree.trunkH+i*4;
    const w=10+Math.sin(i*0.7+tree.phase)*2+shakeIntensity*4;
    ctx.beginPath();
    ctx.ellipse(0,y,w*0.8,3.5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function renderCabin(){
  // back wall
  ctx.fillStyle='#5a2c12';
  ctx.beginPath();
  ctx.rect(cx-70,cy-50,140,80);
  ctx.fill();
  // roof
  ctx.fillStyle='#3a1810';
  ctx.beginPath();
  ctx.moveTo(cx-80,cy-50);
  ctx.lineTo(cx,cy-80);
  ctx.lineTo(cx+80,cy-50);
  ctx.lineTo(cx+80,cy-40);
  ctx.lineTo(cx-80,cy-40);
  ctx.lineTo(cx-80,cy-50);
  ctx.closePath();
  ctx.fill();
  
  // window frames (warm lights)
  lights.forEach(light=>{
    const px=cx+light.x;
    const py=cy+light.y;
    const brightness=0.5+Math.sin(frameCount*0.03+light.phase*Math.PI*2)*0.5;
    const r=255;
    const g=Math.floor(150+brightness*30);
    const b=Math.floor(40+brightness*20);
    
    // glow halo
    const haloGrad=ctx.createRadialGradient(px,py,0,px,py,light.w*2);
    haloGrad.addColorStop(0,`rgba(${r},${g},${b},${0.8*brightness)`);
    haloGrad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=haloGrad;
    ctx.beginPath();
    ctx.ellipse(px,py,light.w*2.5,light.h*2.5,0,0,Math.PI*2);
    ctx.fill();
    
    // window light
    ctx.fillStyle=`rgba(${r},${g+10},${b+10},${0.85+brightness*0.15)`;
    ctx.beginPath();
    ctx.ellipse(px,py,light.w,light.h,0,0,Math.PI*2);
    ctx.fill();
  });
  
  // roof snow
  ctx.fillStyle='rgba(236,245,255,0.9)';
  ctx.beginPath();
  ctx.ellipse(cx,cy-50,80,4,0,0,Math.PI*2);
  ctx.fill();
}

function renderGlobeReflection(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,globeR,0,Math.PI*2);
  ctx.clip();
  
  // top light reflection
  const grad=ctx.createRadialGradient(cx,cy-globeR*0.5,0,cx,cy-globeR*0.5,globeR*0.8);
  grad.addColorStop(0,'rgba(255,255,255,0.2)');
  grad.addColorStop(0.5,'rgba(255,255,255,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(cx-globeR,cy-globeR,globeR*2,globeR*2);
  
  // bottom shadow
  const sGrad=ctx.createRadialGradient(cx,cy+globeR*0.5,0,cx,cy+globeR*0.5,globeR*0.8);
  sGrad.addColorStop(0,'rgba(0,0,0,0.4)');
  sGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sGrad;
  ctx.fillRect(cx-globeR,cy-globeR,globeR*2,globeR*2);
  
  ctx.restore();
}

function renderGlass(){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,globeR,0,Math.PI*2);
  // outer rim shadow
  ctx.shadowColor='rgba(0,0,0,0.6)';
  ctx.shadowBlur=20;
  ctx.lineWidth=2;
  ctx.strokeStyle='rgba(200,210,225,0.7)';
  ctx.stroke();
  ctx.restore();
  
  // highlight
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(-Math.PI*0.25);
  ctx.beginPath();
  ctx.ellipse(0,-globeR*0.5,globeR*0.4,globeR*0.05,0,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fill();
  ctx.restore();
}

function render(){
  frameCount++;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,1)';
  ctx.fillRect(0,0,W,H);
  if(bgGfx){
    ctx.drawImage(bgGfx,0,0);
  }
  ctx.restore();
  
  // shake offset
  const ox=Math.sin(frameCount*0.5)*shakeIntensity*5;
  const oy=Math.cos(frameCount*0.7)*shakeIntensity*5;
  ctx.save();
  ctx.translate(ox,oy);
  
  // clip to globe area
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,globeR,0,Math.PI*2);
  ctx.clip();
  
  // background inside globe
  ctx.save();
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,globeR);
  ig.addColorStop(0,'rgba(20,30,40,0.5)');
  ig.addColorStop(1,'rgba(10,15,20,0.9)');
  ctx.fillStyle=ig;
  ctx.fillRect(cx-globeR,cy-globeR,globeR*2,globeR*2);
  ctx.restore();
  
  // ground
  ctx.save();
  const gg=ctx.createLinearGradient(0,cy+globeR*0.4,0,cy+globeR*0.9);
  gg.addColorStop(0,'#e8f4f8');
  gg.addColorStop(1,'#c8e0f0');
  ctx.fillStyle=gg;
  ctx.beginPath();
  ctx.ellipse(cx,cy+globeR*0.7,globeR*0.8,globeR*0.05,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  
  // trees back
  trees.forEach(tree=>{
    if(tree.x<0){
      renderTree(tree);
    }
  });
  renderCabin();
  trees.forEach(tree=>{
    if(tree.x>=0){
      renderTree(tree);
    }
  });
  
  // snow
  renderSnow();
  
  ctx.restore();
  
  // glass reflection
  renderGlobeReflection();
  renderGlass();
  
  ctx.restore();
}

function physicsTick(){
  const dt=1;
  snow.forEach(p=>physicsStep(p,dt));
  // settled snow update
  for(let key in settledSnow){
    const arr=settledSnow[key];
    for(let i=0;i<arr.length;i++){
      arr[i].life-=dt*0.5;
      if(arr[i].life>0){
        arr[i].s=0;
      }
    }
    settledSnow[key]=arr.filter(s=>s.s===1);
    if(setledSnow[key].length===0){
      delete settledSnow[key];
    }
  }
}

let lastPhysics=0;
function physicsLoop(now){
  if(now-lastPhysics>16){
    physicsTick();
    lastPhysics=now;
  }
  requestAnimationFrame(physicsLoop);
}

function mainLoop(){
  updateShake();
  render();
  requestAnimationFrame(mainLoop);
}

window.addEventListener('resize',resize);
window.addEventListener('load',()=>{
  resize();
  init();
  mainLoop();
  requestAnimationFrame(physicsLoop);
});
})();
</script>
</body>
</html>
