<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #06b6d4; /* Cyan */
            --accent-glow: rgba(6, 182, 212, 0.3);
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 80px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 2rem;
            z-index: 10;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 12px;
            margin-bottom: 3rem;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .nav-item {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .search-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 240px;
            transition: border-color 0.2s;
        }

        .search-bar:focus-within {
            border-color: var(--accent);
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: 2px solid var(--bg-body);
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .kpi-title {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .kpi-icon {
            color: var(--text-muted);
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .delta {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
        }

        .delta.up { color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .delta.down { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

        /* Charts Section */
        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            flex: 1;
            min-height: 350px;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Canvas Wrapper */
        .canvas-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 250px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            font-size: 0.8rem;
            color: var(--text-main);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 100;
            white-space: nowrap;
        }

        #tooltip strong {
            color: var(--accent);
            display: block;
            margin-bottom: 2px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <aside>
        <div class="logo"></div>
        <div class="nav-item active">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        </div>
        <div class="nav-item">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        </div>
        <div class="nav-item">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </div>
        <div class="nav-item" style="margin-top: auto; margin-bottom: 2rem;">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
    </aside>

    <main>
        <header>
            <h1>Dashboard Overview</h1>
            <div class="header-controls">
                <div class="search-bar">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--text-muted)"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="avatar"></div>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="card">
                <div class="kpi-header">
                    <span class="kpi-title">Total Revenue</span>
                    <svg class="kpi-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="kpi-value" data-target="124500">$0</div>
                <div class="delta up">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                    +12.5%
                </div>
            </div>
            <div class="card">
                <div class="kpi-header">
                    <span class="kpi-title">Active Users</span>
                    <svg class="kpi-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <div class="kpi-value" data-target="4520">0</div>
                <div class="delta up">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                    +8.2%
                </div>
            </div>
            <div class="card">
                <div class="kpi-header">
                    <span class="kpi-title">Bounce Rate</span>
                    <svg class="kpi-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <div class="kpi-value" data-target="24" data-suffix="%">0%</div>
                <div class="delta down">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                    -2.1%
                </div>
            </div>
            <div class="card">
                <div class="kpi-header">
                    <span class="kpi-title">Avg. Session</span>
                    <svg class="kpi-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="kpi-value" data-target="4" data-suffix="m 32s">0m 0s</div>
                <div class="delta up">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                    +4.5%
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-container">
            <!-- Area Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">Traffic Analytics</div>
                </div>
                <div class="canvas-wrapper" id="areaChartWrapper">
                    <canvas id="areaChart"></canvas>
                    <div id="tooltip"></div>
                </div>
            </div>
            <!-- Donut Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">Traffic Source</div>
                </div>
                <div class="canvas-wrapper" id="donutChartWrapper">
                    <canvas id="donutChart"></canvas>
                    <div id="tooltip-donut" style="position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;">
                        <div style="font-size: 0.8rem; color: var(--text-muted)">Total</div>
                        <div style="font-size: 1.2rem; font-weight: 700">100%</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Utility Functions ---
        const formatNumber = (num) => {
            return new Intl.NumberFormat('en-US').format(num);
        };

        // --- KPI Animation ---
        document.querySelectorAll('.kpi-value').forEach(el => {
            const target = parseInt(el.dataset.target);
            const suffix = el.dataset.suffix || '';
            const isCurrency = el.innerText.includes('$');
            const duration = 2000;
            const start = 0;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out quart
                const ease = 1 - Math.pow(1 - progress, 4);
                
                const current = Math.floor(start + (target - start) * ease);
                
                if (isCurrency) {
                    el.innerText = '$' + formatNumber(current);
                } else {
                    el.innerText = formatNumber(current) + (progress === 1 ? suffix : '');
                }

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            requestAnimationFrame(update);
        });

        // --- Chart Helpers ---
        function setupCanvas(id) {
            const canvas = document.getElementById(id);
            const parent = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = parent.clientWidth * dpr;
            canvas.height = parent.clientHeight * dpr;
            
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            
            return { canvas, ctx, width: parent.clientWidth, height: parent.clientHeight };
        }

        // --- Area Chart ---
        const areaData = [10, 25, 15, 40, 30, 60, 45, 80, 70, 95, 85, 100];
        const areaLabels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        let areaProgress = 0;

        function drawAreaChart() {
            const { ctx, width, height } = setupCanvas('areaChart');
            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            const chartW = width - padding.left - padding.right;
            const chartH = height - padding.top - padding.bottom;
            
            ctx.clearRect(0, 0, width, height);
            
            // Grid lines
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<=4; i++) {
                const y = padding.top + (chartH / 4) * i;
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
            }
            ctx.stroke();

            // Data points
            const points = areaData.map((val, i) => {
                const x = padding.left + (chartW / (areaData.length - 1)) * i;
                const y = padding.top + chartH - (val / 100) * chartH;
                return { x, y };
            });

            // Animation Logic
            if (areaProgress < 1) {
                areaProgress += 0.02;
                if(areaProgress > 1) areaProgress = 1;
            }

            // Draw Curve
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            
            for(let i = 0; i < points.length - 1; i++) {
                const p0 = points[i];
                const p1 = points[i+1];
                // Simple bezier
                const cp1x = p0.x + (p1.x - p0.x) / 2;
                const cp1y = p0.y;
                const cp2x = p1.x - (p1.x - p0.x) / 2;
                const cp2y = p1.y;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p1.x, p1.y);
            }

            // Clip for drawing animation
            ctx.save();
            ctx.beginPath();
            ctx.rect(padding.left, padding.top, chartW * areaProgress, chartH);
            ctx.clip();

            // Gradient Fill
            const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
            gradient.addColorStop(0, 'rgba(6, 182, 212, 0.5)'); // Accent color
            gradient.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

            ctx.lineTo(points[Math.floor((points.length-1)*areaProgress)].x, height - padding.bottom);
            ctx.lineTo(padding.left, height - padding.bottom);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Stroke Line
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for(let i = 0; i < Math.floor((points.length - 1) * areaProgress); i++) {
                const p0 = points[i];
                const p1 = points[i+1];
                const cp1x = p0.x + (p1.x - p0.x) / 2;
                const cp1y = p0.y;
                const cp2x = p1.x - (p1.x - p0.x) / 2;
                const cp2y = p1.y;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p1.x, p1.y);
            }
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            // Draw Dots
            if (areaProgress >= 1) {
                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#0f172a';
                    ctx.fill();
                    ctx.strokeStyle = '#06b6d4';
                    ctx.stroke();
                });
            }

            if (areaProgress < 1) requestAnimationFrame(drawAreaChart);
        }

        // --- Donut Chart ---
        const donutData = [
            { label: 'Direct', value: 35, color: '#06b6d4' },
            { label: 'Social', value: 25, color: '#8b5cf6' },
            { label: 'Organic', value: 20, color: '#10b981' },
            { label: 'Referral', value: 20, color: '#f59e0b' }
        ];
        let donutProgress = 0;

        function drawDonutChart() {
            const { ctx, width, height } = setupCanvas('donutChart');
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 20;
            const holeRadius = radius * 0.65;

            ctx.clearRect(0, 0, width, height);

            let startAngle = -Math.PI / 2;
            
            // Animation Logic
            if (donutProgress < 1) {
                donutProgress += 0.015;
                if(donutProgress > 1) donutProgress = 1;
            }

            const totalAngle = Math.PI * 2 * donutProgress;

            donutData.forEach(slice => {
                const sliceAngle = (slice.value / 100) * Math.PI * 2;
                
                // If we are animating, check if this slice should be drawn
                if (startAngle + sliceAngle <= totalAngle - (Math.PI/2)) {
                    // Draw full slice
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                    ctx.arc(centerX, centerY, holeRadius, startAngle + sliceAngle, startAngle, true);
                    ctx.closePath();
                    ctx.fillStyle = slice.color;
                    ctx.fill();
                } else if (startAngle < totalAngle - (Math.PI/2)) {
                    // Draw partial slice (last one being drawn)
                    const end = totalAngle - (Math.PI/2);
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, startAngle, end);
                    ctx.arc(centerX, centerY, holeRadius, end, startAngle, true);
                    ctx.closePath();
                    ctx.fillStyle = slice.color;
                    ctx.fill();
                }

                startAngle += sliceAngle;
            });

            if (donutProgress < 1) requestAnimationFrame(drawDonutChart);
        }

        // --- Tooltips ---
        const tooltip = document.getElementById('tooltip');
        const areaCanvas = document.getElementById('areaChart');
        
        areaCanvas.addEventListener('mousemove', (e) => {
            const rect = areaCanvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            const chartW = rect.width - padding.left - padding.right;
            const stepX = chartW / (areaData.length - 1);
            
            // Find closest point
            const index = Math.round((mouseX - padding.left) / stepX);
            
            if (index >= 0 && index < areaData.length) {
                const x = padding.left + (stepX * index);
                const val = areaData[index];
                const label = areaLabels[index];
                
                tooltip.style.opacity = 1;
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY - 15) + 'px';
                tooltip.innerHTML = `<strong>${label}</strong> ${val}k Visitors`;
                
                // Highlight effect
                drawAreaChart(); // Redraw to keep animation consistent if needed, though static here
                // In a full app, we'd redraw the chart with an active dot here
            } else {
                tooltip.style.opacity = 0;
            }
        });

        areaCanvas.addEventListener('mouseleave', () => {
            tooltip.style.opacity = 0;
        });

        // --- Init ---
        window.addEventListener('resize', () => {
            drawAreaChart();
            drawDonutChart();
        });

        // Start loops
        requestAnimationFrame(drawAreaChart);
        requestAnimationFrame(drawDonutChart);

    </script>
</body>
</html>
