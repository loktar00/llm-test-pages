<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Deep Sea Vents</title>
    <style>
        body, html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="deepSea"></canvas>
    <script>
        const canvas = document.getElementById('deepSea');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        let mouseX = 0;
        let mouseY = 0;

        // Configuration
        const config = {
            particleCount: 600,
            snowCount: 150,
            shrimpCount: 40,
            ventColor: '#1a1a1a',
            ventGlowColor: '#ff4500',
            rovX: 0,
            rovY: 0,
            rovAngle: 0,
            rovSpeed: 0.002,
            rovRadius: 200
        };

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            config.rovX = width / 2;
            config.rovY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Classes ---

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                // Spawn near the vent (center-bottom)
                this.x = width / 2 + (Math.random() - 0.5) * 100;
                this.y = height * 0.8;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = -Math.random() * 3 - 1; // Rise up
                this.size = Math.random() * 5 + 2;
                this.alpha = Math.random() * 0.5 + 0.2;
                this.life = Math.random() * 100;
                this.maxLife = 200 + Math.random() * 200;
                this.turbulence = Math.random() * 0.05;
            }

            update() {
                this.x += this.vx + Math.sin(time * this.turbulence) * 0.5;
                this.y += this.vy;
                this.life++;

                // Cooling and slowing down as they rise
                if (this.life > this.maxLife * 0.7) {
                    this.alpha -= 0.005;
                    this.vy *= 0.99;
                    this.vx *= 0.99;
                }

                if (this.life > this.maxLife || this.alpha <= 0 || this.y < -50) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(40, 40, 45, ${this.alpha})`;
                ctx.fill();
            }
        }

        class MarineSnow {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.alpha = Math.random() * 0.3 + 0.1;
                this.drift = Math.random() * 0.5 - 0.25;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(time * 0.01 + this.x) * 0.2 + this.drift;

                if (this.y > height) {
                    this.y = -10;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 200, 220, ${this.alpha})`;
                ctx.fill();
            }
        }

        class TubeWorm {
            constructor(x, y) {
                this.baseX = x;
                this.baseY = y;
                this.height = 40 + Math.random() * 40;
                this.width = 4 + Math.random() * 2;
                this.phase = Math.random() * Math.PI * 2;
                this.color = `hsl(${340 + Math.random() * 30}, 80%, 60%)`; // Reddish
            }

            draw() {
                const sway = Math.sin(time * 0.005 + this.phase) * 10;
                
                ctx.save();
                ctx.translate(this.baseX, this.baseY);
                
                // Draw Stalk (White)
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(sway * 0.5, -this.height / 2, sway, -this.height);
                ctx.lineWidth = this.width;
                ctx.strokeStyle = '#eee';
                ctx.lineCap = 'round';
                ctx.stroke();

                // Draw Plume (Red)
                ctx.beginPath();
                ctx.moveTo(sway * 0.8, -this.height);
                ctx.quadraticCurveTo(sway * 0.2, -this.height - 15, sway + 10, -this.height - 5);
                ctx.quadraticCurveTo(sway * 0.5, -this.height + 5, sway * 0.8, -this.height);
                ctx.fillStyle = this.color;
                ctx.fill();

                ctx.restore();
            }
        }

        class Shrimp {
            constructor() {
                this.reset();
            }

            reset() {
                // Spawn around vent area
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 150;
                this.x = width / 2 + Math.cos(angle) * dist;
                this.y = height * 0.8 + Math.sin(angle) * dist * 0.5;
                this.size = 3 + Math.random() * 3;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 1 + Math.random() * 2;
                this.wobble = Math.random() * 10;
            }

            update() {
                // Swarm behavior: move towards center but circle it
                const dx = width / 2 - this.x;
                const dy = (height * 0.8) - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // If too far, return
                if (dist > 250) {
                    this.angle = Math.atan2(dy, dx);
                } else {
                    // Circle the vent
                    this.angle += 0.02;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                
                // Add wobble
                this.x += Math.sin(time * 0.1 + this.wobble) * 0.5;
                this.y += Math.cos(time * 0.1 + this.wobble) * 0.5;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Body
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Tail
                ctx.beginPath();
                ctx.moveTo(-this.size, 0);
                ctx.lineTo(-this.size * 1.5, -this.size * 0.5);
                ctx.lineTo(-this.size * 1.5, this.size * 0.5);
                ctx.fill();

                ctx.restore();
            }
        }

        class Siphonophore {
            constructor() {
                this.x = -200;
                this.y = Math.random() * height;
                this.speed = 0.5 + Math.random() * 0.5;
                this.tentacles = [];
                for(let i=0; i<5; i++) {
                    this.tentacles.push({
                        len: 50 + Math.random() * 100,
                        phase: Math.random() * Math.PI * 2
                    });
                }
                this.bobPhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.speed;
                this.y += Math.sin(time * 0.005 + this.bobPhase) * 0.5;
                
                if (this.x > width + 200) {
                    this.x = -200;
                    this.y = Math.random() * height;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Glow effect
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ffff';
                
                // Body segments
                ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                for(let i=0; i<8; i++) {
                    ctx.beginPath();
                    ctx.arc(i * 10, Math.sin(i + time*0.01)*5, 8, 0, Math.PI*2);
                    ctx.fill();
                }

                // Tentacles
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                
                this.tentacles.forEach((t, i) => {
                    ctx.beginPath();
                    ctx.moveTo(i * 10, 0);
                    const endX = i * 10 + Math.sin(time * 0.02 + t.phase) * 20;
                    const endY = t.len;
                    ctx.quadraticCurveTo(i * 10 + 20, t.len/2, endX, endY);
                    ctx.stroke();
                });

                ctx.restore();
            }
        }

        class ROV {
            constructor() {
                this.angle = 0;
            }

            update() {
                this.angle += config.rovSpeed;
                this.x = width / 2 + Math.cos(this.angle) * config.rovRadius;
                this.y = height / 2 + Math.sin(this.angle) * (config.rovRadius * 0.6);
                this.targetAngle = this.angle + Math.PI; // Face center-ish
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.targetAngle);

                // Draw Headlights
                this.drawLight(0, -20, 0.5);
                this.drawLight(0, 20, -0.5);

                // Draw ROV Body
                ctx.fillStyle = '#333';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                
                // Main body
                ctx.beginPath();
                ctx.rect(-15, -10, 30, 20);
                ctx.fill();
                ctx.stroke();

                // Camera/Sensor
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(15, 0, 5, 0, Math.PI*2);
                ctx.fill();

                // Arms/Lights housing
                ctx.fillStyle = '#222';
                ctx.fillRect(-5, -25, 10, 10); // Top
                ctx.fillRect(-5, 15, 10, 10);  // Bottom

                ctx.restore();
            }

            drawLight(x, y, angleOffset) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angleOffset);
                
                // Create gradient for light cone
                const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 300);
                gradient.addColorStop(0, 'rgba(255, 255, 200, 0.8)');
                gradient.addColorStop(0.1, 'rgba(255, 255, 200, 0.4)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 200, 0.1)');
                gradient.addColorStop(1, 'rgba(255, 255, 200, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, 300, -0.3, 0.3);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // --- Initialization ---

        const particles = Array.from({ length: config.particleCount }, () => new Particle());
        const snow = Array.from({ length: config.snowCount }, () => new MarineSnow());
        const shrimp = Array.from({ length: config.shrimpCount }, () => new Shrimp());
        const siphonophore = new Siphonophore();
        const rov = new ROV();

        // Tube worms generation
        const tubeWorms = [];
        for(let i=0; i<15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 100;
            const x = width/2 + Math.cos(angle) * dist;
            const y = height * 0.8 + Math.sin(angle) * dist * 0.3;
            tubeWorms.push(new TubeWorm(x, y));
        }

        // --- Main Loop ---

        function drawVent() {
            const cx = width / 2;
            const cy = height * 0.8;

            // Draw Rocky Base
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.moveTo(cx - 150, height);
            ctx.lineTo(cx - 80, cy + 50);
            ctx.quadraticCurveTo(cx, cy + 80, cx + 80, cy + 50);
            ctx.lineTo(cx + 150, height);
            ctx.fill();

            // Smokestacks
            ctx.fillStyle = '#050505';
            // Left stack
            ctx.beginPath();
            ctx.moveTo(cx - 40, cy + 50);
            ctx.lineTo(cx - 50, cy - 20);
            ctx.lineTo(cx - 20, cy - 30);
            ctx.lineTo(cx - 10, cy + 50);
            ctx.fill();
            // Right stack
            ctx.beginPath();
            ctx.moveTo(cx + 40, cy + 50);
            ctx.lineTo(cx + 50, cy - 10);
            ctx.lineTo(cx + 20, cy - 40);
            ctx.lineTo(cx + 10, cy + 50);
            ctx.fill();

            // Glow at vents
            const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, 100);
            glow.addColorStop(0, 'rgba(255, 100, 0, 0.3)');
            glow.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(cx - 100, cy - 100, 200, 100);
        }

        function animate() {
            time++;

            // Clear with deep sea color
            ctx.fillStyle = '#000508';
            ctx.fillRect(0, 0, width, height);

            // Draw Background Gradient (Ambient light from surface)
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#001020');
            bgGrad.addColorStop(0.5, '#000508');
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Draw Vent
            drawVent();

            // Update and Draw Snow (Background layer)
            snow.forEach(s => { s.update(); s.draw(); });

            // Update and Draw Particles (Smoke)
            particles.forEach(p => { p.update(); p.draw(); });

            // Draw Tube Worms
            tubeWorms.forEach(w => w.draw());

            // Draw Shrimp
            shrimp.forEach(s => { s.update(); s.draw(); });

            // Draw Siphonophore
            siphonophore.update();
            siphonophore.draw();

            // Draw ROV
            rov.update();
            rov.draw();

            // Vignette
            const vignette = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.8)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, width, height);

            requestAnimationFrame(animate);
        }

        // Start
        animate();

    </script>
</body>
</html>
