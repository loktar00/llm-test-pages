<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
<title>Product Grid</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f4f1ec;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem;
  }

  h1 {
    text-align: center;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-bottom: 2.5rem;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: #222;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s ease;
    cursor: pointer;
    position: relative;
  }

  .card:hover {
    transform: translateY(-10px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.12);
  }

  /* ---------- Illustration Area ---------- */
  .illustration {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Bottle */
  .bottle {
    width: 50px;
    height: 90px;
    border-radius: 8px 8px 14px 14px;
    position: relative;
    box-shadow: inset -6px 0 0 rgba(0,0,0,0.1);
  }
  .bottle::before {
    content: '';
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 18px;
    background: inherit;
    border-radius: 4px 4px 0 0;
    box-shadow: inset -3px 0 0 rgba(0,0,0,0.1);
  }
  .bottle::after {
    content: '';
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.3);
  }

  /* Headphones */
  .headphones {
    width: 70px; height: 50px;
    border: 6px solid #333;
    border-radius: 40px 40px 0 0;
    position: relative;
    border-bottom: none;
  }
  .headphones::before {
    content: '';
    position: absolute;
    top: 40px; left: -10px;
    width: 20px; height: 30px;
    background: #333;
    border-radius: 6px;
    box-shadow: 60px 0 0 #333;
  }
  .headphones::after {
    content: '';
    position: absolute;
    bottom: -14px; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 14px;
    background: #333;
    border-radius: 0 0 8px 8px;
  }

  /* Speaker */
  .speaker {
    width: 60px; height: 70px;
    background: #333;
    border-radius: 12px;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
  }
  .speaker::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
  }
  .speaker::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }

  /* Watch */
  .watch {
    width: 50px; height: 60px;
    background: #333;
    border-radius: 10px;
    position: relative;
  }
  .watch::before {
    content: '';
    position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 10px;
    background: #555;
    border-radius: 3px 3px 0 0;
  }
  .watch::after {
    content: '';
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 10px;
    background: #555;
    border-radius: 0 0 3px 3px;
  }

  /* Perfume */
  .perfume {
    width: 40px; height: 80px;
    background: #888;
    border-radius: 6px 6px 10px 10px;
    position: relative;
    box-shadow: inset -4px 0 0 rgba(0,0,0,0.15);
  }
  .perfume::before {
    content: '';
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 16px; height: 14px;
    background: #666;
    border-radius: 3px 3px 0 0;
  }
  .perfume::after {
    content: '';
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.25);
  }

  /* Sunglasses */
  .sunglasses {
    width: 70px; height: 30px;
    position: relative;
  }
  .sunglasses::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 30px; height: 26px;
    background: #222;
    border-radius: 4px 0 4px 4px;
    box-shadow: 40px 0 0 #222;
  }
  .sunglasses::after {
    content: '';
    position: absolute;
    top: 8px; left: 32px;
    width: 6px; height: 2px;
    background: #222;
    box-shadow: 0 0 0 2px #222;
  }

  /* ---------- Card Info ---------- */
  .info {
    padding: 1.2rem 1.4rem 1.6rem;
  }

  .name {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
  }

  .price {
    font-size: 0.95rem;
    color: #555;
    margin-bottom: 0.5rem;
  }

  /* ---------- Stars ---------- */
  .stars {
    display: flex;
    gap: 2px;
    height: 18px;
    width: 90px;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
  }

  .stars-bg, .stars-fg {
    position: absolute;
    top: 0; left: 0;
    display: flex;
    height: 100%;
  }

  .stars-bg { color: #ddd; }
  .stars-fg {
    color: #f5a623;
    clip-path: inset(0 var(--clip, 0%) 0 0);
  }

  .star {
    width: 18px; height: 18px;
    flex-shrink: 0;
  }

  /* ---------- Sale Badge ---------- */
  .badge {
    position: absolute;
    top: 12px; right: 12px;
    background: #e74c3c;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    letter-spacing: 0.04em;
    z-index: 2;
    animation: wiggle 1.8s ease-in-out infinite;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    20%  { transform: rotate(3deg); }
    40%  { transform: rotate(-3deg); }
    60%  { transform: rotate(2deg); }
    80%  { transform: rotate(-1deg); }
  }

  /* ---------- Quick Add Bar ---------- */
  .quick-add {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 48px;
    background: linear-gradient(135deg, #2d2d2d, #444);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    border-radius: 0 0 16px 16px;
    z-index: 3;
  }

  .card:hover .quick-add {
    transform: translateY(0);
  }

  .quick-add span {
    color: #fff;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .quick-add button {
    background: #f5a623;
    border: none;
    color: #1a1a1a;
    font-weight: 700;
    padding: 0.4rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .quick-add button:hover {
    background: #f7c055;
    transform: scale(1.05);
  }

  /* ---------- Illustration Backgrounds ---------- */
  .bg-1 { background: linear-gradient(135deg, #fce4ec, #f8bbd0); }
  .bg-2 { background: linear-gradient(135deg, #e3f2fd, #bbdef7); }
  .bg-3 { background: linear-gradient(135deg, #f3e5f5, #e1bee7); }
  .bg-4 { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); }
  .bg-5 { background: linear-gradient(135deg, #fff3e0, #ffe0b2); }
  .bg-6 { background: linear-gradient(135deg, #e0f2f1, #b2dfdb); }

  /* Responsive */
  @media (max-width: 720px) {
    body { padding: 1rem; }
    .grid { gap: 1.2rem; }
    .illustration { height: 140px; }
  }
</style>
</head>
<body>

<h1>Featured Products</h1>

<div class="grid" id="grid"></div>

<script>
  const products = [
    { name: "Luxury Face Serum",   price: "$49.99",  stars: 5, bg: "bg-1", illustration: "bottle",   sale: false },
    { name: "Wireless Headphones", price: "$79.99",  stars: 4, bg: "bg-2", illustration: "headphones", sale: false },
    { name: "Bluetooth Speaker",   price: "$34.50",  stars: 3, bg: "bg-3", illustration: "speaker",  sale: false },
    { name: "Smart Watch",         price: "$129.00", stars: 4, bg: "bg-4", illustration: "watch",    sale: true  },
    { name: "Eau de Parfum",       price: "$65.00",  stars: 5, bg: "bg-5", illustration: "perfume",  sale: false },
    { name: "Aviator Sunglasses",  price: "$29.99",  stars: 4, bg: "bg-6", illustration: "sunglasses", sale: false },
  ];

  function starSVG(filled) {
    return `<svg class="star" viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
      <polygon points="12,2 15.1,8.5 22,9.3 17,14.2 18.2,21.5 12,18 5.8,21.5 7,14.2 2,9.3 8.9,8.5" />
    </svg>`;
  }

  const grid = document.getElementById('grid');

  products.forEach(p => {
    const fullStars = Math.floor(p.stars);
    const clipPct = ((p.stars - fullStars) * 100).toFixed(1);

    const bgClass = p.bg;
    const illClass = p.illustration;

    let starsHTML = '<div class="stars-bg">';
    let starsFgHTML = '<div class="stars-fg" style="--clip:' + clipPct + '%">';
    for (let i = 0; i < 5; i++) {
      const filled = i < fullStars;
      starsHTML += starSVG(filled);
      starsFgHTML += starSVG(true);
    }
    starsHTML += '</div>';
    starsFgHTML += '</div>';

    const badgeHTML = p.sale ? '<div class="badge">SALE</div>' : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="illustration ${bgClass}">
        ${badgeHTML}
        <div class="${illClass}"></div>
      </div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">${p.price}</div>
        <div class="stars">
          ${starsHTML}${starsFgHTML}
        </div>
      </div>
      <div class="quick-add">
        <span>Quick Add</span>
        <button>ADD TO CART</button>
      </div>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
