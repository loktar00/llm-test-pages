<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Weaving</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0d0d0d; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Palette Generator ---
function generatePalette() {
    const hueBase = Math.random() * 360;
    const scheme = Math.floor(Math.random() * 4);
    const hues = [];
    const satBase = 40 + Math.random() * 35;
    const litBase = 30 + Math.random() * 30;

    if (scheme === 0) { // Analogous
        for (let i = 0; i < 5; i++) {
            hues.push((hueBase + i * 25 - 50) % 360);
        }
    } else if (scheme === 1) { // Split complementary
        hues.push(hueBase, (hueBase + 150) % 360, (hueBase + 210) % 360, hueBase, (hueBase + 30) % 360);
    } else if (scheme === 2) { // Triadic
        hues.push(hueBase, (hueBase + 120) % 360, (hueBase + 240) % 360, hueBase, (hueBase + 60) % 360);
    } else { // Monochromatic
        for (let i = 0; i < 5; i++) {
            hues.push(hueBase);
        }
    }

    const colors = hues.map((h, i) => {
        const s = satBase + (i % 2 === 0 ? 10 : -5);
        const l = litBase + (i % 3) * 8;
        return { h: h, s: s, l: l };
    });

    const warpLight = litBase + 35 + Math.random() * 10;
    const warp = { h: (hueBase + 20) % 360, s: 8 + Math.random() * 10, l: warpLight };

    return { colors, warp, hueBase };
}

function hsl(c, alpha) {
    if (alpha !== undefined) return `hsla(${c.h},${c.s}%,${c.l}%,${alpha})`;
    return `hsl(${c.h},${c.s}%,${c.l}%)`;
}

// --- Pattern Generators ---
function generatePattern(type, rows, cols) {
    const weave = [];
    const colors = [];

    for (let r = 0; r < rows; r++) {
        weave[r] = [];
        colors[r] = r;
        for (let c = 0; c < cols; c++) {
            if (type === 'stripes') {
                weave[r][c] = ((r + Math.floor(c / 4)) % 2 === 0) ? 1 : 0;
            } else if (type === 'diamonds') {
                const cx = cols / 2, cy = rows / 2;
                const d = Math.abs(r - cy) + Math.abs(c - cx);
                weave[r][c] = (d % 4 < 2) ? 1 : 0;
            } else if (type === 'chevrons') {
                const cx = cols / 2;
                const dist = Math.abs(c - cx - (r % 2 === 0 ? 0 : cols * 0.25));
                weave[r][c] = (dist % 6 < 3) ? 1 : 0;
            } else {
                weave[r][c] = ((r + c) % 2 === 0) ? 1 : 0;
            }
        }
    }
    return { weave, colors };
}

// --- Tapestry ---
const THREAD_W = 7;
const GAP = 1;
const GAP_W = THREAD_W + GAP;
const ROW_H = 3;
const ROW_GAP = 1;
const ROW_GAP_H = ROW_H + ROW_GAP;

const PATTERN_TYPES = ['stripes', 'diamonds', 'chevrons'];

let tapestryOffset = 0;
let currentTapestry = null;
let nextTapestry = null;
let shuttleX = 0;
let shuttleDir = 1;
let currentRow = 0;
let weavingSpeed = 1;
let tapestryComplete = false;
let scrollSpeed = 0.8;
let animTime = 0;

function createTapestry() {
    const palette = generatePalette();
    const type = PATTERN_TYPES[Math.floor(Math.random() * PATTERN_TYPES.length)];
    const cols = Math.ceil(W / GAP_W);
    const rows = Math.ceil((H * 1.5) / ROW_GAP_H);
    const pattern = generatePattern(type, rows, cols);

    return {
        palette,
        type,
        cols,
        rows,
        pattern,
        yarns: palette.colors.map(c => {
            const variations = [];
            for (let v = 0; v < 3; v++) {
                variations.push({
                    h: (c.h + (Math.random() - 0.5) * 15 + 360) % 360,
                    s: Math.max(10, c.s + (Math.random() - 0.5) * 15),
                    l: Math.max(10, c.l + (Math.random() - 0.5) * 12)
                });
            }
            return variations;
        }),
        warpYarn: {
            h: (palette.warp.h + (Math.random() - 0.5) * 10 + 360) % 360,
            s: Math.max(5, palette.warp.s + (Math.random() - 0.5) * 5),
            l: Math.max(20, palette.warp.l + (Math.random() - 0.5) * 8)
        }
    };
}

function init() {
    currentTapestry = createTapestry();
    nextTapestry = null;
    currentRow = 0;
    shuttleX = 0;
    shuttleDir = 1;
    tapestryComplete = false;
    tapestryOffset = H * 0.1;
}

function drawThread(x, y, w, h, color, isWarp, highlightSide) {
    const grad = ctx.createLinearGradient(x, y, x + w, y + h);
    if (isWarp) {
        const lOff = highlightSide === 'right' ? 8 : -8;
        grad.addColorStop(0, hsl({ h: color.h, s: color.s, l: color.l - 5 }));
        grad.addColorStop(0.35, hsl({ h: color.h, s: color.s, l: color.l + lOff }));
        grad.addColorStop(0.65, hsl({ h: color.h, s: color.s, l: color.l }));
        grad.addColorStop(1, hsl({ h: color.h, s: color.s, l: color.l - 4 }));
    } else {
        const lOff = highlightSide === 'bottom' ? 8 : -8;
        grad.addColorStop(0, hsl({ h: color.h, s: color.s, l: color.l - 3 }));
        grad.addColorStop(0.3, hsl({ h: color.h, s: color.s, l: color.l + lOff }));
        grad.addColorStop(0.7, hsl({ h: color.h, s: color.s, l: color.l }));
        grad.addColorStop(1, hsl({ h: color.h, s: color.s, l: color.l - 4 }));
    }
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);
}

function drawWeftShadow(x, y, w, h, warpColor) {
    ctx.fillStyle = hsl({ h: warpColor.h, s: warpColor.s * 0.5, l: warpColor.l - 15 }, 0.6);
    ctx.fillRect(x, y, w, h);
}

function renderTapestry(tapestry, offsetY, drawUpToRow, progress) {
    if (!tapestry) return;

    const { cols, rows, pattern, yarns, warpYarn } = tapestry;
    const startX = (W - cols * GAP_W) / 2;
    const startY = offsetY;

    // Draw warp threads first
    for (let c = 0; c < cols; c++) {
        const x = startX + c * GAP_W;
        const warpColor = warpYarn;
        const highlight = (c % 2 === 0) ? 'right' : 'left';
        drawThread(x, startY, THREAD_W, rows * ROW_GAP_H, warpColor, true, highlight);
    }

    // Draw weft threads up to current row
    const maxDrawRow = Math.min(drawUpToRow, rows);

    for (let r = 0; r < maxDrawRow; r++) {
        const y = startY + r * ROW_GAP_H;
        const colorIdx = r % yarns.length;
        const yarnVar = yarns[colorIdx][r % yarns[colorIdx].length];

        for (let c = 0; c < cols; c++) {
            const x = startX + c * GAP_W;
            const isOver = pattern.weave[r][c] === 1;

            if (isOver) {
                drawThread(x, y, THREAD_W, ROW_H, yarnVar, false, 'bottom');
            } else {
                // Weft goes under - draw shadow on warp
                drawWeftShadow(x, y, THREAD_W, ROW_H, warpYarn);
            }
        }
    }

    // Draw partial weft row if weaving is in progress
    if (drawUpToRow < rows && !tapestryComplete) {
        const r = drawUpToRow;
        if (r >= 0 && r < rows) {
            const y = startY + r * ROW_GAP_H;
            const colorIdx = r % yarns.length;
            const yarnVar = yarns[colorIdx][r % yarns[colorIdx].length];
            const x = startX + Math.floor(shuttleX) * GAP_W;
            const isOver = pattern.weave[r][Math.floor(shuttleX)] === 1;

            if (isOver) {
                drawThread(x, y, THREAD_W, ROW_H, yarnVar, false, 'bottom');
            } else {
                drawWeftShadow(x, y, THREAD_W, ROW_H, warpYarn);
            }
        }
    }
}

function drawShuttle(x, y, dir) {
    const sw = 30;
    const sh = 16;
    const cx = x * GAP_W + (W - (currentTapestry.cols * GAP_W)) / 2 + THREAD_W / 2;
    const cy = y * ROW_GAP_H + tapestryOffset + ROW_H / 2;

    ctx.save();
    ctx.translate(cx, cy);
    if (dir < 0) ctx.scale(-1, 1);

    // Shuttle body
    const grad = ctx.createLinearGradient(-sw/2, -sh/2, -sw/2, sh/2);
    grad.addColorStop(0, '#5a4a3a');
    grad.addColorStop(0.3, '#8a7a6a');
    grad.addColorStop(0.5, '#9a8a7a');
    grad.addColorStop(0.7, '#7a6a5a');
    grad.addColorStop(1, '#4a3a2a');

    ctx.beginPath();
    ctx.moveTo(-sw/2, 0);
    ctx.quadraticCurveTo(-sw/2, -sh/2, -sw/4, -sh/2);
    ctx.lineTo(sw/4, -sh/2);
    ctx.quadraticCurveTo(sw/2, -sh/2, sw/2, 0);
    ctx.quadraticCurveTo(sw/2, sh/2, sw/4, sh/2);
    ctx.lineTo(-sw/4, sh/2);
    ctx.quadraticCurveTo(-sw/2, sh/2, -sw/2, 0);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Yarn trail
    const trailGrad = ctx.createLinearGradient(-sw/2, 0, -sw/2 - 20, 0);
    const yarnColor = currentTapestry.yarns[currentRow % currentTapestry.yarns.length][0];
    trailGrad.addColorStop(0, hsl(yarnColor));
    trailGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = trailGrad;
    ctx.fillRect(-sw/2 - 20, -2, 20, 4);

    ctx.restore();
}

function update(dt) {
    animTime += dt;

    if (tapestryComplete) {
        tapestryOffset += scrollSpeed * dt * 60;
        const tapestryHeight = currentTapestry.rows * ROW_GAP_H;
        if (tapestryOffset >= tapestryHeight - H) {
            currentTapestry = nextTapestry || createTapestry();
            nextTapestry = null;
            currentRow = 0;
            shuttleX = 0;
            shuttleDir = 1;
            tapestryComplete = false;
            tapestryOffset = H * 0.1;
        }
        return;
    }

    // Move shuttle
    const shuttleSpeed = 3.5 + Math.sin(animTime * 0.5) * 0.5;
    const startX = 0;
    const endX = currentTapestry.cols - 1;

    if (shuttleDir > 0) {
        shuttleX += shuttleSpeed * dt * 60;
        if (shuttleX >= endX) {
            shuttleX = endX;
            shuttleDir = -1;
            currentRow++;

            if (currentRow >= currentTapestry.rows) {
                tapestryComplete = true;
                nextTapestry = createTapestry();
                return;
            }
        }
    } else {
        shuttleX -= shuttleSpeed * dt * 60;
        if (shuttleX <= startX) {
            shuttleX = startX;
            shuttleDir = 1;
            currentRow++;

            if (currentRow >= currentTapestry.rows) {
                tapestryComplete = true;
                nextTapestry = createTapestry();
                return;
            }
        }
    }

    // Slow scroll while weaving
    tapestryOffset += 0.15 * dt * 60;
}

function render() {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, W, H);

    // Draw background texture (loom frame)
    const frameW = 12;
    const frameGrad = ctx.createLinearGradient(0, 0, frameW, 0);
    frameGrad.addColorStop(0, '#2a1f15');
    frameGrad.addColorStop(0.5, '#4a3525');
    frameGrad.addColorStop(1, '#2a1f15');
    ctx.fillStyle = frameGrad;
    ctx.fillRect(0, 0, frameW, H);
    ctx.fillRect(W - frameW, 0, frameW, H);

    // Frame top/bottom
    const hFrameGrad = ctx.createLinearGradient(0, 0, 0, frameW);
    hFrameGrad.addColorStop(0, '#4a3525');
    hFrameGrad.addColorStop(0.5, '#5a4535');
    hFrameGrad.addColorStop(1, '#2a1f15');
    ctx.fillStyle = hFrameGrad;
    ctx.fillRect(0, 0, W, frameW);
    ctx.fillRect(0, H - frameW, W, frameW);

    // Frame decorative nails
    for (let i = 0; i < H; i += 40) {
        ctx.beginPath();
        ctx.arc(6, i + 20, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#6a5a4a';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(W - 6, i + 20, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw current tapestry
    const drawRow = Math.floor(currentRow);
    renderTapestry(currentTapestry, tapestryOffset, drawRow, 0);

    // Draw shuttle
    if (!tapestryComplete && currentRow < currentTapestry.rows) {
        drawShuttle(currentRow, shuttleDir);
    }

    // Draw next tapestry preview at bottom
    if (nextTapestry && tapestryComplete) {
        const previewY = H - H * 0.3;
        ctx.globalAlpha = 0.3;
        renderTapestry(nextTapestry, previewY, 0, 0);
        ctx.globalAlpha = 1.0;
    }

    // Subtle vignette
    const vigGrad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
    vigGrad.addColorStop(0, 'transparent');
    vigGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
    ctx.fillStyle = vigGrad;
    ctx.fillRect(0, 0, W, H);

    // Pattern type label
    if (currentTapestry) {
        ctx.save();
        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.textAlign = 'right';
        ctx.fillText(`pattern: ${currentTapestry.type.toUpperCase()}`, W - 20, 24);
        ctx.textAlign = 'left';
        ctx.fillText(`row: ${currentRow}/${currentTapestry.rows}`, 20, 24);
        ctx.restore();
    }
}

let lastTime = performance.now();
function loop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    update(dt);
    render();
    requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
