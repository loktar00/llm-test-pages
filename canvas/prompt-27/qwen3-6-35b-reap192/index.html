<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Bike Slider</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="screensaver"></canvas>
    <script>
        /**
         * ENDLESS BIKE SLIDER
         * A Verlet Physics Screensaver
         * 
         * Core Concepts:
         * 1. Verlet Integration: Simulates physics using current and previous positions.
         *    x(t+dt) = 2x(t) - x(t-dt) + a(t)*dt^2
         * 2. Constraint Solving: Iteratively resolves distances between points (sticks)
         *    and position limits (ground).
         * 3. Procedural Track: Generates infinite terrain ahead and cleans up behind.
         */

        // --- Configuration ---
        const CONFIG = {
            gravity: 0.25,
            friction: 0.985,
            groundFriction: 0.85,
            physicsSteps: 8,
            constraintIterations: 10,
            bikeSpeed: 5,
            chunkSize: 100,
            viewAhead: 1200,
            viewBehind: 500,
            colors: {
                bg: '#050510',
                bgShift: '#1a0b2e',
                track: '#00f2ff',
                bike: '#ff0055',
                rider: '#ffffff',
                particle: '#ffaa00'
            }
        };

        // --- Math Helpers ---
        const Vec2 = {
            add: (v1, v2) => ({ x: v1.x + v2.x, y: v1.y + v2.y }),
            sub: (v1, v2) => ({ x: v1.x - v2.x, y: v1.y - v2.y }),
            mul: (v, s) => ({ x: v.x * s, y: v.y * s }),
            dot: (v1, v2) => v1.x * v2.x + v1.y * v2.y,
            len: (v) => Math.sqrt(v.x * v.x + v.y * v.y),
            norm: (v) => {
                const l = Math.sqrt(v.x * v.x + v.y * v.y);
                return l === 0 ? { x: 0, y: 0 } : { x: v.x / l, y: v.y / l };
            },
            dist: (v1, v2) => Math.sqrt((v1.x - v2.x) ** 2 + (v1.y - v2.y) ** 2),
            rotate: (v, angle) => {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return {
                    x: v.x * cos - v.y * sin,
                    y: v.x * sin + v.y * cos
                };
            }
        };

        // --- Physics Engine ---

        class Particle {
            constructor(x, y, radius = 0, pinned = false, mass = 1) {
                this.x = x;
                this.y = y;
                this.ox = x; // old position
                this.oy = y;
                this.radius = radius;
                this.pinned = pinned;
                this.mass = mass;
                this.invMass = pinned ? 0 : 1 / mass;
                this.grounded = false;
                this.color = '#fff';
            }

            update() {
                if (this.pinned) return;

                const vx = (this.x - this.ox) * CONFIG.friction;
                const vy = (this.y - this.oy) * CONFIG.friction;

                this.ox = this.x;
                this.oy = this.y;

                this.x += vx;
                this.y += vy + CONFIG.gravity;
                
                // Velocity Clamping (stability)
                const speed = Math.sqrt(vx*vx + vy*vy);
                if (speed > 15) {
                    const scale = 15 / speed;
                    this.x -= (this.x - this.ox) * (1-scale);
                    this.y -= (this.y - this.oy) * (1-scale);
                }
            }

            constrainToTrack(trackSegments) {
                // Find closest segment
                let closestDist = Infinity;
                let closestP = null;
                let normal = {x:0, y:0};
                let onGround = false;

                // Optimization: Search near the camera/bike Y
                // But simply iterating all segments is fine for this complexity
                
                for (let i = 0; i < trackSegments.length - 1; i++) {
                    const p1 = trackSegments[i];
                    const p2 = trackSegments[i+1];
                    
                    // Vector p1->p2
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const lenSq = dx*dx + dy*dy;
                    
                    // Project point onto line segment
                    let t = ((this.x - p1.x) * dx + (this.y - p1.y) * dy) / lenSq;
                    t = Math.max(0, Math.min(1, t));
                    
                    const projX = p1.x + t * dx;
                    const projY = p1.y + t * dy;
                    
                    const distX = this.x - projX;
                    const distY = this.y - projY;
                    const dist = Math.sqrt(distX*distX + distY*distY);

                    if (dist < this.radius + 2) { // Hit tolerance
                        // Check if we are "below" the line (for top collision)
                        // Cross product to find side
                        const cross = (p2.x - p1.x) * (this.y - p1.y) - (p2.y - p1.y) * (this.x - p1.x);
                        
                        // Assuming standard track flow (left to right), normal usually points up
                        // We want to push out if we are inside or below the track surface
                        
                        // Simple logic: if distance < radius, push out
                        if (dist < this.radius) {
                            onGround = true;
                            closestDist = dist;
                            closestP = { x: projX, y: projY };
                            normal = { x: -distX / dist, y: -distY / dist };
                        }
                    }
                }

                if (onGround && closestP) {
                    // Push out
                    const overlap = this.radius - closestDist;
                    this.x += normal.x * overlap;
                    this.y += normal.y * overlap;
                    
                    // Ground Friction (Tangential)
                    // Velocity
                    let vx = this.x - this.ox;
                    let vy = this.y - this.oy;
                    
                    // Tangent vector of track
                    // (We need to approximate tangent from normal or just use global friction logic)
                    // Simple: Dampen velocity heavily
                    this.ox = this.x - vx * CONFIG.groundFriction;
                    this.oy = this.y - vy * CONFIG.groundFriction;
                    
                    this.grounded = true;
                    
                    // Ground Speed Boost (Motor Force Proxy)
                    // Add forward velocity if grounded to simulate riding
                    this.ox -= 0.1; 
                } else {
                    this.grounded = false;
                }
            }
        }

        class Constraint {
            constructor(p1, p2, length = null, stiffness = 1) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = length || Vec2.dist(p1, p2);
                this.stiffness = stiffness;
            }

            solve() {
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist === 0) return;

                const diff = (this.length - dist) / dist * this.stiffness;
                
                const offsetX = dx * diff * 0.5;
                const offsetY = dy * diff * 0.5;

                if (!this.p1.pinned) {
                    this.p1.x -= offsetX;
                    this.p1.y -= offsetY;
                }
                if (!this.p2.pinned) {
                    this.p2.x += offsetX;
                    this.p2.y += offsetY;
                }
            }
        }

        // --- Game Entities ---

        class TrackGenerator {
            constructor() {
                this.segments = [];
                this.noise = 0;
                this.lastX = -500; // Start offscreen
                this.lastY = window.innerHeight * 0.6;
                this.generateChunk();
            }

            generateChunk() {
                // Procedural generation logic
                // Mix of sine waves and random ramps
                
                const chunkLen = CONFIG.chunkSize;
                const points = [];
                let x = this.lastX;
                let y = this.lastY;
                
                // Determine terrain type based on noise
                const noise = Math.sin(this.noise) * Math.cos(this.noise * 0.5);
                const type = Math.abs(noise);
                
                let segmentsToAdd = 20;
                
                for (let i = 0; i < segmentsToAdd; i++) {
                    const dist = 40;
                    x += dist;
                    
                    let dy = 0;
                    
                    // Logic for different terrains
                    if (type < 0.3) {
                        // Flat / Recovery
                        dy = (Math.random() - 0.5) * 5;
                    } else if (type < 0.6) {
                        // Hills
                        dy = Math.sin(this.noise + i * 0.1) * 20;
                    } else {
                        // Jumps / Ramps
                        dy = -30; // Go up
                    }
                    
                    // Loop logic (simple sine spiral)
                    if (noise > 0.8 && i > 5) {
                         dy = -10;
                         // We will curve this later visually, but physically it's a slope
                    }

                    y += dy;
                    
                    // Clamp height to keep it on screen (mostly)
                    if (y > window.innerHeight - 100) y = window.innerHeight - 100;
                    if (y < 200) y = 200;

                    points.push({ x: x, y: y });
                    this.noise += 0.2;
                }
                
                // Create segments from points
                for (let i = 0; i < points.length - 1; i++) {
                    this.segments.push({ p1: this.lastPoint, p2: points[i+1] });
                }
                
                if (points.length > 0) {
                    this.lastX = points[points.length-1].x;
                    this.lastY = points[points.length-1].y;
                    this.lastPoint = this.lastX !== undefined ? {x: this.lastX, y: this.lastY} : {x:0,y:0};
                    this.lastPoint = points[points.length-1];
                }
                
                // Ensure segments array is consistent
                // Rebuild segments properly based on points
                this.segments = [];
                let currX = this.lastX - (segmentsToAdd * 40);
                let currY = this.lastY - ((Math.random()-0.5) * 500); // approximate start of chunk
                
                // Actually, simpler: Just append points to a master list and build segments
            }
            
            // Better generation strategy: Maintain a master list of points
            points = [];
            
            init() {
                let x = -200;
                let y = window.innerHeight / 2;
                this.points.push({x, y});
                
                for(let i=0; i<100; i++) {
                    this.addSegment();
                }
            }
            
            addSegment() {
                const last = this.points[this.points.length-1];
                const x = last.x + 40;
                
                // Simple Perlin-ish noise
                const amp = 100;
                const freq = 0.02;
                const noise = Math.sin(x * freq) * amp + Math.sin(x * freq * 2.5) * (amp/2);
                
                let y = (window.innerHeight * 0.6) + noise;
                
                // Occasional ramps
                if (Math.random() < 0.01) y -= 50;
                if (Math.random() < 0.01) y += 50;
                
                this.points.push({x, y});
            }
            
            update(camX) {
                // Generate ahead
                while (this.points[this.points.length-1].x < camX + CONFIG.viewAhead + 1000) {
                    this.addSegment();
                }
                
                // Clean behind
                while (this.points.length > 0 && this.points[0].x < camX - CONFIG.viewBehind) {
                    this.points.shift();
                }
                
                // Convert points to segments for collision
                this.segments = [];
                for(let i=0; i<this.points.length-1; i++) {
                    this.segments.push({
                        p1: this.points[i],
                        p2: this.points[i+1]
                    });
                }
            }
            
            getYAt(x) {
                // Linear interpolation
                for (let i = 0; i < this.segments.length - 1; i++) {
                    if (x >= this.segments[i].p1.x && x < this.segments[i].p2.x) {
                        const t = (x - this.segments[i].p1.x) / (this.segments[i].p2.x - this.segments[i].p1.x);
                        return this.segments[i].p1.y + t * (this.segments[i].p2.y - this.segments[i].p1.y);
                    }
                }
                return 0;
            }
        }

        class Bike {
            constructor() {
                this.particles = [];
                this.constraints = [];
                this.wheelRadius = 15;
                this.frameLen = 35;
                this.handlebarHeight = 10;
                this.steerAngle = 0;
                this.rotation = 0;
                this.speed = 0;
                
                this.init();
            }
            
            init() {
                // Reset state
                this.particles = [];
                this.constraints = [];
                
                // Layout: Rear Wheel, Front Wheel, Seat, Handlebar, Frame Center
                // Rear
                const rw = new Particle(-this.frameLen, 0, this.wheelRadius);
                const fw = new Particle(0, 0, this.wheelRadius);
                const seat = new Particle(-5, -35);
                const hb = new Particle(15, -this.handlebarHeight - 10);
                const frame = new Particle(0, -20);
                
                this.particles.push(rw, fw, seat, hb, frame);
                
                // Constraints (Chassis)
                this.constraints.push(new Constraint(rw, fw, this.frameLen));
                this.constraints.push(new Constraint(rw, seat, Math.sqrt(5*5 + 35*35), 0.5)); // Suspension-ish
                this.constraints.push(new Constraint(fw, hb, Math.sqrt(15*15 + (this.handlebarHeight+10)**2), 0.5));
                this.constraints.push(new Constraint(rw, frame, this.frameLen/2));
                this.constraints.push(new Constraint(fw, frame, this.frameLen/2));
                this.constraints.push(new Constraint(seat, frame, 10));
                this.constraints.push(new Constraint(hb, frame, 15));
                
                // Cross braces (skeleton)
                this.constraints.push(new Constraint(seat, hb, 50));
                this.constraints.push(new Constraint(rw, hb, 60));
            }
            
            update(track) {
                // Physics Steps
                for (let i = 0; i < CONFIG.physicsSteps; i++) {
                    // Update Velocities (Verlet)
                    this.particles.forEach(p => p.update());
                    
                    // Track Constraints
                    this.particles.forEach(p => p.constrainToTrack(track.segments));
                    
                    // Bike Constraints
                    for (let j = 0; j < CONFIG.constraintIterations; j++) {
                        this.constraints.forEach(c => c.solve());
                        
                        // Ground constraints again (to prevent sinking into ground from jitter)
                        this.particles.forEach(p => p.constrainToTrack(track.segments));
                    }
                    
                    // Apply Motor Force to Rear Wheel
                    // Try to move rear wheel forward
                    const rw = this.particles[0];
                    if (rw.grounded) {
                        const motor = CONFIG.bikeSpeed * 0.15;
                        rw.ox -= motor;
                    } else {
                        // Air control (rotate)
                        // Apply torque
                        const center = this.particles[4];
                        const force = {x:0, y:0};
                        const angVel = 0.05;
                        // Rotate around center
                        this.particles.forEach(p => {
                           if (!p.pinned) {
                               // Simple rotation helper
                               // We just adjust X velocity
                           }
                        });
                    }
                    
                    // Stability (Anti-Gravity)
                    // If bike is tilted too far, push frame up slightly or adjust wheels
                    const frame = this.particles[4];
                    const rw = this.particles[0];
                    const fw = this.particles[1];
                    
                    // Calculate tilt
                    const dx = fw.x - rw.x;
                    const dy = fw.y - rw.y;
                    const tilt = Math.atan2(dy, dx);
                    
                    // If upside down, fight it
                    if (Math.cos(tilt) < -0.5) {
                        // Push wheels down relative to frame? Or just boost gravity?
                        // Simple hack: Apply a force to the frame to orient it up
                        // Or: Nudge the wheel positions
                        rw.y -= 0.5;
                        fw.y -= 0.5;
                    }
                }
                
                // Calculate rotation for rendering
                const rw = this.particles[0];
                const fw = this.particles[1];
                this.rotation = Math.atan2(fw.y - rw.y, fw.x - rw.x);
                this.speed = Math.abs(rw.x - rw.ox);
            }
            
            draw(ctx) {
                const rw = this.particles[0];
                const fw = this.particles[1];
                const seat = this.particles[2];
                const hb = this.particles[3];
                const frame = this.particles[4];
                
                // Draw Wheel Tracks (visual only)
                ctx.beginPath();
                ctx.arc(rw.x, rw.y, this.wheelRadius, 0, Math.PI*2);
                ctx.strokeStyle = CONFIG.colors.bike;
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Spokes
                ctx.beginPath();
                ctx.moveTo(rw.x, rw.y);
                const spokeX = rw.x + Math.cos(this.rotation * 5) * this.wheelRadius;
                const spokeY = rw.y + Math.sin(this.rotation * 5) * this.wheelRadius;
                ctx.lineTo(spokeX, spokeY);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(fw.x, fw.y, this.wheelRadius, 0, Math.PI*2);
                ctx.stroke();
                
                // Frame
                ctx.beginPath();
                ctx.moveTo(rw.x, rw.y);
                ctx.lineTo(seat.x, seat.y);
                ctx.lineTo(hb.x, hb.y);
                ctx.lineTo(fw.x, fw.y);
                ctx.moveTo(rw.x, rw.y);
                ctx.lineTo(frame.x, frame.y);
                ctx.lineTo(fw.x, fw.y);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // Rider
                rider.draw(ctx, seat, hb);
            }
        }

        class Rider {
            constructor() {
                this.points = [];
                this.constraints = [];
                this.init();
            }
            
            init() {
                // Head, Chest, Hips, Hands, Feet
                // Relative to bike seat/handlebar
                this.points = [
                    new Particle(0, -60), // Head
                    new Particle(0, -45), // Chest
                    new Particle(-5, -30), // Hips
                    new Particle(15, -20), // Hands
                    new Particle(-10, -15) // Feet
                ];
                
                this.constraints = [
                    // Spine
                    new Constraint(this.points[0], this.points[1]),
                    new Constraint(this.points[1], this.points[2]),
                    // Arms
                    new Constraint(this.points[1], this.points[3]), // Chest to Hands
                    // Legs
                    new Constraint(this.points[2], this.points[4]), // Hips to Feet
                    new Constraint(this.points[4], this.points[3]), // Feet to Hands (crouch)
                    // Head stability
                    new
