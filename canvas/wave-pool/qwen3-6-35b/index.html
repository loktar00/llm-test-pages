<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Interference Tank</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480;
const H = 360;
const SIZE = W * H;

const current = new Float32Array(SIZE);
const previous = new Float32Array(SIZE);
const barrier = new Uint8Array(SIZE);

const imgData = ctx.createImageData(W, H);
const pixels = imgData.data;

// Barrier setup: two vertical barriers with slits
function setupBarriers() {
    barrier.fill(0);
    const b1x = Math.floor(W * 0.35);
    const b2x = Math.floor(W * 0.65);
    const slit1Top = Math.floor(H * 0.3);
    const slit1Bot = Math.floor(H * 0.7);
    const slit2Top = Math.floor(H * 0.25);
    const slit2Bot = Math.floor(H * 0.75);

    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            if (x === b1x || x === b2x) {
                if (y < slit1Top || y > slit1Bot) {
                    barrier[y * W + x] = 1;
                }
                if (y < slit2Top || y > slit2Bot) {
                    barrier[y * W + x] = 1;
                }
            }
        }
    }
}
setupBarriers();

// Sources
const sources = [];
function initSources() {
    sources.length = 0;
    const defs = [
        { cx: W * 0.1, cy: H * 0.5, amp: 8, freq: 1.8, phase: 0, speed: 0.0003, orbitR: 15 },
        { cx: W * 0.85, cy: H * 0.3, amp: 7, freq: 2.2, phase: 1.2, speed: 0.0004, orbitR: 20 },
        { cx: W * 0.5, cy: H * 0.85, amp: 6, freq: 1.5, phase: 2.5, speed: 0.00025, orbitR: 25 },
        { cx: W * 0.7, cy: H * 0.15, amp: 5, freq: 2.8, phase: 0.8, speed: 0.00035, orbitR: 12 },
    ];
    for (const d of defs) {
        sources.push({
            x: d.cx, y: d.cy,
            baseX: d.cx, baseY: d.cy,
            amp: d.amp, freq: d.freq, phase: d.phase,
            speed: d.speed, orbitR: d.orbitR,
            t: Math.random() * 1000,
            freqMod: 0,
        });
    }
}
initSources();

// Wave parameters
const c2 = 0.22;
const damping = 0.988;

let time = 0;

function updateWaves() {
    time += 1;

    // Update sources
    for (const s of sources) {
        s.t += 1;
        s.x = s.baseX + Math.sin(s.t * s.speed * 3.7) * s.orbitR + Math.cos(s.t * s.speed * 2.3) * s.orbitR * 0.5;
        s.y = s.baseY + Math.cos(s.t * s.speed * 4.1) * s.orbitR + Math.sin(s.t * s.speed * 1.9) * s.orbitR * 0.3;
        s.freq += Math.sin(s.t * 0.005) * 0.002;
        s.freq = Math.max(0.8, Math.min(4.0, s.freq));
    }

    // Add sources
    for (const s of sources) {
        const sx = Math.round(s.x);
        const sy = Math.round(s.y);
        const r = 3;
        const wave = Math.sin(2 * Math.PI * s.freq * time * 0.01 + s.phase) * s.amp;
        for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
                const dist2 = dx * dx + dy * dy;
                if (dist2 > r * r) continue;
                const nx = sx + dx;
                const ny = sy + dy;
                if (nx < 1 || nx >= W - 1 || ny < 1 || ny >= H - 1) continue;
                const falloff = 1 - Math.sqrt(dist2) / (r + 1);
                const idx = ny * W + nx;
                if (barrier[idx]) continue;
                current[idx] += wave * falloff * falloff;
            }
        }
    }

    // Wave equation step
    for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
            const idx = y * W + x;
            if (barrier[idx]) {
                previous[idx] = current[idx] = 0;
                continue;
            }
            const laplacian = current[idx - 1] + current[idx + 1] +
                              current[idx - W] + current[idx + W] -
                              4 * current[idx];
            const val = 2 * current[idx] - previous[idx] + c2 * laplacian;
            previous[idx] = current[idx];
            current[idx] = val * damping;
        }
    }

    // Boundary conditions (reflective walls)
    for (let x = 0; x < W; x++) {
        previous[x] = current[x];
        previous[(H - 1) * W + x] = current[(H - 1) * W + x];
    }
    for (let y = 0; y < H; y++) {
        const idx = y * W;
        previous[idx] = current[idx];
        previous[idx + W - 1] = current[idx + W - 1];
    }
}

function render() {
    let maxVal = 0.001;
    for (let i = 0; i < SIZE; i++) {
        const v = Math.abs(current[i]);
        if (v > maxVal) maxVal = v;
    }
    const invMax = 1.0 / maxVal;

    for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
            const idx = y * W + x;
            if (barrier[idx]) {
                const pIdx = (y * W + x) * 4;
                pixels[pIdx] = 15;
                pixels[pIdx + 1] = 15;
                pixels[pIdx + 2] = 25;
                pixels[pIdx + 3] = 255;
                continue;
            }

            const v = current[idx] * invMax;
            const absV = Math.abs(v);

            // Check if local crest for sparkle
            const isCrest = v > 0.3;
            const isLocalMax = isCrest &&
                current[idx] > current[idx - 1] && current[idx] > current[idx + 1] &&
                current[idx] > current[idx - W] && current[idx] > current[idx + W];

            // Color mapping: deep blue (trough) -> dark blue -> medium blue -> light blue -> white (crest)
            let r, g, b;
            if (v < 0) {
                const t = -v;
                r = Math.floor(5 + t * 20);
                g = Math.floor(20 + t * 40);
                b = Math.floor(80 + t * 120);
            } else {
                const t = v;
                if (t < 0.3) {
                    const s = t / 0.3;
                    r = Math.floor(5 + s * 30);
                    g = Math.floor(60 + s * 100);
                    b = Math.floor(200 + s * 55);
                } else if (t < 0.6) {
                    const s = (t - 0.3) / 0.3;
                    r = Math.floor(35 + s * 180);
                    g = Math.floor(160 + s * 60);
                    b = Math.floor(255);
                } else {
                    const s = (t - 0.6) / 0.4;
                    r = Math.floor(215 + s * 40);
                    g = Math.floor(220 + s * 35);
                    b = Math.floor(255);
                }
            }

            // Specular sparkle at crests
            if (isLocalMax && absV > 0.5) {
                const sparkle = Math.min(1, (absV - 0.5) * 2);
                r = Math.floor(r + (255 - r) * sparkle * 0.6);
                g = Math.floor(g + (255 - g) * sparkle * 0.6);
                b = Math.floor(b + (255 - b) * sparkle * 0.6);
            }

            const pIdx = idx * 4;
            pixels[pIdx] = Math.min(255, r);
            pixels[pIdx + 1] = Math.min(255, g);
            pixels[pIdx + 2] = Math.min(255, b);
            pixels[pIdx + 3] = 255;
        }
    }

    // Render barriers with a subtle glow
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const idx = y * W + x;
            if (!barrier[idx]) continue;
            const pIdx = idx * 4;
            // Glow from nearby waves
            let glow = 0;
            for (let dy = -3; dy <= 3; dy++) {
                for (let dx = -3; dx <= 3; dx++) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                        glow += Math.abs(current[ny * W + nx]);
                    }
                }
            }
            const g = Math.min(255, glow * 0.3);
            pixels[pIdx] = Math.min(255, 20 + g * 0.3);
            pixels[pIdx + 1] = Math.min(255, 20 + g * 0.4);
            pixels[pIdx + 2] = Math.min(255, 35 + g * 0.8);
            pixels[pIdx + 3] = 255;
        }
    }

    ctx.putImageData(imgData, 0, 0);
}

function frame() {
    updateWaves();
    render();
    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
