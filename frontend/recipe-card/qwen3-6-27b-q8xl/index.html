<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Card</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#faf7f2;--card:#fff;--accent:#d4622b;--accent-light:#f0c4a8;
    --accent-dark:#a8451e;--text:#2c2420;--text-light:#7a6e66;
    --success:#4a9e6b;--success-light:#d4f0df;--border:#e8e0d6;
    --shadow:0 8px 32px rgba(44,36,32,.1),0 2px 8px rgba(44,36,32,.06);
    --radius:16px;--radius-sm:10px;
  }
  html{font-size:16px;scroll-behavior:smooth}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    min-height:100vh;padding:2rem 1rem;display:flex;justify-content:center;
    align-items:flex-start;
  }
  .recipe-card{
    max-width:680px;width:100%;background:var(--card);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
    animation:cardIn .6s ease-out both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

  /* ── Hero ── */
  .hero{
    position:relative;height:320px;overflow:hidden;
    background:linear-gradient(145deg,#f5e6d3 0%,#e8c9a0 50%,#d4a574 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom,transparent 50%,rgba(44,36,32,.08) 100%);
  }
  /* CSS Plate */
  .plate{position:relative;width:220px;height:220px;z-index:1}
  .plate-base{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff 0%,#f0ebe4 60%,#ddd5c8 100%);
    box-shadow:0 4px 20px rgba(0,0,0,.15),inset 0 -2px 6px rgba(0,0,0,.06);
  }
  .plate-inner{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 45% 40%,#f8f4ee,#ece5da);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.08);
  }
  /* Pasta swirls */
  .pasta{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;height:110px}
  .pasta-strand{
    position:absolute;border-radius:40px;background:var(--accent);opacity:.85;
  }
  .pasta-strand:nth-child(1){width:80px;height:8px;top:30px;left:15px;transform:rotate(-15deg);border-radius:8px}
  .pasta-strand:nth-child(2){width:75px;height:8px;top:42px;left:18px;transform:rotate(5deg);border-radius:8px}
  .pasta-strand:nth-child(3){width:70px;height:8px;top:54px;left:20px;transform:rotate(-8deg);border-radius:8px}
  .pasta-strand:nth-child(4){width:65px;height:8px;top:66px;left:22px;transform:rotate(12deg);border-radius:8px}
  .pasta-strand:nth-child(5){width:60px;height:8px;top:78px;left:25px;transform:rotate(-5deg);border-radius:8px}
  /* Sauce dots */
  .sauce{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;height:110px}
  .sauce-dot{position:absolute;border-radius:50%;background:var(--accent-light)}
  .sauce-dot:nth-child(1){width:20px;height:20px;top:20px;left:30px}
  .sauce-dot:nth-child(2){width:14px;height:14px;top:50px;left:55px}
  .sauce-dot:nth-child(3){width:18px;height:18px;top:70px;left:25px}
  .sauce-dot:nth-child(4){width:12px;height:12px;top:35px;left:60px}
  /* Herbs */
  .herb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;height:110px}
  .herb-leaf{
    position:absolute;width:10px;height:14px;border-radius:50% 0 50% 0;
    background:#5a8a3c;opacity:.9;
  }
  .herb-leaf:nth-child(1){top:15px;left:40px;transform:rotate(30deg)}
  .herb-leaf:nth-child(2){top:45px;left:65px;transform:rotate(-20deg);width:8px;height:11px}
  .herb-leaf:nth-child(3){top:60px;left:45px;transform:rotate(50deg);width:7px;height:10px}
  .herb-leaf:nth-child(4){top:25px;left:55px;transform:rotate(-40deg);width:9px;height:12px}
  .herb-leaf:nth-child(5){top:80px;left:50px;transform:rotate(15deg);width:8px;height:10px}
  /* Steam */
  .steam{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;height:110px}
  .steam-line{
    position:absolute;width:2px;border-radius:2px;
    background:rgba(255,255,255,.5);animation:steam 2.5s ease-in-out infinite;
  }
  .steam-line:nth-child(1){height:24px;top:-10px;left:35px;animation-delay:0s}
  .steam-line:nth-child(2){height:20px;top:-6px;left:50px;animation-delay:.6s}
  .steam-line:nth-child(3){height:22px;top:-8px;left:65px;animation-delay:1.2s}
  @keyframes steam{
    0%{opacity:0;transform:translateY(0) scaleX(1)}
    50%{opacity:.6;transform:translateY(-12px) scaleX(1.5)}
    100%{opacity:0;transform:translateY(-24px) scaleX(.8)}
  }

  /* ── Title area ── */
  .title-area{padding:2rem 2rem 0}
  .title-area h1{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-bottom:.5rem}
  .title-area .subtitle{color:var(--text-light);font-size:.95rem;font-weight:400}

  /* ── Meta chips ── */
  .meta-chips{display:flex;flex-wrap:wrap;gap:.6rem;padding:1.25rem 2rem}
  .chip{
    display:inline-flex;align-items:center;gap:.4rem;
    padding:.45rem .9rem;border-radius:50px;font-size:.82rem;font-weight:600;
    background:var(--bg);color:var(--text-light);border:1px solid var(--border);
    transition:all .2s;
  }
  .chip svg{width:15px;height:15px;flex-shrink:0}
  .chip:hover{border-color:var(--accent-light);color:var(--accent)}

  /* ── Stepper ── */
  .stepper-section{padding:0 2rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .stepper-label{font-size:.85rem;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em}
  .stepper{display:flex;align-items:center;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:2px solid var(--border)}
  .stepper button{
    width:40px;height:40px;border:none;background:var(--bg);color:var(--text);
    font-size:1.2rem;font-weight:700;cursor:pointer;transition:all .15s;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper button:hover{background:var(--accent-light);color:var(--accent-dark)}
  .stepper button:active{transform:scale(.93)}
  .stepper .count{
    width:48px;height:40px;display:flex;align-items:center;justify-content:center;
    font-size:1rem;font-weight:700;background:var(--card);color:var(--text);
  }

  /* ── Sections ── */
  .section{padding:0 2rem 1.5rem}
  .section-title{
    font-size:1.1rem;font-weight:700;margin-bottom:1rem;
    display:flex;align-items:center;gap:.5rem;
  }
  .section-title::after{content:'';flex:1;height:2px;background:var(--border);border-radius:2px}

  /* ── Ingredients ── */
  .ingredients-list{list-style:none;display:flex;flex-direction:column;gap:.35rem}
  .ingredient-item{
    display:flex;align-items:center;gap:.75rem;padding:.65rem .85rem;
    border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;
    position:relative;user-select:none;
  }
  .ingredient-item:hover{background:var(--bg)}
  .ingredient-item.checked{opacity:.55}
  .ingredient-check{
    width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:all .25s;position:relative;
  }
  .ingredient-item.checked .ingredient-check{
    background:var(--success);border-color:var(--success);
  }
  .ingredient-check svg{
    width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;
    opacity:0;transform:scale(.5);transition:all .2s;
  }
  .ingredient-item.checked .ingredient-check svg{opacity:1;transform:scale(1)}
  .ingredient-text{font-size:.93rem;font-weight:500;position:relative;transition:color .2s}
  .ingredient-item.checked .ingredient-text{color:var(--text-light)}
  .ingredient-text .strike{
    position:absolute;left:0;top:50%;height:1.5px;background:var(--success);
    transform:translateY(-50%);width:0;transition:width .35s cubic-bezier(.4,0,.2,1);
    border-radius:2px;
  }
  .ingredient-item.checked .ingredient-text .strike{width:100%}
  .ingredient-qty{
    font-weight:700;color:var(--accent);min-width:0;
    transition:all .3s;
  }

  /* ── Steps ── */
  .steps-list{list-style:none;display:flex;flex-direction:column;gap:.25rem}
  .step-item{
    display:flex;gap:1rem;padding:.85rem;cursor:pointer;
    border-radius:var(--radius-sm);transition:all .2s;user-select:none;
    position:relative;
  }
  .step-item:hover{background:var(--bg)}
  .step-item.done{opacity:.7}
  .step-marker{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:.85rem;font-weight:800;
    border:2.5px solid var(--border);color:var(--text-light);
    transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;
    background:var(--card);
  }
  .step-item.done .step-marker{
    background:var(--success);border-color:var(--success);color:#fff;
    transform:scale(1.05);
  }
  .step-marker .check-icon{
    position:absolute;width:16px;height:16px;stroke:#fff;stroke-width:3;
    fill:none;opacity:0;transform:scale(0);transition:all .25s;
  }
  .step-item.done .step-marker .check-icon{opacity:1;transform:scale(1)}
  .step-item.done .step-marker .step-num{opacity:0;transform:scale(.5)}
  .step-num{transition:all .2s}
  .step-content{padding-top:4px}
  .step-text{font-size:.93rem;font-weight:500;line-height:1.6}
  .step-item.done .step-text{color:var(--text-light)}

  /* ── Footer ── */
  .recipe-footer{
    padding:1.5rem 2rem 2rem;text-align:center;
    border-top:1px solid var(--border);margin-top:.5rem;
  }
  .recipe-footer p{font-size:.82rem;color:var(--text-light)}
  .print-btn{
    display:inline-flex;align-items:center;gap:.4rem;
    margin-top:.75rem;padding:.55rem 1.2rem;border-radius:50px;
    border:2px solid var(--border);background:transparent;
    color:var(--text-light);font-size:.82rem;font-weight:600;
    cursor:pointer;transition:all .2s;
  }
  .print-btn:hover{border-color:var(--accent);color:var(--accent)}
  .print-btn svg{width:15px;height:15px}

  /* ── Responsive ── */
  @media(max-width:520px){
    body{padding:1rem .5rem}
    .hero{height:260px}
    .plate{transform:scale(.8)}
    .title-area,.meta-chips,.stepper-section,.section,.recipe-footer{padding-left:1.25rem;padding-right:1.25rem}
    .title-area h1{font-size:1.5rem}
  }

  /* ── Print ── */
  @media print{
    body{background:#fff;padding:0}
    .recipe-card{box-shadow:none;max-width:100%;border-radius:0}
    .hero{height:200px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .steam .steam-line{display:none}
    .stepper-section{display:none}
    .print-btn{display:none}
    .ingredient-item,.step-item{break-inside:avoid}
    .ingredient-item.checked .ingredient-text .strike{width:100% !important}
    .step-item.done .step-marker{background:#4a9e6b !important;border-color:#4a9e6b !important;color:#fff !important}
    .section{page-break-inside:avoid}
  }
</style>
</head>
<body>

<div class="recipe-card">
  <!-- Hero -->
  <div class="hero">
    <div class="plate">
      <div class="plate-base"></div>
      <div class="plate-inner"></div>
      <div class="pasta">
        <div class="pasta-strand"></div>
        <div class="pasta-strand"></div>
        <div class="pasta-strand"></div>
        <div class="pasta-strand"></div>
        <div class="pasta-strand"></div>
      </div>
      <div class="sauce">
        <div class="sauce-dot"></div>
        <div class="sauce-dot"></div>
        <div class="sauce-dot"></div>
        <div class="sauce-dot"></div>
      </div>
      <div class="herb">
        <div class="herb-leaf"></div>
        <div class="herb-leaf"></div>
        <div class="herb-leaf"></div>
        <div class="herb-leaf"></div>
        <div class="herb-leaf"></div>
      </div>
      <div class="steam">
        <div class="steam-line"></div>
        <div class="steam-line"></div>
        <div class="steam-line"></div>
      </div>
    </div>
  </div>

  <!-- Title -->
  <div class="title-area">
    <h1>Creamy Garlic Tuscan Pasta</h1>
    <p class="subtitle">Rich, garlicky, and ready in under 30 minutes — comfort food at its finest.</p>
  </div>

  <!-- Meta Chips -->
  <div class="meta-chips">
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      25 min
    </span>
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span id="servings-display">2</span> servings
    </span>
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
      Easy
    </span>
  </div>

  <!-- Stepper -->
  <div class="stepper-section">
    <span class="stepper-label">Servings</span>
    <div class="stepper">
      <button onclick="changeServings(-1)" aria-label="Decrease servings">−</button>
      <div class="count" id="servings-count">2</div>
      <button onclick="changeServings(1)" aria-label="Increase servings">+</button>
    </div>
  </div>

  <!-- Ingredients -->
  <div class="section">
    <div class="section-title">Ingredients</div>
    <ul class="ingredients-list" id="ingredients-list"></ul>
  </div>

  <!-- Steps -->
  <div class="section">
    <div class="section-title">Instructions</div>
    <ul class="steps-list" id="steps-list"></ul>
  </div>

  <!-- Footer -->
  <div class="recipe-footer">
    <p>Enjoy your meal! Share your creation with #TuscanPasta</p>
    <button class="print-btn" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print Recipe
    </button>
  </div>
</div>

<script>
const BASE_SERVINGS = 2;
let currentServings = 2;

const ingredients = [
  { qty: 200, unit: 'g', label: 'penne or rigatoni pasta' },
  { qty: 3, unit: 'cloves', label: 'garlic, minced' },
  { qty: 2, unit: 'tbsp', label: 'olive oil' },
  { qty: 200, unit: 'ml', label: 'heavy cream' },
  { qty: 60, unit: 'g', label: 'parmesan cheese, grated' },
  { qty: 1, unit: 'cup', label: 'fresh spinach' },
  { qty: 8, unit: 'pcs', label: 'sun-dried tomatoes, halved' },
  { qty: 0.5, unit: 'tsp', label: 'red pepper flakes' },
  { qty: 1, unit: 'tsp', label: 'dried Italian herbs' },
  { qty: 1, unit: 'pinch', label: 'salt and black pepper' },
];

const steps = [
  'Bring a large pot of salted water to a boil. Cook pasta according to package directions until al dente. Reserve 1 cup of pasta water before draining.',
  'While pasta cooks, heat olive oil in a large skillet over medium heat. Add minced garlic and red pepper flakes, sauté for 30 seconds until fragrant.',
  'Pour in the heavy cream and bring to a gentle simmer. Stir in the Italian herbs and let reduce slightly for 2 minutes.',
  'Add the sun-dried tomatoes and spinach to the skillet. Cook until spinach wilts, about 1 minute.',
  'Stir in the grated parmesan cheese until melted and the sauce is smooth and creamy. Season with salt and pepper.',
  'Toss the drained pasta into the skillet with the sauce. Add reserved pasta water a splash at a time until the desired consistency is reached.',
  'Serve immediately on warm plates. Garnish with extra parmesan and a drizzle of olive oil if desired.'
];

function formatQty(qty) {
  if (qty === 0) return '0';
  if (qty < 1) {
    // Convert to fractions
    const fracs = {
      '0.125': '1/8', '0.25': '1/4', '0.333': '1/3', '0.375': '3/8',
      '0.5': '1/2', '0.667': '2/3', '0.75': '3/4', '0.875': '7/8'
    };
    const rounded = Math.round(qty * 1000) / 1000;
    for (const [k, v] of Object.entries(fracs)) {
      if (Math.abs(rounded - parseFloat(k)) < 0.02) return v;
    }
    return rounded.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
  }
  return Math.round(qty * 100) / 100;
}

function renderIngredients() {
  const list = document.getElementById('ingredients-list');
  list.innerHTML = '';
  const ratio = currentServings / BASE_SERVINGS;
  ingredients.forEach((ing, i) => {
    const scaledQty = ing.qty * ratio;
    const li = document.createElement('li');
    li.className = 'ingredient-item';
    li.dataset.index = i;
    li.innerHTML = `
      <div class="ingredient-check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span class="ingredient-text">
        <span class="ingredient-qty">${formatQty(scaledQty)} ${ing.unit}</span> ${ing.label}
        <span class="strike"></span>
      </span>
    `;
    li.addEventListener('click', () => {
      li.classList.toggle('checked');
    });
    list.appendChild(li);
  });
}

function renderSteps() {
  const list = document.getElementById('steps-list');
  list.innerHTML = '';
  steps.forEach((step, i) => {
    const li = document.createElement('li');
    li.className = 'step-item';
    li.dataset.index = i;
    li.innerHTML = `
      <div class="step-marker">
        <span class="step-num">${i + 1}</span>
        <svg class="check-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="step-content">
        <div class="step-text">${step}</div>
      </div>
    `;
    li.addEventListener('click', () => {
      li.classList.toggle('done');
    });
    list.appendChild(li);
  });
}

function changeServings(delta) {
  currentServings = Math.max(1, Math.min(12, currentServings + delta));
  document.getElementById('servings-count').textContent = currentServings;
  document.getElementById('servings-display').textContent = currentServings;
  renderIngredients();
}

renderIngredients();
renderSteps();
</script>
</body>
</html>
