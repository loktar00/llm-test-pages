<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architecture of Silence</title>
    <style>
        :root {
            /* Typography Scale */
            --font-serif: "Georgia", "Times New Roman", "Palatino Linotype", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            --text-base: 112.5%; /* 18px */
            --line-height-base: 1.7;
            --line-height-heading: 1.2;
            
            /* Colors */
            --color-bg: #fdfbf7; /* Warm paper tone */
            --color-text: #2c2c2c;
            --color-text-muted: #666666;
            --color-accent: #2563eb; /* Refined blue */
            --color-accent-hover: #1d4ed8;
            --color-border: #e5e5e5;
            
            /* Spacing */
            --spacing-container: 680px;
            --spacing-section: 3rem;
            
            /* Code Block */
            --code-bg: #f4f4f5;
            --code-text: #d1d5db;
            --code-keyword: #c084fc;
            --code-string: #86efac;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
