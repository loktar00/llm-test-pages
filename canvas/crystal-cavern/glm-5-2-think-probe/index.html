<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crystal Cavern</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Color helpers ----
  const PAL = {
    tealDeep:'#06141a',
    teal:'#0e3a44',
    amethyst:'#7c4bd6',
    amethystDeep:'#3a1f63',
    cyan:'#5ff2e6',
    amber:'#ffb44a',
    amberDeep:'#b35a1e',
    rock:'#1a1318',
    rockHi:'#3a2a36'
  };

  function hexToRgb(h){
    if(h.startsWith('rgba')||h.startsWith('rgb')) return h;
    const n=parseInt(h.slice(1),16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }
  function rgba(c,a){
    if(typeof c==='string'){
      if(c.startsWith('#')) return `rgba(${hexToRgb(c).join(',')},${a})`;
      return c.replace(/rgba?\(([^)]+)\)/,(_,m)=>`rgba(${m.split(',').slice(0,3).map(x=>x.trim()).join(',')},${a})`);
    }
    return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  }
  function mix(c1,c2,t){
    const a=hexToRgb(c1),b=hexToRgb(c2);
    return [a[0]+(b[0]-a[0])*t|0, a[1]+(b[1]-a[1])*t|0, a[2]+(b[2]-a[2])*t|0];
  }
  const lerp=(x,a,b)=>a+(b-a)*x;
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;

  // ---- Background texture ----
  let bgCanvas;
  function makeBackground(){
    bgCanvas = document.createElement('canvas');
    bgCanvas.width=Math.floor(W*DPR);
    bgCanvas.height=Math.floor(H*DPR);
    const b=bgCanvas.getContext('2d');
    b.setTransform(DPR,0,0,DPR,0,0);
    // base gradient
    const g=b.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#02070a');
    g.addColorStop(0.45,'#06141a');
    g.addColorStop(0.55,'#08161c');
    g.addColorStop(1,'#040b0e');
    b.fillStyle=g;
    b.fillRect(0,0,W,H);
    // ambient blobs
    for(let i=0;i<6;i++){
      const r=Math.random()*Math.max(W,H)*0.6+200;
      const cx=Math.random()*W, cy=Math.random()*H;
      const rg=b.createRadialGradient(cx,cy,0,cx,cy,r);
      const col = i%2? PAL.amethystDeep : PAL.teal;
      rg.addColorStop(0, rgba(col,0.12));
      rg.addColorStop(1, rgba(col,0));
      b.fillStyle=rg;
      b.fillRect(0,0,W,H);
    }
    // grain
    const img=b.getImageData(0,0,Math.floor(W*DPR),Math.floor(H*DPR));
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      const n=(Math.random()*8)|0;
      d[i]=clamp(d[i]+n,0,255);
      d[i+1]=clamp(d[i+1]+n,0,255);
      d[i+2]=clamp(d[i+2]+n,0,255);
    }
    b.putImageData(img,0,0);
  }

    let n=Math.sin(x*12.9898+78.233)*43758.5453;
    return (n - Math.floor(n))*2-1;
  }
