<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Mining Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="sim"></canvas>
    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');
        
        let width, height, cx, cy;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Utility ---
        const rand = (min, max) => Math.random() * (max - min) + min;
        const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
        
        // --- Configuration ---
        const CONFIG = {
            asteroidCount: 8,
            droneCount: 12,
            starCount: 150,
            enemyInterval: 15000, // ms
            maxParticles: 200,
            asteroidSpeed: 10,
            droneSpeed: 180
        };

        // --- Object Arrays ---
        const stars = [];
        const asteroids = [];
        const drones = [];
        const particles = [];
        const enemies = [];
        let lastTime = 0;
        let globalTime = 0;

        // --- Classes ---

        class Star {
            constructor() {
                this.x = rand(0, width);
                this.y = rand(0, height);
                this.size = rand(0.5, 2);
                this.alpha = rand(0.3, 1);
                this.twinkleSpeed = rand(0.5, 2);
                this.phase = rand(0, Math.PI * 2);
            }
            draw(dt) {
                const flicker = Math.sin(globalTime * this.twinkleSpeed + this.phase) * 0.2 + 0.8;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * flicker})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Asteroid {
            constructor(x, y) {
                this.x = x || rand(-200, width + 200);
                this.y = y || rand(-200, height + 200);
                this.radius = rand(20, 50);
                this.angle = rand(0, Math.PI * 2);
                this.rotSpeed = rand(-0.5, 0.5) * 0.01;
                this.ore = 100;
                this.maxOre = 100;
                this.drift = { x: rand(-CONFIG.asteroidSpeed, CONFIG.asteroidSpeed), y: rand(-CONFIG.asteroidSpeed, CONFIG.asteroidSpeed) };
                this.poly = this.generateShape();
            }

            generateShape() {
                const points = [];
                const segments = 8;
                for (let i = 0; i < segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const r = this.radius * rand(0.8, 1.2);
                    points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
                }
                return points;
            }

            update(dt) {
                this.x += this.drift.x * dt;
                this.y += this.drift.y * dt;
                this.angle += this.rotSpeed * dt;

                // Wrap around screen loosely
                if (this.x < -100) this.x = width + 100;
                if (this.x > width + 100) this.x = -100;
                if (this.y < -100) this.y = height + 100;
                if (this.y > height + 100) this.y = -100;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.moveTo(this.poly[0].x, this.poly[0].y);
                for (let i = 1; i < this.poly.length; i++) {
                    ctx.lineTo(this.poly[i].x, this.poly[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = '#5a5a6b';
                ctx.fill();
                ctx.strokeStyle = '#3d3d4d';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                // Ore Glow
                if (this.ore > 0) {
                    const opacity = (this.ore / this.maxOre) * 0.3;
                    ctx.fillStyle = `rgba(0, 255, 200, ${opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            reset() {
                // Move to a random edge
                const edge = Math.floor(Math.random() * 4);
                if (edge === 0) { this.x = rand(0, width); this.y = -100; }
                else if (edge === 1) { this.x = width + 100; this.y = rand(0, height); }
                else if (edge === 2) { this.x = rand(0, width); this.y = height + 100; }
                else { this.x = -100; this.y = rand(0, height); }

                this.drift = { x: rand(-CONFIG.asteroidSpeed, CONFIG.asteroidSpeed), y: rand(-CONFIG.asteroidSpeed, CONFIG.asteroidSpeed) };
                this.ore = this.maxOre;
                this.poly = this.generateShape();
            }

            takeDamage(amount) {
                this.ore -= amount;
                if (this.ore <= 0) {
                    createExplosion(this.x, this.y, 10, '#00ffcc');
                    this.reset();
                    return true; // Depleted
                }
                return false; // Still has ore
            }
        }

        class Drone {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = cx;
                this.y = cy;
                this.state = 'goToAsteroid'; // goToAsteroid, mine, returnToStation, unload
                this.target = null;
                this.cargo = 0;
                this.mineTimer = 0;
                this.angle = 0;
                this.cooldown = 0;
            }

            getNearestAsteroid() {
                let minD = Infinity;
                let nearest = null;
                for (let a of asteroids) {
                    const d = dist(this.x, this.y, a.x, a.y);
                    if (d < minD) {
                        minD = d;
                        nearest = a;
                    }
                }
                return nearest;
            }

            update(dt) {
                if (this.cooldown > 0) this.cooldown -= dt;

                if (this.state === 'goToAsteroid') {
                    if (!this.target || this.target.ore <= 0) {
                        this.target = this.getNearestAsteroid();
                    }
                    
                    if (this.target) {
                        const d = dist(this.x, this.y, this.target.x, this.target.y);
                        if (d < this.target.radius + 10) {
                            this.state = 'mine';
                            this.mineTimer = 2.0; // Seconds to mine
                        } else {
                            this.moveToward(this.target.x, this.target.y, CONFIG.droneSpeed * dt);
                        }
                    } else {
                        // No asteroids, wait
                        this.x = cx + Math.cos(globalTime) * 5;
                        this.y = cy + Math.sin(globalTime) * 5;
                    }
                } else if (this.state === 'mine') {
                    if (!this.target || this.target.ore <= 0) {
                        this.state = 'goToAsteroid';
                    } else {
                        this.mineTimer -= dt;
                        // Add mining particles
                        if (Math.random() < 0.5) {
                            spawnParticle(this.x + rand(-10,10), this.y + rand(-10,10), 'spark');
                        }
                        
                        if (this.mineTimer <= 0) {
                            const depleted = this.target.takeDamage(20); // Take 20 ore
                            this.cargo += 20;
                            if (depleted) {
                                this.state = 'returnToStation';
                                this.target = null;
                            } else {
                                this.state = 'goToAsteroid'; // Re-evaluate target in next frame logic
                            }
                        }
                    }
                } else if (this.state === 'returnToStation') {
                    const d = dist(this.x, this.y, cx, cy);
                    if (d < 30) {
                        this.state = 'unload';
                        this.cooldown = 1.0;
                    } else {
                        this.moveToward(cx, cy, CONFIG.droneSpeed * 0.7 * dt); // Slower carrying cargo
                    }
                } else if (this.state === 'unload') {
                    if (this.cooldown <= 0) {
                        this.cargo = 0;
                        this.state = 'goToAsteroid';
                        this.target = null;
                    }
                }

                // Fix NaN
                if (isNaN(this.x) || isNaN(this.y)) this.reset();
            }

            moveToward(tx, ty, speed) {
                const dx = tx - this.x;
                const dy = ty - this.y;
                const d = Math.hypot(dx, dy);
                if (d > 0) {
                    this.x += (dx / d) * speed;
                    this.y += (dy / d) * speed;
                    this.angle = Math.atan2(dy, dx);
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Draw Ship
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(-6, 5);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-6, -5);
                ctx.closePath();
                ctx.fill();

                // Draw Cargo
                if (this.cargo > 0) {
                    ctx.fillStyle = `rgba(255, 100, 50, ${0.6 + Math.sin(globalTime * 5) * 0.2})`;
                    ctx.beginPath();
                    ctx.arc(-2, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Engine Trail
                if (this.state !== 'unload') {
                    ctx.fillStyle = `rgba(0, 255, 255, ${Math.random() * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(-6, 0, rand(1, 2), 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class Enemy {
            constructor() {
                // Spawn at random edge
                const side = Math.floor(Math.random() * 4);
                if (side === 0) { this.x = rand(0, width); this.y = -50; }
                else if (side === 1) { this.x = width + 50; this.y = rand(0, height); }
                else if (side === 2) { this.x = rand(0, width); this.y = height + 50; }
                else { this.x = -50; this.y = rand(0, height); }

                this.targetX = cx;
                this.targetY = cy;
                this.state = 'approach'; // approach, attack, retreat
                this.timer = 0;
                this.speed = 100;
                this.angle = 0;
                this.dead = false;
            }

            update(dt) {
                this.timer += dt;
                
                if (this.state === 'approach') {
                    const d = dist(this.x, this.y, this.targetX, this.targetY);
                    if (d > 150) {
                        const dx = this.targetX - this.x;
                        const dy = this.targetY - this.y;
                        this.x += (dx / d) * this.speed * dt;
                        this.y += (dy / d) * this.speed * dt;
                        this.angle = Math.atan2(dy, dx);
                    } else {
                        this.state = 'attack';
                        this.timer = 0;
                    }
                } else if (this.state === 'attack') {
                    // Shake slightly
                    this.x += Math.sin(globalTime * 20) * 2;
                    this.y += Math.cos(globalTime * 20) * 2;
                    
                    if (this.timer > 3.0) {
                        this.state = 'retreat';
                        this.timer = 0;
                    }
                } else if (this.state === 'retreat') {
                    // Fly back to origin direction
                    this.x += Math.cos(this.angle) * this.speed * 1.5 * dt;
                    this.y += Math.sin(this.angle) * this.speed * 1.5 * dt;
                    
                    // Check if off screen
                    if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
                        this.dead = true;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Calculate angle for drawing
                let drawAngle = this.angle;
                if (this.state === 'retreat') {
                    // Opposite of approach angle roughly
                    drawAngle = this.angle; 
                }
                ctx.rotate(drawAngle);

                // Draw Enemy Ship
                ctx.fillStyle = '#330000';
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(-8, 6);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-8, -6);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();

                // Draw Laser to Station
                if (this.state === 'attack') {
                    const grad = ctx.createLinearGradient(this.x, this.y, cx, cy);
                    grad.addColorStop(0, 'rgba(255, 0, 0, 0)');
                    grad.addColorStop(0.8, 'rgba(255, 50, 50, 0.8)');
                    grad.addColorStop(1, 'rgba(255, 255, 255, 1)');
                    
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(cx, cy);
                    ctx.stroke();
                }
            }
        }

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                
                if (type === 'spark') {
                    this.vx = rand(-50, 50);
                    this.vy = rand(-50, 50);
                    this.decay = rand(1.0, 2.0);
                    this.color = `hsl(${rand(40, 60)}, 100%, 70%)`; // Gold sparks
                } else if (type === 'explode') {
                    const angle = rand(0, Math.PI*2);
                    const speed = rand(50, 150);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.decay = rand(0.5, 1.0);
                    this.color = '#fff';
                } else if (type === 'laserHit') {
                    this.vx = rand(-20, 20);
                    this.vy = rand(-20, 20);
                    this.decay = 2.0;
                    this.color = '#ffaa00';
                }
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= this.decay * dt;
            }

            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.type === 'spark' ? 1.5 : 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // --- Scene Management ---

        // Initialize Scene
        for (let i = 0; i < CONFIG.starCount; i++) stars.push(new Star());
        for (let i = 0; i < CONFIG.asteroidCount; i++) asteroids.push(new Asteroid(rand(100, width-100), rand(100, height-100)));
        for (let i = 0; i < CONFIG.droneCount; i++) drones.push(new Drone());

        function createExplosion(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                if (particles.length < CONFIG.maxParticles) {
                    particles.push(new Particle(x, y, 'explode'));
                }
            }
        }

        function spawnParticle(x, y, type) {
            if (particles.length < CONFIG.maxParticles) {
                particles.push(new Particle(x, y, type));
            }
        }

        // --- Drawing Functions ---

        function drawStation(dt) {
            ctx.save();
            ctx.translate(cx, cy);

            // Glow
            const pulse = Math.sin(globalTime * 2) * 0.2 + 0.8;
            const grd = ctx.createRadialGradient(0, 0, 20, 0, 0, 150);
            grd.addColorStop(0, `rgba(0, 100, 255, ${0.2 * pulse})`);
            grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(0, 0, 150, 0, Math.PI * 2);
            ctx.fill();

            // Arms
            ctx.strokeStyle = '#556';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-60, 0); ctx.lineTo(60, 0);
            ctx.moveTo(0, -60); ctx.lineTo(0, 60);
            ctx.stroke();

            // Body
            ctx.fillStyle = '#1a1a2e';
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Blinking Lights
            ctx.fillStyle = Math.floor(globalTime * 5) % 2 === 0 ? '#ff0000' : '#330000';
            ctx.beginPath();
            ctx.arc(0, -25, 3, 0, Math.PI * 2);
            ctx.fill();

            // Turrets
            // Turret 1
            ctx.save();
            ctx.rotate(Math.sin(globalTime * 0.5));
            ctx.fillStyle = '#777';
            ctx.fillRect(-2, -25, 4, 15);
            ctx.restore();
            
            // Turret 2
            ctx.save();
            ctx.rotate(Math.sin(globalTime * 0.5 + Math.PI));
            ctx.fillStyle = '#777';
            ctx.fillRect(-2, 10, 4, 15);
            ctx.restore();

            // Antenna
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(0, -35);
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, -35,
