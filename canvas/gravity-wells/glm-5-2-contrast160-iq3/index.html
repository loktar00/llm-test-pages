<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Painting</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#020004;height:100;width:100}
  canvas{display:block;position:fixed;top:0;left:0;pointer-events:none}
  #vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30,rgba(0,0,0,0.5) 100);mix-blend-mode:multiply;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vign"></div>
<script>
"use strict";
const cv=document.getElementById('c');
const ctx=cv.getContext('2',{alpha:true});
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth=window.innerWidth;
  H=cy=window.innerHeight;
  cv.width=Math.floor(W*DPR);
  cv.height=Math.floor(H*DPR);
  cv.style.width=W+'px';
  cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.onresize=resize;
resize();

const G=42000;
const MEE=6;
const MEE2=MEE*MEE;
const PAL=[
  {r:120,g:180,h:255},
  {r:180,g:120,h:60},
  {r:120,g:160,h:80},
  {r:160,g:160,h:120}
];
function hue(i){i=i%5;return PAL[i];}

class Well{
  constructor(b){this.x=Math.random()*W;this.y=Math.random()*H;this.m=4400+Math.random()*3200;this.vx=(Math.random()-0.5)*0.2;this.vy=(Math.random()-0.5)*0.2;this.tx=Math.random()*W;this.ty=Math.random()*H;this.tv=0.005+Math.random()*0.005;this.r=4+Math.random()*4;this.phase=Math.random()*7;this.age=0;this.alive=true;this.col=hue(b);}
  step(t,dt){this.age+=dt;if(this.age>2){if(Math.random()<0.025){this.tx=50+Math.random()*(W-100);this.ty=50+Math.random()*(H-100);}this.age=0;}const ddx=this.tx-this.x;const ddy=this.ty-this.y;const d=Math.hypot(ddx,ddy);if(d>0){const a=this.tv*dt/d;this.vx+=ddx*a;this.vy+=ddy*a;}this.vx*=Math.pow(0.98,dt);this.vy*=Math.pow(0.98,dt);this.x+=this.vx*dt;this.y+=this.vy*dt;if(this.x<50){this.x=50;this.vx*=-1;}if(this.x>W-50){this.x=W-50;this.vx*=-1;}if(this.y<50){this.y=50;this.vy*=-1;}if(this.y>H-50){this.y=H-50;this.vy*=-1;}}
}

const wells=[];
for(let i=0;i<4;i++)wells.push(new Well(i));

function merge(w){if(wells.length<=3)return false;let i=0,j=0,md=Infinity;for(let a=0;a<wells.length;a++){if(!wells[a].alive)continue;for(let b=a+1;b<wells.length;b++){if(!wells[b].alive)continue;const d=Math.hypot(wells[a].x-wells[b].x,wells[a].y-wells[b].y);if(d<md){md=d;i=a;j=b;}}}if(md<200&&md<Infinity){const wa=wells[i];const wb=wells[j];const tot=wa.m+wb.m;const nx=(wa.x*wa.m+wb.x*wb.m)/tot;const ny=(wa.y*wa.m+wb.y*wb.m)/tot;wa.x=nx;wa.y=ny,wa.m=Math.min(tot*0.9,8000);wa.m=tot*0.9;wa.vx=(wa.vx*wa.m+wb.vx*wb.m)/tot;wa.vy=(wa.vy*wa.m+wb.vy*wb.m)/tot;wb.alive=false;return true;}return false;}
function split(){if(wells.length>=6)return;const awells.find(w=>w.alive&&w.m>5500);if(!w)w=wells.find(w=>w.alive);if(!w)return;w.m*=0.55;const n=new Well(0);n.x=w.x+(Math.cos(w.phase)*40);n.y=w.y+(Math.sin(w.phase*2.21)*40);n.m=w.m;n.vx=w.vx+Math.cos(w.phase+1.7)*0.4;w.vy+=Math.sin(w.phase+1.7)*0.4;n.vy=w.vy-Math.cos(w.phase+1.7)*0.4;w.vx-=Math.cos(w.phase+1.7)*0.4;n.col=w.col;n.phase=w.phase+1.5;wells.push(n);}
//fix up
class Well{
  constructor(b){this.x=Math.random()*W;this.y=Math.random()*H;this.m=4400+Math.random()*3200;this.vx=(Math.random()-0.5)*0.2;this.vy=(Math.random()-0.5)*0.2;this.tx=Math.random()*W;this.ty=Math.random()*H;this.tv=0.005+Math.random()*0.005;this.r=4+Math.random()*4;this.phase=Math.random()*7;this.age=0;this.alive=true;this.col=hue(b);}
}

const wells=[];
for(let i=0;i<4;i++)wells.push(new Well(i));

function hue(i){i=i%5;return PAL[i];}
const PAL=[
  {r:120,g:180,h:255},
  {r:180,g:120,h:60},
  {r:120,g:160,h:80},
  {r:160,g:160,h:120}
];
class Well{
  constructor(b){this.x=Math.random()*W;this.y=Math.random()*H;this.m=4400+Math.random()*3200;this.vx=(Math.random()-0.5)*0.2;this.vy=(Math.random()-0.5)*0.2;this.tx=Math.random()*W;this.ty=Math.random()*H;this.tv=0.005+Math.random()*0.005;this.r=4+Math.random()*4;this.phase=Math.random()*7;this.age=0;this.alive=true;this.col=hue(b);}
}
const G=42000;
const MEE=6;
const MEE2=MEE*MEE;

const PART_PER_SIDE=250;
const MAXPART=PART_PER_SIDE*4;
const parts=new Float32Array(MAXPART*6);
const pcol=new Float32Array(MAXPART*3);
const plife=new Float32Array(MAXPART);
const pidx=[];for(let i=0;i<MAXPART;i++)pidx.push(i);
let pcount=0;
let spawnAcc=0;
const SPAWN_RATE=4500;

function spawnEdge(){const side=Math.floor(Math.random()*4);let x,y,u,v;if(side===0){y=-3;x=Math.random()*W;u=(Math.random()-0.5)*0.1;v=0.1+Math.random()*0.2;}if(side===1){x=W+3;y=Math.random()*H;v=(Math.random()-0.5)*0.1;u=-0.1-M.random()*0.2;}if(side===2){y=H+3;x=Math.random()*W;u=(Math.random()-0.5)*0.1;v=-0.1-M.random()*0.2;}if(side===3){x=-3;y=Math.random()*H;u=0.1+Math.random()*0.2;v=(Math.random()-0.5)*0.1;}if(pcount<MAXPART){const i=pidx[pcount];parts[i*6]=x;parts[i*6+1]=y;parts[i*6+2]=u;parts[i*6+3]=v;parts[i*6+4]=x;parts[i*6+5]=y;plife[i]=80+Math.random()*60;pcount++;}}

function stepWells(dt){for(const w of wells){if(!w.alive)continue;w.age+=dt;if(w.age>2.5){if(Math.random()<0.2){w.tx=50+Math.random()*(W-100);w.ty=50+Math.random()*(H-100);}w.age=0;}const ddx=w.tx-w.x;const ddy=w.ty-w.y;const d=Math.hypot(ddx,ddy);if(d>0){const a=w.tv*dt/d;w.vx+=ddx*a;w.vy+=ddy*a;}w.vx*=Math.pow(0.98,dt);w.vy*=Math.pow(0.98,dt);w.x+=w.vx*dt;w.y+=w.vy*dt;if(w.x<50){w.x=50;w.vx*=-1;}if(w.x>W-50){w.x=W-50;w.vx*=-1;}if(w.y<50){w.y=50;w.vy*=-1;}if(w.y>H-50){w.y=H-50;w.vy*=-1;}}}

let mergeTimer=0;
let splitTimer=0;

let lastT=performance.now();

function loop(now){
  const dt=Math.min(0.05,(now-lastT)/16.666)||0.016;
  lastT=now;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(8,0,16,0.04)';
  ctx.fillRect(0,0,W,H);

  stepWells(dt);

  spawnAcc+=SPAWN_RATE*dt/16.666;
  while(spawnAcc>1){spawnEdge();spawnAcc--;}

  ctx.globalCompositeOperation='lighter';

  const aliveWells=wells.filter(w=>w.alive);
  const n=aliveWells.length;
  const wx=new Float32Array(n);const wy=new Float32Array(n);const wm=new Float32Array(n);
  for(let i=0;i<n;i++){wx[i]=aliveWells[i].x;wy[i]=aliveWells[i].y;wm[i]=aliveWells[i].m;}

  //SIMD-like manual loop
  const pa=parts,pco=pcol,pl=plife;
  for(let k=0;k<MAXPART;k++){
    if(pl[k]<=0)continue;
    let px=pa[k*6];let py=pa[k*6+1];
    let pvx=pa[k*6+2];let pvy=pa[k*6+3];
    let ax=0;let ay=0;
    for(let wi=0;wi<n;wi++){
      const dx=wx[wi]-px;const dy=wy[wi]-py;const d2=dx*dx+dy*dy;
      const d=Math.sqrt(d2+MEE2);
      const f=G*wm[wi]/(d2*d+1);
      ax+=dx*f;ay+=dy*f;
    }
    const oldX=pa[k*6+4];const oldY=pa[k*6+5];
    const nvx=(pvx+ax*dt)*0.9999;const nvy=(pvy+ay*dt)*0.9999;
    const nx=px+nvx*dt;const ny=py+nvy*dt;
    pa[k*6]=nx;pa[k*6+1]=ny;pa[k*6+2]=nvx;pa[k*6+3]=nvy;pa[k*6+4]=px;pa[k*6+5]=py;
    //draw line
    const c=pco+k*3;
    ctx.strokeStyle=`rgba(${pco[k*3]|0},${pco[k*3+1]|0},${pco[k*3+2]|0,0.8)`;
    ctx.lineWidth=1.3;
    ctx.beginPath();
    ctx.moveTo(oldX,oldY);
    ctx.lineTo(nx,ny);
    ctx.stroke();
    pl[k]-=1.7*dt;
    if(pl[k]<=0||nx<-10||nx>W+10||ny<-10||ny>H+10){pl[k]=0;}
  }

  //decay wells
  mergeTimer+=dt;
  if(mergeTimer>2.5){if(Math.random()<0.4){merge();wells=wells.filter(w=>w.alive);if(wells.length<3){wells.push(new Well(wells.length));}}if(Math.random()<0.1&&wells.length<5)split();mergeTimer=0;}

  //request next
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
