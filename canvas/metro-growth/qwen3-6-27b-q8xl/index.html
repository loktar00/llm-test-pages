<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transit Growth</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a0a;
}
canvas {
  display: block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
const GRID = 40;
const LINE_COLORS = [
  '#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6',
  '#1abc9c', '#e67e22', '#ecf0f1', '#34495e', '#e84393',
  '#00cec9', '#fdcb6e', '#6c5ce7', '#00b894', '#d63031'
];

let lines = [];
let trains = [];
let phase = 'building';
let buildIndex = 0;
let buildTimer = 0;
const BUILD_INTERVAL = 12;
const TRAIN_SPEED = 0.008;
const FADE_DURATION = 180;
let fadeTimer = 0;
let globalAlpha = 1;
let cycleDelay = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function snap(v) {
  return Math.round(v / GRID) * GRID;
}

function generateRoute(startX, startY, targetX, targetY, maxLen) {
  const sx = snap(startX);
  const sy = snap(startY);
  const tx = snap(targetX);
  const ty = snap(targetY);

  const points = [{x: sx, y: sy}];
  let cx = sx, cy = sy;
  let len = 0;
  const steps = 2000;

  for (let i = 0; i < steps && len < maxLen; i++) {
    const dx = tx - cx;
    const dy = ty - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < GRID * 1.5) {
      points.push({x: tx, y: ty});
      break;
    }

    const angle = Math.atan2(dy, dx);
    const angles = [];
    for (let a = -Math.PI; a <= Math.PI; a += Math.PI / 4) {
      angles.push(a);
    }
    angles.sort((a, b) => Math.abs(a - angle) - Math.abs(b - angle));

    let moved = false;
    for (const ang of angles) {
      const nx = snap(cx + Math.cos(ang) * GRID * 2);
      const ny = snap(cy + Math.sin(ang) * GRID * 2);

      if (nx < -GRID || nx > W + GRID || ny < -GRID || ny > H + GRID) continue;

      let tooClose = false;
      for (const p of points) {
        if (Math.abs(p.x - nx) < GRID * 1.2 && Math.abs(p.y - ny) < GRID * 1.2) {
          if (p.x === nx && p.y === ny) { tooClose = true; break; }
          const d = Math.sqrt((p.x - nx) ** 2 + (p.y - ny) ** 2);
          if (d < GRID * 1.2) { tooClose = true; break; }
        }
      }
      if (tooClose) continue;

      cx = nx;
      cy = ny;
      points.push({x: cx, y: cy});
      len++;
      moved = true;
      break;
    }
    if (!moved) break;
  }

  return points;
}

function createLine(index) {
  const margin = GRID * 3;
  const startX = margin + Math.random() * (W - margin * 2);
  const startY = margin + Math.random() * (H - margin * 2);
  const targetX = margin + Math.random() * (W - margin * 2);
  const targetY = margin + Math.random() * (H - margin * 2);

  let route = generateRoute(startX, startY, targetX, targetY, 80);

  if (route.length < 4) {
    route = [{x: snap(startX), y: snap(startY)}];
    let cx = route[0].x, cy = route[0].y;
    const dir = Math.random() * Math.PI * 2;
    for (let i = 0; i < 30; i++) {
      cx += Math.cos(dir) * GRID * 2;
      cy += Math.sin(dir) * GRID * 2;
      cx = Math.max(-GRID, Math.min(W + GRID, snap(cx)));
      cy = Math.max(-GRID, Math.min(H + GRID, snap(cy)));
      route.push({x: cx, y: cy});
    }
  }

  const stations = [];
  for (let i = 0; i < route.length; i++) {
    const isStart = i === 0;
    const isEnd = i === route.length - 1;
    let isInterchange = false;

    for (const other of lines) {
      for (const s of other.stations) {
        if (Math.abs(s.x - route[i].x) < GRID * 0.8 &&
            Math.abs(s.y - route[i].y) < GRID * 0.8) {
          isInterchange = true;
          break;
        }
      }
      if (isInterchange) break;
    }

    stations.push({
      x: route[i].x,
      y: route[i].y,
      isStart,
      isEnd,
      isInterchange
    });
  }

  return {
    color: LINE_COLORS[index % LINE_COLORS.length],
    route,
    stations,
    revealed: 0,
    total: route.length,
    complete: false,
    trainProgress: 0,
    trainActive: false,
    name: generateLineName(index)
  };
}

function generateLineName(index) {
  const prefixes = ['North', 'South', 'East', 'West', 'Central', 'Outer', 'Inner', 'Cross', 'Ring', 'Diagonal'];
  const suffixes = ['Line', 'Express', 'Route', 'Connector', 'Loop', 'Belt', 'Avenue', 'Corridor'];
  const p = prefixes[index % prefixes.length];
  const s = suffixes[(index * 3 + 1) % suffixes.length];
  return `${p} ${s}`;
}

function initCity() {
  lines = [];
  trains = [];
  phase = 'building';
  buildIndex = 0;
  buildTimer = 0;
  globalAlpha = 1;
  fadeTimer = 0;
  cycleDelay = 0;

  const numLines = 8 + Math.floor(Math.random() * 3);
  for (let i = 0; i < numLines; i++) {
    lines.push(createLine(i));
  }
}

function drawSmoothLine(points, color, lineWidth, alpha) {
  if (points.length < 2) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Shadow for glow effect
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 1; i < points.length - 1; i++) {
    const xc = (points[i].x + points[i + 1].x) / 2;
    const yc = (points[i].y + points[i + 1].y) / 2;
    ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
  }

  if (points.length > 1) {
    ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
  }

  ctx.stroke();
  ctx.restore();
}

function drawStation(station, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  if (station.isInterchange) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(station.x, station.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.arc(station.x, station.y, 3, 0, Math.PI * 2);
    ctx.fill();
  } else if (station.isStart || station.isEnd) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(station.x, station.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    ctx.fillStyle = color;
    ctx.fillRect(station.x - 2, station.y - 2, 4, 4);
  }

  ctx.restore();
}

function drawTrain(line, progress, alpha) {
  const route = line.route;
  if (route.length < 2) return;

  const totalLen = getRouteLength(route);
  const targetDist = progress * totalLen;

  let accumulated = 0;
  let tx = route[0].x, ty = route[0].y;

  for (let i = 0; i < route.length - 1; i++) {
    const dx = route[i + 1].x - route[i].x;
    const dy = route[i + 1].y - route[i].y;
    const segLen = Math.sqrt(dx * dx + dy * dy);

    if (accumulated + segLen >= targetDist) {
      const t = (targetDist - accumulated) / segLen;
      tx = route[i].x + dx * t;
      ty = route[i].y + dy * t;
      break;
    }
    accumulated += segLen;
  }

  ctx.save();
  ctx.globalAlpha = alpha;

  // Train body
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = line.color;
  ctx.shadowBlur = 15;

  const angle = Math.atan2(
    route[Math.min(Math.floor(progress * (route.length - 1)) + 1, route.length - 1)].y -
    route[Math.min(Math.floor(progress * (route.length - 1)), route.length - 2)].y,
    route[Math.min(Math.floor(progress * (route.length - 1)) + 1, route.length - 1)].x -
    route[Math.min(Math.floor(progress * (route.length - 1)), route.length - 2)].x
  );

  ctx.translate(tx, ty);
  ctx.rotate(angle);

  // Train shape
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(-10, -4, 20, 8, 3);
  ctx.fill();

  // Windows
  ctx.fillStyle = line.color;
  ctx.fillRect(-6, -2, 4, 4);
  ctx.fillRect(0, -2, 4, 4);

  // Headlight
  ctx.fillStyle = '#ffffaa';
  ctx.shadowColor = '#ffffaa';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(10, 0, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function getRouteLength(route) {
  let len = 0;
  for (let i = 0; i < route.length - 1; i++) {
    const dx = route[i + 1].x - route[i].x;
    const dy = route[i + 1].y - route[i].y;
    len += Math.sqrt(dx * dx + dy * dy);
  }
  return len;
}

function drawBackground() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.save();
  ctx.globalAlpha = 0.03;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += GRID) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += GRID) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTitle() {
  ctx.save();
  ctx.globalAlpha = 0.15 * globalAlpha;
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('TRANSIT GROWTH', 20, 30);
  ctx.font = '11px monospace';
  ctx.fillText(`Lines: ${lines.length}  |  Phase: ${phase}`, 20, 50);
  ctx.restore();
}

function drawLineLabel(line, alpha) {
  if (line.stations.length < 2) return;
  const mid = Math.floor(line.stations.length / 2);
  const s = line.stations[mid];

  ctx.save();
  ctx.globalAlpha = alpha * 0.7;
  ctx.fillStyle = line.color;
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';

  let labelY = s.y - 12;
  let labelX = s.x;

  // Avoid overlap with other labels
  const angle = Math.atan2(
    line.stations[Math.min(mid + 1, line.stations.length - 1)].y -
    line.stations[Math.max(mid - 1, 0)].y,
    line.stations[Math.min(mid + 1, line.stations.length - 1)].x -
    line.stations[Math.max(mid - 1, 0)].x
  );

  if (Math.abs(Math.cos(angle)) > 0.5) {
    labelY = s.y - 14;
  } else {
    labelX = s.x + 14;
    labelY = s.y;
  }

  ctx.fillText(line.name, labelX, labelY);
  ctx.restore();
}

function update() {
  if (phase === 'building') {
    buildTimer++;
    if (buildTimer >= BUILD_INTERVAL && buildIndex < lines.length) {
      const line = lines[buildIndex];
      line.revealed++;

      if (line.revealed >= line.total) {
        line.complete = true;
        line.trainActive = true;
        line.trainProgress = 0;
        buildIndex++;
        buildTimer = 0;
      }
    }

    if (buildIndex >= lines.length) {
      // All lines built, wait a moment then fade
      if (buildTimer > 120) {
        phase = 'fading';
        fadeTimer = 0;
      }
    }
  } else if (phase === 'fading') {
    fadeTimer++;
    globalAlpha = Math.max(0, 1 - fadeTimer / FADE_DURATION);

    if (fadeTimer >= FADE_DURATION) {
      phase = 'transition';
      cycleDelay = 0;
    }
  } else if (phase === 'transition') {
    cycleDelay++;
    if (cycleDelay > 60) {
      initCity();
    }
  }

  // Update trains
  for (const line of lines) {
    if (line.trainActive) {
      line.trainProgress += TRAIN_SPEED;
      if (line.trainProgress >= 1) {
        line.trainProgress = 0;
      }
    }
  }
}

function draw() {
  drawBackground();

  if (phase === 'transition') {
    drawTitle();
    requestAnimationFrame(draw);
    return;
  }

  const a = globalAlpha;

  // Draw lines
  for (const line of lines) {
    const visiblePoints = line.route.slice(0, line.revealed);

    if (visiblePoints.length >= 2) {
      // Background track
      drawSmoothLine(visiblePoints, '#1a1a2e', 8, a * 0.5);
      // Colored line
      drawSmoothLine(visiblePoints, line.color, 4, a);
    }

    // Draw stations
    for (let i = 0; i < line.revealed; i++) {
      const s = line.stations[i];
      drawStation(s, line.color, a);
    }

    // Draw label when complete
    if (line.complete) {
      drawLineLabel(line, a);
    }

    // Draw train
    if (line.trainActive && line.complete) {
      drawTrain(line, line.trainProgress, a);

      // Draw second train going opposite
      const reverseProgress = (1 - line.trainProgress + 0.5) % 1;
      const reverseRoute = [...line.route].reverse();
      const reverseStations = [...line.stations].reverse().map(s => ({...s}));

      // Draw train on reversed route
      const totalLen = getRouteLength(reverseRoute);
      const targetDist = reverseProgress * totalLen;
      let accumulated = 0;
      let tx = reverseRoute[0].x, ty = reverseRoute[0].y;

      for (let i = 0; i < reverseRoute.length - 1; i++) {
        const dx = reverseRoute[i + 1].x - reverseRoute[i].x;
        const dy = reverseRoute[i + 1].y - reverseRoute[i].y;
        const segLen = Math.sqrt(dx * dx + dy * dy);
        if (accumulated + segLen >= targetDist) {
          const t = (targetDist - accumulated) / segLen;
          tx = reverseRoute[i].x + dx * t;
          ty = reverseRoute[i].y + dy * t;
          break;
        }
        accumulated += segLen;
      }

      ctx.save();
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = line.color;
      ctx.shadowBlur = 12;

      const nextIdx = Math.min(Math.floor(reverseProgress * (reverseRoute.length - 1)) + 1, reverseRoute.length - 1);
      const prevIdx = Math.min(Math.floor(reverseProgress * (reverseRoute.length - 1)), reverseRoute.length - 2);
      const angle = Math.atan2(
        reverseRoute[nextIdx].y - reverseRoute[prevIdx].y,
        reverseRoute[nextIdx].x - reverseRoute[prevIdx].x
      );

      ctx.translate(tx, ty);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.roundRect(-8, -3, 16, 6, 2);
      ctx.fill();
      ctx.fillStyle = line.color;
      ctx.fillRect(-4, -1.5, 3, 3);
      ctx.fillRect(1, -1.5, 3, 3);
      ctx.restore();
    }
  }

  drawTitle();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Polyfill roundRect if needed
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}

initCity();
loop();
</script>
</body>
</html>
