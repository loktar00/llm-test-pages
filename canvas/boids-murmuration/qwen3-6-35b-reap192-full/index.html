<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starling Murmuration</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // --- Setup ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        
        // --- Constants ---
        const BOID_COUNT = 550; // Number of birds
        const MAX_SPEED = 4.5;
        const MIN_SPEED = 2.0;
        const PERCEPTION_RADIUS = 40;
        const SEPARATION_RADIUS = 20;
        const SEPARATION_FORCE = 0.5;
        const COHESION_FORCE = 0.02;
        const ALIGNMENT_FORCE = 0.05;
        const LIMITS_FORCE = 0.5;
        const PREDATOR_INTERVAL = 300; // Frames between predator attacks
        const PREDATOR_FORCE = 1.5;
        const PREDATOR_RADIUS = 150;
        const PREDATOR_DURATION = 60;
        const FOG_DENSITY = 0.96; // Trail fade rate (0 to 1)

        // --- State ---
        let boids = [];
        let predator = null;
        let frameCount = 0;

        // --- Classes ---

        class Vector {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
            add(v) { this.x += v.x; this.y += v.y; return this; }
            sub(v) { this.x -= v.x; this.y -= v.y; return this; }
            mult(n) { this.x *= n; this.y *= n; return this; }
            div(n) { this.x /= n; this.y /= n; return this; }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            normalize() {
                const m = this.mag();
                if (m !== 0) this.div(m);
                return this;
            }
            limit(max) {
                if (this.mag() > max) {
                    this.normalize();
                    this.mult(max);
                }
                return this;
            }
            copy() { return new Vector(this.x, this.y); }
            static sub(v1, v2) { return new Vector(v1.x - v2.x, v1.y - v2.y); }
            static dist(v1, v2) { return Math.sqrt((v1.x - v2.x)**2 + (v1.y - v2.y)**2); }
        }

        class Boid {
            constructor() {
                this.pos = new Vector(Math.random() * width, Math.random() * height);
                this.vel = new Vector(Math.random() * 2 - 1, Math.random() * 2 - 1);
                this.vel.normalize().mult(Math.random() * 2 + MIN_SPEED);
                this.acc = new Vector(0, 0);
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(MAX_SPEED);
                this.pos.add(this.vel);
                this.acc.mult(0); // Reset accel
                this.checkEdges();
            }

            checkEdges() {
                const margin = 100;
                let turnForce = LIMITS_FORCE;
                
                if (this.pos.x < margin) this.vel.x += turnForce;
                if (this.pos.x > width - margin) this.vel.x -= turnForce;
                if (this.pos.y < margin) this.vel.y += turnForce;
                if (this.pos.y > height - margin) this.vel.y -= turnForce;
            }

            applyForce(f) {
                this.acc.add(f);
            }

            // Steer away from predator
            evade(p) {
                let desired = Vector.sub(this.pos, p.pos);
                let d = desired.mag();
                
                if (d < PREDATOR_RADIUS) {
                    desired.normalize();
                    // Stronger force as we get closer
                    const strength = (PREDATOR_RADIUS - d) / PREDATOR_RADIUS;
                    desired.mult(PREDATOR_FORCE * strength * 5); 
                    this.applyForce(desired);
                }
            }

            flock(boids) {
                let cohesion = new Vector(0, 0);
                let alignment = new Vector(0, 0);
                let separation = new Vector(0, 0);
                let count = 0;

                for (let other of boids) {
                    if (other !== this) {
                        let d = Vector.dist(this.pos, other.pos);
                        
                        if (d < PERCEPTION_RADIUS) {
                            // Cohesion
                            cohesion.add(other.pos);
                            
                            // Alignment
                            alignment.add(other.vel);
                            
                            // Separation
                            if (d < SEPARATION_RADIUS) {
                                let diff = Vector.sub(this.pos, other.pos);
                                diff.normalize();
                                diff.div(d); // Weight by distance
                                separation.add(diff);
                            }
                            count++;
                        }
                    }
                }

                if (count > 0) {
                    // Cohesion
                    cohesion.div(count);
                    cohesion.sub(this.pos);
                    cohesion.normalize();
                    cohesion.mult(MAX_SPEED);
                    cohesion.sub(this.vel);
                    cohesion.limit(0.1);
                    this.applyForce(cohesion.mult(COHESION_FORCE * 10));

                    // Alignment
                    alignment.div(count);
                    alignment.normalize();
                    alignment.mult(MAX_SPEED);
                    alignment.sub(this.vel);
                    alignment.limit(0.05);
                    this.applyForce(alignment.mult(ALIGNMENT_FORCE * 10));

                    // Separation
                    separation.div(count);
                    separation.normalize();
                    separation.mult(MAX_SPEED);
                    separation.sub(this.vel);
                    separation.limit(0.2);
                    this.applyForce(separation.mult(SEPARATION_FORCE * 10));
                }
            }

            draw(ctx) {
                // Speed variation makes them look like smoke (faster = slightly lighter/longer)
                const speed = this.vel.mag();
                const alpha = 0.6 + (speed / MAX_SPEED) * 0.4;
                ctx.fillStyle = `rgba(20, 20, 30, ${alpha})`;
                
                // Draw small elongated dots
                const size = 1.5 + speed * 0.2;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Predator {
            constructor() {
                // Spawn at edges
                if (Math.random() < 0.5) {
                    this.pos = new Vector(Math.random() < 0.5 ? -50 : width + 50, Math.random() * height);
                } else {
                    this.pos = new Vector(Math.random() * width, Math.random() < 0.5 ? -50 : height + 50);
                }
                
                // Target center-ish area
                const target = new Vector(width/2 + (Math.random() - 0.5) * width/2, height/2 + (Math.random() - 0.5) * height/2);
                let dir = Vector.sub(target, this.pos);
                dir.normalize();
                dir.mult(MAX_SPEED * 1.8); // Predator moves faster
                this.vel = dir;
                this.life = 0;
                this.active = true;
            }

            update() {
                this.pos.add(this.vel);
                this.life++;
                if (this.life > PREDATOR_DURATION) {
                    this.active = false;
                }
                // Keep it in bounds roughly
                if (this.pos.x < -100 || this.pos.x > width + 100 || this.pos.y < -100 || this.pos.y > height + 100) {
                    this.active = false;
                }
            }

            draw(ctx) {
                // Draw invisible threat (maybe a subtle distortion or nothing)
                // Or a very faint shadow to hint at it without revealing it
                const alpha = Math.max(0, 1 - (this.life / PREDATOR_DURATION)) * 0.1;
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, PREDATOR_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.fill();
            }
        }

        // --- Functions ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createStars();
            return width * height;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.7), // Only in upper sky
                    size: Math.random() * 1.5,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }

        function initBoids() {
            boids = [];
            for (let i = 0; i < BOID_COUNT; i++) {
                boids.push(new Boid());
            }
        }

        function drawBackground() {
            // Create dusk gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0f172a'); // Deep blue
            gradient.addColorStop(0.5, '#312e81'); // Indigo
            gradient.addColorStop(1, '#4c1d95'); // Purple base
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Draw Stars
            ctx.fillStyle = 'white';
            for (let s of stars) {
                ctx.globalAlpha = s.alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function drawLandscape() {
            ctx.fillStyle = '#020205'; // Almost black silhouette
            
            // Procedural hills
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.85);
            
            // Random jagged terrain
            let segW = 20;
            let h = height * 0.85;
            for(let x = 0; x <= width; x += segW) {
                // Simple noise using sin waves
                h = height * 0.85 + Math.sin(x * 0.005) * 30 + Math.sin(x * 0.02) * 10;
                ctx.lineTo(x, h);
            }
            
            ctx.lineTo(width, height);
            ctx.fill();

            // Tree silhouettes (sticks)
            ctx.fillStyle = '#000000';
            for(let i=0; i<width/15; i++) {
                let tx = Math.random() * width;
                let th = 20 + Math.random() * 40;
                let ty = height * 0.85 + Math.sin(tx * 0.005) * 30 + Math.sin(tx * 0.02) * 10;
                
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(tx, ty - th);
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Branches
                ctx.beginPath();
                ctx.moveTo(tx, ty - th*0.6);
                ctx.lineTo(tx + 10, ty - th*0.8);
                ctx.moveTo(tx, ty - th*0.8);
                ctx.lineTo(tx - 8, ty - th*0.9);
                ctx.stroke();
            }
        }

        function loop() {
            // 1. Draw Background (Redraws sky)
            drawBackground();

            // 2. Draw Landscape
            drawLandscape();

            // 3. Update Predator
            if (!predator) {
                if (frameCount % PREDATOR_INTERVAL === 0) {
                    predator = new Predator();
                }
            } else {
                predator.update();
                predator.draw(ctx);
            }

            // 4. Update Boids
            for (let boid of boids) {
                if (predator && predator.active) {
                    boid.evade(predator);
                }
                boid.flock(boids);
                boid.update();
            }

            // 5. Draw Boids
            // Use lighter composite operation to make flock look like smoke
            ctx.globalCompositeOperation = 'source-over';
            for (let boid of boids) {
                boid.draw(ctx);
            }

            // 6. Atmospheric Fog (Overlay)
            // Using a semi-transparent overlay to darken edges and blend smoke
            const fogGrad = ctx.createRadialGradient(width/2, height/2, height * 0.2, width/2, height/2, height * 0.9);
            fogGrad.addColorStop(0, 'rgba(10, 5, 20, 0)');
            fogGrad.addColorStop(1, 'rgba(10, 5, 20, 0.4)');
            ctx.fillStyle = fogGrad;
            ctx.fillRect(0, 0, width, height);

            frameCount++;
            requestAnimationFrame(loop);
        }

        // --- Init ---
        window.addEventListener('resize', () => {
            resize();
            initBoids();
        });
        
        resize();
        initBoids();
        loop();

    </script>
</body>
</html>
