<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Glyph Rain</title>
<style>
  * { margin:0; padding:0; overflow:hidden; }
  html,body { width:100%; height:100%; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="glyphCanvas"></canvas>
<script>
const canvas = document.getElementById('glyphCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const W = canvas.width, H = canvas.height;
const COLS = Math.floor(W / 20) + 2;
const LAYERS = 3;

const chars = 'アァカサタナハマヤラワガザダバプチッツヅフムユルユヱヶヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const words = ['CYBER','NEON','MATRIX','DIGITAL','QUANTUM','NEURON','SYNTH','GLYPH','VORTEX','PRISM','ORBIT','FLUX'];

const layers = [];
for(let l=0;l<LAYERS;l++) {
  const cols = [];
  const baseSpeed = 0.3 + l*0.4;
  for(let c=0;c<COLS+2;c++) {
    cols.push({
      x: c*20 + (l*10),
      speed: baseSpeed + Math.random()*0.4,
      trail: []
    });
  }
  layers.push({cols, size: 12-l*3, blur: l*1.5});
}

const headPositions = Array(COLS).fill(0).map(() => ({y: Math.random()*H, lastUpdate: 0}));
let cameraX = 0, cameraY = 0;
let wordsVisible = [];
let glitchTime = 0;
let lastFrame = 0;

function drawGlyph(x,y,char,size,blur,color) {
  ctx.save();
  ctx.filter = `blur(${blur}px)`;
  ctx.fillStyle = color;
  ctx.font = `${size}px monospace`;
  ctx.fillText(char, x, y);
  ctx.restore();
}

function animate(time) {
  const delta = time - lastFrame;
  lastFrame = time;
  
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0,0,W,H);
  
  // Camera drift
  cameraX += 0.02 * delta;
  cameraY += 0.015 * delta;
  const camOffsetX = Math.sin(cameraX) * 15;
  const camOffsetY = Math.cos(cameraY) * 10;
  
  // Update layers
  for(let li=0;li<layers.length;li++) {
    const layer = layers[li];
    ctx.save();
    ctx.translate(camOffsetX * (li*0.3), camOffsetY * (li*0.3));
    
    for(let ci=0;ci<layer.cols.length;ci++) {
      const col = layer.cols[ci];
      col.y = (col.y + col.speed * delta * 0.06) % (H + 200);
      if(col.y < 0) col.y = H + 200;
      
      col.trail.push({y: col.y, char: chars[Math.floor(Math.random()*chars.length)]});
      if(col.trail.length > 8) col.trail.shift();
      
      // Draw trail (fading)
      for(let t=0;t<col.trail.length;t++) {
        const alpha = (t+1)/col.trail.length * 0.6;
        const char = col.trail[t].char;
        drawGlyph(col.x, col.trail[t].y, char, layer.size*0.8, layer.blur, `rgba(0,180,180,${alpha})`);
      }
      
      // Head glow
      drawGlyph(col.x, col.y, col.trail[col.trail.length-1]?.char || 'ア', layer.size, layer.blur+1, '#ffffff');
      drawGlyph(col.x, col.y, col.trail[col.trail.length-1]?.char || 'ア', layer.size*1.2, layer.blur+2, 'rgba(128,0,255,0.4)');
    }
    ctx.restore();
  }
  
  // Glitch bursts
  glitchTime -= delta * 0.001;
  if(glitchTime <= 0 && Math.random() < 0.02) {
    glitchTime = 200 + Math.random()*300;
    for(let i=0;i<3;i++) {
      const gx = Math.random()*W;
      const gy = Math.random()*H;
      for(let j=0;j<5;j++) {
        const c = chars[Math.floor(Math.random()*chars.length)];
        drawGlyph(gx + (Math.random()-0.5)*60, gy + (Math.random()-0.5)*40, c, 10 + Math.random()*8, 3, '#ff00ff');
      }
    }
  }
  
  // Hidden words alignment
  if(Math.random() < 0.003 && wordsVisible.length === 0) {
    const word = words[Math.floor(Math.random()*words.length)];
    const startCol = Math.floor(Math.random()*(COLS - word.length - 2));
    wordsVisible.push({word, startCol, row: Math.floor(Math.random()*20), alpha: 1, life: 2000});
  }
  
  // Draw hidden words
  if(wordsVisible.length > 0) {
    const wv = wordsVisible[0];
    wv.life -= delta;
    wv.alpha = Math.min(wv.alpha, wv.life/500);
    
    if(wv.life <= 0 || wv.alpha <= 0.01) {
      wordsVisible.shift();
    } else {
      ctx.save();
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = `rgba(255,255,255,${wv.alpha * 0.7})`;
      ctx.textAlign = 'center';
      const rowY = H/2 + Math.sin(cameraY)*30 + wv.row * 20;
      
      for(let i=0;i<wv.word.length;i++) {
        const colIdx = wv.startCol + i;
        if(colIdx < COLS) {
          const x = colIdx * 20 + 10;
          // Find matching falling char
          const targetY = rowY;
          for(let li=0;li<LAYERS;li++) {
            const layer = layers[li];
            if(colIdx < layer.cols.length) {
              // Draw highlight behind falling glyphs
              ctx.globalAlpha = wv.alpha * 0.5;
              ctx.fillRect(x-8, targetY-12, 16, 18);
            }
          }
          ctx.globalAlpha = 1;
          ctx.fillText(wv.word[i], x, rowY + 4);
        }
      }
      ctx.restore();
    }
  }
  
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
