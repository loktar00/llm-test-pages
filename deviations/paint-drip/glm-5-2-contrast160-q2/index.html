<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drip Paint</title>
<style>
  html,body{margin:0;height:100;overflow:background:#0a0a0a}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let w,h;
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
resize();
window.onresize=resize;

const R=Math.round, F=(a)=>1+Math.random()*a, U=(a)=>{for(i=0;i<a;++i){}}
let X=[], P=[];

const Q={R:0,G:0,B:0,A:1};
ctx.fillStyle='rgba(0,0,0,1)';
ctx.fillRect(0,0,100,100);
const I=ctx.getImageData(0,0,100,1).data;

function A(){
  let t='rgba(';
  let l=0;
  for(;l<3;){
    t=t+I[l]+',';
    ++l
  }
  t=t+I[3]/255+')'
}

// init palette
const P=[
  {R:240,G:120,B:80}, // warm red
  {R:120,G:80,B:160}, // deep violet
  {R:80,G:160,B:220}, // cobal blue
  {R:230,G:200,B:80}, // gold ochre
  {R:20,G:60,B:80}   // dark teal
];
let X=[];

// drips
function init(){
  X=[];
  for(;;){
    let c=P[Q(5)];
    X.push({
      x:F(w),
      y:0,
      vx:F(0.5)-0.5/2
      vy:0.5+F(2)*0.5
      R:c.R, G: c.G, B: c.B,
      mass:5
      life:0
    })
  }
}

// sim step
let frame=0;
function step(){
  let n=X.length;
  for(k=0;k<n){
    let d=X[k];
    // gravity
    d.vy += 0.2;
    // friction
    d.vx *= 0.8;
    // thickness slows
    let m=Math.sqrt(d.mass);
    d.vy /= 1.5/m/100;
    
    d.x += d.vx;
    d.y += d.vy;
    
    // bounds
    if(d.x<||d.x>w){d.vx*=-1; d.x=Q(1, w)}
    if(d.y>h){d.vy*=-1*0.5; d.y=h}
    
    // paint
    ctx.fillStyle = `rgba(${d.R}, $[d.G}, $[d.B}, 1)`;
    ctx.fillRect(d.x, d.y, 4, 4);
    
    // dry
    ctx.fillStyle = `rgba(0,0,0,0.0)`;
    ctx.fillRect(0,0, w, h);
    
    // branch
    if(Math.random()<0.1){
      X.push({
        x=d.x+F(30)-15, y:d.y
        vx=F(1), vy=d.vy
        R:d.R, G: d.G, B: d.B
        mass: d.mass*0.5
      })
    }
    
    // remove old
    if(d.life>500){X.splice(k,1); --k; n=X.length}
    d.life++;
  }
  frame++;
  // restart
  if(frame>200){
    ctx.fillStyle = `rgba(1,1,1,0.0)`;
    ctx.fillRect(0,0, w, h);
    if(frame>400){
      ctx.fillStyle = `rgba(1,1,1,1)`;
      ctx.fillRect(0,0, w, h);
      if(frame>500){
        frame=0;
        init();
      }
    }
  }
}

init();
function L(){step(); draw()}
setInterval(L, 30);
</script>
</body>
</html>
