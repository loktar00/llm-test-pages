<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Living Weather Map</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #001e2d;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="weatherCanvas"></canvas>
    <script>
        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 2000;
        const gridScale = 40;
        
        // System Config
        const systems = [];
        const numSystems = 5;
        
        // Map Configuration
        const mapColors = {
            ocean: '#051e2e',
            land: '#2d3e28',
            landLight: '#3a5234',
            coast: '#8fa896'
        };

        // Initialization
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Noise Implementation (Simplex-like) ---
        // Simple pseudo-noise for weather patterns
        const perm = new Uint8Array(512);
        for(let i=0; i<256; i++) perm[i] = i;
        for(let i=255; i>0; i--) {
            const r = Math.floor(Math.random() * (i+1));
            [perm[i], perm[r]] = [perm[r], perm[i]];
            perm[i+256] = perm[i];
        }

        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
            return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
        }

        function noise(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            const u = fade(x);
            const v = fade(y);
            const A = perm[X] + Y;
            const B = perm[X + 1] + Y;
            return lerp(v, 
                lerp(u, grad(perm[A], x, y), grad(perm[B], x - 1, y)),
                lerp(u, grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1))
            );
        }

        // --- Vector Field Logic ---
        // Returns {x, y} vector at point x, y based on systems and noise
        function getField(x, y, time) {
            let vx = 0;
            let vy = 0;

            // 1. Synoptic Wind (Background)
            const scale = 0.0005;
            const n = noise(x * scale + time * 0.1, y * scale + time * 0.1);
            const angle = n * Math.PI * 4;
            vx += Math.cos(angle) * 1.5;
            vy += Math.sin(angle) * 1.5;

            // 2. System Influence (Highs and Lows)
            for (let sys of systems) {
                const dx = x - sys.x;
                const dy = y - sys.y;
                const distSq = dx*dx + dy*dy;
                const radius = 250 + sys.radiusMod;
                
                // Only affect if within range
                if (distSq < radius * radius) {
                    // Distance falloff
                    const falloff = Math.max(0, 1 - Math.sqrt(distSq) / radius);
                    const strength = sys.strength * falloff;

                    // Rotation direction: 1 for Low (CCW), -1 for High (CW)
                    const dir = sys.type === 'low' ? -1 : 1;

                    // Tangent vector
                    // Normalize distance vector to get radius direction, then rotate 90
                    const dist = Math.sqrt(distSq) || 1;
                    const nx = dx / dist;
                    const ny = dy / dist;
                    
                    // Tangent
                    const tx = -ny * dir;
                    const ty = nx * dir;

                    vx += tx * strength;
                    vy += ty * strength;

                    // Inward/Outward flow
                    const flow = sys.type === 'low' ? 0.5 : -0.5;
                    vx += nx * flow * strength;
                    vy += ny * flow * strength;
                }
            }

            return { x: vx, y: vy };
        }

        // --- System Generation ---
        function createSystem() {
            const type = Math.random() > 0.5 ? 'low' : 'high';
            return {
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.3) * 0.5, // General drift east/south
                vy: (Math.random() - 0.5) * 0.2,
                type: type,
                radiusMod: Math.random() * 100,
                strength: 0.5 + Math.random() * 1.5,
                life: 0
            };
        }

        function initSystems() {
            for(let i=0; i<numSystems; i++) {
                systems.push(createSystem());
            }
        }

        // --- Particles ---
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.life = Math.random() * 100;
                this.speed = 0.5 + Math.random() * 1.5;
                this.color = `rgba(255, 255, 255, ${0.1 + Math.random() * 0.3})`;
            }

            update(time) {
                const field = getField(this.x, this.y, time);
                const speed = Math.sqrt(field.x*field.x + field.y*field.y);
                
                // Normalize and apply particle speed
                if (speed > 0.1) {
                    this.x += (field.x / speed) * this.speed * speed;
                    this.y += (field.y / speed) * this.speed * speed;
                }

                this.life++;
                // Fade in/out
                if (this.life > 100) this.life = 100;

                // Recycle if out of bounds or too old
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height || this.life > 400) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.globalAlpha = Math.min(1, this.life / 20) * 0.4;
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x, this.y, 1.5, 1.5);
            }
        }

        // --- Rendering Helpers ---

        function drawOcean() {
            ctx.fillStyle = mapColors.ocean;
            ctx.fillRect(0, 0, width, height);
        }

        function drawLand(time) {
            // Procedural Landmass generation using noise grid
            // We draw this to an offscreen canvas or just re-draw every frame. 
            // For performance, we'll draw it to a temporary canvas once per "season" or just redraw if fast enough.
            // Redrawing every frame is safest for "evolving" but slow. 
            // Let's use a static noise for land shape, but animate the wind over it.
            
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y += 4) {
                for (let x = 0; x < width; x += 4) {
                    // Simple noise blob for continent
                    let n = noise(x * 0.002, y * 0.002);
                    let n2 = noise(x * 0.005 + 100, y * 0.005 + 100);
                    
                    if (n + n2 > 0.1) {
                        // Land
                        let temp = noise(x * 0.001, y * 0.001 + time * 0.05);
                        
                        // Temp Color Mapping
                        // Cold (Blue) -> Hot (Orange/Red)
                        let r, g, b;
                        if (temp < -0.3) { r=180; g=200; b=220; } // Snow
                        else if (temp < 0.0) { r=180; g=200; b=160; } // Cool
                        else if (temp < 0.4) { r=220; g=200; b=140; } // Warm
                        else { r=230; g=160; b=100; } // Hot

                        // Fill 4x4 block
                        for(let dy=0; dy<4 && y+dy<height; dy++) {
                            for(let dx=0; dx<4 && x+dx<width; dx++) {
                                const idx = ((y+dy)*width + (x+dx)) * 4;
                                data[idx] = r;
                                data[idx+1] = g;
                                data[idx+2] = b;
                                data[idx+3] = 255;
                            }
                        }
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function drawFronts(time) {
            // Draw a simulated cold front
            // A front moves roughly West to East, wiggling
            const frontY = height * 0.4 + Math.sin(time * 0.001) * 50;
            
            ctx.beginPath();
            ctx.strokeStyle = '#4a90e2'; // Blue for cold
            ctx.lineWidth = 2;
            
            for (let x = 0; x < width; x += 5) {
                const wave = Math.sin(x * 0.01 + time * 0.05) * 20 + (frontY + Math.sin(x*0.05)*10);
                if (x===0) ctx.moveTo(x, wave);
                else ctx.lineTo(x, wave);
            }
            ctx.stroke();

            // Draw triangles
            ctx.fillStyle = '#4a90e2';
            for (let x = 0; x < width; x += 40) {
                const wave = Math.sin(x * 0.01 + time * 0.05) * 20 + (frontY + Math.sin(x*0.05)*10);
                // Triangle points down (cold air moving south)
                ctx.beginPath();
                ctx.moveTo(x, wave);
                ctx.lineTo(x + 5, wave - 10);
                ctx.lineTo(x - 5, wave - 10);
                ctx.fill();
            }
        }

        function drawRain(time) {
            // Rain bands associated with systems
            ctx.globalCompositeOperation = 'source-over';
            
            systems.forEach(sys => {
                if (sys.type === 'low') {
                    const radius = 150 + sys.radiusMod;
                    const x = sys.x;
                    const y = sys.y;
                    
                    // Sweeping rain effect
                    const angle = time * 0.02;
                    
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(angle);
                    
                    // Draw multiple rain bands
                    for(let i=0; i<5; i++) {
                        ctx.beginPath();
                        const bandY = (i - 2) * 30;
                        const bandWidth = 100;
                        const offset = Math.sin(time * 0.1 + i) * 20;
                        
                        ctx.rect(-bandWidth, bandY + offset, bandWidth*2, 40);
                        
                        // Gradient for rain
                        const grad = ctx.createRadialGradient(0, bandY, 10, 0, bandY, 100);
                        grad.addColorStop(0, 'rgba(200, 220, 255, 0.15)');
                        grad.addColorStop(1, 'rgba(200, 220, 255, 0)');
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                    ctx.restore();
                }
            });
            
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawSystems(time) {
            // Draw Highs and Lows
            systems.forEach(sys => {
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // Glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = sys.type === 'low' ? 'rgba(0,0,255,0.5)' : 'rgba(255,0,0,0.5)';
                
                ctx.fillStyle = sys.type === 'low' ? '#0044aa' : '#cc2200';
                ctx.fillText(sys.type === 'low' ? 'L' : 'H', sys.x, sys.y);
                
                ctx.shadowBlur = 0;

                // Draw isobars (concentric circles) - simplified
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(sys.x, sys.y, 50, 0, Math.PI*2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(sys.x, sys.y, 80, 0, Math.PI*2);
                ctx.stroke();
            });
        }

        function drawPressureGradient(time) {
            // Visualize pressure as subtle background color overlay
            // This is expensive to do per pixel, so we use a coarse grid or just rely on the land temp
            // Let's skip heavy per-pixel pressure rendering to keep FPS high, 
            // relying on the vector field and isobars for pressure indication.
        }

        // --- Main Loop ---
        let lastTime = 0;
        let time = 0;

        function animate(timestamp) {
            const dt = timestamp - lastTime;
            lastTime = timestamp;
            time = timestamp * 0.001; // seconds

            // Update Systems
            systems.forEach(sys => {
                sys.x += sys.vx;
                sys.y += sys.vy;
                sys.life++;
                
                // Respawn if out of bounds
                if (sys.x > width + 300 || sys.x < -300 || sys.y > height + 300 || sys.y < -300) {
                    // Move to opposite side roughly
                    sys.x = Math.random() > 0.5 ? -200 : width + 200;
                    sys.y = Math.random() * height;
                    sys.life = 0;
                }
            });

            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Ocean Base
            drawOcean();

            // 2. Draw Land (Temperature Map)
            // We draw land every frame to allow for slight temperature shifts if we wanted, 
            // but for now static noise land is fine.
            drawLand(time);

            // 3. Draw Rain (Behind particles)
            drawRain(time);

            // 4. Draw Wind Particles
            // Update and draw many particles
            ctx.globalCompositeOperation = 'screen'; // Additive blending for flow look
            particles.forEach(p => {
                p.update(time);
                p.draw(ctx);
            });
            ctx.globalCompositeOperation = 'source-over';

            // 5. Draw Fronts
            drawFronts(time);

            // 6. Draw Systems (Text & Isobars)
            drawSystems(time);

            requestAnimationFrame(animate);
        }

        // Setup
        initSystems();
        for(let i=0; i<particleCount; i++) {
            particles.push(new Particle());
        }

        requestAnimationFrame(animate);

    </script>
</body>
</html>
