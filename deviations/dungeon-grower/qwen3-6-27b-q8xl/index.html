<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Carver</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, COLS, ROWS, TILE;
const WALL = 0, FLOOR = 1, CORRIDOR = 2, REVEALED = 3;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  TILE = Math.max(12, Math.min(24, Math.floor(Math.min(W, H) / 40)));
  COLS = Math.floor(W / TILE);
  ROWS = Math.floor(H / TILE);
}
resize();
window.addEventListener('resize', () => { resize(); init(); });

let grid, revealed, roomList, torches, explorer, generationQueue, genIndex;
let phase, phaseTimer, fadeAlpha, cycleTimer;
const PHASE_GEN = 0, PHASE_EXPLORE = 1, PHASE_FADE = 2;

function init() {
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(WALL));
  revealed = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  roomList = [];
  torches = [];
  generationQueue = [];
  genIndex = 0;
  phase = PHASE_GEN;
  phaseTimer = 0;
  fadeAlpha = 0;
  cycleTimer = 0;
  generateDungeon();
  explorer = {
    x: 0, y: 0,
    visited: new Set(),
    dir: { x: 1, y: 0 },
    moveTimer: 0,
    moveInterval: 8,
    found: false
  };
}

function rectsOverlap(a, b, margin) {
  return a.x - margin < b.x + b.w && a.x + a.w + margin > b.x &&
         a.y - margin < b.y + b.h && a.y + a.h + margin > b.y;
}

function generateDungeon() {
  roomList = [];
  const maxRooms = 12 + Math.floor(Math.random() * 8);
  let attempts = 0;

  while (roomList.length < maxRooms && attempts < 500) {
    attempts++;
    const rw = 4 + Math.floor(Math.random() * 6);
    const rh = 4 + Math.floor(Math.random() * 6);
    const rx = 2 + Math.floor(Math.random() * (COLS - rw - 4));
    const ry = 2 + Math.floor(Math.random() * (ROWS - rh - 4));
    const rect = { x: rx, y: ry, w: rw, h: rh, cx: Math.floor(rx + rw / 2), cy: Math.floor(ry + rh / 2) };

    if (!roomList.some(r => rectsOverlap(r, rect, 1))) {
      roomList.push(rect);
      for (let dy = 0; dy < rh; dy++)
        for (let dx = 0; dx < rw; dx++)
          grid[ry + dy][rx + dx] = FLOOR;
    }
  }

  for (let i = 1; i < roomList.length; i++) {
    const a = roomList[i - 1], b = roomList[i];
    carveCorridor(a.cx, a.cy, b.cx, b.cy);
  }

  // Extra connections for loops
  for (let i = 0; i < Math.floor(roomList.length / 3); i++) {
    const a = roomList[Math.floor(Math.random() * roomList.length)];
    const b = roomList[Math.floor(Math.random() * roomList.length)];
    if (a !== b) carveCorridor(a.cx, a.cy, b.cx, b.cy);
  }

  buildGenerationQueue();
  placeTorches();
}

function carveCorridor(x1, y1, x2, y2) {
  const tiles = [];
  let cx = x1, cy = y1;
  while (cx !== x2) {
    if (grid[cy][cx] === WALL) tiles.push({ x: cx, y: cy });
    grid[cy][cx] = CORRIDOR;
    cx += cx < x2 ? 1 : -1;
  }
  while (cy !== y2) {
    if (grid[cy][cx] === WALL) tiles.push({ x: cx, y: cy });
    grid[cy][cx] = CORRIDOR;
    cy += cy < y2 ? 1 : -1;
  }
  return tiles;
}

function buildGenerationQueue() {
  generationQueue = [];
  const startRoom = roomList[0];
  const startCx = startRoom.cx, startCy = startRoom.cy;

  const visited = new Set();
  const queue = [{ x: startCx, y: startCy }];
  visited.add(`${startCx},${startCy}`);

  while (queue.length > 0) {
    const cur = queue.shift();
    generationQueue.push(cur);
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cur.x + dx, ny = cur.y + dy;
      const key = `${nx},${ny}`;
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !visited.has(key) && grid[ny][nx] !== WALL) {
        visited.add(key);
        queue.push({ x: nx, y: ny });
      }
    }
  }
}

function placeTorches() {
  torches = [];
  for (const room of roomList) {
    const positions = [
      { x: room.cx, y: room.cy },
      { x: room.x + 1, y: room.y + 1 },
      { x: room.x + room.w - 2, y: room.y + room.h - 2 }
    ];
    for (const p of positions) {
      if (grid[p.y] && grid[p.y][p.x] !== WALL) {
        torches.push({
          x: p.x, y: p.y,
          radius: 3.5 + Math.random() * 2,
          flickerSpeed: 2 + Math.random() * 4,
          flickerOffset: Math.random() * Math.PI * 2,
          intensity: 0.7 + Math.random() * 0.3
        });
      }
    }
  }
  // Torches in corridors at junctions
  for (let y = 1; y < ROWS - 1; y++) {
    for (let x = 1; x < COLS - 1; x++) {
      if (grid[y][x] === CORRIDOR) {
        let neighbors = 0;
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          if (grid[y+dy] && grid[y+dy][x+dx] !== WALL) neighbors++;
        }
        if (neighbors >= 3 && !torches.some(t => Math.abs(t.x - x) < 3 && Math.abs(t.y - y) < 3)) {
          torches.push({
            x, y,
            radius: 2.5 + Math.random() * 1.5,
            flickerSpeed: 2 + Math.random() * 4,
            flickerOffset: Math.random() * Math.PI * 2,
            intensity: 0.6 + Math.random() * 0.3
          });
        }
      }
    }
  }
}

function getTileColor(type, r, c, time) {
  if (type === WALL) {
    const n = ((r * 7 + c * 13) % 5);
    const base = 25 + n * 3;
    return `rgb(${base},${base},${base + 2})`;
  }
  const n = ((r * 11 + c * 7) % 7);
  const base = 55 + n * 4;
  if (type === CORRIDOR) return `rgb(${base - 5},${base - 3},${base - 8})`;
  return `rgb(${base},${base - 2},${base - 5})`;
}

function drawDungeon(time) {
  const offsetX = (W - COLS * TILE) / 2;
  const offsetY = (H - ROWS * TILE) / 2;

  // Draw all tiles
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!revealed[r][c]) {
        ctx.fillStyle = '#0a0a0c';
        ctx.fillRect(offsetX + c * TILE, offsetY + r * TILE, TILE + 1, TILE + 1);
        continue;
      }
      const type = grid[r][c];
      ctx.fillStyle = getTileColor(type, r, c, time);
      ctx.fillRect(offsetX + c * TILE, offsetY + r * TILE, TILE + 1, TILE + 1);

      // Subtle tile border
      if (type !== WALL) {
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(offsetX + c * TILE + 0.5, offsetY + r * TILE + 0.5, TILE, TILE);
      }
    }
  }

  // Draw torch light pools
  for (const torch of torches) {
    const flicker = Math.sin(time * torch.flickerSpeed + torch.flickerOffset) * 0.15 +
                    Math.sin(time * torch.flickerSpeed * 1.7 + torch.flickerOffset * 2.3) * 0.08;
    const r = torch.radius * TILE * (torch.intensity + flicker);
    const cx = offsetX + torch.x * TILE + TILE / 2;
    const cy = offsetY + torch.y * TILE + TILE / 2;

    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, `rgba(255,180,60,${0.35 + flicker * 0.5})`);
    grad.addColorStop(0.3, `rgba(255,140,30,${0.2 + flicker * 0.3})`);
    grad.addColorStop(0.6, `rgba(200,80,10,${0.08 + flicker * 0.15})`);
    grad.addColorStop(1, 'rgba(100,40,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    // Torch flame dot
    const flameFlicker = Math.sin(time * 8 + torch.flickerOffset) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,${200 + flameFlicker * 55},50,${flameFlicker})`;
    ctx.beginPath();
    ctx.arc(cx, cy - TILE * 0.15, TILE * 0.15 * flameFlicker, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw explorer
  if (phase === PHASE_EXPLORE && explorer.found) {
    const ex = offsetX + explorer.x * TILE + TILE / 2;
    const ey = offsetY + explorer.y * TILE + TILE / 2;
    const pulse = Math.sin(time * 4) * 0.2 + 0.8;

    // Explorer glow
    const eGrad = ctx.createRadialGradient(ex, ey, 0, ex, ey, TILE * 1.5);
    eGrad.addColorStop(0, 'rgba(100,200,255,0.15)');
    eGrad.addColorStop(1, 'rgba(100,200,255,0)');
    ctx.fillStyle = eGrad;
    ctx.fillRect(ex - TILE * 1.5, ey - TILE * 1.5, TILE * 3, TILE * 3);

    ctx.fillStyle = `rgba(120,210,255,${pulse})`;
    ctx.beginPath();
    ctx.arc(ex, ey, TILE * 0.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(200,240,255,${pulse})`;
    ctx.beginPath();
    ctx.arc(ex, ey, TILE * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }
}

function moveExplorer(dt) {
  explorer.moveTimer += dt;
  if (explorer.moveTimer < explorer.moveInterval) return;
  explorer.moveTimer = 0;

  const key = `${explorer.x},${explorer.y}`;
  explorer.visited.add(key);

  const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
  const unvisited = [];
  const visited = [];

  for (const d of dirs) {
    const nx = explorer.x + d.x, ny = explorer.y + d.y;
    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] !== WALL) {
      if (explorer.visited.has(`${nx},${ny}`)) {
        visited.push(d);
      } else {
        unvisited.push(d);
      }
    }
  }

  let chosen;
  if (unvisited.length > 0) {
    chosen = unvisited[Math.floor(Math.random() * unvisited.length)];
  } else if (visited.length > 0) {
    // Prefer direction opposite to where we came from
    const opposite = visited.filter(d => !(d.x === -explorer.dir.x && d.y === -explorer.dir.y));
    if (opposite.length > 0) {
      chosen = opposite[Math.floor(Math.random() * opposite.length)];
    } else {
      chosen = visited[Math.floor(Math.random() * visited.length)];
    }
  } else {
    // Stuck, pick random direction
    chosen = dirs[Math.floor(Math.random() * dirs.length)];
  }

  if (chosen) {
    explorer.dir = chosen;
    const nx = explorer.x + chosen.x, ny = explorer.y + chosen.y;
    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] !== WALL) {
      explorer.x = nx;
      explorer.y = ny;
    }
  }
}

let lastTime = 0;
let frameCount = 0;

function update(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  const time = timestamp / 1000;

  ctx.fillStyle = '#0a0a0c';
  ctx.fillRect(0, 0, W, H);

  if (phase === PHASE_GEN) {
    // Reveal tiles progressively
    const tilesPerFrame = Math.max(1, Math.floor(3 + genIndex * 0.02));
    for (let i = 0; i < tilesPerFrame && genIndex < generationQueue.length; i++, genIndex++) {
      const tile = generationQueue[genIndex];
      revealed[tile.y][tile.x] = true;
    }

    if (genIndex >= generationQueue.length) {
      // Place explorer at first room center
      if (roomList.length > 0) {
        explorer.x = roomList[0].cx;
        explorer.y = roomList[0].cy;
        explorer.found = true;
        explorer.visited.add(`${explorer.x},${explorer.y}`);
      }
      phase = PHASE_EXPLORE;
      phaseTimer = 0;
    }
  } else if (phase === PHASE_EXPLORE) {
    phaseTimer += dt;
    moveExplorer(dt);

    // Count visited vs total walkable
    let totalWalkable = 0;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (grid[r][c] !== WALL) totalWalkable++;

    const visitRatio = explorer.visited.size / totalWalkable;
    if (visitRatio > 0.85 && phaseTimer > 5) {
      phase = PHASE_FADE;
      phaseTimer = 0;
      fadeAlpha = 0;
    }
  } else if (phase === PHASE_FADE) {
    phaseTimer += dt;
    fadeAlpha = Math.min(1, phaseTimer / 1.5);

    if (fadeAlpha >= 1) {
      init();
    }
  }

  drawDungeon(time);

  // Fade overlay
  if (phase === PHASE_FADE) {
    ctx.fillStyle = `rgba(10,10,12,${fadeAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Vignette
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  frameCount++;
  requestAnimationFrame(update);
}

init();
requestAnimationFrame(update);
</script>
</body>
</html>
