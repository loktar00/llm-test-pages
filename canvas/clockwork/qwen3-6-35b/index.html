<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clockwork Automaton</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let cx, cy;

        // Configuration
        const COLORS = {
            bg: '#1a1510',
            brass: ['#b5a642', '#d4af37', '#8a7d2f', '#e6be8a'],
            iron: ['#505050', '#2b2b2b', '#707070', '#3a3a3a'],
            copper: ['#b87333', '#a0522d'],
            highlight: '#fffc99'
        };

        // Utility
        const rand = (min, max) => Math.random() * (max - min) + min;
        const randInt = (min, max) => Math.floor(rand(min, max));
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CLASSES ---

        class Gear {
            constructor(x, y, radius, teeth, colorPalette, type = 'brass') {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.teeth = teeth;
                this.type = type;
                this.palette = type === 'brass' ? COLORS.brass : COLORS.iron;
                this.angle = 0;
                this.angularVelocity = 0;
                this.driver = null; // Reference to gear driving this one
                this.children = []; // Gears driven by this one
                this.isBroken = false;
                this.vx = 0;
                this.vy = 0;
                this.originalPos = { x, y };
                
                // Physics for broken gears
                this.mass = radius;
            }

            setSpeed(speed) {
                if (this.driver) {
                    // Meshing logic: opposite direction, inverse ratio
                    const ratio = this.driver.teeth / this.teeth;
                    this.angularVelocity = -this.driver.angularVelocity * ratio;
                    this.angle += this.angularVelocity;
                    
                    // Pass speed down
                    this.children.forEach(child => {
                        child.setSpeed(speed * ratio * -1);
                    });
                } else {
                    this.angularVelocity = speed;
                    this.angle += this.angularVelocity;
                    this.children.forEach(child => {
                        child.setSpeed(speed);
                    });
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const toothHeight = this.radius * 0.15;
                const innerRadius = this.radius - toothHeight;

                // Draw Teeth
                ctx.beginPath();
                for (let i = 0; i < this.teeth; i++) {
                    const a = (i / this.teeth) * Math.PI * 2;
                    const nextA = ((i + 1) / this.teeth) * Math.PI * 2;
                    const halfTooth = (Math.PI / this.teeth) * 0.25;
                    
                    ctx.lineTo(Math.cos(a) * innerRadius, Math.sin(a) * innerRadius);
                    ctx.lineTo(Math.cos(a + halfTooth) * this.radius, Math.sin(a + halfTooth) * this.radius);
                    ctx.lineTo(Math.cos(a + halfTooth * 2) * this.radius, Math.sin(a + halfTooth * 2) * this.radius);
                    ctx.lineTo(Math.cos(nextA) * innerRadius, Math.sin(nextA) * innerRadius);
                }
                ctx.closePath();

                // Fill with gradient
                const grad = ctx.createRadialGradient(0, 0, innerRadius * 0.2, 0, 0, this.radius);
                grad.addColorStop(0, this.palette[2]);
                grad.addColorStop(0.5, this.palette[1]);
                grad.addColorStop(1, this.palette[0]);
                ctx.fillStyle = grad;
                ctx.fill();

                // Rim
                ctx.strokeStyle = this.palette[3];
                ctx.lineWidth = 2;
                ctx.stroke();

                // Spokes
                ctx.beginPath();
                const spokes = 4 + Math.floor(this.teeth / 4);
                for(let i=0; i<spokes; i++) {
                    const a = (i/spokes) * Math.PI * 2;
                    ctx.moveTo(Math.cos(a) * (innerRadius * 0.3), Math.sin(a) * (innerRadius * 0.3));
                    ctx.lineTo(Math.cos(a) * (innerRadius * 0.9), Math.sin(a) * (innerRadius * 0.9));
                }
                ctx.strokeStyle = this.palette[0];
                ctx.lineWidth = this.radius * 0.1;
                ctx.stroke();

                // Center Hole
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.bg;
                ctx.fill();
                ctx.stroke();

                // Highlight
                ctx.beginPath();
                ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fill();

                ctx.restore();
            }

            updatePhysics() {
                if (!this.isBroken) return;
                
                this.x += this.vx;
                this.y += this.vy;
                
                // Gravity
                this.vy += 0.1;

                // Friction
                this.vx *= 0.99;
                this.vy *= 0.99;

                // Rotation
                this.angle += this.angularVelocity;
                this.angularVelocity *= 0.98;

                // Bounce off walls
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -0.8; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -0.8; }
                if (this.y < this.radius) { this.y = this.radius; this.vy *= -0.8; }
                if (this.y > height - this.radius) { this.y = height - this.radius; this.vy *= -0.8; }
            }
        }

        class Escapement {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.angle = 0;
                this.speed = 0;
                this.targetSpeed = 0.05;
            }

            update(dt) {
                // Simple harmonic motion approximation for ticking
                this.speed = Math.cos(this.angle) * 0.1;
                this.angle += this.targetSpeed;
                
                // The locking fork
                this.forkAngle = Math.cos(this.angle * 10) * 0.3;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Anchor/Fork
                ctx.rotate(this.forkAngle);
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.moveTo(-5, 0);
                ctx.lineTo(5, 0);
                ctx.lineTo(0, -20);
                ctx.fill();

                // Wheel (Simplified)
                ctx.beginPath();
                for(let i=0; i<10; i++) {
                    const a = (i/10) * Math.PI * 2;
                    const r = i%2===0 ? 20 : 15;
                    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
                }
                ctx.closePath();
                ctx.fillStyle = COLORS.copper[0];
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Sprocket {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.teeth = 12;
                this.angle = 0;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                for(let i=0; i<this.teeth; i++) {
                    ctx.lineTo(Math.cos((i/this.teeth)*Math.PI*2)*this.radius, Math.sin((i/this.teeth)*Math.PI*2)*this.radius);
                }
                ctx.closePath();
                ctx.fillStyle = COLORS.iron[0];
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.stroke();
                ctx.restore();
            }
        }

        class Chain {
            constructor(startSprocket, endSprocket) {
                this.s1 = startSprocket;
                this.s2 = endSprocket;
            }

            update(speed) {
                this.s1.angle += speed;
                this.s2.angle += speed;
            }

            draw(ctx) {
                ctx.strokeStyle = '#444';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(this.s1.x, this.s1.y);
                // Rough approximation of a belt/chain
                ctx.lineTo(this.s2.x, this.s2.y);
                ctx.stroke();

                // Draw chain links (dashed)
                const dist = Math.hypot(this.s2.x - this.s1.x, this.s2.y - this.s1.y);
                const angle = Math.atan2(this.s2.y - this.s1.y, this.s2.x - this.s1.x);
                
                ctx.save();
                ctx.translate(this.s1.x, this.s1.y);
                ctx.rotate(angle);
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(dist, 0);
                ctx.stroke();
                ctx.restore();
            }
        }

        class AutomatonBird {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseY = y;
                this.flap = 0;
                this.active = false;
                this.timer = 0;
                this.interval = 45 * 60; // 45 seconds at 60fps
            }

            update() {
                this.timer++;
                
                if (this.active) {
                    this.flap += 0.5;
                    // Bob up and down while flapping
                    this.y = this.baseY - 20 + Math.sin(this.flap) * 10;
                    
                    if (this.timer > 200) { // Duration of chirp
                        this.active = false;
                        this.flap = 0;
                        this.y = this.baseY;
                        this.timer = 0;
                    }
                } else {
                    // Idle breathing
                    this.y = this.baseY + Math.sin(Date.now() / 500) * 2;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Body
                ctx.fillStyle = COLORS.brass[0];
                ctx.beginPath();
                ctx.ellipse(0, 0, 15, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Head
                ctx.beginPath();
                ctx.arc(0, -15, 8, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(5, -10);
                ctx.lineTo(0, -10);
                ctx.fillStyle = COLORS.copper[0];
                ctx.fill();

                // Wings
                ctx.fillStyle = COLORS.brass[2];
                const flapAngle = this.active ? Math.sin(this.flap) * 0.5 : 0;
                
                // Left Wing
                ctx.save();
                ctx.rotate(-0.5 + flapAngle);
                ctx.beginPath();
                ctx.ellipse(-10, 0, 20, 5, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                // Right Wing
                ctx.save();
                ctx.rotate(0.5 - flapAngle);
                ctx.beginPath();
                ctx.ellipse(10, 0, 20, 5, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                // Mechanical joints
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI*2);
                ctx.stroke();

                ctx.restore();
            }
        }

        class RepairArm {
            constructor() {
                this.x = 0;
                this.y = 0;
                this.targetX = 0;
                this.targetY = 0;
                this.active = false;
                this.angle = 0;
                this.graspOpen = 1;
            }

            activate(gear) {
                this.active = true;
                this.targetX = gear.x;
                this.targetY = gear.y;
                this.targetGear = gear;
                this.graspOpen = 1;
                this.state = 'approach';
            }

            update(gears) {
                if (!this.active) return;

                const speed = 0.1;
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    this.x += (dx / dist) * 10;
                    this.y += (dy / dist) * 10;
                    this.graspOpen = 1;
                } else {
                    // Arrived
                    if (this.state === 'approach') {
                        this.state = 'grasp';
                        this.graspOpen = 0;
                    } else if (this.state === 'grasp') {
                        this.state = 'return';
                        this.graspOpen = 0.5; // Hold it
                    } else if (this.state === 'return') {
                        // Snap gear back to place
                        if (this.targetGear) {
                            this.targetGear.isBroken = false;
                            this.targetGear.vx = 0;
                            this.targetGear.vy = 0;
                            this.targetGear.x = this.targetGear.originalPos.x;
                            this.targetGear.y = this.targetGear.originalPos.y;
                            this.targetGear.angularVelocity = 0;
                        }
                        this.state = 'retract';
                    } else if (this.state === 'retract') {
                        this.active = false;
                        this.graspOpen = 1;
                    }
                }
                
                // Simple physics rotation based on movement
                this.angle = Math.atan2(dy, dx) + Math.PI/2;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Arm base
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-10, 10);
                ctx.lineTo(10, 10);
                ctx.fill();

                // Claw
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, 20);
                
                // Left claw finger
                ctx.moveTo(0, 20);
                ctx.lineTo(-10 * this.graspOpen, 30);
                
                // Right claw finger
                ctx.moveTo(0, 20);
                ctx.lineTo(10 * this.graspOpen, 30);
                
                ctx.stroke();

                // Red light
                if (this.active) {
                    ctx.fillStyle = `rgba(255, 0, 0, ${Math.random()})`;
                    ctx.beginPath();
                    ctx.arc(0, 5, 3, 0, Math.PI*2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // --- INITIALIZATION ---

        const gears = [];
        const chains = [];
        let escapement;
        let bird;
        let repairArm;
        let pistonX, pistonY;

        function createMachine() {
            gears.length = 0;
            chains.length = 0;

            // Central Master Gear
            const master = new Gear(cx, cy, 60, 20, COLORS.brass);
            gears.push(master);

            // Train 1: Top Left (Escapement Driver)
            const g1 = new Gear(cx - 80, cy - 60, 30, 10, COLORS.iron);
            gears.push(g1);
            master.children.push(g1);
            g1.driver = master;

            const g2 = new Gear(cx - 140, cy - 120, 40, 15, COLORS.brass);
            gears.push(g2);
            g1.children.push(g2);
            g2.driver = g1;

            // Escapement
            escapement = new Escapement(cx - 200, cy - 120);
            
            // Train 2: Right Side (Chain Driver)
            const g3 = new Gear(cx + 80, cy - 50, 40, 16, COLORS.brass);
            gears.push(g3);
            master.children.push(g3);
            g3.driver = master;

            const sprocket1 = new Sprocket(cx + 200, cy - 50, 30);
            gears.push(sprocket1); // Hack: put sprocket in gears array to update chain
            g3.children.push(sprocket1);
            sprocket1.driver = g3; // reuse driver prop just to link

            const sprocket2 = new Sprocket(cx + 200, cy + 150, 20);
            sprocket2.driver = sprocket1; // Inherit rotation from chain logic
            // Manual chain link
            chains.push(new Chain(sprocket1, sprocket2));

            // Train 3: Bottom (Piston Driver)
            const g4 = new Gear(cx, cy + 90, 25, 10, COLORS.iron);
            gears.push(g4);
            master.children.push(g4);
            g4.driver = master;

            const g5 = new Gear(cx + 60, cy + 140, 50, 20, COLORS.brass);
            gears.push(g5);
            g4.children.push(g5);
            g5.driver = g4;

            // Automaton Bird
            bird = new AutomatonBird(cx - 140, cy - 190);

            // Piston coordinates
            pistonX = cx - 100;
            pistonY = cy + 100;

            repairArm = new RepairArm();
        }

        createMachine();

        // --- MAIN LOOP ---

        let lastTime = 0;
        let frameCount = 0;
        
        // Physics collision array
        const brokenGears = [];

        function update() {
            frameCount++;

            // 1. Drive Gears
            // Master runs at constant speed
            masterGear = gears[0];
            masterGear.angularVelocity = 0.02;
            masterGear.setSpeed(0.02);

            // Check broken gears physics
            for (let g of gears) {
                if (g.isBroken) {
                    g.updatePhysics();
                    
                    // Collision with other gears
                    for (let other of gears) {
                        if (g === other || !other.isBroken) continue;
                        const dist = Math.hypot(g.x - other.x, g.y - other.y);
                        if (dist < g.radius + other.radius) {
                            // Bounce
                            const angle = Math.atan2(g.y - other.y, g.x - other.x);
                            const force = 0.5;
                            g.vx += Math.cos(angle) * force;
                            g.vy += Math.sin(angle) * force;
                        }
                    }
                }
            }

            // 2. Chains
            chains.forEach(c => {
                // Chain speed depends on driver sprocket
                // We manually update sprocket rotation via the gear chain
                c.update(masterGear.angularVelocity * 2); 
            });

            // 3. Escapement
            // Driven by the gear train at top left
            if(gears.length > 1) {
                escapement.update();
            }

            // 4. Piston Animation (driven by bottom gear)
