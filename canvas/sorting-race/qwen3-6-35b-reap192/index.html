<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Race</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="raceCanvas"></canvas>
    <script>
        // --- Configuration ---
        const ALGO_SPEED_MULTIPLIER = 2; // Ops per frame
        const FONT_SIZE = 14;
        const PANEL_GAP = 10;
        
        // --- Colors ---
        const COLORS = {
            bg: '#050505',
            barsDefault: '#333333',
            cursor: '#FFFFFF',
            comparisons: ['#FF0055', '#00FF99', '#00CCFF', '#FFAA00'], // 4 colors for 4 algos
            swaps: ['#FFD700', '#FFD700', '#FFD700', '#FFD700'], // Gold for swaps
            text: '#FFFFFF',
            textHighlight: '#AAAAAA'
        };

        // --- State ---
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let algoCount = 4;
        let algoWidth;
        let currentSize = 50;
        
        // Algorithms definitions
        const algorithms = [
            { name: "Bubble Sort", color: COLORS.comparisons[0] },
            { name: "Insertion Sort", color: COLORS.comparisons[1] },
            { name: "Merge Sort", color: COLORS.comparisons[2] },
            { name: "Quick Sort", color: COLORS.comparisons[3] }
        ];

        // Instances
        let racers = [];
        let gameState = 'RACING'; // RACING, STANDINGS, RESHUFFLE
        let countdown = 0;
        let roundDuration = 0;

        // --- Classes ---

        class Racer {
            constructor(id, algo) {
                this.id = id;
                this.name = algo.name;
                this.color = algo.color;
                this.reset();
            }

            reset() {
                this.array = [];
                this.operations = 0;
                this.finished = false;
                this.finishTime = 0;
                this.rank = -1;
                
                // Cursor / State variables
                this.i = 0;
                this.j = 0;
                this.pivotIdx = 0;
                this.k = 0;
                this.pivotVal = 0;
                this.stack = []; // For Merge/Quick simulation
                this.sortedUntil = 0; // For visual effects
                
                // Initialize Array
                this.array = Array.from({ length: currentSize }, (_, i) => currentSize - i);
                this.shuffle(this.array);
            }

            shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            // --- State Machine Step ---
            step() {
                if (this.finished) return;

                // Limit operations per frame to control speed
                const opsLimit = 5 + (currentSize * ALGO_SPEED_MULTIPLIER);
                let ops = 0;

                while (ops < opsLimit && !this.finished) {
                    const op = this.runLogic();
                    if (op === 'done') {
                        this.finished = true;
                        this.finishTime = Date.now();
                    }
                    ops++;
                }
                this.operations += ops;
            }

            runLogic() {
                // 1. Bubble Sort
                if (this.id === 0) {
                    if (this.i < this.array.length - 1) {
                        this.j = 0;
                        while (this.j < this.array.length - 1 - this.i) {
                            // Comparison
                            this.operations++; 
                            if (this.array[this.j] > this.array[this.j + 1]) {
                                // Swap
                                [this.array[this.j], this.array[this.j + 1]] = [this.array[this.j + 1], this.array[this.j]];
                                this.operations += 2;
                            }
                            this.j++;
                            this.operations++;
                            return 'active';
                        }
                        this.i++;
                    } else {
                        return 'done';
                    }
                }

                // 2. Insertion Sort
                else if (this.id === 1) {
                    let key, j;
                    // Logic flattened to state machine
                    if (this.i >= this.array.length) return 'done';
                    
                    key = this.array[this.i];
                    j = this.i - 1;
                    
                    while (j >= 0) {
                        this.operations++; // comparison
                        if (this.array[j] > key) {
                            this.array[j + 1] = this.array[j];
                            this.operations++; // swap/logical move
                            j--;
                        } else {
                            break;
                        }
                    }
                    this.array[j + 1] = key;
                    this.operations++; // insertion
                    this.i++;
                }

                // 3. Merge Sort (Iterative Simulation)
                else if (this.id === 2) {
                    // Simple recursive stack simulation
                    if (this.stack.length === 0) {
                        this.mergeSort(0, this.array.length - 1);
                    }
                    
                    while (this.stack.length > 0) {
                        const current = this.stack.pop();
                        const { l, r, m, state } = current;

                        if (state === 0) {
                            // Enter left
                            this.stack.push({ l, r, m, state: 1 });
                            this.stack.push({ l, r, m, state: 0, stackObj: current }); // placeholder for resumption
                            this.stack.push({ l, m, r: m, m: Math.floor((l+m)/2), state: 0 });
                        } else if (state === 1) {
                            // Enter right
                            this.stack.push({ l, r, m, state: 2, stackObj: current });
                            this.stack.push({ l: m + 1, r, m: Math.floor((m+1+r)/2), state: 0 });
                        } else if (state === 2) {
                            // Merge
                            this.mergeStep(l, m, r);
                            return 'active';
                        }
                        
                        if (this.stack.length === 0 && current.state === 2) return 'done'; // Just finished top level
                    }
                    return 'done';
                }

                // 4. Quick Sort
                else if (this.id === 3) {
                    if (this.stack.length === 0) {
                        this.stack.push({ l: 0, r: this.array.length - 1 });
                    }

                    while (this.stack.length > 0) {
                        const { l, r } = this.stack[this.stack.length - 1];
                        
                        if (l < r) {
                            // Partition
                            let p = this.partition(l, r);
                            this.operations++;
                            if (p - l > 0) this.stack.push({ l, r: p - 1 });
                            if (r - p > 0) this.stack.push({ l: p + 1, r });
                            return 'active';
                        } else {
                            this.stack.pop();
                        }
                    }
                    return 'done';
                }
            }

            // Helper for Merge Sort
            mergeSort(l, r) {
                if (l < r) {
                    const m = Math.floor((l + r) / 2);
                    this.mergeSort(l, m);
                    this.mergeSort(m + 1, r);
                    this.merge(l, m, r);
                }
            }

            merge(l, m, r) {
                const n1 = m - l + 1;
                const n2 = r - m;
                const L = new Array(n1);
                const R = new Array(n2);

                for (let i = 0; i < n1; i++) L[i] = this.array[l + i];
                for (let j = 0; j < n2; j++) R[j] = this.array[m + 1 + j];

                let i = 0, j = 0, k = l;
                this.k = k; // cursor visual
                this.pivotIdx = i; // cursor visual L
                this.pivotVal = j; // cursor visual R

                while (i < n1 && j < n2) {
                    this.operations++;
                    if (L[i] <= R[j]) {
                        this.array[k] = L[i];
                        i++;
                    } else {
                        this.array[k] = R[j];
                        j++;
                    }
                    k++;
                    this.k = k;
                    this.pivotIdx = i;
                    this.pivotVal = j;
                }
                while (i < n1) {
                    this.array[k] = L[i];
                    k++; i++;
                    this.k = k;
                    this.pivotIdx = i;
                }
                while (j < n2) {
                    this.array[k] = R[j];
                    k++; j++;
                    this.k = k;
                    this.pivotVal = j;
                }
            }

            // Helper for Merge Sort Step (for stack simulation)
            mergeStep(l, m, r) {
                // Actually, simpler to just run the logic inside the step function above, 
                // but for the stack implementation, we need to replicate the merge logic 
                // incrementally or just call the full merge. 
                // For simplicity in this single-file constraint, we will execute the FULL merge logic 
                // when popped. The 'active' return prevents over-stepping if needed, 
                // but here we will just run it.
                const n1 = m - l + 1;
                const n2 = r - m;
                const L = new Array(n1);
                const R = new Array(n2);

                for (let i = 0; i < n1; i++) L[i] = this.array[l + i];
                for (let j = 0; j < n2; j++) R[j] = this.array[m + 1 + j];

                let i = 0, j = 0, k = l;
                
                // We run the whole merge here. 
                // To make it look "stepped", we could break this down, 
                // but merging small arrays happens fast visually anyway.
                while (i < n1 && j < n2) {
                    this.operations++;
                    if (L[i] <= R[j]) {
                        this.array[k] = L[i];
                        i++;
                    } else {
                        this.array[k] = R[j];
                        j++;
                    }
                    k++;
                }
                while (i < n1) {
                    this.array[k] = L[i];
                    k++; i++;
                }
                while (j < n2) {
                    this.array[k] = R[j];
                    k++; j++;
                }
            }

            // Helper for Quick Sort
            partition(l, r) {
                let pivot = this.array[r];
                let i = l - 1;
                
                for (let j = l; j < r; j++) {
                    this.operations++;
                    if (this.array[j] < pivot) {
                        i++;
                        [this.array[i], this.array[j]] = [this.array[j], this.array[i]];
                        this.operations++;
                    }
                }
                [this.array[i + 1], this.array[r]] = [this.array[r], this.array[i + 1]];
                this.operations++;
                return i + 1;
            }
        }

        // --- Initialization ---
        function init() {
            resize();
            createRacers();
            gameState = 'STANDINGS';
            countdown = 180; // 3 seconds at 60fps
        }

        function createRacers() {
            racers = [];
            for (let i = 0; i < algoCount; i++) {
                racers.push(new Racer(i, algorithms[i]));
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            algoWidth = (width - (PANEL_GAP * (algoCount + 1))) / algoCount;
        }

        window.addEventListener('resize', () => {
            resize();
            if(gameState === 'RACING') {
                // If resizing during race, logic holds, but drawing needs to handle new width
            }
        });

        // --- Game Loop ---
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function update() {
            if (gameState === 'RACING') {
                let allFinished = true;
                racers.forEach(r => {
                    r.step();
                    if (!r.finished) allFinished = false;
                });

                if (allFinished) {
                    gameState = 'STANDINGS';
                    countdown = 180;
                }
            } else if (gameState === 'STANDINGS') {
                countdown--;
                if (countdown <= 0) {
                    nextRound();
                }
            }
        }

        function nextRound() {
            currentSize += 5;
            if (currentSize > 300) currentSize = 50; // Cap and restart size eventually
            
            // Generate new palette
            const hue = Math.random() * 360;
            COLORS.comparisons = [
                `hsl(${hue}, 100%, 60%)`,
                `hsl(${(hue + 90) % 360}, 100%, 60%)`,
                `hsl(${(hue + 180) % 360}, 100%, 60%)`,
                `hsl(${(hue + 270) % 360}, 100%, 60%)`
            ];

            racers.forEach(r => r.reset());
            gameState = 'RACING';
        }

        // --- Drawing ---
        function draw() {
            // Clear
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, width, height);

            racers.forEach((racer, idx) => {
                const x = PANEL_GAP + idx * (algoWidth + PANEL_GAP);
                drawPanel(x, 0, algoWidth, height, racer);
            });

            if (gameState === 'STANDINGS') {
                drawStandingsOverlay();
            }
        }

        function drawPanel(x, y, w, h, r) {
            const barWidth = (w - 10) / currentSize;
            const totalHeight = h - 80; // Space for text at bottom

            // 1. Draw Bars
            for (let i = 0; i < currentSize; i++) {
                const val = r.array[i];
                // Map value 0..currentSize to height 0..totalHeight
                const barH = (val / currentSize) * totalHeight;
                const barX = x + 5 + i * barWidth;
                const barY = y + totalHeight - barH;

                // Color logic
                let color = '#333';
                
                // Highlight logic based on Algo State
                if (r.finished) {
                    color = '#111'; // Dim finished
                } else {
                    // Bubble: Compare i, j. Swap i, i+1
                    if (r.id === 0 && !r.finished) {
                        if (i === r.j || i === r.j + 1) color = r.color; // Compare
                        if (r.array[r.j] > r.array[r.j+1] && (i === r.j || i === r.j+1)) color = COLORS.swaps; // Swap
                    }
                    // Insertion: i is outer, j is inner, key is picked
                    else if (r.id === 1 && !r.finished) {
                        if (i === r.i) color = r.color; // Current element being sorted
                        if (i === r.i - 1 && r.j === r.i - 1) color = COLORS.swaps; // Moving
                    }
                    // Merge: l, m, r. Comparing L[pivotIdx] and R[pivotVal]
                    else if (r.id === 2 && !r.finished) {
                        // Highlighting the specific range being merged is hard visually without complex logic.
                        // We highlight the specific elements being compared in the temp arrays.
                        // Since we don't have the temp arrays in memory easily accessible in this tight loop without overhead,
                        // we rely on general "active" feel or just skip specific highlights for merge to keep perf high.
                        color = r.color; 
                    }
                    // Quick: l, r, pivotIdx
                    else if (r.id === 3 && !r.finished) {
                        if (i >= r.pivotIdx && i <= r.pivotVal) color = r.color; // Range
                        if (i === r.pivotVal) color = COLORS.swaps; // Pivot
                    }
                }

                ctx.fillStyle = color;
                ctx.fillRect(barX, barY, barWidth, barH);
            }

            // 2. Draw Title & Stats
            ctx.fillStyle = r.color;
            ctx.font = `bold ${FONT_SIZE}px monospace`;
            ctx.textAlign = 'left';
            ctx.fillText(r.name, x + 5, 20);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = `${FONT_SIZE - 4}px monospace`;
            ctx.fillText(`Ops: ${r.operations}`, x + 5, 40);
            ctx.fillText(`Status: ${r.finished ? 'DONE' : 'RUNNING'}`, x + 5, 60);
        }

        function drawStandingsOverlay() {
            // Sort by finish time
            const sorted = [...racers].sort((a, b) => a.finishTime - b.finishTime);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, width, height);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText('STANDINGS', width / 2, height / 2 - 50);

            sorted.forEach((r, i) => {
                ctx.fillStyle = r.color;
                ctx.font = '20px sans-serif';
                ctx.fillText(`#${i+1} ${r.name} - ${r.operations} Ops`, width / 2, height / 2 + i * 40);
            });
            
            ctx.fillStyle = '#888';
            ctx.font = '14px sans-serif';
            ctx.fillText(`Next round: ${Math.ceil(countdown / 60)}s`, width / 2, height / 2 + 120);
        }

        // Start
        init();
        loop();

    </script>
</body>
</html>
