<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Tank Battle Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .red { color: #ff6b6b; }
        .blue { color: #4ecdc4; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <h1>Battle Simulation</h1>
        <div class="stat red">Red Army: <span id="red-count">0</span></div>
        <div class="stat blue">Blue Army: <span id="blue-count">0</span></div>
        <div class="stat" style="margin-top:10px; color:#aaa; font-size:12px;">Endless Combat Mode</div>
    </div>
    <canvas id="mainCanvas"></canvas>
</div>

<script>
/**
 * GAME CONFIGURATION & CONSTANTS
 */
const CONFIG = {
    mapWidth: 1600,
    mapHeight: 1000,
    colors: {
        redTeam: '#ff6b6b',
        blueTeam: '#4ecdc4',
        neutral: '#95a5a6',
        grass: '#2d3436',
        wall: '#636e72'
    },
    units: {
        tank: { radius: 18, speed: 1.2, hp: 300, damage: 40, reload: 90, range: 350, color: null },
        soldier: { radius: 6, speed: 2.5, hp: 40, damage: 8, reload: 20, range: 150, color: null },
        bazooka: { radius: 8, speed: 2.2, hp: 50, damage: 150, reload: 120, range: 250, color: null }
    },
    terrain: {
        wallSize: 40,
        wallThickness: 10,
        obstacleCount: 20
    }
};

// Helper to get config based on team
const getUnitConfig = (type, team) => ({
    ...CONFIG.units[type],
    color: team === 'red' ? CONFIG.colors.redTeam : CONFIG.colors.blueTeam,
    oppositeColor: team === 'red' ? CONFIG.colors.blueTeam : CONFIG.colors.redTeam
});

/**
 * CORE ENGINE
 */
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

// Offscreen canvas for persistent terrain
const terrainCanvas = document.createElement('canvas');
const tCtx = terrainCanvas.getContext('2d');

// Simulation State
let lastTime = 0;
let entities = [];
let particles = [];
let bullets = [];
let walls = [];
let frameCount = 0;

// Resize handling
function resize() {
    // Scale canvas to fit window while maintaining aspect ratio (or stretch)
    // For this sim, we fill the window
    canvas.width = CONFIG.mapWidth;
    canvas.height = CONFIG.mapHeight;
    terrainCanvas.width = CONFIG.mapWidth;
    terrainCanvas.height = CONFIG.mapHeight;
    
    // Fill initial terrain
    resetTerrain();
}

function resetTerrain() {
    // Draw base grass
    tCtx.fillStyle = '#2e3b28'; // Dark green/brown
    tCtx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Add some noise/texture
    for(let i=0; i<5000; i++) {
        tCtx.fillStyle = Math.random() > 0.5 ? '#3a4a33' : '#252f20';
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        tCtx.fillRect(x, y, 2, 2);
    }

    // Draw Walls on Terrain (Permanent marks)
    walls.forEach(w => {
        tCtx.fillStyle = CONFIG.colors.wall;
        tCtx.fillRect(w.x, w.y, w.w, w.h);
        // Shadow
        tCtx.fillStyle = 'rgba(0,0,0,0.3)';
        tCtx.fillRect(w.x + 5, w.y + 5, w.w, w.h);
        // Highlight
        tCtx.fillStyle = 'rgba(255,255,255,0.1)';
        tCtx.fillRect(w.x, w.y, w.w, 2);
        tCtx.fillRect(w.x, w.y, 2, w.h);
    });
}

/**
 * CLASSES
 */

class Entity {
    constructor(x, y, type, team) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.team = team;
        this.id = Math.random().toString(36).substr(2, 9);
        
        const cfg = getUnitConfig(type, team);
        this.radius = cfg.radius;
        this.maxHp = cfg.hp;
        this.hp = cfg.hp;
        this.color = cfg.color;
        
        this.angle = 0; // Body angle
        this.turretAngle = 0;
        
        this.reloadTimer = Math.random() * cfg.reload;
        this.state = 'wander'; // wander, chase, attack
        this.target = null;
        this.moveTarget = { x: x, y: y };
        
        // Visuals
        this.dead = false;
        this.markStamps = []; // [x, y, type]
    }

    update() {
        if (this.dead) return;

        // 1. Find Target
        if (!this.target || this.target.dead) {
            this.target = this.findNearestEnemy();
        }

        // 2. State Logic
        if (this.type === 'tank') this.updateTank();
        else this.updateSoldier();

        // 3. Update Position (Soft collision/Steering)
        // Simple velocity based movement applied in main loop usually, 
        // but here we calculate desired vector.
        
        // Auto Reload
        if (this.reloadTimer > 0) this.reloadTimer--;
    }

    findNearestEnemy() {
        let nearest = null;
        let minDist = Infinity;
        const enemies = entities.filter(e => e.team !== this.team && !e.dead);
        
        for (let e of enemies) {
            const dx = e.x - this.x;
            const dy = e.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // Basic range check
            if (dist < (this.type === 'tank' ? 500 : 300)) {
                if (dist < minDist) {
                    minDist = dist;
                    nearest = e;
                }
            }
        }
        return nearest;
    }

    updateTank() {
        const cfg = getUnitConfig('tank', this.team);
        const dist = this.target ? Math.hypot(this.target.x - this.x, this.target.y - this.y) : 9999;

        // AI Logic
        if (this.target) {
            if (dist > cfg.range * 0.8) {
                // Move towards
                const angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                this.x += Math.cos(angle) * cfg.speed;
                this.y += Math.sin(angle) * cfg.speed;
                this.angle = angle;
                
                // Stamp Tracks
                if (frameCount % 10 === 0) {
                    const tx = this.x - Math.cos(angle) * 10;
                    const ty = this.y - Math.sin(angle) * 10;
                    tCtx.fillStyle = 'rgba(40, 40, 30, 0.4)';
                    tCtx.fillRect(tx - 6, ty - 6, 12, 12); // Track mark
                }
            } else {
                // Stop and Shoot
                this.x += (Math.random() - 0.5) * 0.5; // Idle jitter
                this.y += (Math.random() - 0.5) * 0.5;
            }
            
            // Turret always faces target (unless very close and spinning)
            this.turretAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
        } else {
            // Wander
            if (frameCount % 60 === 0) {
                this.moveTarget.x = this.x + (Math.random() - 0.5) * 200;
                this.moveTarget.y = this.y + (Math.random() - 0.5) * 200;
            }
            const angle = Math.atan2(this.moveTarget.y - this.y, this.moveTarget.x - this.x);
            this.x += Math.cos(angle) * (cfg.speed * 0.5);
            this.y += Math.sin(angle) * (cfg.speed * 0.5);
            this.angle = angle;
            this.turretAngle = this.angle;
        }

        // Collision Avoidance (Walls)
        this.resolveWallCollision();

        // Shooting
        if (this.reloadTimer <= 0 && this.target && dist < cfg.range) {
            this.shoot();
            this.reloadTimer = cfg.reload;
        }
    }

    updateSoldier() {
        const cfg = getUnitConfig(this.type, this.team);
        const dist = this.target ? Math.hypot(this.target.x - this.x, this.target.y - this.y) : 9999;

        if (this.target) {
            const angleToTarget = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            
            if (dist > cfg.range * 0.6) {
                // Move closer
                this.x += Math.cos(angleToTarget) * cfg.speed;
                this.y += Math.sin(angleToTarget) * cfg.speed;
                this.angle = angleToTarget;
            } else {
                // Strafe / Jitter
                this.x += Math.cos(angleToTarget + Math.PI/2) * (cfg.speed * 0.5);
                this.y += Math.sin(angleToTarget + Math.PI/2) * (cfg.speed * 0.5);
                this.angle = angleToTarget;
            }

            this.turretAngle = angleToTarget;
        } else {
             // Wander
             this.x += (Math.random() - 0.5) * 2;
             this.y += (Math.random() - 0.5) * 2;
        }

        this.resolveWallCollision();

        // Shooting
        if (this.reloadTimer <= 0 && this.target && dist < cfg.range) {
            this.shoot();
            this.reloadTimer = cfg.reload;
        }
    }

    resolveWallCollision() {
        walls.forEach(w => {
            // AABB check
            let closestX = Math.max(w.x, Math.min(this.x, w.x + w.w));
            let closestY = Math.max(w.y, Math.min(this.y, w.y + w.h));
            
            let dx = this.x - closestX;
            let dy = this.y - closestY;
            let distSq = dx*dx + dy*dy;
            
            // If inside or touching wall
            if (distSq < this.radius * this.radius) {
                // Push out
                let dist = Math.sqrt(distSq);
                if (dist === 0) dist = 0.1; // prevent div by 0
                let overlap = this.radius - dist;
                
                this.x += (dx / dist) * overlap;
                this.y += (dy / dist) * overlap;
            }
        });
    }

    shoot() {
        // Offset bullet spawn to tip of barrel
        const barrelLen = this.type === 'tank' ? 25 : 12;
        const bx = this.x + Math.cos(this.turretAngle) * barrelLen;
        const by = this.y + Math.sin(this.turretAngle) * barrelLen;
        
        bullets.push(new Bullet(bx, by, this.turretAngle, this.team, this.type));
        
        // Recoil push
        this.x -= Math.cos(this.turretAngle) * 1;
        this.y -= Math.sin(this.turretAngle) * 1;
    }

    takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) {
            this.die();
        }
    }

    die() {
        this.dead = true;
        
        // Stamp Terrain
        if (this.type === 'tank') {
            // Big wreck mark
            tCtx.fillStyle = 'rgba(20, 20, 20, 0.9)';
            tCtx.beginPath();
            tCtx.arc(this.x, this.y, 20, 0, Math.PI * 2);
            tCtx.fill();
            // Scorch
            tCtx.fillStyle = 'rgba(50, 20, 0, 0.6)';
            tCtx.beginPath();
            tCtx.arc(this.x, this.y, 35, 0, Math.PI * 2);
            tCtx.fill();
        } else {
            // Body mark
            tCtx.fillStyle = 'rgba(40, 20, 20, 0.8)';
            tCtx.beginPath();
            tCtx.arc(this.x, this.y, 4, 0, Math.PI * 2);
            tCtx.fill();
        }

        // Explosion Particles
        createExplosion(this.x, this.y, this.type === 'tank' ? 30 : 10);
    }
}

class Bullet {
    constructor(x, y, angle, team, type) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.team = team;
        this.type = type;
        this.speed = type === 'tank' ? 8 : 12;
        this.damage = type === 'tank' ? 40 : (type === 'bazooka' ? 150 : 8);
        this.radius = type === 'tank' ? 4 : 2;
        this.active = true;
    }

    update() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        // Bounds check
        if (this.x < 0 || this.x > CONFIG.mapWidth || this.y < 0 || this.y > CONFIG.mapHeight) {
            this.active = false;
            return;
        }

        // Wall collision
        walls.forEach(w => {
            if (this.x > w.x && this.x < w.w + w.x && this.y > w.y && this.y < w.h + w.y) {
                this.active = false;
                createExplosion(this.x, this.y, 5, true); // Spark
            }
        });

        // Unit collision
        const enemies = entities.filter(e => e.team !== this.team && !e.dead);
        for (let e of enemies) {
            const dx = this.x - e.x;
            const dy = this.y - e.y;
            if (dx*dx + dy*dy < (e.radius + this.radius) * (e.radius + this.radius)) {
                this.active = false;
                e.takeDamage(this.damage);
                createExplosion(this.x, this.y, 5, true); // Hit spark
                return;
            }
        }
    }
}

class Particle {
    constructor(x, y, color, speed, life) {
        this.x = x;
        this.y = y;
        this.color = color;
        const a = Math.random() * Math.PI * 2;
        this.vx = Math.cos(a) * (Math.random() * speed);
        this.vy = Math.sin(a) * (Math.random() * speed);
        this.life = life;
        this.maxLife = life;
        this.size = Math.random() * 3 + 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        this.size *= 0.95;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function createExplosion(x, y, count, isSparks=false) {
    const color = isSparks ? '#ffff00' : '#ff9f43';
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, isSparks ? 4 : 2, 20 + Math.random() * 20));
    }
    
    // Dirt dust for big explosions
    if(!isSparks) {
        for(let i=0; i<5; i++) {
            particles.push(new Particle(x, y, '#5c4033', 3, 40)); // Dirt puff
        }
    }
}

/**
 * SETUP & GENERATION
 */

function initWalls() {
    // Create random barricades
    const cols = 10;
    const rows = 6;
    const cellW = CONFIG.mapWidth / cols;
    const cellH = CONFIG.mapHeight / rows;

    for (let c = 1; c < cols - 1; c++) {
        for (let r = 1; r < rows - 1; r++) {
            if (Math.random() < 0.3) {
                const w = CONFIG.terrain.wallSize;
                // Horizontal wall
                walls.push({
                    x: c * cellW + (Math.random()-0.5)*20,
                    y: r * cellH,
                    w: w, h: CONFIG.terrain.wallThickness
                });
            }
            if (Math.random() < 0.2) {
                const w = CONFIG.terrain.wallSize;
                 // Vertical wall
                 walls.push({
                    x: c * cellW,
                    y: r * cellH + (Math.random()-0.5)*20,
                    w: CONFIG.terrain.wallThickness, h: w
                });
            }
        }
    }
}

function spawnUnits() {
    const margin = 100;
    
    // Spawn Reds (Left)
    for (let i = 0; i < 8; i++) {
        entities.push(new Entity(margin + Math.random()*100, Math.random() * CONFIG.mapHeight, 'tank', 'red'));
    }
    for (let i = 0; i < 15; i++) {
        entities.push(new Entity(margin + Math.random()*200, Math.random() * CONFIG.mapHeight, 'soldier', 'red'));
    }
    for (let i = 0; i < 3; i++) {
        entities.push(new Entity(margin + Math.random()*100, Math.random() * CONFIG.mapHeight, 'bazooka', 'red'));
    }

    // Spawn Blues (Right)
    for (let i = 0; i < 8; i++) {
        entities.push(new Entity(CONFIG.mapWidth - margin - Math.random()*100, Math.random() * CONFIG.mapHeight, 'tank', 'blue'));
    }
    for (let i = 0; i < 15; i++) {
        entities.push(new Entity(CONFIG.mapWidth - margin - Math.random()*200, Math.random() * CONFIG.mapHeight, 'soldier', 'blue'));
    }
    for (let i = 0; i < 3; i++) {
        entities.push(new Entity(CONFIG.mapWidth - margin - Math.random()*100, Math.random() * CONFIG.mapHeight, 'bazooka', 'blue'));
    }
}

/**
 * GAME LOOP
 */

function update() {
    frameCount++;

    // Update Entities
    entities.forEach(e => e.update());

    // Remove dead entities
    const initialCount = entities
