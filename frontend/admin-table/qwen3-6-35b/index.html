<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — User Management</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --primary: #6366f1;
    --primary-light: #a5b4fc;
    --primary-bg: #eef2ff;
    --success: #10b981;
    --success-bg: #d1fae5;
    --success-text: #065f46;
    --warning: #f59e0b;
    --warning-bg: #fef3c7;
    --warning-text: #92400e;
    --danger: #ef4444;
    --danger-bg: #fee2e2;
    --danger-text: #991b1b;
    --info: #3b82f6;
    --info-bg: #dbeafe;
    --info-text: #1e40af;
    --pending: #8b5cf6;
    --pending-bg: #ede9fe;
    --pending-text: #5b21b6;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.08);
    --transition: 200ms cubic-bezier(.4,0,.2,1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding: 2rem 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ── Header ── */
  .page-header {
    margin-bottom: 1.5rem;
  }
  .page-header h1 {
    font-size: 1.625rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: var(--text);
  }
  .page-header p {
    color: var(--text-secondary);
    font-size: .925rem;
    margin-top: .25rem;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .search-box {
    position: relative;
  }
  .search-box svg {
    position: absolute;
    left: .75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    width: 16px;
    height: 16px;
    pointer-events: none;
  }
  .search-box input {
    width: 260px;
    max-width: 100%;
    padding: .5rem .75rem .5rem 2.25rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: .875rem;
    color: var(--text);
    background: var(--bg);
    transition: border-color var(--transition), box-shadow var(--transition);
    outline: none;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    background: var(--surface);
  }
  .row-count {
    font-size: .8125rem;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* ── Table ── */
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .875rem;
    white-space: nowrap;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 10;
  }
  thead th {
    background: var(--surface);
    padding: .75rem 1rem;
    text-align: left;
    font-weight: 600;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-secondary);
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: color var(--transition), background var(--transition);
  }
  thead th:hover {
    color: var(--text);
    background: var(--bg);
  }
  thead th.sorted-asc, thead th.sorted-desc {
    color: var(--primary);
  }

  .sort-arrow {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-left: 4px;
    vertical-align: middle;
    transition: transform 300ms cubic-bezier(.4,0,.2,1), opacity 200ms;
  }
  .sort-arrow svg {
    width: 14px;
    height: 14px;
    transition: transform 300ms cubic-bezier(.4,0,.2,1);
  }
  .sort-arrow .arrow-up { opacity: .3; }
  .sort-arrow .arrow-down { opacity: .3; }
  thead th.sorted-asc .sort-arrow .arrow-up { opacity: 1; transform: translateY(-1px); }
  thead th.sorted-asc .sort-arrow .arrow-down { opacity: .3; }
  thead th.sorted-desc .sort-arrow .arrow-down { opacity: 1; transform: translateY(1px); }
  thead th.sorted-desc .sort-arrow .arrow-up { opacity: .3; }

  /* ── Body ── */
  tbody tr {
    transition: background var(--transition);
  }
  tbody tr:hover {
    background: var(--primary-bg);
  }
  tbody td {
    padding: .8rem 1rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    transition: transform 350ms cubic-bezier(.4,0,.2,1), opacity 250ms;
  }

  /* FLIP class */
  tbody tr.flip-animate {
    animation: flipSettle 400ms cubic-bezier(.4,0,.2,1);
  }
  @keyframes flipSettle {
    0%   { opacity: .3; transform: translateY(-6px); }
    60%  { opacity: 1; transform: translateY(2px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ── Checkbox ── */
  .checkbox-cell {
    width: 40px;
    min-width: 40px;
  }
  .custom-check {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    background: var(--surface);
    flex-shrink: 0;
  }
  .custom-check:hover {
    border-color: var(--primary);
  }
  .custom-check.checked {
    background: var(--primary);
    border-color: var(--primary);
  }
  .custom-check.checked svg {
    opacity: 1;
  }
  .custom-check.indeterminate {
    background: var(--primary);
    border-color: var(--primary);
  }
  .custom-check svg {
    width: 12px;
    height: 12px;
    color: white;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .custom-check.indeterminate::after {
    content: '';
    width: 8px;
    height: 2px;
    background: white;
    border-radius: 1px;
    position: absolute;
  }

  /* ── Avatar ── */
  .user-cell {
    display: flex;
    align-items: center;
    gap: .75rem;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: .75rem;
    color: #fff;
    flex-shrink: 0;
    letter-spacing: .02em;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .user-info { display: flex; flex-direction: column; }
  .user-name { font-weight: 600; color: var(--text); font-size: .875rem; }
  .user-email { font-size: .8rem; color: var(--text-secondary); }

  /* ── Status Chip ── */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: .2rem .65rem;
    border-radius: 999px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .chip.active { background: var(--success-bg); color: var(--success-text); }
  .chip.active .dot { background: var(--success); }
  .chip.inactive { background: var(--danger-bg); color: var(--danger-text); }
  .chip.inactive .dot { background: var(--danger); }
  .chip.pending { background: var(--warning-bg); color: var(--warning-text); }
  .chip.pending .dot { background: var(--warning); }
  .chip.trial { background: var(--info-bg); color: var(--info-text); }
  .chip.trial .dot { background: var(--info); }
  .chip.suspended { background: var(--pending-bg); color: var(--pending-text); }
  .chip.suspended .dot { background: var(--pending); }

  /* ── Footer / Pagination ── */
  .table-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .75rem;
    padding: .85rem 1.25rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .footer-info {
    font-size: .8125rem;
    color: var(--text-secondary);
  }
  .pagination {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .page-btn {
    min-width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: .8125rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    padding: 0 .5rem;
  }
  .page-btn:hover:not(.active):not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-bg);
  }
  .page-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 6px rgba(99,102,241,.3);
  }
  .page-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
  }
  .page-btn svg { width: 14px; height: 14px; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    body { padding: 1rem .5rem; }
    .search-box input { width: 180px; }
  }
  @media (max-width: 700px) {
    .page-header h1 { font-size: 1.35rem; }
    .toolbar { padding: .75rem 1rem; }
    table { font-size: .8125rem; }
    thead th, tbody td { padding: .65rem .6rem; }
    .user-email { display: none; }
    .row-count { display: none; }
  }
  @media (max-width: 520px) {
    body { padding: .75rem .35rem; }
    .card { border-radius: 8px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-left { justify-content: space-between; }
    .search-box input { width: 100%; }
    thead th, tbody td { padding: .55rem .45rem; font-size: .75rem; }
    .user-email { display: none; }
    .avatar { width: 30px; height: 30px; font-size: .65rem; }
    .chip { font-size: .6875rem; padding: .15rem .5rem; }
    .footer-info { font-size: .75rem; }
    .page-btn { min-width: 32px; height: 32px; font-size: .75rem; }
    .table-footer { padding: .75rem 1rem; }
  }

  /* ── Scrollbar ── */
  .table-wrap::-webkit-scrollbar { height: 6px; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .table-wrap::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<div class="container">
  <div class="page-header">
    <h1>User Management</h1>
    <p>Manage team members, permissions, and account statuses.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" id="searchInput" placeholder="Search users…">
        </div>
        <span class="row-count" id="rowCount">Showing 15 users</span>
      </div>
    </div>

    <div class="table-wrap">
      <table id="userTable">
        <thead>
          <tr>
            <th class="checkbox-cell">
              <div class="custom-check" id="selectAll" role="checkbox" aria-checked="false" tabindex="0"></div>
            </th>
            <th data-sort="name">Name <span class="sort-arrow"><svg class="arrow-up" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg><svg class="arrow-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></span></th>
            <th data-sort="email">Email</th>
            <th data-sort="role">Role</th>
            <th data-sort="status">Status <span class="sort-arrow"><svg class="arrow-up" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg><svg class="arrow-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></span></th>
            <th data-sort="joined">Joined <span class="sort-arrow"><svg class="arrow-up" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5"/></svg><svg class="arrow-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="table-footer">
      <span class="footer-info" id="footerInfo">Page 1 of 1</span>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<script>
const USERS = [
  { id:1,  name:"Olivia Martin",      email:"olivia.m@acme.co",    role:"Admin",        status:"active",   joined:"2023-01-15" },
  { id:2,  name:"Jackson Lee",        email:"jackson.lee@inbox.io", role:"Editor",       status:"active",   joined:"2023-02-22" },
  { id:3,  name:"Isabella Nguyen",    email:"isabella.n@corp.net",  role:"Viewer",       status:"pending",  joined:"2023-03-10" },
  { id:4,  name:"William Kim",        email:"will.kim@startup.dev", role:"Editor",       status:"active",   joined:"2023-04-05" },
  { id:5,  name:"Sofia Davis",        email:"sofia.d@design.io",    role:"Admin",        status:"active",   joined:"2023-05-18" },
  { id:6,  name:"Liam Johnson",       email:"liam.j@tech.co",       role:"Viewer",       status:"inactive", joined:"2023-06-30" },
  { id:7,  name:"Emma Wilson",        email:"emma.w@agency.com",    role:"Editor",       status:"trial",    joined:"2023-07-12" },
  { id:8,  name:"Noah Brown",         email:"noah.b@finance.org",   role:"Viewer",       status:"active",   joined:"2023-08-25" },
  { id:9,  name:"Ava Taylor",         email:"ava.t@marketing.net",  role:"Editor",       status:"suspended",joined:"2023-09-14" },
  { id:10, name:"Mason Anderson",     email:"mason.a@cloud.io",     role:"Admin",        status:"active",   joined:"2023-10-01" },
  { id:11, name:"Mia Thomas",         email:"mia.t@retail.co",      role:"Viewer",       status:"pending",  joined:"2023-11-08" },
  { id:12, name:"Ethan Garcia",       email:"ethan.g@logistics.dev",role:"Editor",       status:"active",   joined:"2023-12-19" },
  { id:13, name:"Charlotte Martinez", email:"charlotte.m@health.io",role:"Viewer",       status:"inactive", joined:"2024-01-22" },
  { id:14, name:"James Robinson",     email:"james.r@edu.org",      role:"Admin",        status:"trial",    joined:"2024-02-14" },
  { id:15, name:"Amelia Clark",       email:"amelia.c@legal.net",   role:"Editor",       status:"active",   joined:"2024-03-05" },
];

const AVATAR_COLORS = [
  '#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899',
  '#f43f5e','#ef4444','#f97316','#eab308','#22c55e',
  '#10b981','#14b8a6','#06b6d4','#3b82f6','#64748b'
];

const PAGE_SIZE = 8;
let currentPage = 1;
let sortCol = null;
let sortDir = 'asc';
let selectedIds = new Set();
let filteredUsers = [...USERS];

const tbody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const rowCount = document.getElementById('rowCount');
const footerInfo = document.getElementById('footerInfo');
const paginationEl = document.getElementById('pagination');
const selectAllEl = document.getElementById('selectAll');

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase();
}

function getAvatarColor(id) {
  return AVATAR_COLORS[id % AVATAR_COLORS.length];
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function createAvatar(name, id) {
  const initials = getInitials(name);
  const color = getAvatarColor(id);
  return `<div class="avatar" style="background:${color}">${initials}</div>`;
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageUsers = filteredUsers.slice(start, end);

  tbody.innerHTML = '';
  pageUsers.forEach((user, i) => {
    const tr = document.createElement('tr');
    tr.dataset.id = user.id;
    const checked = selectedIds.has(user.id);
    const checkClass = checked ? 'checked' : '';
    tr.innerHTML = `
      <td class="checkbox-cell">
        <div class="custom-check ${checkClass}" data-id="${user.id}" role="checkbox" aria-checked="${checked}" tabindex="0">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        </div>
      </td>
      <td>
        <div class="user-cell">
          ${createAvatar(user.name, user.id)}
          <div class="user-info">
            <span class="user-name">${user.name}</span>
            <span class="user-email">${user.email}</span>
          </div>
        </div>
      </td>
      <td>${user.email}</td>
      <td>${user.role}</td>
      <td><span class="chip ${user.status}"><span class="dot"></span>${user.status.charAt(0).toUpperCase() + user.status.slice(1)}</span></td>
      <td>${formatDate(user.joined)}</td>
    `;
    tbody.appendChild(tr);
  });

  updateSelectAll();
  updatePagination();
  updateRowCount();
}

function updatePagination() {
  const total = filteredUsers.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, total);
  footerInfo.textContent = total === 0
    ? 'No results'
    : `Showing ${start}–${end} of ${total}`;

  paginationEl.innerHTML = '';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'page-btn';
  prevBtn.disabled = currentPage === 1;
  prevBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>`;
  prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
  paginationEl.appendChild(prevBtn);

  for (let p = 1; p <= totalPages; p++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
    btn.textContent = p;
    btn.addEventListener('click', () => { currentPage = p; renderTable(); });
    paginationEl.appendChild(btn);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'page-btn';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>`;
  nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; renderTable(); } });
  paginationEl.appendChild(nextBtn);
}

function updateRowCount() {
  rowCount.textContent = `Showing ${filteredUsers.length} user${filteredUsers.length !== 1 ? 's' : ''}`;
}

function updateSelectAll() {
  const pageStart = (currentPage - 1) * PAGE_SIZE;
  const pageEnd = pageStart + PAGE_SIZE;
  const pageUsers = filteredUsers.slice(pageStart, pageEnd);
  const pageIds = pageUsers.map(u => u.id);
  const allChecked = pageIds.length > 0 && pageIds.every(id => selectedIds.has(id));
  const someChecked = pageIds.some(id => selectedIds.has(id));

  selectAllEl.classList.remove('checked', 'indeterminate');
  if (allChecked) {
    selectAllEl.classList.add('checked');
    selectAllEl.setAttribute('aria-checked', 'true');
  } else if (someChecked) {
    selectAllEl.classList.add('indeterminate');
    selectAllEl.setAttribute('aria-checked', 'mixed');
  } else {
    selectAllEl.setAttribute('aria-checked', 'false');
  }
}

function toggleSelectAll() {
  const pageStart = (currentPage - 1) * PAGE_SIZE;
  const pageEnd = pageStart + PAGE_SIZE;
  const pageUsers = filteredUsers.slice(pageStart, pageEnd);
  const allChecked = pageUsers.every(u => selectedIds.has(u.id));

  pageUsers.forEach(u => {
    if (allChecked) selectedIds.delete(u.id);
    else selectedIds.add(u.id);
  });
  renderTable();
}

function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  renderTable();
}

// Event delegation for checkboxes
tbody.addEventListener('click', e => {
  const check = e.target.closest('.custom-check');
  if (check) {
    if (check.id === 'selectAll') {
      toggleSelectAll();
    } else {
      toggleSelect(parseInt(check.dataset.id));
    }
  }
});

// Keyboard support for checkboxes
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const target = e.target;
    if (target.classList.contains('custom-check')) {
      e.preventDefault();
      if (target.id === 'selectAll') toggleSelectAll();
      else if (target.dataset.id) toggleSelect(parseInt(target.dataset.id));
    }
  }
});

// Search
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  if (q === '') {
    filteredUsers = [...USERS];
  } else {
    filteredUsers = USERS.filter(u =>
      u.name.toLowerCase().includes(q) ||
      u.email.toLowerCase().includes(q) ||
      u.role.toLowerCase().includes(q) ||
      u.status.toLowerCase().includes(q)
    );
  }
  currentPage = 1;
  renderTable();
});

// Sorting
document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    if (sortCol === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = 'asc';
    }

    // Clear previous classes
    document.querySelectorAll('thead th').forEach(h => {
      h.classList.remove('sorted-asc', 'sorted-desc');
    });
    th.classList.add(sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');

    // FLIP: capture initial positions
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const initialPositions = rows.map(r => r.getBoundingClientRect().top);

    // Sort data
    filteredUsers.sort((a, b) => {
      let va = a[col], vb = b[col];
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    // Render new order
    renderTable();

    // LIP: animate to new positions
    const newRows = Array.from(tbody.querySelectorAll('tr'));
    newRows.forEach((row, i) => {
      const oldPos = initialPositions[i];
      if (oldPos !== undefined) {
        const rect = row.getBoundingClientRect();
        const diff = oldPos - rect.top;
        if (Math.abs(diff) > 1) {
          row.style.transform = `translateY(${diff}px)`;
          row.style.transition = 'none';
          row.offsetHeight; // force reflow
          requestAnimationFrame(() => {
            row.style.transition = 'transform 400ms cubic-bezier(.4,0,.2,1)';
            row.style.transform = 'translateY(0)';
          });
          row.classList.add('flip-animate');
          row.addEventListener('animationend', () => {
            row.classList.remove('flip-animate');
          }, { once: true });
        }
      }
    });
  });
});

// Initial render
renderTable();
</script>
</body>
