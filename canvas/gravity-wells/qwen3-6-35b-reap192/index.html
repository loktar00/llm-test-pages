<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Painting</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFbo: true }); // willReadFbo for potential future optimizations, strictly 2D

        let width, height;
        
        // Configuration
        const PARTICLE_COUNT = 6000;
        const GRAVITY_STRENGTH = 800;
        const TRAIL_FADE = 0.015; // How fast trails fade (lower = longer trails)
        const WANDER_SPEED = 0.2;
        const MERGE_CHANCE = 0.002;
        const SPLIT_CHANCE = 0.001;
        
        // State
        let particles = [];
        let wells = [];
        let hue = 0;
        let time = 0;

        // Resize handler
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
