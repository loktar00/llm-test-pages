<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Globe</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
/**
 * SNOW GLOBE SCREENSAVER
 * 
 * Features:
 * - 2D Canvas rendering with simulated 3D depth
 * - Particle system for snow with physics and accumulation
 * - Procedural generation of a cabin village inside the sphere
 * - "Shake" mechanic every 20 seconds
 * - Glass refraction and reflections
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY, radius;
let time = 0;
let shakeTimer = 0;
const SHAKE_INTERVAL = 20000; // 20 seconds
let isShaking = false;
let shakeIntensity = 0;

// Configuration
const PARTICLE_COUNT = 600;
const GROUND_Y_OFFSET = 0.6; // Where the ground starts relative to radius
const CABIN_COUNT = 3;

// State
let particles = [];
let cabins = [];
let accumulatedSnow = []; // Stores snow piles on roofs

// --- Resize Handling ---
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    centerX = width / 2;
    centerY = height / 2;
    radius = Math.min(width, height) * 0.35;
    
    // Regenerate scene on resize to fit
    initScene();
}

// --- Scene Generation ---
function initScene() {
    particles = [];
    cabins = [];
    accumulatedSnow = [];

    // Create Cabins
    for (let i = 0; i < CABIN_COUNT; i++) {
        // Distribute across x-axis within sphere bounds
        const xSpread = (i - (CABIN_COUNT - 1) / 2) * (radius * 0.45);
        const x = xSpread;
        const z = (Math.random() - 0.5) * (radius * 0.4); // Depth
        const scale = 1 - Math.abs(z) / radius; // Simple depth scale
        const w = 40 * scale;
        const h = 50 * scale;
        
        cabins.push({
            x: x,
            y: 0, // Calculated relative to center
            z: z,
            w: w,
            h: h,
            lightPhase: Math.random() * Math.PI * 2,
            roofWidth: w * 1.4,
            roofHeight: 30 * scale
        });
    }

    // Sort cabins by depth (painter's algorithm)
    cabins.sort((a, b) => a.z - b.z);

    // Create Particles
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
            x: (Math.random() - 0.5) * radius * 2,
            y: (Math.random() - 0.5) * radius * 2,
            z: (Math.random() - 0.5) * radius * 2,
            vx: 0,
            vy: 0,
            vz: 0,
            size: Math.random() * 2 + 1,
            active: true, // true = falling, false = accumulated
            settled: false
        });
    }
}

// --- Physics & Logic ---

function update(dt) {
    time += dt;
    shakeTimer += dt;

    // Shake Logic
    if (shakeTimer > SHAKE_INTERVAL) {
        shakeTimer = 0;
        isShaking = true;
        shakeIntensity = 1.0;
        
        // Resurrect settled particles
        particles.forEach(p => {
            if (!p.active) {
                // Lift them up slightly and randomize
                p.active = true;
                p.y = (Math.random() - 0.5) * radius; 
                p.vx = (Math.random() - 0.5) * 10;
                p.vy = (Math.random() - 0.5) * 10;
                p.vz = (Math.random() - 0.5) * 10;
            }
        });
    }

    if (isShaking) {
        shakeIntensity -= dt * 0.5; // Decay over 2 seconds
        if (shakeIntensity <= 0) {
            isShaking = false;
            shakeIntensity = 0;
        }
    }

    // Update Particles
    const gravity = isShaking ? 0.05 : 0.2;
    const turbulence = isShaking ? 0.8 : 0.02;
    const wind = Math.sin(time * 0.5) * 0.05;

    particles.forEach(p => {
        if (!p.active) return;

        // Apply forces
        if (isShaking) {
            // Chaotic movement during shake
            p.vx += (Math.random() - 0.5) * turbulence * 5;
            p.vy += (Math.random() - 0.5) * turbulence * 5;
            p.vz += (Math.random() - 0.5) * turbulence * 5;
            // Damping
            p.vx *= 0.9;
            p.vy *= 0.9;
            p.vz *= 0.9;
        } else {
            // Normal falling
            p.vy += gravity;
            p.vx += wind;
            p.vx *= 0.98; // Air resistance
            p.vy *= 0.98;
            p.vz *= 0.98;
        }

        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;

        // Boundary Check (Sphere)
        const dist = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
        if (dist > radius * 0.9) {
            // Bounce off glass wall
            const nx = p.x / dist;
            const ny = p.y / dist;
            const nz = p.z / dist;
            
            // Reflect velocity
            const dot = p.vx*nx + p.vy*ny + p.vz*nz;
            p.vx -= 2 * dot * nx;
            p.vy -= 2 * dot * ny;
            p.vz -= 2 * dot * nz;
            
            // Push back inside
            p.x = nx * radius * 0.9;
            p.y = ny * radius * 0.9;
            p.z = nz * radius * 0.9;

            // Friction
            p.vx *= 0.5;
            p.vy *= 0.5;
            p.vz *= 0.5;
        }

        // Ground Collision
        // Simple ground plane at y = radius * GROUND_Y_OFFSET
        const groundLevel = radius * GROUND_Y_OFFSET;
        
        if (p.y > groundLevel) {
            // Check if it hit a roof
            let hitRoof = false;
            for (let c of cabins) {
                // Simple AABB check in 2D projection for roof
                const roofTop = c.y - c.h - c.roofHeight;
                const roofBottom = c.y - c.h;
                
                // Check if particle is within horizontal bounds of roof
                if (p.x > c.x - c.roofWidth/2 && p.x < c.x + c.roofWidth/2) {
                    // Check Z depth roughly
                    if (p.z > c.z - c.w && p.z < c.z + c.w) {
                        // Check Y height
                        if (p.y >= roofTop && p.y <= roofBottom) {
                            // Hit the roof!
                            p.y = roofTop;
                            p.active = false;
                            hitRoof = true;
                            break;
                        }
                    }
                }
            }

            if (!hitRoof && p.y > groundLevel) {
                p.y = groundLevel;
                p.active = false; // Settle on ground
            }
        }
    });
}

// --- Rendering ---

function draw() {
    // Clear background
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    
    // Apply Shake Displacement to entire canvas
    if (isShaking) {
        const dx = (Math.random() - 0.5) * shakeIntensity * 10;
        const dy = (Math.random() - 0.5) * shakeIntensity * 10;
        ctx.translate(dx, dy);
    }

    // 1. Draw Inside the Globe (Background)
    ctx.save();
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.clip();
    
    // Dark interior background
    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
    grad.addColorStop(0, '#1a2a3a');
    grad.addColorStop(1, '#0d1520');
    ctx.fillStyle = grad;
    ctx.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);

    // Draw Ground
    const groundY = centerY + radius * GROUND_Y_OFFSET;
    ctx.fillStyle = '#eef5ff'; // Snow white
    ctx.beginPath();
    ctx.ellipse(centerX, groundY, radius, radius * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Draw Cabins
    cabins.forEach(c => {
        const cx = centerX + c.x;
        const cy = centerY + c.y;
        
        // Cabin Body
        ctx.fillStyle = '#3e2723'; // Dark wood
        ctx.fillRect(cx - c.w/2, cy - c.h, c.w, c.h);
        
        // Roof
        ctx.fillStyle = '#212121'; // Dark roof base
        ctx.beginPath();
        ctx.moveTo(cx - c.roofWidth/2, cy - c.h);
        ctx.lineTo(cx, cy - c.h - c.roofHeight);
        ctx.lineTo(cx + c.roofWidth/2, cy - c.h);
        ctx.fill();

        // Snow on Roof (Accumulation)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(cx - c.roofWidth/2 + 5, cy - c.h);
        ctx.lineTo(cx, cy - c.h - c.roofHeight + 5);
        ctx.lineTo(cx + c.roofWidth/2 - 5, cy - c.h);
        ctx.lineTo(cx + c.roofWidth/2 - 10, cy - c.h + 5);
        ctx.lineTo(cx, cy - c.h - c.roofHeight + 10);
        ctx.lineTo(cx - c.roofWidth/2 + 10, cy - c.h + 5);
        ctx.fill();

        // Windows (Flickering Light)
        const flicker = (Math.sin(time * 5 + c.lightPhase) + 1) / 2; // 0 to 1
        const alpha = 0.6 + flicker * 0.4;
        
        ctx.fillStyle = `rgba(255, 160, 50, ${alpha})`;
        // Left Window
        ctx.fillRect(cx - c.w/4 - 5, cy - c.h + 10, 10, 10);
        // Right Window
        ctx.fillRect(cx + c.w/4 - 5, cy - c.h + 10, 10, 10);
        
        // Door
        ctx.fillStyle = '#1a0f0a';
        ctx.fillRect(cx - 5, cy - c.h + 20, 10, c.h - 20);
        
        // Light spill from door
        ctx.fillStyle = `rgba(255, 160, 50, ${alpha * 0.2})`;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx - 15, cy + 10);
        ctx.lineTo(cx + 15, cy + 10);
        ctx.fill();
    });

    // Draw Settled Particles on Ground (Simple white noise for texture)
    // We don't draw individual settled particles on ground to save perf, 
    // just the white ground covers it.
    // But we draw settled particles on roofs if we wanted detail, 
    // but the white roof triangle covers them.
    
    // Draw Active Particles
    ctx.fillStyle = '#ffffff';
    particles.forEach(p => {
        if (!p.active) return;
        
        // Project 3D to 2D
        // Simple perspective: things further back (negative z) are smaller
        const scale = 1 + p.z / (radius * 2); 
        const px = centerX + p.x;
        const py = centerY + p.y;
        const size = p.size * scale;

        // Depth fog
        const alpha = 0.3 + 0.7 * (1 + p.z/radius); // Fade out back particles
        
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.restore(); // End Clip

    // 2. Glass Sphere Effects (Overlay)
    
    // Glass Reflection (Environment)
    // Top left highlight
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.fill();

    // Specular Highlight
    ctx.beginPath();
    ctx.ellipse(centerX - radius * 0.3, centerY - radius * 0.3, radius * 0.15, radius * 0.05, Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fill();

    // Glass Rim
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.stroke();

    // Refraction Distortion (Simulated by a slight blur/overlay)
    // We can't easily distort what's already drawn, so we draw a subtle gradient overlay
    // to simulate the thickness of the glass at the edges.
    const glassGrad = ctx.createRadialGradient(centerX, centerY, radius * 0.8, centerX, centerY, radius);
    glassGrad.addColorStop(0, 'rgba(0,0,0,0)');
    glassGrad.addColorStop(1, 'rgba(100, 200, 255, 0.1)');
    ctx.fillStyle = glassGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore(); // End Shake Transform
}

// --- Main Loop ---
let lastTime = 0;
function loop(timestamp) {
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

// Init
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

</script>
</body>
</html>
