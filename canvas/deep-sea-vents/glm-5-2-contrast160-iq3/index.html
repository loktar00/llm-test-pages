<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deep Sea Vents</title>
<style>
  html,body{margin:0;padding:0;background:#050818;overflow:hide;cursor:none}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W,H,D;
function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
  D=Math.max(W,H);
}
resize();
window.onresize=resize;

const t=0;
let time=0;
const rand=(a=1)=>Math.random()*a;
const TAU=Math.PI*2;

const vents=[
  {x:0.18*W, y:0.78*H, w:120, h:160, rate:0.45, intensity:1, hue:8},
  {x:0.46*W, y:0.82*H, w:180, h:200, rate:0.65, intensity:0.8, hue:12},
  {x:0.74*W, y:0.7*H, w=140, h=140, rate:0.5, intensity:0.6, hue=10}
];

const worms=[];
for(let i=0;i<14;i++){
  const v=vents[i%3];
  const side=i%2?1:-1;
  const baseX=v.x+side*(v.w*0.45+rand(40));
  const baseY=v.y-v.h+rand(60)+20;
  const len=40+rand(60);
  const segs=[];
  for(let j=0;j<8;j++)seg[j]={};
  worms.push({
    baseX, baseY, len, segs,
    phase:rand(TAU),
    sway:15+rand(20),
    swaySpeed:0.5+rand()*0.4,
    width:4+rand()*3.5,
    glow:rand()*0.5
  });
}

const shrimplets=[];
for(let i=0;i<80;i++){
  const v=vents[(~~rand(3)%3)];
  const a=rand(TAU);
  const r=rand()*60;
  shrimplets.push({
    cx: v.x+Math.cos(a)*r,
    cy: v.y-M.random()*v.h,
    ang:a,
    r: 20+rand()*40,
    x:0,y:0,
    phase: rand(TAU),
    speed: 0.2+rand()*0.4,
    size: 1.5+rand()*1.5
  });
}
for(let s of shrimplets){s.x=s.cx;s.y=s.cy;}

const snow=[];
for(let i=0;i<250;i++){
  snow.push({
    x:rand(W),y:rand(H),
    vx:(rand()-0.5)*0.3,
    vy:(rand()-0.5)*0.3+0.1,
    r: 1+rand()*2.5,
    a: 0.1+rand()*0.3,
    pulse:rand(TAU),
    ps:0.5+rand()*0.5
  });
}

const siph = {
  x:-100, y: H*0.5+rand()*200,
  vx: 0.05+rand()*0.04,
  phase: 0,
  glowPhase: rand(TAU),
  segments: []
};
for(let i=0;i<25;i++)siph.segments.push({x:0,y:0,phase:i*0.3});

const rov={
  x:W*0.5, y:H*0.4, dir:1,
  targetY: H*0.4,
  vx:0, vy:0,
  bobPhase:0,
  lights:[
    {offset:-18, angle:-0.6, range:1.1, intensity:0.9, color:'255,250,210', reach:550},
    {offset:18, angle=0.6, range:1.1, intensity:0.8, color:'255,250,210', reach:550}
  ]
};

const smokePlume=[];
const burst=[];

function plumeParticle(vent, boost){
  const sp=0.5+rand()*2;
  const ang=-Math.PI/2+(rand()-0.5)*0.3;
  return {
    x: vent.x + (rand()-0.5)*vent.w*0.8,
    y: vent.y - rand()*5,
    vx: Math.cos(ang)*sp*0.2 + (rand()-0.5)*0.5,
    vy: Math.sin(ang)*sp - rand()*0.5,
    life: 1, decay: 0.006+rand()*0.008,
    r: 5+rand()*30, vent: vent,
    hue: vent.hue+(rand()*15-7)
  };
}

for(let v of vents){
  for(let i=0;i<120;i++){
    const p=plumeParticle(v);
    p.x += (rand()-0.5)*200;
    p.y += rand()*200;
    p.life=Math.random();
    smokePlume.push(p);
  }
}

// floor particles
const floorP=[];
for(let i=0;i<50;i++){
  floorP.push({x:rand(W), y:H*0.85+rand()*H*0.15, phase:rand(TAU)});
}

function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#05080f');
  bg.addColorStop(H*0.4,'#0a0f1a');
  bg.addColorStop(H*0.85,'#05040a');
  bg.addColorStop(1,'#010004');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalCompositeOperation='light';
  for(let i=0;i<2;i++){
    const gy=H*(0.3+i*0.5);
    const g=ctx.createRadialGradient(W*0.5, gy, 0, W*0.5, gy, W*0.7);
    g.addColorStop(0, 'rgba(20,40,70,'+(0.05*(2-i))+')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.restore();

  // floor
  ctx.fillStyle='#04000a';
  ctx.beginPath();
  ctx.moveTo(0, H*0.9);
  const fS=W/30;
  for(let i=0;i<=30+1;i++){
    const x=i*fS;
    const y=H*0.9 + Math.sin(i*0.4)*5 + Math.sin(i*0.7)*3;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.fill();

  // floor particle highlights
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let p of floorP){
    const a=0.1*Math.abs(Math.sin(time*0.2+p.phase));
    ctx.fillStyle='rgba(120,130,150,'+a+')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // vents structure ( dark silhouettes
  for(let v of vents){
    const cx=v.x, baseY=v.y;
    // chimney body
    const bx=v.w*0.5, by=v.h;
    ctx.fillStyle='#020003';
    ctx.beginPath();
    ctx.moveTo(cx-bx, baseY);
    ctx.lineTo(cx-bx*0.7, baseY-by);
    ctx.lineTo(cx+bx*0.7, baseY-by);
    ctx.lineTo(cx+bx, baseY);
    ctx.lineTo(cx+bx, baseY+5);
    ctx.lineTo(cx-bx, baseY+5);
    ctx.fill();
    // chimney top rim
    ctx.strokeStyle='#000005';ctx.lineWidth=8;
    ctx.beginPath();
    ctx.ellipse(cx, baseY-by, bx*0.7, 5, 0, 0, TAU);
    ctx.stroke();
  }

  // siphonophore ( behind everything
  drawSiph();

  // dark plume particles ( unlit
  drawPlume();

  // worms ( unlit dark
  for(let w of worms) drawWorm(w, false, null, 0);

  // shrimp swarm ( unlit dark
  drawShrimp(false, null, 0);

  // lit elements by ROV
  for(let v of vents){
    for(let L of rov.lights){
      const dx=rov.x+L.offset - v.x;
      const dy=rov.y - (v.y-v.h*0.5);
      const d=Math.hypot(dx,dy);
      const lit=Math.max(0, 1 - d/(L.reach*1.2));
      if(lit>0.01){
        // vent top rim lit
        ctx.save();
        ctx.globalCompositeOperation='screen';
        ctx.strokeStyle='rgba(255,150,40,'+(lit*0.5)+')';
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.ellipse(v.x, v.y-v.h, v.w*0.7*0.5, 4.5, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // marine snow
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let s of snow){
    const a=s.a * (0.6+Math.abs(Math.sin(time*s.ps+s.pulse))*0.4);
    ctx.fillStyle='rgba(220,240,255,'+a+')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // ROV ( last, on top
  drawROV();

  time += 1;
  requestAnimationFrame(draw);
}

function drawPlume(){
  ctx.save();
  ctx.globalCompositeOperation='multiply';
  for(let p of smokePlume){
    const lit=0;
    let maxLit=0;
    for(let L of rov.lights){
      const dx=rov.x+L.offset - p.x;
      const dy=rov.y - p.y;
      const d=Math.hypot(dx,dy);
      const inC=1 - d/(L.reach*1.5);
      if(inC>maxLit)maxLit=inC;
    }
    if(maxLit<0)maxLit=0;
    const l=Math.max(0,maxLit);
    // base color
    const r=30+l*70;
    const g=20+l*40;
    const b=20+l*30;
    ctx.fillStyle='rgba('+(r+30)+','+(g+10)+','+(b+5)+','+(p.life*0.8)+')';
    // actually use rgba string
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation='multiply';
  }
  ctx.restore();
}

function drawShrimp(litOnly, light, lty){
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let s of shrimplets){
    let l=0;
    if(!litOnly){
      for(let L of rov.lights){
        const dx=rov.x+L.offset - s.x;
        const dy=rov.y - s.y;
        const d=Math.hypot(dx,dy);
        const c=1 - d/(L.reach*1.2);
        if(c>l)l=c;
      }
      l=Math.max(0,l);
    } else {
      l=lty;
    }
    const r=255*l;
    const g=200*l;
    const b=180*l;
    ctx.fillStyle='rgba('+(r|0)+','+(g|0)+','+(b|0)+',0.7)';
    // actually draw with fill
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawWorm(w, litOnly, light, lty){
  ctx.save();
  ctx.globalCompositeOperation='screen';
  ctx.lineCap='round';
  for(let i=0;i<w.segs.length;i++){
    const t=i/(w.segs.length-1);
    const y=w.baseY + Math.cos(w.phase + time*0.01*w.swaySpeed + t*5)*w.sway*0.5 - t*60;
    const x=w.baseX + Math.sin(w.phase + time*0.01*w.swaySpeed + t*4)*w.sway*0.3;
    w.segs[i]={x,y};
  }
  ctx.beginPath();
  ctx.moveTo(w.segs[0].x, w.segs[0].y);
  for(let i=1;i<w.segs.length;i++){
    const s=w.segs[i];
    ctx.lineTo(s.x, s.y);
  }
  ctx.lineWidth=w.width;
  ctx.strokeStyle='rgba(15,15,20,1)';
  ctx.globalCompositeOperation='source-over';
  ctx.stroke();

  // lit version
  ctx.globalCompositeOperation='screen';
  let maxLit=0;
  for(let L of rov.lights){
    const dx=rov.x+L.offset - (w.baseX);
    const dy=rov.y - (w.baseY - w.len/2);
    const d=Math.hypot(dx,dy);
    const c=1 - d/(L.reach*1.5);
    if(c>maxLit)maxLit=c;
  }
  if(maxLit>0){
    const r=255*maxLit;
    const g=200*maxLit;
    const b=150*maxLit;
    ctx.strokeStyle='rgba('+(r|0)+','+(g|0)+','+(b|0)+',0.8)';
    ctx.lineWidth=w.width*0.5;
    ctx.stroke();
    ctx.strokeStyle='rgba('+(r|0)+','+(g|0)+','+(b|0)+',1)';
    ctx.lineWidth=w.width*0.25;
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+maxLit+')';
    ctx.lineWidth=1;
    ctx.stroke();
    if(w.glow){
      ctx.strokeStyle='rgba(30,40,50,'+(maxLit*0.5)+')';
      ctx.lineWidth=w.width*2;
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawSiph(){
  const s=siph;
  s.phase += 0.01;
  s.glowPhase += 0.005;
  s.x += s.vx;
  s.y += Math.sin(s.phase)*0.3;
  const glow = Math.sin(s.glowPhase)*0.5+0.5;
  if(s.x > W+100){
    s.x=-100;
    s.y=H*0.3 + rand()*200;
  }

  // body segments
  for(let i=0;i<s.segments.length;i++){
    const t=i/(s.segments.length-1);
    const px = s.x - 100 + t*200;
    const py = s.y + Math.sin(s.phase + t*4)*15;
    s.segments[i] = {x:px, y:py};
  }

  ctx.save();
  ctx.globalCompositeOperation='screen';
  // outer glow
  ctx.beginPath();
  ctx.moveTo(s.segments[0].x, s.segments[0].y);
  for(let i=1;i<s.segments.length;i++){
    ctx.lineTo(s.segments[i].x, s.segments[i].y);
  }
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(120,170,200,'+(0.05+glow*0.05)+')';
  ctx.lineWidth=20;
  ctx.stroke();
  ctx.strokeStyle='rgba(150,200,230,'+(0.10+glow*0.15)+')';
  ctx.lineWidth=10;
  ctx.stroke();
  ctx.strokeStyle='rgba(220,240,255,'+(0.4+glow*0.4)+')';
  ctx.lineWidth=1.5;
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,'+(0.6+glow*0.4)+')';
  ctx.lineWidth=0.5;
  ctx.stroke();
  // siph spots
  for(let i=0;i<s.segments.length;i+=2){
    const s2=s.segments[i];
    const a=0.5+Math.sin(s.glowPhase + i)*0.5;
    ctx.fillStyle='rgba(180,210,230,'+a*0.4+')';
    ctx.beginPath();
    ctx.arc(s2.x, s2.y, 1.5, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawROV(){
  const r=rov;
  // move
  r.targetY = H*0.4 + Math.sin(time*0.01)*H*0.15;
  r.vx += (r.dir*0.5 - r.vx)*0.005;
  r.x += r.vx;
  if(r.x < W*0.15 || r.x > W*0.85) r.dir *= -1;
  r.y += (r.targetY - r.y)*0.005;
  r.bobPhase += 0.01;

  const bob = Math.sin(r.bobPhase*3)*1.5;
  const rovX = r.x;
  const rovY = r.y + bob;

  // light cones
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let L of r.lights){
    const tipX = rovX + L.offset;
    const tipY = rovY + 10;
    const coneEnd = L.reach;
    const a = L.angle;
    const ca = Math.cos(a);
    // cone as triangle path
    const perpX = Math.sin(a);
    const perpY = Math.cos(a);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - perpX*coneEnd*0.5 + Math.cos(a+0.6)*coneEnd*0.5, tipY + Math.sin(a+0.6)*coneEnd*0.5);
    ctx.lineTo(tipX - perpX*coneEnd*0.5 + Math.cos(a)*coneEnd, tipY + Math.sin(a)*coneEnd);
    // simple cone using radial gradient
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const rg=ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, coneEnd);
    rg.addColorStop(0, 'rgba('+(L.color)+',0.5)');
    rg.addColorStop(0.3, 'rgba('+(L.color)+',0.25)');
    rg.addColorStop(1, 'rgba('+(L.color)+',0)');
    ctx.fillStyle=rg;
    ctx.beginPath();
    ctx.arc(tipX, tipY, coneEnd, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation='screen';
  }
  ctx.restore();

  // ROV body
  ctx.save();
  ctx.translate(rovX, rovY);
  ctx.fillStyle='#1a2030';
  ctx.strokeStyle='#4060a8';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.rect(-15, -8, 30, 16, 5);
  ctx.fill();
  ctx.stroke();
  // upper body
  ctx.fillStyle='#2530a0';
  ctx.beginPath();
  ctx.moveTo(-15, -8);
  ctx.lineTo(-15, -8+4);
  ctx.lineTo(-15+15, -8+4);
  ctx.lineTo(-15+30, -8);
  ctx.fill();
  // small dome
  ctx.fillStyle='#4060a8';
  ctx.beginPath();
  ctx.arc(-15+15, -8-3, 4, 0, TAU);
  ctx.fill();
  // lights
  for(let L of r.lights){
    ctx.fillStyle='#fff8a0';
    ctx.beginPath();
    ctx.arc(L.offset, 6, 2, 0, TAU);
    ctx.fill();
  // halo
    ctx.fillStyle='rgba(255,250,40,0.5)';
    ctx.beginPath();
    ctx.arc(L.offset, 6, 5, 0, TAU);
    ctx.fill();
  }
  // tether cable
  ctx.strokeStyle='rgba(60,80,100,0.7)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.lineTo(0, -8-30);
  ctx.stroke();
  ctx.restore();
}

function updatePlume(){
  for(let v of vents){
    const rate = v.rate * (1 + Math.sin(time*0.01+v.y)*0.2);
    if(Math.random() < rate){
      smokePlume.push(plumeParticle(v));
    }
  }
  for(let p of smokePlume){
    p.x += p.vx + Math.sin(time*0.01*0.3 + p.y*0.01)*0.0;
    p.y += p.vy;
    p.vy *= 0.99;
    p.vx *= 0.99;
    p.vy -= 0.001;
    p.r += 0.6;
    p.life -= p.decay;
    if(p.life <= 0 || p.r > 80){
      smokePlume.splice(smokePlume.indexOf(p),1);
    }
  }
}

function updateShrimp(){
  for(let s of shrimplets){
    s.phase += 0.03 * s.speed;
    s.x = s.cx + Math.cos(s.phase) * s.r * 0.5;
    s.y = s.cy + Math.sin(s.phase) * s.r * 0.3 + Math.sin(s.phase*0.5)*10;
    s.cx += (rand()-0.5)*0.5;
    s.cy += (rand()-0.5)*0.5 - 0.05;
    // wrap
    if(s.cy < 200) {
      const v=vents[(~~rand(3)%3)];
      s.cx = v.x + (rand()-0.5)*60;
      s.cy = v.y - rand()*v.h;
    }
    if(s.cx < 0) s.cx += W;
    if(s.cx > W) s.cx -= W;
  }
}

function updateSnow(){
  for(let s of snow){
    s.x += s.vx;
    s.y += s.vy;
    if(s.x < 0) s.x += W;
    if(s.x > W) s.x -= W;
    if(s.y < 0) s.y += H;
    if(s.y > H) s.y -= H;
  }
}

function update(){
  updatePlume();
  updateShrimp();
  updateSnow();
  requestAnimationFrame(update);
}
update();
draw();
</script>
</body>
</html>
