<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain on Window</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Set canvas to full window size
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Background bokeh city
  const bokehCount = 120;
  const bohoks = [];
  for (let i = 0; i < bokehCount; i++) {
    bohoks.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2.5 + 0.5,
      color: `hsl(${Math.random() * 60 + 180}, ${Math.random() * 30 + 60}%, ${Math.random() * 20 + 60}%)`,
      drift: {
        dx: (Math.random() - 0.5) * 0.3,
        dy: (Math.random() - 0.5) * 0.2
      }
    });
  }

  // Lightning effect
  let lightningFlash = 0;
  let lightningCooldown = 0;
  
  function triggerLightning() {
    if (Math.random() < 0.002 && lightningCooldown <= 0) {
      lightningFlash = 0.8;
      lightningCooldown = 300;
    }
    if (lightningCooldown > 0) lightningCooldown--;
  }

  // Droplet class
  class Droplet {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = -20; // Start above the view
      this.radius = Math.random() * 1.5 + 0.5;
      this.maxRadius = Math.random() * 4 + 3;
      this.speed = 0;
      this.mergeRadius = this.maxRadius * 0.7;
      this.growthRate = 0.02 + Math.random() * 0.03;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = 0;
    }

    update() {
      // Grow slightly until max size
      if (this.radius < this.maxRadius) {
        this.radius += this.growthRate;
        this.mergeRadius = this.radius * 0.7;
      }

      // Apply gravity as droplets grow larger
      if (this.radius > this.maxRadius * 0.7) {
        this.speed += 0.05;
        this.vy += this.speed;
      }

      // Move
      this.x += this.vx;
      this.y += this.vy;

      // Reset if fallen off bottom
      if (this.y > canvas.height + 50) {
        return true; // Mark for removal
      }
      return false;
    }

    draw(ctx) {
      // Draw refracted bokeh inside droplet
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.clip();
      
      // Refract background slightly
      const refractScale = 0.9 + this.radius / 20;
      const offsetX = (this.x - canvas.width / 2) * (1 - refractScale);
      const offsetY = (this.y - canvas.height / 2) * (1 - refractScale);
      
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(refractScale, refractScale);
      ctx.translate(-this.x - offsetX, -this.y - offsetY);
      
      drawBokeh(ctx);
      ctx.restore();

      // Draw droplet outline
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
      
      ctx.restore();
    }
  }

  // Manage droplets
  const droplets = [];
  let dropletSpawnTimer = 0;

  // Trail particles for wipe effect
  const trailParticles = [];

  function updateDroplets() {
    // Spawn new droplets
    if (dropletSpawnTimer <= 0) {
      for (let i = 0; i < 3; i++) {
        droplets.push(new Droplet());
      }
      dropletSpawnTimer = 15;
    } else {
      dropletSpawnTimer--;
    }

    // Update existing droplets
    for (let i = droplets.length - 1; i >= 0; i--) {
      const d = droplets[i];
      const remove = d.update();

      if (remove) {
        droplets.splice(i, 1);
        continue;
      }

      // Merge nearby droplets
      for (let j = i + 1; j < droplets.length; j++) {
        const other = droplets[j];
        const dx = d.x - other.x;
        const dy = d.y - other.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = d.mergeRadius + other.mergeRadius;

        if (dist < minDist) {
          // Merge
          const totalArea = Math.PI * d.radius * d.radius + Math.PI * other.radius * other.radius;
          const newRadius = Math.sqrt(totalArea / Math.PI);
          
          // Keep the lower one
          if (d.y >= other.y) {
            d.radius = Math.min(newRadius, d.maxRadius * 1.5);
            d.maxRadius = Math.max(d.maxRadius, d.radius);
            
            // Create trail particles from merged droplet
            if (d.vy > 1) {
              for (let k = 0; k < 3; k++) {
                trailParticles.push({
                  x: d.x + (Math.random() - 0.5) * d.radius * 2,
                  y: d.y + (Math.random() - 0.5) * d.radius * 2,
                  vx: (Math.random() - 0.5) * 0.5,
                  vy: d.vy * (0.5 + Math.random()),
                  life: 20 + Math.random() * 20,
                  size: Math.random() * 1 + 0.5
                });
              }
            }
            
            droplets.splice(j, 1);
          } else {
            other.radius = Math.min(newRadius, other.maxRadius * 1.5);
            other.maxRadius = Math.max(other.maxRadius, other.radius);
            droplets.splice(i, 1);
            break;
          }
        }
      }
    }
  }

  function updateTrailParticles() {
    for (let i = trailParticles.length - 1; i >= 0; i--) {
      const p = trailParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) {
        trailParticles.splice(i, 1);
      }
    }
  }

  function drawBokeh(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    
    // Apply lightning flash
    if (lightningFlash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${lightningFlash * 0.3})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      lightningFlash *= 0.9;
    }

    // Drift bohoks slowly
    for (const b of bohoks) {
      b.x += b.drift.dx;
      b.y += b.drift.dy;
      
      // Wrap around edges
      if (b.x < 0) b.x = canvas.width;
      if (b.x > canvas.width) b.x = 0;
      if (b.y < 0) b.y = canvas.height;
      if (b.y > canvas.height) b.y = 0;

      // Draw with glow
      const gradient = ctx.createRadialGradient(
        b.x, b.y, 0,
        b.x, b.y, b.radius * 3
      );
      
      const flashIntensity = lightningFlash > 0 ? lightningFlash : 0;
      gradient.addColorStop(0, b.color);
      gradient.addColorStop(1, 'transparent');
      
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.radius * (3 + flashIntensity), 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.restore();
  }

  function animate() {
    // Clear everything
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Update lightning
    triggerLightning();
    
    // Draw blurred bokeh background with slight motion blur
    ctx.save();
    ctx.filter = 'blur(1px)';
    drawBokeh(ctx);
    ctx.restore();
    
    // Update and draw trail particles (clear trails)
    updateTrailParticles();
    
    // Update droplets
    updateDroplets();
    
    // Draw droplets
    for (const d of droplets) {
      d.draw(ctx);
    }
    
    // Draw trail particles
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    for (const p of trailParticles) {
      ctx.globalAlpha = p.life / 40;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    
    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
