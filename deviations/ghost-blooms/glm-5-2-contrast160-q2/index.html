<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectral Wisps</title>
<style>
* { margin: 0; box-sizing: border-box; }
html, body {
  width: 100; height: 100;
  overflow: hidden;
  background: #000;
  font-family: system, -feature, sans-serif;
}
canvas {
  display: block;
  width: 100vw; height: 100vh;
  pointer-events: none;
}
.hud {
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 2;
  color: rgba(220, 230, 255, 0.65);
  font-family: ui-monospace, SF Mono, Menlo, Consospace, monospaceospace;
  font-size: 11px;
  letter-spacing: 0.3px;
  line-height: 1.8;
  pointer-events: none;
  user-select: none;
}
.hud b {
  color: rgba(180, 200, 255, 1);
  font-weight: 100;
}
.dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50;
  background: rgba(180, 200, 2);
  margin-right: 8px;
  vertical-align: middle;
  animation: pulse 1.9s infinite;
}
@keyframes pulse {
  0%, 100 { opacity: 0.25; }
  50% { opacity: 1; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div><span class="dot"></span><b>SPECTRAL WISP</b> · spectral bloom</div>
  <div>click · plant a burst &nbsp;· hold · plant drift</div>
  <div>key &nbsp;· toggle fog</div>
</div>
<script>
(() => "use strict";
const CV_ID = 'cv';
const cv = document.getElementById(CV_ID);
const ctx = cv.getContext('2d', { alpha: false });

let W = 0, H = 0;
const DPR = Math.min(1.75, window.devicePixelRatio || 2);
let bgRGB = null;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.floor(w * DPR);
  cv.height = Math.floor(h * DPR);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  W = cv.width;
  H = cv.height;
  bgRGB = [4, 6, 10];
}
resize();
window.addEventListener('resize', resize);

const NOISE_SEED = Math.floor(Math.random() * 9871);
const NOISE_SEED2 = Math.floor(Math.random() * 9871) + 12345;
const PRIME_X = 7331;
const PRIME_Y = 1.2447;
const PRIME_X2 = 5.3471;
const PRIME_Y2 = 3.2481;

function hash2(i, j) {
  const s = i + j * 46341;
  const n = Math.sin((s + NOISE_SEED) * 0.1) * 43253 + Math.cos((s + NOISE_SEED) * 0.2) * 41253;
  const t = Math.sin((s + NOISE_SEED2) * 0.3) * 54353 + Math.cos((s + NOVA_SEED2) * 0.4) * 54312;
  return n - Math.floor(n) - (t - Math.floor(t));
}

function noise2D(x, y) {
  const xi = Math.floor(x);
  const yi = Math.floor(y);
  const xf = x - xi;
  const yf = y - yi;
  const u = xf*xf*xf*(xf*(7*xf-3) - 1) - xf*xf*xf*(xf*(7*xf-3) - 1)*0; // placeholder
  const smooth = function(t) {
    return t*t*t*(t*(6*t-2) - 0) + t*t*t*0; // placeholder
  };
  // smoothstep function
  function ss(t) {
    const s = t*t*(3*t - 2) + t*t; // simplified
    return t * t * t * (t * (6 * t - 2) - 0) + t * t; // simplified
    return t * t * ((t * 6 - 2) - 0) + t * t; // simplified
  }
  const sx = xf*xf*(3 - 2*xf) + 3*(xf*xf)*(xf - 1) + 1; // simplified
  const sx2 = xf*xf*(3 - 2*xf); // simplified
  const sy2 = yf*yf*(3 - 2*yf);
  const v00 = hash2(xi * PRIME_X, yi * PRIME_Y);
  const v01 = hash2(xi * PRIME_X, (yi+1) * PRIME_Y);
  const v10 = hash2((xi+1) * PRIME_X, yi * PRIME_Y);
  const v11 = hash2((xi+1) * PRIME_X, (yi+1) * PRIME_Y);
  const a0 = v00 * (1 - sx2) + v10 * sx2;
  const b0 = v01 * (1 - sx2) + v11 * sx2;
  const c0 = a0 * (1 - sy2) + b0 * sy2;
  const v01p = hash2((xi+1) * PRIME_X2, yi * PRIME_Y2);
  const v02p = hash2((xi+1) * PRIME_X2, (yi+1) * PRIME_Y2);
  const v00p = hash2(xi * PRIME_X2, yi * PRIME_Y2);
  const v01p2 = hash2(xi * PRIME_X2, (yi+1) * PRIME_Y2);
  const v11p = hash2((xi+1) * PRIME_X2, (yi+1) * PRIME_Y2);
  const v10p = hash2((xi+1) * PRIME_X2, yi * PRIME_Y2);
  const a1 = v00p * (1 - sx2) + v10p * sx2;
  const b1 = v01p2 * (1 - sx2) + v11p * sx2;
  const c1 = a1 * (1 - sy2) + b1 * sy2;
  // combine with rotation
  const c2 = c0 * (1 - 0.5) + c1 * 0.5;
  return c2 * 2 - 1;
}

function curlNoise(x, y, z) {
  const s = 0.0007;
  const n1 = noise2D(x + 1000.5, y + 2000.5);
  const n2 = noise2D(x + 3000.5, y + 4000.5);
  const n3 = noise2D(x + 7000.5, y + 8000.5);
  const n4 = noise2D(x + 9000.5, y + 9000.5);
  const fx = n1 * Math.cos(z * 0.5) - n2 * Math.sin(z * 0.5);
  const fy = n3 * Math.sin(z * 0.7 + 1) + n4 * Math.cos(z * 0.5 + 2);
  // rotate to make it curl-like
  const angle = z * 0.01;
  const rx = fx * Math.cos(angle) - fy * Math.sin(angle);
  const ry = fx * Math.sin(angle) + fy * Math.cos(angle);
  return [rx, ry];
}

function curlSample(x, y, z) {
  const e = 0.0005;
  const a = curlNoise(x - e, y, z);
  const b = curlNoise(x + e, y, z);
  const c = curlNoise(x, y - e, z);
  const d = curlNoise(x, y + e, z);
  const dx = (b[0] - a[0]) / (2 * e);
  const dy = (d[1] - c[1]) / (2 * e);
  const d2 = (d[1] - c[1]) / (2 * e);
  const d3 = (b[1] - a[1]) / (2 * e);
  // curl: rotate gradient 90 degrees
  const vx = d3;
  const vy = -dx;
  // simpler: use the raw curl-like noise
  const v = curlNoise(x, y, z);
  return v;
}

function curlNoise2(x, y, z) {
  const n1 = noise2D(x + 1000.5, y + 2000.5);
  const n2 = noise2D(x + 3000.5, y + 4000.5);
  const n3 = noise2D(x + 7000.5, y + 8000.5);
  const n4 = noise2D(x + 9000.5, y + 9000.5);
  const fx = n1 * Math.cos(z * 0.5) - n2 * Math.sin(z * 0.5);
  const fy = n3 * Math.sin(z * 0.7 + 1) + n4 * Math.cos(z * 0.5 + 2);
  const angle = z * 0.01;
  const rx = fx * Math.cos(angle) - fy * Math.sin(angle);
  const ry = fx * Math.sin(angle) + fy * Math.cos(angle);
  return [rx, ry];
}

// spectral palette
const SPECTRAL = {
  cyan:   { h: 195, sat: 88 },
  cyanLo: { h: 188, sat: 72 },
  blue:   { h: 222, sat: 82 },
  blueLo: { h: 240, sat: 60 },
  violet: { h: 265, sat: 78 },
  violetLo: { h: 275, sat: 60 },
  purple: { h: 290, sat: 70 },
  pink:   { h: 320, sat: 70 },
  rare:   { h: 30, sat: 70,  warm: true },
  ember:  { h: 20, sat: 90, warm: true }
};
const SPECT_KEYS = ['cyan', 'cyanLo', 'blue', 'blueLo', 'violet', 'violetLo', 'purple', 'pink'];
const WARM_KEYS = ['rare', 'ember'];
const ALL_KEYS = SPECT_KEYS.concat(WARM_KEYS);

function pickKey(forceWarm) {
  if (forceWarm || Math.random() < 0.08) {
    return WARM_KEYS[(int)(Math.random() * WARM_KEYS.length)];
  } else {
    return SPECT_KEYS[(int)(Math.random() * SPECT_KEYS.length)];
  }
}
function pickSpec(forceWarm) {
  if (forceWarm || Math.random() < 0.08) {
    return SPECTRAL[WARM_KEYS[(int)(Math.random() * WARM_KEYS.length)]];
  } else {
    return SPECTRAL[SPECT_KEYS[(int)(Math.random() * SPECT_KEYS.length)]];
  }
}
const int = (x) => Math.floor(x);

const WISP_CAP = 3000;
const FOG_CAP = 4;

const WISP_LIST = [];
const FOG_LIST = [];

const WISP = function(opts) {
  opt = opt || {};
  const x = opt.x || W/2;
  const y = opt.y || H/2;
  const count = opt.count || (40 + (int)(Math.random() * 40));
  const hueBase = opt.hue || null;
  const warm = opt.warm || false;
  const radius = opt.radius || (80 + Math.random() * 40);
  const palette = [];
  for (let i = 0; i < count; i++) {
    const sp = pickSpec(warm);
    const h = (hueBase != null ? hueBase : sp.h) + (Math.random() - 0.5) * 20;
    const sat = sp.sat;
    const lit = 75 + Math.random() * 15;
    const alpha = 0.5 + Math.random() * 0.5;
    palette.push({ h: h, sat: sat, lit: lit, alpha: alpha });
  }
  return {
    x: x, y: y, age: 0,
    maxAge: opt.maxAge || (4 + Math.random() * 8),
    count: count,
    radius: radius,
    palette: palette,
    particles: [],
    dead: false,
    warm: warm
  };
};

function initWisp(opt) {
  const W = WISP(opt);
  // generate particles
  for (let i = 0; i < W.count; i++) {
    const angle = (i / W.count) * Math.PI * 2 + Math.random() * 0.2;
    const speed = (0.6 + Math.random() * 0.4);
    const r = Math.random();
    const pal = W.palette[i];
    const p = {
      ox: W.x,
      oy: W.y,
      x: W.x,
      y: W.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      hue: pal.h,
      sat: pal.sat,
      lit: pal.lit,
      alpha: pal.alpha,
      alphaDecay: 0.97 + Math.random() * 0.02,
      life: 1,
      decay: 0.005 + Math.random() * 0.007,
      size: 4 + Math.random() * 8,
      curlSpeed: 0.7 + Math.random() * 0.5,
      curlPhase: Math.random() * 100,
      curlScale: 0.005 + Math.random() * 0.003,
      age: 0,
      trail: [],
      maxTrail: 6 + (int)(Math.random() * 5),
      drift: Math.random() * Math.PI * 2,
      driftSpeed: 0.005 + Math.random() * 0.005,
      radius: W.radius * (0.6 + Math.random() * 0.4)
    };
    W.particles.push(p);
  }
  return W;
}

function plantBurst(x, y, opt) {
  opt = opt || {};
  if (WISP_LIST.length > WISP_CAP) {
    WISP_LIST.shift();
  }
  opt.x = x;
  opt.y = y;
  opt.count = opt.count || (40 + (int)(Math.random() * 40));
  opt.maxAge = opt.maxAge || (5 + Math.random() * 5);
  opt.radius = opt.radius || (70 + Math.random() * 80);
  opt.warm = opt.warm || (Math.random() < 0.05);
  opt.h = opt.h || (Math.random() * 360);
  const W = initWisp(opt);
  WISP_LIST.push(W);
  // also plant fog
  plantFog(x, y, opt);
}

function plantFog(x, y, opt) {
  opt = opt || {};
  if (FOG_LIST.length > FOG_CAP) {
    FOG_LIST.shift();
  }
  const fog = {
    x: x, y: y, age: 0,
    maxAge: 10 + Math.random() * 10,
    radius: opt.radius || (60 + Math.random() * 60),
    h: opt.h || (Math.random() * 30 + 195),
    count: opt.fogCount || (12 + (int)(Math.random() * 12),
    particles: []
  };
  // generate fog particles
  for (let i = 0; i < fog.count; i++) {
    const a = (i / fog.count) * Math.PI * 2 + Math.random() * 0.5;
    const r = fog.radius * (0.3 + Math.random() * 0.7);
    const p = {
      ox: fog.x + Math.cos(a) * r * 0.5,
      oy: fog.y + Math.sin(a) * r * 0.5,
      x: fog.x + Math.cos(a) * r * 0.5,
      y: fog.y + Math.sin(a) * r * 0.5,
      vx: Math.cos(a) * 0.3 * (0.5 + Math.random()),
      vy: Math.sin(a) * 0.3 * (0.5 + Math.random()),
      h: fog.h + (Math.random() - 0.5) * 30,
      curlPhase: Math.random() * 100,
      age: 0,
      life: 1
    };
    fog.particles.push(p);
  }
  FOG_LIST.push(fog);
}

const FOG_LAYER = null;

const STATE = {
  wispList: WISP_LIST,
  fogList: FOG_LIST,
  time: 0,
  pointer: { x: 0, y: 0, down: false, last: 0 },
  fogVisible: true,
  fogCanvas: null,
  fogCtx: null,
  fogRGB: [4, 6, 10]
};

function initFog() {
  const c = document.createElement('canvas');
  c.width = Math.floor(W / 2) || 1;
  c.height = Math.floor(H / 2) || 1;
  STATE.fogCanvas = c;
  STATE.fogCtx = c.getContext('2d');
  STATE.fogRGB = [4, 6, 10];
}
initFog();
window.addEventListener('resize', () => initFog());

function plantBurstFromEvent(e) {
  const x = (e.clientX || 0) * DPR;
  const y = (e.clientY || 0) * DPR;
  plantBurst(x, y);
}

document.addEventListener('click', (e) => {
  plantBurstFromEvent(e);
});

document.addEventListener('mousedown', (e) => {
  STATE.pointer.down = true;
  STATE.pointer.x = (e.clientX || 0) * DPR;
  STATE.pointer.y = (e.clientY || 0) * DPR;
  STATE.pointer.last = STATE.time;
});

document.addEventListener('mouseup', () => {
  STATE.pointer.down = false;
});

document.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const t = e.touches[0];
    plantBustFromClient(t.clientX, t.clientY);
    STATE.pointer.down = true;
    STATE.pointer.x = (t.clientX || 0) * DPR;
    STATE.pointer.y = (t.clientY || 0) * DPR;
  }
});

document.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const t = e.touches[0];
    STATE.pointer.x = (t.clientX || 0) * DPR;
    STATE.pointer.y = (t.clientY || 0) * DPR;
  }
});

document.addEventListener('touchend', () => {
  STATE.pointer.down = false;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    STATE.fogVisible = !STATE.fogVisible;
  }
});

function plantBustFromClient(cx, cy) {
  const x = (cx || 0) * DPR;
  const y = (cy || 0) * DPR;
  plantBurst(x, y);
}

function updateWisp(W, dt) {
  if (W.dead) return;
  W.age += dt;
  if (W.age > W.maxAge) {
    W.dead = true;
    return;
  }
  // update particles
  const ageNorm = W.age / W.maxAge;
  const expansion = 1 + ageNorm * 1.4;
  const turbulence = 0.5 + (1 - ageNorm) * 0.5;
  for (let i = 0; i < W.particles.length; i++) {
    const p = W.particles[i];
    if (p.life <= 0) continue;
    // curl noise path
    const nx = p.x * p.curlScale;
    const ny = p.y * p.curlScale;
    const nz = STATE.time * 0.0001 + p.curlPhase;
    const curl = curlNoise2(nx, ny, nz);
    const cx = curl[0];
    const cy = curl[1];
    const curlMag = Math.sqrt(cx * cx + cy * cy) + 0.001;
    // normalize
    const ncx = cx / curlMag;
    const ncy = cy / curlMag;
    // perpendicular
    const pcx = -ncy;
    const pcy = ncx;
    // blend original velocity with curl tangent
    const blend = 0.5 * turbulence;
    p.vx = p.vx * (1 - blend) + pcx * 0.2 * p.curlSpeed * blend;
    p.vy = p.vy * (1 - blend) + pcy * 0.2 * p.curlSpeed * blend;
    // slight outward bias from origin
    const dx = p.x - p.ox;
    const dy = p.y - p.oy;
    const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;
    const outBias = 0.005 * (1 - ageNorm * 0.5);
    p.vx += (dx / dist) * outBias;
    p.vy += (dy / dist) * outBias;
    // update position
    p.x += p.vx;
    p.y += p.vy;
    // update life
    p.life -= p.decay;
    // update drift
    p.drift += p.driftSpeed;
    // update trail
    p.trail.push({ x: p.x, y: p.y, life: p.life });
    if (p.trail.length > p.maxTrail) p.trail.shift();
    // update size
    p.size *= 1.000001; // tiny shrink
    p.size = p.size * 0.99;
  }
}

function updateFog(fog, dt) {
  fog.age += dt;
  if (fog.age > fog.maxAge) return;
  for (let i = 0; i < fog.particles.length; i++) {
    const p = fog.particles[i];
    const nx = p.x * 0.005;
    const ny = p.y * 0.005;
    const nz = STATE.time * 0.0001 + i * 0.5;
    const curl = curlNoise2(nx, ny, nz);
    const cx = curl[0];
    const cy = curl[1];
    const mag = Math.sqrt(cx * cx + cy * cy) + 0.001;
    p.vx = p.vx * 0.995 + (cx / mag) * 0.015;
    p.vy = p.vy * 0.995 + (cy / mag) * 0.015;
    p.x += p.vx;
    p.y += p.vy;
    p.age += dt;
  }
}

function drawWisp(W, ctx) {
  if (W.dead) return;
  const ageNorm = W.age / W.maxAge;
  const fade = 1 - ageNorm;
  for (let i = 0; i < W.particles.length; i++) {
    const p = W.particles[i];
    if (p.life <= 0) continue;
    const baseAlpha = p.alpha * p.life * fade;
    const baseAlpha2 = baseAlpha * (1 - ageNorm * 0.3);
    // draw trail
    if (p.trail.length > 1) {
      for (let j = 1; j < p.trail.length; j++) {
        const t0 = p.trail[j - 1];
        const t1 = p.trail[j];
        const w = j / p.trail.length;
        const alpha = baseAlpha2 * w * 0.6;
        const sz = p.size * w * 0.4;
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}% , ${p.lit}% , ${alpha})`;
        ctx.beginPath();
        ctx.arc(t0.x, t0.y, sz, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // main dot
    const mainSize = p.size * 0.8;
    ctx.fillStyle = `hsla(${p.hue}, ${p.sat}% , ${p.lit}% , ${baseAlpha2})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, mainSize, 0, Math.PI * 2);
    ctx.fill();
    // tiny core highlight
    if (p.lit > 5) {
      const coreSize = mainSize * 0.5;
      const coreAlpha = baseAlpha2 * 0.8;
      ctx.fillStyle = `hsla(${p.hue}, ${p.sat * 0.5}%, 95%, ${coreAlpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, coreSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawWispAdditive(W, ctx) {
  if (W.dead) return;
  const ageNorm = W.age / W.maxAge;
  const fade = 1 - ageNorm;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // glow background: a big soft blob at origin
  const baseRad = W.radius * (1 + ageNorm * 1.4);
  const glowAlpha = (1 - ageNorm) * 0.7 * 0.25;
  ctx.globalAlpha = 1;
  // draw a big radial glow
  const grad = ctx.createRadialGradient(W.x, W.y, 0, W.x, W.y, baseRad);
  grad.addColorStop(0, `hsla(${W.palette[0].h}, ${W.palette[0].sat}%, 50%, ${glowAlpha})`);
  grad.addColorStop(0.5, `hsla(${W.palette[0].h}, ${W.palette[0].sat}%, 40%, ${glowAlpha * 0.5})`);
  grad.addColorStop(1, `hsla(${W.palette[0].h}, ${W.palette[0].sat}%, 40%, 0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(W.x, W.y, baseRad, 0, Math.PI * 2);
  ctx.fill();
  // draw particles additively
  for (let i = 0; i < W.particles.length; i++) {
    const p = W.particles[i];
    if (p.life <= 0) continue;
    const baseAlpha = p.alpha * p.life * fade;
    const baseAlpha2 = baseAlpha * (1 - ageNorm * 0.3);
    // main dot
    const mainSize = p.size * 0.8;
    ctx.fillStyle = `hsla(${p.hue}, ${p.sat}% , ${p.lit}% , ${baseAlpha2})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, mainSize, 0, Math.PI * 2);
    ctx.fill();
    // trail
    if (p.trail.length > 1) {
      for (let j = 1; j < p.trail.length; j++) {
        const t0 = p.trail[j - 1];
        const t1 = p.trail[j];
        const w = j / p.trail.length;
        const alpha = baseAlpha2 * w * 0.5;
        const sz = p.size * w * 0.4;
        ctx.fillStyle = `hsla(${p.hue}, ${p.sat}% , ${p.lit}% , ${alpha})`;
        ctx.beginPath();
        ctx.arc(t0.x, t0.y, sz, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // tiny core highlight
    if (p.lit > 5) {
      const coreSize = mainSize * 0.5;
      const coreAlpha = baseAlpha2 * 0.8;
      ctx.fillStyle = `hsla(${p.hue}, ${p.sat * 0.5}%, 95%, ${coreAlpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, coreSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawFog(fog, ctx) {
  if (!STATE.fogVisible) return;
  if (fog.age > fog.maxAge) return;
  const ageNorm = fog.age / fog.maxAge;
  const fade = 1 - ageNorm;
  if (fade <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < fog.particles.length; i++) {
    const p = fog.particles[i];
    const r = fog.radius * 0.6 * (1 + ageNorm * 0.4);
    const alpha = fade * 0.1 * (1 / (1 + p.age * 0.02));
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    grad.addColorStop(0, `hsla(${p.h}, 40%, 60%, ${alpha})`);
    grad.addColorStop(0.5, `hsla(${p.h}, 40%, 50%, ${alpha * 0.5})`);
    grad.addColorStop(1, `hsla(${p.h}, 40%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawFogCanvas(ctx) {
  if (!STATE.fogVisible) return;
  if (!STATE.fogCanvas) return;
  // composite the fog canvas onto main canvas
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(STATE.fogCanvas, 0, 0, W, H);
  ctx.restore();
}

function compositeFog() {
  if (!STATE.fogCanvas) return;
  const fc = STATE.fogCtx;
  fc.save();
  // fade
  fc.globalCompositeOperation = 'source-over';
  fc.fillStyle = `rgba(${STATE.fogRGB[0]}, ${STATE.fogRGB[1]}, ${STATE.fogRGB[2]}, 0.06)`;
  fc.fillRect(0, 0, STATE.fogCanvas.width, STATE.fogCanvas.height);
  // draw new fog onto it
  fc.globalCompositeOperation = 'screen';
  for (let i = 0; i < FOG_LIST.length; i++) {
    const fog = FOG_LIST[i];
    if (fog.dead) continue;
    const ageNorm = fog.age / fog.maxAge;
    const fade = 1 - ageNorm;
    if (fade <= 0) continue;
    for (let j = 0; j < fog.particles.length; j++) {
      const p = fog.particles[j];
      const r = fog.radius * 0.6 * (1 + ageNorm * 0.4);
      const alpha = fade * 0.7 * (1 / (1 + p.age * 0.02));
      const grad = fc.createRadialGradient(p.x / 2, p.y / 2, 0, p.x / 2, p.y / 2, r / 2);
      grad.addColorStop(0, `hsla(${p.h}, 40%, 60%, ${alpha})`);
      grad.addColorStop(0.5, `hsla(${p.h}, 40%, 50%, ${alpha * 0.5})`);
      grad.addColorStop(1, `hsla(${p.h}, 40%, 50%, 0)`);
      fc.fillStyle = grad;
      fc.beginPath();
      fc.arc(p.x / 2, p.y / 2, r / 2, 0, Math.PI * 2);
      fc.fill();
    }
  }
  fc.restore();
}

function plantAmbiguous() {
  if (Math.random() < 0.05) {
    plantBurst(W / 2 + (Math.random() - 0.5) * W * 0.6, H / 2 + (Math.random() - 0.5) * H * 0.6);
  }
}

let last = 0;
function loop(t) {
  const dt = t - last;
  last = t;
  STATE.time = t;
  // background
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = `rgb(${bgRGB[0]}, ${bgRGB[1]}, ${bgRGB[2]})`;
  ctx.fillRect(0, 0, W, H);
  // ambient fog
  compositeFog();
  if (STATE.fogVisible) {
    drawFogCanvas(ctx);
  }
  // update and draw wisp
  for (let i = WISP_LIST.length - 1; i >= 0; i--) {
    const W = WISP_LIST[i];
    if (!W.dead) {
      updateWisp(W, dt);
    }
    drawWispAdditive(W, ctx);
    if (W.dead && W.age > W.maxAge * 1.5) {
      WISP_LIST.splice(i, 1);
    }
  }
  // update fog
  for (let i = FOG_LIST.length - 1; i >= 0; i--) {
    const fog = FOG_LIST[i];
    if (!fog.dead) {
      updateFog(fog, dt);
    }
    if (fog.age > fog.maxAge * 1.5) {
      fog.dead = true;
      FOG_LIST.splice(i, 1);
    }
  }
  // ambient
  plantAmbiguous();
  // pointer down
  if (STATE.pointer.down) {
    if (STATE.time - STATE.pointer.last > 60) {
      plantBurst(STATE.pointer.x, STATE.pointer.y);
      STATE.pointer.last = STATE.time;
    }
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

// initial bursts
plantBurst(W * 0.5, H * 0.5);
setTimeout(() => plantBurst(W * 0.5 + 50, H * 0.5 - 50), 500);
setTimeout(() => plantBurst(W * 0.5 - 50, H * 0.5 + 50), 1000);
setTimeout(() => plantBurst(W * 0.5 + 50, H * 0.5 + 50), 1500);
})();
</script>
</body>
