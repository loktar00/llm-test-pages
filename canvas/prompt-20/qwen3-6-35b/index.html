<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Auto-Combat</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1814;
            font-family: 'Courier New', Courier, monospace;
            color: #eee;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hud-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #5a4a3a;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .hud-right {
            left: auto;
            right: 20px;
            text-align: right;
        }
        .bar-container {
            width: 200px;
            height: 15px;
            background: #333;
            margin-top: 5px;
            border: 1px solid #555;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #b30000, #ff4400);
            transition: width 0.1s;
        }
        .weapon-name {
            color: #ffaa00;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #aaa;
        }
        .kill-feed {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }
        .kill-msg {
            color: #ff5555;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 4px;
            opacity: 1;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <!-- Persistent World Canvas (Background) -->
    <canvas id="persistentCanvas"></canvas>
    <!-- Live Action Canvas -->
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="controls">
            <b>WASD / Arrows</b> to Drive<br>
            <b>Mouse</b> to Aim<br>
            <b>Click / Space</b> to Fire
        </div>
        <div id="killFeed" class="kill-feed"></div>
        <div class="hud-panel">
            <div class="weapon-name" id="weaponDisplay">RUSTY RIFLE</div>
            <div>ARMOR</div>
            <div class="bar-container">
                <div class="bar-fill" id="healthBar"></div>
            </div>
        </div>
        <div class="hud-panel hud-right">
            <div>ENEMIES: <span id="enemyCount">0</span></div>
            <div>ZOMBIES: <span id="zombieCount">0</span></div>
        </div>
    </div>

<script>
/**
 * CONFIGURATION & CONSTANTS
 */
const WORLD_WIDTH = 4000;
const WORLD_HEIGHT = 3000;
const FPS = 60;
const DT = 1 / FPS;

// Colors
const C_DIRT_LIGHT = '#5a4d41';
const C_DIRT_DARK = '#4a3d31';
const C_OBSTACLE = '#2e251e';
const C_PLAYER = '#4caf50'; // Greenish
const C_AI_TYPES = ['#d32f2f', '#1976d2', '#7b1fa2', '#fbc02d', '#795548']; // Red, Blue, Purple, Yellow, Brown
const C_ZOMBIE = '#3e8e41';
const C_BLOOD = '#8a0303';
const C_SPARK = '#ffcc00';
const C_SMOKE = '#777777';

// Game Entities
const CARS_COUNT = 10;
const ZOMBIE_LIMIT = 250;
const ZOMBIE_SPAWN_RATE = 50; // Frames between spawns
const ZOMBIE_WAVE_SIZE = 15;

/**
 * UTILITIES
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const pCanvas = document.getElementById('persistentCanvas');
const pCtx = pCanvas.getContext('2d');

let width, height;
let mouse = { x: 0, y: 0 };
let keys = {};

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    // Persistent canvas needs to be world size
    pCanvas.width = WORLD_WIDTH;
    pCanvas.height = WORLD_HEIGHT;
    
    // Draw initial ground
    drawBaseGround();
}

function rand(min, max) { return Math.random() * (max - min) + min; }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
function lerp(a, b, t) { return a + (b - a) * t; }

/**
 * PERSISTENT WORLD (Damage & Terrain)
 */
function drawBaseGround() {
    // Base color
    pCtx.fillStyle = '#3e3229';
    pCtx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    
    // Noise texture (dust)
    const imgData = pCtx.getImageData(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    const data = imgData.data;
    for(let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 20;
        data[i] += noise;
        data[i+1] += noise;
        data[i+2] += noise;
    }
    pCtx.putImageData(imgData, 0, 0);

    // Draw obstacles (Static)
    pCtx.fillStyle = C_OBSTACLE;
    obstacles.forEach(o => {
        pCtx.fillRect(o.x, o.y, o.w, o.h);
        // Add 3D effect/shadow
        pCtx.fillStyle = 'rgba(0,0,0,0.5)';
        pCtx.fillRect(o.x + 5, o.y + 5, o.w, o.h);
        pCtx.fillStyle = C_OBSTACLE;
    });
}

function stampDamage(x, y, radius, type) {
    pCtx.save();
    pCtx.globalCompositeOperation = 'source-over';
    
    if (type === 'scorch') {
        const grad = pCtx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, 'rgba(20, 20, 20, 0.8)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        pCtx.fillStyle = grad;
        pCtx.beginPath();
        pCtx.arc(x, y, radius, 0, Math.PI * 2);
        pCtx.fill();
    } else if (type === 'blood') {
        pCtx.fillStyle = `rgba(130, 10, 10, ${rand(0.3, 0.6)})`;
        pCtx.beginPath();
        // Irregular shape
        for(let i=0; i<8; i++) {
            const ox = (Math.random() - 0.5) * radius;
            const oy = (Math.random() - 0.5) * radius;
            pCtx.lineTo(x + ox, y + oy);
        }
        pCtx.closePath();
        pCtx.fill();
    } else if (type === 'tire') {
        pCtx.fillStyle = 'rgba(20, 20, 20, 0.4)';
        pCtx.beginPath();
        pCtx.arc(x, y, radius, 0, Math.PI * 2);
        pCtx.fill();
    } else if (type === 'crater') {
        const grad = pCtx.createRadialGradient(x, y, radius*0.2, x, y, radius);
        grad.addColorStop(0, 'rgba(0,0,0,0.9)');
        grad.addColorStop(0.5, 'rgba(40,30,20,0.5)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        pCtx.fillStyle = grad;
        pCtx.beginPath();
        pCtx.arc(x, y, radius, 0, Math.PI * 2);
        pCtx.fill();
    } else if (type === 'wreck') {
        pCtx.fillStyle = '#111';
        pCtx.beginPath();
        pCtx.arc(x, y, radius, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.strokeStyle = '#444';
        pCtx.lineWidth = 2;
        pCtx.stroke();
    }
    pCtx.restore();
}

/**
 * INPUT HANDLING
 */
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
window.addEventListener('mousedown', () => keys['MouseLeft'] = true);
window.addEventListener('mouseup', () => keys['MouseLeft'] = false);

/**
 * GAME CLASSES
 */

class Vector {
    constructor(x, y) { this.x = x; this.y = y; }
}

class Particle {
    constructor(x, y, color, speed, life) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = life;
        this.maxLife = life;
        this.size = rand(2, 5);
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.9;
        this.vy *= 0.9;
        this.life--;
    }
    draw(ctx, camX, camY) {
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - camX, this.y - camY, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

class Projectile {
    constructor(x, y, angle, owner, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.owner = owner; // 'player' or 'ai'
        this.active = true;
        
        if (type === 'machinegun') {
            this.speed = 25;
            this.damage = 8;
            this.color = '#ffffaa';
            this.size = 2;
            this.cooldown = 0;
        } else if (type === 'shotgun') {
            this.speed = 22;
            this.damage = 15;
            this.color = '#ffaa00';
            this.size = 3;
            this.cooldown = 0;
        } else if (type === 'rocket') {
            this.speed = 12;
            this.damage = 40;
            this.color = '#ff4400';
            this.size = 5;
            this.cooldown = 60;
            this.explodeRadius = 60;
        } else if (type === 'mines') {
            // Mines are special, handled in car logic, this is just for visual
            this.speed = 0;
            this.damage = 0;
        }
    }

    update() {
        if (this.type === 'rocket') {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.cooldown--;
            if (this.cooldown <= 0) {
                this.explode();
            }
        } else {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
        }

        // Bounds check
        if (this.x < 0 || this.x > WORLD_WIDTH || this.y < 0 || this.y > WORLD_HEIGHT) {
            this.active = false;
        }
    }

    explode() {
        this.active = false;
        // Visuals
        for(let i=0; i<20; i++) particles.push(new Particle(this.x, this.y, '#ff4400', rand(2,8), 30));
        for(let i=0; i<10; i++) particles.push(new Particle(this.x, this.y, '#aaa', rand(1,4), 20));
        
        stampDamage(this.x, this.y, this.explodeRadius * 0.8, 'crater');

        // Damage entities
        const radius = this.explodeRadius;
        
        // Cars
        allCars.forEach(car => {
            if (car === this.owner) return;
            const d = dist(this.x, this.y, car.x, car.y);
            if (d < radius) {
                car.takeDamage(this.damage * (1 - d/radius));
                // Knockback
                const angle = Math.atan2(car.y - this.y, car.x - this.x);
                car.vx += Math.cos(angle) * 15;
                car.vy += Math.sin(angle) * 15;
            }
        });

        // Zombies
        for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];
            if (dist(this.x, this.y, z.x, z.y) < radius) {
                z.hp = 0;
                createGore(z.x, z.y);
            }
        }
        
        // Camera Shake
        shake = 10;
    }

    draw(ctx, camX, camY) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

class Zombie {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.hp = 20;
        this.speed = rand(1, 2.5);
        this.angle = Math.random() * Math.PI * 2;
        this.wobble = Math.random() * 10;
        this.target = null;
        this.dead = false;
    }

    update() {
        // Find closest car
        let minDist = 9999;
        this.target = null;
        
        // Check player
        if (player && !player.dead) {
            const d = dist(this.x, this.y, player.x, player.y);
            if (d < minDist) { minDist = d; this.target = player; }
        }
        
        // Check AI cars
        allCars.forEach(c => {
            if (c !== player && !c.dead) {
                const d = dist(this.x, this.y, c.x, c.y);
                if (d < minDist) { minDist = d; this.target = c; }
            }
        });

        if (this.target) {
            const angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;
            this.angle = angle;
        } else {
            // Wander
            this.wobble += 0.05;
            this.x += Math.cos(this.angle + Math.sin(this.wobble)*0.5) * this.speed * 0.5;
            this.y += Math.sin(this.angle + Math.sin(this.wobble)*0.5) * this.speed * 0.5;
        }

        // Bounds
        this.x = clamp(this.x, 0, WORLD_WIDTH);
        this.y = clamp(this.y, 0, WORLD_HEIGHT);

        // Collision with cars
        if (this.target && minDist < 30) {
            // Damage car
            this.target.takeDamage(0.5);
            // Zombie dies on contact
            this.hp = 0;
        }
    }

    draw(ctx, camX, camY) {
        if (this.dead) return;
        const sx = this.x - camX;
        const sy = this.y - camY;
        
        // Simple wobble animation
        const wobbleX = Math.sin(Date.now() / 100 + this.wobble) * 2;
        
        ctx.fillStyle = C_ZOMBIE;
        ctx.beginPath();
        ctx.arc(sx, sy, 6, 0, Math.PI*2); // Head
        ctx.fill();
        
        ctx.fillStyle = '#2a5e2d';
        ctx.beginPath();
        ctx.arc(sx + Math.cos(this.angle)*5 + wobbleX, sy + Math.sin(this.angle)*5, 3, 0, Math.PI*2); // Arm
        ctx.fill();
    }
}

class Car {
    constructor(x, y, type, isPlayer) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.angle = -Math.PI/2;
        this.width = 24;
        this.height = 40;
        this.type = type; // 'machinegun', 'shotgun', 'rocket'
        this.maxHp = 100;
        this.hp = 100;
        this.dead = false;
        this.isPlayer = isPlayer;
        this.color = isPlayer ? C_PLAYER : C_AI_TYPES[Math.floor(Math.random() * C_AI_TYPES.length)];
        this.weaponCooldown = 0;
        this.respawnTimer = 0;
        this.zombieDrag = 0;
        this.stuckTimer = 0;
    }

    update() {
        if (this.dead) {
            this.respawnTimer--;
            if (this.respawnTimer <= 0) this.respawn();
            return;
        }

        // Physics
        this.x += this.vx;
        this.y += this.vy;
        
        // Friction
        this.vx *= 0.95;
        this.vy *= 0.95;

        // Zombie Drag
        this.vx *= (1 - this.zombieDrag);
        this.vy *= (1 - this.zombieDrag);
        if (this.zombieDrag > 0) this.zombieDrag -= 0.02;

        // Bounds & Obstacle Collision
        this.handleCollisions();

        // Weapon Logic
        if (this.weaponCooldown > 0) this.weaponCooldown--;
        
        // Player Input
        if (this.isPlayer) {
            this.handlePlayerInput();
        } else {
            this.handleAI();
        }

        // Check AI Stuck
        if (!this.isPlayer) {
            if (Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) {
                this.stuckTimer++;
                if (this.stuckTimer > 200) {
                    this.takeDamage(1000); // Explode
                }
            } else {
                this.stuckTimer = 0;
            }
        }
    }

    handlePlayerInput() {
        const accel = 0.3;
        const turnSpeed = 0.06;
        const maxSpeed = 12;

        if (keys['KeyW'] || keys['ArrowUp']) {
            this.vx += Math.cos(this.angle) * accel;
            this.vy += Math.sin(this.angle) * accel;
        }
        if (keys['KeyS'] || keys['ArrowDown']) {
