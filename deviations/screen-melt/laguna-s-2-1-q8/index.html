<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doom Screen Melt Effect</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>
<body>
<canvas id="meltCanvas"></canvas>
<script>
(() => {
    const canvas = document.getElementById('meltCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let sceneBuffers = [];
    let currentSceneIndex = 0;
    let melting = false;
    let meltOffsets = [];
    let wobblePhase = 0;

    function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Scene Generator 1: Skyline with Mountains
    function generateScene1() {
        const buf = ctx.createImageData(width, height);
        const data = buf.data;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const idx = (y * width + x) * 4;

                if (y < height * 0.3) {
                    // Sky gradient
                    const t = y / (height * 0.3);
                    data[idx] = Math.floor(135 + t * (60 - 135));     // R
                    data[idx+1] = Math.floor(206 + t * (180 - 206)); // G
                    data[idx+2] = Math.floor(235 + t * (220 - 235)); // B
                } else {
                    // Terrain
                    const terrainY = Math.sin(x * 0.02 + y * 0.05) * 30 + 
                                   Math.cos(x * 0.01) * 20 + 
                                   Math.sin(x * 0.005 + y * 0.03) * 40 + 
                                   (height * 0.6);
                    
                    if (y > terrainY) {
                        data[idx] = Math.floor(34 + Math.random() * 20);   // R
                        data[idx+1] = Math.floor(139 + Math.random() * 30); // G
                        data[idx+2] = Math.floor(34 + Math.random() * 20);   // B
                    } else {
                        data[idx] = Math.floor(100 + Math.random() * 30);   // Underground
                        data[idx+1] = Math.floor(80 + Math.random() * 20);
                        data[idx+2] = Math.floor(60 + Math.random() * 20);
                    }
                }
                data[idx+3] = 255;
            }
        }

        // Draw sun/moon
        const sunRadius = 40;
        const sunX = width * 0.7;
        const sunY = height * 0.2;
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const dx = x - sunX;
                const dy = y - sunY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < sunRadius) {
                    const idx = (y * width + x) * 4;
                    data[idx] = 255;
                    data[idx+1] = 215;
                    data[idx+2] = 0;
                }
            }
        }

        return buf;
    }

    // Scene Generator 2: Abstract Geometric Patterns
    function generateScene2() {
        const buf = ctx.createImageData(width, height);
        const data = buf.data;
        const time = Date.now() * 0.002;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const idx = (y * width + x) * 4;
                
                const dx = x - width/2;
                const dy = y - height/2;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const angle = Math.atan2(dy, dx);
                
                let r = Math.sin(angle * 5 + time) * Math.cos(dist * 0.02 + time) * 127 + 128;
                let g = Math.cos(angle * 3 - time) * Math.sin(dist * 0.015 + time * 1.3) * 127 + 128;
                let b = Math.sin(dist * 0.01 - time * 0.7) * Math.cos(angle * 2 + time * 0.5) * 127 + 128;
                
                data[idx] = Math.floor(Math.abs(r));
                data[idx+1] = Math.floor(Math.abs(g));
                data[idx+2] = Math.floor(Math.abs(b));
                data[idx+3] = 255;
            }
        }
        return buf;
    }

    // Scene Generator 3: Plasma-like Fluid Flow
    function generateScene3() {
        const buf = ctx.createImageData(width, height);
        const data = buf.data;
        const time = Date.now() * 0.003;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const idx = (y * width + x) * 4;
                
                const nx = x / width - 0.5;
                const ny = y / height - 0.5;
                
                let v1 = Math.sin(x * 0.02 + time);
                let v2 = Math.cos(y * 0.03 + time * 1.1);
                let v3 = Math.sin((x + y) * 0.015 + time * 0.7);
                let v4 = Math.cos(Math.sqrt((x- width/2)**2 + (y - height/2)**2) * 0.01 + time * 0.5);
                
                const value = (v1 + v2 + v3 + v4) / 4;
                
                const hue = (value + 1) * 180;
                const sat = 0.8;
                const light = 0.5;
                
                // Convert HSL to RGB
                const c = (1 - Math.abs(2 * light - 1)) * sat;
                const hp = hue / 60;
                const x_val = c * (1 - Math.abs((hp % 2) - 1));
                const m = light - c/2;
                
                let r, g, b;
                if (hp >= 0 && hp < 1) [r, g, b] = [c, x_val, 0];
                else if (hp >= 1 && hp < 2) [r, g, b] = [x_val, c, 0];
                else if (hp >= 2 && hp < 3) [r, g, b] = [0, c, x_val];
                else if (hp >= 3 && hp < 4) [r, g, b] = [0, x_val, c];
                else if (hp >= 4 && hp < 5) [r, g, b] = [x_val, 0, c];
                else [r, g, b] = [c, 0, x_val];
                
                data[idx] = Math.floor((r + m) * 255);
                data[idx+1] = Math.floor((g + m) * 255);
                data[idx+2] = Math.floor((b + m) * 255);
                data[idx+3] = 255;
            }
        }
        return buf;
    }

    const sceneGenerators = [generateScene1, generateScene2, generateScene3];

    function generateNextScene() {
        const gen = sceneGenerators[currentSceneIndex % sceneGenerators.length];
        currentSceneIndex++;
        return gen();
    }

    function startMelt() {
        melting = true;
        meltOffsets = new Array(width);
        const maxDelay = height * 0.5;
        
        for (let i = 0; i < width; i++) {
            meltOffsets[i] = Math.random() * maxDelay;
        }
    }

    function updateMelt() {
        if (!melting) return false;

        wobblePhase += 0.05;
        let allDone = true;
        
        for (let i = 0; i < width; i++) {
            if (meltOffsets[i] > 0) {
                meltOffsets[i] -= 2 + Math.sin(wobblePhase + i * 0.1) * 0.5;
                if (meltOffsets[i] > 0) allDone = false;
            }
        }
        
        if (allDone) melting = false;
        return !allDone;
    }

    function renderFrame() {
        const currentScene = sceneBuffers[0];
        const nextScene = sceneBuffers[1];

        if (!melting && sceneBuffers.length < 2) {
            sceneBuffers.push(generateNextScene());
            if (sceneBuffers.length === 2) {
                // Hold the first scene briefly
                setTimeout(startMelt, 3000);
            }
        } else if (!melting && sceneBuffers.length >= 2) {
            // Keep holding until melt triggers
        }

        ctx.clearRect(0, 0, width, height);

        if (sceneBuffers.length === 1) {
            ctx.putImageData(sceneBuffers[0], 0, 0);
        } else if (sceneBuffers.length >= 2) {
            // Draw current scene with melt effect
            if (melting) {
                const imageData = ctx.createImageData(width, height);
                const srcData = currentScene.data;
                const dstData = imageData.data;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const wobble = Math.sin(wobblePhase + x * 0.05) * 2;
                        const offset = Math.floor(meltOffsets[x] + wobble);
                        const srcY = Math.max(0, y - offset);
                        
                        if (offset > 0 && srcY > 0) {
                            const srcIdx = (srcY * width + x) * 4;
                            const dstIdx = (y * width + x) * 4;
                            dstData[dstIdx] = srcData[srcIdx];
                            dstData[dstIdx+1] = srcData[srcIdx+1];
                            dstData[dstIdx+2] = srcData[srcIdx+2];
                            dstData[dstIdx+3] = srcData[srcIdx+3];
                        } else {
                            // Reveal next scene
                            const nextIdx = (y * width + x) * 4;
                            const nextData = nextScene.data;
                            const dstIdx = (y * width + x) * 4;
                            dstData[dstIdx] = nextData[nextIdx];
                            dstData[dstIdx+1] = nextData[nextIdx+1];
                            dstData[dstIdx+2] = nextData[nextIdx+2];
                            dstData[dstIdx+3] = 255;
                        }
                    }
                }
                ctx.putImageData(imageData, 0, 0);

                if (!updateMelt()) {
                    // Swap scenes
                    sceneBuffers.shift();
                    // Prepare next scene after brief hold
                    setTimeout(() => {
                        sceneBuffers.push(generateNextScene());
                        setTimeout(startMelt, 3000);
                    }, 100);
                }
            } else {
                ctx.putImageData(currentScene, 0, 0);
            }
        }

        requestAnimationFrame(renderFrame);
    }

    // Initialize with first scene
    sceneBuffers.push(generateNextScene());
    
    // Start animation
    requestAnimationFrame(renderFrame);
})();
</script>
</body>
</html>
