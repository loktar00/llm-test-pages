<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Travel Results</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f5f7fa;
    color: #222;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .search-summary {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: #fff;
    padding: 14px 18px;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.07);
    margin-bottom: 24px;
  }

  .chip {
    background: #eef1f5;
    border: 1px solid #d5dae0;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: text;
  }

  .chip input {
    border: none;
    outline: none;
    background: transparent;
    width: auto;
    font-size: inherit;
    font-family: inherit;
    color: #333;
    min-width: 60px;
  }

  .results-container {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 32px rgba(0,0,0,0.12);
  }

  .photo {
    height: 180px;
    position: relative;
    border-bottom: 1px solid #eee;
  }

  .price-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(4px);
    color: #1a1a1a;
    font-weight: 700;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .info {
    padding: 16px;
  }

  .title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .location {
    font-size: 13px;
    color: #777;
    margin-bottom: 10px;
  }

  .rating {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 10px;
  }

  .rating .star {
    font-size: 15px;
    color: #f5a623;
  }

  .rating span {
    font-size: 13px;
    color: #555;
  }

  .amenities {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .amenity {
    width: 22px;
    height: 22px;
    background: #eef1f5;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .heart {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    cursor: pointer;
    z-index: 2;
    transition: background 0.2s ease;
  }

  .heart:hover {
    background: #fff;
  }

  .heart svg {
    width: 20px;
    height: 20px;
    fill: #ccc;
    transition: fill 0.3s ease;
  }

  .heart.saved svg {
    fill: #ff4d6d;
  }

  .controls {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 18px;
  }

  select {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    background: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

  <div class="search-summary">
    <div class="chip">Destination: <input type="text" value="Bali" /></div>
    <div class="chip">Check-in: <input type="text" value="Jun 12" /></div>
    <div class="chip">Check-out: <input type="text" value="Jun 18" /></div>
    <div class="chip">Guests: <input type="text" value="2 adults" /></div>
  </div>

  <div class="controls">
    <label for="sort">Sort by: </label>
    <select id="sort">
      <option value="price-low">Price Low to High</option>
      <option value="price-high">Price High to Low</option>
      <option value="rating">Rating</option>
    </select>
  </div>

  <div class="results-container" id="results"></div>

<script>
  const resultsContainer = document.getElementById('results');
  const sortSelect = document.getElementById('sort');

  const properties = [
    {
      id: 1,
      title: "Oceanview Villa",
      location: "Canggu, Bali",
      price: 240,
      rating: 4.8,
      gradient: "linear-gradient(135deg, #667eea, #764ba2)"
    },
    {
      id: 2,
      title: "Jungle Treehouse",
      location: "Ubud, Bali",
      price: 180,
      rating: 4.6,
      gradient: "linear-gradient(135deg, #f093fb, #f5576c)"
    },
    {
      id: 3,
      title: "Beachfront Bungalow",
      location: "Nusa Dua, Bali",
      price: 320,
      rating: 4.9,
      gradient: "linear-gradient(135deg, #4facfe, #00f2fe)"
    },
    {
      id: 4,
      title: "Modern Suite",
      location: "Seminyak, Bali",
      price: 160,
      rating: 4.4,
      gradient: "linear-gradient(135deg, #fbc2eb, #a6c1ee)"
    },
    {
      id: 5,
      title: "Luxury Resort",
      location: "Jimbaran, Bali",
      price: 420,
      rating: 4.7,
      gradient: "linear-gradient(135deg, #ff9a9e, #fad0c4)"
    },
    {
      id: 6,
      title: "Cozy Cabin",
      location: "Munduk, Bali",
      price: 110,
      rating: 4.2,
      gradient: "linear-gradient(135deg, #a1c4fd, #c2e9fb)"
    }
  ];

  const savedHearts = {};

  function renderCards(data) {
    resultsContainer.innerHTML = "";
    const fragment = document.createDocumentFragment();
    data.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.order = index;

      card.innerHTML = `
        <div class="photo" style="${item.gradient}">
          <div class="price-badge">$${item.price}<span style="font-weight:400">/night</span></div>
          <div class="heart ${savedHearts[item.id] ? 'saved' : ''}" data-id="${item.id}">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
        </div>
        <div class="info">
          <div class="title">${item.title}</div>
          <div class="location">${item.location}</div>
          <div class="rating">
            <span class="star">★</span>
            <span>${item.rating}</span>
          </div>
          <div class="amenities">
            <div class="amenity">🛏</div>
            <div class="amenity">🚿</div>
            <div class="amenity">🌐</div>
            <div class="amenity">🍳</div>
          </div>
        </div>
      `;
      fragment.appendChild(card);
    });
    resultsContainer.appendChild(fragment);

    document.querySelectorAll('.heart').forEach(el => {
      el.addEventListener('click', function () {
        const id = Number(this.dataset.id);
        savedHearts[id] = !savedHearts[id];
        this.classList.toggle('saved');
        if (savedHearts[id]) {
          popHeart(this);
        }
      });
    });
  }

  function popHeart(heart) {
    heart.style.transform = "scale(1.4)";
    setTimeout(() => { heart.style.transform = "scale(1)"; }, 200);
  }

  sortSelect.addEventListener('change', () => {
    const val = sortSelect.value;
    let sorted = [...properties];
    if (val === 'price-low') sorted.sort((a, b) => a.price - b.price);
    else if (val === 'price-high') sorted.sort((a, b) => b.price - a.price);
    else if (val === 'rating') sorted.sort((a, b) => b.rating - a.rating);
    renderCards(sorted);
  });

  // initial render
  renderCards(properties);
</script>
</body>
</html>
