<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crystal Cavern Screensaver</title>
  <style>
    * { margin: 0; padding: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });

  // Light position orbiting slowly
  let lightAngle = 0;

  function getLightPos() {
    lightAngle += 0.001;
    const r = Math.min(W, H) * 0.6;
    return {
      x: W / 2 + Math.cos(lightAngle) * r,
      y: H / 2 + Math.sin(lightAngle * 0.7) * r * 0.8
    };
  }

  class Crystal {
    constructor(x, y, isFloor = true) {
      this.x = x;
      this.y = y;
      this.isFloor = isFloor;
      this.age = 0;
      this.segments = [{x: x, y: y, len: 0, angle: isFloor ? -Math.PI/2 : Math.PI/2}];
      this.growthRate = 0.3 + Math.random() * 0.5;
      this.color = `hsl(${Math.random() * 60 + 180}, 80%, 70%)`;
      this.branches = [];
      this.tipX = x;
      this.tipY = y;
    }

    update() {
      this.age++;
      for (let seg of this.segments) {
        if (seg.grow && seg.len < seg.maxLen) {
          seg.len += this.growthRate;
          const rad = seg.angle;
          this.tipX = seg.x + Math.cos(rad) * seg.len;
          this.tipY = seg.y + Math.sin(rad) * seg.len;
          if (seg.len >= seg.maxLen) {
            seg.grow = false;
            // Maybe branch
            if (Math.random() < 0.4 && this.segments.length < 30) {
              const newAngle1 = seg.angle + (Math.random() * 0.6 - 0.3);
              const newAngle2 = seg.angle + (Math.random() * 0.6 - 0.3);
              this.segments.push({
                x: this.tipX, y: this.tipY, len: 0, angle: newAngle1,
                grow: true, maxLen: 5 + Math.random() * 20
              });
              this.segments.push({
                x: this.tipX, y: this.tipY, len: 0, angle: newAngle2,
                grow: true, maxLen: 5 + Math.random() * 20
              });
            } else {
              // Continue straight
              const lastSeg = this.segments[this.segments.length - 1];
              this.segments.push({
                x: this.tipX, y: this.tipY, len: 0, angle: seg.angle,
                grow: true, maxLen: 5 + Math.random() * 20
              });
            }
          }
        } else if (!seg.grow && Math.random() < 0.01) {
          // Occasional small glimmer
        }
      }
    }

    draw(ctx, lightPos) {
      ctx.save();
      for (let i = 0; i < this.segments.length; i++) {
        const seg = this.segments[i];
        if (seg.len <= 0) continue;
        const x2 = seg.x + Math.cos(seg.angle) * seg.len;
        const y2 = seg.y + Math.sin(seg.angle) * seg.len;

        const width = Math.max(1, seg.len / 15);
        const grad = ctx.createLinearGradient(seg.x, seg.y, x2, y2);
        grad.addColorStop(0, this.color);
        grad.addColorStop(1, `hsl(${Math.random()*60+180}, 80%, 85%)`);
        ctx.fillStyle = grad;

        ctx.beginPath();
        ctx.moveTo(seg.x - width/2, seg.y);
        ctx.lineTo(x2 - width/2, y2);
        ctx.lineTo(x2 + width/2, y2);
        ctx.lineTo(seg.x + width/2, seg.y);
        ctx.closePath();
        ctx.fill();

        // Internal glimmer on segment
        if (Math.random() < 0.02) {
          ctx.fillStyle = 'white';
          ctx.fillRect(x2 - 1, y2 - 1, 3, 3);
        }

        // Caustic-like glow near tip
        const distToLight = Math.hypot(x2 - lightPos.x, y2 - lightPos.y);
        if (distToLight < 150) {
          const alpha = (1 - distToLight / 150) * 0.2;
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(x2, y2, 10 + Math.sin(this.age * 0.1) * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    getFillAmount(H) {
      let maxY = 0;
      for (let s of this.segments) {
        if (s.y < maxY) maxY = s.y;
      }
      return maxY;
    }
  }

  class Shard {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 3;
      this.vy = (Math.random() - 0.5) * 3 + 1;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.2;
      this.size = Math.random() * 4 + 2;
      this.life = 1;
      this.color = `hsl(${Math.random() * 60 + 180}, 80%, 70%)`;
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.05;
      this.rotation += this.rotationSpeed;
      this.life -= 0.005;
      if (this.y > H + 20) this.life = 0;
      return this.life > 0;
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.life;
      ctx.beginPath();
      ctx.moveTo(-this.size, -this.size);
      ctx.lineTo(this.size, 0);
      ctx.lineTo(-this.size, this.size);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  class Drip {
    constructor(x) {
      this.x = x;
      this.y = 0;
      this.speed = Math.random() * 1 + 0.5;
      this.length = Math.random() * 20 + 10;
      this.active = true;
    }

    update() {
      if (this.y < H - 50) {
        this.y += this.speed;
      } else {
        this.splash = true;
        this.radius = 1;
        this.maxRadius = 20 + Math.random() * 30;
      }
      if (this.splash && this.radius < this.maxRadius) {
        this.radius += 0.5;
        // Ripple effect handled in pool layer
      }
      if (this.radius > this.maxRadius + 20) {
        this.active = false;
      }
    }

    draw(ctx, time) {
      ctx.strokeStyle = 'rgba(150, 200, 255, 0.6)';
      ctx.lineWidth = 1;
      if (this.y < H - 50) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + this.length);
        ctx.stroke();
      } else {
        if (this.splash) {
          ctx.globalAlpha = 1 - (this.radius / (this.maxRadius + 20));
          ctx.beginPath();
          ctx.arc(this.x, H - 50, this.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  // Cavern background
  function drawBackground(ctx, time) {
    // Dark cave walls
    const wallGrad = ctx.createLinearGradient(0, 0, 0, H);
    wallGrad.addColorStop(0, '#1a1a2e');
    wallGrad.addColorStop(1, '#16213e');
    ctx.fillStyle = wallGrad;
    ctx.fillRect(0, 0, W, H);

    // Cave floor texture
    ctx.fillStyle = '#0d1b2a';
    for (let i = 0; i < W; i += 20) {
      const h = Math.sin(i * 0.05 + time * 0.02) * 5 + 15;
      ctx.fillRect(i, H - h, 20, h);
    }

    // Ceiling texture
    ctx.fillStyle = '#0d1b2a';
    for (let i = 0; i < W; i += 20) {
      const h = Math.sin(i * 0.05 + time * 0.02) * 5 + 15;
      ctx.fillRect(i, 0, 20, h);
    }
  }

  const crystals = [];
  const shards = [];
  const drips = [];
  const ripPoolY = H - 50;

  // Initialize crystals
  function initCrystals(count, isFloor) {
    for (let i = 0; i < count; i++) {
      const x = Math.random() * W;
      const y = isFloor ? H : 0;
      crystals.push(new Crystal(x, y, isFloor));
    }
  }

  initCrystals(15, true);
  initCrystals(10, false);

  // Drip initialization
  setInterval(() => {
    drips.push(new Drip(Math.random() * W));
  }, 1500);

  let lastTremor = 0;
  const tremorInterval = 8000 + Math.random() * 5000;

  function checkTremor() {
    let oldest = crystals[0];
    let oldestIdx = 0;
    for (let i = 1; i < crystals.length; i++) {
      if (crystals[i].age < oldest.age) {
        oldest = crystals[i];
        oldestIdx = i;
      }
    }
    return crystals.length > 50 && oldest.age > 500;
  }

  function doTremor() {
    // Shatter oldest crystals
    for (let i = 0; i < 8; i++) {
      let oldest = crystals[0];
      let oldestIdx = 0;
      for (let j = 1; j < crystals.length; j++) {
        if (crystals[j].age < oldest.age) {
          oldest = crystals[j];
          oldestIdx = j;
        }
      }
      if (oldestIdx < crystals.length) {
        for (let seg of oldest.segments) {
          if (seg.len > 0) {
            const x2 = seg.x + Math.cos(seg.angle) * seg.len;
            const y2 = seg.y + Math.sin(seg.angle) * seg.len;
            shards.push(new Shard(x2, y2));
          }
        }
        crystals.splice(oldestIdx, 1);
      }
    }
  }

  // Main loop
  let startTime = Date.now();

  function animate() {
    const time = (Date.now() - startTime) / 1000;
    const lightPos = getLightPos();

    drawBackground(ctx, time);

    // Update crystals
    for (let i = crystals.length - 1; i >= 0; i--) {
      crystals[i].update();
    }

    // Draw caustic patches on floor/ceiling
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(100, 200, 255, 0.05)`;
    const lightProjX = lightPos.x;
    const lightProjYFloor = H - 30;
    ctx.beginPath();
    ctx.arc(lightProjX, lightProjYFloor, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 180, 100, 0.05)`;
    ctx.beginPath();
    ctx.arc(lightProjX, 30, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Draw crystals
    for (let c of crystals) {
      c.draw(ctx, lightPos);
    }

    // Update and draw shards
    for (let i = shards.length - 1; i >= 0; i--) {
      if (!shards[i].update()) {
        shards.splice(i, 1);
      }
    }
    for (let s of shards) {
      s.draw(ctx);
    }

    // Update drips
    for (let i = drips.length - 1; i >= 0; i--) {
      drips[i].update();
      if (!drips[i].active) {
        drips.splice(i, 1);
      }
    }
    for (let d of drips) {
      d.draw(ctx, time);
    }

    // Ripple pools at bottom
    ctx.save();
    ctx.strokeStyle = 'rgba(173, 216, 230, 0.4)';
    ctx.lineWidth = 1;
    for (let i = 0; i < W; i += 40) {
      const ripplePhase = (i / W) * Math.PI * 2 + time * 3;
      const amp = Math.sin(ripplePhase) * 2;
      ctx.beginPath();
      ctx.moveTo(i, ripPoolY + amp);
      ctx.lineTo(i + 20, ripPoolY + amp + Math.sin(ripplePhase + 0.5) * 2);
      ctx.stroke();
    }
    ctx.restore();

    // Check for tremor
    if (time - lastTremor > tremorInterval) {
      if (checkTremor()) {
        doTremor();
      }
      lastTremor = time;
    }

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
