<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Wasteland Survival</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        /* --- VECTOR MATH HELPERS --- */
        class Vec2 {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
            mult(n) { return new Vec2(this.x * n, this.y * n); }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            norm() { const m = this.mag(); return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m); }
            dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
            dot(v) { return this.x * v.x + this.y * v.y; }
            copy() { return new Vec2(this.x, this.y); }
            lerp(v, t) { return new Vec2(this.x + (v.x - this.x) * t, this.y + (v.y - this.y) * t); }
        }

        /* --- CONSTANTS & CONFIG --- */
        const TILE_SIZE = 64;
        const MAP_W = 4000;
        const MAP_H = 4000;
        const ZOMBIE_MAX = 200;
        const WALL_PADDING = 10;
        const VIEW_DIST = 600;
        
        // Colors
        const C_BG = '#111';
        const C_GRASS = '#182018';
        const C_WALL = '#2a2a2a';
        const C_WALL_TOP = '#3a3a3a';
        const C_BLOOD = ['#500000', '#300000', '#600000'];
        const C_BLOOD_PARTICLE = '#aa0000';
        const C_SPARK = '#ffaa00';
        const C_MUZZLE = '#ffffaa';

        /* --- UTILS --- */
        const rand = (min, max) => Math.random() * (max - min) + min;
        const randInt = (min, max) => Math.floor(rand(min, max));
        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
        const lerpAngle = (a, b, t) => {
            let diff = b - a;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            return a + diff * t;
        };

        /* --- GAME STATE --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const canvasOff = document.createElement('canvas');
        const ctxOff = canvasOff.getContext('2d');
        
        let width, height;
        let camera = { x: 0, y: 0 };
        let lastTime = 0;
        let gameTime = 0;
        let startTime = 0;
        
        let bestKills = 0;
        let bestTime = 0;
        let currentKills = 0;
        let currentSurvivalTime = 0;
        
        let entities = {
            survivor: null,
            zombies: [],
            bullets: [],
            particles: [],
            waypoints: []
        };

        let mapTiles = [];
        let wallRects = [];

        /* --- INPUT (UNUSED) --- */
        window.addEventListener('resize', resize);
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            canvasOff.width = width; // Decals match screen for viewport scaling
            canvasOff.height = height;
        }
        resize();

        /* --- MAP GENERATION --- */
        function generateMap() {
            mapTiles = [];
            wallRects = [];
            entities.waypoints = [];

            // Create grid
            const cols = Math.ceil(MAP_W / TILE_SIZE);
            const rows = Math.ceil(MAP_H / TILE_SIZE);

            // Initialize empty
            for (let x = 0; x < cols; x++) {
                mapTiles[x] = [];
                for (let y = 0; y < rows; y++) {
                    mapTiles[x][y] = 1; // 0 = wall, 1 = floor
                }
            }

            // Drunkard's Walk for caves
            let cx = Math.floor(cols / 2);
            let cy = Math.floor(rows / 2);
            let steps = (cols * rows) * 1.5; // Fill factor
            
            // Clear borders
            for(let x=0; x<cols; x++) { mapTiles[x][0] = 0; mapTiles[x][rows-1] = 0; }
            for(let y=0; y<rows; y++) { mapTiles[0][y] = 0; mapTiles[cols-1][y] = 0; }

            for (let i = 0; i < steps; i++) {
                mapTiles[cx][cy] = 1;
                const dir = randInt(0, 4);
                if (dir === 0) cx++;
                else if (dir === 1) cx--;
                else if (dir === 2) cy++;
                else cy--;

                cx = clamp(cx, 1, cols - 2);
                cy = clamp(cy, 1, rows - 2);
            }

            // Convert tiles to wall rects (spatial partitioning)
            // We create a simpler grid system for collision
            // Actually, checking mapTiles[x][y] is fast enough for 4000x4000 if we cull.
        }

        function getTile(x, y) {
            if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return 0;
            const tx = Math.floor(x / TILE_SIZE);
            const ty = Math.floor(y / TILE_SIZE);
            return mapTiles[tx][ty];
        }

        function isWall(x, y) {
            // Check 4 corners
            const r = 10;
            return (getTile(x-r, y-r) === 0 || getTile(x+r, y-r) === 0 || 
                    getTile(x-r, y+r) === 0 || getTile(x+r, y+r) === 0);
        }

        /* --- ENTITY FACTORY --- */
        class Entity {
            constructor(x, y, radius) {
                this.pos = new Vec2(x, y);
                this.vel = new Vec2(0, 0);
                this.radius = radius;
                this.angle = 0;
                this.dead = false;
            }
        }

        class Survivor extends Entity {
            constructor() {
                // Spawn in center open area
                let sx = MAP_W/2, sy = MAP_H/2;
                super(sx, sy, 12);
                
                // Stats
                this.hp = 100;
                this.ammo = 30;
                this.speed = 2.5;
                
                // Animation
                this.walkCycle = 0;
                this.flashlightAngle = 0; // Independent of body
                
                // AI State
                this.state = 'PATROL'; // PATROL, INVESTIGATE, RETREAT
                this.targetPos = this.getRandomWaypoint();
                this.stuckTimer = 0;
                this.lastPos = this.pos.copy();
                this.flashlightOn = true;
                this.flickerTimer = 0;
                
                // Inventory
                this.lastShotTime = 0;
                this.reloadTimer = 0;
            }

            getRandomWaypoint() {
                // Find a random open tile
                let attempts = 0;
                while(attempts < 100) {
                    let x = rand(TILE_SIZE, MAP_W - TILE_SIZE);
                    let y = rand(TILE_SIZE, MAP_H - TILE_SIZE);
                    if (getTile(x, y) === 1) return new Vec2(x, y);
                    attempts++;
                }
                return new Vec2(MAP_W/2, MAP_H/2);
            }

            update(dt) {
                // Stuck detection
                if (this.pos.sub(this.lastPos).mag() < 0.5) {
                    this.stuckTimer += dt;
                } else {
                    this.stuckTimer = 0;
                }
                this.lastPos = this.pos.copy();

                // Flicker
                this.flickerTimer += dt * 10;
                const flicker = Math.sin(this.flickerTimer) > 0.95 ? 0.8 : 1.0;

                // AI Logic
                const distToTarget = this.pos.dist(this.targetPos);
                const nearestZombie = this.getNearestZombie();
                const zombieVisible = nearestZombie && this.hasLineOfSight(nearestZombie.pos);

                // State Machine
                if (zombieVisible && nearestZombie.pos.dist(this.pos) < 400) {
                    this.state = 'SHOOT';
                    this.targetPos = this.pos.copy(); // Stay put-ish
                } else if (distToTarget < 50) {
                    this.targetPos = this.getRandomWaypoint();
                    this.state = 'PATROL';
                } else {
                    this.state = 'PATROL';
                }

                // Movement Vector
                let moveVec = new Vec2(0, 0);
                let aimVec = new Vec2(0, 0);
                let lookAngle = this.angle;

                if (this.state === 'SHOOT') {
                    // Aim at zombie
                    if (nearestZombie) {
                        aimVec = nearestZombie.pos.sub(this.pos).norm();
                        this.angle = Math.atan2(aimVec.y, aimVec.x);
                        this.flashlightAngle = this.angle;
                        
                        // Backpedal
                        moveVec = this.vel.sub(aimVec.mult(this.speed * 0.5));
                        
                        // Shoot
                        if (gameTime - this.lastShotTime > 0.3) {
                            this.shoot(aimVec);
                        }
                    }
                } else {
                    // Patrol
                    let toTarget = this.targetPos.sub(this.pos);
                    this.angle = Math.atan2(toTarget.y, toTarget.x);
                    
                    // Occasional look around
                    if (Math.random() < 0.01) {
                        this.flashlightAngle = this.angle + (Math.random() > 0.5 ? 1.5 : -1.5);
                    } else {
                        this.flashlightAngle = lerpAngle(this.flashlightAngle, this.angle, 0.1);
                    }

                    moveVec = toTarget.norm().mult(this.speed);
                }

                // Apply Physics
                this.vel = moveVec;
                
                // Collision
                let nextPos = this.pos.add(this.vel);
                
                // Wall Collision
                if (!isWall(nextPos.x, this.pos.y)) this.pos.x = nextPos.x;
                if (!isWall(this.pos.x, nextPos.y)) this.pos.y = nextPos.y;

                // Zombie Collision (Soft push)
                entities.zombies.forEach(z => {
                    let d = this.pos.dist(z.pos);
                    if (d < this.radius + z.radius + 5) {
                        let push = this.pos.sub(z.pos).norm().mult(1.5);
                        this.pos = this.pos.add(push);
                    }
                });

                // Bobbing
                this.walkCycle += Math.abs(moveVec.mag()) * 0.2;
            }

            getNearestZombie() {
                let nearest = null;
                let minD = Infinity;
                entities.zombies.forEach(z => {
                    let d = this.pos.dist(z.pos);
                    if (d < minD) { minD = d; nearest = z; }
                });
                return nearest;
            }

            hasLineOfSight(target) {
                // Raycast check
                let steps = Math.ceil(this.pos.dist(target) / TILE_SIZE);
                let dir = target.sub(this.pos).norm();
                for (let i = 0; i < steps; i++) {
                    let pt = this.pos.add(dir.mult(i * TILE_SIZE));
                    if (getTile(pt.x, pt.y) === 0) return false;
                }
                return true;
            }

            shoot(dir) {
                this.lastShotTime = gameTime;
                entities.bullets.push(new Bullet(this.pos.add(dir.mult(20)), dir));
                // Muzzle flash effect
                for(let i=0; i<3; i++) {
                    entities.particles.push(new Particle(this.pos.add(dir.mult(20)), dir.mult(rand(1,3)), C_MUZZLE, 0.2));
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                ctx.rotate(this.angle);

                // Bobbing offset
                let bob = Math.sin(this.walkCycle) * 2;

                // Body
                ctx.fillStyle = '#4a5d4a'; // Camo green
                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.fillStyle = '#dcb'; // Skin
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();

                // Gun
                ctx.fillStyle = '#222';
                ctx.fillRect(8, -2, 14, 4);

                // Flashlight
                ctx.save();
                ctx.rotate(this.flashlightAngle - this.angle);
                ctx.fillStyle = '#555';
                ctx.fillRect(8, 4, 10, 3); // Body
                ctx.fillStyle = '#000';
                ctx.fillRect(16, 4, 2, 3); // Lens
                ctx.restore();

                ctx.restore();
            }
        }

        class Zombie extends Entity {
            constructor(x, y) {
                super(x, y, 11);
                this.speed = rand(1.0, 1.8);
                this.state = 'WANDER';
                this.targetPos = new Vec2(x, y);
                this.animOffset = rand(0, 100);
            }

            update(dt) {
                // AI
                if (this.state === 'WANDER') {
                    if (this.pos.dist(this.targetPos) < 10) {
                        // Pick new random spot
                        let attempts = 0;
                        while(attempts < 20) {
                            let rx = this.pos.x + rand(-300, 300);
                            let ry = this.pos.y + rand(-300, 300);
                            if (getTile(rx, ry) === 1) {
                                this.targetPos = new Vec2(rx, ry);
                                this.state = 'WALKING';
                                break;
                            }
                            attempts++;
                        }
                    }
                } else if (this.state === 'WALKING') {
                    let dist = this.pos.dist(this.targetPos);
                    if (dist < 10) {
                        this.state = 'WANDER';
                    }
                } else if (this.state === 'CHASE') {
                    this.targetPos = entities.survivor.pos;
                }

            }

            checkAlert(survivor) {
                // Vision: Distance + FOV + Line of Sight
                let d = this.pos.dist(survivor.pos);
                if (d > 500) return; // Can't see far

                // Line of sight check
                let dir = survivor.pos.sub(this.pos).norm();
                let dot = dir.dot(new Vec2(Math.cos(this.angle), Math.sin(this.angle)));
                
                // Check LOS
                if (survivor.hasLineOfSight(this.pos)) {
                    this.state = 'CHASE';
                }
            }

            draw(ctx) {
                // Only draw if in flashlight cone or close to camera
                let distToSurvivor = this.pos.dist(entities.survivor.pos);
                if (distToSurvivor > 800) return; // Fog of war

                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                
                let dir = entities.survivor.pos.sub(this.pos).norm();
                let lookAngle = Math.atan2(dir.y, dir.x);
                
                // Smooth rotation
                let diff = lookAngle - this.angle;
                while(diff > Math.PI) diff -= Math.PI*2;
                while(diff < -Math.PI) diff += Math.PI*2;
                this.angle += diff * 0.1;
                
                ctx.rotate(this.angle);

                // Limp animation
                let walk = Math.sin(gameTime * 5 + this.animOffset) * 3;

                // Arms
                ctx.fillStyle = '#343';
                ctx.fillRect(-5, -10 + walk, 10, 4); // Left arm out
                ctx.fillRect(-5, 6 - walk, 10, 4);   // Right arm out

                // Body
                ctx.fillStyle = '#252';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.fillStyle = '#363';
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(pos, dir) {
                this.pos = pos;
                this.vel = dir.mult(25); // Fast
                this.life = 1.0; // Seconds
                this.radius = 2;
                this.dead = false;
            }

            update(dt) {
                this.pos = this.pos.add(this.vel);
                this.life -= dt;

                // Wall collision
                if (getTile(this.pos.x, this.pos.y) === 0 || this.life <= 0) {
                    this.dead = true;
                    // Sparks
                    for(let i=0; i<3; i++) {
                        entities.particles.push(new Particle(this.pos, new Vec2(rand(-2,2), rand(-2,2)), C_SPARK, 0.3));
                    }
                }

                // Zombie collision
                entities.zombies.forEach(z => {
                    if (this.pos.dist(z.pos) < z.radius + 2) {
                        this.dead = true;
                        z.dead = true;
                        currentKills++;
                        // Blood
                        for(let i=0; i<10; i++) {
                            entities.particles.push(new Particle(z.pos, new Vec2(rand(-3,3), rand(-3,3)), C_BLOOD_PARTICLE, 0.5));
                        }
                        // Mark persistent canvas
                        markDecal(z.pos);
                    }
                });

                // Survivor collision (self harm? rare)
                if (this.pos.dist(entities.survivor.pos) < entities.survivor.radius) {
                    this.dead = true;
                    // Blood
                    entities.particles.push(new Particle(entities.survivor.pos, new Vec2(0,-2), C_BLOOD_PARTICLE, 0.2));
                    entities.survivor.hp -= 10;
                    if (entities.survivor.hp <= 0) resetGame();
                }
            }

            draw(ctx) {
                ctx.fillStyle = '#ff8';
                ctx.beginPath();
                ctx.arc(this.pos.x, this.pos.y, 2, 0, Math.PI*2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(pos, vel, color, life) {
                this.pos = pos;
                this.vel = vel;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.dead = false;
                this.size = rand(1, 3);
            }
            update(dt) {
                this.pos = this.pos.add(this.vel);
                this.vel = this.vel.mult(0.9); // Drag
                this.life -= dt;
                if (this.life <= 0) this.dead = true;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.pos.x, this.pos.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        /* --- PERSISTENT LAYER (DECALS) --- */
        function markDecal(pos) {
            // Draw on offscreen canvas using screen coords relative to map
            // Since canvas size is dynamic, we use logical coords
            ctx
