<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Farm Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const CYCLE_TIME = 90000; // 90 seconds for a full day/night cycle
        let time = 0; // 0 to CYCLE_TIME

        // Mouse interaction to advance time manually if needed
        let mouseX = 0;
        
        // Turbines
        const turbines = [];
        const NUM_TURBINES = 12;

        // Truck
        let truck = {
            active: false,
            timer: 0,
            x: -200,
            speed: 2,
            dust: []
        };

        // Clouds
        const clouds = [];
        const NUM_CLOUDS = 8;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => mouseX = e.clientX);
        resize();

        // --- Initialization ---

        class Turbine {
            constructor() {
                this.x = Math.random() * width;
                // Depth factor 0 (far) to 1 (near)
                this.depth = Math.random(); 
                this.scale = 0.3 + (this.depth * 0.7);
                this.y = height * 0.65 + (this.depth * height * 0.15); // Lower is closer
                this.bladeAngle = Math.random() * Math.PI * 2;
                this.speed = 0;
            }

            update(windSpeed, dt) {
                const baseSpeed = 0.02 + (this.depth * 0.03);
                this.bladeAngle += (baseSpeed * windSpeed * dt) * 0.01;
            }

            draw(ctx, sunY) {
                const s = this.scale;
                const towerH = 120 * s;
                const bladeL = 50 * s;
                
                const shadowOffset = (sunY - height) * 0.8 * s;
                
                // Shadow
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + shadowOffset, this.y - (towerH * 0.1));
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 5 * s;
                ctx.stroke();

                // Tower
                ctx.beginPath();
                ctx.moveTo(this.x - 4 * s, this.y);
                ctx.lineTo(this.x + 4 * s, this.y);
                ctx.lineTo(this.x + 2 * s, this.y - towerH);
                ctx.lineTo(this.x - 2 * s, this.y - towerH);
                ctx.fillStyle = '#ccc';
                ctx.fill();

                // Blades
                ctx.save();
                ctx.translate(this.x, this.y - towerH);
                
                // Pivot
                ctx.beginPath();
                ctx.arc(0, 0, 3 * s, 0, Math.PI * 2);
                ctx.fillStyle = '#ddd';
                ctx.fill();

                // Warning Light (blink at dusk/night)
                const sunProgress = time / CYCLE_TIME;
                const isDusk = (sunProgress > 0.45 && sunProgress < 0.55) || (sunProgress > 0.9 && sunProgress < 0.95);
                if (isDusk && Math.floor(Date.now() / 500) % 2 === 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 2 * s, 0, Math.PI * 2);
                    ctx.fillStyle = 'red';
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'red';
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.rotate(this.bladeAngle);
                
                for (let i = 0; i < 3; i++) {
                    ctx.rotate((Math.PI * 2) / 3);
                    ctx.beginPath();
                    ctx.moveTo(-2 * s, 0);
                    ctx.lineTo(2 * s, 0);
                    ctx.lineTo(0, -bladeL);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Initialize Turbines
        for (let i = 0; i < NUM_TURBINES; i++) turbines.push(new Turbine());

        // Initialize Clouds
        for (let i = 0; i < NUM_CLOUDS; i++) {
            clouds.push({
                x: Math.random() * width,
                y: Math.random() * (height * 0.4),
                w: 100 + Math.random() * 200,
                h: 40 + Math.random() * 60,
                speed: 0.2 + Math.random() * 0.5
            });
        }

        // --- Helper Functions ---

        function getSunY(progress) {
            // Progress 0 = dawn, 0.5 = noon, 1.0 = night (start)
            // We want the sun to be high at 0.5
            // Arc: y = center - radius * sin(theta)
            // Theta goes from PI to 2*PI (bottom half of circle usually, but let's flip logic)
            // Let's map 0..1 to 0..PI
            const angle = progress * Math.PI;
            // Arc center at bottom of screen
            const cx = width / 2;
            const cy = height + 100; 
            const radius = Math.min(width, height) * 0.9;

            // At 0.5 (noon), angle is PI/2, sin is 1 -> y = cy - radius (High)
            // At 0 or 1, angle is 0 or PI, sin is 0 -> y = cy (Horizon)
            return cy - Math.sin(angle) * radius;
        }

        function getSunX(progress) {
            return width * progress;
        }

        function getSunColor(progress) {
            // Progress 0..1
            // Dawn (0): Orange
            // Noon (0.5): White
            // Dusk (0.5-0.9): Orange/Red
            // Night (0.9-1): Dark Blue
            if (progress < 0.1) return `rgb(255, ${140 + progress * 500}, 0)`; // Dawn
            if (progress > 0.8 && progress < 0.95) return `rgb(255, ${200 - (progress-0.8)*1000}, 0)`; // Dusk
            return 'white';
        }

        function getSkyGradient(progress) {
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            // Night to Day transition
            const nightColor = [10, 10, 30];
            const dayColor = [100, 180, 240];
            
            let r, g, b;

            if (progress < 0.2) { // Night to Dawn
                const t = progress / 0.2;
                r = nightColor[0] + (dayColor[0] - nightColor[0]) * t;
                g = nightColor[1] + (dayColor[1] - nightColor[1]) * t;
                b = nightColor[2] + (dayColor[2] - nightColor[2]) * t;
            } else if (progress > 0.8) { // Dusk to Night
                const t = (progress - 0.8) / 0.2;
                r = dayColor[0] + (nightColor[0] - dayColor[0]) * t;
                g = dayColor[1] + (nightColor[1] - dayColor[1]) * t;
                b = dayColor[2] + (nightColor[2] - dayColor[2]) * t;
            } else {
                r = dayColor[0]; g = dayColor[1]; b = dayColor[2];
            }

            grad.addColorStop(0, `rgb(${r},${g},${b})`);
            grad.addColorStop(1, `rgb(${Math.min(255, r+50)},${Math.min(255, g+50)},${Math.min(255, b+50)})`);
            return grad;
        }

        function drawWheatField(time, wind) {
            const horizonY = height * 0.65;
            const step = 5; // Vertical strips
            
            // Draw background mountains/hills first
            ctx.fillStyle = '#556B2F'; // Dark Olive Green
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, horizonY);
            for(let x=0; x<=width; x+=50) {
                ctx.lineTo(x, horizonY + Math.sin(x*0.01)*30 + Math.sin(x*0.03)*10);
            }
            ctx.lineTo(width, height);
            ctx.fill();

            // Draw wheat
            const segments = width / 10;
            ctx.lineWidth = 2;

            for (let x = 0; x < width; x += 10) {
                // Distance from center determines color and size
                const progress = x / width;
                
                // Base color (Greenish yellow)
                const r = 180;
                const g = 200;
                const b = 80;
                
                // Wheat stalks
                // Height based on y position (perspective)
                const rowY = horizonY + (height - horizonY) * (0.5 + progress * 0.5);
                const heightFactor = (rowY - horizonY) / (height - horizonY); // 0 at horizon, 1 at bottom
                const wheatHeight = 10 + heightFactor * 40;

                // Wind calculation
                // Traveling wave: sin(x + time)
                const windForce = Math.sin(x * 0.02 + time * wind * 0.005);
                const sway = windForce * (10 + heightFactor * 20);

                ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
                
                ctx.beginPath();
                ctx.moveTo(x, rowY);
                // Curve
                ctx.quadraticCurveTo(x + sway/2, rowY - wheatHeight/2, x + sway, rowY - wheatHeight);
                ctx.stroke();
                
                // Wheat head
                ctx.fillStyle = '#DAA520';
                ctx.fillRect(x + sway - 1, rowY - wheatHeight - 2, 3, 6);
            }
        }

        function drawRoad() {
            const horizonY = height * 0.65;
            ctx.fillStyle = '#5d4037'; // Dark brown
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(width, height);
            ctx.lineTo(width * 0.6, horizonY + 20);
            ctx.lineTo(width * 0.4, horizonY + 20);
            ctx.fill();
        }

        function drawTruck(dt) {
            if (truck.active) {
                // Update Truck
                truck.x += truck.speed * dt;
                
                // Dust
                if (Math.random() > 0.5) {
                    truck.dust.push({x: truck.x, y: height*0.95, life: 1.0});
                }

                if (truck.x > width + 100) {
                    truck.active = false;
                    truck.dust = [];
                }
            } else {
                // Spawn logic
                truck.timer += dt;
                if (truck.timer > 2000) { // Every few seconds
                    if (Math.random() > 0.3) {
                        truck.active = true;
                        truck.x = -50;
                        truck.timer = 0;
                    }
                }
            }

            // Draw Dust
            ctx.fillStyle = 'rgba(160, 140, 120, 0.4)';
            for (let i = truck.dust.length - 1; i >= 0; i--) {
                let p = truck.dust[i];
                p.life -= 0.02;
                p.y -= 0.5;
                p.x -= 1; // Dust stays behind
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5 * (1-p.life), 0, Math.PI*2);
                ctx.fill();
                if (p.life <= 0) truck.dust.splice(i, 1);
            }

            if (truck.active) {
                ctx.fillStyle = '#cc0000'; // Red Truck
                // Simple truck shape
                const ty = height * 0.85;
                const tx = truck.x;
                ctx.fillRect(tx, ty, 40, 20); // Body
                ctx.fillRect(tx + 25, ty - 15, 15, 15); // Cabin
                ctx.fillStyle = '#888'; // Wheels
                ctx.beginPath();
                ctx.arc(tx + 5, ty + 20, 5, 0, Math.PI*2);
                ctx.arc(tx + 35, ty + 20, 5, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- Main Loop ---

        let lastTime = performance.now();

        function loop(currentTime) {
            const dt = currentTime - lastTime;
            lastTime = currentTime;

            // Update Time
            time += dt;
            if (time > CYCLE_TIME) time = 0;
            
            const progress = time / CYCLE_TIME; // 0 to 1

            // Wind Model
            // Sine wave + Noise approximation
            const windBase = 1.0 + Math.sin(time * 0.001) * 0.5;
            const windGust = Math.sin(time * 0.005) * 0.5;
            const wind = Math.max(0.1, windBase + windGust);

            // Clear
            ctx.clearRect(0, 0, width, height);

            // 1. Sky
            ctx.fillStyle = getSkyGradient(progress);
            ctx.fillRect(0, 0, width, height);

            // 2. Sun
            const sunY = getSunY(progress);
            const sunX = getSunX(progress);
            const sunColor = getSunColor(progress);
            
            if (sunY < height) {
                const sunRadius = 40;
                // Glow
                const sunGrad = ctx.createRadialGradient(sunX, sunY, sunRadius * 0.2, sunX, sunY, sunRadius * 4);
                sunGrad.addColorStop(0, sunColor);
                sunGrad.addColorStop(0.5, sunColor.replace(')', ', 0.3)').replace('rgb', 'rgba'));
                sunGrad.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = sunGrad;
                ctx.fillRect(0, 0, width, height);

                // Core
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#FFF';
                ctx.fill();
            }

            // 3. Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            clouds.forEach(c => {
                c.x += c.speed * wind;
                if (c.x > width + 200) c.x = -200;
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.w, c.h, 0, 0, Math.PI*2);
                ctx.fill();
            });

            // 4. Ground & Wheat
            drawWheatField(time, wind);

            // 5. Road
            drawRoad();

            // 6. Trucks
            drawTruck(dt);

            // 7. Turbines
            // Sort by depth (far first)
            turbines.sort((a, b) => a.depth - b.depth);
            turbines.forEach(t => {
                t.update(wind, dt);
                t.draw(ctx, sunY);
            });

            // 8. Vignette / Atmosphere
            const grad = ctx.createRadialGradient(width/2, height/2, height*0.5, width/2, height/2, height);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,width,height);

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

    </script>
</body>
</html>
