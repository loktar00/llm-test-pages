<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ghostly Explosions</title>
    <style>
        body,html{margin:0;padding:0;overflow:hidden;background:#000}
        canvas{display:block;width:100vw;height:100vh}
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const MAX_PARTICLES = 4000;
    const NUM_BURSTS = 4;
    let bursts = [];
    let fogCanvas = document.createElement('canvas');
    let fogCtx = fogCanvas.getContext('2d');
    fogCanvas.width = width;
    fogCanvas.height = height;

    function rand(min, max) {
        return Math.random() * (max - min) + min;
    }

    function randInt(min, max) {
        return Math.floor(rand(min, max + 1));
    }

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function createBurst(x, y) {
        const numParticles = randInt(100, 250);
        const particles = [];
        const hueBase = rand(160, 260); // Cool blues / cyans / purples
        const isWarmAnomaly = Math.random() < 0.1;
        let hueOffset;
        if (isWarmAnomaly) {
            hueOffset = rand(-40, 40); // Rare warm tint
        } else {
            hueOffset = rand(-15, 15);
        }

        for (let i = 0; i < numParticles; i++) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(0.2, 2.0);
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const hue = (hueBase + hueOffset + rand(-10, 10)) % 360;
            particles.push({
                x: x,
                y: y,
                vx: vx,
                vy: vy,
                life: 1.0,
                decay: rand(0.001, 0.006),
                size: rand(1, 3),
                hue: hue,
                hueShift: rand(-0.1, 0.1)
            });
        }
        bursts.push({ particles: particles, x: x, y: y, age: 0 });
    }

    function animate() {
        requestAnimationFrame(animate);

        // Clear main canvas
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(0, 0, width, height);

        // Update and draw bursts
        for (let i = bursts.length - 1; i >= 0; i--) {
            const burst = bursts[i];
            burst.age += 1;
            let allDead = true;

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let j = 0; j < burst.particles.length; j++) {
                const p = burst.particles[j];
                if (p.life <= 0) continue;
                allDead = false;

                // Apply curl-like noise path using sine wave perturbation
                const noiseFactor = 0.5;
                const curlX = Math.sin(burst.age * 0.05 + j * 0.1) * noiseFactor;
                const curlY = Math.cos(burst.age * 0.037 + j * 0.12) * noiseFactor;
                
                p.vx += curlX * 0.02;
                p.vy += curlY * 0.02;

                p.x += p.vx;
                p.y += p.vy;

                p.vx *= 0.97;
                p.vy *= 0.97;

                p.life -= p.decay;

                const alpha = Math.max(0, p.life * 0.8);
                const size = p.size * (0.5 + p.life * 0.5);
                const hue = p.hue + Math.sin(burst.age * 0.02) * p.hueShift;

                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
                ctx.fill();
            }

            ctx.restore();

            if (allDead) {
                // Store position of dead burst into fog layer
                addFog(burst.x, burst.y);
                bursts.splice(i, 1);
            }
        }

        // Draw ambient fog
        drawFog();

        if (bursts.length < NUM_BURSTS && Math.random() < 0.1) {
            createBurst(rand(0, width), rand(0, height));
        }
    }

    function addFog(x, y) {
        // Record fog origin point
        fogPoints.push({
            x: x,
            y: y,
            life: 1.0,
            decay: rand(0.0005, 0.002)
        });
    }

    const fogPoints = [];

    function drawFog() {
        fogCtx.fillStyle = 'rgba(0,0,0,0.15)';
        fogCtx.fillRect(0, 0, width, height);

        fogCtx.save();
        fogCtx.globalCompositeOperation = 'lighter';
        for (let i = fogPoints.length - 1; i >= 0; i--) {
            const f = fogPoints[i];
            f.life -= f.decay;
            if (f.life <= 0) {
                fogPoints.splice(i, 1);
                continue;
            }

            const grad = fogCtx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 100 * f.life);
            grad.addColorStop(0, `hsla(200, 70%, 70%, ${f.life * 0.4})`);
            grad.addColorStop(1, `hsla(200, 70%, 70%, 0)`);

            fogCtx.fillStyle = grad;
            fogCtx.beginPath();
            fogCtx.arc(f.x, f.y, 100 * f.life, 0, Math.PI * 2);
            fogCtx.fill();
        }
        fogCtx.restore();

        ctx.drawImage(fogCanvas, 0, 0);
    }

    animate();
})();
</script>
</body>
</html>
