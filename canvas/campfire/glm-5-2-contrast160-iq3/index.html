<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campfire Night</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#07080d;height:100}
canvas{display:block;width:100;height:100}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W,H,CX,GR,GRH;
const dpr=Math.min(window.devicePixelRatio||1,2);
function resize(){
  W=cv.width=innerWidth*dpr;
  H=cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+'px';
  cv.style.height=innerHeight+'px';
  CX=W/2;GR=H*0.55;GRH=H-GR;
}
resize();
addEventListener('resize',resize);

const RND=(a,b)=>a+Math.random()*(b-a);
const RNDI=(a,b)=>Math.floor(RND(a,b+1));
const CLAMP=(v,a,b)=>Math.max(a,Math.min(b,v));

let frame=0,time=0;
let logs=[],embers=[],pFire=[],pSmoke=[],pAmb=[],stars=[],metors=[],grass=[],trunks=[];
let fireX=0,fireY=0,fireLight=0;

function init(){
  fireX=CX;fireY=GR+GRH*0.5;
  fireLight=0;
  logs.length=0;embers.length=0;pFire.length=0;pSmoke.length=0;pAmb.length=0;
  metors.length=0;grass.length=0;trunks.length=0;stars.length=0;

  const stones=[
    {x:fireX-150,y:fireY+15,w:36,h:14,col:0.5},
    {x:fireX-80,y:fireY+10,w:42,h:16,col:0.5},
    {x:fireX+150,y:fireY+15,w:36,h:14,col:0.5},
    {x:fireX+80,y:fireY+10,w:42,h:16,col:0.5},
    {x:fireX-40,y:fireY+22,w:38,h:14,col:0.55},
    {x:fireX+40,y:fireY+22,w:38,h:14,col:0.55},
    {x:fireX-110,y:fireY+18,w:30,h:12,col:0.45},
    {x:fireX+110,y:fireY+18,w:30,h:12,col:0.45},
  ];
  for(let s of stones){
    const shade=CLAMP(0.2+Math.random()*0.35,0,1);
    s.col=`rgba(${RNDI(40,120)|0},${RNDI(40,120)|0},${RNDI(40,120)|0},${shade})`;
  }
  window.stonesData=stones;

  for(let i=0;i<150;i++)logs.push(makeLog());
  for(let i=0;i<150;i++)embers.push(makeEmber());
  for(let i=0;i<150;i())pFire.push(makeFire());
  for(let i=0;i<150;i++)pSmoke.push(makeSmoke());
  for(let i=0;i<150;i())pAmb.push(makeAmb());
  for(let i=0;i<150;i>())grass.push(makeBlade());

  for(let i=0;i<150;i())trunks.push({
    x:RND(0,1),y:RND(0,0.7),
    w:RND(70,90),h:RND(150,200),
    shade:RND(0.5,0.8)
  });

  for(let i=0;i<150;i())stars.push({
    x:Math.random()*W,y:Math.random()*H*0.55,
    r:Math.pow(Math.random(),2)*1.6+0.3,
    tw:Math.random()*Math.PI*2,
    sp:RND(0.005,0.03),
    bri:RND(0.4,1),
    col:`hsl(${RND(30,60)|0},70%,${RND(70,90)|0}%`,
  });
}

function makeLog(){
  const isL=RND()<0.5;
  return{
    x:fireX+RND(-100,100),
    y:fireY+RND(-20,40),
    angle:isL?RND(-0.45,0.45):RND(Math.PI-0.45,Math.PI+0.45),
    w:RND(120,180),h:RND(14,18),
    age:0,maxAge:RND(12,22),
    burn:0,
    dead:false,
    dark:RND(0.2,0.4),
    crk:0,crkX:0
  };
}
function makeEmber(){
  return{
    x:fireX+RND(-15,15),y:fireY-RND(20,40),
    z:RND(0.8,1.8),
    vx:RND(-1,1),vy:RND(-3.5,-6.5),
    life:1,maxLife:RND(2,4),
    col:`hsl(${RND(15,45)|0},100%,${RND(50,80)|0}%`,
    size:RND(1.5,3.5),
  };
}
function makeFire(){
  return{
    x:fireX+RND(-15,15),y:fireY-RND(20,40),
    vx:RND(-1,1),vy:RND(-3.5,-6.5),
    life:RND(2,6),maxLife:RND(2,6),
    size:RND(20,50),
    col:Math.random(),
    heat:Math.random(),
    phase:Math.random()*Math.PI*2,
    sp:RND(0.025,0.04)
  };
}
function makeSmoke(){
  return{
    x:fireX+RND(-20,20),y:fireY-RND(40,70),
    vx:RND(-1,1),vy:RND(0.5,3),
    life:RND(1.5,3),maxLife:RND(1.5,3),
    size:RND(20,40),
  };
}
function makeAmb(){
  const r=20+Math.random()*80;
  return{
    x:Math.cos(Math.random()*Math.PI*2)*r+fireX,
    y:Math.sin(Math.random()*Math.PI*2)*r*0.5+fireY,
    phase:Math.random()*Math.PI*2,
    sp:RND(0.05,0.15),
    size:RND(40,120),
    z:Math.random()
  };
}
function makeBlade(){
  const layer=Math.random();
  return{
    x:Math.random()*W,
    y:GR+layer*GRH,
    w:RND(1.5,4)*( (1-layer*0.5)+1 ),
    h:RND(5,15)*( (1-layer*0.4)+1 ),
    ph:Math.random()*Math.PI*2,
    sp:RND(0.5,2.5),
    layer,
    hue:RND(20,30)|0,
    sat:RND(50,75)|0,
    lit:CLAMP(5+Math.random()*15+layer*15,0,255)|0
  };
}
function makeMet(){
  const side=Math.random()<0.5;
  return{
    x:side?W*1.5:-100,
    y:Math.random()*H*0.4,
    vx:side?-15:15,
    vy:RND(5,8),
    life:1,maxLife:RND(0.8,1.5),
    trail:RND(80,200),
  };
}

init();
addEventListener('resize',init);

function updateFire(){
  fireLight=0;
  for(let p of pFire){
    p.phase+=p.sp;
    p.vy*=0.985;
    p.vx*=0.985;
    p.vy-=0.05;
    const wx=Math.sin(p.phase*7)*0.4;
    p.x+=p.vx+wx;
    p.y+=p.vy;
    p.life-=1/60;
    p.size*=0.997;
    if(p.y<fireY-50)fireLight+=p.size*0.001;
    if(p.life<0){
      const np=makeFire();
      p.x=fireX+np.x-fireX;
      p.y=np.y
      Object.assign(p,np);
    }
  }
  fireLight*=0.7;
  if(pFire.length>150){
    pFire.splice(150,pFire.length-150);
  }

  for(let i=pFire.length-1;i>=0;i--){
    if(pFire[i].life<0)pFire.splice(i,1);
  }
  while(pFire.length<150)pFire.push(makeFire());

  for(let i=embers.length-1;i>=0;i--){
    const e=embers[i];
    e.x+=e.vx;
    e.y+=e.vy;
    e.vy*=0.98;e.vx*=0.99;
    e.vy+=0.05;
    e.vx+=Math.sin(e.phase)*0.02;
    e.phase+=0.2;
    e.life-=1/60;
    if(e.life<0)embers.splice(i,1);
  }
  while(embers.length<150)embers.push(makeEmber());

  for(let i=pSmoke.length-1;i>=0;i--){
    const p=pSmoke[i];
    p.x+=p.vx+Math.sin(p.phase)*0.2;
    p.y+=p.vy;
    p.phase+=0.03;
    p.life-=1/60;
    if(p.life<0)pSmoke.splice(i,1);
  }
  while(pSmoke.length<150)pSmoke.push(makeSmoke());

  for(let i=pAmb.length-1;i>=0;i--){
    const p=pAmb[i];
    p.phase+=p.sp;
    const dx=fireX-p.x,dy=fireY-p.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const ang=Math.atan2(dy,dx)+Math.sin(p.phase)*0.2;
    const radius=20+p.size*0.6;
    p.x=fireX+Math.cos(ang)*radius;
    p.y=fireY+Math.sin(ang)*radius*0.5;
  }

  for(let s of stars)s.tw+=s.sp;

  for(let i=metors.length-1;i>=0;i--){
    const m=metors[i];
    m.x+=m.vx*4
    m.y+=m.vy*4;
    m.life-=1/60;
    if(m.life<0)metors.splice(i,1);
  }
  if(Math.random()<0.006&&metors.length<3)metors.push(makeMet());

  for(let i=logs.length-1;i>=0;i--){
    const l=logs[i];
    if(l.dead){
      l.crk+=1/60;
      l.crkX+=0.3;
      if(l.crk>1.5){
        const fresh=makeLog();
        Object.assign(l,fresh);
        l.x=fireX+RND(-100,100);
      }
      continue;
    }
    l.age+=1/60;
    l.burn=Math.min(1,l.age/8);
    if(l.age>l.maxAge){
      l.dead=true;
      l.crk=0;l.crkX=0;
    }
  }
  while(logs.length<150){
    const fresh=makeLog();
    fresh.age=RND(0,l.maxAge-4);
    logs.push(fresh);
  }

  for(let g of grass)g.ph+=g.sp/60;
}

function drawScene(){
  // SKY
  const skyGrad=ctx.createLinearGradient(0,0,0,fireY+50);
  skyGrad.addColorStop(0,'#0a0a14');
  skyGrad.addColorStop(0.4,'#15181f');
  skyGrad.addColorStop(1,'#1a1616');
  ctx.fillStyle=skyGrad;
  ctx.fillRect(0,0,W,fireY+50);

  // Stars
  ctx.globalComposite='lighter';
  for(let s of stars){
    const tw=0.5+Math.sin(s.tw)*0.5;
    const a=s.bri*tw;
    ctx.fillStyle=s.col.replace('hsl','hsl').replace('%',`%,${a.toFixed(2)})`;
    ctx.fillStyle=s.col;
    ctx.globalAlpha=a;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
    if(s.r>1.5){
      ctx.globalAlpha=a*0.3;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r*3,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  ctx.globalComposite='source-over';

  // Metors
  for(let m of metors){
    ctx.save();
    ctx.globalComposite='lighter';
    const len=Math.min(m.trail,150);
    const tx=m.x-m.vx*len*0.5,ty=m.y-m.vy*len*0.5;
    const tg=ctx.createLinearGradient(m.x,m.y,tx,ty);
    tg.addColorStop(0,'rgba(255,240,200,1)');
    tg.addColorStop(1,'rgba(255,40,20,0)');
    ctx.strokeStyle=tg;
    ctx.lineWidth=3;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(tx,ty);
    ctx.lineTo(m.x,m.y);
    ctx.stroke();

    ctx.fillStyle='rgba(255,250,200,1)';
    ctx.beginPath();
    ctx.arc(m.x,m.y,2.5,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Tree trunks
  const trkArr=[...trunks].sort((a,b)=>b.y-a.y);
  for(let t of trkArr){
    const baseX=t.x*W;
    const baseY=fireY+t.y*GR*0.4;
    const w=t.w,h=t.h;
    const lit=Math.max(0,1-Mt.dist(baseX,baseY,fireX,fireY)/(fireY*0.6+200))*0.7+0.3;
    const jitter=Math.sin(time*0.5)*2*(0.5+fireLight*0.5);
    ctx.save();
    ctx.translate(baseX+jitter,baseY);
    ctx.fillStyle=`rgba(${10+lit*15|0},${10+lit*15|0},${10+lit*15|0},${t.shade})`;
    ctx.fillRect(-w/2,-h,w,h);
    // Bark texture
    ctx.fillStyle=`rgba(${30+lit*40|0},${30+lit*40|0},${30+lit*40|0},0.4)`;
    ctx.fillRect(-w/2,h*0.2,w,5);
    ctx.fillRect(-w/2,h*0.5,w,3);
    ctx.fillStyle=`rgba(0,0,0,${t.shade})`;
    ctx.beginPath();
    ctx.arc(-w*0.3,0,3,0,Math.PI*2);
    ctx.arc(w*0.3,-h*0.6,2,0,Math.PI*2);
    ctx.fill();
    // Edge highlight from fire
    ctx.fillStyle=`rgba(${255+lit*0},${50+lit*30},${20+lit*30},${lit*0.8)`;
    ctx.fillRect(-w*0.2,-h,w*0.6,1);
    ctx.restore();
  }

  // Grass area
  ctx.save();
  // Background grass fill
  const gg=ctx.createLinearGradient(0,fireY-50,0,fireY+30);
  gg.addColorStop(0,'rgba(8,20,12,1)');
  gg.addColorStop(1,'rgba(5,12,10,1)');
  ctx.fillStyle=gg;
  ctx.fillRect(0,fireY-50,W,fireY+50);

  // Grass blades
  for(let g of grass){
    const x=g.x,y=g.y;
    const dxToFire=1-Mt.dist(x,y,fireX,fireY)/(350+fireLight*100);
    const lit=Math.max(0,dxToFire)*0.5;
    const sway=Math.sin(g.ph)*g.sp*0.3;
    const r=g.hue,g.s=g.sat,g.l=g.lit;
    ctx.fillStyle=`hsl(${r},${s}% ${g.l}%`;
    ctx.fillStyle=`hsl(${g.hue},${g.sat}% ${g.l}%`;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(sway*0.05);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(g.w*0.5,-g.h*0.5,g.w,Math.sin(g.ph+1.5)*0.5,g.w,-g.h*0.5);
    ctx.lineTo(0,-g.h);
    ctx.fill();
    // Firelight highlight
    if(lit>0){
      ctx.fillStyle=`rgba(${255+lit*0},${30+lit*40},${20+lit*40},${lit)`;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(g.w*0.5,-g.h*0.5,g.w,Math.sin(g.ph+1.5)*0.5,g.w,-g.h*0.5);
      ctx.lineTo(0,-g.h);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();

  // Stones
  if(window.stonesData){
    for(let s of window.stonesData){
      const dx=Math.abs(s.x-fireX),dy=s.y-fireY;
      const lit=Math.max(0,1-(dx+dy*0)/350)*(      0.5+fireLight*0.5
      );
      ctx.fillStyle=s.col;
      ctx.beginPath();
      ctx.ellipse(s.x,s.y,s.w,s.h,0,0,Math.PI*2);
      ctx.fill();
      // Firelit top
      ctx.fillStyle=`rgba(${
        50+lit*40},${50+lit*30},${30+lit*40},${lit)`;
      ctx.beginPath();
      ctx.ellipse(s.x,s.y-s.h*0.3,s.w*0.8,s.h*0.3,0,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Logs
  ctx.save();
  ctx.globalComposite='lighter';
  for(let p of pFire){
    const t=(1-p.life/p.maxLife);
    const sz=p.size*(1-t*0.5);
    const alpha=CLAMP(p.life/p.maxLife,0,1)*0.5;
    ctx.fillStyle=`rgba(${
      255},${255},${${Math.floor(60+t*40)
    }},${alpha)`;
    ctx.fillStyle=`hsl(${30-t*30|0},100%,${50+t*30}%`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,sz,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  // Embers
  ctx.save();
  ctx.globalComposite='lighter';
  for(let e of embers){
    ctx.fillStyle=e.col;
    ctx.globalAlpha=e.life/e.maxLife;
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.size*4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,150,40,0.04)';
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // Logs
  for(let l of logs){
    const baseCol=l.dark*(1-l.burn*0.5);
    const r=(255*l.burn+baseCol*255)|0;
    const g=(20+l.burn*120+(1-l.burn)*30)|0;
    const b=(10+l.burn*40)|0;
    ctx.save();
    ctx.translate(l.x,l.y+(l.crk*20));
    ctx.rotate(l.angle+Math.sin(l.crk*3)*l.crk*0.5);
    // Char base
    ctx.fillStyle=`rgb(${Math.floor(r*baseCol)},${Math.floor(g*baseCol)},${Math.floor(b*baseCol)}`;
    ctx.beginPath();
    ctx.moveTo(-l.w/2,-l.h/2);
    ctx.lineTo(l.w/2,-l.h/2);
    ctx.lineTo(l.w/2,l.h/2);
    ctx.lineTo(-l.w/2,l.h/2);
    ctx.fill();
    // Char edge glow
    ctx.fillStyle=`rgba(${
      255*l.burn|0},${50*l.burn+30|0},${10*l.burn+20},${l.burn*0.8}`;
    ctx.fillRect(-l.w/2*0.9,-l.h/2-1,l.w*0.9,1);
    // Cracks
    for(let i=0;i<5;i++){
      const x=-l.w/2+(i+0.5)*l.w/5+RND(-5,5);
      ctx.fillStyle=`rgba(${
        0,0,0,${l.burn*0.6)}`;
      ctx.fillRect(x,-l.h/2*0.8,RND(0.5,1.5),l.h*0.5);
    }
    ctx.restore();
  }

  // Foreground vignette
  ctx.save();
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.6);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Firelight overlay
  ctx.save();
  ctx.globalComposite='overlay';
  const flRad=150+fireLight*200;
  const flGrad=ctx.createRadialGradient(fireX,fireY,0,fireX,fireY,flRad);
  flGrad.addColorStop(0,`rgba(255,140,40,${
    (0.4+fireLight*0.4).toFixed(3)
  })`);
  flGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=flGrad;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
  ctx.save();
  ctx.globalComposite='soft-light';
  const flGrad2=ctx.createRadialGradient(fireX,fireY,0,fireX,fireY,flRad*0.5);
  flGrad2.addColorStop(0,`rgba(255,210,150,${
    (0.3*fireLight+0.5).toFixed(3)
  })`);
  flGrad2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=flGrad2;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

const Mt={dist:(x1,y1,x2,y2)=>Math.sqrt((x1-x2)**2+(y1-y2)**2)};

function loop(t){
  ctx.clearRect(0,0,W,H);
  updateFire();
  drawScene();
  frame++;
  time=frame/60;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
