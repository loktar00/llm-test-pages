<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Painting Oil Canvas</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Procedural Generation Helpers ---

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function lerpColor(c1, c2, t) {
            const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
            const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
            const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
            return `rgb(${r},${g},${b})`;
        }

        // Generate a theme palette
        function generatePalette() {
            const palettes = [
                { name: "Sunset", sky: [[135, 188, 255], [255, 165, 0]], ground: [[34, 83, 34], [101, 67, 33]] },
                { name: "Storm", sky: [[50, 50, 60], [100, 110, 120]], ground: [[20, 30, 20], [40, 40, 30]] },
                { name: "Pastel", sky: [[200, 220, 255], [255, 200, 220]], ground: [[150, 200, 150], [200, 180, 100]] },
                { name: "Midnight", sky: [[10, 10, 40], [40, 20, 80]], ground: [[15, 20, 15], [5, 10, 5]] }
            ];
            return palettes[Math.floor(Math.random() * palettes.length)];
        }

        // --- Texture Generation (Bristles & Impasto) ---

        // We create offscreen canvases to act as "texture stamps"
        const bristleTextures = [];
        const IMPASTO_SCALE = 100;

        function createBristleTexture() {
            const c = document.createElement('canvas');
            c.width = 60;
            c.height = IMPASTO_SCALE;
            const cx = c.getContext('2d');

            // Base layer with noise for impasto
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            for(let i=0; i<400; i++) {
                const x = Math.random() * c.width;
                const y = Math.random() * c.height;
                const s = Math.random() * 3;
                cx.fillRect(x, y, s, s);
            }

            // Vertical bristles
            for (let i = 0; i < 12; i++) {
                cx.beginPath();
                cx.strokeStyle = 'rgba(255,255,255,0.15)';
                cx.lineWidth = 1 + Math.random() * 2;
                const x = Math.random() * c.width;
                cx.moveTo(x, 0);
                cx.lineTo(x + randomRange(-5, 5), c.height);
                cx.stroke();
            }
            
            // Horizontal bristles (interlocking)
            for (let i = 0; i < 8; i++) {
                cx.beginPath();
                cx.strokeStyle = 'rgba(0,0,0,0.1)';
                cx.lineWidth = 0.5;
                const y = Math.random() * c.height;
                cx.moveTo(0, y);
                cx.lineTo(c.width, y + randomRange(-3, 3));
                cx.stroke();
            }

            return c;
        }

        // Generate a few variations of brush textures
        for(let i=0; i<3; i++) bristleTextures.push(createBristleTexture());

        function applyTexture(ctx, x, y, w, h, color) {
            // Create a temporary canvas for the stroke cell
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tCtx = tempCanvas.getContext('2d');

            // 1. Fill base color
            tCtx.fillStyle = color;
            tCtx.fillRect(0, 0, w, h);

            // 2. Apply texture (Multiplicative blend logic via drawImage)
            // To make it look like oil paint, we need light/dark edges (impasto)
            // We use the generated texture as a mask
            
            // Draw texture 1
            tCtx.globalCompositeOperation = 'source-over';
            const tex = bristleTextures[Math.floor(Math.random() * bristleTextures.length)];
            tCtx.drawImage(tex, 0, 0, w, h);

            // Draw texture 1 inverted for depth
            tCtx.save();
            tCtx.scale(1, -1);
            tCtx.drawImage(tex, 0, -h, w, h);
            tCtx.restore();

            // 3. Add "fresnel" edge highlight to simulate bristle pressure
            // A gradient mask to lighten the outer bristles
            const grad = tCtx.createRadialGradient(w/2, h/2, h/3, w/2, h/2, w);
            grad.addColorStop(0, 'rgba(255,255,255,0)');
            grad.addColorStop(1, 'rgba(255,255,255,0.3)');
            tCtx.globalCompositeOperation = 'overlay';
            tCtx.fillStyle = grad;
            tCtx.fillRect(0, 0, w, h);

            // Draw onto main canvas
            ctx.drawImage(tempCanvas, x, y);
        }

        // --- Painting Logic ---

        let isPainting = true;
        let animationId;
        let currentStroke = 0;
        let totalStrokes = 0;
        
        let scene = {};

        function initScene() {
            isPainting = true;
            currentStroke = 0;
            
            // Procedural Generation
            const palette = generatePalette();
            const horizonY = height * randomRange(0.4, 0.6);
            
            // Generate Clouds
            const clouds = [];
            const numClouds = Math.floor(randomRange(3, 8));
            for(let i=0; i<numClouds; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (horizonY * 0.8),
                    w: randomRange(100, 400),
                    h: randomRange(30, 80)
                });
            }

            // Generate Hills
            const hills = [];
            const numHills = Math.floor(randomRange(2, 5));
            for(let i=0; i<numHills; i++) {
                hills.push({
                    x: randomRange(-100, width),
                    y: horizonY + randomRange(-50, 100),
                    w: width * randomRange(1.2, 2.0),
                    h: randomRange(50, 200)
                });
            }

            // Generate Grass Tufts
            const grass = [];
            const numGrass = Math.floor(width * height / 3000); // Density
            for(let i=0; i<numGrass; i++) {
                grass.push({
                    x: Math.random() * width,
                    y: horizonY + Math.random() * (height - horizonY),
                    len: randomRange(10, 40),
                    angle: randomRange(-0.3, 0.3)
                });
            }

            // Generate Flowers
            const flowers = [];
            const numFlowers = Math.floor(randomRange(5, 15));
            for(let i=0; i<numFlowers; i++) {
                flowers.push({
                    x: Math.random() * width,
                    y: horizonY + randomRange(20, height - horizonY - 20),
                    color: `hsl(${randomRange(0, 360)}, 70%, 60%)`,
                    size: randomRange(4, 10)
                });
            }

            scene = {
                palette,
                horizonY,
                clouds,
                hills,
                grass,
                flowers,
                skyColorTop: palette.sky[0],
                skyColorBot: palette.sky[1],
                groundColor1: palette.ground[0],
                groundColor2: palette.ground[1]
            };

            // Plan the strokes
            planStrokes();
        }

        let strokeQueue = [];

        function planStrokes() {
            strokeQueue = [];
            const { horizonY, clouds, hills, grass, flowers } = scene;

            // PASS 1: Underpainting (Rough washes)
            
            // Sky gradient washes
            const skySteps = 8;
            for (let i = 0; i < skySteps; i++) {
                const y = (horizonY / skySteps) * i;
                const h = horizonY / skySteps;
                const col = lerpColor(scene.skyColorTop, scene.skyColorBot, i/skySteps);
                // Slight overlap for blending feel
                strokeQueue.push({ type: 'sky', y: y, h: h + 10, color: col, size: 40 });
            }

            // Ground washes
            const groundSteps = 6;
            for (let i = 0; i < groundSteps; i++) {
                const y = horizonY + ((height - horizonY) / groundSteps) * i;
                const h = (height - horizonY) / groundSteps;
                const col = lerpColor(scene.groundColor1, scene.groundColor2, i/groundSteps);
                strokeQueue.push({ type: 'ground', y: y, h: h + 10, color: col, size: 50 });
            }

            // Clouds blob
            clouds.forEach(c => {
                strokeQueue.push({ type: 'cloud', x: c.x, y: c.y, w: c.w, h: c.h, color: '#fff', size: 60 });
            });

            // Hills blobs
            hills.forEach(h => {
                strokeQueue.push({ type: 'hill', x: h.x, y: h.y, w: h.w, h: h.h, color: '#333', size: 70 });
            });

            // PASS 2: Refinement (Textured strokes)

            // Sky Strokes (Horizontal)
            for(let i=0; i<40; i++) {
                const y = Math.random() * horizonY;
                const x = Math.random() * width;
                const w = randomRange(100, 300);
                const col = lerpColor(scene.skyColorTop, scene.skyColorBot, y/horizonY);
                strokeQueue.push({ type: 'refine_sky', x, y, w, h: 20 + Math.random()*20, color: col, size: 30 });
            }

            // Ground Strokes (Vertical/Downward)
            for(let i=0; i<100; i++) {
                const x = Math.random() * width;
                const y = horizonY + Math.random() * (height - horizonY);
                const h = randomRange(40, 150);
                const col = lerpColor(scene.groundColor1, scene.groundColor2, (y-horizonY)/(height-horizonY));
                strokeQueue.push({ type: 'refine_ground', x, y, w: 15 + Math.random()*15, h, color: col, size: 25 });
            }

            // Grass Strokes (Vertical tufts)
            grass.forEach(g => {
                // Just paint a texture patch at the location
                strokeQueue.push({ type: 'grass_patch', x: g.x, y: g.y, w: 15, h: g.len, color: scene.groundColor1, size: 15 });
            });

            // PASS 3: Highlights & Details

            // Cloud Highlights
            clouds.forEach(c => {
                strokeQueue.push({ type: 'highlight_cloud', x: c.x + c.w/2, y: c.y, w: c.w*0.8, h: c.h*0.3, color: 'rgba(255,255,255,0.4)', size: 20 });
            });

            // Flowers
            flowers.forEach(f => {
                strokeQueue.push({ type: 'flower', x: f.x, y: f.y, w: f.size, h: f.size, color: f.color, size: 10 });
            });
            
            // Sparkles/Glints
            for(let i=0; i<30; i++) {
                 const x = Math.random() * width;
                 const y = Math.random() * height;
                 strokeQueue.push({ type: 'glint', x, y, w: 2, h: 2, color: '#fff', size: 5 });
            }

            // Signature
            strokeQueue.push({ type: 'signature', x: width - 150, y: height - 50, color: '#111', size: 0 });

            totalStrokes = strokeQueue.length;
            currentStroke = 0;
        }

        function drawStroke(stroke) {
            const { type, x, y, w, h, color, size } = stroke;
            
            // Apply a global rotation for organic feel
            const angle = randomRange(-0.1, 0.1);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            if (type === 'sky') {
                // Large horizontal washes
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
                // Apply texture
                ctx.globalAlpha = 0.6;
                applyTexture(ctx, 0, 0, w, h, 'transparent');
            } 
            else if (type === 'ground') {
                // Large vertical washes
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
                ctx.globalAlpha = 0.6;
                applyTexture(ctx, 0, 0, w, h, 'transparent');
            }
            else if (type === 'cloud') {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
                ctx.globalAlpha = 0.5;
                applyTexture(ctx, 0, 0, w, h, 'transparent');
                ctx.globalAlpha = 1.0;
            }
            else if (type === 'hill') {
                // Draw a blob
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(w, 0, w, -h, 0, -h);
                ctx.fill();
                ctx.globalAlpha = 0.5;
                applyTexture(ctx, 0, -h/2, w, h, 'transparent');
                ctx.globalAlpha = 1.0;
            }
            else if (type === 'refine_sky') {
                // Horizontal bristle stroke
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
                // Rotate texture horizontally
                ctx.save();
                ctx.rotate(Math.PI / 2);
                ctx.translate(0, -h);
                applyTexture(ctx, 0, 0, h, w, 'transparent');
                ctx.restore();
            }
            else if (type === 'refine_ground') {
                // Vertical bristle stroke
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
                applyTexture(ctx, 0, 0, w, h, 'transparent');
            }
            else if (type === 'grass_patch') {
                // Vertical strokes
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
                ctx.save();
                ctx.rotate(Math.PI / 2);
                ctx.translate(0, -h);
                applyTexture(ctx, 0, 0, h, w, 'transparent');
                ctx.restore();
            }
            else if (type === 'highlight_cloud') {
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
            }
            else if (type === 'flower') {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, w, h);
            }
            else if (type === 'glint') {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, randomRange(1,3), 0, Math.PI*2);
                ctx.fill();
            }
            else if (type === 'signature') {
                ctx.fillStyle = color;
                ctx.font = "20px serif";
                ctx.fillText("Art by AI", 0, 0);
            }

            ctx.restore();
        }

        // Animation Loop
        function loop() {
            if (!isPainting) return;

            // Draw a batch of strokes per frame for speed
            // Speed increases slightly as we go
            const speed = 3 + Math.floor(currentStroke / 10);

            for (let i = 0; i < speed; i++) {
                if (currentStroke < totalStrokes) {
                    drawStroke(strokeQueue[currentStroke]);
                    currentStroke++;
                }
            }

            if (currentStroke >= totalStrokes) {
                // Painting finished, wait then restart
                isPainting = false;
                
                // Draw Signature flourish explicitly if not done
                const last = strokeQueue[strokeQueue.length-1];
                if(last.type === 'signature') drawStroke(last);

                setTimeout(() => {
                    // Fade out transition
                    ctx.fillStyle = '#000';
                    let op = 0;
                    const fadeOut = setInterval(() => {
                        ctx.globalAlpha = op;
                        ctx.fillRect(0, 0, width, height);
                        op += 0.05;
                        if(op >= 1) {
                            clearInterval(fadeOut);
                            ctx.globalAlpha = 1;
                            ctx.fillStyle = '#1a1a1a'; // Clear background color
                            ctx.fillRect(0,0,width,height);
                            initScene();
                        }
                    }, 50);
                }, 1000);
            }

            animationId = requestAnimationFrame(loop);
        }

        // Start
        initScene();
        loop();

    </script>
</body>
</html>
