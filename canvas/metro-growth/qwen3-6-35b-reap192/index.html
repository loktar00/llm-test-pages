<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Metro Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="metroCanvas"></canvas>
<script>
/**
 * PROCEDURAL METRO MAP GENERATOR & ANIMATION
 * 
 * Algorithm:
 * 1. Seed a central station.
 * 2. Grow lines by selecting the last station and extending it in 45-degree increments.
 * 3. Attempt to connect to existing stations (interchanges).
 * 4. Stop line if path blocked or length limit reached.
 * 5. Animate drawing, then spawn trains.
 * 6. Cycle through phases (Fade -> Clear -> New City).
 */

const canvas = document.getElementById('metroCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let lines = [];
let stations = {}; // Map key "x,y" -> Station Object
let globalStationIdCounter = 0;

// Configuration
const CONFIG = {
    gridSize: 40,       // Snap distance for routing
    minLineLength: 5,   // Minimum stations per line
    maxLineLength: 25,  // Maximum stations per line
    maxLines: 10,       // Lines
