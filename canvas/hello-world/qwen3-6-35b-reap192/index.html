<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELLO WORLD Particles</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); repositionText(); });

// Generate target positions from text
let textPositions = [];
const OFFSCREEN = document.createElement('canvas');
const offCtx = OFFSCREEN.getContext('2d');

function getTextColor() {
    const hue = (performance.now() / 50) % 360;
    return `hsl(${hue}, 100%, 70%)`;
}

function repositionText() {
    textPositions = [];
    const words = ['HELLO', 'WORLD!'];
    const maxFontSize = Math.min(W / 4, H / 3);
    const fontSize = Math.min(maxFontSize, 200);
    
    OFFSCREEN.width = W;
    OFFSCREEN.height = H;
    offCtx.fillStyle = '#000';
    offCtx.fillRect(0, 0, W, H);
    
    const currentWord = words[0];
    offCtx.font = `900 ${fontSize}px "Arial Black", Impact, sans-serif`;
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.fillStyle = '#fff';
    offCtx.fillText(currentWord, W / 2, H / 2);
    
    const imageData = offCtx.getImageData(0, 0, W, H);
    const pixels = imageData.data;
    
    const step = Math.max(3, Math.floor(fontSize / 60));
    for (let y = 0; y < H; y += step) {
        for (let x = 0; x < W; x += step) {
            const i = (y * W + x) * 4;
            if (pixels[i + 3] > 128) {
                textPositions.push({ x, y });
            }
        }
    }
}

repositionText();

// Create particles
const NUM_PARTICLES = Math.min(textPositions.length, 4000);
const particles = [];
const words = ['HELLO', 'WORLD!'];
let currentWordIndex = 0;
let state = 'entering'; // 'entering', 'drifting', 'exploding'
let stateTimer = 0;
const WORD_DURATION = 5000;
const EXPLODE_DURATION = 600;
let explodeProgress = 0;

// Assign particles to target positions
function assignTargets() {
    const targets = textPositions.slice(0, NUM_PARTICLES);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = particles[i];
        const target = targets[i % targets.length];
        p.targetX = target.x;
        p.targetY = target.y;
        p.driftAngle = Math.random() * Math.PI * 2;
        p.driftSpeed = 0.3 + Math.random() * 0.7;
        p.driftRadius = 1.5 + Math.random() * 3;
        p.currentHue = Math.random() * 360;
    }
}

for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        targetX: 0,
        targetY: 0,
        driftAngle: Math.random() * Math.PI * 2,
        driftSpeed: 0,
        driftRadius: 0,
        size: 1 + Math.random() * 2,
        currentHue: Math.random() * 360,
        alpha: 0.5 + Math.random() * 0.5,
        explodeVx: 0,
        explodeVy: 0,
        easeX: 0,
        easeY: 0,
        settled: false
    });
}

assignTargets();

// Explosion
function triggerExplosion() {
    state = 'exploding';
    stateTimer = 0;
    explodeProgress = 0;
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 300 + Math.random() * 800;
        particles[i].explodeVx = Math.cos(angle) * speed;
        particles[i].explodeVy = Math.sin(angle) * speed;
        particles[i].settled = false;
    }
}

// Transition to next word
function transitionToNextWord() {
    currentWordIndex = (currentWordIndex + 1) % words.length;
    repositionText();
    assignTargets();
    
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = particles[i];
        const angle = Math.random() * Math.PI * 2;
        const speed = 200 + Math.random() * 400;
        p.explodeVx = Math.cos(angle) * speed;
        p.explodeVy = Math.sin(angle) * speed;
        p.settled = false;
    }
    state = 'exploding';
    stateTimer = 0;
    explodeProgress = 0;
}

// Drawing optimized
function drawParticle(ctx, p, t) {
    const hue = (p.currentHue + t * 0.02) % 360;
    const lightness = 60 + Math.sin(t * 0.003 + p.driftAngle) * 15;
    const glow = p.size * 3;
    
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${p.alpha})`;
    ctx.fill();
    
    // Glow
    if (p.size > 1.2) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, glow, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${p.alpha * 0.15})`;
        ctx.fill();
    }
}

let lastTime = performance.now();
let accumTime = 0;

function animate(now) {
    requestAnimationFrame(animate);
    
    const dt = Math.min(now - lastTime, 33.33);
    lastTime = now;
    accumTime += dt;
    
    // Clear with slight fade for trails
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(0, 0, W, H);
    
    stateTimer += dt;
    explodeProgress = Math.min(stateTimer / EXPLODE_DURATION, 1);
    
    const t = now;
    
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = particles[i];
        
        if (state === 'exploding') {
            // Explosion physics
            const ease = 1 - explodeProgress;
            const ease3 = ease * ease * ease;
            
            p.x += p.explodeVx * dt * 0.001 * (1 + (1 - explodeProgress) * 2);
            p.y += p.explodeVy * dt * 0.001 * (1 + (1 - explodeProgress) * 2);
            
            // Friction
            p.explodeVx *= 0.98;
            p.explodeVy *= 0.98;
            
            // Guide toward target
            if (explodeProgress > 0.3) {
                const guideStrength = (explodeProgress - 0.3) / 0.7;
                const dx = p.targetX - p.x;
                const dy = p.targetY - p.y;
                p.x += dx * guideStrength * 0.05;
                p.y += dy * guideStrength * 0.05;
            }
            
            if (explodeProgress >= 1) {
                state = 'drifting';
                stateTimer = 0;
            }
        } else if (state === 'drifting') {
            // Gentle drift around target
            p.driftAngle += p.driftSpeed * dt * 0.001;
            const targetDriftX = p.targetX + Math.cos(p.driftAngle) * p.driftRadius;
            const targetDriftY = p.targetY + Math.sin(p.driftAngle * 0.7) * p.driftRadius;
            
            p.x += (targetDriftX - p.x) * 0.03;
            p.y += (targetDriftY - p.y) * 0.03;
            
            p.settled = true;
            
            // Word transition
            if (stateTimer > WORD_DURATION) {
                transitionToNextWord();
            }
        }
        
        // Draw
        drawParticle(ctx, p, t);
    }
    
    // Draw connecting lines for nearby particles (limited for performance)
    if (state === 'drifting') {
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < NUM_PARTICLES; i += 3) {
            const p = particles[i];
            if (!p.settled) continue;
            // Check a few neighbors
            for (let j = i + 1; j < Math.min(i + 5, NUM_PARTICLES); j += 2) {
                const p2 = particles[j];
                if (!p2.settled) continue;
                const dx = p.x - p2.x;
                const dy = p.y - p2.y;
                const dist = dx * dx + dy * dy;
                if (dist < 2500) {
                    const alpha = (1 - dist / 2500) * 0.08;
                    const hue = (p.currentHue + p2.currentHue) / 2;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        ctx.globalCompositeOperation = 'source-over';
    }
}

requestAnimationFrame(animate);
</script>
</body>
</html>
