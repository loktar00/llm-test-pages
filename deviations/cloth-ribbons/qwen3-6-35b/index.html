<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowing Cloth Ribbons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NUM_RIBBONS = 5;
const SEGMENTS_PER_RIBBON = 60;
const RIBBON_WIDTH = 38;
const GRAVITY = 0.15;
const DAMPING = 0.985;
const CONSTRAINT_ITERATIONS = 8;

const ribbonConfigs = [
  { hue: 200, sat: 70, light: 45, lightDir: 0.8, phaseOff: 0 },
  { hue: 280, sat: 60, light: 50, lightDir: 0.6, phaseOff: 1.2 },
  { hue: 340, sat: 65, light: 48, lightDir: 0.9, phaseOff: 2.4 },
  { hue: 160, sat: 55, light: 42, lightDir: 0.7, phaseOff: 3.6 },
  { hue: 30,  sat: 75, light: 52, lightDir: 1.0, phaseOff: 4.8 },
];

class Segment {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.oldX = x;
    this.oldY = y;
  }
}

class Ribbon {
  constructor(index) {
    const cfg = ribbonConfigs[index];
    this.cfg = cfg;
    this.segments = [];
    this.numSeg = SEGMENTS_PER_RIBBON;
    const spacing = H / (this.numSeg - 1);
    const baseX = (W * 0.12) + (index * (W * 0.8 / (NUM_RIBBONS - 1)));

    for (let i = 0; i < this.numSeg; i++) {
      const seg = new Segment(baseX, i * spacing);
      this.segments.push(seg);
    }
  }

  applyWind(time, dt) {
    const cfg = this.cfg;
    const t = time * 0.0004;

    for (let i = 0; i < this.numSeg; i++) {
      const seg = this.segments[i];
      const normalizedY = i / (this.numSeg - 1);

      // Base wind - gentle sway
      const baseWind = Math.sin(t * 1.2 + normalizedY * 2.5 + cfg.phaseOff) * 0.8;

      // Slow gust wave
      const gustPhase = Math.sin(t * 0.3 + normalizedY * 0.8 + cfg.phaseOff * 0.5);
      const gustStrength = Math.pow(Math.max(0, gustPhase), 3) * 3.5;

      // Secondary ripple wave
      const ripple = Math.sin(t * 2.0 - normalizedY * 4.0 + cfg.phaseOff * 1.5) * 0.4;

      // Gust propagation - delay based on height
      const gustDelay = Math.sin(t * 0.5 + normalizedY * 1.5);
      const gust = Math.pow(Math.max(0, gustDelay), 2) * 4.0;

      const totalWind = baseWind + gustStrength + ripple + gust;

      // Wind affects current position directly (force-like)
      const windForceX = totalWind * (1.0 - normalizedY * 0.3);

      seg.x += windForceX * dt;
      seg.y += Math.sin(t + normalizedY * 3.0) * 0.05 * (1.0 - normalizedY);
    }
  }

  constrain() {
    // Anchor top
    const anchor = this.segments[0];
    anchor.oldX = anchor.x;
    anchor.oldY = anchor.y;

    // Distance constraints
    const spacing = H / (this.numSeg - 1);
    for (let iter = 0; iter < CONSTRAINT_ITERATIONS; iter++) {
      for (let i = 1; i < this.numSeg; i++) {
        const curr = this.segments[i];
        const prev = this.segments[i - 1];

        const dx = curr.x - prev.x;
        const dy = curr.y - prev.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const diff = (dist - spacing) / dist;

        const offsetX = dx * diff * 0.5;
        const offsetY = dy * diff * 0.5;

        curr.x += offsetX;
        curr.y += offsetY;
        prev.x -= offsetX;
        prev.y -= offsetY;
      }
    }

    // Apply velocity damping via Verlet
    for (let i = 1; i < this.numSeg; i++) {
      const seg = this.segments[i];
      const vx = (seg.x - seg.oldX) * DAMPING;
      const vy = (seg.y - seg.oldY) * DAMPING;
      seg.oldX = seg.x - vx;
      seg.oldY = seg.y - vy;
    }
  }

  updatePositions() {
    for (let i = 1; i < this.numSeg; i++) {
      const seg = this.segments[i];
      const vx = seg.x - seg.oldX;
      const vy = seg.y - seg.oldY;
      seg.oldX = seg.x;
      seg.oldY = seg.y;
      seg.x += vx;
      seg.y += vy;
    }
  }

  draw(ctx, time) {
    const cfg = this.cfg;
    const lightAngle = cfg.lightDir;

    // Build left and right edge points
    const leftEdge = [];
    const rightEdge = [];

    for (let i = 0; i < this.numSeg; i++) {
      const seg = this.segments[i];

      let nx = 0, ny = 0;
      if (i < this.numSeg - 1) {
        const dx = this.segments[i + 1].x - seg.x;
        const dy = this.segments[i + 1].y - seg.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      } else {
        const dx = seg.x - this.segments[i - 1].x;
        const dy = seg.y - this.segments[i - 1].y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        nx = -dy / len;
        ny = dx / len;
      }

      // Normalize normal
      const nlen = Math.sqrt(nx * nx + ny * ny) || 1;
      nx /= nlen;
      ny /= nlen;

      // Width variation
      const normY = i / (this.numSeg - 1);
      const widthMod = RIBBON_WIDTH * (0.7 + 0.3 * Math.sin(normY * Math.PI));

      leftEdge.push({ x: seg.x + nx * widthMod * 0.5, y: seg.y + ny * widthMod * 0.5 });
      rightEdge.push({ x: seg.x - nx * widthMod * 0.5, y: seg.y - ny * widthMod * 0.5 });
    }

    // Draw ribbon as filled path with gradient per segment
    for (let i = 0; i < this.numSeg - 1; i++) {
      const a = leftEdge[i];
      const b = rightEdge[i];
      const c = rightEdge[i + 1];
      const d = leftEdge[i + 1];

      const normY = i / (this.numSeg - 1);

      // Segment orientation for shading
      const seg = this.segments[i];
      const nextSeg = this.segments[i + 1];
      const dx = nextSeg.x - seg.x;
      const dy = nextSeg.y - seg.y;
      const segLen = Math.sqrt(dx * dx + dy * dy) || 1;
      const segAngle = Math.atan2(dy, dx);

      // Light direction
      const lightDirX = Math.cos(lightAngle);
      const lightDirY = Math.sin(lightAngle);

      // Normal of segment surface
      const surfNx = -dy / segLen;
      const surfNy = dx / segLen;

      // Dot product with light
      const dot = surfNx * lightDirX + surfNy * lightDirY;
      const sheen = Math.max(0, dot);
      const baseLight = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(normY * Math.PI * 2));

      const brightness = Math.min(1, baseLight + sheen * 0.6);

      const h = cfg.hue;
      const s = cfg.sat;
      const l = cfg.light * brightness;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.closePath();

      ctx.fillStyle = `hsl(${h}, ${s}%, ${l}%)`;
      ctx.fill();

      // Subtle edge highlight
      ctx.strokeStyle = `hsla(${h}, ${s - 10}%, ${l + 15}%, 0.3)`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Draw connecting line for smoothness
    ctx.beginPath();
    ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
    for (let i = 1; i < leftEdge.length; i++) {
      ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
    }
    ctx.strokeStyle = `hsla(${cfg.hue}, ${cfg.sat}%, ${cfg.light + 10}%, 0.15)`;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(rightEdge[0].x, rightEdge[0].y);
    for (let i = 1; i < rightEdge.length; i++) {
      ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
    }
    ctx.stroke();

    // Sheen highlight along the ribbon
    ctx.beginPath();
    for (let i = 0; i < this.numSeg - 1; i++) {
      const seg = this.segments[i];
      const nextSeg = this.segments[i + 1];
      const dx = nextSeg.x - seg.x;
      const dy = nextSeg.y - seg.y;
      const segLen = Math.sqrt(dx * dx + dy * dy) || 1;
      const dot = (-dy / segLen) * Math.cos(lightAngle) + (dx / segLen) * Math.sin(lightAngle);

      if (dot > 0.3) {
        const alpha = (dot - 0.3) * 0.4;
        const midX = (seg.x + nextSeg.x) / 2;
        const midY = (seg.y + nextSeg.y) / 2;
        if (i === 0) ctx.moveTo(midX, midY);
        else ctx.lineTo(midX, midY);
      }
    }
    ctx.strokeStyle = `hsla(${cfg.hue}, ${cfg.sat + 10}%, 85%, 0.25)`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

const ribbons = [];
for (let i = 0; i < NUM_RIBBONS; i++) {
  ribbons.push(new Ribbon(i));
}

let lastTime = 0;
function animate(time) {
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;

  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0d0d1a');
  bgGrad.addColorStop(0.5, '#12122a');
  bgGrad.addColorStop(1, '#0a0a14');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle ambient light
  const ambGrad = ctx.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, H * 0.8);
  ambGrad.addColorStop(0, 'rgba(100, 100, 180, 0.04)');
  ambGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = ambGrad;
  ctx.fillRect(0, 0, W, H);

  for (const ribbon of ribbons) {
    ribbon.applyWind(time, dt);
    ribbon.constrain();
    ribbon.updatePositions();
  }

  // Draw ribbons back to front
  for (const ribbon of ribbons) {
    ribbon.draw(ctx, time);
  }

  // Draw subtle connection lines at top
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (const ribbon of ribbons) {
    ctx.beginPath();
    const seg = ribbon.segments[0];
    ctx.moveTo(seg.x - 2, seg.y);
    ctx.lineTo(seg.x + 2, seg.y);
    ctx.stroke();
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
