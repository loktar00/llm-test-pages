<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatic Plasma Reef</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205; /* Deepest background */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* We use CSS filters for bloom/glow because it's performant on modern GPUs */
        #glow-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Heavy blur for the bioluminescent glow effect */
            filter: blur(25px) contrast(1.5) brightness(1.2); 
            /* Mix blend mode helps merge colors into white-hot centers */
            mix-blend-mode: screen; 
            opacity: 0.8;
            pointer-events: none;
        }

        /* Base layer sits behind the glow */
        #base-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #glow-layer {
            z-index: 1;
        }
    </style>
</head>
