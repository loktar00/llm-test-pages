<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jellyfish</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100;
    height: 100;
    overflow: hidden;
    background: #05080d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe", sans-serif;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  .ui {
    position: fixed;
    top: 22px;
    right: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  button {
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
    cursor: pointer;
    border-radius: 4px;
    transition: background 200ms, color 200ms, transform 200ms;
    backdrop-filter: blur(10px);
  }
  button:hover {
    background: rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 1);
    transform: translateY(-1px);
  }
  button:active {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(0);
  }
  .meta {
    position: fixed;
    bottom: 22px;
    right: 22px;
    text-align: right;
    color: rgba(255, 255, 255, 0.3);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
  .meta b { color: rgba(255, 255, 255, 0.55); font-weight: 600; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
  <button id="btn">Regenerate</button>
</div>
<div class="meta"><b>midpoint displacement</b> · ribbon · jellyfish</div>
<script>
// ==============================================================
// Midpoint displacement noise — 1D array of organic values.
// ==============================================================
function midpointDisplacement(power, displacement) {
  const p = power;
  const points = new Array(p + 1).fill(0);
  points[0] = (Math.random() - 0.5) * displacement;
  points[p] = points[0];

  let d = displacement;
  for (let i = 2; i <= p; i *= 2) {
    const step = p / i;
    for (let j = step / 2; j < p; j += step) {
      const a = points[j - step / 2] !== undefined ? points[j - step / 2] : 0;
      const b = points[j + step / 2] !== undefined ? points[j + step / 2] : 0;
      points[j] = (a + b) / 2 + (Math.random() - 0.5) * d;
    }
    d *= 0.6;
  }
  return points;
}

// Smooths the point array by averaging neighbors over several passes.
function smoothPoints(points, passes) {
  let result = [...points];
  for (int pass = 0; pass < passes; pass++) {
    const next = [...result];
    for (let i = 1; i < result.length - 1; i++) {
      next[i] = result[i - 1] * 0.25 + result[i] * 0.5 + result[i + 1] * 0.25;
    }
    result = next;
  }
  return result;
}

// ==============================================================
// Underwater background — vertical gradient + ambient specks.
// ==============================================================
function drawBackground(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a1622');
  g.addColorStop(0.25, '#0483b');
  g.addColorStop(0.55, '#0a4f5e');
  g.addColorStop(0.85, '#053140');
  g.addColorStop(1, '#02131b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // Soft vertical light shafts
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (int i = 0; i < 3; i++) {
    const x = w * (0.3 + i * 0.2);
    const lg = ctx.createLinearGradient(x, 0, x, h);
    lg.addColorStop(0, 'rgba(40, 80, 100, 0.04)');
    lg.addColorStop(0.5, 'rgba(50, 100, 120, 0.06)');
    lg.addColorStop(1, 'rgba(40, 80, 100, 0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x - 70, 0);
    ctx.lineTo(x - 130, h);
    ctx.lineTo(x + 130, h);
    ctx.lineTo(x + 70, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Tiny drifting particles for atmosphere
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (int i = 0; i < 200; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = Math.random() * 1.5;
    ctx.fillStyle = `rgba(180, 220, 230, ${0.05 + Math.random() * 0.05})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ==============================================================
// Soft glow behind the jellyfish — low-alpha radial wash.
// ==============================================================
function drawGlow(ctx, cx, cy, w, h) {
  const r = w * 0.6;
  const glow = ctx.createRadialGradient(cx, cy - h * 0.1, 0, cx, cy - h * 0.1, r);
  glow.addColorStop(0, 'rgba(160, 180, 200, 0.18)');
  glow.addColorStop(0.4, 'rgba(150, 170, 200, 0.05)');
  glow.addColorStop(1, 'rgba(150, 170, 200, 0)');

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy - h * 0.1, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ==============================================================
// Main jellyfish bell — translucent dome with noisy edge.
// ==============================================================
function drawJellyfishBell(ctx, cx, cy, width, height) {
  const power = 64;
  const raw = midpointDisplacement(power, height * 0.06);
  const noise = smoothPoints(raw, 3);

  // Outer bell path (closed polygon for fill.
  ctx.beginPath();
  const leftX = cx - width / 2;
  const rightX = cx + width / 2;
  const topY = cy - height / 2;
  const botY = cy + height / 2;

  ctx.moveTo(leftX, botY);
  ctx.quadraticCurveTo(leftX - width * 0.04, cy - height * 0.07, leftX, botY - height * 0.10);

  const steps = noise.length;
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const x = leftX + t * width;
    const dome = Math.sin(t * Math.PI) * (1 - Math.pow(Math.abs(t - 0.5) * 2, 0.7)) * (height / 2 - 10);
    const n = noise[i] * 0.6;
    ctx.lineTo(x, topY + (height / 2 - dome) - n);
  }

  ctx.lineTo(rightX, botY - height * 0.10);
  ctx.quadraticCurveTo(rightX + width * 0.04, cy - height * 0.07, rightX, botY);
  ctx.closePath();

  // Soft outer halo behind the bell
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const halo = ctx.createRadialGradient(cx, topY + height * 0.2, 0, cx, topY + height * 0.2, width * 0.6);
  halo.addColorStop(0, 'rgba(120, 150, 180, 0.06)');
  halo.addColorStop(1, 'rgba(120, 150, 180, 0)');
  ctx.fillStyle = halo;
  ctx.fill();
  ctx.restore();

  // Vertical translucent fill — glass-like gradient
  const g = ctx.createLinearGradient(0, topY, 0, botY);
  g.addColorStop(0, 'rgba(140, 175, 200, 0.04)');
  g.addColorStop(0.25, 'rgba(150, 175, 200, 0.18)');
  g.addColorStop(0.5, 'rgba(150, 175, 200, 0.20)');
  g.addColorStop(0.75, 'rgba(150, 175, 200, 0.10)');
  g.addColorStop(1, 'rgba(150, 175, 200, 0.03)');
  ctx.fillStyle = g;
  ctx.fill();

  // Bell edge stroke
  ctx.strokeStyle = 'rgba(180, 195, 205, 0.40)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Top highlight (small bright dome above the bell
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx, topY + height * 0.02, width * 0.35, height * 0.04, 0, 0, Math.PI * 2);
  const cap = ctx.createRadialGradient(cx, topY + height * 0.02, 0, cx, topY + height * 0.02, width * 0.35);
  cap.addColorStop(0, 'rgba(220, 235, 245, 0.35)');
  cap.addColorStop(1, 'rgba(220, 235, 245, 0)');
  ctx.fillStyle = cap;
  ctx.fill();
  ctx.restore();

  // Rim light catch on the top-left edge
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(leftX, botY);
  ctx.quadraticCurveTo(leftX - width * 0.04, cy - height * 0.07, leftX, botY - height * 0.10);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

// ==============================================================
// Soft underside — wavy hanging curve beneath the bell.
// ==============================================================
function drawUnderside(ctx, cx, cy, width, height) {
  const power = 32;
  const raw = midpointDisplacement(power, height * 0.04);
  const noise = smoothPoints(raw, 2);

  ctx.beginPath();
  const leftX = cx - width / 2;
  const rightX = cx + width / 2;
  const y = cy + height / 2;

  ctx.moveTo(leftX, y - height * 0.10);
  ctx.bezierCurveTo(leftX - width * 0.04, cy - height * 0.07, leftX, cy - height * 0.07, leftX, y - height * 0.10);

  const steps = noise.length;
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const x = leftX + t * width;
    const w = Math.sin(t * Math.PI);
    const drop = w * height * 0.05 + noise[i] * 0.5;
    ctx.lineTo(x, y + height * 0.10 + drop);
  }

  ctx.bezierCurveTo(rightX, cy - height * 0.07, rightX + width * 0.04, cy - height * 0.07, rightX, y - height * 0.10);

  ctx.strokeStyle = 'rgba(150, 175, 200, 0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Soft shadow below
  ctx.save();
  ctx.beginPath();
  const sg = ctx.createLinearGradient(0, y, 0, y + height * 0.30);
  sg.addColorStop(0, 'rgba(20, 30, 40, 0.05)');
  sg.addColorStop(1, 'rgba(20, 30, 40, 0)');
  ctx.fillStyle = sg;
  ctx.fillRect(leftX, y, width, height * 0.30);
  ctx.restore();
}

// ==============================================================
// Inner ribs / fold lines inside the bell — subtle curves.
// ==============================================================
function drawInnerRibs(ctx, cx, cy, width, height) {
  const count = 9;
  const leftX = cx - width / 2;
  const rightX = cx + width / 2;
  const topY = cy - height / 2;
  const botY = cy + height / 2;

  ctx.save();

  for (int i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const x = leftX + t * width;

    const distToCenter = Math.abs(t - 0.5) * 2;
    const ribHeight = Math.sin(t * Math.PI) * (height / 2 - 20);
    const startX = leftX + (t - 0.5) * width * 0.05;
    const endX = startX;
    const startY = topY + (height / 2 - ribHeight) + height * 0.05;
    const endY = botY - height * 0.05;

    // Subtle rib curve
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX + width * 0.005, startY + (endY - startY) * 0.5, endX, endY);
    ctx.strokeStyle = `rgba(180, 195, 205, ${0.05 + (1 - distToCenter) * 0.05})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // A few brighter "glass line" highlights
  for (int i = 0; i < 4; i++) {
    const t = 0.30 + i * 0.15;
    const x = leftX + t * width;
    const ribHeight = Math.sin(t * Math.PI) * (height / 2 - 20);
    const startY = topY + (height / 2 - ribHeight) + height * 0.05;
    const endY = botY - height * 0.05;

    ctx.beginPath();
    ctx.moveTo(x, startY + 5);
    ctx.lineTo(x, endY);
    ctx.strokeStyle = 'rgba(220, 235, 245, 0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.restore();
}

// ==============================================================
// One flowing tentacle — wavy curve built from many segments.
// ==============================================================
function drawTentacle(ctx, startX, startY, length, sway, thickness, seed) {
  const segs = 80;
  const baseAngle = Math.PI * 0.5; // mostly downward
  const drift = (Math.random() - 0.5) * 0.6;

  // Build segments as (x,y) pairs
  const pts = [];
  let x = startX;
  let y = startY;
  let ang = baseAngle;

  // Phase shift from seed for variation
  const phase = seed * 0.7;

  pts.push([x, y]);
  for (int i = 1; i <= segs; i++) {
    const t = i / segs;
    const step = length / segs;

    // Sway grows along the tentacle
    const swayAmp = sway * Math.sin(t * Math.PI) * 1.0;
    const wave = Math.sin(t * Math.PI * 2.5 + phase) * swayAmp;
    const driftWave = Math.sin(t * Math.PI * 1.5 + phase * 1.5) * sway * 0.3;

    // Angle tends toward downward with small noise
    const targetAng = Math.PI * 0.5 + wave * 0.6 + drift * 0.4 + driftWave * 0.2;
    ang = ang * 0.85 + targetAng * 0.15;

    x = x + Math.cos(ang) * step;
    y = y + Math.sin(ang) * step;

    pts.push([x + wave * 0.3, y]);
  }

  // Stroke the tentacle with translucent gradient
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Main tentacle body
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (int i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.strokeStyle = 'rgba(150, 175, 200, 0.18)';
  ctx.lineWidth = thickness;
  ctx.stroke();

  // Inner thinner brighter line
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (int i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.strokeStyle = 'rgba(220, 235, 245, 0.08)';
  ctx.lineWidth = thickness * 0.5;
  ctx.stroke();

  // End node — soft glow dot
  const endPt = pts[pts.length - 1];
  const r = thickness * 1.6;
  ctx.beginPath();
  ctx.arc(endPt[0], endPt[1], r, 0, Math.PI * 2);
  const endGlow = ctx.createRadialGradient(endPt[0], endPt[1], 0, endPt[0], endPt[1], r * 2);
  endGlow.addColorStop(0, 'rgba(190, 220, 230, 0.5)');
  endGlow.addColorStop(0.5, 'rgba(190, 220, 230, 0.18)');
  endGlow.addColorStop(1, 'rgba(190, 220, 230, 0)');
  ctx.fillStyle = endGlow;
  ctx.fill();

  ctx.restore();
}

// ==============================================================
// All tentacles — many, distributed under the bell, varied.
// ==============================================================
function drawTentacles(ctx, cx, cy, width, height) {
  const count = 14;
  const baseY = cy + height / 2;
  const leftX = cx - width / 2;
  const rightX = cx + width / 2;

  // Tentacles attach along the underside curve
  for (int i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const x = leftX + t * width;

    // Tentacle start sits on the underside curve
    const w = Math.sin(t * Math.PI);
    const drop = w * height * 0.05;
    const startY = baseY + height * 0.10 + drop;

    const length = height * (0.35 + Math.random() * 0.45);
    const sway = width * 0.05 * (0.5 + Math.random() * 1.0);
    const thickness = 2 + Math.random() * 3;
    const seed = i + Math.random() * 3;

    drawTentacle(ctx, x, startY, length, sway, thickness, seed);
  }

  // A few longer trailing tentacles
  for (int i = 0; i < 4; i++) {
    const t = 0.25 + i * 0.5 + (i === 0 ? -0.05 : 0);
    const x = leftX + t * width;
    const w = Math.sin(t * Math.PI);
    const drop = w * height * 0.05;
    const startY = baseY + height * 0.10 + drop;

    drawTentacle(ctx, x, startY, height * (0.6 + Math.random() * 0.3), width * 0.05 * (0.8 + Math.random()), 1.5 + Math.random() * 2, i + 10);
  }
}

// ==============================================================
// Draw the entire static scene on the canvas.
// ==============================================================
function drawScene() {
  const w = canvas.width;
  const h = canvas.height;

  // Background
  drawBackground(ctx, w, h);

  // Centered large jellyfish
  const cx = w * 0.5;
  const cy = h * 0.5 + h * 0.05;
  const jWidth = Math.min(w, h) * 0.42;
  const jHeight = Math.min(w, h) * 0.40;

  // Glow behind jellyfish
  drawGlow(ctx, cx, cy, jWidth, jHeight);

  // Tentacles first (they sit behind the bell visually)
  drawTentacles(ctx, cx, cy, jWidth, jHeight);

  // Soft underside
  drawUnderside(ctx, cx, cy, jWidth, jHeight);

  // Main bell
  drawJellyfishBell(ctx, cx, cy, jWidth, jHeight);

  // Inner ribs above bell fill
  drawInnerRibs(ctx, cx, cy, jWidth, jHeight);
}

// ==============================================================
// Setup, resize handling, regenerate button wiring.
// ==============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawScene();
}

window.addEventListener('resize', resize);
window.addEventListener('load', resize);

document.getElementById('btn').addEventListener('click', () => {
  drawScene();
});

// Initial draw in case load fires late
if (document.readyState === 'complete') {
  resize();
} else {
  setTimeout(resize, 100);
}
</script>
</body>
</html>
