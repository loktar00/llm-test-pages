<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Forest Seasons</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
            /* Ensure crisp rendering of the low-res canvas scaled up */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

<canvas id="scene"></canvas>

<script>
/**
 * PROCEDURAL FOREST SEASONS
 * A minimalist, generative canvas animation.
 */

// --- Configuration ---
const CONFIG = {
    width: 640,           // Internal resolution
    height: 640,          // Internal resolution
    skyTop: 0.35,         // Sky takes up top 35%
    horizonY: 0.35,       // Horizon line Y position
    treeCount: 180,       // Number of trees
    creatureCount: 25,    // Number of creatures
    seasonDuration: 15000,// Milliseconds per season (45s total cycle)
    minSpeed: 0.2,
    maxSpeed: 1.5
};

// --- Color Palettes ---
const PALETTE = {
    fall: {
        sky: ['#d6eaf8', '#aed6f1'],
        ground: ['#d35400', '#e67e22'],
        trunk: '#2c3e50',
        canopy: ['#d35400', '#e74c3c', '#f39c12', '#f1c40f', '#8e44ad'],
        shadow: 'rgba(0,0,0,0.15)',
        particle: { type: 'leaf', color: ['#c0392b', '#d35400', '#e67e22'] }
    },
    winter: {
        sky: ['#ebf5fb', '#d6eaf8'],
        ground: ['#ffffff', '#dcdde1'],
        trunk: '#2c3e50',
        canopy: ['#dcdde1', '#bdc3c7', '#95a5a6'],
        shadow: 'rgba(0,0,0,0.1)',
        particle: { type: 'snow', color: ['#ffffff'] }
    },
    spring: {
        sky: ['#81ecec', '#74b9ff'],
        ground: ['#55efc4', '#00b894'],
        trunk: '#634228',
        canopy: ['#00b894', '#55efc4', '#81ecec', '#fab1a0', '#ffeaa7'], // Greens and pinks
        shadow: 'rgba(0,60,0,0.1)',
        particle: { type: 'petal', color: ['#fab1a0', '#ff7675', '#ffeaa7'] }
    },
    summer: {
        sky: ['#0984e3', '#74b9ff'],
        ground: ['#00b894', '#2ecc71'],
        trunk: '#5d4037',
        canopy: ['#27ae60', '#2ecc71', '#1e8449', '#145a32'],
        shadow: 'rgba(0,40,0,0.15)',
        particle: { type: 'firefly', color: ['#f1c40f', '#f9e79f'] }
    }
};

// --- Utils ---
const lerp = (a, b, t) => a + (b - a) * t;
const lerpColor = (c1, c2, t) => {
    // Simple hex string parser for lerp
    const hex = s => parseInt(s.slice(1), 16);
    const r1 = (hex(c1) >> 16) & 255, g1 = (hex(c1) >> 8) & 255, b1 = hex(c1) & 255;
    const r2 = (hex(c2) >> 16) & 255, g2 = (hex(c2) >> 8) & 255, b2 = hex(c2) & 255;
    const r = Math.round(lerp(r1, r2, t));
    const g = Math.round(lerp(g1, g2, t));
    const b = Math.round(lerp(b1, b2, t));
    return `rgb(${r},${g},${b})`;
};

const random = (arr) => arr[Math.floor(Math.random() * arr.length)];
const randomRange = (min, max) => Math.random() * (max - min) + min;

// --- Classes ---

class Particle {
    constructor(width, height, type) {
        this.x = Math.random() * width;
        this.y = Math.random() * height * CONFIG.skyTop; // Spawn in sky
        this.size = Math.random() * 3 + 1;
        this.speedX = -Math.random() * 0.5 - 0.1;
        this.speedY = Math.random() * 1 + 0.5;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.1;
        this.type = type;
        this.color = '#fff';
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;

        // Reset if off screen
        if (this.y > CONFIG.height * CONFIG.horizonY) {
            this.y = CONFIG.height * CONFIG.horizonY - 10;
            this.x = CONFIG.width + Math.random() * 100;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        
        if (this.type === 'leaf') {
            // Elliptical leaf
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.type === 'snow') {
            // Circle
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.type === 'petal') {
            // Petal shape
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size * 1.5, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.type === 'firefly') {
            // Glowing dot
            ctx.globalAlpha = Math.abs(Math.sin(Date.now() / 200)); // Blink
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

class Tree {
    constructor(width, height, depth) {
        this.width = width;
        this.height = height;
        this.depth = depth; // 0 (far) to 1 (close)
        
        // Appearance
        this.size = lerp(10, 40, depth);
        this.y = randomRange(CONFIG.horizonY + 0.05, CONFIG.horizonY + 0.6);
        
        // Movement
        const baseSpeed = CONFIG.minSpeed;
        const maxSpeed = CONFIG.maxSpeed;
        this.speed = lerp(baseSpeed, maxSpeed, depth);
        
        this.x = randomRange(-100, width);
        
        // Shape
        this.canopyRadius = this.size * (Math.random() * 0.5 + 0.8);
        this.trunkWidth = this.size * 0.2;
        this.trunkHeight = this.size * 1.5;
        
        // Wiggle for wind
        this.sway = Math.random() * Math.PI * 2;
        this.swaySpeed = Math.random() * 0.02 + 0.005;
    }

    update() {
        this.x -= this.speed;
        this.sway += this.swaySpeed;
        
        // Wrap around
        if (this.x < -this.canopyRadius * 2) {
            this.x = this.width + this.canopyRadius * 2 + Math.random() * 200;
            this.y = randomRange(CONFIG.horizonY + 0.05, CONFIG.horizonY + 0.6); // Respawn at random depth
        }
    }

    draw(ctx, colors) {
        const swayOffset = Math.sin(this.sway) * (this.size * 0.05);
        
        // Shadow (Angular)
        ctx.fillStyle = colors.shadow;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.size * 0.6, this.y);
        ctx.lineTo(this.x + this.size * 0.4, this.y - this.size * 0.2);
        ctx.fill();

        // Trunk (Simple rectangle/line)
        ctx.fillStyle = colors.trunk;
        ctx.fillRect(this.x - this.trunkWidth / 2, this.y - this.trunkHeight, this.trunkWidth, this.trunkHeight);

        // Canopy (Blobby circle)
        ctx.fillStyle = colors.canopy;
        ctx.beginPath();
        ctx.arc(this.x + swayOffset, this.y - this.trunkHeight - this.canopyRadius * 0.5, this.canopyRadius, 0, Math.PI * 2);
        ctx.fill();
        
        // Secondary blob for organic look
        ctx.beginPath();
        ctx.arc(this.x + swayOffset + this.size * 0.3, this.y - this.trunkHeight - this.canopyRadius * 0.2, this.canopyRadius * 0.7, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Creature {
    constructor(width, height, depth) {
        this.width = width;
        this.height = height;
        this.depth = depth;
        
        this.y = randomRange(CONFIG.horizonY + 0.1, CONFIG.horizonY + 0.5);
        this.x = -50;
        this.speed = lerp(0.5, 2.5, depth);
        
        // Types: 0: Rabbit, 1: Bird, 2: Insect
        this.type = Math.random() > 0.7 ? (Math.random() > 0.5 ? 1 : 2) : 0;
        
        this.frame = 0;
        this.hopTimer = Math.random() * 100;
    }

    update() {
        this.x += this.speed;
        this.frame += 0.2;
        
        if (this.type === 0) { // Rabbit hop
            this.hopTimer++;
            if (this.hopTimer > 60) {
                this.jumpY = Math.sin(this.frame) * 5;
            }
        }
        
        if (this.x > this.width + 50) {
            this.x = -50;
            this.y = randomRange(CONFIG.horizonY + 0.1, CONFIG.horizonY + 0.5);
        }
    }

    draw(ctx, season) {
        let color = '#000';
        if (season === 'winter') color = '#fff';
        else if (season === 'spring') color = '#ff7675';
        else if (season === 'summer') color = '#2c3e50';

        ctx.fillStyle = color;
        ctx.save();
        ctx.translate(this.x, this.y + (this.type === 0 ? this.jumpY || 0 : 0));

        if (this.type === 0) { // Rabbit
            // Body
            ctx.beginPath();
            ctx.ellipse(0, 0, 4, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            // Head
            ctx.beginPath();
            ctx.arc(3, -3, 2, 0, Math.PI * 2);
            ctx.fill();
            // Ear
            ctx.fillRect(2, -6, 1, 3);
        } else if (this.type === 1) { // Bird
            const wingY = Math.sin(this.frame * 0.5) * 3;
            // Body
            ctx.beginPath();
            ctx.ellipse(0, 0, 3, 1.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Wings
            ctx.beginPath();
            ctx.moveTo(-2, 0);
            ctx.lineTo(0, -4 + wingY);
            ctx.lineTo(2, 0);
            ctx.stroke();
        } else { // Insect
            ctx.beginPath();
            ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.beginPath();
            ctx.moveTo(0,0); ctx.lineTo(-2, -2);
            ctx.moveTo(0,0); ctx.lineTo(2, -2);
            ctx.stroke();
        }

        ctx.restore();
    }
}

// --- Main App ---

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

canvas.width = CONFIG.width;
canvas.height = CONFIG.height;

// State
let lastTime = 0;
let seasonIndex = 0; // 0: Fall, 1: Winter, 2: Spring, 3: Summer
let seasonTimer = 0;
const SEASONS = ['fall', 'winter', 'spring', 'summer'];

// Objects
const trees = [];
const creatures = [];
const particles = [];

// Initialize Objects
for (let i = 0; i < CONFIG.treeCount; i++) {
    trees.push(new Tree(CONFIG.width, CONFIG.height, Math.random()));
}
for (let i = 0; i < CONFIG.creatureCount; i++) {
    creatures.push(new Creature(CONFIG.width, CONFIG.height, Math.random()));
}

// --- Helper: Interpolate Colors ---
function getSeasonColors() {
    const current = SEASONS[seasonIndex];
    const next = SEASONS[(seasonIndex + 1) % 4];
    const progress = seasonTimer / CONFIG.seasonDuration;
    
    // If we are past 95%, stay on current to avoid glitching at transition
    if (progress > 0.95) progress = 0.95;

    const palette1 = PALETTE[current];
    const palette2 = PALETTE[next];

    // Helper to lerp arrays
    const lerpArray = (arr1, arr2, t) => {
        // Just picking the first item for simplicity in this demo logic
        // In a more complex version, we'd map every index.
        return lerpColor(arr1[0], arr2[0], t);
    };

    // Simple transition logic
    let sky = lerpColor(palette1.sky[0], palette2.sky[0], progress);
    let ground = lerpColor(palette1.ground[0], palette2.ground[0], progress);
    let trunk = lerpColor(palette1.trunk, palette2.trunk, progress);
    let canopy = lerpColor(palette1.canopy[0], palette2.canopy[0], progress);
    let shadow = 'rgba(0,0,0,0.1)'; // Keep shadows neutral
    let particleType = (progress < 0.5) ? palette1.particle.type : palette2.particle.type;
    let particleColor = (progress < 0.5) ? palette1.particle.color[0] : palette2.particle.color[0];

    return {
        sky,
        ground,
        trunk,
        canopy,
        shadow,
        particleType,
        particleColor
    };
}

// --- Main Loop ---

function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    seasonTimer += dt;
    if (seasonTimer > CONFIG.seasonDuration) {
        seasonTimer = 0;
        seasonIndex = (seasonIndex + 1) % 4;
    }

    const colors = getSeasonColors();
    const currentSeason = SEASONS[seasonIndex];

    // 1. Update Logic
    
    // Ensure we have enough particles based on type
    while (particles.length < 100) {
        particles.push(new Particle(CONFIG.width, CONFIG.height, currentSeason === 'fall' ? 'leaf' : 
                                   currentSeason === 'winter' ? 'snow' : 
                                   currentSeason === 'spring' ? 'petal' : 'firefly'));
    }
    
    // Sync particle types if season changed
    particles.forEach(p => {
        p.type = currentSeason === 'fall' ? 'leaf' : 
                 currentSeason === 'winter' ? 'snow' : 
                 currentSeason === 'spring' ? 'petal' : 'firefly';
        p.color = random(PALETTE[currentSeason].particle.color);
    });

    trees.forEach(t => t.update());
    creatures.forEach(c => c.update());
    particles.forEach(p => p.update());

    // 2. Draw
    
    // Background
    ctx.fillStyle = colors.sky;
    ctx.fillRect(0, 0, CONFIG.width, CONFIG.height * CONFIG.horizonY);

    // Ground
    ctx.fillStyle = colors.ground;
    ctx.fillRect(0, CONFIG.height * CONFIG.horizonY, CONFIG.width, CONFIG.height);

    // Horizon Line (Sharp)
    ctx.fillStyle = colors.trunk; // Use a dark color for the line
    ctx.fillRect(0, CONFIG.height * CONFIG.horizonY - 1, CONFIG.width, 2);

    // Sort layers for depth: Objects lower on screen are closer
    // We combine trees, creatures, and particles into a render list sorted by Y
    let renderList = [];
    
    trees.forEach(t => renderList.push({ type: 'tree', obj: t, y: t.y }));
    creatures.forEach(c => renderList.push({ type: 'creature', obj: c, y: c.y }));
    // Only draw particles "behind" or "in front" based on type? Let's just add some to the list for depth
    // To keep it performant, we'll draw particles as a background layer usually, but let's put a few in list
    // Actually, for simplicity and performance in this style, we'll draw particles separately
    // but ensure they respect basic occlusion if we were doing complex 3D.
    // Here, we will just draw particles on top or bottom depending on type.

    // Sort and Draw
    renderList.sort((a, b) => a.y - b.y);

    renderList.forEach(item => {
        if (item.type === 'tree') {
            item.obj.draw(ctx, colors);
        } else {
            item.obj.draw(ctx, currentSeason);
        }
    });

    // Draw Particles
    // Add depth sorting for particles?
    // Let's just draw them.
    particles.forEach(p => {
        p.draw(ctx);
    });

    requestAnimationFrame(loop);
}

// Start
requestAnimationFrame(loop);

</script>
</body>
</html>
