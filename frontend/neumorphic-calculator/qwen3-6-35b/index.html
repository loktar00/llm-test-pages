<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neumorphic Calculator</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e0e5ec;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .calculator {
    width: 340px;
    padding: 28px;
    border-radius: 28px;
    background: #e0e5ec;
    box-shadow:
      10px 10px 20px #b8bcc4,
      -10px -10px 20px #ffffff;
  }

  .display {
    width: 100%;
    height: 90px;
    border-radius: 16px;
    background: #e0e5ec;
    box-shadow:
      inset 5px 5px 10px #b8bcc4,
      inset -5px -5px 10px #ffffff;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 14px 20px;
    margin-bottom: 24px;
    overflow: hidden;
    position: relative;
  }

  .display .expression {
    font-size: 13px;
    color: #9a9eaa;
    min-height: 18px;
    letter-spacing: 0.5px;
    word-break: break-all;
    text-align: right;
    line-height: 1.4;
    margin-bottom: 4px;
    transition: color 0.2s;
  }

  .display .value {
    font-size: 32px;
    font-weight: 600;
    color: #3a3d45;
    letter-spacing: 0.5px;
    transition: font-size 0.15s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .display .value.shrink-1 { font-size: 26px; }
  .display .value.shrink-2 { font-size: 22px; }
  .display .value.shrink-3 { font-size: 18px; }
  .display .value.shrink-4 { font-size: 15px; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .key {
    height: 58px;
    border: none;
    border-radius: 14px;
    background: #e0e5ec;
    box-shadow:
      5px 5px 10px #b8bcc4,
      -5px -5px 10px #ffffff;
    font-size: 18px;
    font-weight: 500;
    color: #4a4e58;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    transition:
      box-shadow 0.12s ease,
      transform 0.12s ease;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    letter-spacing: 0.3px;
    font-family: inherit;
  }

  .key::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .key:hover {
    color: #3a3d45;
  }

  .key:active, .key.pressed {
    box-shadow:
      inset 3px 3px 6px #b8bcc4,
      inset -3px -3px 6px #ffffff;
    transform: scale(0.96);
  }

  .key.operator {
    color: #6a7080;
    font-size: 20px;
    font-weight: 600;
  }

  .key.equals {
    background: #5b8dee;
    color: #ffffff;
    box-shadow:
      5px 5px 10px #4a7dd4,
      -5px -5px 10px #6ca0f8;
    font-size: 22px;
    font-weight: 600;
  }

  .key.equals:hover {
    background: #5080e0;
    color: #ffffff;
  }

  .key.equals:active, .key.equals.pressed {
    box-shadow:
      inset 3px 3px 6px #3a6ab8,
      inset -3px -3px 6px #6a9af0;
    background: #4a7de0;
  }

  .key.clear {
    color: #d45a5a;
    font-weight: 600;
  }

  .key.clear:hover {
    color: #c04848;
  }

  .key.wide {
    grid-column: span 2;
  }

  .key .symbol {
    pointer-events: none;
  }

  @media (max-width: 400px) {
    .calculator {
      width: 300px;
      padding: 20px;
    }
    .key { height: 52px; font-size: 16px; }
    .display .value { font-size: 28px; }
    .keys { gap: 10px; }
  }
</style>
</head>
<body>
<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys">
    <button class="key clear" data-action="clear">AC</button>
    <button class="key operator" data-action="toggle-sign">+/−</button>
    <button class="key operator" data-action="percent">%</button>
    <button class="key operator" data-action="operator" data-value="÷">÷</button>

    <button class="key" data-action="number" data-value="7">7</button>
    <button class="key" data-action="number" data-value="8">8</button>
    <button class="key" data-action="number" data-value="9">9</button>
    <button class="key operator" data-action="operator" data-value="×">×</button>

    <button class="key" data-action="number" data-value="4">4</button>
    <button class="key" data-action="number" data-value="5">5</button>
    <button class="key" data-action="number" data-value="6">6</button>
    <button class="key operator" data-action="operator" data-value="−">−</button>

    <button class="key" data-action="number" data-value="1">1</button>
    <button class="key" data-action="number" data-value="2">2</button>
    <button class="key" data-action="number" data-value="3">3</button>
    <button class="key operator" data-action="operator" data-value="+">+</button>

    <button class="key wide" data-action="number" data-value="0">0</button>
    <button class="key" data-action="decimal">.</button>
    <button class="key equals" data-action="equals">=</button>
  </div>
</div>

<script>
(function() {
  const expressionEl = document.getElementById('expression');
  const valueEl = document.getElementById('value');

  let currentInput = '0';
  let previousInput = '';
  let operator = null;
  let shouldResetInput = false;
  let lastResult = null;
  let expressionStr = '';

  function updateDisplay() {
    let display = currentInput;
    if (display.length > 14) {
      let num = parseFloat(display);
      if (!isNaN(num)) {
        if (Math.abs(num) >= 1e14 || (Math.abs(num) < 1e-6 && num !== 0)) {
          display = num.toExponential(6);
        } else {
          display = parseFloat(num.toPrecision(10)).toString();
        }
        currentInput = display;
      }
    }
    valueEl.textContent = display;

    const len = display.length;
    valueEl.className = 'value';
    if (len > 16) valueEl.classList.add('shrink-4');
    else if (len > 13) valueEl.classList.add('shrink-3');
    else if (len > 10) valueEl.classList.add('shrink-2');
    else if (len > 8) valueEl.classList.add('shrink-1');

    expressionEl.textContent = expressionStr;
  }

  function formatNumber(n) {
    if (n === Infinity || n === -Infinity) return 'Error';
    if (isNaN(n)) return 'Error';
    let str = parseFloat(n.toPrecision(12)).toString();
    return str;
  }

  function calculate(a, op, b) {
    a = parseFloat(a);
    b = parseFloat(b);
    switch(op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function handleNumber(value) {
    if (currentInput === 'Error') {
      currentInput = value;
      expressionStr = '';
      updateDisplay();
      return;
    }
    if (shouldResetInput) {
      currentInput = value;
      shouldResetInput = false;
    } else {
      if (currentInput === '0' && value !== '.') {
        currentInput = value;
      } else {
        if (currentInput.replace(/[^0-9]/g, '').length >= 15) return;
        currentInput += value;
      }
    }
    updateDisplay();
  }

  function handleDecimal() {
    if (shouldResetInput) {
      currentInput = '0.';
      shouldResetInput = false;
      updateDisplay();
      return;
    }
    if (!currentInput.includes('.')) {
      currentInput += '.';
    }
    updateDisplay();
  }

  function handleOperator(op) {
    if (currentInput === 'Error') {
      currentInput = '0';
    }
    if (operator && !shouldResetInput) {
      let result = calculate(previousInput, operator, currentInput);
      currentInput = formatNumber(result);
      expressionStr = currentInput + ' ' + op;
    } else {
      expressionStr = currentInput + ' ' + op;
    }
    previousInput = currentInput;
    operator = op;
    shouldResetInput = true;
    updateDisplay();
  }

  function handleEquals() {
    if (currentInput === 'Error') {
      currentInput = '0';
      expressionStr = '';
      updateDisplay();
      return;
    }
    if (!operator) return;
    let result = calculate(previousInput, operator, currentInput);
    let displayExpr = expressionStr + ' ' + currentInput;
    expressionStr = displayExpr + ' =';
    currentInput = formatNumber(result);
    operator = null;
    previousInput = '';
    shouldResetInput = true;
    lastResult = result;
    updateDisplay();
  }

  function handleClear() {
    currentInput = '0';
    previousInput = '';
    operator = null;
    shouldResetInput = false;
    expressionStr = '';
    lastResult = null;
    updateDisplay();
  }

  function handleToggleSign() {
    if (currentInput === 'Error' || currentInput === '0') return;
    if (currentInput.startsWith('-')) {
      currentInput = currentInput.slice(1);
    } else {
      currentInput = '-' + currentInput;
    }
    updateDisplay();
  }

  function handlePercent() {
    if (currentInput === 'Error') return;
    let num = parseFloat(currentInput);
    currentInput = formatNumber(num / 100);
    updateDisplay();
  }

  function handleKey(key) {
    if (key >= '0' && key <= '9') handleNumber(key);
    else if (key === '.') handleDecimal();
    else if (key === '+') handleOperator('+');
    else if (key === '-') handleOperator('−');
    else if (key === '*') handleOperator('×');
    else if (key === '/') handleOperator('÷');
    else if (key === 'Enter' || key === '=') handleEquals();
    else if (key === 'Escape' || key === 'c' || key === 'C') handleClear();
    else if (key === '%') handlePercent();
    else if (key === 'Backspace') {
      if (currentInput === 'Error') {
        handleClear();
      } else if (shouldResetInput) {
        // do nothing
      } else if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') e.preventDefault();
    handleKey(e.key);
  });

  document.querySelectorAll('.key').forEach(function(btn) {
    btn.addEventListener('mousedown', function(e) {
      e.preventDefault();
      this.classList.add('pressed');
      triggerAction(this);
    });

    btn.addEventListener('mouseup', function() {
      this.classList.remove('pressed');
    });

    btn.addEventListener('mouseleave', function() {
      this.classList.remove('pressed');
    });

    btn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      this.classList.add('pressed');
      triggerAction(this);
    }, { passive: false });

    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      this.classList.remove('pressed');
    });

    btn.addEventListener('touchcancel', function() {
      this.classList.remove('pressed');
    });
  });

  function triggerAction(btn) {
    const action = btn.dataset.action;
    const value = btn.dataset.value;

    switch(action) {
      case 'number': handleNumber(value); break;
      case 'decimal': handleDecimal(); break;
      case 'operator': handleOperator(value); break;
      case 'equals': handleEquals(); break;
      case 'clear': handleClear(); break;
      case 'toggle-sign': handleToggleSign(); break;
      case 'percent': handlePercent(); break;
    }
  }

  updateDisplay();
})();
</script>
</body>
</html>
