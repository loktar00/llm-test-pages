<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Living Weather Map</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initContinents();
  initSystems();
  initParticles();
  initRain();
  initTempField();
}

/* ==================== NOISE ==================== */
const noise = (() => {
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.random() * i | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + t * (b - a);
  const grad = (h, x, y) => { const v = p[h] & 3; return (v < 2 ? (v === 0 ? x : -x) : 0) + (v < 2 ? 0 : (y < 0 ? -y : y)); };
  return (x, y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    return lerp(
      lerp(grad(p[X] + Y, xf, yf), grad(p[X + 1] + Y, xf - 1, yf), u),
      lerp(grad(p[X] + Y + 1, xf, yf - 1), grad(p[X + 1] + Y + 1, xf - 1, yf - 1), u), v
    );
  };
})();

function fbm(x, y, oct) {
  let v = 0, a = 1, f = 1, s = 0;
  for (let i = 0; i < oct; i++) { v += a * noise(x * f, y * f); s += a; a *= 0.5; f *= 2; }
  return v / s;
}

/* ==================== CONTINENT ==================== */
let continent = null;

function initContinents() {
  continent = new ImageData(512, 512);
  const d = continent.data;
  const off = fbm(0, 0, 6);
  for (let y = 0; y < 512; y++) {
    for (let x = 0; x < 512; x++) {
      const n = fbm(x / 100 + off, y / 100 + off, 6);
      const land = n > 0.08 ? 255 : 0;
      const idx = (y * 512 + x) * 4;
      d[idx] = land; d[idx + 1] = land; d[idx + 2] = land; d[idx + 3] = land;
    }
  }
  // Smooth
  const tmp = new Uint8ClampedArray(512 * 512);
  for (let pass = 0; pass < 4; pass++) {
    for (let y = 1; y < 511; y++) {
      for (let x = 1; x < 511; x++) {
        let s = 0, c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          s += d[((y + dy) * 512 + (x + dx)) * 4]; c++;
        }
        tmp[y * 512 + x] = (s / c) > 128 ? 255 : 0;
      }
    }
    d.set(tmp);
  }
}

function isLand(px, py) {
  const sx = (px / W) * 512, sy = (py / H) * 512;
  const ix = Math.max(0, Math.min(511, sx | 0)), iy = Math.max(0, Math.min(511, sy | 0));
  return (continent.data[(iy * 512 + ix) * 4] > 128);
}

/* ==================== PRESSURE SYSTEMS ==================== */
let systems = [];

function initSystems() {
  systems = [];
  const count = 7;
  for (let i = 0; i < count; i++) {
    const isHigh = Math.random() > 0.5;
    const sys = {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 10,
      strength: 30 + Math.random() * 40,
      radius: 100 + Math.random() * 120,
      isHigh: isHigh,
      phase: Math.random() * Math.PI * 2,
      phaseSpeed: 0.2 + Math.random() * 0.4,
      life: 0,
      maxLife: 800 + Math.random() * 600,
      birth: performance.now() / 1000
    };
    systems.push(sys);
  }
}

function getWind(x, y, t) {
  let wx = 0, wy = 0;
  // Large-scale gradient (westerlies)
  wx += 0.6 + noise(x / 1200 + t * 0.02, y / 800 + t * 0.01) * 0.3;
  wy += noise(x / 1000 + t * 0.015, y / 600 + t * 0.025) * 0.2;
  // Systems
  for (const s of systems) {
    const dx = x - s.x, dy = y - s.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < s.radius * 3) {
      const r = s.radius;
      const infl = Math.exp(-dist * dist / (2 * r * r));
      const spin = s.isHigh ? 1 : -1;
      // Tangential wind
      wx += spin * (-dy / (dist + 1)) * s.strength * infl * s.phaseSpeed;
      wy += spin * (dx / (dist + 1)) * s.strength * infl * s.phaseSpeed;
      // Radial (inflow/outflow)
      const rad = s.isHigh ? 1 : -1;
      wx += rad * dx / (dist + 1) * 15 * infl;
      wy += rad * dy / (dist + 1) * 15 * infl;
    }
  }
  // Noise perturbation
  wx += noise(x / 300 + t * 0.05, y / 300 + t * 0.03) * 0.4;
  wy += noise(x / 300 + t * 0.03, y / 300 + t * 0.05) * 0.4;
  return [wx, wy];
}

/* ==================== TEMPERATURE ==================== */
let tempField = null;

function initTempField() {
  tempField = new ImageData(256, 256);
  const d = tempField.data;
  for (let y = 0; y < 256; y++) {
    for (let x = 0; x < 256; x++) {
      const lat = 1 - y / 256;
      const base = lat * 60 - 20;
      const n = noise(x / 40, y / 40) * 15;
      const val = Math.max(0, Math.min(255, (base + n + 20) | 0));
      const idx = (y * 256 + x) * 4;
      d[idx] = val; d[idx + 1] = val; d[idx + 2] = val; d[idx + 3] = 255;
    }
  }
}

function getTemp(x, y, t) {
  const sx = (x / W) * 256, sy = (y / H) * 256;
  const ix = Math.max(0, Math.min(255, sx | 0));
  const iy = Math.max(0, Math.min(255, sy | 0));
  const idx = (iy * 256 + ix) * 4;
  return tempField.data[idx];
}

function tempToColor(t) {
  // Blue -> Cyan -> Green -> Yellow -> Red
  if (t < 60) {
    const s = t / 60;
    return `rgb(${s * 80 | 0},${s * 120 + 80 | 0},255)`;
  } else if (t < 120) {
    const s = (t - 60) / 60;
    return `rgb(${80 + s * 100 | 0},${200 + s * 55 | 0},${255 - s * 100 | 0})`;
  } else if (t < 180) {
    const s = (t - 120) / 60;
    return `rgb(${180 + s * 75 | 0},${255 - s * 80 | 0},${155 - s * 155 | 0})`;
  } else {
    const s = (t - 180) / 75;
    return `rgb(${255},${175 - s * 100 | 0},${5 - s * 5 | 0})`;
  }
}

/* ==================== PARTICLES ==================== */
let particles = [];
const MAX_PARTICLES = 2500;

function initParticles() {
  particles = [];
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      life: Math.random() * 200,
      maxLife: 150 + Math.random() * 150,
      speed: 0.5 + Math.random() * 1.5,
      trail: []
    });
  }
}

function updateParticles(dt, t) {
  for (const p of particles) {
    const [wx, wy] = getWind(p.x, p.y, t);
    const mag = Math.sqrt(wx * wx + wy * wy) + 0.01;
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 8) p.trail.shift();
    p.x += (wx / mag) * p.speed * 15 * dt;
    p.y += (wy / mag) * p.speed * 15 * dt;
    p.life += dt * 60;
    if (p.life > p.maxLife || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
      // Respawn
      p.x = Math.random() * W;
      p.y = Math.random() * H;
      p.life = 0;
      p.trail = [];
    }
  }
}

function drawParticles() {
  ctx.lineWidth = 0.7;
  for (const p of particles) {
    const lifeRatio = 1 - p.life / p.maxLife;
    const alpha = Math.min(1, lifeRatio * 2) * 0.6;
    if (p.trail.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(p.trail[0].x, p.trail[0].y);
    for (let i = 1; i < p.trail.length; i++) {
      ctx.lineTo(p.trail[i].x, p.trail[i].y);
    }
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.stroke();
  }
}

/* ==================== RAIN BANDS ==================== */
let rainBands = [];

function initRain() {
  rainBands = [];
  for (let i = 0; i < 5; i++) {
    rainBands.push({
      x: Math.random() * W * 2 - W * 0.5,
      y: Math.random() * H,
      angle: -0.3 + Math.random() * 0.6,
      width: 60 + Math.random() * 100,
      length: 200 + Math.random() * 300,
      speed: 30 + Math.random() * 50,
      opacity: 0.03 + Math.random() * 0.06,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawRain(t) {
  ctx.save();
  for (const band of rainBands) {
    const bx = band.x + t * band.speed * 0.3;
    const by = band.y + Math.sin(t * 0.1 + band.phase) * 50;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(band.angle);
    const grad = ctx.createLinearGradient(-band.length / 2, 0, band.length / 2, 0);
    grad.addColorStop(0, `rgba(150,180,220,0)`);
    grad.addColorStop(0.3, `rgba(150,180,220,${band.opacity})`);
    grad.addColorStop(0.7, `rgba(150,180,220,${band.opacity})`);
    grad.addColorStop(1, `rgba(150,180,220,0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(-band.length / 2, -band.width / 2, band.length, band.width);
    ctx.restore();
  }
  ctx.restore();
}

/* ==================== FRONTS ==================== */
let fronts = [];

function initFronts() {
  fronts = [];
  for (let i = 0; i < 3; i++) {
    fronts.push({
      x: Math.random() * W,
      y: Math.random() * H,
      angle: Math.random() * Math.PI,
      speed: 15 + Math.random() * 20,
      length: 200 + Math.random() * 300,
      type: Math.random() > 0.5 ? 'cold' : 'warm',
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawFronts(t) {
  ctx.save();
  for (const f of fronts) {
    const fx = f.x + t * f.speed;
    const fy = f.y + Math.sin(t * 0.05 + f.phase) * 80;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(f.angle);
    const len = f.length;
    if (f.type === 'cold') {
      // Blue line with triangles
      ctx.strokeStyle = '#4488cc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-len / 2, 0);
      ctx.lineTo(len / 2, 0);
      ctx.stroke();
      ctx.fillStyle = '#4488cc';
      const spacing = 25;
      for (let x = -len / 2; x < len / 2; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x - 5, -8);
        ctx.lineTo(x + 5, -8);
        ctx.closePath();
        ctx.fill();
      }
    } else {
      // Red line with semicircles
      ctx.strokeStyle = '#cc4444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-len / 2, 0);
      ctx.lineTo(len / 2, 0);
      ctx.stroke();
      ctx.fillStyle = '#cc4444';
      const spacing = 30;
      for (let x = -len / 2; x < len / 2; x += spacing) {
        ctx.beginPath();
        ctx.arc(x, 0, 6, 0, Math.PI);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ==================== HIGH/LOW LABELS ==================== */
function drawSystemLabels(t) {
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const s of systems) {
    const label = s.isHigh ? 'H' : 'L';
    const color = s.isHigh ? '#cc3333' : '#3366cc';
    ctx.fillStyle = color;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(label, s.x - 8, s.y - 8);
    ctx.font = '10px sans-serif';
    ctx.fillText(s.isHigh ? s.strength.toFixed(0) : s.strength.toFixed(0), s.x + 8, s.y - 8);
  }
}

/* ==================== UPDATE SYSTEMS ==================== */
function updateSystems(t) {
  for (const s of systems) {
    s.x += s.vx * 0.016;
    s.y += s.vy * 0.016;
    s.phase += s.phaseSpeed * 0.016;
    // Wrap
    if (s.x > W + 200) s.x = -200;
    if (s.x < -200) s.x = W + 200;
    if (s.y > H + 200) s.y = -200;
    if (s.y < -200) s.y = H + 200;
  }
}

/* ==================== MAIN LOOP ==================== */
let startTime = performance.now() / 1000;

function draw() {
  const t = (performance.now() / 1000 - startTime);
  const dt = 1 / 60;

  updateSystems(t);
  updateParticles(dt, t);

  // Clear
  ctx.fillStyle = '#1a2a4a';
  ctx.fillRect(0, 0, W, H);

  // Temperature background
  ctx.drawImage(canvas, 0, 0, W, H); // Draw previous frame for trail effect
  ctx.fillStyle = 'rgba(26,42,74,0.15)';
  ctx.fillRect(0, 0, W, H);

  // Draw temperature gradient
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = W;
  tempCanvas.height = H;
  const tempCtx = tempCanvas.getContext('2d');
  const tempImgData = tempCtx.createImageData(W, H);
  for (let y = 0; y < H; y += 4) {
    for (let x = 0; x < W; x += 4) {
      const temp = getTemp(x, y, t);
      const color = tempToColor(temp);
      // Parse rgb
      const m = color.match(/\d+/g);
      const r = +m[0], g = +m[1], b = +m[2];
      for (let dy = 0; dy < 4 && y + dy < H; dy++) {
        for (let dx = 0; dx < 4 && x + dx < W; dx++) {
          const idx = ((y + dy) * W + (x + dx)) * 4;
          tempImgData.data[idx] = r;
          tempImgData.data[idx + 1] = g;
          tempImgData.data[idx + 2] = b;
          tempImgData.data[idx + 3] = 120;
        }
      }
    }
  }
  tempCtx.putImageData(tempImgData, 0, 0);
  ctx.drawImage(tempCanvas, 0, 0);

  // Rain bands
  drawRain(t);

  // Continents
  if (continent) {
    const tempCanvas2 = document.createElement('canvas');
    tempCanvas2.width = 512;
    tempCanvas2.height = 512;
    const tempCtx2 = tempCanvas2.getContext('2d');
    tempCtx2.putImageData(continent, 0, 0);
    ctx.imageSmoothing = true;
    ctx.drawImage(tempCanvas2, 0, 0, W, H);
    // Color land
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(40,70,50,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    // Coastline
    ctx.strokeStyle = 'rgba(100,140,120,0.5)';
    ctx.lineWidth = 1;
    // Simple coastline trace (approximate from the imageData)
    // Draw grid lines
    ctx.strokeStyle = 'rgba(100,140,160,0.15)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += 100) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 100) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  // Wind particles
  drawParticles();

  // Fronts
  drawFronts(t);

  // System labels
  drawSystemLabels(t);

  // Subtle vignette
  const vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.8);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
initFronts();
draw();
</script>
</body>
</html>
