<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Verlet Physics Engine ---
class Point {
    constructor(x, y, radius = 3, mass = 1, pinned = false) {
        this.x = x; this.y = y;
        this.ox = x; this.oy = y;
        this.radius = radius;
        this.mass = mass;
        this.pinned = pinned;
        this.color = '#4fc3f7';
        this.isMeteor = false;
        this.isStructure = false;
        this.isBridge = false;
        this.isBoulder = false;
        this.isBall = false;
    }
}

class Constraint {
    constructor(p1, p2, length, stiffness = 1, visible = true, width = 2, color = null) {
        this.p1 = p1; this.p2 = p2;
        this.length = length || Math.hypot(p2.x - p1.x, p2.y - p1.y);
        this.stiffness = stiffness;
        this.visible = visible;
        this.width = width;
        this.color = color;
    }
}

class PhysicsWorld {
    constructor() {
        this.points = [];
        this.constraints = [];
        this.staticObstacles = []; // {x,y,w,h} or {x,y,r}
        this.gravity = 0.5;
        this.damping = 0.999;
        this.iterations = 8;
    }
    addPoint(p) { this.points.push(p); }
    addConstraint(c) { this.constraints.push(c); }
    addStaticRect(x, y, w, h) { this.staticObstacles.push({type:'rect',x,y,w,h}); }
    addStaticCircle(x, y, r) { this.staticObstacles.push({type:'circle',x,y,r}); }

    reset() {
        this.points = [];
        this.constraints = [];
        this.staticObstacles = [];
    }

    step() {
        const g = this.gravity;
        for (const p of this.points) {
            if (p.pinned) continue;
            const vx = (p.x - p.ox) * this.damping;
            const vy = (p.y - p.oy) * this.damping;
            p.ox = p.x; p.oy = p.y;
            p.x += vx;
            p.y += vy + g;
        }
        for (let i = 0; i < this.iterations; i++) {
            this.solveConstraints();
            this.resolveCollisions();
        }
    }

    solveConstraints() {
        for (const c of this.constraints) {
            const dx = c.p2.x - c.p1.x;
            const dy = c.p2.y - c.p1.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
            const diff = (c.length - dist) / dist * c.stiffness;
            const ox = dx * diff * 0.5;
            const oy = dy * diff * 0.5;
            if (!c.p1.pinned) { c.p1.x -= ox; c.p1.y -= oy; }
            if (!c.p2.pinned) { c.p2.x += ox; c.p2.y += oy; }
        }
    }

    resolveCollisions() {
        const margin = 2;
        for (const p of this.points) {
            if (p.pinned) continue;
            // Ground
            if (p.y > H - margin) { p.y = H - margin; p.oy = p.y; }
            // Walls
            if (p.x < margin) { p.x = margin; p.ox = p.x; }
            if (p.x > W - margin) { p.x = W - margin; p.ox = p.x; }
            // Ceiling
            if (p.y < margin) { p.y = margin; p.oy = p.y; }

            // Static obstacles
            for (const o of this.staticObstacles) {
                if (o.type === 'rect') {
                    const closestX = Math.max(o.x, Math.min(p.x, o.x + o.w));
                    const closestY = Math.max(o.y, Math.min(p.y, o.y + o.h));
                    const dx = p.x - closestX;
                    const dy = p.y - closestY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < p.radius) {
                        if (dist === 0) { p.y -= p.radius + 1; continue; }
                        const nx = dx / dist, ny = dy / dist;
                        const overlap = p.radius - dist;
                        p.x += nx * overlap;
                        p.y += ny * overlap;
                        // Friction/bounce
                        const vxn = (p.x - p.ox);
                        const vyn = (p.y - p.oy);
                        const dot = vxn * nx + vyn * ny;
                        if (dot < 0) {
                            p.ox += nx * dot * 0.3;
                            p.oy += ny * dot * 0.3;
                        }
                    }
                } else if (o.type === 'circle') {
                    const dx = p.x - o.x;
                    const dy = p.y - o.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = p.radius + o.r;
                    if (dist < minDist && dist > 0) {
                        const nx = dx / dist, ny = dy / dist;
                        p.x = o.x + nx * minDist;
                        p.y = o.y + ny * minDist;
                    }
                }
            }
            // Point-point collision
            for (const q of this.points) {
                if (q === p || q.pinned) continue;
                const dx = p.x - q.x;
                const dy = p.y - q.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const minDist = p.radius + q.radius;
                if (dist < minDist && dist > 0.001) {
                    const nx = dx / dist, ny = dy / dist;
                    const overlap = (minDist - dist) * 0.5;
                    if (!p.pinned) { p.x += nx * overlap; p.y += ny * overlap; }
                    if (!q.pinned) { q.x -= nx * overlap; q.y -= ny * overlap; }
                }
            }
        }
    }
}

// --- Demo 1: Staggered Ramps ---
function createDemo1(world) {
    world.gravity = 0.4;
    world.damping = 0.998;

    // Create staggered ramp platforms
    const rampCount = 5;
    const rampColors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db'];

    for (let r = 0; r < rampCount; r++) {
        const rampY = 120 + r * 80;
        const rampLen = W * 0.6;
        const startX = (W - rampLen) / 2 + (r % 2 === 0 ? 30 : -30);
        const dir = r % 2 === 0 ? 1 : -1;

        // Ramp as a series of connected points
        const segments = 12;
        const segLen = rampLen / segments;
        const rampPoints = [];
        for (let i = 0; i <= segments; i++) {
            const px = startX + i * segLen * dir;
            const py = rampY;
            const pp = new Point(px, py, 4, 1, true);
            pp.isStructure = true;
            pp.color = rampColors[r];
            world.addPoint(pp);
            rampPoints.push(pp);
        }
        for (let i = 0; i < rampPoints.length - 1; i++) {
            world.addConstraint(new Constraint(rampPoints[i], rampPoints[i+1], segLen, 1, true, 4, rampColors[r]));
        }

        // Fill ramp surface (truss)
        for (let i = 0; i < rampPoints.length - 1; i++) {
            const pp = rampPoints[i];
            const qp = rampPoints[i+1];
            const midX = (pp.x + qp.x) / 2;
            const midY = (pp.y + qp.y) / 2;
            for (let j = 0; j < 2; j++) {
                const sp = new Point(midX + (j-0.5)*8, midY + 10 + j*6, 2, 1, true);
                sp.isStructure = true;
                sp.color = rampColors[r];
                world.addPoint(sp);
                world.addConstraint(new Constraint(pp, sp, 12, 1, false, 1, rampColors[r]));
                world.addConstraint(new Constraint(qp, sp, 12, 1, false, 1, rampColors[r]));
            }
        }
    }

    // Falling balls
    let ballDelay = 0;
    function spawnBalls() {
        for (let i = 0; i < 15; i++) {
            setTimeout(() => {
                const bx = Math.random() * (W - 100) + 50;
                const ball = new Point(bx, -20 - Math.random() * 100, 8, 1, false);
                ball.isBall = true;
                ball.color = `hsl(${Math.random()*360},70%,60%)`;
                world.addPoint(ball);
            }, ballDelay);
            ballDelay += 200;
        }
    }
    spawnBalls();
}

// --- Demo 2: Flexible Bridge ---
function createDemo2(world) {
    world.gravity = 0.45;
    world.damping = 0.997;

    // Two cliffs
    const cliffW = 80;
    const cliff1X = 30;
    const cliff2X = W - 30 - cliffW;
    const groundY = H - 60;

    // Left cliff
    const cliff1Top = H * 0.35;
    for (let i = 0; i < 8; i++) {
        const cp = new Point(cliff1X + i * 2, cliff1Top - i * 8, 3, 1, true);
        cp.isStructure = true;
        cp.color = '#8B7355';
        world.addPoint(cp);
        if (i > 0) world.addConstraint(new Constraint(cp, world.points[world.points.length-2], 10, 1, false, 1, '#8B7355'));
    }
    world.addStaticRect(cliff1X, cliff1Top - 60, cliffW, H - cliff1Top + 60);

    // Right cliff
    for (let i = 0; i < 8; i++) {
        const cp = new Point(cliff2X + i * 2, cliff1Top - i * 8, 3, 1, true);
        cp.isStructure = true;
        cp.color = '#8B7355';
        world.addPoint(cp);
        if (i > 0) world.addConstraint(new Constraint(cp, world.points[world.points.length-2], 10, 1, false, 1, '#8B7355'));
    }
    world.addStaticRect(cliff2X, cliff1Top - 60, cliffW, H - cliff1Top + 60);

    // Ground
    world.addStaticRect(0, groundY, W, H - groundY);

    // Bridge - rope between cliffs
    const bridgeStart = new Point(cliff1X + cliffW - 5, cliff1Top + 10, 4, 1, true);
    const bridgeEnd = new Point(cliff2X + 5, cliff1Top + 10, 4, 1, true);
    world.addPoint(bridgeStart);
    world.addPoint(bridgeEnd);

    const bridgeSegments = 30;
    const bridgeDist = (bridgeStart.x + bridgeEnd.x) / 2 - (bridgeStart.x - bridgeEnd.x) * 0.5;
    const segLen = Math.abs(bridgeEnd.x - bridgeStart.x) / bridgeSegments;
    const bridgePoints = [bridgeStart];

    for (let i = 1; i < bridgeSegments; i++) {
        const bp = new Point(bridgeStart.x + i * segLen, bridgeStart.y + 40 + Math.sin(i/bridgeSegments * Math.PI) * 30, 2, 1, false);
        bp.isBridge = true;
        world.addPoint(bp);
        bridgePoints.push(bp);
        world.addConstraint(new Constraint(bridgePoints[i-1], bp, segLen, 0.9, true, 2, '#d4a574'));
    }
    world.addConstraint(new Constraint(bridgePoints[bridgeSegments-1], bridgeEnd, segLen, 0.9, true, 2, '#d4a574'));

    // Add sag support cables
    for (let i = 3; i < bridgeSegments - 3; i += 5) {
        const sp = new Point(bridgePoints[i].x, bridgePoints[i].y - 80, 2, 1, true);
        sp.isStructure = true;
        sp.color = '#aaa';
        world.addPoint(sp);
        world.addConstraint(new Constraint(sp, bridgePoints[i], 80, 0.9, true, 1, '#666'));
    }

    // Rolling objects
    function spawnObjects() {
        const types = ['boulder', 'ball', 'box'];
        for (let i = 0; i < 8; i++) {
            setTimeout(() => {
                const side = i % 2 === 0 ? bridgeStart : bridgeEnd;
                const ox = side.x + (side === bridgeStart ? 20 : -20);
                let obj;
                const t = types[i % types.length];
                if (t === 'boulder') {
                    obj = new Point(ox, side.y - 20, 14, 2, false);
                    obj.isBoulder = true;
                    obj.color = '#95a5a6';
                } else if (t === 'ball') {
                    obj = new Point(ox, side.y - 20, 10, 1, false);
                    obj.isBall = true;
                    obj.color = `hsl(${Math.random()*360},70%,60%)`;
                } else {
                    // Box made of 4 points
                    const bx = ox, by = side.y - 20, bs = 12;
                    const p1 = new Point(bx-bs, by-bs, 2, 1, false); p1.isBoulder = true; p1.color = '#e67e22';
                    const p2 = new Point(bx+bs, by-bs, 2, 1, false); p2.isBoulder = true; p2.color = '#e67e22';
                    const p3 = new Point(bx+bs, by+bs, 2, 1, false); p3.isBoulder = true; p3.color = '#e67e22';
                    const p4 = new Point(bx-bs, by+bs, 2, 1, false); p4.isBoulder = true; p4.color = '#e67e22';
                    world.addPoint(p1); world.addPoint(p2); world.addPoint(p3); world.addPoint(p4);
                    world.addConstraint(new Constraint(p1,p2,bs*2,1,true,2,'#e67e22'));
                    world.addConstraint(new Constraint(p2,p3,bs*2,1,true,2,'#e67e22'));
                    world.addConstraint(new Constraint(p3,p4,bs*2,1,true,2,'#e67e22'));
                    world.addConstraint(new Constraint(p4,p1,bs*2,1,true,2,'#e67e22'));
                    world.addConstraint(new Constraint(p1,p3,bs*2.8,1,false,1,'#c0601a'));
                    world.addConstraint(new Constraint(p2,p4,bs*2.8,1,false,1,'#c0601a'));
                    return;
                }
                world.addPoint(obj);
            }, i * 400);
        }
    }
    setTimeout(spawnObjects, 500);
}
