<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typewriter Poet</title>
<style>
  * { margin: 0; padding: 0; overflow: hidden; }
  body { background: #1a0f05; height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="typewriter"></canvas>
<script>
(() => {
  const canvas = document.getElementById('typewriter');
  const ctx = canvas.getContext('2d');

  // Set canvas to full window size
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Word banks for haiku-like generation
  const lines = [
    ["soft rain", "whispers", "on window", "glass"],
    ["old lamp", "flickers", "in the dark", "night"],
    ["coffee cools", "as I", "chase thoughts", "like shadows"],
    ["the cat", "sleeps", "on warm", "typewriter keys"],
    ["pages turn", "of time", "written", "in ink"],
    ["stars blink", "through leaves", "poetry flows", "silent"],
    ["dawn breaks", "slowly", "words drift", "into light"],
    ["footsteps fade", "on stairs", "memory types", "alone"],
    ["moon watches", "paper dreams", "float gently", "away"],
    ["tea grows cold", "yet fingers", "still dance", "on keys"]
  ];

  // Physics constants
  const GRAVITY = 0.6;
  const BOUNCE = -0.7;
  const FRICTION = 0.95;

  // Typewriter state
  let currentLine = 0;
  let currentWordIndex = 0;
  let currentCharIndex = 0;
  const typedLines = [];
  let paperOffsetY = 0;
  let carriageReturnProgress = 0;
  let isCarriageReturning = false;
  let bellFlash = 0;
  let inkDots = [];
  let tearEffect = null;
  let typewriterSoundTimer = 0;
  let lampGlowPhase = 0;

  // Typebar mechanics
  const typebars = [];
  const activeTypebars = [];

  // Character positions on the "paper"
  const lineHeight = 28;
  const charWidth = 14;
  const marginX = 100;
  const marginY = 80;
  const paperWidth = 600;

  function reset() {
    currentLine = 0;
    currentWordIndex = 0;
    currentCharIndex = 0;
    typedLines.length = 0;
    paperOffsetY = canvas.height + 100;
    isCarriageReturning = false;
    carriageReturnProgress = 0;
    bellFlash = 0;
    inkDots.length = 0;
    typebars.length = 0;
    activeTypebars.length = 0;
    typewriterSoundTimer = 0;
    lampGlowPhase = 0;
    tearEffect = null;
  }

  reset();

  function getRandomLine() {
    return lines[Math.floor(Math.random() * lines.length)].slice();
  }

  function getCurrentText() {
    if (typedLines.length === 0 && currentLine === 0) return [];
    const allText = [...typedLines];
    if (currentLine < typedLines.length) {
      // We're re-typing a line
    }
    return allText;
  }

  // Drawing functions
  function drawDeskLamp() {
    lampGlowPhase += 0.02;
    const glowIntensity = 0.7 + 0.3 * Math.sin(lampGlowPhase);
    
    // Lamp base
    const baseX = canvas.width - 200;
    const baseY = canvas.height - 150;
    
    // Lamp glow (soft light effect)
    const gradient = ctx.createRadialGradient(baseX, baseY, 50, baseX, baseY, 400);
    gradient.addColorStop(0, `rgba(255, 220, 120, ${0.15 * glowIntensity})`);
    gradient.addColorStop(0.5, `rgba(255, 165, 0, ${0.08 * glowIntensity})`);
    gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Lamp stand
    ctx.fillStyle = '#4a3518';
    ctx.fillRect(baseX - 5, baseY - 100, 10, 100);
    
    // Lamp arm
    ctx.fillRect(baseX - 60, baseY - 90, 60, 8);
    ctx.fillRect(baseX - 68, baseY - 95, 8, 10);
    
    // Lampshade
    ctx.beginPath();
    ctx.moveTo(baseX - 20, baseY - 100);
    ctx.lineTo(baseX + 20, baseY - 100);
    ctx.lineTo(baseX + 30, baseY - 80);
    ctx.lineTo(baseX - 30, baseY - 80);
    ctx.closePath();
    ctx.fill();
    
    // Bulb
    ctx.fillStyle = '#fffacd';
    ctx.beginPath();
    ctx.arc(baseX, baseY - 85, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPaper() {
    ctx.fillStyle = '#fdf6e3';
    ctx.strokeStyle = '#d4c8a6';
    ctx.lineWidth = 2;
    
    // Paper position accounting for scroll
    const paperX = canvas.width/2 - paperWidth/2;
    const paperY = paperOffsetY;
    
    // Draw paper
    ctx.beginPath();
    ctx.roundRect(paperX, paperY, paperWidth, canvas.height - marginY - 50, 5);
    ctx.fill();
    ctx.stroke();
    
    // Paper texture lines
    ctx.strokeStyle = 'rgba(212, 200, 166, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 30; i++) {
      const y = paperY + 20 + i * 20;
      if (y < paperY + canvas.height - marginY - 70) {
        ctx.beginPath();
        ctx.moveTo(paperX + 20, y);
        ctx.lineTo(paperX + paperWidth - 20, y);
        ctx.stroke();
      }
    }
    
    return paperX;
  }

  function drawText(x, y) {
    ctx.fillStyle = '#332b1f';
    ctx.font = '18px "Courier New", monospace';
    ctx.textBaseline = 'top';
    
    let currentX = x;
    for (let i = 0; i < typedLines.length; i++) {
      const lineText = typedLines[i].join(' ');
      ctx.fillText(lineText, currentX, y + i * lineHeight);
    }
  }

  function drawCurrentChar(x, y, char) {
    ctx.fillStyle = '#332b1f';
    ctx.font = '18px "Courier New", monospace';
    ctx.textBaseline = 'top';
    
    const currentY = y + currentLine * lineHeight;
    const currentLineText = typedLines[currentLine] || [];
    let currentX = x;
    for (let i = 0; i < currentLineText.length; i++) {
      currentX += ctx.measureText(currentLineText[i]).width + 5;
    }
    
    // Slight wobble effect for active character
    const wobbleX = (Math.random() - 0.5) * 2;
    const wobbleY = (Math.random() - 0.5) * 2;
    
    ctx.save();
    ctx.translate(currentX + wobbleX, currentY + wobbleY);
    ctx.fillText(char, 0, 0);
    ctx.restore();
  }

  function drawTypebar() {
    if (activeTypebars.length === 0) return;
    
    const typebar = activeTypebars[0];
    if (!typebar) return;
    
    ctx.save();
    ctx.translate(typebar.x, typebar.y);
    ctx.rotate(typebar.angle);
    
    // Typebar body
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(-2, -1, 4, 30);
    
    // Typebar tip with character
    ctx.fillStyle = '#a0522d';
    ctx.fillRect(-3, 29, 6, 4);
    
    ctx.restore();
  }

  function drawInkImpressions() {
    for (let i = 0; i < inkDots.length; i++) {
      const dot = inkDots[i];
      ctx.fillStyle = `rgba(51, 43, 31, ${dot.alpha})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBell() {
    const bellX = marginX - 20;
    const bellY = marginY + 10;
    
    ctx.fillStyle = '#c9a88f';
    ctx.beginPath();
    ctx.arc(bellX, bellY, 8, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.strokeStyle = '#8b7355';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bellX, bellY, 8, 0, Math.PI * 2);
    ctx.stroke();
    
    // Hammer
    ctx.fillStyle = '#5d4e37';
    const hammerY = bellY - 12 + (bellFlash > 0 ? -3 : 0);
    ctx.fillRect(bellX - 2, hammerY, 4, 10);
  }

  function drawCarriageReturn() {
    if (!isCarriageReturning) return;
    
    const sledX = marginX - 30 + Math.sin(carriageReturnProgress * Math.PI * 4) * 10;
    const sledY = marginY + 20 + currentLine * lineHeight;
    
    // Carriage sled
    ctx.fillStyle = '#5d4e37';
    ctx.fillRect(sledX - 15, sledY - 5, 30, 10);
    
    // Return animation lines
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.2 * (1 - carriageReturnProgress)})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const trailY = sledY + Math.sin(carriageReturnProgress * Math.PI * 4 + i * 0.5) * 8;
      ctx.beginPath();
      ctx.moveTo(sledX - 15, trailY);
      ctx.lineTo(sledX - 25, trailY);
      ctx.stroke();
    }
  }

  function drawTearEffect() {
    if (!tearEffect) return;
    
    for (let i = 0; i < tearEffect.particles.length; i++) {
      const p = tearEffect.particles[i];
      
      ctx.fillStyle = `rgba(253, 246, 227, ${p.alpha})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      
      // Update physics
      p.vx *= 0.98;
      p.vy += GRAVITY * 0.5;
      p.vy *= 0.98;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.005;
      
      if (p.y > canvas.height + 50) {
        p.alpha = 0;
      }
    }
    
    // Remove finished particles
    tearEffect.particles = tearEffect.particles.filter(p => p.alpha > 0);
    
    if (tearEffect.particles.length === 0) {
      tearEffect = null;
      reset();
    }
  }

  function update() {
    // Typewriter sound timer
    if (typewriterSoundTimer > 0) {
      typewriterSoundTimer--;
    }

    // Bell flash
    if (bellFlash > 0) {
      bellFlash -= 0.05;
    }

    // Carriage return animation
    if (isCarriageReturning) {
      carriageReturnProgress += 0.08;
      if (carriageReturnProgress >= 1) {
        isCarriageReturning = false;
        currentLine++;
        if (!typedLines[currentLine]) {
          typedLines[currentLine] = [];
        }
        currentWordIndex = 0;
        currentCharIndex = 0;
      }
    }

    // Update ink dots
    for (let i = inkDots.length - 1; i >= 0; i--) {
      const dot = inkDots[i];
      dot.alpha -= 0.002;
      dot.radius += 0.2;
      if (dot.alpha <= 0) {
        inkDots.splice(i, 1);
      }
    }

    // Update typebars
    for (let i = activeTypebars.length - 1; i >= 0; i--) {
      const tb = activeTypebars[i];
      tb.progress += 0.15;
      if (tb.progress >= 1) {
        activeTypebars.splice(i, 1);
      }
    }

    // Generate a new line if we're starting one
    if (!isCarriageReturning && currentLine === typedLines.length) {
      const lineWords = getRandomLine();
      typedLines[currentLine] = [];
      currentWordIndex = 0;
      currentCharIndex = 0;

      // Occasionally x-strike a word and retype it
      if (Math.random() < 0.2) {
        const wordToStrike = lineWords[Math.floor(Math.random() * lineWords.length)];
        const strikeIndex = lineWords.indexOf(wordToStrike);
        
        // Type the first word before the one to strike
        setTimeout(() => {
          let charsTyped = 0;
          const typeInterval = setInterval(() => {
            if (charsTyped >= wordToStrike.length) {
              clearInterval(typeInterval);
              
              // X-out the word
              setTimeout(() => {
                let strikeChars = 0;
                const strikeInterval = setInterval(() => {
                  if (strikeChars >= wordToStrike.length) {
                    clearInterval(strikeInterval);
                    
                    // Retype the word
                    setTimeout(() => {
                      let retypeChars = 0;
                      const retypeInterval = setInterval(() => {
                        if (retypeChars >= wordToStrike.length) {
                          clearInterval(retypeInterval);
                        } else {
                          typedLines[currentLine].push(wordToStrike[retypeChars]);
                          retypeChars++;
                          if (!isCarriageReturning && !tearEffect) {
                            triggerTypebar();
                          }
                        }
                      }, 200);
                    }, 300);
                  } else {
                    typedLines[currentLine][strikeIndex] = '✗';
                    strikeChars++;
                    if (!isCarriageReturning && !tearEffect) {
                      triggerTypebar();
                    }
                  }
                }, 150);
              }, 200);
            } else {
              typedLines[currentLine].push(wordToStrike[charsTyped]);
              charsTyped++;
              if (!isCarriageReturning && !tearEffect) {
                triggerTypebar();
              }
            }
          }, 200);
        }, 500);
      } else {
        // Normal typing sequence
        let wordIndex = 0;
        const typeNextWord = () => {
          if (wordIndex >= lineWords.length) {
            // Line complete, start carriage return
            setTimeout(() => {
              isCarriageReturning = true;
              carriageReturnProgress = 0;
              bellFlash = 1;
              
              // Check if paper needs to be torn
              if (typedLines.length > 18) {
                createTearEffect();
              } else {
                paperOffsetY -= lineHeight;
                if (paperOffsetY < canvas.height/2 - typedLines.length * lineHeight) {
                  paperOffsetY = canvas.height/2 - typedLines.length * lineHeight;
                }
              }
            }, 500);
            return;
          }
          
          const word = lineWords[wordIndex];
          let charIndex = 0;
          const typeChar = () => {
            if (charIndex >= word.length) {
              typedLines[currentLine].push(' ');
              charIndex++;
              if (!isCarriageReturning && !tearEffect) {
                triggerTypebar();
              }
              setTimeout(typeChar, 200);
            } else {
              typedLines[currentLine].push(word[charIndex]);
              charIndex++;
              if (!isCarriageReturning && !tearEffect) {
                triggerTypebar();
              }
              setTimeout(typeChar, 200);
            }
          };
          setTimeout(typeChar, wordIndex > 0 ? 400 : 200);
          wordIndex++;
        };
        setTimeout(typeNextWord, 300);
      }
    }

    // Scroll paper down when new line is added
    if (paperOffsetY > marginY) {
      paperOffsetY = Math.max(marginY, paperOffsetY - 1);
    }
  }

  function triggerTypebar() {
    const typebar = {
      x: canvas.width/2,
      y: marginY + currentLine * lineHeight,
      angle: Math.random() * 0.3 - 0.15,
      progress: 0
    };
    activeTypebars.push(typebar);
    
    // Add ink impression
    const inkX = canvas.width/2 + (typedLines[currentLine] || []).length * 7;
    const inkY = marginY + currentLine * lineHeight + 5;
    inkDots.push({
      x: inkX + (Math.random() - 0.5) * 10,
      y: inkY + (Math.random() - 0.5) * 10,
      alpha: 0.6 + Math.random() * 0.3,
      radius: 1 + Math.random() * 2
    });
  }

  function createTearEffect() {
    tearEffect = { particles: [] };
    const paperX = canvas.width/2 - paperWidth/2;
    const paperY = paperOffsetY;
    
    for (let i = 0; i < 50; i++) {
      tearEffect.particles.push({
        x: paperX + Math.random() * paperWidth,
        y: paperY + Math.random() * 100,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 2,
        size: 4 + Math.random() * 8,
        alpha: 0.8 + Math.random() * 0.2
      });
    }
    
    // Reset typed lines but keep the scroll
    typedLines.length = 0;
    paperOffsetY = canvas.height + 100;
  }

  function render() {
    // Clear canvas
    ctx.fillStyle = '#1a0f05';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Draw desk lamp lighting
    drawDeskLamp();
    
    // Draw paper
    const paperX = drawPaper();
    
    // Draw text
    drawText(paperX + 30, paperOffsetY + 20);
    
    // Draw current line text
    if (!isCarriageReturning && currentLine < typedLines.length) {
      const lineText = typedLines[currentLine] || [];
      if (lineText.length > 0) {
        drawCurrentChar(paperX + 30, paperOffsetY + 20, lineText[lineText.length - 1]);
      }
    }
    
    // Draw ink impressions
    drawInkImpressions();
    
    // Draw typebar
    drawTypebar();
    
    // Draw bell
    drawBell();
    
    // Draw carriage return sled
    drawCarriageReturn();
    
    // Draw tear effect
    drawTearEffect();
    
    // Draw typewriter base
    ctx.fillStyle = '#3e2a17';
    ctx.fillRect(marginX - 30, canvas.height - 100, paperWidth + 60, 30);
    
    // Keys
    drawKeys();
  }

  function drawKeys() {
    const keyRowY = canvas.height - 120;
    const keyWidth = 30;
    const keyHeight = 20;
    
    for (let i = 0; i < 20; i++) {
      const keyX = marginX + i * (keyWidth + 5);
      ctx.fillStyle = typewriterSoundTimer > 0 && i % 3 === 0 ? '#ffd700' : '#5d4e37';
      ctx.strokeStyle = '#3e301f';
      ctx.lineWidth = 1;
      ctx.fillRect(keyX, keyRowY, keyWidth, keyHeight);
      ctx.strokeRect(keyX, keyRowY, keyWidth, keyHeight);
    }
  }

  // Main loop
  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // Start the animation
  loop();
})();
</script>
</body>
</html>
