<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dripping Paint</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cols, rows;
const CELL = 3;
const THRESHOLD = 0.65;

let grid, gridR, gridG, gridB, gridThick, gridWet;
let drips = [];
let spawnTimer = 0;
let whiteOverlay = 0;
let resetting = false;
let resetTimer = 0;
let frameCount = 0;

const PALETTE = [
  [255, 30, 60],
  [255, 140, 0],
  [255, 220, 30],
  [30, 200, 80],
  [30, 120, 255],
  [180, 40, 255],
  [255, 60, 180],
  [0, 200, 200],
  [255, 80, 30],
  [60, 255, 120],
  [255, 50, 120],
  [80, 180, 255],
  [255, 200, 100],
  [200, 50, 255],
  [50, 255, 200],
];

function init() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.ceil(W / CELL);
  rows = Math.ceil(H / CELL);

  gridR = new Float32Array(cols * rows);
  gridG = new Float32Array(cols * rows);
  gridB = new Float32Array(cols * rows);
  gridThick = new Float32Array(cols * rows);
  gridWet = new Float32Array(cols * rows);

  drips = [];
  spawnTimer = 0;
  whiteOverlay = 0;
  resetting = false;
  resetTimer = 0;
  frameCount = 0;
}

function idx(x, y) {
  return y * cols + x;
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

function spawnDrip() {
  const ci = Math.floor(Math.random() * PALETTE.length);
  const c = PALETTE[ci];
  const x = Math.random() * W;
  const radius = 6 + Math.random() * 18;
  const dripsToSpawn = 1 + Math.floor(Math.random() * 3);

  for (let i = 0; i < dripsToSpawn; i++) {
    const ox = (Math.random() - 0.5) * radius * 2;
    drips.push({
      x: x + ox,
      y: -radius,
      vx: (Math.random() - 0.5) * 0.3,
      vy: 0.5 + Math.random() * 1.5,
      r: c[0],
      g: c[1],
      b: c[2],
      radius: radius * (0.5 + Math.random() * 0.5),
      thickness: 0.3 + Math.random() * 0.7,
      wetness: 1.0,
      life: 1.0,
      pooling: false,
      poolTimer: 0,
      branchChance: 0.001 + Math.random() * 0.003,
    });
  }
}

function depositPaint(x, y, r, g, b, thickness, wetness) {
  const gx = Math.floor(x / CELL);
  const gy = Math.floor(y / CELL);
  const spread = Math.max(1, Math.floor(drips[0]?.radius / CELL || 2));

  for (let dy = -spread; dy <= spread; dy++) {
    for (let dx = -spread; dx <= spread; dx++) {
      const nx = gx + dx;
      const ny = gy + dy;
      if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;

      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > spread) continue;

      const falloff = 1 - dist / (spread + 1);
      const amount = thickness * falloff * 0.15;
      const i = idx(nx, ny);

      const oldThick = gridThick[i];
      const newThick = oldThick + amount;
      const blend = amount / newThick;

      gridR[i] = gridR[i] * (1 - blend) + r * blend;
      gridG[i] = gridG[i] * (1 - blend) + g * blend;
      gridB[i] = gridB[i] * (1 - blend) + b * blend;
      gridThick[i] = newThick;
      gridWet[i] = Math.min(1, gridWet[i] + wetness * amount * 2);
    }
  }
}

function updateDrips() {
  for (let i = drips.length - 1; i >= 0; i--) {
    const d = drips[i];

    const gx = Math.floor(d.x / CELL);
    const gy = Math.floor(d.y / CELL);

    let localThick = 0;
    let sampleCount = 0;
    const sampleR = 2;

    for (let sy = -sampleR; sy <= sampleR; sy++) {
      for (let sx = -sampleR; sx <= sampleR; sx++) {
        const nx = gx + sx;
        const ny = gy + sy;
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
          localThick += gridThick[idx(nx, ny)];
          sampleCount++;
        }
      }
    }
    localThick = sampleCount > 0 ? localThick / sampleCount : 0;

    const speedFactor = 1 / (1 + localThick * 0.8);
    const gravity = 0.08;
    const viscosity = 0.985;

    d.vy = (d.vy + gravity * speedFactor) * viscosity;
    d.vy = Math.min(d.vy, 4);

    if (d.pooling) {
      d.poolTimer++;
      d.vy *= 0.96;
      d.vx *= 0.96;
      if (d.poolTimer > 120 || d.vy < 0.02) {
        d.life -= 0.02;
      }
    }

    if (!d.pooling && localThick > 1.5 && Math.random() < 0.02) {
      d.pooling = true;
    }

    d.x += d.vx;
    d.y += d.vy;

    depositPaint(d.x, d.y, d.r, d.g, d.b, d.thickness * 0.1, d.wetness);

    // Branching
    if (!d.pooling && Math.random() < d.branchChance && d.y > 50) {
      const bx = d.x + (Math.random() - 0.5) * 30;
      const br = Math.floor(Math.random() * PALETTE.length);
      const bc = PALETTE[br];
      drips.push({
        x: bx,
        y: d.y,
        vx: (Math.random() - 0.5) * 1.5,
        vy: d.vy * (0.5 + Math.random() * 0.5),
        r: bc[0],
        g: bc[1],
        b: bc[2],
        radius: d.radius * (0.3 + Math.random() * 0.4),
        thickness: d.thickness * 0.5,
        wetness: d.wetness,
        life: 1.0,
        pooling: false,
        poolTimer: 0,
        branchChance: d.branchChance * 0.5,
      });
    }

    // Dry over time
    d.wetness *= 0.9995;

    // Remove dead drips
    if (d.life <= 0 || d.y > H + 50 || d.x < -50 || d.x > W + 50) {
      drips.splice(i, 1);
    }
  }
}

function updateDrying() {
  for (let i = 0; i < gridThick.length; i++) {
    if (gridWet[i] > 0) {
      gridWet[i] *= 0.9997;
      if (gridWet[i] < 0.01) gridWet[i] = 0;
    }
  }
}

function getCoverage() {
  let count = 0;
  const total = cols * rows;
  const step = 4;
  for (let i = 0; i < total; i += step) {
    if (gridThick[i] > 0.05) count++;
  }
  return count / (total / step);
}

function render() {
  const imgData = ctx.createImageData(W, H);
  const data = imgData.data;

  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const gx = Math.floor(px / CELL);
      const gy = Math.floor(py / CELL);
      if (gx >= cols || gy >= rows) continue;

      const i = idx(gx, gy);
      const thick = gridThick[i];
      const wet = gridWet[i];

      if (thick < 0.01) {
        // White canvas background
        const pi = (py * W + px) * 4;
        data[pi] = 255;
        data[pi + 1] = 255;
        data[pi + 2] = 255;
        data[pi + 3] = 255;
        continue;
      }

      let r = gridR[i];
      let g = gridG[i];
      let b = gridB[i];

      // Drying darkens
      const dryFactor = 1 - wet * 0.4;
      r *= dryFactor;
      g *= dryFactor;
      b *= dryFactor;

      // Glossy highlight on wet paint
      if (wet > 0.3 && thick > 0.2) {
        const gloss = wet * 0.15 * Math.min(thick, 2);
        r += gloss * 255;
        g += gloss * 255;
        b += gloss * 255;
      }

      // Saturation boost for wet paint
      const satBoost = 1 + wet * 0.2;
      const gray = (r + g + b) / 3;
      r = gray + (r - gray) * satBoost;
      g = gray + (g - gray) * satBoost;
      b = gray + (b - gray) * satBoost;

      // Thickness affects opacity and intensity
      const intensity = Math.min(1, thick * 0.5);
      r = 255 + (r - 255) * intensity;
      g = 255 + (g - 255) * intensity;
      b = 255 + (b - 255) * intensity;

      const pi = (py * W + px) * 4;
      data[pi] = clamp(r, 0, 255);
      data[pi + 1] = clamp(g, 0, 255);
      data[pi + 2] = clamp(b, 0, 255);
      data[pi + 3] = 255;
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Draw wet drips on top for extra richness
  for (const d of drips) {
    if (d.wetness < 0.1) continue;
    const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.radius);
    const alpha = d.wetness * d.life * 0.6;
    grad.addColorStop(0, `rgba(${d.r|0},${d.g|0},${d.b|0},${alpha})`);
    grad.addColorStop(0.6, `rgba(${d.r|0},${d.g|0},${d.b|0},${alpha * 0.4})`);
    grad.addColorStop(1, `rgba(${d.r|0},${d.g|0},${d.b|0},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // White overlay for reset
  if (whiteOverlay > 0) {
    ctx.fillStyle = `rgba(255,255,255,${whiteOverlay})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function update() {
  frameCount++;

  if (resetting) {
    resetTimer++;
    whiteOverlay = Math.min(1, resetTimer / 120);
    if (whiteOverlay >= 1) {
      // Reset
      gridR.fill(0);
      gridG.fill(0);
      gridB.fill(0);
      gridThick.fill(0);
      gridWet.fill(0);
      drips = [];
      whiteOverlay = 1;
      resetTimer++;
      if (resetTimer > 180) {
        resetting = false;
        resetTimer = 0;
        whiteOverlay = 0;
      }
    }
    return;
  }

  // Spawn drips
  spawnTimer++;
  const spawnRate = Math.max(3, 20 - drips.length * 0.3);
  if (spawnTimer >= spawnRate) {
    spawnTimer = 0;
    spawnDrip();
  }

  // Also spawn fat drops periodically
  if (frameCount % 90 === 0) {
    spawnDrip();
    spawnDrip();
  }

  updateDrips();
  updateDrying();

  // Check coverage
  if (frameCount % 60 === 0) {
    const coverage = getCoverage();
    if (coverage > THRESHOLD) {
      resetting = true;
      resetTimer = 0;
    }
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', init);
init();
loop();
</script>
</body>
</html>
