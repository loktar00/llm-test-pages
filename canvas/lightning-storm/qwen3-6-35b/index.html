<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Storm</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="stormCanvas"></canvas>
    <script>
        const canvas = document.getElementById('stormCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;
        
        // Storm State
        let lightningIntensity = 0;
        let stormPhase = 0; // 0: quiet, 1: build up, 2: strike
        let nextStrikeTime = 0;
        let strikeTimer = 0;
        
        // Entities
        const clouds = [];
        const rain = [];
        const lightningBolts = [];
        let farmhouse = { x: 0, y: 0, w: 0, h: 0 };
        
        // Configuration
        const CLOUD_COUNT = 15;
        const RAIN_COUNT = 800;
        const MAX_BOLT_DEPTH = 7;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initScene();
        }

        function initScene() {
            // Generate Clouds
            clouds.length = 0;
            for (let i = 0; i < CLOUD_COUNT; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.4),
                    w: 100 + Math.random() * 300,
                    h: 40 + Math.random() * 60,
                    speed: 0.2 + Math.random() * 0.5,
                    opacity: 0.3 + Math.random() * 0.5
                });
            }

            // Generate Rain
            rain.length = 0;
            for (let i = 0; i < RAIN_COUNT; i++) {
                rain.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    speed: 15 + Math.random() * 10,
                    len: 10 + Math.random() * 20,
                    wind: 2 + Math.random() * 2
                });
            }

            // Farmhouse Position (Bottom Left)
            farmhouse.w = 60;
            farmhouse.h = 50;
            farmhouse.x = width * 0.15;
            farmhouse.y = height - farmhouse.h - 20; // Sit on ground level
        }

        // --- Drawing Functions ---

        function drawSky() {
            // Gradient Sky
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#020205');
            grad.addColorStop(0.6, '#101018');
            grad.addColorStop(1, '#151520');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
        }

        function drawGround() {
            // Rolling Plains
            ctx.fillStyle = '#080a08';
            ctx.beginPath();
            ctx.moveTo(0, height);
            
            // Back hill
            ctx.moveTo(0, height * 0.7);
            for(let x=0; x<=width; x+=10) {
                ctx.lineTo(x, height * 0.7 + Math.sin(x * 0.005 + time * 0.0005) * 50);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            // Front hill
            ctx.fillStyle = '#040504';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.moveTo(0, height * 0.85);
            for(let x=0; x<=width; x+=10) {
                ctx.lineTo(x, height * 0.85 + Math.sin(x * 0.002 + time * 0.0002) * 80);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();
        }

        function drawClouds() {
            ctx.save();
            for (let c of clouds) {
                c.x += c.speed;
                if (c.x > width + c.w) c.x = -c.w;

                ctx.fillStyle = `rgba(20, 20, 25, ${c.opacity})`;
                
                // Draw fluffy shape using overlapping circles
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.h/2, 0, Math.PI * 2);
                ctx.arc(c.x + c.w * 0.3, c.y - c.h/4, c.h/1.5, 0, Math.PI * 2);
                ctx.arc(c.x + c.w * 0.6, c.y, c.h/1.8, 0, Math.PI * 2);
                ctx.arc(c.x + c.w * 0.2, c.y + c.h/3, c.h/2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawFarmhouse() {
            // Barn/Shadow
            ctx.fillStyle = '#030303';
            ctx.fillRect(farmhouse.x, farmhouse.y, farmhouse.w, farmhouse.h);
            
            // Roof
            ctx.beginPath();
            ctx.moveTo(farmhouse.x - 5, farmhouse.y);
            ctx.lineTo(farmhouse.x + farmhouse.w / 2, farmhouse.y - 30);
            ctx.lineTo(farmhouse.x + farmhouse.w + 5, farmhouse.y);
            ctx.fillStyle = '#020202';
            ctx.fill();

            // Door
            ctx.fillStyle = '#000';
            ctx.fillRect(farmhouse.x + 20, farmhouse.y + 30, 20, 20);

            // Window (The Lit One)
            // Color depends on lightning intensity
            let brightness = 0.2 + (lightningIntensity * 0.8); // Base dim light + flash
            // Flicker effect
            if (Math.random() > 0.95) brightness *= 0.5;
            
            ctx.fillStyle = `rgba(255, 200, 100, ${brightness})`;
            ctx.shadowColor = `rgba(255, 200, 100, ${brightness})`;
            ctx.shadowBlur = 10 + (lightningIntensity * 20);
            ctx.fillRect(farmhouse.x + 10, farmhouse.y + 10, 10, 10);
            ctx.shadowBlur = 0; // Reset
        }

        function drawRain() {
            ctx.strokeStyle = 'rgba(170, 180, 200, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            for (let r of rain) {
                r.y += r.speed;
                r.x += r.wind; // Wind effect

                if (r.y > height) {
                    r.y = -r.len;
                    r.x = Math.random() * width;
                }

                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x + r.wind * 2, r.y + r.len); // Slant for wind
            }
            ctx.stroke();
        }

        // --- Lightning Logic ---

        function generateBolt(x1, y1, x2, y2, depth, width) {
            if (depth >= MAX_BOLT_DEPTH) return;

            const dx = x2 - x1;
            const dy = y2 - y1;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // Midpoint displacement
            const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * dist * 0.4;
            const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * dist * 0.4;

            // Recursion
            generateBolt(x1, y1, midX, midY, depth + 1, width * 0.7);
            generateBolt(midX, midY, x2, y2, depth + 1, width * 0.7);

            // Draw segment (only at leaf level or specific intervals to avoid visual noise)
            // Actually, let's draw the lines as we recurse back up or just store them.
            // For performance and visual clarity, we draw the lines in a separate pass or use a path.
            // Here, let's just draw.
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(midX, midY);
            ctx.lineTo(x2, y2);
            
            ctx.shadowColor = 'rgba(200, 200, 255, 1)';
            ctx.shadowBlur = 20;
            ctx.lineWidth = width;
            ctx.strokeStyle = `rgba(255, 255, 255, ${1 - depth/MAX_BOLT_DEPTH})`;
            ctx.stroke();
        }

        function createLightningStrike() {
            // Start in clouds
            const startX = Math.random() * width;
            const startY = Math.random() * (height * 0.3);
            
            // Target ground
            const endX = Math.random() * width;
            const endY = height;

            lightningBolts.push({
                startX, startY, endX, endY,
                life: 1.0, // Opacity/Life
                type: 'bolt'
            });

            // Maybe secondary branch
            if (Math.random() > 0.5) {
                 lightningBolts.push({
                    startX: startX + (Math.random()-0.5)*100, 
                    startY: startY + 50, 
                    endX: startX + (Math.random()-0.5)*300, 
                    endY: height * 0.6,
                    life: 0.8,
                    type: 'branch'
                });
            }
        }

        function drawLightning() {
            // Flash background
            if (lightningIntensity > 0.1) {
                ctx.fillStyle = `rgba(200, 200, 255, ${lightningIntensity * 0.15})`;
                ctx.fillRect(0, 0, width, height);
            }

            // Draw Bolts
            for (let i = lightningBolts.length - 1; i >= 0; i--) {
                const bolt = lightningBolts[i];
                bolt.life -= 0.05; // Fade out speed

                if (bolt.life <= 0) {
                    lightningBolts.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalCompositeOperation = 'lighter'; // Additive blending for glow
                
                // Draw the bolt path using recursive generation
                // We generate a temporary path visually
                generateBolt(bolt.startX, bolt.startY, bolt.endX, bolt.endY, 0, bolt.type === 'bolt' ? 4 : 2);
                
                ctx.restore();
            }
        }

        function drawSheetLightning() {
            // Occasional flash within the cloud layer
            if (Math.random() > 0.98 && stormPhase > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createRadialGradient(
                    Math.random() * width, height * 0.2, 10,
                    Math.random() * width, height * 0.2, width * 0.5
                );
                grad.addColorStop(0, 'rgba(150, 150, 200, 0.2)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
            }
        }

        // --- Main Loop ---

        function loop() {
            time += 16;
            
            // Storm Logic
            // Wave system: Quiet -> Build up -> Storm -> Quiet
            stormPhase += 0.001;
            const wave = Math.sin(stormPhase); // -1 to 1
            
            // Map wave to intensity (0 to 1)
            // We want a sharp peak (lightning) and a slow buildup
            let targetIntensity = 0;
            
            if (wave > 0.8) {
                // Storm phase
                targetIntensity = 1.0;
                if (Math.random() < 0.05) { // Chance to strike
                    createLightningStrike();
                }
            } else if (wave > 0) {
                // Build up
                targetIntensity = (wave - 0.8) * 5; // 0 to 1
            } else {
                // Quiet
                targetIntensity = 0;
            }

            // Smooth intensity transition
            lightningIntensity += (targetIntensity - lightningIntensity) * 0.05;

            // Clear
            ctx.clearRect(0, 0, width, height);

            // Draw Layers
            drawSky();
            drawGround();
            drawClouds(); // Behind lightning
            drawFarmhouse();
            drawRain();
            
            drawSheetLightning();
            drawLightning();

            requestAnimationFrame(loop);
        }

        // Init
        window.addEventListener('resize', resize);
        resize();
        loop();

    </script>
</body>
</html>
