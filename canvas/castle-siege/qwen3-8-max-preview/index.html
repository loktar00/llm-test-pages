<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Castle Siege — An Endless Chronicle</title>
<style>
  :root{
    --bone:#e6dcc3; --ember:#e08a3c; --gold:#eec063;
    --display:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
    --body:'Gill Sans','Gill Sans MT','Trebuchet MS','Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b0908}
  body{font-family:var(--body);color:var(--bone)}
  canvas{position:fixed;inset:0;display:block}
  .panel{background:linear-gradient(180deg,rgba(26,20,17,.93),rgba(14,11,9,.93));
    border:1px solid #4a3b2a;border-radius:3px;
    box-shadow:0 2px 10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(224,170,100,.07),inset 0 1px 0 rgba(255,220,170,.06)}
  #brand{position:fixed;top:14px;left:14px;padding:10px 16px 12px;pointer-events:none;z-index:5}
  .b-name{font-family:var(--display);font-variant:small-caps;letter-spacing:.12em;font-size:21px;color:#ecdfc2;text-shadow:0 1px 0 #000}
  .crest{color:var(--ember);text-shadow:0 0 8px rgba(224,138,60,.6)}
  .b-sub{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#9c8a68;margin-top:2px}
  .b-wave{display:flex;align-items:baseline;gap:9px;margin-top:9px;border-top:1px solid rgba(224,170,100,.18);padding-top:7px}
  .b-wl{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#9c8a68}
  #waveNum{font-family:var(--display);font-size:30px;color:var(--ember);line-height:1;text-shadow:0 0 14px rgba(224,138,60,.45)}
  #stats{position:fixed;top:14px;right:14px;padding:10px 14px;width:218px;pointer-events:none;z-index:5}
  .s-row{display:flex;align-items:center;gap:8px;margin:4px 0}
  .s-lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#9c8a68;width:52px}
  .s-num{font-family:var(--display);font-size:16px;color:#ecdfc2;min-width:24px;text-align:right}
  .bar{flex:1;height:7px;background:#080604;border:1px solid #000;box-shadow:inset 0 1px 3px #000;overflow:hidden}
  .bar div{height:100%;width:100%;transition:width .35s ease}
  #wallFill{background:linear-gradient(180deg,#95909f,#5c5664)}
  #gateFill{background:linear-gradient(180deg,#a8703a,#6b431f)}
  #repelBox{position:fixed;left:14px;bottom:14px;padding:10px 16px 12px;width:240px;pointer-events:none;z-index:5}
  .r-label{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#9c8a68}
  .r-pts{display:flex;align-items:baseline;margin:2px 0 4px}
  #repelPts{font-family:var(--display);font-size:34px;color:var(--gold);line-height:1;display:inline-block;text-shadow:0 0 16px rgba(238,192,99,.35)}
  #repelPts.bump{animation:bump .35s ease}
  @keyframes bump{30%{transform:scale(1.35);color:#fff}}
  .r-goal{font-family:var(--display);font-size:13px;color:#9c8a68;margin-left:4px}
  #repelFill{background:linear-gradient(90deg,#7c5a22,#eec063,#7c5a22);background-size:220% 100%;animation:sheen 2.8s linear infinite}
  @keyframes sheen{to{background-position:-220% 0}}
  .r-cap{font-size:10px;letter-spacing:.14em;color:#7c6c50;margin-top:5px;font-style:italic;font-family:var(--display)}
  #banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;text-align:center;padding:0 20px;z-index:6}
  #banner.show{animation:bannerA 3.8s ease forwards}
  @keyframes bannerA{0%{opacity:0;transform:translateY(16px) scale(.97);filter:blur(8px)}14%{opacity:1;transform:none;filter:none}76%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
  #bTitle{font-family:var(--display);font-variant:small-caps;letter-spacing:.16em;font-size:clamp(30px,5.6vw,66px);color:#ecdfc2;text-shadow:0 2px 0 #000,0 0 34px rgba(0,0,0,.8)}
  #banner.red #bTitle{color:#ff7a45;text-shadow:0 2px 0 #1a0500,0 0 40px rgba(255,90,30,.5)}
  #banner.gold #bTitle{color:#f2c96f;text-shadow:0 2px 0 #140c00,0 0 40px rgba(242,190,90,.5)}
  #bSub{margin-top:8px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#c8b489;text-shadow:0 1px 3px #000}
  #chronicle{position:fixed;right:14px;bottom:14px;list-style:none;text-align:right;pointer-events:none;max-width:340px;z-index:5}
  #chronicle li{font-family:var(--display);font-style:italic;font-size:13px;color:#d3c19a;margin:4px 0;animation:chronA 9s ease forwards;text-shadow:0 1px 3px #000,0 0 8px #000}
  @keyframes chronA{0%{opacity:0;transform:translateX(12px)}7%{opacity:.95;transform:none}70%{opacity:.9}100%{opacity:0}}
  #sndBtn{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:7px 18px;font-family:var(--body);font-size:10px;letter-spacing:.26em;color:#c8b489;cursor:pointer;pointer-events:auto;transition:border-color .2s,color .2s;z-index:7}
  #sndBtn:hover{border-color:var(--ember);color:#f0d9a8}
  #hint{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:#8a7a5c;pointer-events:none;white-space:nowrap;animation:hintA 8s ease forwards;z-index:5}
  @keyframes hintA{0%,60%{opacity:.85}100%{opacity:0}}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(4,2,1,.55) 100%),linear-gradient(180deg,rgba(0,0,0,.32),transparent 16%)}
  @media(max-width:760px){#chronicle,#hint{display:none}#stats{width:172px}.b-name{font-size:17px}#repelBox{width:190px}#waveNum{font-size:24px}}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="vig"></div>
<header id="brand" class="panel">
  <div class="b-name"><span class="crest">&#9876;</span> Castle Siege</div>
  <div class="b-sub">an endless chronicle of the wall</div>
  <div class="b-wave"><span class="b-wl">Wave</span><span id="waveNum">I</span></div>
</header>
<aside id="stats" class="panel">
  <div class="s-row"><span class="s-lbl">Wall</span><div class="bar"><div id="wallFill"></div></div></div>
  <div class="s-row"><span class="s-lbl">Gate</span><div class="bar"><div id="gateFill"></div></div></div>
  <div class="s-row"><span class="s-lbl">Horde</span><span class="s-num" id="hordeN">0</span><span class="s-lbl" style="margin-left:auto;width:auto">Garrison</span><span class="s-num" id="garN">0</span></div>
</aside>
<aside id="repelBox" class="panel">
  <div class="r-label">Repel Points</div>
  <div class="r-pts"><span id="repelPts">0</span><span class="r-goal">/ <span id="repelGoal">0</span></span></div>
  <div class="bar"><div id="repelFill"></div></div>
  <div class="r-cap">the garrison's resolve</div>
</aside>
<div id="banner"><div id="bTitle"></div><div id="bSub"></div></div>
<ul id="chronicle"></ul>
<button id="sndBtn" class="panel">SOUND &middot; OFF</button>
<div id="hint">the siege fights itself &mdash; click to wake the war horns</div>

<script>
'use strict';
/* ============ core ============ */
const cvs=document.getElementById('field'),ctx=cvs.getContext('2d');
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function pc(c){if(c[0]==='#'){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255];}const m=c.match(/\d+/g);return[+m[0],+m[1],+m[2]];}
function mix(c1,c2,t){const a=pc(c1),b=pc(c2);return`rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;}
function rgba(c,a){const p=pc(c);return`rgba(${p[0]},${p[1]},${p[2]},${a})`;}
function seg(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function roman(n){const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m){while(n>=v){s+=r;n-=v;}}return s||'I';}

/* ============ themes ============ */
const THEMES=[
 {top:'#20294a',mid:'#5c4660',hor:'#d0814d',ground:'#241c16',hill:'#2a2030',hill2:'#1c1522',rim:'#f2b077',night:0,sun:{x:.16,y:.30,r:26,c:'#ffcf8f',moon:0}},
 {top:'#3c5a78',mid:'#7d97a8',hor:'#c8cbb4',ground:'#2a221a',hill:'#3f4a44',hill2:'#2a322e',rim:'#e8e2c0',night:0,sun:{x:.24,y:.16,r:22,c:'#fff3cf',moon:0}},
 {top:'#241a3a',mid:'#71364a',hor:'#d4622f',ground:'#221a14',hill:'#33202e',hill2:'#211420',rim:'#ff9a55',night:.25,sun:{x:.12,y:.42,r:34,c:'#ff8a4a',moon:0}},
 {top:'#070b1e',mid:'#16223f',hor:'#2c3f5c',ground:'#15110e',hill:'#131a28',hill2:'#0c111c',rim:'#8fa8d8',night:1,sun:{x:.78,y:.14,r:16,c:'#e8efff',moon:1}}
];
let themeFrom=THEMES[3],themeTo=THEMES[0],themeT=1;
function tcol(p){return mix(themeFrom[p],themeTo[p],themeT);}
function tnum(p){return lerp(themeFrom[p],themeTo[p],themeT);}
function blendTheme(){const o={sun:{}};for(const k of['top','mid','hor','ground','hill','hill2','rim'])o[k]=mix(themeFrom[k],themeTo[k],themeT);
 o.night=tnum('night');o.sun.x=lerp(themeFrom.sun.x,themeTo.sun.x,themeT);o.sun.y=lerp(themeFrom.sun.y,themeTo.sun.y,themeT);
 o.sun.r=lerp(themeFrom.sun.r,themeTo.sun.r,themeT);o.sun.c=mix(themeFrom.sun.c,themeTo.sun.c,themeT);
 o.sun.moon=themeT<.5?themeFrom.sun.moon:themeTo.sun.moon;return o;}

/* ============ layout / state ============ */
let W,H,u,DPR,groundY,wallX,wallT,wallTopY,wallH,rowH,gateH,keepX,keepW,keepTop,courtX;
const blockRows=8;let blocks=[];
let attackers=[],defenders=[],arrows=[],stones=[],debris=[],parts=[],corpses=[],scars=[],floaters=[],stuck=[],oil=[],fires=[];
let engines={rams:[],towers:[],cats:[]};
let queue=[],wave=0,phase='idle',phaseT=0,repelPts=0,repelGoal=1;
let time=0,last=0,timeScale=1,shake=0,shakeX=0,shakeY=0;
let volleyA=1,volleyD=2,lastEvt=0;
let repairList=[],gateRepairAt=0,gateDone=true,defReviveAt=1e9;
let gate={hp:12,max:12,shake:0};
let stars=[],clouds=[],specks=[],tufts=[];
const G=()=>1350*u;

function layout(){
  const ow=W,oh=H;
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  u=clamp(Math.min(W/1280,H/780),.68,1.35);
  groundY=H*.868;
  wallX=W*.72;
  wallT=30*u;
  wallH=Math.min(H*.44,400*u);
  wallTopY=groundY-wallH;
  rowH=wallH/blockRows;
  gateH=rowH*1.55;
  keepX=wallX+wallT+46*u;keepW=120*u;keepTop=wallTopY-90*u;
  courtX=wallX+wallT;
  if(ow){const rx=W/ow,ry=H/oh;
    for(const list of[attackers,defenders,arrows,stones,debris,parts,corpses,scars,floaters,stuck,oil,fires])
      for(const e of list){e.x*=rx;e.y*=ry;}
    for(const e of engines.rams)e.x*=rx;
    for(const e of engines.cats)e.x*=rx;
    for(const e of engines.towers){e.x*=rx;e.h=wallH+26*u;}
  }
}
function initScenery(){
  stars=[];for(let i=0;i<110;i++)stars.push({x:Math.random(),y:Math.random(),s:rand(.7,1.8),tw:rand(1,3),ph:rand(0,TAU),a:rand(.4,1)});
  clouds=[];for(let i=0;i<6;i++)clouds.push({x:rand(0,W),y:rand(H*.06,H*.3),s:rand(40,90)*u,sp:rand(3,9)});
  specks=[];for(let i=0;i<160;i++)specks.push({x:rand(0,W),y:groundY+rand(4,Math.max(8,H-groundY-4)),s:rand(1,2.4),c:pick(['#3a2f24','#171208','#463a2b'])});
  tufts=[];for(let i=0;i<14;i++)tufts.push({x:rand(0,W),n:irand(3,5)});
}
function resetWall(){blocks=[];for(let r=0;r<blockRows;r++)blocks.push({r,hp:4,max:4,flash:0});}

/* ============ audio ============ */
let AC=null,master=null,muted=true;const lastSfx={};
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);}catch(e){}}
addEventListener('pointerdown',()=>initAudio(),{capture:true});
function tone(f0,f1,dur,type,vol,delay){const t0=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
 o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);}
function noiseS(dur,ftype,freq,vol,delay){const t0=AC.currentTime+(delay||0);const len=Math.floor(AC.sampleRate*dur);
 const buf=AC.createBuffer(1,len,AC.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const n=AC.createBufferSource();n.buffer=buf;const f=AC.createBiquadFilter();f.type=ftype;f.frequency.value=freq;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
 n.connect(f);f.connect(g);g.connect(master);n.start(t0);}
function sfx(name){if(!AC||muted)return;const n=performance.now();
 if(lastSfx[name]&&n-lastSfx[name]<110)return;lastSfx[name]=n;
 switch(name){
  case'horn':tone(174,160,1.2,'sawtooth',.15);tone(262,240,1.2,'sawtooth',.1,.06);noiseS(1.1,'lowpass',500,.04);break;
  case'hornWin':tone(262,262,.5,'sawtooth',.12);tone(392,392,.8,'sawtooth',.12,.18);break;
  case'hornLose':tone(196,150,1.4,'sawtooth',.14);tone(147,110,1.6,'sawtooth',.1,.1);break;
  case'bow':noiseS(.07,'bandpass',1800,.22);tone(600,180,.08,'triangle',.1);break;
  case'thud':tone(110,38,.22,'sine',.5);noiseS(.12,'lowpass',300,.3);break;
  case'crash':noiseS(.35,'lowpass',900,.4);tone(90,30,.3,'sine',.4);break;
  case'clang':tone(900,700,.09,'square',.1);tone(1400,1000,.07,'square',.07,.01);break;
  case'sizzle':noiseS(.28,'highpass',3200,.12);break;
  case'whoosh':noiseS(.25,'bandpass',700,.18);break;
 }}

/* ============ chronicle / banner ============ */
const chron=$('chronicle'),bannerEl=$('banner'),bT=$('bTitle'),bS=$('bSub');
function event(txt){const n=performance.now();if(n-lastEvt<700)return;lastEvt=n;
 const li=document.createElement('li');li.textContent=txt;chron.prepend(li);
 while(chron.children.length>5)chron.lastChild.remove();
 setTimeout(()=>{if(li.parentNode)li.remove();},9200);}
function showBanner(t,s,tone_){bT.textContent=t;bS.textContent=s;
 bannerEl.className='';void bannerEl.offsetWidth;bannerEl.className='show '+(tone_||'');}
const WAVE_SUBS=['the horde gathers on the ridge','no parley \u00b7 no quarter','drums beat beneath the hills',
 'the engines creak and groan','banners unfurl against the sky','the king\'s wolves come again',
 'arrows will blot the sun','the wall has stood a hundred years'];

/* ============ units ============ */
function mkUnit(team,kind,x,opts){
 return Object.assign({team,kind,x,y:groundY+rand(-2,2)*u,dir:team==='A'?1:-1,
  hp:team==='A'?3:4,maxhp:team==='A'?3:4,state:'march',t:rand(0,9),ph:rand(0,TAU),
  tx:null,cover:0,drawT:0,nextShot:1e9,atkT:0,dead:false,hurt:0,swing:0,aim:null,
  size:26*u,yOff:0,onWall:false,engine:null,slot:0,pouring:false,pourT:0,cheerT:0,spawnA:1},opts||{});
}
function damage(t,d,killer){if(t.dead)return;t.hp-=d;t.hurt=.22;if(t.hp<=0){t.dead=true;kill(t,killer);}}
function kill(t,killer){
 corpses.push({x:t.x,y:t.y,team:t.team,dir:t.dir,size:t.size,t:0,
  lying:!t.onWall,rot:rand(-.4,.4),vr:rand(-4,4),
  vx:t.onWall?rand(-90,-30):rand(-15,15),vy:t.onWall?rand(-140,-60):0});
 if(corpses.length>70)corpses.shift();
 puff(t.x,t.y-t.size*.5,5,'blood');
 if(t.team==='A'&&killer==='D'){
   repelPts=Math.min(repelGoal,repelPts+1);
   floaters.push({x:t.x,y:t.y-t.size-6*u,txt:'+1',life:1.2,col:'#f4c76a'});
   if(Math.random()<.12)event(pick(['Another assailant falls','The wall drinks its due','A red cloak hits the mud']));
 } else if(t.team==='D'){
   event(pick(['A defender falls from the wall','The garrison bleeds','A blue cloak lies still']));
 }
 if(t.engine){const alive=attackers.some(a=>!a.dead&&a.engine===t.engine);
  if(!alive)event(t.engine.type==='ram'?'The ram crew is slain \u2014 the engine stands silent':
   t.engine.type==='tower'?'The tower crew falls \u2014 the engine halts':'A catapult crew is cut down');}
}

/* ============ waves ============ */
function startWave(n){
 wave=n;phase='muster';phaseT=0;
 attackers.length=0;arrows.length=0;stones.length=0;queue=[];oil.length=0;
 engines={rams:[],towers:[],cats:[]};
 repelPts=0;volleyA=rand(1,2);volleyD=rand(1.5,2.5);
 themeFrom=blendTheme();themeTo=THEMES[(n-1)%THEMES.length];themeT=0;
 defenders.length=0;buildDefenders();
 const total=Math.min(14+n*5,46);
 const nArch=Math.min(3+n,9);
 const ramCrew=6,towerPush=5;
 const nCats=Math.min(1+Math.floor((n-1)/2),3);
 const nSword=Math.max(2,total-nArch-ramCrew-towerPush);
 let t=.2;
 for(let i=0;i<nCats;i++){const cx=70*u+i*95*u;queue.push({t,f:()=>spawnCat(cx)});t+=.15;}
 queue.push({t,f:()=>spawnRam(150*u)});t+=.1;
 queue.push({t,f:()=>spawnTower(300*u)});t+=.1;
 for(let i=0;i<ramCrew;i++)queue.push({t:t+i*.12,f:()=>queueCrew('ram')});
 t+=ramCrew*.12;
 for(let i=0;i<towerPush;i++)queue.push({t:t+i*.12,f:()=>queueCrew('tower')});
 t+=towerPush*.12;
 for(let i=0;i<nArch;i++)queue.push({t:t+i*.14,f:()=>spawnAttacker('archer')});
 t+=nArch*.14;
 for(let i=0;i<nSword;i++)queue.push({t:t+i*.16,f:()=>spawnAttacker('sword')});
 const totalSpawned=nCats*2+ramCrew+towerPush+nArch+nSword;
 repelGoal=Math.ceil(totalSpawned*.78);
 gate.max=gate.hp=Math.min(12+n*2,26);gate.shake=0;
 showBanner('WAVE '+roman(n),pick(WAVE_SUBS),'wave');
 sfx('horn');
 event('Wave '+roman(n)+' \u2014 '+totalSpawned+' assailants on the ridge');
}
function buildDefenders(){
 const nA=Math.min(3+Math.floor(wave/2),7);
 const nS=Math.min(3+Math.floor(wave/3),6);
 const nP=wave>=5?2:1;
 for(let k=0;k<nA;k++){const d=mkUnit('D','archer',wallX+wallT*.55+rand(-6,6)*u,{y:wallTopY+rand(-2,2)*u,onWall:true,state:'shoot'});d.dir=-1;defenders.push(d);}
 for(let k=0;k<2;k++){const d=mkUnit('D','archer',keepX+keepW*(.3+.4*k),{y:keepTop,onWall:true,state:'shoot',tower:true});d.dir=-1;defenders.push(d);}
 for(let k=0;k<nS;k++){const d=mkUnit('D','spear',wallX+wallT*.5+rand(-8,8)*u,{y:wallTopY+rand(-2,2)*u,onWall:true,state:'stand'});d.dir=-1;defenders.push(d);}
 for(let k=0;k<nP;k++){const d=mkUnit('D','pour',wallX+wallT*(.35+k*.3),{y:wallTopY+rand(-2,2)*u,onWall:true,state:'stand'});d.dir=-1;defenders.push(d);}
}
function spawnAttacker(kind){
 const a=mkUnit('A',kind,-30);
 if(kind==='archer')a.tx=clamp(rand(wallX-560*u,wallX-300*u),30*u,wallX-160*u);
 else a.tx=rand(wallX-140*u,wallX-40*u);
 attackers.push(a);
}

             {x:wallX+wallT*.5,y:wallTopY+30*u,s:16*u,life:99});

function beginRepair(){

 gateRepairAt=.3+i*.28+.2;gateDone=gate.hp>=gate.max;defReviveAt=1.2;
 for(const a of attackers)if(!a.dead)a.state='retreat';

}
function runRepair(){

  puff(wallX+wallT*.5,wallTopY+(r.b.r+.5)*rowH,6,'dust');sfx('thud');}}
 if(!gateDone&&phaseT>=gateRepairAt){gateDone=true;gate.hp=gate.max;puff(wallX+wallT*.4,groundY-gateH*.5,8,'dust');}
 if(phaseT>=defReviveAt){defReviveAt=1e9;
  for(const d of defenders)if(d.dead){d.dead=false;d.hp=d.maxhp;d.spawnA=0;d.state=d.kind==='archer'?'shoot':'stand';d.nextShot=1e9;d.cheerT=0;}}
}

   else e.log=10*u;

 }

     if(e.left===0)e.flag=0;}
   }
  }
 }
 for(const e of engines.cats){

  if(e.state==='load'){

  }else if(e.state==='fire'){

  }else{

function launchStone(e){

 const roll=Math.random();
 if(roll<.18)tx-=rand(50,170)*u;else if(roll<.32)tx+=rand(30,110)*u;
 const sx=e.x,sy=e.y-40*u;
 const T=rand(1.45,1.85),g=G();
 stones.push({x:sx,y:sy,px:sx,py:sy,vx:(tx-sx)/T,vy:(ty-sy-.5*g*T*T)/T,

/* ============ attackers / defenders ============ */
function updAttackers(dt){
 const sp=W*.05;
 for(const a of attackers){
  if(a.dead)continue;
  a.t+=dt;a.drawT=Math.max(0,a.drawT-dt*2.6);a.swing=Math.max(0,a.swing-dt*3.2);
  a.hurt=Math.max(0,a.hurt-dt);
  a.yOff=a.state==='cheer'?Math.abs(Math.sin(a.t*6))*4*u:0;
  switch(a.state){
   case'march':a.ph+=dt*7;a.x+=sp*dt*a.dir;
    if(a.kind==='archer'&&a.x>=a.tx)a.state='shoot';
    else if(a.kind==='sword'&&a.x>=a.tx)a.state='bash';
    break;
   case'toEngine':{const e=a.engine;
    if(!e){a.state='march';a.tx=wallX-60*u;break;}
    const sx=crewSlot(a);
    if(Math.abs(a.x-sx)>4*u){a.ph+=dt*7;a.x+=Math.sign(sx-a.x)*sp*dt;}
    else a.state='push';break;}
   case'push':{const e=a.engine;
    if(e){a.x=crewSlot(a);a.ph+=dt*5;
     if(e.type==='tower'&&e.docked)a.state='bash';}break;}
   case'bash':break;
   case'shoot':if(phase==='assault'&&time>=a.nextShot)fireAttackerArrow(a);break;
   case'wallwalk':a.ph+=dt*7;break;
   case'melee':break;
   case'charge':a.ph+=dt*9;a.x+=sp*1.7*dt;if(a.x>=a.tx)a.state='cheer';break;
   case'retreat':a.ph+=dt*8;a.x-=sp*1.35*dt;if(a.x<-60)a.dead=true;break;
   case'fall':a.vy+=1500*u*dt;a.y+=a.vy*dt;a.x+=a.vx*dt;
    if(a.y>=groundY){a.y=groundY;a.state='retreat';puff(a.x,groundY,3,'dust');}break;
   case'cheer':break;
  }
 }
 attackers=attackers.filter(a=>!a.dead);
}
function updDefenders(dt){
 for(const d of defenders){
  if(d.dead)continue;
  d.t+=dt;d.drawT=Math.max(0,d.drawT-dt*2.6);d.swing=Math.max(0,d.swing-dt*3.2);
  d.hurt=Math.max(0,d.hurt-dt);
  if(d.spawnA<1)d.spawnA=Math.min(1,d.spawnA+dt*1.5);
  if(d.cheerT>0){d.cheerT-=dt;d.yOff=Math.abs(Math.sin(d.t*6))*3*u;}else d.yOff=0;
  if(d.kind==='archer'){if(phase==='assault'&&time>=d.nextShot)fireDefenderArrow(d);}
  else if(d.kind==='pour'){
   const zone=attackers.some(a=>!a.dead&&!a.onWall&&a.x>wallX-120*u&&a.x<wallX+8*u);
   d.pouring=zone&&phase==='assault';
   if(d.pouring){d.pourT-=dt;
    if(d.pourT<=0){d.pourT=.16;
     oil.push({x:d.x-6*u,y:wallTopY+3*u,vx:rand(-80,-20)*u,vy:rand(-30,10),life:2});
     sfx('sizzle');}}
   else d.pourT=0;
  }
 }
}
function melee(dt){
 const wa=attackers.filter(a=>!a.dead&&a.onWall);
 const wd=defenders.filter(d=>!d.dead&&d.onWall);
 for(const a of wa){
  if(a.state==='cheer')continue;
  let best=null,bd=1e9;
  for(const d of wd){if(d.dead)continue;const dd=Math.abs(d.x-a.x);if(dd<bd){bd=dd;best=d;}}
  if(best&&bd<13*u){
   a.state='melee';a.dir=best.x>=a.x?1:-1;
   a.atkT-=dt;if(a.atkT<=0){a.atkT=rand(.5,.7);a.swing=1;damage(best,1,'A');sfx('clang');}
  }else if(best){a.state='wallwalk';a.dir=best.x>a.x?1:-1;a.x+=20*u*dt*a.dir;}
  else a.state='cheer';
 }
 for(const d of wd){
  if(d.dead)continue;
  if(d.kind==='archer')continue;
  let best=null,bd=1e9;
  for(const a of wa){if(a.dead)continue;const dd=Math.abs(a.x-d.x);if(dd<bd){bd=dd;best=a;}}
  if(best&&bd<13*u){d.state='melee';d.dir=best.x>=d.x?1:-1;
   d.atkT-=dt;if(d.atkT<=0){d.atkT=rand(.5,.75);d.swing=1;damage(best,1,'D');sfx('clang');}}
  else if(d.state==='melee')d.state='stand';
 }
}

/* ============ shooting ============ */
function shootArrow(sh,tx,ty,spread,team){
 const sx=sh.x+sh.dir*3*u,sy=sh.y-sh.size*.78;
 const dx=tx-sx,dy=ty-sy;
 const T=clamp(Math.hypot(dx,dy)/(460*u),.6,1.55),g=G();
 arrows.push({x:sx,y:sy,px:sx,py:sy,vx:dx/T+rand(-1,1)*spread,
  vy:(dy-.5*g*T*T)/T+rand(-.6,.6)*spread,team,life:4});
}
function fireAttackerArrow(a){
 const targets=defenders.filter(d=>!d.dead);
 if(!targets.length){a.nextShot=time+1;return;}
 const t=pick(targets);
 a.aim=Math.atan2((t.y-t.size*.6)-(a.y-a.size*.78),t.x-a.x);
 a.drawT=1;
 shootArrow(a,t.x+rand(-30,30)*u,t.y-t.size*.6,26*u,'A');
 a.nextShot=time+9e9;sfx('bow');
}
function fireDefenderArrow(d){
 const foes=attackers.filter(a=>!a.dead);
 if(!foes.length){d.nextShot=time+1;return;}
 let pool=foes.filter(f=>f.state==='push');
 if(!pool.length)pool=foes.filter(f=>f.kind==='archer');
 if(!pool.length)pool=foes;
 const t=pick(pool);
 d.aim=Math.atan2((t.y-t.size*.6)-(d.y-d.size*.78),t.x-d.x);
 d.drawT=1;
 shootArrow(d,t.x+rand(-26,26)*u,t.y-t.size*.6,24*u,'D');
 d.nextShot=time+9e9;sfx('bow');
}
function updArrows(dt){
 const g=G();
 for(const a of arrows){
  a.px=a.x;a.py=a.y;
  a.vy+=g*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;
  if(a.life<=0){a.dead=true;continue;}
  if(a.team==='A'&&a.x>=wallX-2&&a.px<wallX-2&&a.y>wallTopY+3){
   stuck.push({x:wallX-1,y:a.y,ang:Math.atan2(a.vy,a.vx),life:5,max:5});a.dead=true;continue;}
  if(a.y>=groundY){
   if(Math.random()<.55)stuck.push({x:a.x,y:groundY-rand(0,2),ang:Math.atan2(a.vy,a.vx),life:4,max:4});
   else puff(a.x,groundY,2,'dust');
   a.dead=true;continue;}
  const foes=a.team==='A'?defenders:attackers;
  for(const f of foes){
   if(f.dead)continue;
   if(Math.abs(a.x-f.x)<7*u&&a.y>f.y-f.size&&a.y<f.y+2){
    if(f.cover&&Math.random()<f.cover)stuck.push({x:a.x,y:a.y,ang:Math.atan2(a.vy,a.vx),life:2,max:2});
    else{damage(f,1,a.team);puff(a.x,a.y,3,'blood');}
    a.dead=true;break;
   }
  }
 }
 arrows=arrows.filter(a=>!a.dead);
}
function updStones(dt){
 const g=G();
 for(const s of stones){
  s.px=s.x;s.py=s.y;
  s.vy+=g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;s.life-=dt;
  if(s.fire&&Math.random()<.6)parts.push(firePart(s.x,s.y,1));
  if(s.vx>0&&s.px<wallX&&s.x>=wallX&&s.y>wallTopY+2){
   const r=clamp(Math.floor((s.y-wallTopY)/rowH),0,blockRows-1);
   if(blocks[r].hp>0){wallStrike(r,s);s.dead=true;continue;}
  }
  if(s.y>=groundY-2){groundStrike(s);s.dead=true;continue;}
  if(s.life<=0||s.x>W+80)s.dead=true;
 }

function updMissiles(dt){
 for(const o of oil){
  o.vy+=1100*u*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;

 for(const d of debris){

  }

 }
 debris=debris.filter(d=>d.life>0);
 for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;if(p.vr)p.rot+=p.vr*dt;}
 parts=parts.filter(p=>p.life>0);
 if(parts.length>700)parts.splice(0,parts.length-700);
 for(const c of corpses){

 }
 corpses=corpses.filter(c=>c.t<7);
 for(const f of floaters){f.y-=28*u*dt;f.life-=dt;}

 for(const s of stuck)s.life-=dt;

 scars=scars.filter(s=>s.life>0);
 for(const f of fires){
  f.life-=dt*(phase==='repair'?3:1);
  if(Math.random()<.7)parts.push(firePart(f.x+rand(-f.s,f.s)*.4,f.y,f.s/(10*u)));
  if(Math.random()<.25)parts.push({x:f.x+rand(-4,4)*u,y:f.y-6*u,vx:rand(-8,8)*u,vy:rand(-34,-18)*u,g:-14,
   life:rand(1.2,2.2),max:2.2,col:'#5f574d',sz:rand(4,8)*u,grow:1,a0:.22});
 }
 fires=fires.filter(f=>f.life>0);

/* ============ phase machine ============ */
function update(dt){
 themeT=Math.min(1,themeT+dt/2.5);
 for(const c of clouds){c.x+=c.sp*dt;if(c.x>W+160)c.x=-160;}
 phaseT+=dt;

  else if(pose==='bash'){
   const aa=Math.sin(m.t*7)*.5-.3;
   const hx2=shX+Math.cos(aa)*h*.4*dir,hy2=shY+Math.sin(aa)*h*.4+4*u;
   seg(shX,shY+3*u,hx2,hy2);seg(shX,shY+5*u,hx2,hy2+2*u);
   if(!hp_){ctx.strokeStyle='#6a5a48';ctx.lineWidth=2*u;seg(hx2,hy2,hx2+dir*h*.26,hy2-2*u);ctx.strokeStyle=body;ctx.lineWidth=2.4*u;}
  }
  else if(pose==='bow'){
   const a=m.aim||(dir>0?-.6:Math.PI+.6);
   const ca=Math.cos(a),sa=Math.sin(a);
   const bx=shX+ca*h*.4,by=shY+2*u+sa*h*.4;
   const ds=m.drawT||0;
   const nx=shX+ca*h*(.4-.3*ds),ny=shY+2*u+sa*h*(.4-.3*ds);
   seg(shX,shY+3*u,nx,ny);seg(shX,shY+3*u,bx,by);
   if(!hp_){
    const px=-sa,py=ca,bl=h*.3;
    ctx.strokeStyle='#3a2c18';ctx.lineWidth=1.8*u;
    ctx.beginPath();ctx.moveTo(bx+px*bl,by+py*bl);
    ctx.quadraticCurveTo(bx-ca*h*.14,by-sa*h*.14,bx-px*bl,by-py*bl);ctx.stroke();
    ctx.strokeStyle='rgba(220,210,180,.7)';ctx.lineWidth=1*u;
    ctx.beginPath();ctx.moveTo(bx+px*bl,by+py*bl);ctx.lineTo(nx,ny);ctx.lineTo(bx-px*bl,by-py*bl);ctx.stroke();
    if(ds>.15){ctx.strokeStyle='#d8c9a0';ctx.lineWidth=1.4*u;seg(nx,ny,nx+ca*h*.5,ny+sa*h*.5);}
    ctx.strokeStyle=body;ctx.lineWidth=2.4*u;
   }
  }
  else if(pose==='sword'){
   const sw=m.swing||0;
   const aa=-1.9+(sw>0?(1-sw)*2.4:Math.sin(m.t*2.5)*.12);
   const waa=dir>0?aa:Math.PI-aa;
   const hx2=shX+Math.cos(waa)*h*.36,hy2=shY+3*u+Math.sin(waa)*h*.36;
   seg(shX,shY+3*u,hx2,hy2);seg(shX,shY+4*u,shX+dir*h*.2,shY+h*.2);
   if(!hp_){const sa2=waa-.35;
    ctx.strokeStyle='#8f99a8';ctx.lineWidth=2*u;
    seg(hx2,hy2,hx2+Math.cos(sa2)*h*.5,hy2+Math.sin(sa2)*h*.5);
    ctx.strokeStyle=body;ctx.lineWidth=2.4*u;}
  }
  else if(pose==='spear'||pose==='spearIdle'){
   const thrust=m.swing||0;
   const ext=pose==='spear'?(thrust>0?(1-thrust)*.3:0):0;
   const baseA=dir>0?.32:Math.PI-.32;
   const len=h*(.9+ext);
   const hx2=shX+dir*h*.22,hy2=shY+5*u;
   seg(shX,shY+3*u,hx2,hy2);seg(shX,shY+5*u,hx2-dir*2*u,hy2+3*u);
   if(!hp_){
    ctx.strokeStyle='#4a3a26';ctx.lineWidth=2*u;
    const ex=hx2+Math.cos(baseA)*len*.5,ey=hy2+Math.sin(baseA)*len*.5;
    const bx2=hx2-Math.cos(baseA)*len*.5,by2=hy2-Math.sin(baseA)*len*.5;
    seg(bx2,by2,ex,ey);
    ctx.strokeStyle='#a9b2bf';seg(ex,ey,ex+Math.cos(baseA)*h*.14,ey+Math.sin(baseA)*h*.14);
    ctx.strokeStyle=body;ctx.lineWidth=2.4*u;}
  }
  else if(pose==='cheer'){
   const w1=Math.sin(m.t*6)*.3;
   for(const aa of[-2.4+w1,-.7-w1]){const wa=dir>0?aa:Math.PI-aa;
    seg(shX,shY+2*u,shX+Math.cos(wa)*h*.38,shY+2*u+Math.sin(wa)*h*.38);}
  }
  else if(pose==='pour'){seg(shX,shY+3*u,shX-dir*h*.3,shY+h*.12);seg(shX,shY+5*u,shX-dir*h*.28,shY+h*.16);}
  else{
   const s2=moving?Math.sin(m.ph+Math.PI)*.4:Math.sin(m.t*1.3)*.06;
   seg(shX,shY+3*u,shX+Math.sin(s2)*h*.3*dir+dir*2*u,shY+h*.3);
   seg(shX,shY+3*u,shX-Math.sin(s2)*h*.3*dir+dir*2*u,shY+h*.3);
  }
 }
 ctx.strokeStyle=acc;ctx.lineWidth=1.6*u;
 seg(hxx,hy-h*.1,hxx-dir*h*.14,hy-h*.16+Math.sin(m.t*4)*1.2*u);
 ctx.fillStyle=acc;ctx.fillRect(x-1.5*u,hipY-1*u,3*u,3*u);
 ctx.globalAlpha=1;
}
function drawCorpse(c){
 const al=clamp(1-(c.t-4.5)/2.5,0,1);if(al<=0)return;
 const h=c.size;
 ctx.globalAlpha=al;
 const col=c.team==='A'?'#1a1116':'#121722';
 ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.2*u;ctx.lineCap='round';
 if(!c.lying){
  ctx.save();ctx.translate(c.x,c.y-h*.4);ctx.rotate(c.rot);
  seg(0,-h*.28,0,h*.2);
  ctx.beginPath();ctx.arc(0,-h*.36,h*.1,0,TAU);ctx.fill();
  seg(0,h*.2,h*.12,h*.42);seg(0,h*.2,-h*.1,h*.44);
  seg(0,-h*.15,h*.16,h*.05);
  ctx.restore();
 }else{
  const d=c.dir;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(c.x,c.y+1,h*.45,3*u,0,0,TAU);ctx.fill();
  ctx.strokeStyle=col;
  seg(c.x-d*h*.35,c.y-3*u,c.x+d*h*.25,c.y-4*u);
  seg(c.x+d*h*.25,c.y-4*u,c.x+d*h*.45,c.y-2*u);
  seg(c.x,c.y-4*u,c.x+d*h*.1,c.y-1*u);
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(c.x-d*h*.42,c.y-5*u,h*.1,0,TAU);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function draw(){
 ctx.save();ctx.translate(shakeX,shakeY);
 drawSky();
 ridge(H*.60,16*u,.0042,26*u,.0011,tcol('hill'));
 ridge(H*.68,14*u,.006,20*u,.0017,tcol('hill2'));
 drawGround();
 const inside=e=>e.x>wallX+wallT*.5;
 for(const a of attackers)if(!a.dead&&inside(a))drawHumanoid(a);
 for(const c of corpses)if(inside(c))drawCorpse(c);
 drawKeep();
 drawWall();
 const wallUnits=defenders.filter(d=>!d.dead&&d.onWall).concat(attackers.filter(a=>!a.dead&&a.onWall));
 wallUnits.sort((p,q)=>p.x-q.x);
 for(const m of wallUnits)drawHumanoid(m);
 for(const e of engines.cats)drawCat(e);
 for(const e of engines.rams)drawRam(e);
 for(const e of engines.towers)drawTower(e);
 for(const c of corpses)if(!inside(c))drawCorpse(c);
 const groundU=attackers.filter(a=>!a.dead&&!a.onWall&&!inside(a));
 groundU.sort((p,q)=>(p.y-q.y)||(p.x-q.x));
 for(const m of groundU)drawHumanoid(m);
 // projectiles
 for(const s of stuck){
  ctx.globalAlpha=clamp(s.life/s.max,0,1)*.9;
  ctx.strokeStyle='#241a10';ctx.lineWidth=1.5*u;
  seg(s.x-Math.cos(s.ang)*8*u,s.y-Math.sin(s.ang)*8*u,s.x,s.y);}
 ctx.globalAlpha=1;
 for(const a of arrows){
  const an=Math.atan2(a.vy,a.vx),L=9*u;
  ctx.strokeStyle='#241a10';ctx.lineWidth=1.6*u;
  seg(a.x-Math.cos(an)*L,a.y-Math.sin(an)*L,a.x,a.y);
  ctx.strokeStyle=a.team==='A'?'#b0402e':'#d8d2be';ctx.lineWidth=1.2*u;
  const bx=a.x-Math.cos(an)*L,by=a.y-Math.sin(an)*L;
  seg(bx,by,bx-Math.cos(an-.5)*3*u,by-Math.sin(an-.5)*3*u);
  ctx.fillStyle='#0e0a08';ctx.beginPath();ctx.arc(a.x,a.y,1.3*u,0,TAU);ctx.fill();}
 for(const s of stones){
  if(s.fire){ctx.globalCompositeOperation='lighter';
   const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,12*u);
   g.addColorStop(0,'rgba(255,150,50,.5)');g.addColorStop(1,'rgba(255,80,10,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,12*u,0,TAU);ctx.fill();
   ctx.globalCompositeOperation='source-over';}
  ctx.fillStyle='#4a4650';ctx.beginPath();ctx.arc(s.x,s.y,4.5*u,0,TAU);ctx.fill();
  ctx.fillStyle='#6a6570';
  ctx.beginPath();ctx.arc(s.x+Math.cos(s.rot)*1.6*u,s.y+Math.sin(s.rot)*1.6*u,1.4*u,0,TAU);ctx.fill();}
 ctx.globalCompositeOperation='lighter';
 for(const o of oil){
  ctx.fillStyle='#ff9a3c';ctx.beginPath();ctx.arc(o.x,o.y,2.5*u,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,140,40,.35)';ctx.beginPath();ctx.arc(o.x,o.y,5*u,0,TAU);ctx.fill();}
 ctx.globalCompositeOperation='source-over';
 for(const d of debris){
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);
  ctx.globalAlpha=clamp(d.life/3,0,1);
  ctx.fillStyle=d.wood?'#3a2a18':'#3f3a46';
  ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);
  ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.strokeRect(-d.w/2,-d.h/2,d.w,d.h);
  ctx.restore();}
 ctx.globalAlpha=1;
 ctx.globalCompositeOperation='lighter';
 for(const f of fires){
  const fl=.8+Math.sin(time*11+f.x)*.2;
  const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s*3.2*fl);
  g.addColorStop(0,'rgba(255,160,60,.5)');g.addColorStop(1,'rgba(255,80,10,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.s*3.2*fl,0,TAU);ctx.fill();}
 ctx.globalCompositeOperation='source-over';
 for(const p of parts){
  const lf=clamp(p.life/p.max,0,1);
  if(p.kind==='fire'){
   ctx.globalCompositeOperation='lighter';ctx.globalAlpha=lf*.9;
   ctx.fillStyle=lf>.55?'#ffd27a':'#e0661f';
   ctx.beginPath();ctx.arc(p.x,p.y,p.sz*lf+.6,0,TAU);ctx.fill();
   ctx.globalCompositeOperation='source-over';
  }else if(p.kind==='spark'){
   ctx.globalAlpha=lf;ctx.strokeStyle=p.col;ctx.lineWidth=1.4*u;
   seg(p.x,p.y,p.x-p.vx*.03,p.y-p.vy*.03);
  }else if(p.line){
   ctx.globalAlpha=lf;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
   ctx.strokeStyle=p.col;ctx.lineWidth=1.6*u;seg(-p.sz,0,p.sz,0);ctx.restore();
  }else{
   ctx.globalAlpha=lf*(p.a0||.5);ctx.fillStyle=p.col;
   ctx.beginPath();ctx.arc(p.x,p.y,p.sz*(p.grow?(1.8-lf*.8):(.4+lf*.6)),0,TAU);ctx.fill();
  }
 }
 ctx.globalAlpha=1;
 ctx.textAlign='center';
 for(const f of floaters){
  ctx.globalAlpha=clamp(f.life/1.2,0,1);
  ctx.font='700 '+Math.round(13*u)+'px Palatino,Georgia,serif';
  ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;ctx.strokeText(f.txt,f.x,f.y);
  ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);}
 ctx.globalAlpha=1;
 ctx.restore();
}

/* ============ hud ============ */
const ui={wall:$('wallFill'),gate:$('gateFill'),horde:$('hordeN'),gar:$('garN'),
 pts:$('repelPts'),goal:$('repelGoal'),fill:$('repelFill'),wave:$('waveNum')};
let lastPts=-1;
function updateHUD(){
 let hp=0,mx=0;for(const b of blocks){hp+=Math.max(0,b.hp);mx+=b.max;}
 ui.wall.style.width=(hp/mx*100)+'%';
 ui.gate.style.width=(clamp(gate.hp/gate.max,0,1)*100)+'%';
 ui.horde.textContent=attackers.length;
 ui.gar.textContent=defenders.filter(d=>!d.dead).length;
 ui.pts.textContent=repelPts;ui.goal.textContent=repelGoal;
 ui.fill.style.width=clamp(repelPts/repelGoal*100,0,100)+'%';
 if(repelPts!==lastPts){
  if(repelPts>lastPts){const el=ui.pts;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  lastPts=repelPts;}
 ui.wave.textContent=roman(Math.max(1,wave));
}
$('sndBtn').addEventListener('click',e=>{
 initAudio();muted=!muted;
 e.target.innerHTML=muted?'SOUND &middot; OFF':'SOUND &middot; ON';
 if(!muted)sfx('horn');
});

/* ============ main loop ============ */
function frame(ts){
 requestAnimationFrame(frame);
 const t=ts/1000;
 if(!last)last=t;
 let dt=Math.min(.035,t-last);last=t;
 const sdt=dt*timeScale;
 timeScale=lerp(timeScale,1,Math.min(1,dt*2.2));
 time+=sdt;
 update(sdt);
 draw();
 updateHUD();
}
layout();
initScenery();
resetWall();
startWave(1);
addEventListener('resize',()=>{layout();initScenery();});
requestAnimationFrame(frame);
</script>
