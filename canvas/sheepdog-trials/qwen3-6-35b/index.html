<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheepdog Trials</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a3a1a; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Utilities ---
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function normAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

// --- Sheep ---
class Sheep {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = rand(-1, 1); this.vy = rand(-1, 1);
        this.maxSpeed = 2.5;
        this.panicSpeed = 5.5;
        this.fear = 0;
        this.panic = false;
        this.straggler = false;
        this.wobble = rand(0, Math.PI * 2);
        this.size = rand(5, 7);
        this.color = `hsl(${rand(35, 50)}, ${rand(15, 35)}%, ${rand(82, 94)}%)`;
        this.eyeColor = `hsl(${rand(0, 30)}, ${rand(40, 70)}%, ${rand(15, 30)}%)`;
        this.legPhase = rand(0, Math.PI * 2);
    }

    update(sheep, dog, dt) {
        let sepX = 0, sepY = 0, aliVx = 0, aliVy = 0, cohX = 0, cohY = 0;
        let sepCount = 0, aliCount = 0, cohCount = 0;
        let flockCenterX = 0, flockCenterY = 0, flockCount = 0;

        for (let s of sheep) {
            if (s === this) continue;
            let d = dist(this, s);
            if (d < 150) {
                flockCenterX += s.x; flockCenterY += s.y; flockCount++;
                if (d < 30) {
                    let a = angle(s, this);
                    sepX += Math.cos(a) * (30 - d) / 30;
                    sepY += Math.sin(a) * (30 - d) / 30;
                    sepCount++;
                }
                if (d < 80) {
                    aliVx += s.vx; aliVy += s.vy; aliCount++;
                    cohX += s.x; cohY += s.y; cohCount++;
                }
            }
        }

        if (sepCount > 0) { sepX /= sepCount; sepY /= sepCount; }
        if (aliCount > 0) { aliVx /= aliCount; aliVy /= aliCount; }
        if (cohCount > 0) { cohX /= cohCount; cohY /= cohCount; }

        let dx = dog.x - this.x, dy = dog.y - this.y;
        let dDog = Math.hypot(dx, dy);
        let fearRadius = this.panic ? 180 : 120;
        let fearForce = 0;

        if (dDog < fearRadius) {
            fearForce = (1 - dDog / fearRadius) * 6;
            if (dDog < 40) this.panic = true;
        } else {
            this.panic = false;
        }

        let flockDist = flockCount > 0 ? dist(this, { x: flockCenterX / flockCount, y: flockCenterY / flockCount }) : 0;
        this.straggler = flockDist > 120;
        if (this.straggler) this.panic = true;

        let maxSpd = this.panic ? this.panicSpeed : this.maxSpeed;

        let ax = sepX * 2.5 + aliVx * 0.05 + (cohX - this.x) * 0.008 - fearForce * dx / Math.max(dDog, 1);
        let ay = sepY * 2.5 + aliVy * 0.05 + (cohY - this.y) * 0.008 - fearForce * dy / Math.max(dDog, 1);

        // Boundary avoidance
        let margin = 50;
        if (this.x < margin) ax += (margin - this.x) * 0.05;
        if (this.x > W - margin) ax -= (this.x - (W - margin)) * 0.05;
        if (this.y < margin) ay += (margin - this.y) * 0.05;
        if (this.y > H - margin) ay -= (this.y - (H - margin)) * 0.05;

        this.vx += ax * dt;
        this.vy += ay * dt;

        let spd = Math.hypot(this.vx, this.vy);
        if (spd > maxSpd) {
            this.vx = (this.vx / spd) * maxSpd;
            this.vy = (this.vy / spd) * maxSpd;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.wobble += spd * 0.15;
        this.legPhase += spd * 0.3;
        this.fear = Math.min(1, this.fear + fearForce * 0.05);
        this.fear = Math.max(0, this.fear - 0.005);
    }

    draw(ctx) {
        let spd = Math.hypot(this.vx, this.vy);
        let heading = Math.atan2(this.vy, this.vx);
        let wobble = Math.sin(this.wobble) * (spd > 0.5 ? 0.1 : 0.03);

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(heading + wobble);

        // Legs
        let legSpread = this.panic ? 0.6 : 0.3;
        let legSwing = Math.sin(this.legPhase * 3) * legSpread;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        // back legs
        ctx.beginPath(); ctx.moveTo(-this.size * 0.6, -this.size * 0.5); ctx.lineTo(-this.size * 0.9, -this.size * 0.5 - legSwing * this.size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-this.size * 0.6, this.size * 0.5); ctx.lineTo(-this.size * 0.9, this.size * 0.5 + legSwing * this.size); ctx.stroke();
        // front legs
        ctx.beginPath(); ctx.moveTo(this.size * 0.5, -this.size * 0.4); ctx.lineTo(this.size * 0.8, -this.size * 0.4 + legSwing * this.size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(this.size * 0.5, this.size * 0.4); ctx.lineTo(this.size * 0.8, this.size * 0.4 - legSwing * this.size); ctx.stroke();

        // Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 1.1, this.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wool texture
        ctx.fillStyle = `rgba(255,255,255,0.3)`;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(rand(-this.size * 0.5, this.size * 0.5), rand(-this.size * 0.4, this.size * 0.4), rand(1.5, 2.5), 0, Math.PI * 2);
            ctx.fill();
        }

        // Head
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(this.size * 0.9, 0, this.size * 0.45, this.size * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();

        // Face
        ctx.fillStyle = this.eyeColor;
        ctx.beginPath();
        ctx.ellipse(this.size * 1.15, 0, this.size * 0.25, this.size * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.size * 1.05, -this.size * 0.12, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.size * 1.05, this.size * 0.12, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.size * 1.07, -this.size * 0.12, 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.size * 1.07, this.size * 0.12, 0.8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// --- Dog ---
class Dog {
    constructor() {
        this.x = 0; this.y = 0;
        this.vx = 0; this.vy = 0;
        this.state = 'idle';
        this.targetX = 0; this.targetY = 0;
        this.stateTimer = 0;
        this.angle = 0;
        this.size = 10;
        this.legPhase = 0;
        this.tailWag = 0;
        this.color = '#4a3520';
        this.targetGate = null;
        this.circles = 0;
    }

    setTarget(x, y) {
        this.targetX = x;
        this.targetY = y;
    }

    update(sheep, dt, course) {
        this.stateTimer -= dt;
        this.legPhase += 0.15;
        this.tailWag += 0.2;

        let flockCenter = { x: 0, y: 0 };
        let count = 0;
        for (let s of sheep) {
            flockCenter.x += s.x;
            flockCenter.y += s.y;
            count++;
        }
        if (count > 0) {
            flockCenter.x /= count;
            flockCenter.y /= count;
        }

        let flockDist = dist(this, flockCenter);

        switch (this.state) {
            case 'idle':
                this.setTarget(flockCenter.x - 150, flockCenter.y);
                this.state = 'approach';
                break;

            case 'approach':
                if (flockDist < 200) {
                    this.state = 'circle';
                    this.stateTimer = rand(60, 120);
                    this.circles = 0;
                }
                break;

            case 'circle':
                this.circles++;
                let circleAngle = Math.atan2(flockCenter.y - this.y, flockCenter.x - this.x);
                let desiredAngle = circleAngle + (this.circles % 2 === 0 ? Math.PI * 0.7 : -Math.PI * 0.7);
                let radius = 180 + rand(-20, 20);
                this.targetX = flockCenter.x + Math.cos(desiredAngle) * radius;
                this.targetY = flockCenter.y + Math.sin(desiredAngle) * radius;

                if (this.circles > 5 && course.pen && this.isInPenArea(sheep, course.pen)) {
                    this.state = 'celebrate';
                    this.stateTimer = 120;
                    break;
                }

                if (this.stateTimer <= 0 || flockDist < 100) {
                    this.state = 'press';
                    this.stateTimer = rand(80, 150);
                    // Find the direction the flock is moving
                    let flockVx = 0, flockVy = 0;
                    for (let s of sheep) { flockVx += s.vx; flockVy += s.vy; }
                    if (count > 0) {
                        flockVx /= count; flockVy /= count;
                    }
                    let pressAngle = Math.atan2(flockVy, flockVx) + Math.PI;
                    this.targetX = flockCenter.x + Math.cos(pressAngle) * 150;
                    this.targetY = flockCenter.y + Math.sin(pressAngle) * 150;
                }
                break;

            case 'press':
                this.targetX = flockCenter.x + (this.targetX - flockCenter.x) * 0.5;
                this.targetY = flockCenter.y + (this.targetY - flockCenter.y) * 0.5;
                if (this.stateTimer <= 0) {
                    this.state = 'circle';
                    this.stateTimer = rand(60, 120);
                }
                break;

            case 'split':
                let splitDir = Math.atan2(flockCenter.y - this.y, flockCenter.x - this.x);
                this.targetX = flockCenter.x + Math.cos(splitDir + Math.PI * 0.5) * 200;
                this.targetY = flockCenter.y + Math.sin(splitDir + Math.PI * 0.5) * 200;
                if (this.stateTimer <= 0) {
                    this.state = 'circle';
                    this.stateTimer = rand(40, 80);
                }
                break;

            case 'celebrate':
                this.targetX = flockCenter.x;
                this.targetY = flockCenter.y;
                break;

            case 'return':
                this.targetX = this.startX;
                this.targetY = this.startY;
                if (dist(this, { x: this.startX, y: this.startY }) < 30) {
                    this.state = 'idle';
                }
                break;
        }

        let dx = this.targetX - this.x;
        let dy = this.targetY - this.y;
        let d = Math.hypot(dx, dy);
        let spd = this.state === 'celebrate' ? 1 : 4;
        if (d > 1) {
            this.vx += (dx / d) * spd * 0.15 * dt;
            this.vy += (dy / d) * spd * 0.15 * dt;
        }
        let maxSpd = this.state === 'celebrate' ? 1 : 4.5;
        let curSpd = Math.hypot(this.vx, this.vy);
        if (curSpd > maxSpd) {
            this.vx = (this.vx / curSpd) * maxSpd;
            this.vy = (this.vy / curSpd) * maxSpd;
        }
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.angle = Math.atan2(this.vy, this.vx);
    }

    isInPenArea(sheep, pen) {
        let count = 0;
        for (let s of sheep) {
            if (s.x > pen.x && s.x < pen.x + pen.w && s.y > pen.y && s.y < pen.y + pen.h) {
                count++;
            }
        }
        return count > sheep.length * 0.7;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Tail
        let tailWag = Math.sin(this.tailWag * 2) * 0.4;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-this.size * 0.8, 0);
        ctx.quadraticCurveTo(-this.size * 1.3, Math.sin(tailWag) * 6, -this.size * 1.5, Math.sin(tailWag) * 8);
        ctx.stroke();

        // Legs
        let legSwing = Math.sin(this.legPhase * 3) * 0.5;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        // back legs
        ctx.beginPath(); ctx.moveTo(-this.size * 0.5, -this.size * 0.6); ctx.lineTo(-this.size * 0.9, -this.size * 0.6 + legSwing * 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-this.size * 0.5, this.size * 0.6); ctx.lineTo(-this.size * 0.9, this.size * 0.6 - legSwing * 6); ctx.stroke();
        // front legs
        ctx.beginPath(); ctx.moveTo(this.size * 0.4, -this.size * 0.5); ctx.lineTo(this.size * 0.8, -this.size * 0.5 + legSwing * 6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(this.size * 0.4, this.size * 0.5); ctx.lineTo(this.size * 0.8, this.size * 0.5 - legSwing * 6); ctx.stroke();

        // Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 1.2, this.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Darker back stripe
        ctx.fillStyle = '#3a2510';
        ctx.beginPath();
        ctx.ellipse(-this.size * 0.2, 0, this.size * 0.6, this.size * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(this.size * 1.0, 0, this.size * 0.5, this.size * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.fillStyle = '#3a2510';
        ctx.beginPath();
        ctx.ellipse(this.size * 0.8, -this.size * 0.35, this.size * 0.2, this.size * 0.15, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(this.size * 0.8, this.size * 0.35, this.size * 0.2, this.size * 0.15, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(this.size * 1.1, -this.size * 0.15, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.size * 1.1, this.size * 0.15, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.size * 1.15, -this.size * 0.15, 1.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.size * 1.15, this.size * 0.15, 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.ellipse(this.size * 1.45, 0, 2, 1.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

// --- Course ---
class Course {
    constructor() {
        this.gates = [];
        this.pen = null;
        this.paths = [];
        this.generate();
    }

    generate() {
        this.gates = [];
        this.paths = [];
        let margin = 80;

        // Generate a path of gates leading to a pen
        let numGates = randInt(3, 5);
        let startX = rand(margin + 50, W * 0.3);
        let startY = rand(margin + 50, H * 0.3);

        let points = [{ x: startX, y: startY }];
        for (let i = 0; i < numGates; i++) {
            let last = points[points.length - 1];
            let angle = rand(-Math.PI * 0.4, Math.PI * 0.4);
            let len = rand(150, 350);
            let nx = last.x + Math.cos(angle) * len;
            let ny = last.y + Math.sin(angle) * len;
            nx = Math.max(margin, Math.min(W - margin, nx));
            ny = Math.max(margin, Math.min(H - margin, ny));
            points.push({ x: nx, y: ny });
        }

        // Gates at each point
        for (let i = 1; i < points.length; i++) {
            let prev = points[i - 1];
            let curr = points[i];
            let a = angle(prev, curr);
            this.gates.push({
                x: curr.x, y: curr.y,
                angle: a,
                width: rand(60, 100),
                passed: false,
                index: i
            });
        }

        // Pen at the end
        let last = points[points.length - 1];
        let penAngle = angle(points[points.length - 2], last);
        this.pen = {
            x: last.x + Math.cos(penAngle) * 80,
            y: last.y + Math.sin(penAngle) * 80,
            w: rand(100, 160),
            h: rand(80, 130),
            angle: penAngle
        };

        // Worn paths between gates
        for (let i = 0; i < points.length - 1; i++) {
            this.paths.push({
                from: points[i],
                to: points[i + 1],
                width: rand(20, 40)
            });
        }
        if (this.pen) {
            this.paths.push({
                from: points[points.length - 1],
                to: { x: this.pen.x + this.pen.w * 0.5, y: this.pen.y + this.pen.h * 0.5 },
                width: rand(25, 45)
            });
        }
    }

    draw(ctx) {
        // Draw paths
        for (let p of this.paths) {
            ctx.strokeStyle = 'rgba(120, 100, 60, 0.25)';
            ctx.lineWidth = p.width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.from.x, p.from.y);
            ctx.lineTo(p.to.x, p.to.y);
            ctx.stroke();

            // Path edges
            ctx.strokeStyle = 'rgba(90, 75, 45, 0.15)';
            ctx.lineWidth = p.width + 4;
            ctx.beginPath();
            ctx.moveTo(p.from.x, p.from.y);
            ctx.lineTo(p.to.x, p.to.y);
            ctx.stroke();
        }

        // Draw gates
        for (let g of this.gates) {
            ctx.save();
            ctx.translate(g.x, g.y);
            ctx.rotate(g.angle);

            // Gate posts
            ctx.fillStyle = '#5a4a30';
            ctx.fillRect(-g.width / 2 - 4, -4, 8, 8);
            ctx.fillRect(g.width / 2 - 4, -4, 8, 8);

            // Gate markers
            ctx.fillStyle = g.passed ? 'rgba(100, 200, 100, 0.6)' : 'rgba(200, 150, 50, 0.6)';
            ctx.beginPath();
            ctx.arc(-g.width / 2, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(g.width / 2, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            // Gate line (dashed)
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = g.passed ? 'rgba(100, 200, 100, 0.4)' : 'rgba(200, 150, 50, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-g.width / 2, 0);
            ctx.lineTo(g.width / 2, 0);
            ctx.stroke();
            ctx.setLineDash([]);

            // Gate number
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(g.index, 0, -14);

            ctx.restore();
        }

        // Draw pen
        if (this.pen) {
            ctx.save();
            ctx.translate(this.pen.x, this.pen.y);
            ctx.rotate(this.pen.angle);

            // Pen walls
            ctx.strokeStyle = '#6a5a3a';
            ctx.lineWidth = 4;
            ctx.setLineDash([12, 6]);
            ctx.strokeRect(-this.pen.w / 2, -this.pen.h / 2, this.pen.w, this.pen.h);
            ctx.setLineDash([]);

            // Pen corners
            ctx.fillStyle = '#7a6a4a';
            let corners = [
                [-this.pen.w / 2, -this.pen.h / 2],
                [this.pen.w / 2, -this.pen.h / 2],
                [this.pen.w / 2, this.pen.h / 2],
                [-this.pen.w / 2, this.pen.h / 2]
            ];
            for (let [cx, cy] of corners) {
                ctx.beginPath();
                ctx.arc(cx, cy, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Pen label
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('PEN', 0, 0);

            ctx.restore();
        }
    }
}

// --- Grass texture ---
let grassCanvas;
function generateGrass() {
    grassCanvas = document.createElement('canvas');
    grassCanvas.width = W;
    grassCanvas.height = H;
    let gctx = grassCanvas.getContext('2d');

    // Base grass
    gctx.fillStyle = '#3a6b2a';
    gctx.fillRect(0, 0, W, H);

    // Grass variation
    for (let i = 0; i < 15000; i++) {
        let x = rand(0, W);
        let y = rand(0, H);
        let shade = rand(-20, 20);
        let r = 58 + shade;
        let gr = 107 + shade;
        let b = 42 + shade * 0.5;
        gctx.fillStyle = `rgb(${r},${gr},${b})`;
        gctx.fillRect(x, y, rand(1, 3), rand(1, 3));
    }

    // Some lighter patches
    for (let i = 0; i < 30; i++) {
        let x = rand(0, W);
        let y = rand(0, H);
        let r = rand(30, 80);
        let grad = gctx.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, 'rgba(80, 140, 50, 0.3)');
        grad.addColorStop(1, 'rgba(80, 140, 50, 0)');
        gctx.fillStyle = grad;
        gctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
}

// --- Game State ---
let sheep = [];
let dog = new Dog();
let course = new Course();
let celebrationTimer = 0;
let celebrationText = '';
let celebrationAlpha = 0;
let totalSheep = 40;
let frameCount = 0;
let particles = [];

function initGame() {
    generateGrass();
    spawnSheep();
    dog.startX = W * 0.15;
    dog.startY = H * 0.5;
    dog.x = dog.startX;
    dog.y = dog.startY;
}

function spawnSheep() {
    sheep = [];
    let cx = W * rand(0.2, 0.4);
    let cy = H * rand(0.2, 0.4);
    for (let i = 0; i < totalSheep; i++) {
        sheep.push(new Sheep(
            cx + rand(-80, 80),
            cy + rand(-80, 80)
        ));
    }
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: rand(-3, 3),
            vy: rand(-4, 0),
            life: rand(30, 60),
            maxLife: 60,
            color,
            size: rand(2, 5)
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles(ctx) {
    for (let p of particles) {
        let alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function checkGates() {
    for (let g of course.gates) {
        if (g.passed) continue;
        for (let s of sheep) {
            let d = dist(s, g);
            if (d < g.width * 0.4) {
                g.passed = true;
                break;
            }
        }
    }
}

function checkPen() {
    if (!course.pen) return false;
    let count = 0;
    for (let s of sheep) {
        if (s.x > course.pen.x && s.x < course.pen.x + course.pen.w &&
            s.y > course.pen.y && s.y < course.pen.y + course.pen.h) {
            count++;
        }
    }
    return count > sheep.length * 0.7;
}

function celebrate() {
    celebrationTimer = 180;
    celebrationText = ['PENNY!', 'EXCELLENT!', 'NICE WORK!', 'SUPERB!', 'BRILLIANT!'][randInt(0, 4)];
    celebrationAlpha = 1;

    // Confetti
    for (let i = 0; i < 100; i++) {
        addParticles(
            W * rand(0.2, 0.8),
            H * rand(0.2, 0.8),
            `hsl(${rand(0, 360)}, ${rand(60, 100)}%, ${rand(50, 70)}%)`,
            1
        );
    }
}

function resetGame() {
    course = new Course();
    spawnSheep();
    dog.x = dog.startX;
    dog.y = dog.startY;
    dog.state = 'idle';
    dog.stateTimer = 0;
    celebrationTimer = 0;
    celebrationAlpha = 0;
}

// --- Drawing ---
function drawBackground(ctx) {
    if (grassCanvas) {
        ctx.drawImage(grassCanvas, 0, 0);
    }
}

function drawUI(ctx) {
    // Gate progress
    let totalGates = course.gates.length;
    let passedGates = course.gates.filter(g => g.passed).length;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 180, 35);
    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`Gates: ${passedGates}/${totalGates}`, 20, 28);

    // Sheep count
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 50, 180, 30);
    ctx.fillStyle = '#fff';
    ctx.fillText(`Sheep: ${sheep.length}`, 20, 66);

    // Dog state
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 85, 180, 30);
    ctx.fillStyle = '#ffcc00';
    ctx.fillText(`Dog: ${dog.state.toUpperCase()}`, 20, 101);

    // Celebration text
    if (celebrationAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = celebrationAlpha;
        ctx.fillStyle = '#ffdd00';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.strokeText(celebrationText, W / 2, H / 2 - 40);
        ctx.fillText(celebrationText, W / 2, H / 2 - 40);

        ctx.font = '20px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('New course generating...', W / 2, H / 2 + 10);
        ctx.restore();
    }

    // Celebration particles
    drawParticles(ctx);
}

// --- Main Loop ---
function update() {
    frameCount++;

    // Update sheep
    for (let s of sheep) {
        s.update(sheep, dog, 1);
    }

    // Update dog
    dog.update(sheep, 1, course);

    // Check gates
    checkGates();

    // Check pen
    if (checkPen() && celebrationTimer <= 0) {
        celebrate();
    }

    // Celebration timer
    if (celebrationTimer > 0) {
        celebrationTimer--;
        if (celebrationTimer <= 0) {
            celebrationTimer = 120; // Wait before resetting
        }
        if (celebrationTimer <= -60) {
            resetGame();
        }
    }

    // Celebration alpha fade
    if (celebrationAlpha > 0 && celebrationTimer <= 60) {
        celebrationAlpha = Math.max(0, celebrationTimer / 60);
    }

    // Update particles
    updateParticles();
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground(ctx);
    course.draw(ctx);

    // Draw sheep
    for (let s of sheep) {
        s.draw(ctx);
    }

    // Draw dog
    dog.draw(ctx);

    // Draw UI
    drawUI(ctx);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
