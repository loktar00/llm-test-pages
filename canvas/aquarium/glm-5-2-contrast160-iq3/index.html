<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aquarium</title>
<style>
html,body{margin:0;padding:0;overflow:fixed;background:#0a0a0a}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="aq"></canvas>
<script>
const cv=document.getElementById('aq');
const ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+0.999));
const rand=(a,b)=>Math.random()*(b-a)+a;
const choice=arr=>arr[(Math.random()*arr.length)|0];
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t*t*(3-2*t*2)/2<t?Math.pow(t/0.5,2):2-Mh.pow((t-1)/0.5,2);

const GRAVEL_Y=()=>H*0.85;

// ============ LIGHT ripples ============
const ripples=[];
for(let i=0;i<6;i++)ripples.push({x:rand(0,W),y:rand(0,H*0.7),r:rand(0.5,1),phase:rand(0,Math.PI*2),speed:rand(0.0005,0.0012)});

function drawLight(t){
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(const r of ripples){
    r.phase+=r.speed;
    const v=Math.sin(r.phase)*0.5+0.5;
    ctx.beginPath();
    ctx.fillStyle=`rgba(90,230,230,${0.05*v})`;
    ctx.ellipse(r.x,r.y,r*150,r*60,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle=`rgba(130,255,255,${0.03*v})`;
    ctx.ellipse(r.x,r.y,r*105,r*42,0,0,Math.PI*2);
    ctx.fill();
  }
  // Caustic wave bands
  const tcos=t*0.0005;
  for(let i=0;i<H*0.7;i+=8){
    const wave=Math.sin(i*0.02+tcos*40)*30;
    ctx.fillStyle=`rgba(10,40,40,0.04)`;
    ctx.fillRect(wave-50,i,W+100,4);
  }
  ctx.restore();
}

// ============ Plant ============
class Plant{
  constructor(x,y){
    this.x=x;
    this.baseY=y;
    this.height=rand(100,150);
    this.phase=rand(0,Math.PI*2);
    this.swaySpeed=rand(0.005,0.012);
    this.segments=randInt(5,10);
    this.color=choice(['#0a6c28','#0a7a2c','#0a7225','#0a6c20','#0a8a3a']);
    this.thickness=rand(5,11);
  }
  draw(t){
    ctx.save();
    ctx.translate(this.x,this.baseY);
    ctx.fillStyle=this.color;
    const sw=Math.sin(t*this.swaySpeed+this.phase)*0.5;
    ctx.beginPath();
    const segs=this.segments;
    const segH=this.height/segs;
    let prevx=0,prevy=0;
    ctx.moveTo(-this.thickness/2,0);
  const points=[];
  for(let i=0;i<=segs+1;i++){
    const tt=i/segs;
    const yy=-tt*this.height;
    const sway=Math.sin(t*this.swaySpeed+this.phase+tt*1.5)*20*tt*tt;
    points.push({x:sway,y:yy});
  }
  // Draw stem with quadratic curves
  ctx.beginPath();
  ctx.moveTo(points[0].x-this.thickness/2,points[0].y);
  for(let i=1;i<points.length;i++){
    ctx.quadraticCurveTo(points[i-1].x,points[i-1].y,points[i].x,points[i].y);
  }
  ctx.lineTo(points[0].x+this.thickness,points[0].y);
  for(let i=points.length-1;i>=0;i--){
    ctx.lineTo(points[i].x+this.thickness,points[i].y);
  }
  ctx.closePath();
  ctx.fill();
  // Bubbles occasionally
  if(Math.random()<0.001){
    bubbles.push(new Bubble(this.x+rand(-5,5),this.baseY-this.height*0.5));
  }
  ctx.restore();
}
}

// ============ Bubble ============
class Bubble{
  constructor(x,y){
    this.x=x;
    this.y=y;
    this.r=rand(3,9);
    this.vy=rand(-0.5,1.5);
    this.phase=rand(0,Math.PI*2);
    this.life=0;
    this.maxLife=rand(3000,8000);
    this.wobble=rand(0.5,1.5);
    this.swayFreq=rand(0.001,0.003);
  }
  update(dt){
    this.phase+=this.swayFreq*16*dt;
    this.life+=dt;
    this.y-=this.vy*dt*0.06;
    this.x+=Math.sin(this.phase)*this.wobble*0.3;
    return this.y<-10||this.life>this.maxLife;
  }
  draw(){
    const alpha=Math.max(0,Math.min(1,(this.life*0.1)/(this.maxLife*0.1)));
    ctx.beginPath();
    ctx.strokeStyle=`rgba(180,220,255,${0.5*alpha})`;
    ctx.lineWidth=2;
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle=`rgba(180,220,255,${0.15*alpha})`;
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle=`rgba(255,255,255,${0.7*alpha})`;
    ctx.arc(this.x-this.r*0.4,this.y-this.r*0.4,this.r*0.2,0,Math.PI*2);
    ctx.fill();
  }
}

// ============ Crab ============
class Crab{
  constructor(){
    this.x=rand(W*0.3,W*0.7);
    this.y=GRAVEL_Y();
    this.targetX=this.x;
    this.facing=1;
    this.walkPhase=0;
    this.legPhase=0;
    this.bobPhase=rand(0,Math.PI*2);
    this.idleTimer=0;
    this.state='idle';
  }
  update(dt){
    this.legPhase+=dt*0.06;
    this.bobPhase+=dt*0.02;
    if(this.state==='idle'){
      this.idleTimer+=dt;
      if(this.idleTimer>1800){
        this.state='walking';
        this.targetX=this.x+choice([-1,1])*rand(80,150);
        this.targetX=Math.max(W*0.15,Math.min(W*0.85,this.targetX));
        this.facing=Math.sign(this.targetX-this.x)||this.facing;
        this.idleTimer=0;
      }
    }
    if(this.state==='walking'){
      const dx=this.targetX-this.x;
      if(Math.abs(dx)<2){
        this.x=this.targetX;
        this.state='idle';
        this.idleTimer=0;
        this.facing=Math.random()<0.5?-1:1;
      } else {
        this.x+=Math.sign(dx)*0.6;
        this.walkPhase+=dt*0.02;
      }
    }
  }
  draw(){
    const bob=Math.sin(this.bobPhase)*2;
    ctx.save();
    ctx.translate(this.x,this.y+bob);
    ctx.scale(this.facing,1);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0,15,30,7,0,0,Math.PI*2);
    ctx.fill();
    // Body
    ctx.fillStyle='#7a5234';
    ctx.beginPath();
    ctx.ellipse(0,-5,28,10,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#a37852';
    ctx.beginPath();
    ctx.ellipse(0,-7,25,8,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#3a2314';
    ctx.beginPath();
    ctx.ellipse(15,-4,5,5,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#0a0a0a';
    ctx.beginPath();
    ctx.ellipse(17,-3,1.5,1.5,0,0,Math.PI*2);
    ctx.fill();
    // Legs (3 pairs)
    ctx.strokeStyle='#7a5234';
    ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){
      const s=i===0?1:i;
      const legOffset=Math.sin(this.legPhase+i)*3;
      ctx.beginPath();
      ctx.moveTo(-15-i*10,0);
      ctx.lineTo(-15-i*10+legOffset,-2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ============ Fish ============
const SPECIES=[
  {
    name:'goldfish',
    colors:['#ffa500','#ff8c00','#ffd767','#ff7f0c'],
    belly:'#ffe28a',
    size:[20,30],
    speed:[0.6,1.1],
    drawBody:()=>'oval',
    tailStyle:'flowy',
    finStyle:'round',
    scaredFactor:1.2
  },
  {
    name:'angelfish',
    colors:['#ff5f8a','#ff8c00','#ff4070','#ffd0e6','#a3d4ff'],
    belly:'#ffe0f5',
    size:[22,35],
    speed:[0.4,0.6],
    drawBody:()=>'tall',
    tailStyle:'flowy',
    finStyle:'long',
    scaredFactor:2.2
  },
  {
    name:'koi',
    colors:['#fff','#ff8c00','#ff4500','#a3d4ff','#ffd767'],
    belly:'#fff8dc',
    size:[25,40],
    speed:[0.7,1.2],
    drawBody:()=>'oval',
    tailStyle:'flowy',
    finStyle:'long',
    scaredFactor:2.2
  },
  {
    name:'plecosaurus',
    colors:['#3a8c3a','#5acc5a','#aacc5a','#aacc5a','#1a8c1a'],
    belly:'#3a8c3a',
    size:[25,40],
    speed:[0.5,0.7],
    drawBody:()=>'tall',
    tailStyle:'flowy',
    finStyle:'long',
    scaredFactor:0.6
  },
  {
    name:'sharkfish',
    colors:['#a3a3a3','#7a7a7a','#a3a3a3','#a3a3a3','#d2d2d2'],
    belly:'#d2d2d2',
    size:[40,60],
    speed:[0.6,1.4],
    drawBody:()=>'tall',
    tailStyle:'flowy',
    finStyle:'long',
    scaredFactor:1.2
  },
];

class Fish{
  constructor(){
    this.reset();
  }
  reset(){
    const sp=choice(SPECIES);
    this.species=sp;
    this.size=rand(sp.size[0],sp.size[1]);
    this.x=rand(W*0.15,W*0.85);
    this.y=rand(H*0.15,H*GRAVEL_Y()-20);
    this.vx=rand(-1,1)*sp.speed[0];
    this.vy=rand(-1,1)*sp.speed[0];
    this.maxSpeed=sp.speed[1];
    this.maxForce=0.04;
    this.angle=Math.atan2(this.vy,this.vx);
    this.wanderAngle=0;
    this.tailPhase=rand(0,Math.PI*2);
    this.tailSpeed=0.08;
    this.scared=false;
    this.scaredTimer=0;
    this.facing=Math.sign(this.vx)|1;
    this.color1=choice(sp.colors);
    this.color2=choice(sp.colors);
    this.belly=sp.belly;
  }
  wander(dt){
    this.wanderAngle+=rand(-0.3,0.3);
    this.wanderAngle=lerp(this.wanderAngle,0,0.02);
    const desired=Math.cos(this.angle+this.wanderAngle)*this.maxSpeed*0.7;
    const desiredVY=Math.sin(this.angle+this.wanderAngle)*this.maxSpeed*0.7;
    const steerX=desired-this.vx;
    const steerY=desiredVY-this.vy;
    this.vx+=steerX*this.maxForce;
    this.vy+=steerY*this.maxForce;
  }
  avoidWalls(){
    const margin=80;
    const turnForce=0.5;
    if(this.x<margin){
      this.vx+=turnForce*(margin-this.x)/margin;
    }
    if(this.x>W-margin){
      this.vx-=turnForce*(this.x-(W-margin))/margin;
    }
    if(this.y<margin*0.5+10){
      this.vy+=turnForce*(margin*0.5+10-this.y)/(margin*0.5+10);
    }
    if(this.y>GRAVEL_Y()-20){
      this.vy-=turnForce*(this.y-(GRAVELY()-20))/(20);
    }
  }
  scare(){
    this.scared=true;
    this.scaredTimer=180;
    this.vx+=rand(-1,1)*this.maxSpeed*this.species.scaredFactor;
    this.vy+=rand(-1,1)*this.maxSpeed*this.species.scaredFactor*0.5;
  }
  update(dt){
    // Scared state
    if(this.scaredTimer>0){
      this.scaredTimer-=dt;
      this.tailSpeed=0.18;
      this.maxForce=0.08;
      if(this.scaredTimer<10) this.scared=false;
      this.maxForce=0.04;
      this.tailSpeed=0.08;
    }
    this.tailPhase+=this.tailSpeed*dt;
    // Steering
    if(!this.scared){
      this.wander(dt);
    }
    this.avoidWalls();
    // Speed limits
    const sp=Math.sqrt(this.vx*this.vx+this.vy*this.vy);
    const max=this.scared?this.maxSpeed*this.species.scaredFactor:this.maxSpeed;
    if(sp>max){
      this.vx*=max/sp;
      this.vy*=max/sp;
    }
    if(sp<max*0.4){
      const factor=Math.sqrt(max*0.4/sp);
      this.vx*=factor;
      this.vy*=factor;
    }
    // Update position
    this.x+=this.vx*dt*0.1;
    this.y+=this.vy*dt*0.1;
    // Update angle smoothly
    const targetAngle=Math.atan2(this.vy,this.vx);
    const da=targetAngle-this.angle;
    let nda=da;
    if(nda>Math.PI) nda-=Math.PI*2;
    if(nda<-Math.PI) nda+=Math.PI*2;
    this.angle+=nda*0.2;
    // Update facing
    if(Math.abs(this.angle)<0.3||Math.abs(this.angle)>Math.PI-0.3){
      this.facing=Math.sign(Math.cos(this.angle))||this.facing;
    }
  }
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);
    ctx.scale(this.facing,1);
    const s=this.size;
    // Tail wagging
    const tailWag=Math.sin(this.tailPhase)*0.3;
    // Body shape
    ctx.fillStyle=this.color1;
    ctx.beginPath();
    if(this.species.drawBody()=='oval'){
      ctx.ellipse(0,0,s,s*0.5,0,0,Math.PI*2);
    } else {
      // tall body
      ctx.ellipse(0,0,s*0.4,s*0.8,0,0,Math.PI*2);
    }
    ctx.fill();
    // Tail
    ctx.fillStyle=this.color2;
    ctx.beginPath();
    const tx=-s*1.5;
    const tw=s*0.6;
    const tailWagY=tailWag*s*0.5;
    ctx.moveTo(-s,0);
    ctx.quadraticCurveTo(tx+Math.cos(tailWag)*s*0.5,0+Math.sin(tailWag)*s*0.5,tx,tailWagY);
    ctx.lineTo(tx,tailWagY+tw*0.5);
    ctx.lineTo(-s,0);
    ctx.quadraticCurveTo(tx+Math.cos(tailWag)*s*0.5,0+Math.sin(tailWag)*s*0.5,tx,tailWagY);
    ctx.lineTo(tx,tailWagY-tw*0.5);
    ctx.lineTo(-s,0);
    ctx.closePath();
    ctx.fill();
    // Belly
    ctx.fillStyle=this.belly;
    ctx.beginPath();
    ctx.ellipse(s*0.3,0,s*0.4,s*0.25,0,0,Math.PI*2);
    ctx.fill();
    // Fins
    if(this.species.finStyle=='long'){
      ctx.fillStyle=this.color2;
      ctx.beginPath();
      ctx.ellipse(s*0.5,-s*0.6,s*0.4,s*0.3,0,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ============ Init ============
const fishies=[];
const COUNT=18;
for(let i=0;i<COUNT;i++){
  fishies.push(new Fish());
}
const plants=[];
for(let i=0;i<8;i++){
  plants.push(new Plant(rand(W*0.5,W*0.95),GRAVEL_Y()));
}
const crab=new Crab();
const bubbles=[];
// Bubbler
const bubbler={x:W*0.75,y:GRAVEL_Y()-10,timer:0};
bubbler.timer=0;

// ============ Main loop ============
let lastTime=performance.now();
function frame(t){
  const dt=Math.min(t-lastTime,33);
  lastTime=t;
  // Background
  ctx.fillStyle='#0a1a3a';
  ctx.fillRect(0,0,W,H);
  // Gradient water
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#3a4c5a');
  grad.addColorStop(0.5,'#3a5c5a');
  grad.addColorStop(1,'#a3a4a5');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  // Light ripples
  drawLight(t);
  // Gravel
  ctx.fillStyle='#5a5a5a';
  ctx.beginPath();
  ctx.moveTo(0,GRAVEL_Y());
  ctx.lineTo(W,GRVEL_Y());
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();
  // Gravel pebbles
  ctx.fillStyle='#3a3a3a';
  for(let i=0;i<25;i++){
    const x=(i*W/25)+rand(-20,20);
    const y=GRAVEL_Y()+rand(0,30);
    ctx.beginPath();
    ctx.ellipse(x,y,rand(5,15),rand(5,15),0,0,Math.PI*2);
    ctx.fill();
  }
  // Plants
  for(const p of plants) p.draw(t);
  // Crab
  crab.update(dt);
  crab.draw();
  // Bubbler
  bubbler.timer+=dt;
  if(bubbler.timer>15000/Math.max(1,bubbles.length*0.1+1)){
    bubbles.push(new Bubble(bubbler.x+rand(-5,5),bubbler.y);
    bubbler.timer=0;
  }
  // Bubbles
  for(let i=bubbles.length-1;i>=0;i--){
    if(bubbles[i].update(dt)) bubbles.splice(i,1);
    bubbles[i].draw();
  }
  // Fish
  for(const f of fishies){
    f.update(dt);
    f.draw();
    // Occidental scare
    if(Math.random()<0.0005){
      f.scare();
    }
  }
  // Frame
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
