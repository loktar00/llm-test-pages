<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Debris Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(0, 255, 200, 0.5);
            font-size: 12px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        SATS: <span id="sat-count">0</span> | FRAGS: <span id="frag-count">0</span> | DRONES: ACTIVE
    </div>
    <canvas id="space"></canvas>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');
        const uiSat = document.getElementById('sat-count');
        const uiFrag = document.getElementById('frag-count');

        let width, height;
        let cx, cy;
        let time = 0;

        // Configuration
        const EARTH_RADIUS = 80;
        const EARTH_X_OFFSET = -100; // Negative to push Earth off-center slightly or keep it in corner
        const EARTH_Y_OFFSET = -100;
        
        // Colors
        const COL_EARTH = '#204060';
        const COL_EARTH_ATMO = '#4080c0';
        const COL_SAT = '#ffffff';
        const COL_FRAG = '#aa8855'; // Debris color
        const COL_DRONE = '#00ffaa';
        const COL_RING = 'rgba(255, 255, 255, 0.05)';
        const COL_DRIFT = 'rgba(255, 255, 255, 0.02)';

        // State
        let objects = [];
        let drones = [];
        
        // Initialize
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width + EARTH_X_OFFSET;
            cy = height + EARTH_Y_OFFSET;
        }
        window.addEventListener('resize', resize);
        resize();

        // Utility
        const dist = (x1, y1, x2, y2) => Math.sqrt((x1-x2)**2 + (y1-y2)**2);
        const rand = (min, max) => Math.random() * (max - min) + min;

        // Classes
        class OrbitalObject {
            constructor(radius, isFragment = false, parentVel = 0) {
                this.radius = radius; // Orbit radius from earth center
                
                // Speed calculation: closer = faster (Kepler-ish)
                // Base speed 0.02, scale by distance inverse
                const baseSpeed = 4000 / (radius * radius); 
                this.speed = (isFragment ? parentVel : 0) + baseSpeed;
                if (this.speed < 0.002) this.speed = 0.002;
                if (this.speed > 0.05) this.speed = 0.05; // Cap max speed

                this.angle = rand(0, Math.PI * 2);
                
                // Visuals
                this.size = isFragment ? rand(1, 2) : rand(1.5, 3);
                this.color = isFragment ? COL_FRAG : COL_SAT;
                this.isFragment = isFragment;
                
                // Position
                this.x = 0;
                this.y = 0;
                
                // Life
                this.life = 1.0; // For fragments
                this.decay = isFragment ? rand(0.001, 0.005) : 0; // Fragments decay
                
                // Glint phase
                this.glintPhase = rand(0, Math.PI * 2);
            }

            update() {
                this.angle += this.speed;
                
                // Calculate position
                this.x = cx + this.radius * Math.cos(this.angle);
                this.y = cy + this.radius * Math.sin(this.angle);

                // Screen bounds check (remove if too far)
                if (this.x < -200 || this.y < -200 || this.x > width + 200 || this.y > height + 200) {
                    // Wrap around logic: If it goes off screen, reset angle to bring it back in
                    this.angle -= this.speed * 2; 
                }

                // Decay fragments
                if (this.isFragment) {
                    this.life -= this.decay;
                }

                return this.life > 0; // Returns false if dead
            }

            draw() {
                ctx.beginPath();
                // Simple glint effect
                const alpha = this.isFragment ? this.life : 1;
                const glint = Math.sin(time * 5 + this.glintPhase);
                
                ctx.globalAlpha = alpha * (0.5 + 0.5 * glint);
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Drone {
            constructor() {
                this.x = rand(0, width);
                this.y = rand(0, height);
                this.speed = 2.5;
                this.target = null;
                this.size = 3;
            }

            findTarget() {
                let closest = null;
                let minDst = Infinity;
                
                // Look for fragments first (safety), then satellites
                const candidates = objects.filter(o => o.isFragment || o.size < 1.5);
                
                for (let obj of candidates) {
                    const d = dist(this.x, this.y, obj.x, obj.y);
                    if (d < minDst) {
                        minDst = d;
                        closest = obj;
                    }
                }
                this.target = closest;
            }

            update() {
                if (!this.target || !objects.includes(this.target)) {
                    this.findTarget();
                }

                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    
                    if (d < this.size + 5) {
                        // Destroy target
                        const idx = objects.indexOf(this.target);
                        if (idx > -1) {
                            objects.splice(idx, 1);
                            // Small visual pop for drone kill
                            createExplosion(this.target.x, this.target.y, COL_DRONE, 2);
                        }
                        this.findTarget(); // Find new target
                    } else {
                        this.x += (dx / d) * this.speed;
                        this.y += (dy / d) * this.speed;
                    }
                } else {
                    // Wander
                    this.x += rand(-1, 1);
                    this.y += rand(-1, 1);
                }
            }

            draw() {
                ctx.fillStyle = COL_DRONE;
                ctx.shadowBlur = 10;
                ctx.shadowColor = COL_DRONE;
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                ctx.shadowBlur = 0;
            }
        }

        // Particle system for collisions
        let particles = [];
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: rand(-2, 2),
                    vy: rand(-2, 2),
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 1.5, 1.5);
            }
            ctx.globalAlpha = 1;
        }

        // Init Scene
        function init() {
            // Create initial satellites
            for (let i = 0; i < 150; i++) {
                // Distribute orbits: closer rings are more dense
                const minR = EARTH_RADIUS + 40;
                const maxR = Math.min(width, height);
                const r = rand(minR, maxR);
                objects.push(new OrbitalObject(r));
            }
            
            // Create drones
            for (let i = 0; i < 3; i++) {
                drones.push(new Drone());
            }
        }

        // Main Loop
        function loop() {
            requestAnimationFrame(loop);
            time += 0.01;

            // Clear with trail effect
            ctx.fillStyle = 'rgba(5, 5, 8, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Draw Earth
            ctx.save();
            ctx.shadowBlur = 40;
            ctx.shadowColor = COL_EARTH_ATMO;
            
            // Atmosphere
            const grad = ctx.createRadialGradient(cx, cy, EARTH_RADIUS * 0.9, cx, cy, EARTH_RADIUS * 1.2);
            grad.addColorStop(0, COL_EARTH);
            grad.addColorStop(0.5, COL_EARTH_ATMO);
            grad.addColorStop(1, 'transparent');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, EARTH_RADIUS * 1.2, 0, Math.PI * 2);
            ctx.fill();
            
            // Core Earth
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#112233';
            ctx.beginPath();
            ctx.arc(cx, cy, EARTH_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw Orbit Rings (Faint)
            ctx.strokeStyle = COL_RING;
            ctx.lineWidth = 0.5;
            // Optimization: Only draw a subset of rings or calculate unique radii
            // For performance, we'll just draw a grid of rings or random rings occasionally
            // To keep it simple but effective, let's draw paths for a few representative orbits
            const uniqueOrbits = new Set();
            objects.forEach(o => uniqueOrbits.add(Math.round(o.radius)));
            
            for (let r of uniqueOrbits) {
                if (r % 50 === 0) { // Only draw every 50px radius to save perf
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // Update & Draw Objects
            let fragCount = 0;
            let satCount = 0;

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                const alive = obj.update();
                
                if (!alive) {
                    objects.splice(i, 1);
                    continue;
                }
                
                obj.draw();
                if (obj.isFragment) fragCount++;
                else satCount++;

                // Collision Detection (Simplified: Check against other objects)
                // To keep performance, we only check nearby objects based on ring
                // Or just a random sampling check if list is huge
                if (Math.random() < 0.05) { // Only check collisions occasionally to save CPU
                    // Pick a random other object
                    const otherIdx = Math.floor(Math.random() * objects.length);
                    if (otherIdx !== i) {
                        const other = objects[otherIdx];
                        // Only collide if radii are close
                        if (Math.abs(obj.radius - other.radius) < 5) {
                            const d = dist(obj.x, obj.y, other.x, other.y);
                            if (d < obj.size + other.size + 2) {
                                // COLLISION!
                                createExplosion((obj.x+other.x)/2, (obj.y+other.y)/2, '#ffaa00', 10);
                                
                                // Remove parents
                                objects.splice(otherIdx, 1, null); // Mark one as null temporarily
                                objects.splice(i, 1, null);
                                i--; // Adjust index
                                continue;

                                // Spawn Fragments
                                const numFragments = Math.floor(rand(5, 15));
                                for (let f = 0; f < numFragments; f++) {
                                    // Perturb orbit slightly
                                    const perturbedRadius = obj.radius + rand(-10, 10);
                                    const frag = new OrbitalObject(perturbedRadius, true, obj.speed);
                                    frag.x = obj.x;
                                    frag.y = obj.y;
                                    // Give them initial velocity relative to orbit
                                    frag.angle = rand(-0.1, 0.1) + obj.angle;
                                    objects.push(frag);
                                }
                            }
                        }
                    }
                }
            }
            
            // Clean up nulls (if logic above left them)
            objects = objects.filter(o => o !== null);

            // Update Drones
            drones.forEach(d => {
                d.update();
                d.draw();
            });

            // Particle System
            updateParticles();
            drawParticles();

            // Replenish Satellites
            if (satCount < 80) {
                const minR = EARTH_RADIUS + 40;
                const maxR = Math.min(width, height);
                objects.push(new OrbitalObject(rand(minR, maxR)));
            }

            // UI Update
            uiSat.innerText = satCount;
            uiFrag.innerText = fragCount;
        }

        init();
        loop();

    </script>
</body>
</html>
