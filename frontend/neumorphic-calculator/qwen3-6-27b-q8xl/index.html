<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neumorphic Calculator</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #dde1e7;
    --shadow-dark: #b8b9be;
    --shadow-light: #ffffff;
    --accent: #6c5ce7;
    --accent-dark: #5a4bd1;
    --accent-light: #8577ed;
    --text-primary: #2d3436;
    --text-secondary: #636e72;
    --text-display: #2d3436;
    --text-operator: #6c5ce7;
    --key-size: 72px;
    --gap: 16px;
    --radius: 20px;
    --shadow-spread: 8px;
    --shadow-blur: 16px;
    --shadow-offset: 4px;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .calculator {
    width: calc(5 * var(--key-size) + 4 * var(--gap) + 48px);
    background: var(--bg);
    border-radius: 32px;
    padding: 24px;
    box-shadow:
      -12px -12px 24px var(--shadow-light),
       12px  12px 24px var(--shadow-dark);
    user-select: none;
  }

  .display-container {
    margin: 0 0 var(--gap) 0;
    padding: 20px 24px;
    border-radius: var(--radius);
    background: var(--bg);
    box-shadow:
      inset -3px -3px 6px var(--shadow-dark),
      inset  3px  3px 6px var(--shadow-light);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
    position: relative;
  }

  .display-expression {
    font-size: 15px;
    color: var(--text-secondary);
    min-height: 22px;
    text-align: right;
    width: 100%;
    letter-spacing: 0.5px;
    transition: color 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .display-value {
    font-size: 42px;
    font-weight: 300;
    color: var(--text-display);
    text-align: right;
    width: 100%;
    letter-spacing: -0.5px;
    transition: font-size 0.15s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, var(--key-size));
    gap: var(--gap);
  }

  .key {
    width: var(--key-size);
    height: var(--key-size);
    border: none;
    border-radius: var(--radius);
    background: var(--bg);
    box-shadow:
      -var(--shadow-offset)px -var(--shadow-offset)px var(--shadow-spread)px var(--shadow-light),
       var(--shadow-offset)px  var(--shadow-offset)px var(--shadow-spread)px var(--shadow-dark);
    color: var(--text-primary);
    font-size: 22px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      box-shadow 0.1s ease,
      transform 0.1s ease,
      background 0.15s ease,
      color 0.15s ease;
    position: relative;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .key:hover {
    transform: scale(1.02);
  }

  .key:active,
  .key.pressed {
    box-shadow:
      inset -var(--shadow-offset)px -var(--shadow-offset)px var(--shadow-spread)px var(--shadow-dark),
      inset  var(--shadow-offset)px  var(--shadow-offset)px var(--shadow-spread)px var(--shadow-light);
    transform: scale(0.95);
  }

  .key.wide {
    grid-column: span 2;
    width: calc(2 * var(--key-size) + var(--gap));
  }

  .key.operator {
    color: var(--text-operator);
    font-size: 24px;
    font-weight: 600;
  }

  .key.equals {
    background: var(--accent);
    color: #ffffff;
    box-shadow:
      -var(--shadow-offset)px -var(--shadow-offset)px var(--shadow-spread)px var(--accent-light),
       var(--shadow-offset)px  var(--shadow-offset)px var(--shadow-spread)px var(--accent-dark);
    font-size: 26px;
    font-weight: 600;
  }

  .key.equals:hover {
    background: var(--accent-light);
  }

  .key.equals:active,
  .key.equals.pressed {
    box-shadow:
      inset -var(--shadow-offset)px -var(--shadow-offset)px var(--shadow-spread)px var(--accent-dark),
      inset  var(--shadow-offset)px  var(--shadow-offset)px var(--shadow-spread)px var(--accent-light);
    background: var(--accent-dark);
  }

  .key.function {
    color: var(--text-secondary);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .key.zero {
    justify-content: flex-start;
    padding-left: 30px;
  }

  @keyframes keyPop {
    0% { transform: scale(0.95); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .key.pop {
    animation: keyPop 0.25s ease forwards;
  }

  @media (max-width: 480px) {
    :root {
      --key-size: 64px;
      --gap: 12px;
    }
    .calculator {
      padding: 18px;
      border-radius: 28px;
    }
    .display-value {
      font-size: 36px;
    }
  }
</style>
</head>
<body>

<div class="calculator" role="application" aria-label="Calculator">
  <div class="display-container">
    <div class="display-expression" id="expression"></div>
    <div class="display-value" id="display">0</div>
  </div>
  <div class="keys">
    <button class="key function" data-action="clear" aria-label="Clear">AC</button>
    <button class="key function" data-action="negate" aria-label="Negate">±</button>
    <button class="key function" data-action="percent" aria-label="Percent">%</button>
    <button class="key operator" data-action="operator" data-value="÷" aria-label="Divide">÷</button>

    <button class="key" data-action="number" data-value="7">7</button>
    <button class="key" data-action="number" data-value="8">8</button>
    <button class="key" data-action="number" data-value="9">9</button>
    <button class="key operator" data-action="operator" data-value="×" aria-label="Multiply">×</button>

    <button class="key" data-action="number" data-value="4">4</button>
    <button class="key" data-action="number" data-value="5">5</button>
    <button class="key" data-action="number" data-value="6">6</button>
    <button class="key operator" data-action="operator" data-value="−" aria-label="Subtract">−</button>

    <button class="key" data-action="number" data-value="1">1</button>
    <button class="key" data-action="number" data-value="2">2</button>
    <button class="key" data-action="number" data-value="3">3</button>
    <button class="key operator" data-action="operator" data-value="+" aria-label="Add">+</button>

    <button class="key wide zero" data-action="number" data-value="0">0</button>
    <button class="key" data-action="decimal" aria-label="Decimal">.</button>
    <button class="key equals" data-action="equals" aria-label="Equals">=</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const display = document.getElementById('display');
  const expression = document.getElementById('expression');
  const keys = document.querySelectorAll('.key');

  let currentInput = '0';
  let previousInput = '';
  let operator = null;
  let shouldResetDisplay = false;
  let lastExpression = '';

  function formatNumber(num) {
    if (num === 'Error') return 'Error';
    const n = parseFloat(num);
    if (isNaN(n)) return '0';
    if (!isFinite(n)) return 'Error';

    const str = num.toString();
    if (str.includes('.') && str.endsWith('0') && !shouldResetDisplay) {
      return str;
    }
    if (str.endsWith('.')) {
      return str;
    }

    if (Math.abs(n) >= 1e15) {
      return n.toExponential(4);
    }

    const parts = str.split('.');
    const intPart = parts[0];
    const decPart = parts[1];

    const formatted = parseInt(intPart, 10).toLocaleString('en-US');
    return decPart !== undefined ? formatted + '.' + decPart : formatted;
  }

  function updateDisplay() {
    const formatted = formatNumber(currentInput);
    display.textContent = formatted;
    autoShrink();
  }

  function autoShrink() {
    const container = display.parentElement;
    const containerWidth = container.clientWidth - 48;
    let fontSize = 42;

    display.style.fontSize = fontSize + 'px';

    while (display.scrollWidth > containerWidth && fontSize > 16) {
      fontSize -= 1;
      display.style.fontSize = fontSize + 'px';
    }
  }

  function calculate(a, op, b) {
    const numA = parseFloat(a);
    const numB = parseFloat(b);
    if (isNaN(numA) || isNaN(numB)) return 'Error';

    let result;
    switch (op) {
      case '+': result = numA + numB; break;
      case '−': result = numA - numB; break;
      case '×': result = numA * numB; break;
      case '÷':
        if (numB === 0) return 'Error';
        result = numA / numB;
        break;
      default: return b;
    }

    if (!isFinite(result)) return 'Error';

    const str = parseFloat(result.toPrecision(12)).toString();
    return str;
  }

  function handleNumber(value) {
    if (currentInput === 'Error') {
      currentInput = value;
      updateDisplay();
      return;
    }

    if (shouldResetDisplay) {
      currentInput = value;
      shouldResetDisplay = false;
    } else {
      if (currentInput === '0' && value !== '0') {
        currentInput = value;
      } else if (currentInput === '0' && value === '0') {
        // do nothing
      } else {
        if (currentInput.replace(/[^0-9]/g, '').length >= 15) return;
        currentInput += value;
      }
    }
    updateDisplay();
  }

  function handleDecimal() {
    if (shouldResetDisplay) {
      currentInput = '0.';
      shouldResetDisplay = false;
      updateDisplay();
      return;
    }
    if (!currentInput.includes('.')) {
      currentInput += '.';
    }
    updateDisplay();
  }

  function handleOperator(op) {
    if (currentInput === 'Error') return;

    if (operator && !shouldResetDisplay) {
      const result = calculate(previousInput, operator, currentInput);
      expression.textContent = previousInput + ' ' + operator + ' ' + currentInput + ' =';
      currentInput = result;
      previousInput = result;
      updateDisplay();
    } else {
      previousInput = currentInput;
    }

    operator = op;
    shouldResetDisplay = true;
    expression.textContent = previousInput + ' ' + op;
  }

  function handleEquals() {
    if (currentInput === 'Error') return;

    if (!operator) {
      if (previousInput) {
        expression.textContent = previousInput + ' ' + operator + ' ' + currentInput + ' =';
      }
      return;
    }

    const result = calculate(previousInput, operator, currentInput);
    expression.textContent = previousInput + ' ' + operator + ' ' + currentInput + ' =';
    currentInput = result;
    previousInput = '';
    operator = null;
    shouldResetDisplay = true;
    updateDisplay();
  }

  function handleClear() {
    currentInput = '0';
    previousInput = '';
    operator = null;
    shouldResetDisplay = false;
    expression.textContent = '';
    updateDisplay();
  }

  function handleNegate() {
    if (currentInput === 'Error' || currentInput === '0') return;
    if (currentInput.startsWith('-')) {
      currentInput = currentInput.slice(1);
    } else {
      currentInput = '-' + currentInput;
    }
    updateDisplay();
  }

  function handlePercent() {
    if (currentInput === 'Error') return;
    const num = parseFloat(currentInput);
    if (isNaN(num)) return;
    currentInput = (num / 100).toString();
    updateDisplay();
  }

  function handleBackspace() {
    if (currentInput === 'Error') {
      handleClear();
      return;
    }
    if (shouldResetDisplay) return;
    if (currentInput.length <= 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
      currentInput = '0';
    } else {
      currentInput = currentInput.slice(0, -1);
    }
    updateDisplay();
  }

  function animateKey(key) {
    key.classList.add('pressed');
    setTimeout(() => {
      key.classList.remove('pressed');
      key.classList.add('pop');
      setTimeout(() => key.classList.remove('pop'), 250);
    }, 100);
  }

  keys.forEach(key => {
    key.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const action = key.dataset.action;
      const value = key.dataset.value;

      switch (action) {
        case 'number': handleNumber(value); break;
        case 'decimal': handleDecimal(); break;
        case 'operator': handleOperator(value); break;
        case 'equals': handleEquals(); break;
        case 'clear': handleClear(); break;
        case 'negate': handleNegate(); break;
        case 'percent': handlePercent(); break;
      }
    });

    key.addEventListener('mouseup', () => {});
    key.addEventListener('mouseleave', () => {
      key.classList.remove('pressed');
    });
  });

  // Keyboard support
  const keyMap = {
    '0': '[data-value="0"]',
    '1': '[data-value="1"]',
    '2': '[data-value="2"]',
    '3': '[data-value="3"]',
    '4': '[data-value="4"]',
    '5': '[data-value="5"]',
    '6': '[data-value="6"]',
    '7': '[data-value="7"]',
    '8': '[data-value="8"]',
    '9': '[data-value="9"]',
    '.': '[data-action="decimal"]',
    '+': '[data-value="+"]',
    '-': '[data-value="−"]',
    '*': '[data-value="×"]',
    '/': '[data-value="÷"]',
    'Enter': '[data-action="equals"]',
    '=': '[data-action="equals"]',
    'Escape': '[data-action="clear"]',
    'Backspace': null,
    '%': '[data-action="percent"]',
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace') {
      e.preventDefault();
      handleBackspace();
      return;
    }

    const selector = keyMap[e.key];
    if (selector) {
      e.preventDefault();
      const keyEl = document.querySelector(selector);
      if (keyEl) {
        animateKey(keyEl);
        const action = keyEl.dataset.action;
        const value = keyEl.dataset.value;

        switch (action) {
          case 'number': handleNumber(value); break;
          case 'decimal': handleDecimal(); break;
          case 'operator': handleOperator(value); break;
          case 'equals': handleEquals(); break;
          case 'clear': handleClear(); break;
          case 'negate': handleNegate(); break;
          case 'percent': handlePercent(); break;
        }
      }
    }
  });

  // Prevent double-tap zoom on mobile
  document.addEventListener('touchend', (e) => {
    if (e.target.classList.contains('key')) {
      e.preventDefault();
    }
  }, { passive: false });

  updateDisplay();
})();
</script>

</body>
</html>
