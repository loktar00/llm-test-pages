<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Marble Run</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="ui">Endless Run // <span id="count">0</span> Marbles</div>
    <canvas id="canvas"></canvas>
    <script>
        /**
         * CONFIGURATION
         */
        const CONFIG = {
            gravity: 0.15,
            friction: 0.995,
            bounce: 0.6,
            marbleRadius: 6,
            spawnRate: 15, // Frames between spawns
            cameraSmooth: 0.05,
            sectionLifetime: 1800, // 30 seconds at 60fps
            colors: ['#FF0055', '#00FF99', '#00CCFF', '#FFCC00', '#FF6600'],
            trailStrength: 0.85 // Lower is longer trails
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // State
        let marbles = [];
        let obstacles = [];
        let frameCount = 0;
        let sectionResetTimer = 0;
        
        // Camera
        const camera = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0
        };

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * CLASSES
         */

        class Marble {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = width / 2 + (Math.random() - 0.5) * 200;
                this.y = -50;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 2;
                this.radius = CONFIG.marbleRadius;
                this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
                this.life = 0;
            }

            update(obstacles) {
                // Apply Gravity
                this.vy += CONFIG.gravity;
                
                // Apply Friction
                this.vx *= CONFIG.friction;
                this.vy *= CONFIG.friction;

                // Update Position
                this.x += this.vx;
                this.y += this.vy;
                this.life++;

                // Collision Detection
                for (let obs of obstacles) {
                    this.resolveCollision(obs);
                }

                // Boundary Constraints (Sides)
                if (this.x < 0) {
                    this.x = 0;
                    this.vx *= -0.5;
                }
                if (this.x > width) {
                    this.x = width;
                    this.vx *= -0.5;
                }

                // Teleport back to top if fell off screen (below a certain threshold relative to camera)
                if (this.y > camera.y + height + 200) {
                    this.reset();
                }
            }

            resolveCollision(obs) {
                // Type: Line Segment (Ramp/Chute)
                if (obs.type === 'line') {
                    // Circle-Line collision
                    const dx = obs.b.x - obs.a.x;
                    const dy = obs.b.y - obs.a.y;
                    const len = Math.sqrt(dx*dx + dy*dy);
                    const nx = dx / len;
                    const ny = dy / len;

                    // Project marble center onto line segment
                    const t = ((this.x - obs.a.x) * nx + (this.y - obs.a.y) * ny);
                    const closestX = obs.a.x + t * nx;
                    const closestY = obs.a.y + t * ny;

                    // Clamp to segment
                    let closestXclamp = closestX;
                    let closestYclamp = closestY;

                    if (t < 0) {
                        closestXclamp = obs.a.x;
                        closestYclamp = obs.a.y;
                    } else if (t > len) {
                        closestXclamp = obs.b.x;
                        closestYclamp = obs.b.y;
                    }

                    const distX = this.x - closestXclamp;
                    const distY = this.y - closestYclamp;
                    const distSq = distX*distX + distY*distY;

                    if (distSq < this.radius * this.radius) {
                        const dist = Math.sqrt(distSq);
                        const overlap = this.radius - dist;
                        
                        // Normal
                        let nx = distX / dist;
                        let ny = distY / dist;
                        
                        // Handle center point exactly on line
                        if (dist === 0) { nx = 0; ny = -1; }

                        // Push out
                        this.x += nx * overlap;
                        this.y += ny * overlap;

                        // Reflect velocity
                        const dot = this.vx * nx + this.vy * ny;
                        this.vx -= 2 * dot * nx;
                        this.vy -= 2 * dot * ny;

                        // Apply bounce energy loss and slight friction
                        this.vx *= CONFIG.bounce;
                        this.vy *= CONFIG.bounce;
                        
                        // Add some chaotic spin
                        this.vx += (Math.random() - 0.5) * 0.5;
                    }
                }
                
                // Type: Spinner (Rotating Line)
                else if (obs.type === 'spinner') {
                     // Treat as line for collision, but update geometry in world update
                     this.resolveCollision({
                         type: 'line',
                         a: obs.a,
                         b: obs.b
                     });
                }

                // Type: Bumper (Circle)
                else if (obs.type === 'bumper') {
                    const dx = this.x - obs.x;
                    const dy = this.y - obs.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const minDist = this.radius + obs.radius;

                    if (dist < minDist) {
                        // Normal
                        const nx = dx / dist;
                        const ny = dy / dist;

                        // Push out
                        const overlap = minDist - dist;
                        this.x += nx * overlap;
                        this.y += ny * overlap;

                        // Reflect
                        const dot = this.vx * nx + this.vy * ny;
                        this.vx -= 2 * dot * nx;
                        this.vy -= 2 * dot * ny;
                        
                        // Boost velocity slightly on impact
                        this.vx *= 1.1;
                        this.vy *= 1.1;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Add glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        /**
         * PROCEDURAL GENERATION
         */

        function generateSection() {
            obstacles = [];
            
            // 1. Define a vertical path
            let currentX = width / 2;
            let currentY = -100;
            const levels = 15; // How many segments down
            
            // Generate path points
            const points = [{x: currentX, y: currentY}];
            for(let i=0; i<levels; i++) {
                currentY += 150;
                // Random horizontal wander but keep it somewhat central
                const range = (width * 0.4); 
                currentX += (Math.random() - 0.5) * range;
                
                // Clamp X to screen
                if(currentX < 50) currentX = 50;
                if(currentX > width - 50) currentX = width - 50;
                
                points.push({x: currentX, y: currentY});
            }

            // 2. Create Obstacles between points
            for(let i=0; i<points.length-1; i++) {
                const p1 = points[i];
                const p2 = points[i+1];

                // Main path line (The ramp they slide down)
                obstacles.push({
                    type: 'line',
                    a: {x: p1.x - 40, y: p1.y},
                    b: {x: p2.x - 40, y: p2.y},
                    color: '#556677'
                });

                obstacles.push({
                    type: 'line',
                    a: {x: p1.x + 40, y: p1.y},
                    b: {x: p2.x + 40, y: p2.y},
                    color: '#556677'
                });

                // Random bumpers
                if (Math.random() > 0.3) {
                    obstacles.push({
                        type: 'bumper',
                        x: (p1.x + p2.x) / 2,
                        y: (p1.y + p2.y) / 2,
                        radius: 15 + Math.random() * 10,
                        color: '#FF3366'
                    });
                }

                // Random Spinner
                if (Math.random() > 0.5) {
                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2;
                    // Store original center for rotation math
                    obstacles.push({
                        type: 'spinner',
                        cx: midX,
                        cy: midY,
                        length: 120,
                        angle: Math.random() * Math.PI,
                        speed: (Math.random() > 0.5 ? 1 : -1) * (0.02 + Math.random() * 0.03),
                        color: '#33CCFF'
                    });
                }
            }
        }

        function updateObstacles() {
            for(let obs of obstacles) {
                if (obs.type === 'spinner') {
                    obs.angle += obs.speed;
                    const rad = obs.length / 2;
                    obs.a = {
                        x: obs.cx + Math.cos(obs.angle) * rad,
                        y: obs.cy + Math.sin(obs.angle) * rad
                    };
                    obs.b = {
                        x: obs.cx - Math.cos(obs.angle) * rad,
                        y: obs.cy - Math.sin(obs.angle) * rad
                    };
                }
            }
        }

        /**
         * CAMERA LOGIC
         */

        function updateCamera() {
            // Find center of mass of active marbles
            let avgX = 0;
            let avgY = 0;
            let count = 0;

            for(let m of marbles) {
                if (m.y > camera.y - 100 && m.y < camera.y + height) {
                    avgX += m.x;
                    avgY += m.y;
                    count++;
                }
            }

            if (count > 0) {
                avgX /= count;
                avgY /= count;
            } else {
                // If no marbles nearby, drift slowly
                avgX = width/2;
                avgY = camera.y + height/2;
            }

            // Lerp camera to target
            const targetX = avgX - width / 2;
            const targetY = avgY - height / 2;

            // Only Y movement is strictly necessary for a run, but let's add slight X drift
            camera.x += (targetX - camera.x) * CONFIG.cameraSmooth * 0.2;
            camera.y += (targetY - camera.y) * CONFIG.cameraSmooth;
        }

        /**
         * MAIN LOOP
         */

        function init() {
            generateSection();
            // Pre-populate some marbles
            for(let i=0; i<10; i++) {
                const m = new Marble();
                m.y = Math.random() * -500; // Start scattered above
                marbles.push(m);
            }
            loop();
        }

        function loop() {
            requestAnimationFrame(loop);

            // Clear with trail effect
            // Using fillRect with opacity to create trails
            ctx.fillStyle = `rgba(5, 5, 16, ${CONFIG.trailStrength})`;
            ctx.fillRect(0, 0, width, height);

            // Logic
            if (frameCount % CONFIG.spawnRate === 0) {
                marbles.push(new Marble());
            }

            // Update Marbles
            for(let i = marbles.length - 1; i >= 0; i--) {
                marbles[i].update(obstacles);
                // Remove marbles that have been alive too long (shouldn't happen with teleport logic, but safety net)
                // Actually, teleport logic handles recycling, so array grows. 
                // Let's keep array size reasonable.
            }
            
            // Cap marble count to prevent lag
            if (marbles.length > 150) {
                marbles.shift();
            }

            document.getElementById('count').innerText = marbles.length;

            // Update Obstacles
            updateObstacles();

            // Reset Section Timer
            sectionResetTimer++;
            if (sectionResetTimer > CONFIG.sectionLifetime) {
                generateSection();
                sectionResetTimer = 0;
            }

            // Update Camera
            updateCamera();

            // DRAWING
            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Draw Obstacles
            for(let obs of obstacles) {
                ctx.strokeStyle = obs.color;
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                if (obs.type === 'line' || obs.type === 'spinner') {
                    ctx.beginPath();
                    ctx.moveTo(obs.a.x, obs.a.y);
                    ctx.lineTo(obs.b.x, obs.b.y);
                    ctx.stroke();
                    
                    // Glow
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = obs.color;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                } 
                else if (obs.type === 'bumper') {
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI*2);
                    ctx.fillStyle = obs.color;
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = obs.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // Draw Marbles
            for(let m of marbles) {
                m.draw();
            }

            ctx.restore();

            frameCount++;
        }

        // Start
        init();

    </script>
</body>
</html>
