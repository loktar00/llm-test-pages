<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger UI</title>
    <style>
        :root {
            --bg-app: #f0f2f5;
            --bg-sidebar: #ffffff;
            --bg-chat: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --bubble-out: #4f46e5;
            --bubble-in: #f3f4f6;
            --online: #10b981;
            --offline: #9ca3af;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-app);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        /* Layout */
        .app-container {
            width: 900px;
            height: 650px;
            background: var(--bg-chat);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .search-bar {
            margin: 15px 20px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 12px 10px 35px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-app);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }

        .contact-item:hover {
            background: var(--bg-app);
        }

        .contact-item.active {
            background: #eff6ff;
        }

        .avatar-wrapper {
            position: relative;
            margin-right: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--primary);
            font-size: 1rem;
            overflow: hidden;
        }
        
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .presence-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .presence-dot.online { background-color: var(--online); }
        .presence-dot.offline { background-color: var(--offline); }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .contact-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .contact-preview {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            background-color: var(--primary);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
            min-width: 18px;
            text-align: center;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .chat-header-info {
            margin-left: 12px;
        }

        .chat-header-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .chat-header-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .messages-container {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        /* Scrollbar styling */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 3px;
        }

        /* Day Divider */
        .day-divider {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .day-chip {
            background: #f3f4f6;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Bubbles */
        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            opacity: 0; /* Start hidden for animation */
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .message-row.outgoing {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.incoming {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .outgoing .bubble {
            background-color: var(--bubble-out);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .incoming .bubble {
            background-color: var(--bubble-in);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .timestamp {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 0 4px;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Typing Indicator */
        .typing-indicator {
            align-self: flex-start;
            background-color: var(--bubble-in);
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: none; /* Hidden by default */
            align-items: center;
            gap: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #9ca3af;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Composer */
        .composer {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            background: #fff;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            margin-right: 12px;
        }

        .message-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--bg-app);
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .message-input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--primary);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-sm);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            margin-left: 2px; /* Visual centering */
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
            background-color: var(--primary-hover);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:hover svg {
            transform: translateX(2px);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .app-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
            .sidebar {
                width: 80px; /* Collapsed sidebar */
                overflow: hidden;
            }
            .sidebar-header h2, .search-bar, .contact-info, .badge {
                display: none;
            }
            .avatar-wrapper { margin-right: 0; }
            .contact-item { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Messages</h2>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </div>
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search chats...">
        </div>
        <div class="contact-list" id="contactList">
            <!-- Contacts injected via JS -->
        </div>
    </aside>

    <!-- Right Chat Area -->
    <main class="chat-area">
        <header class="chat-header">
            <div class="avatar-wrapper">
                <div class="avatar" id="activeAvatar">JD</div>
                <div class="presence-dot online" id="activePresence"></div>
            </div>
            <div class="chat-header-info">
                <div class="chat-header-name" id="activeName">John Doe</div>
                <div class="chat-header-status" id="activeStatus">Online</div>
            </div>
        </header>

        <div class="messages-container" id="messagesContainer">
            <!-- Messages injected via JS -->
        </div>

        <div class="composer">
            <div class="input-wrapper">
                <input type="text" class="message-input" id="messageInput" placeholder="Type a message...">
            </div>
            <button class="send-btn" id="sendBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </main>
</div>

<script>
    // --- Data ---
    const contacts = [
        { id: 1, name: "Alice Freeman", initials: "AF", online: true, lastMsg: "See you tomorrow!", time: "10:30 AM", unread: 2 },
        { id: 2, name: "Bob Smith", initials: "BS", online: false, lastMsg: "Can you send the file?", time: "Yesterday", unread: 0 },
        { id: 3, name: "Charlie Brown", initials: "CB", online: true, lastMsg: "Haha that was funny", time: "Yesterday", unread: 0 },
        { id: 4, name: "Diana Prince", initials: "DP", online: false, lastMsg: "Meeting rescheduled", time: "Mon", unread: 0 },
        { id: 5, name: "Evan Wright", initials: "EW", online: true, lastMsg: "Thanks!", time: "Mon", unread: 0 },
    ];

    const chatHistory = {
        1: [
            { sender: 'in', text: 'Hey Alice! How are things?', time: '10:00 AM' },
            { sender: 'out', text: 'Pretty good, just finishing up work.', time: '10:05 AM' },
            { sender: 'in', text: 'That sounds great. We should grab coffee soon.', time: '10:15 AM' },
            { day: 'Yesterday' },
            { sender: 'out', text: 'Definitely! How about tomorrow?', time: 'Yesterday' },
            { sender: 'in', text: 'Sure, let me check my schedule.', time: 'Yesterday' },
            { sender: 'in', text: 'See you tomorrow!', time: '10:30 AM' }
        ],
        2: [
            { day: 'Monday' },
            { sender: 'out', text: 'Did you get the design files?', time: '09:00 AM' },
            { sender: 'in', text: 'Yes, received them.', time: '09:15 AM' },
            { sender: 'in', text: 'Can you send the file?', time: '09:16 AM' }
        ],
        3: [
            { day: 'Yesterday' },
            { sender: 'out', text: 'Did you see the game last night?', time: '11:00 PM' },
            { sender: 'in', text: 'Haha that was funny', time: '11:05 PM' }
        ]
    };

    // --- DOM Elements ---
    const contactListEl = document.getElementById('contactList');
    const messagesContainer = document.getElementById('messagesContainer');
    const activeNameEl = document.getElementById('activeName');
    const activePresenceEl = document.getElementById('activePresence');
    const activeAvatarEl = document.getElementById('activeAvatar');
    const activeStatusEl = document.getElementById('activeStatus');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // --- State ---
    let activeContactId = 1;

    // --- Functions ---

    function renderContacts() {
        contactListEl.innerHTML = '';
        contacts.forEach(contact => {
            const el = document.createElement('div');
            el.className = `contact-item ${contact.id === activeContactId ? 'active' : ''}`;
            el.onclick = () => switchChat(contact.id);
            
            el.innerHTML = `
                <div class="avatar-wrapper">
                    <div class="avatar">${contact.initials}</div>
                    <div class="presence-dot ${contact.online ? 'online' : 'offline'}"></div>
                </div>
                <div class="contact-info">
                    <div class="contact-name">
                        ${contact.name}
                        <span class="contact-time">${contact.time}</span>
                    </div>
                    <div class="contact-preview">
                        ${contact.lastMsg}
                        ${contact.unread > 0 ? `<span class="badge">${contact.unread}</span>` : ''}
                    </div>
                </div>
            `;
            contactListEl.appendChild(el);
        });
    }

    function renderMessages(contactId) {
        messagesContainer.innerHTML = '';
        const history = chatHistory[contactId] || [];
        
        history.forEach(msg => {
            if (msg.day) {
                const divider = document.createElement('div');
                divider.className = 'day-divider';
                divider.innerHTML = `<div class="day-chip">${msg.day}</div>`;
                messagesContainer.appendChild(divider);
            } else {
                const row = document.createElement('div');
                row.className = `message-row ${msg.sender === 'out' ? 'outgoing' : 'incoming'}`;
                row.innerHTML = `
                    <div class="bubble">${msg.text}</div>
                    <span class="timestamp">${msg.time}</span>
                `;
                messagesContainer.appendChild(row);
            }
        });

        // Add Typing Indicator
        const typingEl = document.createElement('div');
        typingEl.className = 'typing-indicator';
        typingEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        messagesContainer.appendChild(typingEl);

        scrollToBottom();
    }

    function switchChat(id) {
        activeContactId = id;
        const contact = contacts.find(c => c.id === id);
        
        // Update UI Header
        activeNameEl.textContent = contact.name;
        activePresenceEl.className = `presence-dot ${contact.online ? 'online' : 'offline'}`;
        activeStatusEl.textContent = contact.online ? 'Online' : 'Offline';
        activeAvatarEl.textContent = contact.initials;

        // Update Sidebar Selection
        renderContacts();
        
        // Reset Unread
        contact.unread = 0;
        renderContacts();

        // Render Messages
        renderMessages(id);
    }

    function scrollToBottom() {
        setTimeout(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 50);
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Add to data
        if (!chatHistory[activeContactId]) chatHistory[activeContactId] = [];
        chatHistory[activeContactId].push({ sender: 'out', text: text, time: timeString });

        // Update UI
        const row = document.createElement('div');
        row.className = 'message-row outgoing';
        row.innerHTML = `
            <div class="bubble">${text}</div>
            <span class="timestamp">${timeString}</span>
        `;
        
        // Insert before typing indicator
        const typingIndicator = document.querySelector('.typing-indicator');
        messagesContainer.insertBefore(row, typingIndicator);
        
        messageInput.value = '';
        scrollToBottom();

        // Simulate Reply
        simulateReply(activeContactId);
    }

    function simulateReply(contactId) {
        // Show typing
        const typingIndicator = document.querySelector('.typing-indicator');
        typingIndicator.classList.add('active');
        scrollToBottom();

        // Mock Reply Logic
        setTimeout(() => {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Stop typing
            typingIndicator.classList.remove('active');

            const replies = [
                "That sounds great!",
                "I'll check and let you know.",
                "Haha, totally agree.",
                "Can we discuss this later?",
                "Ok, got it.",
                "Interesting point."
            ];
            const randomReply = replies[Math.floor(Math.random() * replies.length)];

            // Add to data
            chatHistory[contactId].push({ sender: 'in', text: randomReply, time: timeString });

            // Update UI
            const row = document.createElement('div');
            row.className = 'message-row incoming';
            row.innerHTML = `
                <div class="bubble">${randomReply}</div>
                <span class="timestamp">${timeString}</span>
            `;
            messagesContainer.insertBefore(row, typingIndicator);
            scrollToBottom();

            // Update sidebar preview
            const contact = contacts.find(c => c.id === contactId);
            contact.lastMsg = randomReply;
            contact.time = timeString;
            renderContacts();

        }, 2000 + Math.random() * 1000);
    }

    // --- Event Listeners ---
    sendBtn.addEventListener('click', sendMessage);
    
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // --- Init ---
    renderContacts();
    switchChat(1);

</script>
</body>
</html>
