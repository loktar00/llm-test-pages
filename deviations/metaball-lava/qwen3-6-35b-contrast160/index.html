<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Metaball Lava Lamp</title>
<style>
*{margin:0;padding:0;overflow:hidden}
html,body{width:100%;height:100%;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const off=document.createElement("canvas");
const offCtx=off.getContext("2d",{willReadFrequency:"read"});
const SCALE=4;
const NUM_BLOBS=10;
const W=()=>canvas.width;
const H=()=>canvas.height;
const MW=()=>(W()/SCALE)|0;
const MH=()=>(H()/SCALE)|0;

let blobs=[];
let time=0;
let lastTime=0;

function initBlobs(){
  blobs=[];
  for(let i=0;i<NUM_BLOBS;i++){
    blobs.push({
      x:0.15+Math.random()*0.7,
      y:0.1+Math.random()*0.8,
      r:0.03+Math.random()*0.04,
      phase:Math.random()*Math.PI*2,
      freq:0.4+Math.random()*0.6,
      amp:0.008+Math.random()*0.012,
      drift:Math.random()*0.003,
      warmth:Math.random()
    });
  }
}

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  off.width=(W()/SCALE)|0;
  off.height=(H()/SCALE)|0;
}

function updateBlobs(dt){
  const h=H();
  const t=time;
  for(let i=0;i<blobs.length;i++){
    const b=blobs[i];
    const base=b.phase+t*b.freq;
    const heat=Math.sin(base)*0.5+0.5;
    b.warmth=b.warmth*0.98+heat*0.02;
    const speed=0.015+b.warmth*0.04;
    b.y-=speed*dt*0.06;
    b.x+=Math.sin(t*0.5+b.phase)*b.drift*dt*0.06;
    b.r=0.025+b.warmth*0.045+Math.sin(t*0.8+b.phase)*0.008;
    b.r=Math.max(0.015,Math.min(0.1,b.r));
    if(b.y<-0.15){
      b.y=1.15;
      b.x=0.1+Math.random()*0.8;
      b.phase=Math.random()*Math.PI*2;
      b.warmth=1;
    }
    if(b.y>1.15){
      b.y=-0.05;
      b.warmth=0.2;
    }
    if(b.x<-0.1)b.x=-0.1;
    if(b.x>1.1)b.x=1.1;
  }
}

function renderLava(){
  const mw=MW();
  const mh=MH();
  const data=offCtx.createImageData(mw,mh);
  const px=data.data;
  const mw2=mw*0.5;
  const mh2=mh*0.5;
  const mwr=mw*0.4;
  const mhr=mh*0.35;

  for(let y=0;y<mh;y++){
    for(let x=0;x<mw;x++){
      let field=0;
      const dx=x-mw2;
      const dy=y-mh2;
      const distSq=dx*dx+dy*dy;
      if(distSq>mwr*mwr+mhr*mhr)continue;

      for(let i=0;i<blobs.length;i++){
        const b=blobs[i];
        const bx=b.x*mw;
        const by=b.y*mh;
        const br=b.r*mw;
        const ddx=x-bx;
        const ddy=y-by;
        const d2=ddx*ddx+ddy*ddy;
        const r2=br*br;
        if(d2<r2*4){
          field+=r2/(d2+0.5);
        }
      }

      if(field>1.5){
        const idx=(y*mw+x)*4;
        const intensity=Math.min(1,(field-1.5)*0.8);
        const coreGlow=Math.max(0,(field-3)*0.3);
        const edgeFade=Math.max(0,1-(field-1.5)*0.5);

        let r,g,b;
        if(intensity>0.7){
          r=255;
          g=180+coreGlow*75;
          b=60+coreGlow*120;
        }else if(intensity>0.3){
          const t2=(intensity-0.3)/0.4;
          r=255;
          g=80+t2*100;
          b=20+t2*40;
        }else{
          const t2=intensity/0.3;
          r=180+t2*75;
          g=30+t2*50;
          b=10+t2*10;
        }

        const edgeMul=edgeFade*edgeFade;
        r=(r*edgeMul)|0;
        g=(g*edgeMul)|0;
        b=(b*edgeMul)|0;
        const alpha=(200*edgeMul+55)|0;

        px[idx]=r;
        px[idx+1]=g;
        px[idx+2]=b;
        px[idx+3]=alpha;
      }
    }
  }
  offCtx.putImageData(data,0,0);
}

function renderScene(){
  const w=W();
  const h=H();

  ctx.fillStyle="#0a0505";
  ctx.fillRect(0,0,w,h);

  const cx=w*0.5;
  const cy=h*0.45;

  ctx.save();
  ctx.translate(cx,cy);

  const lampW=w*0.35;
  const lampH=h*0.7;

  ctx.save();
  ctx.beginPath();
  ctx.rect(-lampW-10,-lampH-10,lampW*2+20,lampH*2+20);
  ctx.clip();

  ctx.fillStyle="#080404";
  ctx.fillRect(-lampW,-lampH,lampW*2,lampH*2);

  renderLava();

  ctx.save();
  ctx.beginPath();
  ctx.rect(-lampW,-lampH,lampW*2,lampH*2);
  ctx.clip();

  const glassGrad=ctx.createLinearGradient(0,-lampH,0,lampH*0.5);
  glassGrad.addColorStop(0,"rgba(255,200,100,0.04)");
  glassGrad.addColorStop(0.5,"rgba(255,150,50,0.02)");
  glassGrad.addColorStop(1,"rgba(100,50,20,0.08)");
  ctx.fillStyle=glassGrad;
  ctx.fillRect(-lampW,-lampH,lampW*2,lampH*2);

  ctx.strokeStyle="rgba(255,220,150,0.15)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(0,0,lampW,lampH,0,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();

  ctx.globalAlpha=0.06;
  const glowGrad=ctx.createRadialGradient(0,lampH*0.3,0,0,lampH*0.3,lampH*0.9);
  glowGrad.addColorStop(0,"rgba(255,120,20,0.4)");
  glowGrad.addColorStop(0.5,"rgba(200,60,10,0.1)");
  glowGrad.addColorStop(1,"rgba(100,20,0,0)");
  ctx.fillStyle=glowGrad;
  ctx.beginPath();
  ctx.ellipse(0,lampH*0.3,lampW*1.5,lampH*1.2,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  ctx.restore();

  const baseGrad=ctx.createLinearGradient(0,lampH*0.8,0,h);
  baseGrad.addColorStop(0,"#1a0a0a");
  baseGrad.addColorStop(1,"#0a0505");
  ctx.fillStyle=baseGrad;
  ctx.beginPath();
  ctx.moveTo(-lampW*0.8,lampH);
  ctx.lineTo(-lampW*1.2,h);
  ctx.lineTo(lampW*1.2,h);
  ctx.lineTo(lampW*0.8,lampH);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="rgba(200,150,80,0.2)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-lampW*0.8,lampH);
  ctx.lineTo(-lampW*1.2,h);
  ctx.lineTo(lampW*1.2,h);
  ctx.lineTo(lampW*0.8,lampH);
  ctx.closePath();
  ctx.stroke();

  const topGrad=ctx.createLinearGradient(0,-lampH,0,-lampH*0.5);
  topGrad.addColorStop(0,"#0a0505");
  topGrad.addColorStop(1,"#1a0a0a");
  ctx.fillStyle=topGrad;
  ctx.beginPath();
  ctx.ellipse(0,-lampH*0.85,lampW*0.6,lampH*0.15,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="rgba(200,150,80,0.15)";
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.ellipse(0,-lampH*0.85,lampW*0.6,lampH*0.15,0,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();

  const screenGlow=ctx.createRadialGradient(cx,h*0.45,h*0.1,cx,h*0.45,h*0.9);
  screenGlow.addColorStop(0,"rgba(255,100,20,0.03)");
  screenGlow.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=screenGlow;
  ctx.fillRect(0,0,w,h);
}

function loop(ts){
  if(!lastTime)lastTime=ts;
  const dt=Math.min(50,(ts-lastTime));
  lastTime=ts;
  time+=dt*0.001;
  updateBlobs(dt);
  renderScene();
  requestAnimationFrame(loop);
}

window.addEventListener("resize",resize);
resize();
initBlobs();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
