<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire Night</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, groundY, fireX, fireY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = H * 0.72;
  fireX = W / 2;
  fireY = groundY;
  initStars();
  initGrass();
  initTrees();
  initStones();
  initLogs();
}

// Stars
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 250; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * groundY * 0.85,
      r: Math.random() * 1.8 + 0.3,
      twinkleSpeed: Math.random() * 0.03 + 0.01,
      twinkleOffset: Math.random() * Math.PI * 2,
      brightness: Math.random() * 0.5 + 0.5
    });
  }
}

// Meteors
let meteors = [];
function spawnMeteor() {
  if (meteors.length < 2 && Math.random() < 0.003) {
    meteors.push({
      x: Math.random() * W * 0.8,
      y: Math.random() * groundY * 0.3,
      vx: 4 + Math.random() * 4,
      vy: 2 + Math.random() * 2,
      life: 1,
      decay: 0.015 + Math.random() * 0.01,
      len: 60 + Math.random() * 80
    });
  }
}

// Grass
let grassBlades = [];
function initGrass() {
  grassBlades = [];
  for (let i = 0; i < 400; i++) {
    grassBlades.push({
      x: Math.random() * W,
      baseY: groundY + Math.random() * (H - groundY),
      height: 15 + Math.random() * 35,
      lean: (Math.random() - 0.5) * 0.4,
      twitchTimer: Math.random() * 200,
      twitchSpeed: 0.02 + Math.random() * 0.04,
      twitchActive: false,
      twitchDuration: 0,
      color: `hsl(${100 + Math.random() * 40}, ${30 + Math.random() * 30}%, ${12 + Math.random() * 15}%)`
    });
  }
}

// Trees
let trees = [];
function initTrees() {
  trees = [
    { x: W * 0.12, width: 40 + Math.random() * 20, barkColor: '#2a1a0a', barkColor2: '#3d2815' },
    { x: W * 0.88, width: 45 + Math.random() * 20, barkColor: '#2a1a0a', barkColor2: '#3d2815' }
  ];
}

// Stones
let stones = [];
function initStones() {
  stones = [];
  const count = 18;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.15;
    const rx = 70 + Math.random() * 25;
    const ry = 22 + Math.random() * 12;
    stones.push({
      x: fireX + Math.cos(angle) * rx,
      y: fireY + Math.sin(angle) * ry + 5,
      w: 12 + Math.random() * 18,
      h: 8 + Math.random() * 10,
      shade: Math.random() * 0.3
    });
  }
}

// Logs
let logs = [];
function initLogs() {
  logs = [];
  for (let i = 0; i < 5; i++) {
    addLog();
  }
}

function addLog() {
  const angle = Math.random() * Math.PI * 2;
  const len = 60 + Math.random() * 40;
  logs.push({
    x: fireX + Math.cos(angle) * 15,
    y: fireY - 2,
    angle: angle + (Math.random() - 0.5) * 0.5,
    length: len,
    thickness: 10 + Math.random() * 8,
    burn: 0,
    maxBurn: 300 + Math.random() * 400,
    respawnTimer: 0,
    collapsed: false,
    glowIntensity: 0
  });
}

// Flame particles
let flameParticles = [];
function spawnFlame() {
  if (flameParticles.length < 200) {
    const layer = Math.random();
    flameParticles.push({
      x: fireX + (Math.random() - 0.5) * 20,
      y: fireY - 5,
      vx: (Math.random() - 0.5) * 1.5,
      vy: -1.5 - Math.random() * 3,
      life: 1,
      decay: 0.015 + Math.random() * 0.025,
      size: layer < 0.3 ? 8 + Math.random() * 15 : layer < 0.7 ? 5 + Math.random() * 10 : 3 + Math.random() * 6,
      layer: layer,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.05 + Math.random() * 0.1
    });
  }
}

// Embers
let embers = [];
function spawnEmber() {
  if (embers.length < 60 && Math.random() < 0.15) {
    embers.push({
      x: fireX + (Math.random() - 0.5) * 30,
      y: fireY - 10,
      vx: (Math.random() - 0.5) * 1.5,
      vy: -1 - Math.random() * 2.5,
      life: 1,
      decay: 0.008 + Math.random() * 0.012,
      size: 1.5 + Math.random() * 2.5,
      spiralAngle: Math.random() * Math.PI * 2,
      spiralSpeed: 0.03 + Math.random() * 0.05,
      spiralRadius: 5 + Math.random() * 15
    });
  }
}

// Heat distortion lines
let heatWaves = [];
function initHeatWaves() {
  heatWaves = [];
  for (let i = 0; i < 12; i++) {
    heatWaves.push({
      x: fireX + (Math.random() - 0.5) * 50,
      y: fireY - 20 - Math.random() * 80,
      phase: Math.random() * Math.PI * 2,
      speed: 0.02 + Math.random() * 0.03,
      amplitude: 3 + Math.random() * 5,
      height: 15 + Math.random() * 25
    });
  }
}
initHeatWaves();

// Firelight intensity
let fireGlow = 0.8;
let fireGlowTarget = 0.8;

function updateFireGlow() {
  fireGlowTarget = 0.6 + Math.sin(Date.now() * 0.008) * 0.15 + Math.sin(Date.now() * 0.013) * 0.1 + Math.sin(Date.now() * 0.021) * 0.08;
  fireGlow += (fireGlowTarget - fireGlow) * 0.1;
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, groundY);
  grad.addColorStop(0, '#050510');
  grad.addColorStop(0.4, '#0a0a20');
  grad.addColorStop(0.7, '#0f0f2a');
  grad.addColorStop(1, '#151535');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, groundY);
}

function drawStars(time) {
  for (const s of stars) {
    const twinkle = Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.3 + 0.7;
    const alpha = s.brightness * twinkle;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 240, ${alpha})`;
    ctx.fill();
  }
}

function drawMeteors() {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx;
    m.y += m.vy;
    m.life -= m.decay;
    if (m.life <= 0) { meteors.splice(i, 1); continue; }
    const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
    grad.addColorStop(0, `rgba(255, 255, 255, ${m.life})`);
    grad.addColorStop(1, `rgba(255, 255, 255, 0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
    ctx.stroke();
  }
}

function drawGround() {
  const grad = ctx.createLinearGradient(0, groundY, 0, H);
  grad.addColorStop(0, '#1a2a10');
  grad.addColorStop(0.3, '#152010');
  grad.addColorStop(1, '#0a1208');
  ctx.fillStyle = grad;
  ctx.fillRect(0, groundY, W, H - groundY);
}

function drawGrass(time) {
  for (const g of grassBlades) {
    g.twitchTimer += g.twitchSpeed;
    if (!g.twitchActive && Math.random() < 0.001) {
      g.twitchActive = true;
      g.twitchDuration = 20 + Math.random() * 30;
    }
    let twitch = 0;
    if (g.twitchActive) {
      twitch = Math.sin(g.twitchTimer * 0.5) * 8 * (g.twitchDuration > 0 ? 1 : 0);
      g.twitchDuration--;
      if (g.twitchDuration <= 0) g.twitchActive = false;
    }

    const fireInfluence = Math.max(0, 1 - Math.abs(g.x - fireX) / 250);
    const flicker = Math.sin(time * 0.01 + g.x * 0.01) * fireInfluence * 3;

    const sway = Math.sin(time * 0.001 + g.x * 0.005) * 3 + g.lean * g.height;
    const endX = g.x + sway + twitch + flicker;
    const endY = g.baseY - g.height;

    ctx.beginPath();
    ctx.moveTo(g.x, g.baseY);
    ctx.quadraticCurveTo(g.x + sway * 0.5 + twitch * 0.5, g.baseY - g.height * 0.5, endX, endY);
    ctx.strokeStyle = g.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Firelight on grass
    if (fireInfluence > 0.1) {
      const glowAlpha = fireInfluence * fireGlow * 0.15;
      ctx.beginPath();
      ctx.moveTo(g.x, g.baseY);
      ctx.quadraticCurveTo(g.x + sway * 0.5 + twitch * 0.5, g.baseY - g.height * 0.5, endX, endY);
      ctx.strokeStyle = `rgba(255, 150, 50, ${glowAlpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function drawTrees(time) {
  for (const t of trees) {
    // Tree trunk
    const trunkGrad = ctx.createLinearGradient(t.x - t.width / 2, 0, t.x + t.width / 2, 0);
    trunkGrad.addColorStop(0, t.barkColor);
    trunkGrad.addColorStop(0.3, t.barkColor2);
    trunkGrad.addColorStop(0.7, t.barkColor2);
    trunkGrad.addColorStop(1, t.barkColor);
    ctx.fillStyle = trunkGrad;
    ctx.fillRect(t.x - t.width / 2, 0, t.width, groundY + 10);

    // Bark texture lines
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 15; i++) {
      const ly = Math.random() * groundY;
      const lx = t.x - t.width / 2 + Math.random() * t.width;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + (Math.random() - 0.5) * 5, ly + 10 + Math.random() * 20);
      ctx.stroke();
    }

    // Firelight on tree
    const dist = Math.abs(t.x - fireX);
    const influence = Math.max(0, 1 - dist / 400);
    if (influence > 0) {
      const flickerAlpha = influence * fireGlow * 0.25;
      const lightGrad = ctx.createRadialGradient(fireX, fireY - 30, 10, t.x, groundY * 0.5, dist);
      lightGrad.addColorStop(0, `rgba(255, 120, 30, ${flickerAlpha})`);
      lightGrad.addColorStop(1, 'rgba(255, 80, 20, 0)');
      ctx.fillStyle = lightGrad;
      ctx.fillRect(t.x - t.width, 0, t.width * 2, groundY);
    }

    // Shadow on ground from tree
    const shadowDir = t.x < fireX ? 1 : -1;
    const shadowLen = 80 + Math.sin(time * 0.005) * 20;
    ctx.fillStyle = `rgba(0, 0, 0, ${0.3 + Math.sin(time * 0.007) * 0.1})`;
    ctx.beginPath();
    ctx.moveTo(t.x + shadowDir * t.width / 2, groundY);
    ctx.lineTo(t.x + shadowDir * (t.width / 2 + shadowLen), groundY + 15);
    ctx.lineTo(t.x + shadowDir * (t.width / 2 + shadowLen + 30), groundY + 5);
    ctx.lineTo(t.x + shadowDir * t.width / 2, groundY - 5);
    ctx.fill();
  }
}

function drawStones() {
  for (const s of stones) {
    const dist = Math.abs(s.x - fireX);
    const influence = Math.max(0, 1 - dist / 200);
    const brightness = 30 + influence * fireGlow * 40;

    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.w / 2, s.h / 2, 0, 0, Math.PI * 2);
    const stoneGrad = ctx.createRadialGradient(s.x - 2, s.y - 2, 1, s.x, s.y, s.w / 2);
    stoneGrad.addColorStop(0, `rgb(${brightness + 20}, ${brightness + 10}, ${brightness})`);
    stoneGrad.addColorStop(1, `rgb(${brightness - 10}, ${brightness - 15}, ${brightness - 20})`);
    ctx.fillStyle = stoneGrad;
    ctx.fill();

    // Stone highlight from fire
    if (influence > 0.2) {
      ctx.beginPath();
      ctx.ellipse(s.x - 2, s.y - 1, s.w / 3, s.h / 3, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 150, 50, ${influence * fireGlow * 0.15})`;
      ctx.fill();
    }
  }
}

function drawLogs(time) {
  for (let i = logs.length - 1; i >= 0; i--) {
    const log = logs[i];

    if (!log.collapsed) {
      log.burn += 1 / 60;
      log.glowIntensity = Math.min(1, log.burn / 30);

      if (log.burn >= log.maxBurn) {
        log.collapsed = true;
        log.respawnTimer = 300 + Math.random() * 200;
      }
    } else {
      log.respawnTimer--;
      if (log.respawnTimer <= 0) {
        const angle = Math.random() * Math.PI * 2;
        const len = 60 + Math.random() * 40;
        log.x = fireX + Math.cos(angle) * 15;
        log.y = fireY - 2;
        log.angle = angle + (Math.random() - 0.5) * 0.5;
        log.length = len;
        log.thickness = 10 + Math.random() * 8;
        log.burn = 0;
        log.maxBurn = 300 + Math.random() * 400;
        log.collapsed = false;
        log.glowIntensity = 0;
      }
    }

    if (log.collapsed) continue;

    const burnRatio = log.burn / log.maxBurn;
    const endX = log.x + Math.cos(log.angle) * log.length;
    const endY = log.y + Math.sin(log.angle) * log.length;

    // Log body
    ctx.beginPath();
    ctx.moveTo(log.x, log.y);
    ctx.lineTo(endX, endY);
    const logDarkness = Math.floor(60 - burnRatio * 30);
    ctx.strokeStyle = `rgb(${logDarkness}, ${Math.floor(logDarkness * 0.6)}, ${Math.floor(logDarkness * 0.3)})`;
    ctx.lineWidth = log.thickness * (1 - burnRatio * 0.3);
    ctx.lineCap = 'round';
    ctx.stroke();

    // Charred texture
    ctx.beginPath();
    ctx.moveTo(log.x, log.y);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = `rgba(20, 10, 5, ${0.3 + burnRatio * 0.4})`;
    ctx.lineWidth = log.thickness * (1 - burnRatio * 0.3) * 0.6;
    ctx.stroke();

    // Glowing cracks
    if (log.glowIntensity > 0.1) {
      const glowAlpha = log.glowIntensity * fireGlow * (0.6 + Math.sin(time * 0.02 + i) * 0.3);
      ctx.beginPath();
      ctx.moveTo(log.x + Math.cos(log.angle) * log.length * 0.3, log.y + Math.sin(log.angle) * log.length * 0.3);
      ctx.lineTo(log.x + Math.cos(log.angle) * log.length * 0.7, log.y + Math.sin(log.angle) * log.length * 0.7);
      ctx.strokeStyle = `rgba(255, 100, 20, ${glowAlpha})`;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Ember glow around log
      const glowGrad = ctx.createRadialGradient(
        log.x + Math.cos(log.angle) * log.length * 0.5,
        log.y + Math.sin(log.angle) * log.length * 0.5,
        2,
        log.x + Math.cos(log.angle) * log.length * 0.5,
        log.y + Math.sin(log.angle) * log.length * 0.5,
        log.thickness + 10
      );
      glowGrad.addColorStop(0, `rgba(255, 80, 10, ${glowAlpha * 0.5})`);
      glowGrad.addColorStop(1, 'rgba(255, 50, 0, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(
        log.x + Math.cos(log.angle) * log.length * 0.5,
        log.y + Math.sin(log.angle) * log.length * 0.5,
        log.thickness + 10, 0, Math.PI * 2
      );
      ctx.fill();
    }
  }
}

function drawFlames(time) {
  for (let i = flameParticles.length - 1; i >= 0; i--) {
    const p = flameParticles[i];
    p.wobble += p.wobbleSpeed;
    p.x += p.vx + Math.sin(p.wobble) * 0.5;
    p.y += p.vy;
    p.life -= p.decay;
    p.size *= 0.995;

    if (p.life <= 0) { flameParticles.splice(i, 1); continue; }

    let r, g, b, alpha;
    if (p.layer < 0.3) {
      // Inner bright core
      r = 255;
      g = 240 + Math.floor(p.life * 15);
      b = 200 + Math.floor(p.life * 55);
      alpha = p.life * 0.9;
    } else if (p.layer < 0.7) {
      // Middle orange
      r = 255;
      g = 120 + Math.floor(p.life * 80);
      b = Math.floor(p.life * 30);
      alpha = p.life * 0.7;
    } else {
      // Outer red/dark
      r = 200 + Math.floor(p.life * 55);
      g = 50 + Math.floor(p.life * 50);
      b = 0;
      alpha = p.life * 0.5;
    }

    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
    grad.addColorStop(0.5, `rgba(${r}, ${Math.floor(g * 0.7)}, ${Math.floor(b * 0.5)}, ${alpha * 0.5})`);
    grad.addColorStop(1, `rgba(${Math.floor(r * 0.5)}, ${Math.floor(g * 0.3)}, 0, 0)`);

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}

function drawEmbers() {
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.spiralAngle += e.spiralSpeed;
    e.x += e.vx + Math.cos(e.spiralAngle) * 0.5;
    e.y += e.vy;
    e.vy -= 0.005; // slight upward acceleration
    e.life -= e.decay;

    if (e.life <= 0) { embers.splice(i, 1); continue; }

    const alpha = e.life;
    const size = e.size * (0.5 + e.life * 0.5);

    ctx.beginPath();
    ctx.arc(e.x, e.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, ${Math.floor(100 + e.life * 100)}, 20, ${alpha})`;
    ctx.fill();

    // Glow
    const glowGrad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, size * 3);
    glowGrad.addColorStop(0, `rgba(255, 150, 50, ${alpha * 0.3})`);
    glowGrad.addColorStop(1, 'rgba(255, 80, 0, 0)');
    ctx.beginPath();
    ctx.arc(e.x, e.y, size * 3, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();
  }
}

function drawHeatDistortion(time) {
  ctx.save();
  ctx.globalAlpha = 0.08 + fireGlow * 0.05;
  for (const hw of heatWaves) {
    hw.phase += hw.speed;
    ctx.beginPath();
    ctx.moveTo(hw.x, hw.y);
    for (let dy = 0; dy < hw.height; dy += 2) {
      const waveX = hw.x + Math.sin(hw.phase + dy * 0.1) * hw.amplitude;
      ctx.lineTo(waveX, hw.y - dy);
    }
    ctx.strokeStyle = `rgba(255, 200, 100, 0.5)`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function drawFireGlow(time) {
  // Main fire glow
  const glowRadius = 180 + fireGlow * 40;
  const glowGrad = ctx.createRadialGradient(fireX, fireY - 20, 5, fireX, fireY - 20, glowRadius);
  glowGrad.addColorStop(0, `rgba(255, 120, 30, ${fireGlow * 0.35})`);
  glowGrad.addColorStop(0.3, `rgba(255, 80, 10, ${fireGlow * 0.15})`);
  glowGrad.addColorStop(0.6, `rgba(200, 50, 0, ${fireGlow * 0.05})`);
  glowGrad.addColorStop(1, 'rgba(100, 20, 0, 0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(fireX, fireY - 20, glowRadius, 0, Math.PI * 2);
  ctx.fill();

  // Ground glow
  const groundGlow = ctx.createRadialGradient(fireX, fireY, 5, fireX, fireY, 150);
  groundGlow.addColorStop(0, `rgba(255, 100, 20, ${fireGlow * 0.3})`);
  groundGlow.addColorStop(1, 'rgba(255, 50, 0, 0)');
  ctx.fillStyle = groundGlow;
  ctx.beginPath();
  ctx.ellipse(fireX, fireY, 150, 40, 0, 0, Math.PI * 2);
  ctx.fill();

  // Upward light cone
  const coneGrad = ctx.createRadialGradient(fireX, fireY - 60, 10, fireX, fireY - 100, 200);
  coneGrad.addColorStop(0, `rgba(255, 140, 50, ${fireGlow * 0.12})`);
  coneGrad.addColorStop(1, 'rgba(255, 80, 20, 0)');
  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.moveTo(fireX - 10, fireY);
  ctx.lineTo(fireX - 180, 0);
  ctx.lineTo(fireX + 180, 0);
  ctx.lineTo(fireX + 10, fireY);
  ctx.fill();
}

function drawFireShadow(time) {
  // Shadows cast by firelight on trees
  for (const t of trees) {
    const dist = Math.abs(t.x - fireX);
    const influence = Math.max(0, 1 - dist / 400);
    if (influence > 0) {
      const shadowDir = t.x < fireX ? -1 : 1;
      const shadowJitter = Math.sin(time * 0.015) * 15 + Math.sin(time * 0.023) * 10;
      const shadowAlpha = influence * fireGlow * 0.4;

      ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
      ctx.beginPath();
      ctx.moveTo(t.x - shadowDir * t.width / 2, groundY);
      ctx.lineTo(t.x - shadowDir * (t.width + 60 + shadowJitter), groundY + 20);
      ctx.lineTo(t.x - shadowDir * (t.width + 80 + shadowJitter), groundY + 5);
      ctx.lineTo(t.x - shadowDir * t.width / 2, groundY - 5);
      ctx.fill();
    }
  }
}

function drawSmoke(time) {
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 8; i++) {
    const age = ((time * 0.0003 + i * 0.125) % 1);
    const x = fireX + Math.sin(time * 0.001 + i * 2) * (20 + age * 40);
    const y = fireY - 60 - age * 120;
    const size = 15 + age * 40;
    const alpha = (1 - age) * 0.06;

    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(150, 150, 160, ${alpha})`;
    ctx.fill();
  }
  ctx.restore();
}

let lastTime = 0;
function animate(time) {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawStars(time);
  spawnMeteor();
  drawMeteors();
  drawGround();
  drawFireGlow(time);
  drawSmoke(time);
  drawTrees(time);
  drawFireShadow(time);
  drawGrass(time);
  drawStones();
  drawLogs(time);

  updateFireGlow();
  spawnFlame();
  spawnFlame();
  spawnFlame();
  drawFlames(time);
  drawEmbers();
  drawHeatDistortion(time);

  // Vignette
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.75);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(animate);
</script>
