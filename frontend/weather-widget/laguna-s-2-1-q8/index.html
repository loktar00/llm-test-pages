<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<style>
  :root {
    --bg-day: linear-gradient(160deg, #74b9ff, #0984e3);
    --bg-night: linear-gradient(160deg, #0f0c29, #272763);
    --card-bg: rgba(255,255,255,0.12);
    --text: #fff;
    --text-dim: rgba(255,255,255,0.7);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg-day);
    transition: background 1s ease;
  }
  body.night { background: var(--bg-night); }
  .widget {
    width: 360px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px;
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    backdrop-filter: blur(12px);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .location {
    font-size: 1.3rem;
    font-weight: 600;
  }
  .condition {
    font-size: .9rem;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .toggle {
    cursor: pointer;
    background: rgba(255,255,255,0.18);
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: .8rem;
    color: var(--text);
    transition: all .3s;
  }
  .toggle:hover { background: rgba(255,255,255,0.3); }
  .temp-display {
    font-size: 4rem;
    font-weight: 200;
    text-align: center;
    margin: 20px 0;
    line-height: 1;
  }
  .scene {
    width: 120px;
    height: 120px;
    margin: -50px auto 0;
    position: relative;
  }
  .sun {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd43b, #f7971e);
    box-shadow: 0 0 40px #ffd43b;
    animation: pulse 4s infinite ease-in-out;
    z-index: 1;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 30px #ffd43b; }
    50% { transform: scale(1.05); box-shadow: 0 0 50px #ffd43b; }
  }
  .cloud {
    position: absolute;
    top: 40px;
    left: 30px;
    width: 90px;
    height: 40px;
    background: #fff;
    border-radius: 50%;
    z-index: 2;
    box-shadow: 
      -25px 0 0 -5px #fff,
      25px 0 0 -5px #fff,
      -12px -10px 0 -5px #fff,
      12px -10px 0 -5px #fff;
    animation: drift 12s infinite linear;
  }
  @keyframes drift {
    0% { transform: translateX(0) scale(1); opacity: .9; }
    50% { transform: translateX(10px) scale(1.02); opacity: .85; }
    100% { transform: translateX(0) scale(1); opacity: .9; }
  }
  .hourly-strip {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 8px;
    margin-bottom: 24px;
  }
  .hourly-strip::-webkit-scrollbar { display: none; }
  .hour {
    scroll-snap-align: start;
    min-width: 56px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    flex-shrink: 0;
  }
  .hour .time { font-size: .8rem; color: var(--text-dim); }
  .hour .temp { font-size: 1.2rem; font-weight: 600; margin-top: 4px; }
  .hour-icon { width: 24px; height: 24px; margin: 6px auto; }
  .forecast-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .day-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: .9rem;
  }
  .day-left { display: flex; align-items: center; gap: 10px; }
  .day-name { font-weight: 500; min-width: 60px; }
  .mini-icon { width: 22px; height: 22px; }
  .day-right { text-align: right; font-weight: 600; }

/* Icons */
.icon-sunny {
  position: relative;
  background: transparent;
}
.icon-sunny::before {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #ffd43b;
  box-shadow: 0 0 8px #ffd43b;
}
.icon-sunny::after {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid transparent;
  animation: rotate 20s linear infinite;
}
.icon-sunny::after {
  border-top-color: #ffd43b;
}

.icon-rain {
  position: relative;
  background: transparent;
}
.icon-rain::before {
  content: "";
  position: absolute;
  top: 2px; left: 6px;
  width: 3px; height: 12px;
  background: #74b9ff;
  border-radius: 2px;
  box-shadow: 
    10px 0 0 0 #74b9ff,
    20px 0 0 0 #74b9ff;
  animation: fall 2s infinite linear;
}
.icon-rain::after {
  content: "";
  position: absolute;
  top: 10px; left: 1px;
  width: 3px; height: 12px;
  background: #74b9ff;
  border-radius: 2px;
  box-shadow: 
    10px 0 0 0 #74b9ff,
    20px 0 0 0 #74b9ff;
  animation: fall 2.5s infinite linear;
}
@keyframes fall {
  0% { transform: translateY(0); opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(18px); opacity: 0; }
}

.icon-cloud {
  position: relative;
}
.icon-cloud::before {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  width: 26px; height: 14px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 
    -7px 0 0 0 #fff,
    7px 0 0 0 #fff;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="widget">
  <div class="top-row">
    <div>
      <div class="location">San Francisco</div>
      <div class="condition">Partly Cloudy</div>
    </div>
    <button class="toggle" id="unitToggle">°C</button>
  </div>

  <div class="temp-display" id="tempDisplay">24°</div>

  <div class="scene">
    <div class="sun"></div>
    <div class="cloud"></div>
  </div>

  <div class="hourly-strip" id="hourlyStrip">
    <!-- Filled by JS -->
  </div>

  <ul class="forecast-list" id="forecastList">
    <!-- Filled by JS -->
  </ul>
</div>

<script>
(() => {
  const data = {
    current: { tempC: 24, tempF: 75, condition: "Partly Cloudy", location: "San Francisco" },
    hourly: [
      { time: "9 AM", tempC: 22, tempF: 72, icon: "sunny" },
      { time: "10 AM", tempC: 23, tempF: 73, icon: "sunny" },
      { time: "11 AM", tempC: 24, tempF: 75, icon: "cloud" },
      { time: "12 PM", tempC: 25, tempF: 77, icon: "sunny" },
      { time: "1 PM", tempC: 26, tempF: 79, icon: "sunny" },
      { time: "2 PM", tempC: 27, tempF: 81, icon: "sunny" },
      { time: "3 PM", tempC: 26, tempF: 79, icon: "cloud" },
      { time: "4 PM", tempC: 25, tempF: 77, icon: "sunny" },
      { time: "5 PM", tempC: 24, tempF: 75, icon: "sunny" },
      { time: "6 PM", tempC: 23, tempF: 73, icon: "rain" }
    ],
    forecast: [
      { day: "Mon", tempC: 26, tempF: 79, icon: "sunny" },
      { day: "Tue", tempC: 22, tempF: 72, icon: "rain" },
      { day: "Wed", tempC: 24, tempF: 75, icon: "cloud" },
      { day: "Thu", tempC: 27, tempF: 81, icon: "sunny" },
      { day: "Fri", tempC: 23, tempF: 73, icon: "rain" }
    ]
  };

  let unit = 'C';
  const tempDisplay = document.getElementById('tempDisplay');
  const unitToggle = document.getElementById('unitToggle');
  const hourlyStrip = document.getElementById('hourlyStrip');
  const forecastList = document.getElementById('forecastList');
  const body = document.body;

  // Fake clock: simulate day/night cycle based on a fake hour
  let fakeHour = new Date().getHours();
  const updateDayNight = () => {
    body.classList.toggle('night', fakeHour >= 19 || fakeHour <= 6);
  };
  updateDayNight();

  const renderTemp = (val) => {
    let el = tempDisplay;
    let start = parseFloat(el.textContent) || 0;
    let end = val;
    let step = (end - start) / 20;
    let count = 0;
    let interval = setInterval(() => {
      count++;
      start = parseFloat((start + step).toFixed(1));
      if ((step > 0 && start >= end) || (step < 0 && start <= end)) {
        start = end;
        clearInterval(interval);
      }
      el.textContent = start.toFixed(0) + '°';
    }, 25);
  };

  function renderHourly() {
    hourlyStrip.innerHTML = '';
    data.hourly.forEach(h => {
      const div = document.createElement('div');
      div.className = 'hour';
      const t = unit === 'C' ? h.tempC : h.tempF;
      div.innerHTML = `
        <div class="time">${h.time}</div>
        <div class="hour-icon icon-${h.icon}"></div>
        <div class="temp">${t}°</div>
      `;
      hourlyStrip.appendChild(div);
    });
  }

  function renderForecast() {
    forecastList.innerHTML = '';
    data.forecast.forEach(d => {
      const li = document.createElement('li');
      li.className = 'day-row';
      const t = unit === 'C' ? d.tempC : d.tempF;
      li.innerHTML = `
        <div class="day-left">
          <span class="day-name">${d.day}</span>
          <span class="mini-icon icon-${d.icon}"></span>
        </div>
        <div class="day-right">${t}°</div>
      `;
      forecastList.appendChild(li);
    });
  }

  unitToggle.addEventListener('click', () => {
    unit = unit === 'C' ? 'F' : 'C';
    unitToggle.textContent = `°${unit}`;
    const curr = unit === 'C' ? data.current.tempC : data.current.tempF;
    renderTemp(curr);
    renderHourly();
    renderForecast();
  });

  // Initial
  renderTemp(data.current[unit === 'C' ? 'tempC' : 'tempF']);
  renderHourly();
  renderForecast();
})();
</script>
</body>
</html>
