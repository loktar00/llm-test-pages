<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteor Storm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();
window.addEventListener('resize',resize);

const stars=[];
for(let i=0;i<400;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H*0.75,r:Math.random()*1.6+0.2,tw:Math.random()*Math.PI*2,spd:Math.random()*0.02+0.005});
}

function drawRidge(){
  ctx.fillStyle='#08080e';
  ctx.beginPath();
  ctx.moveTo(0,H);
  const seg=150;
  for(let i=0;i<=seg;i++){
    const x=(i/seg)*W;
    const b=H*0.73;
    const y=b+Math.sin(i*0.12)*H*0.09+Math.sin(i*0.28+1.5)*H*0.045+Math.sin(i*0.04+0.5)*H*0.14-Math.max(0,Math.sin(i*0.7+2))*H*0.035;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();

  ctx.fillStyle='#040408';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let i=0;i<=seg;i++){
    const x=(i/seg)*W;
    const b=H*0.84;
    const y=b+Math.sin(i*0.18+3)*H*0.055+Math.sin(i*0.42+1)*H*0.03;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

const meteors=[];
let skyFlash=0;

class Meteor{
  constructor(bolide){
    this.bolide=bolide;this.reset();
  }
  reset(){
    const s=Math.random();
    if(s<0.55){this.x=Math.random()*W*1.3-W*0.15;this.y=-30;}
    else if(s<0.82){this.x=-30;this.y=Math.random()*H*0.35;}
    else{this.x=W+30;this.y=Math.random()*H*0.35;}
    const angle=Math.PI*0.12+Math.random()*Math.PI*0.5;
    const spd=this.bolide?3+Math.random()*3:5+Math.random()*12;
    this.vx=Math.cos(angle)*spd*(Math.random()>0.25?1:-0.4);
    this.vy=Math.sin(angle)*spd;
    this.life=1;
    this.decay=this.bolide?0.002+Math.random()*0.003:0.012+Math.random()*0.022;
    this.sz=this.bolide?3+Math.random()*3:1+Math.random()*2;
    this.tLen=this.bolide?80:25+Math.random()*50;
    this.hue=this.bolide?25+Math.random()*40:185+Math.random()*70;
    this.sat=this.bolide?50+Math.random()*50:15+Math.random()*35;
    this.lit=this.bolide?85+Math.random()*15:65+Math.random()*35;
    this.tColor=this.bolide?{r:255,g:160,b:60}:{r:140,g:180,b:255};
  }
  update(){
    this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;
    return this.life>0&&this.x>-150&&this.x<W+150&&this.y<H+100;
  }
  draw(){
    const a=Math.max(0,this.life);
    const ta=Math.atan2(this.vy,this.vx);
    const tx=this.x-Math.cos(ta)*this.tLen*a;
    const ty=this.y-Math.sin(ta)*this.tLen*a;
    const tc=this.tColor;
    const g=ctx.createLinearGradient(this.x,this.y,tx,ty);
    g.addColorStop(0,`rgba(${tc.r},${tc.g},${tc.b},${a*0.85})`);
    g.addColorStop(0.25,`rgba(${tc.r},${tc.g},${tc.b},${a*0.45})`);
    g.addColorStop(1,`rgba(${tc.r},${tc.g},${tc.b},0)`);
    ctx.strokeStyle=g;
    ctx.lineWidth=this.sz*(this.bolide?2.8:1.3);
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(tx,ty);ctx.stroke();

    if(this.bolide){
      const sg=ctx.createLinearGradient(this.x,this.y,tx,ty);
      sg.addColorStop(0,`rgba(255,255,240,${a*0.3})`);
      sg.addColorStop(1,`rgba(255,255,240,0)`);
      ctx.strokeStyle=sg;
      ctx.lineWidth=this.sz*6;
      ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(tx,ty);ctx.stroke();
    }

    const gs=this.sz*(this.bolide?10:5);
    const hg=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,gs);
    hg.addColorStop(0,`hsla(${this.hue},${this.sat}%,100%,${a})`);
    hg.addColorStop(0.2,`hsla(${this.hue},${this.sat}%,${this.lit}%,${a*0.7})`);
    hg.addColorStop(1,`hsla(${this.hue},${this.sat}%,${this.lit}%,0)`);
    ctx.fillStyle=hg;
    ctx.beginPath();ctx.arc(this.x,this.y,gs,0,Math.PI*2);ctx.fill();

    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath();ctx.arc(this.x,this.y,this.sz*0.5,0,Math.PI*2);ctx.fill();
  }
}

let waveTime=0,lastSpawn=0,lastBolide=-2000;

function spawnMeteors(dt){
  waveTime+=dt;
  const i1=Math.sin(waveTime*0.28)*0.5+0.5;
  const i2=Math.sin(waveTime*0.11+1.2)*0.35+0.35;
  const i3=Math.sin(waveTime*0.06+2.8)*0.25+0.25;
  const intensity=(i1+i2+i3)/3;

  const interval=Math.max(20,380-intensity*340);
  if(waveTime-lastSpawn>interval/16){
    if(Math.random()<0.5+intensity*0.5){
      meteors.push(new Meteor(false));
    }
    lastSpawn=waveTime;
  }

  if(intensity>0.65&&waveTime-lastBolide>250){
    if(Math.random()<0.015*intensity){
      meteors.push(new Meteor(true));
      skyFlash=0.35+Math.random()*0.25;
      lastBolide=waveTime;
    }
  }

  for(let i=meteors.length-1;i>=0;i--){
    if(!meteors[i].update())meteors.splice(i,1);
  }

  if(skyFlash>0){skyFlash*=0.95;if(skyFlash<0.003)skyFlash=0;}
}

function drawFrame(){
  ctx.fillStyle='rgba(5,5,15,0.12)';
  ctx.fillRect(0,0,W,H);

  const t=waveTime;
  for(const s of stars){
    const tw=Math.sin(t*s.spd*60+s.tw)*0.35+0.65;
    const al=Math.min(1,tw+skyFlash*3);
    ctx.fillStyle=`rgba(190,200,240,${al})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }

  drawRidge();

  for(const m of meteors)m.draw();

  if(skyFlash>0){
    const fg=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,W*0.8);
    fg.addColorStop(0,`rgba(220,200,170,${skyFlash*0.4})`);
    fg.addColorStop(1,`rgba(220,200,170,${skyFlash*0.05})`);
    ctx.fillStyle=fg;
    ctx.fillRect(0,0,W,H);
  }
}

let lastTime=performance.now();
ctx.fillStyle='#05050f';ctx.fillRect(0,0,W,H);

function loop(now){
  const dt=Math.min(0.05,(now-lastTime)/1000);
  lastTime=now;
  spawnMeteors(dt);
  drawFrame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
