<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Landing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            background: #0f172a;
            color: #e2e8f0;
        }
        .scene {
            position: relative;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mountains {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .mountain {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 60%;
            background: var(--color);
            clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
            will-change: transform;
        }
        .mountain:nth-child(1) { left: -50%; }
        .mountain:nth-child(2) { left: 0%; }
        .mountain:nth-child(3) { left: 50%; }

        /* Scene 1 */
        #s1 .m1 { --color: #334155; }
        #s1 .m2 { --color: #475569; }
        #s1 .m3 { --color: #64748b; }

        /* Scene 2 */
        #s2 { background: #1e293b; }
        #s2 .m1 { --color: #475569; }
        #s2 .m2 { --color: #64748b; }
        #s2 .m3 { --color: #94a3b8; }

        /* Scene 3 */
        #s3 { background: #334155; }
        #s3 .m1 { --color: #64748b; }
        #s3 .m2 { --color: #94a3b8; }
        #s3 .m3 { --color: #cbd5e1; }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 720px;
            padding: 2rem;
        }
        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cta {
            margin-top: 1.5rem;
            display: inline-block;
            padding: 0.8rem 2rem;
            border: 1px solid #94a3b8;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 500;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .cta:hover {
            background: rgba(26, 33, 62, 0.8);
            border-color: #e2e8f0;
            transform: translateY(-2px);
        }

        /* Pinned headline */
        .pinned-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .pinned-text {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f8fafc, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .pinned-text.visible { opacity: 1; }

        /* Scene heights for spacing */
        #spacer { height: 100vh; }
        #spacer2 { height: 60vh; }

        .final-cta {
            padding: 8vh 2rem;
            text-align: center;
        }
        .final-cta h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <!-- Scene 1 -->
    <section class="scene" id="s1">
        <div class="mountains">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>
        <div class="content">
            <h1>Journey through stillness</h1>
        </div>
    </section>

    <!-- Pinned headline -->
    <div class="pinned-wrapper">
        <span class="pinned-text" id="pinned">Depth in motion</span>
    </div>

    <!-- Spacer -->
    <div id="spacer"></div>

    <!-- Scene 2 -->
    <section class="scene" id="s2">
        <div class="mountains">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>
        <div class="content">
            <h1>Layers of calm</h1>
        </div>
    </section>

    <!-- Spacer -->
    <div id="spacer2"></div>

    <!-- Scene 3 -->
    <section class="scene" id="s3">
        <div class="mountains">
            <div class="mountain m1"></div>
            <div class="mountain m2"></div>
            <div class="mountain m3"></div>
        </div>
        <div class="content">
            <h1>Arrival</h1>
            <a href="#" class="cta">Begin your journey</a>
        </div>
    </section>

    <script>
        const mountains = document.querySelectorAll('.mountain');
        const pinnedText = document.getElementById('pinned');
        const pinnedWrapper = document.querySelector('.pinned-wrapper');
        let ticking = false;

        function updateParallax() {
            const scrollY = window.scrollY;
            const vh = window.innerHeight;

            // Parallax depth layers
            mountains.forEach((m, i) => {
                const speed = [0.05, 0.15, 0.3][i % 3];
                m.style.transform = `translateY(${scrollY * speed}px)`;
            });

            // Pinned headline logic
            const pinStart = vh * 1.2; // Start of pinned zone
            const pinEnd = vh * 2.2;   // End of pinned zone

            if (scrollY >= pinStart && scrollY < pinEnd) {
                pinnedText.classList.add('visible');
            } else {
                pinnedText.classList.remove('visible');
            }

            ticking = false;
        }

        function onScroll() {
            if (!ticking) {
                requestAnimationFrame(updateParallax);
                ticking = true;
            }
        }

        window.addEventListener('scroll', onScroll);
        window.addEventListener('load', updateParallax);
    </script>
</body>
</html>
