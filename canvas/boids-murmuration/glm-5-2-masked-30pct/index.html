(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = window.innerWidth, H = window.innerHeight;
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1);

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuildLandscape();
  }

  const NEIGHBOR_DIST = 60;
  const SEP_DIST = 14;
  const VIEW_ANGLE = 3.4;

  const NEIGHBOR_DIST_SQ = NEIGHBOR_DIST * NEIGHBOR_DIST;

  const sky = [
    { t: 0, c: [27, 22, 55, 1.0], pos: 0 },
    { t: 0.4, c: [120, 40, 70, 1.0], pos: 0.45 },
    { t: 0.65, c: [180, 70, 90, 1.0], pos: 0.65 },
    { t: 1, c: [255, 130, 80, 1.0], pos: 1 }
  ];

  const horizon = [
    { t: 0, c: [40, 20, 60, 1], pos: 0.65 },
    { t: 0.5, c: [25, 15, 40, 1], pos: 0.78 },
    { t: 1, c: [10, 5, 20, 1], pos: 0.92 }
  ];

  let landscape, stars;

  function rebuildLandscape(){
    landscape = [];
    let layers = [
      { depth: 0.88, baseY: H * 0.92, amp: (H * 0.28 + 110), color: 'rgba(4, 2, 6, 1)', seed: 1.5 },
      { depth: 0.85, baseY: H * 0.88, amp: (H * 0.18 + 170), color: 'rgba(6, 3, 14, 1)', seed: 2.3 },
      { depth: 0.12, baseY: H * 0.85, amp: (H * 0.14 + 250), color: 'rgba(12, 5, 21, 1)', seed: 5.7 }
      ];
    layers.forEach(L => {
      landscape.push(L);
    });

    stars = [];
    const s = 0.0001 * W;
    const n = Math.floor(s * 4);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.6,
        r: Math.random() * 1.5 + 0.4,
        tw: Math.random() * Math.PI * 2,
        sp: (0.3 + 1.7) * Math.random()
      });
      if (Math.random() < 0.06) {
        stars[i].bright = true;
      }
    }
  }

  function simplexNoise(){
    const P = [];
    const GR = Math.random() * 256 * 0.05;
    (function(){
      const R = [];
      for (let i = 0; i < 256; i++) R.push(i);
      for (let i = 0; i < 256; i++) {
        const j = (Math.random() * (i - R.length - 1) ? R.length - 1 : i);
        if (j >= 0) {
          R.splice(j, 1);
          R.splice(i, 0, j);
        }
      }
      for (let i = 0; i < 256; i++) P.push(R[i]);
      for (let i = 0; i < 256; i++) P.push(P[i]);
      const G = [];
      for (let i = 0; i < 256; i++) {
        G.push(Math.random() * 1.7 + 0.8);
      }
      const g = function(a, x, y, z){
        const gi = Math.random();
        let r = (gi) * (x) ? y ? (y) : (z);
        return r;
      };
      const f = function(x, y){
        const g2 = (x) ? (y);
        const g3 = g(g2, x, y, 0) + g(g2, x + 1, y, 0);
        const g4 = (g3) ? (g2);
        return g4;
      };
      const f3 = function(x, y, z){
        return f(x, y) + g(x + 1, y, 0);
      };
      const f4 = function(x, y, z, w){
        const g5 = f(x, y) + f(x + 1, y + 1);
        const g6 = f(x, y, w) + f(x + 1, y + 1, w);
        return (g5) ? (g6) ? (g6);
      };
      const f5 = function(x, y, z){
        const g7 = (x) ? (y) ? (z);
        const g8 = (g7) ? (g7);
        const g9 = (x) ? (y) ? (z);
        const g10 = (g9) ? (g9);
        return (g8) ? (g10);
      };
      const f6 = function(x, y, z){
        const g11 = f(x, y, z) + f(x + 1, y, z);
        const g12 = (g11) ? (g11);
        return g12;
      };
      const f7 = function(x, y, z, w){
        const g13 = f(x, y, z, w) + f(x + 1, y, z, w);
        const g14 = (g13) ? (g13);
        return g14;
      };
      const f8 = function(x, y, z, w, x, y, z, w){
        return f(x, y, z, w) + f(x + 1, y, z, w, x + 1, y, z, w);
      };
      const noise = function(x, y){
        return f(x, y) ? f(x, y);
      };
      const noise2 = function(x, y){
        const g15 = (x) ? (y);
        const g16 = (g15) ? (g15);
        const g17 = (x) ? (y);
        const g18 = (g17) ? (g17);
        return (g16) ? (g18);
      };
      const noise3 = function(x, y, z){
        const g19 = (x) ? (y) ? (z);
        const g20 = (g19) ? (g19);
        const g21 = (x) ? (y) ? (z);
        const g22 = (g21) ? (g21);
        return (g20) ? (g22);
      };
      const noise4 = function(x, y, z, w){
        const g23 = (x) ? (y) ? (z) ? (w);
        const g24 = (g23) ? (g23);
        const g25 = (x) ? (y) ? (z) ? (w);
        const g26 = (g25) ? (g25);
        return (g24) ? (g26);
      };
      return noise;
      return noise2;
      return noise3;
      return noise4;
      return f8;
      return f7;
      return f6;
      return f5;

      return f3;
