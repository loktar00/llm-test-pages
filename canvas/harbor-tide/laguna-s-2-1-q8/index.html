<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harbor at Dusk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="harborCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('harborCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const time = { value: 0 };
  const skyColors = {
    dawn: ['#1a1a40', '#4a3a7d', '#7a4a8c'],
    dusk: ['#0d1b2a', '#2c3e70', '#5e3580']
  };

  // Sunset looping colors
  function getSkyGradient(t) {
    const cycle = (Math.sin(t * 0.05) + 1) / 2;
    const r = Math.floor(13 + cycle * 30);
    const g = Math.floor(10 + cycle * 50);
    const b = Math.floor(40 + cycle * 80);
    return `rgb(${r},${g},${b})`;
  }

  function drawSky(dt) {
    const grd = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.7);
    grd.addColorStop(0, getSkyGradient(time.value + 10));
    grd.addColorStop(0.5, getSkyGradient(time.value + 5));
    grd.addColorStop(1, getSkyGradient(time.value));
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Wave system - multiple layers
  function drawWaves(dt) {
    const waveLayers = [
      { amp: 8, freq: 0.002, speed: 0.2, alpha: 0.15 },
      { amp: 5, freq: 0.004, speed: 0.4, alpha: 0.25 },
      { amp: 3, freq: 0.008, speed: 0.6, alpha: 0.4 }
    ];

    waveLayers.forEach(layer => {
      ctx.beginPath();
      for (let x = 0; x <= canvas.width; x += 10) {
        const y = Math.sin((x * layer.freq) + time.value * layer.speed) * layer.amp +
                  Math.cos((x * layer.freq * 0.7) + time.value * layer.speed * 0.3) * layer.amp * 0.5;
        const baseY = canvas.height * 0.6;
        if (x === 0) {
          ctx.moveTo(x, baseY + y);
        } else {
          ctx.lineTo(x, baseY + y);
        }
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.lineTo(0, canvas.height);
      ctx.closePath();
      ctx.fillStyle = `rgba(10, 30, 60, ${layer.alpha})`;
      ctx.fill();
    });
  }

  function drawWaterSurface() {
    const surfaceY = canvas.height * 0.6;
    for (let i = 0; i < canvas.width; i += 2) {
      const wave = Math.sin((i * 0.01) + time.value * 0.3) * 1.5 +
                   Math.cos((i * 0.02) + time.value * 0.5) * 1;
      ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + Math.abs(wave) * 0.05})`;
      ctx.fillRect(i, surfaceY + wave, 2, 2);
    }
  }

  // Buoyancy simulation for boats
  function getWaveHeightAt(x, layer = 0) {
    const freqs = [0.002, 0.004, 0.008];
    const speeds = [0.2, 0.4, 0.6];
    const amps = [8, 5, 3];
    let y = 0;
    for (let i = 0; i <= layer; i++) {
      y += Math.sin((x * freqs[i]) + time.value * speeds[i]) * amps[i];
    }
    return y;
  }

  function getBoatTilt(x) {
    const delta = 0.5;
    const left = getWaveHeightAt(x - delta);
    const right = getWaveHeightAt(x + delta);
    return (right - left) * 0.02; // small tilt
  }

  const boats = [
    { x: 100, y: 0, type: 'fishing', bobPhase: 0 },
    { x: 250, y: 0, type: 'fishing', bobPhase: 1.5 },
    { x: 400, y: 0, type: 'yacht', bobPhase: 3 },
    { x: 550, y: 0, type: 'fishing', bobPhase: 4.5 }
  ];

  function drawFishingBoat(x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Hull
    ctx.beginPath();
    ctx.ellipse(0, 0, 24, 8, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#cc5522';
    ctx.fill();

    // Cabin
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(-10, -8, 20, 8);

    // Mast
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(-1, -20, 2, 14);

    // Sail
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-10, -2);
    ctx.lineTo(10, -2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawYacht(x, y, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Hull
    ctx.beginPath();
    ctx.ellipse(0, 0, 40, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#1a5276';
    ctx.fill();

    // Cabin
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(-15, -10, 30, 10);

    // Mast
    ctx.fillStyle = '#34495e';
    ctx.fillRect(-1, -35, 2, 25);

    // Sails
    ctx.fillStyle = '#ecf0f1';
    ctx.beginPath();
    ctx.moveTo(0, -32);
    ctx.lineTo(-15, 0);
    ctx.lineTo(15, 0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawBoats() {
    const waterY = canvas.height * 0.6;
    boats.forEach(boat => {
      const waveY = getWaveHeightAt(boat.x, 1);
      const tilt = getBoatTilt(boat.x);
      ctx.save();
      ctx.translate(boat.x, waterY + waveY);
      ctx.rotate(tilt);
      if (boat.type === 'fishing') {
        drawFishingBoat(0, -8, 1.2);
      } else {
        drawYacht(0, -10, 1);
      }
      ctx.restore();
    });
  }

  // Ferry with wake
  const ferry = {
    x: -100,
    y: canvas.height * 0.6,
    speed: 0.4,
    scheduledArrival: 15000,
    lastSpawn: 0
  };

  function updateFerry(dt) {
    if (time.value - ferry.lastSpawn > ferry.scheduledArrival) {
      ferry.x = -150;
      ferry.lastSpawn = time.value;
    }
    ferry.x += ferry.speed;
    if (ferry.x > canvas.width + 150) {
      ferry.lastSpawn = time.value;
    }
  }

  function drawFerry(dt) {
    const waveY = getWaveHeightAt(ferry.x, 1);
    const tilt = getBoatTilt(ferry.x);
    ctx.save();
    ctx.translate(ferry.x, ferry.y + waveY);
    ctx.rotate(tilt);

    // Ferry body
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-60, -15, 120, 30);

    // Superstructure
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(-40, -35, 80, 20);

    // Windows
    ctx.fillStyle = '#3498db';
    for (let i = -30; i <= 30; i += 25) {
      ctx.fillRect(i, -30, 15, 10);
    }

    ctx.restore();

    // Wake
    ctx.save();
    ctx.translate(ferry.x, ferry.y + waveY + 15);
    ctx.rotate(tilt);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 2;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-60, 5);
      ctx.bezierCurveTo(-40, 10 + i * 5, -20, 15 + i * 5, -ferry.speed * 30, 20 + i * 5);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Lighthouse with beam
  const lighthouse = {
    x: canvas.width * 0.8,
    y: canvas.height * 0.55
  };

  function drawLighthouse() {
    // Tower
    ctx.fillStyle = '#bdc3c7';
    ctx.fillRect(lighthouse.x - 8, lighthouse.y - 60, 16, 60);

    // Light room
    ctx.fillStyle = '#ecf0f1';
    ctx.fillRect(lighthouse.x - 12, lighthouse.y - 75, 24, 15);

    // Top
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(lighthouse.x, lighthouse.y - 75, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLighthouseBeam() {
    const beamAngle = time.value * 0.2;
    const beamWidth = 0.5;

    ctx.save();
    ctx.translate(lighthouse.x, lighthouse.y - 75);

    ctx.beginPath();
    ctx.moveTo(0, 0);

    // Volumetric beam
    const segments = 30;
    for (let i = 0; i < segments; i++) {
      const t = i / segments;
      const angle = beamAngle + (Math.sin(time.value * 0.5) * 0.1);
      const spread = 0.3;
      const a1 = angle - spread;
      const a2 = angle + spread;

      const dist = t * 200;
      const x1 = Math.cos(a1) * dist;
      const y1 = Math.sin(a1) * dist;
      const x2 = Math.cos(a2) * dist;
      const y2 = Math.sin(a2) * dist;

      if (i === 0) {
        ctx.moveTo(x1, y1);
      } else {
        ctx.lineTo(x1, y1);
      }
    }

    // Fade out beam
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 200);
    gradient.addColorStop(0, 'rgba(255, 255, 200, 0.6)');
    gradient.addColorStop(0.7, 'rgba(255, 255, 200, 0.1)');
    gradient.addColorStop(1, 'rgba(255, 255, 220, 0)');
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.restore();
  }

  function drawSpecularGlints() {
    const waterY = canvas.height * 0.6;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    for (let i = 0; i < 30; i++) {
      const x = (Math.random() * canvas.width);
      const waveOffset = getWaveHeightAt(x, 1) * 0.3;
      const alpha = 0.3 + Math.sin(time.value * 0.5 + i) * 0.2;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(x, waterY + waveOffset, 1 + Math.sin(time.value + i) * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Reflections
  function drawReflections() {
    ctx.save();
    const reflectionY = canvas.height * 0.6 + 5;

    boats.forEach(boat => {
      const waveY = getWaveHeightAt(boat.x, 1);
      ctx.save();
      ctx.translate(boat.x, canvas.height * 0.6 + waveY + 2);
      ctx.scale(1, -0.5); // Vertical flip with squash

      // Add wobble via horizontal displacement
      const wobble = Math.sin(time.value * 0.7 + boat.bobPhase) * 2;

      if (boat.type === 'fishing') {
        ctx.translate(wobble, 0);
        drawFishingBoat(-wobble, -8, 1.2);
      } else {
        ctx.translate(wobble, 0);
        drawYacht(-wobble, -10, 1);
      }

      ctx.restore();

      // Make reflection fade with water surface
      const reflectionAlpha = 0.2 + Math.sin(time.value * 0.3) * 0.05;
    });

    // Ferry reflection
    const waveY = getWaveHeightAt(ferry.x, 1);
    ctx.save();
    ctx.translate(ferry.x, ferry.y + waveY + 3);
    ctx.scale(1, -0.4);
    const wobble = Math.sin(time.value * 0.7) * 2;
    ctx.translate(wobble, 0);
    drawFerry();
    ctx.restore();

    ctx.restore();
  }

  // Gulls
  const gulls = [
    { x: 50, y: 100, vx: 0.1, vy: 0.05, wingPhase: 0 },
    { x: 300, y: 150, vx: 0.15, vy: 0.03, wingPhase: 1 },
    { x: 600, y: 120, vx: 0.12, vy: 0.07, wingPhase: 2 },
    { x: 800, y: 90, vx: 0.08, vy: 0.02, wingPhase: 3 },
    { x: 100, y: 200, vx: 0.2, vy: 0.01, wingPhase: 4 }
  ];

  const posts = [
    { x: 150, height: 80 },
    { x: 500, height: 60 },
    { x: 700, height: 100 }
  ];

  function updateGulls(dt) {
    gulls.forEach((gull, i) => {
      gull.x += gull.vx;
      gull.y += gull.vy;

      // Wrap around
      if (gull.x > canvas.width + 50) {
        gull.x = -50;
        gull.y = 100 + Math.sin(i) * 50;
      }

      // Check landing on posts
      let landed = false;
      posts.forEach(post => {
        const dx = gull.x - post.x;
        const dy = gull.y - (canvas.height * 0.6 - post.height);
        if (Math.sqrt(dx * dx + dy * dy) < 30) {
          gull.x = post.x + Math.sin(time.value) * 2;
          gull.y = canvas.height * 0.6 - post.height - 5;
          landed = true;
        }
      });
    });
  }

  function drawGull(x, y, wingPhase) {
    ctx.save();
    ctx.translate(x, y);

    const wingFlap = Math.sin(time.value * 2 + wingPhase) * 0.3;
    ctx.rotate(wingFlap * 0.2);

    ctx.strokeStyle = '#34495e';
    ctx.lineWidth = 2;

    // Body
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Wings
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.bezierCurveTo(-15, -5 - wingFlap * 5, -15, 5 - wingFlap * 5, -6, 0);
    ctx.stroke();

    // Head
    ctx.beginPath();
    ctx.arc(8, -2, 3, 0, Math.PI * 2);
    ctx.stroke();

    // Beak
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.moveTo(10, -1);
    ctx.lineTo(15, -1);
    ctx.lineTo(12, 1);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawGulls() {
    gulls.forEach(gull => {
      drawGull(gull.x, gull.y, gull.wingPhase);
    });
  }

  function drawPosts() {
    ctx.fillStyle = '#7f8c8d';
    ctx.strokeStyle = '#95a5a6';
    ctx.lineWidth = 2;
    posts.forEach(post => {
      // Post
      ctx.fillRect(post.x - 4, canvas.height * 0.6 - post.height, 8, post.height);
      // Top platform
      ctx.fillRect(post.x - 20, canvas.height * 0.6 - post.height - 8, 40, 8);

      // Gulls might land here
      ctx.fillStyle = '#bdc3c7';
      ctx.beginPath();
      ctx.arc(post.x - 12, canvas.height * 0.6 - post.height - 8, 3, 0, Math.PI * 2);
      ctx.arc(post.x + 12, canvas.height * 0.6 - post.height - 8, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7f8c8d';
    });
  }

  // Main render loop
  let lastTime = 0;
  function animate(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = (timestamp - lastTime) / 16.67;
    lastTime = timestamp;
    time.value += dt;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update
    updateFerry(dt);
    updateGulls(dt);

    // Draw scene
    drawSky(dt);
    drawWaves(dt);
    drawLighthouse();
    drawLighthouseBeam();
    drawPosts();
    drawReflections();
    drawBoats();
    drawFerry(dt);
    drawGulls();
    drawSpecularGlints();
    drawWaterSurface();

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
