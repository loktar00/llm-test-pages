<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n-body Stable sim</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100;height:100;overflow:hidden;background:#000}
canvas{display:block;cursor:crosshair}
.hud{position:fixed;left:50;bottom:20;transform:translateX(-50)%;display:flex;flex-direction:column;gap:6;align-items:center;pointer-events:none;font-family:'JetBrains Mono','SF Mono',Courier,monospace;transition:opacity .8s ease-out}
.hud-tag{font:600 12px/1 'JetBrains Mono',Courier,monospace;letter-spacing:2.5px;color:rgba(255,255,255,.5)}
.hud-name{font:700 32px/1 'JetBrains Mono',Courier,monospace;letter-spacing:6px;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.2)}
.hud-meta{font:400 11px/1 'JetBrains Mono',Courier,monospace;color:rgba(255,255,255,.35);margin-top:8;letter-spacing:3}
.hud-bar{position:relative;width:80;height:2;background:rgba(255,255,255,.15);margin:5;overflow:hidden}
.hud-bar>div{height:100;background:rgba(255,255,255,.7);width:0;transform-origin:left}
.hud-dots{display:flex;gap:7;margin-top:5}
.hud-dot{width:5;height:5;border-radius:50;background:rgba(255,255,255,.15);transition:background .3s ease,transform .3s ease}
.hud-dot.on{background:rgba(255,255,255,.85);transform:scale(1.2)}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="hud">
  <div class="hud-tag">N-BODY GRA</div>
  <div class="hud-name">SOLAR SYSTEM</div>
  <div class="hud-meta">SUN + 5 PLANETS · 7 BODIES · 1000 SIM STEPS/F</div>
  <div class="hud-bar"><div></div></div>
  <div class="hud-dots">
    <div class="hud-dot"></div>
    <div class="hud-dot"></div>
    <div class="hud-dot"></div>
  </div>
</div>
<script>
window.addEventListener('load', function() {
  var canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  var W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
  resize();
  var stars = [];
  var dust = [];
  function buildStars() {
    stars = [];
    var n = (W * H) / 4500;
    for(var i = 0; i < n; i++) stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.pow(Math.random(), 2) * 1.6 + 0.2,
      c: Math.floor(Math.random()*3) + 1,
      t: Math.random() * Math.PI * 2,
      tw: 0.6 + Math.random() * 4
    });
    dust = [];
    var dn = Math.max(150, Math.floor((W * H) / 8000));
    for(var j = 0; j < dn; j++) dust.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*2.4 + 0.6,
      a: 0.04 + Math.random()*0.06,
      c: j % 7 === 0 ? 2 : 0,
      t: Math.random() * Math.PI * 2,
      tw: 1 + Math.random()*5
    });
  }
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', function(e) {
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft') switchScene((e.key === 'ArrowRight'));
    else switchScene(e.key === 'ArrowLeft' ? -1 : 0);
  });
  var G = 1;
  var SC = { SUN_EARTH:0, EIGHT:1, SOLAR:2 };
  var current = SC.SOLAR;
  var bodies = [];
  function reset() {
    bodies = [];
    switch(current) {
      case SC.SOLAR: solar();
      case SC.SUN_EARTH: sunEarth();
      case SC.EIGHT: figureEight(); break;
      var name = document.querySelector('.hud-name');
      name.textContent = 'SOLAR SYSTEM';
      name.style.opacity = '0';
      document.querySelector('.hud-meta').textContent = 'SUN + 5 PLANETS · 7 BODIES · 1000 SIM STEPS/FRAME';
      break;
      case SC.SUN_EARTH:
      sunEarth();
      var name = document.querySelector('.hud-name');
      name.textContent = 'SUN, EARTH & MOON';
      name.style.opacity = '0';
      document.querySelector('.hud-meta').textContent = 'SUN · 1 PLANET · 1 MOON · 3 BODIES · 1000 SIM STEPS/FRAME';
      break;
      case SC.EIGHT:
      figureEight();
      var name = document.querySelector('.hud-name');
      name.textContent = 'FIGURE 8';
      name.style.opacity = '0';
      document.querySelector('.hud-meta').textContent = '3 EQUAL M BODIES · PERIODIC MOTION · 1000 SIM STEPS/FRAME';
      break;
      }
    updateDots();
    for(var k = 0; k < bodies.length; k++) {
      bodies[k].trail = [];
      bodies[k].head = k;
      bodies[k].ti = 0;
    }
  }
  function switchScene(dir) {
    if(dir > 0) current = current + 1;
    else if(dir < 0) current = current - 1 + 3;
    else current = current + 1;
    reset();
  }
  function updateDots() {
    var dots = document.querySelectorAll('.hud-dot');
    for(var i = 0; i < dots.length; i++) dots[i].className = 'hud-dot' + (i === current ? ' on' : '');
  }
  function solar() {
    var mSun = 3000;
    var r = 25;
    bodies.push({
      name: 'Sun', m: mSun, r: r, x: 0, y: 0, vx: 0, vy: 0,
      color: '#fff9d8', rgb: [255, 249, 208], fill: '#ffd818',
      glow: '#ffd818', glowMul: 4, kind: 'sun',
      trail: [], head: 0, ti: 0, alpha: 1
    });
    var d = [ [ 'Mer', 0.30, 7.0, 0.22, 0.35 ],
    [ 'V', 0.55, 9.5, 0.45, 0.6 ],
    [ 'E', 1.0, 1.0, 1.0, 0.4 ],
    [ 'M', 4.6, 13.5, 1.05, 1.8 ],
    [ 'J', 15.8, 5.4, 1.2, 2.0 ]
    ];
    for(var i = 0; i < d.length; i++) {
      var dn = d[i][1], dVal = d[i][2], rVal = d[i][3], f = d[i][4];
      var mass = 0.30 * f;
      var a = i * 0.65;
      var x = dn * Math.cos(a), y = dn * Math.sin(a);
      var v = Math.sqrt(G * mSun / dn);
      var ang = a + Math.PI / 2;
      var vx = v * Math.cos(ang), vy = v * Math.sin(ang);
      bodies.push({
        name: dn, m: mass, r: rVal, x: x, y: y, vx: vx, vy: vy,
        color: '#fff', rgb: [255, 255, 255], fill: '#' + (i * 0) + 'c', kind: 'planet',
        glow: '#66', trail: [], head: i, ti: i * 0.05, alpha: 1
      });
      bodies[k].r = 0;
    }
    bodies[1].fill = '#a9a3a0'; bodies[1].gl = '#a9a3a0';
    bodies[2].fill = '#e8e2e2'; bodies[2].gl = '#f0ee';
    bodies[3].fill = '#e8e2e0'; bodies[3].gl = '#f0ee';
    bodies[4].fill = '#f0f0dc'; bodies[4].gl = '#fff8';
    bodies[5].fill = '#fff'; bodies[5].gl = '#fff';
    bodies[1].r = 0.22;
    bodies[2].r = 0.45;
    bodies[3].r = 0.55;
    bodies[4].r = 1.05;
    bodies[5].r = 1.8;
    }
  function sunEarth() {
    var mSun = 3000;
    var mE = 30;
    var rSun = 25;
    var dSunEarth = 7.5;
    var dEarthMoon = 0.20;
    var vE = Math.sqrt(G * mSun / dSunEarth);
    bodies.push({
      name: 'Sun', m: mSun, r: rSun, x: 0, y: 0, vx: 0, vy: 0,
      color: '#fff9d8', rgb: [255, 249, 208], fill: '#ffd818', glow: '#ffd818',
      glowMul: 5, kind: 'sun', trail: [], head: 0, ti: 0, alpha: 1
    });
    var aE = 0.8;
    var xE = dSunEarth * Math.cos(aE), yE = dSunEarth * Math.sin(aE);
    var angE = aE + Math.PI / 2;
    var vxE = vE * Math.cos(angE), vyE = vE * Math.sin(angE);
    bodies.push({
      name: 'Earth', m: mE, r: 0.45, x: xE, y: yE, vx: vxE, vy: vyE,
      color: '#fff', rgb: [255, 255, 255], fill: '#7fb3b3', glow: '#4fb0bf',
      kind: 'planet', trail: [], head: 1, ti: 0.5, alpha: 1
    });
    var vM = Math.sqrt(G * mE / dEarthMoon);
    var angM = 2.5;
    var xM = xE + dEarthMoon * Math.cos(angM), yM = yE + dEarthMoon * Math.sin(angM);
    var vMx = vxE + vM * Math.cos(angM + Math.PI / 2);
    var vMy = vyE + vM * Math.sin(angM + Math.PI / 2);
    bodies.push({
      name: 'Moon', m: 30 * 0.125, r: 0.13, x: xM, y: yM, vx: vMx, vy: vMy,
      color: '#fff', rgb: [255, 255, 255], fill: '#bcb6a6', glow: '#fff',
      kind: 'planet', trail: [], head: 2, ti: 0.5, alpha: 1
    });
  }
  function figureEight() {
    var scale = 4.5;
    var M = 1.5;
    var v = 1 / Math.sqrt(2);
    var p = [
    { x: 0.7347, y: -0.3323, vx: -0.3323, vy: 0.3323 },
    { x: -0.7347, y: +0.3323, vx: 0.3323, vy: -0.7332 },
    { x: -0.7347, y: -0.3323, vx: 0.7347, vy: 0.3323 }
    ];
    var cols = [ { c: '#fe0', g: '#fa0' }, { c: '#ff0a4f', g: '#ff4f' }, { c: '#00f0ee', g: '#0fe' } ];
    for(var i = 0; i < p.length; i++) {
      var s = p[i];
      bodies.push({
        name: 'M' + i, m: M, r: 0.45, x: s.x * scale, y: s.y * scale,
        vx: s.vx * v * scale, vy: s.vy * v * scale,
        color: cols[i].c, rgb: [200, 200, 200], fill: cols[i].c, glow: cols[i].g,
        kind: 'star', glowMul: 2, trail: [], head: i, alpha: 1
      });
    }
  }
  reset();
  var lastT = 0;
  var accum = 0;
  var SIM = 0.005;
  var SUB = 16;
  var TRAIL = 200;
  var CYCLE = 3;
  var cycleTimer = 0;
  var fadeAlpha = 1;
  var phase = 'run';
  var fadePhase = null;
  var bar = document.querySelector('.hud-bar div');
  var dots = document.querySelectorAll('.hud-dot');
  function step(dt) {
    var n = bodies.length;
    var i, j, b1, b2, dx, dy, d, f;
    for(i = 0; i < n; i++) bodies[i].fx = 0; bodies[i].fy = 0;
    for(i = 0; i < n; i++) {
      b1 = bodies[i];
      for(j = i + 1; j < n; j++) {
        b2 = bodies[j];
        dx = b2.x - b1.x; dy = b2.y - b1.y;
        d = dx * dx + dy * dy + 1e-10;
        var invD3 = 1 / d / Math.sqrt(d);
        f = G / invD3;
        b1.fx -= f * b2.m * (dx * invD3);
        b1.fy -= f * b2.m * (dy * invD3);
        b2.fx += f * b1.m * (dx * invD3);
        b2.fy += f * b1.m * (dy * invD3);
      }
    }
    for(i = 0; i < n; i++) {
      bodies[i].vx += bodies[i].fx / bodies[i].m * dt;
      bodies[i].vy += bodies[i].fy / bodies[i].m * dt;
      bodies[i].x += bodies[i].vx * dt;
      bodies[i].y += bodies[i].vy * dt;
    }
  }
  function physics(dt) {
    var subSteps = SUB;
    var sub = dt / subSteps;
    for(var i = 0; i < subSteps; i++) step(sub);
  for(var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      b.ti += dt;
    b.alpha = fadeAlpha;
    b.trail.push({ x: b.x, y: b.y });
    if(b.trail.length > TRAIL) b.trail.shift();
  }
  }
  function cycle() {
    fadePhase = 'out';
    phase = 'fade';
  fadeAlpha = 1;
  cycleTimer = 0;
  }
  function fadeOutThenSwitch() {
    phase = 'fade';
    fadeAlpha = 1;
  fadePhase = 'out';
  }
  function fadeIn() {
    phase = 'fade';
    fadePhase = 'in';
  }
  function finishCycle() {
    current++;
    if(current >= 3) current = 0;
    reset();
    phase = 'run';
    fadeAlpha = 0;
    }
  var frame = 0;
  function frame_(t) {
    var dt = t - lastT;
    lastT = t;
    if(dt > 200) dt = 0;
    if(phase === 'run') {
      cycleTimer += dt / 1000;
      physics(SIM);
      fadeAlpha = 1;
      if(cycleTimer >= CYCLE) cycle();
      fadeAlpha = 0;
      }
      if(phase === 'run') {
        physics(SIM);
        cycleTimer += dt / 1000;
        if(cycleTimer >= CYCLE) {
          phase = 'fade';
          fadeAlpha = 1;
          fadePhase = 'out';
        cycleTimer = 0;
        }
      }
      if(phase === 'fade') {
        fadeAlpha -= dt / (1.3 * 1000);
        if(fadeAlpha <= 0) {
          finishCycle();
          phase = 'fade-in';
          fadeAlpha = 0;
          fadePhase = 'in';
        }
      }
      if(phase === 'fade-in') {
        fadeAlpha += dt / (1.2 * 1000);
        if(fadeAlpha >= 1) {
          phase = 'run';
          fadeAlpha = 1;
        }
      }
      var prog = (cycleTimer / CYCLE) * fadeAlpha;
      bar.style.transform = 'scaleX(' + (prog > 0 ? prog : 0) + ')';
      draw();
    frame++;
    requestAnimationFrame(frame_);
  }
  function draw() {
    var cx = W / 2, cy = H / 2;
    var base = Math.min(W, H);
    var scale = base / 18;
    var trailScale = scale * 0.050;
    var trailLen = 200;
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#040406');
    grad.addColorStop(1, '#01010d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    var n1 = (W * H) / 4500;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1.5, 1.5);
    ctx.globalAlpha = 0.07;
    for(var i = 0; i < n1 * 1.5; i++) {
      ctx.fillStyle = 'rgba(20, 40, ' + (70 + (i % 5) * 5) + ',' + (0.5) + ')';
      ctx.beginPath();
      ctx.arc(Math.random() * W - cx, Math.random() * H - cy, Math.random() * 50, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    for(var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = Math.sin((t / 1000 * s.tw) + s.t);
      var br = 0.5 + (1 + tw) * 0.5 * 0.5;
      var r = s.r * (1 + 0.2 * tw);
      ctx.globalAlpha = br * 0.8;
      ctx.fillStyle = 'rgba(255, 250, 230, ' + br + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    for(var i = 0; i < dust.length; i++) {
      var d_ = dust[i];
      ctx.globalAlpha = d_.a;
      if(d_.c === 0) ctx.fillStyle = 'rgba(40, 50, ' + (70 + (i % 5) * 5) + ',' + d_.a + ')';
      else if(d_.c === 2) ctx.fillStyle = 'rgba(30, 40, 80, ' + d_.a + ')';
      else ctx.fillStyle = 'rgba(60, 40, 50, ' + d_.a + ')';
      ctx.beginPath();
      ctx.arc(d_.x, d_.y, d_.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.lineWidth = 1.5 / scale;
    for(var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      var pts = b.trail;
      if(pts.length > 2) {
        ctx.beginPath();
        ctx.moveTo((pts[0].x - b.x) * trailScale, (pts[0].y - b.y) * trailScale);
        for(var k = 1; k < pts.length; k++) {
          ctx.lineTo((pts[k].x - b.x) * trailScale, (pts[k].y - b.y) * trailScale);
        }
        ctx.strokeStyle = b.color;
        ctx.globalAlpha = b.alpha * 0.85;
        ctx.stroke();
      }
    }
    for(var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      var rx = b.x * scale;
      var ry = b.y * scale;
      var rs = Math.max(3, b.r * scale);
      var gr = rs * (b.glowMul || 5);
      var g = ctx.createRadialGradient(rx, ry, 0, rx, ry, gr);
      var c = b.color;
      var c1 = c; if(c.indexOf('#') === 0) c1 = c;
      var c0 = c1;
      var c2 = c1;
      var r_ = parseInt(c0.slice(1, 2), 16);
      var g_ = parseInt(c0.slice(3, 5), 16);
      var b_ = parseInt(c0.slice(5, 7), 16);
      g.addColorStop(0, 'rgba(' + r_ + ',' + g_ + ',' + b_ + ',' + (b.alpha * 0.95) + ')');
      g.addColorStop(0.3, 'rgba(' + r_ + ',' + g_ + ',' + b_ + ',' + (b.alpha * 0.6) + ')');
      g.addColorStop(1, 'rgba(' + r_ + ',' + g_ + ',' + b_ + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(rx, ry, gr, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = b.alpha;
      ctx.fillStyle = b.fill || b.color;
      ctx.beginPath();
      ctx.arc(rx, ry, rs, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = b.alpha;
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (b.alpha * 0.8) + ')';
      ctx.beginPath();
      ctx.arc(rx, ry, rs * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function loop(t) {
    frame_(t);
  }
  var lastT0 = 0;
  function fstart(t) {
    lastT = t;
    frame_(t);
  }
  requestAnimationFrame(fstart);
})();
</script>
</body>
</html>
