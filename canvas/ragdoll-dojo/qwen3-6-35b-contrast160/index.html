<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Dojo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Physics Constants
const GRAVITY = 0.4;
const DAMPING = 0.99;
const BOUNCE = 0.6;
const FRICTION = 0.8;
const SUB_STEPS = 8;
const CONSTRAINT_ITERATIONS = 20;

// State
let particles = [];
let constraints = [];
let obstacles = [];
let ragdolls = [];
let slowMoFactor = 1.0;
let nextSpawnTime = 0;

// --- Classes ---

class Particle {
    constructor(x, y, mass = 1, isHead = false) {
        this.x = x;
        this.y = y;
        this.oldX = x;
        this.oldY = y;
        this.mass = mass;
        this.isHead = isHead;
        this.radius = isHead ? 12 : 4;
        this.color = isHead ? '#ffccaa' : '#eeeeee';
        this.isFixed = false;
    }

    update() {
        if (this.isFixed) return;
        
        let vx = (this.x - this.oldX) * DAMPING;
        let vy = (this.y - this.oldY) * DAMPING;

        this.oldX = this.x;
        this.oldY = this.y;

        this.x += vx * slowMoFactor;
        this.y += (vy + GRAVITY) * slowMoFactor;

        // Floor collision
        if (this.y > H - 10) {
            this.y = H - 10;
            this.oldY = this.y + vy * BOUNCE;
            this.oldX = this.x - vx * FRICTION;
        }
        // Wall collisions
        if (this.x < 0) { this.x = 0; this.oldX = this.x + vx * BOUNCE; }
        if (this.x > W) { this.x = W; this.oldX = this.x + vx * BOUNCE; }
    }
}

class Constraint {
    constructor(p1, p2, length = null, stiffness = 1.0) {
        this.p1 = p1;
        this.p2 = p2;
        this.length = length || Math.hypot(p2.x - p1.x, p2.y - p1.y);
        this.stiffness = stiffness;
    }

    solve() {
        const dx = this.p2.x - this.p1.x;
        const dy = this.p2.y - this.p1.y;
        const dist = Math.hypot(dx, dy);
        if (dist === 0) return;
        
        const diff = (this.length - dist) / dist * this.stiffness;
        
        const offsetX = dx * diff * 0.5;
        const offsetY = dy * diff * 0.5;

        if (!this.p1.isFixed) {
            this.p1.x -= offsetX;
            this.p1.y -= offsetY;
        }
        if (!this.p2.isFixed) {
            this.p2.x += offsetX;
            this.p2.y += offsetY;
        }
    }
}

class Obstacle {
    constructor(x1, y1, x2, y2, type = 'static') {
        this.x1 = x1;
        this.y1 = y1;
        this.x2 = x2;
        this.y2 = y2;
        this.type = type;
        this.angle = 0;
        this.angVel = 0;
        this.pivot = null;
        this.color = '#445566';
        this.width = 20;
    }

    update() {
        if (this.type === 'static') return;
        
        // Physics for seesaw/log
        this.angle += this.angVel * slowMoFactor;
        this.angVel *= 0.98; // damping
        
        // Calculate end positions based rotation
        const dx = this.x2 - this.x1;
        const dy = this.y2 - this.y1;
        const len = Math.hypot(dx, dy);
        const cos = Math.cos(this.angle);
        const sin = Math.sin(this.angle);
        
        // Pivot is at x1, y1
        this.realX1 = this.x1;
        this.realY1 = this.y1;
        this.realX2 = this.x1 + dx * cos - dy * sin;
        this.realY2 = this.y1 + dx * sin + dy * cos;
    }
}

class Ragdoll {
    constructor(x, y) {
        this.particles = [];
        this.constraints = [];
        this.dead = false;
        
        // Define body parts relative to center
        const head = new Particle(x, y, 1, true);
        const neck = new Particle(x, y + 20);
        const shoulder = new Particle(x, y + 40);
        const hip = new Particle(x, y + 80);
        
        const lElbow = new Particle(x - 20, y + 60);
        const lHand = new Particle(x - 30, y + 90);
        const rElbow = new Particle(x + 20, y + 60);
        const rHand = new Particle(x + 30, y + 90);
        
        const lKnee = new Particle(x - 15, y + 120);
        const lFoot = new Particle(x - 20, y + 160);
        const rKnee = new Particle(x + 15, y + 120);
        const rFoot = new Particle(x + 20, y + 160);

        this.p = [head, neck, shoulder, hip, lElbow, lHand, rElbow, rHand, lKnee, lFoot, rKnee, rFoot];

        // Constraints
        const add = (a, b, stiff=1.0) => this.constraints.push(new Constraint(a, b, null, stiff));
        const addDist = (a, b, dist, stiff=1.0) => this.constraints.push(new Constraint(a, b, dist, stiff));

        // Skeleton
        add(head, neck);
        add(neck, shoulder);
        add(shoulder, hip);
        
        // Arms
        add(shoulder, lElbow);
        add(lElbow, lHand);
        add(shoulder, rElbow);
        add(rElbow, rHand);
        
        // Legs
        add(hip, lKnee);
        add(lKnee, lFoot);
        add(hip, rKnee);
        add(rKnee, rFoot);

        // Structural Stiffness (internal triangles)
        addDist(head, shoulder, 40, 0.8);
        addDist(shoulder, hip, 40, 0.8);
        addDist(neck, hip, 60, 0.5);
        
        addDist(shoulder, lKnee, 70, 0.1); // Hip-shoulder width
        addDist(shoulder, rKnee, 70, 0.1);
        addDist(hip, lElbow, 50, 0.1);
        addDist(hip, rElbow, 50, 0.1);

        // Stiffness for head
        addDist(head, hip, 80, 0.2);
        
        particles.push(...this.p);
        constraints.push(...this.constraints);
    }
}

// --- Setup ---

function initObstacles() {
    obstacles.push(new Obstacle(W*0.2, H-150, W*0.4, H-150, 'static')); // Platform Left
    obstacles.push(new Obstacle(W*0.6, H-150, W*0.8, H-150, 'static')); // Platform Right
    
    // Trampoline
    obstacles.push(new Obstacle(W*0.3, H-50, W*0.7, H-50, 'trampoline'));
    
    // Swinging Log
    const log = new Obstacle(W*0.5, H*0.4, W*0.5 + 150, H*0.4, 'rotating');
    log.pivot = log.x1; // Pivot at left side
    obstacles.push(log);

    // Seesaw
    const seesaw = new Obstacle(W*0.5 - 100, H*0.7, W*0.5 + 100, H*0.7, 'rotating');
    // Pivot in middle
    seesaw.pivot = W*0.5; 
    // We need to recalculate pivot logic for seesaw specifically
    // Actually, let's make a simpler pivot logic in Obstacle update
}

// Specialized Obstacle update for pivot-based
Obstacle.prototype.updatePivot = function() {
    if (this.type !== 'rotating') return;
    
    // Determine pivot point
    let px, py;
    if (this.id === 'seesaw') {
        px = (this.x1 + this.x2) / 2;
        py = (this.y1 + this.y2) / 2;
    } else {
        px = this.x1;
        py = this.y1;
    }

    this.angle += this.angVel * slowMoFactor;
    this.angVel *= 0.98;

    const dx = this.x2 - this.x1;
    const dy = this.y2 - this.y1;
    const cos = Math.cos(this.angle);
    const sin = Math.sin(this.angle);

    this.realX1 = px + dx * cos - dy * sin;
    this.realY1 = py + dx * sin + dy * cos;
    this.realX2 = px - dx * cos + dy * sin; // Opposite side
    this.realY2 = py - dx * sin - dy * cos;
};

// --- Physics Engine ---

function resolveObstacles() {
    for (let obs of obstacles) {
        if (obs.type === 'static') {
            // Line segment collision
            checkLineCollision(obs.x1, obs.y1, obs.x2, obs.y2, obs.color, obs.width);
        } else if (obs.type === 'trampoline') {
            // Spring force
            for (let p of particles) {
                if (p.y > obs.y1 && p.x > obs.x1 && p.x < obs.x2) {
                     let t = (p.x - obs.x1) / (obs.x2 - obs.x1);
                     // Simple spring
                     let depth = p.y - (obs.y1 + 20);
                     if (depth > 0) {
                         let force = depth * 0.5;
                         p.y -= force * slowMoFactor;
                         p.oldY += force * 0.5; // Bounce
                     }
                }
            }
        } else if (obs.type === 'rotating') {
            obs.updatePivot();
            checkLineCollision(obs.realX1, obs.realY1, obs.realX2, obs.realY2, obs.color, obs.width, obs);
        }
    }
}

function checkLineCollision(x1, y1, x2, y2, color, width, rigidObs = null) {
    for (let p of particles) {
        // Vector from line start to point
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx*dx + dy*dy;
        
        // Project point onto line
        let t = ((p.x - x1) * dx + (p.y - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));
        
        // Closest point on line
        const closestX = x1 + t * dx;
        const closestY = y1 + t * dy;
        
        const distSq = (p.x - closestX)**2 + (p.y - closestY)**2;
        
        if (distSq < width*width) {
            const dist = Math.sqrt(distSq);
            const overlap = width - dist;
            
            // Normal vector
            let nx = (p.x - closestX) / dist;
            let ny = (p.y - closestY) / dist;
            
            if (dist === 0) { nx = 0; ny = -1; } // Fallback

            // Push out
            p.x += nx * overlap;
            p.y += ny * overlap;

            // Velocity reflection
            const vx = p.x - p.oldX;
            const vy = p.y - p.oldY;
            
            // Dot product with normal
            const dot = vx * nx + vy * ny;
            
            if (dot < 0) { // Moving towards surface
                p.oldX = p.x - (vx - 2 * dot * nx) * BOUNCE;
                p.oldY = p.y - (vy - 2 * dot * ny) * BOUNCE;
                
                // Tangential friction
                const tx = -ny;
                const ty = nx;
                const tDot = vx * tx + vy * ty;
                p.oldX -= tx * tDot * 0.1;
                p.oldY -= ty * tDot * 0.1;

                // Transfer momentum to rigid body
                if (rigidObs) {
                    // Apply torque roughly based on hit position
                    rigidObs.angVel += dot * 0.002; 
                }
            }
        }
    }
}

function solveConstraints() {
    for (let i=0; i<CONSTRAINT_ITERATIONS; i++) {
        for (let c of constraints) {
            c.solve();
        }
    }
}

// --- Game Loop ---

function spawnRagdoll() {
    const x = Math.random() * (W * 0.8) + W * 0.1;
    const y = -50;
    ragdolls.push(new Ragdoll(x, y));
}

function checkCollisions() {
    // Simple particle vs particle collision for "fleshy" feel
    // Only check nearby particles or random subset to save perf
    for (let i=0; i<particles.length; i+=2) {
        for (let j=i+2; j<particles.length; j+=2) {
            const p1 = particles[i];
            const p2 = particles[j];
            // Skip same ragdoll
            if (p1.isHead === p2.isHead && 
                particles.indexOf(p1) - particles.indexOf(p2) < 12 && 
                particles.indexOf(p1) - particles.indexOf(p2) > -12) continue;

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = (p1.radius + p2.radius) * 1.5; // Collision radius

            if (dist < minDist && dist > 0) {
                const overlap = (minDist - dist) / 2;
                const nx = dx / dist;
                const ny = dy / dist;
                
                p1.x -= nx * overlap;
                p1.y -= ny * overlap;
                p2.x += nx * overlap;
                p2.y += ny * overlap;

                // Simple impulse
                const v1x = p1.x - p1.oldX;
                const v1y = p1.y - p1.oldY;
                const v2x = p2.x - p2.oldX;
                const v2y = p2.y - p2.oldY;
                
                // Exchange momentum roughly
                const tempX = p1.oldX;
                const tempY = p1.oldY;
                p1.oldX = p2.oldX;
                p1.oldY = p2.oldY;
                p2.oldX = tempX;
                p2.oldY = tempY;
                
                // Dampen
                p1.oldX += (p1.x - p1.oldX) * 0.1;
                p1.oldY += (p1.y - p1.oldY) * 0.1;
                p2.oldX += (p2.x - p2.oldX) * 0.1;
                p2.oldY += (p2.y - p2.oldY) * 0.1;
            }
        }
    }
}

function update() {
    // Spawn logic
    if (Date.now() > nextSpawnTime) {
        if (Math.random() > 0.7) {
            spawnRagdoll(); // Single
        } else {
            spawnRagdoll();
            setTimeout(spawnRagdoll, 200); // Duo
        }
        nextSpawnTime = Date.now() + 2000 + Math.random() * 3000;
    }

    // Update Particles
    for (let p of particles) {
        p.update();
    }

    // Solve Constraints
    solveConstraints();
    
    // Solve Obstacles
    resolveObstacles();

    // Particle Collisions (Simplified)
    checkCollisions();

    // Cleanup
    for (let i = ragdolls.length - 1; i >= 0; i--) {
        let r = ragdolls[i];
        // Check if settled or fell off
        let settled = true;
        let onGround = false;
        
        for(let p of r.p) {
            if (p.y > H - 20) onGround = true;
            // Check velocity
            let vx = p.x - p.oldX;
            let vy = p.y - p.oldY;
            if (vx*vx + vy*vy > 0.5) settled = false;
        }
        
        if (onGround && settled) {
            // Dissolve
            r.p.forEach(p => {
                p.isFixed = true; // Freeze
                // Fade out logic handled in draw
            });
            r.dead = true;
            setTimeout(() => {
                particles = particles.filter(pp => !r.p.includes(pp));
                constraints = constraints.filter(cc => !r.constraints.includes(cc));
                ragdolls = ragdolls.filter(rr => rr !== r);
            }, 1000);
        } else if (r.p[0].y > H + 100) {
             // Fell off screen
             particles = particles.filter(pp => !r.p.includes(pp));
             constraints = constraints.filter(cc => !r.constraints.includes(cc));
             ragdolls = ragdolls.filter(rr => rr !== r);
        }
    }

    // Slow Motion Logic
    let totalSpeed = 0;
    particles.forEach(p => {
        totalSpeed += Math.hypot(p.x - p.oldX, p.y - p.oldY);
    });
    
    // Target slow mo based on speed
    let targetSlowMo = 1.0;
    if (totalSpeed > 100) targetSlowMo = 0.2;
    else if (totalSpeed > 50) targetSlowMo = 0.5;
    
    slowMoFactor += (targetSlowMo - slowMoFactor) * 0.05;
}

function draw() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    // Draw Obstacles
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    
    for (let obs of obstacles) {
        ctx.strokeStyle = obs.color;
        if (obs.type === 'static') {
            ctx.beginPath();
            ctx.moveTo(obs.x1, obs.y1);
            ctx.lineTo(obs.x2, obs.y2);
            ctx.stroke();
        } else if (obs.type === 'trampoline') {
            ctx.strokeStyle = '#5566aa';
            ctx.beginPath();
            ctx.moveTo(obs.x1, obs.y1);
            ctx.lineTo(obs.x2, obs.y2);
            ctx.stroke();
            // Springs visual
            ctx.beginPath();
            ctx.moveTo(obs.x1, obs.y1);
            ctx.quadraticCurveTo((obs.x1+obs.x2)/2, obs.y1 + 30, obs.x2, obs.y2);
            ctx.stroke();
        } else if (obs.type === 'rotating') {
            ctx.strokeStyle = '#887766';
            ctx.beginPath();
            ctx.moveTo(obs.realX1, obs.realY1);
            ctx.lineTo(obs.realX2, obs.realY2);
            ctx.stroke();
            // Pivot point
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            let px = (obs.x1 + obs.x2)/2;
            let py = (obs.y1 + obs.y2)/2;
            if (obs.id !== 'log') { // Log pivot is left
                ctx.arc(px, py, 5, 0, Math.PI*2);
                ctx.fill();
            }
        }
    }

    // Draw Ragdolls
    for (let r of ragdolls) {
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = r.dead ? `rgba(255,255,255,0.1)` : '#fff';
        
        // Draw connections
        for (let c of r.constraints) {
            ctx.beginPath();
            ctx.moveTo(c.p1.x, c.p1.y);
            ctx.lineTo(c.p2.x, c.p2.y);
            ctx.stroke();
        }
        
        // Draw Head
        let head = r.p[0];
        ctx.fillStyle = r.dead ? `rgba(255,255,255,0.1)` : head.color;
        ctx.beginPath();
        ctx.arc(head.x, head.y, head.radius, 0, Math.PI*2);
        ctx.fill();
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// --- Init ---
initObstacles();
loop();

</script>
</body>
</html>
