<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Test Pages</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    background: radial-gradient(circle at 50% -10%, #1a0606 0%, #080404 55%, #050303 100%);
    color: #f0e6e6; padding: 3rem 1.5rem 4rem;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  a.back { color: #9a7a7a; text-decoration: none; font-size: 0.85rem; letter-spacing: 0.04em; }
  a.back:hover { color: #ff4747; }
  h1 { margin: 1.5rem 0 0.25rem; font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: 0.05em; text-transform: uppercase; }
  p.brief { color: #9a7a7a; line-height: 1.7; max-width: 64ch; }
  .cards { display: grid; gap: 1rem; margin-top: 2rem; }
  a.card {
    display: block; padding: 1.3rem 1.5rem;
    border: 1px solid rgba(255, 60, 60, 0.22); border-radius: 12px;
    background: rgba(255, 40, 40, 0.04); color: #f0e6e6; text-decoration: none;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  a.card:hover { border-color: rgba(255, 70, 70, 0.7); background: rgba(255, 40, 40, 0.1); transform: translateY(-2px); }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .name { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.03em; }
  .muted { color: #9a7a7a; font-size: 0.85rem; }
  .runid { color: #6a5050; font-size: 0.72rem; margin-top: 0.3rem; word-break: break-all; }
  .metrics { display: flex; flex-wrap: wrap; gap: 0.9rem 1.8rem; margin-top: 1rem; }
  .metric { display: flex; flex-direction: column; }
  .metric .v { font-size: 1.02rem; color: #ff6a6a; }
  .metric .k { font-size: 0.68rem; color: #8a6a6a; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.15rem; }
  .open { margin-top: 1rem; color: #ff4747; font-size: 0.85rem; letter-spacing: 0.05em; }
  footer { color: #5a4444; font-size: 0.8rem; margin-top: 3rem; }</style>
</head>
<body>
  <div class="wrap">
    <h1>LLM Test Pages</h1>
    <p class="brief">Self-contained HTML demos produced by language models in our benchmark suite, published with the model that created each one.</p>
    <div class="cards">
      <a class="card" href="./virtual-boy-website/">
        <div class="card-top">
          <span class="name">Virtual Boy Website</span>
          <span class="muted">1 run</span>
        </div>
      </a>
    </div>
    <footer>github.com/loktar00/llm-test-pages</footer>
  </div>
</body>
</html>
