<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Lunar Lander</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            pointer-events: none;
            text-shadow: 0 0 5px #00ff00;
        }
        .hud-item {
            margin-bottom: 5px;
            font-size: 14px;
        }
        #status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ffff;
            text-align: right;
            font-size: 14px;
            text-shadow: 0 0 5px #00ffff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="hud-item">FUEL: <span id="fuel-val">100</span>%</div>
        <div class="hud-item">ALT: <span id="alt-val">0</span>m</div>
        <div class="hud-item">VEL: <span id="vel-val">0</span> m/s</div>
        <div class="hud-item">THROTTLE: <span id="thr-val">0</span>%</div>
    </div>
    <div id="status">
        <div id="state-text">INITIALIZING...</div>
        <div id="mission-count">LANDINGS: 0</div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const uiFuel = document.getElementById('fuel-val');
        const uiAlt = document.getElementById('alt-val');
        const uiVel = document.getElementById('vel-val');
        const uiThr = document.getElementById('thr-val');
        const uiState = document.getElementById('state-text');
        const uiMission = document.getElementById('mission-count');

        let width, height;

        // Physics Constants
        const GRAVITY = 0.15;
        const THRUST_POWER = 0.35;
        const ROTATION_SPEED = 0.05;
        const MAX_FUEL = 1000;
        const SAFE_LANDING_VEL = 1.5;
        const SAFE_LANDING_ROT = 0.1;

        // Game State
        let gameState = 'DESCENT'; // DESCENT, LANDING, LIFT_OFF, CRASH
        let landings = 0;
        let frameCount = 0;

        // Resize Handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Classes ---

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'fire', 'smoke', 'dust'
                this.life = 1.0;
                
                if (type === 'fire') {
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = Math.random() * 3 + 2;
                    this.decay = 0.05 + Math.random() * 0.05;
                    this.size = Math.random() * 3 + 2;
                    this.color = `255, ${Math.floor(Math.random() * 150 + 100)}, 0`;
                } else if (type === 'smoke') {
                    this.vx = (Math.random() - 0.5) * 1;
                    this.vy = Math.random() * 2 + 1;
                    this.decay = 0.02;
                    this.size = Math.random() * 5 + 4;
                    this.color = `100, 100, 100`;
                } else if (type === 'dust') {
                    this.vx = (Math.random() - 0.5) * 10;
                    this.vy = -(Math.random() * 5 + 2);
                    this.decay = 0.015;
                    this.size = Math.random() * 3 + 1;
                    this.color = `200, 190, 170`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                if (this.type === 'dust') {
                    this.vy += 0.1; // Gravity for dust
                    this.vx *= 0.95; // Friction
                }
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = `rgb(${this.color})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class Terrain {
            constructor() {
                this.points = [];
                this.padWidth = 120;
                this.padX = 0;
                this.generate();
            }

            generate() {
                this.points = [];
                const resolution = 20;
                // Random pad location
                this.padX = Math.random() * (width - 400) + 200;
                
                let y = height * 0.6;
                
                for (let x = 0; x <= width; x += resolution) {
                    // Create flat pad
                    if (x >= this.padX - this.padWidth/2 && x <= this.padX + this.padWidth/2) {
                        y = height - 100; // Pad height
                    } else {
                        // Procedural noise
                        y += (Math.random() - 0.5) * 60;
                        // Clamp
                        if (y > height - 50) y = height - 50;
                        if (y < height * 0.3) y = height * 0.3;
                        
                        // Smooth transition to/from pad
                        if (Math.abs(x - this.padX) < this.padWidth) {
                            // Lerp towards pad height
                            y = y * 0.5 + (height - 100) * 0.5;
                        }
                    }
                    this.points.push({x, y});
                }
                // Close loop
                this.points.push({x: width, y: height});
                this.points.push({x: 0, y: height});
            }

            draw(ctx) {
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.moveTo(0, height);
                for (let p of this.points) {
                    ctx.lineTo(p.x, p.y);
                }
                ctx.closePath();
                ctx.fill();

                // Draw Pad markings
                ctx.fillStyle = '#555';
                ctx.fillRect(this.padX - this.padWidth/2, height - 100, this.padWidth, 5);
                
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.padX, height - 100);
                ctx.lineTo(this.padX, height - 80);
                ctx.stroke();
            }

            getGroundHeight(x) {
                // Simple linear interpolation
                const res = 20;
                const idx = Math.floor(x / res);
                if (idx < 0 || idx >= this.points.length - 1) return height;
                
                const p1 = this.points[idx];
                const p2 = this.points[idx+1];
                const t = (x - p1.x) / res;
                return p1.y + (p2.y - p1.y) * t;
            }
            
            reset() {
                this.generate();
            }
        }

        class Lander {
            constructor() {
                this.x = width / 2;
                this.y = 100;
                this.vx = 0;
                this.vy = 0;
                this.angle = 0; // Radians
                this.fuel = MAX_FUEL;
                this.throttle = 0;
                this.width = 30;
                this.height = 30;
                this.landed = false;
                this.crashed = false;
            }

            reset() {
                this.x = Math.random() * (width - 100) + 50;
                this.y = -50;
                this.vx = 0;
                this.vy = 0.5; // Drop from sky
                this.angle = 0;
                this.fuel = MAX_FUEL;
                this.throttle = 0;
                this.landed = false;
                this.crashed = false;
            }

            update(terrain, particles) {
                if (this.crashed) return;

                // Apply Gravity
                this.vy += GRAVITY;

                // AI Logic
                this.throttle = 0;
                
                if (gameState === 'LIFT_OFF') {
                    this.throttle = 0.8; // Burn to get up
                } else if (gameState === 'DESCENT' || gameState === 'LANDING') {
                    // Target is the pad
                    const targetX = terrain.padX;
                    const targetY = terrain.getGroundHeight(targetX);

                    // Horizontal correction
                    const dx = targetX - this.x;
                    // Simple PID-ish logic for horizontal movement via rotation
                    if (Math.abs(dx) > 5) {
                        if (dx > 0) this.angle += ROTATION_SPEED * 0.1;
                        else this.angle -= ROTATION_SPEED * 0.1;
                    } else {
                        // Level out
                        if (this.angle > 0.05) this.angle -= ROTATION_SPEED * 0.1;
                        if (this.angle < -0.05) this.angle += ROTATION_SPEED * 0.1;
                    }

                    // Vertical control
                    const dist = targetY - this.y;
                    
                    // Proportional thrust based on distance and velocity
                    let desiredThrust = 0;
                    
                    if (dist > 0) {
                        // Closer = more thrust to slow down
                        desiredThrust = Math.min(dist / 200, 0.8); 
                        
                        // If falling fast, max thrust
                        if (this.vy > SAFE_LANDING_VEL) {
                            desiredThrust = 1.0;
                        }
                    }
                    
                    this.throttle = desiredThrust;
                }

                // Apply Thrust
                if (this.throttle > 0 && this.fuel > 0) {
                    const tx = Math.sin(this.angle) * THRUST_POWER * this.throttle;
                    const ty = -Math.cos(this.angle) * THRUST_POWER * this.throttle;
                    
                    this.vx += tx;
                    this.vy += ty;
                    
                    this.fuel -= this.throttle * 2;
                    
                    // Emit particles
                    const nozzleX = this.x + Math.sin(this.angle) * 15;
                    const nozzleY = this.y - Math.cos(this.angle) * 15;
                    
                    for(let i=0; i<2; i++) {
                        particles.push(new Particle(nozzleX, nozzleY, 'fire'));
                    }
                }

                // Update Position
                this.x += this.vx;
                this.y += this.vy;

                // Collision Detection
                const groundY = terrain.getGroundHeight(this.x);
                
                if (this.y >= groundY) {
                    this.y = groundY;
                    
                    // Check if on pad
                    const onPad = Math.abs(this.x - terrain.padX) < terrain.padWidth/2 - 10;
                    
                    // Hard landing / Crash
                    if (this.vy > SAFE_LANDING_VEL || Math.abs(this.angle) > SAFE_LANDING_ROT || !onPad) {
                        this.crashed = true;
                        gameState = 'CRASH';
                        uiState.innerText = "HARD LANDING! RESETTING...";
                        uiState.style.color = "red";
                        
                        // Dust cloud
                        for(let i=0; i<50; i++) {
                            particles.push(new Particle(this.x, this.y, 'dust'));
                        }
                        
                        setTimeout(() => {
                            resetMission();
                        }, 2000);
                    } else {
                        // Successful Landing
                        this.vy = 0;
                        this.vx = 0;
                        this.angle = 0;
                        this.landed = true;
                        this.throttle = 0;
                        gameState = 'LANDING';
                        uiState.innerText = "TOUCHDOWN SECURE. LIFTING OFF...";
                        uiState.style.color = "#00ff00";
                        
                        setTimeout(() => {
                            gameState = 'LIFT_OFF';
                        }, 1500);
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Legs
                ctx.strokeStyle = '#aaa';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, 10);
                ctx.lineTo(-15, 20);
                ctx.moveTo(10, 10);
                ctx.lineTo(15, 20);
                ctx.stroke();

                // Body
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(10, 10);
                ctx.lineTo(-10, 10);
                ctx.closePath();
                ctx.fill();

                // Window
                ctx.fillStyle = '#00aaff';
                ctx.beginPath();
                ctx.arc(0, -2, 4, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- Main Loop ---

        const terrain = new Terrain();
        const lander = new Lander();
        let particles = [];

        function resetMission() {
            terrain.reset();
            lander.reset();
            particles = [];
            landings++;
            uiMission.innerText = `LANDINGS: ${landings}`;
            gameState = 'DESCENT';
            uiState.innerText = "APPROACHING LANDING ZONE";
            uiState.style.color = "#00ffff";
        }

        function updateUI() {
            uiFuel.innerText = Math.floor(lander.fuel);
            uiAlt.innerText = Math.floor(Math.max(0, terrain.getGroundHeight(lander.x) - lander.y));
            uiVel.innerText = lander.vy.toFixed(2);
            uiThr.innerText = Math.floor(lander.throttle * 100);
        }

        function loop() {
            // Clear
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Background Stars
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<10; i++) {
                const sx = (Math.random() * width);
                const sy = (Math.random() * height * 0.7);
                ctx.fillRect(sx, sy, 1, 1);
            }

            // Logic
            lander.update(terrain, particles);

            if (gameState === 'LIFT_OFF') {
                if (lander.y < height * 0.3) {
                    gameState = 'DESCENT';
                    uiState.innerText = "NEW TARGET ACQUIRED";
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Draw Terrain
            terrain.draw(ctx);

            // Draw Particles (Behind lander)
            particles.forEach(p => p.draw(ctx));

            // Draw Lander Light
            if (!lander.crashed) {
                const lightAngle = lander.angle;
                const lx = lander.x;
                const ly = lander.y + 10;
                
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx - 100, height);
                ctx.lineTo(lx + 100, height);
                ctx.closePath();
                
                // Gradient for light
                const grad = ctx.createRadialGradient(lx, ly, 10, lx, ly, 400);
                grad.addColorStop(0, 'rgba(255, 255, 200, 0.4)');
                grad.addColorStop(1, 'rgba(255, 255, 200, 0)');
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();
            }

            // Draw Lander
            lander.draw(ctx);

            updateUI();
            requestAnimationFrame(loop);
        }

        // Start
        resetMission();
        loop();

    </script>
</body>
</html>
