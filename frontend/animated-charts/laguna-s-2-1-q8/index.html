<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chart Showcase</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #e2e8f0;
      --text-light: #94a3b8;
      --primary: #38bdf8;
      --secondary: #a78bfa;
      --accent: #fbbf24;
      --green: #4ade80;
      --red: #f87171;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 1100px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 1rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 3rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border: 1px solid var(--border);
    }
    .chart-title {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--text-light);
      font-weight: 600;
    }
    .chart-wrapper {
      position: relative;
      height: 280px;
    }
    /* Tooltip */
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateY(-8px);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 999;
      backdrop-filter: blur(6px);
    }
    #tooltip.active {
      opacity: 1;
      transform: translateY(0);
    }
    /* Shared legend dot */
    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chart Showcase</h1>
    <p class="subtitle">Plain HTML, CSS & JavaScript — no frameworks, no libraries. Animated charts triggered on scroll into view.</p>
    <div class="chart-grid">
      <div class="card">
        <div class="chart-title">Animated Bar Chart Race</div>
        <div class="chart-wrapper" id="bar-chart"></div>
      </div>
      <div class="card">
        <div class="chart-title">Self-drawing Line Chart</div>
        <div class="chart-wrapper" id="line-chart"></div>
      </div>
      <div class="card">
        <div class="chart-title">Sweeping Donut Chart</div>
        <div class="chart-wrapper" id="donut-chart"></div>
      </div>
    </div>
  </div>
  <div id="tooltip"></div>

  <script>
    const colors = {
      bar: ['#38bdf8', '#a78bfa', '#fbbf24', '#4ade80', '#f87171'],
      line: ['#38bdf8', '#a78bfa', '#fbbf24', '#4ade80'],
      donut: ['#38bdf8', '#a78bfa', '#fbbf24', '#4ade80']
    };

    const tooltip = document.getElementById('tooltip');

    // Shared tooltip behavior
    function attachTooltip(element, content) {
      element.addEventListener('mouseenter', () => {
        tooltip.textContent = content;
        tooltip.classList.add('active');
      });
      element.addEventListener('mousemove', e => {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
      });
      element.addEventListener('mouseleave', () => {
        tooltip.classList.remove('active');
      });
    }

    // Observer to trigger animations when scrolled into view
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const chart = entry.target;
          chart.classList.add('ready');
          if (chart.id === 'bar-chart') animateBarChart(chart);
          if (chart.id === 'line-chart') animateLineChart(chart);
          if (chart.id === 'donut-chart') animateDonutChart(chart);
          observer.unobserve(chart);
        }
      });
    }, { threshold: 0.4 });

    observer.observe(document.getElementById('bar-chart'));
    observer.observe(document.getElementById('line-chart'));
    observer.observe(document.getElementById('donut-chart'));

    // --- Bar Chart ---
    const barData = [
      { label: 'Q1', value: 65 },
      { label: 'Q2', value: 82 },
      { label: 'Q3', value: 74 },
      { label: 'Q4', value: 90 },
      { label: 'Q5', value: 88 }
    ];

    function renderBarChart(container) {
      const maxVal = Math.max(...barData.map(d => d.value));
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '260');
      svg.setAttribute('viewBox', '0 0 500 260');
      svg.style.overflow = 'visible';

      // Background gridlines
      for (let i = 0; i <= 4; i++) {
        const y = 220 - (i * 50);
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', 40);
        line.setAttribute('y1', y);
        line.setAttribute('x2', 480);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', 'rgba(51, 65, 85, 0.3)');
        line.setAttribute('stroke-width', 1);
        svg.appendChild(line);
      }

      const barWidth = 60;
      const gap = 20;
      const startX = 60;

      barData.forEach((d, i) => {
        const x = startX + i * (barWidth + gap);
        const barHeight = (d.value / maxVal) * 180;
        const y = 220 - barHeight;

        const rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', 220);
        rect.setAttribute('width', barWidth);
        rect.setAttribute('height', 0);
        rect.setAttribute('rx', 4);
        rect.setAttribute('fill', colors.bar[i % colors.bar.length]);
        rect.style.transition = 'height 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), y 0.8s cubic-bezier(0.25, 0.8, 0.25, 1)';
        svg.appendChild(rect);

        // Label
        const label = document.createElementNS(svgNS, 'text');
        label.setAttribute('x', x + barWidth / 2);
        label.setAttribute('y', 240);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('fill', 'var(--text-light)');
        label.setAttribute('font-size', 12);
        label.textContent = d.label;
        svg.appendChild(label);

        // Value on top
        const valText = document.createElementNS(svgNS, 'text');
        valText.setAttribute('x', x + barWidth / 2);
        valText.setAttribute('y', y - 8);
        valText.setAttribute('text-anchor', 'middle');
        valText.setAttribute('fill', 'var(--text)');
        valText.setAttribute('font-size', 13);
        valText.setAttribute('font-weight', 600);
        valText.textContent = d.value;
        svg.appendChild(valText);

        // Tooltip on bar
        const barEl = rect;
        attachTooltip(barEl, `${d.label}: ${d.value}`);

        rect.animateBar = () => {
          setTimeout(() => {
            rect.setAttribute('y', y);
            rect.setAttribute('height', barHeight);
          }, 100 + i * 120);
        };
      });

      // Y-axis label
      const axisLabel = document.createElementNS(svgNS, 'text');
      axisLabel.setAttribute('x', 16);
      axisLabel.setAttribute('y', 12);
      axisLabel.setAttribute('fill', 'var(--text-light)');
      axisLabel.setAttribute('font-size', 11);
      axisLabel.setAttribute('transform', 'rotate(-90 16 12)');
      axisLabel.textContent = 'Value';
      svg.appendChild(axisLabel);

      container.appendChild(svg);
    }

    function animateBarChart(container) {
      const svgs = container.querySelectorAll('svg');
      if (svgs.length) return;
      renderBarChart(container);
      const rects = container.querySelectorAll('rect');
      rects.forEach(r => r.animateBar());
    }

    // --- Line Chart ---
    const lineData = [
      { label: 'Jan', values: { A: 30, B: 50, C: 40, D: 60 } },
      { label: 'Feb', values: { A: 45, B: 60, C: 55, D: 70 } },
      { label: 'Mar', values: { A: 50, B: 55, C: 70, D: 65 } },
      { label: 'Apr', values: { A: 70, B: 75, C: 75, D: 85 } }
    ];
    const seriesKeys = ['A', 'B', 'C', 'D'];
    const seriesNames = { A: 'Alpha', B: 'Beta', C: 'Gamma', D: 'Delta' };

    function renderLineChart(container) {
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '260');
      svg.setAttribute('viewBox', '0 0 520 260');
      svg.style.overflow = 'visible';

      // Gridlines
      for (let i = 0; i <= 5; i++) {
        const y = 200 - i * 30;
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', 50);
        line.setAttribute('y1', y);
        line.setAttribute('x2', 500);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', 'rgba(51, 65, 85, 0.3)');
        line.setAttribute('stroke-width', 1);
        svg.appendChild(line);
      }

      const startX = 70;
      const step = 100;
      const baseY = 200;

      // X labels
      lineData.forEach((d, i) => {
        const x = startX + i * step;
        const label = document.createElementNS(svgNS, 'text');
        label.setAttribute('x', x);
        label.setAttribute('y', 220);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('fill', 'var(--text-light)');
        label.setAttribute('font-size', 11);
        label.textContent = d.label;
        svg.appendChild(label);
      });

      // Dots placeholder
      let dots = [];
      seriesKeys.forEach((key, si) => {
        const color = colors.line[si % colors.line.length];
        let coords = [];
        lineData.forEach((d, i) => {
          const x = startX + i * step;
          const y = baseY - (d.values[key] / 100) * 160;
          coords.push({ x, y, val: d.values[key], label: d.label });
        });

        // Draw path progressively
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', color);
        path.setAttribute('stroke-width', 2.5);
        path.setAttribute('stroke-linecap', 'round');
        svg.appendChild(path);

        // Dots and tooltip
        coords.forEach((c, i) => {
          const dot = document.createElementNS(svgNS, 'circle');
          dot.setAttribute('cx', c.x);
          dot.setAttribute('cy', c.y);
          dot.setAttribute('r', 0);
          dot.setAttribute('fill', color);
          dot.setAttribute('stroke', '#fff');
          dot.setAttribute('stroke-width', 1.5);
          svg.appendChild(dot);

          attachTooltip(dot, `${seriesNames[key]} - ${c.label}: ${c.val}`);
          dot.animateDot = () => {
            setTimeout(() => {
              dot.setAttribute('r', 4);
            }, 400 + i * 200 + si * 100);
          };
          dots.push(dot);
        });

        // Animate path drawing after small delay
        setTimeout(() => {
          let points = '';
          coords.forEach((c, i) => {
            const cmd = i === 0 ? `M ${c.x} ${c.y}` : `L ${c.x} ${c.y}`;
            points += cmd;
          });
          path.setAttribute('d', points);

          // Move dot along path
          let idx = 0;
          const movingDot = document.createElementNS(svgNS, 'circle');
          movingDot.setAttribute('r', 5);
          movingDot.setAttribute('fill', color);
          movingDot.setAttribute('stroke', '#fff');
          movingDot.setAttribute('stroke-width', 1.5);
          svg.appendChild(movingDot);

          const moveInterval = setInterval(() => {
            const c = coords[idx];
            movingDot.setAttribute('cx', c.x);
            movingDot.setAttribute('cy', c.y);
            idx++;
            if (idx >= coords.length) clearInterval(moveInterval);
          }, 400);
        }, si * 150);
      });

      // Legend
      seriesKeys.forEach((key, si) => {
        const legend = document.createElementNS(svgNS, 'g');
        const xPos = startX + si * 110;
        legend.setAttribute('transform', `translate(${xPos}, 10)`);
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', 0);
        dot.setAttribute('cy', 0);
        dot.setAttribute('r', 5);
        dot.setAttribute('fill', colors.line[si % colors.line.length]);
        legend.appendChild(dot);
        const txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', 10);
        txt.setAttribute('y', 5);
        txt.setAttribute('fill', 'var(--text-light)');
        txt.setAttribute('font-size', 11);
        txt.textContent = seriesNames[key];
        legend.appendChild(txt);
        svg.appendChild(legend);
      });

      container.appendChild(svg);
    }

    function animateLineChart(container) {
      const svgs = container.querySelectorAll('svg');
      if (svgs.length) return;
      renderLineChart(container);
      const dots = container.querySelectorAll('circle[r="0"]');
      dots.forEach(d => d.animateDot());
    }

    // --- Donut Chart ---
    const donutData = [
      { label: 'Category A', value: 35, color: 0 },
      { label: 'Category B', value: 25, color: 1 },
      { label: 'Category C', value: 20, color: 2 },
      { label: 'Category D', value: 20, color: 3 }
    ];

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = ((angleInDegrees - 90) * Math.PI) / 180.0;
      return {
        x: centerX + radius * Math.cos(angleInRadians),
        y: centerY + radius * Math.sin(angleInRadians)
      };
    }

    function describeArc(x, y, radius, startAngle, endAngle) {
      const start = polarToCartesian(x, y, radius, endAngle);
      const end = polarToCartesian(x, y, radius, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? '0' : '1';
      return [
        'M', start.x, start.y,
        'A', radius, radius, 0, largeArcFlag, 0, end.x, end.y,
        'L', x, y, 'Z'
      ].join(' ');
    }

    function renderDonutChart(container) {
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '260');
      svg.setAttribute('viewBox', '0 0 500 260');
      svg.style.overflow = 'visible';

      const cx = 160, cy = 130, outerR = 90, innerR = 55;
      let startAngle = 0;
      const total = donutData.reduce((sum, d) => sum + d.value, 0);
      let cumulative = 0;

      donutData.forEach((d, i) => {
        const percent = (d.value / total) * 360;
        const endAngle = startAngle + percent;
        const pathData = describeArc(cx, cy, outerR, startAngle, endAngle);
        const innerPathData = describeArc(cx, cy, innerR, startAngle, endAngle);

        const clipId = `clip-donut-${i}`;
        const clipPath = document.createElementNS(svgNS, 'clipPath');
        clipPath.setAttribute('id', clipId);
        const clipRect = document.createElementNS(svgNS, 'rect');
        clipRect.setAttribute('x', cx - outerR);
        clipRect.setAttribute('y', cy - outerR);
        clipRect.setAttribute('width', outerR * 2);
        clipRect.setAttribute('height', outerR * 2);
        clipPath.appendChild(clipRect);
        svg.appendChild(clipPath);

        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('fill', colors.donut[d.color % colors.donut.length]);
        path.setAttribute('clip-path', `url(#${clipId})`);
        svg.appendChild(path);

        // Animate sweep by rotating clip region
        let rotation = 0;
        const interval = setInterval(() => {
          rotation++;
          clipRect.setAttribute('transform', `rotate(${rotation} ${cx} ${cy})`);
          if (rotation >= percent) clearInterval(interval);
        }, 4);

        startAngle = endAngle;
        cumulative += d.value;

        // Tooltip
        attachTooltip(path, `${d.label}: ${d.value}%`);

        // Legend
        const legend = document.createElementNS(svgNS, 'g');
        legend.setAttribute('transform', `translate(280, ${40 + i * 28})`);
        const dot = document.createElementNS(svgNS, 'rect');
        dot.setAttribute('width', 12);
        dot.setAttribute('height', 12);
        dot.setAttribute('rx', 2);
        dot.setAttribute('fill', colors.donut[d.color % colors.donut.length]);
        legend.appendChild(dot);
        const txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', 18);
        txt.setAttribute('y', 10);
        txt.setAttribute('fill', 'var(--text-light)');
        txt.setAttribute('font-size', 12);
        txt.textContent = `${d.label} (${d.value}%)`;
        legend.appendChild(txt);
        svg.appendChild(legend);
      });

      // Center circle and total counter
      setTimeout(() => {
        const centerCircle = document.createElementNS(svgNS, 'circle');
        centerCircle.setAttribute('cx', cx);
        centerCircle.setAttribute('cy', cy);
        centerCircle.setAttribute('r', 0);
        centerCircle.setAttribute('fill', 'var(--card-bg)');
        centerCircle.setAttribute('stroke', 'var(--border)');
        centerCircle.setAttribute('stroke-width', 1);
        svg.appendChild(centerCircle);

        const countText = document.createElementNS(svgNS, 'text');
        countText.setAttribute('x', cx);
        countText.setAttribute('y', cy + 5);
        countText.setAttribute('text-anchor', 'middle');
        countText.setAttribute('fill', 'var(--text)');
        countText.setAttribute('font-size', 22);
        countText.setAttribute('font-weight', 700);
        countText.textContent = '0';
        svg.appendChild(countText);

        // Grow center circle
        centerCircle.style.transition = 'r 0.6s ease';
        centerCircle.setAttribute('r', innerR);

        // Count up
        setTimeout(() => {
          let count = 0;
          const interval = setInterval(() => {
            if (count >= total) {
              countText.textContent = total;
              clearInterval(interval);
            } else {
              count++;
              countText.textContent = count;
            }
          }, 25);
        }, 800);
      }, 600);

      // Center label
      const centerLabel = document.createElementNS(svgNS, 'text');
      centerLabel.setAttribute('x', cx);
      centerLabel.setAttribute('y', cy + 40);
      centerLabel.setAttribute('text-anchor', 'middle');
      centerLabel.setAttribute('fill', 'var(--text-light)');
      centerLabel.setAttribute('font-size', 11);
      centerLabel.textContent = 'Total';
      svg.appendChild(centerLabel);

      container.appendChild(svg);
    }

    function animateDonutChart(container) {
      const svgs = container.querySelectorAll('svg');
      if (svgs.length) return;
      renderDonutChart(container);
    }

    // Initialize render on load so size is correct
    window.addEventListener('load', () => {
      if (!document.getElementById('bar-chart').firstElementChild) animateBarChart(document.getElementById('bar-chart'));
      if (!document.getElementById('line-chart').firstElementChild) animateLineChart(document.getElementById('line-chart'));
      if (!document.getElementById('donut-chart').firstElementChild) animateDonutChart(document.getElementById('donut-chart'));
    });
  </script>
</body>
</html>
