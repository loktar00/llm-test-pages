<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolving Maze: Mazectric & Ants</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(0, 255, 255, 0.7);
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">Mazectric Automaton // Ant Solver</div>
    <canvas id="canvas"></canvas>

<script>
/**
 * Configuration
 */
const CONFIG = {
    cellSize: 4,          // Size of one grid cell in pixels
    antCount: 15,         // Number of ants
    antSpeed: 0.2,        // Ant movement speed (cells per frame)
    antPersist: 120,      // How long an ant stays on a path before respawning
    decayRate: 0.005,     // Pheromone decay speed
    reseedInterval: 300,  // Frames between reseeding events
    reseedSize: 10,       // Radius of reseed
    colors: {
        bg: '#050505',
        wall: '#000000',
        path: '#111111',
        ant: '#00ffcc',
        pheromone: '#00aa88'
    }
};

/**
 * Main Application Class
 */
class MazeApp {
    constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false }); // Optimize
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        
        // Grid dimensions
        this.cols = Math.ceil(this.width / CONFIG.cellSize);
        this.rows = Math.ceil(this.height / CONFIG.cellSize);
        
        // Data buffers
        this.grid = new Uint8Array(this.cols * this.rows); // 0: Wall, 1: Path
        this.pheromones = new Float32Array(this.cols * this.rows); // 0.0 - 1.0
        this.ants = [];
        
        this.frameCount = 0;
        
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.init();
        this.loop();
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        
        // Recalculate grid size
        const newCols = Math.ceil(this.width / CONFIG.cellSize);
        const newRows = Math.ceil(this.height / CONFIG.cellSize);
        
        // If size changed significantly, we could reallocate, but for now we just clamp
        if (newCols !== this.cols || newRows !== this.rows) {
            this.cols = newCols;
            this.rows = newRows;
            this.grid = new Uint8Array(this.cols * this.rows);
            this.pheromones = new Float32Array(this.cols * this.rows);
            this.ants = [];
            this.init();
        }
    }

    init() {
        // Clear grid
        this.grid.fill(0);
        this.pheromones.fill(0);
        
        // Seed initial maze
        this.seedRegion(this.cols / 2, this.rows / 2, 50);
        
        // Spawn ants
        for (let i = 0; i < CONFIG.antCount; i++) {
            this.spawnAnt();
        }
    }

    // Mazectric Rule: A cell becomes a path if it has exactly 1 neighbor.
    // Otherwise it becomes a wall.
    updateMaze() {
        // Create a copy of the grid state to update simultaneously
        const nextGrid = new Uint8Array(this.grid);
        
        // Optimization: Only update cells that are neighbors of walls or paths
        // But for simplicity in JS, we iterate all. 
        // To make it "evolving", we only update a portion or use a probability?
        // Let's update all to keep the CA authentic, but it moves fast.
        
        for (let y = 1; y < this.rows - 1; y++) {
            for (let x = 1; x < this.cols - 1; x++) {
                const idx = y * this.cols + x;
                
                // Count neighbors (Moore neighborhood)
                let neighbors = 0;
                if (this.grid[idx - 1] === 1) neighbors++; // Left
                if (this.grid[idx + 1] === 1) neighbors++; // Right
                if (this.grid[idx - this.cols] === 1) neighbors++; // Up
                if (this.grid[idx + this.cols] === 1) neighbors++; // Down
                // Diagonals (optional for Mazectric, usually 4-connectivity is enough for corridors, 
                // but 8-connectivity makes better branching. Let's stick to 4 for strict corridors).
                
                // Rule: If 1 neighbor, become path. Else wall.
                if (neighbors === 1) {
                    nextGrid[idx] = 1;
                } else {
                    nextGrid[idx] = 0;
                }
            }
        }
        
        // Swap buffers
        this.grid.set(nextGrid);
    }

    seedRegion(cx, cy, radius) {
        for (let y = cy - radius; y < cy + radius; y++) {
            for (let x = cx - radius; x < cx + radius; x++) {
                if (x >= 0 && x < this.cols && y >= 0 && y < this.rows) {
                    // Random noise
                    if (Math.random() > 0.5) {
                        this.grid[y * this.cols + x] = 1;
                    }
                }
            }
        }
    }

    spawnAnt() {
        // Find a random path cell
        let attempts = 0;
        while (attempts < 100) {
            const x = Math.floor(Math.random() * this.cols);
            const y = Math.floor(Math.random() * this.rows);
            if (this.grid[y * this.cols + x] === 1) {
                this.ants.push({
                    x: x,
                    y: y,
                    vx: 0, 
                    vy: 0,
                    timer: CONFIG.antPersist
                });
                return;
            }
            attempts++;
        }
    }

    updateAnts() {
        for (let i = this.ants.length - 1; i >= 0; i--) {
            const ant = this.ants[i];
            
            // Move
            ant.x += ant.vx;
            ant.y += ant.vy;
            
            // Drop pheromone
            const ix = Math.floor(ant.x);
            const iy = Math.floor(ant.y);
            if (ix >= 0 && ix < this.cols && iy >= 0 && iy < this.rows) {
                this.pheromones[iy * this.cols + ix] = 1.0;
            }

            // Logic: 
            // 1. If we hit a wall, we must have turned into it. Turn around or find new path.
            // 2. If we hit an intersection, pick a random direction.
            // 3. If we hit a dead end, turn around.
            
            const cx = Math.floor(ant.x);
            const cy = Math.floor(ant.y);
            
            // Check if current position is valid
            let isValid = (cx >= 0 && cx < this.cols && cy >= 0 && cy < this.rows && this.grid[cy * this.cols + cx] === 1);
            
            if (!isValid) {
                // Hit a wall or out of bounds -> Respawn
                this.ants.splice(i, 1);
                this.spawnAnt();
                continue;
            }

            // Check neighbors for movement
            const neighbors = [];
            // Up
            if (cy > 0 && this.grid[(cy - 1) * this.cols + cx] === 1) neighbors.push({dx: 0, dy: -1});
            // Down
            if (cy < this.rows - 1 && this.grid[(cy + 1) * this.cols + cx] === 1) neighbors.push({dx: 0, dy: 1});
            // Left
            if (cx > 0 && this.grid[cy * this.cols + (cx - 1)] === 1) neighbors.push({dx: -1, dy: 0});
            // Right
            if (cx < this.cols - 1 && this.grid[cy * this.cols + (cx + 1)] === 1) neighbors.push({dx: 1, dy: 0});

            // Decision making
            if (neighbors.length === 0) {
                // Dead end, reverse
                ant.vx = -ant.vx;
                ant.vy = -ant.vy;
                // Move back slightly to get out of the "wall" logic if we overshot
                ant.x += ant.vx * 0.5;
                ant.y += ant.vy * 0.5;
            } else if (neighbors.length > 1) {
                // Intersection, pick random
                const choice = neighbors[Math.floor(Math.random() * neighbors.length)];
                ant.vx = choice.dx;
                ant.vy = choice.dy;
            } else {
                // 1 neighbor (straight or turn). 
                // If our current velocity doesn't match the neighbor, turn.
                if (ant.vx !== neighbors[0].dx || ant.vy !== neighbors[0].dy) {
                    ant.vx = neighbors[0].dx;
                    ant.vy = neighbors[0].dy;
                }
            }
            
            // Move forward
            ant.x += ant.vx * CONFIG.antSpeed;
            ant.y += ant.vy * CONFIG.antSpeed;
        }
    }

    updatePheromones() {
        for (let i = 0; i < this.pheromones.length; i++) {
            if (this.pheromones[i] > 0) {
                this.pheromones[i] -= CONFIG.decayRate;
                if (this.pheromones[i] < 0) this.pheromones[i] = 0;
            }
        }
    }

    draw() {
        // Clear background
        this.ctx.fillStyle = CONFIG.colors.bg;
        this.ctx.fillRect(0, 0, this.width, this.height);

        // Draw Maze (Walls are black, Paths are dark gray)
        // Optimization: Draw paths only.
        // For better performance, we could use ImageData, but fillRect is okay for this density.
        
        // Draw Pheromones (Glowing trails)
        // We draw this on top of the path color.
        
        const cs = CONFIG.cellSize;
        
        // 1. Draw the Grid (Walls/Paths)
        // To save draw calls, we only draw path cells
        this.ctx.fillStyle = CONFIG.colors.path;
        for (let y = 0; y < this.rows; y++) {
            for (let x = 0; x < this.cols; x++) {
                if (this.grid[y * this.cols + x] === 1) {
                    this.ctx.fillRect(x * cs, y * cs, cs, cs);
                }
            }
        }

        // 2. Draw Pheromones
        // Using additive blending for glow effect
        this.ctx.globalCompositeOperation = 'lighter';
        for (let y = 0; y < this.rows; y++) {
            for (let x = 0; x < this.cols; x++) {
                const p = this.pheromones[y * this.cols + x];
                if (p > 0.05) {
                    // Color based on intensity
                    const alpha = p;
                    this.ctx.fillStyle = `rgba(0, 255, 200, ${alpha})`;
                    this.ctx.fillRect(x * cs, y * cs, cs, cs);
                }
            }
        }
        this.ctx.globalCompositeOperation = 'source-over';

        // 3. Draw Ants
        this.ctx.fillStyle = CONFIG.colors.ant;
        for (const ant of this.ants) {
            this.ctx.fillRect(ant.x * cs, ant.y * cs, cs, cs);
        }
    }

    loop() {
        this.frameCount++;

        // Update Maze
        this.updateMaze();

        // Reseed periodically to keep it alive
        if (this.frameCount % CONFIG.reseedInterval === 0) {
            const rx = Math.floor(Math.random() * this.cols);
            const ry = Math.floor(Math.random() * this.rows);
            this.seedRegion(rx, ry, CONFIG.reseedSize);
        }

        // Update Logic
        this.updateAnts();
        this.updatePheromones();

        // Draw
        this.draw();

        requestAnimationFrame(() => this.loop());
    }
}

// Start
window.onload = () => {
    new MazeApp();
};

</script>
</body>
</html>
