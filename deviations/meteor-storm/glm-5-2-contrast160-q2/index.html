<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meteor Storm</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0c;
    overflow: hidden;
    height: 100;
  width: 100;
    }
  canvas {
    display: block;
    width: 100vmin;
    height: 100vmax;
    }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
'use strict';
const c = document.getElementById('sky');
const ctx = c.getContext('2d', { alpha: false });
let W, H, DPR;
function size() {
  const w = innerWidth, h = innerHeight;
  const vmin = Math.min(w, h);
  const vmax = Math.max(w, h);
  c.width = vmin * devicePixelRatio;
  c.height = vmax * devicePixelRatio;
  c.style.width = vmin + 'px';
  c.style.height = vmax + 'px';
  c.style.transform = 'translate(-50px,-50px)';
  c.style.left = (w/2 - vmin/2) + 'px';
  c.style.top = (h/2 - vmax/2) + 'px';
  c.style.position = 'absolute';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = vmin;
  H = vmax;
}
size();
addEventListener('resize', size);
const dpr = devicePixelRatio || 1;
// init
let last = 0;
function frame(t) {
  let dt = Math.min(50, t - last) / 1000;
  last = t;
  step(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
