<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Dynamic Lighting</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); generateObstacles(); });

// Generate polygonal obstacles
let obstacles = [];
function generateObstacles() {
  obstacles = [];
  const margin = 80;
  const count = 12 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const cx = margin + Math.random() * (W - 2 * margin);
    const cy = margin + Math.random() * (H - 2 * margin);
    const sides = 3 + Math.floor(Math.random() * 5);
    const radius = 30 + Math.random() * 70;
    const verts = [];
    for (let j = 0; j < sides; j++) {
      const angle = (j / sides) * Math.PI * 2 + Math.random() * 0.3;
      const r = radius * (0.7 + Math.random() * 0.6);
      verts.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
    }
    // Ensure convex-ish by sorting around centroid
    const cxc = verts.reduce((s, v) => s + v.x, 0) / verts.length;
    const cyc = verts.reduce((s, v) => s + v.y, 0) / verts.length;
    verts.sort((a, b) => Math.atan2(a.y - cyc, a.x - cxc) - Math.atan2(b.y - cyc, b.x - cxc));
    obstacles.push({ verts, cx, cy });
  }
}
generateObstacles();

// Lights
const NUM_RAYS = 720;

function raySegmentIntersect(rx, ry, rdx, rdy, ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  const denom = rdx * dy - rdy * dx;
  if (Math.abs(denom) < 1e-10) return null;
  const t = ((ax - rx) * dy - (ay - ry) * dx) / denom;
  const u = ((ax - rx) * rdy - (ay - ry) * rdx) / denom;
  if (t > 0.001 && u >= 0 && u <= 1) return { t, x: rx + t * rdx, y: ry + t * rdy };
  return null;
}

function computeLitPolygon(light, allObstacles) {
  const points = [];
  for (let i = 0; i < NUM_RAYS; i++) {
    const angle = (i / NUM_RAYS) * Math.PI * 2;
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);
    let closestT = Infinity;
    let closestPt = null;
    for (const obs of allObstacles) {
      const v = obs.verts;
      for (let j = 0; j < v.length; j++) {
        const a = v[j];
        const b = v[(j + 1) % v.length];
        const hit = raySegmentIntersect(light.x, light.y, dx, dy, a.x, a.y, b.x, b.y);
        if (hit && hit.t < closestT) {
          closestT = hit.t;
          closestPt = { x: hit.x, y: hit.y };
        }
      }
    }
    if (closestPt) {
      points.push(closestPt);
    } else {
      points.push({ x: light.x + dx * Math.max(W, H) * 2, y: light.y + dy * Math.max(W, H) * 2 });
    }
  }
  return points;
}

function computeEdgeIllumination(obs, light) {
  const v = obs.verts;
  const lit = [];
  for (let j = 0; j < v.length; j++) {
    const a = v[j];
    const b = v[(j + 1) % v.length];
    const nx = -(b.y - a.y);
    const ny = (b.x - a.x);
    const nl = Math.sqrt(nx * nx + ny * ny) || 1;
    const nnx = nx / nl;
    const nny = ny / nl;
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    const toLightX = light.x - mx;
    const toLightY = light.y - my;
    const dot = nnx * toLightX + nny * toLightY;
    lit.push({ a, b, dot, normal: { x: nnx, y: nny } });
  }
  return lit;
}

function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
}

let startTime = performance.now();

function render() {
  const t = (performance.now() - startTime) / 1000;
  
  // Light 1: warm, slow drift
  const warmHue = 30 + Math.sin(t * 0.02) * 20; // shifts over minutes
  const warmColor = hslToRgb(warmHue, 85, 55);
  const l1x = W * 0.5 + Math.cos(t * 0.15) * W * 0.3;
  const l1y = H * 0.5 + Math.sin(t * 0.2) * H * 0.25;
  const light1 = { x: l1x, y: l1y, color: warmColor, intensity: 1.0 };
  
  // Light 2: cool, counter-orbit
  const coolHue = 210 + Math.sin(t * 0.015 + 1) * 30;
  const coolColor = hslToRgb(coolHue, 70, 45);
  const l2x = W * 0.5 + Math.cos(-t * 0.12 + 2) * W * 0.25;
  const l2y = H * 0.5 + Math.sin(-t * 0.18 + 1) * H * 0.2;
  const light2 = { x: l2x, y: l2y, color: coolColor, intensity: 0.45 };
  
  const lights = [light1, light2];
  
  // Clear to near-black
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);
  
  // Compute lit polygons for each light
  const litPolygons = [];
  for (const light of lights) {
    litPolygons.push(computeLitPolygon(light, obstacles));
  }
  
  // Draw lit areas with additive blending
  ctx.globalCompositeOperation = 'lighter';
  
  for (let li = 0; li < lights.length; li++) {
    const light = lights[li];
    const poly = litPolygons[li];
    const c = light.color;
    
    // Create gradient from light center outward
    const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, Math.max(W, H) * 0.8);
    grad.addColorStop(0, `rgba(${c.r|0},${c.g|0},${c.b|0},${0.35 * light.intensity})`);
    grad.addColorStop(0.3, `rgba(${c.r|0},${c.g|0},${c.b|0},${0.15 * light.intensity})`);
    grad.addColorStop(1, `rgba(${c.r|0},${c.g|0},${c.b|0},0)`);
    
    ctx.beginPath();
    ctx.moveTo(light.x, light.y);
    for (const p of poly) {
      ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
  }
  
  // Draw secondary fill for brighter center
  for (let li = 0; li < lights.length; li++) {
    const light = lights[li];
    const poly = litPolygons[li];
    const c = light.color;
    
    ctx.beginPath();
    ctx.moveTo(light.x, light.y);
    for (const p of poly) {
      ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = `rgba(${c.r|0},${c.g|0},${c.b|0},${0.08 * light.intensity})`;
    ctx.fill();
  }
  
  ctx.globalCompositeOperation = 'source-over';
  
  // Draw obstacle bodies (dark)
  for (const obs of obstacles) {
    ctx.beginPath();
    ctx.moveTo(obs.verts[0].x, obs.verts[0].y);
    for (let j = 1; j < obs.verts.length; j++) {
      ctx.lineTo(obs.verts[j].x, obs.verts[j].y);
    }
    ctx.closePath();
    ctx.fillStyle = '#0a0a10';
    ctx.fill();
  }
  
  // Draw lit edges with glow
  for (const obs of obstacles) {
    for (let li = 0; li < lights.length; li++) {
      const light = lights[li];
      const c = light.color;
      const edgeInfo = computeEdgeIllumination(obs, light);
      
      for (const edge of edgeInfo) {
        if (edge.dot > 0.1) {
          const brightness = Math.min(edge.dot / 5, 1) * light.intensity;
          const glowWidth = 1 + brightness * 4;
          
          // Outer glow
          ctx.beginPath();
          ctx.moveTo(edge.a.x, edge.a.y);
          ctx.lineTo(edge.b.x, edge.b.y);
          ctx.strokeStyle = `rgba(${c.r|0},${c.g|0},${c.b|0},${brightness * 0.3})`;
          ctx.lineWidth = glowWidth + 4;
          ctx.lineCap = 'round';
          ctx.stroke();
          
          // Inner bright edge
          ctx.beginPath();
          ctx.moveTo(edge.a.x, edge.a.y);
          ctx.lineTo(edge.b.x, edge.b.y);
          ctx.strokeStyle = `rgba(${c.r|0},${c.g|0},${c.b|0},${brightness * 0.7})`;
          ctx.lineWidth = glowWidth;
          ctx.lineCap = 'round';
          ctx.stroke();
          
          // Core bright line
          ctx.beginPath();
          ctx.moveTo(edge.a.x, edge.a.y);
          ctx.lineTo(edge.b.x, edge.b.y);
          ctx.strokeStyle = `rgba(${Math.min(c.r + 80, 255)|0},${Math.min(c.g + 80, 255)|0},${Math.min(c.b + 80, 255)|0},${brightness * 0.5})`;
          ctx.lineWidth = 1;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }
    }
  }
  
  // Draw light sources as glowing points
  for (const light of lights) {
    const c = light.color;
    const grad = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, 20);
    grad.addColorStop(0, `rgba(255,255,255,${0.9 * light.intensity})`);
    grad.addColorStop(0.3, `rgba(${c.r|0},${c.g|0},${c.b|0},${0.6 * light.intensity})`);
    grad.addColorStop(1, `rgba(${c.r|0},${c.g|0},${c.b|0},0)`);
    ctx.beginPath();
    ctx.arc(light.x, light.y, 20, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
  
  // Ambient dark overlay to keep room dark
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,5,8,0.0)';
  ctx.fillRect(0, 0, W, H);
  
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
