<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glyph Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #030508; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  const GLYPHS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*+=<>{}[]|/\\~^';
  const WORDS = ['GHOST','SIGNAL','ECHO','VOID','DRIFT','PULSE','NEON','FLUX','WAVE','CODE','RAIN','GLYPH','MIND','SOUL','DREAM','SHADOW','LIGHT','FALL','RISE','TIME','LOOP','HACK','NODE','GRID','SYNC','BURN','FADE','CORE','LINK','ZERO','BOND','ARC','FLUX','SEED','WIRE','BYTE','DATA','MESH','NODE','ORBIT','PHASE','SHIFT','TIDE','VEIL','WARP','ZONE'];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Color palette: teal to violet
  function lerpColor(t) {
    const stops = [
      { t: 0.0, r: 0, g: 210, b: 230 },
      { t: 0.3, r: 0, g: 180, b: 255 },
      { t: 0.6, r: 100, g: 80, b: 255 },
      { t: 1.0, r: 180, g: 60, b: 255 },
    ];
    let i = 0;
    while (i < stops.length - 1 && stops[i + 1].t < t) i++;
    if (i >= stops.length - 1) {
      const s = stops[stops.length - 1];
      return `rgb(${s.r},${s.g},${s.b})`;
    }
    const a = stops[i], b = stops[i + 1];
    const lt = (t - a.t) / (b.t - a.t);
    const r = Math.round(a.r + (b.r - a.r) * lt);
    const g = Math.round(a.g + (b.g - a.g) * lt);
    const bl = Math.round(a.b + (b.b - a.b) * lt);
    return `rgb(${r},${g},${bl})`;
  }

  function randomGlyph() {
    return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  }

  // Column class
  class Column {
    constructor(x, layer) {
      this.x = x;
      this.layer = layer;
      this.speed = layer.speed * (0.6 + Math.random() * 0.8);
      this.y = Math.random() * H * -1;
      this.tailLength = 8 + Math.floor(Math.random() * 18);
      this.glyphs = [];
      this.glitchTimer = 0;
      this.glitchIntensity = 0;
      this.wordChar = null;
      this.wordHighlight = 0;
      this.drift = (Math.random() - 0.5) * 0.5;

      for (let i = 0; i < this.tailLength; i++) {
        this.glyphs.push(randomGlyph());
      }
    }

    update(dt) {
      this.y += this.speed * dt * 60;
      this.drift += (Math.random() - 0.5) * 0.02;
      this.drift *= 0.95;

      // Random glyph changes in tail
      if (Math.random() < 0.03) {
        const idx = Math.floor(Math.random() * this.glyphs.length);
        this.glyphs[idx] = randomGlyph();
      }

      // Glitch
      if (this.glitchTimer > 0) {
        this.glitchTimer -= dt;
        this.glitchIntensity = Math.max(0, this.glitchIntensity - dt * 2);
        if (Math.random() < 0.3) {
          this.glyphs[Math.floor(Math.random() * this.glyphs.length)] = randomGlyph();
        }
      }

      // Word highlight decay
      if (this.wordHighlight > 0) {
        this.wordHighlight -= dt * 1.2;
      }

      // Reset if fully off screen
      const headY = this.y;
      if (headY > H + this.tailLength * this.layer.size + 50) {
        this.y = -this.tailLength * this.layer.size - Math.random() * 200;
        for (let i = 0; i < this.glyphs.length; i++) {
          this.glyphs[i] = randomGlyph();
        }
        this.wordChar = null;
        this.wordHighlight = 0;
      }
    }

    draw(ctx, cameraX, cameraY, time) {
      const fontSize = this.layer.size;
      const charH = fontSize * 0.85;
      const baseX = this.x + this.drift + cameraX * this.layer.parallaxFactor;
      const baseY = this.y + cameraY * this.layer.parallaxFactor;

      ctx.font = `bold ${fontSize}px "Courier New", monospace`;
      ctx.textAlign = 'center';

      for (let i = 0; i < this.glyphs.length; i++) {
        const gy = baseY - i * charH;
        if (gy < -fontSize || gy > H + fontSize) continue;

        let char = this.glyphs[i];
        let alpha = this.layer.opacity;
        let color;

        if (i === 0) {
          // Head
          if (this.wordChar !== null && this.wordHighlight > 0) {
            char = this.wordChar;
            color = `rgba(255,255,255,${this.wordHighlight})`;
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 20 * this.wordHighlight;
          } else if (this.glitchTimer > 0) {
            color = `rgba(255,${Math.floor(Math.random()*100)},255,${0.8 + Math.random()*0.2})`;
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 15;
          } else {
            color = '#ffffff';
            ctx.shadowColor = lerpColor(0.2 + Math.sin(time * 0.5 + this.x * 0.01) * 0.3);
            ctx.shadowBlur = 12;
          }
          alpha = 1;
        } else {
          // Tail
          const fade = 1 - (i / this.tailLength);
          alpha *= fade * fade;
          if (alpha < 0.01) continue;

          const colorT = 0.1 + fade * 0.5 + Math.sin(time * 0.3 + i * 0.2 + this.x * 0.005) * 0.15;
          color = lerpColor(Math.max(0, Math.min(1, colorT)));

          if (this.glitchTimer > 0 && i < 3) {
            const gx = (Math.random() - 0.5) * this.glitchIntensity * 10;
            ctx.fillText(char, baseX + gx, gy, fontSize * 2);
            continue;
          }

          ctx.shadowBlur = 0;
        }

        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.fillText(char, baseX, gy);
      }

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    triggerGlitch() {
      this.glitchTimer = 0.5 + Math.random() * 1.0;
      this.glitchIntensity = 0.5 + Math.random() * 0.5;
    }
  }

  // Layer class
  class Layer {
    constructor(config) {
      this.columns = [];
      this.speed = config.speed;
      this.size = config.size;
      this.blur = config.blur;
      this.opacity = config.opacity;
      this.parallaxFactor = config.parallaxFactor;
      this.count = config.count;
    }

    init() {
      this.columns = [];
      const colSpacing = W / this.count;
      for (let i = 0; i < this.count; i++) {
        const x = colSpacing * i + colSpacing / 2 + (Math.random() - 0.5) * colSpacing * 0.4;
        this.columns.push(new Column(x, this));
      }
    }

    update(dt, time) {
      for (const col of this.columns) {
        col.update(dt);
      }

      // Random glitch bursts
      if (Math.random() < 0.002) {
        const idx = Math.floor(Math.random() * this.columns.length);
        this.columns[idx].triggerGlitch();
        // Sometimes glitch a group
        if (Math.random() < 0.3) {
          const groupSize = 1 + Math.floor(Math.random() * 3);
          for (let g = 0; g < groupSize; g++) {
            const gi = (idx + g) % this.columns.length;
            this.columns[gi].triggerGlitch();
          }
        }
      }
    }

    draw(ctx, cameraX, cameraY, time) {
      if (this.blur > 0) {
        ctx.filter = `blur(${this.blur}px)`;
      }
      for (const col of this.columns) {
        col.draw(ctx, cameraX, cameraY, time);
      }
      ctx.filter = 'none';
    }

    // Find columns near a target Y, return sorted by proximity
    getColumnsNearY(targetY, count) {
      const results = this.columns.map(col => ({
        col,
        dist: Math.abs(col.y - targetY)
      }));
      results.sort((a, b) => a.dist - b.dist);
      return results.slice(0, count).map(r => r.col);
    }
  }

  // Initialize layers
  const layers = [
    new Layer({ count: 50, speed: 0.25, size: 10, blur: 5, opacity: 0.25, parallaxFactor: 0.2 }),
    new Layer({ count: 35, speed: 0.55, size: 16, blur: 1.5, opacity: 0.55, parallaxFactor: 0.5 }),
    new Layer({ count: 22, speed: 1.0, size: 24, blur: 0, opacity: 1.0, parallaxFactor: 1.0 }),
  ];

  for (const layer of layers) {
    layer.init();
  }

  // Word alignment system
  let wordTimer = 0;
  let wordInterval = 3;
  let activeWords = [];

  function spawnWord(time) {
    const word = WORDS[Math.floor(Math.random() * WORDS.length)];
    const layerIdx = Math.floor(Math.random() * layers.length);
    const layer = layers[layerIdx];
    const targetY = H * 0.2 + Math.random() * H * 0.6;
    const cols = layer.getColumnsNearY(targetY, word.length);

    if (cols.length < word.length) return;

    const wordObj = {
      word,
      layer,
      cols,
      targetY,
      time: 0,
      duration: 2.5 + Math.random() * 1.5,
      charH: layer.size * 0.85,
    };

    for (let i = 0; i < word.length; i++) {
      cols[i].wordChar = word[i];
      cols[i].wordHighlight = 1;
    }

    activeWords.push(wordObj);
  }

  function updateWords(dt) {
    for (const w of activeWords) {
      w.time += dt;
      const progress = w.time / w.duration;

      if (progress > 1) {
        // Clear
        for (const col of w.cols) {
          col.wordChar = null;
          col.wordHighlight = 0;
        }
        return true; // remove
      }

      // Update highlight based on progress
      const highlight = progress < 0.15
        ? progress / 0.15
        : progress > 0.7
          ? (1 - progress) / 0.3
          : 1;

      for (const col of w.cols) {
        col.wordHighlight = highlight;
      }
    }

    activeWords = activeWords.filter(w => {
      const progress = w.time / w.duration;
      if (progress > 1) {
        for (const col of w.cols) {
          col.wordChar = null;
          col.wordHighlight = 0;
        }
        return false;
      }
      return true;
    });
  }

  // Camera drift
  let cameraX = 0, cameraY = 0;
  let cameraTargetX = 0, cameraTargetY = 0;

  function updateCamera(time, dt) {
    cameraTargetX = Math.sin(time * 0.08) * 30 + Math.sin(time * 0.17) * 15;
    cameraTargetY = Math.cos(time * 0.06) * 20 + Math.sin(time * 0.13) * 10;
    cameraX += (cameraTargetX - cameraX) * dt * 0.5;
    cameraY += (cameraTargetY - cameraY) * dt * 0.5;
  }

  // Glitch burst system - periodic larger glitches
  let glitchBurstTimer = 0;
  function triggerGlitchBurst() {
    const layer = layers[Math.floor(Math.random() * layers.length)];
    const count = 3 + Math.floor(Math.random() * 8);
    const startIdx = Math.floor(Math.random() * layer.columns.length);
    for (let i = 0; i < count; i++) {
      const idx = (startIdx + i) % layer.columns.length;
      layer.columns[idx].triggerGlitch();
      layer.columns[idx].glitchTimer = 0.8 + Math.random() * 1.5;
    }
  }

  // Main loop
  let lastTime = performance.now();
  let time = 0;

  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    time += dt;

    // Resize check
    if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
      resize();
      for (const layer of layers) layer.init();
    }

    updateCamera(time, dt);

    // Update layers
    for (const layer of layers) {
      layer.update(dt, time);
    }

    // Word spawning
    wordTimer += dt;
    if (wordTimer > wordInterval) {
      wordTimer = 0;
      wordInterval = 2.5 + Math.random() * 4;
      spawnWord(time);
    }
    updateWords(dt);

    // Glitch bursts
    glitchBurstTimer += dt;
    if (glitchBurstTimer > 5 + Math.random() * 8) {
      glitchBurstTimer = 0;
      triggerGlitchBurst();
    }

    // Draw
    // Fade background
    ctx.fillStyle = 'rgba(3, 5, 8, 0.15)';
    ctx.fillRect(0, 0, W, H);

    // Draw layers back to front
    for (const layer of layers) {
      layer.draw(ctx, cameraX, cameraY, time);
    }

    // Subtle vignette
    const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
    vignette.addColorStop(0, 'rgba(3,5,8,0)');
    vignette.addColorStop(1, 'rgba(3,5,8,0.5)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  // Initial clear
  ctx.fillStyle = '#030508';
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
