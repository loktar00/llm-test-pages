<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Colony Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="simCanvas"></canvas>

<script>
/**
 * Configuration
 */
const CONFIG = {
    antCount: 300,
    foodCount: 15,
    spawnRate: 2, // Food amount per spawn
    sensorAngle: Math.PI / 4,
    sensorDist: 20,
    turnSpeed: 0.2,
    speed: 2,
    evaporationRate: 0.985,
    depositAmount: 50,
    maxPheromone: 200,
    antSize: 2,
    foodColor: '#4caf50',
    trailColor: '#ff5722', // Orange/Red heat map
    nestSize: 15
};

/**
 * Setup Canvas
 */
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on main canvas
let width, height;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

/**
 * Simulation State
 */
let ants = [];
let foodPiles = [];
let pheromoneGrid;
let pheromoneBuffer; // For double buffering if needed, but we use simple smoothing/decay
let nest = { x: width / 2, y: height / 2 };

// Offscreen canvas for Pheromone rendering to avoid drawing millions of rects
const pseudoCanvas = document.createElement('canvas');
const pCtx = pseudoCanvas.getContext('2d');

function initGrid() {
    pseudoCanvas.width = width;
    pseudoCanvas.height = height;
    // Initialize grids with Float32 for smoother gradients (though we draw rects, this helps logic)
    // Using standard arrays for speed. 
    // To optimize, we can treat the grid cells larger than pixels, but let's go 1:1 for quality
    pheromoneGrid = new Float32Array(width * height).fill(0);
    pheromoneBuffer = new Float32Array(width * height).fill(0);
}

initGrid();

/**
 * Classes
 */
class Food {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.amount = CONFIG.spawnRate + Math.random() * 5;
        this.radius = Math.sqrt(this.amount) * 2;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = CONFIG.foodColor;
        ctx.fill();
        
        // Inner highlight
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#81c784';
        ctx.fill();
    }
}

class Ant {
    constructor() {
        this.x = nest.x;
        this.y = nest.y;
        this.angle = Math.random() * Math.PI * 2;
        this.hasFood = false;
        // Randomize slightly to prevent stacking at spawn
        this.x += (Math.random() - 0.5) * 20;
        this.y += (Math.random() - 0.5) * 20;
    }

    update() {
        this.wander();
        this.sense();
        this.move();
        this.checkBoundaries();
        this.handleFood();
        this.depositPheromone();
    }

    wander() {
        // Random jitter
        this.angle += (Math.random() - 0.5) * 0.5;
    }

    sense() {
        const sensorLeftX = this.x + Math.cos(this.angle - CONFIG.sensorAngle) * CONFIG.sensorDist;
        const sensorLeftY = this.y + Math.sin(this.angle - CONFIG.sensorAngle) * CONFIG.sensorDist;
        
        const sensorRightX = this.x + Math.cos(this.angle + CONFIG.sensorAngle) * CONFIG.sensorDist;
        const sensorRightY = this.y + Math.sin(this.angle + CONFIG.sensorAngle) * CONFIG.sensorDist;

        const sensorFrontX = this.x + Math.cos(this.angle) * CONFIG.sensorDist;
        const sensorFrontY = this.y + Math.sin(this.angle) * CONFIG.sensorDist;

        // Helper to get pheromone value at point
        const getP = (px, py) => {
            if (px < 0 || px >= width || py < 0 || py >= height) return -1;
            return pheromoneGrid[Math.floor(py) * width + Math.floor(px)];
        };

        const valLeft = getP(sensorLeftX, sensorLeftY);
        const valRight = getP(sensorRightX, sensorRightY);
        const valFront = getP(sensorFrontX, sensorFrontY);

        // Steering logic
        if (valFront > valLeft && valFront > valRight) {
            // Keep straight
        } else if (valFront < valLeft && valFront < valRight) {
            this.angle += (Math.random() - 0.5) * 2 * CONFIG.turnSpeed; // Confused, turn hard
        } else if (valLeft > valRight) {
            this.angle -= CONFIG.turnSpeed;
        } else if (valRight > valLeft) {
            this.angle += CONFIG.turnSpeed;
        } else {
            // No scent, random wander applies
        }
    }

    move() {
        this.x += Math.cos(this.angle) * CONFIG.speed;
        this.y += Math.sin(this.angle) * CONFIG.speed;
    }

    checkBoundaries() {
        // Soft bounce
        if (this.x < 0 || this.x >= width) {
            this.angle = Math.PI - this.angle;
            this.x = Math.max(0, Math.min(width, this.x));
        }
        if (this.y < 0 || this.y >= height) {
            this.angle = -this.angle;
            this.y = Math.max(0, Math.min(height, this.y));
        }
    }

    handleFood() {
        // Pick up food
        if (!this.hasFood) {
            for (let i = 0; i < foodPiles.length; i++) {
                const f = foodPiles[i];
                const dx = this.x - f.x;
                const dy = this.y - f.y;
                if (dx * dx + dy * dy < (f.radius + 5) * (f.radius + 5)) {
                    this.hasFood = true;
                    f.amount--;
                    f.radius = Math.max(2, Math.sqrt(f.amount) * 2);
                    if (f.amount <= 0) {
                        foodPiles.splice(i, 1);
                    }
                    // Turn around roughly
                    this.angle += Math.PI;
                    return;
                }
            }
        }

        // Drop food at nest
        if (this.hasFood) {
            const dx = this.x - nest.x;
            const dy = this.y - nest.y;
            if (dx * dx + dy * dy < CONFIG.nestSize * CONFIG.nestSize) {
                this.hasFood = false;
                this.angle += Math.PI; // Turn around to go back out
            }
        }
    }

    depositPheromone() {
        const gx = Math.floor(this.x);
        const gy = Math.floor(this.y);
        
        if (gx >= 0 && gx < width && gy >= 0 && gy < height) {
            const idx = gy * width + gx;
            // If carrying food, drop strong trail (Home scent)
            // If empty, drop weak trail (Food scent - technically separated in complex sims, 
            // but for visual clarity, we use one layer with logic separation or just simple strength)
            
            // To make trails distinct, let's just deposit based on state.
            // Note: In a pure visual sim, we might want to see trails ONLY when carrying food to know where food is.
            // But biological ants lay pheromone BOTH ways.
            // Let's deposit trail always.
            
            let amount = this.hasFood ? CONFIG.depositAmount : CONFIG.depositAmount * 0.2;
            
            // Clamp max
            if (pheromoneGrid[idx] < CONFIG.maxPheromone) {
                pheromoneGrid[idx] += amount;
            }
        }
    }

    draw() {
        ctx.fillStyle = this.hasFood ? '#fff' : '#ccc';
        // Draw simple rect/line
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillRect(-CONFIG.antSize, -CONFIG.antSize/2, CONFIG.antSize*2, CONFIG.antSize);
        ctx.restore();
    }
}

/**
 * Core Loop Functions
 */

function updatePheromones() {
    // Evaporation and Spreading
    // We iterate the whole grid. This is heavy, so we do it every few frames or use a coarser grid?
    // Given modern JS engines, iterating 1M items is fast enough if simple math.
    // We'll do it every frame but optimize the loop.
    
    // Optimization: Iterate and decay
    for (let i = 0; i < pheromoneGrid.length; i++) {
        pheromoneGrid[i] *= CONFIG.evaporationRate;
        if (pheromoneGrid[i] < 1) pheromoneGrid[i] = 0;
    }
}

function renderPheromones() {
    // We need to draw the grid to the pseudoCanvas
    // Using ImageData is faster than fillRect for every pixel
    const imageData = pCtx.createImageData(width, height);
    const data = imageData.data;

    for (let i = 0; i < pheromoneGrid.length; i++) {
        const val = pheromoneGrid[i];
        if (val > 0.5) {
            // Map pheromone strength to color
            // Heatmap style: Dark Red -> Orange -> Yellow -> White
            // Or simpler: Red channel intensity
            
            // Index in data array
            const pIndex = i * 4;
            
            // Normalize value for alpha/brightness
            // 0 to 200 range
            const intensity = Math.min(val, 100); 
            
            // Simple coloring: Red/Orange
            // R: 255, G: intensity, B: intensity * 0.5
            // Alpha: intensity
            
            data[pIndex] = 255;       // R
            data[pIndex + 1] = Math.floor(intensity * 0.5); // G
            data[pIndex + 2] = Math.floor(intensity * 0.2); // B
            data[pIndex + 3] = Math.floor(Math.min(intensity, 200)); // A
        }
    }
    pCtx.putImageData(imageData, 0, 0);
}

function spawnFood() {
    if (foodPiles.length < CONFIG.foodCount) {
        if (Math.random() < 0.05) { // Random chance per frame
            foodPiles.push(new Food());
        }
    }
}

function drawNest() {
    ctx.beginPath();
    ctx.arc(nest.x, nest.y, CONFIG.nestSize, 0, Math.PI * 2);
    ctx.fillStyle = '#333';
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.stroke();
}

function resetNestAnts() {
    // Recycle ants that might have wandered off screen or just reset all
    // Actually, just keeping them in bounds is handled. 
    // If they die (not implemented), we'd spawn new ones.
}

/**
 * Main Loop
 */
function loop() {
    // 1. Clear Main Canvas
    ctx.fillStyle = '#1a1a1a'; // Background color
    ctx.fillRect(0, 0, width, height);

    // 2. Update Logic
    spawnFood();
    
    // Update Pheromones (Evaporation)
    // Doing this every frame causes trails to vanish instantly. 
    // Do it every 2nd frame or reduce decay rate to keep trails longer.
    if (Math.random() > 0.5) updatePheromones();

    // Update Ants
    for (let ant of ants) {
        ant.update();
    }

    // 3. Render Layers
    
    // Layer 1: Pheromones
    // Only redraw if pheromone grid changed significantly (always does)
    // Optimization: Draw pseudoCanvas to main canvas with globalCompositeOperation
    if (Math.random() > 0.5) {
        renderPheromones();
    }
    ctx.globalCompositeOperation = 'screen'; // Makes it glow/blend nicely
    ctx.drawImage(pseudoCanvas, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    // Layer 2: Nest
    drawNest();

    // Layer 3: Food
    for (let f of foodPiles) {
        f.draw();
    }

    // Layer 4: Ants
    for (let ant of ants) {
        ant.draw();
    }

    requestAnimationFrame(loop);
}

/**
 * Initialization
 */
for (let i = 0; i < CONFIG.antCount; i++) {
    ants.push(new Ant());
}

// Start loop
loop();

</script>
</body>
</html>
