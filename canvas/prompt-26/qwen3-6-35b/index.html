         * Chromatic Plasma Reef
         * A full-screen metaballs screensaver using a field-based density approach.
         * 
         * Concept:
         * 1. We maintain an offscreen buffer of "density" values for a grid of pixels.

         * 3. We apply a threshold: if density > 0, the pixel is part of the organism.
         * 4. We color the pixel based on the total density, position, and time.
