<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain on Window</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Offscreen canvas for background
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');

// Bokeh lights
class BokehLight {
  constructor() {
    this.reset();
    this.y = Math.random() * H;
  }
  reset() {
    this.x = Math.random() * W;
    this.y = -this.radius;
    this.radius = Math.random() * 50 + 8;
    const colors = [
      [255, 200, 100], [255, 150, 80], [200, 220, 255],
      [255, 100, 100], [100, 200, 255], [255, 255, 200],
      [180, 130, 255], [255, 180, 220], [100, 255, 180],
      [255, 140, 60], [150, 180, 255], [255, 220, 150]
    ];
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.driftX = (Math.random() - 0.5) * 0.4;
    this.driftY = Math.random() * 0.15 + 0.02;
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = Math.random() * 0.015 + 0.003;
    this.alpha = Math.random() * 0.4 + 0.15;
  }
  update() {
    this.x += this.driftX;
    this.y += this.driftY;
    this.pulse += this.pulseSpeed;
    if (this.y > H + this.radius) this.reset();
  }
  draw(c) {
    const a = this.alpha * (0.7 + 0.3 * Math.sin(this.pulse));
    const [r, g, b] = this.color;
    const grad = c.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
    grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
    grad.addColorStop(0.4, `rgba(${r},${g},${b},${a * 0.5})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    c.fillStyle = grad;
    c.beginPath();
    c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    c.fill();
  }
}

// City silhouette buildings
class Building {
  constructor() {
    this.w = Math.random() * 60 + 20;
    this.h = Math.random() * H * 0.4 + H * 0.1;
    this.x = Math.random() * W;
    this.windows = [];
    const cols = Math.floor(this.w / 12);
    const rows = Math.floor(this.h / 16);
    for (let r = 0; r < rows; r++) {
      for (let c2 = 0; c2 < cols; c2++) {
        if (Math.random() > 0.4) {
          this.windows.push({
            rx: c2 * 12 + 4,
            ry: r * 16 + 6,
            on: Math.random() > 0.3,
            flicker: Math.random() * Math.PI * 2
          });
        }
      }
    }
  }
}

let bokehLights = [];
let buildings = [];
let droplets = [];
let streaks = [];
let lightningAlpha = 0;
let lightningTimer = 0;
let nextLightning = 800 + Math.random() * 1200;

function init() {
  bokehLights = [];
  for (let i = 0; i < 60; i++) bokehLights.push(new BokehLight());
  buildings = [];
  for (let i = 0; i < 25; i++) buildings.push(new Building());
  buildings.sort((a, b) => a.h - b.h);
  droplets = [];
  streaks = [];
  for (let i = 0; i < 80; i++) {
    const r = Math.random() * 3 + 1;
    droplets.push(new Droplet(
      Math.random() * W, Math.random() * H, r
    ));
  }
}

class Droplet {
  constructor(x, y, r) {
    this.x = x;
    this.y = y;
    this.r = r;
    this.targetR = Math.random() * 4 + 1.5;
    this.growRate = Math.random() * 0.008 + 0.003;
    this.falling = false;
    this.vy = 0;
    this.opacity = 0;
    this.age = 0;
    this.streaking = false;
    this.streakLen = 0;
  }
  update(dt) {
    this.age++;
    if (this.opacity < 1) this.opacity = Math.min(1, this.opacity + 0.02);

    if (!this.falling) {
      this.r += this.growRate * dt;
      if (this.r > this.targetR) {
        this.targetR = Math.random() * 4 + this.r * 0.5;
      }
      if (this.r > 6 + Math.random() * 4) {
        this.falling = true;
        this.vy = 1;
      }
    } else if (!this.streaking) {
      this.vy += 0.15 * dt;
      this.y += this.vy * dt;
      this.r *= (1 - 0.002 * dt);
      if (this.vy > 4) this.streaking = true;
      if (this.y > H + this.r) {
        this.y = -this.r;
        this.x = Math.random() * W;
        this.r = Math.random() * 2 + 1;
        this.falling = false;
        this.streaking = false;
        this.vy = 0;
        this.opacity = 0;
      }
    } else {
      this.vy += 0.2 * dt;
      this.y += this.vy * dt;
      this.streakLen = Math.min(this.streakLen + this.vy * dt * 2, 120);
      this.r *= (1 - 0.005 * dt);
      if (this.y > H + 200) {
        this.y = -this.r;
        this.x = Math.random() * W;
        this.r = Math.random() * 2 + 1;
        this.falling = false;
        this.streaking = false;
        this.vy = 0;
        this.streakLen = 0;
        this.opacity = 0;
      }
    }
  }
  draw(c) {
    if (this.opacity < 0.05) return;
    const alpha = this.opacity * 0.7;

    // Streak trail
    if (this.streaking && this.streakLen > 5) {
      const grad = c.createLinearGradient(this.x, this.y, this.x, this.y - this.streakLen);
      grad.addColorStop(0, `rgba(180,200,220,${alpha * 0.3})`);
      grad.addColorStop(0.3, `rgba(180,200,220,${alpha * 0.15})`);
      grad.addColorStop(1, `rgba(180,200,220,0)`);
      c.fillStyle = grad;
      const sw = Math.max(this.r * 0.6, 1);
      c.fillRect(this.x - sw, this.y - this.streakLen, sw * 2, this.streakLen);
    }

    // Refraction: draw a magnified portion of the background
    if (this.r > 1.5) {
      c.save();
      c.globalAlpha = alpha;
      c.beginPath();
      c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      c.clip();

      // Scaled background for refraction
      const scale = 1.3;
      const ox = (this.x - W / 2) * (scale - 1);
      const oy = (this.y - H / 2) * (scale - 1);
      c.drawImage(bgCanvas,
        this.x - this.r * scale + ox, this.y - this.r * scale + oy,
        this.r * 2 * scale, this.r * 2 * scale,
        this.x - this.r, this.y - this.r,
        this.r * 2, this.r * 2
      );
      c.restore();
    }

    // Droplet body
    const grad = c.createRadialGradient(
      this.x - this.r * 0.25, this.y - this.r * 0.25, this.r * 0.1,
      this.x, this.y, this.r
    );
    grad.addColorStop(0, `rgba(200,220,240,${alpha * 0.5})`);
    grad.addColorStop(0.6, `rgba(150,180,210,${alpha * 0.25})`);
    grad.addColorStop(1, `rgba(100,140,180,${alpha * 0.1})`);
    c.fillStyle = grad;
    c.beginPath();
    c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    c.fill();

    // Highlight
    if (this.r > 1) {
      const hg = c.createRadialGradient(
        this.x - this.r * 0.3, this.y - this.r * 0.3, 0,
        this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.5
      );
      hg.addColorStop(0, `rgba(255,255,255,${alpha * 0.6})`);
      hg.addColorStop(1, `rgba(255,255,255,0)`);
      c.fillStyle = hg;
      c.beginPath();
      c.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.5, 0, Math.PI * 2);
      c.fill();
    }

    // Edge ring
    c.strokeStyle = `rgba(180,210,240,${alpha * 0.2})`;
    c.lineWidth = 0.5;
    c.beginPath();
    c.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    c.stroke();
  }
}

class Streak {
  constructor(x, y, len, alpha) {
    this.x = x;
    this.y = y;
    this.len = len;
    this.alpha = alpha;
    this.life = 1;
  }
  update(dt) {
    this.life -= 0.003 * dt;
    this.y += 0.3 * dt;
  }
  draw(c) {
    if (this.life <= 0) return;
    const a = this.alpha * this.life;
    const grad = c.createLinearGradient(this.x, this.y, this.x, this.y - this.len);
    grad.addColorStop(0, `rgba(180,200,220,${a * 0.4})`);
    grad.addColorStop(0.5, `rgba(180,200,220,${a * 0.2})`);
    grad.addColorStop(1, `rgba(180,200,220,0)`);
    c.fillStyle = grad;
    c.fillRect(this.x - 2, this.y - this.len, 4, this.len);
  }
}

function drawBackground() {
  bgCtx.fillStyle = '#0a0a14';
  bgCtx.fillRect(0, 0, W, H);

  // Sky gradient
  const skyGrad = bgCtx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#050510');
  skyGrad.addColorStop(0.5, '#0a0a1a');
  skyGrad.addColorStop(1, '#151525');
  bgCtx.fillStyle = skyGrad;
  bgCtx.fillRect(0, 0, W, H);

  // Buildings
  for (const b of buildings) {
    const bx = b.x;
    const by = H - b.h;
    bgCtx.fillStyle = '#08080f';
    bgCtx.fillRect(bx, by, b.w, b.h);

    // Windows
    for (const w of b.windows) {
      if (w.on) {
        const flicker = 0.7 + 0.3 * Math.sin(w.flicker + performance.now() * 0.001);
        const wc = Math.random() > 0.7 ? [255, 220, 150] : [200, 210, 255];
        bgCtx.fillStyle = `rgba(${wc[0]},${wc[1]},${wc[2]},${0.6 * flicker})`;
        bgCtx.fillRect(bx + w.rx, by + w.ry, 6, 8);
        // Window glow
        const wg = bgCtx.createRadialGradient(
          bx + w.rx + 3, by + w.ry + 4, 0,
          bx + w.rx + 3, by + w.ry + 4, 15
        );
        wg.addColorStop(0, `rgba(${wc[0]},${wc[1]},${wc[2]},${0.15 * flicker})`);
        wg.addColorStop(1, `rgba(${wc[0]},${wc[1]},${wc[2]},0)`);
        bgCtx.fillStyle = wg;
        bgCtx.fillRect(bx + w.rx - 10, by + w.ry - 10, 26, 28);
      }
    }
  }

  // Bokeh lights
  for (const l of bokehLights) {
    l.update();
    l.draw(bgCtx);
  }

  // Distant city glow
  const cityGlow = bgCtx.createLinearGradient(0, H * 0.6, 0, H);
  cityGlow.addColorStop(0, 'rgba(40,30,50,0)');
  cityGlow.addColorStop(1, 'rgba(40,30,50,0.3)');
  bgCtx.fillStyle = cityGlow;
  bgCtx.fillRect(0, H * 0.6, W, H * 0.4);
}

function mergeDroplets() {
  for (let i = 0; i < droplets.length; i++) {
    if (droplets[i].falling) continue;
    for (let j = i + 1; j < droplets.length; j++) {
      if (droplets[j].falling) continue;
      const dx = droplets[i].x - droplets[j].x;
      const dy = droplets[i].y - droplets[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = droplets[i].r + droplets[j].r;
      if (dist < minDist && dist > 0) {
        const newR = Math.sqrt(droplets[i].r * droplets[i].r + droplets[j].r * droplets[j].r);
        const mx = (droplets[i].x * droplets[i].r + droplets[j].x * droplets[j].r) / (droplets[i].r + droplets[j].r);
        const my = (droplets[i].y * droplets[i].r + droplets[j].y * droplets[j].r) / (droplets[i].r + droplets[j].r);
        droplets[i].x = mx;
        droplets[i].y = my;
        droplets[i].r = newR;
        droplets[i].targetR = newR * (1 + Math.random());
        droplets.splice(j, 1);
        j--;
      }
    }
  }
}

function wipeDroplets() {
  for (let i = droplets.length - 1; i >= 0; i--) {
    const d = droplets[i];
    if (!d.falling) continue;
    for (let j = 0; j < droplets.length; j++) {
      if (i === j) continue;
      const o = droplets[j];
      if (o.falling && o.r > 3) continue;
      const dx = d.x - o.x;
      const dy = d.y - o.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < d.r + o.r + 5 && o.r < d.r) {
        droplets.splice(j, 1);
        d.r += o.r * 0.3;
        j--;
      }
    }
  }
}

function spawnDroplets() {
  if (droplets.length < 150 && Math.random() < 0.05) {
    const r = Math.random() * 1.5 + 0.5;
    droplets.push(new Droplet(
      Math.random() * W, Math.random() * H * 0.8, r
    ));
  }
}

function updateLightning(dt) {
  lightningTimer += dt;
  if (lightningTimer > nextLightning && lightningAlpha <= 0) {
    lightningAlpha = 0.8 + Math.random() * 0.2;
    lightningTimer = 0;
    nextLightning = 600 + Math.random() * 1500;
  }
  if (lightningAlpha > 0) {
    lightningAlpha -= 0.04 * dt;
    if (lightningAlpha < 0.3 && lightningAlpha > 0) {
      // Second flash
      if (Math.random() < 0.02) {
        lightningAlpha = 0.4 + Math.random() * 0.3;
      }
    }
    if (lightningAlpha < 0) lightningAlpha = 0;
  }
}

let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) / 16.67, 3);
  lastTime = now;

  drawBackground();

  updateLightning(dt);

  // Spawn & update droplets
  spawnDroplets();
  for (const d of droplets) d.update(dt);
  mergeDroplets();
  wipeDroplets();

  // Update streaks
  for (let i = streaks.length - 1; i >= 0; i--) {
    streaks[i].update(dt);
    if (streaks[i].life <= 0) streaks.splice(i, 1);
  }

  // Draw to main canvas
  ctx.drawImage(bgCanvas, 0, 0);

  // Lightning flash
  if (lightningAlpha > 0) {
    ctx.fillStyle = `rgba(220,230,255,${lightningAlpha * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Draw droplets
  for (const d of droplets) d.draw(ctx);

  // Draw streaks
  for (const s of streaks) s.draw(ctx);

  // Glass texture overlay
  ctx.fillStyle = 'rgba(10,15,30,0.03)';
  ctx.fillRect(0, 0, W, H);

  // Subtle vignette
  const vig = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Occasional streak spawn from falling drops
  for (const d of droplets) {
    if (d.streaking && Math.random() < 0.02) {
      streaks.push(new Streak(d.x, d.y, d.streakLen * 0.5, 0.3));
    }
  }

  requestAnimationFrame(frame);
}

init();
requestAnimationFrame(frame);
</script>
</body>
</html>
