<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name-equiv="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Volcano Island</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const TAU = Math.PI * 2;

  // Time tracking
  let startTime = performance.now();
  let cycleDuration = 60000; // 60 seconds
  let lastFrame = startTime;

  // Volcano state
  const volcano = {
    x: 0,
    y: 0,
    radius: 0,
    rumblingProgress: 0,
    ashProgress: 0,
    eruptionProgress: 0,
    lavaFlowProgress: 0,
    phaseDuration: 15000, // 15s per phase
    phaseStart: 0
  };

  const lavaBombs = [];
  const ashParticles = [];
  const smokeParticles = [];
  const steamParticles = [];
  const palmTrees = [];
  const seabirds = [];

  let shorelineOffset = 0;

  function initScene() {
    volcano.x = width * 0.7;
    volcano.y = height * 0.4;
    volcano.radius = Math.min(width, height) * 0.08;

    // Create palm trees
    for (let i = 0; i < 8; i++) {
      palmTrees.push({
        x: 50 + (i * (width - 100) / 7),
        y: height * 0.75,
        sway: Math.random() * TAU,
        swaySpeed: 0.5 + Math.random() * 0.5,
        height: 40 + Math.random() * 20
      });
    }

    // Create seabirds
    for (let i = 0; i < 6; i++) {
      seabirds.push({
        x: -100 - Math.random() * 200,
        y: 100 + Math.random() * 50,
        speed: 1 + Math.random() * 2,
        flying: false
      });
    }
  }

  function resetScene() {
    lavaBombs.length = 0;
    ashParticles.length = 0;
    smokeParticles.length = 0;
    steamParticles.length = 0;
    shorelineOffset = 0;
    volcano.lavaFlowProgress = 0;
  }

  function animate(time) {
    const delta = time - lastFrame;
    lastFrame = time;

    const totalElapsed = (time - startTime) % cycleDuration;

    // Determine phase
    const phase = Math.floor(totalElapsed / volcano.phaseDuration);
    volcano.phaseStart = totalElapsed - phase * volcano.phaseDuration;
    const phaseProgress = volcano.phaseStart / volcano.phaseDuration;

    // Reset if we've gone through all phases
    if (phase >= 4) {
      if (shorelineOffset < 1) {
        // Continue extending shoreline
        shorelineOffset = Math.min(1, shorelineOffset + delta * 0.0005);
      } else {
        startTime = time;
      }
    }

    // Update phase progress values
    switch(phase) {
      case 0: // Rumbling
        volcano.rumblingProgress = phaseProgress;
        break;
      case 1: // Ash plumes
        volcano.ashProgress = phaseProgress;
        break;
      case 2: // Eruption
        volcano.eruptionProgress = phaseProgress;
        break;
      case 3: // Lava flows
        volcano.lavaFlowProgress = phaseProgress;
        break;
    }

    updateAshParticles(delta);
    updateLavaBombs(delta, phase);
    updateSmokeParticles(delta);
    updateSteamParticles(delta);
    updateSeabirds(phase, delta);
    
    render(time, phase, phaseProgress);
    requestAnimationFrame(animate);
  }

  function updateAshParticles(delta) {
    if (volcano.ashProgress > 0 || volcano.eruptionProgress > 0) {
      const rate = (volcano.ashProgress + volcano.eruptionProgress) * 0.5;
      for (let i = 0; i < rate * 5; i++) {
        ashParticles.push({
          x: volcano.x + (Math.random() - 0.5) * volcano.radius * 1.5,
          y: volcano.y - volcano.radius * 0.8,
          vx: (Math.random() - 0.5) * 2,
          vy: -Math.random() * 2 - 0.5,
          size: Math.random() * 4 + 2,
          alpha: 0.8
        });
      }
    }

    for (let i = ashParticles.length - 1; i >= 0; i--) {
      const p = ashParticles[i];
      p.vx += (Math.random() - 0.5) * 0.1;
      p.vy += 0.05;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= delta * 0.0005;
      p.size *= 0.99;
      
      // Wind effect
      p.x += Math.sin(time * 0.001 + p.y * 0.01) * 0.5;
      
      if (p.alpha <= 0 || p.y > height) {
        ashParticles.splice(i, 1);
      }
    }
  }

  function updateLavaBombs(delta, phase) {
    if (volcano.eruptionProgress > 0 && Math.random() < volcano.eruptionProgress * 0.1) {
      const angle = Math.PI / 2 + (Math.random() - 0.5) * 0.3;
      const speed = 3 + Math.random() * 4;
      lavaBombs.push({
        x: volcano.x,
        y: volcano.y - volcano.radius,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        trail: [],
        gravity: 0.15,
        size: 8 + Math.random() * 6
      });
    }

    for (let i = lavaBombs.length - 1; i >= 0; i--) {
      const b = lavaBombs[i];
      
      // Trail
      if (b.trail.length < 10) {
        b.trail.push({x: b.x, y: b.y});
      } else {
        b.trail.shift();
        b.trail.push({x: b.x, y: b.y});
      }
      
      b.vx += (Math.random() - 0.5) * 0.1;
      b.vy += b.gravity;
      b.x += b.vx;
      b.y += b.vy;
      
      // Check sea collision
      const seaLevel = height * 0.65;
      if (b.y > seaLevel) {
        // Steam burst
        for (let j = 0; j < 15; j++) {
          steamParticles.push({
            x: b.x + (Math.random() - 0.5) * 20,
            y: seaLevel,
            vx: (Math.random() - 0.5) * 3,
            vy: -Math.random() * 3 - 1,
            size: Math.random() * 8 + 4,
            alpha: 0.8
          });
        }
        lavaBombs.splice(i, 1);
      }
    }
  }

  function updateSmokeParticles(delta) {
    // Smoke trails from active bombs
    for (const bomb of lavaBombs) {
      if (bomb.trail.length > 1) {
        const last = bomb.trail[bomb.trail.length - 1];
        smokeParticles.push({
          x: last.x + (Math.random() - 0.5) * 10,
          y: last.y + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 1,
          vy: -Math.random() * 0.5,
          size: Math.random() * 6 + 3,
          alpha: 0.6
        });
      }
    }

    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      const p = smokeParticles[i];
      p.vx += (Math.random() - 0.5) * 0.1;
      p.vy += 0.02;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= delta * 0.001;
      p.size *= 1.01;
      
      if (p.alpha <= 0 || p.y > height) {
        smokeParticles.splice(i, 1);
      }
    }
  }

  function updateSteamParticles(delta) {
    for (let i = steamParticles.length - 1; i >= 0; i--) {
      const p = steamParticles[i];
      p.vx += (Math.random() - 0.5) * 0.1;
      p.vy += 0.01;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= delta * 0.0008;
      p.size *= 1.02;
      
      if (p.alpha <= 0 || p.y > height) {
        steamParticles.splice(i, 1);
      }
    }
  }

  function updateSeabirds(phase, delta) {
    // Birds flee during eruption, return after
    const shouldFly = phase === 2 || phase === 3;
    
    for (const bird of seabirds) {
      if (shouldFly) {
        bird.flying = true;
      } else if (phase === 3 && shorelineOffset > 0.5) {
        // Start returning
      } else if (phase === 0) {
        bird.flying = false;
      }
      
      if (bird.flying) {
        bird.x += bird.speed * (1 + phase * 0.5);
        if (bird.x > width + 100) {
          bird.x = -100;
          bird.y = 80 + Math.random() * 60;
        }
      } else {
        // Coastal flying pattern
        bird.x += bird.speed * 0.3;
        bird.y = 120 + Math.sin(bird.x * 0.01) * 10;
        if (bird.x > width + 50) {
          bird.x = -50;
        }
      }
    }
  }

  function render(time, phase, phaseProgress) {
    // Day-night cycle
    const dayFactor = (Math.sin((time - startTime) / cycleDuration * TAU - Math.PI / 2) + 1) / 2;
    
    const skyColor = [
      Math.floor(100 + dayFactor * 100),
      Math.floor(120 + dayFactor * 80),
      Math.floor(180 + dayFactor * 50)
    ];
    
    // Clear with sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.7);
    skyGrad.addColorStop(0, `rgb(${skyColor[0]}, ${skyColor[1]}, ${skyColor[2]})`);
    skyGrad.addColorStop(1, `rgb(${Math.floor(skyColor[0]*0.7)}, ${Math.floor(skyColor[1]*0.7)}, ${Math.floor(skyColor[2]*0.7)})`);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    // Sun/moon
    const sunX = width * 0.2 + Math.cos((time - startTime) / cycleDuration * TAU) * width * 0.3;
    const sunY = height * 0.3 + Math.sin((time - startTime) / cycleDuration * TAU) * height * 0.2;
    
    ctx.fillStyle = dayFactor > 0.5 ? '#FFD700' : '#F0F0F0';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 15 + dayFactor * 10, 0, TAU);
    ctx.fill();

    // Ocean
    const seaLevel = height * 0.65;
    const oceanGrad = ctx.createLinearGradient(0, seaLevel, 0, height);
    oceanGrad.addColorStop(0, `rgb(${Math.floor(60 + dayFactor * 40)}, ${Math.floor(100 + dayFactor * 50)}, ${Math.floor(160 + dayFactor * 40)})`);
    oceanGrad.addColorStop(1, `rgb(${Math.floor(30 + dayFactor * 20)}, ${Math.floor(60 + dayFactor * 30)}, ${Math.floor(100 + dayFactor * 30)})`);
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, seaLevel, width, height - seaLevel);

    // Ocean waves
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 * dayFactor + 0.1})`;
    ctx.lineWidth = 1 + Math.sin(time * 0.01) * 0.5;
    ctx.beginPath();
    for (let x = 0; x < width; x += 20) {
      const waveY = seaLevel + Math.sin(time * 0.003 + x * 0.02) * 5;
      if (x === 0) ctx.moveTo(x, waveY);
      else ctx.lineTo(x, waveY);
    }
    ctx.stroke();

    // Beach with extended shoreline
    const beachHeight = height * 0.1;
    const shorelineX = width * 0.65 + shorelineOffset * width * 0.05;
    
    ctx.fillStyle = '#E6D3A7';
    ctx.beginPath();
    ctx.moveTo(shorelineX, seaLevel);
    ctx.lineTo(width, seaLevel);
    ctx.lineTo(width, seaLevel + beachHeight);
    ctx.lineTo(shorelineX + 10, seaLevel + beachHeight);
    ctx.closePath();
    ctx.fill();

    // Volcano
    drawVolcano(time, phase, phaseProgress, dayFactor);

    // Palm trees
    drawPalmTrees(time, phase, dayFactor);

    // Particles
    drawAshParticles();
    drawSmokeParticles();
    drawLavaBombs(time, phase, dayFactor);
    drawSteamParticles();

    // Seabirds
    drawSeabirds(dayFactor, phase);
  }

  function drawVolcano(time, phase, phaseProgress, dayFactor) {
    ctx.save();
    ctx.translate(volcano.x, volcano.y);
    
    // Volcano base
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, volcano.radius * 2);
    grad.addColorStop(0, '#8B4513');
    grad.addColorStop(0.5, '#654321');
    grad.addColorStop(1, '#4a2c0e');
    ctx.fillStyle = grad;
    
    ctx.beginPath();
    ctx.arc(0, 0, volcano.radius, 0, TAU);
    ctx.fill();
    
    // Crater
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(0, volcano.radius * 0.2, volcano.radius * 0.4, 0, TAU);
    ctx.fill();
    
    // Rumbling effect - cracks glow
    if (phase === 0) {
      const glowIntensity = phaseProgress * 0.8;
      ctx.fillStyle = `rgba(255, 100, 0, ${glowIntensity})`;
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * TAU;
        const crackLen = volcano.radius * 0.3 * (0.5 + 0.5 * Math.sin(time * 0.01 + i));
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * volcano.radius, Math.sin(angle) * volcano.radius);
        ctx.lineWidth = 2 + 3 * phaseProgress;
        ctx.strokeStyle = `rgba(255, 100, 0, ${glowIntensity})`;
        ctx.stroke();
      }
    }
    
    // Ash plume base
    if (phase === 1 || phase === 2) {
      const ashAmount = phase === 1 ? phaseProgress : 1;
      const plumeHeight = 80 + phaseProgress * 50;
      const plumeWidth = 30 + phaseProgress * 20;
      
      ctx.fillStyle = `rgba(80, 80, 80, ${0.6 * ashAmount})`;
      ctx.beginPath();
      ctx.moveTo(-volcano.radius * 0.3, -volcano.radius * 0.6);
      ctx.bezierCurveTo(
        -plumeWidth, -plumeHeight,
        plumeWidth, -plumeHeight * 0.8,
        volcano.radius * 0.3, -volcano.radius * 0.6
      );
      ctx.fill();
    }
    
    // Eruption flames
    if (phase === 2) {
      const flameHeight = 60 + phaseProgress * 100;
      const grad = ctx.createRadialGradient(0, -volcano.radius, 0, 0, -volcano.radius, flameHeight);
      grad.addColorStop(0, '#FF4500');
      grad.addColorStop(0.5, '#FF8C00');
      grad.addColorStop(1, 'rgba(255, 140, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-volcano.radius * 0.3, -volcano.radius * 0.8);
      ctx.bezierCurveTo(
        -volcano.radius * 0.8, -volcano.radius - flameHeight,
        volcano.radius * 0.8, -volcano.radius - flameHeight * 0.7,
        volcano.radius * 0.3, -volcano.radius * 0.8
      );
      ctx.fill();
    }
    
    // Lava flow
    if (phase === 3) {
      const flowAmount = phaseProgress;
      const flowLength = flowAmount * 120;
      
      // Main flow
      ctx.fillStyle = '#FF4500';
      ctx.beginPath();
      ctx.moveTo(-volcano.radius * 0.2, volcano.radius * 0.5);
      ctx.bezierCurveTo(
        -volcano.radius * 0.4, volcano.radius * 0.8,
        -flowLength * 0.5, volcano.radius * 0.8,
        -flowLength, height * 0.3
      );
      ctx.lineTo(-flowLength - 30, height * 0.3 + 10);
      ctx.bezierCurveTo(
        -flowLength * 0.5, volcano.radius * 0.8,
        -volcano.radius * 0.4, volcano.radius * 0.8,
        -volcano.radius * 0.2, volcano.radius * 0.5
      );
      ctx.fill();
      
      // Glowing effect
      ctx.fillStyle = '#FFA500';
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(-volcano.radius * 0.15, volcano.radius * 0.5);
      ctx.bezierCurveTo(
        -volcano.radius * 0.3, volcano.radius * 0.7,
        -flowLength * 0.4, volcano.radius * 0.7,
        -flowLength, height * 0.3
      );
      ctx.lineTo(-5, height * 0.3 + 5);
      ctx.bezierCurveTo(
        -volcano.radius * 0.2, volcano.radius * 0.6,
        -volcano.radius * 0.15, volcano.radius * 0.5,
        -volcano.radius * 0.15, volcano.radius * 0.5
      );
      ctx.fill();
      ctx.globalAlpha = 1.0;
      
      // Crust formation
      if (flowAmount > 0.5) {
        const crustProgress = (flowAmount - 0.5) * 2;
        ctx.fillStyle = '#8B4513';
        ctx.globalAlpha = crustProgress * 0.7;
        const crustY = height * 0.3 + 5 - crustProgress * 3;
        ctx.fillRect(-flowLength - 25, crustY, flowLength + 25, 5);
        ctx.globalAlpha = 1.0;
      }
    }
    
    ctx.restore();
  }

  function drawPalmTrees(time, phase, dayFactor) {
    for (const tree of palmTrees) {
      const swayAmount = Math.sin(time * 0.001 * tree.swaySpeed + tree.sway) * 0.3;
      
      ctx.save();
      ctx.translate(tree.x, tree.y);
      ctx.rotate(swayAmount);
      
      // Trunk
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(-3, 0, 6, tree.height);
      
      // Fronds
      ctx.fillStyle = '#228B22';
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.lineTo(-15, 10);
      ctx.lineTo(-5, 12);
      ctx.lineTo(-18, 18);
      ctx.lineTo(-2, 15);
      ctx.lineTo(-15, 25);
      ctx.lineTo(0, 18);
      ctx.lineTo(15, 25);
      ctx.lineTo(2, 15);
      ctx.lineTo(18, 18);
      ctx.lineTo(5, 12);
      ctx.lineTo(15, 10);
      ctx.closePath();
      ctx.fill();
      
      // Shadow
      ctx.fillStyle = `rgba(0, 0, 0, ${0.2 * dayFactor})`;
      ctx.fillRect(-6, tree.height, 12, 5);
      
      ctx.restore();
    }
  }

  function drawAshParticles() {
    for (const p of ashParticles) {
      ctx.fillStyle = `rgba(100, 100, 100, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
  }

  function drawSmokeParticles() {
    for (const p of smokeParticles) {
      ctx.fillStyle = `rgba(150, 150, 150, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
  }

  function drawLavaBombs(time, phase, dayFactor) {
    for (const b of lavaBombs) {
      // Trail
      if (b.trail.length > 1) {
        for (let i = 1; i < b.trail.length; i++) {
          const alpha = i / b.trail.length * 0.6;
          ctx.fillStyle = `rgba(100, 100, 100, ${alpha})`;
          ctx.beginPath();
          ctx.arc(b.trail[i].x, b.trail[i].y, b.size * 0.3, 0, TAU);
          ctx.fill();
        }
      }
      
      // Glow
      ctx.fillStyle = '#FF4500';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, TAU);
      ctx.fill();
      
      // Core
      ctx.fillStyle = '#FFA500';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size * 0.6, 0, TAU);
      ctx.fill();
    }
  }

  function drawSteamParticles() {
    for (const p of steamParticles) {
      ctx.fillStyle = `rgba(200, 200, 220, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    }
  }

  function drawSeabirds(dayFactor, phase) {
    for (const bird of seabirds) {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      
      ctx.strokeStyle = phase === 2 || phase === 3 ? '#000' : `rgba(0, 0, 0, ${0.7 * dayFactor})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      
      // Wing position based on flight
      const wingFlap = bird.flying ? Math.sin(bird.x * 0.1) * 5 : 0;
      
      // Body
      ctx.moveTo(-8, 0);
      ctx.lineTo(0, -4);
      ctx.lineTo(0, 4);
      ctx.closePath();
      ctx.stroke();
      
      // Wings
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(6, wingFlap);
      ctx.lineTo(12, 0);
      ctx.stroke();
      
      ctx.restore();
    }
  }

  // Initialize and start
  time = 0;
  initScene();
  requestAnimationFrame(function f(t) {
    time = t;
    animate(t);
  });
})();
</script>
</body>
</html>
