<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteor Storm</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="sky"></canvas>
    <script>
        const canvas = document.getElementById('sky');
        const ctx = canvas.getContext('2d');
        
        let w, h;
        let stars = [];
        let meteors = [];
        let flashOpacity = 0;
        
        // Storm Phase System
        // 0: Calm (few meteors), 1: Storm (many meteors, waves)
        let stormState = 0; 
        let stormTimer = 0;
        const STORM_CYCLE = 1000; // Total time for calm -> storm -> calm
        const WAVE_DURATION = 300; // Duration of high intensity within storm state
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            generateStars();
        }

        function generateStars() {
            stars = [];
            const count = Math.floor((w * h) / 1500);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.5,
                    alpha: Math.random() * 0.8 + 0.2
                });
            }
        }

        class Meteor {
            constructor(isBolide = false) {
                this.isBolide = isBolide;
                this.reset();
            }

            reset() {
                this.x = Math.random() * w + (w * 0.2); // Start mostly on right side
                this.y = -50;
                
                // Angle: mostly top-right to bottom-left
                const angle = (Math.PI / 4) + (Math.random() * 0.5 - 0.25); 
                this.vx = Math.cos(angle) * (this.isBolide ? 12 : 15);
                this.vy = Math.sin(angle) * (this.isBolide ? 12 : 15);

                // Visual properties
                this.length = this.isBolide ? 300 : 80 + Math.random() * 100;
                this.width = this.isBolide ? 6 : 2;
                this.alpha = 1;
                
                // Color tint
                const colors = ['#ffffff', '#aaddff', '#ffd2a1'];
                this.color = this.isBolide ? '#ffffff' : colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Off screen check
                if (this.y > h + 100 || this.x < -100) {
                    // If it's a bolide, let it fade out visually before recycling logic
                    // But since we use a persistence canvas, we just remove the instance
                    // and rely on the canvas itself to fade the trail.
                    return false; 
                }
                return true;
            }

            draw(ctx) {
                // Calculate end point for the trail based on length and velocity vector
                const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                const normX = this.vx / speed;
                const normY = this.vy / speed;

                const tailX = this.x - normX * this.length;
                const tailY = this.y - normY * this.length;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);

                // Gradient for the meteor head vs tail
                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                
                // Bright head, fading tail
                grad.addColorStop(0, this.color);
                grad.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = this.isBolide ? this.width : this.width * (Math.random() * 0.5 + 0.5); // jitter width for ionization effect
                ctx.lineCap = 'round';
                ctx.shadowBlur = this.isBolide ? 20 : 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset for performance
            }
        }

        function drawStars() {
            ctx.fillStyle = '#FFF';
            for (let s of stars) {
                ctx.globalAlpha = s.alpha;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function drawRidge() {
            ctx.fillStyle = '#020205';
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(0, h * 0.7);
            
            // Jagged mountains
            for (let x = 0; x <= w; x += 40) {
                const noise = Math.sin(x * 0.01) * 50 + Math.sin(x * 0.05) * 20;
                ctx.lineTo(x, h * 0.75 - Math.abs(noise));
            }
            
            ctx.lineTo(w, h);
            ctx.fill();
        }

        function animate() {
            // 1. The Persistence Effect
            // Instead of clearing, we draw a semi-transparent black rect.
            // This makes old frames fade out slowly.
            ctx.fillStyle = 'rgba(5, 5, 16, 0.15)'; 
            ctx.fillRect(0, 0, w, h);

            // 2. Manage Storm Intensity
            stormTimer++;
            if (stormTimer > STORM_CYCLE) stormTimer = 0;

            // Logic: 
            // 0 -> 30% time: CALM
            // 30% -> 80% time: STORM (waxes and wanes)
            // 80% -> 100% time: CALM
            
            let spawnRate = 0;
            let isBolideWave = false;

            if (stormTimer > STORM_CYCLE * 0.3 && stormTimer < STORM_CYCLE * 0.8) {
                // Inside Storm Window
                const progress = (stormTimer - (STORM_CYCLE * 0.3)) / (STORM_CYCLE * 0.5); // 0 to 1
                // Sine wave for waxing/waning
                const intensity = Math.sin(progress * Math.PI); 
                spawnRate = 0.02 + (intensity * 0.15); // Probability per frame
                
                // Check if we are near peak (0.4 to 0.6) for a Bolide
                if (intensity > 0.8 && Math.random() < 0.005) {
                    isBolideWave = true;
                }
            } else {
                spawnRate = 0.005; // Minimal background stars/meteors
            }

            // 3. Spawn Meteors
            if (Math.random() < spawnRate) {
                meteors.push(new Meteor(isBolideWave));
            }

            // 4. Draw & Update Meteors
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                if (!m.update()) {
                    meteors.splice(i, 1);
                } else {
                    m.draw(ctx);
                }
            }

            // 5. Sky Flash (Bolide effect)
            // If we just spawned a bolide, flash the sky slightly
            // We check the last spawned meteor to see if it's a bolide
            if (meteors.length > 0 && meteors[meteors.length-1].isBolide) {
                if (flashOpacity <= 0 && Math.random() < 0.1) {
                    flashOpacity = 0.3; // Flash brightness
                }
            }
            
            if (flashOpacity > 0) {
                ctx.fillStyle = `rgba(200, 220, 255, ${flashOpacity})`;
                ctx.fillRect(0, 0, w, h);
                flashOpacity *= 0.9; // Fade out
                if (flashOpacity < 0.01) flashOpacity = 0;
            }

            // 6. Draw Ground/Ridge (Redrawn every frame to cover fading trails on ground)
            drawRidge();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

    </script>
</body>
</html>
