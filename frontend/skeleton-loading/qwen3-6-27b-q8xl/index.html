<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Loading Demo</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #666666;
            --skeleton-base: #e0e0e0;
            --skeleton-shine: #f5f5f5;
            --accent: #3b82f6;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            font-size: 14px;
        }

        button:active {
            transform: scale(0.96);
        }

        /* Feed Container */
        .feed {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Card Base Styles */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            /* Dimensions fixed to prevent layout shift */
            height: 240px;
            display: flex;
            flex-direction: column;
        }

        /* Content Styles (Hidden initially) */
        .card-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card.visible .card-content {
            opacity: 1;
            transform: translateY(0);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e5e7eb;
            background-size: cover;
            flex-shrink: 0;
        }

        .meta {
            display: flex;
            flex-direction: column;
        }

        .author {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-main);
        }

        .date {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .card-image {
            width: 100%;
            height: 120px;
            background-color: #eee;
            border-radius: 8px;
            margin-bottom: 12px;
            background-size: cover;
            background-position: center;
        }

        .card-text {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
        }

        /* Skeleton Styles */
        .skeleton-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--card-bg);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .skeleton-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Skeleton Elements */
        .sk-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .sk-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--skeleton-base);
            background-image: linear-gradient(
                120deg, 
                var(--skeleton-base) 30%, 
                var(--skeleton-shine) 50%, 
                var(--skeleton-base) 70%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        .sk-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sk-bar {
            height: 12px;
            border-radius: 6px;
            background: var(--skeleton-base);
            background-image: linear-gradient(
                120deg, 
                var(--skeleton-base) 30%, 
                var(--skeleton-shine) 50%, 
                var(--skeleton-base) 70%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        .sk-w-60 { width: 60%; }
        .sk-w-40 { width: 40%; }

        .sk-image {
            width: 100%;
            height: 120px;
            border-radius: 8px;
            background: var(--skeleton-base);
            background-image: linear-gradient(
                120deg, 
                var(--skeleton-base) 30%, 
                var(--skeleton-shine) 50%, 
                var(--skeleton-base) 70%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            margin-bottom: 12px;
        }

        .sk-text-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sk-w-100 { width: 100%; }
        .sk-w-80 { width: 80%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Discover</h1>
        <button id="reloadBtn">Reload Feed</button>
    </div>

    <div class="feed" id="feedContainer">
        <!-- Cards will be injected here -->
    </div>

    <script>
        // Mock Data
        const posts = [
            {
                author: "Alex Rivera",
                handle: "@arivera",
                date: "2 hours ago",
                title: "Designing for Motion",
                text: "Motion isn't just decoration; it's a way to guide the user's eye through the interface. Subtle transitions can make a complex app feel intuitive.",
                imageColor: "#ffadad", // Replacing image with color for zero-dependency
                avatarColor: "#ffd6a5"
            },
            {
                author: "Sarah Chen",
                handle: "@schen_dev",
                date: "4 hours ago",
                title: "The Future of CSS",
                text: "We are entering a golden age of CSS. With container queries and nesting, we can build complex layouts without bloating our JavaScript bundles.",
                imageColor: "#fdffb6",
                avatarColor: "#caffbf"
            },
            {
                author: "Marcus Johnson",
                handle: "@mj_photo",
                date: "6 hours ago",
                title: "Minimalist Architecture",
                text: "Found this incredible structure in downtown Tokyo. The interplay of light and concrete shadows is exactly what I was looking for.",
                imageColor: "#9bf6ff",
                avatarColor: "#a0c4ff"
            }
        ];

        const feedContainer = document.getElementById('feedContainer');
        const reloadBtn = document.getElementById('reloadBtn');

        // Function to create HTML for a card
        function createCardHTML(index) {
            // We generate the skeleton first, and the content hidden inside.
            // The skeleton sits on top via z-index/absolute positioning.
            return `
                <div class="card" id="card-${index}">
                    <!-- Real Content (Hidden initially) -->
                    <div class="card-content">
                        <div>
                            <div class="card-header">
                                <div class="avatar" style="background-color: var(--avatar-bg)"></div>
                                <div class="meta">
                                    <span class="author">${posts[index].author}</span>
                                    <span class="date">${posts[index].date}</span>
                                </div>
                            </div>
                            <div class="card-image" style="background-color: var(--img-bg)"></div>
                            <div class="card-text">
                                <strong>${posts[index].title}</strong><br><br>
                                ${posts[index].text}
                            </div>
                        </div>
                    </div>

                    <!-- Skeleton Overlay -->
                    <div class="skeleton-overlay">
                        <div>
                            <div class="sk-header">
                                <div class="sk-circle"></div>
                                <div class="sk-lines">
                                    <div class="sk-bar sk-w-60"></div>
                                    <div class="sk-bar sk-w-40"></div>
                                </div>
                            </div>
                            <div class="sk-image"></div>
                        </div>
                        <div class="sk-text-area">
                            <div class="sk-bar sk-w-100"></div>
                            <div class="sk-bar sk-w-100"></div>
                            <div class="sk-bar sk-w-80"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function initFeed() {
            // Clear feed
            feedContainer.innerHTML = '';

            // Render Skeletons immediately
            posts.forEach((_, index) => {
                const cardHTML = createCardHTML(index);
                feedContainer.innerHTML += cardHTML;
            });

            // Simulate Fetch
            setTimeout(() => {
                revealCards();
            }, 2000);
        }

        function revealCards() {
            const cards = document.querySelectorAll('.card');
            
            cards.forEach((card, index) => {
                // Set dynamic CSS variables for colors
                card.style.setProperty('--avatar-bg', posts[index].avatarColor);
                card.style.setProperty('--img-bg', posts[index].imageColor);

                // Stagger the reveal
                setTimeout(() => {
                    // Fade out skeleton
                    const skeleton = card.querySelector('.skeleton-overlay');
                    skeleton.classList.add('hidden');

                    // Fade in content
                    card.classList.add('visible');
                }, index * 200); // 200ms delay between each card
            });
        }

        // Event Listeners
        reloadBtn.addEventListener('click', () => {
            // Add a tiny delay to allow button click visual feedback
            setTimeout(initFeed, 100);
        });

        // Initial Load
        initFeed();

    </script>
</body>
</html>
