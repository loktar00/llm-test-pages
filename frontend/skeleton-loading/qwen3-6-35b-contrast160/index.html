<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Feed Screen</title>
    <style>
        :root {
            --bg: #0f1115;
            --card-bg: #1a1d24;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --accent: #4f46e5;
            --accent-hover: #4338c7;
            --skeleton-base: #2a2e38;
            --skeleton-shine: #3d4352;
            --font-stack: -apple-system-font, -apple-system-font, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-stack);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .reload-btn {
            background: transparent;
            border: 1px solid var(--skeleton-base);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reload-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
            background: rgba(255,255,255,0.05);
        }

        .reload-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .reload-btn:hover svg {
            transform: rotate(180deg);
        }

        .feed-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- CARD STYLES --- */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0; /* Hidden initially */
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card-image-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            background-color: var(--skeleton-base);
            overflow: hidden;
            position: relative;
        }

        .card-image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .card-image-placeholder img.loaded {
            opacity: 1;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 4.5em; /* Approx 3 lines */
        }

        .card-footer {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(79, 70, 229, 0.15);
            color: #818cf8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- SKELETON STYLES --- */
        
        /* We use specific skeleton classes to match the exact grid layout of the card */
        .card.skeleton .card-image-placeholder {
            background-color: var(--skeleton-base);
        }
        
        .card.skeleton .card-content {
            gap: 15px;
        }

        .skeleton-line {
            background-color: var(--skeleton-base);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        /* The Shimmer Effect */
        .skeleton-line::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.05) 20%,
                rgba(255, 255, 255, 0.1) 60%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        /* Sizes for skeleton lines */
        .sk-circle {
            border-radius: 12px; /* Matches card-image-placeholder */
            width: 100px;
            height: 100px;
        }
        
        .sk-title {
            width: 60%;
            height: 24px;
            margin-bottom: 12px;
        }

        .sk-text {
            width: 100%;
            height: 16px;
            margin-bottom: 8px;
        }

        .sk-text.short {
            width: 40%;
        }

        .sk-tag {
            width: 60px;
            height: 20px;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                grid-template-columns: 1fr;
            }
            .card-image-placeholder {
                width: 100%;
                height: 180px;
            }
            .card-content {
                height: auto;
            }
            .sk-circle {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Feed</h1>
        <button class="reload-btn" id="reloadBtn">
            <span>Reload</span>
            <svg viewBox="0 0 24 24"><path d="M17.65 6.05c-2.48-2.48-6.5-2.48-9 0l-1.41 1.41c2.66-2.15 6.6-1.88 9.25.77 2.65 2.66 2.92 6.6.77 9.26l1.41 1.41c3.12-3.12 3.12-8.23 0-11.35zM6.35 17.95c2.48 2.48 6.5 2.48 9 0l1.41-1.41c-2.66 2.15-6.6 1.88-9.27-.77-2.66-2.66-2.92-6.6-.77-9.26l-1.41-1.41c-3.12 3.12-3.12 8.23 0 11.35z"/></svg>
        </button>
    </div>

    <div class="feed-container" id="feedContainer">
        <!-- Content injected here -->
    </div>

    <script>
        const container = document.getElementById('feedContainer');
        const reloadBtn = document.getElementById('reloadBtn');

        // Mock Data
        const items = [
            {
                title: "New Urban Architecture",
                desc: "A modernist approach to residential living spaces that emphasize natural light and structural integrity.",
                date: "12 min ago",
                tag: "Design",
                img: "https://img.freerider.com/320/240/29345" // Placeholder URL
            },
            {
                title: "Digital Art Exhibition",
                desc: "Interactive light installations mapping the history of the internet onto the city skyline.",
                date: "2 hours ago",
                tag: "Art",
                img: "https://img.freerider.com/320/240/29346"
            },
            {
                title: "Sustainable Living",
                desc: "Implementing vertical gardens and solar-integrated infrastructure in high-density districts.",
                date: "5 hours ago",
                tag: "Eco",
                img: "https://img.freerider.com/320/240/29347"
            }
        ];

        function createSkeletonCard() {
            const card = document.createElement('div');
            card.className = 'card skeleton';
            
            // Image Skeleton
            const imgSk = document.createElement('div');
            imgSk.className = 'card-image-placeholder';
            const circleSk = document.createElement('div');
            circleSk.className = 'skeleton-line sk-circle';
            imgSk.appendChild(circleSk);

            // Content Skeleton
            const content = document.createElement('div');
            content.className = 'card-content';
            
            // Title
            const titleSk = document.createElement('div');
            titleSk.className = 'skeleton-line sk-title';
            
            // Text Lines
            const text1 = document.createElement('div');
            text1.className = 'skeleton-line sk-text';
            const text2 = document.createElement('div');
            text2.className = 'skeleton-line sk-text';
            const text3 = document.createElement('div');
            text3.className = 'skeleton-line sk-text short';

            // Footer
            const footer = document.createElement('div');
            footer.className = 'card-footer';
            const tagSk = document.createElement('div');
            tagSk.className = 'skeleton-line sk-tag';

            content.appendChild(titleSk);
            content.appendChild(text1);
            content.appendChild(text2);
            content.appendChild(text3);
            content.appendChild(footer);
            footer.appendChild(tagSk);

            card.appendChild(imgSk);
            card.appendChild(content);

            return card;
        }

        function createRealCard(item, index) {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Use a unique ID for the image to handle loading state
            const imgId = `img-${index}`;

            card.innerHTML = `
                <div class="card-image-placeholder">
                    <img id="${imgId}" src="${item.img}" alt="Content" onload="this.classList.add('loaded')">
                </div>
                <div class="card-content">
                    <div class="card-meta">
                        <span class="card-date">${item.date}</span>
                    </div>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${item.desc}</p>
                    <div class="card-footer">
                        <span class="tag">${item.tag}</span>
                    </div>
                </div>
            `;
            return card;
        }

        function initFeed() {
            container.innerHTML = '';
            
            // 1. Show Skeletons
            items.forEach((_, i) => {
                const sk = createSkeletonCard();
                // Stagger skeletons slightly for visual polish
                sk.style.animationDelay = `${i * 0.1}s`; 
                container.appendChild(sk);
            });

            // 2. Fake Fetch (2 seconds)
            setTimeout(() => {
                // Clear container and build real cards
                container.innerHTML = '';
                
                items.forEach((item, i) => {
                    const realCard = createRealCard(item, i);
                    container.appendChild(realCard);

                    // 3. Animate In (Card by Card)
                    // Small delay based on index
                    setTimeout(() => {
                        realCard.classList.add('visible');
                    }, 50 + (i * 100));
                });

            }, 2000);
        }

        reloadBtn.addEventListener('click', () => {
            // Optional: Add loading state to button
            const originalText = reloadBtn.querySelector('span').innerText;
            reloadBtn.querySelector('span').innerText = "Loading...";
            reloadBtn.style.opacity = "0.7";
            
            initFeed();

            // Reset button text after a short delay
            setTimeout(() => {
                reloadBtn.querySelector('span').innerText = originalText;
                reloadBtn.style.opacity = "1";
            }, 500);
        });

        // Start
        initFeed();

    </script>
</body>
</html>
