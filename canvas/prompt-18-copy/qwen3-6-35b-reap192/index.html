<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie City Survival</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }
        .stat { margin-bottom: 5px; font-size: 18px; font-weight: bold; }
        .label { color: #888; }
        .val { color: #fff; }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #ff3333;
            text-align: center;
            display: none;
            text-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat"><span class="label">HEALTH:</span> <span id="hud-health" class="val">100%</span></div>
    <div class="stat"><span class="label">KILLS:</span> <span id="hud-kills" class="val">0</span></div>
    <div class="stat"><span class="label">CARS:</span> <span id="hud-cars" class="val">1</span></div>
</div>
<div id="message">VEHICLE DESTROYED<br><span style="font-size:20px; color:#fff">RESPAWNING...</span></div>

<canvas id="world"></canvas>

<script>
/**
 * CONFIGURATION
 */
const TILE_SIZE = 64;
const GRID_SIZE = 100; // 100x100 tiles
const CITY_SIZE = GRID_SIZE * TILE_SIZE;
const CAR_WIDTH = 24;
const CAR_HEIGHT = 40;
const ZOMBIE_SIZE = 8;
const BULLET_SPEED = 15;
const SHOOT_COOLDOWN = 8;
const MAX_ZOMBIES = 400;
const WAYPOINT_RADIUS = 100; // Distance to trigger waypoint switch

/**
 * UTILITIES
 */
const rand = (min, max) => Math.random() * (max - min) + min;
const dist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
const angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
const clamp = (val, min, max) => Math.min(Math.max(val, min), max);

/**
 * SYSTEMS
 */
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');

// Persistent damage canvas
const damageCanvas = document.createElement('canvas');
let damageCtx = damageCanvas.getContext('2d');

// UI Elements
const uiHealth = document.getElementById('hud-health');
const uiKills = document.getElementById('hud-kills');
const uiCars = document.getElementById('hud-cars');
const uiMessage = document.getElementById('message');

// Resize handling
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    damageCanvas.width = CITY_SIZE;
    damageCanvas.height = CITY_SIZE;
    initEnvironment();
}
window.addEventListener('resize', resize);

/**
 * INPUTS
 */
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

/**
 * WORLD STATE
 */
let mapData = []; // 0: Road, 1: Building
let waypoints = []; // Graph nodes
let activeWaypoints = []; // For quick lookup

let cars = [];
let zombies = [];
let bullets = [];
let particles = [];
let corpses = []; // Persistent zomb bodies
let bloodMarks = []; // Persistent blood stains

let camera = { x: 0, y: 0 };
let frameCount = 0;
let totalCarsLost = 0;

/**
 * GRID CITY GENERATION
 */
function initEnvironment() {
    damageCtx.clearRect(0, 0, CITY_SIZE, CITY_SIZE);
    mapData = [];
    waypoints = [];
    activeWaypoints = [];

    // Initialize map
    for (let y = 0; y < GRID_SIZE; y++) {
        let row = [];
        for (let x = 0; x < GRID_SIZE; x++) {
            // Create grid streets
            if (x % 5 === 0 || y % 5 === 0) {
                row.push(0); // Road
            } else {
                row.push(1); // Building
            }
        }
        mapData.push(row);
    }

    // Generate Waypoints (at intersections)
    for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
            if (mapData[y][x] === 0) {
                // Check neighbors to ensure connectivity
                let neighbors = 0;
                if (y > 0 && mapData[y-1][x] === 0) neighbors++;
                if (y < GRID_SIZE-1 && mapData[y+1][x] === 0) neighbors++;
                if (x > 0 && mapData[y][x-1] === 0) neighbors++;
                if (x < GRID_SIZE-1 && mapData[y][x+1] === 0) neighbors++;

                // Add to graph if it's a road. 
                // To reduce graph density, only add every few nodes or random subset
                if (Math.random() < 0.3) {
                    let wp = {
                        x: x * TILE_SIZE + TILE_SIZE/2,
                        y: y * TILE_SIZE + TILE_SIZE/2,
                        connections: []
                    };
                    waypoints.push(wp);
                    if (neighbors > 0) activeWaypoints.push(wp);
                }
            }
        }
    }

    // Connect Waypoints (only adjacent grid nodes)
    for (let i = 0; i < waypoints.length; i++) {
        let a = waypoints[i];
        // Check grid coords
        let gx = Math.floor(a.x / TILE_SIZE);
        let gy = Math.floor(a.y / TILE_SIZE);
        
        let neighbors = [];
        if (gy > 0 && mapData[gy-1][gx] === 0) neighbors.push({x: gx, y: gy-1});
        if (gy < GRID_SIZE-1 && mapData[gy+1][gx] === 0) neighbors.push({x: gx, y: gy+1});
        if (gx > 0 && mapData[gy][gx-1] === 0) neighbors.push({x: gx-1, y: gy});
        if (gx < GRID_SIZE-1 && mapData[gy][gx+1] === 0) neighbors.push({x: gx+1, y: gy});

        for (let n of neighbors) {
            // Find a waypoint near this neighbor
            let best = null;
            let minDst = 1000;
            for (let wp of waypoints) {
                let d = dist(wp.x, wp.y, n.x * TILE_SIZE + TILE_SIZE/2, n.y * TILE_SIZE + TILE_SIZE/2);
                if (d < minDst) {
                    minDst = d;
                    best = wp;
                }
            }
            if (best) {
                a.connections.push(best);
            }
        }
    }

    drawBaseEnvironment();
}

function drawBaseEnvironment() {
    // Draw Roads
    damageCtx.fillStyle = '#222';
    damageCtx.fillRect(0, 0, CITY_SIZE, CITY_SIZE);
    
    // Draw Roads Logic for visual detail
    damageCtx.lineWidth = TILE_SIZE - 2;
    damageCtx.strokeStyle = '#333';
    
    // Vertical Roads
    for(let x=0; x<GRID_SIZE; x++) {
        if(x%5 === 0) {
            let px = x * TILE_SIZE + TILE_SIZE/2;
            damageCtx.beginPath();
            damageCtx.moveTo(px, 0);
            damageCtx.lineTo(px, CITY_SIZE);
            damageCtx.stroke();
        }
    }
    // Horizontal Roads
    for(let y=0; y<GRID_SIZE; y++) {
        if(y%5 === 0) {
            let py = y * TILE_SIZE + TILE_SIZE/2;
            damageCtx.beginPath();
            damageCtx.moveTo(0, py);
            damageCtx.lineTo(CITY_SIZE, py);
            damageCtx.stroke();
        }
    }

    // Draw Buildings (Simplified representation)
    damageCtx.fillStyle = '#1a1a1a';
    for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
            if (mapData[y][x] === 1) {
                damageCtx.fillRect(x*TILE_SIZE, y*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                // Simple border for buildings
                damageCtx.strokeStyle = '#2a2a2a';
                damageCtx.strokeRect(x*TILE_SIZE+1, y*TILE_SIZE+1, TILE_SIZE-2, TILE_SIZE-2);
            }
        }
    }
    
    // Center map initially
    camera.x = CITY_SIZE/2;
    camera.y = CITY_SIZE/2;
}

/**
 * CLASSES
 */

class Car {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.angle = 0;
        this.health = 100;
        this.dead = false;
        this.targetWp = null;
        this.weaponCooldown = 0;
        this.mudParticles = 0;
        
        // Find first waypoint
        if (activeWaypoints.length > 0) {
            this.targetWp = activeWaypoints[Math.floor(Math.random() * activeWaypoints.length)];
        }
    }

    update() {
        if (this.dead) return;

        // 1. Waypoint Logic
        if (!this.targetWp || dist(this.x, this.y, this.targetWp.x, this.targetWp.y) < WAYPOINT_RADIUS) {
            this.pickNextWaypoint();
        }

        // 2. Physics & AI Driving
        let targetAngle = 0;
        if (this.targetWp) {
            targetAngle = angle(this.x, this.y, this.targetWp.x, this.targetWp.y);
        }

        // Steer towards target
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        
        this.angle += diff * 0.1; // Steering speed

        // Acceleration
        let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        let thrust = 0.2;
        
        // Apply thrust in facing direction
        this.vx += Math.cos(this.angle) * thrust;
        this.vy += Math.sin(this.angle) * thrust;

        // Friction
        this.vx *= 0.95;
        this.vy *= 0.95;

        // 3. Collision (World)
        let nextX = this.x + this.vx;
        let nextY = this.y + this.vy;
        
        // Check building collision (Grid based)
        let gx = Math.floor(nextX / TILE_SIZE);
        let gy = Math.floor(nextY / TILE_SIZE);

        if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
            if (mapData[gy][gx] === 1) {
                // Bounce
                this.vx *= -0.5;
                this.vy *= -0.5;
                this.x += this.vx;
                this.y += this.vy;
                this.health -= 1; // Damage self slightly on crash
                spawnParticles(this.x, this.y, 5, '#aaa'); // Sparks
            } else {
                this.x = nextX;
                this.y = nextY;
            }
        } else {
            this.x = nextX;
            this.y = nextY;
        }

        // 4. Combat (Zombies)
        this.handleCombat();

        // 5. Effects
        if (speed > 2) {
            this.mudParticles++;
            if (this.mudParticles % 3 === 0) {
                spawnParticles(this.x - Math.cos(this.angle)*20, this.y - Math.sin(this.angle)*20, 1, '#321');
            }
        }
    }

    pickNextWaypoint() {
        // Filter connections by distance or randomness to allow roaming
        let options = this.targetWp ? this.targetWp.connections.filter(w => w) : [];
        
        // If no valid connections (dead end), just pick random nearby
        if (options.length === 0) {
            options = activeWaypoints.filter(w => dist(w.x, w.y, this.x, this.y) < TILE_SIZE * 10);
        }

        if (options.length > 0) {
            // Pick closer ones mostly, but sometimes random for variety
            let idx = Math.floor(Math.random() * options.length);
            this.targetWp = options[idx];
        } else {
            // Panic respawn waypoint
            this.targetWp = activeWaypoints[Math.floor(Math.random() * activeWaypoints.length)];
        }
    }

    handleCombat() {
        // Auto Aim & Shoot
        if (this.weaponCooldown > 0) this.weaponCooldown--;

        // Find target zombie
        let target = null;
        let minDist = 600; // Range

        for (let z of zombies) {
            let d = dist(this.x, this.y, z.x, z.y);
            if (d < minDist) {
                minDist = d;
                target = z;
            }
        }

        if (target) {
            // Rotate turret (simplified: car rotates slightly faster to aim)
            let aimAngle = angle(this.x, this.y, target.x, target.y);
            this.angle += (aimAngle - this.angle) * 0.05;

            if (this.weaponCooldown <= 0) {
                this.fire();
                this.weaponCooldown = SHOOT_COOLDOWN;
            }
        }

        // Collision with Zombies (Run over)
        for (let z of zombies) {
            let d = dist(this.x, this.y, z.x, z.y);
            if (d < (CAR_WIDTH/2 + ZOMBIE_SIZE)) {
                // Impact
                z.takeDamage(50);
                this.vx *= 0.8; // Slow down
                this.vy *= 0.8;
                this.health -= 0.5;
                spawnParticles(z.x, z.y, 3, '#800'); // Blood puff
            }
        }

        if (this.health <= 0) {
            this.destroy();
        }
    }

    fire() {
        let bx = this.x + Math.cos(this.angle) * 20;
        let by = this.y + Math.sin(this.angle) * 20;
        bullets.push(new Bullet(bx, by, this.angle));
        // Muzzle flash
        spawnParticles(bx, by, 3, '#ff0');
    }

    destroy() {
        this.dead = true;
        spawnParticles(this.x, this.y, 50, '#f00');
        spawnParticles(this.x, this.y, 30, '#555'); // Smoke
        // Explosion scorch
        damageCtx.beginPath();
        damageCtx.arc(this.x, this.y, 40, 0, Math.PI*2);
        damageCtx.fillStyle = 'rgba(0,0,0,0.3)';
        damageCtx.fill();
        
        totalCarsLost++;
        uiCars.innerText = totalCarsLost;
        
        // Respawn logic handled in main loop
    }

    draw(ctx) {
        if (this.dead) return;
        
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // Body
        ctx.fillStyle = '#c44';
        ctx.fillRect(-CAR_WIDTH/2, -CAR_HEIGHT/2, CAR_WIDTH, CAR_HEIGHT);
        
        // Roof/Windshield
        ctx.fillStyle = '#333';
        ctx.fillRect(-CAR_WIDTH/2 + 2, -CAR_HEIGHT/2 + 10, CAR_WIDTH - 4, 15);
        
        // Wheels
        ctx.fillStyle = '#000';
        ctx.fillRect(-CAR_WIDTH/2 - 2, -CAR_HEIGHT/2 + 5, 4, 8);
        ctx.fillRect(CAR_WIDTH/2 - 2, -CAR_HEIGHT/2 + 5, 4, 8);
        ctx.fillRect(-CAR_WIDTH/2 - 2, CAR_HEIGHT/2 - 13, 4, 8);
        ctx.fillRect(CAR_WIDTH/2 - 2, CAR_HEIGHT/2 - 13, 4, 8);

        // Lights
        if (frameCount % 10 < 5) ctx.fillStyle = '#ff0';
        else ctx.fillStyle = '#550';
        ctx.fillRect(-CAR_WIDTH/2 + 2, -CAR_HEIGHT/2, 4, 2);
        ctx.fillRect(CAR_WIDTH/2 - 6, -CAR_HEIGHT/2, 4, 2);

        ctx.restore();
    }
}

class Zombie {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.angle = Math.random() * Math.PI * 2;
        this.health = 20;
        this.speed = rand(0.5, 1.5);
        this.state = 'wander'; // wander, chase
        this.wanderTimer = 0;
        this.color = `hsl(${rand(0, 50)}, 70%, 40%)`;
    }

    update() {
        // Zombie AI
        let car = cars.find(c => !c.dead);
        if (!car) return;

        let d = dist(this.x, this.y, car.x, car.y);

        if (d < 300) {
            this.state = 'chase';
        } else {
            this.state = 'wander';
        }

        if (this.state === 'chase') {
            let a = angle(this.x, this.y, car.x, car.y);
            this.vx = Math.cos(a) * this.speed;
            this.vy = Math.sin(a) * this.speed;
        } else {
            this.wanderTimer--;
            if (this.wanderTimer <= 0) {
                this.angle += rand(-1, 1);
                this.wanderTimer = rand(20, 60);
            }
            this.vx = Math.cos(this.angle) * (this.speed * 0.5);
            this.vy = Math.sin(this.angle) * (this.speed * 0.5);
        }

        // Collision with other zombies (swarm bodge)
        for (let z of zombies) {
            if (z === this) continue;
            let dd = dist(this.x, this.y, z.x, z.y);
            if (dd < ZOMBIE_SIZE * 2) {
                let pa = angle(z.x, z.y, this.x, this.y);
                this.vx += Math.cos(pa) * 0.1;
                this.vy += Math.sin(pa) * 0.1;
            }
        }

        // Move
        this.x += this.vx;
        this.y += this.vy;

        // Building collision (simple bounce)
        let gx = Math.floor(this.x / TILE_SIZE);
        let gy = Math.floor(this.y / TILE_SIZE);
        if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
            if (mapData[gy][gx] === 1) {
                this.x -= this.vx;
                this.y -= this.vy;
                this.angle += Math.PI; // Turn around
            }
        }
    }

    takeDamage(amt) {
        this.health -= amt;
        if (this.health <= 0) {
            this.die();
        }
    }

    die() {
        this.dead = true;
        // Drop blood
        damageCtx.beginPath();
        damageCtx.arc(this.x, this.y, 10, 0, Math.PI*2);
        damageCtx.fillStyle = '#500';
        damageCtx.fill();
        
        // Corpse
        corpses.push({x: this.x, y: this.y, angle: this.angle});
        
        // Count kill
        ui
