<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messaging Panel</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg-primary:#0f0f14;
    --bg-secondary:#1a1a24;
    --bg-tertiary:#24243a;
    --bg-hover:#2a2a42;
    --bg-active:#32325a;
    --text-primary:#e8e8f0;
    --text-secondary:#8888a8;
    --text-muted:#55556a;
    --accent:#6c5ce7;
    --accent-light:#a29bfe;
    --accent-glow:rgba(108,92,231,.25);
    --bubble-in:#2a2a42;
    --bubble-out:#6c5ce7;
    --green:#00d2a0;
    --red:#ff6b81;
    --orange:#ffa502;
    --radius:16px;
    --radius-sm:10px;
    --radius-xs:8px;
    --shadow:0 4px 24px rgba(0,0,0,.3);
    --transition:all .25s cubic-bezier(.4,0,.2,1);
  }
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-primary);color:var(--text-primary);overflow:hidden}

  .app{display:flex;height:100vh;width:100vw}

  /* ── Sidebar ── */
  .sidebar{width:360px;min-width:360px;background:var(--bg-secondary);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;position:relative;z-index:2}
  .sidebar-header{padding:24px 24px 16px;display:flex;align-items:center;justify-content:space-between}
  .sidebar-header h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .sidebar-header .new-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
  .sidebar-header .new-btn:hover{background:var(--accent-light);transform:scale(1.08)}

  .search-wrap{padding:0 24px 16px}
  .search-wrap input{width:100%;padding:10px 16px 10px 40px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.06);background:var(--bg-tertiary);color:var(--text-primary);font-size:14px;outline:none;transition:var(--transition)}
  .search-wrap input::placeholder{color:var(--text-muted)}
  .search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .search-wrap{position:relative}
  .search-wrap svg{position:absolute;left:38px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

  .contact-list{flex:1;overflow-y:auto;padding:4px 12px 20px;scrollbar-width:thin;scrollbar-color:var(--bg-tertiary) transparent}
  .contact-list::-webkit-scrollbar{width:5px}
  .contact-list::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:10px}

  .contact-item{display:flex;align-items:center;gap:14px;padding:14px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);position:relative;margin-bottom:2px}
  .contact-item:hover{background:var(--bg-hover)}
  .contact-item.active{background:var(--bg-active)}

  .avatar{position:relative;flex-shrink:0;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .presence{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg-secondary)}
  .presence.online{background:var(--green)}
  .presence.away{background:var(--orange)}
  .presence.offline{background:var(--text-muted)}

  .contact-info{flex:1;min-width:0}
  .contact-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .contact-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contact-time{font-size:11.5px;color:var(--text-muted);flex-shrink:0;margin-left:8px}
  .contact-preview{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contact-preview .typing-text{color:var(--accent-light);font-style:italic}

  .unread-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;position:absolute;right:14px;bottom:16px}

  /* ── Chat Area ── */
  .chat{flex:1;display:flex;flex-direction:column;background:var(--bg-primary);position:relative}
  .chat::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(108,92,231,.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(162,155,254,.03) 0%,transparent 50%);pointer-events:none;z-index:0}

  .chat-header{padding:18px 28px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(15,15,20,.85);backdrop-filter:blur(20px);z-index:1}
  .chat-header .avatar{width:42px;height:42px;font-size:15px}
  .chat-header .presence{border-color:rgba(15,15,20,.85)}
  .chat-header-info{flex:1}
  .chat-header-info .name{font-size:15px;font-weight:600}
  .chat-header-info .status{font-size:12px;color:var(--green);margin-top:1px}
  .chat-header-info .status.away-status{color:var(--orange)}
  .chat-header-actions{display:flex;gap:6px}
  .chat-header-actions button{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
  .chat-header-actions button:hover{background:var(--bg-hover);color:var(--text-primary)}

  /* ── Messages ── */
  .messages{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:4px;z-index:1;scrollbar-width:thin;scrollbar-color:var(--bg-tertiary) transparent}
  .messages::-webkit-scrollbar{width:5px}
  .messages::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:10px}

  .day-divider{display:flex;align-items:center;gap:16px;margin:20px 0 24px;position:relative}
  .day-divider::before,.day-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
  .day-divider span{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;padding:5px 14px;background:var(--bg-tertiary);border-radius:20px}

  .message-row{display:flex;gap:10px;max-width:70%;animation:popIn .35s cubic-bezier(.175,.885,.32,1.275) both}
  .message-row.outgoing{align-self:flex-end;flex-direction:row-reverse}
  .message-row.incoming{align-self:flex-start}

  .msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-top:auto}

  .bubble-wrap{display:flex;flex-direction:column;gap:3px}
  .bubble{padding:11px 16px;font-size:14px;line-height:1.55;word-wrap:break-word;position:relative}
  .incoming .bubble{background:var(--bubble-in);border-radius:4px var(--radius) var(--radius) var(--radius);color:var(--text-primary)}
  .outgoing .bubble{background:var(--bubble-out);border-radius:var(--radius) 4px var(--radius) var(--radius);color:#fff}

  .bubble-time{font-size:10.5px;color:var(--text-muted);padding:0 4px}
  .outgoing .bubble-time{text-align:right}
  .outgoing .bubble-time .read{color:var(--accent-light)}

  @keyframes popIn{
    0%{opacity:0;transform:scale(.85) translateY(8px)}
    100%{opacity:1;transform:scale(1) translateY(0)}
  }

  /* ── Typing Indicator ── */
  .typing-indicator{display:flex;align-items:center;gap:10px;max-width:70%;align-self:flex-start;animation:popIn .35s cubic-bezier(.175,.885,.32,1.275) both}
  .typing-indicator .msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  .typing-bubble{background:var(--bubble-in);border-radius:4px var(--radius) var(--radius) var(--radius);padding:14px 20px;display:flex;gap:5px;align-items:center}
  .typing-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);animation:typingBounce 1.4s ease-in-out infinite}
  .typing-dot:nth-child(2){animation-delay:.2s}
  .typing-dot:nth-child(3){animation-delay:.4s}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-8px);opacity:1}
  }

  /* ── Composer ── */
  .composer{padding:16px 28px 20px;border-top:1px solid rgba(255,255,255,.05);background:rgba(15,15,20,.85);backdrop-filter:blur(20px);z-index:1;display:flex;align-items:flex-end;gap:12px}
  .composer-input-wrap{flex:1;position:relative}
  .composer-input-wrap textarea{width:100%;padding:12px 18px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.06);background:var(--bg-tertiary);color:var(--text-primary);font-size:14px;font-family:inherit;resize:none;outline:none;transition:var(--transition);max-height:120px;line-height:1.5}
  .composer-input-wrap textarea::placeholder{color:var(--text-muted)}
  .composer-input-wrap textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}

  .send-btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.4,0,.2,1);flex-shrink:0;position:relative;overflow:hidden}
  .send-btn:hover{width:120px;border-radius:28px;background:var(--accent-light);transform:scale(1.02)}
  .send-btn:hover .btn-text{opacity:1;transform:translateX(0);margin-left:6px}
  .send-btn:hover svg{transform:scale(.9)}
  .send-btn:active{transform:scale(.95)}
  .send-btn svg{transition:var(--transition);flex-shrink:0}
  .btn-text{font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transform:translateX(-8px);transition:all .25s ease}

  /* ── Emoji / attachment buttons ── */
  .composer-actions{display:flex;gap:2px;padding-bottom:4px}
  .composer-actions button{width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
  .composer-actions button:hover{background:var(--bg-tertiary);color:var(--text-secondary)}

  /* ── Responsive ── */
  @media(max-width:768px){
    .sidebar{width:72px;min-width:72px}
    .sidebar-header h1,.search-wrap,.contact-info,.unread-badge{display:none}
    .sidebar-header{padding:16px 12px;justify-content:center}
    .contact-list{padding:4px 8px}
    .contact-item{justify-content:center;padding:10px 6px}
    .avatar{width:44px;height:44px}
    .presence{width:11px;height:11px;bottom:0;right:0}
    .messages{padding:16px}
    .composer{padding:12px 16px 16px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Messages</h1>
      <button class="new-btn" aria-label="New message">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="9" y1="3" x2="9" y2="15"/><line x1="3" y1="9" x2="15" y2="9"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="15" y2="15"/></svg>
      <input type="text" placeholder="Search conversations…">
    </div>
    <div class="contact-list" id="contactList"></div>
  </aside>

  <!-- Chat -->
  <main class="chat">
    <div class="chat-header">
      <div class="avatar" id="chatAvatar" style="background:linear-gradient(135deg,#6c5ce7,#a29bfe)">
        <span id="chatAvatarLetter">S</span>
        <div class="presence online" id="chatPresence"></div>
      </div>
      <div class="chat-header-info">
        <div class="name" id="chatName">Sarah Chen</div>
        <div class="status" id="chatStatus">Online</div>
      </div>
      <div class="chat-header-actions">
        <button aria-label="Voice call">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 3.5A1.5 1.5 0 013.5 2h1.5a.5.5 0 01.5.5v1.09a7.5 7.5 0 004.91 4.91H11.5a.5.5 0 01.5.5v1.5a1.5 1.5 0 01-1.5 1.5 12 12 0 01-10-10z"/></svg>
        </button>
        <button aria-label="Video call">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="3" width="10" height="10" rx="1.5"/><path d="M11 6l3.5-2v8L11 6z"/></svg>
        </button>
        <button aria-label="More">
          <svg width="16" height="16" fill="currentColor"><circle cx="8" cy="3" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg>
        </button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="composer-actions">
        <button aria-label="Attach file">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 3.5a3.5 3.5 0 00-5-0L5 9a2.5 2.5 0 003.5 3.5L14 7l.5.5"/><path d="M10 11l4 4"/></svg>
        </button>
      </div>
      <div class="composer-input-wrap">
        <textarea id="composerInput" rows="1" placeholder="Type a message…"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="9" x2="15" y2="9"/><polyline points="9 3 15 9 9 15"/></svg>
        <span class="btn-text">Send</span>
      </button>
    </div>
  </main>
</div>

<script>
const contacts = [
  { id:1, name:'Sarah Chen', initials:'SC', gradient:'linear-gradient(135deg,#6c5ce7,#a29bfe)', lastMsg:'That sounds amazing! Let\'s do it 🎉', time:'2m', unread:3, presence:'online', status:'Online' },
  { id:2, name:'Alex Rivera', initials:'AR', gradient:'linear-gradient(135deg,#00d2a0,#00b894)', lastMsg:'Sent you the files', time:'18m', unread:1, presence:'online', status:'Online' },
  { id:3, name:'Jordan Lee', initials:'JL', gradient:'linear-gradient(135deg,#ff6b81,#ee5a24)', lastMsg:'Are we still on for dinner?', time:'1h', unread:0, presence:'away', status:'Away' },
  { id:4, name:'Maya Patel', initials:'MP', gradient:'linear-gradient(135deg,#ffa502,#ff6348)', lastMsg:'typing…', time:'1h', unread:0, presence:'online', status:'typing…', isTyping:true },
  { id:5, name:'Chris Wong', initials:'CW', gradient:'linear-gradient(135deg,#70a1ff,#2e86de)', lastMsg:'Haha that\'s hilarious 😂', time:'3h', unread:0, presence:'offline', status:'Last seen 3h ago' },
  { id:6, name:'Emma Davis', initials:'ED', gradient:'linear-gradient(135deg,#ff9ff3,#f368e0)', lastMsg:'Thanks for the recommendation!', time:'5h', unread:0, presence:'offline', status:'Last seen 5h ago' },
  { id:7, name:'Liam Foster', initials:'LF', gradient:'linear-gradient(135deg,#48dbfb,#0abde3)', lastMsg:'See you tomorrow!', time:'Yesterday', unread:0, presence:'away', status:'Away' },
  { id:8, name:'Nina Brooks', initials:'NB', gradient:'linear-gradient(135deg,#c8d6e5,#8395a7)', lastMsg:'Meeting rescheduled to 3pm', time:'Yesterday', unread:0, presence:'offline', status:'Last seen yesterday' },
];

const conversations = {
  1: [
    { divider:'Today' },
    { from:'them', text:'Hey! Did you see the new design mockups?', time:'2:30 PM' },
    { from:'me', text:'Yes! I just reviewed them. They look incredible 🙌', time:'2:32 PM', read:true },
    { from:'them', text:'Right?? The team did an amazing job with the color palette', time:'2:33 PM' },
    { from:'me', text:'The gradient system is especially nice. Much more cohesive than before', time:'2:35 PM', read:true },
    { from:'them', text:'Totally agree. I think we should also update the typography scale to match', time:'2:36 PM' },
    { divider:'Yesterday' },
    { from:'me', text:'Hey Sarah, how\'s the project going?', time:'4:15 PM', read:true },
    { from:'them', text:'Going great! We just finished the wireframes', time:'4:22 PM' },
    { from:'them', text:'I\'ll share the Figma link with you tonight', time:'4:22 PM' },
  ],
  2: [
    { divider:'Today' },
    { from:'them', text:'Hey, I\'ve uploaded the quarterly reports to the shared drive', time:'10:14 AM' },
    { from:'me', text:'Perfect, I\'ll review them this afternoon', time:'10:30 AM', read:true },
    { from:'them', text:'Sent you the files', time:'10:32 AM' },
  ],
  3: [
    { divider:'Today' },
    { from:'them', text:'Are we still on for dinner?', time:'1:00 PM' },
    { from:'me', text:'Absolutely! 7pm at the usual place?', time:'1:15 PM', read:false },
    { from:'them', text:'Perfect, see you there! 🍝', time:'1:16 PM' },
  ],
  4: [
    { divider:'Today' },
    { from:'me', text:'Have you tried that new coffee shop on 5th street?', time:'11:00 AM', read:true },
    { from:'them', text:'Not yet! Is it any good?', time:'11:20 AM' },
    { from:'me', text:'Best latte I\'ve had in ages. You should definitely check it out', time:'11:22 AM', read:true },
  ],
  5: [
    { divider:'Today' },
    { from:'them', text:'Did you watch the game last night?', time:'8:00 PM' },
    { from:'me', text:'Yes! What an insane finish 🔥', time:'8:15 PM', read:true },
    { from:'them', text:'That last-minute goal was unreal', time:'8:16 PM' },
    { from:'me', text:'Haha that\'s hilarious 😂', time:'8:18 PM', read:true },
  ],
  6: [
    { divider:'Today' },
    { from:'them', text:'Just finished reading that book you recommended', time:'3:00 PM' },
    { from:'me', text:'What did you think?', time:'3:05 PM', read:true },
    { from:'them', text:'Thanks for the recommendation!', time:'3:10 PM' },
  ],
  7: [
    { divider:'Yesterday' },
    { from:'me', text:'Hey, can we reschedule our meeting?', time:'5:00 PM', read:true },
    { from:'them', text:'Sure, how about tomorrow at the same time?', time:'5:10 PM' },
    { from:'me', text:'Works for me. See you tomorrow!', time:'5:12 PM', read:true },
  ],
  8: [
    { divider:'Yesterday' },
    { from:'them', text:'Meeting rescheduled to 3pm', time:'2:00 PM' },
    { from:'me', text:'Got it, thanks for the update', time:'2:05 PM', read:true },
  ],
};

let activeContact = 1;

function renderContactList() {
  const list = document.getElementById('contactList');
  list.innerHTML = contacts.map(c => `
    <div class="contact-item ${c.id === activeContact ? 'active' : ''}" data-id="${c.id}">
      <div class="avatar" style="background:${c.gradient}">
        <span>${c.initials}</span>
        <div class="presence ${c.presence}"></div>
      </div>
      <div class="contact-info">
        <div class="contact-top">
          <span class="contact-name">${c.name}</span>
          <span class="contact-time">${c.time}</span>
        </div>
        <div class="contact-preview">${c.isTyping ? '<span class="typing-text">typing…</span>' : c.lastMsg}</div>
      </div>
      ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
    </div>
  `).join('');

  list.querySelectorAll('.contact-item').forEach(el => {
    el.addEventListener('click', () => {
      activeContact = parseInt(el.dataset.id);
      renderContactList();
      renderChat();
    });
  });
}

function renderChat() {
  const contact = contacts.find(c => c.id === activeContact);
  const msgs = conversations[activeContact] || [];

  document.getElementById('chatAvatar').style.background = contact.gradient;
  document.getElementById('chatAvatarLetter').textContent = contact.initials;
  document.getElementById('chatName').textContent = contact.name;
  const statusEl = document.getElementById('chatStatus');
  statusEl.textContent = contact.status;
  statusEl.className = 'status' + (contact.presence === 'away' ? ' away-status' : '');
  document.getElementById('chatPresence').className = 'presence ' + contact.presence;

  const container = document.getElementById('messages');
  let html = '';
  msgs.forEach((m, i) => {
    if (m.divider) {
      html += `<div class="day-divider"><span>${m.divider}</span></div>`;
      return;
    }
    const isIncoming = m.from === 'them';
    html += `
      <div class="message-row ${isIncoming ? 'incoming' : 'outgoing'}" style="animation-delay:${i * .04}s">
        ${isIncoming ? `<div class="msg-avatar" style="background:${contact.gradient}">${contact.initials}</div>` : ''}
        <div class="bubble-wrap">
          <div class="bubble">${m.text}</div>
          <div class="bubble-time">${m.time}${m.read ? ' <span class="read">✓✓</span>' : ''}</div>
        </div>
      </div>`;
  });

  // Typing indicator
  html += `
    <div class="typing-indicator" style="animation-delay:${msgs.length * .04}s">
      <div class="msg-avatar" style="background:${contact.gradient}">${contact.initials}</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// Auto-resize textarea
const textarea = document.getElementById('composerInput');
textarea.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Send message
document.getElementById('sendBtn').addEventListener('click', sendMessage);
textarea.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = textarea.value.trim();
  if (!text) return;

  const msgs = conversations[activeContact];
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });

  msgs.push({ from:'me', text, time, read:false });
  textarea.value = '';

}
