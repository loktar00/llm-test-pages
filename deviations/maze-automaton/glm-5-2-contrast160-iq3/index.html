<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mazectric · Cellular Maze Solving</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;cursor:crosshair}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;left:12px;bottom:12px;font:11px/14 'Courier New',monospace;color:rgba(150,210,255,.55);pointer-events:none;letter-spacing:.5px}
  #hud b{color:rgba(180,230,255,.85);font-weight:600}
  #hud i{color:rgba(255,180,120,.8);font-style:normal}
  #brand{position:fixed;right:12px;top:12px;font:700 10px/14 'Courier New',monospace;color:rgba(120,150,200,.30);letter-spacing:2px;text-transform:uppercase;pointer-events:none;text-align:right}
  #brand div:first-child{color:rgba(180,210,255,.5)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="line1">seed <b id="seed">0</b> · frame <b id="frm">0</b></div>
  <div id="line2">cells <i id="cells">0</i> · ants <i id="ants">0</i></div>
  <div id="line3">phase <i id="phase">seeding</i> · reseeds <i id="res">0</i></div>
</div>
<div id="brand"><div>mazectric</div><div>cellular · solver</div></div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const W = 6, S = 7;
let COLS, ROWS, PW, PH;
let grid, trail, ph, phNext, phBlur, ants, seeds;
let frame = 0, reseeds = 0;
let seedNum = 12345;
const seedEl = document.getElementById('seed');
const frmEl = document.getElementById('frm');
const cellsEl = document.getElementById('cells');
const antsEl = document.getElementById('ants');
const phaseEl = document.getElementById('phase');
const resEl = document.getElementById('res');

const rand = new (function(){
  let s = 12345;
  this.next = function(){ s = (s*16650123 + 12*34) >>> 0; return (s >>> 8) / 0x10000000; };
  this.set = function(v){ s = v|0 || 1; };
  this.nextRange = function(n){ return Math.floor(this.next() * n); };
})();

function resize(){
  const w = Math.max(80, Math.floor(window.innerWidth));
  const h = Math.max(80, Math.floor(window.innerHeight));
  COLS = Math.floor(w / W);
  ROWS = Math.floor(h / W);
  PW = COLS * W;
  PH = ROWS * W;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(PW * dpr);
  canvas.height = Math.floor(PH * dpr);
  canvas.style.width = String(PW) + 'px';
  canvas.style.height = String(PH) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  initGrid();
}

function initGrid(){
  const n = COLS * ROWS;
  grid = new Uint8Array(n);
  trail = new Uint8Array(n);
  ph = new Float32Array(n);
  phNext = new Float32Array(n);
  phBlur = new Float32Array(n);
  ants = [];
  seeds = [];
  for (let i = 0; i < n; i++) grid[i] = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, PW, PH);
}

function idx(x, y){ return y * COLS + x; }

function seedAt(sx, sy, r){
  const n = rand.next();
  seeds.push({ cx: sx, cy: sy, r: r, phase: 0, age: 0, wait: 8 + (n & 15),
              cells: 0, color: [200 + Math.floor(rand.next()*40), 220 + Math.floor(rand.next()*30), 255 - Math.floor(rand.next()*40)] });
}

function seedRegion(sx, sy, halfSize){
  for (let i = 0; i < halfSize; i++){
    const ax = sx + Math.floor(rand.next() * 3) - 1;
    const ay = sy + Math.floor(rand.next() * 3) - 1;
    if (ax >= 1 && ay >= 1 && ax < COLS-1 && ay < ROWS-1) grid[idx(ax, ay)] = 0;
  }
}

function seedInitial(){
  const regionsX = Math.max(2, Math.floor(COLS / 40));
  const regionsY = Math.max(2, Math.floor(ROWS / 40));
  const rx = Math.floor(COLS / regionsX);
  const ry = Math.floor(ROWS / regionsY);
  for (let i = 0; i < regionsX; i++){
    for (let j = 0; j < regionsY; j++){
      const cx = Math.floor((i + 0.5 + rand.next()*0.6 - 0.3) * rx);
      const cy = Math.floor((j + 0.5 + rand.next()*0.6 - 0.3) * ry);
      const halfSize = 1 + Math.floor(rand.next() * 4);
      seedRegion(cx, cy, halfSize);
      seedAt(cx, cy, 20 + Math.floor(rand.next() * 30));
    }
  }
}

// Cellular rule: walls with exactly 2 wall-neighbors become corridor
function caStep(){
  let changed = 0;
  for (let y = 1; y < ROWS - 1; y++){
    const off = y * COLS;
    for (let x = 1; x < COLS - 1; x++){
      const i = off + x;
      if (grid[i] === 0) continue;
      // 8-neighbour count of walls
      const n = grid[i - COLS - 1] + grid[i - COLS] + grid[i - COLS + 1] +
                  grid[i - 1] + grid[i + 1] +
                  grid[i + COLS - 1] + grid[i + COLS] + grid[i + COLS + 1];
      if (n === 2){
        grid[i] = 0; trail[i] = 0;
        changed++;
      }
    }
  }
  return changed;
}

function seedCells(s){
  const n = Math.floor(2 + rand.next() * 3.99);
  for (let i = 0; i < n; i++){
    const ax = s.cx + Math.floor(rand.next() * 3) - 1;
    const ay = s.cy + Math.floor(rand.next() * 3) - 1;
    if (ax >= 1 && ay >= 1 && ax < COLS-1 && ay < ROWS-1){
      const idx_ = idx(ax, ay);
      if (grid[idx_] === 1){
        grid[idx_] = 0; trail[idx_] = 0;
        s.cells++;
      }
    }
  }
}

function spawnAnts(s){
  const baseX = 1 + Math.floor(s.cx / 30) * 30;
  const baseY = 1 + Math.floor(s.cy / 30) * 30;
  const num = 1 + Math.floor(rand.next() * 2);
  for (let k = 0; k < num; k++){
    ants.push({
      x: s.cx, y: s.cy, tx: s.cx, ty: s.cy,
      anim: 0,
      baseX: baseX, baseY: baseY,
      life: 600 + Math.floor(rand.next() * 400),
      cr: s.color[0], cg: s.color[1], cb: s.color[2],
      phase: 'spawn', lastCell: -1,
    });
  }
  s.phase = 1;
  s.spawned = true;
}

function findFarCell(s){
  const baseX = 1 + Math.floor(s.cx / 30) * 30;
  const baseY = 1 + Math.floor(s.cy / 30) * 30;
  for (let tries = 0; tries < 10; tries++){
    const x = baseX + Math.floor(rand.next() * 30);
    const y = baseY + Math.floor(rand.next() * 30);
    const i = y * COLS + x;
    if (grid[i] === 0 && trail[i] === 0){
      trail[i] = 2;
      return i;
    }
  }
  return -1;
}

function antsPathfind(){
  for (let ai = ants.length - 1; ai >= 0; ai--){
    const a = ants[ai];
    if (a.phase === 'spawn'){
      const si = findFarCell(a);
      if (si >= 0){
        a.tx = si % COLS;
        a.ty = (si / COLS) | 0;
        a.phase = 'move';
      } else { a.phase = 'dead'; }
      continue;
    }
    if (a.phase === 'wait'){
      a.phase = 'spawn'; continue;
    }
    const i = a.y * COLS + a.x;
    if (a.phase === 'move'){
      const di = a.ty * COLS + a.tx;
      if (grid[di] === 1){
        a.phase = 'spawn'; continue;
      }
      if (trail[di] === 1) trail[di] = 2;
      ph[i] = Math.min(1.5, ph[i] + 1.0);
      const dx0 = Math.abs(a.tx - a.x);
      const dy0 = Math.abs(a.ty - a.y);
      a.anim = 1;
      a.x = a.tx; a.y = a.ty;
      if (dx0 === 2) { a.anim = 2; }
      const dx = Math.abs(a.tx - a.x);
      const dy = Math.abs(a.ty - a.y);
      if (dx + dy === 1) {
        a.phase = 'wait';
      } else {
        const ni = findFarCell(a);
        if (ni >= 0){
          a.tx = ni % COLS;
          a.ty = (ni / COLS) | 0;
          a.phase = 'move';
        } else { a.phase = 'dead'; }
      }
      a.life--;
      if (a.life <= 0) a.phase = 'dead';
    }
    if (a.phase === 'dead'){
      ants.splice(ai, 1);
    }
  }
}

function phStep(){
  // ph -> phNext (1.0 decays to .5, 1.5 stays
  phNext.set(ph);
  const d = 0.95;
  for (let i = 0; i < ph.length; i++){
    const p = ph[i];
    if (p <= 0) continue;
    if (p >= 1.5) phNext[i] = 1.5;
    else if (p >= 1.0) {
      if (Math.random() < 0.25) phNext[i] = p * d;
      else phNext[i] = 1.5;
    } else if (p >= 0.05) {
      if (Math.random() < 0.15) phNext[i] = 0;
      else phNext[i] = p * d;
    } else if (p < 0.05) {
      if (Math.random() < 0.25) phNext[i] = 0;
      else phNext[i] = p;
    }
  }
  // diffuse into open corridor cells
  for (let y = 1; y < ROWS - 1; y++){
    const off = y * COLS;
    for (let x = 1; x < COLS - 1; x++){
      const i = off + x;
      if (grid[i] === 1) continue;
      phBlur[i] = (0.5 * (p + ph[i - COLS - 1] + ph[i - COLS] + ph[i - COLS + 1] +
            ph[i - 1] + ph[i + 1] +
            ph[i + COLS - 1] + ph[i + COLS] + ph[i + COLS + 1]));
    }
  }
  // commit
    // ph[i] = max(p, phBlur[i] * 0.9);
  const t = ph; ph = phNext; phNext = t;
  // apply blur as additive boost
  for (let i = 0; i < ph.length; i++){
    if (phBlur[i] > 0.01 && phBlur[i] > ph[i] * 0.9){
      ph[i] = Math.min(1.5, Math.max(ph[i], phBlur[i] * 0.9));
    }
    }
  phBlur.fill(0);
}

function reseed(){
  reseeds++;
  seedNum = (Math.immod(seedNum * 7, 0) >>> 0) || seedNum + 7;
  const regionsX = Math.max(2, Math.floor(COLS / 40));
  const regionsY = Math.max(2, Math.floor(ROWS / 40));
  const rx = Math.floor(COLS / regionsX);
  const ry = Math.floor(ROWS / regionsY);
  for (let i = 0; i < regionsX; i++){
    for (let j = 0; j < regionsY; j++){
      if (rand.next() < 0.6){
        const cx = Math.floor((i + 0.5 + rand.next()*0.6 - 0.3) * rx);
        const cy = Math.floor((j + 0.5 + rand.next()*0.6 - 0.3) * ry);
        const halfSize = 1 + Math.floor(rand.next() * 3);
        seedRegion(cx, cy, halfSize);
        if (seeds.length < 16) seedAt(cx, cy, 20 + Math.floor(rand.next() * 25));
      }
    }
  }
}

function stepSeeds(){
  for (let si = seeds.length - 1; si >= 0; si--){
    const s = seeds[si];
    s.age++;
    if (s.wait > 0){ s.wait--; continue; }
    if (s.phase === 0){
      const changed = caStep();
      if (changed === 0) {
        s.phase = 2;
        spawnAnts(s);
      } else if (s.age > s.r) {
        s.phase = 2;
        spawnAnts(s);
      }
    } else if (s.phase === 1){
      seedCells(s);
      if (s.cells > s.r) s.phase = 2;
    }
    if (s.age > 1000 && s.phase < 3) {
      spawnAnts(s);
      seeds.splice(si, 1);
    }
    // remove dead seeds
  }
  for (let i = seeds.length - 1; i >= 0; i--){
    if (seeds[i].phase >= 2 && seeds[i].age > 1000) seeds.splice(i, 1);
  }
}

function drawMaze(){
  ctx.fillStyle = '#05080d';
  ctx.fillRect(0, 0, PW, PH);
  const len = grid.length;
  const img = ctx.createImageData(W, W);
  const d = img.data;
  for (let i = 0; i < W * W; i++) d[i * 4 + 3] = 255;
  for (let i = 0; i < len; i++){
    const v = grid[i];
    if (v === 1) continue; // wall stays dark
    d[0] = 8; d[1] = 12; d[2] = 18;
    ctx.putImageData(img, (i % COLS) * W, Math.floor(i / COLS) * W);
  }
}

function drawAnts(){
  ctx.globalCompositeOperation = 'lighter';
  const r = 2.8;
  const inner = 3;
  const outer = 6;
  ctx.shadowBlur = 9;
  for (let ai = 0; ai < ants.length; ai++){
    const a = ants[ai];
    const x = (a.x + 0.5) * W;
    const y = (a.y + 0.5) * W;
    ctx.shadowColor = 'rgba(' + a.cr + ',' + a.cg + ',' + (a.cb + 128) + ',1)';
    ctx.fillStyle = 'rgba(' + a.cr + ',' + a.cg + ',' + a.cb + ',1)';
    ctx.fillRect(x - inner, y - inner, inner * 2, inner * 2);
    ctx.fillStyle = 'rgba(' + a.cr + ',' + a.cg + ',' + a.cb + ',0.3)';
    ctx.fillRect(x - outer, y - outer, outer * 2, outer * 2);
    ctx.shadowBlur = 0;
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawSeeds(){
  ctx.globalCompositeOperation = 'lighter';
  for (let si = 0; si < seeds.length; si++){
    const s = seeds[si];
    if (s.phase !== 0) continue;
    const x = (s.cx + 0.5) * W;
    const y = (s.cy + 0.5) * W;
    ctx.fillStyle = 'rgba(' + s.color[0] + ',' + s.color[1] + ',' + s.color[2] + ',0.05)';
    ctx.fillRect(x - 7, y - 7, 14, 14);
    ctx.fillStyle = 'rgba(' + s.color[0] + ',' + s.color[1] + ',' + s.color[2] + ',0.2)';
    ctx.fillRect(x - 3, y - 3, 6, 6);
    ctx.fillStyle = 'rgba(' + (s.color[0] + 40) + ',' + (s.color[1] + 40) + ',' + (s.color[2] + 40) + ',0.9)';
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function step(){
  stepSeeds();
  antsPathfind();
  phStep();
  if (frame % 200 === 0 && reseeds > 0) reseed();
  if (frame === 120) reseed();
  frame++;
  drawMaze();
  drawAnts();
  drawSeeds();
  // HUD update (throttled
  if (frame % 10 === 0){
    let open = 0;
    for (let i = 0; i < grid.length; i++) if (grid[i] === 0) open++;
    cellsEl.textContent = open;
    antsEl.textContent = ants.length;
    phaseEl.textContent = reseeds === 0 ? 'seeding' : 'growing';
    resEl.textContent = reseeds;
    frmEl.textContent = frame;
  }
}

window.addEventListener('resize', resize);
seedEl.textContent = seedNum;
resize();
seedInitial();
let lastT = 0;
function loop(t){
  if (t - lastT > 16){
    step();
    lastT = t;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
