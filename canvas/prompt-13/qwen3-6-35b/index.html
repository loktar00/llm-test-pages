<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Jellyfish</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-family: sans-serif;
        }
        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            transition: background 0.3s;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="controls">
        <button id="regenBtn">Regenerate</button>
    </div>

    <script>
        // --- Setup ---
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        
        let width, height;
        
        // Handle resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            drawScene();
        }
        
        window.addEventListener('resize', resize);

        // --- Helper Functions ---

        /**
         * Generates a 1D array of values using the midpoint displacement algorithm.
         * @param {number} power - The number of points (2^power).
         * @param {number} displacement - The initial magnitude of displacement.
         * @returns {number[]} Array of y-offsets.
         */
        function midpointDisplacement(power, displacement) {
            const points = [];
            // Initialize boundaries
            points[0] = 0; 
            points[power] = 0;

            for (let i = 1; i < power; i *= 2) {
                for (let j = (power / i) / 2; j < power; j += power / i) {
                    points[j] = (points[j - (power / i) / 2] + points[j + (power / i) / 2]) / 2 + (Math.random() * -displacement + displacement);
                }
                displacement *= 0.6;
            }
            return points;
        }

        /**
         * Smooths the point array by averaging neighboring values multiple times.
         * @param {number[]} points - The array of values.
         * @param {number} passes - Number of smoothing iterations.
         * @returns {number[]} The smoothed array.
         */
        function smoothPoints(points, passes) {
            let newPoints = [...points];
            for (let p = 0; p < passes; p++) {
                for (let i = 1; i < newPoints.length - 1; i++) {
                    newPoints[i] = (newPoints[i-1] + newPoints[i] + newPoints[i+1]) / 3;
                }
            }
            return newPoints;
        }

        /**
         * Draws the underwater background using a vertical linear gradient.
         */
        function drawBackground(ctx, w, h) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#0a1128"); // Deep navy
            grad.addColorStop(0.4, "#162a47");
            grad.addColorStop(1, "#030612"); // Very dark blue/black
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            
            // Add some subtle "dust" particles
            ctx.fillStyle = "rgba(255,255,255,0.1)";
            for(let i=0; i<50; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const r = Math.random() * 1.5;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
            }
        }

        /**
         * Draws a soft, colored glow behind the jellyfish.
         */
        function drawGlow(ctx, cx, cy, width, height) {
            const grad = ctx.createRadialGradient(cx, cy - 100, 10, cx, cy - 100, Math.max(width, height) * 0.6);
            grad.addColorStop(0, "rgba(100, 200, 255, 0.25)");
            grad.addColorStop(0.5, "rgba(50, 100, 200, 0.1)");
            grad.addColorStop(1, "rgba(0, 0, 0, 0)");

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy - 100, Math.max(width, height) * 0.7, 0, Math.PI * 2);
            ctx.fill();
        }

        /**
         * Draws the main translucent dome of the jellyfish using noisy arcs.
         */
        function drawJellyfishBell(ctx, cx, cy, width, height) {
            // Generate noise for organic edge
            const noisePoints = midpointDisplacement(10, 20);
            const smoothNoise = smoothPoints(noisePoints, 2);
            
            // Scale noise to bell width
            const halfW = width / 2;
            const noiseScale = halfW / (smoothNoise.length - 1);

            ctx.save();
            ctx.translate(cx, cy);

            // 1. Create the bell shape path
            ctx.beginPath();
            
            // Start at top center, move to left edge
            ctx.moveTo(0, -height);
            
            // Draw top arc with noise
            for (let i = 0; i < smoothNoise.length; i++) {
                const x = (i * noiseScale) - halfW;
                // Base arc shape: sin curve
                const t = i / (smoothNoise.length - 1); // 0 to 1
                const baseY = Math.sin(t * Math.PI) * height;
                
                // Add noise
                const yOffset = smoothNoise[i];
                
                // Add a slight flattening to the top for realism
                const finalY = baseY - yOffset;
                
                ctx.lineTo(x, finalY);
            }
            
            // Close the loop to the right edge
            ctx.lineTo(halfW, 0);
            
            // Draw the lower lip (underside) - slightly curved inward
            ctx.quadraticCurveTo(0, height * 0.2, -halfW, 0);
            
            ctx.closePath();

            // 2. Fill with translucent radial gradient
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, halfW);
            grad.addColorStop(0, "rgba(255, 255, 255, 0.6)");
            grad.addColorStop(0.6, "rgba(200, 220, 255, 0.3)");
            grad.addColorStop(1, "rgba(100, 150, 200, 0.1)");
            
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 3. Stroke the edge for definition
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 4. Draw Inner Ribs
            drawInnerRibs(ctx, 0, 0, width, height);

            ctx.restore();
        }

        /**
         * Draws subtle curved fold lines inside the bell.
         */
        function drawInnerRibs(ctx, cx, cy, width, height) {
            const halfW = width / 2;
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 1.5;
            
            // Draw vertical-ish curves
            for(let i = -4; i <= 4; i++) {
                ctx.beginPath();
                // Start at top
                const startX = (i * (halfW / 5));
                ctx.moveTo(startX, -height);
                
                // End at bottom lip
                const endX = (i * (halfW / 3));
                const cpX = (i * (halfW / 1.5)); // Control point bulge
                
                ctx.quadraticCurveTo(cpX, -height * 0.4, endX, height * 0.1);
                ctx.stroke();
            }
            
            // Draw horizontal rings (folds)
            for(let j = 1; j <= 4; j++) {
                ctx.beginPath();
                const t = j / 5;
                const y = -height + (height * 0.2) * t;
                // Width of ring narrows as we go down
                const ringW = halfW * (1 - (t * 0.6)); 
                
                ctx.moveTo(-ringW, y);
                ctx.quadraticCurveTo(0, y + 10, ringW, y);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        /**
         * Draws the soft underside hanging below the bell.
         */
        function drawUnderside(ctx, cx, cy, width, height) {
            const halfW = width / 2;
            
            ctx.save();
            ctx.translate(cx, cy);
            
            // Create a path for the skirt
            ctx.beginPath();
            ctx.moveTo(-halfW, 0);
            // Left lip
            ctx.quadraticCurveTo(-halfW * 0.5, height * 0.15, 0, height * 0.12);
            // Right lip
            ctx.quadraticCurveTo(halfW * 0.5, height * 0.15, halfW, 0);
            ctx.closePath();
            
            // Fill with slightly darker/more opaque gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height * 0.15);
            grad.addColorStop(0, "rgba(100, 150, 200, 0.2)");
            grad.addColorStop(1, "rgba(50, 80, 120, 0.5)");
            
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.restore();
        }

        /**
         * Draws a single flowing tentacle.
         */
        function drawTentacle(ctx, startX, startY, length, sway, thickness) {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            const segments = 10;
            const stepY = length / segments;
            
            for(let i = 1; i <= segments; i++) {
                // Calculate wobble using sine
                const wobble = Math.sin(i * sway + (Math.random() * 0.5)) * (i * 1.5);
                const x = startX + wobble;
                const y = startY + (i * stepY);
                
                ctx.lineTo(x, y);
            }
            
            ctx.strokeStyle = "rgba(200, 230, 255, 0.4)";
            ctx.lineWidth = thickness;
            ctx.lineCap = "round";
            ctx.stroke();
        }

        /**
         * Draws multiple tentacles underneath the jellyfish.
         */
        function drawTentacles(ctx, cx, cy, width, height) {
            const numTentacles = 12;
            const halfW = width / 2;
            const spread = width * 0.8; // Spread range
            
            for(let i = 0; i < numTentacles; i++) {
                // Position start point along the bottom curve
                const t = (i + 0.5) / numTentacles; // 0.08 to 0.92
                const startX = cx + ((t - 0.5) * spread);
                const startY = cy + height * 0.1; // Slightly below center
                
                // Randomize properties
                const length = height * (0.8 + Math.random() * 0.4); // Length variation
                const sway = 3 + Math.random() * 4; // Frequency of wobble
                const thickness = 1 + Math.random() * 2; // Thickness variation
                
                drawTentacle(ctx, startX, startY, length, sway, thickness);
            }
        }

        /**
         * Main function to orchestrate drawing the scene.
         */
        function drawScene() {
            // 1. Clear and Draw Background
            ctx.clearRect(0, 0, width, height);
            drawBackground(ctx, width, height);
            
            // 2. Draw Glow
            drawGlow(ctx, width / 2, height / 2, width, height);
            
            // 3. Define Jellyfish Dimensions
            const cx = width / 2;
            const cy = height / 2;
            const jw = Math.min(width * 0.6, 400); // Bell width
            const jh = Math.min(height * 0.5, 300); // Bell height
            
            // 4. Draw Jellyfish Parts
            // Order matters for layering
            drawJellyfishBell(ctx, cx, cy, jw, jh);
            drawUnderside(ctx, cx, cy, jw, jh);
            drawTentacles(ctx, cx, cy, jw, jh);
        }

        // --- Initialization ---
        
        // Initial draw
        resize();

        // Regenerate Button
        document.getElementById("regenBtn").addEventListener("click", () => {
            // Small fade effect could go here, but direct redraw is cleaner for code golf simplicity
            drawScene();
        });

    </script>
</body>
</html>
