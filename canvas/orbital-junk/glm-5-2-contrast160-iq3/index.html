  ctx.fillStyle='rgb(255,180,90)';
  ctx.beginPath();
  ctx.arc(this.x,this.y,3,0,Math.PI*2);
  ctx.fill();
  // Direction indicator
  if(this.target && !this.target.dead){
    ctx.strokeStyle='rgba(255,180,90,0.4)';
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.target.x,this.target.y);
    ctx.stroke();
  }
};

// Spark
function Spark(x,y){
  this.x=x;this.y=y;
  const a=Math.random()*Math.PI*2;
  const sp=20+Math.random()*40;
  this.vx=Math.cos(a)*sp;
  this.vy=Math.sin(a)*sp;
  this.life=1;
}
Spark.prototype.update=function(dt){
  this.x+=this.vx*dt;
  this.y+=this.vy*dt;
  this.vx*=Math.pow(0.5,dt);
  this.vy*=Math.pow(0.5,dt);
  this.life-=dt*0.6;
};
Spark.prototype.draw=function(){
  if(this.life<0)return;
  ctx.fillStyle=`rgba(255,200,140,${this.life})`;
  ctx.fillRect(this.x,this.y,1,1);
};

// Collision
function triggerCollision(){
  const orbit=orbits[Math.floor(Math.random()*orbits.length)];
  if(!orbit.satellites || orbit.satellites.length<2)return;
  // Pick two satellites
  const i=Math.floor(Math.random()*orbit.satellites.length);
  let j=Math.floor(Math.random()*orbit.satellites.length);
  if(j===i)j=(j+1)%orbit.satellites.length;
  const s1=orbit.satellites[i];
  const s2=orbit.satellites[j];
  if(!s1||!s2)return;
  const phase=(s1.phase+s2.phase)/2;
  const p=positionOnOrit(orbit,phase);
  // Earth flash
  earth.flash=1;
  // Burst fragments
  const count=10+Math.floor(Math.random()*15);
  for(let k=0;k<count;k++){
    const a=Math.random()*Math.PI*2;
    const sp=1+Math.random()*2;
    const dVx=Math.cos(a)*sp;
    const dVy=Math.sin(a)*sp;
    const f=new Fragment(orbit,phase+Math.random()*0.02-0.01,0,0,dVx,dVy);
    orbit.fragments.push(f);
  }
  // Perturb the parent orbit
  orbit.perturbPhase=(Math.random()*2-1)*0.5;
  orbit.perturbTilt=(Math.random()*2-1)*0.05;
  // Remove satellites
  s1.dead=true;
  s2.dead=true;
  // Remove from list
  orbit.satellites=orbit.satellites.filter(s=>!s.dead);
  // Add sparks
  for(let i=0;i<20;i++)sparks.push(new Spark(p[0],p[1]));
  // Replenish satellites after some time?
  // We'll replenish via timer below.
  setTimeout(()=>{replenishSatellites(orbit);},8000);
}
function replplenishSatellites(orbit){
  // If orbit has no satellites, add some
  if(orbit.satellites.length<3){
    const need=4-Mr orbit.satellites.length;
    for(let i=0;i<need;i++){
      orbit.satellites.push(new Satellite(orbit,Math.random()*Math.PI*2));
    }
  }
}

// Earth drawing
function drawEarth(){
  const e=earth;
  // Glow
  const grad=ctx.createRadialGradient(e.cx,e.cy,0,e.cx,e.cy,50);
  grad.addColorStop(0,'rgba(20,40,60,0.7)');
  grad.addColorStop(1,'rgba(20,40,60,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(e.cx-60,e.cy-60,120,120);
  // Earth body
  ctx.fillStyle='rgba(8,25,40,1)';
  ctx.beginPath();
  ctx.arc(e.cx,e.cy,30,0,Math.PI*2);
  ctx.fill();
  // Outline
  ctx.strokeStyle=`rgba(60,90,120,${0.5+e.flash*0.5})`;
  ctx.lineWidth=2;
  ctx.stroke();
  // Atmosphere
  ctx.strokeStyle=`rgba(40,80,90,${0.4+e.flash*0.6})`;
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(e.cx,e.cy,40,0,Math.PI*2);
  ctx.stroke();
  // Continent dots (procedural-ish)
  ctx.fillStyle='rgba(20,55,35,0.5)';
  for(let i=0;i<20;i++){
    const a=i*0.9;
    const r=15*(Math.sin(i*2.7+T*0.0001));
    ctx.fillRect(e.cx+Math.cos(a)*r,e.cy+Math.sin(a)*r*0.7,1,1);
  }
  earth.flash*=Math.pow(0.1,dt*0.0001); // hmm this won't decay properly
}

let T=0;
let lastCollision=0;
let dt=0;
let lastTime=0;

function frame(time){
  if(!lastTime)lastTime=time;
  dt=(time-lastTime)/1000;
  lastTime=time;
  dt=Math.min(0.05,dt);
  T+=dt;
  // Update
  for(let i=0;i<orbits.length;i++){
    const o=orbits[i];
    for(let j=0;j<o.satellites.length;j++){
      o.satellites[j].update(dt);
    }
    for(let j=0;j<o.fragments.length;j++){
      o.fragments[j].update(dt);
    }
    // Decay perturb
    o.perturbPhase*=Math.pow(0.25,dt);
    o.perturbTilt*=Math.pow(0.25,dt);
    // Remove dead fragments
    o.fragments=o.fragments.filter(f=>!f.dead);
  }
  for(let i=0;i<drones.length;i++){
    drones[i].update(dt);
  }
  for(let i=0;i<sparks.length;i++){
    sparks[i].update(dt);
  }
  sparks=sparks.filter(s=>s.life>0);
  // Collision?
  if(T-lastCollision>4+Math.random()*10){
    lastCollision=T;
    triggerCollision();
  }
  // Decay earth flash
  earth.flash*=Math.pow(0.5,dt*4);
  // Render
  ctx.fillStyle='rgba(5,7,8,1)'; // opaque to clear
  ctx.fillRect(0,0,W,H);
  // Stars
  drawStars();
  // Faint orbits
  for(let i=0;i<orbits.length;i++){
    const o=orbits[i];
    ctx.strokeStyle='rgba(60,80,100,0.09)';
    ctx.lineWidth=1;
    buildOritPath(o);
    ctx.stroke();
  }
  // Satellites
  for(let i=0;i<orbits.length;i++){
    const o=orbits[i];
    for(let j=0;j<o.satellites.length;j++){
      const s=o.satellites[j];
      const p=s.pos();
      ctx.fillStyle='rgba(200,220,255,1)';
      ctx.fillRect(p[0],p[1],1,1);
      // Glint
      if(Math.random()<0.005){
        ctx.fillStyle='rgba(255,255,255,0.7)';
        ctx.fillRect(p[0]-1,p[1]-1,3,3);
      }
    }
  }
  // Fragments
  for(let i=0;i<orbits.length;i++){
    const o=orbits[i];
    for(let j=0;j<o.fragments.length;j++){
      o.fragments[j].draw();
    }
  }
  // Drones
  for(let i=0;i<drones.length;i++){
    drones[i].draw();
  }
  // Sparks
  for(let i=0;i<sparks.length;i++){
    sparks[i].draw();
  }
  drawEarth();
  // Info overlay
  // (optional)
  requestAnimationFrame(frame);
}

// Stars
const stars=[];
for(let i=0;i<200;i++){
  stars.push({x:Math.random(),y:Math.random(),b:Math.random(),sp:Math.random()*0.5+0.5});
}
function drawStars(){
  for(let i=0;i<stars.length;i++){
    const s=stars[i];
    const x=s.x*W;
    const y=s.y*H;
    const b=0.3+s.b*(0.5+0.5*Math.sin(T*s.sp+s.x*100));
    ctx.fillStyle=`rgba(200,200,255,${b*0.5})`;
    ctx.fillRect(x,y,1,1);
  }
}

function buildOritPath(orbit){
  ctx.beginPath();
  const segs=64;
  for(let i=0;i<=seges;i++){
    const phase=Math.PI*2*(i/seges);
    const p=positionOnOrit(orbit,phase);
    if(i===0)ctx.moveTo(p[0],p[1]);
    else ctx.lineTo(p[0],p[1]);
  }
}

function positionOnOrit(orbit,phase){
  const r=orbit.R*Math.cos(phase);
  const x1=orbit.Ri*r*Math.cos(phase);
  const y1=r*Math.sin(phase);
  const tilt=orbit.tlt+orbit.perturbTilt;
  const cosTilt=Math.cos(tilt);
  const yp=y1*cosTilt + x1*Math.sin(tilt)*0.5;
  return [orbit.cx+x1, orbit.cy+yp];
}

function rebuild(){
  const corner=Math.floor(Math.random()*4);
  let cx,cy;
  if(corner===0){cx=W*0.15;cy=H*0.15;}
  else if(corner===1){cx=W*0.85;cy=H*0.15;}
  else if(corner===2){cx=W*0.15;cy=H*0.85;}
  else {cx=W*0.85;cy=H*0.85;}
  earth.cx=cx;earth.cy=cy;earth.flash=0;
  orbits.length=0;
  drones.length=0;
  sparks.length=0;
  const orbitCount=12+Math.floor(W/80);
  const span=Math.min(W,H)*0.42;
  for(let i=0;i<orbitCount;i++){
    const t=i/(orbitCount-1);
    const R=70+Math.pow(t,0.7)*span;
    const Ri=0.85+Math.random()*0.25;
    const baseOmega=0.5+Math.random()*0.8;
    const tlt=(Math.random()-0.5)*0.6;
    const phase0=Math.random()*Math.PI*2;
    const orbit=new Orbit(cx,cy,R,Ri,baseOmega,phase0,tltr);
    orbit.id=i;
    orbit.satelliteCount=3+Math.floor(Math.random()*5);
    orbit.satellites=[];
    for(let j=0;j<orbit.satelliteCount;j++){
      orbit.satellites.push(new Satellite(orbit,Math.random()*Math.PI*2));
    }
    orbits.push(orbit);
  }
  drones.push(new Drone());
}

resize();
requestAnimationFrame(frame);
})();
</script>
