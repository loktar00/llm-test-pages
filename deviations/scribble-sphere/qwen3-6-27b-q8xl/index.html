<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scribble Ball</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

const NUM_POINTS = 12000;
const SPHERE_RADIUS = 220;
const FOCAL = 900;
const CYCLE_DURATION = 28000;

// Generate scribble points via random walk on sphere
const points = [];
let px = SPHERE_RADIUS, py = 0, pz = 0;
points.push({ x: px, y: py, z: pz });

for (let i = 1; i < NUM_POINTS; i++) {
  const ax = Math.random() - 0.5;
  const ay = Math.random() - 0.5;
  const az = Math.random() - 0.5;
  const al = Math.sqrt(ax * ax + ay * ay + az * az) || 1;
  const ux = ax / al, uy = ay / al, uz = az / al;

  const step = 0.02 + Math.random() * 0.06;
  const cosA = Math.cos(step);
  const sinA = Math.sin(step);
  const dot = px * ux + py * uy + pz * uz;

  px = cosA * px + sinA * (uy * pz - uz * py) + (1 - cosA) * ux * dot;
  py = cosA * py + sinA * (uz * px - ux * pz) + (1 - cosA) * uy * dot;
  pz = cosA * pz + sinA * (ux * py - uy * px) + (1 - cosA) * uz * dot;

  points.push({ x: px, y: py, z: pz });
}

function rotateX(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: p.x, y: p.y * c - p.z * s, z: p.y * s + p.z * c };
}
function rotateY(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: p.x * c + p.z * s, y: p.y, z: -p.x * s + p.z * c };
}
function rotateZ(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c, z: p.z };
}

function project(p) {
  const scale = FOCAL / (FOCAL + p.z);
  return {
    sx: p.x * scale + cx,
    sy: p.y * scale + cy,
    z: p.z,
    scale: scale
  };
}

function cycle(t) {
  const phase = (t % CYCLE_DURATION) / CYCLE_DURATION;
  // Use a smooth curve: grow, hold, shrink, hold
  if (phase < 0.35) {
    // Growing phase with easing
    const p = phase / 0.35;
    return p * p * (3 - 2 * p); // smoothstep
  } else if (phase < 0.55) {
    // Hold full
    return 1;
  } else if (phase < 0.85) {
    // Shrinking phase
    const p = (phase - 0.55) / 0.3;
    return 1 - p * p * (3 - 2 * p);
  } else {
    // Hold empty, then restart
    return 0;
  }
}

let lastTime = 0;

function draw(time) {
  const dt = time - lastTime;
  lastTime = time;

  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  // Subtle radial gradient background
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.5);
  bgGrad.addColorStop(0, 'rgba(30, 20, 50, 0.3)');
  bgGrad.addColorStop(1, 'rgba(5, 5, 8, 0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  const rotSpeed = 0.00015;
  const angleX = time * rotSpeed * 0.7;
  const angleY = time * rotSpeed;
  const angleZ = time * rotSpeed * 0.3;

  // Transform all points
  const transformed = [];
  for (let i = 0; i < NUM_POINTS; i++) {
    let p = points[i];
    p = rotateX(p, angleX);
    p = rotateY(p, angleY);
    p = rotateZ(p, angleZ);
    transformed.push(p);
  }

  // Project
  const projected = transformed.map(project);

  // Determine visible count from cycle
  const frac = cycle(time);
  const visibleCount = Math.floor(frac * NUM_POINTS);

  if (visibleCount < 2) {
    requestAnimationFrame(draw);
    return;
  }

  // Draw segments with depth cueing
  // Sort segments by depth for proper layering (back to front)
  const segments = [];
  for (let i = 0; i < visibleCount - 1; i++) {
    const a = projected[i];
    const b = projected[i + 1];
    const avgZ = (a.z + b.z) / 2;
    segments.push({ a, b, z: avgZ, i });
  }

  // Sort back to front
  segments.sort((a, b) => a.z - b.z);

  // Draw in batches by depth for performance
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (let s = 0; s < segments.length; s++) {
    const seg = segments[s];
    const { a, b } = seg;

    // Depth mapping: z ranges roughly from -SPHERE_RADIUS to +SPHERE_RADIUS
    // Near camera (z positive) = brighter, thicker
    const depthNorm = (seg.z + SPHERE_RADIUS) / (2 * SPHERE_RADIUS);
    const nearness = 1 - depthNorm; // 1 = near, 0 = far

    // Opacity: far=0.03, near=0.9
    const alpha = 0.03 + nearness * 0.87;

    // Line width: far=0.3, near=2.8
    const lineWidth = 0.3 + nearness * 2.5;

    // Color: shift from cool blue (far) to warm white-yellow (near)
    const r = Math.floor(180 + nearness * 75);
    const g = Math.floor(170 + nearness * 60);
    const b2 = Math.floor(200 + nearness * 55);

    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.lineTo(b.sx, b.sy);
    ctx.strokeStyle = `rgba(${r},${g},${b2},${alpha})`;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  // Subtle glow pass for near segments
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.shadowColor = 'rgba(200, 220, 255, 0.4)';
  ctx.shadowBlur = 8;
  ctx.lineWidth = 1.5;

  for (let s = 0; s < segments.length; s++) {
    const seg = segments[s];
    const nearness = 1 - (seg.z + SPHERE_RADIUS) / (2 * SPHERE_RADIUS);
    if (nearness > 0.7) {
      const { a, b } = seg;
      const alpha = (nearness - 0.7) / 0.3 * 0.15;
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.lineTo(b.sx, b.sy);
      ctx.strokeStyle = `rgba(220, 230, 255, ${alpha})`;
      ctx.stroke();
    }
  }
  ctx.restore();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
