<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokeh Field</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508; /* Deep dark night */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let frames = 0;
        
        // Configuration
        const NUM_BOKEH = 60;
        const CYCLE_DURATION = 10000; // 10 seconds per full cycle
        
        // Palette: Warm Night City
        // Base colors: Warm amber, soft white, slight cool purple
        const palette = [
            { h: 35, s: 90, l: 60 },  // Amber
            { h: 40, s: 80, l: 65 },  // Gold
            { h: 30, s: 100, l: 50 }, // Deep Orange
            { h: 200, s: 30, l: 80 }, // Cool moonlight white
            { h: 280, s: 40, l: 70 }, // Occasional purple accent
            { h: 10, s: 80, l: 55 }   // Reddish accent
        ];

        class Bokeh {
            constructor() {
                this.init();
            }

            init() {
                // Depth factor: 0 (farthest) to 1 (closest)
                this.depth = Math.random();
                
                // Properties based on depth
                // Closer = larger, faster, softer
                this.size = (Math.random() * 20 + 10) + (this.depth * 60); 
                this.speed = (Math.random() * 0.5 + 0.1) + (this.depth * 1.5);
                
                // Color
                const col = palette[Math.floor(Math.random() * palette.length)];
                this.h = col.h;
                this.s = col.s;
                this.l = col.l;
                this.alpha = 0.1 + (this.depth * 0.5); // Closer is brighter

                // Position (starts offscreen or random)
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                // Random slight drift variation
                this.vx = (Math.random() - 0.5) * 0.5; 
            }

            update(t, focusDepth) {
                // Lateral drift
                this.x += this.speed;
                this.y += this.vx + Math.sin(t * 0.001 + this.depth * 10) * 0.2;

                // Wrap around screen (parallax effect)
                // Further objects wrap faster? No, speed handles that.
                if (this.x > width + this.size) this.x = -this.size;
                if (this.x < -this.size) this.x = width + this.size;
                if (this.y > height + this.size) this.y = -this.size;
                if (this.y < -this.size) this.y = height + this.size;

                // Focus Logic
                // Calculate distance from current focus plane
                const dist = Math.abs(this.depth - focusDepth);
                
                // Focus curve: Gaussian-like
                // 0 = perfectly sharp, > 1 = very blurry
                const blurAmount = Math.pow(dist * 2.5, 2); 

                return blurAmount;
            }

            draw(ctx, blurAmount, time) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Opacity pulsing
                const pulse = 0.8 + Math.sin(time * 0.003 + this.depth * 100) * 0.2;
                ctx.globalAlpha = this.alpha * pulse;

                // Draw the shape
                this.drawShape(ctx, blurAmount);

                ctx.restore();
            }

            drawShape(ctx, blurAmount) {
                // If perfectly focused (blurAmount near 0), draw polygon
                // Otherwise, draw soft circle
                
                if (blurAmount < 0.1) {
                    // Sharp polygonal aperture
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = `hsla(${this.h}, ${this.s}%, ${this.l}%, 0.8)`;
                    ctx.fillStyle = `hsla(${this.h}, ${this.s}%, ${this.l}%, 0.9)`;
                    
                    const sides = 6;
                    const r = this.size * 0.8;
                    
                    ctx.beginPath();
                    for (let i = 0; i < sides; i++) {
                        const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                        const px = r * Math.cos(angle);
                        const py = r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    
                    // Inner glow for sharp point
                    ctx.fillStyle = `hsla(0, 0%, 100%, 0.6)`;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    // Bokeh / Defocus
                    // Size of blur grows as we move away from focus
                    const bokehSize = this.size + (blurAmount * 15);
                    
                    // Create radial gradient for softness
                    // Center is solid, edges fade out
                    const grad = ctx.createRadialGradient(0, 0, bokehSize * 0.1, 0, 0, bokehSize);
                    grad.addColorStop(0, `hsla(${this.h}, ${this.s}%, ${this.l}%, ${this.alpha})`);
                    grad.addColorStop(0.4, `hsla(${this.h}, ${this.s}%, ${this.l}%, ${this.alpha * 0.5})`);
                    grad.addColorStop(1, `hsla(${this.h}, ${this.s}%, ${this.l}%, 0)`);

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, bokehSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Subtle rim light
                    ctx.strokeStyle = `hsla(${this.h}, ${this.s}%, ${this.l}%, ${this.alpha * 0.3})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, bokehSize * 0.95, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function init() {
            resize();
            particles = [];
            for (let i = 0; i < NUM_BOKEH; i++) {
                particles.push(new Bokeh());
            }
        }

        function animate(time) {
            // Clear with slight trail for motion blur feel? 
            // No, standard clear looks cleaner for sharp focus pulls.
            ctx.clearRect(0, 0, width, height);
            
            // Background ambient glow (very subtle)
            const bgGrad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            bgGrad.addColorStop(0, '#1a1520');
            bgGrad.addColorStop(1, '#050508');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Calculate Focus Depth Cycle
            // Sine wave: -1 to 1. We want 0 to 1.
            // Cycle: 0 -> 1 -> 0
            const rawCycle = (Math.sin((time % CYCLE_DURATION) / CYCLE_DURATION * Math.PI * 2) + 1) / 2;
            
            // Smooth ease-in-out for the focus pull (making it feel like a lens breathing)
            // Using a cubic ease
            const focusDepth = rawCycle * rawCycle * (3 - 2 * rawCycle);
            
            // We cycle through 3 specific depth planes: Far (0.2), Mid (0.5), Near (0.8)
            // But to make it smooth, we actually just cycle continuously 0 to 1.
            // However, the prompt asks for "sharpen one depth plane at a time".
            // Let's interpolate between 3 specific targets.
            
            let targetDepth = 0;
            const cyclePos = (time % CYCLE_DURATION) / CYCLE_DURATION; // 0 to 1
            
            if (cyclePos < 0.33) {
                // Focus Far
                targetDepth = 0.2;
            } else if (cyclePos < 0.66) {
                // Focus Mid
                targetDepth = 0.5;
            } else {
                // Focus Near
                targetDepth = 0.8;
            }
            
            // Smooth transition between targets
            // Simple approach: Just use the smoothed sine wave which naturally oscillates
            // Let's map the sine wave to hit 3 peaks.
            // Actually, let's keep it simple: The focus plane is a moving value.
            // We want it to dwell on depths.
            
            // Let's implement a sawtooth-to-smooth conversion for "picking" depths
            // We will define 3 anchors: 0.1, 0.5, 0.9
            let currentFocus = 0;
            const t = (time % CYCLE_DURATION) / CYCLE_DURATION;
            
            if (t < 0.25) currentFocus = 0.1 + (t/0.25) * 0.4; // 0.1 -> 0.5
            else if (t < 0.5) currentFocus = 0.5 + ((t-0.25)/0.25) * 0.4; // 0.5 -> 0.9
            else if (t < 0.75) currentFocus = 0.9 - ((t-0.5)/0.25) * 0.4; // 0.9 -> 0.5
            else currentFocus = 0.5 - ((t-0.75)/0.25) * 0.4; // 0.5 -> 0.1
            
            // Sort particles by depth (Painter's algorithm)
            // We only sort occasionally to avoid jitter, or just sort every frame (JS is fast enough for 60 items)
            particles.sort((a, b) => a.depth - b.depth);

            particles.forEach(p => {
                const blur = p.update(time, currentFocus);
                p.draw(ctx, blur, time);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
