<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Battle Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div>BATTLE SIMULATION v1.0</div>
        <div>RED vs BLUE</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
/**
 * CONFIGURATION & CONSTANTS
 */
const CONFIG = {
    WORLD_WIDTH: 3000,
    WORLD_HEIGHT: 2000,
    INITIAL_VIEW_SCALE: 0.6, // Zoomed out
    MIN_SCALE: 0.4,
    MAX_SCALE: 1.5,
    UNIT_RADIUS: 8,
    TEAM_RED: 0,
    TEAM_BLUE: 1,
    COLORS: {
        RED: '#c0392b',
        RED_DARK: '#922b21',
        BLUE: '#2980b9',
        BLUE_DARK: '#1f618d',
        GRASS: '#5d6b45',
        DIRT: '#75684e',
        MUD: '#4e4332',
        WALL: '#565656',
        BANNER: '#f1c40f'
    },
    SPAWN_RATE: 120, // Frames between reinforcements
};

/**
 * UTILITIES
 */
const Utils = {
    rand: (min, max) => Math.random() * (max - min) + min,
    randInt: (min, max) => Math.floor(Math.random() * (max - min + 1) + min),
    dist: (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2),
    clamp: (val, min, max) => Math.min(Math.max(val, min), max),
    lerp: (start, end, t) => start * (1 - t) + end * t,
    angleTo: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
    circleIntersect: (x1, y1, r1, x2, y2, r2) => Utils.dist(x1, y1, x2, y2) < r1 + r2
};

/**
 * OFFSCREEN CANVAS FOR PERSISTENT DAMAGE
 */
const DamageCanvas = document.createElement('canvas');
DamageCanvas.width = CONFIG.WORLD_WIDTH;
DamageCanvas.height = CONFIG.WORLD_HEIGHT;
const DamageCtx = DamageCanvas.getContext('2d');

/**
 * CLASSES
 */

class Entity {
    constructor(x, y, team) {
        this.x = x;
        this.y = y;
        this.team = team;
        this.dead = false;
        this.radius = 10;
    }
}

class Projectile extends Entity {
    constructor(x, y, target, team, damage) {
        super(x, y, team);
        this.target = target;
        this.speed = 8;
        this.damage = damage;
        this.radius = 3;
        
        // Lead the target slightly
        const angle = Utils.angleTo(x, y, target.x, target.y);
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.life = 120; // Frames before disappearing
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;

        // Homing adjustment (optional, makes archers better)
        if (!this.target.dead) {
            const angle = Utils.angleTo(this.x, this.y, this.target.x, this.target.y);
            this.vx = Math.cos(angle) * this.speed;
            this.vy = Math.sin(angle) * this.speed;
        }

        // Collision
        if (Utils.circleIntersect(this.x, this.y, this.radius, this.target.x, this.target.y, this.target.radius)) {
            this.target.takeDamage(this.damage);
            this.dead = true;
            Effects.spawnBlood(this.target.x, this.target.y, 5);
            Effects.spawnDust(this.x, this.y);
        }

        if (this.life <= 0) this.dead = true;
    }

    draw(ctx) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
        ctx.stroke();
    }
}

class Unit extends Entity {
    constructor(x, y, team, type) {
        super(x, y, team);
        this.type = type; // 'infantry', 'archer', 'cavalry'
        this.hp = type === 'cavalry' ? 120 : (type === 'archer' ? 60 : 100);
        this.maxHp = this.hp;
        this.radius = type === 'cavalry' ? 12 : 8;
        this.speed = type === 'cavalry' ? 3 : (type === 'archer' ? 1.5 : 2);
        this.damage = type === 'cavalry' ? 25 : (type === 'archer' ? 15 : 20);
        this.range = type === 'archer' ? 200 : (type === 'cavalry' ? 30 : 25);
        this.cooldown = 0;
        this.maxCooldown = type === 'archer' ? 60 : 40;
        this.state = 'PATROL'; // PATROL, CHASE, ATTACK, FLEE, RESPAWN
        this.target = null;
        this.patrolTarget = { x: x, y: y };
        this.color = team === CONFIG.TEAM_RED ? CONFIG.COLORS.RED : CONFIG.COLORS.BLUE;
        
        // Visuals
        this.stance = 0; // 0-1 for attack swing
    }

    takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) {
            this.dead = true;
            Battle.registerKill(this);
            Effects.spawnBlood(this.x, this.y, 15);
            Effects.spawnDust(this.x, this.y);
            // Drop item chance
            if (Math.random() > 0.7) Battle.spawnLoot(this.x, this.y);
        }
    }

    update(obstacles, squads, projectiles) {
        if (this.dead) return;

        // Cooldown
        if (this.cooldown > 0) this.cooldown--;
        if (this.stance > 0) this.stance -= 0.1;

        // 1. Find Target
        if (!this.target || this.target.dead) {
            this.target = Battle.findClosestEnemy(this, squads, this.range * 2);
        }

        // 2. Decision Logic
        if (this.state === 'RESPAWN') {
            const dx = Battle.spaawnPoint[this.team].x - this.x;
            const dy = Battle.spaawnPoint[this.team].y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 50) {
                this.state = 'PATROL';
                this.patrolTarget = Battle.getRandomValidPos();
            } else {
                this.moveTowards(Battle.spaawnPoint[this.team].x, Battle.spaawnPoint[this.team].y, 2);
            }
            return;
        }

        // Priority: Objectives
        const nearestObj = Battle.findClosestObj(this, Battle.objectives);
        if (nearestObj && nearestObj.owner !== this.team && dist(this.x, this.y, nearestObj.x, nearestObj.y) < 300) {
            if (!this.target || dist(this.x, this.y, this.target.x, this.target.y) > 400) {
                this.moveTowards(nearestObj.x, nearestObj.y, this.speed);
                return;
            }
        }

        // Combat State
        if (this.target && dist(this.x, this.y, this.target.x, this.target.y) <= this.range) {
            this.state = 'ATTACK';
            // Stop moving to attack (for archers), or lunge (cavalry)
            if (this.type === 'cavalry') {
                this.moveTowards(this.target.x, this.target.y, this.speed * 1.5);
            }
            
            if (this.cooldown <= 0) {
                this.attack(this.target, projectiles);
                this.cooldown = this.maxCooldown;
                this.stance = 1;
            }
        } else {
            // Movement State
            if (this.target && dist(this.x, this.y, this.target.x, this.target.y) < 500) {
                this.state = 'CHASE';
                // Formation logic
                const squad = Battle.findSquad(this);
                let offsetX = 0, offsetY = 0;
                if (squad) {
                    // Simple spacing
                    const idx = squad.indexOf(this);
                    offsetX = (idx % 3) * 15 - 15;
                    offsetY = Math.floor(idx / 3) * 15;
                }
                this.moveTowards(this.target.x + offsetX, this.target.y + offsetY, this.speed);
            } else {
                this.state = 'PATROL';
                if (dist(this.x, this.y, this.patrolTarget.x, this.patrolTarget.y) < 50) {
                    this.patrolTarget = Battle.getRandomValidPos();
                }
                this.moveTowards(this.patrolTarget.x, this.patrolTarget.y, this.speed * 0.5);
            }
        }

        // Separation (Stuck Recovery)
        squads.forEach(squad => {
            squad.forEach(u => {
                if (u !== this && !u.dead) {
                    const d = Utils.dist(this.x, this.y, u.x, u.y);
                    if (d < this.radius * 2) {
                        const pushAngle = Utils.angleTo(u.x, u.y, this.x, this.y);
                        this.x += Math.cos(pushAngle) * 1;
                        this.y += Math.sin(pushAngle) * 1;
                    }
                }
            });
        });
    }

    moveTowards(tx, ty, speed) {
        const angle = Utils.angleTo(this.x, this.y, tx, ty);
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed;

        // Collision with Obstacles
        let blocked = false;
        for (let obs of Battle.obstacles) {
            if (Utils.circleIntersect(this.x + dx, this.y + dy, this.radius, obs.x, obs.y, obs.radius)) {
                blocked = true;
                break;
            }
        }

        if (!blocked) {
            this.x = Utils.clamp(this.x + dx, 0, CONFIG.WORLD_WIDTH);
            this.y = Utils.clamp(this.y + dy, 0, CONFIG.WORLD_HEIGHT);
        } else {
            // Slide along wall or turn
            const perpAngle = angle + Math.PI / 2;
            this.x += Math.cos(perpAngle) * speed;
            this.y += Math.sin(perpAngle) * speed;
        }
    }

    attack(target, projectiles) {
        if (this.type === 'archer') {
            projectiles.push(new Projectile(this.x, this.y, target, this.team, this.damage));
        } else {
            // Melee hit
            target.takeDamage(this.damage);
        }
    }

    draw(ctx) {
        // Draw Unit Body
        ctx.fillStyle = this.color;
        
        // Draw Shape based on type
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Unit circle
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Indicator
        if (this.type === 'archer') {
            ctx.fillStyle = '#fff';
            ctx.fillRect(-2, -2, 4, 4);
        } else if (this.type === 'cavalry') {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, -4, 8, 8); // Armor strip
        }

        // Health Bar
        const hpPct = this.hp / this.maxHp;
        ctx.fillStyle = 'red';
        ctx.fillRect(-10, -this.radius - 6, 20, 3);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(-10, -this.radius - 6, 20 * hpPct, 3);

        ctx.restore();
    }
}

class Objective extends Entity {
    constructor(x, y, type) {
        super(x, y, -1); // Neutral
        this.type = type; // 'banner', 'crate'
        this.radius = 20;
        this.owner = -1;
        this.pulse = 0;
    }

    update() {
        this.pulse += 0.1;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Base
        ctx.fillStyle = '#555';
        ctx.fillRect(-15, -15, 30, 30);

        // Objective Indicator
        ctx.beginPath();
        ctx.arc(0, 0, 10 + Math.sin(this.pulse) * 2, 0, Math.PI * 2);
        
        if (this.owner === CONFIG.TEAM_RED) ctx.fillStyle = CONFIG.COLORS.RED;
        else if (this.owner === CONFIG.TEAM_BLUE) ctx.fillStyle = CONFIG.COLORS.BLUE;
        else ctx.fillStyle = CONFIG.COLORS.BANNER;
        
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.stroke();

        // Icon
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type === 'banner' ? 'B' : '+', 0, 0);

        ctx.restore();
    }
}

class Effect {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.life = 1.0;
        this.maxLife = 1.0;
        
        if (type === 'blood') {
            this.radius = Utils.rand(5, 15);
            this.maxLife = 300; // Stays for a while
            this.life = this.maxLife;
        } else if (type === 'dust') {
            this.radius = 5;
            this.maxLife = 20;
        } else if (type === 'arrow_hit') {
            this.radius = 2;
            this.maxLife = 10;
        }
    }

    update() {
        this.life--;
        if (this.type === 'dust') {
            this.radius += 0.5;
        }
    }

    draw(ctx) {
        const alpha = this.life / this.maxLife;
        
        if (this.type === 'blood') {
            // Draw to persistent damage canvas
            DamageCtx.beginPath();
            DamageCtx.arc(this.x, this.y, this.radius * (1 - alpha * 0.5), 0, Math.PI * 2);
            DamageCtx.fillStyle = `rgba(80, 0, 0, 0.8)`;
            DamageCtx.fill();
        } else {
            // Draw to active scene (transient)
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            if (this.type === 'dust') ctx.fillStyle = '#ddd';
            else if (this.type === 'arrow_hit') ctx.strokeStyle = '#333';
            ctx.fill();
            if (this.type === 'arrow_hit') {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + Math.cos(this.x)*10, this.y + Math.sin(this.y)*10);
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
        }
    }
}

/**
 * BATTLE ENGINE
 */
const Battle = {
    squads: [], // Array of arrays of Units
    units: [],
    projectiles: [],
    obstacles: [],
    objectives: [],
    effects: [],
    spawnTimer: 0,
    camera: { x: CONFIG.WORLD_WIDTH/2, y: CONFIG.WORLD_HEIGHT/2, zoom: CONFIG.INITIAL_VIEW_SCALE, targetZoom: CONFIG.INITIAL_VIEW_SCALE, focusX: 0, focusY: 0 },
    
    spawnPoints: {
        0: { x: 100, y: CONFIG.WORLD_HEIGHT / 2 }, // Red
        1: { x: CONFIG.WORLD_WIDTH - 100, y: CONFIG.WORLD_HEIGHT / 2 } // Blue
    },

    init() {
        // 1. Generate World
        this.generateWorld();
        
        // 2. Initial Armies
        this.spawnSquad(CONFIG.TEAM_RED, CONFIG.WORLD_WIDTH * 0.2, CONFIG.WORLD_HEIGHT / 2, 5);
        this.spawnSquad(CONFIG.TEAM_RED, CONFIG.WORLD_WIDTH * 0.15, CONFIG.WORLD_HEIGHT / 3, 3);
        
        this.spawnSquad(CONFIG.TEAM_BLUE, CONFIG.WORLD_WIDTH * 0.8, CONFIG.WORLD_HEIGHT / 2, 5);
        this.spawnSquad(CONFIG.TEAM_BLUE, CONFIG.WORLD_WIDTH * 0.85, CONFIG.WORLD_HEIGHT / 3, 3);

        // 3. Objectives
        for(let i=0; i<5; i++) {
            this.objectives.push(new Objective(Utils.rand(200, CONFIG.WORLD_WIDTH-200), Utils.rand(200, CONFIG.WORLD_HEIGHT-200), i%2===0 ? 'banner' : 'crate'));
        }

        // Start Loop
        requestAnimationFrame(this.loop.bind(this));
    },

    generateWorld() {
        // Draw Base Terrain to DamageCanvas
        DamageCtx.fillStyle = CONFIG.COLORS.GRASS;
        DamageCtx.fillRect(0, 0, CONFIG.WORLD_WIDTH, CONFIG.WORLD_HEIGHT);

        // Add Noise/Texture
        for(let i=0; i<500; i++) {
            DamageCtx.fillStyle = Math.random() > 0.5 ? CONFIG.COLORS.DIRT : CONFIG.COLORS.MUD;
            DamageCtx.globalAlpha = 0.3;
            DamageCtx.beginPath();
            DamageCtx.arc(Utils.rand(0, CONFIG.WORLD_WIDTH), Utils.rand(0, CONFIG.WORLD_HEIGHT), Utils.rand(10, 50), 0, Math.PI*2);
            DamageCtx.fill();
        }
        DamageCtx.globalAlpha = 1.0;

        // Obstacles
        const obstacleCount = 15;
        for(let i=0; i<obstacleCount; i++) {
            const x = Utils.rand(200, CONFIG.WORLD_WIDTH-200);
            const y = Utils.rand(200, CONFIG.WORLD_HEIGHT-200);
            const r = Utils.rand(30, 60);
            
            this.obstacles.push({ x, y, radius: r });

            // Draw Obstacle to Persistent Canvas
            DamageCtx.fillStyle = CONFIG.COLORS.WALL;
            DamageCtx.beginPath();
            DamageCtx.arc(x, y, r, 0, Math.PI * 2);
            DamageCtx.fill();
            // Detail
            DamageCtx.fillStyle = '#333';
            DamageCtx.beginPath();
            DamageCtx.arc(x + 5, y + 5, r * 0.8, 0, Math.PI * 2);
            DamageCtx.fill();
        }
    },

    spawnSquad(team, x, y, count) {
        const squad = [];
        const types = ['infantry', 'archer', 'cavalry'];
        
        for(let i=0; i<count; i++) {
            const type = types[Utils.randInt(0, 2)];
            const offsetX = Utils.rand(-50, 50);
            const offsetY = Utils.rand(-50, 50);
            const u = new Unit(x + offsetX, y + offsetY, team, type);
            squad.push(u);
