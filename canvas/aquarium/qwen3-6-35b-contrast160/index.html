<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aquarium Screensaver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="aquarium"></canvas>
<script>
const canvas = document.getElementById('aquarium');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Color Palettes ---
const PALETTES = [
  { body: '#ff8c42', belly: '#ffd2a1', fin: '#e05a20', name: 'Goldfish' },
  { body: '#42a5ff', belly: '#a0d4ff', fin: '#2070e0', name: 'Blue Tang' },
  { body: '#42e08c', belly: '#a0ffd0', fin: '#20b060', name: 'Parrot Fish' },
  { body: '#e042e0', belly: '#ffa0ff', fin: '#a020a0', name: 'Angelfish' },
  { body: '#ffd700', belly: '#fff0a0', fin: '#c0a000', name: 'Yellow Tang' },
  { body: '#ff4242', belly: '#ffa0a0', fin: '#c02020', name: 'Red Fish' },
];

// --- Species Definitions ---
const SPECIES = [
  { // Goldfish - classic teardrop shape
    bodyShape: 'teardrop',
    tailShape: 'fan',
    finShape: 'pointed',
    eyeSize: 0.12,
    sizeRange: [25, 45],
    speed: 0.8,
    dartSpeed: 4.5,
    dartDuration: 0.4,
    colorIdx: 0,
    wobbleAmp: 0.02,
  },
  { // Angelfish - tall, diamond shape
    bodyShape: 'diamond',
    tailShape: 'fan',
    finShape: 'elongated',
    eyeSize: 0.1,
    sizeRange: [35, 60],
    speed: 0.6,
    dartSpeed: 4.0,
    dartDuration: 0.3,
    colorIdx: 3,
    wobbleAmp: 0.015,
  },
  { // Tang - oval, discus shape
    bodyShape: 'oval',
    tailShape: 'forked',
    finShape: 'rounded',
    eyeSize: 0.1,
    sizeRange: [20, 35],
    speed: 1.2,
    dartSpeed: 5.0,
    dartDuration: 0.25,
    colorIdx: 1,
    wobbleAmp: 0.025,
  },
  { // Eel - long, eel shape
    bodyShape: 'eel',
    tailShape: 'pointed',
    finShape: 'small',
    eyeSize: 0.08,
    sizeRange: [40, 70],
    speed: 1.0,
    dartSpeed: 5.5,
    dartDuration: 0.2,
    colorIdx: 5,
    wobbleAmp: 0.03,
  },
];

// --- Utility ---
function rand(min, max) { return Math.random() * (max - min) + min; }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// --- Fish Class ---
class Fish {
  constructor(species, x, y) {
    this.species = species;
    this.x = x || rand(100, W - 100);
    this.y = y || rand(100, H - 200);
    this.size = rand(species.sizeRange[0], species.sizeRange[1]);
    this.color = PALETTES[species.colorIdx];
    this.vx = rand(-1, 1) * species.speed;
    this.vy = rand(-0.5, 0.5) * species.speed;
    this.targetVx = this.vx;
    this.targetVy = this.vy;
    this.wanderTimer = rand(0, 5);
    this.wanderInterval = rand(2, 5);
    this.isDarting = false;
    this.dartTimer = 0;
    this.dartCooldown = rand(3, 8);
    this.angle = Math.atan2(this.vy, this.vx);
    this.tailPhase = rand(0, Math.PI * 2);
    this.tailSpeed = rand(4, 8);
    this.wobblePhase = rand(0, Math.PI * 2);
    this.wobbleAmp = species.wobbleAmp;
    this.startled = false;
    this.startleTimer = 0;
    this.blinkTimer = rand(3, 10);
    this.isBlinking = false;
    this.blinkDuration = 0.2;
  }

  update(dt) {
    this.tailPhase += this.tailSpeed * dt;
    this.wobblePhase += dt * 2;
    this.blinkTimer -= dt;
    if (this.blinkTimer <= 0 && !this.isBlinking) {
      this.isBlinking = true;
      this.blinkTimer = this.blinkDuration;
    } else if (this.isBlinking) {
      this.blinkTimer -= dt;
      if (this.blinkTimer <= 0) {
        this.isBlinking = false;
        this.blinkTimer = rand(3, 10);
      }
    }

    // Wander steering
    this.wanderTimer -= dt;
    if (this.wanderTimer <= 0) {
      this.wanderTimer = this.wanderInterval;
      this.targetVx = rand(-1, 1) * this.species.speed;
      this.targetVy = rand(-0.5, 0.5) * this.species.speed;
    }

    // Darting
    if (!this.isDarting) {
      this.dartCooldown -= dt;
      if (this.dartCooldown <= 0 && Math.random() < 0.01) {
        this.isDarting = true;
        this.dartTimer = this.species.dartDuration;
        const angle = this.angle + rand(-0.5, 0.5);
        this.targetVx = Math.cos(angle) * this.species.dartSpeed;
        this.targetVy = Math.sin(angle) * this.species.dartSpeed;
        this.dartCooldown = rand(5, 12);
      }
    } else {
      this.dartTimer -= dt;
      if (this.dartTimer <= 0) {
        this.isDarting = false;
        this.targetVx = this.vx;
        this.targetVy = this.vy;
      }
    }

    // Startle avoidance
    if (this.startleTimer > 0) {
      this.startleTimer -= dt;
      this.targetVx = -Math.sign(this.vx) * this.species.dartSpeed * 1.5;
      this.targetVy = rand(-2, 2) * this.species.dartSpeed;
    }

    // Wall avoidance
    const margin = this.size * 1.5;
    const avoidStrength = 2;
    if (this.x < margin) this.targetVx += avoidStrength * (1 - this.x / margin);
    if (this.x > W - margin) this.targetVx -= avoidStrength * (1 - (W - this.x) / margin);
    if (this.y < margin) this.targetVy += avoidStrength * (1 - this.y / margin);
    if (this.y > H - margin - 60) this.targetVy -= avoidStrength * (1 - (H - 60 - this.y) / margin);

    // Smooth steering
    const steerSpeed = this.isDarting ? 8 : 2;
    this.vx = lerp(this.vx, this.targetVx, steerSpeed * dt);
    this.vy = lerp(this.vy, this.targetVy, steerSpeed * dt);

    // Update position
    this.x += this.vx * 60 * dt;
    this.y += this.vy * 60 * dt;

    // Update angle
    this.angle = Math.atan2(this.vy, this.vx);

    // Keep in bounds
    this.x = clamp(this.x, margin, W - margin);
    this.y = clamp(this.y, margin, H - margin - 60);
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    const s = this.size;
    const tailWag = Math.sin(this.tailPhase) * this.wobbleAmp * 10;
    const isBlink = this.isBlinking;

    ctx.scale(1, 1);

    // Draw tail
    this.drawTail(ctx, s, tailWag);

    // Draw body
    this.drawBody(ctx, s);

    // Draw fins
    this.drawFins(ctx, s, tailWag);

    // Draw eye
    this.drawEye(ctx, s, isBlink);

    ctx.restore();
  }

  drawBody(ctx, s) {
    const sp = this.species;
    ctx.beginPath();

    switch (sp.bodyShape) {
      case 'teardrop':
        ctx.moveTo(s * 0.6, 0);
        ctx.bezierCurveTo(s * 0.4, -s * 0.35, -s * 0.3, -s * 0.35, -s * 0.5, 0);
        ctx.bezierCurveTo(-s * 0.3, s * 0.35, s * 0.4, s * 0.35, s * 0.6, 0);
        break;
      case 'diamond':
        ctx.moveTo(s * 0.55, 0);
        ctx.lineTo(s * 0.1, -s * 0.45);
        ctx.lineTo(-s * 0.4, 0);
        ctx.lineTo(s * 0.1, s * 0.45);
        ctx.closePath();
        break;
      case 'oval':
        ctx.ellipse(0, 0, s * 0.5, s * 0.35, 0, 0, Math.PI * 2);
        break;
      case 'eel':
        ctx.moveTo(s * 0.6, 0);
        ctx.bezierCurveTo(s * 0.3, -s * 0.12, -s * 0.3, -s * 0.12, -s * 0.6, 0);
        ctx.bezierCurveTo(-s * 0.3, s * 0.12, s * 0.3, s * 0.12, s * 0.6, 0);
        break;
    }

    ctx.fillStyle = this.color.body;
    ctx.fill();

    // Belly highlight
    ctx.save();
    ctx.clip();
    ctx.beginPath();
    if (sp.bodyShape === 'eel') {
      ctx.ellipse(0, s * 0.05, s * 0.4, s * 0.15, 0, 0, Math.PI * 2);
    } else {
      ctx.ellipse(0, s * 0.1, s * 0.35, s * 0.15, 0, 0, Math.PI * 2);
    }
    ctx.fillStyle = this.color.belly;
    ctx.globalAlpha = 0.4;
    ctx.fill();
    ctx.restore();

    // Body outline
    ctx.beginPath();
    if (sp.bodyShape === 'teardrop') {
      ctx.moveTo(s * 0.6, 0);
      ctx.bezierCurveTo(s * 0.4, -s * 0.35, -s * 0.3, -s * 0.35, -s * 0.5, 0);
      ctx.bezierCurveTo(-s * 0.3, s * 0.35, s * 0.4, s * 0.35, s * 0.6, 0);
    } else if (sp.bodyShape === 'diamond') {
      ctx.moveTo(s * 0.55, 0);
      ctx.lineTo(s * 0.1, -s * 0.45);
      ctx.lineTo(-s * 0.4, 0);
      ctx.lineTo(s * 0.1, s * 0.45);
      ctx.closePath();
    } else if (sp.bodyShape === 'oval') {
      ctx.ellipse(0, 0, s * 0.5, s * 0.35, 0, 0, Math.PI * 2);
    } else if (sp.bodyShape === 'eel') {
      ctx.moveTo(s * 0.6, 0);
      ctx.bezierCurveTo(s * 0.3, -s * 0.12, -s * 0.3, -s * 0.12, -s * 0.6, 0);
      ctx.bezierCurveTo(-s * 0.3, s * 0.12, s * 0.3, s * 0.12, s * 0.6, 0);
    }
    ctx.strokeStyle = this.color.fin;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  drawTail(ctx, s, tailWag) {
    const sp = this.species;
    ctx.save();
    ctx.translate(-s * 0.5, 0);
    ctx.rotate(tailWag);

    if (sp.tailShape === 'fan') {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-s * 0.2, -s * 0.3, -s * 0.4, -s * 0.35, -s * 0.5, -s * 0.4);
      ctx.bezierCurveTo(-s * 0.35, -s * 0.1, -s * 0.35, s * 0.1, -s * 0.5, s * 0.4);
      ctx.bezierCurveTo(-s * 0.4, s * 0.35, -s * 0.2, s * 0.3, 0, 0);
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.7;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (sp.tailShape === 'forked') {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-s * 0.3, -s * 0.25);
      ctx.lineTo(-s * 0.5, -s * 0.35);
      ctx.lineTo(-s * 0.35, -s * 0.05);
      ctx.lineTo(-s * 0.5, s * 0.35);
      ctx.lineTo(-s * 0.3, s * 0.25);
      ctx.closePath();
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.7;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (sp.tailShape === 'pointed') {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-s * 0.4, -s * 0.15);
      ctx.lineTo(-s * 0.7, 0);
      ctx.lineTo(-s * 0.4, s * 0.15);
      ctx.closePath();
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.7;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  drawFins(ctx, s, tailWag) {
    const sp = this.species;
    const finPhase = Math.sin(this.tailPhase * 0.7) * 0.1;

    // Dorsal fin
    ctx.save();
    ctx.translate(0, -s * 0.3);
    ctx.rotate(-0.2 + finPhase);

    if (sp.finShape === 'elongated') {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 0.1, -s * 0.4, s * 0.05, -s * 0.5);
      ctx.quadraticCurveTo(-s * 0.05, -s * 0.3, 0, 0);
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.5;
      ctx.fill();
    } else if (sp.finShape === 'pointed') {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 0.1, -s * 0.25, s * 0.05, -s * 0.3);
      ctx.quadraticCurveTo(-s * 0.05, -s * 0.15, 0, 0);
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.6;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 0.15, -s * 0.2, 0, -s * 0.2);
      ctx.quadraticCurveTo(-s * 0.05, -s * 0.1, 0, 0);
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.6;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Anal fin (bottom)
    ctx.save();
    ctx.translate(0, s * 0.25);
    ctx.rotate(0.2 - finPhase);

    if (sp.finShape === 'elongated') {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 0.1, s * 0.3, s * 0.05, s * 0.35);
      ctx.quadraticCurveTo(-s * 0.05, s * 0.15, 0, 0);
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.4;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 0.1, s * 0.15, 0, s * 0.15);
      ctx.quadraticCurveTo(-s * 0.05, s * 0.05, 0, 0);
      ctx.fillStyle = this.color.fin;
      ctx.globalAlpha = 0.5;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  drawEye(ctx, s, isBlink) {
    const eyeX = s * 0.3;
    const eyeY = -s * 0.08;
    const eyeR = s * this.species.eyeSize;

    if (isBlink) {
      ctx.beginPath();
      ctx.moveTo(eyeX - eyeR, eyeY);
      ctx.lineTo(eyeX + eyeR, eyeY);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      // Eye white
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      // Pupil
      ctx.beginPath();
      ctx.arc(eyeX + eyeR * 0.2, eyeY, eyeR * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = '#111';
      ctx.fill();

      // Highlight
      ctx.beginPath();
      ctx.arc(eyeX + eyeR * 0.3, eyeY - eyeR * 0.2, eyeR * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
  }
}

// --- Bubble Class ---
class Bubble {
  constructor(x, y) {
    this.x = x || rand(50, W - 50);
    this.y = y || H - 80;
    this.r = rand(2, 8);
    this.speed = rand(20, 50);
    this.wobblePhase = rand(0, Math.PI * 2);
    this.wobbleAmp = rand(10, 30);
    this.opacity = rand(0.3, 0.7);
    this.alive = true;
  }

  update(dt) {
    this.y -= this.speed * dt;
    this.wobblePhase += dt * 2;
    this.x += Math.sin(this.wobblePhase) * this.wobbleAmp * dt;

    if (this.y < -20) this.alive = false;
  }

  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.opacity;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200, 230, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Inner glow
    const grad = ctx.createRadialGradient(
      this.x - this.r * 0.3, this.y - this.r * 0.3, 0,
      this.x, this.y, this.r
    );
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
    grad.addColorStop(1, 'rgba(100, 200, 255, 0)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Highlight
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.25, this.y - this.r * 0.25, this.r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.fill();

    ctx.restore();
  }
}

// --- Plant Class ---
class Plant {
  constructor(x, baseY) {
    this.x = x;
    this.baseY = baseY;
    this.segments = Math.floor(rand(4, 8));
    this.segLen = rand(20, 40);
    this.width = rand(8, 15);
    this.phase = rand(0, Math.PI * 2);
    this.speed = rand(0.5, 1.5);
    this.amp = rand(10, 25);
    this.color = `hsl(${rand(90, 140)}, ${rand(40, 70)}%, ${rand(25, 40)}%)`;
    this.colorLight = `hsl(${rand(90, 140)}, ${rand(40, 70)}%, ${rand(35, 50)}%)`;
  }

  draw(ctx, time) {
    ctx.save();
    const sway = Math.sin(time * this.speed + this.phase) * this.amp;

    ctx.beginPath();
    ctx.moveTo(this.x, this.baseY);

    let cx = this.x;
    let cy = this.baseY;
    for (let i = 0; i < this.segments; i++) {
      const t = i / this.segments;
      const segSway = sway * (1 - t * 0.5);
      const nx = cx + segSway * 0.3;
      const ny = cy - this.segLen;
      const cpx = cx + segSway * 0.5;
      const cpy = cy - this.segLen * 0.5;

      ctx.quadraticCurveTo(cpx, cpy, nx, ny);
      cx = nx;
      cy = ny;
    }

    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.width;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Leaf shapes along the stem
    for (let i = 0; i < this.segments; i++) {
      const t = i / this.segments;
      const segSway = sway * (1 - t * 0.5);
      const lx = this.x + segSway * 0.3 * (i + 1) * (this.segLen / this.segments);
      const ly = this.baseY - this.segLen * (i + 1) / this.segments;

      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(Math.sin(time * this.speed + this.phase + i) * 0.3 + (i % 2 === 0 ? 0.5 : -0.5));

      ctx.beginPath();
      ctx.ellipse(this.width * 0.8, 0, this.width * 1.5, this.width * 0.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = this.colorLight;
      ctx.globalAlpha = 0.6;
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
  }
}

// --- Hermit Crab ---
class HermitCrab {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.shellSize = rand(12, 20);
    this.bodySize = rand(8, 14);
    this.walkPhase = rand(0, Math.PI * 2);
    this.walkSpeed = rand(0.3, 0.8);
    this.walkDir = Math.random() < 0.5 ? 1 : -1;
    this.walkTimer = rand(0, 5);
    this.walkInterval = rand(3, 8);
    this.targetX = x + this.walkDir * rand(20, 60);
    this.clawPhase = rand(0, Math.PI * 2);
    this.clawSpeed = rand(1, 3);
  }

  update(dt) {
    this.walkTimer -= dt;
    if (this.walkTimer <= 0) {
      this.walkDir *= -1;
      this.walkTimer = this.walkInterval;
      this.targetX += this.walkDir * rand(30, 80);
      this.targetX = clamp(this.targetX, 50, W - 50);
    }

    this.x = lerp(this.x, this.targetX, dt * 0.5);
    this.walkPhase += dt * this.walkSpeed;
    this.clawPhase += dt * this.clawSpeed;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    const walkBob = Math.sin(this.walkPhase * 4) * 2;
    const walkTilt = Math.sin(this.walkPhase * 2) * 0.1 * this.walkDir;

    ctx.rotate(walkTilt);
    ctx.translate(0, walkBob);

    // Shell
    ctx.beginPath();
    ctx.ellipse(0, 0, this.shellSize * 0.8, this.shellSize * 0.6, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#c4884d';
    ctx.fill();
    ctx.strokeStyle = '#8a5a2a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Shell spiral pattern
    ctx.beginPath();
    ctx.arc(this.shellSize * 0.2, -this.shellSize * 0.1, this.shellSize * 0.3, 0, Math.PI * 1.5);
    ctx.strokeStyle = '#a06830';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Body
    ctx.beginPath();
    ctx.ellipse(-this.shellSize * 0.5, this.bodySize * 0.2, this.bodySize * 0.7, this.bodySize * 0.5, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#d4a060';
    ctx.fill();

    // Eyes on stalks
    const eyeStalkLen = this.bodySize * 0.8;
    const eyeWiggle = Math.sin(this.clawPhase) * 0.1;

    // Left eye
    ctx.beginPath();
    ctx.moveTo(-this.shellSize * 0.6, -this.bodySize * 0.2);
    ctx.lineTo(-this.shellSize * 0.6 - eyeStalkLen * 0.5, -this.bodySize * 1.2);
    ctx.strokeStyle = '#d4a060';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-this.shellSize * 0.6 - eyeStalkLen * 0.5, -this.bodySize * 1.2, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-this.shellSize * 0.6 - eyeStalkLen * 0.5 + 1, -this.bodySize * 1.2 - 1, 1, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // Right eye
    ctx.beginPath();
    ctx.moveTo(-this.shellSize * 0.4, -this.bodySize * 0.2);
    ctx.lineTo(-this.shellSize * 0.4 + eyeStalkLen * 0.3, -this.bodySize * 1.1);
    ctx.strokeStyle = '#d4a060';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(-this.shellSize * 0.4 + eyeStalkLen * 0.3, -this.bodySize * 1.1, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-this.shellSize * 0.4 + eyeStalkLen * 0.3 + 1, -this.bodySize * 1.1 - 1, 1, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // Claws
    const clawAngle = Math.sin(this.clawPhase * 0.5) * 0.3;

    // Left claw
    ctx.save();
    ctx.translate(-this.shellSize * 0.7, this.bodySize * 0.1);
    ctx.rotate(clawAngle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-this.bodySize * 1.2, -this.bodySize * 0.3);
    ctx.strokeStyle = '#d4a060';
    ctx.lineWidth = 3;
    ctx.stroke();
    // Claw pincers
    ctx.beginPath();
    ctx.moveTo(-this.bodySize * 1.2, -this.bodySize * 0.3);
    ctx.lineTo(-this.bodySize * 1.5, -this.bodySize * 0.6);
    ctx.lineTo(-this.bodySize * 1.8, -this.bodySize * 0.4);
    ctx.strokeStyle = '#b08040';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-this.bodySize * 1.2, -this.bodySize * 0.3);
    ctx.lineTo(-this.bodySize * 1.5, -this.bodySize * 0.1);
    ctx.lineTo(-this.bodySize * 1.8, -this.bodySize * 0.2);
    ctx.stroke();
    ctx.restore();

    // Right claw
    ctx.save();
    ctx.translate(-this.shellSize * 0.3, this.bodySize * 0.1);
    ctx.rotate(-clawAngle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(this.bodySize * 1.0, -this.bodySize * 0.4);
    ctx.strokeStyle = '#d4a060';
    ctx.lineWidth = 3;
    ctx.stroke();
    // Claw pincers
    ctx.beginPath();
    ctx.moveTo(this.bodySize * 1.0, -this.bodySize * 0.4);
    ctx.lineTo(this.bodySize * 1.3, -this.bodySize * 0.7);
    ctx.lineTo(this.bodySize * 1.6, -this.bodySize * 0.5);
    ctx.strokeStyle = '#b08040';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(this.bodySize * 1.0, -this.bodySize * 0.4);
    ctx.lineTo(this.bodySize * 1.3, -this.bodySize * 0.1);
    ctx.lineTo(this.bodySize * 1.6, -this.bodySize * 0.2);
    ctx.stroke();
    ctx.restore();

    // Legs
    for (let i = 0; i < 4; i++) {
      const legX = -this.shellSize * 0.5 + i * this.bodySize * 0.3;
      const legPhase = Math.sin(this.walkPhase * 4 + i * 0.8) * 3;
      ctx.beginPath();
      ctx.moveTo(legX, this.bodySize * 0.3);
      ctx.lineTo(legX - 3 + legPhase, this.bodySize * 0.8);
      ctx.strokeStyle = '#d4a060';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.restore();
  }
}

// --- Caustics System ---
class CausticsSystem {
  constructor() {
    this.time = 0;
  }

  update(dt) {
    this.time += dt;
  }

  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.globalCompositeOperation = 'screen';

    for (let i = 0; i < 8; i++) {
      const x = W * 0.1 + (W * 0.8) * ((i / 8) + Math.sin(this.time * 0.3 + i * 0.5) * 0.1);
      const y = 50 + Math.sin(this.time * 0.5 + i * 0.7) * 30;
      const r = 80 + Math.sin(this.time * 0.4 + i * 1.2) * 30;

      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, 'rgba(150, 220, 255, 0.3)');
      grad.addColorStop(0.5, 'rgba(100, 180, 255, 0.1)');
      grad.addColorStop(1, 'rgba(50, 100, 200, 0)');

      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    ctx.restore();
  }
}

// --- Bubbler System ---
class Bubbler {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.bubbles = [];
    this.spawnTimer = 0;
    this.spawnInterval = 0.3;
  }

  update(dt) {
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      this.bubbles.push(new Bubble(this.x + rand(-10, 10), this.y));
      this.spawnTimer = this.spawnInterval + rand(-0.1, 0.2);
    }

    for (let b of this.bubbles) {
      b.update(dt);
    }

    this.bubbles = this.bubbles.filter(b => b.alive);
  }

  draw(ctx) {
    for (let b of this.bubbles) {
      b.draw(ctx);
    }
  }
}

// --- Scene Setup ---
let fish = [];
let plants = [];
let caustics;
let bubbler;
let hermitCrab;
let time = 0;

function initScene() {
  fish = [];
  plants = [];

  // Create fish
  const numFish = Math.floor(rand(12, 21));
  for (let i = 0; i < numFish; i++) {
    const species = SPECIES[i % SPECIES.length];
    fish.push(new Fish(species));
  }

  // Create plants
  const numPlants = Math.floor(rand(6, 12));
  for (let i = 0; i < numPlants; i++) {
    const x = rand(30, W - 30);
    plants.push(new Plant(x, H - 40));
  }
  plants.sort((a, b) => a.baseY - b.baseY);

  // Caustics
  caustics = new CausticsSystem();

  // Bubbler
  bubbler = new Bubbler(W * 0.15, H - 60);

  // Hermit crab
  hermitCrab = new HermitCrab(W * 0.7, H - 45);
}

// --- Drawing Functions ---
function drawBackground(ctx) {
  // Water gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a3d6b');
  grad.addColorStop(0.3, '#0d4a7a');
  grad.addColorStop(0.6, '#0b3a5c');
  grad.addColorStop(1, '#062a40');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Light rays from surface
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 5; i++) {
    const x = W * (0.1 + i * 0.2) + Math.sin(time * 0.2 + i) * 30;
    ctx.beginPath();
    ctx.moveTo(x - 20, 0);
    ctx.lineTo(x + 20, 0);
    ctx.lineTo(x + 60, H * 0.7);
    ctx.lineTo(x - 60, H * 0.7);
    ctx.closePath();
    ctx.fillStyle = '#a0d4ff';
    ctx.fill();
  }
  ctx.restore();
}

function drawGravel(ctx) {
  // Gravel base
  ctx.save();
  const grad = ctx.createLinearGradient(0, H - 60, 0, H);
  grad.addColorStop(0, '#5a4a35');
  grad.addColorStop(0.3, '#4a3a25');
  grad.addColorStop(1, '#3a2a15');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H - 60, W, 60);

  // Gravel texture
  ctx.globalAlpha = 0.3;
  for (let i = 0; i < 100; i++) {
    const x = (i * 17 + time * 0.001) % W;
    const y = H - 50 + (i * 7 % 50);
    const r = 2 + (i % 4);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = i % 3 === 0 ? '#6a5a45' : i % 3 === 1 ? '#3a2a1a' : '#7a6a55';
    ctx.fill();
  }

  // Small shells
  ctx.globalAlpha = 0.4;
  for (let i = 0; i < 8; i++) {
    const x = (i * 137 + 50) % W;
    const y = H - 45 + (i * 13 % 30);
    ctx.beginPath();
    ctx.arc(x, y, 4 + (i % 3), 0, Math.PI, true);
    ctx.fillStyle = '#e8d8c0';
    ctx.fill();
  }

  ctx.restore();
}

function drawGlassReflection(ctx) {
  ctx.save();
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W * 0.1, H);
  ctx.fillRect(W * 0.9, 0, W * 0.1, H);
  ctx.restore();
}

// --- Main Loop ---
let lastTime = performance.now();

function update(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  time += dt;

  // Update
  caustics.update(dt);
  bubbler.update(dt);
  hermitCrab.update(dt);

  for (let f of fish) {
    f.update(dt);
  }

  // Check fish startle from other fish
  for (let i = 0; i < fish.length; i++) {
    for (let j = i + 1; j < fish.length; j++) {
      const d = dist(fish[i].x, fish[i].y, fish[j].x, fish[j].y);
      if (d < fish[i].size + fish[j].size) {
        fish[i].startleTimer = 0.3;
        fish[j].startleTimer = 0.3;
      }
    }
  }

  // Draw
  ctx.clearRect(0, 0, W, H);

  drawBackground(ctx);
  caustics.draw(ctx);

  // Draw plants (behind fish)
  for (let p of plants) {
    p.draw(ctx, time);
  }

  // Draw hermit crab
  hermitCrab.draw(ctx);

  // Draw fish
  for (let f of fish) {
    f.draw(ctx);
  }

  // Draw bubbles
  bubbler.draw(ctx);

  // Draw gravel
  drawGravel(ctx);

  // Glass reflection
  drawGlassReflection(ctx);

  requestAnimationFrame(update);
}

// --- Start ---
initScene();
requestAnimationFrame(update);

// Handle resize
window.addEventListener('resize', () => {
  resize();
  initScene();
});
</script>
