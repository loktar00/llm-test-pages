<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Lunar Lander</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Configuration ---
        const GRAVITY = 0.04;
        const MAX_THRUST = 0.11;
        const LANDING_SPEED_THRESHOLD = 0.15;
        const LANDING_TILT_THRESHOLD = 0.05;
        const FUEL_MAX = 1000;
        const FUEL_USAGE = 0.4;
        const SCROLL_SPEED = 2.5;

        // --- Terrain Generation ---
        let terrainPoints = [];
        let padIndex = 0;
        let padLength = 160;
        let stars = [];

        function generateStars() {
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height * 0.7,
                    size: Math.random() * 1.5,
                    alpha: Math.random()
                });
            }
        }

        function generateTerrain() {
            terrainPoints = [];
            let x = 0;
            let y = height - 100;
            
            // Initial flat area off-screen left (or previous landing spot)
            // We actually generate ahead and scroll.
            // Let's generate a long strip.
            
            // Start from a random height
            y = height - (Math.random() * 300 + 100);
            
            while(x < width * 3) {
                // Random noise for terrain shape
                let change = (Math.random() - 0.5) * 15;
                
                // Smooth out jaggedness slightly
                y += change;
                
                // Clamp height
                if (y > height - 50) y = height - 50;
                if (y < height - 400) y = height - 400;

                terrainPoints.push({ x, y });
                
                // Create flat pad area
                // If we are far enough along, insert pad
                if (x > width / 2 && x < width / 2 + padLength) {
                    terrainPoints[terrainPoints.length-1].y = height - 200; // Flat zone
                }
                
                x += 2; // Resolution
            }
            
            padIndex = Math.floor((width/2) / 2);
        }

        // --- Game Entities ---
        const lander = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 0,
            vxAngle: 0,
            fuel: FUEL_MAX,
            thrusting: false,
            crashed: false,
            landed: false,
            width: 20,
            height: 24,
            color: '#eee'
        };

        const particles = [];

        // --- Physics & Logic ---
        function updateLander() {
            if (lander.crashed) return;

            // Gravity
            lander.vy += GRAVITY;

            // AI Control Logic
            let thrust = 0;
            let control = 0; // -1 left, 1 right

            // Find target landing pad
            // The pad is roughly centered on screen when generated, but we scroll.
            // We need to find where the flat pad is relative to lander.
            
            // Simple terrain check: look straight down
            let groundY = height; // default bottom
            let onPad = false;
            
            // Raycast down to find ground
            // Since terrain is a line, we check points near x
            let tx = lander.x;
            let p1 = terrainPoints.find(p => p.x >= tx);
            if (p1) {
                groundY = p1.y;
                // Check if this point is part of the pad logic
                // Our pad generation was hardcoded at width/2 in the previous function,
                // but with scrolling logic, it's easier to define the pad mathematically
                // or check the Y value consistency.
                // For this simplified version, let's just check if we are within a specific X range 
                // of the generated flat area.
                // Actually, let's iterate the array to see if it's flat.
                let isFlat = false;
                let checkStart = Math.floor(tx / 2) - 5;
                let checkEnd = Math.floor(tx / 2) + 5;
                if (checkStart >= 0 && checkEnd < terrainPoints.length) {
                    let refY = terrainPoints[checkStart].y;
                    for(let i=checkStart; i<=checkEnd; i++) {
                        if (Math.abs(terrainPoints[i].y - refY) > 5) {
                            isFlat = false;
                            break;
                        }
                        isFlat = true;
                    }
                }
                onPad = isFlat;
            }

            if (lander.landed) {
                // Lift off logic
                if (lander.y > groundY - 100) {
                    lander.landed = false;
                    lander.vx = 0.5; // slight drift
                }
            }

            if (lander.landed) {
                // Touchdown phase
                thrust = GRAVITY; // Hover
                if (lander.y < groundY - 80) {
                     lander.landed = false; // Take off
                }
            } else {
                // Descent logic
                
                // Distance to ground
                let distY = groundY - lander.y;
                
                // Vertical Speed Control
                if (distY > 0) {
                    if (lander.vy > LANDING_SPEED_THRESHOLD) {
                        thrust = MAX_THRUST;
                    } else if (lander.vy < -0.5) { // Moving up too fast
                        thrust = 0;
                    } else {
                        thrust = GRAVITY * 0.5; // Gentle float
                    }
                }

                // Horizontal Control (Steer to center of pad)
                // We need to know where the pad center is.
                // Since we generate it at width/2 initially, but we scroll,
                // let's assume the "Center of the world" is currently moving.
                // We'll approximate: If we are not on pad, steer towards the center of the visible flat area.
                
                if (!onPad && distY < 300) {
                    // Determine pad center. 
                    // In this generator, pad is around width/2. 
                    // Let's scan the terrain ahead to find the center of the flat zone.
                    let centerOffset = 0;
                    let foundCenter = false;
                    
                    // Scan points ahead
                    let startIdx = Math.floor(lander.x / 2);
                    if (startIdx < 0) startIdx = 0;
                    
                    for(let i=startIdx; i < startIdx + 200; i++) {
                        if(i >= terrainPoints.length) break;
                        let p = terrainPoints[i];
                        if (Math.abs(p.y - (height-200)) < 10) { // Is flat
                            // Found flat
                            // Find center of flat
                            let c = p.x;
                            for(let j=i+1; j < i+50; j++) {
                                if(j >= terrainPoints.length) break;
                                if (Math.abs(terrainPoints[j].y - (height-200)) > 10) {
                                    c = (c + terrainPoints[j].x) / 2;
                                    foundCenter = true;
                                    break;
                                }
                            }
                            if (!foundCenter) c += 50; // Guess
                            centerOffset = c - lander.x;
                            break;
                        }
                    }

                    if (centerOffset !== 0) {
                        // Steer towards center
                        if (centerOffset > 10) control = 1;
                        else if (centerOffset < -10) control = -1;
                        else control = 0;
                        
                        // Apply horizontal thrust
                        if (Math.abs(control) > 0) {
                            lander.vx += control * 0.03;
                            lander.vxAngle += control * 0.005; // Bank
                        }
                    }
                }
            }

            // Apply Thrust
            lander.thrusting = thrust > GRAVITY;
            if (lander.thrusting && lander.fuel > 0) {
                lander.vy -= thrust;
                lander.fuel -= FUEL_USAGE;
                
                // Rotate based on input
                lander.vxAngle += control * 0.008;
                
                // Spawn particles
                spawnThrustParticles();
            } else {
                lander.thrusting = false;
            }

            // Physics integration
            lander.vxAngle *= 0.95; // Damping
            lander.angle = lander.vxAngle; 
            lander.x += lander.vx;
            lander.y += lander.vy;

            // Collision
            if (groundY - lander.y < lander.height/2) {
                handleCollision(groundY);
            }
        }

        function handleCollision(groundY) {
            lander.y = groundY - lander.height/2;
            
            // Check landing quality
            let speed = Math.abs(lander.vy);
            let tilt = Math.abs(lander.angle);

            if (speed < LANDING_SPEED_THRESHOLD && tilt < LANDING_TILT_THRESHOLD) {
                // Success
                lander.vx = 0;
                lander.vy = 0;
                lander.vxAngle = 0;
                lander.angle = 0;
                lander.landed = true;
                lander.thrusting = false;
                spawnLandingDust(0.5);
            } else {
                // Crash
                lander.crashed = true;
                lander.thrusting = false;
                spawnExplosion(lander.x, lander.y + 10);
                spawnLandingDust(3);
            }
        }

        // --- Particles ---
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                
                if (type === 'thrust') {
                    this.vx = (Math.random() - 0.5) * 1 + (Math.random() * -0.5); // drift + base
                    this.vy = Math.random() * 2 + 1; // Down
                    this.size = Math.random() * 3 + 1;
                    this.decay = 0.03 + Math.random() * 0.03;
                    this.color = `hsl(${Math.random()*40 + 10}, 100%, 50%)`;
                } else if (type === 'dust') {
                    this.vx = (Math.random() - 0.5) * 4;
                    this.vy = -Math.random() * 3 - 1;
                    this.size = Math.random() * 4 + 2;
                    this.decay = 0.01 + Math.random() * 0.02;
                    this.color = `rgba(200, 200, 200, `;
                } else if (type === 'explosion') {
                    this.vx = (Math.random() - 0.5) * 6;
                    this.vy = (Math.random() - 0.5) * 6;
                    this.size = Math.random() * 5 + 2;
                    this.decay = 0.02;
                    this.color = `hsl(${Math.random()*60}, 100%, 60%)`;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                if (this.type === 'thrust') {
                    this.vx *= 0.9;
                    this.vy *= 0.95;
                    this.size *= 0.95;
                } else {
                    this.vy += 0.02; // Gravity on dust
                }
            }

            draw(ctx, camX) {
                ctx.globalAlpha = this.life;
                if (this.type === 'dust') {
                    ctx.fillStyle = this.color + this.life + ')';
                    ctx.beginPath();
                    ctx.arc(this.x - camX, this.y, this.size, 0, Math.PI*2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x - camX, this.y, this.size, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
        }

        function spawnThrustParticles() {
            // Calculate nozzle position
            let nozX = lander.x + Math.sin(lander.angle) * (lander.height/2);
            let nozY = lander.y + Math.cos(lander.angle) * (lander.height/2);
            
            for(let i=0; i<3; i++) {
                particles.push(new Particle(nozX, nozY, 'thrust'));
            }
        }

        function spawnLandingDust(intensity) {
            for(let i=0; i<10 * intensity; i++) {
                particles.push(new Particle(lander.x + (Math.random()-0.5)*20, lander.y + 10, 'dust'));
            }
        }

        function spawnExplosion(x, y) {
            for(let i=0; i<50; i++) {
                particles.push(new Particle(x, y, 'explosion'));
            }
        }

        // --- Rendering ---
        function drawTerrain(camX) {
            ctx.save();
            ctx.lineWidth = 2;
            
            // Draw stars
            ctx.fillStyle = '#FFF';
            stars.forEach(s => {
                // Parallax effect for stars
                let sx = (s.x - camX * 0.1) % width;
                if (sx < 0) sx += width;
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(sx, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            // Draw Terrain
            ctx.beginPath();
            ctx.moveTo(0, height);
            
            // Optimization: only draw visible points
            let startIdx = Math.floor(camX / 2);
            let endIdx = Math.floor((camX + width) / 2);
            
            if (startIdx < 0) startIdx = 0;
            if (endIdx >= terrainPoints.length) endIdx = terrainPoints.length - 1;

            if (terrainPoints.length > 0) {
                // Start from bottom left of screen to the first point
                ctx.lineTo(0 - camX, height); 
                
                for (let i = startIdx; i <= endIdx; i++) {
                    ctx.lineTo(terrainPoints[i].x - camX, terrainPoints[i].y);
                }
                
                ctx.lineTo(terrainPoints[endIdx].x - camX, height);
            }

            ctx.closePath();
            
            // Gradient for terrain
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#222');
            grad.addColorStop(1, '#050505');
            ctx.fillStyle = grad;
            ctx.fill();

            // Top border
            ctx.strokeStyle = '#aaa';
            ctx.stroke();
            ctx.restore();
        }

        function drawLander() {
            ctx.save();
            ctx.translate(lander.x, lander.y);
            ctx.rotate(lander.angle);

            // Draw Lander Body
            ctx.fillStyle = lander.crashed ? '#f00' : lander.color;
            ctx.beginPath();
            ctx.moveTo(0, -lander.height/2); // Top
            ctx.lineTo(lander.width/2, lander.height/2); // Bottom Right
            ctx.lineTo(-lander.width/2, lander.height/2); // Bottom Left
            ctx.closePath();
            ctx.fill();
            
            // Window
            ctx.fillStyle = '#00f';
            ctx.beginPath();
            ctx.arc(0, -lander.height/4, 4, 0, Math.PI*2);
            ctx.fill();

            // Landing Gear
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-lander.width/2, lander.height/2);
            ctx.lineTo(-lander.width/2 - 5, lander.height/2 + 5);
            ctx.moveTo(lander.width/2, lander.height/2);
            ctx.lineTo(lander.width/2 + 5, lander.height/2 + 5);
            ctx.stroke();

            // Thruster Glow
            if (lander.thrusting) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'orange';
                ctx.fillStyle = 'rgba(255, 165, 0, 0.8)';
                ctx.beginPath();
                ctx.moveTo(-5, lander.height/2);
                ctx.lineTo(5, lander.height/2);
                ctx.lineTo(0, lander.height/2 + 20 + Math.random()*10);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        function drawUI() {
            ctx.save();
            ctx.fillStyle = '#0f0';
            ctx.font = '16px Courier New';
            
            // Fuel Bar
            ctx.fillText("FUEL", 20, 30);
            ctx.strokeStyle = '#0f0';
            ctx.strokeRect(20, 40, 100, 10);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(20, 40, (lander.fuel / FUEL_MAX) * 100, 10);

            // Status
            let status = "DESCENT";
            if (lander.landed) status = "SUCCESS";
            if (lander.crashed) status = "CRASHED";
            if (lander.vxAngle > 0.5) status = "TILT!";
            
            ctx.fillStyle = lander.crashed ? 'red' : '#fff';
            ctx.fillText(status, 20, 80);

            // VSI (Vertical Speed Indicator)
            ctx.fillText("V.SPD", width - 80, 30);
            let vsi = (lander.vy * 100).toFixed(0);
            ctx.fillText(vsi, width - 80, 50);

            ctx.restore();
        }

        // --- Main Loop ---
        let cameraX = 0;

        function resetGame() {
            lander.x = 100;
            lander.y = 100;
            lander.vx = 0;
            lander.vy = 0;
            lander.angle = 0;
            lander.vxAngle = 0;
            lander.fuel = FUEL_MAX;
            lander.crashed = false;
            lander.landed = false;
            lander.thrusting = false;
            cameraX = 0;
            generateTerrain();
            generateStars();
        }

        function loop() {
            ctx.clearRect(0, 0, width, height);

            // Update
            updateLander();

            // Camera follow logic
            // Smoothly interpolate camera x to lander x, but keep lander on left side
            let targetCamX = lander.x - width / 3;
            cameraX += (targetCamX - cameraX) * 0.1;
            if (cameraX < 0) cameraX = 0;

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Auto Respawn if crashed or landed for too long (simple loop)
            if (lander.crashed) {
                setTimeout(resetGame, 2000);
                lander.crashed = false; // prevent double trigger
            } else if (lander.landed) {
                // Wait a bit then lift off logic is handled in updateLander
                // If landed for too long, reset
                // (Implementation simplified: just lift off)
            }

            // Draw
            // Lighting Effect for Thruster
            ctx.save();
            if (lander
