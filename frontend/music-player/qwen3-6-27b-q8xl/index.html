<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthwave Player</title>
<style>
  :root {
    --primary: #ff007f;
    --secondary: #7f00ff;
    --bg: #0f0c29;
    --card-bg: #1a1635;
    --text: #ffffff;
    --text-muted: #a3a3a3;
    --track-color: rgba(255, 255, 255, 0.1);
    --progress-color: #00f2ff;
    --thumb-size: 14px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: background 1s ease;
  }

  /* Ambient Background Glow */
  .ambient-glow {
    position: absolute;
    width: 150vw;
    height: 150vh;
    background: radial-gradient(circle at center, rgba(127, 0, 255, 0.15), transparent 60%);
    z-index: -1;
    animation: pulse-bg 10s infinite alternate;
  }

  @keyframes pulse-bg {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.1); opacity: 0.8; }
  }

  /* Player Card */
  .player-card {
    width: 340px;
    background: var(--card-bg);
    border-radius: 30px;
    padding: 30px;
    box-shadow: 
      0 20px 50px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    backdrop-filter: blur(20px);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .player-card:hover {
    transform: translateY(-5px);
    box-shadow: 
      0 30px 60px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.1);
  }

  /* Album Art */
  .art-wrapper {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    margin-bottom: 25px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .art-wrapper.playing {
    animation: spin 20s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .album-art {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    /* The CSS Art Piece */
    background: 
      conic-gradient(
        from 180deg at 50% 50%, 
        #ff007f 0deg, 
        #7f00ff 90deg, 
        #00f2ff 180deg, 
        #ff007f 270deg, 
        #ff007f 360deg
      );
    position: relative;
    overflow: hidden;
  }

  /* Decorative elements inside art */
  .album-art::after {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,0.8) 100%),
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255,255,255,0.1) 10px,
        rgba(255,255,255,0.1) 11px
      );
  }

  /* Track Info */
  .track-info {
    text-align: center;
    margin-bottom: 30px;
    width: 100%;
  }

  .track-title {
    color: var(--text);
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 5px;
    letter-spacing: 0.5px;
  }

  .track-artist {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Controls Container */
  .controls-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 25px;
    padding: 0 10px;
  }

  /* Navigation Buttons */
  .nav-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text);
    opacity: 0.6;
    transition: all 0.2s ease;
    padding: 10px;
  }

  .nav-btn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  .nav-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }

  /* Play Button & Progress Ring */
  .play-wrapper {
    position: relative;
    width: 70px;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .progress-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg); /* Start at top */
  }

  .progress-ring__circle-bg {
    stroke: var(--track-color);
    stroke-width: 4;
    fill: transparent;
  }

  .progress-ring__circle {
    stroke: var(--progress-color);
    stroke-width: 4;
    fill: transparent;
    stroke-linecap: round;
    stroke-dasharray: 188.5; /* 2 * PI * r (r=30) */
    stroke-dashoffset: 188.5;
    transition: stroke-dashoffset 0.1s linear;
    filter: drop-shadow(0 0 4px var(--progress-color));
  }

  .play-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    transition: background 0.3s ease, transform 0.2s ease;
    position: relative;
    z-index: 2;
    backdrop-filter: blur(5px);
  }

  .play-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.05);
  }

  .play-btn:active {
    transform: scale(0.95);
  }

  /* Icon Morphing Logic */
  .icon-group {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .play-icon, .pause-icon {
    width: 24px;
    height: 24px;
    fill: currentColor;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .play-icon {
    margin-left: 3px; /* Optical centering */
    transform: scale(1);
    opacity: 1;
  }

  .pause-icon {
    opacity: 0;
    transform: scale(0.5);
  }

  .is-playing .play-icon {
    opacity: 0;
    transform: scale(0.5);
  }

  .is-playing .pause-icon {
    opacity: 1;
    transform: scale(1);
  }

  /* Time Display */
  .time-display {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 0 5px;
    margin-bottom: 20px;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* Volume Control */
  .volume-container {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .volume-icon {
    color: var(--text-muted);
    display: flex;
    align-items: center;
  }
  
  .volume-icon svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  .volume-slider-wrapper {
    flex-grow: 1;
    height: 6px;
    background: var(--track-color);
    border-radius: 3px;
    position: relative;
    cursor: pointer;
  }

  .volume-fill {
    height: 100%;
    background: var(--text);
    border-radius: 3px;
    width: 70%; /* Default volume */
    position: relative;
    transition: background 0.2s;
  }

  .volume-thumb {
    width: var(--thumb-size);
    height: var(--thumb-size);
    background: #fff;
    border-radius: 50%;
    position: absolute;
    right: calc(var(--thumb-size) / -2);
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: grab;
  }

  .volume-slider-wrapper:hover .volume-thumb {
    transform: translateY(-50%) scale(1.2);
  }

  .volume-slider-wrapper:active .volume-thumb {
    cursor: grabbing;
    transform: translateY(-50%) scale(1.3);
  }

</style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="player-card">
    <div class="art-wrapper" id="artWrapper">
      <div class="album-art"></div>
    </div>

    <div class="track-info">
      <div class="track-title">Midnight Drive</div>
      <div class="track-artist">Neon Horizon</div>
    </div>

    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="totalTime">2:45</span>
    </div>

    <div class="controls-container">
      <button class="nav-btn" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <div class="play-wrapper">
        <svg class="progress-ring" width="70" height="70">
          <circle class="progress-ring__circle-bg" cx="35" cy="35" r="30"></circle>
          <circle class="progress-ring__circle" id="progressCircle" cx="35" cy="35" r="30"></circle>
        </svg>
        <button class="play-btn" id="playBtn" aria-label="Play/Pause">
          <div class="icon-group">
            <!-- Play Icon -->
            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <!-- Pause Icon -->
            <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </div>
        </button>
      </div>

      <button class="nav-btn" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="volume-container">
      <div class="volume-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>
      <div class="volume-slider-wrapper" id="volumeSlider">
        <div class="volume-fill" id="volumeFill">
          <div class="volume-thumb"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  // State
  const trackDuration = 165; // seconds (2:45)
  let currentTime = 0;
  let isPlaying = false;
  let animationFrame;
  
  // DOM Elements
  const playBtn = document.getElementById('playBtn');
  const artWrapper = document.getElementById('artWrapper');
  const progressCircle = document.getElementById('progressCircle');
  const currentTimeEl = document.getElementById('currentTime');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeFill = document.getElementById('volumeFill');
  const ambientGlow = document.querySelector('.ambient-glow');
  const root = document.documentElement;

  // Constants
  const circleRadius = 30;
  const circumference = 2 * Math.PI * circleRadius;
  progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
  progressCircle.style.strokeDashoffset = circumference;

  // Format Time
  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // Update Progress Ring
  function setProgress(percent) {
    const offset = circumference - (percent / 100) * circumference;
    progressCircle.style.strokeDashoffset = offset;
  }

  // Play/Pause Logic
  function togglePlay() {
    isPlaying = !isPlaying;
    
    if (isPlaying) {
      playBtn.classList.add('is-playing');
      artWrapper.classList.add('playing');
      // Change tint slightly when playing
      root.style.setProperty('--progress-color', '#ff007f');
      ambientGlow.style.background = 'radial-gradient(circle at center, rgba(255, 0, 127, 0.2), transparent 60%)';
      animate();
    } else {
      playBtn.classList.remove('is-playing');
      artWrapper.classList.remove('playing');
      // Revert tint
      root.style.setProperty('--progress-color', '#00f2ff');
      ambientGlow.style.background = 'radial-gradient(circle at center, rgba(127, 0, 255, 0.15), transparent 60%)';
      cancelAnimationFrame(animationFrame);
    }
  }

  // Animation Loop
  function animate() {
    if (!isPlaying) return;

    // Simulate time passing (1 frame approx 16ms, so add small amount)
    // Let's make it play faster for demo purposes or real time?
    // Real time: add 0.016 per frame.
    currentTime += 0.016; 

    if (currentTime >= trackDuration) {
      currentTime = 0; // Loop track
    }

    const progressPercent = (currentTime / trackDuration) * 100;
    setProgress(progressPercent);
    currentTimeEl.textContent = formatTime(currentTime);

    animationFrame = requestAnimationFrame(animate);
  }

  // Volume Slider Logic
  let isDraggingVolume = false;

  function updateVolume(x) {
    const rect = volumeSlider.getBoundingClientRect();
    let percentage = ((x - rect.left) / rect.width) * 100;
    percentage = Math.max(0, Math.min(100, percentage));
    volumeFill.style.width = `${percentage}%`;
  }

  volumeSlider.addEventListener('mousedown', (e) => {
    isDraggingVolume = true;
    updateVolume(e.clientX);
  });

  window.addEventListener('mousemove', (e) => {
    if (isDraggingVolume) {
      updateVolume(e.clientX);
    }
  });

  window.addEventListener('mouseup', () => {
    isDraggingVolume = false;
  });

  // Event Listeners
  playBtn.addEventListener('click', togglePlay);

  // Initialize
  setProgress(0);
</script>
</body>
</html>
