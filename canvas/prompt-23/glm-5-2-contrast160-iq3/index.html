<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Endless Tunnel</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, cx, cy, scaleBase;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W * 0.5;
  cy = H * 0.5;
  scaleBase = Math.min(W, H);
  buildSky();
}
window.addEventListener('resize', resize);

const rand = (a, b) = a + Math.random() * (b - a);

const DEPTH = 1200;
const Z_START = 70;
const Z_END = 12000;
const N = 110;

class Tunnel {
  constructor() {
    this.sliceZ = [];
    for (let i = 0; i < N; i++) this.sliceZ[i] = Z_START + i * 150;
    this.cameraZ = 0;
    this.speed = 6;
    this.baseSpeed = 6;
    this.time = 0;
    this.h = 400;
    this.particles = [];
    this.streaks = [];
    this.skyStars = [];
    this.skyBlobs = [];
    for (let i = 0; i < 150; i++) this.particles.push(new Particle());
    for (let i = 0; i < 80; i++) this.streaks.push(new Streak());
    for (let i = 0; i < 150; i++) this.skyStars.push({ x: rand(-1, 1), y: rand(-1, 1), r: rand(0.2, 2), a: rand(0.4, 1), tw: rand(0.5, 1.5), tp: rand(0, 6.28) });
    for (let i = 0; i < 35; i++) this.skyBlobs.push({ x: rand(-0.8, 0.8), y: rand(-0.8, 0.8), r: rand(200, 400), col: ['#3a1a6f', '#3a1a40', '#4a2090', '#2a1a50'][Math.floor(Math.random()*4)], a: rand(0.04, 0.12), drift: rand(-1, 1) * 0.0001 });
  }
}

class Particle {
  constructor() { this.reset(true); }
  reset(initial) {
    this.z = initial ? rand(Z_START, Z_END) : Z_END * 0.95 + Math.random() * 100;
    this.angle = rand(0, Math.PI * 2);
    this.radius = rand(0.4, 1.5);
    this.size = rand(0.5, 1.5);
    this.color = this.pickColor();
    this.spin = rand(-0.2, 0.2);
  }
  pickColor() {
    const c = Math.random();
    if (c < 0.2) return 'rgba(180,220,255,';
    if (c < 0.4) return 'rgba(255,180,90,';
    if (c < 0.6) return 'rgba(200,150,255,';
    if (c < 0.7) return 'rgba(255,180,200,';
    if (c < 0.85) return 'rgba(120,180,255,';
    return 'rgba(160,160,200,';
  }
  update(dt, speed) {
    this.z -= speed;
    this.angle += this.spin * 0.01;
    if (this.z < 1) this.reset(false);
  }
  draw(cx, cy, scale, drift) {
    const sc = scale / (scale + this.z);
    const rx = Math.cos(this.angle) * this.radius * 400;
    const ry = Math.sin(this.angle) * this.radius * 400;
    const sx = cx + (rx + drift.x) * sc;
    const sy = cy + (ry + drift.y) * sc;
    const sz = this.size * sc;
    const alpha = Math.min(1, sc * 2.2);
    ctx.fillStyle = this.color + alpha + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.5, sz * 2.5), 0, Math.PI * 2);
    ctx.fill();
  }
}

class Streak {
  constructor() { this.reset(true); }
  reset(initial) {
    this.z = initial ? rand(Z_START, Z_END) : Z_END + rand(0, 500);
    this.angle = rand(0, Math.PI * 2);
    this.radius = rand(0.1, 0.3);
    this.len = rand(20, 150);
    this.color = this.pickColor();
  }
  pickColor() {
    const r = Math.random();
    if (r < 0.3) return 'rgba(180,220,255,';
    if (r < 0.55) return 'rgba(255,180,90,';
    if (r < 0.75) return 'rgba(200,150,255,';
    return 'rgba(120,180,255,';
  }
  update(dt, speed) {
    this.z -= speed * 2.2;
    if (this.z < 1) this.reset(false);
  }
  draw(cx, cy, scale, drift) {
    const sc0 = scale / (scale + this.z);
    const sc1 = scale / (scale + this.z + this.len);
    const rx = Math.cos(this.angle) * this.radius * 400;
    const ry = Math.sin(this.angle) * this.radius * 400;
    const x0 = cx + (rx + drift.x) * sc0;
    const y0 = cy + (ry + drift.y) * sc0;
    const x1 = cx + (rx + drift.x) * sc1;
    const y1 = cy + (ry + drift.y) * sc1;
    const a = Math.min(1, sc0 * 3);
    ctx.strokeStyle = this.color + a + ')';
    ctx.lineWidth = Math.max(1, sc0 * 3);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
}

function buildSky() {
  skyCanvas = document.createElement('canvas');
  skyCanvas.width = 128;
  skyCanvas.height = 128;
  const sc = skyCanvas.getContext('2d');
  const r = 64;
  sc.fillStyle = 'rgba(0,0,0,0)';
  sc.fillRect(0, 0, 128, 128);
  const g = sc.createRadialGradient(64, 64, 0, 64, 64, r);
  g.addColorStop(0, 'rgba(160,120,180,0.3)');
  g.addColorStop(0.5, 'rgba(120,100,150,0.15)');
  g.addColorStop(1, 'rgba(120,80,150,0)');
  sc.fillStyle = g;
  sc.beginPath();
  sc.arc(64, 64, r, 0, Math.PI * 2);
  sc.fill();
}
let skyCanvas;
buildSky();

function getSlice(j, tunnel) {
  const z = tunnel.sliceZ[j];
  const sc = scaleBase / (scaleBase + z);
  const t = (tunnel.cameraZ + z) * 0.005;
  const n = j;
  const wob = Math.sin(t * 0.4 + n * 0.1) * 0.4 + Math.cos(t * 0.7 + n * 0.05) * 0.3;
  const twist = (t * 1.1 + Math.sin(t * 0.5) * 0.3) * 1.5;
  const wobbleX = Math.sin(t * 0.5 + n * 0.13) * 100;
  const wobbleY = Math.cos(t * 0.6 + n * 0.17) * 50 + Math.sin(t * 0.3) * 30;
  const baseR = 400 + wob * 60;
  const seed = Math.sin(Math.floor(t * 1.5) + n * 0.0001);
  const openR = ((seed > 0.98) && Math.random() < 0.15) ? 1.0 : 0;
  const isHue = (((  (j&7) === 0 )  ) ) ? 1 : 0;
  const colorShift = Math.sin(t * 0.3 + n * 0.02) * 0.5 + 0.5;
  return { z, sc, twist, wobbleX, wobbleY, baseR, openR, isHue, colorShift, t, n };
}

function drawSlice(j, tunnel, drift, sliceData) {
  const { z, sc, twist, wobbleX, wobbleY, baseR, openR, isHue, colorShift } = sliceData;
  if (z < 1) return;

  const sx = cx + (wobbleX + drift.x) * sc;
  const sy = cy + (wobbleY + drift.y) * sc;
  const R = baseR * sc;

  const segments = 24;
  const points = [];
  for (let i = 0; i < segments; i++) {
    const u = (i / segments) * Math.PI * 2;
    const twistU = u + twist;
    const wobR = Math.sin(u * 2 + tunnel.time * 0.4) * 30 + Math.cos(u * 3 - tunnel.time * 0.6) * 20;
    const r = (baseR + wobR) * sc;
    const x = Math.cos(twistU) * r;
    const y = Math.sin(twistU) * r * 0.4;
    points.push({ x: sx + x, y: sy + y });
  }

  // Determine colors
  const c = isHue ? 1 : colorShift;
  let r, g, b;
  if (c < 0.2) { r = 130; g = 200; b = 255; } // cyan
  else if (c < 0.4) { r = 200; g = 130; b = 240; } // purple
  else if (c < 0.6) { r = 200; g = 130; b = 240; } // purple
  else if (c < 0.75) { r = 130; g = 200; b = 255; } // cyan
  else if (c < 0.8) { r = 200; g = 130; b = 240; } // purple
  else { r = 130; g = 200; b = 255; }
  const baseAlpha = Math.min(1, sc * 4.5) * (0.3 + colorShift * 0.7);

  if (isHue) {
    const hue = (tunnel.time * 10 + colorShift * 120) % 256;
    ctx.strokeStyle = `hsla(${hue}, 80%, 65%, ${baseAlpha * 1.2})`;
  } else {
    ctx.strokeStyle = `rgba(${r},${g},${b},${${baseAlpha}})`;
  }
  ctx.lineWidth = Math.max(1, 2 * sc);
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  ctx.fill = false;
  ctx.stroke();

  // Opening: draw sky inside
  if (openR) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.closePath();
    ctx.clip();
    // sky gradient
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    grad.addColorStop(0, 'rgba(40,20,80,0.8)');
    grad.addColorStop(1, 'rgba(0,0,5,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // stars
    for (let s of tunnel.skyStars) {
      const a = s.a * (0.5 + Math.sin(tunnel.time * s.tw + s.tp) * 0.5);
      ctx.fillStyle = `rgba(180,200,255,${a})`;
      ctx.beginPath();
      ctx.arc(s.x * W * 0.5 + cx, s.y * H * 0.5 + cy, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  // outline glow
    ctx.strokeStyle = `rgba(${r},${g},${b},${${baseAlpha * 2})}`;
    ctx.lineWidth = Math.max(2, 4 * sc);
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.closePath();
    ctx.stroke();
  }
}

let tunnel = new Tunnel();
resize();

function update(dt) {
  // Speed varies automatically
  const speedTarget = tunnel.baseSpeed * (1 + Math.sin(tunnel.time * 0.04) * 0.4 + Math.sin(tunnel.time * 0.13) * 0.5);
  tunnel.speed += (speedTarget - tunnel.speed) * 0.02;
  tunnel.speed += (Math.random() - 0.5) * 0.5;
  tunnel.speed = Math.max(2, Math.min(tunnel.speed, 30));

  tunnel.cameraZ += tunnel.speed;
  tunnel.time += dt * 0.001;

  // Update slices ( move them backward as if we move forward
  for (let i = 0; i < tunnel.sliceZ.length; i++) {
    tunnel.sliceZ[i] -= tunnel.speed;
  }
  // Recycle
  for (let i = 0; i < tunnel.sliceZ.length; i++) {
    if (tunnel.sliceZ[i] < 1) {
      // find the farthest slice
      let maxZ = 0;
      for (let k = 0; k < tunnel.sliceZ.length; k++) maxZ = Math.max(maxZ, tunnel.sliceZ[k]);
      tunnel.sliceZ[i] = maxZ + 150 + Math.random() * 50;
    }
  }
  // Sort by z ( painter's
  tunnel.sliceZ.sort((a, b) => b - a);

  for (let p of tunnel.particles) p.update(dt, tunnel.speed);
  for (let s of tunnel.streaks) s.update(dt, tunnel.speed);
}

function drawBackground() {
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  grad.addColorStop(0, '#0a0118');
  grad.addColorStop(0.5, '#05010a');
  grad.addColorStop(1, '#000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // distant blobs
  for (let b of tunnel.skyBlobs) {
    b.x += b.drift;
    if (b.x < -1) b.x = 1;
    const x = cx + b.x * W * 0.5;
    const y = cy + b.y * H * 0.5;
    ctx.drawImage(skyCanvas, x - b.r * 0.5, y - b.r * 0.5, b.r, b.r);
  }
}

function drawForeground() {
  // tunnel slices ( painter's algorithm - already sorted
  const drift = { x: Math.sin(tunnel.time * 0.4) * 12, y: Math.cos(tunnel.time * 0.6) * 8 };
  // draw streaks first
  for (let s of tunnel.streaks) s.draw(cx, cy, scaleBase, drift);
  // slices
  for (let j = 0; j < tunnel.sliceZ.length; j++) {
    const sliceData = getSlice(j, tunnel);
    drawSlice(j, tunnel, drift, sliceData);
  }
  // particles
  for (let p of tunnel.particles) p.draw(cx, cy, scaleBase, drift);

  // brightness pulses
  const pulse = (Math.sin(tunnel.time * 0.5) > 0.99) ? 1 : 0;
  if (tunnel.speed > 25) {
    const a = (tunnel.speed - 25) * 0.02;
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.1, a * 0.3)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

let lastTime = 0;
function loop(time) {
  const dt = Math.min(33, time - lastTime || 16);
  lastTime = time;
  // motion trail fade
  ctx.fillStyle = 'rgba(0,0,5,0.2)';
  ctx.fillRect(0, 0, W, H);
  update(dt);
  drawBackground();
  drawForeground();
  // vignette
  const v = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.2, cx, cy, Math.max(W, H) * 0.6);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,5,0.85)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
