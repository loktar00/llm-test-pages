<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasteland Derby: Auto Combat</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1510; /* Dark rusty background */
            font-family: 'Courier New', Courier, monospace;
            color: #dcdcdc;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
            font-size: 20px;
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .bar-container {
            width: 200px;
            height: 20px;
            background: #332211;
            border: 2px solid #554433;
            margin-bottom: 5px;
            position: relative;
        }
