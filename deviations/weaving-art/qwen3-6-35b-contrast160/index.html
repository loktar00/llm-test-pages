<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width=device-width">
<title>Generative Weaving Art</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Color Palette Generator ---
  function generatePalette() {
    const baseHue = Math.random() * 360;
    const scheme = Math.floor(Math.random() * 4);
    const colors = [];
    const numColors = 4 + Math.floor(Math.random() * 3);
    const satMin = 40, satMax = 80;
    const lightMin = 25, lightMax = 70;

    for (let i = 0; i < numColors; i++) {
      let h, s, l;
      if (scheme === 0) { // Analogous
        h = baseHue + (i - numColors/2) * 15 + (Math.random()-0.5)*10;
        s = satMin + Math.random() * (satMax - satMin);
        l = lightMin + Math.random() * (lightMax - lightMin);
      } else if (scheme === 1) { // Complementary
        const comp = baseHue + 180;
        h = Math.random() < 0.5 ? baseHue + (Math.random()-0.5)*40 : comp + (Math.random()-0.5)*40;
        s = satMin + Math.random() * (satMax - satMin);
        l = lightMin + Math.random() * (lightMax - lightMin);
      } else if (scheme === 2) { // Triadic
        h = baseHue + (i % 3) * 120 + (Math.random()-0.5)*20;
        s = satMin + Math.random() * (satMax - satMin);
        l = lightMin + Math.random() * (lightMax - lightMin);
      } else { // Split complementary
        const split1 = baseHue + 150;
        const split2 = baseHue + 210;
        const choices = [baseHue, split1, split2];
        h = choices[i % 3] + (Math.random()-0.5)*30;
        s = satMin + Math.random() * (satMax - satMin);
        l = lightMin + Math.random() * (lightMax - lightMin);
      }
      colors.push({
        h: ((h % 360) + 360) % 360,
        s: Math.max(0, Math.min(100, s)),
        l: Math.max(0, Math.min(100, l))
      });
    }
    return colors;
  }

  function hslStr(c, alpha) {
    if (alpha !== undefined) return `hsla(${c.h},${c.s}%,${c.l}%,${alpha})`;
    return `hsl(${c.h},${c.s}%,${c.l}%)`;
  }

  function lighten(c, amount) {
    return { h: c.h, s: c.s, l: Math.min(100, c.l + amount) };
  }
  function darken(c, amount) {
    return { h: c.h, s: c.s, l: Math.max(0, c.l - amount) };
  }

  // --- Pattern Generator ---
  function generatePattern(numCols) {
    const type = Math.floor(Math.random() * 3);
    const pattern = [];
    for (let r = 0; r < numCols; r++) {
      pattern[r] = Math.floor(Math.random() * 1000);
    }
    return { type, pattern };
  }

  function getWeftColor(pattern, row, numCols) {
    const { type, pattern: p } = pattern;
    let idx;
    if (type === 0) { // Stripes
      const bandWidth = 2 + Math.floor(Math.random() * 3);
      idx = Math.floor((p[row] % 100) / (100 / bandWidth));
      return idx;
    } else if (type === 1) { // Diamonds
      const cx = p[0] % numCols;
      const cy = p[1] % numCols;
      const size = 3 + (p[2] % 6);
      const dx = Math.abs(row - cx);
      const dy = Math.abs(row - cy);
      if (dx + dy <= size) idx = 0;
      else if (dx + dy <= size * 2) idx = 1;
      else idx = 2;
      return idx % 3;
    } else { // Chevrons
      const phase = p[0] % numCols;
      const width = 2 + (p[1] % 4);
      const wave = Math.sin((row - phase) * Math.PI / width);
      if (wave > 0.5) idx = 0;
      else if (wave > -0.5) idx = 1;
      else idx = 2;
      return idx % 3;
    }
  }

  // --- Tapestry State ---
  const WARP_COUNT = 120;
  const THREAD_SPACING = 14;
  const WARP_HEIGHT = 18;
  const WEFT_THREAD_HEIGHT = 3;
  const SCROLL_SPEED = 0.4;
  const WEFT_SPEED_MIN = 0.3;
  const WEFT_SPEED_MAX = 0.8;

  let tapestry = null;
  let scrollOffset = 0;
  let phase = 'warping'; // 'warping', 'weaving', 'scrolling', 'done'
  let warpProgress = 0;
  let weftProgress = 0;
  let currentWeftRow = 0;
  let scrollTimer = 0;
  let canvasOffset = 0;
  let pattern = null;
  let palette = null;
  let numCols = 0;
  let weavePattern = []; // 2D array: weavePattern[row][col] = 0 or 1

  function initTapestry() {
    numCols = Math.ceil(W / THREAD_SPACING) + 2;
    palette = generatePalette();
    pattern = generatePattern(numCols);
    weavePattern = [];

    // Generate weave pattern
    const { type, pattern: p } = pattern;
    for (let r = 0; r < numCols; r++) {
      weavePattern[r] = [];
      for (let c = 0; c < numCols; c++) {
        if (type === 0) { // Stripes: horizontal bands alternate
          const bandH = 2 + (p[r] % 4);
          weavePattern[r][c] = Math.floor((r % bandH) / 2);
        } else if (type === 1) { // Diamonds
          const cx = p[0] % numCols;
          const cy = p[1] % numCols;
          const size = 3 + (p[2] % 6);
          const dx = Math.abs(c - cx);
          const dy = Math.abs(r - cy);
          weavePattern[r][c] = (dx + dy) % 2;
        } else { // Chevrons
          const phase = p[0] % numCols;
          const width = 2 + (p[1] % 4);
          const wave = Math.sin((c - phase) * Math.PI / width);
          weavePattern[r][c] = (wave > 0) ? 1 : 0;
        }
      }
    }

    warpProgress = 0;
    weftProgress = 0;
    currentWeftRow = 0;
    phase = 'warping';
    scrollOffset = 0;
    canvasOffset = 0;
  }

  function getColorForWeft(row) {
    const idx = getWeftColor(pattern, row, numCols);
    return palette[idx % palette.length];
  }

  // --- Drawing Functions ---
  function drawThread(x, y, width, height, color, lightSide, alpha) {
    const l = lighten(color, 15);
    const d = darken(color, 20);
    const t = lightSide ? l : d;
    const b = lightSide ? d : l;

    const grad = ctx.createLinearGradient(x, y, x + width, y);
    grad.addColorStop(0, hslStr(d, alpha));
    grad.addColorStop(0.25, hslStr(t, alpha));
    grad.addColorStop(0.5, hslStr(lighten(color, 5), alpha));
    grad.addColorStop(0.75, hslStr(t, alpha));
    grad.addColorStop(1, hslStr(d, alpha));

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, width, height);

    // Fiber highlights
    ctx.fillStyle = `rgba(255,255,255,${0.06 * alpha})`;
    ctx.fillRect(x + width * 0.15, y, width * 0.08, height);
    ctx.fillStyle = `rgba(0,0,0,${0.1 * alpha})`;
    ctx.fillRect(x + width * 0.6, y, width * 0.15, height);
  }

  function drawWarpThread(x, y, width, height, color, alpha) {
    drawThread(x, y, width, height, color, true, alpha);
  }

  function drawWeftThread(x, y, width, height, color, overUnder, alpha) {
    // overUnder: 1 = over warp, 0 = under warp
    const isOver = overUnder === 1;
    const colorAbove = lighten(color, 12);
    const colorBelow = darken(color, 25);
    const lightSide = true;

    const grad = ctx.createLinearGradient(x, y, x + width, y);
    if (isOver) {
      grad.addColorStop(0, hslStr(darken(color, 10), alpha));
      grad.addColorStop(0.2, hslStr(colorAbove, alpha));
      grad.addColorStop(0.5, hslStr(lighten(colorAbove, 8), alpha));
      grad.addColorStop(0.8, hslStr(colorAbove, alpha));
      grad.addColorStop(1, hslStr(darken(color, 10), alpha));
    } else {
      grad.addColorStop(0, hslStr(darken(colorBelow, 10), alpha));
      grad.addColorStop(0.2, hslStr(darken(colorBelow, 5), alpha));
      grad.addColorStop(0.5, hslStr(darken(color, 18), alpha));
      grad.addColorStop(0.8, hslStr(darken(colorBelow, 5), alpha));
      grad.addColorStop(1, hslStr(darken(colorBelow, 10), alpha));
    }

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, width, height);

    // Fiber texture
    if (isOver) {
      ctx.fillStyle = `rgba(255,255,255,${0.08 * alpha})`;
      ctx.fillRect(x + width * 0.2, y, width * 0.1, height);
    } else {
      ctx.fillStyle = `rgba(0,0,0,${0.12 * alpha})`;
      ctx.fillRect(x + width * 0.3, y, width * 0.2, height);
    }
  }

  function drawShuttle(x, y, width, height) {
    // Shuttle body
    const grad = ctx.createLinearGradient(x, y, x, y + height);
    grad.addColorStop(0, '#8B7355');
    grad.addColorStop(0.5, '#A0896B');
    grad.addColorStop(1, '#6B5535');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(x + width/2, y + height/2, width/2, height/2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.ellipse(x + width * 0.4, y + height * 0.35, width * 0.25, height * 0.2, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Thread tail
    const tailColor = palette[currentWeftRow % palette.length];
    ctx.strokeStyle = hslStr(tailColor, 0.8);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + width * 0.1, y + height * 0.5);
    ctx.quadraticCurveTo(x - 10, y + height * 0.3, x - 20, y + height * 0.6);
    ctx.stroke();
  }

  // --- Main Render ---
  function draw() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    const visibleRows = Math.ceil(H / WEFT_THREAD_HEIGHT) + 2;
    const totalWeftRows = numCols;
    const totalWarpHeight = numCols * WARP_HEIGHT;
    const totalHeight = totalWarpHeight + totalWeftRows * WEFT_THREAD_HEIGHT;

    const startY = canvasOffset - scrollOffset;
    const startRow = Math.max(0, Math.floor(-startY / WEFT_THREAD_HEIGHT));
    const endRow = Math.min(totalWeftRows, startRow + visibleRows + 1);

    // Draw background fabric
    ctx.fillStyle = '#1a1510';
    ctx.fillRect(0, 0, W, H);

    // Draw warp threads (partial during warping phase)
    const warpDrawCount = Math.floor(warpProgress * numCols);
    for (let r = 0; r < warpDrawCount; r++) {
      const y = startY + (r + numCols) * WEFT_THREAD_HEIGHT;
      if (y < -WARP_HEIGHT || y > H + WARP_HEIGHT) continue;

      const alpha = warpProgress >= 1 ? 1 : (r === warpDrawCount - 1 ? warpProgress % 1 : 1);

      for (let c = 0; c < numCols; c++) {
        const x = c * THREAD_SPACING - (numCols * THREAD_SPACING - W) / 2;
        const color = palette[c % palette.length];
        const overUnder = weavePattern[r] ? weavePattern[r][c] : 0;
        drawWarpThread(x, y, THREAD_SPACING - 1, WARP_HEIGHT, color, overUnder, alpha);
      }
    }

    // Draw weft threads
    for (let r = startRow; r < endRow; r++) {
      const y = startY + r * WEFT_THREAD_HEIGHT;
      if (y < -WEFT_THREAD_HEIGHT || y > H + WEFT_THREAD_HEIGHT) continue;

      const alpha = (r < currentWeftRow) ? 1 : (r === currentWeftRow ? weftProgress : 0);
      if (alpha <= 0) continue;

      const color = getColorForWeft(r);

      for (let c = 0; c < numCols; c++) {
        const x = c * THREAD_SPACING - (numCols * THREAD_SPACING - W) / 2;
        const overUnder = weavePattern[r] ? weavePattern[r][c] : 0;
        drawWeftThread(x, y, THREAD_SPACING - 1, WEFT_THREAD_HEIGHT, color, overUnder, alpha);
      }
    }

    // Draw shuttle during weaving
    if (phase === 'weaving' && weftProgress > 0 && weftProgress < 1) {
      const shuttleY = startY + currentWeftRow * WEFT_THREAD_HEIGHT;
      const shuttleX = weftProgress < 0.5
        ? (weftProgress * 2) * W
        : W - ((weftProgress - 0.5) * 2) * W;
      drawShuttle(shuttleX - 15, shuttleY - WEFT_THREAD_HEIGHT/2 + 1, 30, WEFT_THREAD_HEIGHT * 2);
    }

    // Draw scroll transition
    if (phase === 'scrolling') {
      ctx.fillStyle = `rgba(10,10,15,${scrollTimer})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // --- Update ---
  let lastTime = 0;
  function update(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    if (phase === 'warping') {
      warpProgress += dt * 2.5;
      if (warpProgress >= 1) {
        warpProgress = 1;
        phase = 'weaving';
        currentWeftRow = 0;
        weftProgress = 0;
      }
    } else if (phase === 'weaving') {
      const speed = WEFT_SPEED_MIN + Math.random() * (WEFT_SPEED_MAX - WEFT_SPEED_MIN);
      weftProgress += dt * speed;

      if (weftProgress >= 1) {
        weftProgress = 0;
        currentWeftRow++;
        if (currentWeftRow >= numCols) {
          phase = 'scrolling';
          scrollTimer = 0;
        }
      }
    } else if (phase === 'scrolling') {
      scrollTimer += dt * 1.5;
      scrollOffset += SCROLL_SPEED * 60 * dt;
      canvasOffset += SCROLL_SPEED * 60 * dt;

      if (scrollTimer >= 1) {
        initTapestry();
      }
    }

    draw();
    requestAnimationFrame(update);
  }

  // --- Start ---
  initTapestry();
  requestAnimationFrame(update);
})();
</script>
</body>
</html>
