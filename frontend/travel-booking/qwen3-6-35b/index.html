<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Search Results</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent-red: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header / Search Summary */
        .search-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 30px;
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        .search-text {
            font-weight: 700;
            font-size: 1.1rem;
            margin-right: 8px;
        }

        .chip {
            background-color: #f0f0f5;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .chip:hover {
            background-color: #e0e0e8;
        }

        .chip.active {
            background-color: #eef2ff;
            color: var(--primary);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .chip svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .sort-container {
            margin-left: auto;
            position: relative;
        }

        .sort-select {
            appearance: none;
            background-color: white;
            border: 1px solid #e5e7eb;
            padding: 8px 32px 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: var(--transition);
        }

        .sort-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .sort-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            pointer-events: none;
            fill: var(--text-muted);
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Card Component */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        /* Card Image Area */
        .card-image-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Using gradients to simulate "photos" as requested */
            background: linear-gradient(135deg, var(--color-1), var(--color-2));
            transition: transform 0.5s ease;
        }

        .card:hover .card-image {
            transform: scale(1.05);
        }

        /* Heart Button */
        .heart-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .heart-btn:hover {
            transform: scale(1.1);
        }

        .heart-btn:active {
            transform: scale(0.9);
        }

        .heart-icon {
            width: 20px;
            height: 20px;
            transition: fill 0.3s ease;
        }

        .heart-btn.active .heart-icon {
            fill: var(--accent-red);
        }

        /* Pop animation for heart */
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        .heart-btn.pop {
            animation: heartPop 0.3s ease forwards;
        }

        /* Price Badge */
        .price-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .price-badge span {
            font-size: 0.75rem;
            opacity: 0.8;
            font-weight: 400;
        }

        /* Card Content */
        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            background: #f9fafb;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .rating svg {
            width: 14px;
            height: 14px;
            fill: #fbbf24; /* Amber */
        }

        .location {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .location svg {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
        }

        /* Amenities */
        .amenities {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid #f3f4f6;
        }

        .amenity {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            padding: 6px;
            border-radius: 8px;
            flex: 1;
        }

        .amenity svg {
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            margin-bottom: 4px;
        }

        .amenity span {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Sort Animation Class */
        .card-sorting {
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

    </style>
</head>
