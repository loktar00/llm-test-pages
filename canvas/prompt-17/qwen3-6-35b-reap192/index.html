<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Battle Screensaver</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- CONSTANTS ---
const WORLD_W = 4000;
const WORLD_H = 3000;
const TEAM_BLUE = 0;
const TEAM_RED = 1;
const BLUE_COLOR = '#4488ff';
const BLUE_LIGHT = '#88bbff';
const RED_COLOR = '#ff4444';
const RED_LIGHT = '#ff8888';

// --- UTILITIES ---
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

// --- STARFIELD ---
class StarField {
    constructor() {
        this.stars = [];
        for (let i = 0; i < 600; i++) {
            this.stars.push({
                x: rand(-2000, WORLD_W + 2000),
                y: rand(-1500, WORLD_H + 1500),
                z: rand(0.2, 1.5),
                size: rand(0.5, 2.5),
                brightness: rand(0.3, 1)
            });
        }
        this.nebulae = [];
        for (let i = 0; i < 15; i++) {
            this.nebulae.push({
                x: rand(-1000, WORLD_W + 1000),
                y: rand(-1000, WORLD_H + 1000),
                r: rand(80, 250),
                color: `hsla(${rand(200, 320)}, ${rand(30, 60)}%, ${rand(10, 25)}%, ${rand(0.02, 0.06)})`
            });
        }
    }
    draw(cam) {
        const cx = cam.x - cam.fov / 2;
        const cy = cam.y - (cam.fov * WORLD_H / WORLD_W) / 2;
        for (const n of this.nebulae) {
            const sx = (n.x - cx) * cam.zoom + canvas.width / 2;
            const sy = (n.y - cy) * cam.zoom + canvas.height / 2;
            const sr = n.r * cam.zoom;
            if (sx + sr < 0 || sx - sr > canvas.width || sy + sr < 0 || sy - sr > canvas.height) continue;
            const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
            grad.addColorStop(0, n.color);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
        }
        for (const s of this.stars) {
            const sx = (s.x - cx) * cam.zoom + canvas.width / 2;
            const sy = (s.y - cy) * cam.zoom + canvas.height / 2;
            if (sx < -10 || sx > canvas.width + 10 || sy < -10 || sy > canvas.height + 10) continue;
            const twinkle = s.brightness * (0.7 + 0.3 * Math.sin(performance.now() * 0.001 * s.z + s.x));
            const alpha = clamp(twinkle, 0, 1);
            const sz = s.size * cam.zoom;
            ctx.fillStyle = `rgba(200,220,255,${alpha})`;
            ctx.beginPath();
            ctx.arc(sx, sy, Math.max(0.5, sz), 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

// --- CAMERA ---
class Camera {
    constructor() {
        this.x = WORLD_W / 2;
        this.y = WORLD_H / 2;
        this.zoom = 0.5;
        this.targetZoom = 0.5;
        this.targetX = this.x;
        this.targetY = this.y;
        this.smoothing = 0.03;
        this.fov = canvas.width / this.zoom;
    }
    update() {
        this.zoom = lerp(this.zoom, this.targetZoom, 0.02);
        this.x = lerp(this.x, this.targetX, this.smoothing);
        this.y = lerp(this.y, this.targetY, this.smoothing);
        this.fov = canvas.width / this.zoom;
    }
    setOverview() {
        this.targetZoom = 0.45;
        this.targetX = WORLD_W / 2;
        this.targetY = WORLD_H / 2;
    }
    followShip(ship) {
        if (ship && ship.alive) {
            this.targetX = ship.x;
            this.targetY = ship.y;
            this.targetZoom = Math.min(1.8, 2.5 / Math.max(ship.size, 15));
        }
    }
}

// --- PARTICLES ---
class Particle {
    constructor(x, y, vx, vy, life, color, size, type = 'spark') {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.life = life; this.maxLife = life; this.color = color;
        this.size = size; this.type = type;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.life -= dt;
        if (this.type === 'debris') {
            this.vy += 30 * dt;
        }
    }
    draw(cam) {
        const alpha = clamp(this.life / this.maxLife, 0, 1);
        const sx = (this.x - cam.x + canvas.width / 2) * cam.zoom;
        const sy = (this.y - cam.y + canvas.height / 2) * cam.zoom;
        const sz = this.size * cam.zoom;
        if (this.type === 'glow') {
            const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sz * 3);
            grad.addColorStop(0, this.color.replace(')', `,${alpha})`).replace('rgb', 'rgba'));
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(sx, sy, sz * 3, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(sx, sy, Math.max(0.5, sz), 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
    get dead() { return this.life <= 0; }
}

// --- ENGINE TRAIL ---
class Trail {
    constructor() { this.points = []; }
    add(x, y, color) {
        this.points.push({ x, y, life: 0.8, color });
        if (this.points.length > 60) this.points.shift();
    }
    update(dt) {
        for (const p of this.points) p.life -= dt;
        this.points = this.points.filter(p => p.life > 0);
    }
    draw(cam) {
        for (let i = 0; i < this.points.length; i++) {
            const p = this.points[i];
            const alpha = (p.life / 0.8) * 0.4;
            const sx = (p.x - cam.x + canvas.width / 2) * cam.zoom;
            const sy = (p.y - cam.y + canvas.height / 2) * cam.zoom;
            const sz = 3 * cam.zoom * (p.life / 0.8);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(sx, sy, sz, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

// --- BULLET ---
class Bullet {
    constructor(x, y, angle, speed, damage, color, team, life = 3) {
        this.x = x; this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.damage = damage; this.color = color; this.team = team;
        this.life = life; this.size = 3; this.alive = true;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        if (this.life <= 0) this.alive = false;
    }
    draw(cam) {
        const sx = (this.x - cam.x + canvas.width / 2) * cam.zoom;
        const sy = (this.y - cam.y + canvas.height / 2) * cam.zoom;
        const sz = this.size * cam.zoom;
        const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sz * 4);
        grad.addColorStop(0, this.color);
        grad.addColorStop(0.5, this.color.replace(')', ',0.4)').replace('rgb', 'rgba'));
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(sx, sy, sz * 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(sx, sy, sz * 0.8, 0, Math.PI * 2);
        ctx.fill();
    }
    get dead() { return !this.alive; }
}

// --- ION BEAM ---
class IonBeam {
    constructor(x1, y1, x2, y2, damage, color, life = 0.3) {
        this.x1 = x1; this.y1 = y1; this.x2 = x2; this.y2 = y2;
        this.damage = damage; this.color = color;
        this.life = life; this.maxLife = life; this.alive = true;
    }
    update(dt) {
        this.life -= dt;
        if (this.life <= 0) this.alive = false;
    }
    draw(cam) {
        const alpha = this.life / this.maxLife;
        const x1 = (this.x1 - cam.x + canvas.width / 2) * cam.zoom;
        const y1 = (this.y1 - cam.y + canvas.height / 2) * cam.zoom;
        const x2 = (this.x2 - cam.x + canvas.width / 2) * cam.zoom;
        const y2 = (this.y2 - cam.y + canvas.height / 2) * cam.zoom;
        const width = 2 * cam.zoom;
        ctx.globalAlpha = alpha * 0.8;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = width;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15 * cam.zoom;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = width * 0.4;
        ctx.shadowBlur = 5 * cam.zoom;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }
    get dead() { return !this.alive; }
}

// --- SHIP ---
class Ship {
    constructor(x, y, team, type = 'fighter') {
        this.x = x; this.y = y;
        this.team = team;
        this.type = type;
        this.angle = rand(0, Math.PI * 2);
        this.speed = 0;
        this.maxSpeed = type === 'mothership' ? 40 : type === 'heavy' ? 65 : 90;
        this.health = type === 'mothership' ? 500 : type === 'heavy' ? 120 : 60;
        this.maxHealth = this.health;
        this.alive = true;
        this.size = type === 'mothership' ? 35 : type === 'heavy' ? 18 : 10;
        this.killCount = 0;
        this.trail = new Trail();
        this.targetShip = null;
        this.cooldown = 0;
        this.weaponType = type === 'heavy' ? 'ion' : 'projectile';
        this.damage = type === 'mothership' ? 20 : type === 'heavy' ? 30 : 12;
        this.fireRate = type === 'mothership' ? 0.8 : type === 'heavy' ? 0.5 : 0.35;
        this.range = type === 'mothership' ? 500 : type === 'heavy' ? 350 : 450;
        this.formationOffset = { x: rand(-100, 100), y: rand(-100, 100) };
        this.targetOffset = { ...this.formationOffset };
        this.formTimer = 0;
        this.strafeAngle = rand(0, Math.PI * 2);
        this.strafeTimer = 0;
        this.spawnCooldown = type === 'mothership' ? 8 : 999;
        this.flashTimer = 0;
        this.wobble = rand(0, Math.PI * 2);
    }
    get color() { return this.team === TEAM_BLUE ? BLUE_COLOR : RED_COLOR; }
    get lightColor() { return this.team === TEAM_BLUE ? BLUE_LIGHT : RED_LIGHT; }
    get center() { return { x: this.x, y: this.y }; }

    update(dt, allShips, allBullets, allBeams, particles) {
        if (!this.alive) return;
        this.wobble += dt * 2;
        this.cooldown -= dt;
        this.flashTimer -= dt;
        this.spawnCooldown -= dt;
        this.formTimer -= dt;
        this.strafeTimer -= dt;

        if (this.formTimer <= 0) {
            this.formTimer = rand(2, 5);
            this.targetOffset.x += rand(-60, 60);
            this.targetOffset.y += rand(-60, 60);
        }
        if (this.strafeTimer <= 0) {
            this.strafeTimer = rand(2, 4);
            this.strafeAngle += rand(-1, 1);
        }

        // Find target
        this.findTarget(allShips);

        // Steering behaviors
        let steer = { x: 0, y: 0 };

        // Seek target
        if (this.targetShip && this.targetShip.alive) {
            const a = angle(this, this.targetShip);
            const d = dist(this, this.targetShip);
            if (d > this.range * 0.3) {
                steer.x += Math.cos(a) * 80;
                steer.y += Math.sin(a) * 80;
            } else {
                // Strafe when in range
                const sa = a + Math.PI / 2 * Math.sign(Math.sin(this.strafeAngle));
                steer.x += Math.cos(sa) * 40;
                steer.y += Math.sin(sa) * 40;
            }
        }

        // Formation keeping
        const desiredX = this.formTimer > 0 ? this.targetOffset.x : this.formationOffset.x;
        const desiredY = this.formTimer > 0 ? this.targetOffset.y : this.formationOffset.y;
        const formDist = dist(this, { x: desiredX, y: desiredY });
        steer.x += (desiredX - this.x) * 0.02;
        steer.y += (desiredY - this.y) * 0.02;

        // Avoid allies
        for (const s of allShips) {
            if (s === this || !s.alive || s.team !== this.team) continue;
            const d = dist(this, s);
            if (d < 80) {
                const a = angle(s, this);
                steer.x += Math.cos(a) * (80 - d) * 0.5;
                steer.y += Math.sin(a) * (80 - d) * 0.5;
            }
        }

        // Avoid all ships (separation)
        for (const s of allShips) {
            if (s === this || !s.alive) continue;
            const d = dist(this, s);
            if (d < 40) {
                const a = angle(s, this);
                steer.x += Math.cos(a) * (40 - d) * 1.0;
                steer.y += Math.sin(a) * (40 - d) * 1.0;
            }
        }

        // Apply steering with smoothing
        this.angle += (Math.atan2(steer.y, steer.x) - this.angle) * 0.05;
        this.speed = lerp(this.speed, Math.min(this.maxSpeed, Math.sqrt(steer.x * steer.x + steer.y * steer.y) * 0.5), 0.05);

        const vx = Math.cos(this.angle) * this.speed;
        const vy = Math.sin(this.angle) * this.speed;
        this.x += vx * dt;
        this.y += vy * dt;

        // Bounds
        this.x = clamp(this.x, 50, WORLD_W - 50);
        this.y = clamp(this.y, 50, WORLD_H - 50);

        // Engine trail
        const engineX = this.x - Math.cos(this.angle) * this.size * 0.8;
        const engineY = this.y - Math.sin(this.angle) * this.size * 0.8;
        const spread = rand(-0.3, 0.3);
        this.trail.add(
            engineX + Math.cos(this.angle + Math.PI + spread) * this.size * 0.3,
            engineY + Math.sin(this.angle + Math.PI + spread) * this.size * 0.3,
            this.team === TEAM_BLUE ? 'rgb(8
