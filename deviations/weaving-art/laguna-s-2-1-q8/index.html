<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generative Weaving Art</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const THREADS_OVER_UNDER = true;

  // Tapestry parameters
  const params = {
    warpCount: Math.floor(Math.random() * 10) + 20,
    patternType: ['stripes', 'diamonds', 'chevrons'][Math.floor(Math.random() * 3)],
    patternScale: Math.random() * 2 + 1,
    colorCount: Math.floor(Math.random() * 3) + 3,
    speed: 2 // lower is slower
  };

  let warpY = 0;
  let weftX = 0;
  let weftY = 0;
  let direction = 1;
  let weavingState = 'warp'; // 'warp' -> 'weft' -> 'done'
  let weftIndex = 0;

  const colors = [];

  function hslToRgb(h, s, l) {
    s /= 100;
    l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n =>
      l - a * Math.max(-1, Math.min(1, Math.min(k(n) - 3, 9 - k(n)) - 6) + 1);
    return [
      Math.round(f(0) * 255),
      Math.round(f(8) * 255),
      Math.round(f(4) * 255)
    ];
  }

  function generatePalette(count) {
    const baseHue = Math.floor(Math.random() * 360);
    return Array.from({ length: count }, (_, i) => {
      const hue = (baseHue + (i * 360) / count) % 360;
      const rgb = hslToRgb(hue, 70 + i * 5, 50);
      return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
    });
  }

  function setup() {
    colors.push(...generatePalette(params.colorCount));
  }

  setup();

  const warpSpacing = canvas.height / params.warpCount;
  const weftSpacing = warpSpacing * 0.8;

  function getPatternColor(y) {
    let idx;
    switch (params.patternType) {
      case 'stripes':
        idx = Math.floor((y / warpSpacing) / params.patternScale) % colors.length;
        break;
      case 'diamonds':
        idx = Math.floor((Math.abs((y % (warpSpacing * 2)) - warpSpacing) / warpSpacing) * params.patternScale) % colors.length;
        break;
      case 'chevrons':
        idx = Math.floor(((y / warpSpacing) + (weftX / canvas.width)) * params.patternScale) % colors.length;
        break;
      default:
        idx = 0;
    }
    return colors[(idx + colors.length) % colors.length];
  }

  function drawWarp() {
    ctx.fillStyle = "#333";
    const yPos = warpY;
    ctx.fillRect(0, yPos, canvas.width, 1);
    warpY += 1 / params.speed;
    
    if (warpY >= canvas.height) {
      warpY = canvas.height;
      weavingState = 'weft';
    }
  }

  function drawWeft() {
    const color = getPatternColor(weftY);
    ctx.fillStyle = color;

    if (direction === 1) {
      // Left to right
      ctx.fillRect(weftX, weftY, weftSpacing, weftSpacing);
      weftX += weftSpacing / params.speed;
      
      if (weftX >= canvas.width) {
        weftX = canvas.width;
        direction = -1;
        weftY += weftSpacing / params.speed;
        weftX = 0;
      }
    } else {
      // Right to left
      ctx.fillRect(weftX, weftY, weftSpacing, weftSpacing);
      weftX -= weftSpacing / params.speed;
      
      if (weftX <= 0) {
        weftX = 0;
        direction = 1;
        weftY += weftSpacing / params.speed;
        weftX = canvas.width;
      }
    }

    if (weftY >= canvas.height) {
      weavingState = 'done';
    }
  }

  let scrollOffset = 0;
  let animationFrameId;

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Apply scrolling after completion
    if (weavingState === 'done') {
      scrollOffset += 1;
      ctx.save();
      ctx.translate(0, -scrollOffset);
      drawScene();
      ctx.restore();

      const visibleHeight = canvas.height - scrollOffset;
      if (visibleHeight <= 0) {
        reset();
        scrollOffset = 0;
      }
    } else {
      drawScene();
    }

    animationFrameId = requestAnimationFrame(animate);
  }

  function drawScene() {
    if (weavingState === 'warp') {
      drawWarp();
    } else if (weavingState === 'weft') {
      drawWeft();
    }
  }

  function reset() {
    params.warpCount = Math.floor(Math.random() * 10) + 20;
    params.patternType = ['stripes', 'diamonds', 'chevrons'][Math.floor(Math.random() * 3)];
    params.patternScale = Math.random() * 2 + 1;
    params.colorCount = Math.floor(Math.random() * 3) + 3;
    params.speed = 2;

    warpY = 0;
    weftX = 0;
    weftY = 0;
    direction = 1;
    weavingState = 'warp';
    weftIndex = 0;

    colors.length = 0;
    colors.push(...generatePalette(params.colorCount));

    warpSpacing = canvas.height / params.warpCount;
    weftSpacing = warpSpacing * 0.8;
  }

  animate();
})();
</script>
</body>
</html>
