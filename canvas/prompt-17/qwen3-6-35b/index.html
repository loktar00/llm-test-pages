<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Space Battle</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        SYSTEM: ARMED<br>
        CAM: AUTO<br>
        STATUS: ENGAGING
    </div>
    <canvas id="battlefield"></canvas>

<script>
/**
 * VECTOR MATH HELPER
 */
class Vector {
    constructor(x, y) { this.x = x; this.y = y; }
    add(v) { return new Vector(this.x + v.x, this.y + v.y); }
    sub(v) { return new Vector(this.x - v.x, this.y - v.y); }
    mult(n) { return new Vector(this.x * n, this.y * n); }
    div(n) { return new Vector(this.x / n, this.y / n); }
    mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
    normalize() {
        let m = this.mag();
        return m === 0 ? new Vector(0, 0) : this.div(m);
    }
    limit(max) {
        if (this.mag() > max) return this.normalize().mult(max);
        return this;
    }
    dist(v) { return Math.sqrt(Math.pow(this.x - v.x, 2) + Math.pow(this.y - v.y, 2)); }
    heading() { return Math.atan2(this.y, this.x); }
}

/**
 * CONSTANTS & CONFIG
 */
const CONFIG = {
    worldSize: 3000,
    starCount: 400,
    teamColors: {
        alpha: { main: '#ff3333', ship: '#cc2222', trail: 'rgba(255, 50, 50, 0.3)' },
        beta: { main: '#3388ff', ship: '#2266cc', trail: 'rgba(50, 136, 255, 0.3)' }
    },
    camera: {
        zoomOut: 0.6,
        zoomIn: 2.5,
        smooth: 0.05
    },
    ship: {
        maxSpeed: 3,
        maxForce: 0.15,
        perceptionRadius: 250,
        separationDist: 30
    }
};

/**
 * ENTITIES
 */

class Particle {
    constructor(x, y, color, speed, life) {
        this.pos = new Vector(x, y);
        const angle = Math.random() * Math.PI * 2;
        const velocityMag = Math.random() * speed;
        this.vel = new Vector(Math.cos(angle) * velocityMag, Math.sin(angle) * velocityMag);
        this.acc = new Vector(0, 0);
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.decay = Math.random() * 0.02 + 0.01;
    }

    update() {
        this.vel = this.vel.add(this.acc);
        this.pos = this.pos.add(this.vel);
        this.life -= this.decay;
    }

    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class Bullet {
    constructor(x, y, angle, ownerTeam, damage) {
        this.pos = new Vector(x, y);
        this.vel = new Vector(Math.cos(angle), Math.sin(angle)).mult(8);
        this.owner = ownerTeam;
        this.damage = damage;
        this.life = 60; // frames
        this.active = true;
    }

    update() {
        this.pos = this.pos.add(this.vel);
        this.life--;
        if (this.life <= 0) this.active = false;
    }

    draw(ctx, zoom, offset) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.vel.heading());
        ctx.fillStyle = this.owner === 'alpha' ? '#ffaaaa' : '#aaffff';
        ctx.shadowBlur = 5;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillRect(-4, -1.5, 8, 3);
        ctx.restore();
    }
}

class Beam {
    constructor(x1, y1, x2, y2, ownerTeam, duration) {
        this.start = new Vector(x1, y1);
        this.end = new Vector(x2, y2);
        this.owner = ownerTeam;
        this.life = duration;
        this.maxLife = duration;
        this.active = true;
        this.angle = Math.atan2(y2 - y1, x2 - x1);
    }

    update() {
        this.life--;
        if (this.life <= 0) this.active = false;
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.save();
        ctx.translate(this.start.x, this.start.y);
        ctx.rotate(this.angle);
        
        const width = 4 * (this.life / this.maxLife);
        
        ctx.globalCompositeOperation = 'screen';
        ctx.strokeStyle = this.owner === 'alpha' ? '#ff5555' : '#55aaff';
        ctx.lineWidth = width;
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.strokeStyle;
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(this.start.dist(this.end), 0);
        ctx.stroke();
        
        // Inner white core
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = width * 0.3;
        ctx.stroke();
        
        ctx.restore();
    }
}

class Ship {
    constructor(x, y, team, type = 'fighter') {
        this.pos = new Vector(x, y);
        this.vel = new Vector(Math.random()-0.5, Math.random()-0.5).mult(2);
        this.acc = new Vector(0, 0);
        this.team = team;
        this.type = type; // 'mothership', 'fighter', 'ion'
        
        this.angle = Math.random() * Math.PI * 2;
        this.rotationSpeed = 0;
        
        // Stats
        this.maxHealth = type === 'mothership' ? 2000 : (type === 'ion' ? 150 : 100);
        this.health = this.maxHealth;
        this.radius = type === 'mothership' ? 25 : 8;
        this.killCount = 0;
        this.dead = false;
        
        // Combat
        this.cooldown = 0;
        this.cooldownMax = type === 'mothership' ? 30 : (type === 'ion' ? 15 : 40);
        this.weaponType = type === 'ion' ? 'beam' : 'bullet';
        
        // Visual
        this.id = Math.random();
        this.flash = 0;
    }

    applyForce(force) {
        this.acc = this.acc.add(force);
    }

    // Steering behaviors
    seek(target) {
        let desired = target.sub(this.pos);
        desired = desired.normalize().mult(CONFIG.ship.maxSpeed);
        let steer = desired.sub(this.vel);
        steer = steer.limit(CONFIG.ship.maxForce);
        return steer;
    }

    separate(boids) {
        let desiredSeparation = CONFIG.ship.separationDist;
        let sum = new Vector(0, 0);
        let count = 0;
        for (let other of boids) {
            let d = this.pos.dist(other.pos);
            if (d > 0 && d < desiredSeparation) {
                let diff = this.pos.sub(other.pos);
                diff = diff.normalize().div(d); // Weight by distance
                sum = sum.add(diff);
                count++;
            }
        }
        if (count > 0) {
            sum = sum.div(count).normalize().mult(CONFIG.ship.maxSpeed);
            let steer = sum.sub(this.vel);
            steer = steer.limit(CONFIG.ship.maxForce * 1.5);
            return steer;
        }
        return new Vector(0, 0);
    }

    align(boids) {
        let neighborDist = CONFIG.ship.perceptionRadius;
        let sum = new Vector(0, 0);
        let count = 0;
        for (let other of boids) {
            let d = this.pos.dist(other.pos);
            if (d > 0 && d < neighborDist) {
                sum = sum.add(other.vel);
                count++;
            }
        }
        if (count > 0) {
            sum = sum.div(count).normalize().mult(CONFIG.ship.maxSpeed);
            let steer = sum.sub(this.vel);
            steer = steer.limit(CONFIG.ship.maxForce);
            return steer;
        }
        return new Vector(0, 0);
    }

    flock(allies) {
        let alignment = this.align(allies);
        let cohesion = new Vector(0, 0);
        // Simple cohesion: seek center of mass
        let centerOfMass = new Vector(0,0);
        if (allies.length > 0) {
             allies.forEach(a => centerOfMass = centerOfMass.add(a.pos));
             centerOfMass = centerOfMass.div(allies.length);
        }
        cohesion = this.seek(centerOfMass);

        return alignment.mult(1.0).add(cohesion.mult(1.0)).add(this.separate(allies).mult(1.5));
    }

    update(allies, enemies) {
        // Logic
        let steer = this.flock(ally);
        
        // Combat Logic
        let target = null;
        let closestDist = Infinity;
        
        // Find nearest enemy
        for (let enemy of enemies) {
            let d = this.pos.dist(enemy.pos);
            if (d < closestDist) {
                closestDist = d;
                target = enemy;
            }
        }

        // Mothership stays put-ish, ships chase
        if (this.type === 'mothership') {
             if (target) {
                 // Mothership shoots at target but doesn't move much
                 steer = this.seek(target).mult(0.2); 
             }
        } else {
            if (target) {
                steer = steer.add(this.seek(target));
            }
        }

        this.applyForce(steer);
        this.vel = this.vel.add(this.acc);
        this.vel = this.vel.limit(CONFIG.ship.maxSpeed);
        this.pos = this.pos.add(this.vel);
        this.acc = this.acc.mult(0);

        // Rotation alignment
        let targetAngle = this.vel.heading();
        // Smooth rotation
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * 0.1;

        // Engine Trail
        if (Math.random() > 0.5) {
            let trailPos = this.pos.add(new Vector(0,0).sub(this.vel).normalize().mult(-this.radius));
            scene.addParticle(trailPos.x, trailPos.y, CONFIG.teamColors[this.team].trail, 0.5, 0);
        }

        // Combat Actions
        if (this.cooldown > 0) this.cooldown--;
        if (target && closestDist < (this.type === 'mothership' ? 600 : 400)) {
            this.fire(target);
        }
        
        if (this.flash > 0) this.flash--;
    }

    fire(target) {
        if (this.cooldown > 0) return;
        
        // Calculate leading target
        let lead = target.vel.mult(this.pos.dist(target.pos) / 8);
        let aimPoint = target.pos.add(lead);
        let shootAngle = Math.atan2(aimPoint.y - this.pos.y, aimPoint.x - this.pos.x);
        
        // Add some inaccuracy
        shootAngle += (Math.random() - 0.5) * 0.1;

        if (this.weaponType === 'bullet') {
            scene.addBullet(this.pos.x, this.pos.y, shootAngle, this.team, 20);
            this.cooldown = this.cooldownMax;
        } else {
            // Ion Beam
            scene.addBeam(this.pos.x, this.pos.y, target.pos.x, target.pos.y, this.team, 10);
            target.takeDamage(5); // Beam ticks damage
            this.cooldown = this.cooldownMax;
        }
    }

    takeDamage(amount) {
        this.health -= amount;
        this.flash = 3;
        if (this.health <= 0) {
            this.dead = true;
            scene.explode(this.pos.x, this.pos.y, this.team, this.type === 'mothership');
            // Find killer for kill count? 
            // Simplified: last hit usually kills, but for visual flair we just give kill to whoever is shooting.
            // To implement kill count properly, we'd need a "killerId" reference.
        }
    }

    draw(ctx, cameraZoom) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // Glow
        ctx.shadowBlur = 10;
        ctx.shadowColor = CONFIG.teamColors[this.team].main;

        if (this.flash > 0) {
            ctx.fillStyle = '#ffffff';
        } else {
            ctx.fillStyle = CONFIG.teamColors[this.team].ship;
        }

        ctx.strokeStyle = CONFIG.teamColors[this.team].main;
        ctx.lineWidth = 2;

        if (this.type === 'mothership') {
            // Draw Mothership (Large Triangle/Square combo)
            ctx.beginPath();
            ctx.moveTo(30, 0);
            ctx.lineTo(-20, 20);
            ctx.lineTo(-10, 0);
            ctx.lineTo(-20, -20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Core
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI*2);
            ctx.fill();
        } else if (this.type === 'ion') {
            // Ion Ship (Diamond shape)
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(0, 8);
            ctx.lineTo(-10, 0);
            ctx.lineTo(0, -8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        } else {
            // Standard Fighter (Arrow)
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(-8, 7);
            ctx.lineTo(-5, 0);
            ctx.lineTo(-8, -7);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        ctx.restore();

        // Draw Health Bar
        if (this.health < this.maxHealth) {
            ctx.fillStyle = 'red';
            ctx.fillRect(this.pos.x - 10, this.pos.y - 20, 20, 3);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(this.pos.x - 10, this.pos.y - 20, 20 * (this.health / this.maxHealth), 3);
        }

        // Draw Kill Count
        if (this.killCount > 0) {
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(this.killCount, this.pos.x, this.pos.y - 25);
        }
    }
}

/**
 * SCENE MANAGER
 */
class Scene {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.width = canvas.width;
        this.height = canvas.height;
        
        this.ships = [];
        this.bullets = [];
        this.particles = [];
        this.beams = [];
        this.stars = [];
        
        this.camera = {
            x: CONFIG.worldSize / 2,
            y: CONFIG.worldSize / 2,
            zoom: CONFIG.camera.zoomOut,
            targetZoom: CONFIG.camera.zoomOut,
            targetX: CONFIG.worldSize / 2,
            targetY: CONFIG.worldSize / 2,
            mode: 'overview', // overview, follow, overview
            timer: 0,
            currentShip: null,
            followTime: 0
        };

        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.initStars();
        this.initBattle();
        
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.width = this.canvas.width;
        this.height = this.canvas.height;
    }

    initStars() {
        for (let i = 0; i < CONFIG.starCount; i++) {
            this.stars.push({
                x: Math.random() * CONFIG.worldSize,
                y: Math.random() * CONFIG.worldSize,
                size: Math.random() * 1.5 + 0.5,
                alpha: Math.random()
            });
        }
    }

    initBattle() {
        // Motherships
        const m1 = new Ship(500, CONFIG.worldSize/2, 'alpha', 'mothership');
        const m2 = new Ship(CONFIG.worldSize - 500, CONFIG.worldSize/2, 'beta', 'mothership');
        this.ships.push(m1, m2);

        // Initial fleets
        for(let i=0; i<5; i++) this.spawnShip('alpha', 500 + i*30, CONFIG.worldSize/2 + (Math.random()-0.5)*100);
        for(let i=0; i<5; i++) this.spawnShip('beta', CONFIG.worldSize - 500 - i*30, CONFIG.worldSize/2 + (Math.random()-0.5)*100);
    }

    spawnShip(team, x, y) {
        let type = Math.random() > 0.7 ? 'ion' : 'fighter';
        this.ships.push(new Ship(x, y, team, type));
    }

    addParticle(x, y, color, speed, life) {
        this.particles.push(new Particle(x, y, color, speed, life));
    }

    addBullet(x, y, angle, team, damage) {
        this.bullets.push(new Bullet(x, y, angle, team, damage));
    }

    addBeam(x1, y1, x2, y2, team, duration) {
        this.beams.push(new Beam(x1, y1, x2, y2, team, duration));
    }

    explode(x, y, team, isBig) {
        const count = isBig ? 50 : 15;
        const speed = isBig ? 6 : 3;
        const color = CONFIG.teamColors[team].main;
        
        // Debris
        for(let i=0; i<count; i++) {
            this.addParticle(x, y, color, speed, 2);
            this.addParticle(x, y, '#ffffff', speed * 0.5, 1);
        }
        
        // Give kill count to nearest ally (simplified logic)
        // In a real game we'd pass the killer object
    }

    updateCamera() {
        this.camera.timer++;
        
        if (this.camera.mode === 'overview') {
            this.camera.targetZoom = CONFIG.camera.zoomOut;
            // Drift center slightly
            this.camera.targetX = (CONFIG.worldSize/2) + Math.sin(this.camera.timer * 0.005) * 200;
            this.camera.targetY = (CONFIG.worldSize/2) + Math.cos(this.camera.timer * 0.005) * 200;
            
            // Transition to follow after 3 seconds
            if (this.camera.timer > 180) {
                this.camera.mode = 'follow';
                this.camera.timer = 0;
                // Pick random ship
                let validShips = this.ships.filter(s => !s.dead);
                if (validShips.length > 0) {
                    this.camera.currentShip =
