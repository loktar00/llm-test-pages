<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Match-3 Auto-Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const COLS = 8, ROWS = 10, CELL = 64, GAP = 4;
const BOARD_W = COLS * (CELL + GAP) - GAP;
const BOARD_H = ROWS * (CELL + GAP) - GAP;
const OFFSET_X = Math.floor((window.innerWidth - BOARD_W) / 2);
const OFFSET_Y = Math.floor((window.innerHeight - BOARD_H) / 2);

const GEM_COLORS = ['#FF4466','#44BBFF','#44FF88','#FFCC22','#BB66FF','#FF8844'];
const GEM_GLOW = ['#FF6688','#66DDFF','#66FFAA','#FFEE44','#DD88FF','#FFAA66'];
const GEM_NAMES = ['red','blue','green','yellow','purple','orange'];

let board = [];
let particles = [];
let sparkles = [];
let score = 0;
let scoreDisplay = 0;
let gameState = 'IDLE'; // IDLE, SWAPPING, SWAP_ANIMATING, MATCHING, MATCH_ANIMATING, FALLING, FALL_ANIMATING, CASCADE
let swapPair = null;
let matched = new Set();
let animTimer = 0;
let comboCount = 0;
let lastSwapTime = 0;
let shakeAmount = 0;
let flashAlpha = 0;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOutBack(t) { const c1=1.70158; return 1+(c1+1)*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

function cellToPixel(col, row) {
    return { x: OFFSET_X + col * (CELL + GAP) + CELL/2, y: OFFSET_Y + row * (CELL + GAP) + CELL/2 };
}

function initBoard() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
            let type;
            do {
                type = randInt(0, GEM_COLORS.length - 1);
            } while (
                (c >= 2 && board[r][c-1] === type && board[r][c-2] === type) ||
                (r >= 2 && board[r-1][c] === type && board[r-2][c] === type)
            );
            board[r][c] = type;
        }
    }
}

function findValidSwap() {
    const swaps = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            // Try swap right
            if (c < COLS - 1) {
                swapTiles(r, c, r, c+1);
                if (findMatches().size > 0) swaps.push({r1:r, c1:c, r2:r, c2:c+1});
                swapTiles(r, c, r, c+1);
            }
            // Try swap down
            if (r < ROWS - 1) {
                swapTiles(r, c, r+1, c);
                if (findMatches().size > 0) swaps.push({r1:r, c1:c, r2:r+1, c2:c});
                swapTiles(r, c, r+1, c);
            }
        }
    }
    return swaps.length > 0 ? swaps[randInt(0, swaps.length - 1)] : null;
}

function swapTiles(r1, c1, r2, c2) {
    const temp = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = temp;
}

function findMatches() {
    const matchSet = new Set();
    
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
            const type = board[r][c];
            if (type === -1) continue;
            let len = 1;
            while (c + len < COLS && board[r][c+len] === type) len++;
            if (len >= 3) {
                for (let i = 0; i < len; i++) matchSet.add(`${r},${c+i}`);
            }
        }
    }
    
    // Vertical
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
            const type = board[r][c];
            if (type === -1) continue;
            let len = 1;
            while (r + len < ROWS && board[r+len][c] === type) len++;
            if (len >= 3) {
                for (let i = 0; i < len; i++) matchSet.add(`${r+i},${c}`);
            }
        }
    }
    
    return matchSet;
}

function createPopParticles(col, row, type) {
    const pos = cellToPixel(col, row);
    const count = 12 + comboCount * 2;
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const speed = 2 + Math.random() * 4 + comboCount * 0.5;
        particles.push({
            x: pos.x, y: pos.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.015 + Math.random() * 0.01,
            size: 3 + Math.random() * 4,
            color: GEM_COLORS[type],
            glow: GEM_GLOW[type]
        });
    }
    // Sparkle ring for combos
    if (comboCount > 0) {
        for (let i = 0; i < 8 + comboCount * 4; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            sparkles.push({
                x: pos.x, y: pos.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                life: 1,
                decay: 0.02 + Math.random() * 0.02,
                size: 2 + Math.random() * 3,
                color: '#FFFFFF'
            });
        }
    }
}

function applyGravity() {
    for (let c = 0; c < COLS; c++) {
        let writeRow = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (board[r][c] !== -1) {
                if (writeRow !== r) {
                    board[writeRow][c] = board[r][c];
                    board[r][c] = -1;
                }
                writeRow--;
            }
        }
        // Fill empty spaces at top
        for (let r = writeRow; r >= 0; r--) {
            board[r][c] = randInt(0, GEM_COLORS.length - 1);
        }
    }
}

function drawGem(x, y, type, scale = 1, alpha = 1) {
    const size = (CELL - GAP - 4) * scale / 2;
    
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    
    // Glow
    const gradient = ctx.createRadialGradient(0, 0, size * 0.3, 0, 0, size * 1.5);
    gradient.addColorStop(0, GEM_GLOW[type] + '44');
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(-size * 1.5, -size * 1.5, size * 3, size * 3);
    
    // Gem shape
    ctx.beginPath();
    const colors = GEM_COLORS;
    const grd = ctx.createLinearGradient(-size, -size, size, size);
    grd.addColorStop(0, colors[type]);
    grd.addColorStop(0.5, GEM_GLOW[type]);
    grd.addColorStop(1, colors[type]);
    ctx.fillStyle = grd;
    
    // Rounded diamond/rounded rect shape
    const r = size * 0.3;
    ctx.moveTo(-size + r, -size);
    ctx.lineTo(size - r, -size);
    ctx.quadraticCurveTo(size, -size, size, -size + r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(-size + r, size);
    ctx.quadraticCurveTo(-size, size, -size, size - r);
    ctx.lineTo(-size, -size + r);
    ctx.quadraticCurveTo(-size, -size, -size + r, -size);
    ctx.closePath();
    ctx.fill();
    
    // Highlight
    ctx.beginPath();
    ctx.ellipse(-size * 0.2, -size * 0.3, size * 0.35, size * 0.2, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
    
    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.restore();
}

function drawBoard() {
    // Board background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(OFFSET_X - 10, OFFSET_Y - 10, BOARD_W + 20, BOARD_H + 20);
    
    // Grid background
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const pos = cellToPixel(c, r);
            const x = pos.x - CELL/2;
            const y = pos.y - CELL/2;
            ctx.fillStyle = (r + c) % 2 === 0 ? '#12122a' : '#16163a';
            ctx.fillRect(x, y, CELL, CELL);
        }
    }
    
    // Gems
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (board[r][c] !== -1) {
                drawGem(cellToPixel(c, r).x, cellToPixel(c, r).y, board[r][c]);
            }
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        
        // Glow
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life * 2, 0, Math.PI * 2);
        ctx.fillStyle = p.glow + '44';
        ctx.fill();
        ctx.restore();
    }
    
    for (const s of sparkles) {
        ctx.save();
        ctx.globalAlpha = s.life;
        ctx.translate(s.x, s.y);
        ctx.rotate(s.life * Math.PI);
        const sz = s.size * s.life;
        ctx.fillStyle = s.color;
        // Star shape
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            const angle = (Math.PI / 2) * i;
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(angle) * sz, Math.sin(angle) * sz);
            ctx.lineTo(0, 0);
        }
        ctx.fill();
        ctx.restore();
    }
}

function drawScore() {
    // Smooth score display
    scoreDisplay += (score - scoreDisplay) * 0.1;
    if (Math.abs(scoreDisplay - score) < 1) scoreDisplay = score;
    
    ctx.save();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#44BBFF';
    ctx.shadowBlur = 20;
    ctx.fillText(Math.floor(scoreDisplay).toLocaleString(), window.innerWidth / 2, OFFSET_Y - 40);
    ctx.shadowBlur = 0;
    
    if (comboCount > 1) {
        ctx.font = 'bold 20px Arial';
        ctx.fillStyle = '#FFCC22';
        ctx.shadowColor = '#FFCC22';
        ctx.shadowBlur = 15;
        ctx.fillText(`COMBO x${comboCount}`, window.innerWidth / 2, OFFSET_Y - 10);
    }
    ctx.restore();
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15; // gravity
        p.vx *= 0.98;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life -= s.decay;
        if (s.life <= 0) sparkles.splice(i, 1);
    }
}

function update() {
    const now = Date.now();
    
    switch (gameState) {
        case 'IDLE':
            if (now - lastSwapTime > 800) {
                swapPair = findValidSwap();
                if (swapPair) {
                    gameState = 'SWAPPING';
                    swapPair.animProgress = 0;
                } else {
                    // No valid swap available, apply gravity and refill
                    applyGravity();
                    gameState = 'IDLE';
                    lastSwapTime = now;
                }
            }
            break;
            
        case 'SWAPPING':
            swapPair.animProgress += 0.04;
            if (swapPair.animProgress >= 1) {
                swapTiles(swapPair.r1, swapPair.c1, swapPair.r2, swapPair.c2);
                gameState = 'SWAP_ANIMATING';
                swapPair.animProgress = 0;
                animTimer = now;
            }
            break;
            
        case 'SWAP_ANIMATING':
            if (now - animTimer > 200) {
                const matches = findMatches();
                if (matches.size > 0) {
                    matched = matches;
                    comboCount = 1;
                    gameState = 'MATCHING';
                    animTimer = now;
                } else {
                    // Swap back and try again
                    swapTiles(swapPair.r1, swapPair.c1, swapPair.r2, swapPair.c2);
                    gameState = 'IDLE';
                    lastSwapTime = now;
                }
            }
            break;
            
        case 'MATCHING':
            if (now - animTimer > 300) {
                // Pop matched gems
                for (const key of matched) {
                    const [r, c] = key.split(',').map(Number);
                    createPopParticles(c, r, board[r][c]);
                    score += 10 * comboCount;
                }
                shakeAmount = Math.min(5, 2 + comboCount);
                flashAlpha = 0.3;
                
                // Remove matched gems
                for (const key of matched) {
                    const [r, c] = key.split(',').map(Number);
                    board[r][c] = -1;
                }
                
                gameState = 'MATCH_ANIMATING';
                animTimer = now;
            }
            break;
            
        case 'MATCH_ANIMATING':
            if (now - animTimer > 250) {
                applyGravity();
                gameState = 'FALLING';
                animTimer = now;
            }
            break;
            
        case 'FALLING':
            if (now - animTimer > 350) {
                const newMatches = findMatches();
                if (newMatches.size > 0) {
                    comboCount++;
                    matched = newMatches;
                    gameState = 'MATCHING';
                    animTimer = now;
                    shakeAmount = Math.min(8, 3 + comboCount);
                    flashAlpha = 0.4;
                } else {
                    gameState = 'IDLE';
                    lastSwapTime = now;
                }
            }
            break;
    }
    
    updateParticles();
    
    // Screen shake decay
    if (shakeAmount > 0) shakeAmount *= 0.9;
    if (shakeAmount < 0.1) shakeAmount = 0;
    
    // Flash decay
    if (flashAlpha > 0) flashAlpha *= 0.9;
    if (flashAlpha < 0.01) flashAlpha = 0;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Background
    const bgGrad = ctx.createRadialGradient(
        window.innerWidth/2, window.innerHeight/2, 100,
        window.innerWidth/2, window.innerHeight/2, window.innerWidth
    );
    bgGrad.addColorStop(0, '#1a1a3e');
    bgGrad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    
    // Apply screen shake
    if (shakeAmount > 0) {
        ctx.translate(
            (Math.random() - 0.5) * shakeAmount * 2,
            (Math.random() - 0.5) * shakeAmount * 2
        );
    }
    
    drawBoard();
    drawParticles();
    
    // Flash overlay
    if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
        ctx.fillRect(OFFSET_X - 20, OFFSET_Y - 20, BOARD_W + 40, BOARD_H + 40);
    }
    
    ctx.restore();
    
    drawScore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Handle swap animation visually
const originalDrawBoard = drawBoard;
drawBoard = function() {
    originalDrawBoard();
    
    // Draw swapping animation
    if (gameState === 'SWAPPING' && swapPair) {
        const t = easeInOutCubic(swapPair.animProgress);
        const p1 = cellToPixel(swapPair.c1, swapPair.r1);
        const p2 = cellToPixel(swapPair.c2, swapPair.r2);
        
        const cx = lerp(p1.x, p2.x, t);
        const cy = lerp(p1.y, p2.y, t);
        
        drawGem(cx, cy, board[swapPair.r1][swapPair.c1], 1.1, 1);
    }
};

// Resize canvas
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

initBoard();
gameLoop();
</script>
</body>
</html>
