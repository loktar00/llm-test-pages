<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow Globe Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510; /* Dark night background */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="globeCanvas"></canvas>
    <script>
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        let width, height, centerX, centerY, globeRadius;
        const NUM_SNOW = 600;
        const SHAKE_INTERVAL = 20000; // 20 seconds
        const SHAKE_DURATION = 2000;
        
        // State
        let time = 0;
        let shakeStartTime = 0;
        let isShaking = false;
        let snowParticles = [];
        
        // Globe Geometry
        const cx = 0, cy = 0; // Set in resize

        // Resize Handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            globeRadius = Math.min(width, height) * 0.35;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Snow {
            constructor() {
                this.reset();
            }

            reset() {
                // Start inside globe
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * globeRadius * 0.8;
                this.x = Math.cos(angle) * r;
                this.y = Math.sin(angle) * r;
                
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 2.5 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.5;
                this.settled = false;
                this.settledX = 0;
                this.settledY = 0;
            }

            update(dt, shakeIntensity) {
                if (this.settled) {
                    // Slight settling animation
                    if (Math.abs(this.x - this.settledX) > 0.1) {
                        this.x += (this.settledX - this.x) * 0.1;
                    } else {
                        this.settled = false;
                    }
                    return;
                }

                // Physics
                const gravity = 0.05;
                const drag = 0.96;

                // Turbulence based on shake
                if (shakeIntensity > 0) {
                    this.vx += (Math.random() - 0.5) * shakeIntensity * 2;
                    this.vy += (Math.random() - 0.5) * shakeIntensity * 2;
                    // Push outwards
                    const dx = this.x - cx;
                    const dy = this.y - cy;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 10) {
                        this.vx += (dx / dist) * shakeIntensity;
                        this.vy += (dy / dist) * shakeIntensity;
                    }
                }

                this.vy += gravity;
                this.vx *= drag;
                this.vy *= drag;

                this.x += this.vx;
                this.y += this.vy;

                // Collision with Ground (The floor of the globe)
                const floorY = cy + globeRadius * 0.65;
                
                // Simple collision resolution
                if (this.y > floorY) {
                    this.y = floorY;
                    this.vy = -this.vy * 0.3; // Bounce
                    this.vx *= 0.8; // Friction
                    
                    if (Math.abs(this.vy) < 0.2 && Math.abs(this.vx) < 0.2) {
                        this.settled = true;
                        this.settledX = this.x;
                        this.settledY = floorY;
                    }
                }

                // Containment (Circular)
                const dx = this.x - cx;
                const dy = this.y - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > globeRadius - this.size) {
                    const angle = Math.atan2(dy, dx);
                    this.x = cx + Math.cos(angle) * (globeRadius - this.size);
                    this.y = cy + Math.sin(angle) * (globeRadius - this.size);
                    
                    // Reflect velocity
                    const nx = Math.cos(angle);
                    const ny = Math.sin(angle);
                    const dot = this.vx * nx + this.vy * ny;
                    this.vx = (this.vx - 2 * dot * nx) * 0.8;
                    this.vy = (this.vy - 2 * dot * ny) * 0.8;
                }
            }
        }

        // Initialize Snow
        for (let i = 0; i < NUM_SNOW; i++) {
            snowParticles.push(new Snow());
        }

        // Drawing Helpers
        function drawBackground() {
            // Night sky gradient
            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height));
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Distant Stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for(let i=0; i<50; i++) {
                const sx = (Math.sin(i * 123.456) * width + width) % width;
                const sy = (Math.cos(i * 654.321) * height + height) % height;
                ctx.beginPath();
                ctx.arc(sx, sy, Math.random() * 1.5, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawBase() {
            const baseY = centerY + globeRadius * 1.1;
            const baseW = globeRadius * 1.4;
            const baseH = globeRadius * 0.3;

            // Base Shadow
            ctx.save();
            ctx.translate(centerX, baseY + 20);
            ctx.scale(1, 0.3);
            ctx.beginPath();
            ctx.arc(0, 0, baseW/2 + 10, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fill();
            ctx.restore();

            // Base Body (Dark Wood/Marble)
            const grad = ctx.createLinearGradient(centerX - baseW/2, baseY, centerX + baseW/2, baseY);
            grad.addColorStop(0, '#3d2b1f');
            grad.addColorStop(0.5, '#5c4033');
            grad.addColorStop(1, '#3d2b1f');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(centerX - baseW/2, baseY);
            ctx.quadraticCurveTo(centerX - baseW/2, baseY + baseH, centerX - baseW/2 + 10, baseY + baseH);
            ctx.lineTo(centerX + baseW/2 - 10, baseY + baseH);
            ctx.quadraticCurveTo(centerX + baseW/2, baseY + baseH, centerX + baseW/2, baseY);
            ctx.fill();

            // Gold trim
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function drawVillage() {
            const floorY = centerY + globeRadius * 0.65;
            
            // Ground Snow
            const snowGrad = ctx.createLinearGradient(cx, floorY - 20, cx, floorY + 40);
            snowGrad.addColorStop(0, '#e0f7fa');
            snowGrad.addColorStop(1, '#81d4fa');
            ctx.fillStyle = snowGrad;
            
            ctx.beginPath();
            // Create a curved floor shape
            ctx.ellipse(cx, floorY, globeRadius * 0.9, 60, 0, 0, Math.PI * 2);
            ctx.fill();

            // Helper to draw a tree
            const drawTree = (x, y, scale) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                
                // Trunk
                ctx.fillStyle = '#3e2723';
                ctx.fillRect(-3, -10, 6, 10);

                // Leaves (3 tiers)
                ctx.fillStyle = '#1b5e20';
                ctx.beginPath();
                ctx.moveTo(0, -50);
                ctx.lineTo(-15, -10);
                ctx.lineTo(15, -10);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -70);
                ctx.lineTo(-12, -30);
                ctx.lineTo(12, -30);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -90);
                ctx.lineTo(-9, -50);
                ctx.lineTo(9, -50);
                ctx.fill();

                ctx.restore();
            };

            // Helper to draw a cabin
            const drawCabin = (x, y, scale, color) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);

                // Wall
                ctx.fillStyle = color;
                ctx.fillRect(-20, -30, 40, 30);

                // Roof
                ctx.fillStyle = '#b71c1c'; // Red roof
                ctx.beginPath();
                ctx.moveTo(-25, -30);
                ctx.lineTo(0, -55);
                ctx.lineTo(25, -30);
                ctx.fill();

                // Snow on Roof
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.moveTo(-25, -30);
                ctx.lineTo(0, -52);
                ctx.lineTo(25, -30);
                ctx.lineTo(22, -28);
                ctx.lineTo(0, -48);
                ctx.lineTo(-22, -28);
                ctx.fill();

                // Door
                ctx.fillStyle = '#3e2723';
                ctx.fillRect(-5, -15, 10, 15);

                // Windows
                drawWindow(-10, -20, 6, 6);
                drawWindow(10, -20, 6, 6);

                ctx.restore();
            };

            const drawWindow = (x, y, w, h) => {
                // Glow
                const flicker = Math.random() * 0.2 + 0.8;
                ctx.shadowBlur = 10 * flicker;
                ctx.shadowColor = '#ffeb3b';
                ctx.fillStyle = `rgba(255, 235, 59, ${flicker})`;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0; // Reset
                
                // Frame
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);
                ctx.beginPath();
                ctx.moveTo(x + w/2, y);
                ctx.lineTo(x + w/2, y + h);
                ctx.moveTo(x, y + h/2);
                ctx.lineTo(x + w, y + h/2);
                ctx.stroke();
            };

            // Draw Objects
            // Order matters for depth
            drawTree(cx - 80, floorY - 5, 1.5);
            drawTree(cx + 90, floorY - 10, 1.2);
            drawTree(cx - 40, floorY - 15, 0.8);
            
            drawCabin(cx - 30, floorY - 5, 1, '#795548'); // Left Cabin
            drawCabin(cx + 40, floorY, 1.2, '#5d4037');  // Right Cabin
            
            // Chimney smoke (simple particles)
            const drawSmoke = (x, y) => {
                ctx.fillStyle = 'rgba(200,200,200,0.3)';
                for(let i=0; i<5; i++) {
                    const ox = Math.sin(time * 0.05 + i) * 5;
                    const oy = -i * 10 - (time * 0.5) % 50;
                    const r = 5 + i * 2;
                    const a = 0.3 - (i * 0.06);
                    ctx.globalAlpha = a;
                    ctx.beginPath();
                    ctx.arc(x + ox, y + oy, r, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            };
            
            drawSmoke(cx - 20, floorY - 55);
            drawSmoke(cx + 50, floorY - 60);
        }

        function drawSnowParticles() {
            ctx.fillStyle = 'white';
            for (let p of snowParticles) {
                ctx.globalAlpha = p.opacity;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawGlassOverlay() {
            // 1. Internal Darkening (atmosphere)
            const grad = ctx.createRadialGradient(cx, cy, globeRadius * 0.6, cx, cy, globeRadius);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,20,0.3)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, globeRadius, 0, Math.PI * 2);
            ctx.fill();

            // 2. Environment Reflection (Gradient)
            const refGrad = ctx.createLinearGradient(cx - globeRadius, cy - globeRadius, cx + globeRadius, cy + globeRadius);
            refGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
            refGrad.addColorStop(0.2, 'rgba(255, 255, 255, 0)');
            refGrad.addColorStop(0.8, 'rgba(255, 255, 255, 0)');
            refGrad.addColorStop(1, 'rgba(255, 255, 255, 0.1)');
            ctx.fillStyle = refGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, globeRadius, 0, Math.PI * 2);
            ctx.fill();

            // 3. Rim Shadow
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.arc(cx, cy, globeRadius, 0, Math.PI * 2);
            ctx.stroke();

            // 4. Specular Highlight (The "Glass" shine)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx - globeRadius*0.3, cy - globeRadius*0.3, globeRadius*0.15, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.filter = 'blur(4px)';
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            time++;
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            // Shake Logic
            let shakeIntensity = 0;
            const now = Date.now();
            if (isShaking) {
                const elapsed = now - shakeStartTime;
                const progress = elapsed / SHAKE_DURATION;
                
                if (progress >= 1) {
                    isShaking = false;
                } else {
                    // Shake curve: Ramp up, stay high, ramp down
                    if (progress < 0.2) shakeIntensity = progress / 0.2;
                    else if (progress < 0.8) shakeIntensity = 1;
                    else shakeIntensity = 1 - (progress - 0.8) / 0.2;
                    
                    // Jitter the canvas context
                    const jitterX = (Math.random() - 0.5) * shakeIntensity * 10;
                    const jitterY = (Math.random() - 0.5) * shakeIntensity * 10;
                    ctx.save();
                    ctx.translate(jitterX, jitterY);
                }
            }

            // Check for next shake
            if (!isShaking && (now - shakeStartTime > SHAKE_INTERVAL)) {
                isShaking = true;
                shakeStartTime = now;
            }
            
            // Ensure initial shake happens
            if (now - shakeStartTime > SHAKE_INTERVAL && !isShaking) {
                 isShaking = true;
                 shakeStartTime = now;
            }


            drawBase();
            drawVillage();

            // Update and Draw Snow
            // We apply a slight tilt to the global gravity vector if shaking
            const tilt = isShaking ? (Math.random()-0.5) * 0.05 : 0;
            
            for (let p of snowParticles) {
                p.update(1, shakeIntensity);
            }
            drawSnowParticles();

            // Restore context if shaken
            if (isShaking) {
                ctx.restore();
            }

            drawGlassOverlay();

            requestAnimationFrame(animate);
        }

        // Start
        shakeStartTime = Date.now(); // Trigger first shake soon
        animate();

    </script>
</body>
</html>
