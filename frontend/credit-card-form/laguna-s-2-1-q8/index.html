<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Credit Card Payment Form</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
  }

  .container {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card-preview {
    width: 320px;
    height: 200px;
    perspective: 1000px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    transform-style: preserve-3d;
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    backface-visibility: hidden;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 
      0 15px 35px rgba(0,0,0,0.4),
      inset 0 0 30px rgba(255,255,255,0.2);
  }

  .card-front {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .brand-mark {
    width: 60px;
    height: 40px;
    background: 
      radial-gradient(circle at 30% 30%, #ffd700, transparent),
      linear-gradient(90deg, #ff6b6b 0%, #4ecdc4 50%, #45b7d1 100%);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    box-shadow: 
      inset 0 0 8px rgba(0,0,0,0.3),
      0 0 12px rgba(255,215,0,0.4);
  }

  .brand-mark::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    height: 3px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
  }

  .card-number {
    font-family: 'Courier New', monospace;
    font-size: 20px;
    letter-spacing: 2px;
    text-align: center;
    margin: 20px 0;
  }

  .card-details {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .card-name {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .card-expiry {
    font-size: 14px;
    text-align: right;
  }

  .card-cvc {
    font-size: 16px;
    text-align: right;
    margin-top: 8px;
  }

  .card-back {
    background: linear-gradient(135deg, #2c3e50, #4ca1af);
    color: white;
    transform: rotateY(180deg);
    padding-top: 30px;
    padding-bottom: 30px;
  }

  .card-back .magnetic-strip {
    width: 100%;
    height: 40px;
    background: linear-gradient(90deg, #333, #555, #333);
    margin-bottom: 20px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .card-back .magnetic-strip::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 10px;
    right: 10px;
    height: 24px;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.1),
      rgba(255,255,255,0.1) 5px,
      rgba(0,0,0,0.1) 5px,
      rgba(0,0,0,0.1) 10px
    );
  }

  .card-back .cvc-box {
    background: #f0f0f0;
    color: #333;
    padding: 8px 12px;
    border-radius: 6px;
    text-align: right;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    display: inline-block;
    margin-top: 10px;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.2);
  }

  .form-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 320px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 13px;
    color: white;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  input {
    padding: 14px 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    font-size: 16px;
    background: rgba(255,255,255,0.15);
    color: white;
    transition: all 0.3s ease;
    outline: none;
    backdrop-filter: blur(10px);
  }

  input:focus {
    border-color: #ffd700;
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 15px rgba(255,215,0,0.3);
  }

  input::placeholder {
    color: rgba(255,255,255,0.5);
  }

  .submit-btn {
    padding: 14px;
    background: linear-gradient(135deg, #ffd700, #ffa500);
    color: #1a1a2e;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    margin-top: 10px;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255,215,0,0.4);
  }

  .submit-btn:active {
    transform: translateY(0);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card-preview">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="brand-mark"></div>
            <div style="font-size:12px; opacity:0.7;">****</div>
          </div>
          <div class="card-number" id="cardNumberPreview">#### #### #### ####</div>
          <div class="card-details">
            <div class="card-name" id="cardNamePreview">YOUR NAME</div>
            <div class="card-expiry" id="cardExpiryPreview">MM/YY</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="magnetic-strip"></div>
          <div class="card-cvc" id="cardCvcPreview">CVC</div>
        </div>
      </div>
    </div>

    <div class="form-container">
      <div class="form-group">
        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" />
      </div>

      <div class="form-group">
        <label for="cardName">Name on Card</label>
        <input type="text" id="cardName" placeholder="John Doe" />
      </div>

      <div style="display: flex; gap: 16px;">
        <div class="form-group" style="flex: 1;">
          <label for="cardExpiry">Expiry</label>
          <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5" />
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="cardCvc">CVC</label>
          <input type="text" id="cardCvc" placeholder="CVC" maxlength="3" />
        </div>
      </div>

      <button class="submit-btn">Pay Now</button>
    </div>
  </div>

<script>
  const cardInner = document.getElementById('cardInner');
  const cardNumberInput = document.getElementById('cardNumber');
  const cardNameInput = document.getElementById('cardName');
  const cardExpiryInput = document.getElementById('cardExpiry');
  const cardCvcInput = document.getElementById('cardCvc');

  const cardNumberPreview = document.getElementById('cardNumberPreview');
  const cardNamePreview = document.getElementById('cardNamePreview');
  const cardExpiryPreview = document.getElementById('cardExpiryPreview');
  const cardCvcPreview = document.getElementById('cardCvcPreview');

  // Format card number in groups of 4
  cardNumberInput.addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    let formatted = value.match(/.{1,4}/g);
    if (formatted) {
      e.target.value = formatted.join(' ');
    }
    updatePreview();
  });

  // Format expiry as MM/YY
  cardExpiryInput.addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length >= 2) {
      e.target.value = value.substring(0, 2) + '/' + value.substring(2, 4);
    }
    updatePreview();
  });

  // Update previews in real-time
  function updatePreview() {
    let number = cardNumberInput.value || '#### #### #### ####';
    cardNumberPreview.textContent = number;
    
    let name = cardNameInput.value || 'YOUR NAME';
    cardNamePreview.textContent = name.toUpperCase();
    
    let expiry = cardExpiryInput.value || 'MM/YY';
    cardExpiryPreview.textContent = expiry;

    let cvc = cardCvcInput.value || 'CVC';
    cardCvcPreview.textContent = cvc;
  }

  // Flip card on focus/blur for CVC
  cardCvcInput.addEventListener('focus', () => {
    cardInner.classList.add('flipped');
  });

  cardCvcInput.addEventListener('blur', () => {
    cardInner.classList.remove('flipped');
  });

  // Update previews on any input change
  [cardNumberInput, cardNameInput, cardExpiryInput, cardCvcInput].forEach(input => {
    input.addEventListener('input', updatePreview);
  });

  // Gentle hover effect on card
  const cardPreview = document.querySelector('.card-preview');
  let hoverTimer;

  cardPreview.addEventListener('mouseenter', () => {
    hoverTimer = setTimeout(() => {
      cardInner.style.transform = 'scale(1.03)';
    }, 300);
  });

  cardPreview.addEventListener('mouseleave', () => {
    clearTimeout(hoverTimer);
    cardInner.style.transform = 'scale(1)';
  });

  // Initialize
  updatePreview();
</script>
</body>
</html>
