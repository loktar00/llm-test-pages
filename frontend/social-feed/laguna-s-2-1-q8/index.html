<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Feed</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1d24;
    --muted: #6b7280;
    --accent: #3b82f6;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px;
    max-width: 640px;
    margin: 0 auto;
  }
  .feed { display: flex; flex-direction: column; gap: 16px; }
  /* Composer */
  .composer {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  .composer textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    min-height: 60px;
    font-size: 15px;
    line-height: 1.5;
    font-family: inherit;
  }
  /* Post Card */
  .post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  .post-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .author-info { display: flex; flex-direction: column; }
  .author-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .post-time { font-size: 12px; color: var(--muted); }
  .post-text {
    font-size: 15px;
    margin-bottom: 12px;
    word-break: break-word;
  }
  .post-image {
    width: 100%;
    height: 180px;
    border-radius: 12px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
  }
  .post-actions {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s;
    padding: 4px 0;
  }
  .action-btn:hover { color: var(--accent); }
  .like-count { font-weight: 600; }
  /* New Posts Pill */
  #newPostsPill {
    position: fixed;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: white;
    padding: 8px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    z-index: 100;
    cursor: pointer;
    transition: top 0.4s ease, box-shadow 0.4s ease;
    opacity: 0;
    pointer-events: none;
  }
  #newPostsPill.show {
    top: 16px;
    opacity: 1;
    pointer-events: auto;
  }
  /* Particles */
  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    animation: burst 0.8s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.5); opacity: 0; }
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .liked { animation: pulse 0.3s ease; }
</style>
</head>
<body>
  <div class="feed" id="feed">
    <!-- Composer -->
    <div class="composer">
      <textarea id="composerText" placeholder="What's on your mind?"></textarea>
    </div>
  </div>

  <div id="newPostsPill">New posts</div>

  <script>
    const feed = document.getElementById('feed');
    const posts = [
      { name: "Alex Morgan", time: "2m", text: "Just shipped a new feature after weeks of work. So grateful for the team!", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=60&h=60&fit=crop&crop=face", showImage: true },
      { name: "Sarah Chen", time: "1h", text: "Morning coffee and a good book. Sometimes that's all you need to reset. ☕📚", avatar: "https://images.unsplash.com/photo-1494790108377-be9c42009653?w=60&h=60&fit=crop&crop=face" },
      { name: "Jordan Williams", time: "3h", text: "The view from today's hike. Nature always puts things into perspective.", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=60&h=60&fit=crop&crop=face", showImage: true },
      { name: "Taylor Kim", time: "5h", text: "Working on something exciting. More details soon!", avatar: "https://images.unsplash.com/photo-1438566338082-f6f65f1b3a5b?w=60&h=60&fit=crop&crop=face" }
    ];

    function createPost(post) {
      const article = document.createElement('article');
      article.className = 'post';
      
      const header = document.createElement('div');
      header.className = 'post-header';
      
      const avatar = document.createElement('img');
      avatar.className = 'avatar';
      avatar.src = post.avatar;
      avatar.alt = post.name;
      
      const info = document.createElement('div');
      info.className = 'author-info';
      
      const name = document.createElement('span');
      name.className = 'author-name';
      name.textContent = post.name;
      
      const time = document.createElement('span');
      time.className = 'post-time';
      time.textContent = post.time;
      
      info.appendChild(name);
      info.appendChild(time);
      
      header.appendChild(avatar);
      header.appendChild(info);
      
      article.appendChild(header);
      
      const text = document.createElement('p');
      text.className = 'post-text';
      text.textContent = post.text;
      article.appendChild(text);
      
      if (post.showImage) {
        const img = document.createElement('div');
        img.className = 'post-image';
        article.appendChild(img);
      }
      
      const actions = document.createElement('div');
      actions.className = 'post-actions';
      
      const likeBtn = document.createElement('button');
      likeBtn.className = 'action-btn';
      likeBtn.innerHTML = '❤️ <span class="like-count">24</span>';
      likeBtn.addEventListener('click', function() {
        const countSpan = this.querySelector('.like-count');
        let count = parseInt(countSpan.textContent);
        count++;
        countSpan.textContent = count;
        
        this.classList.add('liked');
        setTimeout(() => this.classList.remove('liked'), 300);
        
        createBurst(event);
      });
      
      const commentBtn = document.createElement('button');
      commentBtn.className = 'action-btn';
      commentBtn.textContent = '💬 5';
      
      const shareBtn = document.createElement('button');
      shareBtn.className = 'action-btn';
      shareBtn.textContent = '↗️ 3';
      
      actions.appendChild(likeBtn);
      actions.appendChild(commentBtn);
      actions.appendChild(shareBtn);
      
      article.appendChild(actions);
      
      return article;
    }

    function createBurst(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const colors = ['#ef4444', '#f59e0b', '#eab308', '#84cc16', '#10b981', '#06b6d4', '#8b5cf6', '#ec4899'];
      
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const angle = (i / 12) * Math.PI * 2;
        const distance = 30 + Math.random() * 20;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';
        particle.style.backgroundColor = colors[i % colors.length];
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        
        document.body.appendChild(particle);
        
        setTimeout(() => {
          if (particle.parentNode) {
            particle.parentNode.removeChild(particle);
          }
        }, 800);
      }
    }

    // Initialize posts
    posts.forEach(post => {
      feed.appendChild(createPost(post));
    });

    // New posts pill functionality
    const pill = document.getElementById('newPostsPill');
    let pillTimeout;

    function showNewPostsPill() {
      clearTimeout(pillTimeout);
      pill.classList.add('show');
      pillTimeout = setTimeout(() => {
        pill.classList.remove('show');
      }, 6000);
    }

    pill.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      pill.classList.remove('show');
    });

    // Simulate new posts arriving periodically
    setInterval(() => {
      const newPost = createPost({
        name: "Riley Park",
        time: "now",
        text: "Beautiful sunset today! 🌅 Anyone else love golden hour?",
        avatar: "https://images.unsplash.com/photo-1472099645785-5644948ac913?w=60&h=60&fit=crop&crop=face"
      });
      
      // Insert after composer
      const composer = document.querySelector('.composer');
      feed.insertBefore(newPost, composer.nextSibling);
      
      showNewPostsPill();
    }, 8000);

    // Show pill after initial load delay
    setTimeout(showNewPostsPill, 5000);
  </script>
</body>
</html>
