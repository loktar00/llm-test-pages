<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Sand</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const CELL = 4;
let W, H, cols, rows;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  cols = Math.floor(W / CELL);
  rows = Math.floor(H / CELL);
  grid = new Uint8Array(cols * rows);
  gridLife = new Int16Array(cols * rows);
  gridErode = new Uint8Array(cols * rows);
  gridRegen = new Uint8Array(cols * rows);
  imageData = ctx.createImageData(W, H);
  pixels = imageData.data;
}

const EMPTY = 0, SAND = 1, WATER = 2, FIRE = 3, WOOD = 4, STONE = 5, STEAM = 6, SMOKE = 7;

let grid, gridLife, gridErode, gridRegen;
let pixels, imageData;
let tick = 0;

function idx(x, y) { return y * cols + x; }
function inBounds(x, y) { return x >= 0 && x < cols && y >= 0 && y < rows; }
function get(x, y) { return inBounds(x, y) ? grid[idx(x, y)] : -1; }
function set(x, y, type) {
  if (!inBounds(x, y)) return;
  const i = idx(x, y);
  grid[i] = type;
  gridLife[i] = type === FIRE ? (30 + Math.random() * 60 | 0) :
                type === STEAM ? (60 + Math.random() * 80 | 0) :
                type === SMOKE ? (40 + Math.random() * 50 | 0) : 0;
}
function swap(x1, y1, x2, y2) {
  const i1 = idx(x1, y1), i2 = idx(x2, y2);
  const t = grid[i1]; grid[i1] = grid[i2]; grid[i2] = t;
  const tl = gridLife[i1]; gridLife[i1] = gridLife[i2]; gridLife[i2] = tl;
  const te = gridErode[i1]; gridErode[i1] = gridErode[i2]; gridErode[i2] = te;
  const rg = gridRegen[i1]; gridRegen[i1] = gridRegen[i2]; gridRegen[i2] = rg;
}

// Ledge generation
let ledges = [];

function generateLedges() {
  ledges = [];
  const numLedges = 3 + (Math.random() * 3 | 0);
  for (let l = 0; l < numLedges; l++) {
    const yBase = Math.floor(rows * 0.35) + (l * rows * 0.15 | 0);
    const segments = [];
    let x = 0;
    while (x < cols) {
      const segW = 10 + (Math.random() * 30 | 0);
      const overhang = Math.random() < 0.3 ? (Math.random() * 15 | 0) : 0;
      const y = yBase + (Math.random() * 10 | 0) - 5 + overhang;
      segments.push({ xStart: x, xEnd: Math.min(x + segW, cols), y: Math.min(y, rows - 5) });
      x += segW + (Math.random() * 20 | 0);
    }
    ledges.push(segments);
  }
  buildLedges();
}

function buildLedges() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[idx(x, y)] === STONE) gridErode[idx(x, y)] = 0;
    }
  }
  for (const ledge of ledges) {
    for (const seg of ledge) {
      for (let x = seg.xStart; x < seg.xEnd && x < cols; x++) {
        for (let dy = 0; dy < 3; dy++) {
          const y = seg.y + dy;
          if (inBounds(x, y) && get(x, y) === EMPTY) {
            set(x, y, STONE);
          }
        }
      }
    }
  }
  // Add some wood platforms
  for (const ledge of ledges) {
    for (const seg of ledge) {
      if (Math.random() < 0.4) {
        const wx = seg.xStart + (Math.random() * (seg.xEnd - seg.xStart) | 0);
        const wy = seg.y - 1;
        if (inBounds(wx, wy) && get(wx, wy) === EMPTY) {
          for (let dx = -2; dx <= 2; dx++) {
            if (inBounds(wx + dx, wy) && get(wx + dx, wy) === EMPTY) {
              set(wx + dx, wy, WOOD);
            }
          }
        }
      }
    }
  }
}

function erodeLedges() {
  if (tick % 3 !== 0) return;
  for (let y = 0; y < rows - 1; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y);
      if (grid[i] === STONE && gridErode[i] < 128) {
        // Check if water is below or adjacent
        const below = get(x, y + 1);
        const left = get(x - 1, y);
        const right = get(x + 1, y);
        if (below === WATER || left === WATER || right === WATER) {
          gridErode[i]++;
          if (gridErode[i] >= 128 && Math.random() < 0.02) {
            set(x, y, WATER);
            gridErode[i] = 0;
          }
        }
      }
    }
  }
}

function regenerateLedges() {
  if (tick % 120 !== 0) return;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y);
      if (grid[i] === EMPTY && gridRegen[i] < 64) {
        gridRegen[i]++;
        if (gridRegen[i] >= 64 && Math.random() < 0.005) {
          set(x, y, STONE);
          gridRegen[i] = 0;
        }
      }
    }
  }
}

// Emitter
let emitterX = cols / 2;
let emitterDir = 1;
let emitterType = SAND;
let emitterTimer = 0;
let emitterPhase = 0;

function updateEmitter() {
  emitterX += emitterDir * 1.5;
  if (emitterX > cols - 10) emitterDir = -1;
  if (emitterX < 10) emitterDir = 1;

  emitterTimer++;
  if (emitterTimer > 8) {
    emitterTimer = 0;
    emitterPhase++;

    if (emitterPhase % 20 < 8) {
      emitterType = SAND;
    } else if (emitterPhase % 20 < 14) {
      emitterType = WATER;
    } else {
      emitterType = FIRE;
    }

    const ex = Math.floor(emitterX);
    for (let dy = 0; dy < 3; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (get(ex + dx, dy) === EMPTY) {
          if (emitterType === SAND && Math.random() < 0.6) set(ex + dx, dy, SAND);
          else if (emitterType === WATER && Math.random() < 0.4) set(ex + dx, dy, WATER);
          else if (emitterType === FIRE && Math.random() < 0.3) set(ex + dx, dy, FIRE);
        }
      }
    }
  }
}

// Physics
function updateSand(x, y) {
  const below = get(x, y + 1);
  if (below === EMPTY) {
    swap(x, y, x, y + 1);
    return true;
  }
  if (below === WATER) {
    swap(x, y, x, y + 1);
    return true;
  }

  const dir = Math.random() < 0.5 ? -1 : 1;
  const diag1 = get(x + dir, y + 1);
  if (diag1 === EMPTY) {
    swap(x, y, x + dir, y + 1);
    return true;
  }
  const diag2 = get(x - dir, y + 1);
  if (diag2 === EMPTY) {
    swap(x, y, x - dir, y + 1);
    return true;
  }

  // Angle of repose: slide along existing pile
  const side1 = get(x + dir, y);
  if (side1 === EMPTY && get(x + dir, y + 1) !== EMPTY) {
    swap(x, y, x + dir, y);
    return true;
  }
  const side2 = get(x - dir, y);
  if (side2 === EMPTY && get(x - dir, y + 1) !== EMPTY) {
    swap(x, y, x - dir, y);
    return true;
  }
  return false;
}

function updateWater(x, y) {
  const below = get(x, y + 1);
  if (below === EMPTY) {
    swap(x, y, x, y + 1);
    return true;
  }
  if (below === FIRE) {
    set(x, y + 1, STEAM);
    set(x, y, STEAM);
    return true;
  }

  const dir = Math.random() < 0.5 ? -1 : 1;
  const diag1 = get(x + dir, y + 1);
  if (diag1 === EMPTY) {
    swap(x, y, x + dir, y + 1);
    return true;
  }
  const diag2 = get(x - dir, y + 1);
  if (diag2 === EMPTY) {
    swap(x, y, x - dir, y + 1);
    return true;
  }

  // Flow horizontally
  const spread = 2 + (Math.random() * 3 | 0);
  for (let s = 1; s <= spread; s++) {
    if (get(x + dir * s, y) === EMPTY) {
      swap(x, y, x + dir * s, y);
      return true;
    }
  }
  for (let s = 1; s <= spread; s++) {
    if (get(x - dir * s, y) === EMPTY) {
      swap(x, y, x - dir * s, y);
      return true;
    }
  }
  return false;
}

function updateFire(x, y) {
  const i = idx(x, y);
  gridLife[i]--;
  if (gridLife[i] <= 0) {
    if (Math.random() < 0.3) set(x, y, SMOKE);
    else set(x, y, EMPTY);
    return true;
  }

  // Spread to wood
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (get(nx, ny) === WOOD && Math.random() < 0.08) {
        set(nx, ny, FIRE);
      }
      if (get(nx, ny) === WATER) {
        set(x, y, STEAM);
        set(nx, ny, STEAM);
        return true;
      }
    }
  }

  // Rise
  const above = get(x, y - 1);
  if (above === EMPTY && Math.random() < 0.7) {
    swap(x, y, x, y - 1);
    return true;
  }
  const ul = get(x - 1, y - 1);
  if (ul === EMPTY && Math.random() < 0.3) {
    swap(x, y, x - 1, y - 1);
    return true;
  }
  const ur = get(x + 1, y - 1);
  if (ur === EMPTY && Math.random() < 0.3) {
    swap(x, y, x + 1, y - 1);
    return true;
  }
  return false;
}

function updateSteamSmoke(x, y, type) {
  const i = idx(x, y);
  gridLife[i]--;
  if (gridLife[i] <= 0) {
    set(x, y, EMPTY);
    return true;
  }

  const above = get(x, y - 1);
  if (above === EMPTY && Math.random() < 0.6) {
    swap(x, y, x, y - 1);
    return true;
  }
  const ul = get(x - 1, y - 1);
  if (ul === EMPTY && Math.random() < 0.3) {
    swap(x, y, x - 1, y - 1);
    return true;
  }
  const ur = get(x + 1, y - 1);
  if (ur === EMPTY && Math.random() < 0.3) {
    swap(x, y, x + 1, y - 1);
    return true;
  }
  return false;
}

function updatePhysics() {
  // Process bottom to top for falling, top to bottom for rising
  const bottomUp = [];
  const topDown = [];

  for (let y = rows - 1; y >= 0; y--) {
    for (let x = 0; x < cols; x++) {
      const t = grid[idx(x, y)];
      if (t === SAND || t === WATER) bottomUp.push([x, y, t]);
      else if (t === FIRE || t === STEAM || t === SMOKE) topDown.push([x, y, t]);
    }
  }

  for (const [x, y, t] of bottomUp) {
    if (!inBounds(x, y)) continue;
    const i = idx(x, y);
    if (grid[i] !== t) continue;
    if (t === SAND) updateSand(x, y);
    else if (t === WATER) updateWater(x, y);
  }

  for (const [x, y, t] of topDown) {
    if (!inBounds(x, y)) continue;
    const i = idx(x, y);
    if (grid[i] !== t) continue;
    if (t === FIRE) updateFire(x, y);
    else if (t === STEAM || t === SMOKE) updateSteamSmoke(x, y, t);
  }
}

// Colors
function getColor(type, x, y) {
  const noise = ((x * 31 + y * 17 + tick * 3) & 0xFF) / 255;
  const noise2 = ((x * 7 + y * 23 + tick * 7) & 0xFF) / 255;

  switch (type) {
    case EMPTY: return [10, 10, 15];
    case SAND: {
      const v = 180 + noise * 40;
      return [v, v * 0.82, v * 0.55];
    }
    case WATER: {
      const v = 40 + noise * 20;
      return [v * 0.4, v * 0.6 + noise * 15, v + 30];
    }
    case FIRE: {
      const life = gridLife[idx(x, y)];
      const maxLife = 90;
      const ratio = Math.max(0, life / maxLife);
      if (ratio > 0.7) return [255, 200 + noise * 55, 50 + noise * 40];
      if (ratio > 0.4) return [255, 80 + noise * 60, 10 + noise * 20];
      return [200 + noise * 55, 30 + noise * 30, 10];
    }
    case WOOD: {
      const v = 100 + noise * 30;
      return [v * 0.7, v * 0.45, v * 0.2];
    }
    case STONE: {
      const v = 80 + noise * 30;
      return [v, v + 2, v + 5];
    }
    case STEAM: {
      const life = gridLife[idx(x, y)];
      const maxLife = 140;
      const ratio = Math.max(0, life / maxLife);
      const v = 150 + noise * 40;
      return [v * ratio, v * ratio, v * ratio];
    }
    case SMOKE: {
      const life = gridLife[idx(x, y)];
      const maxLife = 90;
      const ratio = Math.max(0, life / maxLife);
      const v = 60 + noise * 30;
      return [v * ratio, v * ratio, v * ratio];
    }
    default: return [0, 0, 0];
  }
}

function render() {
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const type = grid[idx(x, y)];
      const [r, g, b] = getColor(type, x, y);

      for (let py = 0; py < CELL; py++) {
        for (let px = 0; px < CELL; px++) {
          const sx = x * CELL + px;
          const sy = y * CELL + py;
          if (sx < W && sy < H) {
            const pi = (sy * W + sx) * 4;
            pixels[pi] = r;
            pixels[pi + 1] = g;
            pixels[pi + 2] = b;
            pixels[pi + 3] = 255;
          }
        }
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// Background gradient
function drawBackground() {
  for (let y = 0; y < rows; y++) {
    const t = y / rows;
    const r = Math.floor(8 + t * 5);
    const g = Math.floor(8 + t * 3);
    const b = Math.floor(15 + t * 10);
    for (let py = 0; py < CELL; py++) {
      for (let px = 0; px < CELL; px++) {
        const sx = px;
        const sy = y * CELL + py;
        if (sy < H) {
          for (let x = 0; x < cols; x++) {
            const pi = (sy * W + x * CELL + px) * 4;
            pixels[pi] = r;
            pixels[pi + 1] = g;
            pixels[pi + 2] = b;
            pixels[pi + 3] = 255;
          }
        }
      }
    }
  }
}

// Initialize
function init() {
  resize();
  generateLedges();
  drawBackground();
}

function loop() {
  tick++;
  updateEmitter();
  updatePhysics();
  erodeLedges();
  regenerateLedges();

  // Occasionally rebuild ledges for variety
  if (tick % 600 === 0) {
    const newLedges = [];
    const numLedges = 3 + (Math.random() * 3 | 0);
    for (let l = 0; l < numLedges; l++) {
      const yBase = Math.floor(rows * 0.35) + (l * rows * 0.15 | 0);
      const segments = [];
      let x = 0;
      while (x < cols) {
        const segW = 10 + (Math.random() * 30 | 0);
        const y = yBase + (Math.random() * 10 | 0) - 5;
        segments.push({ xStart: x, xEnd: Math.min(x + segW, cols), y: Math.min(y, rows - 5) });
        x += segW + (Math.random() * 20 | 0);
      }
      newLedges.push(segments);
    }
    ledges = newLedges;
    buildLedges();
  }

  render();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  const oldGrid = grid;
  const oldCols = cols;
  const oldRows = rows;
  resize();
  grid = new Uint8Array(cols * rows);
  gridLife = new Int16Array(cols * rows);
  gridErode = new Uint8Array(cols * rows);
  gridRegen = new Uint8Array(cols * rows);
  imageData = ctx.createImageData(W, H);
  pixels = imageData.data;

  // Copy old data
  const minCols = Math.min(oldCols, cols);
  const minRows = Math.min(oldRows, rows);
  for (let y = 0; y < minRows; y++) {
    for (let x = 0; x < minCols; x++) {
      grid[y * cols + x] = oldGrid[y * oldCols + x];
      gridLife[y * cols + x] = oldGrid[y * oldCols + x] ? (gridLife[y * oldCols + x] || 0) : 0;
    }
  }
  drawBackground();
});

init();
loop();
</script>
</body>
</html>
