<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Weather Map</title>
<style>
html,body{margin:0;background:#0a0c14;overflow:hidden;height:100;cursor:default}
canvas{display:block;position:fixed;inset:0}
*{user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
let W,H;
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
addEventListener('resize',resize);resize();

const L=c.getContext('2d');

// coastline
function l2(p,q){const n=0.4,d=0;return Math.sin(p*1.2+q*0.9)*n+Math.sin(p*1.9+d)*0.15+Math.sin(q*2.1+p*0.5)*0.25;}
function l3(p,q){const n=0.4,d=0;return Math.sin(p*2.7+q*1.4)*0.15+Math.sin(q*4+p*2)*0.05;}
function inLand(p,q){const r=l2(p,q)+l3(p,q);return r<0.1;}

function islandAt(px,py,base){const p=px+base*1000;const q=py+base*1000;const r=2.2-M(5.4,9.1,p)*5.5;return inLand(p,r);}
function inLandAt(px,py){return inLand(px*0.008,py*0.008);}

function islandAt(px,py,base){const p=px+base*1000;const q=py+base*1000;const r=2.2-M(5.4,9.1,p)*5.5;return inLand(p,r);}

// wind field
function wind(x,y){const t=Date.now()/8000;const ang=Math.sin(x*0.008)*0.6+Math.cos(y*0.008)*0.6+M(5.4,9.1,x*0.006+y*0.006)*Math.PI*2;const sp=0.5+M(3.7,2.1,x*0.012+y*0.012)*0.3;return[Math.cos(ang)*sp,Math.sin(ang)*sp;}

// systems: highs and lows
const SYS=[];
for(let i=0;i<7;i++)SYS.push({x:Math.random()*W,y:Math.random()*H,dx:0,dy:0,life:0,max:30+Math.random()*60,type:'H',r:30+Math.random()*40,age:0,age0:300+Math.random()*400});
for(let i=0;i<5;i++)SYS.push({x:Math.random()*W,y:Math.random()*H,dx:0,dy:0,life:0,max:30+Math.random()*60,type:'L',r:20+Math.random()*30,age:0,age0:300+Math.random()*400});

function spawn(){const s={x:Math.random()*W,y:Math.random()*H,dx:0,dy:0,life:0,max:30+Math.random()*60,type:Math.random()<0.5?'H':'L',r:20+Math.random()*40,age:0,age0:300+Math.random()*400};SYS.push(s);}

function updateSystems(){for(let i=0;i<SYS.length;i++){const s=SYS[i];s.age++;s.x+=s.dx;s.y+=s.dy;s.dx*=0.99;s.dy*=0.99;s.dx+=M(2.6,1.5,s.age*0.001)*0.4;s.dy+=M(8.7,4.2,s.age*0.001)*0.4;if(s.x<-20||s.x>W+20||s.y<-20||s.y>H+20||s.age>s.age0){s.dead=true;}}
for(let i=SYS.length-1;i>=0;i--){if(SYS[i].dead){SYS.splice(i,1);break;}}
if(SYS.length<12&&Math.random()<0.5)spawn();}

// wind with systems
function field(x,y){let vx=0,vy=0;for(let i=0;i<SYS.length;i++){const s=SYS[i];const dx=s.x-x,dy=s.y-y,d=Math.sqrt(dx*dx+dy*dy*1.5);const r=s.r;if(d<r&&d>0){const k=1-d/r;if(s.type==='H'){vx-=dy/r*0.3*k;vy+=dx/r*0.3*k;}else{vx+=dy/r*0.3*k,vy-=dx/r*0.3*k;}}}return(vx,vy);}

// particles
const P_COUNT=Math.min(2000,Math.max(800,Math.floor(W*H/600)));
const P=[];
for(let i=0;i<P_COUNT;i++)P.push({x:Math.random()*W,y:Math.random()*H,l:0});

// fronts (rain)
const F=[];
function spawnFront(){const dir=Math.random()<0.5?1:-1;const y=Math.random()*H*0.6+H*0.15;const x=Math.random()*W;const len=400+Math.random()*300;const sp=0.5+Math.random()*0.5;F.push({x,y,len,dir,sp,life:0,max:400+Math.random()*200,thick:30+Math.random()*40});}
for(let i=0;i<3;i++)spawnFront();

// temperature gradient
function tempAt(x,y){const c=0.004;const n=M(3.7,2.1,x*c)*0.5+M(8.7,4.2,y*c)*0.5+M(5.4,9.1,(x+y)*c)*0.3;const t=(y/H-M(5.4,9.1,x*0.003)*0.3+n*0.2);return t;}

function tempColor(t){t=Math.max(-1.6,Math.min(1.6,t);const colors=[[-10,-40,170,220],[2,-20,120,180],[16,50,100,150],[24,-80,150,175],[32,230,150,140],[38,230,120,130],[44,250,80,60],[52,10,50,120],[60,20,40,140],[68,50,40,150],[76,80,60,160]];let r=0,g=0,b=0,a=0;for(let i=0;i<colors.length;i++){const c=colors[i];const tt=c[0];if(t<tt+0.4&&t>tt-0.4){const k=Math.abs(t-tt);const w=Math.exp(-k*2);r+=(c[1]*w/4.0);g+=(c[2]*w/4.0);b+=(c[3]*w/4.0);a+=w;}}return(a>0?[r/a,g/a,b/a]:[0,0,0]);}

const TC=new Uint8ClampedArray(W*H*4);
function tempGradient(){for(let y=0;y<H;y++){for(let x=0;x<W;x++){const t=tempAt(x,y);const c=tempColor(t);const idx=(y*W+x)*4;TC[idx]=c[0]*0.5;TC[idx+1]=c[1]*0.5;TC[idx+2]=c[2]*0.5;TC[idx+3]=255;}}}
const img=new ImageData(TC,W,H);
L.putImageData(img,0,0);}
tempGradient();

// coastline draw
function coastline(){
L.lineWidth=12;L.lineCap='round';
L.fillStyle='#0e0e1c';L.beginPath();for(let x=0;x<W;x+=4){const y=x*0;L.lineTo(x,y);}L.fill();L.beginPath();
for(let x=0;x<W;x+=4){const y=x*0;if(inLandAt(x,y)){L.rect(x,y,4,4);}}L.fill();
L.fillStyle='#0e0e1c';L.beginPath();
for(let y=0;y<H;y+=4){for(let x=0;x<W;x+=4){if(inLandAt(x,y)){L.rect(x,y,4,4);}}}L.fill();
L.fillStyle='#0e0e1c';L.beginPath();
for(let y=0;y<H;y+=4){for(let x=0;x<W;x+=4){if(inLandAt(x,y)){L.rect(x,y,4,4);}}L.fill();
}

// main
function draw(){L.globalAlpha=1;
updateSystems();
L.fillStyle='rgba(10,12,20,0.05)';L.fillRect(0,0,W,H);
for(let i=0;i<P.length;i++){const p=P[i];const f=field(p.x,p.y);const w=wind(p.x,p.y);p.x+=w[0]*2+f[0]*2.2;p.y+=w[1]*2+f[1]*2.2;p.l++;if(p.x<0||p.x>W||p.y<0||p.y>H||p.l>100){p.x=Math.random()*W;p.y=Math.random()*H;p.l=0;}const inLand=inLandAt(p.x,p.y);if(inLand){if(Math.random()<0.1){p.x=Math.random()*W;p.y=Math.random()*H;p.l=0;}continue;}const ang=Math.atan2(w[1]+f[1]*10,w[0]+f[0]*10);const sp=Math.sqrt(({$});L.fillStyle='rgba(255,255,255,0.0';L.fillRect(p.x,p.y,0,0);
}
for(let i=0;i<F.length;i++){const f=F[i];f.life++;f.x+=f.sp*f.dir*2;if(f.life>10&&f.life<f.max){L.fillStyle='rgba(170,200,230,'+(Math.min(1,(f.life-10)/30)*(0.2+(Math.random()*0.1)))+')';L.beginPath();L.ellipse(f.x,f.y,f.len/2,f.thick/2,0,0,2*Math.PI);L.fill();L.fillStyle='rgba(200,220,250,'+(0.05)+')';L.beginPath();L.ellipse(f.x,f.y,f.len/2,f.thick*2/2,0,0,2*Math.PI);L.fill();}}
for(let i=F.length-1;i>=0;i--){if(F[i].life>F[i].max)F.splice(i,1);}if(Math.random()<0.2&&F.length<5)spawnFront();
for(let i=0;i<SYS.length;i++){const s=SYS[i];const op=Math.min(1,s.age/30)*Math.min(1,Math.max(0,1-(s.age-s.age0)/30));L.font='italic 600 14px "Times New Roman",serif';L.fillStyle='rgba(245,235,205,'+op+')';L.fillText(s.type,L.x-6,s.y-8);L.strokeStyle='rgba(245,235,205,'+op*0.5+')';L.lineWidth=1;L.beginPath();L.ellipse(s.x,s.y,s.r,s.r*0.8,0,0,2*Math.PI);L.stroke();L.fillStyle='rgba(10,12,20,'+op+')';L.beginPath();L.arc(s.x,s.y,3,0,2*Math.PI);L.fill();}
L.font='11px sans';L.fillStyle='rgba(180,180,200,0.4)';L.fillText('H  —  High Pressure    L  —  Low Pressure    ◦  —  Wind    ◐  —  Front',8,H-10);
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
