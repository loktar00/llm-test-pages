<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Showcase</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --grid-line: #e5e5e7;
            
            /* Palette */
            --c-primary: #007aff;
            --c-secondary: #5e5ce6;
            --c-accent: #bf5af2;
            --c-success: #34c759;
            --c-warning: #ff9500;
            --c-danger: #ff3b30;
            
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: var(--font-stack);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 100px;
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 32px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .chart-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .chart-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px -12px rgba(0,0,0,0.12);
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        /* Shared Tooltip */
        .tooltip {
            position: fixed;
            pointer-events: none;
            background: rgba(29, 29, 31, 0.95);
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(8px) scale(0.95);
            transition: opacity 0.15s ease, transform 0.15s ease;
            z-index: 100;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tooltip.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .tooltip-label { color: rgba(255,255,255,0.6); font-size: 11px; display: block; margin-bottom: 2px; }
        .tooltip-value { font-size: 15px; font-weight: 700; }
        .tooltip-dot { height: 6px; width: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* --- Bar Chart --- */
        .bar-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 300px;
            padding-top: 40px;
            gap: 12px;
        }

        .bar-group {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            border-radius: 8px 8px 4px 4px;
            background: var(--grid-line);
            height: 0; /* Animated */
            transition: height 1.2s var(--ease-out-expo), background 0.3s;
            position: relative;
            cursor: pointer;
        }
        
        .bar:hover { filter: brightness(0.95); }

        .bar-label {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Grid Lines for Bar */
        .grid-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }
        .grid-line {
            width: 100%;
            height: 1px;
            background: var(--grid-line);
            opacity: 0.5;
        }

        /* --- Line Chart --- */
        .line-chart-wrapper {
            position: relative;
            height: 300px;
            width: 100%;
        }

        svg.line-chart {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .grid-line-h { stroke: var(--grid-line); stroke-width: 1; }
        .axis-label { fill: var(--text-secondary); font-size: 11px; font-family: var(--font-stack); }

        .line-path {
            fill: none;
            stroke: var(--c-primary);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 2s var(--ease-out-expo);
        }

        .dot {
            fill: var(--surface);
            stroke: var(--c-primary);
            stroke-width: 2;
            r: 0;
            transition: r 0.3s ease;
            cursor: pointer;
        }
        
        .dot.active { r: 6; }

        /* --- Donut Chart --- */
        .donut-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            position: relative;
        }

        .donut-chart {
            width: 240px;
            height: 240px;
            position: relative;
            margin-bottom: 24px;
        }

        .donut-segment {
            fill: transparent;
            stroke-width: 32;
            stroke-linecap: butt;
            transition: stroke-dasharray 1.5s var(--ease-out-expo), stroke-dashoffset 1.5s var(--ease-out-expo);
            cursor: pointer;
        }

        .donut-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .donut-total {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            display: block;
        }

        .donut-sub {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .legend-dot { width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; }

    </style>
</head>
<body>

    <header>
        <h1>Data in Motion</h1>
        <p class="subtitle">Scroll to animate</p>
    </header>

    <div class="charts-grid">
        
        <!-- Bar Chart -->
        <div class="chart-card" id="bar-card">
            <div class="chart-title">Weekly Revenue</div>
            <div class="bar-container" id="bar-chart">
                <!-- JS will populate -->
            </div>
        </div>

        <!-- Line Chart -->
        <div class="chart-card" id="line-card">
            <div class="chart-title">User Growth</div>
            <div class="line-chart-wrapper">
                <svg class="line-chart" id="line-svg">
                    <!-- Grid lines -->
                    <g class="grid" id="line-grid"></g>
                    <path class="line-path" id="line-path" d="" />
                    <g id="line-dots"></g>
                </svg>
            </div>
        </div>

        <!-- Donut Chart -->
        <div class="chart-card" id="donut-card">
            <div class="chart-title">Market Share</div>
            <div class="donut-wrapper">
                <svg class="donut-chart" viewBox="0 0 100 100" id="donut-svg">
                    <defs>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
                        </filter>
                    </defs>
                    <!-- Segments injected by JS -->
                </svg>
                <div class="donut-center">
                    <span class="donut-total" id="donut-total">0</span>
                    <span class="donut-sub">Total</span>
                </div>
            </div>
            <div class="legend" id="donut-legend"></div>
        </div>

    </div>

    <!-- Shared Tooltip Element -->
    <div class="tooltip" id="tooltip">
        <span class="tooltip-dot" id="tt-dot"></span>
        <span class="tooltip-label" id="tt-label"></span>
        <span class="tooltip-value" id="tt-value"></span>
    </div>

    <script>
        // --- Configuration & Data ---
        const colors = ['#007aff', '#5e5ce6', '#bf5af2', '#34c759', '#ff9500', '#ff3b30'];
        
        const barData = [
            { label: 'Mon', value: 65, color: colors[0] },
            { label: 'Tue', value: 45, color: colors[1] },
            { label: 'Wed', value: 80, color: colors[2] },
            { label: 'Thu', value: 55, color: colors[3] },
            { label: 'Fri', value: 90, color: colors[4] },
            { label: 'Sat', value: 70, color: colors[5] }
        ];

        const lineData = [
            { x: 0, y: 10 }, { x: 1, y: 25 }, { x: 2, y: 20 }, 
            { x: 3, y: 40 }, { x: 4, y: 35 }, { x: 5, y: 65 }, 
            { x: 6, y: 55 }, { x: 7, y: 80 }, { x: 8, y: 70 }, { x: 9, y: 95 }
        ];

        const donutData = [
            { label: 'Product A', value: 35, color: colors[0] },
            { label: 'Product B', value: 25, color: colors[1] },
            { label: 'Product C', value: 20, color: colors[2] },
            { label: 'Product D', value: 20, color: colors[3] }
        ];

        // --- Utilities ---
        const tooltip = document.getElementById('tooltip');
        const ttLabel = document.getElementById('tt-label');
        const ttValue = document.getElementById('tt-value');
        const ttDot = document.getElementById('tt-dot');

        function showTooltip(e, label, value, color) {
            ttLabel.textContent = label;
            ttValue.textContent = value;
            ttDot.style.backgroundColor = color;
            tooltip.classList.add('visible');
            moveTooltip(e);
        }

        function moveTooltip(e) {
            const x = e.clientX;
            const y = e.clientY;
            const pad = 15;
            
            // Simple boundary checks could go here, but fixed offset works for polish
            tooltip.style.left = (x + pad) + 'px';
            tooltip.style.top = (y - 40) + 'px';
            
            // Flip if too close to right edge
            const rect = tooltip.getBoundingClientRect();
            if (rect.right > window.innerWidth) {
                tooltip.style.left = (x - rect.width - pad) + 'px';
            }
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        // --- Intersection Observer ---
        const observerOptions = { threshold: 0.2 };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    animateChart(entry.target.id);
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.chart-card').forEach(card => observer.observe(card));

        // --- Bar Chart Logic ---
        function initBarChart() {
            const container = document.getElementById('bar-chart');
            const maxVal = Math.max(...barData.map(d => d.value));
            
            // Create Grid Lines
            const grid = document.createElement('div');
            grid.className = 'grid-lines';
            for(let i=0; i<4; i++) {
                const line = document.createElement('div');
                line.className = 'grid-line';
                grid.appendChild(line);
            }
            container.appendChild(grid);

            barData.forEach((d, i) => {
                const group = document.createElement('div');
                group.className = 'bar-group';
                
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.dataset.targetHeight = (d.value / maxVal) * 100; // percent
                bar.style.background = d.color;
                
                // Interaction
                bar.addEventListener('mousemove', (e) => showTooltip(e, d.label, `$${d.value}k`, d.color));
                bar.addEventListener('mouseleave', hideTooltip);

                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = d.label;

                group.appendChild(bar);
                group.appendChild(label);
                container.appendChild(group);
            });
        }

        function animateBar() {
            const bars = document.querySelectorAll('.bar');
            bars.forEach((bar, i) => {
                // Staggered animation
                setTimeout(() => {
                    bar.style.height = bar.dataset.targetHeight + '%';
                }, i * 100);
            });
        }

        // --- Line Chart Logic ---
        function initLineChart() {
            const svg = document.getElementById('line-svg');
            const path = document.getElementById('line-path');
            const dotsGroup = document.getElementById('line-dots');
            const gridGroup = document.getElementById('line-grid');
            
            const width = svg.clientWidth || 300;
            const height = svg.clientHeight || 300;
            const padding = 20;
            
            const maxVal = Math.max(...lineData.map(d => d.y)) * 1.1;

            // Helper to map coordinates
            const getX = (i) => (i / (lineData.length - 1)) * (width - padding * 2) + padding;
            const getY = (val) => height - ((val / maxVal) * (height - padding * 2)) - padding;

            // Build Grid
            for(let i=0; i<=4; i++) {
                const y = height - (i/4) * (height - padding*2);
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", padding);
                line.setAttribute("x2", width - padding);
                line.setAttribute("y1", y);
                line.setAttribute("y2", y);
                line.setAttribute("class", "grid-line-h");
                gridGroup.appendChild(line);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", padding - 5);
                text.setAttribute("y", y + 3);
                text.setAttribute("text-anchor", "end");
                text.setAttribute("class", "axis-label");
                text.textContent = Math.round((maxVal/4)*i);
                gridGroup.appendChild(text);
            }

            // Build Path Data
            let d = `M ${getX(0)} ${getY(lineData[0].y)}`;
            lineData.forEach((d, i) => {
                if(i > 0) d += ` L ${getX(i)} ${getY(d.y)}`;
            });
            path.setAttribute('d', d);

            // Build Dots
            lineData.forEach((d, i) => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", getX(i));
                circle.setAttribute("cy", getY(d.y));
                circle.setAttribute("class", "dot");
                circle.dataset.index = i;
                
                circle.addEventListener('mouseenter', (e) => {
                    circle.classList.add('active');
                    showTooltip(e, "Day " + (i+1), d.y + " Users", colors[0]);
                });
                circle.addEventListener('mouseleave', (e) => {
                    circle.classList.remove('active');
                    hideTooltip();
                });
                
                dotsGroup.appendChild(circle);
            });
        }

        function animateLine() {
            const path = document.getElementById('line-path');
            const dots = document.querySelectorAll('.dot');
            
            // Animate Path
            const length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;
            path.getBoundingClientRect(); // Trigger reflow
            path.style.strokeDashoffset = '0';

            // Animate Dots (Appear sequentially)
            dots.forEach((dot, i) => {
                setTimeout(() => {
                    dot.setAttribute("r", "4"); // Default size
                }, 1500 + (i * 100)); // Wait for line to roughly finish
            });
        }

        // --- Donut Chart Logic ---
        function initDonutChart() {
            const svg = document.getElementById('donut-svg');
            const legend = document.getElementById('donut-legend');
            const total = donutData.reduce((a, b) => a + b.value, 0);
            
            const radius = 40;
            const circumference = 2 * Math.PI * radius;
            let offset = 0;

            donutData.forEach((d, i) => {
                // SVG Segment
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx",
