<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gauntlet Crawl</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
window.ASSET_MANIFEST = {
  floor:     { file: "assets/floor.png",     prompt: "512x512 seamless dungeon floor tile, stone tiles with cracks and grout lines, dark grey and brown palette, top-down view, game asset on plain background" },
  wall:      { file: "assets/wall.png",      prompt: "512x512 seamless dungeon wall tile, dark stone bricks with mortar, deep shadows, purple-tinged lighting, top-down view, game asset on plain background" },
  hero:      { file: "assets/hero.png",      prompt: "top-down hero knight sprite, centered, wearing golden armor with red cape, holding sword, plain dark background, 64x64 game asset" },
  ghost:     { file: "assets/ghost.png",     prompt: "top-down ghost enemy sprite, centered, translucent white-blue spectral figure with flowing shape, plain dark background, 64x64 game asset" },
  grunt:     { file: "assets/grunt.png",     prompt: "top-down grunt monster sprite, centered, green-skinned orc warrior with crude armor and axe, plain dark background, 64x64 game asset" },
  generator: { file: "assets/generator.png", prompt: "top-down monster generator sprite, centered, dark purple stone pedestal with swirling red energy and skull motifs, plain dark background, 64x64 game asset" },
  key:       { file: "assets/key.png",       prompt: "top-down golden key sprite, centered, ornate medieval key with glowing gold, plain dark background, 32x32 game asset" },
  food:      { file: "assets/food.png",      prompt: "top-down roasted chicken leg sprite, centered, golden-brown meat with herbs, plain dark background, 32x32 game asset" },
  treasure:  { file: "assets/treasure.png",  prompt: "top-down golden treasure chest sprite, centered, ornate wooden chest overflowing with gold coins and gems, plain dark background, 32x32 game asset" },
  exit:      { file: "assets/exit.png",      prompt: "top-down glowing exit portal sprite, centered, swirling blue-white magical portal with runes, plain dark background, 32x32 game asset" }
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, TILE;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  TILE = Math.max(24, Math.min(48, Math.floor(Math.min(W / 20, H / 16))));
}
resize();
window.addEventListener('resize', resize);

// --- Asset Loading ---
const loadedImages = {};
function loadAssets() {
  for (const [key, info] of Object.entries(window.ASSET_MANIFEST)) {
    const img = new Image();
    img.onload = () => { loadedImages[key] = img; };
    img.onerror = () => { loadedImages[key] = null; };
    img.src = info.file;
  }
}
loadAssets();

function drawAsset(key, x, y, size) {
  const img = loadedImages[key];
  if (img) {
    ctx.drawImage(img, x, y, size, size);
  } else {
    drawProcedural(key, x, y, size);
  }
}

// --- Procedural Art ---
function drawProcedural(key, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  switch(key) {
    case 'floor':
      ctx.fillStyle = '#2a2520';
      ctx.fillRect(0, 0, s, s);
      ctx.strokeStyle = '#1e1a16';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, 0, s, s);
      ctx.fillStyle = '#332e28';
      for (let i = 0; i < 3; i++) {
        const rx = ((s * 0.3 * (i + 1)) + 5) % s;
        const ry = ((s * 0.4 * (i + 2)) + 3) % s;
        ctx.fillRect(rx, ry, 3, 2);
      }
      ctx.fillStyle = '#221e1a';
      ctx.fillRect(s*0.5, s*0.5, 2, 2);
      break;
    case 'wall':
      ctx.fillStyle = '#1a1520';
      ctx.fillRect(0, 0, s, s);
      ctx.fillStyle = '#251e30';
      for (let row = 0; row < 3; row++) {
        const offset = (row % 2) * s * 0.5;
        for (let col = -1; col < 3; col++) {
          ctx.fillRect(offset + col * s * 0.5, row * s/3, s*0.48, s/3 - 1);
        }
      }
      ctx.fillStyle = '#302840';
      ctx.fillRect(2, 2, s*0.48, s/3 - 2);
      ctx.fillRect(s*0.52, s/3 + 2, s*0.48, s/3 - 2);
      break;
    case 'hero':
      ctx.fillStyle = '#4488cc';
      ctx.beginPath();
      ctx.arc(s/2, s/2, s*0.35, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#66aadd';
      ctx.beginPath();
      ctx.arc(s/2, s/2 - 2, s*0.25, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#ffcc44';
      ctx.fillRect(s*0.35, s*0.15, s*0.3, s*0.15);
      ctx.fillStyle = '#884422';
      ctx.fillRect(s*0.3, s*0.7, s*0.15, s*0.25);
      ctx.fillRect(s*0.55, s*0.7, s*0.15, s*0.25);
      ctx.fillStyle = '#ff6644';
      ctx.fillRect(s*0.15, s*0.3, s*0.12, s*0.5);
      break;
    case 'ghost':
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#aaddff';
      ctx.beginPath();
      ctx.arc(s/2, s*0.4, s*0.3, Math.PI, 0);
      ctx.lineTo(s*0.8, s*0.8);
      for (let i = 3; i > 0; i--) {
        ctx.lineTo(s/2 + i*s*0.25, s*0.65 + (i%2)*s*0.1);
        ctx.lineTo(s/2 + (i-1)*s*0.25, s*0.8);
      }
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(s*0.4, s*0.38, 3, 0, Math.PI*2);
      ctx.arc(s*0.6, s*0.38, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.arc(s*0.4, s*0.38, 1.5, 0, Math.PI*2);
      ctx.arc(s*0.6, s*0.38, 1.5, 0, Math.PI*2);
      ctx.fill();
      break;
    case 'grunt':
      ctx.fillStyle = '#44aa44';
      ctx.beginPath();
      ctx.arc(s/2, s*0.45, s*0.3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#338833';
      ctx.fillRect(s*0.2, s*0.5, s*0.6, s*0.35);
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(s*0.38, s*0.38, 3, 0, Math.PI*2);
      ctx.arc(s*0.62, s*0.38, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#888';
      ctx.save();
      ctx.translate(s*0.75, s*0.3);
      ctx.rotate(Math.PI/4);
      ctx.fillRect(0, 0, s*0.2, s*0.06);
      ctx.fillRect(s*0.15, -s*0.15, s*0.06, s*0.25);
      ctx.restore();
      break;
    case 'generator':
      ctx.fillStyle = '#332244';
      ctx.fillRect(2, 2, s-4, s-4);
      ctx.fillStyle = '#553366';
      ctx.fillRect(s*0.2, s*0.2, s*0.6, s*0.6);
      ctx.fillStyle = '#8844aa';
      ctx.beginPath();
      ctx.arc(s/2, s/2, s*0.15, 0, Math.PI*2);
      ctx.fill();
      const t = Date.now() / 300;
      ctx.fillStyle = `rgba(255, ${60 + Math.sin(t)*40}, ${100 + Math.cos(t)*50}, 0.8)`;
      ctx.beginPath();
      ctx.arc(s/2, s/2, s*0.1, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#664488';
      ctx.fillRect(s*0.1, s*0.1, s*0.15, s*0.15);
      ctx.fillRect(s*0.75, s*0.1, s*0.15, s*0.15);
      ctx.fillRect(s*0.1, s*0.75, s*0.15, s*0.15);
      ctx.fillRect(s*0.75, s*0.75, s*0.15, s*0.15);
      break;
    case 'key':
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(s*0.3, s*0.35, s*0.2, 0, Math.PI*2);
      ctx.fill();
      ctx.fillRect(s*0.45, s*0.3, s*0.45, s*0.15);
      ctx.fillRect(s*0.7, s*0.45, s*0.1, s*0.2);
      ctx.fillRect(s*0.7, s*0.55, s*0.15, s*0.1);
      ctx.fillStyle = '#ffee66';
      ctx.beginPath();
      ctx.arc(s*0.3, s*0.35, s*0.1, 0, Math.PI*2);
      ctx.fill();
      break;
    case 'food':
      ctx.fillStyle = '#cc8844';
      ctx.beginPath();
      ctx.ellipse(s*0.5, s*0.5, s*0.35, s*0.2, Math.PI/4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#ddaa66';
      ctx.beginPath();
      ctx.ellipse(s*0.5, s*0.48, s*0.25, s*0.13, Math.PI/4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#66aa44';
      ctx.fillRect(s*0.7, s*0.2, s*0.05, s*0.15);
      ctx.fillRect(s*0.65, s*0.15, s*0.15, s*0.05);
      break;
    case 'treasure':
      ctx.fillStyle = '#886622';
      ctx.fillRect(s*0.15, s*0.4, s*0.7, s*0.5);
      ctx.fillStyle = '#aa8833';
      ctx.fillRect(s*0.15, s*0.35, s*0.7, s*0.15);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(s*0.42, s*0.35, s*0.16, s*0.2);
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.arc(s*0.5, s*0.25, s*0.1, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(s*0.2, s*0.45, s*0.1, s*0.05);
      ctx.fillRect(s*0.7, s*0.5, s*0.08, s*0.05);
      break;
    case 'exit':
      const et = Date.now() / 200;
      const er = 8 + Math.sin(et) * 3;
      const grad = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, er + 4);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, '#88ccff');
      grad.addColorStop(0.7, '#4488cc');
      grad.addColorStop(1, 'rgba(40,80,140,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s/2, s/2, er + 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#aaddff';
      ctx.font = `${s*0.4}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('▼', s/2, s/2);
      break;
  }
  ctx.restore();
}

// --- Game Constants ---
const MAZE_W = 40, MAZE_H = 30;
const T_FLOOR = 0, T_WALL = 1, T_DOOR = 2, T_EXIT = 3;
const HERO_SPEED = 2.5;
const BULLET_SPEED = 6;
const HEALTH_DRAIN = 1.5; // per second
const MAX_HEALTH = 100;
const AI_TIMEOUT = 10000;

// --- Game State ---
let gameState = 'playing'; // 'playing', 'gameover'
let level = 1;
let score = 0;
let keys = 0;
let health = MAX_HEALTH;
let maze = [];
let hero = null;
let enemies = [];
let bullets = [];
let particles = [];
let generators = [];
let items = []; // keys, food, treasure
let exitPos = null;
let lastTime = 0;
let humanInput = false;
let humanTimer = 0;
let keysDown = {};
let aiTarget = null;
let aiPath = [];
let aiPathTimer = 0;
let shakeTimer = 0;
let shakeIntensity = 0;
let gameOverTimer = 0;
let spawnTimer = 0;
let aiExploration = [];

// --- Maze Generation ---
function generateMaze() {
  maze = [];
  for (let y = 0; y < MAZE_H; y++) {
    maze[y] = [];
    for (let x = 0; x < MAZE_W; x++) {
      maze[y][x] = T_WALL;
    }
  }

  // Recursive backtracker
  const visited = Array.from({length: MAZE_H}, () => Array(MAZE_W).fill(false));
  const stack = [];
  const sx = 1, sy = 1;
  maze[sy][sx] = T_FLOOR;
  visited[sy][sx] = true;
  stack.push([sx, sy]);

  while (stack.length > 0) {
    const [cx, cy] = stack[stack.length - 1];
    const neighbors = [];
    const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx > 0 && nx < MAZE_W-1 && ny > 0 && ny < MAZE_H-1 && !visited[ny][nx]) {
        neighbors.push([nx, ny, cx + dx/2, cy + dy/2]);
      }
    }
    if (neighbors.length === 0) {
      stack.pop();
    } else {
      const [nx, ny, wx, wy] = neighbors[Math.floor(Math.random() * neighbors.length)];
      maze[wy][wx] = T_FLOOR;
      maze[ny][nx] = T_FLOOR;
      visited[ny][nx] = true;
      stack.push([nx, ny]);
    }
  }

  // Add some extra openings for more open areas
  for (let i = 0; i < MAZE_W * MAZE_H * 0.03; i++) {
    const x = 1 + Math.floor(Math.random() * (MAZE_W - 2));
    const y = 1 + Math.floor(Math.random() * (MAZE_H - 2));
    if (maze[y][x] === T_WALL) {
      let adjFloor = 0;
      for (const [dx, dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
        if (maze[y+dy] && maze[y+dy][x+dx] === T_FLOOR) adjFloor++;
      }
      if (adjFloor >= 2) maze[y][x] = T_FLOOR;
    }
  }

  // Find all floor positions
  const floors = [];
  for (let y = 1; y < MAZE_H - 1; y++) {
    for (let x = 1; x < MAZE_W - 1; x++) {
      if (maze[y][x] === T_FLOOR) floors.push([x, y]);
    }
  }

  if (floors.length < 10) return generateMaze();

  // Place hero at a corner-ish area
  const heroPos = floors[Math.floor(floors.length * 0.1)];
  hero = {
    x: heroPos[0] * TILE + TILE/2,
    y: heroPos[1] * TILE + TILE/2,
    dir: 0, // 0=up,1=right,2=down,3=left
    angle: 0,
    shootCooldown: 0,
    invincible: 0
  };

  // Find exit far from hero
  let maxDist = 0, exitIdx = 0;
  for (let i = 0; i < floors.length; i++) {
    const dx = (floors[i][0] - heroPos[0]) * TILE;
    const dy = (floors[i][1] - heroPos[1]) * TILE;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > maxDist) { maxDist = d; exitIdx = i; }
  }
  exitPos = { x: floors[exitIdx][0], y: floors[exitIdx][1] };
  maze[exitPos.y][exitPos.x] = T_EXIT;

  // Place doors
  const doorCount = Math.min(5 + level, 12);
  const doorCandidates = floors.filter(([fx, fy]) => {
    return maze[fy][fx] === T_FLOOR &&
           ((fx > 0 && maze[fy][fx-1] === T_WALL) ||
            (fx < MAZE_W-1 && maze[fy][fx+1] === T_WALL) ||
            (fy > 0 && maze[fy-1][fx] === T_WALL) ||
            (fy < MAZE_H-1 && maze[fy+1][fx] === T_WALL));
  });
  shuffle(doorCandidates);
  for (let i = 0; i < Math.min(doorCount, doorCandidates.length); i++) {
    const [dx, dy] = doorCandidates[i];
    maze[dy][dx] = T_DOOR;
  }

  // Place generators
  generators = [];
  const genCount = Math.min(2 + Math.floor(level * 0.8), 6);
  const genCandidates = floors.filter(([fx, fy]) => {
    const dist = Math.abs(fx - heroPos[0]) + Math.abs(fy - heroPos[1]);
    return dist > 8 && maze[fy][fx] === T_FLOOR;
  });
  shuffle(genCandidates);
  for (let i = 0; i < Math.min(genCount, genCandidates.length); i++) {
    const [gx, gy] = genCandidates[i];
    generators.push({ x: gx, y: gy, health: 3 + Math.floor(level/2), alive: true, spawnTimer: 0 });
    maze[gy][gx] = T_DOOR; // generators sit behind doors
  }

  // Place items
  items = [];
  const keyCount = Math.min(1 + Math.floor(level/2), 4);
  const itemCandidates = floors.filter(([fx, fy]) => {
    return maze[fy][fx] === T_FLOOR && !(fx === heroPos[0] && fy === heroPos[1]) && !(fx === exitPos.x && fy === exitPos.y);
  });
  shuffle(itemCandidates);

  for (let i = 0; i < keyCount && i < itemCandidates.length; i++) {
    const [kx, ky] = itemCandidates[i];
    items.push({ type: 'key', x: kx * TILE + TILE/2, y: ky * TILE + TILE/2, collected: false });
  }

  const foodCount = 3 + Math.floor(level * 0.5);
  for (let i = keyCount; i < keyCount + foodCount && i < itemCandidates.length; i++) {
    const [fx, fy] = itemCandidates[i];
    items.push({ type: 'food', x: fx * TILE + TILE/2, y: fy * TILE + TILE/2, collected: false });
  }

  const treasureCount = 2 + level;
  for (let i = keyCount + foodCount; i < keyCount + foodCount + treasureCount && i < itemCandidates.length; i++) {
    const [tx, ty] = itemCandidates[i];
    items.push({ type: 'treasure', x: tx * TILE + TILE/2, y: ty * TILE + TILE/2, collected: false, value: 100 * level });
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// --- Pathfinding ---
function bfs(startX, startY, targetX, targetY, blockedFn) {
  if (startX === targetX && startY === targetY) return [];
  const visited = Array.from({length: MAZE_H}, () => Array(MAZE_W).fill(false));
  const queue = [[startX, startY, []]];
  visited[startY][startX] = true;

  while (queue.length > 0) {
    const [cx, cy, path] = queue.shift();
    for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= MAZE_W || ny < 0 || ny >= MAZE_H) continue;
      if (visited[ny][nx]) continue;
      const tile = maze[ny][nx];
      if (tile === T_WALL) continue;
      if (blockedFn && blockedFn(nx, ny)) continue;
      const newPath = [...path, [nx, ny]];
      if (nx === targetX && ny === targetY) return newPath;
      visited[ny][nx] = true;
      queue.push([nx, ny, newPath]);
    }
  }
  return null;
}

function getTileAt(px, py) {
  const tx = Math.floor(px / TILE);
  const ty = Math.floor(py / TILE);
  if (tx < 0 || tx >= MAZE_W || ty < 0 || ty >= MAZE_H) return T_WALL;
  return maze[ty][tx];
}

function isWalkable(px, py) {
  const margin = TILE * 0.3;
  const checks = [
    [px - margin, py - margin],
    [px + margin, py - margin],
    [px - margin, py + margin],
    [px + margin, py + margin]
  ];
  for (const [cx, cy] of checks) {
    const tile = getTileAt(cx, cy);
    if (tile === T_WALL) return false;
  }
  return true;
}

// --- AI Logic ---
function updateAI(dt) {
  if (!hero) return;

  const heroTX = Math.floor(hero.x / TILE);
  const heroTY = Math.floor(hero.y / TILE);

  // Update path periodically
  aiPathTimer -= dt;
  if (aiPathTimer <= 0 || aiPath.length === 0) {
    aiPathTimer = 0.3;
    computeAIPath();
  }

  // Move along path
  if (aiPath.length > 0) {
    const target = aiPath[0];
    const tx = target[0] * TILE + TILE/2;
    const ty = target[1] * TILE + TILE/2;
    const dx = tx - hero.x;
    const dy = ty - hero.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist > 2) {
      const speed = HERO_SPEED * TILE * dt;
      const nx = hero.x + (dx / dist) * Math.min(speed, dist);
      const ny = hero.y + (dy / dist) * Math.min(speed, dist);

      if (isWalkable(nx, hero.y)) hero.x = nx;
      if (isWalkable(hero.x, ny)) hero.y = ny;

      hero.angle = Math.atan2(dy, dx);
      if (Math.abs(dx) > Math.abs(dy)) {
        hero.dir = dx > 0 ? 1 : 3;
      } else {
        hero.dir = dy > 0 ? 2 : 0;
      }
    } else {
      aiPath.shift();
    }
  }

  // Shooting
  hero.shootCooldown -= dt;
  if (hero.shootCooldown <= 0) {
    // Find nearest enemy or generator
    let nearestEnemy = null;
    let nearestDist = TILE * 10;
    for (const e of enemies) {
      const dx = e.x - hero.x;
      const dy = e.y - hero.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < nearestDist) {
        nearestDist = d;
        nearestEnemy = e;
      }
    }
    for (const g of generators) {
      if (!g.alive) continue;
      const dx = g.x * TILE + TILE/2 - hero.x;
      const dy = g.y * TILE + TILE/2 - hero.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < nearestDist) {
        nearestDist = d;
        nearestEnemy = { x: g.x * TILE + TILE/2, y: g.y * TILE + TILE/2, isGen: true, gen: g };
      }
    }

    if (nearestEnemy && nearestDist < TILE * 12) {
      fireBullet(nearestEnemy.x, nearestEnemy.y);
      hero.shootCooldown = 0.4;
    }
  }
}

function computeAIPath() {
  if (!hero) return;
  const heroTX = Math.floor(hero.x / TILE);
  const heroTY = Math.floor(hero.y / TILE);

  // Priority: 1) Exit, 2) Keys (if doors block), 3) Food (low health), 4) Treasure, 5) Generator, 6) Random exploration

  // Check if exit is reachable
  const exitPath = bfs(heroTX, heroTY, exitPos.x, exitPos.y);
  if (exitPath && exitPath.length > 0) {
    aiPath = exitPath;
    aiTarget = 'exit';
    return;
  }

  // Check if any door blocks the way to exit, need key
  let needsKey = false;
  let closestDoor = null;
  let closestDoorDist = Infinity;
  for (let y = 0; y < MAZE_H; y++) {
    for (let x = 0; x < MAZE_W; x++) {
      if (maze[y][x] === T_DOOR) {
        const dist = Math.abs(x - heroTX) + Math.abs(y - heroTY);
        if (dist < closestDoorDist) {
          closestDoorDist = dist;
          closestDoor = { x, y };
        }
      }
    }
  }

  // Find nearest key
  let nearestKey = null;
  let nearestKeyDist = Infinity;
  for (const item of items) {
    if (item.collected || item.type !== 'key') continue;
    const dx = Math.floor(item.x / TILE) - heroTX;
    const dy = Math.floor(item.y / TILE) - heroTY;
    const d = Math.abs(dx) + Math.abs(dy);
    if (d < nearestKeyDist) {
      nearestKeyDist = d;
      nearestKey = item;
    }
  }

  if (nearestKey && closestDoorDist > nearestKeyDist + 2) {
    const keyPath = bfs(heroTX, heroTY, Math.floor(nearestKey.x/TILE), Math.floor(nearestKey.y/TILE));
    if (keyPath) { aiPath = keyPath; aiTarget = 'key'; return; }
  }

  // Find nearest food
  let nearestFood = null;
  let nearestFoodDist = Infinity;
  for (const item of items) {
    if (item.collected || item.type !== 'food') continue;
    const dx = Math.floor(item.x / TILE) - heroTX;
    const dy = Math.floor(item.y / TILE) - heroTY;
    const d = Math.abs(dx) + Math.abs(dy);
    if (d < nearestFoodDist) {
      nearestFoodDist = d;
      nearestFood = item;
    }
  }

  if (nearestFood && (health < MAX_HEALTH * 0.5 || nearestFoodDist < closestDoorDist)) {
    const foodPath = bfs(heroTX, heroTY, Math.floor(nearestFood.x/TILE), Math.floor(nearestFood.y/TILE));
    if (foodPath) { aiPath = foodPath; aiTarget = 'food'; return; }
  }

  // Find nearest treasure
  let nearestTreasure = null;
  let nearestTreasureDist = Infinity;
  for (const item of items) {
    if (item.collected || item.type !== 'treasure') continue;
    const dx = Math.floor(item.x / TILE) - heroTX;
    const dy = Math.floor(item.y / TILE) - heroTY;
    const d = Math.abs(dx) + Math.abs(dy);
    if (d < nearestTreasureDist) {
      nearestTreasureDist = d;
      nearestTreasure = item;
    }
  }

  if (nearestTreasure) {
    const tPath = bfs(heroTX, heroTY, Math.floor(nearestTreasure.x/TILE), Math.floor(nearestTreasure.y/TILE));
    if (tPath) { aiPath = tPath; aiTarget = 'treasure'; return; }
  }

  // Go toward nearest generator
  let nearestGen = null;
  let nearestGenDist = Infinity;
  for (const g of generators) {
    if (!g.alive) continue;
    const d = Math.abs(g.x - heroTX) + Math.abs(g.y - heroTY);
    if (d < nearestGenDist) {
      nearestGenDist = d;
      nearestGen = g;
    }
  }

  if (nearestGen) {
    const gPath = bfs(heroTX, heroTY, nearestGen.x, nearestGen.y);
    if (gPath) { aiPath = gPath; aiTarget = 'generator'; return; }
  }

  // Random exploration - go to random floor tile
  const floors = [];
  for (let y = 1; y < MAZE_H - 1; y++) {
    for (let x = 1; x < MAZE_W - 1; x++) {
      if (maze[y][x] === T_FLOOR) floors.push([x, y]);
    }
  }
  if (floors.length > 0) {
    const randomFloor = floors[Math.floor(Math.random() * floors.length)];
    const rPath = bfs(heroTX, heroTY, randomFloor[0], randomFloor[1]);
    if (rPath) { aiPath = rPath; aiTarget = 'explore'; return; }
  }
}

// --- Combat ---
function fireBullet(tx, ty) {
  if (!hero) return;
  const dx = tx - hero.x;
  const dy = ty - hero.y;
  const d = Math.sqrt(dx*dx + dy*dy) || 1;
  bullets.push({
    x: hero.x,
    y: hero.y,
    vx: (dx/d) * BULLET_SPEED * TILE,
    vy: (dy/d) * BULLET_SPEED * TILE,
    life: 2
  });
}

function spawnEnemy(type) {
  // Spawn near a generator
  const aliveGens = generators.filter(g => g.alive);
  if (aliveGens.length === 0) return;
  const gen = aliveGens[Math.floor(Math.random() * aliveGens.length)];
  const sx = gen.x * TILE + TILE/2 + (Math.random() - 0.5) * TILE;
  const sy = gen.y * TILE + TILE/2 + (Math.random() - 0.5) * TILE;

  enemies.push({
    x: sx, y: sy,
    type: type,
    health: type === 'ghost' ? 2 : 3,
    speed: type === 'ghost' ? 1.8 : 1.2,
    damage: type === 'ghost' ? 8 : 12,
    attackCooldown: 0,
    moveTimer: 0,
    moveDir: { x: 0, y: 0 }
  });
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!hero) continue;
    const dx = hero.x - e.x;
    const dy = hero.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist > 0) {
      e.moveTimer -= dt;
      if (e.moveTimer <= 0) {
        e.moveTimer = 0.15 + Math.random() * 0.1;
        e.moveDir = { x: dx/dist, y: dy/dist };
      }

      const speed = e.speed * TILE * dt;
      const nx = e.x + e.moveDir.x * speed;
      const ny = e.y + e.moveDir.y * speed;

      // Simple collision with walls
      if (isWalkable(nx, e.y)) e.x = nx;
      if (isWalkable(e.x, ny)) e.y = ny;
    }

    // Attack hero
    e.attackCooldown -= dt;
    if (dist < TILE * 0.8 && e.attackCooldown <= 0 && hero.invincible <= 0) {
      health -= e.damage;
      e.attackCooldown = 1;
      shakeTimer = 0.2;
      shakeIntensity = 4;
      spawnParticles(hero.x, hero.y, '#ff4444', 5);
    }
  }
}

function updateGenerators(dt) {
  for (const g of generators) {
    if (!g.alive) continue;
    g.spawnTimer -= dt;
    if (g.spawnTimer <= 0) {
      g.spawnTimer = Math.max(2, 6 - level * 0.3);
      const type = Math.random() < 0.5 ? 'ghost' : 'grunt';
      spawnEnemy(type);
    }
  }
}

// --- Particles ---
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 150;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.5 + Math.random() * 0.5,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// --- Game Update ---
function update(dt) {
  if (gameState === 'gameover') {
    gameOverTimer -= dt;
    if (gameOverTimer <= 0) {
      startNewRun();
    }
    return;
  }

  // Human input
  let moveX = 0, moveY = 0;
  if (keysDown['ArrowUp'] || keysDown['KeyW']) moveY = -1;
  if (keysDown['ArrowDown'] || keysDown['KeyS']) moveY = 1;
  if (keysDown['ArrowLeft'] || keysDown['KeyA']) moveX = -1;
  if (keysDown['ArrowRight'] || keysDown['KeyD']) moveX = 1;

  if (moveX !== 0 || moveY !== 0) {
    humanInput = true;
    humanTimer = AI_TIMEOUT;
    aiPath = [];

    const len = Math.sqrt(moveX*moveX + moveY*moveY);
    moveX /= len; moveY /= len;

    if (Math.abs(moveX) > Math.abs(moveY)) {
      hero.dir = moveX > 0 ? 1 : 3;
    } else {
      hero.dir = moveY > 0 ? 2 : 0;
    }
    hero.angle = Math.atan2(moveY, moveX);

    const speed = HERO_SPEED * TILE * dt;
    const nx = hero.x + moveX * speed;
    const ny = hero.y + moveY * speed;

    if (isWalkable(nx, hero.y)) hero.x = nx;
    if (isWalkable(hero.x, ny)) hero.y = ny;

    // Open doors
    const heroTX = Math.floor(hero.x / TILE);
    const heroTY = Math.floor(hero.y / TILE);
    for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
      const tx = heroTX + dx, ty = heroTY + dy;
      if (tx >= 0 && tx < MAZE_W && ty >= 0 && ty < MAZE_H && maze[ty][tx] === T_DOOR) {
        if (keys > 0) {
          keys--;
          maze[ty][tx] = T_FLOOR;
          spawnParticles(tx*TILE+TILE/2, ty*TILE+TILE/2, '#ffcc00', 8);
        }
      }
    }
  } else {
    humanTimer -= dt * 1000;
    if (humanTimer <= 0) {
      humanInput = false;
      updateAI(dt);
    }
  }

  // Space to shoot
  if (keysDown['Space']) {
    // Find nearest enemy
    let nearestEnemy = null;
    let nearestDist = TILE * 15;
    for (const e of enemies) {
      const d = Math.sqrt((e.x-hero.x)**2 + (e.y-hero.y)**2);
      if (d < nearestDist) { nearestDist = d; nearestEnemy = e; }
    }
    for (const g of generators) {
      if (!g.alive) continue;
      const d = Math.sqrt((g.x*TILE+TILE/2-hero.x)**2 + (g.y*TILE+TILE/2-hero.y)**2);
      if (d < nearestDist) { nearestDist = d; nearestEnemy = { x: g.x*TILE+TILE/2, y: g.y*TILE+TILE/2, isGen: true, gen: g }; }
    }
    if (nearestEnemy && hero.shootCooldown <= 0) {
      fireBullet(nearestEnemy.x, nearestEnemy.y);
      hero.shootCooldown = 0.35;
    }
  }

  hero.shootCooldown -= dt;
  hero.invincible -= dt;

  // Health drain
  health -= HEALTH_DRAIN * dt;
  if (health <= 0) {
    health = 0;
    gameState = 'gameover';
    gameOverTimer = 2;
    spawnParticles(hero.x, hero.y, '#ff0000', 30);
    return;
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    // Wall collision
    if (getTileAt(b.x, b.y) === T_WALL || b.life <= 0) {
      spawnParticles(b.x, b.y, '#ffaa44', 3);
      bullets.splice(i, 1);
      continue;
    }

    // Generator collision
    let hitGen = false;
    for (const g of generators) {
      if (!g.alive) continue;
      if (Math.abs(b.x - (g.x*TILE+TILE/2)) < TILE*0.5 && Math.abs(b.y - (g.y*TILE+TILE/2)) < TILE*0.5) {
        g.health--;
        if (g.health <= 0) {
          g.alive = false;
          score += 500;
          spawnParticles(g.x*TILE+TILE/2, g.y*TILE+TILE/2, '#aa44ff', 20);
          shakeTimer = 0.3;
          shakeIntensity = 6;
        }
        hitGen = true;
        break;
      }
    }
    if (hitGen) { bullets.splice(i, 1); continue; }

    // Enemy collision
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const d = Math.sqrt((b.x-e.x)**2 + (b.y-e.y)**2);
      if (d < TILE * 0.4) {
        e.health--;
        spawnParticles(e.x, e.y, e.type === 'ghost' ? '#88ccff' : '#44aa44', 8);
        if (e.health <= 0) {
          enemies.splice(j, 1);
          score += e.type === 'ghost' ? 100 : 150;
        }
        bullets.splice(i, 1);
        break;
      }
    }
  }

  // Update enemies
  updateEnemies(dt);
  updateGenerators(dt);
  updateParticles(dt);

  // Item collection
  const heroTX = Math.floor(hero.x / TILE);
  const heroTY = Math.floor(hero.y / TILE);
  for (const item of items) {
    if (item.collected) continue;
    const dx = hero.x - item.x;
    const dy = hero.y - item.y;
    if (Math.sqrt(dx*dx + dy*dy) < TILE * 0.6) {
      item.collected = true;
      if (item.type === 'key') {
        keys++;
        spawnParticles(item.x, item.y, '#ffcc00', 10);
      } else if (item.type === 'food') {
        health = Math.min(MAX_HEALTH, health + 25);
        spawnParticles(item.x, item.y, '#44ff44', 10);
      } else if (item.type === 'treasure') {
        score += item.value;
        spawnParticles(item.x, item.y, '#ff8800', 15);
      }
    }
  }

  // Check exit
  if (heroTX === exitPos.x && heroTY === exitPos.y) {
    level++;
    score += 1000;
    startNewLevel();
  }

  // Shake
  shakeTimer -= dt;

  // Remove off-screen enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.x < -200 || e.x > W + 200 || e.y < -200 || e.y > H + 200) {
      enemies.splice(i, 1);
    }
  }
}

function startNewLevel() {
  generateMaze();
  bullets = [];
  particles = [];
  health = Math.min(MAX_HEALTH, health + 30);
  aiPath = [];
  aiPathTimer = 0;
}

function startNewRun() {
  level = 1;
  score = 0;
  keys = 0;
  health = MAX_HEALTH;
  gameState = 'playing';
  enemies = [];
  bullets = [];
  particles = [];
  aiPath = [];
  aiPathTimer = 0;
  generateMaze();
}

// --- Rendering ---
function render() {
  ctx.fillStyle = '#0a0808';
  ctx.fillRect(0, 0, W, H);

  if (!hero) return;

  // Camera
  let camX = hero.x - W/2;
  let camY = hero.y - H/2;
  if (shakeTimer > 0) {
    camX += (Math.random() - 0.5) * shakeIntensity * 2;
    camY += (Math.random() - 0.5) * shakeIntensity * 2;
  }

  ctx.save();
  ctx.translate(-camX, -camY);

  // Visible tile range
  const startTX = Math.max(0, Math.floor(camX / TILE) - 1);
  const startTY = Math.max(0, Math.floor(camY / TILE) - 1);
  const endTX = Math.min(MAZE_W, Math.ceil((camX + W) / TILE) + 1);
  const endTY = Math.min(MAZE_H, Math.ceil((camY + H) / TILE) + 1);

  // Draw tiles
  for (let y = startTY; y < endTY; y++) {
    for (let x = startTX; x < endTX; x++) {
      const tile = maze[y][x];
      const px = x * TILE, py = y * TILE;

      if (tile === T_WALL) {
        drawAsset('wall', px, py, TILE);
      } else if (tile === T_FLOOR) {
        drawAsset('floor', px, py, TILE);
      } else if (tile === T_DOOR) {
        drawAsset('floor', px, py, TILE);
        // Draw door
        ctx.fillStyle = '#884422';
        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = '#aa6633';
        ctx.fillRect(px + 4, py + 4, TILE - 8, TILE - 8);
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(px + TILE - 8, py + TILE/2, 2, 0, Math.PI*2);
        ctx.fill();
      } else if (tile === T_EXIT) {
        drawAsset('floor', px, py, TILE);
        drawAsset('exit', px, py, TILE);
      }
    }
  }

  // Draw generators
  for (const g of generators) {
    if (!g.alive) continue;
    drawAsset('generator', g.x * TILE, g.y * TILE, TILE);
  }

  // Draw items
  for (const item of items) {
    if (item.collected) continue;
    const bob = Math.sin(Date.now() / 300 + item.x) * 2;
    drawAsset(item.type, item.x - TILE/2, item.y - TILE/2 + bob, TILE);
  }

  // Draw enemies
  for (const e of enemies) {
    const asset = e.type === 'ghost' ? 'ghost' : 'grunt';
    drawAsset(asset, e.x - TILE/2, e.y - TILE/2, TILE);
    // Health bar
    const maxH = e.type === 'ghost' ? 2 : 3;
    ctx.fillStyle = '#400';
    ctx.fillRect(e.x - TILE*0.3, e.y - TILE*0.5, TILE*0.6, 3);
    ctx.fillStyle = '#f44';
    ctx.fillRect(e.x - TILE*0.3, e.y - TILE*0.5, TILE*0.6 * (e.health / maxH), 3);
  }

  // Draw bullets
  for (const b of bullets) {
    ctx.fillStyle = '#ffcc44';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI*2);
    ctx.globalAlpha = 0.4;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Draw hero
  if (gameState === 'playing') {
    const heroBob = Math.sin(Date.now() / 200) * 1;
    drawAsset('hero', hero.x - TILE/2, hero.y - TILE/2 + heroBob, TILE);

    // Direction indicator
    const indX = hero.x + Math.cos(hero.angle) * TILE * 0.6;
    const indY = hero.y + Math.sin(hero.angle) * TILE * 0.6;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(indX, indY, 3, 0, Math.PI*2);
    ctx.fill();
  }

  // Draw particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // --- HUD ---
  const hudY = 10;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 50);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.strokeRect(0, 50, W, 1);

  ctx.font = 'bold 16px monospace';
  ctx.textBaseline = 'middle';

  // Health
  ctx.fillStyle = '#ff4444';
  ctx.fillText('HP', 15, hudY + 18);
  ctx.fillStyle = '#300';
  ctx.fillRect(40, hudY + 6, 150, 14);
  ctx.fillStyle = health > 30 ? '#ff4444' : '#ff0000';
  ctx.fillRect(40, hudY + 6, 150 * (health / MAX_HEALTH), 14);
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.ceil(health), 195, hudY + 18);

  // Score
  ctx.fillStyle = '#ffcc00';
  ctx.textAlign = 'center';
  ctx.fillText(`SCORE: ${score}`, W/2, hudY + 18);

  // Keys
  ctx.fillStyle = '#ffcc00';
  ctx.textAlign = 'right';
  ctx.fillText(`KEYS: ${keys}`, W - 15, hudY + 18);

  // Level
  ctx.fillStyle = '#88ccff';
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL ${level}`, W/2, hudY + 38);

  // Mode indicator
  ctx.fillStyle = humanInput ? '#44ff44' : '#888';
  ctx.textAlign = 'left';
  ctx.font = '12px monospace';
  ctx.fillText(humanInput ? '▶ HUMAN' : '▶ AI ATTRACT', 15, hudY + 38);

  // Game Over
  if (gameState === 'gameover') {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.7, gameOverTimer)})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff0000';
    ctx.font = `bold ${Math.min(80, W/10)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.fillStyle = '#ffcc00';
    ctx.font = `${Math.min(30, W/25)}px monospace`;
    ctx.fillText(`Score: ${score}  |  Level: ${level}`, W/2, H/2 + 30);
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(20, W/40)}px monospace`;
    ctx.fillText('Restarting...', W/2, H/2 + 70);
  }
}

// --- Input ---
window.addEventListener('keydown', (e) => {
  keysDown[e.code] = true;
  humanInput = true;
  humanTimer = AI_TIMEOUT;
  aiPath = [];
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
});

window.addEventListener('keyup', (e) => {
  keysDown[e.code] = false;
});

// --- Game Loop ---
function gameLoop(timestamp) {
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

// --- Start ---
startNewRun();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
