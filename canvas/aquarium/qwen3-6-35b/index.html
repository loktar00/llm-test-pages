<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="aquarium"></canvas>
    <script>
        const canvas = document.getElementById('aquarium');
        const ctx = canvas.getContext('2d');

        let width, height;
        let bubbles = [];
        let plants = [];
        let fish = [];
        let crab;
        let time = 0;

        // Configuration
        const FISH_COUNT = 15;
        const PLANT_COUNT = 8;
        const COLORS = {
            waterTop: '#006994',
            waterBottom: '#001e2b',
            gravel: '#5d4037',
            gravelLight: '#795548',
            plant: '#2e7d32',
            plantDark: '#1b5e20',
            glass: 'rgba(255, 255, 255, 0.05)',
            bubble: 'rgba(255, 255, 255, 0.3)'
        };

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initEnvironment();
        }
        window.addEventListener('resize', resize);

        // Utility
        const random = (min, max) => Math.random() * (max - min) + min;
        const dist = (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);

        // --- Classes ---

        class Bubble {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = random(50, width - 50);
                this.y = height + random(0, 50);
                this.size = random(2, 6);
                this.speed = random(1, 2);
                this.wobbleOffset = random(0, Math.PI * 2);
                this.wobbleSpeed = random(0.02, 0.05);
                this.opacity = random(0.1, 0.4);
            }

            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.y * 0.02 + this.wobbleOffset) * 0.5;
                
                if (this.y < -10) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
                // Highlight
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 1.5})`;
                ctx.fill();
            }
        }

        class Plant {
            constructor(x) {
                this.x = x;
                this.segments = [];
                this.height = random(height * 0.2, height * 0.45);
                this.segmentsCount = Math.floor(this.height / 10);
                this.swayOffset = random(0, 100);
                
                // Build segments
                let currentY = height;
                for (let i = 0; i < this.segmentsCount; i++) {
                    this.segments.push({
                        y: currentY,
                        width: random(10, 25) - (i * 0.2) // Taper
                    });
                    currentY -= 10;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, height);
                
                for (let i = 0; i < this.segments.length; i++) {
                    const seg = this.segments[i];
                    // Sway calculation
                    const sway = Math.sin(time * 0.002 + this.swayOffset + (i * 0.1)) * (i * 1.5);
                    ctx.lineTo(this.x + sway, seg.y);
                }

                // Draw top
                const topSeg = this.segments[this.segments.length - 1];
                const topSway = Math.sin(time * 0.002 + this.swayOffset + (this.segments.length * 0.1)) * (this.segments.length * 1.5);
                ctx.lineTo(this.x + topSway + 2, topSeg.y - 5);
                ctx.lineTo(this.x + topSway - 2, topSeg.y - 5);
                
                ctx.fillStyle = COLORS.plant;
                ctx.fill();
                
                // Inner detail
                ctx.beginPath();
                ctx.moveTo(this.x + 2, height);
                for (let i = 0; i < this.segments.length; i++) {
                    const seg = this.segments[i];
                    const sway = Math.sin(time * 0.002 + this.swayOffset + (i * 0.1)) * (i * 1.5);
                    ctx.lineTo(this.x + sway - 2, seg.y);
                }
                ctx.fillStyle = COLORS.plantDark;
                ctx.fill();
            }
        }

        class Crab {
            constructor() {
                this.x = width * random(0.3, 0.7);
                this.y = height - 25; // On gravel
                this.size = 15;
                this.dir = 1;
                this.walkTimer = 0;
            }

            update() {
                // Random walk
                if (this.walkTimer <= 0) {
                    this.dir = Math.random() > 0.5 ? 1 : -1;
                    this.walkTimer = random(100, 300);
                }
                
                this.x += this.dir * 0.2;
                
                // Bounds check
                if (this.x < 50) this.dir = 1;
                if (this.x > width - 50) this.dir = -1;
                
                this.walkTimer--;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.dir, 1); // Flip if moving left

                // Legs
                ctx.strokeStyle = '#d84315';
                ctx.lineWidth = 2;
                const legOffset = Math.sin(time * 0.1) * 2;
                
                // Back legs
                ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-10, 5 + legOffset); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(10, 5 - legOffset); ctx.stroke();
                
                // Body
                ctx.fillStyle = '#d84315';
                ctx.beginPath();
                ctx.ellipse(0, -5, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Shell pattern
                ctx.strokeStyle = '#bf360c';
                ctx.beginPath();
                ctx.moveTo(-5, -8); ctx.lineTo(5, -8);
                ctx.stroke();

                // Claws
                const clawLift = Math.sin(time * 0.05) * 5;
                ctx.beginPath();
                ctx.moveTo(8, -5);
                ctx.quadraticCurveTo(15, -10 + clawLift, 12, -15 + clawLift); // Claw tip
                ctx.quadraticCurveTo(10, -15 + clawLift, 8, -8);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(8, -5);
                ctx.quadraticCurveTo(15, 0 + clawLift, 12, -5 + clawLift); // Claw tip
                ctx.quadraticCurveTo(10, -5 + clawLift, 8, -8);
                ctx.stroke();

                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(5, -10, 2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(6, -10, 1, 0, Math.PI*2); ctx.fill();

                ctx.restore();
            }
        }

        class Fish {
            constructor(type) {
                this.type = type; // 0: Goldfish, 1: Neon, 2: Angelfish, 3: Dartfish
                this.reset();
            }

            reset() {
                this.x = random(50, width - 50);
                this.y = random(50, height - 100);
                this.vx = random(-1, 1);
                this.vy = random(-1, 1);
                this.maxSpeed = this.type === 3 ? 4 : (this.type === 2 ? 1.5 : 2.5);
                this.size = this.type === 2 ? 30 : (this.type === 3 ? 15 : 20);
                this.color = this.getColor();
                this.angle = 0;
                this.tailPhase = random(0, Math.PI * 2);
                this.state = 'wander'; // wander, dart
                this.wanderTimer = random(100, 500);
                this.startleTimer = 0;
            }

            getColor() {
                switch(this.type) {
                    case 0: return `hsl(${random(30, 50)}, 100%, 60%)`; // Gold
                    case 1: return `hsl(${random(180, 220)}, 100%, 60%)`; // Blue
                    case 2: return `hsl(${random(20, 40)}, 90%, 50%)`; // Orange
                    case 3: return `hsl(${random(240, 280)}, 80%, 70%)`; // Purple
                    default: return 'white';
                }
            }

            update() {
                // Movement Logic
                if (this.state === 'dart') {
                    this.startleTimer--;
                    if (this.startleTimer <= 0) {
                        this.state = 'wander';
                        this.vx *= 0.5;
                        this.vy *= 0.5;
                    }
                } else {
                    // Wander Steering
                    this.wanderTimer--;
                    if (this.wanderTimer <= 0) {
                        const angle = random(0, Math.PI * 2);
                        const force = 0.2;
                        this.vx += Math.cos(angle) * force;
                        this.vy += Math.sin(angle) * force;
                        this.wanderTimer = random(50, 200);
                    }
                }

                // Wall Avoidance
                const margin = 50;
                const turnForce = 0.5;
                if (this.x < margin) this.vx += turnForce;
                if (this.x > width - margin) this.vx -= turnForce;
                if (this.y < margin) this.vy += turnForce;
                if (this.y > height - margin - 30) this.vy -= turnForce; // Avoid bottom (gravel)

                // Speed Limit
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                // Apply Velocity
                this.x += this.vx;
                this.y += this.vy;

                // Calculate Angle for drawing
                if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
                    this.angle = Math.atan2(this.vy, this.vx);
                }

                // Random startle
                if (this.state === 'wander' && Math.random() < 0.001) {
                    this.state = 'dart';
                    this.startleTimer = 60;
                    this.vx *= 3;
                    this.vy *= 3;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const tailWag = Math.sin(time * 0.02 + this.tailPhase) * 5;

                ctx.fillStyle = this.color;
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;

                if (this.type === 0 || this.type === 1) {
                    // Simple Oval Fish
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    
                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-this.size + 5, 0);
                    ctx.lineTo(-this.size - 10, -5 + tailWag);
                    ctx.lineTo(-this.size - 10, 5 + tailWag);
                    ctx.fill();
                    ctx.stroke();

                    // Eye
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(this.size/2, -3, 3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath(); ctx.arc(this.size/2 + 1, -3, 1.5, 0, Math.PI*2); ctx.fill();

                } else if (this.type === 2) {
                    // Angelfish (Tall)
                    ctx.beginPath();
                    ctx.moveTo(this.size, 0); // Nose
                    ctx.quadraticCurveTo(0, -this.size, -this.size + 5, -this.size + 5); // Top fin
                    ctx.lineTo(-this.size - 5, 0); // Tail
                    ctx.quadraticCurveTo(0, this.size, this.size, 0); // Bottom fin
                    ctx.fill();
                    ctx.stroke();

                    // Eye
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(this.size/2, -5, 3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath(); ctx.arc(this.size/2 + 1, -5, 1.5, 0, Math.PI*2); ctx.fill();

                } else if (this.type === 3) {
                    // Dartfish (Long)
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 1.5, this.size / 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    
                    // Tail
                    ctx.beginPath();
                    ctx.moveTo(-this.size, 0);
                    ctx.lineTo(-this.size - 15, -8 + tailWag);
                    ctx.lineTo(-this.size - 15, 8 + tailWag);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // --- Setup & Loop ---

        function initEnvironment() {
            bubbles = [];
            for(let i=0; i<30; i++) bubbles.push(new Bubble());

            plants = [];
            for(let i=0; i<PLANT_COUNT; i++) {
                plants.push(new Plant(random(20, width - 20)));
            }
            plants.sort((a, b) => a.segments.length - b.segments.length); // Sort by height

            crab = new Crab();

            fish = [];
            const types = [0, 1, 2, 3];
            for(let i=0; i<FISH_COUNT; i++) {
                const type = types[i % 4];
                fish.push(new Fish(type));
            }
        }

        function drawBackground() {
            // Water Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, COLORS.waterTop);
            grad.addColorStop(1, COLORS.waterBottom);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Caustics (Simplified)
            ctx.save();
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let i = 0; i < 5; i++) {
                const x = (width / 4) * i + Math.sin(time * 0.001 + i) * 50;
                const y = height * 0.5 + Math.cos(time * 0.002 + i) * 100;
                ctx.beginPath();
                ctx.arc(x, y, 100 + Math.sin(time*0.005)*20, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawGravel() {
            ctx.fillStyle = COLORS.gravel;
            ctx.fillRect(0, height - 30, width, 30);
            
            // Gravel texture details
            ctx.fillStyle = COLORS.gravelLight;
            for(let i=0; i<width; i+=20) {
                ctx.beginPath();
                ctx.arc(i + Math.sin(i)*5, height - 30, 8, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function loop() {
            time++;
            ctx.clearRect(0, 0, width, height);

            drawBackground();

            // Plants
            plants.forEach(p => p.draw());

            // Bubbles
            bubbles.forEach(b => {
                b.update();
                b.draw();
            });

            // Fish
            fish.forEach(f => {
                f.update();
                f.draw();
            });

            // Crab
            crab.update();
            crab.draw();

            // Glass Reflections
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(width, 0);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.stroke();
            
            // Shine
            ctx.beginPath();
            ctx.moveTo(width * 0.1, 0);
            ctx.lineTo(width * 0.3, height);
            ctx.lineTo(width * 0.35, height);
            ctx.lineTo(width * 0.15, 0);
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(loop);
        }

        // Start
        resize();
        loop();

    </script>
</body>
</html>
