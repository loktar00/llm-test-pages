<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Weaving</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="loom"></canvas>
    <script>
        /**
         * Generative Weaving
         * A procedural tapestry generator that visualizes the weaving process.
         */

        const canvas = document.getElementById('loom');
        const ctx = canvas.getContext('2d', { alpha: false });

        // Configuration
        const CONFIG = {
            threadSize: 6,          // Size of one thread in pixels
            warpColor: '#e0e0e0',   // Base color for vertical threads
            weftSpeed: 1.5,         // Pixels per frame for shuttle
            scrollSpeed: 4,         // Pixels per frame for scrolling
            patternLength: 20,      // Length of a pattern segment in threads
            totalTapestryLength: 100 // How many rows before scrolling
        };

        let width, height;
        let cols, rows;
        
        // State
        let state = {
            warp: [],           // Array of vertical threads
            weft: [],           // Array of horizontal rows being built
            shuttle: {
                x: 0,
                y: 0,
                dir: 1,         // 1 = right, -1 = left
                color: '#000',
                active: false
            },
            scrollOffset: 0,
            tapestryProgress: 0,
            phase: 'setup',     // setup, weaving, scrolling
            patterns: [],       // Generated pattern data
            hueBase: 0
        };

        // --- Utilities ---

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cols = Math.ceil(width / CONFIG.threadSize);
            rows = Math.ceil(height / CONFIG.threadSize);
            initLoom();
        }

        function randomRange(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // HSL to Hex for easier manipulation
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        // --- Pattern Generators ---

        // Returns an array of booleans (true = weft over warp) for a single row
        function generatePatternRow(x, y, type) {
            const gx = x / CONFIG.threadSize;
            const gy = y / CONFIG.threadSize;
            
            switch (type) {
                case 'plain':
                    // Simple checkerboard
                    return (Math.floor(gx) + Math.floor(gy)) % 2 === 0;
                
                case 'stripe':
                    // Vertical stripes
                    return Math.floor(gx) % 4 < 2;

                case 'diamond':
                    // Diamond pattern
                    const cx = width / 2;
                    const cy = (y + state.scrollOffset); // Relative to tapestry start
                    const dist = Math.abs(gx - (cx/CONFIG.threadSize)) + Math.abs(gy - (cy/CONFIG.threadSize));
                    return Math.floor(dist) % 2 === 0;

                case 'chevron':
                    // V-shape
                    const shift = Math.sin(gy * 0.1) * 5;
                    return (gx + shift) % 4 < 2;
                
                case 'herringbone':
                    // Zig-zag
                    const rowParity = Math.floor(gy) % 2;
                    const colParity = Math.floor(gx) % 2;
                    const zig = (Math.floor(gy) % 4 < 2) ? 1 : -1;
                    return (colParity + (Math.floor(gx/2) % 2) * zig) % 2 === 0;

                default:
                    return (Math.floor(gx) + Math.floor(gy)) % 2 === 0;
            }
        }

        // --- Core Logic ---

        function initLoom() {
            // Reset State
            state.weft = [];
            state.warp = [];
            state.scrollOffset = 0;
            state.tapestryProgress = 0;
            state.phase = 'weaving';
            state.hueBase = Math.random() * 360;
            
            // Generate a new palette
            const palette = [];
            for(let i=0; i<5; i++) {
                palette.push(hslToHex(
                    (state.hueBase + i * 30) % 360, 
                    randomRange(60, 80), 
                    randomRange(40, 60)
                ));
            }
            state.palette = palette;

            // Initialize Warp (Vertical threads)
            // We don't draw them yet, just set up the grid logic
            for (let i = 0; i < cols; i++) {
                state.warp.push({ x: i * CONFIG.threadSize });
            }

            // Initialize Shuttle
            state.shuttle.x = 0;
            state.shuttle.y = 0;
            state.shuttle.dir = 1;
            state.shuttle.active = true;
            state.shuttle.color = state.palette[0];
            
            // Pick random patterns for this tapestry
            const types = ['plain', 'stripe', 'chevron', 'diamond', 'herringbone'];
            state.currentPatternType = types[randomRange(0, types.length - 1)];
        }

        function update() {
            if (state.phase === 'weaving') {
                updateShuttle();
            } else if (state.phase === 'scrolling') {
                updateScroll();
            }
        }

        function updateShuttle() {
            const s = state.shuttle;
            
            // Move Shuttle
            s.x += CONFIG.weftSpeed * s.dir;

            // Check bounds
            if (s.x >= width && s.dir === 1) {
                s.dir = -1;
                s.x = width;
                nextRow();
            } else if (s.x <= 0 && s.dir === -1) {
                s.dir = 1;
                s.x = 0;
                nextRow();
            }
        }

        function nextRow() {
            // Finalize the current row that was just "woven"
            // We create a row object representing the finished weft
            const rowY = state.tapestryProgress * CONFIG.threadSize;
            const rowColor = state.palette[state.tapestryProgress % state.palette.length];
            
            // Generate the weave logic for this row
            const weaveData = [];
            for(let x=0; x<width; x+=CONFIG.threadSize) {
                // Determine if weft is OVER warp
                const isOver = generatePatternRow(x, rowY, state.currentPatternType);
                weaveData.push({ x: x, over: isOver });
            }

            state.weft.push({
                y: rowY,
                color: rowColor,
                data: weaveData
            });

            // Move to next row
            state.tapestryProgress++;
            state.shuttle.y = state.tapestryProgress * CONFIG.threadSize;
            
            // Cycle pattern occasionally
            if (state.tapestryProgress % CONFIG.patternLength === 0) {
                 const types = ['plain', 'stripe', 'chevron', 'diamond', 'herringbone'];
                 state.currentPatternType = types[randomRange(0, types.length - 1)];
            }

            // Check if tapestry is full
            if (state.tapestryProgress * CONFIG.threadSize > height) {
                state.phase = 'scrolling';
            }
        }

        function updateScroll() {
            state.scrollOffset += CONFIG.scrollSpeed;
            
            // Remove rows that have scrolled off screen
            if (state.weft.length > 0 && state.weft[0].y - state.scrollOffset < -CONFIG.threadSize * 2) {
                state.weft.shift();
            }

            // Reset if fully scrolled (just for demo loop, though technically we keep going)
            if (state.weft.length === 0 && state.scrollOffset > height * 2) {
                initLoom();
            }
        }

        // --- Rendering ---

        function draw() {
            // Clear background
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);

            // Apply scroll transform
            ctx.save();
            ctx.translate(0, -state.scrollOffset);

            // 1. Draw Warp (Vertical Threads)
            // These are drawn first, so they appear UNDER the weft when weft is over
            ctx.fillStyle = CONFIG.warpColor;
            for (let i = 0; i < cols; i++) {
                const x = i * CONFIG.threadSize;
                // Draw a full vertical line
                // Optimization: Only draw visible part if we were doing infinite scroll, 
                // but here we just draw the height of the canvas + scroll
                ctx.fillRect(x, 0, CONFIG.threadSize - 1, height + CONFIG.threadSize * 2);
            }

            // 2. Draw Completed Weft Rows
            for (let row of state.weft) {
                drawWeftRow(row.y, row.color, row.data);
            }

            // 3. Draw Active Shuttle / Current Row
            if (state.phase === 'weaving') {
                drawActiveWeft();
            }

            ctx.restore();

            requestAnimationFrame(loop);
        }

        function drawWeftRow(y, color, data) {
            ctx.fillStyle = color;
            
            // Draw segments based on over/under logic
            for (let i = 0; i < data.length; i++) {
                const seg = data[i];
                
                if (seg.over) {
                    // Weft is OVER Warp
                    ctx.fillRect(seg.x, y, CONFIG.threadSize - 1, CONFIG.threadSize - 1);
                } else {
                    // Weft is UNDER Warp
                    // We draw a shadow to simulate depth
                    ctx.fillStyle = adjustColor(color, -40); // Darken
                    ctx.fillRect(seg.x, y + 2, CONFIG.threadSize - 1, CONFIG.threadSize - 3);
                    ctx.fillStyle = color; // Reset
                }
            }
        }

        function drawActiveWeft() {
            const s = state.shuttle;
            const y = s.y;
            
            // We need to draw the weft thread up to the shuttle position
            // We calculate the over/under logic on the fly for the partial row
            
            // Determine the X range to draw based on direction
            let startX = 0;
            let endX = s.x;
            
            // If moving left, we are filling from right to left, but visually we just want the line up to x
            // The logic is simpler: Just draw segments from 0 to s.x
            
            // To make it look like a continuous thread, we draw the segments
            // We must ensure we use the same logic as nextRow()
            
            for (let x = 0; x < s.x; x += CONFIG.threadSize) {
                const isOver = generatePatternRow(x, y, state.currentPatternType);
                
                if (isOver) {
                    ctx.fillStyle = s.color;
                    ctx.fillRect(x, y, CONFIG.threadSize - 1, CONFIG.threadSize - 1);
                } else {
                    // Under
                    ctx.fillStyle = adjustColor(s.color, -40);
                    ctx.fillRect(x, y + 2, CONFIG.threadSize - 1, CONFIG.threadSize - 3);
                }
            }

            // Draw the Shuttle Head
            // A small bobbin shape at the current X
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            const bobbinSize = CONFIG.threadSize * 1.5;
            ctx.arc(s.x, y + CONFIG.threadSize/2, bobbinSize/2, 0, Math.PI * 2);
            ctx.fill();
            
            // Shuttle tail (thread coming from the spool)
            // Visual flair: a faint line connecting to the edge
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(s.x, y + CONFIG.threadSize/2);
            // If moving right, spool is on left, line goes left
            // If moving left, spool is on right, line goes right
            const spoolX = s.dir === 1 ? 0 : width;
            ctx.lineTo(spoolX, y + CONFIG.threadSize/2);
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
        }

        // Helper to darken/lighten hex color
        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        // --- Init ---
        window.addEventListener('resize', resize);
        resize();
        loop();

    </script>
</body>
</html>
