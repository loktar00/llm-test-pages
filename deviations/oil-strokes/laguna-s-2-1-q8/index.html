<!DOCTYPE html>
<html>
<head>
<style>
body,html{margin:0;padding:0;overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight});

function rand(min,max){return Math.random()*(max-min)+min}
function randi(min,max){return Math.floor(rand(min,max+1))}

// Brush stroke with bristle texture and impasto shading
function brushStroke(ctx,x,y,len,ang,thickness,color,variation=0.3){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(ang);
  
  // Impasto shading - multiple overlapping passes for thickness
  const shadeCount=randi(2,4);
  for(let i=0;i<shadeCount;i++){
    const offsetY=rand(-thickness*0.5,thickness*0.5);
    const shadeAlpha=rand(0.7,0.95)-i*0.1;
    ctx.globalAlpha=shadeAlpha;
    ctx.fillStyle=color;
    
    ctx.beginPath();
    ctx.moveTo(-thickness*0.5,offsetY-thickness*0.5);
    // Add bristle-like waviness
    for(let t=0;t<=1;t+=0.1){
      const wave=Math.sin(t*Math.PI*2*3+(y*0.05+x*0.03))*thickness*variation;
      const yPos=t*len+wave;
      ctx.lineTo(thickness*0.5,yPos);
    }
    ctx.lineTo(thickness*0.5,len);
    ctx.lineTo(-thickness*0.5,len);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Generate landscape parameters
function getLandscape(){
  return {
    skyColor:`hsl(${randi(180,260)},${randi(60,90)}%,${randi(40,70)}%)`,
    horizon:rand(h*0.3,h*0.7),
    sunX:rand(w*0.2,w*0.8),
    sunY:rand(h*0.1,h*0.4),
    sunR:rand(w*0.03,w*0.06),
    mountainCount:randi(3,6),
    cloudCount:randi(2,4),
    grassHeight:rand(h*0.05,h*0.12)
  };
}

let landscape;

// Painting phases
function paintUnderpainting(l,cb){
  ctx.clearRect(0,0,w,h);
  
  // Sky base (horizontal strokes)
  const skyThick=rand(20,40);
  const skyStrokes=Math.floor(h/skyThick*0.6);
  for(let i=0;i<skyStrokes;i++){
    const y=i*skyThick+rands(-5,5);
    const x=rand(-50,w+50);
    brushStroke(ctx,x,y,w,0,skyThick,l.skyColor,0.1);
  }
  
  // Ground base (vertical strokes)
  setTimeout(()=>{
    const groundThick=rand(15,30);
    const groundHeight=h-l.horizon;
    const groundStrokes=Math.floor(w/groundThick*0.8);
    for(let i=0;i<groundStrokes;i++){
      const x=i*groundThick+rands(-10,10);
      const y=l.horizon;
      brushStroke(ctx,x,y,groundHeight+10,Math.PI/2,groundThick,'#2a4d1c',0.15);
    }
    
    setTimeout(cb,1500);
  },1000);
}

function rands(min,max){return rand(min,max)}

function paintDetails(l,cb){
  // Sun
  const sunGrad=ctx.createRadialGradient(l.sunX,l.sunY,l.sunR*0.2,l.sunX,l.sunY,l.sunR);
  sunGrad.addColorStop(0,'#fff9c4');
  sunGrad.addColorStop(1,l.skyColor);
  for(let i=0;i<8;i++){
    const ang=i*Math.PI/4;
    brushStroke(ctx,l.sunX,l.sunY,l.sunR*2,ang,3,`#ffeb3b`,0.2);
  }
  
  // Mountains (diagonal strokes)
  for(let m=0;m<l.mountainCount;m++){
    const mx=rand(w*0.1,w*0.9);
    const my=l.horizon+rand(0,h*0.1);
    const mw=rand(w*0.1,w*0.3);
    const mh=rand(h*0.1,h*0.3);
    const mColor=`hsl(250,${randi(20,50)}%,${randi(20,40)}%)`;
    
    for(let y=my;y<my+mh;y+=rand(8,15)){
      const phase=(y-my)/mh;
      const x1=mx+phase*mw*0.2-rand(10,25);
      const x2=mx+(1-phase)*mw*1.2+rand(10,25);
      const len=Math.sqrt((x2-x1)*(x2-x1)+(y-y)*(y-y))/2;
      const ang=Math.atan2(y-my,y-my);
      brushStroke(ctx,x1,y,len,ang,rand(5,12),mColor,0.1);
    }
  }
  
  // Clouds
  for(let c=0;c<l.cloudCount;c++){
    const cx=rand(w*0.1,w*0.9);
    const cy=rand(h*0.1,h*0.35);
    const cw=rand(w*0.05,w*0.15);
    const ch=rand(h*0.03,h*0.08);
    const cColor=`hsl(0,0%,${randi(85,98)}%)`;
    for(let i=0;i<20;i++){
      const px=cx+rand(-cw,cw);
      const py=cy+rand(-ch,ch);
      brushStroke(ctx,px,py,rand(10,30),rand(0,Math.PI*2),rand(3,8),cColor,0.1);
    }
  }
  
  setTimeout(cb,1500);
}

function paintHighlights(l,cb){
  // Grass highlights (vertical)
  for(let i=0;i<500;i++){
    const x=rand(0,w);
    const y=l.horizon+rand(0,l.grassHeight);
    const len=rand(10,40);
    const color=`hsl(80,${randi(50,80)}%,${randi(40,70)}%)`;
    brushStroke(ctx,x,y,len,Math.PI/2,rand(1,3),color,0.05);
  }
  
  // Sun rays
  for(let i=0;i<30;i++){
    const ang=rand(0,Math.PI*2);
    const dist=l.sunR+rand(5,20);
    const x=l.sunX+Math.cos(ang)*dist;
    const y=l.sunY+Math.sin(ang)*dist;
    brushStroke(ctx,l.sunX,l.sunY,dist,ang,1.5,'#ffeb3b',0.1);
  }
  
  // Highlight flecks
  for(let i=0;i<300;i++){
    const x=rand(0,w);
    const y=rand(0,h);
    const s=rand(1,4);
    ctx.fillStyle='#ffffff88';
    ctx.fillRect(x,y,s,s);
  }
  
  setTimeout(cb,1000);
}

function signature(cb){
  ctx.save();
  ctx.fillStyle='#ffffff';
  ctx.font=`bold ${w*0.02}px sans-serif`;
  ctx.textBaseline='bottom';
  ctx.textAlign='right';
  
  const sigY=h-rand(h*0.05,h*0.15);
  const text="A. Nature";
  
  ctx.shadowColor='#00000088';
  ctx.shadowBlur=4;
  
  let x=w-rand(w*0.1,w*0.2);
  const chars=text.split('');
  let idx=0;
  
  function drawNext(){
    if(idx<chars.length){
      ctx.fillText(chars[idx],x,h-rand(0,5));
      x+=ctx.measureText(chars[idx]).width;
      idx++;
      setTimeout(drawNext,50);
    }else{
      ctx.restore();
      setTimeout(cb,2000);
    }
  }
  drawNext();
}

function cycle(){
  landscape=getLandscape();
  paintUnderpainting(landscape,()=>{
    paintDetails(landscape,()=>{
      paintHighlights(landscape,()=>{
        signature(cycle);
      });
    });
  });
}

cycle();
</script>
</body>
</html>
