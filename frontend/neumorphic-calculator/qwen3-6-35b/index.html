<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neumorphic Calculator</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #d4d8de;
    --bg-dark: #b8bcc4;
    --bg-light: #f0f3f7;
    --text: #3a3d45;
    --text-dim: #7a7e86;
    --accent: #5b8af5;
    --accent-dark: #3d6ad4;
    --accent-light: #7ba4ff;
    --shadow-offset: 6px;
    --radius: 16px;
    --key-size: 72px;
    --key-gap: 14px;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }

  .calculator {
    width: 340px;
    padding: 32px;
    border-radius: 32px;
    background: var(--bg);
    box-shadow:
      calc(var(--shadow-offset) * 1.2) calc(var(--shadow-offset) * 1.2) calc(var(--shadow-offset) * 2.4) var(--bg-dark),
      calc(var(--shadow-offset) * -1.2) calc(var(--shadow-offset) * -1.2) calc(var(--shadow-offset) * 2.4) var(--bg-light);
  }

  .display {
    width: 100%;
    min-height: 100px;
    margin-bottom: 24px;
    padding: 20px 24px;
    border-radius: var(--radius);
    background: var(--bg);
    box-shadow:
      inset calc(var(--shadow-offset) * 0.8) calc(var(--shadow-offset) * 0.8) calc(var(--shadow-offset) * 1.6) var(--bg-dark),
      inset calc(var(--shadow-offset) * -0.8) calc(var(--shadow-offset) * -0.8) calc(var(--shadow-offset) * 1.6) var(--bg-light);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    overflow: hidden;
    transition: box-shadow 0.15s ease;
  }

  .display .expression {
    font-size: 14px;
    color: var(--text-dim);
    min-height: 20px;
    word-break: break-all;
    text-align: right;
    width: 100%;
    line-height: 1.4;
    transition: font-size 0.2s ease;
  }

  .display .value {
    font-size: 36px;
    font-weight: 300;
    letter-spacing: -0.5px;
    color: var(--text);
    width: 100%;
    text-align: right;
    white-space: nowrap;
    line-height: 1.3;
    transition: font-size 0.2s ease;
  }

  .display .value.shrink-1 { font-size: 28px; }
  .display .value.shrink-2 { font-size: 22px; }
  .display .value.shrink-3 { font-size: 17px; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--key-gap);
  }

  .key {
    height: var(--key-size);
    border: none;
    border-radius: var(--radius);
    background: var(--bg);
    box-shadow:
      var(--shadow-offset) var(--shadow-offset) calc(var(--shadow-offset) * 1.8) var(--bg-dark),
      calc(var(--shadow-offset) * -1) calc(var(--shadow-offset) * -1) calc(var(--shadow-offset) * 1.8) var(--bg-light);
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    transition:
      transform 0.1s ease,
      box-shadow 0.15s ease,
      color 0.15s ease,
      background 0.15s ease;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  .key:hover {
    color: var(--text-dim);
  }

  .key:active, .key.pressed {
    transform: scale(0.94);
    box-shadow:
      calc(var(--shadow-offset) * -0.8) calc(var(--shadow-offset) * -0.8) calc(var(--shadow-offset) * 1.4) var(--bg-dark),
      calc(var(--shadow-offset) * 0.8) calc(var(--shadow-offset) * 0.8) calc(var(--shadow-offset) * 1.4) var(--bg-light);
  }

  .key.func {
    color: var(--accent);
    font-weight: 600;
  }

  .key.func:active, .key.func.pressed {
    color: var(--accent-dark);
  }

  .key.op {
    color: var(--accent);
    font-size: 24px;
    font-weight: 600;
  }

  .key.op:active, .key.op.pressed {
    color: var(--accent-dark);
  }

  .key.equals {
    background: var(--accent);
    color: #fff;
    font-size: 26px;
    font-weight: 600;
    box-shadow:
      var(--shadow-offset) var(--shadow-offset) calc(var(--shadow-offset) * 1.8) var(--accent-dark),
      calc(var(--shadow-offset) * -1) calc(var(--shadow-offset) * -1) calc(var(--shadow-offset) * 1.8) var(--accent-light);
  }

  .key.equals:hover {
    background: var(--accent-light);
  }

  .key.equals:active, .key.equals.pressed {
    background: var(--accent-dark);
    box-shadow:
      calc(var(--shadow-offset) * -0.8) calc(var(--shadow-offset) * -0.8) calc(var(--shadow-offset) * 1.4) var(--bg-dark),
      calc(var(--shadow-offset) * 0.8) calc(var(--shadow-offset) * 0.8) calc(var(--shadow-offset) * 1.4) var(--accent-light);
    color: rgba(255,255,255,0.85);
  }

  .key.zero {
    grid-column: span 2;
  }

  .key .sub {
    font-size: 11px;
    position: absolute;
    bottom: 6px;
    opacity: 0.5;
  }

  @media (max-width: 400px) {
    .calculator {
      width: 95vw;
      padding: 20px;
    }
    :root {
      --key-size: 60px;
      --key-gap: 10px;
    }
    .display .value { font-size: 30px; }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys">
    <button class="key func" data-action="clear">C</button>
    <button class="key func" data-action="toggle">±</button>
    <button class="key func" data-action="percent">%</button>
    <button class="key op" data-action="op" data-value="÷">÷</button>

    <button class="key" data-action="num" data-value="7">7</button>
    <button class="key" data-action="num" data-value="8">8</button>
    <button class="key" data-action="num" data-value="9">9</button>
    <button class="key op" data-action="op" data-value="×">×</button>

    <button class="key" data-action="num" data-value="4">4</button>
    <button class="key" data-action="num" data-value="5">5</button>
    <button class="key" data-action="num" data-value="6">6</button>
    <button class="key op" data-action="op" data-value="−">−</button>

    <button class="key" data-action="num" data-value="1">1</button>
    <button class="key" data-action="num" data-value="2">2</button>
    <button class="key" data-action="num" data-value="3">3</button>
    <button class="key op" data-action="op" data-value="+">+</button>

    <button class="key zero" data-action="num" data-value="0">0</button>
    <button class="key" data-action="decimal">.</button>
    <button class="key equals" data-action="equals">=</button>
  </div>
</div>

<script>
(function() {
  const expressionEl = document.getElementById('expression');
  const valueEl = document.getElementById('value');
  const keys = document.querySelectorAll('.key');

  let currentInput = '0';
  let previousInput = '';
  let operator = null;
  let shouldResetInput = false;
  let lastExpression = '';

  function formatNumber(num) {
    if (num === 'Error') return 'Error';
    const n = parseFloat(num);
    if (isNaN(n)) return '0';
    if (!isFinite(n)) return 'Error';
    const str = num.toString();
    if (str.includes('.') && str.endsWith('0') && !str.includes('e')) return str;
    if (str.endsWith('.')) return str;
    if (Math.abs(n) >= 1e15) return n.toExponential(4);
    return str;
  }

  function updateDisplay() {
    const formatted = formatNumber(currentInput);
    valueEl.textContent = formatted;

    valueEl.className = 'value';
    const len = formatted.length;
    if (len > 14) valueEl.classList.add('shrink-3');
    else if (len > 11) valueEl.classList.add('shrink-2');
    else if (len > 8) valueEl.classList.add('shrink-1');
  }

  function updateExpression(text) {
    expressionEl.textContent = text;
  }

  function inputNumber(num) {
    if (shouldResetInput) {
      currentInput = num;
      shouldResetInput = false;
    } else {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else {
        if (currentInput.replace(/[^0-9]/g, '').length >= 15) return;
        currentInput += num;
      }
    }
    updateDisplay();
  }

  function inputDecimal() {
    if (shouldResetInput) {
      currentInput = '0.';
      shouldResetInput = false;
      updateDisplay();
      return;
    }
    if (!currentInput.includes('.')) {
      currentInput += '.';
    }
    updateDisplay();
  }

  function calculate(a, op, b) {
    const numA = parseFloat(a);
    const numB = parseFloat(b);
    if (isNaN(numA) || isNaN(numB)) return 'Error';
    let result;
    switch(op) {
      case '+': result = numA + numB; break;
      case '−': result = numA - numB; break;
      case '×': result = numA * numB; break;
      case '÷':
        if (numB === 0) return 'Error';
        result = numA / numB;
        break;
      default: return b;
    }
    if (!isFinite(result)) return 'Error';
    const str = parseFloat(result.toPrecision(12)).toString();
    return str;
  }

  function handleOperator(op) {
    if (operator && !shouldResetInput) {
      const result = calculate(previousInput, operator, currentInput);
      updateExpression(result + ' ' + op);
      previousInput = result;
      currentInput = result;
    } else {
      previousInput = currentInput;
      updateExpression(currentInput + ' ' + op);
    }
    operator = op;
    shouldResetInput = true;
    updateDisplay();
  }

  function handleEquals() {
    if (!operator) return;
    const result = calculate(previousInput, operator, currentInput);
    updateExpression(previousInput + ' ' + operator + ' ' + currentInput + ' =');
    currentInput = result;
    previousInput = '';
    operator = null;
    shouldResetInput = true;
    updateDisplay();
  }

  function handleClear() {
    currentInput = '0';
    previousInput = '';
    operator = null;
    shouldResetInput = false;
    updateDisplay();
    updateExpression('');
  }

  function handleToggle() {
    if (currentInput === '0' || currentInput === 'Error') return;
    if (currentInput.startsWith('-')) {
      currentInput = currentInput.slice(1);
    } else {
      currentInput = '-' + currentInput;
    }
    updateDisplay();
  }

  function handlePercent() {
    const num = parseFloat(currentInput);
    if (isNaN(num)) return;
    currentInput = (num / 100).toString();
    updateDisplay();
  }

  // Button click handling
  keys.forEach(function(key) {
    key.addEventListener('click', function() {
      const action = key.dataset.action;
      const value = key.dataset.value;

      switch(action) {
        case 'num': inputNumber(value); break;
        case 'decimal': inputDecimal(); break;
        case 'op': handleOperator(value); break;
        case 'equals': handleEquals(); break;
        case 'clear': handleClear(); break;
        case 'toggle': handleToggle(); break;
        case 'percent': handlePercent(); break;
      }
    });
  });

  // Keyboard support
  const keyMap = {
    '0': '[data-value="0"]',
    '1': '[data-value="1"]',
    '2': '[data-value="2"]',
    '3': '[data-value="3"]',
    '4': '[data-value="4"]',
    '5': '[data-value="5"]',
    '6': '[data-value="6"]',
    '7': '[data-value="7"]',
    '8': '[data-value="8"]',
    '9': '[data-value="9"]',
    '.': '[data-action="decimal"]',
    '+': '[data-value="+"]',
    '-': '[data-value="−"]',
    '*': '[data-value="×"]',
    '/': '[data-value="÷"]',
    'Enter': '[data-action="equals"]',
    '=': '[data-action="equals"]',
    'Escape': '[data-action="clear"]',
    'Backspace': null,
    '%': '[data-action="percent"]'
  };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace') {
      if (currentInput.length > 1 && !shouldResetInput) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
      return;
    }

    const selector = keyMap[e.key];
    if (selector) {
      e.preventDefault();
      const btn = document.querySelector(selector);
      if (btn) {
        btn.click();
        btn.classList.add('pressed');
        setTimeout(function() { btn.classList.remove('pressed'); }, 120);
      }
    }
  });

  updateDisplay();
})();
</script>

</body>
</html>
