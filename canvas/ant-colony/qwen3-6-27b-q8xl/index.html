<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
const GRID_SCALE = 4;
const NUM_ANTS = 350;
const NUM_FOOD = 12;
const ANT_SPEED = 1.8;
const TURN_RATE = 0.15;
const SENSE_RANGE = 18;
const SENSE_ANGLE = Math.PI / 3.5;
const PHEROMONE_DEPOSIT = 120;
const EVAPORATION = 0.985;
const DIFFUSION = 0.08;
const FOOD_PICKUP_DIST = 8;
const NEST_RADIUS = 28;
const CARRY_TIME = 1;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initGrids();
}

let gridW, gridH;
let toFoodGrid, toHomeGrid;
let tempGrid;

function initGrids() {
    gridW = Math.ceil(W / GRID_SCALE);
    gridH = Math.ceil(H / GRID_SCALE);
    const size = gridW * gridH;
    toFoodGrid = new Float32Array(size);
    toHomeGrid = new Float32Array(size);
    tempGrid = new Float32Array(size);
}

function gx(x) { return Math.floor(x / GRID_SCALE); }
function gy(y) { return Math.floor(y / GRID_SCALE); }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function idx(x, y) { return y * gridW + x; }

function updatePheromones(grid) {
    for (let y = 1; y < gridH - 1; y++) {
        for (let x = 1; x < gridW - 1; x++) {
            const i = idx(x, y);
            const avg = (
                grid[idx(x-1,y)] + grid[idx(x+1,y)] +
                grid[idx(x,y-1)] + grid[idx(x,y+1)]
            ) * 0.25;
            tempGrid[i] = (grid[i] * (1 - DIFFUSION) + avg * DIFFUSION) * EVAPORATION;
        }
    }
    for (let i = 0; i < gridW * gridH; i++) grid[i] = tempGrid[i];
}

const nestX = () => W / 2;
const nestY = () => H / 2;

class FoodPile {
    constructor() { this.spawn(); }
    spawn() {
        const margin = 60;
        this.x = margin + Math.random() * (W - margin * 2);
        this.y = margin + Math.random() * (H - margin * 2);
        const dx = this.x - W/2, dy = this.y - H/2;
        if (Math.sqrt(dx*dx+dy*dy) < 100) { this.x += 200; }
        this.amount = 30 + Math.random() * 60;
        this.maxAmount = this.amount;
    }
}

class Ant {
    constructor() {
        this.reset();
    }
    reset() {
        const nx = nestX(), ny = nestY();
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * 10;
        this.x = nx + Math.cos(a) * r;
        this.y = ny + Math.sin(a) * r;
        this.angle = a;
        this.hasFood = false;
        this.wanderAngle = 0;
    }
    update(foodPiles) {
        if (this.hasFood) {
            this.returnToNest();
            if (this.atNest()) {
                this.hasFood = false;
                this.angle += Math.PI + (Math.random()-0.5)*0.5;
            }
        } else {
            this.findFood(foodPiles);
        }
    }
    findFood(foodPiles) {
        this.senseAndSteer(toHomeGrid);
        this.x += Math.cos(this.angle) * ANT_SPEED;
        this.y += Math.sin(this.angle) * ANT_SPEED;
        this.x = clamp(this.x, 0, W);
        this.y = clamp(this.y, 0, H);
        const gx_ = gx(this.x), gy_ = gy(this.y);
        if (gx_ >= 0 && gx_ < gridW && gy_ >= 0 && gy_ < gridH) {
            toHomeGrid[idx(gx_, gy_)] = Math.min(255, toHomeGrid[idx(gx_, gy_)] + PHEROMONE_DEPOSIT);
        }
        for (let f of foodPiles) {
            const dx = this.x - f.x, dy = this.y - f.y;
            if (dx*dx+dy*dy < FOOD_PICKUP_DIST*FOOD_PICKUP_DIST && f.amount > 0) {
                this.hasFood = true;
                f.amount--;
                if (f.amount <= 0) f.spawn();
                break;
            }
        }
    }
    returnToNest() {
        this.senseAndSteer(toFoodGrid);
        this.x += Math.cos(this.angle) * ANT_SPEED;
        this.y += Math.sin(this.angle) * ANT_SPEED;
        this.x = clamp(this.x, 0, W);
        this.y = clamp(this.y, 0, H);
        const gx_ = gx(this.x), gy_ = gy(this.y);
        if (gx_ >= 0 && gx_ < gridW && gy_ >= 0 && gy_ < gridH) {
            toFoodGrid[idx(gx_, gy_)] = Math.min(255, toFoodGrid[idx(gx_, gy_)] + PHEROMONE_DEPOSIT);
        }
    }
    senseAndSteer(grid) {
        const senses = [];
        const numRays = 5;
        for (let i = 0; i < numRays; i++) {
            const a = this.angle - SENSE_ANGLE/2 + (i/(numRays-1)) * SENSE_ANGLE;
            const sx = this.x + Math.cos(a) * SENSE_RANGE;
            const sy = this.y + Math.sin(a) * SENSE_RANGE;
            const gx_ = gx(sx), gy_ = gy(sy);
            let val = 0;
            if (gx_ >= 0 && gx_ < gridW && gy_ >= 0 && gy_ < gridH) {
                val = grid[idx(gx_, gy_)];
            }
            senses.push({ angle: a, value: val });
        }
        let bestIdx = 0;
        for (let i = 1; i < senses.length; i++) {
            if (senses[i].value > senses[bestIdx].value) bestIdx = i;
        }
        const diff = senses[bestIdx].angle - this.angle;
        let nd = diff;
        while (nd > Math.PI) nd -= Math.PI*2;
        while (nd < -Math.PI) nd += Math.PI*2;
        this.angle += nd * TURN_RATE * 2;
        this.angle += (Math.random()-0.5) * 0.3;
    }
    atNest() {
        const dx = this.x - nestX(), dy = this.y - nestY();
        return dx*dx+dy*dy < NEST_RADIUS*NEST_RADIUS;
    }
}

const ants = [];
const foodPiles = [];

function init() {
    for (let i = 0; i < NUM_ANTS; i++) ants.push(new Ant());
    for (let i = 0; i < NUM_FOOD; i++) foodPiles.push(new FoodPile());
}

// Offscreen canvas for pheromone rendering
let phCanvas, phCtx;
let phImageData;

function initPheromoneCanvas() {
    phCanvas = document.createElement('canvas');
    phCanvas.width = gridW;
    phCanvas.height = gridH;
    phCtx = phCanvas.getContext('2d');
    phImageData = phCtx.createImageData(gridW, gridH);
}

function renderPheromones() {
    const data = phImageData.data;
    for (let i = 0; i < gridW * gridH; i++) {
        const tf = toFoodGrid[i];
        const th = toHomeGrid[i];
        const pi = i * 4;
        const intensity = Math.min(255, tf + th);
        if (intensity > 1) {
            const ratio = tf / (tf + th + 0.001);
            data[pi]     = Math.min(255, intensity * (0.3 + ratio * 0.7));
            data[pi + 1] = Math.min(255, intensity * (0.15 + (1-ratio) * 0.5));
            data[pi + 2] = Math.min(255, intensity * (0.1 + (1-ratio) * 0.8));
            data[pi + 3] = Math.min(255, intensity * 0.6);
        } else {
            data[pi] = data[pi+1] = data[pi+2] = data[pi+3] = 0;
        }
    }
    phCtx.putImageData(phImageData, 0, 0);
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(phCanvas, 0, 0, W, H);
    ctx.restore();
}

function renderNest() {
    const nx = nestX(), ny = nestY();
    const grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, NEST_RADIUS * 1.5);
    grad.addColorStop(0, '#1a0e00');
    grad.addColorStop(0.5, '#2a1a0a');
    grad.addColorStop(0.8, '#1a0e05');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(nx, ny, NEST_RADIUS * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0d0700';
    ctx.beginPath();
    ctx.arc(nx, ny, NEST_RADIUS * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#3a2510';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(nx, ny, NEST_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
}

function renderFood() {
    for (const f of foodPiles) {
        if (f.amount <= 0) continue;
        const alpha = Math.min(1, f.amount / f.maxAmount);
        const r = 4 + (f.amount / f.maxAmount) * 8;
        ctx.fillStyle = `rgba(30, ${180 + Math.floor(alpha*60)}, 40, ${0.6 + alpha*0.4})`;
        ctx.beginPath();
        ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
        ctx.fill();
        const count = Math.floor(f.amount / 3);
        for (let i = 0; i < Math.min(count, 12); i++) {
            const a = (i / Math.max(count,1)) * Math.PI * 2 + f.x * 0.1;
            const d = Math.random() * r * 0.6;
            ctx.fillStyle = `rgba(50, ${200+Math.random()*55}, 50, ${0.5+Math.random()*0.5})`;
            ctx.beginPath();
            ctx.arc(f.x + Math.cos(a)*d, f.y + Math.sin(a)*d, 1.5+Math.random(), 0, Math.PI*2);
            ctx.fill();
        }
        ctx.fillStyle = `rgba(100, 255, 100, ${alpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(f.x, f.y, r * 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function renderAnts() {
    for (const ant of ants) {
        if (ant.hasFood) {
            ctx.fillStyle = '#ff6';
            ctx.beginPath();
            ctx.arc(ant.x, ant.y, 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#cc9';
            ctx.beginPath();
            ctx.arc(ant.x, ant.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

let frameCount = 0;

function loop() {
    frameCount++;
    ctx.fillStyle = '#0a0806';
    ctx.fillRect(0, 0, W, H);

    for (const ant of ants) ant.update(foodPiles);

    if (frameCount % 2 === 0) {
        updatePheromones(toFoodGrid);
        updatePheromones(toHomeGrid);
    }

    renderPheromones();
    renderFood();
    renderNest();
    renderAnts();

    requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
    resize();
    initPheromoneCanvas();
});

resize();
initPheromoneCanvas();
init();
loop();
</script>
</body>
</html>
