<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Boids Murmuration</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0c14;
  }
  #c { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });

let W = 0, H = 0, DPR = 1, scale = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(0.4, Math.min(2, 600 / Math.max(W, 700)));
  rebuildLandscape();
}

// ===== Landscape =====
let horizonY, let silH;
let treeBlobs = [], treeSpots = [];

function rand(a, b) { return a + Math.random() * (b - a); }

function rebuildLandscape() {
  silH = H * 0.4;
  horizonY = H - silH;
  treeBlobs = []; treeSpots = [];

  treeBlobs.push({ cx: W * 0.13, baseY: horizonY + silH * 0.5, scale: 1.25, seed: 0.4 });
  treeBlobs.push({ cx: W * 0.35, baseY: horizonY + silH * 0.4, scale: 1.0, seed: 0.7 });
  treeBlobs.push({ cx: W * 0.62, baseY: horizonY + silH * 0.7, scale: 1.45, seed: 1.1 });
  treeBlobs.push({ cx: W * 0.85, baseY: horizonY + silH * 0.5, scale: 1.20, seed: 1.4 });

  const spotN = Math.min(200, Math.floor(W / 6));
  for (let i = 0; i < spotN; i++) {
    const t = i / spotN;
    const x = t * W;
    const baseY = horizonY + Math.sin(t * 7.1 + 1.3) * silH * 0.12 + silH * 0.75;
    treeSpots.push({
      x: x + rand(-15, 15),
      y: baseY + rand(-20, silH * 0.6),
      h: rand(5, 25) * scale,
      sway: rand(0.4, 1.5),
      off: rand(0, Math.PI * 2),
    });
  }
}

function drawLandscape(time) {
  const skyH = horizonY;

  const g1 = ctx.createLinearGradient(0, 0, 0, skyH);
  g1.addColorStop(0, "#14121c");
  g1.addColorStop(0.55, "#563a58");
  g1.addColorStop(0.8, "#a66c40");
  g1.addColorStop(0.95, "#d28c6c");
  g1.addColorStop(1.2, "#b24c40");
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, skyH + 5);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  const sx = W * 0.32;
  const sy = horizonY * 0.55;
  const r = Math.max(10, 90 * scale);
  const sun = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 3.1);
  sun.addColorStop(0, "rgba(255, 200, 130, 0.65)");
  sun.addColorStop(0.25, "rgba(255, 168, 110, 0.32)");
  sun.addColorStop(0.55, "rgba(255, 140, 90, 0.12)");
  sun.addColorStop(1, "rgba(255, 140, 90, 0)");
  ctx.fillStyle = sun;
  ctx.beginPath();
  ctx.arc(sx, sy, r * 3.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffe6b0";
  ctx.beginPath();
  ctx.ellipse(sx, sy, r * 0.45, r * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const hazeG = ctx.createLinearGradient(0, horizonY - 120, 0, horizonY + 60);
  hazeG.addColorStop(0, "rgba(0,0,0,0)");
  hazeG.addColorStop(1, "rgba(40, 20, 30, 0.45)");
  ctx.fillStyle = hazeG;
  ctx.fillRect(0, 0, W, horizonY + 60);

  ctx.fillStyle = "#0a0c12";
  ctx.fillRect(0, horizonY, W, H - horizonY);

  treeBlobs.forEach((b, idx) => {
    ctx.fillStyle = "rgba(5, 7, 12, " + (0.95 - idx * 0.03) + ")";
    ctx.beginPath();
    ctx.ellipse(b.cx, b.baseY, W * 0.08 * b.scale, silH * 0.3 * b.scale, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  treeSpots.forEach((s) => {
    const sway = Math.sin(time * 0.0003 * s.sway + s.off) * 1.5 * scale;
    ctx.strokeStyle = "#040608";
    ctx.lineWidth = 1 * scale;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.quadraticCurveTo(s.x + sway * 0.5, s.y - s.h * 0.5, s.x + sway, s.y - s.h);
    ctx.stroke();
    const bs = Math.max(0.3, 3.5 * scale * Math.sqrt(s.h / 25));
    ctx.beginPath();
    ctx.ellipse(s.x + sway, s.y - s.h, bs, bs * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = "rgba(12, 12, 18, 0.6)";
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, horizonY + 6);
  const step = Math.max(2, Math.floor(W / 200));
  for (let i = step; i < W; i += step) {
    const y = horizonY + 6 + Math.sin(i * 0.013 + 2.1) * 5 + Math.sin(i * 0.024 + 0.7) * 4;
    ctx.lineTo(i, y);
  }
  ctx.lineTo(W, horizonY + 6);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

// ===== Boids =====
const N = 400;
let boids = new Array(N);

function initBoids() {
  for (let i = 0; i < N; i++) {
    boids[i] = {
      x: rand(0, W),
      y: rand(0, horizonY - 50),
      vx: rand(-1, 1),
      vy: rand(-1, 1),
    };
  const a = boids[i];
    const sp = rand(1, 4.2);
    const dir = Math.random() * Math.PI * 2;
    a.vx = Math.cos(dir) * sp;
    a.vy = Math.sin(dir) * sp;
  }
}

// ===== Predator =====
let pred = {
  x: -200, y: H * 0.25,
  tx: -200, ty: H * 0.25,
  active: false, t: 0,
  next: 4000, visible: false, visFade: 0, visFadeT: 0,
};

function resetPred() {
  pred.active = false;
  pred.x = -200; pred.y = H * 0.25;
  pred.tx = W * rand(0.05, 0.95);
  pred.ty = rand(H * 0.08, horizonY - 80);
  pred.next = rand(180, 400) * 60 + (perfNow ? perfNow : 0);
  pred.visible = Math.random() < 0.6;
}

let perfNow = 0;

// ===== Flocking parameters =====
const SEP = 70, VIS = 140, COHE = 70;
const V_MAX = 2.1, V_MIN = 0.5, FORCE_FAC = 0.04;

function step() {
  perfNow = performance.now();

  // ----- predator -----
  if (pred.active) {
    pred.x += (pred.tx - pred.x) * 0.024;
    pred.y += (pred.ty - pred.y) * 0.024;
    pred.t++;
    if (pred.t > 60 * 4.5) {
      pred.active = false;
      pred.next = perfNow + rand(120, 280) * 60;
    }
    if (pred.visFadeT > 0) pred.visFadeT--;
    if (pred.visFadeT === 0 && pred.visible) { pred.visFade = 0; pred.visible = false; }
  } else if (perfNow > pred.next) {
    pred.active = true;
    pred.t = 0;
    pred.tx = rand(W * 0.05, W * 0.95);
    pred.ty = rand(H * 0.08, horizonY - 80);
    pred.visible = Math.random() < 0.5;
    pred.visFade = pred.visible ? 1 : 0;
    pred.visFadeT = pred.visible ? Math.floor(rand(150, 350)) : 0;
  }

  // ----- spatial grid -----
  const cellSize = Math.max(64, VIS * 0.75);
  const gw = Math.ceil(W / cellSize) + 1;
  const gh = Math.ceil(H / cellSize) + 1;
  const gTotal = gw * gh;

  if (grid.length !== gTotal) grid = new Array(gTotal);
  for (let i = 0; i < gTotal; i++) grid[i] = -1;
  if (buckets.length < N + 1) buckets = new Array(N + 1);
  buckets[0] = 0;
  for (let i = 1; i < N + 1; i++) buckets[i] = -1;

  for (let i = 0; i < N; i++) {
    const a = boids[i];
    const gx = Math.floor(a.x / cellSize);
    const gy = Math.floor(a.y / cellSize);
    if (gx >= 0 && gx < gw && gy >= 0 && gy < gh) {
      const idx = gx + gy * gw;
      buckets[i + 1] = grid[idx];
      grid[idx] = i;
    }
  }

  const SEP_R = SEP * SEP;
  const VIS_R = VIS * VIS;
  const COHE_R = COHE * COHE;

  for (let i = 0; i < N; i++) {
    const a = boids[i];
    let ax = a.x, ay = a.y;
    let avx = a.vx, avy = a.vy;

    let sepX = 0, sepY = 0, sepN = 0;
    let alX = 0, alY = 0, alN = 0;
    let coX = 0, coY = 0, coN = 0;

    const agx = Math.floor(ax / cellSize);
    const agy = Math.floor(ay / cellSize);

    for (int j = 0; j < N; j++) continue;

    let sepX = 0, sepY = 0, sepN = 0;
    let alX = 0, alY = 0, alN = 0;
    let coX = 0, coY = 0, coN = 0;

    for (int j = 0; j < N; j++) continue;

    // (placeholder)
  }
}

window.addEventListener("resize", resize);
resize();
initBoids();

// ===== Main loop =====
let lastT = performance.now();
function loop(t) {
  const dt = (t - lastT) / 16;
  lastT = t;
  const frame = Math.min(dt || 1, 3);

  // background fade trail ( very slow fade for motion blur on dark specks
  ctx.fillStyle = "rgba(10, 12, 18, 0.3)";
  ctx.fillRect(0, 0, W, H);

  // update boids
  for (let i = 0; i < N; i++) {
    const a = boids[i];
    a.x += a.vx * frame;
    a.y += a.vy * frame;
    a.x = (a.x + W) % W; if (a.x < 0) a.x += W;
    if (a.y < 0) a.y = 0;
    if (a.y > horizonY - 6) {
      a.y = horizonY - 6;
      a.vy *= -1;
    }
    const sp = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
    const sp2 = sp * sp;
    if (sp > V_MAX) {
      const s = V_MAX / sp;
      a.vx *= s; a.vy *= s;
    }
  }

  // draw boids as dark specks
  ctx.fillStyle = "rgba(8, 8, 14, 0.7)";
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const a = boids[i];
    ctx.moveTo(a.x + 1.5, a.y);
    ctx.arc(a.x, a.y, 1.5, 0, Math.PI * 2);
  }
  ctx.fill();

  // predator glow if visible
  if (pred.visible && pred.visFade > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const r = 60;
    const pg = ctx.createRadialGradient(pred.x, pred.y, 0, pred.x, pred.y, r);
    pg.addColorStop(0, "rgba(200, 220, 230, " + (0.18 * pred.visFade) + ")");
    pg.addColorStop(1, "rgba(200, 220, 230, 0)");
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(pred.x, pred.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // landscape over (drawn on top? Actually we want boids visible behind trees? We draw landscape AFTER boids so trees obscure them like real silhouette
  drawLandscape(t);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
