<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Typing Typewriter Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1612;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        /* Vignette overlay for atmosphere */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, #000000 100%);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>

    <canvas id="canvas"></canvas>
    <div class="vignette"></div>
