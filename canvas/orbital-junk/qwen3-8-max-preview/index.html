<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Orbital Junk — LEO Debris Screensaver</title>
<style>
  :root{
    --amber:#ffb454; --cyan:#5fd8ff; --ink:#dfe9f8; --dim:#7e93b4;
    --bad:#ff6b6b; --ok:#6cf5b2;
    --mono:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,monospace;
    --disp:'Bahnschrift','Avenir Next Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#03060d;overscroll-behavior:none}
  body{cursor:crosshair;font-family:var(--mono);color:var(--ink)}
  canvas{position:fixed;inset:0;display:block}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .45s ease}
  body.nohud #hud{opacity:0}

  .panel{position:absolute;background:rgba(6,12,24,.78);border:1px solid rgba(126,166,220,.28);padding:12px 14px}
  .panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--amber)}
  .panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

  #title{top:18px;left:18px;padding:14px 20px 12px}
  #title h1{font-family:var(--disp);font-weight:800;font-size:clamp(28px,3.8vw,46px);line-height:.92;letter-spacing:.08em}
  #title h1 .a{color:#f2f7ff;display:block}
  #title h1 .b{color:var(--amber);display:block;margin-left:.12em}
  @supports(-webkit-text-stroke:1px #000){
    #title h1 .b{color:transparent;-webkit-text-stroke:1px var(--amber)}
  }
  #title .sub{margin-top:8px;font-size:9.5px;letter-spacing:.34em;color:var(--dim)}
  #title .live{margin-top:9px;font-size:10px;letter-spacing:.22em;color:var(--ok);display:flex;align-items:center;gap:7px}
  #title .live i{width:6px;height:6px;background:var(--ok);border-radius:50%;animation:blip 1.6s infinite}
  @keyframes blip{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(108,245,178,.5)}50%{opacity:.45;box-shadow:0 0 0 5px rgba(108,245,178,0)}}

  #telem{top:18px;right:18px;min-width:216px}
  #telem h2{font-family:var(--disp);font-size:11px;letter-spacing:.32em;color:var(--cyan);margin-bottom:8px;font-weight:700}
  .row{display:flex;justify-content:space-between;gap:18px;font-size:11px;padding:3px 0;border-bottom:1px dashed rgba(126,166,220,.14)}
  .row:last-of-type{border-bottom:0}
  .row b{color:var(--dim);font-weight:400;letter-spacing:.14em;font-size:9.5px;padding-top:1px}
  .row span{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .row span.bump{animation:bump .5s}
  @keyframes bump{0%{color:var(--amber);transform:translateX(2px)}100%{color:var(--ink)}}
  .meter{margin-top:10px}
  .meter label{font-size:9px;letter-spacing:.22em;color:var(--dim)}
  .bar{height:5px;background:rgba(126,166,220,.16);margin-top:4px;position:relative;overflow:hidden}
  .bar i{position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--ok);transition:width .4s,background .4s}

  #log{position:absolute;left:18px;bottom:18px;display:flex;flex-direction:column;gap:4px;max-width:min(580px,72vw)}
  .ln{font-size:10.5px;letter-spacing:.05em;padding:5px 9px;background:rgba(6,12,24,.72);border-left:2px solid var(--dim);animation:lnin .4s ease both}
  .ln span{color:var(--dim);margin-right:9px}
  .ln.bad{border-color:var(--bad);color:#ffd9d9}
  .ln.ok{border-color:var(--ok);color:#d9ffee}
  .ln.warn{border-color:var(--amber);color:#ffeeda}
  .ln.info{border-color:var(--cyan);color:#dcf3ff}
  .ln:nth-child(n+3){opacity:.66}
  .ln:nth-child(n+5){opacity:.36}
  @keyframes lnin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  #dock{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #droneChip{font-size:10.5px;letter-spacing:.14em;padding:6px 11px;background:rgba(6,12,24,.78);border:1px solid rgba(95,216,255,.35);color:var(--cyan);display:flex;gap:9px;align-items:center;transition:color .3s,border-color .3s}
  #droneChip i{width:6px;height:6px;background:currentColor;border-radius:50%;animation:blip 1.1s infinite}
  #droneChip[data-st="capture"]{color:var(--ok);border-color:rgba(108,245,178,.55)}
  #droneChip[data-st="pursue"]{color:#bfe9ff}
  #hints{font-size:9.5px;letter-spacing:.12em;color:var(--dim);display:flex;gap:12px}
  #hints kbd{border:1px solid rgba(126,166,220,.4);padding:1px 5px;color:var(--ink);font-family:var(--mono);font-size:9px}

  #paused{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;font-family:var(--disp);letter-spacing:.5em;font-size:15px;color:var(--amber);border:1px solid rgba(255,180,84,.5);padding:12px 20px 12px 32px;background:rgba(4,8,16,.72);opacity:0;pointer-events:none;transition:opacity .3s}
  #paused.on{opacity:1;animation:pblink 1.4s infinite}
  @keyframes pblink{50%{border-color:rgba(255,180,84,.15)}}

  @media (max-width:680px){#telem{display:none}#hints{display:none}#log{max-width:78vw}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hud">
  <div class="panel" id="title">
    <h1><span class="a">ORBITAL</span><span class="b">JUNK</span></h1>
    <div class="sub">LEO DEBRIS TRACKING · SECTOR 7G</div>
    <div class="live"><i></i>TRACKING ACTIVE</div>
  </div>
  <div class="panel" id="telem">
    <h2>TELEMETRY</h2>
    <div class="row"><b>OBJECTS TRACKED</b><span id="vTrk">0</span></div>
    <div class="row"><b>ACTIVE SATELLITES</b><span id="vSat">0</span></div>
    <div class="row"><b>DEBRIS FRAGMENTS</b><span id="vDeb">0</span></div>
    <div class="row"><b>COLLISION EVENTS</b><span id="vCol">0</span></div>
    <div class="row"><b>DRONE PICKUPS</b><span id="vPic">0</span></div>
    <div class="row"><b>MISSION CLOCK</b><span id="vClk">T+00:00</span></div>
    <div class="meter"><label>SKY SATURATION</label><div class="bar"><i id="vBar"></i></div></div>
  </div>
  <div id="log"></div>
  <div id="dock">
    <div id="droneChip" data-st="scan"><i></i><span id="droneTxt">JANITOR-1 · SCANNING</span></div>
    <div id="hints"><span><kbd>CLICK</kbd> DEBRIS BURST</span><span><kbd>H</kbd> HUD</span><span><kbd>SPACE</kbd> PAUSE</span></div>
  </div>
</div>
<div id="paused">SIM PAUSED</div>

<script>
(()=>{ 'use strict';
const TAU=Math.PI*2;
const cv=document.getElementById('sky'), ctx=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hyp=Math.hypot;
const normA=a=>{a%=TAU;return a<0?a+TAU:a;};
const angLerp=(a,b,t)=>{let d=normA(b-a);if(d>Math.PI)d-=TAU;return a+d*t;};
const MONO="ui-monospace,Menlo,Consolas,monospace";

let W=0,H=0,DPR=1,DIAG=0;
const E={x:0,y:0,r:0};
let sunAng=0,rMin=0,rMax=0,K=0,MAXO=500;
let bands=[];
const objs=[], parts=[];
let idc=1, hoverObj=null;
let starCv=null, twinks=[], eSurf=null, eCloud=null, eTerm=null, eGlow=null;
let glintSpr=null, cityPts=[];
let rotS=rand(0,TAU), rotC=rand(0,TAU);

const S={t:0,clock:0,paused:false,collisions:0,pickups:0,lastColl:-99,nextForce:8,lastReLog:-99,shake:0,mT:6};
const mouse={x:-9999,y:-9999,px:0,py:0,cx:0,cy:0};
const drone={x:0,y:0,vx:0,vy:0,st:'scan',tgt:null,rt:0,cap:0,ping:1,ang:0,beamA:0};

const SATPRE=['STARLING','IRIDIUM','NOAA','FENGYUN','O3B','METEOR','TIROS','AVANGARD','HAIYANG','ONEWEB'];
const DEBPRE=['COSMOS 2251','SL-16 R/B','CZ-6A DEB','THORAD AGENA','IRIDIUM 33','METEOR 2-5','DELTA 1 R/B','ARIANE 44L','FENGYUN 1C','COSMOS 1408'];
const TYPELBL={sat:'SATELLITE',rocket:'ROCKET BODY',deb:'DEBRIS',frag:'FRAGMENT',fleck:'PAINT FLECK'};

const omg=r=>K*Math.pow(r,-1.5);
const altKm=r=>Math.round((r/E.r-1)*550);
const fmt=t=>{t|=0;const h=(t/3600)|0,m=((t%3600)/60)|0,s=t%60,p=n=>String(n).padStart(2,'0');return h?p(h)+':'+p(m)+':'+p(s):p(m)+':'+p(s);};

function makeCv(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*DPR));c.height=Math.max(1,Math.round(h*DPR));const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return [c,g];}

function makeShape(){const n=randi(4,6),v=[];for(let i=0;i<n;i++){const a=i/n*TAU+rand(-.5,.5),r=rand(.45,1.15);v.push([Math.cos(a)*r,Math.sin(a)*r]);}return v;}

function makeObj(type,r,a,x){x=x||{};
  const o={id:idc++,type,r,a,wMul:x.wMul!==undefined?x.wMul:1,vr:x.vr||0,rot:rand(0,TAU),spin:rand(-2.5,2.5),
    gp:rand(0,TAU),gs:rand(.5,1.8),blink:rand(0,TAU),dead:false,captured:false,scale:1,guided:false,gT:0,x:0,y:0};
  if(type==='sat'){o.size=rand(2.2,3.2);o.name=pick(SATPRE)+'-'+randi(10,99);}
  else if(type==='rocket'){o.size=rand(3,4);o.name=pick(DEBPRE);o.spin=rand(-.7,.7);}
  else if(type==='deb'){o.size=rand(1.4,2.6);o.name=pick(DEBPRE)+' #'+randi(100,999);o.sh=makeShape();}
  else if(type==='frag'){o.size=rand(1.1,2.4);o.name='FRAG-'+String(o.id).padStart(4,'0');o.sh=makeShape();o.spin=rand(-6,6);}
  else{o.size=rand(.6,1);o.name='FLECK-'+o.id;o.sh=makeShape();}
  o.x=E.x+Math.cos(a)*r; o.y=E.y+Math.sin(a)*r;
  return o;
}

/* ---------- background ---------- */
function buildStars(){
  const [c,g]=makeCv(W+60,H+60); starCv=c;
  const bg=g.createLinearGradient(0,0,W*0.6,H);
  bg.addColorStop(0,'#060b1a');bg.addColorStop(.5,'#04070f');bg.addColorStop(1,'#02040a');
  g.fillStyle=bg;g.fillRect(0,0,W+60,H+60);
  // faint nebula hints
  let n=g.createRadialGradient(W*.78,H*.22,0,W*.78,H*.22,W*.34);
  n.addColorStop(0,'rgba(43,107,122,0.07)');n.addColorStop(1,'rgba(43,107,122,0)');
  g.fillStyle=n;g.fillRect(0,0,W+60,H+60);
  n=g.createRadialGradient(W*.28,H*.68,0,W*.28,H*.68,W*.3);
  n.addColorStop(0,'rgba(122,74,58,0.05)');n.addColorStop(1,'rgba(122,74,58,0)');
  g.fillStyle=n;g.fillRect(0,0,W+60,H+60);
  // milky band
  g.save();g.translate((W+60)/2,(H+60)/2);g.rotate(-0.5);
  const mw=g.createLinearGradient(0,-H*.42,0,H*.42);
  mw.addColorStop(0,'rgba(110,150,210,0)');mw.addColorStop(.35,'rgba(110,150,210,0.06)');
  mw.addColorStop(.5,'rgba(165,200,240,0.12)');mw.addColorStop(.65,'rgba(110,150,210,0.06)');
  mw.addColorStop(1,'rgba(110,150,210,0)');
  g.fillStyle=mw;g.fillRect(-DIAG,-H*.42,DIAG*2,H*.84);
  for(let i=0;i<420;i++){
    const gx=rand(-DIAG,DIAG), gy=((Math.random()+Math.random()+Math.random()-1.5)/1.5)*H*.11;
    g.globalAlpha=rand(.12,.5);g.fillStyle=Math.random()<.8?'#cfe0ff':'#ffd9b0';
    g.fillRect(gx,gy,rand(.4,1),rand(.4,1));
  }
  g.restore();g.globalAlpha=1;
  // stars
  const ns=Math.round(W*H/3200)+140;
  for(let i=0;i<ns;i++){
    const x=rand(0,W+60),y=rand(0,H+60),s=Math.random()<.92?rand(.4,1.3):rand(1.5,2.2);
    const col=Math.random()<.6?'#ffffff':(Math.random()<.65?'#cfe0ff':'#ffd9b0');
    g.globalAlpha=rand(.3,.95);g.fillStyle=col;
    g.beginPath();g.arc(x,y,s*.5,0,TAU);g.fill();
    if(s>1.5){g.strokeStyle=col;g.globalAlpha*=.5;g.lineWidth=.7;
      g.beginPath();g.moveTo(x-s*2.2,y);g.lineTo(x+s*2.2,y);g.moveTo(x,y-s*2.2);g.lineTo(x,y+s*2.2);g.stroke();}
  }
  g.globalAlpha=1;
  // vignette
  const v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,DIAG*.72);
  v.addColorStop(0,'rgba(1,3,8,0)');v.addColorStop(1,'rgba(1,3,8,0.5)');
  g.fillStyle=v;g.fillRect(0,0,W+60,H+60);
  twinks=[];for(let i=0;i<70;i++)twinks.push({x:rand(0,W),y:rand(0,H),r:rand(.6,1.5),p:rand(0,TAU),s:rand(.6,2)});
}

/* ---------- earth ---------- */
function buildEarth(){
  const R=E.r,pad=R*.20,D=(R+pad)*2;
  const lx=Math.cos(sunAng),ly=Math.sin(sunAng);
  // surface
  {const [c,g]=makeCv(D,D);eSurf=c;
   g.save();g.translate(R+pad,R+pad);
   g.beginPath();g.arc(0,0,R,0,TAU);g.clip();
   const oc=g.createRadialGradient(lx*R*.5,ly*R*.5,R*.05,0,0,R*1.25);
   oc.addColorStop(0,'#8fd0f4');oc.addColorStop(.25,'#3f8ecb');oc.addColorStop(.55,'#175a9e');
   oc.addColorStop(.8,'#0a2f63');oc.addColorStop(1,'#04122e');
   g.fillStyle=oc;g.fillRect(-R,-R,D,D);
   const landCols=['#3f7a4c','#4d8554','#6f9a5e','#8fae6a','#b0a06b'];
   const nC=randi(6,8);
   for(let i=0;i<nC;i++){
     const ca=rand(0,TAU),cr=rand(0,R*.82);
     let cx=Math.cos(ca)*cr,cy=Math.sin(ca)*cr;
     const col=pick(landCols),lobes=randi(5,9);
     for(let j=0;j<lobes;j++){
       const lr=R*rand(.05,.14);
       g.fillStyle=col;g.globalAlpha=.92;
       g.beginPath();g.arc(cx,cy,lr,0,TAU);g.fill();
       g.globalAlpha=.18;g.fillStyle='#12291f';
       g.beginPath();g.arc(cx+lr*.3,cy+lr*.3,lr*.7,0,TAU);g.fill();
       cx+=rand(-R*.1,R*.1);cy+=rand(-R*.1,R*.1);
     }
   }
   g.globalAlpha=1;
   // polar ice
   for(const py of [-R*.93,R*.95]){
     const ig=g.createRadialGradient(0,py,0,0,py,R*.3);
     ig.addColorStop(0,'rgba(235,245,255,0.9)');ig.addColorStop(1,'rgba(235,245,255,0)');
     g.save();g.translate(0,py);g.scale(1,.45);g.translate(0,-py);
     g.fillStyle=ig;g.beginPath();g.arc(0,py,R*.3,0,TAU);g.fill();g.restore();
   }
   // sun specular glare
   const sg=g.createRadialGradient(lx*R*.55,ly*R*.55,0,lx*R*.55,ly*R*.55,R*.4);
   sg.addColorStop(0,'rgba(255,255,255,0.22)');sg.addColorStop(1,'rgba(255,255,255,0)');
   g.fillStyle=sg;g.fillRect(-R,-R,D,D);
   g.restore();}
  // clouds
  {const [c,g]=makeCv(D,D);eCloud=c;
   g.translate(R+pad,R+pad);
   g.beginPath();g.arc(0,0,R*.995,0,TAU);g.clip();
   for(let i=0;i<30;i++){
     const ca=rand(0,TAU),cr=rand(R*.1,R*.95);
     const x=Math.cos(ca)*cr,y=Math.sin(ca)*cr;
     const len=R*rand(.12,.4),wd=R*rand(.02,.05);
     g.save();g.translate(x,y);g.rotate(ca+Math.PI/2+rand(-.35,.35));g.scale(len,wd);
     const g2=g.createRadialGradient(0,0,0,0,0,1);
     g2.addColorStop(0,'rgba(255,255,255,'+rand(.14,.3).toFixed(2)+')');
     g2.addColorStop(1,'rgba(255,255,255,0)');
     g.fillStyle=g2;g.beginPath();g.arc(0,0,1,0,TAU);g.fill();g.restore();
   }}
  // terminator (static — sun fixed)
  {const [c,g]=makeCv(D,D);eTerm=c;
   g.translate(R+pad,R+pad);
   const lg=g.createLinearGradient(lx*R,ly*R,-lx*R,-ly*R);
   lg.addColorStop(0,'rgba(3,8,20,0)');lg.addColorStop(.46,'rgba(3,8,20,0.06)');
   lg.addColorStop(.56,'rgba(3,8,20,0.55)');lg.addColorStop(.72,'rgba(2,6,16,0.86)');
   lg.addColorStop(1,'rgba(1,4,12,0.95)');
   g.fillStyle=lg;g.beginPath();g.arc(0,0,R,0,TAU);g.fill();}
  // atmosphere glow
  {const [c,g]=makeCv(D,D);eGlow=c;
   g.translate(R+pad,R+pad);
   let rg=g.createRadialGradient(0,0,R*.96,0,0,R+pad);
   rg.addColorStop(0,'rgba(150,205,255,0)');rg.addColorStop(.25,'rgba(150,205,255,0.28)');
   rg.addColorStop(.55,'rgba(110,170,255,0.10)');rg.addColorStop(1,'rgba(110,170,255,0)');
   g.fillStyle=rg;g.fillRect(-R-pad,-R-pad,D,D);
   g.globalCompositeOperation='lighter';
   rg=g.createRadialGradient(lx*R*.6,ly*R*.6,R*.2,lx*R*.6,ly*R*.6,R+pad*.8);
   rg.addColorStop(0,'rgba(210,240,255,0.14)');rg.addColorStop(1,'rgba(210,240,255,0)');
   g.fillStyle=rg;g.fillRect(-R-pad,-R-pad,D,D);}
  // city light clusters (surface-local coords)
  cityPts=[];
  for(let i=0;i<9;i++){
    const ca=rand(0,TAU),cr=rand(R*.15,R*.8);
    const bx=Math.cos(ca)*cr,by=Math.sin(ca)*cr,n=randi(5,12);
    for(let j=0;j<n;j++)cityPts.push({x:bx+rand(-R*.06,R*.06),y:by+rand(-R*.06,R*.06),s:rand(.7,1.4),p:rand(0,TAU)});
  }
}

function buildSprites(){
  glintSpr=document.createElement('canvas');glintSpr.width=glintSpr.height=48;
  const g=glintSpr.getContext('2d');
  const gr=g.createRadialGradient(24,24,0,24,24,24);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.2,'rgba(220,240,255,0.6)');gr.addColorStop(1,'rgba(220,240,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,48,48);
  g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=1;
  g.beginPath();g.moveTo(24,5);g.lineTo(24,43);g.moveTo(5,24);g.lineTo(43,24);g.stroke();
}

/* ---------- world ---------- */
function resize(){
  const oR=E.r;
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;DIAG=hyp(W,H);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  E.x=W*.045;E.y=H*.965;E.r=Math.min(W,H)*.46;
  if(oR&&objs.length){const s=E.r/oR;for(const o of objs)o.r*=s;}
  sunAng=Math.atan2(H*.12-E.y,W*.86-E.x);
  rMin=E.r*1.10;rMax=DIAG*1.02;K=(TAU/22)*Math.pow(rMin,1.5);
  MAXO=Math.round(clamp(W*H/2600,300,700));
  bands=[];const nb=11;
  for(let i=0;i<nb;i++){const t=i/(nb-1);bands.push({r:lerp(rMin,rMax,Math.pow(t,1.35)),dash:i%4===2});}
  buildStars();buildEarth();
}

function populate(){
  objs.length=0;
  const shells=[bands[2].r,bands[4].r,bands[6].r];
  for(const sr of shells){
    const n=randi(9,13),a0=rand(0,TAU);
    for(let i=0;i<n;i++)objs.push(makeObj('sat',sr+rand(-6,6),a0+i/n*TAU+rand(-.02,.02)));
  }
  for(let i=0;i<6;i++)objs.push(makeObj('rocket',pick(bands).r+rand(-14,14),rand(0,TAU)));
  const target=Math.round(MAXO*.62);
  const low=bands.slice(0,4);
  while(objs.length<target){
    const b=Math.random()<.45?pick(low):pick(bands);
    const r=Math.max(rMin*.98,b.r+rand(-24,24));
    const t=Math.random();
    objs.push(makeObj(t<.42?'fleck':t<.8?'deb':'frag',r,rand(0,TAU)));
  }
}

/* ---------- particles ---------- */
function trimP(){if(parts.length>700)parts.splice(0,parts.length-700);}
function spark(x,y,n,sp,cols,life){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(sp*.25,sp);parts.push({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(life*.5,life),ml:life,s:rand(.6,1.6),c:pick(cols)});}trimP();}
function ring(x,y,r0,r1,life,col){parts.push({k:'r',x,y,r0,r1,l:life,ml:life,c:col});trimP();}
function flash(x,y,s,life){parts.push({k:'f',x,y,s,l:life,ml:life});trimP();}

/* ---------- collisions ---------- */
function doCollide(o1,o2){
  S.collisions++;S.lastColl=S.t;S.shake=Math.min(6,S.shake+3.5);
  const r=(o1.r+o2.r)/2,a=o1.a;
  const w=(omg(o1.r)*o1.wMul+omg(o2.r)*o2.wMul)/2;
  const x=E.x+Math.cos(a)*r,y=E.y+Math.sin(a)*r;
  const head=1-objs.length/MAXO;
  let n=Math.round(randi(9,16)*clamp(head,.2,1));
  if(o1.type==='fleck'&&o2.type==='fleck')n=Math.max(3,n>>1);
  for(let i=0;i<n;i++){
    const fr=Math.max(E.r+20,r+rand(-5,5)),fa=a+rand(-.03,.03);
    const fw=w*rand(.88,1.14);
    objs.push(makeObj(Math.random()<.34?'fleck':'frag',fr,fa,{wMul:fw/omg(fr),vr:rand(-16,34)}));
  }
  o1.dead=o2.dead=true;
  flash(x,y,rand(26,40),.5);
  ring(x,y,4,rand(60,95),.8,'rgba(190,225,255,');
  spark(x,y,26,170,['#ffffff','#ffd27a','#ff9a4d','#9fd8ff'],1.1);
  log('bad','COLLISION — '+o1.name+' × '+o2.name+' · +'+n+' FRAGS');
  S.nextForce=S.t+rand(9,17);
}

function collideCheck(){
  if(S.t-S.lastColl<2.2)return;
  const cell=22,map=new Map();
  for(let i=0;i<objs.length;i++){
    const o=objs[i];if(o.dead||o.captured)continue;
    const k=((o.x/cell)|0)+','+((o.y/cell)|0);
    let arr=map.get(k);if(!arr){arr=[];map.set(k,arr);}arr.push(o);
  }
  const offs=[[0,0],[1,0],[-1,1],[0,1],[1,1]];
  outer:
  for(const [k,arr] of map){
    const p=k.split(','),cx0=+p[0],cy0=+p[1];
    for(const off of offs){
      const arr2=(off[0]===0&&off[1]===0)?arr:map.get((cx0+off[0])+','+(cy0+off[1]));
      if(!arr2)continue;
      for(let a=0;a<arr.length;a++){
        const o1=arr[a];
        for(let b=(off[0]===0&&off[1]===0?a+1:0);b<arr2.length;b++){
          const o2=arr2[b];
          if(o1===o2||o1.dead||o2.dead)continue;
          const rr=o1.size+o2.size+1.6;
          const dx=o1.x-o2.x,dy=o1.y-o2.y;
          if(dx*dx+dy*dy<rr*rr){doCollide(o1,o2);break outer;}
        }
      }
    }
  }
}

/* paced conjunctions guarantee occasional impacts */
function forceConjunction(){
  S.nextForce=S.t+rand(4,8);
  const cands=objs.filter(o=>!o.dead&&!o.captured&&o.type!=='fleck'&&o.r<rMin*3.2);
  for(let tries=0;tries<14;tries++){
    if(cands.length<2)break;
    const o1=pick(cands),o2=pick(cands);
    if(o1===o2||Math.abs(o1.r-o2.r)>46)continue;
    const gap=normA(o1.a-o2.a);
    if(gap<.35)continue;
    const w1=omg(o1.r)*o1.wMul,T=rand(6,10);
    const wMul2=(w1+gap/T)/omg(o2.r);
    if(wMul2<.75||wMul2>1.75)continue;
    o2.wMul=wMul2;o2.vr=(o1.r-o2.r)/T;o2.guided=true;o2.gT=S.t+T+6;
    S.nextForce=S.t+T+rand(6,12);
    log('info','CONJUNCTION ALERT — '+o1.name+' / '+o2.name);
    return;
  }
}

/* ---------- drone ---------- */
function seek(tx,ty,ms,dt){
  const d=drone;
  const dx=tx-d.x,dy=ty-d.y,dist=hyp(dx,dy)||1;
  const dvx=dx/dist*ms-d.vx,dvy=dy/dist*ms-d.vy;
  const f=Math.hypot(dvx,dvy);
  const s=f>0?Math.min(1,260*dt/f):0;
  d.vx+=dvx*s;d.vy+=dvy*s;
  const sp=Math.hypot(d.vx,d.vy),mx=ms*1.5;
  if(sp>mx){d.vx*=mx/sp;d.vy*=mx/sp;}
  if(f>60&&Math.random()<.5){
    const ba=Math.atan2(d.vy,d.vx)+Math.PI+rand(-.4,.4);
    parts.push({k:'s',x:d.x,y:d.y,vx:Math.cos(ba)*rand(20,50),vy:Math.sin(ba)*rand(20,50),l:.4,ml:.4,s:.8,c:'#5fd8ff'});
  }
}

function droneUpdate(dt){
  const d=drone;
  if(d.tgt&&(d.tgt.dead||(d.tgt.captured&&d.st!=='capture')))d.tgt=null;
  const maxSp=52+95*clamp(objs.length/MAXO,0,1);
  if(d.st==='scan'){
    d.rt-=dt;
    if(d.rt<=0){
      d.rt=.7;let best=null,bs=1e18;
      for(const o of objs){
        if(o.dead||o.captured||o.type==='sat')continue;
        const sc=hyp(o.x-d.x,o.y-d.y)+(o.type==='fleck'?260:o.type==='deb'?60:o.type==='rocket'?120:0);
        if(sc<bs){bs=sc;best=o;}
      }
      d.tgt=best;if(best)d.st='pursue';
    }
    d.ping-=dt;
    if(d.ping<=0){d.ping=2.4;ring(d.x,d.y,6,70,1.4,'rgba(120,220,255,');}
    const da=Math.atan2(d.y-E.y,d.x-E.x)+.25;
    const pr=clamp(hyp(d.x-E.x,d.y-E.y),rMin*1.2,rMax*.55);
    seek(E.x+Math.cos(da)*pr,E.y+Math.sin(da)*pr,maxSp*.55,dt);
  }else if(d.st==='pursue'){
    if(!d.tgt){d.st='scan';d.rt=0;}
    else{
      const o=d.tgt,dist=hyp(o.x-d.x,o.y-d.y);
      const tt=clamp(dist/maxSp,0,1.2)*.75;
      const w=omg(o.r)*o.wMul;
      seek(o.x-Math.sin(o.a)*w*o.r*tt,o.y+Math.cos(o.a)*w*o.r*tt,maxSp,dt);
      if(dist<11){d.st='capture';d.cap=.55;o.captured=true;log('info','JANITOR-1 LOCKED — '+o.name);}
    }
  }else if(d.st==='capture'){
    const o=d.tgt;
    if(!o||o.dead){d.st='scan';d.rt=.4;d.beamA=0;}
    else{
      d.cap-=dt;
      seek(o.x,o.y,maxSp*.8,dt);
      o.scale=Math.max(.1,d.cap/.55);
      d.beamA=1;
      if(d.cap<=0){
        o.dead=true;S.pickups++;
        spark(o.x,o.y,10,80,['#8ff0ff','#ffffff','#6cf5b2'],.7);
        flash(o.x,o.y,16,.35);
        log('ok','JANITOR-1 COLLECTED — '+o.name);
        d.st='scan';d.rt=.9;d.tgt=null;d.beamA=0;
      }
    }
  }
  if(d.st!=='capture')d.beamA=Math.max(0,d.beamA-dt*3);
  const er=hyp(d.x-E.x,d.y-E.y);
  if(er<E.r+46){const f=(E.r+46-er)*3;d.vx+=(d.x-E.x)/er*f*dt*8;d.vy+=(d.y-E.y)/er*f*dt*8;}
  d.x+=d.vx*dt;d.y+=d.vy*dt;
  const sp=hyp(d.vx,d.vy);
  if(sp>4)d.ang=angLerp(d.ang,Math.atan2(d.vy,d.vx),clamp(dt*6,0,1));
}

/* ---------- simulation ---------- */
function update(dt){
  S.t+=dt;S.clock+=dt;
  rotS+=dt*.006;rotC+=dt*.0105;
  if(S.t>S.nextForce)forceConjunction();
  S.mT-=dt;
  if(S.mT<0){S.mT=rand(6,16);const ma=rand(2.2,2.8),mv=rand(380,620);
    parts.push({k:'s',x:rand(W*.2,W),y:rand(-20,H*.3),vx:Math.cos(ma)*mv,vy:Math.sin(ma)*mv,l:1.1,ml:1.1,s:1.2,c:'#cfe4ff'});}
  for(const o of objs){
    if(o.dead)continue;
    if(o.guided&&S.t>o.gT){o.guided=false;o.wMul=1;}
    o.a=normA(o.a+omg(o.r)*o.wMul*dt);
    o.r+=o.vr*dt;
    if(!o.guided)o.vr*=Math.exp(-.9*dt);
    o.rot+=o.spin*dt;
    if(o.type!=='sat'&&o.type!=='rocket'&&o.r<E.r+40)o.vr-=30*dt;
    if(o.r<=E.r+12){
      o.dead=true;
      spark(E.x+Math.cos(o.a)*o.r,E.y+Math.sin(o.a)*o.r,6,60,['#ffb454','#ffffff'],.5);
      if(S.t-S.lastReLog>8){S.lastReLog=S.t;log('info','ATMOSPHERIC DECAY — '+o.name);}
      continue;
    }
    o.x=E.x+Math.cos(o.a)*o.r;o.y=E.y+Math.sin(o.a)*o.r;
  }
  collideCheck();
  for(let i=objs.length-1;i>=0;i--)if(objs[i].dead)objs.splice(i,1);
  droneUpdate(dt);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.l-=dt;
    if(p.l<=0){parts.splice(i,1);continue;}
    if(p.k==='s'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;}
  }
  hoverObj=null;let bd=26*26;
  for(const o of objs){const dx=o.x-mouse.x,dy=o.y-mouse.y,d2=dx*dx+dy*dy;if(d2<bd){bd=d2;hoverObj=o;}}
}

/* ---------- drawing ---------- */
function drawTwinks(){
  for(const t of twinks){
    ctx.globalAlpha=.2+.55*(.5+.5*Math.sin(S.t*t.s+t.p));
    ctx.fillStyle='#dfe9ff';ctx.fillRect(t.x,t.y,t.r,t.r);
  }
  ctx.globalAlpha=1;
}

function drawOrbits(){
  ctx.lineWidth=1;
  for(const b of bands){
    ctx.strokeStyle=b.dash?'rgba(140,180,235,0.10)':'rgba(140,180,235,0.055)';
    if(b.dash)ctx.setLineDash([2,7]);
    ctx.beginPath();ctx.arc(E.x,E.y,b.r,0,TAU);ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.font='9px '+MONO;ctx.fillStyle='rgba(150,190,240,0.30)';
  for(let i=2;i<bands.length;i+=3){
    const r=bands[i].r,la=-.72;
    const x=E.x+Math.cos(la)*r+6,y=E.y+Math.sin(la)*r-6;
    if(x<W-40&&y>14)ctx.fillText(altKm(r)+' KM',x,y);
  }
}

function drawEarth(){
  const R=E.r,pad=R*.20,D=(R+pad)*2;
  const cs=Math.cos(rotS),sn=Math.sin(rotS);
  const lx=Math.cos(sunAng),ly=Math.sin(sunAng);
  ctx.save();ctx.translate(E.x,E.y);
  ctx.save();ctx.rotate(rotS);ctx.drawImage(eSurf,-(R+pad),-(R+pad),D,D);ctx.restore();
  ctx.save();ctx.rotate(rotC);ctx.globalAlpha=.9;ctx.drawImage(eCloud,-(R+pad),-(R+pad),D,D);ctx.restore();
  ctx.drawImage(eTerm,-(R+pad),-(R+pad),D,D);
  ctx.fillStyle='#ffd28a';
  for(const p of cityPts){
    const rx=p.x*cs-p.y*sn,ry=p.x*sn+p.y*cs;
    if(rx*lx+ry*ly<-.12){
      ctx.globalAlpha=.35+.4*(.5+.5*Math.sin(S.t*1.5+p.p));
      ctx.fillRect(rx,ry,p.s,p.s);
    }
  }
  ctx.globalAlpha=1;
  ctx.drawImage(eGlow,-(R+pad),-(R+pad),D,D);
  ctx.restore();
}

function drawGlint(x,y,s,a){ctx.globalAlpha=a;ctx.drawImage(glintSpr,x-s/2,y-s/2,s,s);ctx.globalAlpha=1;}

function drawObjs(){
  for(const o of objs){
    if(o.dead)continue;
    const x=o.x,y=o.y;
    if(x<-40||x>W+40||y<-40||y>H+40)continue;
    const gl=Math.sin(S.t*o.gs*2+o.gp);
    if(o.type==='sat'){
      ctx.save();ctx.translate(x,y);ctx.rotate(o.a+Math.PI/2);ctx.scale(o.scale,o.scale);
      const s=o.size;
      ctx.fillStyle='#8fb0d8';
      ctx.fillRect(-s*2.4,-s*.55,s*1.7,s*1.1);ctx.fillRect(s*.7,-s*.55,s*1.7,s*1.1);
      ctx.fillStyle='#d7e6ff';ctx.fillRect(-s*.6,-s*.8,s*1.2,s*1.6);
      ctx.restore();
      if(Math.sin(S.t*3+o.blink)>.93){ctx.fillStyle='#ff6b6b';ctx.fillRect(x-.7,y-.7,1.4,1.4);}
    }else if(o.type==='rocket'){
      ctx.save();ctx.translate(x,y);ctx.rotate(o.rot);ctx.scale(o.scale,o.scale);
      ctx.fillStyle='#b9c6da';ctx.fillRect(-o.size*1.8,-o.size*.5,o.size*3.6,o.size);
      ctx.fillStyle='#7d8ba0';ctx.fillRect(o.size*1.2,-o.size*.5,o.size*.6,o.size);
      ctx.restore();
    }else{
      ctx.save();ctx.translate(x,y);ctx.rotate(o.rot);ctx.scale(o.size*o.scale,o.size*o.scale);
      const sh=o.sh;
      ctx.beginPath();ctx.moveTo(sh[0][0],sh[0][1]);
      for(let i=1;i<sh.length;i++)ctx.lineTo(sh[i][0],sh[i][1]);
      ctx.closePath();
      ctx.fillStyle=o.type==='fleck'?'#8fa3bd':'#a8b4c4';
      ctx.fill();ctx.restore();
    }
    if(gl>.965){const b=(gl-.965)/.035;drawGlint(x,y,(o.type==='fleck'?7:12)+b*9,b);}
  }
}

function drawParts(){
  for(const p of parts){
    const t=p.l/p.ml;
    if(p.k==='s'){
      ctx.globalAlpha=t;ctx.strokeStyle=p.c;ctx.lineWidth=p.s;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();
    }else if(p.k==='r'){
      ctx.globalAlpha=t*.7;ctx.strokeStyle=p.c+(t*.8).toFixed(2)+')';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(p.x,p.y,lerp(p.r0,p.r1,1-t),0,TAU);ctx.stroke();
    }else{
      ctx.globalAlpha=t;const s=p.s*(1.6-t*.8);
      ctx.drawImage(glintSpr,p.x-s/2,p.y-s/2,s,s);
    }
  }
  ctx.globalAlpha=1;
}

function drawDrone(){
  const d=drone;
  if(d.beamA>0&&d.tgt&&!d.tgt.dead){
    ctx.save();ctx.globalAlpha=d.beamA*.85;
    ctx.strokeStyle='#7fe7ff';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.tgt.x,d.tgt.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(d.tgt.x,d.tgt.y,7+Math.sin(S.t*10)*2,0,TAU);ctx.stroke();
    ctx.restore();
  }
  ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.ang);
  const g=ctx.createRadialGradient(0,0,0,0,0,12);
  g.addColorStop(0,'rgba(120,220,255,0.5)');g.addColorStop(1,'rgba(120,220,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,12,0,TAU);ctx.fill();
  ctx.fillStyle='#dceeff';ctx.strokeStyle='#5fd8ff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,4.5);ctx.lineTo(-2.5,0);ctx.lineTo(-5,-4.5);ctx.closePath();
  ctx.fill();ctx.stroke();
  if(Math.sin(S.t*6)>.6){ctx.fillStyle='#ff5d5d';ctx.beginPath();ctx.arc(-3,0,1.2,0,TAU);ctx.fill();}
  ctx.restore();
}

function drawHover(){
  if(!hoverObj||mouse.x<-999)return;
  const o=hoverObj,x=o.x,y=o.y;
  ctx.save();ctx.translate(x,y);ctx.rotate(S.t*.6);
  ctx.strokeStyle='#ffb454';ctx.lineWidth=1;
  const b=11+Math.sin(S.t*4)*1.5,L=5;
  ctx.beginPath();
  ctx.moveTo(-b,-b+L);ctx.lineTo(-b,-b);ctx.lineTo(-b+L,-b);
  ctx.moveTo(b-L,-b);ctx.lineTo(b,-b);ctx.lineTo(b,-b+L);
  ctx.moveTo(b,b-L);ctx.lineTo(b,b);ctx.lineTo(b-L,b);
  ctx.moveTo(-b+L,b);ctx.lineTo(-b,b);ctx.lineTo(-b,b-L);
  ctx.stroke();ctx.restore();
  const alt=altKm(o.r),vel=Math.sqrt(398600/(6371+alt));
  const l1=o.name+(o.captured?'  · CAPTURE IN PROGRESS':'');
  const l2=TYPELBL[o.type]+' · ALT '+alt+' KM · VEL '+vel.toFixed(2)+' KM/S';
  ctx.font='10px '+MONO;
  const w=Math.max(ctx.measureText(l1).width,ctx.measureText(l2).width)+16;
  let lx=clamp(x+26,8,W-w-8),ly=clamp(y-42,8,H-44);
  ctx.fillStyle='rgba(6,12,24,0.88)';ctx.fillRect(lx,ly,w,32);
  ctx.strokeStyle='rgba(255,180,84,0.6)';ctx.strokeRect(lx+.5,ly+.5,w-1,31);
  ctx.fillStyle='#ffb454';ctx.fillText(l1,lx+8,ly+13);
  ctx.fillStyle='#c8d8f0';ctx.fillText(l2,lx+8,ly+25);
}

function render(dt){
  mouse.cx=lerp(mouse.cx,mouse.px,clamp(dt*3,0,1));
  mouse.cy=lerp(mouse.cy,mouse.py,clamp(dt*3,0,1));
  S.shake=Math.max(0,S.shake-dt*7);
  const shx=(Math.random()*2-1)*S.shake,shy=(Math.random()*2-1)*S.shake;
  ctx.drawImage(starCv,-30+mouse.cx*-10+shx*.3,-30+mouse.cy*-7+shy*.3,W+60,H+60);
  ctx.save();ctx.translate(mouse.cx*-10+shx*.3,mouse.cy*-7+shy*.3);drawTwinks();ctx.restore();
  ctx.save();ctx.translate(shx,shy);
  drawOrbits();drawEarth();drawObjs();drawParts();drawDrone();drawHover();
  ctx.restore();
}

/* ---------- HUD ---------- */
const $=id=>document.getElementById(id);
const elTrk=$('vTrk'),elSat=$('vSat'),elDeb=$('vDeb'),elCol=$('vCol'),elPic=$('vPic'),
      elClk=$('vClk'),elBar=$('vBar'),elDT=$('droneTxt'),chip=$('droneChip'),
      logEl=$('log'),pausedEl=$('paused');

function setV(el,v){v=String(v);if(el.textContent!==v){el.textContent=v;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}}
function log(kind,msg){
  const d=document.createElement('div');d.className='ln '+kind;
  d.innerHTML='<span>T+'+fmt(S.clock)+'</span>'+msg;
  logEl.prepend(d);
  while(logEl.children.length>6)logEl.lastChild.remove();
}
function hudTick(){
  let sats=0,deb=0;
  for(const o of objs){if(o.dead)continue;o.type==='sat'?sats++:deb++;}
  const tot=sats+deb;
  setV(elTrk,tot);setV(elSat,sats);setV(elDeb,deb);setV(elCol,S.collisions);setV(elPic,S.pickups);
  elClk.textContent='T+'+fmt(S.clock);
  const sat=clamp(tot/MAXO,0,1);
  elBar.style.width=(sat*100).toFixed(0)+'%';
  elBar.style.background=sat<.55?'#6cf5b2':sat<.8?'#ffb454':'#ff6b6b';
  const st=drone.st;
  elDT.textContent='JANITOR-1 · '+(st==='scan'?'SCANNING':st==='pursue'?(drone.tgt?'PURSUING '+drone.tgt.name:'PURSUING'):'COLLECTING');
  chip.dataset.st=st;
}

/* ---------- input ---------- */

  mouse.x=e.clientX;mouse.y=e.clientY;
  mouse.px=(e.clientX/W-.5)*2;mouse.py=(e.clientY/H-.5)*2;
});
cv.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;

  for(let i=0;i<n;i++){
    objs.push(makeObj(Math.random()<.3?'fleck':'frag',r+rand(-4,4),a+rand(-.03,.03),{wMul:rand(.9,1.12),vr:rand(-10,46)}));
  }
  flash(x,y,24,.4);ring(x,y,3,60,.7,'rgba(255,210,140,');spark(x,y,14,120,['#ffd27a','#ffffff'],.8);
  S.shake=Math.min(6,S.shake+2);
  log('warn','MICROMETEOROID EVENT — +'+n+' FRAGS @ '+altKm(r)+' KM');
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();S.paused=!S.paused;pausedEl.classList.toggle('on',S.paused);}
  else if(e.key==='h'||e.key==='H')document.body.classList.toggle('nohud');
});
window.addEventListener('resize',resize);

/* ---------- main loop ---------- */
let last=performance.now(),acc=1;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>.05)dt=.05;
  if(!S.paused)update(dt);
  render(dt);
  acc+=dt;
  if(acc>.25){acc=0;hudTick();}
}

resize();
buildSprites();
populate();
drone.x=E.x+Math.cos(-.9)*rMin*2.2;
drone.y=E.y+Math.sin(-.9)*rMin*2.2;
drone.ang=-.9+Math.PI/2;
log('ok','TRACKING NETWORK ONLINE — '+objs.length+' OBJECTS');
setTimeout(()=>log('info','JANITOR-1 DEPLOYED — DEBRIS SWEEP ACTIVE'),900);
setTimeout(()=>log('info','RADAR SWEEP NOMINAL · LEO SECTOR 7G'),1800);
hudTick();
requestAnimationFrame(frame);
})();
</script>
</body>
