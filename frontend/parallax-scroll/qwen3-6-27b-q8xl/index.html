<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Depth</title>
    <style>
        :root {
            --sky-top: #0f172a;
            --sky-bottom: #1e293b;
            --mountain-back: #1e1b4b;
            --mountain-mid: #312e81;
            --mountain-front: #4338ca;
            --mountain-snow: #e0e7ff;
            --text-main: #f8fafc;
            --accent: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--sky-top);
            color: var(--text-main);
            overflow-x: hidden;
            /* Height allows for the scroll journey */
            height: 400vh; 
        }

        /* --- Fixed Viewport Container --- */
        .viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* --- Background Gradient --- */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            z-index: 0;
        }

        /* --- Parallax Layers --- */
        .layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            will-change: transform;
        }

        /* CSS Shapes for Mountains */
        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
            opacity: 0.9;
        }

        /* Back Layer */
        .layer-back {
            z-index: 1;
        }
        .m-back-1 {
            border-width: 0 15vw 50vh 15vw;
            border-color: transparent transparent var(--mountain-back) transparent;
            margin-left: -20vw;
            margin-bottom: -5vh;
        }
        .m-back-2 {
            border-width: 0 20vw 60vh 10vw;
            border-color: transparent transparent var(--mountain-back) transparent;
            margin-left: 30vw;
            margin-bottom: -10vh;
        }

        /* Mid Layer */
        .layer-mid {
            z-index: 2;
        }
        .m-mid-1 {
            border-width: 0 18vw 70vh 18vw;
            border-color: transparent transparent var(--mountain-mid) transparent;
            margin-left: -10vw;
            margin-bottom: -15vh;
        }
        .m-mid-2 {
            border-width: 0 25vw 80vh 25vw;
            border-color: transparent transparent var(--mountain-mid) transparent;
            margin-left: 15vw;
            margin-bottom: -20vh;
        }

        /* Front Layer */
        .layer-front {
            z-index: 3;
        }
        .m-front-1 {
            border-width: 0 30vw 100vh 30vw;
            border-color: transparent transparent var(--mountain-front) transparent;
            margin-left: -15vw;
            margin-bottom: -40vh;
        }
        .m-front-2 {
            border-width: 0 40vw 110vh 40vw;
            border-color: transparent transparent var(--mountain-front) transparent;
            margin-left: 20vw;
            margin-bottom: -50vh;
        }

        /* --- Content Overlay --- */
        .content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            pointer-events: none; /* Let clicks pass through to nothing, interactive elements will re-enable */
        }

        .headline {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.1s linear, opacity 0.1s linear;
            will-change: transform, opacity;
        }

        .subhead {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 300;
            max-width: 600px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 3rem;
            transition: transform 0.1s linear, opacity 0.1s linear;
            will-change: transform, opacity;
        }

        .cta-container {
            margin-top: 2rem;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
        }

        .cta-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: var(--text-main);
            color: var(--sky-top);
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .cta-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        /* --- Stars (Atmosphere) --- */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
        }

    </style>
</head>
<body>

    <div class="viewport">
        <div class="sky"></div>
        <div class="stars"></div>

        <!-- Parallax Scene -->
        <div class="layer layer-back">
            <div class="mountain m-back-1"></div>
            <div class="mountain m-back-2"></div>
        </div>
        
        <div class="layer layer-mid">
            <div class="mountain m-mid-1"></div>
            <div class="mountain m-mid-2"></div>
        </div>

        <div class="layer layer-front">
            <div class="mountain m-front-1"></div>
            <div class="mountain m-front-2"></div>
        </div>

        <!-- Content -->
        <div class="content-container">
            <h1 class="headline">Ascend Beyond<br>The Ordinary</h1>
            <p class="subhead">Experience depth, clarity, and the power of elevation in a digital landscape designed to inspire.</p>
            
            <div class="cta-container">
                <button class="cta-btn">Start the Journey</button>
            </div>
        </div>
    </div>

    <script>
        // Smooth Parallax Logic
        document.addEventListener('DOMContentLoaded', () => {
            const layers = {
                back: document.querySelector('.layer-back'),
                mid: document.querySelector('.layer-mid'),
                front: document.querySelector('.layer-front')
            };
            
            const headline = document.querySelector('.headline');
            const subhead = document.querySelector('.subhead');
            const cta = document.querySelector('.cta-container');
            const stars = document.querySelector('.stars');

            // Configuration for movement speeds (depth factor)
            // Negative values move up as we scroll down (standard parallax)
            const speeds = {
                stars: 0.1,
                back: 0.2,
                mid: 0.4,
                front: 0.6,
                text: 0.3
            };

            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY;
                
                // 1. Move Layers
                // We use translate3d for hardware acceleration
                layers.back.style.transform = `translate3d(0, ${scrollY * speeds.back}px, 0)`;
                layers.mid.style.transform = `translate3d(0, ${scrollY * speeds.mid}px, 0)`;
                layers.front.style.transform = `translate3d(0, ${scrollY * speeds.front}px, 0)`;
                stars.style.transform = `translate3d(0, ${scrollY * speeds.stars}px, 0)`;

                // 2. Handle Text "Pin" and Fade
                // The text moves up slower than the scroll (simulating pinning)
                // and fades out as the mountains rise up to cover it.
                
                // Calculate opacity based on scroll (fade out over first 500px)
                let textOpacity = 1 - (scrollY / 500);
                textOpacity = Math.max(0, Math.min(1, textOpacity));

                // Calculate transform for text (moves up slower than scroll)
                const textY = scrollY * speeds.text;

                headline.style.transform = `translate3d(0, ${textY}px, 0)`;
                headline.style.opacity = textOpacity;

                subhead.style.transform = `translate3d(0, ${textY + 20}px, 0)`; // Slight offset for stagger
                subhead.style.opacity = textOpacity;

                // 3. CTA Reveal
                // The CTA appears when we scroll past a certain point (e.g., 400px)
                // and stays visible while the mountains move.
                if (scrollY > 350) {
                    // Calculate a delay so it doesn't pop in instantly
                    const ctaProgress = (scrollY - 350) / 300;
                    if (ctaProgress >= 1) {
                        cta.style.opacity = '1';
                        cta.style.transform = 'translateY(0)';
                    } else {
                        cta.style.opacity = ctaProgress;
                        cta.style.transform = `translateY(${50 - (50 * ctaProgress)}px)`;
                    }
                } else {
                    cta.style.opacity = '0';
                    cta.style.transform = 'translateY(50px)';
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
