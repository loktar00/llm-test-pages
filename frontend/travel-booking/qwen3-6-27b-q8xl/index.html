<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Search Results</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f0f2f5;
    --card-bg:#fff;
    --text-primary:#1a1a2e;
    --text-secondary:#6b7280;
    --accent:#6366f1;
    --accent-light:#a5b4fc;
    --heart-red:#ef4444;
    --star-gold:#f59e0b;
    --radius:16px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
    --shadow-hover:0 4px 12px rgba(0,0,0,.12),0 12px 28px rgba(0,0,0,.1);
    --transition:0.3s cubic-bezier(.4,0,.2,1);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--text-primary);
    line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* Header */
  .header{
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a78bfa 100%);
    padding:28px 24px 20px;
    position:sticky;top:0;z-index:100;
    box-shadow:0 4px 20px rgba(99,102,241,.3);
  }
  .header h1{
    color:#fff;font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:16px;
  }
  .search-bar{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(12px);
    border-radius:12px;padding:10px 16px;
    border:1px solid rgba(255,255,255,.2);
  }
  .search-bar svg{flex-shrink:0;opacity:.8}
  .search-bar input{
    flex:1;background:none;border:none;outline:none;
    color:#fff;font-size:15px;
  }
  .search-bar input::placeholder{color:rgba(255,255,255,.6)}

  /* Chips Bar */
  .chips-bar{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:16px 24px 8px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    position:sticky;top:0;z-index:90;
  }
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 14px;
    background:#f3f4f6;
    border:1px solid #e5e7eb;
    border-radius:100px;
    font-size:13px;font-weight:500;
    color:var(--text-primary);
    cursor:pointer;
    transition:var(--transition);
    user-select:none;
    position:relative;
  }
  .chip:hover{background:#e5e7eb;border-color:#d1d5db}
  .chip.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }
  .chip .chip-remove{
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.12);font-size:10px;line-height:1;
    margin-left:2px;transition:var(--transition);
  }
  .chip:hover .chip-remove{background:rgba(0,0,0,.25)}
  .chip-edit{
    border-style:dashed;border-color:var(--accent-light);color:var(--accent);
    background:rgba(99,102,241,.06);
  }
  .chip-edit:hover{background:rgba(99,102,241,.12)}
  .chip input{
    background:none;border:none;outline:none;font-size:13px;
    font-weight:500;color:var(--text-primary);width:80px;
    font-family:inherit;
  }

  /* Controls Row */
  .controls{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px 4px;
  }
  .results-count{font-size:14px;color:var(--text-secondary);font-weight:500}
  .results-count strong{color:var(--text-primary)}
  .sort-wrapper{position:relative}
  .sort-btn{
    display:flex;align-items:center;gap:8px;
    padding:8px 16px;
    background:#fff;border:1px solid #e5e7eb;
    border-radius:10px;font-size:13px;font-weight:600;
    color:var(--text-primary);cursor:pointer;
    transition:var(--transition);
    font-family:inherit;
  }
  .sort-btn:hover{border-color:#d1d5db;background:#f9fafb}
  .sort-btn svg{transition:transform .2s ease}
  .sort-btn.open svg{transform:rotate(180deg)}
  .sort-dropdown{
    position:absolute;top:calc(100% + 6px);right:0;
    background:#fff;border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    border:1px solid #e5e7eb;
    min-width:200px;
    opacity:0;visibility:hidden;
    transform:translateY(-8px);
    transition:all .2s ease;
    z-index:80;overflow:hidden;
  }
  .sort-dropdown.show{opacity:1;visibility:visible;transform:translateY(0)}
  .sort-option{
    padding:10px 16px;font-size:13px;font-weight:500;
    cursor:pointer;transition:background .15s;
    display:flex;align-items:center;gap:8px;
  }
  .sort-option:hover{background:#f3f4f6}
  .sort-option.active{color:var(--accent);background:rgba(99,102,241,.06)}
  .sort-option.active::before{content:'✓';font-weight:700}

  /* Cards Grid */
  .cards-container{
    padding:16px 24px 40px;
    display:flex;flex-direction:column;gap:20px;
  }
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
  }

  /* Card */
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform var(--transition),box-shadow var(--transition),opacity .3s ease;
    will-change:transform;
    cursor:pointer;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow-hover);
  }
  .card-image{
    position:relative;height:200px;overflow:hidden;
  }
  .card-gradient{
    width:100%;height:100%;
    transition:transform .6s cubic-bezier(.4,0,.2,1);
  }
  .card:hover .card-gradient{transform:scale(1.05)}
  .card-badge{
    position:absolute;top:12px;left:12px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    color:#fff;
    padding:5px 12px;
    border-radius:100px;
    font-size:13px;font-weight:700;
    letter-spacing:.3px;
    border:1px solid rgba(255,255,255,.15);
  }
  .card-badge span{font-weight:400;font-size:11px;opacity:.8}
  .card-heart{
    position:absolute;top:12px;right:12px;
    width:38px;height:38px;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .2s ease,background .2s ease;
    border:none;
    z-index:2;
  }
  .card-heart:hover{transform:scale(1.1);background:#fff}
  .card-heart:active{transform:scale(.95)}
  .card-heart svg{
    width:20px;height:20px;
    transition:all .2s ease;
    fill:none;stroke:#6b7280;stroke-width:2;
  }
  .card-heart.saved svg{
    fill:var(--heart-red);stroke:var(--heart-red);
  }
  .card-heart.pop{animation:heartPop .45s cubic-bezier(.17,.67,.35,1.5)}
  @keyframes heartPop{
    0%{transform:scale(1)}
    30%{transform:scale(1.35)}
    60%{transform:scale(.9)}
    100%{transform:scale(1)}
  }
  .card-body{padding:16px 18px 18px}
  .card-location{
    font-size:12px;font-weight:600;
    color:var(--accent);
    text-transform:uppercase;letter-spacing:.5px;
    margin-bottom:4px;
  }
  .card-title{
    font-size:18px;font-weight:700;
    color:var(--text-primary);
    margin-bottom:6px;
    letter-spacing:-.2px;
  }
  .card-rating{
    display:flex;align-items:center;gap:6px;
    margin-bottom:12px;
  }
  .stars{display:flex;gap:1px}
  .star{
    width:14px;height:14px;
    fill:var(--star-gold);
  }
  .star.empty{fill:#d1d5db}
  .star.half{
    fill:url(#halfStar);
  }
  .rating-text{font-size:13px;color:var(--text-secondary);font-weight:500}
  .card-amenities{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-bottom:14px;
  }
  .amenity{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 10px;
    background:#f3f4f6;
    border-radius:8px;
    font-size:11px;font-weight:500;
    color:var(--text-secondary);
  }
  .amenity svg{width:12px;height:12px;opacity:.7}
  .card-footer{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:12px;
    border-top:1px solid #f3f4f6;
  }
  .card-price{font-size:13px;color:var(--text-secondary)}
  .card-price strong{
    font-size:22px;font-weight:800;
    color:var(--text-primary);
    letter-spacing:-.5px;
  }
  .card-cta{
    padding:8px 20px;
    background:var(--accent);
    color:#fff;border:none;
    border-radius:10px;
    font-size:13px;font-weight:600;
    cursor:pointer;
    transition:var(--transition);
    font-family:inherit;
  }
  .card-cta:hover{background:#4f46e5;transform:translateY(-1px)}
  .card-cta:active{transform:translateY(0)}

  /* Reflow animation */
  .card.reflowing{
    transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .3s ease;
  }

  /* Responsive */
  @media(max-width:680px){
    .cards-grid{grid-template-columns:1fr}
    .header,.chips-bar,.controls,.cards-container{padding-left:16px;padding-right:16px}
  }

  /* Scrollbar */
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
</style>
</head>
<body>

<!-- SVG Defs -->
<svg style="position:absolute;width:0;height:0">
  <defs>
    <linearGradient id="halfStar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
</svg>

<!-- Header -->
<div class="header">
  <h1>✈️ Discover Your Next Getaway</h1>
  <div class="search-bar">
    <svg width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="Where do you want to go?" value="Tropical Destinations">
    <svg width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
  </div>
</div>

<!-- Chips -->
<div class="chips-bar" id="chipsBar">
  <div class="chip active" data-chip="beach">🏖️ Beach</div>
  <div class="chip active" data-chip="tropical">🌴 Tropical</div>
  <div class="chip" data-chip="luxury">💎 Luxury</div>
  <div class="chip" data-chip="adventure">🧗 Adventure</div>
  <div class="chip" data-chip="romantic">💕 Romantic</div>
  <div class="chip chip-edit" id="addChip">+ Add</div>
</div>

<!-- Controls -->
<div class="controls">
  <div class="results-count"><strong id="resultCount">8</strong> destinations found</div>
  <div class="sort-wrapper">
    <button class="sort-btn" id="sortBtn">
      Sort by: <span id="sortLabel">Recommended</span>
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="sort-dropdown" id="sortDropdown">
      <div class="sort-option active" data-sort="recommended">Recommended</div>
      <div class="sort-option" data-sort="price-low">Price: Low to High</div>
      <div class="sort-option" data-sort="price-high">Price: High to Low</div>
      <div class="sort-option" data-sort="rating">Highest Rated</div>
      <div class="sort-option" data-sort="name">Name A–Z</div>
    </div>
  </div>
</div>

<!-- Cards -->
<div class="cards-container">
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<script>
const destinations = [
  {
    id: 1, name: "Bali Paradise Resort", location: "Ubud, Bali",
    price: 189, rating: 4.7, reviews: 342,
    amenities: ["wifi","pool","spa","breakfast"],
    gradient: "linear-gradient(135deg, #0f766e 0%, #0d9488 25%, #14b8a6 50%, #5eead4 75%, #ccfbf1 100%)",
    gradientOverlay: "radial-gradient(ellipse at 30% 80%, rgba(255,255,255,.15) 0%, transparent 60%)"
  },
  {
    id: 2, name: "Santorini Cliff Suites", location: "Oia, Greece",
    price: 345, rating: 4.9, reviews: 518,
    amenities: ["wifi","pool","view","breakfast"],
    gradient: "linear-gradient(135deg, #1e3a5f 0%, #2563eb 30%, #60a5fa 60%, #bfdbfe 85%, #eff6ff 100%)",
    gradientOverlay: "radial-gradient(ellipse at 70% 20%, rgba(255,255,255,.2) 0%, transparent 50%)"
  },
  {
    id: 3, name: "Maldives Overwater Villa", location: "Malé, Maldives",
    price: 520, rating: 5.0, reviews: 203,
    amenities: ["wifi","pool","spa","breakfast","view"],
    gradient: "linear-gradient(135deg, #0c4a6e 0%, #0284c7 25%, #38bdf8 50%, #7dd3fc 70%, #e0f2fe 100%)",
    gradientOverlay: "radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.12) 0%, transparent 55%)"
  },
  {
    id: 4, name: "Kyoto Garden Ryokan", location: "Kyoto, Japan",
    price: 156, rating: 4.6, reviews: 467,
    amenities: ["wifi","spa","breakfast"],
    gradient: "linear-gradient(135deg, #7c2d12 0%, #b45309 25%, #d97706 50%, #fbbf24 75%, #fef3c7 100%)",
    gradientOverlay: "radial-gradient(ellipse at 20% 90%, rgba(255,200,100,.2) 0%, transparent 50%)"
  },
  {
    id: 5, name: "Amalfi Coast Retreat", location: "Positano, Italy",
    price: 278, rating: 4.8, reviews: 389,
    amenities: ["wifi","pool","view","breakfast"],
    gradient: "linear-gradient(135deg, #7c3aed 0%, #a78bfa 25%, #c4b5fd 50%, #ddd6fe 75%, #f5f3ff 100%)",
    gradientOverlay: "radial-gradient(ellipse at 80% 30%, rgba(255,255,255,.18) 0%, transparent 50%)"
  },
  {
    id: 6, name: "Tulum Jungle Eco-Lodge", location: "Tulum, Mexico",
    price: 134, rating: 4.4, reviews: 276,
    amenities: ["wifi","pool","breakfast"],
    gradient: "linear-gradient(135deg, #14532d 0%, #16a34a 25%, #4ade80 50%, #86efac 75%, #dcfce7 100%)",
    gradientOverlay: "radial-gradient(ellipse at 40% 70%, rgba(255,255,255,.1) 0%, transparent 55%)"
  },
  {
    id: 7, name: "Seychelles Beach House", location: "Mahé, Seychelles",
    price: 412, rating: 4.9, reviews: 156,
    amenities: ["wifi","pool","spa","view","breakfast"],
    gradient: "linear-gradient(135deg, #0e7490 0%, #06b6d4 25%, #22d3ee 50%, #67e8f9 70%, #cffafe 100%)",
    gradientOverlay: "radial-gradient(ellipse at 60% 40%, rgba(255,255,255,.15) 0%, transparent 50%)"
  },
  {
    id: 8, name: "Capri Villa Esperanza", location: "Capri, Italy",
    price: 298, rating: 4.5, reviews: 198,
    amenities: ["wifi","pool","view"],
    gradient: "linear-gradient(135deg, #92400e 0%, #d97706 25%, #f59e0b 50%, #fcd34d 75%, #fefce8 100%)",
    gradientOverlay: "radial-gradient(ellipse at 25% 50%, rgba(255,255,255,.12) 0%, transparent 55%)"
  }
];

const amenityIcons = {
  wifi: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>`,
  pool: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20c2-1 4-1 6 0s4 1 6 0 4-1 6 0"/><path d="M2 16c2-1 4-1 6 0s4 1 6 0 4-1 6 0"/><path d="M12 4v4"/><circle cx="12" cy="10" r="2"/></svg>`,
  spa: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c-4-3-8-6-8-10a4 4 0 0 1 8 0 4 4 0 0 1 8 0c0 4-4 7-8 10z"/><circle cx="12" cy="12" r="3"/></svg>`,
  breakfast: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="4"/><path d="M12 8v8"/><path d="M2 12c0 2.2 4.5 4 10 4s10-1.8 10-4"/></svg>`,
  view: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
};

const amenityLabels = {
  wifi:"Wi-Fi", pool:"Pool", spa:"Spa", breakfast:"Breakfast", view:"View"
};

let savedIds = new Set(JSON.parse(localStorage.getItem('savedHotels') || '[]'));
let currentSort = 'recommended';
let chips = ['beach','tropical'];

function renderStars(rating) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    if (i <= Math.floor(rating)) {
      html += `<svg class="star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    } else if (i - rating < 1 && i - rating > 0) {
      html += `<svg class="star half" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    } else {
      html += `<svg class="star empty" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    }
  }
  return html;
}

function renderCard(d) {
  const isSaved = savedIds.has(d.id);
  return `
    <div class="card" data-id="${d.id}" data-price="${d.price}" data-rating="${d.rating}" data-name="${d.name}">
      <div class="card-image">
        <div class="card-gradient" style="background:${d.gradient}"></div>
        <div class="card-gradient" style="background:${d.gradientOverlay};position:absolute;top:0;left:0;width:100%;height:100%"></div>
        <div class="card-badge">$${d.price} <span>/ night</span></div>
        <button class="card-heart ${isSaved ? 'saved' : ''}" data-id="${d.id}" aria-label="Save">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
      <div class="card-body">
        <div class="card-location">${d.location}</div>
        <div class="card-title">${d.name}</div>
        <div class="card-rating">
          <div class="stars">${renderStars(d.rating)}</div>
          <span class="rating-text">${d.rating} (${d.reviews} reviews)</span>
        </div>
        <div class="card-amenities">
          ${d.amenities.map(a => `<span class="amenity">${amenityIcons[a]} ${amenityLabels[a]}</span>`).join('')}
        </div>
        <div class="card-footer">
          <div class="card-price"><strong>$${d.price}</strong> / night</div>
          <button class="card-cta">Book Now</button>
        </div>
      </div>
    </div>
  `;
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  let sorted = [...destinations];

  switch(currentSort) {
    case 'price-low': sorted.sort((a,b) => a.price - b.price); break;
    case 'price-high': sorted.sort((a,b) => b.price - a.price); break;
    case 'rating': sorted.sort((a,b) => b.rating - a.rating); break;
    case 'name': sorted.sort((a,b) => a.name.localeCompare(b.name)); break;
  }

  grid.innerHTML = sorted.map(renderCard).join('');
  document.getElementById('resultCount').textContent = sorted.length;

  // Re-attach heart listeners
  grid.querySelectorAll('.card-heart').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      toggleSave(id, btn);
    });
  });
}

function toggleSave(id, btn) {
  if (savedIds.has(id)) {
    savedIds.delete(id);
    btn.classList.remove('saved');
  } else {
    savedIds.add(id);
    btn.classList.add('saved');
  }
  btn.classList.remove('pop');
  void btn.offsetWidth; // force reflow
  btn.classList.add('pop');
  localStorage.setItem('savedHotels', JSON.stringify([...savedIds]));
}

// Sort dropdown
const sortBtn = document.getElementById('sortBtn');
const sortDropdown = document.getElementById('sortDropdown');
const sortLabel = document.getElementById('sortLabel');

sortBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = sortDropdown.classList.contains('show');
  sortDropdown.classList.toggle('show');
  sortBtn.classList.toggle('open');
});

document.addEventListener('click', () => {
  sortDropdown.classList.remove('show');
  sortBtn.classList.remove('open');
});

sortDropdown.addEventListener('click', (e) => {
  const option = e.target.closest('.sort-option');
  if (!option) return;
  e.stopPropagation();
  currentSort = option.dataset.sort;
  sortLabel.textContent = option.textContent;
  document.querySelectorAll('.sort-option').forEach(o => o.classList.remove('active'));
  option.classList.add('active');
  sortDropdown.classList.remove('show');
  sortBtn.classList.remove('open');
  animateReflow();
});

function animateReflow() {
  const grid = document.getElementById('cardsGrid');
  const cards = [...grid.querySelectorAll('.card')];

  // Get current positions
  const oldPositions = new Map();
  cards.forEach(card => {
    const rect = card.getBoundingClientRect();
    oldPositions.set(card.dataset.id, { top: rect.top, left: rect.left });
  });

  // Re-render
  renderCards();

  // Animate to new positions
  const newCards = [...grid.querySelectorAll('.card')];
  newCards.forEach(card => {
    const oldPos = oldPositions.get(card.dataset.id);
    if (oldPos) {
      const rect = card.getBoundingClientRect();
      const dx = oldPos.left - rect.left;
      const dy = oldPos.top - rect.top;
      card.style.transform = `translate(${dx}px, ${dy}px)`;
      card.style.opacity = '0';
      card.classList.add('reflowing');

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.style.transform = '';
          card.style.opacity = '1';
          setTimeout(() => {
            card.classList.remove('reflowing');
            card.style.transform = '';
            card.style.opacity = '';
          }, 450);
        });
      });
    }
  });
}

// Chips
const chipsBar = document.getElementById('chipsBar');
const addChip = document.getElementById('addChip');

chipsBar.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip || chip === addChip) return;

  if (e.target.closest('.chip-remove')) return;

  const chipData = chip.dataset.chip;
  if (!chipData) return;

  if (chip.classList.contains('active')) {
    chip.classList.remove('active');
    chips = chips.filter(c => c !== chipData);
  } else {
    chip.classList.add('active');
    chips.push(chipData);
  }
});

addChip.addEventListener('click', () => {
  const name = prompt('Enter filter name:');
  if (!name || !name.trim()) return;
  const id = name.trim().toLowerCase().replace(/\s+/g, '-');

  // Remove existing add chip
  addChip.remove();

  const newChip = document.createElement('div');
  newChip.className = 'chip active';
  newChip.dataset.chip = id;
  newChip.innerHTML = `${name.trim()}<span class="chip-remove">×</span>`;

  chipsBar.insertBefore(newChip, addChip);
  chips.push(id);

  // Re-add the add chip
  const newAdd = document.createElement('div');
  newAdd.className = 'chip chip-edit';
  newAdd.id = 'addChip';
  newAdd.textContent = '+ Add';
  newAdd.addEventListener('click', arguments.callee);
  chipsBar.appendChild(newAdd);
});

// Remove chip on × click
chipsBar.addEventListener('click', (e) => {
  const removeBtn = e.target.closest('.chip-remove');
  if (removeBtn) {
    const chip = removeBtn.closest('.chip');
    const chipData = chip.dataset.chip;
    chip.remove();
    chips = chips.filter(c => c !== chipData);
  }
});

// Initial render
renderCards();
</script>
</body>
