<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Wasteland Survival</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #gameCanvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        /* --- Vector Math Helpers --- */
        class Vec2 {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vec2(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vec2(this.x - v.x, this.y - v.y); }
            mul(s) { return new Vec2(this.x * s, this.y * s); }
            mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
            norm() { const m = this.mag(); return m === 0 ? new Vec2(0, 0) : new Vec2(this.x / m, this.y / m); }
            dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
            angle() { return Math.atan2(this.y, this.x); }
            clone() { return new Vec2(this.x, this.y); }
        }

        /* --- Constants --- */
        const WORLD_SIZE = 4000;
        const TILE_SIZE = 50;
        const MAP_COLS = Math.ceil(WORLD_SIZE / TILE_SIZE);
        const MAP_ROWS = Math.ceil(WORLD_SIZE / TILE_SIZE);
        const SURVIVOR_RADIUS = 10;
        const ZOMBIE_RADIUS = 10;
        const WALL_WIDTH = 1; // Grid units
        const MAX_ZOMBIES = 200;
        const REPLENISH_TIME = 30000; // ms
        const MAX_PARTICLES = 300;

        /* --- Global State --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;
        
        // Persistent Damage Layer
        const damageCanvas = document.createElement('canvas');
        const dmgCtx = damageCanvas.getContext('2d');
        
        let camera = { x: 0, y: 0 };
        let map = [];
        let walls = [];
        let particles = [];
        let zombies = [];
        let survivor = null;
        let waypoints = [];
        
        let gameTime = 0;
        let lastTime = 0;
        let frameCount = 0;
        
        let stats = {
            currentKills: 0,
            startTime: Date.now(),
            bestTime: 0,
            bestKills: 0
        };

        /* --- Initialization --- */
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            damageCanvas.width = width;
            damageCanvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function generateMap() {
            // 1. Initialize Grid
            map = new Array(MAP_ROWS).fill(0).map(() => new Array(MAP_COLS).fill(0));
            walls = [];
            
            // 2. Perlin-ish Noise for Terrain
            // Simple value noise
            const noiseScale = 0.003;
            const threshold = 0.5;
            
            // Generate some "forests" of obstacles
            const numObstacles = 60;
            for(let i=0; i<numObstacles; i++) {
                const cx = Math.random() * WORLD_SIZE;
                const cy = Math.random() * WORLD_SIZE;
                const radius = 100 + Math.random() * 300;
                
                // Convert grid coords
                const gx = Math.floor(cx / TILE_SIZE);
                const gy = Math.floor(cy / TILE_SIZE);

                for(let y = -5; y <= 5; y++) {
                    for(let x = -5; x <= 5; x++) {
                        const wx = gx + x;
                        const wy = gy + y;
                        if(wx < 0 || wx >= MAP_COLS || wy < 0 || wy >= MAP_ROWS) continue;

                        const dx = (wx * TILE_SIZE) - cx;
                        const dy = (wy * TILE_SIZE) - cy;
                        if (dx*dx + dy*dy < radius*radius) {
                            map[wy][wx] = 1; // Wall/Tree
                            walls.push({x: wx, y: wy});
                        }
                    }
                }
            }

            // Ensure spawn area is clear
            const spawnX = WORLD_SIZE / 2;
            const spawnY = WORLD_SIZE / 2;
            const safeRadius = 5;
            const sgx = Math.floor(spawnX / TILE_SIZE);
            const sgy = Math.floor(spawnY / TILE_SIZE);
            
            for(let y = -safeRadius; y <= safeRadius; y++) {
                for(let x = -safeRadius; x <= safeRadius; x++) {
                    if(sgx+x >=0 && sgx+x < MAP_COLS && sgy+y >=0 && sgy+y < MAP_ROWS) {
                        map[sgy+y][sgx+x] = 0;
                    }
                }
            }

            // Generate Waypoints (Walkable nodes)
            waypoints = [];
            // Sample random walkable spots
            for(let i=0; i<400; i++) {
                let wx, wy;
                do {
                    wx = Math.floor(Math.random() * MAP_COLS);
                    wy = Math.floor(Math.random() * MAP_ROWS);
                } while(map[wy][wx] !== 0);
                waypoints.push({
                    x: wx * TILE_SIZE + TILE_SIZE/2,
                    y: wy * TILE_SIZE + TILE_SIZE/2
                });
            }
        }

        /* --- Entities --- */
        
        class Survivor {
            constructor() {
                this.pos = new Vec2(WORLD_SIZE/2, WORLD_SIZE/2);
                this.vel = new Vec2(0,0);
                this.angle = 0; // Body angle
                this.aimAngle = 0; // Gun angle
                this.flashAngle = 0; // Flashlight angle
                
                this.speed = 120;
                this.hp = 100;
                this.state = 'PATROL'; // PATROL, INVESTIGATE, COMBAT, STUCK
                this.targetWaypoint = null;
                this.stuckTimer = 0;
                this.lastPos = this.pos.clone();
                this.dead = false;
                
                // Cooldowns
                this.shootCooldown = 0;
                this.investigateTimer = 0;
            }

            update(dt) {
                if (this.dead) return;

                // State Machine
                if (this.state === 'PATROL') {
                    this.patrol(dt);
                } else if (this.state === 'INVESTIGATE') {
                    this.investigate(dt);
                } else if (this.state === 'COMBAT') {
                    this.combat(dt);
                }

                // Movement Physics
                const nextPos = this.pos.add(this.vel.clone().mul(dt));
                
                // Wall Collision (Simple box check)
                let collided = false;
                const checkGrid = (x, y) => {
                    const gx = Math.floor(x / TILE_SIZE);
                    const gy = Math.floor(y / TILE_SIZE);
                    if (gx < 0 || gx >= MAP_COLS || gy < 0 || gy >= MAP_ROWS) return true;
                    return map[gy][gx] === 1;
                };

                // Check corners of bounding box
                if (checkGrid(nextPos.x - SURVIVOR_RADIUS, nextPos.y - SURVIVOR_RADIUS) ||
                    checkGrid(nextPos.x + SURVIVOR_RADIUS, nextPos.y - SURVIVOR_RADIUS) ||
                    checkGrid(nextPos.x - SURVIVOR_RADIUS, nextPos.y + SURVIVOR_RADIUS) ||
                    checkGrid(nextPos.x + SURVIVOR_RADIUS, nextPos.y + SURVIVOR_RADIUS)) {
                    collided = true;
                    this.vel = new Vec2(0,0);
                }

                if (!collided) {
                    this.pos = nextPos;
                    this.stuckTimer = 0;
                } else {
                    // Fallback movement if stuck on wall
                    if(this.targetWaypoint) {
                        const v = this.targetWaypoint.sub(this.pos).norm();
                        this.vel = v.mul(this.speed);
                    }
                }

                // Stuck Detection
                if (this.pos.dist(this.lastPos) < 5) {
                    this.stuckTimer += dt;
                    if (this.stuckTimer > 3.0) {
                        this.pickRandomTarget();
                    }
                } else {
                    this.stuckTimer = 0;
                }
                this.lastPos = this.pos.clone();

                // Aim Logic
                if (this.state === 'COMBAT' && zombies.length > 0) {
                    // Aim nearest zombie
                    let nearest = null;
                    let minDist = Infinity;
                    for (let z of zombies) {
                        const d = this.pos.dist(z.pos);
                        if (d < 200 && d < minDist) {
                            minDist = d;
                            nearest = z;
                        }
                    }
                    if (nearest) {
                        this.aimAngle = Math.atan2(nearest.pos.y - this.pos.y, nearest.pos.x - this.pos.x);
                        this.flashAngle = this.aimAngle;
                    }
                } else {
                    // Look around while walking
                    this.aimAngle = this.angle;
                    // Randomly look away
                    this.flashAngle = this.angle + Math.sin(gameTime * 2) * 0.5;
                }

                // Shooting
                this.shootCooldown -= dt;
                if (this.state === 'COMBAT' && this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = 0.25; // Fire rate
                }

                // Death check
                for (let z of zombies) {
                    if (this.pos.dist(z.pos) < SURVIVOR_RADIUS + ZOMBIE_RADIUS) {
                        this.die();
                    }
                }
            }

            patrol(dt) {
                if (!this.targetWaypoint) this.pickRandomTarget();

                const dir = this.targetWaypoint.sub(this.pos);
                const dist = dir.mag();
                
                // Arrived?
                if (dist < 40) {
                    // Look around randomly
                    if (Math.random() < 0.01) {
                        this.flashAngle = this.angle + (Math.random() - 0.5) * 2;
                    }
                    this.pickRandomTarget();
                } else {
                    const moveDir = dir.norm();
                    this.vel = moveDir.mul(this.speed);
                    this.angle = moveDir.angle();
                    
                    // Check for zombies (Alert)
                    // Raycast to check LOS
                    for(let z of zombies) {
                        if (this.pos.dist(z.pos) < 300) {
                            // Raycast check
                            const hitWall = rayIntersectsWalls(this.pos, z.pos);
                            if (!hitWall) {
                                this.state = 'COMBAT';
                                break;
                            }
                        }
                    }
                }
            }

            investigate(dt) {
                // Simple wander if investigating noise
                this.vel = this.vel.mul(0.9);
                if (this.vel.mag() < 10) {
                    this.state = 'PATROL';
                    this.targetWaypoint = null;
                }
            }

            combat(dt) {
                // Backpedal logic
                if (zombies.length === 0) {
                    this.state = 'PATROL';
                    return;
                }

                // Find closest zombie
                let closestZ = null;
                let minD = 999;
                for(let z of zombies) {
                    const d = this.pos.dist(z.pos);
                    if (d < minD) { minD = d; closestZ = z; }
                }

                if (closestZ) {
                    const dirToZ = closestZ.pos.sub(this.pos);
                    // Aim at zombie
                    this.aimAngle = dirToZ.angle();
                    this.flashAngle = this.aimAngle;

                    // Move away
                    const fleeDir = dirToZ.norm().mul(-1);
                    this.vel = fleeDir.mul(this.speed * 0.8);
                    this.angle = this.vel.angle();

                    // Check LOS
                    if (rayIntersectsWalls(this.pos, closestZ.pos)) {
                        this.state = 'PATROL'; // LOS broken, safe-ish
                    }
                }
            }

            pickRandomTarget() {
                // Pick a waypoint far away
                let best = null;
                let bestDist = 0;
                for(let i=0; i<50; i++) { // Sample subset for performance
                    const wp = waypoints[Math.floor(Math.random() * waypoints.length)];
                    const d = this.pos.dist(wp);
                    if (d > bestDist) {
                        bestDist = d;
                        best = wp;
                    }
                }
                if (best) this.targetWaypoint = best;
            }

            shoot() {
                // Muzzle Flash
                const muzzlePos = this.pos.add(new Vec2(Math.cos(this.aimAngle)*15, Math.sin(this.aimAngle)*15));
                spawnParticles(muzzlePos, {color: '#ffffaa', count: 5, type: 'spark', life: 0.1});

                // Raycast for hit
                // Ray origin: Muzzle
                // Ray dir: Aim
                // Max dist: 300
                
                const rayStart = muzzlePos;
                const rayDir = new Vec2(Math.cos(this.aimAngle), Math.sin(this.aimAngle));
                const rayEnd = rayStart.add(rayDir.mul(400));

                // Check Wall Hits
                if (rayIntersectsWalls(rayStart, rayEnd)) {
                    // Sparks on wall
                    spawnParticles(rayStart.add(rayDir.mul(100)), {color: '#cccccc', count: 8, type: 'dust', life: 0.3});
                    return;
                }

                // Check Zombie Hits
                let hit = false;
                for (let z of zombies) {
                    // Simple line segment vs circle check (Approximated for speed)
                    // Check if zombie is close to line segment
                    const centerToStart = z.pos.sub(rayStart);
                    const projLen = centerToStart.x * rayDir.x + centerToStart.y * rayDir.y;
                    if (projLen > 0) {
                        const closest = rayStart.add(rayDir.mul(projLen));
                        if (closest.dist(z.pos) < ZOMBIE_RADIUS) {
                            // Hit!
                            z.hp -= 35;
                            hit = true;
                            spawnParticles(closest, {color: '#aa0000', count: 10, type: 'blood', life: 1.5});
                            // Add blood to persistent layer
                            dmgCtx.fillStyle = 'rgba(80,0,0,0.6)';
                            dmgCtx.beginPath();
                            dmgCtx.arc(closest.x, closest.y, 15, 0, Math.PI*2);
                            dmgCtx.fill();
                            
                            if (z.hp <= 0) {
                                killZombie(z);
                            }
                            break; // One bullet, one zombie
                        }
                    }
                }
            }

            die() {
                this.dead = true;
                this.hp = 0;
                // Blood explosion
                spawnParticles(this.pos, {color: '#aa0000', count: 50, type: 'blood', life: 3.0});
                dmgCtx.fillStyle = 'rgba(60,0,0,0.8)';
                dmgCtx.beginPath();
                dmgCtx.arc(this.pos.x, this.pos.y, 40, 0, Math.PI*2);
                dmgCtx.fill();
                setTimeout(resetGame, 2000);
            }

            draw(ctx) {
                if (this.dead) return;
                
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                
                // Bobbing
                const bob = Math.sin(gameTime * 10) * 2;
                
                // Body
                ctx.fillStyle = '#445566';
                ctx.beginPath();
                ctx.ellipse(0, 0 + bob, SURVIVOR_RADIUS, SURVIVOR_RADIUS * 0.8, this.angle, 0, Math.PI*2);
                ctx.fill();

                // Arms/Weapon
                ctx.save();
                ctx.rotate(this.aimAngle);
                // Arms
                ctx.fillStyle = '#333';
                ctx.fillRect(0, -2, 15, 4);
                // Gun
                ctx.fillStyle = '#111';
                ctx.fillRect(10, -3, 12, 6);
                ctx.restore();

                // Flashlight
                ctx.save();
                ctx.rotate(this.flashAngle);
                ctx.fillStyle = '#ffeebb';
                ctx.fillRect(10, -5, 8, 10); // Torch body
                ctx.restore();

                ctx.restore();
            }
        }

        class Zombie {
            constructor() {
                // Spawn away from survivor
                let x, y;
                do {
                    x = Math.random() * WORLD_SIZE;
                    y = Math.random() * WORLD_SIZE;
                } while (new Vec2(x,y).dist(survivor.pos) < 400);

                this.pos = new Vec2(x, y);
                this.vel = new Vec2(0, 0);
                this.angle = Math.random() * Math.PI * 2;
                this.hp = 100;
                this.speed = 50 + Math.random() * 30;
            }

            update(dt) {
                if (this.hp <= 0) return;

                // Move Logic
                // 1. Check if Survivor is in FOV (Flashlight)
                // Simple check: Distance and Angle
                const dist = this.pos.dist(survivor.pos);
                
                let inLight = false;
                let blocked = false;

                if (dist < 300) {
                    // Check Raycast
                    blocked = rayIntersectsWalls(this.pos, survivor.pos);
                    
                    // Check light cone intersection visually
                    const angleToSurvivor = Math.atan2(survivor.pos.y - this.pos.y, survivor.pos.x - this.pos.x);
                    let angleDiff = angleToSurvivor - survivor.aimAngle;
                    // Normalize angle
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    
                    if (Math.abs(angleDiff) < 0.6 && !blocked) {
                        inLight = true;
                    }
                }

                // AI State
                if (inLight || dist < 150) {
                    // Chase
                    const dir = survivor.pos.sub(this.pos).norm();
                    this.vel = dir.mul(this.speed);
                    this.angle = dir.angle();
                } else {
                    // Wander / Idle
                    this.vel = this.vel.mul(0.9); // friction
                    if (this.vel.mag() < 10) {
                        this.vel = new Vec2(Math.random()-0.5, Math.random()-0.5).norm().mul(30);
                        this.angle = this.vel.angle();
                    }
                }

                // Move & Collision
                const nextPos = this.pos.add(this.vel.mul(dt));
                const gx = Math.floor(nextPos.x / TILE_SIZE);
                const gy = Math.floor(nextPos.y / TILE_SIZE);

                let wallHit = false;
                if (gx >= 0 && gx < MAP_COLS && gy >= 0 && gy < MAP_ROWS && map[gy][gx] === 1) {
                    wallHit = true;
                    this.vel = this.vel.mul(-0.5); // Bounce
                }

                if (!wallHit) {
                    this.pos = nextPos;
                }

                // Separation from other zombies
                for (let other of zombies) {
                    if (other === this) continue;
                    const d = this.pos.dist(other.pos);
                    if (d < ZOMBIE_RADIUS * 2) {
                        const push = this.pos.sub(other.pos).norm().mul(50 * dt);
                        this.pos = this.pos.add(push);
                    }
                }
            }

            draw(ctx) {
                if (this.hp <= 0) return;
                
                ctx.save();
                ctx.translate(this.pos.x, this.pos.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = '#2e3d2e'; // Dark Green
                ctx.beginPath();
                ctx.arc(0, 0, ZOMBIE_RADIUS, 0, Math.PI*2);
                ctx.fill();

                // Arms
                ctx.fillStyle = '#1a231a';
                ctx.beginPath();
                ctx.arc(5, 5, 4, 0, Math.PI*2);
                ctx.arc(5, -5,
