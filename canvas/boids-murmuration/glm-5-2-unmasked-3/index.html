<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boids Murmuration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let W = 0, H = 0, horizon = 0;
let bgStatic = null;

// Boid parameters - tuned for smoke-like murmuration
const BOID_COUNT = 620;
const SENSE_R = 38;
const SEP_R = 13;
const MAX_SPEED = 2.1;
const MIN_SPEED = 1.35;
const W_ALIGN = 1.25;
const W_COHES = 1.05;
const W_SEP = 1.7;
const W_PRED = 2.6;
const W_EDGE = 1.4;
const PRED_R = 115;
const PRED_RANGE = 175;

// Pre-computed for performance
const SENSE_R2 = SENSE_R * SENSE_R;
const SEP_R2 = SEP_R * SEP_R;
const PRED_R2 = PRED_R * PRED_R;

// Spatial grid for neighbor queries
const CELL = SENSE_R;
let grid = new Map();
function cellKey(x, y) {
  return (((x / CELL) | 0) + 32768) * 65536 + (((y / CELL) | 0) + 32768);
}

// Boids
const boids = [];

function spawnBoid() {
  return {
    x: Math.random() * W,
    y: Math.random() (horizon * 0.6 + H * 0.05),
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2
  };
}

// Predator - moves slowly and invisibly, occasionally splitting the flock
const predator = {
  x: 0, y: 0,
  tx: 0, ty: 0,
  active: false,
  phase: 0,
  nextTarget: 0,
  visible: false,
  visAlpha: 0
};

// Atmospheric particles
const motes = [];
for (let i = 0; i < 40; i++) {
  motes.push({
    x: Math.random() * 2000,
    y: Math.random() * 1500,
    s: 0.04 + Math.random() * 0.11,
    a: 0.06 + Math.random() * 0.18,
    r: 0.3 + Math.random() * 1.0,
    phase: Math.random() * 7
  });
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  horizon = H * 0.62;
  canvas.width = W;
  canvas.height = H;
  buildBackground();

  // Rebuild boids
  boids.length = 0;
  for (let i = 0; i < BOID_COUNT; i++) {
    boids.push({
      x: Math.random() * W,
      y: Math.random() * (horizon * 0.85),
      vx: (Math.random() - 0.5) * MAX_SPEED * 0.9,
      vy: (Math.random() - 0.5) * MAX_SPEED * 0.9
    });
  }

  predator.x = W / 2;
  predator.y = horizon * 0.4;
  predator.tx = W * 0.3 + Math.random() * W * 0.4;
  predator.ty = horizon * 0.3;
  predator.nextTarget = 4000 + Math.random() * 4000;
}

function buildBackground() {
  bgStatic = document.createElement('canvas');
  bgStatic.width = W;
  bgStatic.height = H;
  const bc = bgStatic.getContext('2d');

  // Dusk sky gradient - warm horizon to deep night above
  const sky = bc.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#080820');
  sky.addColorStop(0.18, '#171038');
  sky.addColorStop(0.38, '#3d1e58');
  sky.addColorStop(0.52, '#7a3654');
  sky.addColorStop(0.60, '#b85a48');
  sky.addColorStop(0.625, '#d97935');
  sky.addColorStop(0.655, '#e8a36a');
  sky.addColorStop(0.685, '#9c5a78');
  sky.addColorStop(0.75, '#3c2240');
  sky.addColorStop(0.86, '#1a1326');
  sky.addColorStop(1.00, '#06060f');
  bc.fillStyle = sky;
  bc.fillRect(0, 0, W, H);

  // Sun glow at horizon
  const sunX = W * 0.62, sunY = horizon + 18;
  const glow = bc.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(W, H) * 0.55);
  glow.addColorStop(0, 'rgba(255,210,140,0.55)');
  glow.addColorStop(0.1, 'rgba(255,170,100,0.38)');
  glow.addColorStop(0.3, 'rgba(190,80,70,0.14)');
  glow.addColorStop(0.7, 'rgba(80,40,70,0.03)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  bc.fillStyle = glow;
  bc.fillRect(0, 0, W, H);

  // Distant cloud streaks
  for (let i = 0; i < 7; i++) {
    const cy = horizon - 25 - i * 9 + Math.random() * 8;
    const cx = Math.random() * W;
    const cw = W * (0.4 + Math.random() * 0.6);
    const ch = 2 + Math.random() * 3;
    bc.fillStyle = `rgba(${100 + Math.random() * 50}, ${50 + Math.random() * 30}, ${70 + Math.random() * 30}, ${0.18 + Math.random() * 0.1})`;
    bc.beginPath();
    bc.ellipse(cx, cy, cw, ch, 0, 0, Math.PI * 2);
    bc.fill();
  }

  drawTerrain(bc);
  drawTrees(bc);
  drawStars(bc);

  // Subtle top vignette to frame the sky
  const top = bc.createLinearGradient(0, 0, 0, H * 0.45);
  top.addColorStop(0, 'rgba(2,2,10,0.35)');
  top.addColorStop(1, 'rgba(0,0,0,0)');
  bc.fillStyle = top;
  bc.fillRect(0, 0, W, H * 0.45);
}

function noise1D(x, seed) {
  return Math.sin(x * 12.9898 + seed * 78.233) * 43758.5453;
}
function fract(x) { return x - Math.floor(x); }
function hash(x, seed) { return fract(noise1D(x, seed)); }
function smoothNoise(x, seed) {
  const i = Math.floor(x);
  const f = x - i;
  const u = f * f * (3 - 2 * f);
  const a = hash(i, seed);
  const b = hash(i + 1, seed);
  return a * (1 - u) + b * u;
}
function fbm(x, seed) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < 5; i++) {
    v += smoothNoise(x * f, seed + i) * a;
    a *= 0.5;
    f *= 2.1;
  }
  return v;
}

function drawTerrain(bc) {
  // Three receding ridgelines fading to dusk haze
  const layers = [
    { y: horizon + 2, amp: 6, freq: 0.005, seed: 1.2, color: [26, 16, 38], alpha: 0.95 },
    { y: horizon + 16, amp: 9, freq: 0.009, seed: 3.4, color: [38, 22, 48], alpha: 0.92 },
    { y: horizon + 34, amp: 14, freq: 0.014, seed: 7.8, color: [54, 32, 58], alpha: 0.88 },
    { y: horizon + 58, amp: 22, freq: 0.022, seed: 5.6, color: [70, 42, 62], alpha: 0.85 }
  ];
  for (const L of layers) {
    const [r, g, b] = L.color;
    bc.fillStyle = `rgba(${r},${g},${b},${L.alpha})`;
    bc.beginPath();
    bc.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) {
      const y = L.y + fbm((x + L.seed * 100) * L.freq, L.seed) * L.amp - L.amp * 0.3;
      bc.lineTo(x, y);
    }
    bc.lineTo(W, H);
    bc.closePath();
    bc.fill();
  }
  // Foreground ground silhouette - darkest layer
  bc.fillStyle = '#04060e';
  bc.beginPath();
  bc.moveTo(0, H);
  bc.lineTo(0, horizon + 72);
  for (let x = 0; x <= W; x += 3) {
    const y = horizon + 72 + fbm((x + 200) * 0.03, 11.3) * 8 - 3;
    bc.lineTo(x, y);
  }
  bc.lineTo(W, H);
  bc.closePath();
  bc.fill();
}

    const th = 14 + Math.random() * 38;
    bc.beginPath();
