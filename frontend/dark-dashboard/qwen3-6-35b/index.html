<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Dashboard</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b1120;--surface:#151d2f;--surface2:#1e293b;--surface3:#273549;
    --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
    --accent:#38bdf8;--accent2:#818cf8;--green:#22c55e;--red:#ef4444;
    --radius:12px;--radius-sm:8px;
  }
  html{font-size:14px}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden}

  /* Sidebar */
  .sidebar{width:240px;background:var(--surface);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;padding:20px 0;position:fixed;top:0;left:0;bottom:0;z-index:100}
  .logo{padding:0 24px 28px;display:flex;align-items:center;gap:10px}
  .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-icon svg{width:18px;height:18px;fill:#fff}
  .logo-text{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
  .nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:16px 12px 8px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text2);text-decoration:none;font-size:.9rem;cursor:pointer;transition:all .15s ease;position:relative}
  .nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .nav-item.active{background:rgba(56,189,248,.1);color:var(--accent)}
  .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
  .avatar-sm{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0}
  .user-info{line-height:1.3}
  .user-name{font-size:.8rem;font-weight:600}
  .user-role{font-size:.65rem;color:var(--text3)}

  /* Main */
  .main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}

  /* Header */
  .header{padding:16px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(11,17,32,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
  .header-left h1{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
  .header-left p{font-size:.78rem;color:var(--text3);margin-top:2px}
  .header-right{display:flex;align-items:center;gap:16px}
  .search{position:relative}
  .search input{background:var(--surface2);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);padding:8px 14px 8px 36px;color:var(--text);font-size:.85rem;width:240px;outline:none;transition:border-color .2s}
  .search input::placeholder{color:var(--text3)}
  .search input:focus{border-color:var(--accent)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .header-btn{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--text2)}
  .header-btn:hover{background:var(--surface3);color:var(--text)}
  .header-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#6366f1);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;cursor:pointer}

  /* Content */
  .content{padding:28px 32px;flex:1}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi-card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:20px;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
  .kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .2s}
  .kpi-card:hover::after{opacity:1}
  .kpi-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .kpi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .kpi-icon svg{width:18px;height:18px;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .kpi-icon.blue{background:rgba(56,189,248,.12);stroke:var(--accent)}
  .kpi-icon.purple{background:rgba(129,140,248,.12);stroke:var(--accent2)}
  .kpi-icon.green{background:rgba(34,197,94,.12);stroke:var(--green)}
  .kpi-icon.red{background:rgba(239,68,68,.12);stroke:var(--red)}
  .kpi-label{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .kpi-value{font-size:1.85rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .kpi-footer{display:flex;align-items:center;gap:6px;margin-top:10px}
  .delta{display:inline-flex;align-items:center;gap:2px;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px}
  .delta.up{background:rgba(34,197,94,.12);color:var(--green)}
  .delta.down{background:rgba(239,68,68,.12);color:var(--red)}
  .delta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .kpi-period{font-size:.72rem;color:var(--text3)}

  /* Charts */
  .charts-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  .chart-card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:24px;position:relative}
  .chart-title{font-size:.95rem;font-weight:700;margin-bottom:4px}
  .chart-subtitle{font-size:.75rem;color:var(--text3);margin-bottom:20px}
  .chart-area{position:relative}
  canvas{display:block}
  .tooltip{position:absolute;pointer-events:none;background:var(--surface3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;font-size:.78rem;opacity:0;transition:opacity .12s;z-index:20;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .tooltip.visible{opacity:1}
  .tooltip-label{color:var(--text3);margin-bottom:2px}
  .tooltip-value{font-weight:700;color:var(--text)}
  .donut-legend{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .legend-item{display:flex;align-items:center;gap:10px;font-size:.8rem}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .legend-label{color:var(--text2);flex:1}
  .legend-value{font-weight:700;color:var(--text)}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .kpi-card{animation:fadeInUp .5s ease both}
  .kpi-card:nth-child(2){animation-delay:.06s}
  .kpi-card:nth-child(3){animation-delay:.12s}
  .kpi-card:nth-child(4){animation-delay:.18s}
  .chart-card{animation:fadeInUp .5s ease .24s both}
</style>
</head>

<main class="main">
  <header class="header">
    <div class="header-left">
      <h1>Dashboard</h1>
      <p>Welcome back, Jane — here's what's happening today.</p>
    </div>
    <div class="header-right">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Search anything…">
      </div>
      <div class="header-btn">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

  <div class="content">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-header">
