<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Siege</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; cursor: none; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, GROUND_Y, CASTLE_X, CASTLE_W, WALL_TOP;
const GRAVITY = 0.25;
const GROUND_HEIGHT = 60;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    GROUND_Y = H - GROUND_HEIGHT;
    CASTLE_X = W * 0.55;
    CASTLE_W = W * 0.35;
    WALL_TOP = GROUND_Y - 200;
}
resize();
window.addEventListener('resize', resize);

// Utility
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// Particle system
const particles = [];
class Particle {
    constructor(x, y, vx, vy, life, color, size, type = 'debris') {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.life = this.maxLife = life; this.color = color;
        this.size = size; this.type = type; this.rotation = rand(0, 6.28);
        this.rotSpeed = rand(-0.2, 0.2);
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.type === 'debris' || this.type === 'fire') this.vy += GRAVITY * 0.5;
        if (this.type === 'debris' && this.y > GROUND_Y) {
            this.y = GROUND_Y; this.vy *= -0.3; this.vx *= 0.7;
            if (Math.abs(this.vy) < 0.5) this.life = 0;
        }
        if (this.type === 'fire') { this.vy -= 0.1; }
        if (this.type === 'spark') { this.vy += GRAVITY * 0.3; }
        this.life--;
        this.rotation += this.rotSpeed;
    }
    draw() {
        const alpha = clamp(this.life / this.maxLife, 0, 1);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        if (this.type === 'debris') {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        } else if (this.type === 'spark') {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}

function spawnDebris(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, rand(-3, 3), rand(-5, -1), rand(40, 80),
            color || '#8B7355', rand(3, 8), 'debris'));
    }
}
function spawnFire(x, y, count) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, rand(-1, 1), rand(-2, 0.5), rand(15, 30),
            ['#f80', '#f60', '#ff0', '#fa0'][randInt(0,3)], rand(2, 5), 'fire'));
    }
}
function spawnSpark(x, y) {
    for (let i = 0; i < 5; i++) {
        particles.push(new Particle(x, y, rand(-4, 4), rand(-4, 4), rand(10, 25),
            '#ff4', rand(1, 2), 'spark'));
    }
}

// Sky gradient (stored)
let skyGradient;
function createSky() {
    skyGradient = ctx.createLinearGradient(0, 0, 0, H);
    skyGradient.addColorStop(0, '#0a0a2e');
    skyGradient.addColorStop(0.4, '#1a1a3e');
    skyGradient.addColorStop(0.7, '#2a1a2e');
    skyGradient.addColorStop(0.85, '#4a2a3e');
    skyGradient.addColorStop(1, '#1a0a1e');
}

// Stars
const stars = Array.from({length: 80}, () => ({
    x: rand(0, W), y: rand(0, H * 0.5),
    size: rand(0.5, 2), twinkle: rand(0, 6.28)
}));

// Wall segments
let wallSegments = [];
let wallHealth = 0;
const MAX_WALL_HEALTH = 100;
let wallBreachX = 0;
let wallBreachW = 0;

function initWall() {
    wallSegments = [];
    const segW = 40;
    const totalW = 50;
    wallHealth = MAX_WALL_HEALTH;
    wallBreachW = 0;
    for (let i = 0; i < totalW; i++) {
        wallSegments.push({
            x: CASTLE_X - 10 + i * segW,
            w: segW,
            hp: 100,
            alive: true
        });
    }
}

function drawWall() {
    const aliveSegs = wallSegments.filter(s => s.alive);
    if (aliveSegs.length === 0) return;

    // Wall body
    ctx.fillStyle = '#5a4a3a';
    ctx.fillRect(aliveSegs[0].x, WALL_TOP, aliveSegs[aliveSegs.length-1].x + aliveSegs[aliveSegs.length-1].w - aliveSegs[0].x, GROUND_Y - WALL_TOP);

    // Individual segments
    for (const seg of wallSegments) {
        if (!seg.alive) continue;
        ctx.strokeStyle = '#3a2a1a';
        ctx.lineWidth = 1;
        ctx.strokeRect(seg.x, WALL_TOP, seg.w, GROUND_Y - WALL_TOP);

        // Brick pattern
        ctx.fillStyle = `rgba(90,74,58,${0.3 + (seg.hp/100)*0.3})`;
        const rows = Math.floor((GROUND_Y - WALL_TOP) / 15);
        for (let r = 0; r < rows; r++) {
            const y = WALL_TOP + r * 15;
            const offset = (r % 2) * seg.w / 2;
            for (let c = -1; c < 3; c++) {
                const bx = seg.x + c * seg.w/2 + offset;
                if (bx > seg.x && bx + seg.w/2 < seg.x + seg.w) {
                    ctx.fillStyle = `rgba(120,100,80,${seg.hp/120})`;
                    ctx.fillRect(bx, y, seg.w/2 - 1, 13);
                }
            }
        }

        // Damage cracks
        if (seg.hp < 70) {
            ctx.strokeStyle = `rgba(0,0,0,${0.4*(1-seg.hp/70)})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(seg.x + seg.w * 0.3, WALL_TOP + (GROUND_Y-WALL_TOP)*0.3);
            ctx.lineTo(seg.x + seg.w * 0.6, WALL_TOP + (GROUND_Y-WALL_TOP)*0.6);
            ctx.lineTo(seg.x + seg.w * 0.4, WALL_TOP + (GROUND_Y-WALL_TOP)*0.8);
            ctx.stroke();
        }
        if (seg.hp < 40) {
            ctx.beginPath();
            ctx.moveTo(seg.x + seg.w * 0.7, WALL_TOP + (GROUND_Y-WALL_TOP)*0.2);
            ctx.lineTo(seg.x + seg.w * 0.5, WALL_TOP + (GROUND_Y-WALL_TOP)*0.5);
            ctx.lineTo(seg.x + seg.w * 0.8, WALL_TOP + (GROUND_Y-WALL_TOP)*0.9);
            ctx.stroke();
        }
    }

    // Battlements
    ctx.fillStyle = '#5a4a3a';
    for (let i = 0; i < wallSegments.length; i++) {
        if (!wallSegments[i].alive) continue;
        const x = wallSegments[i].x;
        if (i === 0 || !wallSegments[i-1].alive) {
            ctx.fillRect(x, WALL_TOP - 15, 12, 15);
        }
        if (i === wallSegments.length-1 || !wallSegments[i+1].alive) {
            ctx.fillRect(x + wallSegments[i].w - 12, WALL_TOP - 15, 12, 15);
        }
    }

    // Castles on top
    if (aliveSegs.length > 0) {
        const leftSeg = aliveSegs[0];
        const rightSeg = aliveSegs[aliveSegs.length-1];
        drawCastleTower(leftSeg.x + 15, WALL_TOP - 30, '#4a3a2a');
        drawCastleTower(rightSeg.x + rightSeg.w - 15, WALL_TOP - 30, '#4a3a2a');
    }

    // Flag on left tower
    if (aliveSegs.length > 0) {
        const lx = aliveSegs[0].x + 15;
        ctx.fillStyle = '#c00';
        const flagWave = Math.sin(Date.now() * 0.003) * 3;
        ctx.beginPath();
        ctx.moveTo(lx, WALL_TOP - 55);
        ctx.lineTo(lx + 20 + flagWave, WALL_TOP - 48);
        ctx.lineTo(lx, WALL_TOP - 41);
        ctx.fill();
    }
}

function drawCastleTower(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - 15, y, 30, GROUND_Y - y);
    ctx.fillStyle = '#6a5a4a';
    ctx.fillRect(x - 18, y, 36, 10);
}

// Projectile types
const projectiles = [];
class Arrow {
    constructor(x, y, targetX, targetY, side) {
        this.x = x; this.y = y;
        this.side = side; // 'left' or 'right'
        this.targetX = targetX;
        this.speed = 6;
        const dx = targetX - x;
        const dy = (targetY + rand(-30, 30)) - y;
        const dist = Math.hypot(dx, dy);
        const time = dist / this.speed;
        this.vx = dx / time;
        this.vy = dy / time - 0.5 * GRAVITY * time;
        this.life = time;
        this.active = true;
        this.trail = [];
        this.angle = Math.atan2(this.vy, this.vx);
    }
    update() {
        this.trail.push({x: this.x, y: this.y});
        if (this.trail.length > 8) this.trail.shift();
        this.vy += GRAVITY * 0.3;
        this.x += this.vx;
        this.y += this.vy;
        this.angle = Math.atan2(this.vy, this.vx);
        this.life--;
        if (this.y > GROUND_Y || this.life <= 0 || Math.abs(this.x - CASTLE_X - CASTLE_W/2) > CASTLE_W) {
            this.active = false;
            if (this.y > GROUND_Y) spawnSpark(this.x, GROUND_Y);
        }
    }
    draw() {
        // Trail
        ctx.strokeStyle = 'rgba(255,255,200,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < this.trail.length; i++) {
            const t = this.trail[i];
            ctx[i === 0 ? 'moveTo' : 'lineTo'](t.x, t.y);
        }
        ctx.stroke();

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        // Shaft
        ctx.strokeStyle = this.side === 'left' ? '#da8' : '#da8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(8, 0);
        ctx.stroke();
        // Fletching
        ctx.fillStyle = this.side === 'left' ? '#c44' : '#44c';
        ctx.fillRect(-8, -2, 4, 4);
        // Point
        ctx.fillStyle = '#aaa';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(6, -2);
        ctx.lineTo(6, 2);
        ctx.fill();
        ctx.restore();
    }
}

class Stone {
    constructor(x, y, targetX) {
        this.x = x; this.y = y;
        this.targetX = targetX;
        this.speed = 5;
        const dx = targetX - x;
        const dy = -200;
        const dist = Math.hypot(dx, dy);
        const time = dist / this.speed;
        this.vx = dx / time;
        this.vy = (dy - 0.5 * GRAVITY * time * time) / time;
        this.life = time * 2;
        this.active = true;
        this.angle = 0;
        this.size = rand(6, 10);
    }
    update() {
        this.vy += GRAVITY * 0.4;
        this.x += this.vx;
        this.y += this.vy;
        this.angle += 0.1;
        this.life--;
        if (this.y > GROUND_Y) {
            this.active = false;
            spawnDebris(this.x, GROUND_Y, 8, '#666');
            spawnFire(this.x, GROUND_Y, 3);
            spawnSpark(this.x, GROUND_Y);
            // Damage wall
            for (const seg of wallSegments) {
                if (!seg.alive) continue;
                if (Math.abs(seg.x + seg.w/2 - this.x) < seg.w) {
                    seg.hp -= rand(15, 35);
                    if (seg.hp <= 0) {
                        seg.alive = false;
                        spawnDebris(seg.x + seg.w/2, WALL_TOP, 15);
                    }
                }
            }
            wallHealth = wallSegments.filter(s => s.alive).length / wallSegments.length * MAX_WALL_HEALTH;
        }
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = '#555';
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
    }
}

// Units
const units = [];
class Unit {
    constructor(x, y, type, side) {
        this.x = x; this.y = y;
        this.type = type;
        this.side = side;
        this.hp = 100;
        this.maxHp = 100;
        this.targetX = side === 'left' ? CASTLE_X - 40 : CASTLE_X + CASTLE_W + 40;
        this.moveSpeed = type === 'siege' ? 0.15 : type === 'catapult' ? 0.08 : 0.35;
        this.attackCooldown = 0;
        this.attackRate = type === 'archer' ? 60 : type === 'catapult' ? 120 : 0;
        this.animPhase = rand(0, 6.28);
        this.hitFlash = 0;
        this.dead = false;
        this.walkFrame = 0;
    }
    get color() { return this.side === 'left' ? '#c84' : '#48c'; }
    get darkColor() { return this.side === 'left' ? '#862' : '#268'; }
}

function drawUnit(u) {
    if (u.dead) return;
    const x = u.x, y = u.y;
    const walkBob = Math.sin(u.animPhase) * 2;
    const armSwing = Math.sin(u.animPhase) * 0.3;

    ctx.save();
    ctx.translate(x, y + walkBob);

    if (u.hitFlash > 0) {
        ctx.globalAlpha = 0.5 + Math.sin(u.hitFlash * 0.5) * 0.5;
        u.hitFlash--;
    }

    const scale = u.type === 'siege' ? 1.3 : u.type === 'catapult' ? 1.2 : 1;
    ctx.scale(scale, scale);

    if (u.type === 'archer') {
        drawArcher(x, y - 20, u, armSwing);
    } else if (u.type === 'soldier') {
        drawSoldier(x, y, u, armSwing);
    } else if (u.type === 'siege') {
        drawSiegeTower(x, y, u);
    } else if (u.type === 'catapult') {
        drawCatapult(x, y, u, armSwing);
    }

    // HP bar
    if (u.hp < u.maxHp) {
        ctx.fillStyle = '#400';
        ctx.fillRect(-12, -32, 24, 4);
        ctx.fillStyle = u.side === 'left' ? '#f44' : '#44f';
        ctx.fillRect(-12, -32, 24 * (u.hp / u.maxHp), 4);
    }

    ctx.restore();
}

function drawArcher(x, y, u, armSwing) {
    const dir = u.side === 'left' ? 1 : -1;
    ctx.fillStyle = u.darkColor;
    // Legs
    ctx.fillRect(-4, -10, 3, 10);
    ctx.fillRect(2, -10, 3, 10);
    // Body
    ctx.fillRect(-6, -22, 12, 14);
    // Head
    ctx.beginPath();
    ctx.arc(0, -27, 6, 0, Math.PI * 2);
    ctx.fill();
    // Bow arm
    ctx.save();
    ctx.translate(dir * 6, -20);
    ctx.rotate(-0.5 + armSwing);
    ctx.fillRect(0, -1, dir * 8, 2);
    // Bow
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dir * 10, -8, 10, -1, 1);
    ctx.stroke();
    // Arrow nocked
    if (u.attackCooldown > 40) {
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-5, -8);
        ctx.lineTo(15, -8);
        ctx.stroke();
    }
    ctx.restore();
    // Shield
    if (u.side === 'right') {
        ctx.fillStyle = u.color;
        ctx.fillRect(-8, -20, 4, 10);
    }
}

function drawSoldier(x, y, u, armSwing) {
    const dir = u.side === 'left' ? 1 : -1;
    ctx.fillStyle = u
