<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg: #0f1117;
    --surface: #181a24;
    --surface-hover: #1e2130;
    --card-bg: #1e2130;
    --card-hover: #252840;
    --border: #2a2d3e;
    --text: #e2e4f0;
    --text-secondary: #8b8fa8;
    --text-muted: #5c6078;
    --accent: #6c72ff;
    --accent-glow: rgba(108,114,255,0.15);
    --scrollbar-track: #181a24;
    --scrollbar-thumb: #2a2d3e;
    --scrollbar-thumb-hover: #3d4160;
    --col-backlog: #6c72ff;
    --col-progress: #f59e0b;
    --col-review: #3b82f6;
    --col-done: #10b981;
    --priority-urgent: #ef4444;
    --priority-high: #f97316;
    --priority-medium: #3b82f6;
    --priority-low: #10b981;
    --priority-label: #8b5cf6;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { font-size: 14px; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ��─ Header ��─ */
  .board-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
  }

  .board-header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }

  .board-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .board-title svg {
    width: 24px;
    height: 24px;
    color: var(--accent);
  }

  .board-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--text-secondary);
    font-size: 0.85rem;
  }

  .board-meta .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--col-done);
    display: inline-block;
    animation: dotPulse 2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ��─ Board ��─ */
  .board {
    display: flex;
    gap: 20px;
    padding: 24px 28px;
    height: calc(100vh - 69px);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
  }

  .board::-webkit-scrollbar {
    height: 6px;
  }

  .board::-webkit-scrollbar-track {
    background: var(--scrollbar-track);
    border-radius: 3px;
  }

  .board::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 3px;
    transition: background var(--transition);
  }

  .board::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-thumb-hover);
  }

  /* ��─ Columns ��─ */
  .column {
    flex: 0 0 300px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
    min-width: 280px;
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 14px 4px;
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    padding-top: 4px;
  }

  .column-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .column-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .column-name {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }

  .column-count {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    padding: 2px 8px;
    border-radius: 10px;
    min-width: 24px;
    text-align: center;
    border: 1px solid var(--border);
  }

  .column-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 16px;
    scroll-behavior: smooth;
  }

  .column-body::-webkit-scrollbar {
    width: 5px;
  }

  .column-body::-webkit-scrollbar-track {
    background: transparent;
  }

  .column-body::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 3px;
    transition: background var(--transition);
  }

  .column-body::-webkit-scrollbar-thumb:hover {
    background: var(--scrollbar-thumb-hover);
  }

  /* ��─ Cards ��─ */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: grab;
    transition: transform var(--transition), box-shadow var(--transition), background var(--transition), border-color var(--transition);
    position: relative;
    transform: rotate(0deg) translateY(0);
    will-change: transform;
  }

  .card:hover {
    background: var(--card-hover);
    box-shadow: var(--shadow-lg);
    border-color: rgba(108,114,255,0.2);
    z-index: 5;
  }

  .card:active {
    cursor: grabbing;
  }

  .card-urgent {
    animation: urgentPulse 3s ease-in-out infinite;
  }

  .card-urgent::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: var(--radius);
    padding: 1px;
    background: linear-gradient(135deg, var(--priority-urgent), transparent 50%, var(--priority-urgent));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    animation: urgentBorder 3s ease-in-out infinite;
  }

  @keyframes urgentPulse {
    0%, 100% { transform: rotate(0deg) translateY(0) scale(1); }
    50% { transform: rotate(0deg) translateY(0) scale(1.008); }
  }

  @keyframes urgentBorder {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.6; }
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-id {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 500;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    letter-spacing: 0.02em;
  }

  .card-menu {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    opacity: 0;
    transition: opacity var(--transition);
    cursor: pointer;
    color: var(--text-muted);
  }

  .card:hover .card-menu {
    opacity: 0.7;
  }

  .card-menu:hover {
    opacity: 1 !important;
    background: rgba(255,255,255,0.06);
  }

  .card-title {
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .tag {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tag-urgent { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
  .tag-high { background: rgba(249,115,22,0.15); color: #fdba74; border: 1px solid rgba(249,115,22,0.2); }
  .tag-medium { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.2); }
  .tag-low { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
  .tag-label { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.2); }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-avatars {
    display: flex;
    align-items: center;
  }

  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: #fff;
    border: 2px solid var(--card-bg);
    margin-left: -6px;
    transition: transform var(--transition), z-index 0s;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .avatar:first-child { margin-left: 0; }

  .avatar:hover {
    transform: translateY(-2px);
    z-index: 10;
  }

  .avatar-a { background: linear-gradient(135deg, #6c72ff, #8b5cf6); }
  .avatar-b { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
  .avatar-c { background: linear-gradient(135deg, #f59e0b, #f97316); }
  .avatar-d { background: linear-gradient(135deg, #10b981, #14b8a6); }
  .avatar-e { background: linear-gradient(135deg, #ef4444, #ec4899); }

  .card-due {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 500;
    padding: 3px 8px;
    border-radius: var(--radius-xs);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
  }

  .card-due svg {
    width: 12px;
    height: 12px;
    opacity: 0.6;
  }

  .card-due.overdue {
    color: var(--priority-urgent);
    border-color: rgba(239,68,68,0.25);
    background: rgba(239,68,68,0.06);
  }

  .card-due.soon {
    color: var(--priority-high);
    border-color: rgba(249,115,22,0.2);
    background: rgba(249,115,22,0.06);
  }

  /* ��─ Add Card ��─ */
  .add-card-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }

  .add-card-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .add-card-btn svg {
    width: 16px;
    height: 16px;
    transition: transform var(--transition);
  }

  .add-card-btn:hover svg {
    transform: rotate(90deg);
  }

  /* ��─ Column color accents ��─ */
  .column[data-col="backlog"] .column-dot { background: var(--col-backlog); box-shadow: 0 0 8px rgba(108,114,255,0.4); }
  .column[data-col="progress"] .column-dot { background: var(--col-progress); box-shadow: 0 0 8px rgba(245,158,11,0.4); }
  .column[data-col="review"] .column-dot { background: var(--col-review); box-shadow: 0 0 8px rgba(59,130,246,0.4); }
  .column[data-col="done"] .column-dot { background: var(--col-done); box-shadow: 0 0 8px rgba(16,185,129,0.4); }

  /* ��─ Responsive ��─ */
  @media (max-width: 1200px) {
    .column { flex: 0 0 270px; min-width: 260px; }
  }

  /* ��─ Entry animation ��─ */
  .card {
    animation: cardIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .column:nth-child(1) .card { animation-delay: 0.05s; }
  .column:nth-child(2) .card { animation-delay: 0.1s; }
  .column:nth-child(3) .card { animation-delay: 0.15s; }
  .column:nth-child(4) .card { animation-delay: 0.2s; }

  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(16px) rotate(1deg);
    }
    to {
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }
  }

  /* ��─ Subtle tilt on hover ��─ */
  .card:hover {
    transform: rotate(-0.5deg) translateY(-4px);
  }

  /* ��─ Selection glow ��─ */
  .column-body {
    position: relative;
  }

  /* ��─ Tooltip on add card ��─ */
  .add-card-btn::after {
    content: 'Add task';
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--surface);
    color: var(--text);
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all var(--transition);
    border: 1px
