<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Koi Pond</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a2f4d;
        }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="pond"></canvas>
<script>
(() => {
    const canvas = document.getElementById('pond');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Constants
    const NUM_KOI = 7;
    const NUM_LILIES = 12;
    const NUM_RIPPLES = 0;
    const DRAGONFLY_COUNT = 3;
    const GRAVITY = 0.1;

    // Color palette
    const COLORS = {
        water: '#0a2f4d',
        waterHighlight: '#1e5a7d',
        waterShadow: '#051a2a',
        lilyPad: '#2a6e3f',
        lilyPadShadow: '#1a4e24',
        lilyWhite: '#f0f8ff',
        koiOrange: '#ff6b35',
        koiRed: '#c0392b',
        koiWhite: '#fdf6e3',
        koiYellow: '#f1c40f',
        koiBlack: '#2c3e50',
        koiBlue: '#3498db',
        koiGreen: '#2ecc71',
        koiGold: '#f39c12',
        koiSilver: '#95a5a6',
        koiPurple: '#9b59b6',
        lilyPink: '#e91e63',
        lilyYellow: '#ffeb3b',
        lilyOrange: '#ff9800',
        dragonflyBlue: '#3498db',
        dragonflyGreen: '#2ecc71',
        dragonflyRed: '#e74c3c',
        ripple: '#ffffff'
    };

    // Utility functions
    function rand(min, max) {
        return Math.random() * (max - min) + min;
    }

    function randInt(min, max) {
        return Math.floor(rand(min, max + 1));
    }

    function angleToVector(angle) {
        return { x: Math.cos(angle), y: Math.sin(angle) };
    }

    function distance(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    function mod(n, m) {
        return ((n % m) + m) % m;
    }

    // Spline interpolation
    function cubicSpline(p0, p1, p2, p3, t) {
        const tt = t * t;
        const ttt = tt * t;
        const q0 = 2 * ttt - 3 * tt + 1;
        const q1 = -2 * ttt + 3 * tt;
        const q2 = ttt - 2 * tt + t;
        const q3 = ttt - tt;
        return {
            x: q0 * p0.x + q1 * p1.x + q2 * p2.x + q3 * p3.x,
            y: q0 * p0.y + q1 * p1.y + q2 * p2.y + q3 * p3.y
        };
    }

    // Koi fish class
    class Koi {
        constructor() {
            this.reset();
            this.colorPattern = this.generateColorPattern();
            this.bodyLength = rand(20, 35);
            this.tailAmplitude = rand(0.5, 1.5);
            this.tailFrequency = rand(2, 5);
            this.bodyFlex = rand(0.3, 0.8);
            this.bodySegments = 8;
            this.age = rand(0, Math.PI * 2);
            this.ageSpeed = rand(0.5, 1.5);
            this.pathIndex = 0;
            this.pathProgress = 0;
            this.pathPoints = [];
            this.generatePath();
        }

        reset() {
            this.x = rand(100, canvas.width - 100);
            this.y = rand(100, canvas.height - 100);
            this.angle = rand(0, Math.PI * 2);
            this.speed = rand(0.5, 1.8);
            this.turnDirection = rand(-1, 1);
        }

        generateColorPattern() {
            const patterns = [
                { base: COLORS.koiOrange, blotches: [COLORS.koiWhite, COLORS.koiBlack] },
                { base: COLORS.koiRed, blotches: [COLORS.koiWhite, COLORS.koiBlack] },
                { base: COLORS.koiWhite, blotches: [COLORS.koiOrange, COLORS.koiBlack] },
                { base: COLORS.koiYellow, blotches: [COLORS.koiBlack, COLORS.koiRed] },
                { base: COLORS.koiBlue, blotches: [COLORS.koiWhite, COLORS.koiOrange] },
                { base: COLORS.koiGreen, blotches: [COLORS.koiBlack, COLORS.koiYellow] },
                { base: COLORS.koiGold, blotches: [COLORS.koiBlack, COLORS.koiWhite] },
                { base: COLORS.koiSilver, blotches: [COLORS.koiBlue, COLORS.koiWhite] },
                { base: COLORS.koiPurple, blotches: [COLORS.koiWhite, COLORS.koiBlack] }
            ];
            return patterns[randInt(0, patterns.length - 1)];
        }

        generatePath() {
            this.pathPoints = [];
            const segments = 20;
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const targetAngle = t * Math.PI * 2 + rand(-0.5, 0.5);
                const radius = rand(canvas.width * 0.2, canvas.width * 0.4);
                const cx = rand(canvas.width * 0.2, canvas.width * 0.8);
                const cy = rand(canvas.height * 0.2, canvas.height * 0.8);
                this.pathPoints.push({
                    x: cx + Math.cos(targetAngle) * radius,
                    y: cy + Math.sin(targetAngle) * radius,
                    angle: targetAngle + Math.PI
                });
            }
        }

        update(deltaTime, lilies) {
            // Follow path
            if (this.pathPoints.length > 0) {
                const pathPoint = this.pathPoints[this.pathIndex];
                const dx = pathPoint.x - this.x;
                const dy = pathPoint.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 5) {
                    this.pathIndex = (this.pathIndex + 1) % this.pathPoints.length;
                } else {
                    this.angle = Math.atan2(dy, dx);
                    this.x += dx * 0.01 * deltaTime;
                    this.y += dy * 0.01 * deltaTime;
                }
            }
            
            // Avoid other koi
            for (const other of koiGroup) {
                if (other !== this) {
                    const d = distance(this, other);
                    if (d < this.bodyLength * 2) {
                        const avoidance = {
                            x: (this.x - other.x) / d,
                            y: (this.y - other.y) / d
                        };
                        this.angle += avoidance.x * 0.1;
                    }
                }
            }
            
            // Avoid lily pads
            for (const lily of lilies) {
                const d = distance(this, lily);
                if (d < lily.radius + this.bodyLength) {
                    const avoidance = {
                        x: (this.x - lily.x) / d,
                        y: (this.y - lily.y) / d
                    };
                    this.angle += avoidance.x * 0.05;
                }
            }
            
            // Keep in bounds
            const margin = 50;
            if (this.x < margin) { this.x = margin; this.angle = 0; }
            if (this.x > canvas.width - margin) { this.x = canvas.width - margin; this.angle = Math.PI; }
            if (this.y < margin) { this.y = margin; this.angle = Math.PI / 2; }
            if (this.y > canvas.height - margin) { this.y = canvas.height - margin; this.angle = -Math.PI / 2; }
            
            this.age += this.ageSpeed * deltaTime * 0.001;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            
            // Body shape using cubic curves
            const len = this.bodyLength;
            const segments = this.bodySegments;
            
            // Generate body points
            const bodyPoints = [];
            const tailPoints = [];
            
            // Head point
            bodyPoints.push({ x: 0, y: 0 });
            
            // Body curve points
            for (let i = 1; i < segments; i++) {
                const t = i / (segments - 1);
                const curveOffset = Math.sin(t * Math.PI) * this.bodyFlex;
                bodyPoints.push({
                    x: -t * len,
                    y: curveOffset * 3
                });
            }
            
            // Tail
            const tailFlap = Math.sin(this.age * this.tailFrequency) * this.tailAmplitude;
            tailPoints.push({ x: -len - 5, y: tailFlap * 2 });
            tailPoints.push({ x: -len - 15, y: tailFlap * 8 });
            tailPoints.push({ x: -len - 5, y: tailFlap * 2 + 5 });
            
            // Draw shadow
            ctx.save();
            ctx.translate(3, 3);
            ctx.globalAlpha = 0.3;
            this.drawBody(bodyPoints, tailPoints, '#000000');
            ctx.restore();
            
            // Draw body
            this.drawBody(bodyPoints, tailPoints, this.colorPattern.base);
            
            // Draw blotches
            ctx.globalAlpha = 0.8;
            for (let i = 0; i < 3; i++) {
                const t = i / 3;
                const blotchX = -t * len;
                const blotchY = Math.sin(t * Math.PI) * this.bodyFlex * 3 + rand(-3, 3);
                const blotchColor = this.colorPattern.blotches[i % this.colorPattern.blotches.length];
                
                ctx.fillStyle = blotchColor;
                ctx.beginPath();
                ctx.ellipse(blotchX, blotchY, 4 + Math.sin(this.age + i) * 1, 3 + Math.cos(this.age + i) * 1, 
                           this.angle + this.age * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            
            // Draw eye
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(2, -2, 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        drawBody(bodyPoints, tailPoints, color) {
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            // Left side of body
            ctx.moveTo(bodyPoints[0].x, bodyPoints[0].y - 4);
            for (let i = 0; i < bodyPoints.length - 1; i++) {
                const xc = (bodyPoints[i].x + bodyPoints[i + 1].x) / 2;
                const yc = (bodyPoints[i].y + bodyPoints[i + 1].y) / 2;
                ctx.quadraticCurveTo(bodyPoints[i].x, bodyPoints[i].y - 4, xc, yc - 4);
            }
            
            // Tail
            if (tailPoints.length >= 2) {
                ctx.lineTo(tailPoints[0].x, tailPoints[0].y - 3);
                ctx.bezierCurveTo(
                    tailPoints[1].x, tailPoints[1].y - 3,
                    tailPoints[2].x, tailPoints[2].y - 3,
                    tailPoints[0].x, tailPoints[0].y - 3
                );
            }
            
            // Right side of body
            for (let i = bodyPoints.length - 1; i > 0; i--) {
                const xc = (bodyPoints[i].x + bodyPoints[i - 1].x) / 2;
                const yc = (bodyPoints[i].y + bodyPoints[i - 1].y) / 2;
                ctx.quadraticCurveTo(bodyPoints[i].x, bodyPoints[i].y + 4, xc, yc + 4);
            }
            
            // Close tail
            if (tailPoints.length >= 2) {
                ctx.lineTo(tailPoints[0].x, tailPoints[0].y + 3);
                ctx.bezierCurveTo(
                    tailPoints[1].x, tailPoints[1].y + 3,
                    tailPoints[2].x, tailPoints[2].y + 3,
                    tailPoints[0].x, tailPoints[0].y + 3
                );
            }
            
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }

    // Lily pad class
    class LilyPad {
        constructor() {
            this.x = rand(50, canvas.width - 50);
            this.y = rand(50, canvas.height - 50);
            this.radius = rand(15, 30);
            this.rotation = rand(0, Math.PI * 2);
            this.rotationSpeed = rand(-0.02, 0.02);
            this.swayAmount = rand(0.5, 1.5);
            this.sway = 0;
        }

        update(deltaTime) {
            this.rotation += this.rotationSpeed * deltaTime * 0.001;
            this.sway += 0.01 * deltaTime * 0.001;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation + Math.sin(this.sway) * this.swayAmount * 0.1);
            
            // Shadow
            ctx.save();
            ctx.translate(0, 5);
            ctx.globalAlpha = 0.3;
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(0, 0, this.radius * 0.8, this.radius * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // Lily pad
            ctx.fillStyle = COLORS.lilyPad;
            ctx.strokeStyle = COLORS.lilyPadShadow;
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const segments = 12;
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const r = this.radius * (0.8 + Math.sin(angle * 3 + this.sway) * 0.2);
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r * 0.5;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Highlight
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(-this.radius * 0.3, -this.radius * 0.2, this.radius * 0.2, this.radius * 0.1, 
                       this.rotation, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
            
            // Flower
            const flowers = [
                { color: COLORS.lilyWhite, petals: 6 },
                { color: COLORS.lilyPink, petals: 5 },
                { color: COLORS.lilyYellow, petals: 8 },
                { color: COLORS.lilyOrange, petals: 7 }
            ];
            
            if (Math.random() < 0.7) {
                const flower = flowers[randInt(0, flowers.length - 1)];
                ctx.fillStyle = flower.color;
                ctx.strokeStyle = COLORS.lilyPadShadow;
                
                ctx.save();
                ctx.translate(0, -this.radius * 0.6);
                
                for (let i = 0; i < flower.petals; i++) {
                    ctx.rotate((Math.PI * 2) / flower.petals);
                    ctx.beginPath();
                    ctx.ellipse(0, -this.radius * 0.2, this.radius * 0.15, this.radius * 0.3, 
                               0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                
                // Center
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            ctx.restore();
        }
    }

    // Ripple class
    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.maxRadius = rand(20, 80);
            this.speed = rand(0.3, 1.0);
            this.alpha = 0.8;
        }

        update(deltaTime) {
            this.radius += this.speed * deltaTime * 0.01;
            this.alpha -= this.speed * deltaTime * 0.001;
        }

        draw() {
            if (this.alpha <= 0) return;
            
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.globalAlpha = this.alpha;
            ctx.strokeStyle = COLORS.ripple;
            ctx.lineWidth = 1 + (this.radius / this.maxRadius);
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        get alive() {
            return this.alpha > 0 && this.radius < this.maxRadius;
        }
    }

    // Dragonfly class
    class Dragonfly {
        constructor() {
            this.reset();
            this.color = [COLORS.dragonflyBlue, COLORS.dragonflyGreen, COLORS.dragonflyRed][randInt(0, 2)];
            this.wingFlap = 0;
        }

        reset() {
            this.x = rand(canvas.width * 0.2, canvas.width * 0.8);
            this.y = -50;
            this.speed = rand(2, 5);
            this.angle = rand(-0.5, 0.5);
            this.targetX = rand(canvas.width * 0.2, canvas.width * 0.8);
            this.targetY = rand(canvas.height * 0.2, canvas.height * 0.8);
            this.landingTime = 0;
            this.isLanding = false;
            this.landingDuration = rand(2000, 4000);
        }

        update(deltaTime) {
            if (!this.isLanding) {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 5) {
                    this.isLanding = true;
                    this.landingTime = 0;
                } else {
                    this.angle = Math.atan2(dy, dx);
                    this.x += dx * 0.02 * deltaTime;
                    this.y += dy * 0.02 * deltaTime;
                }
            } else {
                this.landingTime += deltaTime;
                if (this.landingTime > this.landingDuration) {
                    this.reset();
                }
            }
            
            this.wingFlap += deltaTime * 0.01;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            
            if (this.isLanding) {
                // Grounded dragonfly
                ctx.scale(0.7, 0.7);
            }
            
            // Body
            ctx.fillStyle = this.color;
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 1;
            
            // Abdomen
            ctx.beginPath();
            ctx.ellipse(0, 0, 8, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Thorax
            ctx.beginPath();
            ctx.ellipse(-6, 0, 5, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Head
            ctx.beginPath();
            ctx.arc(-12, 0, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-11, -1, 1.5, 0, Math.PI * 2);
            ctx.arc(-11, 1, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Wings
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 0.5;
            
            ctx.save();
            ctx.translate(-6, 0);
            const flap = Math.sin(this.wingFlap * 2) * 0.2;
            
            // Right wing
            ctx.save();
            ctx.rotate(flap);
            ctx.beginPath();
            ctx.ellipse(0, -5, 8, 15, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
            
            // Left wing
            ctx.save();
            ctx.rotate(-flap);
            ctx.beginPath();
            ctx.ellipse(0, 5, 8, 15, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
            
            ctx.restore();
            ctx.globalAlpha = 1.0;
            
            ctx.restore();
        }
    }

    // Caustics effect
    class Caustics {
        constructor() {
            this.time = 0;
            this.frequency = 0.02;
            this.amplitude = 0.5;
        }

        update(deltaTime) {
            this.time += deltaTime * 0.001;
        }

        draw() {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = 0.15;
            
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(0.5, 'rgba(173, 216, 230, 0.4)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.8)');
            
            const waveCount = 5;
            for (let i = 0; i < waveCount; i++) {
                const phase = this.time * (0.5 + i * 0.3);
                const amplitude = 20 + i * 15;
                
                ctx.beginPath();
                for (let x = 0; x <= canvas.width; x += 20) {
                    const y = Math.sin((x * 0.01) + phase) * amplitude + 
                             Math.cos((x * 0.005) + phase * 0.7) * amplitude * 0.5;
                    if (x === 0) {
                        ctx.moveTo(x, canvas.height * 0.3 + y);
                    } else {
                        ctx.lineTo(x, canvas.height * 0.3 + y);
                    }
                }
                
                for (let x = canvas.width; x >= 0; x -= 20) {
                    const y = Math.sin((x * 0.01) + phase + Math.PI) * amplitude + 
                             Math.cos((x * 0.005) + phase * 0.7 + Math.PI) * amplitude * 0.5;
                    ctx.lineTo(x, canvas.height * 0.7 + y);
                }
                ctx.closePath();
                ctx.fillStyle = grad;
                ctx.fill();
            }
            
            ctx.restore();
        }
    }

    // Initialize objects
    const koiGroup = [];
    const lilies = [];
    const ripples = [];
    const dragonflies = [];
    const caustics = new Caustics();

    for (let i = 0; i < NUM_KOI; i++) {
        koiGroup.push(new Koi());
    }

    for (let i = 0; i < NUM_LILIES; i++) {
        lilies.push(new LilyPad());
    }

    for (let i = 0; i < DRAGONFLY_COUNT; i++) {
        dragonflies.push(new Dragonfly());
    }

    // Animation loop
    let lastTime = 0;
    
    function animate(timestamp) {
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;
        
        // Clear with water color
        ctx.fillStyle = COLORS.water;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Draw water shadows/highlights
        ctx.fillStyle = COLORS.waterHighlight;
        ctx.fillRect(0, 0, canvas.width, canvas.height * 0.3);
        ctx.fillStyle = COLORS.waterShadow;
        ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
        
        // Update and draw caustics
        caustics.update(deltaTime);
        caustics.draw();
        
        // Update and draw lilies
        for (const lily of lilies) {
            lily.update(deltaTime);
            lily.draw();
        }
        
        // Update and draw ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
            ripples[i].update(deltaTime);
            ripples[i].draw();
            if (!ripples[i].alive) {
                ripples.splice(i, 1);
            }
        }
        
        // Update and draw dragonflies
        for (const df of dragonflies) {
            df.update(deltaTime);
            df.draw();
        }
        
        // Update and draw koi
        for (const koi of koiGroup) {
            koi.update(deltaTime, lilies);
            koi.draw();
        }
        
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
