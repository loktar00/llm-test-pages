<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Typewriter Poet</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a0f0a;
            height: 100%;
            width: 100%;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="typewriter"></canvas>
<script>
(() => {
    const canvas = document.getElementById('typewriter');
    const ctx = canvas.getContext('2d');
    
    // Full-screen canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Word lists for generating haiku-like lines
    const nouns = ["whisper", "shadow", "moonlight", "river", "willow", "ember", "thorn", "dewdrop", "echo", "petal"];
    const verbs = ["dances", "lingers", "wanders", "sleeps", "dreams", "flows", "shivers", "glows", "rests", "falls"];
    const adjectives = ["silent", "golden", "lonely", "tender", "fading", "crimson", "silver", "soft", "ancient", "pale"];
    const particles = ["beyond", "through", "above", "within", "against", "beneath", "amidst", "between", "under", "over"];

    function randomWord(list) {
        return list[Math.floor(Math.random() * list.length)];
    }

    function generateLine() {
        const patterns = [
            () => `${randomWord(adjectives)} ${randomWord(nouns)} ${randomWord(verbs)} ${randomWord(particles)} the ${randomWord(nouns)}`,
            () => `a ${randomWord(adjectives)} ${randomWord(nouns)} ${randomWord(verbs)} ${randomWord(particles)} night`,
            () => `the ${randomWord(nouns)} ${randomWord(verbs)} in ${randomWord(adjectives)} light`,
            () => `${randomWord(verbs)} the ${randomWord(nouns)} ${randomWord(verbs)} in ${randomWord(particles)}`,
            () => `in ${randomWord(adjectives)} ${randomWord(nouns)} the ${randomWord(nouns)} ${randomWord(verbs)}`
        ];
        return patterns[Math.floor(Math.random() * patterns.length)]();
    }

    // Typewriter state
    let lines = [];
    let currentLineIndex = 0;
    let currentCharIndex = 0;
    let currentLine = generateLine();
    let paperOffset = 0;
    let animationId;
    let lastBellTime = 0;
    let showBellFlash = false;
    const lineHeight = 28;
    const paperStartY = 80;
    const maxPaperY = canvas.height - 80;
    const charsPerLine = Math.floor((canvas.width - 200) / 18);

    // Type bar animation
    let typeBarAngle = 0;
    let typeBarActive = false;
    let lastStrikeTime = 0;

    // Carriage return sled animation
    let carriageReturnProgress = 0;
    let carriageReturning = false;

    // Cross-out state
    let crossingOut = false;
    let crossOutCharIndex = 0;
    let retyping = false;
    let retypingIndex = 0;

    // Bell ring state
    let ringing = false;
    let ringStartTime = 0;

    function drawPaper() {
        const paperWidth = canvas.width - 100;
        const paperX = 50;
        const paperY = paperStartY;
        const paperHeight = maxPaperY - paperStartY;

        // Paper
        ctx.fillStyle = '#fef9f0';
        ctx.fillRect(paperX, paperY, paperWidth, paperHeight);
        
        // Paper texture
        ctx.fillStyle = 'rgba(0,0,0,0.03)';
        for (let i = 0; i < 40; i++) {
            ctx.fillRect(paperX + 10 + (i * 20) % paperWidth, paperY + 10 + (i * 15) % paperHeight, 1, 2);
        }

        // Paper edges
        ctx.strokeStyle = '#e8e0d0';
        ctx.lineWidth = 2;
        ctx.strokeRect(paperX, paperY, paperWidth, paperHeight);

        // Paper top edge shadow
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(paperX, paperY - 2, paperWidth, 4);
    }

    function drawText() {
        const paperX = 60;
        ctx.fillStyle = '#333';
        ctx.font = '20px "Courier New", monospace';
        ctx.textBaseline = 'top';
        ctx.textAlign = 'left';

        lines.forEach((line, i) => {
            const y = paperStartY + 20 + i * lineHeight - paperOffset;
            if (y > paperStartY && y < maxPaperY) {
                ctx.fillText(line, paperX, y);
            }
        });

        // Current line being typed
        const currentY = paperStartY + 20 + currentLineIndex * lineHeight - paperOffset;
        if (currentY > paperStartY && currentY < maxPaperY) {
            const visibleChars = currentCharIndex;
            ctx.fillText(currentLine.substring(0, visibleChars), paperX, currentY);
            
            // Caret
            ctx.fillStyle = '#000';
            const caretX = paperX + ctx.measureText(currentLine.substring(0, visibleChars)).width;
            ctx.fillRect(caretX, currentY, 2, 22);
        }
    }

    function drawInkBlot(x, y) {
        const blotX = 60 + ctx.measureText(currentLine.substring(0, currentCharIndex - 1)).width;
        const size = 2 + Math.random() * 2;
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(blotX + 9, y + 11, size, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawTypeBar() {
        if (!typeBarActive) return;
        
        const char = currentLine[currentCharIndex];
        if (!char || char === ' ') return;
        
        const caretX = 60 + ctx.measureText(currentLine.substring(0, currentCharIndex)).width;
        const y = paperStartY + 20 + currentLineIndex * lineHeight - paperOffset;
        
        // Type bar arm
        ctx.save();
        ctx.translate(caretX + 10, y + 11);
        ctx.rotate(typeBarAngle);
        ctx.strokeStyle = '#654321';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-25, -15);
        ctx.stroke();
        
        // Type bar head
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(-25, -20, 8, 6);
        ctx.restore();
    }

    function drawCarriageReturn() {
        if (!carriageReturning) return;
        
        const paperWidth = canvas.width - 100;
        const sledY = paperStartY + 10;
        const sledWidth = paperWidth * carriageReturnProgress;
        
        // Carriage sled
        ctx.fillStyle = '#555';
        ctx.fillRect(50, sledY, sledWidth, 8);
        
        // Sled highlight
        ctx.fillStyle = '#777';
        ctx.fillRect(50, sledY, sledWidth, 3);
        
        // Sled end cap
        if (carriageReturnProgress > 0.1) {
            ctx.fillStyle = '#444';
            ctx.fillRect(50 + sledWidth - 3, sledY - 2, 6, 12);
        }
    }

    function drawBell() {
        const bellX = canvas.width - 100;
        const bellY = 60;
        
        // Bell housing
        ctx.fillStyle = '#444';
        ctx.beginPath();
        ctx.arc(bellX, bellY, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // Bell clapper
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bellX - 5, bellY + 8);
        ctx.lineTo(bellX - 2, bellY + 12);
        ctx.stroke();
        
        // Bell flash
        if (showBellFlash) {
            ctx.fillStyle = '#ffdd00';
            ctx.beginPath();
            ctx.arc(bellX, bellY, 18, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawDesk() {
        // Desk surface
        const deskY = canvas.height - 100;
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(0, deskY, canvas.width, canvas.height - deskY);
        
        // Lamp base
        const lampX = 200;
        const lampY = canvas.height - 120;
        ctx.fillStyle = '#333';
        ctx.fillRect(lampX - 20, lampY, 40, 20);
        ctx.fillRect(lampX - 5, lampY - 60, 10, 60);
        
        // Lamp shade
        ctx.fillStyle = '#e8d4a3';
        ctx.beginPath();
        ctx.ellipse(lampX, lampY - 65, 40, 20, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Lamp light (warm glow)
        const gradient = ctx.createRadialGradient(lampX, lampY - 65, 5, lampX, lampY - 65, 250);
        gradient.addColorStop(0, 'rgba(232, 212, 163, 0.15)');
        gradient.addColorStop(1, 'rgba(232, 212, 163, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Paper holder
        ctx.fillStyle = '#333';
        ctx.fillRect(50, 40, canvas.width - 100, 10);
    }

    function ringBell() {
        ringing = true;
        ringStartTime = performance.now();
        showBellFlash = true;
        setTimeout(() => {
            showBellFlash = false;
        }, 100);
    }

    function checkCarriageReturn() {
        if (carriageReturning) return;
        
        // If line is too long, trigger carriage return
        if (currentCharIndex >= charsPerLine - 5 || (currentLineIndex % 5 === 0 && currentCharIndex === 0)) {
            // Ring bell occasionally
            if (Math.random() < 0.3) {
                ringBell();
            }
        }
        
        // End of line
        if (currentCharIndex >= currentLine.length) {
            // Line complete - check for cross-out
            if (Math.random() < 0.15 && lines.length < 5) {
                startCrossOut();
            } else {
                lines.push(currentLine);
                currentLineIndex++;
                currentCharIndex = 0;
                currentLine = generateLine();
                carriageReturning = true;
                carriageReturnProgress = 0;
                setTimeout(() => {
                    carriageReturnProgress = 1;
                    setTimeout(() => {
                        carriageReturning = false;
                    }, 300);
                }, 50);
            }
        }
    }

    function startCrossOut() {
        crossingOut = true;
        crossOutCharIndex = 0;
        setTimeout(() => {
            retyping = true;
            retypingIndex = 0;
            setTimeout(() => {
                lines.push(currentLine);
                currentLineIndex++;
                currentCharIndex = 0;
                currentLine = generateLine();
                crossingOut = false;
                retyping = false;
            }, 200);
        }, 300);
    }

    function drawCrossOut() {
        if (!crossingOut) return;
        
        const lineText = lines[lines.length - 1] || "";
        const y = paperStartY + 20 + (currentLineIndex - 1) * lineHeight - paperOffset;
        const x = 60;
        
        ctx.strokeStyle = '#c00';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, y + 11);
        ctx.lineTo(x + ctx.measureText(lineText).width, y + 11);
        ctx.stroke();
    }

    function drawRetype() {
        if (!retyping) return;
        
        const y = paperStartY + 20 + currentLineIndex * lineHeight - paperOffset;
        const x = 60;
        
        // Show original text fading
        ctx.fillStyle = 'rgba(51, 51, 51, 0.3)';
        ctx.font = '20px "Courier New", monospace';
        ctx.fillText(lines[lines.length - 1], x, y);
    }

    function checkPageTear() {
        const lineHeight = 28;
        const maxLines = Math.ceil((maxPaperY - paperStartY - 40) / lineHeight);
        if (currentLineIndex >= maxLines - 2) {
            tearPage();
        }
    }

    function tearPage() {
        lines = [];
        currentLineIndex = 0;
        currentCharIndex = 0;
        currentLine = generateLine();
        paperOffset = 0;
    }

    function typeCharacter() {
        if (crossingOut || retyping) return;
        if (currentCharIndex >= currentLine.length) {
            checkCarriageReturn();
            checkPageTear();
            return;
        }
        
        const now = performance.now();
        if (now - lastStrikeTime < 250) return;
        lastStrikeTime = now;
        
        if (Math.random() < 0.05) {
            // Occasional pause
            return;
        }
        
        const char = currentLine[currentCharIndex];
        currentCharIndex++;
        
        // Animate type bar
        typeBarActive = true;
        typeBarAngle = -Math.PI / 4;
        setTimeout(() => {
            typeBarAngle = -Math.PI / 6;
        }, 50);
        setTimeout(() => {
            typeBarAngle = 0;
            typeBarActive = false;
        }, 120);
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawDesk();
        drawPaper();
        drawText();
        drawCrossOut();
        drawRetype();
        drawCarriageReturn();
        drawTypeBar();
        drawBell();
        
        // Scroll paper if needed
        const maxLines = Math.ceil((maxPaperY - paperStartY - 40) / lineHeight);
        if (currentLineIndex > Math.floor(maxLines / 2)) {
            const targetOffset = (currentLineIndex - Math.floor(maxLines / 2)) * lineHeight;
            if (paperOffset < targetOffset) {
                paperOffset += 0.5;
            }
        }
        
        typeCharacter();
        
        animationId = requestAnimationFrame(animate);
    }

    animate();
})();
</script>
</body>
</html>
