<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width=device-width, initial-scale=1.0">
    <title>Social Profile</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #161920;
            --text-primary: #ffffff;
            --text-secondary: #8b9bb4;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --radius: 16px;
            --font-stack: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-stack);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
        }

        /* Main Card Container */
        .profile-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Banner with Layered CSS Gradients */
        .banner {
            height: 140px;
            width: 100%;
            position: relative;
            z-index: 1;
            /* Layered Gradients */
            background: 
                radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
                linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
        }

        /* Avatar Ring & Status */
        .avatar-container {
            position: relative;
            z-index: 10;
            width: 100px;
            height: 100px;
            margin: -50px auto 0; /* Pulls up into banner */
            border-radius: 50%;
            background: var(--card-bg);
            padding: 4px; /* Creates the ring gap */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            background: #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: rgba(255,255,255,0.2);
        }

        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background-color: var(--success);
            border: 3px solid var(--card-bg);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        /* Content Area */
        .content {
            padding: 24px 32px 32px;
            text-align: center;
        }

        .user-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .user-handle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* Stat Counters */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 32px;
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Follow Button Morph */
        .btn-container {
            height: 48px;
            position: relative;
            margin-bottom: 32px;
        }

        .btn {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.36, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Initial State: Outline */
        .btn-follow {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            z-index: 2;
        }

        /* Morphed State: Solid */
        .btn-follow.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px var(--accent-glow);
            transform: scale(0.98);
        }

        .btn-text {
            position: absolute;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .btn-follow:not(.active) .btn-text {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-follow:not(.active) .check-icon {
            opacity: 0;
            transform: translateY(10px) scale(0.8);
        }

        .btn-follow.active .btn-text {
            opacity: 0;
            transform: translateY(-10px) scale(0.8);
        }

        .btn-follow.active .check-icon {
            opacity: 1;
            transform: translateY(0) scale(1);
            position: absolute;
        }

        /* Tab Row */
        .tabs {
            display: flex;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: color 0.3s ease;
            user-select: none;
        }

        .tab.active {
            color: var(--text-primary);
        }

        /* Animated Underline */
        .tab-indicator {
            position: absolute;
            height: 2px;
            background: var(--accent);
            bottom: 0;
            left: 0;
            border-radius: 2px;
            transition: left 0.4s cubic-bezier(0.65, 0, 0.35, 1), width 0.4s cubic-bezier(0.65, 0, 0.35, 1);
            box-shadow: 0 0 8px var(--accent-glow);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Banner -->
        <div class="banner"></div>

        <!-- Avatar -->
        <div class="avatar-container">
            <div class="avatar-img">
                <!-- Simple SVG Avatar Placeholder -->
                <svg viewBox="0 0 24 24" fill="currentColor" style="width:60%; height:60%; opacity:0.5">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="status-dot"></div>
        </div>

        <div class="content">
            <h1 class="user-name">Alexandra</h1>
            <p class="user-handle">@designer · @creative</p>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-value" data-target="142">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" data-target="856">0</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" data-target="12">0</span>
                    <span class="stat-label">Following</span>
                </div>
            </div>

            <!-- Follow Button -->
            <div class="btn-container">
                <button class="btn btn-follow" id="followBtn">
                    <span class="btn-text">Follow User</span>
                    <span class="check-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Following
                    </span>
                </button>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-index="0">Posts</div>
                <div class="tab" data-index="1">Media</div>
                <div class="tab" data-index="2">Likes</div>
                <div class="tab-indicator" id="tabIndicator"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. Counter Animation Logic ---
            const counters = document.querySelectorAll('.stat-value');
            const duration = 2000; // 2 seconds
            const easeOut = (time) => 1 - Math.pow(1 - time, 3); // Cubic ease out

            const animateCounter = (counter) => {
                const target = +counter.getAttribute('data-target');
                const startTime = performance.now();

                const updateCount = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeVal = easeOut(progress);
                    
                    const currentVal = Math.floor(easeVal * target);
                    counter.innerText = currentVal;

                    if (progress < 1) {
                        requestAnimationFrame(updateCount);
                    } else {
                        counter.innerText = target;
                    }
                };

                requestAnimationFrame(updateCount);
            };

            // Start counters
            counters.forEach(animateCounter);


            // --- 2. Tab Underline Logic ---
            const tabs = document.querySelectorAll('.tab');
            const indicator = document.getElementById('tabIndicator');

            const moveIndicator = (tab) => {
                const left = tab.offsetLeft;
                const width = tab.offsetWidth;
                indicator.style.width = `${width}px`;
                indicator.style.left = `${left}px`;
            };

            // Initialize indicator
            const activeTab = document.querySelector('.tab.active');
            if(activeTab) moveIndicator(activeTab);

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove active class from all
                    tabs.forEach(t => t.classList.remove('active'));
                    // Add to clicked
                    tab.classList.add('active');
                    // Move indicator
                    moveIndicator(tab);
                });
            });


            // --- 3. Follow Button Morph Logic ---
            const btn = document.getElementById('followBtn');
            
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
