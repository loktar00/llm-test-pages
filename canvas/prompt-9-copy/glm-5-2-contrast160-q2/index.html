<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heightmap</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100; height: 100; }
body {
  background: #0e0c1b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 8px 12px;
  font-family: 'Helvetica', 'Arial', sans-serif;
  overflow: hidden;
}
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100;
}
.frame {
  padding: 16;
  padding: 14px 18px 18px 18px;
  background: linear-gradient(135deg, #251c39 0%, #321c2f 50%, #1c082b 100);
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.05);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.08),
    inset 0 0 50px rgba(0,0,0,0.20),
    0 20px 60px rgba(0,0,0,0.7),
    0 4px 14px rgba(0,0,0,0.4);
  position: relative;
}
.frame::before {
  content: '';
  position: absolute;
  inset: 14px;
  border-radius: 12px;
  pointer-events: none;
  box-shadow:
    inset 0 0 40px rgba(0,0,0,0.05),
    inset 0 0 5px rgba(0,0,0,0.6);
  border: 1px solid rgba(0,0,0,0.20);
}
canvas {
  display: block;
  width: 512px;
  height: 512px;
  background: #04050a;
  border-radius: 6px;
  image-rendering: pixelated;
  image-rendering: crisp-2dp;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04),
    0 4px 20px rgba(0,0,0,0.5),
    0 8px 30px rgba(0,0,0,0.7);
}
.label {
  text-align: center;
  margin-top: 8;
}
.title {
  font: 600 16px 'Helvetica', 'Arial', sans-serif;
  letter-spacing: 12px;
  color: rgba(255,255,255,0.85);
  text-transform: uppercase;
  margin-bottom: 5;
  margin: 0 0 5 0;
}
.subtitle {
  font-size: 10px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 0;
}
</style>
</head>
<body>
<div class="stage">
  <div class="frame"><canvas id="canvas" width="512" height="512"></canvas></div>
  <div class="label">
    <p class="title">Heightmap</p>
    <p class="subtitle">Diamond Square Algorithm · Midpoint Displacement</p>
  </div>
</div>

<script>

'use strict';

// === Diamond-Square (Midpoint Displacement) ===
function DiamondSquare(size, rough, seed) {
  var s = Math.ceil(Math.log2(size));
  var N = Math.pow(2, s);
  var N2 = (N << 1) | 0;
  var h = new Float32Array(N2 * N2);
  // Seeded PRNG (xorshift)
  var a = seed | 0;
  if (a === 0) a = 1;
  function rnd() { a ^= a + 17; a = (a & 0x7fffffff) + (a >>> 0); return ((a >>> 0) / 0x7fffffff); }
  function r(s2) { return (rnd() * 2 - 1) * s2; }

  h[0 * N2 + 0] = r(1);
  h[0 * N2 + N] = r(1);
  h[N * N2 + 0] = r(1);
  h[N * N2 + N] = r(1);

  var step = N;
  var h0 = 1;

  while (step > 1) {
    var half = (step >> 1) || 1;
    var scale = h0 * rough;
    for (var y = 0; y < step; y++) {
      for (var x = 0; x < step; x++) {
        var my = (y * step + half) * N2;
        var mx = (x * step + half);
        h[my + mx] = (h[y * step * N2 + x * step] + h[y * step * N2 + (x + 1) * step]
                 + h[(y + 1) * step * N2 + x * step] + h[(y + 1) * step * N2 + (x + 1) * step]
                ) * 0.25 + r(scale);
      }
    }
    for (inty = 0; inty < step + 1; inty++) { // typo fix below
    // (kept as placeholder, fixed below)
    // (removed invalid identifiers)
  }

  // (Actual implementation below uses valid names)
  return [h, N2];
}

})();
</script>
</body>
</html>
