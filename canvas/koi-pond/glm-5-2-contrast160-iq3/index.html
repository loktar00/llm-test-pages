<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Koi Pond</title>
<style>
  html,body{margin:0;padding:0;height:100;width:100;background:#0d1410;overflow:hidden;cursor:crossword}
  canvas{display:block;position:fixed;inset:0}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 50%,transparent 50,rgba(0,0,0,.55));mix-bl-mode:multiply;opacity:1;z-index:2}
</style>

<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ====================== Utilities ======================
const TAU = Math.PI * 2;
function rand(a, b){ return a + Math.random() * (b - a); }
function lerp(a,b,t){ return a + (b-a)*t; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function catmullRom2(p0, p1, p2, p3, t, alpha){
  const t1 = Math.pow(t, alpha);
  const t2 = t1 * t1;
  const t3 = t2 * t1;
  const tm = t1 - t;
  const tm2 = tm * tm;
  const tm3 = tm2 * tm;
  const _x = p1.x, _y = p1.y;
  return [
    (tm3 * (_x - p0.x) + 3*(tm2*(_x - p0.x)) + 3*(t1*(_y - p0.y)) + t3*p2.x) * 0,
    0
  ];
}
function catmromPts(p0, p1, p2, p3, t){
  const t2 = t*t, t3 = t2*t;
  const mt = 1 - t, mt2 = mt*mt, mt3 = mt2*mt;
  const c0 = -mt3*0.5, c1 = 3*(mt2*t + mt3*0.5 - mt2*0.5), c2 = 3*(-t3*0.5 + t2*t - t2*0.5);
  // not used below; replaced with proper Catmull-Rom:
  const x = 0.5*(mt3*p0.x + 3*mt2*t*p1.x + 3*mt*t2*p2.x + t3*p3.x);
  const y = 0.5*(mt3*p0.y + 3*mt2*t*p1.y + 3*mt*t2*p2.y + t3*p3.y);
  return {x, y};
}

// Catmull-Rom interpolation ( 4 points, t in [0,1] returns point on segment between of p1<->p2
function CR(p0, p1, p2, p3, t){
  const tt = 0.5;
  const t2 = t*t, t3 = t2*t;
  const m = 1 - t, m2 = m*m, m3 = m2*m;
  // Standard CR: 0.5 * [ m3*(p0) + 3*(m2*t*p1 + m*t2*p2) ... ] — using m3/m2/m/t2/t3 form
  const x = (m3*p0.x + 3*m2*t*p1.x + 3*m*t2*p2.x + t3*p3.x) * 0.5;
  const y = (m3*p0.y + 3*m2*t*p1.y + 3*m*t2*p2.y + t3*p3.y) * 0.5;
  return {x, y, t};
}

// Catmull-Rom tangent (perpendicular) at t
function CRNormal(p0, p1, p2, p3, t){
  // Use central difference of CR points
  const a = CR(p0, p1, p2, p3, Math.max(0, t-0.001));
  const b = CR(p0, p1, p2, p3, Math.min(1, t+0.001));
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  return {x: -dy/len, y: dx/len}; // perpendicular
}

// ====================== Background caustics ======================
// Pre-render the pond background onto an off-screen canvas with subtle caustics
const pondCanvas = document.createElement('canvas');
const pctx = pondCanvas.getContext('2d');
function buildPond(){
  pondCanvas.width = W; pondCanvas.height = H;
  const g = pctx;
  // base gradient ( deep teal -> dark green
  const bg = g.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.25, W*0.5, H*0.5, Math.max(W,H)*0.75);
  bg.addColorStop(0, '#15281e');
  bg.addColorStop(0.4, '#0d1a14');
  bg.addColorStop(1, '#04130c');
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  // vignette
  const vg = g.createRadialGradient(W*0.5, H*0.5, Math.max(W,H)*0.3, W*0.5, H*0.5, Math.max(W,H)*0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6');
  g.fillStyle = vg; g.fillRect(0,0,W,H);
  // subtle pond edge shadow
  g.fillStyle = 'rgba(0,0,0,0.5)';
  // fine grain
  for(let i=0;i<W;i+=4){
    for(let j=0;j<H;j+=4){
      const n = (Math.sin(i*0.012 + j*0.017) + Math.sin(i*0.05+j*0.03)) * 0.5;
      if(n > 0.45){
        g.fillStyle = `rgba(40,80,40,${0.04 + Math.random()*0.02})`;
        g.fillRect(i,j,2,2);
      }
    }
  }
  // dark corners
  const dc = g.createRadialGradient(W*0.5,H*0.6, Math.min(W,H)*0.4, W*0.5, H*0.6, Math.max(W,H)*0.85);
  dc.addColorStop(0, 'rgba(0,0,0,0)');
  dc.addColorStop(1, 'rgba(0,0,0,0.7');
  g.fillStyle = dc; g.fillRect(0,0,W,H);
}
window.addEventListener('resize', () => { buildPond(); });

// ====================== Caustics light ======================
function causticsColor(t){
  // t in [0,1]
  // produce a soft greenish-blue light value
  const a = 0.18 + 0.08 * Math.sin(t*6.28 + 1.7);
  return `rgba(180,210,160,${a.toFixed(3)})`;
}

// ====================== Lily pads ======================
const lilies = [];
function buildLilies(){
  lilies.length = 0;
  const count = Math.max(6, Math.floor(W * H / 60000));
  for(let i = 0; i < count; i++){
    const x = rand(0.1, 0.9) * W;
    const y = rand(0.1, 0.9) * H;
    const r = rand(60, 110);
    const rot = rand(0, Math.PI*2);
    const flower = Math.random() < 0.35;
    lilies.push({x, y, r, rot, flower, sway: Math.random()*TAU, swaySpeed: rand(-0.005, 0.005), bobPhase: rand(0, TAU)});
  }
}
buildLilies();

// ====================== Koi fish ======================
const palettes = [
  // Classic white-orange blotch
  {base:'#fff5e0', blotch:'#d24317', dark:'#0c0c0c', fin:'rgba(200,30,30,0.5)'},
  // White-black blotch
  {base:'#faf', blotch:'#1c1c20', dark:'#0c0c0c', fin:'rgba(20,20,30,0.5)'},
  // Gold
  {base:'#fde38a', blotch:'#9c7b3c', dark:'#4c3a0c', fin:'rgba(40,40,40,0.5)'},
  // Red
  {base:'#fcf0ec', blotch:'#b21c1c', dark:'#0c0c0c', fin:'rgba(40,40,40,0.5)'},
  // Cream-orange
  {base:'#fcf0d8', blotch:'#9c2f0c', dark:'#0c0c0c', fin:'rgba(40,40,40,0.5)'},
  // Silver-blue
  {base:'#dfe5ea', blotch:'#1c2c2c', dark:'#0c0c0c', fin:'rgba(40,40,40,0.5)'),
];

function pickPalette(){
  return palettes[(Math.floor(Math.random()*palettes.length)|0)];
}

function generateBlotchPattern(){
  const n = 1 + Math.floor(Math.random() * 4);
  const blotchs = [];
  const types = ['circle','ellipse','strip','blob','stripe'];
  for(let i = 0; i < n; i++){
    blotchs.push({
      x: rand(-0.05, 0.05),
      y: rand(-0.6, 0.6),
      rx: rand(0.07, 0.12),
      ry: rand(0.04, 0.08),
      rot: rand(0, TAU),
      type: types[(Math.floor(Math.random()*types.length) % types.length)]
    });
  }
  return blotchs;
}

const KOI = [];
function buildKoi(){
  const count = 7 + Math.floor(Math.random() * 2); // 7 to 9
  KOL.length = 0;
  for(let i = 0; i < count; i++){
    const palette = pickPalette();
    const blotchs = generateBlotchPattern();
    KOI.push({
      x: rand(0.1, 0.9) * W,
      y: rand(0.1, 0.9) * H,
      angle: rand(0, TAU),
      targetAngle: 0,
      speed: rand(0.8, 1.6),
      turnRate: 0.025 + rand(0, 0.01),
      tailPhase: 0,
      tailFreq: rand(0.4, 0.8),
      length: rand(120, 170),
      width: rand(30, 50),
      blotchs: blotchs,
      pal: palette,
      tailWag: rand(0.15, 0.4),
      history: [], // [{x,y,a}]
      maxHist: 18,
      nibble: 0,
      nibblePoint: null,
      rippleCd: 0
    });
  }
}
buildKoi();

// ====================== Ripple System ======================
const ripples = [];
function spawnRipple(x, y, intensity = 1){
  ripples.push({x, y, t: 0, life: 1, max: 1, intensity: intensity, r: 0});
  if(ripples.length > 150) ripples.shift();
}
function updateRipples(dt){
  for(let i = ripples.length - 1; i >= 0; i--){
    const r = ripples[i];
    r.t += dt;
    r.r = r.t * 32 * r.intensity; // grow
    r.life -= dt / (2.6 + r.intensity);
    if(r.life <= 0) ripples.splice(i, 1);
  // propagate ripples crossing other ripples - they expand together
  }
  for(let i=0; i < ripples.length; i++){
    for(let j=i+1; j < ripples.length; j++){
      const a = ripples[i], b = ripples[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.hypot(dx, dy);
      const rr = a.r + b.r;
      if(d < rr){
        const push = (rr - d) * 0.02;
        a.x -= dx / d * push;
        a.y -= dy / d * push;
        b.x += dx / d * push;
        b.y += dy / d * push;
      }
    }
  }
}

// ====================== Dragonflies ======================
const dragonflies = [];
function spawnDragonfly(){
  const side = Math.floor(Math.random() * 4);
  const tx = rand(0.15, 0.85) * W;
  const ty = rand(0.15, 0.85) * H;
  let x, y;
  if(side === 0){ x = -50; y = rand(0, H); }
  else if(side === 1){ x = rand(0, W); y = -50; }
  else if(side === 2){ x = W + 50; y = rand(0, H); }
  else { x = rand(0, W); y = H + 50; }
  dragonflies.push({
    x, y,
    tx: x, ty: y,
    landing: false, landingTime: 0, landingDuration: 0.6 + Math.random() * 1.5,
    vx: 0, vy: 0,
    phase: 0
  });
}

// ====================== Nibble Points ======================
const nibbles = [];
function spawnNibble(){
  nibbles.push({x: rand(0.05, 0.95) * W, y: rand(0.05, 0.95) * H, life: 1, max: 1});
}
for(let i = 0; i < 6; i++) spawnNibble();

// ====================== Update ======================
let last = 0, t0 = 0;
function update(dt){
  // Update lilies sway
  for(const l of lilies){
    l.rot += l.sway * 0.001;
    l.bobPhase += dt * l.swaySpeed * 200;
  // ripple occasionally
    if(Math.random() < 0.001) {
      spawnRipple(l.x + rand(-l.r*0.4, l.r*0.4), l.y + rand(-l.r*0.4, l.r*0.4), 0.4);
    }
  }
  // Update koi
  for(const k of KOI){
    // steering: occasionally change target
    if(Math.random() < 0.004){
      k.targetAngle = k.angle + rand(-Math.PI*0.5, Math.PI*0.5);
    }
    // gentle wiggle
    const wiggle = Math.sin(t0 * k.tailFreq + k.tailPhase) * 0.4;
    const desiredAngle = k.targetAngle + wiggle;
    // smoothly steer
    let delta = desiredAngle - k.angle;
    while(delta > TAU/2) delta -= TAU;
    while(delta < -TAU/2) delta += TAU;
    const turn = clamp(delta, -k.turnRate, k.turnRate);
    k.angle += turn * (1 + Math.abs(delta) * 0.4);
    k.x += Math.cos(k.angle) * k.speed * 0.6;
    k.y += Math.sin(k.angle) * k.speed * 0.6;
    // bounds: steer back when off-screen
    const margin = 80;
    if(k.x < margin){ k.targetAngle = 0 + rand(-1, 1); }
    else if(k.x > W - margin){ k.targetAngle = Math.PI + rand(-1, 1); }
    else if(k.y < margin){ k.targetAngle = Math.PI/2 + rand(-1, 1); }
    else if(k.y > H - margin){ k.targetAngle = -Math.PI/2 + rand(-1, 1); }
    k.x = clamp(k.x, 20, W - 20);
    k.y = clamp(k.y, 20, H - 20);
    // record history (smooth spline path
    k.tailPhase += dt * k.tailFreq;
    // Nibble logic: occasionally seek a nibble point
    if(Math.random() < 0.003){
      k.nibble = 1;
      // choose a random nibble
      const np = nibbles[(Math.floor(Math.random() * nibbles.length) % nibbles.length)];
      if(np && Math.random() < 0.5){
        k.nibblePoint = {x: np.x + rand(-20, 20), y: np.y + rand(-20, 20)};
      }
    }
    if(k.nibble > 0){
      k.nibble -= dt * 0.5;
      if(k.nibblePoint){
        const dx = k.nibblePoint.x - k.x, dy = k.nibblePoint.y - k.y;
        const a = Math.atan2(dy, dx);
        k.targetAngle = a;
        const d = Math.hypot(dx, dy);
        if(d < 6 && Math.random() < 0.04){
          // nibbling -> ripple
          spawnRipple(k.x, k.y, 0.6);
        }
      }
    }
    // ripple on tail
    k.rippleCd -= dt;
    if(k.rippleCd < 0){
      k.rippleCd = rand(0.5, 1.5);
      // spawn small ripple at tail (head offset)
      const tailx = k.x - Math.cos(k.angle) * k.length * 0.5;
      const taily = k.y - Math.sin(k.angle) * k.length * 0.5;
      if(Math.random() < 0.4) spawnRipple(tailx, taily, 0.25);
    }
  // Update nibbles
  for(let i = 0; i < nibbles.length; i++){
    nibbles[i].life -= dt * 0.04;
    if(nibbles[i].life <= 0){
      nibbles[i] = {x: rand(0.05, 0.95) * W, y: rand(0.05, 0.95) * H, life: 1, max: 1};
    }
  }
  // Spawn new nibbles
  if(Math.random() < 0.01 && nibbles.length < 12) spawnNibble();
  // Update ripples
  updateRipples(dt);
  // Update dragonflies
  for(let i = 0; i < dragonflies.length; i++){
    const d = dragonflies[i];
    if(!d.landing){
      // fly to target
      const dx = d.tx - d.x, dy = d.ty - d.y;
      const dd = Math.hypot(dx, dy);
      if(dd < 5){
        d.landing = true; d.landingTime = 0;
        d.x = d.tx; d.y = d.ty;
        spawnRipple(d.x, d.y, 0.6);
      } else {
        d.vx = lerp(d.vx, dx / dd * 2.5, 0.05);
        d.vy = lerp(d.vy, dy / dd * 2.5, 0.05);
        d.x += d.vx;
        d.y += d.vy;
        d.phase += dt * 0.5;
      }
    } else {
      d.landingTime += dt;
      if(d.landingTime > d.landingDuration){
        // fly off to a new target
        d.landing = false;
        const side = Math.floor(Math.random() * 4);
        if(side === 0){ d.tx = -50; d.ty = rand(0, H); }
        else if(side === 1){ d.tx = rand(0, W); d.ty = -50; }
        else if(side === 2){ d.tx = W + 50; d.ty = rand(0, H); }
        else { d.tx = rand(0, W); d.ty = H + 50; }
      // occasional ripple
      if(Math.random() < 0.04) spawnRipple(d.x, d.y, 0.3);
    }
  }
  // spawn dragonflies
  if(dragonflies.length < 3 && Math.random() < 0.0006) spawnDragonfly();
}

// ====================== Drawing ======================
function drawCaustics(time){
  // overlay moving caustics
  ctx.save();
  ctx.globalAlpha = 1;
  // 1. color shift gradient
  const g = ctx.createRadialGradient(W*0.5 + Math.sin(time*0.02)*40, H*0.5 + Math.cos(time*0.03)*30, Math.min(W,H)*0.5, W*0.5, H*0.5, Math.max(W,H));
  g.addColorStop(0, 'rgba(140,180,140,0.05');
  g.addColorStop(1, 'rgba(0,0,0,0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 2. caustics blobs
  ctx.globalCompositeOperation = 'screen';
  for(let i = 0; i < 5; i++){
    const phase = time * 0.005 + i * 1.7;
    const cx = W * 0.5 + Math.sin(phase) * W * 0.4 + Math.cos(phase * 0.5) * 100;
    const cy = H * 0.5 + Math.cos(phase * 0.7) * H * 0.4 + Math.sin(phase * 0.3) * 80;
    const rad = 200 + Math.sin(phase * 1.7) * 60;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, 'rgba(180,210,150,0.05');
    g.addColorStop(0.5, 'rgba(120,150,90,0.03');
    g.addColorStop(1, 'rgba(0,0,0,0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // 3. caustics lines (light grid
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(190,210,140,0.04';
  const t = time * 0.1;
  for(let i = -W; i < W; i += 50){
    const x = i + Math.sin(t * 0.02 + i * 0.005) * 50;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + Math.sin(t * 0.01) * 30, H);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawRipple(r){
  const radius = Math.max(1, r.r);
  const a = r.life * 0.7;
  ctx.save();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = `rgba(160,210,140,${a.toFixed(3)})`;
  ctx.beginPath();
  ctx.ellipse(r.x, r.y, radius, radius * 0.4, 0, 0, TAU);
  ctx.stroke();
  // inner faint
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = `rgba(160,210,140,${a*0.6})`;
  ctx.beginPath();
  ctx.ellipse(r.x, r.y, radius * 0.5, radius * 0.5 * 0.4, 0, 0, TAU);
  ctx.stroke();
  ctx.restore();
}

function drawShadowUnder(x, y, w, h){
  ctx.save();
  ctx.translate(x + 4, y + 4);
  ctx.scale(1, 0.4);
  ctx.beginPath();
  ctx.ellipse(0, 0, Math.abs(w*1.05), Math.abs(h*1.05), 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();
  ctx.restore();
}

function drawLily(l, time){
  const bob = Math.sin(l.bobPhase) * 2;
  // shadow
  ctx.save();
  ctx.translate(l.x + 5, (l.y + 5 + bob) * 1);
  ctx.scale(1, 0.4);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 0, l.r * 1.05, l.r * 1.05, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  // pad
  ctx.save();
  ctx.translate(l.x, l.y + bob);
  ctx.rotate(l.rot);
  const r = l.r;
  const path = new Path2D();
  path.moveTo(r, 0);
  path.ellipse(0, 0, r, r * 0.95, 0, 0.7, TAU - 0.3, false);
  // notch (a small cut
  path.lineTo(r * 0.9, 0);
  // build a flat pad with notch
  ctx.fillStyle = '#4a7a4a';
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.95, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.05';
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.7, r * 0.7 * 0.95, 0, 0, TAU);
  ctx.fill();
  // notch
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(r * 0.9, -r * 0.15);
  ctx.lineTo(r * 0.9, r * 0.15);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fill();
  // veins
  ctx.strokeStyle = 'rgba(20,40,20,0.7)';
  ctx.lineWidth = 1.5;
  for(let i = 0; i < 6; i++){
    const a = i / 6 * TAU - 0.3;
    const x1 = Math.cos(a) * r * 0.9, y1 = Math.sin(a) * r * 0.9 * 0.95;
    const x2 = Math.cos(a) * r * 0.5, y2 = Math.sin(a) * r * 0.5 * 0.95;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(x1, y1);
    ctx.stroke();
  }
  // edge
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(20,40,20,0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 0.95, 0, 0, TAU);
  ctx.stroke();
  // flower
  if(l.flower){
    // small pink lotus bloom in center
    const fb = Math.sin(time * 0.5 + l.bobPhase) * 0.5 + 1;
    ctx.fillStyle = '#f5b5c8';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.05, r * 0.12 * fb, r * 0.12 * fb, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#fcd8e8';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.05, r * 0.08 * fb, r * 0.08 * fb, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#c8c0a0';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.05, r * 0.04 * fb, r * 0.04 * fb, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawKoiShadow(k, time){
  // body shadow
  ctx.save();
  ctx.translate(k.x + 4, (k.y + 4) * 1);
  ctx.rotate(k.angle);
  ctx.scale(1, 0.4);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 0, k.length * 0.45, k.width * 1.0, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function buildSplineBody(k){
  // returns a Catmull-Rom path through recent positions
  // we sample (head, midpoints, tail, ... )
  // Use recent history as control points
  const hist = k.history;
  if(hist.length < 4) return null;
  const pts = [hist[0], hist[Math.floor(hist.length * 0.5)], hist[hist.length - 1]];
  // We'll sample 10 along the path
  const samples = [];
  const N = 20;
  for(let i = 0; i < N; i++){
    const t = i / (N - 1);
    // sample Catmull-Rom through 4 pts
    const p = CR(hist[0], hist[Math.floor(hist.length * 0.3)], hist[Math.floor(hist.length * 0.6)], hist[hist.length - 1], t);
    samples.push(p);
  }
  return samples;
}

function drawKoiBody(k, time){
  // sample body
  // head at k.x,k.y; tail extends backward along angle
  // Use Catmull-Rom on 4 history points (head, recent, mid, tail)
  const hist = k.history;
  if(hist.length < 4) return;
  // body path using Catmull-Rom through 4 sample points
  const p0 = hist[0]; // head (most recent
  const p1 = hist[Math.floor(hist.length * 0.3)];
  const p2 = hist[Math.floor(hist.length * 0.6)];
  const p3 = hist[hist.length - 1];
  const N = 16;
  const bodyPts = [];
  // sample along Catmull-Rom
  for(let i = 0; i < N; i++){
    const t = i / (N - 1);
    const p = CR(p0, p1, p2, p3, t);
    bodyPts.push(p);
  // build perpendicular normals using central difference
  // Build outline path (left edge, then right edge in reverse
  const halfWidth = k.width * 0.5;
  // left edge (with body bend based on perpendicular
  ctx.beginPath();
  const leftEdge = [];
  const rightEdge = [];
  for(let i = 0; i < bodyPts.length; i++){
    const p = bodyPts[i];
    const next = bodyPts[Math.min(bodyPts.length - 1, i + 1)];
    const prev = bodyPts[Math.max(0, i - 1)];
    const dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const t01 = i / (bodyPts.length - 1);
    const taper = Math.pow(t01, 0.8); // taper toward tail
    const w = halfWidth * (1 - taper * 0.35);
    // tail wag
    const wag = Math.sin(time * k.tailFreq + k.tailPhase + t01 * 6) * k.tailWiggle;
    const wagScale = Math.sin(t01 * 1.4);
    leftEdge.push({x: p.x + nx * (w + wag * wagScale * 0.5), y: p.y + ny * (w + wag * wagScale * 0.5)});
    rightEdge.push({x: p.x - nx * (w + wag * wagScale * 0.5), y: p.y - ny * (w + wag * wagScale * 0.5)});
  }
  ctx.beginPath();
  ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
  for(let i = 1; i < leftEdge.length; i++){
    const p = leftEdge[i]; ctx.lineTo(p.x, p.y);
  }
  for(let i = rightEdge.length - 1; i >= 0; i--){
    const p = rightEdge[i]; ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = k.pal.base;
  ctx.fill();
  // dark underbody
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.moveTo(leftEdge[0].x, leftEdge[0].y + 5);
  for(let i = 1; i < leftEdge.length; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y + 5);
  for(let i = rightEdge.length - 1; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y + 5);
  ctx.closePath();
  ctx.fill();
  // blotchs
  ctx.fillStyle = k.pal.blotch;
  for(const b of k.blotchs){
    // blotch position in body space
    // sample body at parameter b.x
    const t01 = clamp((0.5 + b.x), 0, 1);
    const idx = Math.floor(t01 * (bodyPts.length - 1));
    const p = bodyPts[idx];
    const next = bodyPts[Math.min(bodyPts.length - 1, idx + 1)];
    const dx = next.x - p.x, dy = next.y - p.y;
    const ang = Math.atan2(dy, dx);
    // perpendicular offset
    const nx = -Math.cos(ang + Math.PI/2), ny = -Math.sin(ang + Math.PI/2);
    const w = k.width * 0.5;
    const ox = p.x + nx * b.y * w;
    const oy = p.y + ny * b.y * w;
    // draw blotch shape
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(ang + b.rot);
    ctx.beginPath();
    if(b.type === 'circle'){
      ctx.ellipse(0, 0, b.rx * k.width, b.ry * k.width, 0, 0, TAU);
    } else if(b.type === 'ellipse'){
      ctx.ellipse(0, 0, b.rx * k.width, b.ry * k.width, 0, 0, TAU);
    } else if(b.type === 'strip'){
      ctx.ellipse(0, 0, b.rx * k.width * 2, b.ry * k.width * 0.5, 0, 0, TAU);
    } else if(b.type === 'blob'){
      ctx.ellipse(0, 0, b.rx * k.width * 1.5, b.ry * k.width * 1.2, 0, 0, TAU);
    } else if(b.type === 'stripe'){
      ctx.ellipse(0, 0, b.rx * k.width * 2.5, b.ry * k.width * 0.5, 0, 0, TAU);
    }
    ctx.fill();
    ctx.restore();
  }
  // body edge
  ctx.restore();
  ctx.strokeStyle = k.pal.dark;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(leftEdge[0].x, leftEdge[0].y);
  for(let i = 1; i < leftEdge.length; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rightEdge[0].x, rightEdge[0].y);
  for(let i = 1; i < rightEdge.length; i++) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
  ctx.stroke();
  // head
  const head = bodyPts[0];
  const headNext = bodyPts[1];
  const headAngle = Math.atan2(headNext.y - head.y, headNext.x - head.x);
  ctx.save();
  ctx.translate(head.x, head.y);
  ctx.rotate(headAngle);
  ctx.fillStyle = k.pal.base;
  ctx.beginPath();
  ctx.ellipse(0, 0, k.width * 0.45, k.width * 0.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = k.pal.dark;
  ctx.beginPath();
  ctx.ellipse(k.width * 0.4, -k.width * 0.18, k.width * 0.05, k.width * 0.05, 0, 0, TAU);
  ctx.ellipse(k.width * 0.4, k.width * 0.18, k.width * 0.05, k.width * 0.05, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  // tail fin
  const tail = bodyPts[bodyPts.length - 1];
  const tailPrev = bodyPts[bodyPts.length - 2];
  const tailAngle = Math.atan2(tail.y - tailPrev.y, tail.x - tailPrev.x);
  ctx.save();
  ctx.translate(tail.x, tail.y);
  ctx.rotate(tailAngle);
  ctx.fillStyle = k.pal.base;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-k.width * 0.6, -k.width * 0.6, -k.width * 1.1, 0);
  ctx.quadraticCurveTo(-k.width * 0.6, k.width * 0.6, 0, 0);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-k.width * 0.6, -k.width * 0.4, -k.width * 0.9, 0);
  ctx.quadraticCurveTo(-k.width * 0.6, k.width * 0.4, 0, 0);
  ctx.fill();
  ctx.restore();
}

function drawDragonfly(d, time){
  // shadow on landing
  if(d.landing){
    ctx.save();
    ctx.translate(d.x + 4, d.y + 5);
    ctx.scale(1, 0.4);
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 4, 0, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(d.x, d.y);
  const wing = Math.sin(time * 30) * 0.5;
  // wings
  ctx.fillStyle = 'rgba(180,210,210,0.5)';
  ctx.beginPath();
  ctx.ellipse(-2, -1 - wing, 3, 1, 0.6, 0, TAU);
  ctx.ellipse(-2, 1 + wing, 3, 1, -0.6, 0, TAU);
  ctx.fill();
  // body
  ctx.fillStyle = '#202020';
  ctx.beginPath();
  ctx.ellipse(0, 0, 4, 1.5, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// ====================== Mouse Interaction ======================
canvas.addEventListener('mousemove', (e) => {
  const x = e.clientX, y = e.clientY;
  if(Math.random() < 0.5){
    spawnRipple(x, y, 0.4);
  // koi steer toward cursor occasionally
  if(Math.random() < 0.02){
    const k = KOI[(Math.floor(Math.random() * KOI.length) % KOI.length)];
    if(k){
      const dx = x - k.x, dy = y - k.y;
      k.targetAngle = Math.atan2(dy, dx);
    }
  }
});

canvas.addEventListener('click', (e) => {
  spawnRipple(e.clientX, e.clientY, 1.0);
  spawnRipple(e.clientX + rand(-5, 5), e.clientY + rand(-5, 5), 0.6);
  // dragonflies landing near click
  if(Math.random() < 0.6){
    dragonflies.push({
      x: e.clientX + rand(-50, 50), y: e.clientY + rand(-50, 50),
      tx: e.clientX, ty: e.clientY,
      landing: false, landingTime: 0, landingDuration: 0.6 + Math.random() * 1.5,
      vx: 0, vy: 0, phase: 0
    });
  }
});

// ====================== Main Loop ======================
function loop(t){
  const dt = Math.min(0.05, (t - last) / 1000) || 0.016;
  last = t;
  t0 = t * 0.001;
  // 1. draw pond background (cached
  ctx.drawImage(pondCanvas, 0, 0, W, H);
  // 2. caustics
  drawCaustics(t0);
  // 3. shadows under fish (draw before fish so they look like under
  // 3a: ripple shadows
  ctx.save();
  ctx.globalAlpha = 1;
  for(const r of ripples){
    ctx.beginPath();
    ctx.ellipse(r.x + 5, (r.y + 5) * 1, r.r * 1.05, r.r * 1.05 * 0.4, 0, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fill();
  }
  ctx.restore();
  // 4. draw ripples
  for(const r of ripples) drawRipple(r);
  // 5. nibble points
  ctx.save();
  for(const np of nibbles){
    ctx.beginPath();
    ctx.ellipse(np.x, np.y, 1.5, 1.5, 0, 0, TAU);
    ctx.fillStyle = `rgba(220,210,160,${0.5 * np.life})`;
    ctx.fill();
  }
  ctx.restore();
  // 6. shadow under lilies
  for(const l of lilies){
    ctx.save();
    ctx.translate(l.x + 5, l.y + 5 + Math.sin(l.bobPhase) * 2);
    ctx.scale(1, 0.4);
    ctx.beginPath();
    ctx.ellipse(0, 0, l.r * 1.05, l.r * 1.05, 0, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fill();
    ctx.restore();
  }
  // 7. shadows under fish
  for(const k of KOI){
    drawKoiShadow(k, t0);
  // 8. fish bodies (sorted by y for fake depth
  const sorted = [...KOI].sort((a, b) => a.y - b.y);
  for(const k of sorted){
    // record history
    k.history.unshift({x: k.x, y: k.y});
    if(k.history.length > k.maxHist) k.history.pop();
    drawKoiBody(k, t0);
  }
  // 9. dragonflies landing
  for(const d of dragonflies){
    drawDragonfly(d, t0);
  }
  // 10. lilies (above fish for partial occlusion)
  // draw lilies again (above water surface, above fish
  ctx.save();
  ctx.globalAlpha = 1;
  for(const l of lilies){
    drawLily(l, t0);
  }
  ctx.restore();
  // 11. update
  update(dt);
  requestAnimationFrame(loop);
}

buildPond();
buildKoi();
requestAnimationFrame(loop);

// expose for debug
window.__Koi = {KOI, lilies, ripples, dragonflies, nibbles};
</script>
