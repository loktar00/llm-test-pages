<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width-width">
<title>Rain on Window</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000;width:100vw;height:100vh}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  generateCity();
}
window.addEventListener('resize', resize);

// --- City Background ---
const cityCanvas = document.createElement('canvas');
const cityCtx = cityCanvas.getContext('2d');
const BOKEH_R = 60;

function generateCity() {
  cityCanvas.width = W;
  cityCanvas.height = H;
  
  // Sky gradient
  const sky = cityCtx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#050510');
  sky.addColorStop(0.4, '#0a0a1a');
  sky.addColorStop(1, '#111122');
  cityCtx.fillStyle = sky;
  cityCtx.fillRect(0, 0, W, H);

  // Distant buildings silhouette
  cityCtx.fillStyle = '#020205';
  let x = 0;
  while (x < W) {
    const w = 30 + Math.random() * 80;
    const h = 50 + Math.random() * 200;
    cityCtx.fillRect(x, H - h, w, h);
    // Windows
    cityCtx.fillStyle = Math.random() > 0.5 ? '#1a1a2a' : '#0a0a15';
    for (let wy = H - h + 10; wy < H - 10; wy += 15) {
      for (let wx = x + 5; wx < x + w - 5; wx += 10) {
        if (Math.random() > 0.7) {
          cityCtx.fillRect(wx, wy, 4, 6);
        }
      }
    }
    cityCtx.fillStyle = '#020205';
    x += w;
  }

  // Bokeh lights
  const colors = [
    [255, 200, 100], // warm yellow
    [255, 120, 50],  // orange
    [100, 150, 255], // blue
    [255, 100, 150], // pink
    [200, 255, 200], // greenish
    [255, 255, 200], // bright yellow
  ];
  
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * W;
    const y = H * 0.3 + Math.random() * H * 0.7;
    const r = 10 + Math.random() * BOKEH_R;
    const c = colors[Math.floor(Math.random() * colors.length)];
    const alpha = 0.1 + Math.random() * 0.3;
    
    const grad = cityCtx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
    grad.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},${alpha * 0.3})`);
    grad.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    
    cityCtx.fillStyle = grad;
    cityCtx.beginPath();
    cityCtx.arc(x, y, r, 0, Math.PI * 2);
    cityCtx.fill();
  }
}

// --- Rain Droplets ---
class Droplet {
  constructor() {
    this.reset();
  }
  
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.r = 1 + Math.random() * 2.5;
    this.targetR = this.r;
    this.speed = 0;
    this.maxSpeed = 0.3 + Math.random() * 0.7;
    this.trail = [];
    this.active = true;
    this.opacity = 0.3 + Math.random() * 0.4;
    this.life = 0;
  }
  
  update(dt) {
    this.life += dt;
    
    // Grow slowly
    if (this.r < this.targetR) {
      this.r += (this.targetR - this.r) * 0.01;
    }
    
    // Randomly choose new target size
    if (Math.random() < 0.002) {
      this.targetR = 1.5 + Math.random() * 4;
    }
    
    // Merge logic handled in main loop
    
    // Movement
    if (this.speed > 0) {
      const prevY = this.y;
      this.y += this.speed * dt * 60;
      
      // Record trail
      if (this.speed > this.maxSpeed * 0.5) {
        this.trail.push({ x: this.x, y: prevY, r: this.r * 0.8 });
        if (this.trail.length > 8) this.trail.shift();
      }
      
      // Remove if off screen
      if (this.y > H + 20) {
        this.reset();
      }
    } else {
      // Small droplets have minimal drift
      this.x += Math.sin(this.life * 0.5) * 0.02;
    }
  }
  
  draw(ctx, bgCanvas) {
    // Draw the refracted background
    const refractR = this.r * 1.8;
    const sx = this.x - refractR;
    const sy = this.y - refractR;
    
    // Draw refracted bokeh (brighter, slightly distorted)
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.clip();
    
    // Slightly offset for refraction illusion
    ctx.drawImage(bgCanvas, sx - 2, sy - 2, refractR * 2, refractR * 2);
    ctx.restore();
    
    // Draw droplet highlight (specular)
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    
    // Inner shadow / depth
    const grad = ctx.createRadialGradient(
      this.x - this.r * 0.3, this.y - this.r * 0.3, 0,
      this.x, this.y, this.r
    );
    grad.addColorStop(0, `rgba(255,255,255,${this.opacity * 0.6})`);
    grad.addColorStop(0.4, `rgba(255,255,255,${this.opacity * 0.1})`);
    grad.addColorStop(0.8, `rgba(0,0,20,${this.opacity * 0.3})`);
    grad.addColorStop(1, `rgba(0,0,0,${this.opacity * 0.8})`);
    
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Rim light
    ctx.strokeStyle = `rgba(200,220,255,${this.opacity * 0.4})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();
    
    // Draw trail
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const alpha = (i / this.trail.length) * this.opacity * 0.5;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${alpha})`;
      ctx.fill();
    }
  }
}

// --- Lightning ---
let lightning = {
  intensity: 0,
  timer: 0,
  nextTime: 5000 + Math.random() * 15000,
  flashDuration: 100,
  fading: false
};

function updateLightning(dt) {
  if (!lightning.fading) {
    lightning.timer += dt;
    if (lightning.timer > lightning.flashDuration) {
      lightning.fading = true;
    }
  } else {
    lightning.intensity *= 0.9;
    if (lightning.intensity < 0.01) {
      lightning.intensity = 0;
      lightning.fading = false;
      lightning.timer = 0;
      lightning.nextTime = 5000 + Math.random() * 15000;
    }
  }
  
  if (!lightning.fading) {
    lightning.nextTime -= dt;
    if (lightning.nextTime <= 0) {
      lightning.intensity = 0.6 + Math.random() * 0.4;
      lightning.flashDuration = 80 + Math.random() * 150;
      lightning.timer = 0;
    }
  }
}

// --- Merge Logic ---
function handleMerges(droplets) {
  // Simple spatial grid for performance
  const cellSize = 20;
  const cols = Math.ceil(W / cellSize);
  const grid = new Array(cols);
  
  for (let i = 0; i < cols; i++) {
    grid[i] = [];
  }
  
  for (const d of droplets) {
    const col = Math.floor(d.x / cellSize);
    if (col >= 0 && col < cols) {
      grid[col].push(d);
    }
  }
  
  for (let c = 0; c < cols; c++) {
    const cell = grid[c];
    for (let i = 0; i < cell.length; i++) {
      for (let j = i + 1; j < cell.length; j++) {
        const a = cell[i];
        const b = cell[j];
        
        // Only only only merge if one is moving fast and one is slow/stationary
        if ((a.speed > 0.5 && b.speed < 0.1) || (b.speed > 0.5 && a.speed < 0.1)) {
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = a.r + b.r;
          
          if (dist < minDist * 1.5) {
            // The fast one absorbs the slow one
            if (a.speed > b.speed) {
              a.targetR = Math.sqrt(a.targetR * a.targetR + b.targetR * b.targetR);
              b.reset();
            } else {
              b.targetR = Math.sqrt(a.targetR * a.targetR + b.targetR * b.targetR);
              a.reset();
            }
          }
        }
      }
    }
  }
}

// --- Main Loop ---
let droplets = [];
let lastTime = 0;

function init() {
  resize();
  droplets = [];
  const count = Math.floor((W * H) / 3000);
  for (let i = 0; i < count; i++) {
    droplets.push(new Droplet());
  }
  requestAnimationFrame(loop);
}

function loop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  
  // Update
  updateLightning(dt);
  
  // Assign speeds: some drops start moving, others stay
  for (const d of droplets) {
    if (d.speed === 0 && Math.random() < 0.001) {
      d.speed = d.maxSpeed * (0.5 + Math.random() * 0.5);
    }
    if (d.speed > 0) {
      d.update(dt);
    }
  }
  
  handleMerges(droplets);
  
  // Render
  ctx.clearRect(0, 0, W, H);
  
  // Draw city background
  ctx.drawImage(cityCanvas, 0, 0);
  
  // Apply lightning
  if (lightning.intensity > 0) {
    ctx.fillStyle = `rgba(200,210,255,${lightning.intensity})`;
    ctx.fillRect(0, 0, W, H);
  }
  
  // Draw droplets
  for (const d of droplets) {
    d.draw(ctx, cityCanvas);
  }
  
  // Subtle glass reflection overlay
  const glassGrad = ctx.createLinearGradient(0, 0, W, H);
  glassGrad.addColorStop(0, 'rgba(255,255,255,0.02)');
  glassGrad.addColorStop(0.5, 'rgba(255,255,255,0)');
  glassGrad.addColorStop(1, 'rgba(0,0,0,0.05)');
  ctx.fillStyle = glassGrad;
  ctx.fillRect(0, 0, W, H);
  
  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
